td>machaira</td><td>G3162</td><td>—</td><td><b>a short sword</b> (see below)</td><td>—</td></tr><tr><td>avenger</td><td>ἔκδικος</td><td>ekdikos</td><td>G1558</td><td>ἐκ + δίκη</td><td><b>one who executes justice</b></td><td>same root as 12:19</td></tr></table>","gram":"<p><b>★★ First light: 13:3–4 gives a functional definition</b></p><p>This is the single most important thing to see in the whole passage.</p><p>When Paul describes government in 13:3–4, his language is <b>functional</b>:</p><table><tr><th>Reference</th><th>The function of government</th></tr><tr><td>13:3</td><td>not a terror to good conduct, but to evil</td></tr><tr><td>13:4</td><td>God’s servant, <b>for your good</b></td></tr><tr><td>13:4</td><td>an avenger, to bring wrath <b>on the one who does evil</b></td></tr></table><p>What Paul defines here is the <b>office entrusted</b> to government: <b>reward good, punish evil</b>.</p><p>And this matters enormously in the discussion of the disputed material:</p><p><b>When a regime inverts that function — rewarding evil and punishing good — it is at that moment betraying the entrusted office described in 13:3–4.</b><br>(That is precisely the situation of Revelation 13.)</p><p><b>★ Second light: diakonos — government as God’s “deacon”</b></p><p>Paul uses διάκονος twice in 13:4, and λειτουργός in 13:6. <b>Both are church words:</b></p><table><tr><th>Word</th><th>Ordinary use</th></tr><tr><td><b>διάκονος</b></td><td><b>deacon</b> (1 Timothy 3:8; Philippians 1:1)</td></tr><tr><td><b>λειτουργός</b></td><td><b>minister</b> (Hebrews 8:2, of Christ; Romans 15:16, of Paul himself)</td></tr></table><p>Paul has deliberately used two words for <b>sacred service</b> to describe Roman officials.</p><p>That is an extraordinarily high estimate — <b>and an extraordinarily heavy responsibility: they are doing God’s business.</b></p><p><b>★ Third light: machaira — that sword</b></p><p>μάχαιρα is <b>a short sword</b>, not the great sword of the battlefield (ῥομφαία). In the first century it was chiefly used of:<br>· <b>the sidearm carried by a soldier</b><br>· <b>the symbol of judicial power</b> (a Roman governor held the <i>ius gladii</i>, the right of the sword)</p><p>“He does not bear the sword in vain” means: <b>the coercive power in a government’s hand is not an ornament.</b></p><p>(On whether this verse supports capital punishment, see the disputed material — this edition does not settle it.)</p><p><b>★ Fourth light: ekdikos — the word of 12:19 returns</b></p><pre>12:19  “VENGEANCE (ἐκδίκησις) is mine; I will repay”  —  the individual must not take revenge\n  ↓\n13:4   “he is God’s servant, AN AVENGER (ἔκδικος)”     —  God has appointed a mechanism</pre><p>This echo of one root is the most important bridge between chapters 12 and 13:</p><p><b>12:19 does not say “nobody will deal with this.”<br>12:19 says “it is not for you to deal with it.”</b><br>And 13:4 says: <b>God has already appointed someone.</b></p>","exp":"<p>Verses 3–4 are not describing “all governments are good.” They are describing <b>the office with which government is entrusted</b>.</p><p><b>What the text plainly says:</b> rulers are ordained by God; their office is to reward good and punish evil; those who resist that order bring judgement on themselves.</p><p><b>What may fairly be drawn from it:</b> what Paul gives here is a <b>functional definition</b> — <b>it is both the charge given to government and the standard by which it is measured.</b></p><p><b>When a regime inverts that function — rewarding evil, punishing good, treating well-doing as a crime — it is betraying the very office described in 13:3–4.</b></p><p><b>⚠⚠ Pulpit note (the most important in this chapter):</b></p><p>Historically this passage has been used to justify slavery, racial segregation and totalitarian regimes. Four things must be said alongside it:</p><p><b>1.</b> Paul’s word is <b>ὑποτάσσω</b> (take your place under the order), <b>not ὑπακούω</b> (do whatever you are told).<br><b>2.</b> The same Bible says, <b>“We must obey God rather than men” (Acts 5:29)</b>; Daniel 3:18, “even if he does not, we will not serve your gods”; Exodus 1:17, the midwives “did not do as the king of Egypt commanded them” — <b>and God dealt well with them</b>.<br><b>3.</b> The Paul who wrote 13:1 himself demanded that the magistrates come and release him in person (Acts 16:37), asserted his Roman citizenship (Acts 22:25), and appealed to Caesar (Acts 25:11).<br><b>4. ❌❌ Never use this passage to endorse or attack any particular contemporary regime.</b></p>"},{"a":5,"z":5,"star":false,"grk":"<p>διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν.</p>","lit":"<p>“Therefore <b>it is necessary</b> to be subject — <b>not only because of the wrath</b>, <b>but also because of conscience</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>necessity</td><td>ἀνάγκη</td><td>anankē</td><td>G318</td><td><b>necessity, one must</b></td></tr><tr><td>conscience</td><td>συνείδησις</td><td>syneidēsis</td><td>G4893</td><td><b>knowing together with oneself</b> (the word of 2:15)</td></tr></table>","gram":"<p><b>★ two levels of motive</b></p><pre>διὰ τὴν ὀργήν       —  because of [PUNISHMENT] (fear of being caught)\nδιὰ τὴν συνείδησιν  —  because of [CONSCIENCE] (knowing it is right)</pre><p>Paul is saying: <b>a Christian should not keep the law merely because he is afraid of being caught.</b></p><p>He keeps it because he knows: <b>that order was appointed by God.</b></p><p>And συνείδησις is the word of 2:15: “their conscience also bearing witness.”</p>","exp":"<p>13:5 gives <b>two levels of motive</b> for obeying the law, and the order matters.</p><p><b>What the text plainly says:</b> submission is not only to avoid punishment, but for conscience’ sake.</p><p><b>What may fairly be drawn from it:</b> a Christian keeps the law not merely for fear of being caught, but because <b>he knows that order was arranged by God.</b></p><p><b>⚠ Note:</b> συνείδησις is the word of 2:15 — in chapter 2 Paul says the Gentiles’ conscience “bears witness”; in chapter 13, that conscience becomes the inward ground for keeping the law.</p>"},{"a":6,"z":7,"star":false,"grk":"<p>6 …λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες. 7 ἀπόδοτε πᾶσιν τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.</p>","lit":"<p>6 “For this reason you also <b>pay taxes</b>; for they are <b>God’s ministers</b>, <b>giving themselves continually</b> to this very thing.”</p><p>7 “<b>Render to all what is owed them</b>: <b>tribute</b> to whom tribute is due; <b>customs</b> to whom customs; <b>fear</b> to whom fear; <b>honour</b> to whom honour.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>minister</td><td>λειτουργός</td><td>leitourgos</td><td>G3011</td><td><b>a public servant / a priestly minister</b> (see below)</td></tr><tr><td>attending continually</td><td>προσκαρτεροῦντες</td><td>proskarterountes</td><td>G4342</td><td><b>to give oneself continually to</b> (the word of 12:12)</td></tr><tr><td>debts</td><td>ὀφειλάς</td><td>opheilas</td><td>G3782</td><td><b>what is owed</b></td></tr><tr><td>tribute</td><td>φόρος</td><td>phoros</td><td>G5411</td><td><b>direct tax</b> (poll tax, land tax)</td></tr><tr><td>custom</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>indirect tax</b> (customs, tolls)</td></tr></table>","gram":"<p><b>★ First light: the religious colour of leitourgos</b></p><p>In the Septuagint the root λειτουργία denotes specifically <b>the priestly service in the temple</b> (Exodus 28:35; Numbers 8:22). And in the New Testament:<br>· Hebrews 8:2, Christ is “a <b>minister</b> (λειτουργός) of the sanctuary”<br>· Romans 15:16, Paul calls himself “a <b>minister</b> (λειτουργός) to the Gentiles”</p><p><b>Paul uses a priestly word for the men who collect the taxes.</b> That is an astonishing estimate.</p><p><b>★ Second light: proskartereō — the word of 12:12</b></p><pre>12:12  “CONTINUING STEADFASTLY (προσκαρτεροῦντες) in prayer”\n13:6   “ATTENDING CONTINUALLY (προσκαρτεροῦντες) to this very thing”</pre><p>The same word. <b>Paul uses the word for persistence in prayer to describe an official giving himself faithfully to his duty.</b></p><p><b>★ Third light: the fourfold symmetry of 13:7</b></p><p>The Greek structure is beautifully regular:</p><pre>τῷ τὸν φόρον τὸν φόρον —  tribute to whom tribute\nτῷ τὸ τέλος  τὸ τέλος  —  custom to whom custom\nτῷ τὸν φόβον τὸν φόβον —  fear to whom fear\nτῷ τὴν τιμὴν τὴν τιμήν —  honour to whom honour</pre><p>Four pairs, each repeating the same word.<br>Paul’s point is simple: <b>whatever is owed to whomever — give it.</b></p><p><b>★ Fourth light: an echo of the Lord’s own words</b></p><p>Mark 12:17, “Render to Caesar the things that are Caesar’s, and to God the things that are God’s.”</p><p><b>The Lord’s sentence has two halves.</b> 13:7 handles only the first — because 13:8–10, and indeed the whole letter, handles the second.</p>","exp":"<p><b>What the text plainly says:</b> there is good reason to pay tax — they are God’s ministers, devoted to this very work; and whatever is owed to anyone must be given.</p><p><b>What may fairly be drawn from it:</b> Paul has deliberately used two words of sacred service (13:4 διάκονος, 13:6 λειτουργός) for Roman officials. That is a very high estimate, and a very heavy responsibility: <b>they are doing God’s business.</b></p><p><b>⚠ Pastoral note:</b> a Christian’s witness is usually not destroyed by great failures. It is destroyed by <b>things owed and not given</b> — money that should have been repaid, an apology that should have been made, a promise that should have been kept.</p>"},{"a":8,"z":8,"star":true,"grk":"<p>Μηδενὶ μηδὲν ὀφείλετε εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.</p>","lit":"<p>“<b>Owe no one anything</b>, except <b>to love one another</b>; for the one who loves the other <b>has fulfilled</b> the law.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>owe</td><td>ὀφείλετε</td><td>opheilete</td><td>G3784</td><td><b>to be in debt</b> (the root of ὀφειλάς in 13:7)</td></tr><tr><td>has fulfilled</td><td>πεπλήρωκεν</td><td>peplērōken</td><td>G4137</td><td><b>perfect: has already fulfilled it</b></td></tr></table>","gram":"<p><b>★ First light: the root that links 13:7 and 13:8</b></p><pre>13:7  ἀπόδοτε πᾶσιν τὰς ὀφειλάς —  render to all what is [OWED]\n13:8  Μηδενὶ μηδὲν ὀφείλετε     —  [OWE] no one anything\n      εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν —  except to love one another</pre><p>Paul’s logic is lovely:<br><b>Settle every debt. Keep only one — and that one you will never finish paying.</b></p><p><b>★ Second light: why can the debt of love never be paid off?</b></p><p>Because love is not a single payment. It is <b>a continuing relationship</b>.</p><p>That you loved today does not mean tomorrow is exempt. <b>This account is opened afresh every day.</b></p><p><b>★ Third light: peplērōken is perfect</b></p><p>“The one who loves has <b>fulfilled</b> the law” — perfect tense: <b>has fulfilled it, and the effect stands</b>.</p><p>Not “loving people will help you keep the law,” but <b>“the one who loves has already fulfilled the law.”</b></p>","exp":"<p>There is a turn of one word between 13:7 and 13:8 that English does not quite show.</p><p><b>What the text plainly says:</b> owe no one anything, except the debt of loving one another; for the one who loves has fulfilled the law.</p><p><b>What may fairly be drawn from it:</b> Paul’s picture is — <b>pay every debt in full; keep one; and that one you will never finish paying.</b></p><p>Why never? <b>Because love is not a single payment but a continuing relationship. This account is opened afresh every day.</b></p><p><b>⚠ A common misreading:</b> 13:8 is <b>not</b> saying “a Christian may never take out a mortgage.” The force of ὀφείλω is <b>“what is due and not given,”</b> not a prohibition on all credit.<br>(Compare Psalm 37:21, “the wicked borrows and does not repay”; though Proverbs 22:7 also warns of the bondage of debt.)</p>"},{"a":9,"z":10,"star":false,"grk":"<p>9 …ἐν τῷ λόγῳ τούτῳ ἀνακεφαλαιοῦται, ἐν τῷ· ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. 10 ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.</p>","lit":"<p>9 “For this — ‘You shall not commit adultery, you shall not murder, you shall not steal, you shall not covet’ — and any other commandment, <b>is summed up under this one heading</b>: ‘<b>You shall love your neighbour as yourself.</b>’”</p><p>10 “<b>Love does no evil to a neighbour</b>; therefore <b>love is the fullness of the law</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>is summed up</td><td>ἀνακεφαλαιοῦται</td><td>anakephalaioutai</td><td>G346</td><td>ἀνά + κεφάλαιον (<b>a heading / a sum total</b>)</td><td><b>to be gathered under one head</b></td><td>see below</td></tr><tr><td>fullness</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td>πληρόω</td><td><b>fullness, completion</b></td><td>same word as 11:12, 11:25</td></tr></table>","gram":"<p><b>★ First light: anakephalaioō — “to total up”</b></p><p>In commercial use, κεφάλαιον means <b>the sum, the total</b> (as we write “total” at the foot of a column).</p><p>So ἀνακεφαλαιόω means <b>to gather a list of items under one heading</b>.<br>(Ephesians 1:10 uses the same verb: “to <b>gather together in one</b> all things in Christ.”)</p><p>Paul’s picture is this:</p><p>You list the second half of the Ten Commandments — do not commit adultery, do not murder, do not steal, do not covet…<br>and then you draw a line underneath and write <b>the total</b>.</p><p>And the total is: <b>love your neighbour as yourself.</b></p><p><b>★ Second light: the definition in 13:10 is stated negatively</b></p><p>“Love <b>does no evil</b> to a neighbour.”</p><p>Notice that Paul does <b>not</b> give a lyrical definition here. He gives <b>a floor</b>: <b>love, at the very least, does not harm people.</b></p><p>And precisely because it is a floor, it is uncomfortable:<br><b>You say you love him. Then — have you harmed him?</b></p><p><b>★ Third light: quoted from Leviticus 19:18</b></p><p>“Love your neighbour as yourself” comes from <b>Leviticus 19:18</b> — and the Lord Jesus called it <b>the second commandment</b> (Matthew 22:39). <b>Paul stands exactly with him.</b></p>","exp":"<p><b>What the text plainly says:</b> every commandment is summed up in “love your neighbour as yourself”; and since love does no harm, love is the fullness of the law.</p><p><b>What may fairly be drawn from it:</b> verse 10 gives <b>not the highest reach of love but its minimum</b> — “love does no evil to a neighbour.”</p><p>And because it is the minimum, it is especially searching: <b>you say you love him — but have you hurt him?</b> (with one sentence, one look, one silence)</p><p><b>⚠ Note:</b> “Love your neighbour as yourself” is from Leviticus 19:18, the very verse Jesus named as the second commandment (Matthew 22:39). And “neighbour” (πλησίον) means <b>the one near you</b> — not humanity in the abstract, <b>but the person closest at hand</b>.</p>"},{"a":11,"z":12,"star":true,"grk":"<p>11 Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ἤδη ὑμᾶς ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν. 12 ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ἀποθώμεθα οὖν τὰ ἔργα τοῦ σκότους, ἐνδυσώμεθα δὲ τὰ ὅπλα τοῦ φωτός.</p>","lit":"<p>11 “And do this, <b>knowing the time</b>: that the hour has come for you <b>to be roused out of sleep</b>; for now our salvation is <b>nearer</b> than when we first believed.”</p><p>12 “<b>The night is far gone</b>; <b>the day has drawn near</b>. So let us <b>put off</b> the works of darkness, and <b>put on</b> the <b>weapons</b> of light.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>the time</td><td>καιρός</td><td>kairos</td><td>G2540</td><td>—</td><td><b>the decisive moment</b> (not χρόνος, duration)</td><td>same word as 5:6</td></tr><tr><td>awake out of sleep</td><td>ἐξ ὕπνου ἐγερθῆναι</td><td>—</td><td>G5258 / G1453</td><td>—</td><td><b>to be roused from sleep</b></td><td>—</td></tr><tr><td>far spent</td><td>προέκοψεν</td><td>proekopsen</td><td>G4298</td><td>πρό + κόπτω</td><td><b>has advanced, is well on</b></td><td>—</td></tr><tr><td>at hand</td><td>ἤγγικεν</td><td>ēngiken</td><td>G1448</td><td>ἐγγύς (near)</td><td><b>perfect: has drawn near</b></td><td>—</td></tr><tr><td>put off</td><td>ἀποθώμεθα</td><td>apothōmetha</td><td>G659</td><td>ἀπό + τίθημι</td><td>to take off (clothes), to lay aside</td><td>—</td></tr><tr><td>armour</td><td>ὅπλα</td><td>hopla</td><td>G3696</td><td>—</td><td><b>weapons</b></td><td><b>the word of 6:13!</b></td></tr></table>","gram":"<p><b>★ First light: hopla — the word from chapter 6</b></p><pre>6:13   “present your members to God as INSTRUMENTS (ὅπλα) of righteousness”\n  ↓\n13:12  “put on the ARMOUR (ὅπλα) of light”</pre><p><b>The same word.</b><br>Chapter 6: your body parts are weapons.<br>Chapter 13: <b>those weapons are to be put on.</b></p><p><b>★ Second light: ēngiken is perfect</b></p><p>“The day <b>has drawn near</b>” — perfect tense: <b>it has come near, and it remains near</b>.<br>(This is the very word of Jesus’ first sermon: Mark 1:15, “the kingdom of God <b>is at hand</b>.”)</p><p><b>★ Third light: “our salvation is nearer than when we first believed”</b></p><p>What does “salvation” mean here?</p><p>Not justification — that has already happened (5:1). It means <b>the completion of salvation</b> — the redemption of the body (8:23), the return of the Lord.</p><p>(On how “near” should be understood, see the disputed material.)</p><p><b>★ Fourth light: a very simple and very forceful logic</b></p><p><b>Every day that passes, that day is one day nearer.</b><br>That is not speculation. <b>That is arithmetic.</b></p>","exp":"<p>13:11 changes the angle — Paul begins to speak about <b>time</b>. And his logic is very simple:</p><p><b>“Our salvation is nearer now than when we first believed.”</b></p><p><b>What the text plainly says:</b> now is the hour to wake from sleep; the night is far gone, the day is near; so put off the deeds of darkness and put on the armour of light.</p><p><b>What may fairly be drawn from it:</b> the “salvation” here is not justification (that has happened, 5:1) but <b>the completion of salvation</b> — the redemption of the body (8:23), the coming of the Lord.</p><p>And ἤγγικεν is <b>perfect</b>: it has drawn near, and it remains near (the very word of Mark 1:15, “the kingdom of God is at hand”).</p><p><b>⚠ Pulpit note:</b> do not use 13:11 to construct any timetable. Paul’s point is <b>“it is time to wake up,”</b> not a schedule (Matthew 24:36, “of that day and hour no one knows”).</p>"},{"a":13,"z":13,"star":false,"grk":"<p>ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ.</p>","lit":"<p>“Let us <b>walk becomingly</b>, <b>as in the day</b>: not in <b>carousing</b> and <b>drunkenness</b>, not in <b>sexual immorality</b> and <b>debauchery</b>, not in <b>strife</b> and <b>jealousy</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>becomingly</td><td>εὐσχημόνως</td><td>euschēmonōs</td><td>G2156</td><td>εὖ + σχῆμα: <b>fittingly, in good form</b> (the root of συσχηματίζω in 12:2)</td></tr><tr><td>carousing</td><td>κῶμος</td><td>kōmos</td><td>G2970</td><td><b>a riotous party</b> (originally a Bacchic procession)</td></tr><tr><td>drunkenness</td><td>μέθη</td><td>methē</td><td>G3178</td><td>drunkenness</td></tr><tr><td>sexual immorality</td><td>κοίτη</td><td>koitē</td><td>G2845</td><td>the bed; sexual licence</td></tr><tr><td>debauchery</td><td>ἀσέλγεια</td><td>aselgeia</td><td>G766</td><td><b>shamelessness, unrestraint</b></td></tr><tr><td>strife</td><td>ἔρις</td><td>eris</td><td>G2054</td><td>quarrelling</td></tr><tr><td>jealousy</td><td>ζῆλος</td><td>zēlos</td><td>G2205</td><td><b>the word rendered “zeal” in 10:2</b> (here in its negative sense)</td></tr></table>","gram":"<p><b>★ First light: three pairs of sins</b></p><pre>[INDULGENCE]  carousing   +  drunkenness\n[LUST]        immorality  +  debauchery\n[RELATIONSHIPS] strife    +  jealousy</pre><p>Notice that Paul puts the third pair on <b>the same list</b>.</p><p>In church we are very alert to the first two pairs.<br>But “strife and jealousy” — <b>Paul places them on the same line as drunkenness and immorality.</b></p><p><b>★ Second light: the two faces of zēlos</b></p><pre>10:2   “they have a ZEAL (ζῆλος) for God, but not according to knowledge”  —  neutral to positive\n13:13  “not in strife and JEALOUSY (ζῆλος)”                              —  negative</pre><p><b>The same word.</b> ζῆλος means <b>boiling</b> — and what boils can be zeal, or it can be envy.<br>The difference lies in <b>the direction it burns</b>.</p><p><b>★ Third light: euschēmonōs echoes the root in 12:2</b></p><pre>12:2   μὴ συσχηματίζεσθε  —  do not be [MOULDED] into this world’s form (σχῆμα)\n13:13  εὐσχημόνως        —  walk in [GOOD FORM] (εὖ + σχῆμα)</pre><p>The same root, σχῆμα (outward form).<br>12:2 says: do not be moulded into this world’s <b>form</b>.<br>13:13 says: have <b>a becoming form</b>.</p><p><b>Not “no form” — a different form.</b></p>","exp":"<p>13:13 lists six things to be taken off — and they come in <b>three pairs</b>.</p><p><b>What the text plainly says:</b> since we belong to the day, our conduct must be becoming, free of these three pairs.</p><p><b>What may fairly be drawn from it:</b> the first two pairs are universally condemned in church.</p><p>The third pair — <b>strife and jealousy</b> — we usually file under “personality” or “he just has strong opinions.”</p><p>And Paul puts them <b>on the same line</b> as drunkenness and immorality.<br>(Galatians 5:19–21 does the same: “strife, jealousies, outbursts of anger, factions” stand alongside “adultery, uncleanness, drunkenness.”)</p><p>And ζῆλος (jealousy) is the very root of “zeal” in 10:2 and “fervent” in 12:11: <b>the same boiling; the difference is which way it burns.</b></p>"},{"a":14,"z":14,"star":true,"grk":"<p>ἀλλ' ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστὸν καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.</p>","lit":"<p>“But <b>put on</b> the Lord Jesus Christ, and <b>make no provision</b> for the flesh, to satisfy its desires.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>put on</td><td>ἐνδύσασθε</td><td>endysasthe</td><td>G1746</td><td>ἐν + δύω (to enter)</td><td><b>to put on (clothing)</b></td><td><b>aorist imperative</b></td></tr><tr><td>provision</td><td>πρόνοια</td><td>pronoia</td><td>G4307</td><td>πρό + νοέω (to think)</td><td><b>forethought, planning in advance</b></td><td>see below — crucial</td></tr><tr><td>desires</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>ἐπί + θυμός</td><td>strong craving</td><td>same word as 6:12</td></tr></table>","gram":"<p><b>★ First light: endyō — “putting on a person”</b></p><p>“Put on the Lord Jesus Christ” — ἐνδύσασθε, <b>to put on clothing</b>.</p><p>In the ancient world, to put on someone’s garment meant:<br>1. <b>to take on that identity</b> (as a Roman boy put on the <i>toga virilis</i> at manhood)<br>2. to play that part in the theatre</p><p>Paul uses the same verb elsewhere:</p><p><b>Galatians 3:27:</b> “as many of you as were baptised into Christ <b>have put on</b> Christ.” (aorist: it has happened)<br><b>Romans 13:14:</b> “<b>put on</b> the Lord Jesus Christ.” (imperative: now do it)</p><p>This is the New Testament’s consistent “already / not yet” structure:<br><b>You have already put him on (Galatians 3:27) — so every morning, put him on (Romans 13:14).</b></p><p><b>★★ Second light: pronoia — “make no advance provision for the flesh”</b></p><p>This is the most practical — and most searching — word in the verse.</p><p>πρόνοια = πρό (beforehand) + νοέω (to think) — <b>forethought, preparation, arrangement made in advance</b>.<br>(Acts 24:2 uses the same word of Felix’s “<b>foresight</b>.”)</p><p>What is Paul saying?</p><p>He does <b>not</b> say “do not indulge the flesh.”<br>He says: <b>do not make the arrangements for it.</b></p><p>This is an intensely practical teaching:</p><pre>the usual approach:  I will resist hard at the moment temptation comes\nPaul’s teaching:     do not walk to the place where that temptation will find you</pre><p>Because when a person starts making provision for the flesh — <b>he has already decided</b>.</p><p>(For example: not “I will look away when it appears,” but <b>“I will not take the phone into that room.”</b>)</p><p><b>★ Third light: the two halves belong together</b></p><pre>[POSITIVE]  put on the Lord Jesus Christ\n[NEGATIVE]  make no advance provision for the flesh</pre><p><b>Neither half can be dropped.</b><br>Only the negative (“do not”) becomes an endless suppression with no finish line.<br>Only the positive (“put on”) ignores the practical line of defence.<br><b>Paul gives both.</b></p>","exp":"<p>13:14 is one of the most famous verses in church history — because <b>it is the verse by which Augustine came to Christ</b>.</p><p>Augustine records in Book VIII of the <i>Confessions</i>:</p><p>In a garden in Milan he was in agony of soul, weeping. Then he heard, from a neighbouring house, a child’s voice repeating a refrain: <b>“Tolle lege, tolle lege” — “take up and read, take up and read.”</b></p><p>He got up, took the letters of Paul, opened them, and read:</p><p><b>“Not in carousing and drunkenness, not in sexual immorality and debauchery, not in strife and jealousy. But put on the Lord Jesus Christ, and make no provision for the flesh, to satisfy its desires.”</b></p><p>He wrote that, when he had finished reading, <b>“a light of certainty entered my heart, and all the darkness of doubt vanished away.”</b></p><p>This is documented at first hand.</p><p>And what finally changed a man who had struggled for years was not an argument — <b>it was one sentence: put him on.</b></p>"}],"14":[{"a":1,"z":1,"star":true,"grk":"<p>Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.</p>","lit":"<p>“As for the one who is <b>weak</b> in faith, <b>take him to yourselves</b> — <b>but not for the purpose of</b> disputing over <b>opinions</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>weak</td><td>ἀσθενοῦντα</td><td>asthenounta</td><td>G770</td><td>ἀ + σθένος (strength)</td><td><b>without strength</b></td><td>same word as 5:6</td></tr><tr><td>accept</td><td>προσλαμβάνεσθε</td><td>proslambanesthe</td><td>G4355</td><td>πρός + λαμβάνω</td><td><b>to take someone to oneself</b></td><td><b>middle voice</b> (see below)</td></tr><tr><td>disputes</td><td>διακρίσεις</td><td>diakriseis</td><td>G1253</td><td>διά + κρίνω</td><td>argument, passing judgement</td><td>—</td></tr><tr><td>opinions</td><td>διαλογισμῶν</td><td>dialogismōn</td><td>G1261</td><td>διά + λογίζομαι</td><td>inner reasonings, opinions</td><td>—</td></tr></table>","gram":"<p><b>★ First light: the picture in proslambanō</b></p><p>The verb is πρός (toward) + λαμβάνω (to take), and it stands in the <b>middle voice</b> — meaning <b>to take someone to yourself, to bring him into your own circle</b>.</p><p>Other New Testament uses:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Acts 28:2</b></td><td>the islanders “<b>received</b> us” (lit a fire and welcomed Paul’s party)</td></tr><tr><td><b>Philemon 17</b></td><td>Paul, of the runaway slave Onesimus: “<b>receive him as you would me</b>”</td></tr><tr><td><b>Romans 15:7</b></td><td>“<b>accept one another</b>, just as <b>Christ accepted you</b>”</td></tr></table><p><b>“Accept” does not mean “tolerate his existence.” It means take him to yourself.</b></p><p><b>★ Second light: what does “weak” refer to?</b></p><p>ἀσθενέω here does <b>not</b> mean moral weakness or spiritual immaturity.</p><p>Judging from the example in 14:2, it refers to <b>someone whose conscience cannot yet let go of a matter of liberty</b> — he feels a thing is forbidden when it is in fact not sin.</p><p>And this is important: <b>Paul calls him “weak,” and yet asks him to change nothing at all. The person Paul asks to change is the strong.</b></p><p><b>★ Third light: “not for the purpose of disputing over opinions”</b></p><p>The sense of the Greek is close to: <b>accept him — but not in order to pull him into an argument about opinions.</b></p><p>This is a very practical warning: <b>there is a kind of “acceptance” that welcomes you in and then begins to correct you.</b><br>Paul says: not that kind.</p>","exp":"<p>14:1 is the <b>opening command</b> of the whole section (14:1–15:7). And it has two halves; the second is usually skipped.</p><pre>① accept him (προσλαμβάνεσθε) — take him to yourself\n② but not in order to dispute over his opinions</pre><p><b>What the text plainly says:</b> accept the one weak in faith, but not so as to draw him into a quarrel about opinions.</p><p><b>What may fairly be drawn from it:</b> “accept” is not “put up with” — προσλαμβάνω is <b>middle voice</b>, literally <b>“take him to yourself.”</b></p><p><b>⚠ Pastoral note:</b> never use “weak” as a label (“you’re the weak one in Romans 14”). That is precisely the “despising” 14:3 forbids.<br>And note again: <b>Paul calls him weak and asks nothing of him — he asks the strong to change.</b></p>"},{"a":2,"z":3,"star":true,"grk":"<p>3 ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ὁ δὲ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.</p>","lit":"<p>2 “One person <b>has faith to eat anything</b>; but <b>the weak one eats only vegetables</b>.”</p><p>3 “Let the one who eats <b>not count the one who does not eat as nothing</b>; and let the one who does not eat <b>not pass judgement</b> on the one who eats — <b>for God has accepted him</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>despise</td><td>ἐξουθενείτω</td><td>exoutheneitō</td><td>G1848</td><td>ἐξ + οὐθέν (<b>nothing, zero</b>)</td><td><b>to count as nothing</b></td><td>see below</td></tr><tr><td>judge</td><td>κρινέτω</td><td>krinetō</td><td>G2919</td><td>κρίνω</td><td>to judge, to condemn</td><td>same word as 2:1</td></tr><tr><td>has accepted</td><td>προσελάβετο</td><td>proselabeto</td><td>G4355</td><td>—</td><td><b>accepted</b> (the word of 14:1)</td><td><b>the subject is God</b></td></tr></table>","gram":"<p><b>★ First light: exoutheneō — “to treat a person as zero”</b></p><p>The root of this verb is <b>οὐθέν (= οὐδέν), “nothing, zero.”</b></p><p>Literally it means: <b>to treat someone as if he were nothing at all.</b><br>(Luke 23:11, Herod “<b>treated him with contempt</b>”; 1 Corinthians 1:28, “the things that are <b>despised</b>” — the same word.)</p><p>The picture is exact:</p><p><b>To despise is not to hate him. It is to reduce him to zero.</b><br>On the list in your heart, he carries no weight.</p><p><b>★ Second light: a precise distinction between two sins</b></p><pre>[THE STRONG]  ἐξουθενέω (despise)  —  treats the person as zero\n[THE WEAK]    κρίνω (judge)        —  takes the judgement seat</pre><p>Paul’s observation is exact:</p><p><b>The strong will not say you have sinned; he simply thinks you “do not understand yet” — he zeroes you.</b><br><b>The weak does not look down on you; he thinks you have fallen — he condemns you.</b></p><p>And <b>both</b> have been named.</p><p><b>★ Third light: the reason in 14:3</b></p><p><b>“For God has accepted him.”</b></p><p>This is the first and most basic reason in the chapter:</p><p><b>God has already received him. On what authority will you refuse?</b></p>","exp":"<p>Verse 3 names a sin on each side — <b>and they run in opposite directions</b>.</p><table><tr><th></th><th>Greek</th><th>What it is</th></tr><tr><td><b>the strong</b></td><td><b>ἐξουθενέω</b> (despise)</td><td>the root is οὐθέν = <b>zero</b>: treating a person as nothing</td></tr><tr><td><b>the weak</b></td><td><b>κρίνω</b> (judge)</td><td>a courtroom word: <b>condemning him</b></td></tr></table><p><b>What the text plainly says:</b> the one who eats must not despise the one who abstains, and the one who abstains must not judge the one who eats; for God has accepted him.</p><p><b>What may fairly be drawn from it:</b> both sides are named. And the reason given is one sentence: <b>“God has accepted him.”</b></p><p><b>God has already received him. On what authority will you refuse?</b></p>"},{"a":4,"z":4,"star":true,"grk":"<p>σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν.</p>","lit":"<p>“<b>Who are you</b> to judge <b>another man’s household servant</b>? To <b>his own master</b> he stands or falls; and <b>he will be made to stand</b>, for the Lord <b>is able</b> to make him stand.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>who are you</td><td>σὺ τίς εἶ</td><td>sy tis ei</td><td>—</td><td><b>who exactly are you?</b> (<b>the same construction as 9:20</b>)</td></tr><tr><td>another’s</td><td>ἀλλότριος</td><td>allotrios</td><td>G245</td><td><b>belonging to someone else</b> (not yours)</td></tr><tr><td>household servant</td><td>οἰκέτης</td><td>oiketēs</td><td>G3610</td><td>οἶκος (house): <b>a servant of a particular household</b></td></tr><tr><td>will stand</td><td>σταθήσεται</td><td>stathēsetai</td><td>G2476</td><td><b>passive: he will be made to stand</b></td></tr><tr><td>is able</td><td>δυνατεῖ</td><td>dynatei</td><td>G1414</td><td><b>has power</b> (the root of 4:21)</td></tr></table>","gram":"<p><b>★ First light: sy tis ei — the construction from chapter 9</b></p><pre>9:20   “O man, WHO ARE YOU (σὺ τίς εἶ) to answer back to God?”\n14:4   “WHO ARE YOU (σὺ τίς εἶ) to judge another man’s servant?”</pre><p>The same construction.<br>Chapter 9: on what authority do you interrogate <b>God</b>?<br>Chapter 14: on what authority do you interrogate <b>God’s servant</b>?</p><p><b>★ Second light: allotrios oiketēs — “another man’s household servant”</b></p><p>οἰκέτης is a servant belonging to a particular household (rather than the general δοῦλος), and ἀλλότριος means <b>belonging to someone else</b>.</p><p>In the first century the picture was unmistakable:</p><p>You walk into your neighbour’s house and see his servant doing something not to your liking. Do you rebuke him? <b>Of course not. He is not your servant.</b></p><p><b>His performance is answerable to his own master, not to you.</b></p><p><b>★ Third light: stathēsetai is passive</b></p><p>“And he <b>will stand</b>” — passive: <b>he will be made to stand</b>.</p><p>And the second half tells us who does the standing up: <b>“for the Lord is able to make him stand.”</b></p><p>This is the warmest sentence in the chapter.</p><p>Paul does <b>not</b> say, “we shall have to see whether he stands or not.”<br>He says: <b>he will stand.</b> Because the one holding him up is not himself — <b>it is the Lord.</b></p><p><b>★ Fourth light: dynateō — the root from chapter 4</b></p><pre>4:21   “fully assured that what God had promised, he was ABLE (δυνατός) to do”\n14:4   “for the Lord IS ABLE (δυνατεῖ) to make him stand”</pre><p>The God who brought a son out of Abraham’s body, “already as good as dead,” <b>is also able to hold up the brother you think is not doing very well.</b></p>","exp":"<p>14:4 is the most forceful sentence in the chapter.</p><p>And its force lies here: <b>it does not settle who is right; it settles who has the standing to judge.</b></p><p>Paul does not say, “your view is wrong.”<br>He says: <b>“He is not your servant.”</b></p>"},{"a":5,"z":6,"star":false,"grk":"<p>5 …ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω.</p>","lit":"<p>5 “One person <b>regards one day above another</b>; another <b>regards every day alike</b>. <b>Let each be fully persuaded in his own mind</b>.”</p><p>6 “The one who <b>observes the day</b> observes it <b>to the Lord</b>; the one who <b>eats</b> eats to the Lord — <b>for he gives thanks to God</b>; and the one who <b>does not eat</b> abstains to the Lord, <b>and he too gives thanks to God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>mind</td><td>νοῦς</td><td>nous</td><td>G3563</td><td><b>the mind, the understanding</b> (the word of 12:2)</td></tr><tr><td>be fully persuaded</td><td>πληροφορείσθω</td><td>plērophoreisthō</td><td>G4135</td><td><b>to be filled full, fully convinced</b> (the word of 4:21)</td></tr><tr><td>gives thanks</td><td>εὐχαριστεῖ</td><td>eucharistei</td><td>G2168</td><td>to give thanks</td></tr></table>","gram":"<p><b>★ First light: plērophoreō — the word from chapter 4</b></p><pre>4:21   Abraham was “FULLY ASSURED (πληροφορηθείς) that what God promised he was able to do”\n14:5   “let each be FULLY PERSUADED (πληροφορείσθω) in his own mind”</pre><p>The word literally means <b>“filled to the brim,”</b> and is also used of <b>a ship under full sail</b>.</p><p>Paul is saying: <b>you do not have to be like everyone else — but you must be fully convinced in your own mind.</b></p><p>(In other words: <b>do not do it just because others do; and do not criticise it just because others do.</b>)</p><p><b>★ Second light: the key to 14:6 — both sides give thanks</b></p><pre>the one who eats        —  eats to the Lord, [FOR HE GIVES THANKS TO GOD]\nthe one who abstains    —  abstains to the Lord, [AND HE TOO GIVES THANKS]</pre><p>This is the quietest, most settling sentence in the chapter.</p><p><b>The two are doing opposite things. But they are doing the same action — they are both saying grace.</b></p><p><b>★ Third light: nous — the word of 12:2</b></p><pre>12:2   “be transformed by the renewing of your MIND (νοῦς)”\n14:5   “let each be fully persuaded in his own MIND (νοῦς)”</pre><p>12:2 says the mind must be renewed.<br>14:5 says that the renewed mind <b>moves at a different pace in different people</b>.</p>","exp":"<p>Verse 6 is the most settling sentence in the chapter.</p><p>The two people are doing <b>opposite things</b>: one eats, one does not.</p><p>But they are performing <b>the same action</b> — <b>they are both saying grace.</b></p><p><b>What the text plainly says:</b> in matters of days and food, each must be settled in his own mind; and both sides act “to the Lord,” and both give thanks.</p><p><b>What may fairly be drawn from it:</b> what Paul asks for is not “be like everyone else,” but <b>“be convinced yourself, before God.”</b></p><p><b>⚠ Pulpit note:</b> the relation of 14:5 to the Sabbath is a question on which godly Christians differ (see the disputed material). And it is worth noticing: <b>Paul himself did not settle it</b> — he only said, “let each be fully persuaded in his own mind.”</p>"},{"a":7,"z":9,"star":true,"grk":"<p>9 εἰς τοῦτο γὰρ Χριστὸς ἀπέθανεν καὶ ἔζησεν, ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.</p>","lit":"<p>7 “For <b>none of us lives to himself</b>, and <b>none of us dies to himself</b>.”</p><p>8 “For if we live, we live <b>to the Lord</b>; and if we die, we die <b>to the Lord</b>. So then, whether we live or die, <b>we belong to the Lord</b>.”</p><p>9 “For to this end Christ <b>died and lived again</b> — that he might be <b>Lord of both the dead and the living</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>we are the Lord’s</td><td>τοῦ κυρίου ἐσμέν</td><td>tou kyriou esmen</td><td>G2962</td><td><b>we are the Lord’s</b> (genitive: we belong to him)</td></tr><tr><td>be Lord</td><td>κυριεύσῃ</td><td>kyrieusē</td><td>G2961</td><td><b>to be lord, to rule</b> (the word of 6:9, 6:14, 7:1)</td></tr></table>","gram":"<p><b>★ First light: the journey of kyrieuō</b></p><pre>6:9    death no longer HAS DOMINION over him\n6:14   sin shall not HAVE DOMINION over you\n7:1    the law HAS DOMINION over a person while he lives\n  ↓\n14:9   Christ died and lived again, that he might be LORD of both the dead and the living</pre><p>All through Romans, Paul has been dismantling one “lord” after another — death, sin, the law.<br>And in chapter 14, <b>someone sits down in the seat that has been emptied: Christ.</b></p><p><b>★ Second light: 14:9 is the christological ground of the whole passage</b></p><p>Why does Paul say “who are you to judge another man’s servant”? Because:</p><pre>Christ died and lived again  →  in order to be Lord  →  therefore that person is [HIS]\n  ↓\nto judge him is to play steward in someone else’s house</pre><p><b>★ Third light: “none of us lives to himself”</b></p><p>14:7 is often quoted as an inspirational line (“we should live for others”).</p><p>But Paul’s meaning is more precise: <b>we do not belong to ourselves — we belong to the Lord (14:8).</b></p>","exp":"<p>These three verses are the <b>theological ground</b> of the question in 14:4 (“who are you to judge <b>another man’s</b> servant?”). Paul’s chain of reasoning is clear:</p><pre>Christ died and lived again (14:9)\n  ↓ in order to be Lord\ntherefore that person is [HIS] (14:8)\n  ↓\ntherefore the right of judgement is his, not yours (14:4, 14:10)</pre><p><b>What the text plainly says:</b> no one lives or dies to himself; living or dying we are the Lord’s; because Christ died and rose precisely in order to be Lord of the dead and the living.</p><p><b>What may fairly be drawn from it:</b> 14:7 is not simply “live for other people.” It is <b>we do not belong to ourselves — we belong to the Lord.</b></p>"},{"a":10,"z":12,"star":true,"grk":"<p>10 …πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ. 12 ἄρα οὖν ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον δώσει τῷ θεῷ.</p>","lit":"<p>10 “But <b>you</b> — why do you judge your brother? Or <b>you</b> — why do you count your brother as nothing? <b>For we shall all stand before the judgement seat of God.</b>”</p><p>11 “For it is written: ‘As I live, says the Lord, <b>every knee shall bow to me</b>, and <b>every tongue shall confess to God</b>.’”</p><p>12 “So then, <b>each of us shall give account of himself to God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>shall stand</td><td>παραστησόμεθα</td><td>parastēsometha</td><td>G3936</td><td><b>παρίστημι — the word of 6:13 and 12:1, “present”!</b></td></tr><tr><td>judgement seat</td><td>βῆμα</td><td>bēma</td><td>G968</td><td><b>the raised platform of a magistrate</b> (see below)</td></tr><tr><td>give account</td><td>λόγον δώσει</td><td>logon dōsei</td><td>G3056</td><td><b>to render an account</b></td></tr></table>","gram":"<p><b>★ First light: bēma — a very concrete object</b></p><p>A βῆμα was <b>a raised platform</b> on which a magistrate sat to hear cases. In the New Testament:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Matthew 27:19</b></td><td>while Pilate was <b>sitting on the judgement seat</b> (βῆμα)</td></tr><tr><td><b>Acts 18:12</b></td><td>Paul was brought before the <b>judgement seat</b> (βῆμα) of Gallio, in Corinth</td></tr><tr><td><b>2 Corinthians 5:10</b></td><td>“we must all appear before the <b>judgement seat</b> of Christ”</td></tr></table><p>And note: <b>Paul wrote Romans from Corinth</b> — <b>and he himself had stood before that very bēma in Corinth</b>.</p><p><b>★ Second light: paristēmi — the word for “present”</b></p><pre>6:13   “PRESENT (παραστήσατε) yourselves to God”\n12:1   “PRESENT (παραστῆσαι) your bodies a living sacrifice”\n  ↓\n14:10  “we shall all STAND (παραστησόμεθα) before the judgement seat of God”</pre><p><b>The same word.</b><br>You <b>present</b> yourself now (12:1); you will <b>stand</b> before him then (14:10).<br><b>One action, two tenses.</b></p><p><b>★ Third light: hekastos peri heautou — “each of himself”</b></p><p>The weight of 14:12 falls on two phrases:</p><pre>ἕκαστος    —  [EACH ONE]\nπερὶ ἑαυτοῦ —  [CONCERNING HIMSELF]</pre><p>This verse closes the last door on judging:</p><p><b>On that day you will not be asked how your brother did. You will be asked about yourself.</b></p><p><b>★ Fourth light: 14:11 quotes Isaiah 45:23</b></p><p>And Philippians 2:10–11 applies the same passage <b>to Christ</b>. This is the same pattern as Romans 10:13 (where “the Lord” of Joel 2:32 is YHWH).</p>","exp":"<p>Verse 10 uses two emphatic “you”s (σὺ δὲ… ἢ καὶ σὺ…) — <b>Paul is pointing a finger.</b></p><p><b>What the text plainly says:</b> we shall all stand before God’s judgement seat, and each will give account of himself to God.</p><p><b>What may fairly be drawn from it:</b> verse 12 shuts the last door on judging — <b>on that day you will not be asked how your brother did. You will be asked about yourself.</b></p><p><b>⚠ Note:</b> “shall stand” (παραστησόμεθα) is the very word rendered “present” in 6:13 and 12:1.<br><b>You present yourself now; you will stand before him then. One action, two tenses.</b></p>"},{"a":13,"z":13,"star":true,"grk":"<p>Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.</p>","lit":"<p>“Therefore <b>let us no longer judge one another</b>; but <b>rather determine this</b>: <b>not to put a stumbling block or a trap in a brother’s way</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>judge / determine</td><td>κρίνωμεν / κρίνατε</td><td>krinōmen / krinate</td><td>G2919</td><td><b>the same verb, used twice</b> (see below)</td></tr><tr><td>stumbling block</td><td>πρόσκομμα</td><td>proskomma</td><td>G4348</td><td><b>something that trips a person</b> (the word of 9:33)</td></tr><tr><td>trap</td><td>σκάνδαλον</td><td>skandalon</td><td>G4625</td><td><b>the trigger-stick of a trap</b> (see below)</td></tr></table>","gram":"<p><b>★ First light: the wordplay on krinō</b></p><pre>μηκέτι ἀλλήλους κρίνωμεν   —  let us no longer [JUDGE] one another\nἀλλὰ τοῦτο κρίνατε μᾶλλον —  rather, [DETERMINE] this</pre><p>Paul is saying: <b>by all means judge — but do not judge that person; judge this matter:</b> <b>I will not be a stumbling block to him.</b></p><p><b>★ Second light: the original sense of skandalon</b></p><p>The word originally denoted <b>the trigger-stick of an animal trap</b> — the creature touches it, and the jaws close.</p><p>πρόσκομμα is <b>a trip</b>; σκάνδαλον is <b>step on it and you are caught</b>.<br><b>Paul uses two words, each heavier than the last.</b></p><p><b>★ Third light: proskomma — the word from 9:33</b></p><pre>9:33   “I lay in Zion a STONE OF STUMBLING (πρόσκομμα)”   —  that is [CHRIST]\n  ↓\n14:13  “not to put a STUMBLING BLOCK (πρόσκομμα) before a brother”</pre><p>The contrast is grave:<br><b>God laid a stumbling stone in order to bring people face to face with Christ.<br>If you lay one, you are simply making people fall.</b></p>","exp":"<p>In the Greek, verse 13 is <b>a play on one word</b> — the same verb used twice.</p><p><b>What the text plainly says:</b> stop judging one another; the judgement to make is this — do not put a stumbling block or trap before a brother.</p><p><b>What may fairly be drawn from it:</b> Paul does <b>not</b> say “do not judge.”<br>He says: <b>by all means judge — but judge the matter, not the man.</b><br>And the matter is: <b>I will not become his stumbling block.</b></p><p><b>⚠ Note:</b> Paul uses <b>two</b> words, each heavier than the last —</p><table><tr><th>Word</th><th>Meaning</th></tr><tr><td><b>πρόσκομμα</b></td><td><b>a trip</b> (the word of 9:33, “stone of stumbling”)</td></tr><tr><td><b>σκάνδαλον</b></td><td><b>the trigger of a trap</b> — step on it and you are held</td></tr></table><p>And the stumbling stone of 9:33 was <b>laid by God and points to Christ</b>; the one in 14:13 is <b>laid by you and makes people fall</b>.</p>"},{"a":14,"z":15,"star":true,"grk":"<p>15 …μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.</p>","lit":"<p>14 “<b>I know, and have been persuaded in the Lord Jesus</b>, that <b>nothing is unclean in itself</b>; except that <b>to the one who reckons a thing unclean, to him it is unclean</b>.”</p><p>15 “For if because of food your brother <b>is grieved</b>, you are <b>no longer walking according to love</b>. <b>Do not destroy with your food the one for whom Christ died.</b>”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>I know and am persuaded</td><td>οἶδα καὶ πέπεισμαι</td><td>oida kai pepeismai</td><td>G1492 / G3982</td><td><b>I know, and I have been persuaded</b> (the word of 8:38)</td></tr><tr><td>unclean</td><td>κοινός</td><td>koinos</td><td>G2839</td><td><b>common, ordinary</b> → ceremonially unclean</td></tr><tr><td>is grieved</td><td>λυπεῖται</td><td>lypeitai</td><td>G3076</td><td>to be caused sorrow</td></tr><tr><td>destroy</td><td>ἀπόλλυε</td><td>apollye</td><td>G622</td><td><b>to ruin, to bring to destruction</b> (<b>present imperative, negated</b>)</td></tr></table>","gram":"<p><b>★ First light: Paul stands with “the strong”</b></p><p>“I know and am persuaded in the Lord Jesus that nothing is unclean of itself.”</p><p>πέπεισμαι is <b>perfect passive</b> — “I have been persuaded” (the same word as 8:38, “I am persuaded”).</p><p>This is enormously important: <b>theologically, Paul agrees completely with the strong.</b> (In 15:1 he says so outright: “we who are strong…”)</p><p>And then — <b>he spends an entire chapter teaching the strong to give way.</b></p><p><b>★ Second light: koinos — “common”</b></p><p>The basic sense is <b>“shared, ordinary, common”</b> (Acts 2:44, “they had all things <b>in common</b>” — the same word). In Jewish usage it came to mean <b>“not set apart → unclean.”</b></p><p>Paul is saying: <b>the thing itself is not the problem. The problem is that man’s conscience.</b></p><p><b>★ Third light: the two reasons in 14:15</b></p><pre>reason one: “you are no longer walking ACCORDING TO LOVE”  —  the love of 13:8–10\nreason two: “CHRIST DIED FOR HIM”                         —  the price of the cross</pre><p>The second reason is the heaviest sentence in the chapter:</p><p><b>The person you might harm over a mouthful of food — Christ died for him.</b></p><p><b>★ Fourth light: the force of apollymi</b></p><p>“Destroy him” — ἀπόλλυμι is a very heavy word (to ruin, to perish).<br>(On whether this means “losing salvation,” see the disputed material.)</p>","exp":"<p>Verse 14 matters enormously, because it tells us <b>which side Paul is on</b>.</p><p>“I know and am persuaded in the Lord Jesus (πέπεισμαι, perfect passive: I have been persuaded) that <b>nothing is unclean of itself</b>.”</p><p><b>Theologically, Paul agrees completely with the strong.</b> (In 15:1 he says it plainly: “we who are <b>strong</b>…”)</p><p>And then — <b>he spends a whole chapter teaching the strong to yield.</b></p><p><b>What the text plainly says:</b> nothing is unclean in itself; but if food grieves your brother, you are not walking in love; do not destroy with food the one for whom Christ died.</p><p><b>What may fairly be drawn from it:</b> Paul gives two reasons, each heavier than the last —</p><p>Reason one: <b>“you are no longer walking according to love”</b> (echoing 13:8–10).<br>Reason two: <b>“Christ has already died for him.”</b></p><p>The second is the weightiest sentence in the chapter:</p><p><b>The person you might harm over a mouthful of food — Christ died for him.<br>There is the blood of Christ on that man.</b></p><p><b>⚠ Pulpit note:</b> “destroy” (ἀπόλλυμι) is a very heavy word. Do not use it to frighten people (“you will send your brother to hell”); but neither dilute it into “you will hurt his feelings.” Paul is speaking of <b>real spiritual damage</b> (compare 1 Corinthians 8:11–12). And 14:4 has already supplied the balance: <b>“the Lord is able to make him stand.”</b></p>"},{"a":16,"z":18,"star":false,"grk":"<p>17 οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ.</p>","lit":"<p>16 “Therefore <b>do not let what you regard as good be spoken of as evil</b>.”</p><p>17 “For <b>the kingdom of God is not eating and drinking</b>, but <b>righteousness and peace and joy in the Holy Spirit</b>.”</p><p>18 “For the one who <b>serves Christ in these things</b> is <b>well pleasing to God</b> and <b>approved by people</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>righteousness</td><td>δικαιοσύνη</td><td>dikaiosynē</td><td>G1343</td><td><b>the theme word of the whole letter</b></td></tr><tr><td>peace</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td><b>the word of 5:1, “peace with God”</b></td></tr><tr><td>joy</td><td>χαρά</td><td>chara</td><td>G5479</td><td>joy</td></tr></table>","gram":"<p><b>★ First light: 14:17 is the theological centre of the chapter</b></p><p>“The kingdom of God is <b>not eating and drinking</b>, but <b>righteousness and peace and joy in the Holy Spirit</b>.”</p><p>Notice that these three are precisely the key words of the earlier chapters:</p><table><tr><th>Word</th><th>Where</th></tr><tr><td><b>righteousness</b> (δικαιοσύνη)</td><td>1:17; 3:21–26 — justification by faith</td></tr><tr><td><b>peace</b> (εἰρήνη)</td><td>5:1, “peace with God”</td></tr><tr><td><b>joy in the Holy Spirit</b></td><td>5:2; chapter 8; 15:13</td></tr></table><p><b>Paul is saying: the thing you are quarrelling about is not on the list.</b></p><p><b>★ Second light: the verse says two things at once</b></p><pre>negatively:  the kingdom is not eating and drinking  —  so do not fight over it\npositively:  but righteousness, peace, joy           —  and your quarrel is destroying [PEACE]</pre><p>That is a deep cut:</p><p><b>You are damaging something that is on the list, for the sake of something that is not.</b></p>","exp":"<p>14:17 is the <b>theological centre</b> of the chapter. And those three things are precisely the key words of the earlier chapters.</p><p><b>What the text plainly says:</b> the substance of God’s kingdom is not food and drink, but righteousness, peace and joy in the Holy Spirit.</p><p><b>What may fairly be drawn from it:</b> the verse says two things at once —</p><p>Negatively: <b>the thing you are quarrelling about is not on the list.</b><br>Positively: <b>and your quarrel is destroying the item that is — peace.</b></p><p><b>⚠ A very practical test:</b></p><p><b>The thing I have been insisting on lately — is it on that list?</b></p>"},{"a":19,"z":20,"star":true,"grk":"<p>19 ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους. 20 μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ.</p>","lit":"<p>19 “So then, let us <b>chase after</b> the things that make for peace, and the things by which we <b>build one another up</b>.”</p><p>20 “<b>Do not tear down the work of God for the sake of food.</b> All things indeed are clean; but <b>it is evil for a person to eat and cause someone to stumble</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>pursue</td><td>διώκωμεν</td><td>diōkōmen</td><td>G1377</td><td>—</td><td><b>to chase</b> (the word of 12:13, 12:14)</td><td>—</td></tr><tr><td>building up</td><td>οἰκοδομή</td><td>oikodomē</td><td>G3619</td><td>οἶκος (house) + δέμω (to build)</td><td><b>to build a house</b></td><td>see below</td></tr><tr><td>tear down</td><td>κατάλυε</td><td>katalye</td><td>G2647</td><td>κατά + λύω (to loosen)</td><td><b>to demolish a building</b></td><td>see below</td></tr><tr><td>the work of God</td><td>ἔργον τοῦ θεοῦ</td><td>—</td><td>G2041</td><td>—</td><td>God’s work</td><td>—</td></tr></table>","gram":"<p><b>★★ First light: two opposite building words</b></p><pre>14:19  οἰκοδομή —  [BUILD UP]   (to build a house)\n14:20  κατάλυε  —  [TEAR DOWN]</pre><p>And καταλύω is the very verb the Gospels use of <b>demolishing the temple</b>:</p><p>Matthew 26:61, “This man said, ‘I am able to <b>destroy</b> (καταλῦσαι) the temple of God.’”<br>Mark 13:2, “there will not be left here one stone upon another that will not be <b>thrown down</b>.”</p><p><b>Paul has used a temple-demolition word</b> — and said: <b>do not tear down the work of God for the sake of food.</b></p><p><b>★ Second light: a brutal piece of arithmetic</b></p><pre>God is building  —  a house (οἰκοδομή)\nand you, for     —  a mouthful of food (βρῶμα)\nhave             —  torn it down (κατάλυε)</pre><p><b>It is a wildly disproportionate exchange.</b></p><p><b>★ Third light: diōkō — the word of 12:13</b></p><pre>12:13  “given to HOSPITALITY”  —  φιλοξενίαν διώκοντες (chasing hospitality)\n12:14  “bless those who PERSECUTE (διώκοντας) you”\n  ↓\n14:19  “let us PURSUE (διώκωμεν) the things that make for peace”</pre><p><b>Peace does not simply happen. It has to be chased.</b></p>","exp":"<p>Verses 19 and 20 use <b>two opposite building words</b>.</p><p><b>What the text plainly says:</b> pursue peace and mutual building up; do not tear down the work of God for the sake of food.</p><p><b>What may fairly be drawn from it:</b> Paul used a word for <b>pulling down a temple</b> to describe “destroying the work of God for food.”</p><p>And it is a wildly disproportionate exchange:</p><p><b>God is building a house — brick by brick, and slowly.<br>And you are standing there, over a mouthful of food, with a hammer.</b></p><p><b>⚠ Note:</b> “pursue” (διώκω) is the word of 12:13 and 12:14 — <b>to chase</b>.<br><b>Peace does not simply happen. It has to be chased.</b></p>"},{"a":21,"z":23,"star":false,"grk":"<p>22 σὺ πίστιν [ἣν] ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει· 23 …πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ἐστίν.</p>","lit":"<p>21 “<b>It is good not to eat meat, nor drink wine, nor do anything by which your brother stumbles.</b>”</p><p>22 “<b>The faith you have, keep to yourself before God.</b> <b>Blessed is the one who does not condemn himself in what he approves.</b>”</p><p>23 “But the one who is <b>divided in himself</b>, and eats anyway, <b>stands condemned</b> — because it is not <b>from faith</b>; and <b>whatever is not from faith is sin</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>keep to yourself</td><td>κατὰ σεαυτὸν ἔχε</td><td>kata seauton eche</td><td>—</td><td><b>hold it for yourself</b> (before God)</td></tr><tr><td>does not condemn himself</td><td>μὴ κρίνων ἑαυτόν</td><td>—</td><td>G2919</td><td><b>does not judge himself</b> (κρίνω again)</td></tr><tr><td>approves</td><td>δοκιμάζει</td><td>dokimazei</td><td>G1381</td><td><b>to test and approve</b> (the word of 12:2)</td></tr><tr><td>doubts</td><td>διακρινόμενος</td><td>diakrinomenos</td><td>G1252</td><td><b>torn in two, wavering</b> (the word of 4:20)</td></tr></table>","gram":"<p><b>★ First light: 14:22, “keep it to yourself before God”</b></p><p>This verse is often misread as “do not talk about what you believe.”</p><p>The Greek is closer to: <b>the conviction you have — hold it, for yourself, before God.</b></p><p>Paul is not telling people to hide their faith. He is saying: <b>your liberty does not need to be proved in front of your brother.</b></p><p><b>★ Second light: dokimazō — the word of 12:2</b></p><pre>12:2   “that you may PROVE (δοκιμάζειν) what the will of God is”\n14:22  “blessed is the one who does not condemn himself in what he APPROVES (δοκιμάζει)”</pre><p><b>★ Third light: diakrinomai — the word from chapter 4</b></p><pre>4:20   Abraham “did not WAVER (διεκρίθη) at the promise of God through unbelief”\n14:23  “the one who DOUBTS (διακρινόμενος) is condemned if he eats”</pre><p>The word literally means <b>“to be torn in two.”</b></p><p>So 14:23 is not about “doing the wrong thing.” It is about <b>doing it while divided within</b>.</p><p><b>★ Fourth light: 14:23, “whatever is not from faith is sin”</b></p><p>The <b>contextual limits</b> of this sentence are crucial (see the disputed material).</p><p>What Paul is saying is: <b>in a disputable matter, to act against your own settled conscience is sin.</b></p><p>He is <b>not</b> saying “everything done by a non-Christian is sin,” and he is <b>not</b> saying “just follow your feelings.”</p>","exp":"<p>Verse 22 is often misread as “do not talk about your convictions.”</p><p>The Greek is closer to: <b>the conviction you have — hold it, for yourself, before God.</b></p><p><b>What the text plainly says:</b> it is good not to do anything that makes a brother stumble; the one who has faith holds it before God; and to act against your own conscience is sin.</p><p><b>What may fairly be drawn from it:</b> Paul is not telling people to hide their faith. He is saying: <b>your liberty does not need to be proved in front of your brother.</b></p><p>And “doubts” in verse 23 (διακρινόμενος) literally means <b>“torn in two”</b> — the very word of 4:20, where Abraham “did not waver through unbelief.”</p><p>So 14:23 is <b>not</b> about “doing the wrong thing.” It is about <b>doing it in a divided state of heart</b>.</p><p><b>⚠ Pulpit note (a common misuse):</b></p><p>“Whatever is not of faith is sin” <b>must not</b> be preached as “as long as I feel at peace about it, anything goes.”</p><p>Three contextual limits must be kept in view:</p><p><b>1.</b> This verse is about <b>disputable matters</b> (food, days).<br><b>2.</b> “Faith” here means <b>settled conviction about what one is doing before God</b> (14:22, δοκιμάζει).<br><b>3.</b> Its opposite is διακρινόμενος — <b>a heart torn in two</b>.</p><p><b>Conscience is not the highest authority — Scripture is.<br>But a conscience that has been schooled by Scripture must not be violated.</b></p>"}],"15":[{"a":1,"z":1,"star":true,"grk":"<p>Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν καὶ μὴ ἑαυτοῖς ἀρέσκειν.</p>","lit":"<p>“We who are <b>able</b> <b>owe a debt</b>: to <b>carry the weight</b> of the weaknesses of <b>those without ability</b>, and <b>not to please ourselves</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>ought</td><td>Ὀφείλομεν</td><td>opheilomen</td><td>G3784</td><td>ὀφείλω</td><td><b>to owe, to be under obligation</b></td><td><b>the word of 13:8!</b></td></tr><tr><td>strong</td><td>δυνατοί</td><td>dynatoi</td><td>G1415</td><td>δύναμις (power)</td><td><b>those with ability</b></td><td>—</td></tr><tr><td>weak</td><td>ἀδυνάτων</td><td>adynatōn</td><td>G102</td><td>ἀ + δύναμις</td><td><b>those without ability</b></td><td><b>same word as 8:3</b> (what the law “could not do”)</td></tr><tr><td>bear</td><td>βαστάζειν</td><td>bastazein</td><td>G941</td><td>βαστάζω</td><td><b>to carry a weight, to bear up</b></td><td><b>the word of 11:18!</b></td></tr><tr><td>please</td><td>ἀρέσκειν</td><td>areskein</td><td>G700</td><td>ἀρέσκω</td><td>to please someone</td><td>see below</td></tr></table>","gram":"<p><b>★★ First light: bastazō — the word from chapter 11</b></p><p>This is the most important verbal link in the chapter.</p><pre>11:18  “do not boast against the branches; and if you do, remember\n        [IT IS NOT YOU WHO SUPPORT (βαστάζεις) THE ROOT, BUT THE ROOT THAT SUPPORTS YOU].”\n  ↓\n15:1   “we who are strong ought to BEAR (βαστάζειν) the weaknesses of the weak.”</pre><p>The same verb: <b>to carry a weight</b>.</p><p>Do you see the order?<br>Chapter 11: <b>you are not the one carrying — you are the one being carried.</b><br>Chapter 15: <b>so now it is your turn to carry someone else.</b></p><p>(The same word appears in Matthew 8:17, “he took our infirmities and <b>bore</b> our diseases”; Galatians 6:2, “<b>bear</b> one another’s burdens.”)</p><p><b>★ Second light: opheilō — this is a debt</b></p><p>“Ought” in the Greek is not “it would be best if.” It is <b>“we owe.”</b></p><p>And we met this word in 13:8:</p><pre>13:8   “OWE (ὀφείλετε) no one anything, except to love one another”\n15:1   “we who are strong OUGHT (Ὀφείλομεν) to bear…”</pre><p>Paul is saying: <b>the strong carrying the weak is not a virtue. It is a debt.</b></p><p><b>★ Third light: the symmetry of dynatoi / adynatoi</b></p><pre>δυνατοί   —  those [WITH] ability\nἀδύνατοι  —  those [WITHOUT] ability</pre><p>And we met ἀδύνατος in 8:3: “what the law <b>could not do</b> (τὸ ἀδύνατον), in that it was weak…”</p><p>It is a humbling reminder: <b>“not able” is something we have been ourselves</b> (chapters 7 and 8).</p><p><b>★ Fourth light: “not to please ourselves”</b></p><p>ἀρέσκω = <b>to please someone, to satisfy them</b>. Paul uses the same word elsewhere:</p><p>Galatians 1:10, “Am I now seeking the favour of men, or of God? Or am I striving <b>to please men</b>?”</p><p>Note the tension:<br>Galatians 1:10 says <b>do not please people</b>; Romans 15:2 says <b>please your neighbour</b>.<br>Where is the difference? — <b>the very next verse tells us.</b></p>","exp":"<p>The first word of 15:1 (Ὀφείλομεν) is not “it would be best if.” It is <b>“we owe.”</b></p><p><b>What the text plainly says:</b> those with ability <b>are under a debt</b>: to carry the weaknesses of those without ability, and not to please themselves.</p><p><b>What may fairly be drawn from it:</b> “bear” (βαστάζω) is the word of 11:18 —</p><p>11:18, “it is not you who <b>support</b> the root, but the root that <b>supports</b> you.”<br>15:1, “we who are strong ought to <b>bear</b> the weaknesses of the weak.”</p><p><b>You were the one being carried. So now it is your turn to carry.</b></p><p>And Paul does <b>not</b> say “you strong people should become a little weaker.” He says: <b>you are strong — so go and carry.</b></p><p><b>Humility is not giving up your strength. It is changing the direction of your strength.</b></p><p><b>⚠⚠ Pulpit note (the point most easily lost in this chapter):</b></p><p>“Strong / weak” is very easily turned into a label (“I am the strong one, so you should listen to me”). Three things must be said alongside it:</p><p><b>1.</b> The subject of this verse is “we who are <b>strong</b>,” and the verb is <b>“ought to bear”</b> — <b>this is a responsibility, not a privilege</b>.<br><b>2.</b> “Without ability” (ἀδύνατος) is the very root of 8:3, “what the law <b>could not do</b>.”<br><b>3.</b> And the man of chapter 7 — “to will is present with me, but to do it is not” — <b>was Paul himself</b>.</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν.</p>","lit":"<p>“Let each of us <b>please his neighbour</b> — <b>for his good</b>, <b>toward building him up</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>neighbour</td><td>πλησίον</td><td>plēsion</td><td>G4139</td><td><b>the one near</b> (the word of 13:9, “love your neighbour as yourself”)</td></tr><tr><td>building up</td><td>οἰκοδομή</td><td>oikodomē</td><td>G3619</td><td><b>to build a house</b> (the word of 14:19)</td></tr></table>","gram":"<p><b>★ First light: two qualifiers resolve the tension with Galatians 1:10</b></p><p>Paul says “please your neighbour,” and immediately adds <b>two qualifiers</b>:</p><pre>εἰς τὸ ἀγαθόν  —  [FOR HIS GOOD]\nπρὸς οἰκοδομήν —  [TOWARD BUILDING HIM UP]</pre><p>There is the difference:</p><p>The “pleasing men” of Galatians 1:10 is <b>for myself</b> (fear of being disliked, wanting to be accepted).<br>The “pleasing your neighbour” of Romans 15:2 is <b>for his good and his building up</b>.</p><p><b>The same action; two motives.</b></p><p><b>★ Second light: oikodomē — the word from 14:19</b></p><pre>14:19  “pursue the things that make for peace and the things that BUILD UP (οἰκοδομῆς)”\n14:20  “do not TEAR DOWN (κατάλυε) the work of God for food”  —  demolishing a house\n  ↓\n15:2   “for his good, TOWARD BUILDING HIM UP (οἰκοδομήν)”</pre><p>God is building a house (14:19–20) — and 15:2 says: <b>go and help build it.</b></p>","exp":"<p>15:2 resolves what looks like a contradiction.</p><p>For Galatians 1:10 says, “Am I striving to <b>please men</b>? If I were still pleasing men, I would not be a servant of Christ.” And both verses use <b>the same verb</b> (ἀρέσκω).</p><p>The key to the resolution is the <b>two qualifiers</b> in 15:2.</p><p><b>What the text plainly says:</b> please your neighbour — but the aim must be his good and his building up.</p><p><b>What may fairly be drawn from it:</b> the same action, with <b>two different motives</b> —</p><p>Galatians 1:10: pleasing people <b>for my own sake</b> (fear of being disliked, wanting acceptance, wanting to hold my position).<br>Romans 15:2: pleasing my neighbour <b>for his good and his building up</b>.</p><p><b>⚠ A very practical test:</b></p><p><b>If nobody ever knew it was me who did this — would I still do it?</b></p>"},{"a":3,"z":3,"star":true,"grk":"<p>καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν, ἀλλὰ καθὼς γέγραπται· οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ' ἐμέ.</p>","lit":"<p>“For even Christ <b>did not please himself</b>; but as it is written: ‘The <b>reproaches</b> of those who reproached you <b>fell on me</b>.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>reproaches</td><td>ὀνειδισμοί</td><td>oneidismoi</td><td>G3680</td><td><b>public insult, abuse</b></td></tr><tr><td>fell on</td><td>ἐπέπεσαν</td><td>epepesan</td><td>G1968</td><td>ἐπί + πίπτω: <b>fell upon</b></td></tr></table>","gram":"<p><b>★ First light: the shortest and heaviest reason in the chapter</b></p><p>Paul has given two verses of command (15:1–2), and then he gives the reason. And the reason is six words:</p><p><b>“For even Christ did not please himself.”</b></p><p>Paul does <b>not</b> say, “because this makes for a harmonious church.”<br>He does <b>not</b> say, “because you are the mature one.”<br>He says: <b>because he did not.</b></p><p><b>★ Second light: the quotation is Psalm 69:9b</b></p><p>“The reproaches of those who reproached you fell on me.”</p><p>Note <b>the direction</b> of this line:</p><pre>the object of their abuse was      —  [GOD] (“those who reproached YOU”)\nand that abuse finally landed on   —  [CHRIST]</pre><p>The meaning is: <b>people were abusing God. And the abuse landed on him.</b></p><p><b>★ Third light: Psalm 69 in the New Testament</b></p><table><tr><th>Reference</th><th>Quotation</th></tr><tr><td><b>John 2:17</b></td><td>Psalm 69:9<b>a</b>, “zeal for your house will consume me”</td></tr><tr><td><b>Romans 15:3</b></td><td>Psalm 69:9<b>b</b>, “the reproaches of those who reproached you fell on me”</td></tr><tr><td><b>John 15:25</b></td><td>Psalm 69:4, “they hated me without a cause”</td></tr><tr><td><b>Matthew 27:34, 48</b></td><td>Psalm 69:21 (the gall and the vinegar)</td></tr></table><p><b>The earliest church evidently read the whole of Psalm 69 as the psalm of the suffering Messiah.</b></p>","exp":"<p><b>What the text plainly says:</b> Christ did not please himself; he bore the reproaches that were properly aimed at God.</p><p><b>What may fairly be drawn from it:</b> a person who does not know <b>what he bore for me</b> will find it very hard to lay down one small thing for a brother.</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ὅσα γὰρ προεγράφη, εἰς τὴν ἡμετέραν διδασκαλίαν ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.</p>","lit":"<p>“For <b>whatever was written before</b> was written <b>for our instruction</b>, so that through the <b>endurance</b> and the <b>encouragement</b> of the Scriptures we might <b>keep hold of hope</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>written before</td><td>προεγράφη</td><td>proegraphē</td><td>G4270</td><td><b>written beforehand</b></td></tr><tr><td>instruction</td><td>διδασκαλία</td><td>didaskalia</td><td>G1319</td><td>teaching</td></tr><tr><td>endurance</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td><b>standing firm under a weight</b> (the word of 5:3–4)</td></tr><tr><td>encouragement</td><td>παράκλησις</td><td>paraklēsis</td><td>G3874</td><td>παρά + καλέω: <b>called to one’s side</b> (see below)</td></tr></table>","gram":"<p><b>★ First light: why does Paul insert a doctrine of Scripture here?</b></p><p>15:4 looks like a digression. In fact it follows directly from 15:3:</p><pre>15:3  Paul quotes a [PSALM] to prove that Christ did not please himself\n  ↓\n15:4  “whatever was written before was written FOR OUR INSTRUCTION”</pre><p>Paul is saying: <b>that Old Testament verse I just quoted — that is not ancient history. It was written for us.</b></p><p><b>★ Second light: paraklēsis — “called to your side”</b></p><p>The word is παρά (beside) + καλέω (to call). Literally: <b>to call someone to your side, to stand with them, to hold them up</b>.<br>(And the title of the Spirit, παράκλητος, “the Counsellor” — John 14:16 — is the same root.)</p><p><b>“Encouragement” is not a few kind words. It is coming and standing beside you.</b></p><p><b>★ Third light: hypomonē — the word from chapter 5</b></p><pre>5:3–4  “suffering produces ENDURANCE (ὑπομονή), endurance character, character HOPE (ἐλπίς)”\n  ↓\n15:4   “through the ENDURANCE and encouragement of the Scriptures we might have HOPE (ἐλπίδα)”</pre><p>Both verses end at the same place: <b>hope</b>.<br>Chapter 5: <b>suffering</b> produces hope.<br>Chapter 15: <b>Scripture</b> produces hope.</p><p><b>★ Fourth light: a very practical observation</b></p><p>Set in the context of chapters 14–15, this verse has a very concrete edge:</p><p>A group of people are arguing about <b>food and days</b> — and Paul says: <b>go and read the Scriptures.</b></p><p><b>Not to find evidence for who is right, but to receive endurance and encouragement, so that you may have hope.</b></p>","exp":"<p>15:4 looks like a digression — in fact it follows straight on from 15:3.</p><p>Paul has just quoted a psalm (Psalm 69:9) to prove that Christ did not please himself, and then he says:</p><p><b>That is not ancient history. That was written for us.</b></p><p><b>What the text plainly says:</b> the Old Testament Scriptures were written for our instruction; they produce endurance and encouragement, and so give us hope.</p><p><b>What may fairly be drawn from it:</b> this verse gives “the Bible is my standard” <b>a full sequence</b>:</p><pre>Scripture  →  endurance + encouragement  →  hope</pre><p><b>The end of reading Scripture is not information. It is hope.</b></p><p><b>⚠ And in the setting of chapters 14–15, this verse has a very practical edge:</b></p><p>A group of people are quarrelling about food and days — <b>and Paul says: go and read the Scriptures.</b></p><p>Not to find evidence for who is right, but to receive endurance and encouragement, so that they may have hope.</p>"},{"a":5,"z":6,"star":true,"grk":"<p>5 ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ Χριστὸν Ἰησοῦν, 6 ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.</p>","lit":"<p>5 “May <b>the God of endurance and encouragement</b> <b>grant</b> you <b>to think the same thing</b> among one another, according to Christ Jesus;”</p><p>6 “so that <b>with one mind</b> and <b>with one mouth</b> you may glorify the God and Father of our Lord Jesus Christ.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>grant</td><td>δῴη</td><td>dōē</td><td>G1325</td><td>δίδωμι</td><td><b>optative: may he grant</b></td><td>see below — crucial</td></tr><tr><td>same mind</td><td>τὸ αὐτὸ φρονεῖν</td><td>—</td><td>G5426</td><td>φρονέω</td><td><b>to think the same thing</b></td><td>same phrase as 12:16</td></tr><tr><td>with one accord</td><td>ὁμοθυμαδόν</td><td>homothymadon</td><td>G3661</td><td>ὁμός (same) + θυμός (<b>impulse, passion</b>)</td><td><b>one shared impulse</b></td><td>—</td></tr><tr><td>with one mouth</td><td>ἐν ἑνὶ στόματι</td><td>—</td><td>G4750</td><td>—</td><td><b>with one mouth</b></td><td>—</td></tr></table>","gram":"<p><b>★★ First light: dōē is optative — unity is asked for, not achieved</b></p><p>This is the most important grammatical observation in the passage.</p><p>The verb δῴη in 15:5 is <b>optative</b> — meaning <b>“may he grant.”</b></p><p>Paul does <b>not</b> say, “you must work hard at being of one mind.”<br>He says: <b>“May the God of endurance and encouragement grant you to be of the same mind.”</b></p><p>This matters enormously: <b>unity is not a technique. It is a gift.</b></p><p>Paul has just spent a whole chapter on “do not judge, do not despise” (chapter 14) — and here, <b>he prays.</b></p><p><b>★ Second light: to auto phronein — “to think the same thing”</b></p><p>Paul has already used this phrase in 12:16: “be of <b>the same mind</b> toward one another.”</p><p>And φρονέω we have tracked through Romans:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td>8:5</td><td><b>setting the mind</b> on the flesh / on the Spirit</td></tr><tr><td>12:3</td><td>do not <b>think</b> of yourself more highly than you ought to <b>think</b></td></tr><tr><td>12:16</td><td>do not <b>set your mind</b> on high things</td></tr><tr><td><b>15:5</b></td><td><b>be of the same mind</b> toward one another</td></tr></table><p>φρονέω is not “holding identical opinions.” It is <b>having the heart set in the same direction</b>.</p><p><b>★ Third light: an important qualifier — “according to Christ Jesus”</b></p><p>The Greek is κατὰ Χριστὸν Ἰησοῦν — <b>“according to Christ Jesus.”</b></p><p>That qualifier matters: <b>what Paul asks for is not a unity of “everything the same,” but a unity “according to Christ.”</b></p><p><b>★ Fourth light: homothymadon — “one shared impulse”</b></p><p>The word is ὁμός (same) + θυμός (<b>passion, impulse, drive</b>). It occurs <b>more than ten times in Acts</b>, and is almost the signature word of the early church:</p><p>Acts 1:14, “these all continued <b>with one accord</b> in prayer”<br>Acts 2:46, “continuing daily <b>with one accord</b> in the temple”<br>Acts 4:24, “they raised their voice to God <b>with one accord</b>”</p><p><b>★ Fifth light: the picture of “one mouth”</b></p><p>ἐν ἑνὶ στόματι — literally <b>“in one mouth.”</b></p><p>This is a picture of <b>worship</b>: a crowd of people — Jews and Gentiles, strong and weak — <b>making one sound</b>.</p>","exp":"<p>15:5–6 give <b>the purpose</b> of the whole of chapter 14.</p><p>Why did Paul want them to accept one another?</p><p>Not so that “the church would be more peaceful.”<br>But so that <b>“with one mind and one mouth you may glorify God.”</b></p><p><b>The goal of unity is not unity. It is worship.</b></p>"},{"a":7,"z":7,"star":true,"grk":"<p>Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ὑμᾶς εἰς δόξαν τοῦ θεοῦ.</p>","lit":"<p>“Therefore <b>take one another to yourselves</b>, <b>just as Christ also took you to himself</b> — to the glory of God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>accept</td><td>προσλαμβάνεσθε</td><td>proslambanesthe</td><td>G4355</td><td><b>to take to oneself</b> (the word of 14:1, 14:3)</td></tr><tr><td>just as</td><td>καθώς</td><td>kathōs</td><td>G2531</td><td><b>just as, after the pattern of</b></td></tr><tr><td>to the glory of God</td><td>εἰς δόξαν τοῦ θεοῦ</td><td>—</td><td>G1391</td><td>so th
