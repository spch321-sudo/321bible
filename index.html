 his face, and 1 Corinthians 5 says 'put the wicked man away'.","pos":[["The core truth of the gospel","Never yield","Galatians 2:11–14; Galatians 1:8–9 'let him be accursed'"],["Open, unrepented sin","Must be addressed","1 Corinthians 5:1–13"],["Disputable matters","Accept, do not judge, lay down your rights","Romans 14; Romans 15:7; 1 Corinthians 8–10"]],"con":["One test: do those who differ still act 'to the Lord' and give thanks to God? (14:6)","The test in 16:17 is 'contrary to the teaching you learned' plus 'serving their own appetite' — not 'disagrees with me'","Better to be humble about where the line falls than to push a brother out"],"say":"Paul had three modes: never yield on the core truth; deal with open sin; and on disputable matters — welcome one another.","care":"Do not name specific present-day controversies from the pulpit. People will identify themselves, and you may create a new division."},{"id":"ISS06","t":"Phoebe and Junia","r":"16:1, 16:7","ch":[16],"why":"16:1 calls Phoebe a diakonos; 16:7 says Junia is 'of note among the apostles'.","pos":[["Junia is a woman","The judgement of most scholars today","'Junia' was a common woman's name; the masculine 'Junias' has virtually no attestation in ancient sources; Chrysostom took her as a woman"],["'Notable among the apostles'","One reading","They were themselves apostles"],["'Well known to the apostles'","Another reading","They were not apostles, but the apostles knew them well"]],"con":["Phoebe held a real place of service in the church at Cenchreae","She was very likely the one who carried this letter (16:1–2 has the form of a letter of commendation)","Paul held them in high regard and remembered what they had done","Andronicus and Junia were his kinsfolk, his fellow prisoners, and in Christ before he was"],"say":"Junia was most likely a woman; and what 'of note among the apostles' means is something godly scholars understand in more than one way.","care":"Traditions differ on the question of women in office. You may state your own church's position, but do not claim the text plainly settles it."},{"id":"ISS07","t":"Observing days, and the Sabbath","r":"14:5","ch":[14],"why":"Paul says one person esteems one day above another, another esteems every day alike — and he does not decide between them.","pos":[["The Lord's Day / Sabbath still binds","The Ten Commandments are moral law","14:5 refers to Jewish festivals and fast days, not the fourth commandment"],["All days alike","Paul lists days among disputable matters","Colossians 2:16–17: festivals, new moons and Sabbaths are 'a shadow of things to come'"],["A middle position","The principle abides; the form is fulfilled","The principle of Sabbath (rest and worship) stands; its Old Covenant form is fulfilled in Christ"]],"con":["Paul does not settle it here. He says only: 'Let each man be fully assured in his own mind' (14:5)","The question itself models the chapter's principle: if Paul did not close the case, we should be slower still"],"say":"Paul himself left this one open. All he says is: let each person be fully convinced in his own mind.","care":"You may describe your own church's practice, but do not declare that believers who see it differently are disobeying Scripture."}],"terrain":{"points":[[1,52,"1:18","wrath revealed","low"],[3,88,"3:20","every mouth","bot"],[3.5,18,"3:21","but now","top"],[5,26,"5:8","how much more",""],[7,92,"7:24","wretched man","bot"],[8,8,"8:1","now","top"],[11,20,"11:33","oh, the depth","top"],[12,42,"12:1","therefore",""],[15,38,"15:7","accept one another",""],[16,30,"16:27","glory to God","top"]]},"serm":{}}</script>
<script>/* ===== 321 Bible Study | Romans ===== */

Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;

}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };

function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ===== terrain ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H = 96, pad = 14;
  const x = c => pad + (c - 1) / 15 * (W - pad * 2);
  const y = v => 10 + v / 100 * (H - 26);
  let d = `M ${x(1)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(16)} ${y(30)}`;
  const labs = P.filter(p => p[4]).map(p => {
    const yy = p[4] === 'bot' ? y(p[1]) + 11 : y(p[1]) - 6;
    return `<text class="tlab ${p[4] === 'top' ? 'hi' : ''}" x="${x(p[0]).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="middle">${esc(p[3])}</text>`;
  }).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  return `<div class="terrain"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Terrain of the whole letter">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">Two lowest points · two “now”s · one “therefore”</p></div>`;
}

/* ===== exposition drawer (six layers) ===== */
let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>Romans ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ Key passage　' : ''}Chapter ${v.ch}</p>
    ${L(1, 'Scripture', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, 'Greek', v.grk, 'grk') : ''}
    ${v.lit ? L(3, 'Literal', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, 'Key words', v.key) : ''}
    ${v.gram ? L(5, 'Grammar', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, 'Exposition', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ Previous</button>` : ''}

    <button class="btn" onclick="go('course',${v.ch})">Chapter lesson</button></div>`;
  sheet(h);
}

const TTS_DB = 'r321en_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* clean up the text before reading aloud */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, 'and').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;|&gt;/g, ' ');
  t = t.replace(/\*\*/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // spoken form for references: 8:28 → chapter eight verse twenty-eight
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    'chapter ' + a + ' verse ' + b + (c ? ' to ' + c : ''));
  t = t.replace(/\b321\b/g, 'three two one').replace(/\b920\b/g, 'nine two oh').replace(/\b235\b/g, 'two three five');
  // don't read the Greek aloud (it comes out badly)
  t = t.replace(/[\u0370-\u03FF\u1F00-\u1FFF][\u0370-\u03FF\u1F00-\u1FFF\s,.·'’]*/g, ' ');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){ return String(parseInt(n, 10)); }
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('.!?;\n'.includes(ch) && buf.length >= 140){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let AU = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'' };
function audioEl(){
  if (!AU){ AU = new Audio(); AU.preload = 'auto'; AU.setAttribute('playsinline',''); }
  return AU;
}
async function speak(text, title){
  if (!S.set.human) return sayNative(text);
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:chunks, i:0, title:title || 'Reading' };
  drawBar();
  const a = audioEl(); a.pause();
  try {
    toast('Preparing audio…');
    const blobs = [];
    const CONC = 6;
    let next = 0, fail = false;
    await new Promise(res => {
      let running = 0, done = 0;
      const pump = () => {
        if (my !== SPK.tok) return res();
        while (running < CONC && next < chunks.length){
          const k = next++; running++;
          ttsFetch(chunks[k]).then(b => { blobs[k] = b; }, () => { fail = true; })
            .then(() => { running--; done++;
              if (done === chunks.length) res(); else pump(); });
        }
      };
      pump();
    });
    if (my !== SPK.tok) return;
    if (fail || blobs.filter(Boolean).length === 0) throw new Error('fetch failed');
    const url = URL.createObjectURL(new Blob(blobs.filter(Boolean), { type:'audio/mpeg' }));
    a.src = url;
    a.onended = () => { if (my === SPK.tok) stopSpeak(); };
    a.onerror = () => { if (my === SPK.tok){ stopSpeak(); sayNative(text); } };
    await a.play();
    drawBar();
  } catch(e){
    if (my !== SPK.tok) return;
    stopSpeak();
    toast('Human voice unavailable — using the device voice');
    sayNative(text);
  }
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('This device does not support speech');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'en-US'; u.rate = 0.98 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /en[-_]US|en[-_]GB/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function stopSpeak(){
  SPK.tok++; SPK.on = false; SPK.pause = false;
  try { audioEl().pause(); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  drawBar();
}
function togglePause(){
  const a = audioEl();
  if (SPK.pause){ a.play(); SPK.pause = false; } else { a.pause(); SPK.pause = true; }
  drawBar();
}
function drawBar(){
  let el = $('#spkbar');
  if (!SPK.on){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'spkbar'; el.className = 'spkbar';
    document.body.appendChild(el);
  }
  el.innerHTML = `<span class="dot"></span><b>${esc(SPK.title)}</b>
    <button onclick="togglePause()">${SPK.pause ? '▶' : '⏸'}</button>
    <button onclick="stopSpeak()">✕</button>`;
}

const mkHas = k => Object.prototype.hasOwnProperty.call(S.mk, k);
const mkNote = k => (S.mk[k] && S.mk[k].n) || '';
function mkTap(k, el){
  if (mkHas(k)) return mkSheet(k);
  S.mk[k] = { n:'', at:Date.now() }; save();
  if (el && el.classList) el.classList.add('hl'); else render();
  toast('Highlighted  ·  tap again to write a reflection');
}
function mkSheet(k){
  const cur = mkNote(k), src = mkText(k);
  sheet(`<h4>✍️ Write your reflection</h4>
    <div class="mkq">${esc(src).slice(0, 300)}</div>
    <textarea class="note" id="mkin" placeholder="What is the Holy Spirit saying to you in this line?">${esc(cur)}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn pri" onclick="mkSave('${k}')">Save</button>
      <button class="btn" onclick="askXz(mkText('${k}'), 'My reflection: ' + (document.getElementById('mkin')||{}).value)">✨ Ask Sage</button>
      <button class="btn" onclick="mkDel('${k}')">Remove highlight</button>
    </div>`);
  setTimeout(() => { const i = $('#mkin'); if (i) i.focus(); }, 60);
}
function mkSave(k){
  const v = ($('#mkin') || {}).value || '';
  S.mk[k] = { n:v.trim(), at:Date.now() }; save();
  $('#sheet').classList.remove('on'); render(); toast('Reflection saved');
}
function mkDel(k){ delete S.mk[k]; save(); $('#sheet').classList.remove('on'); render(); toast('Highlight removed'); }
function mkText(k){
  const p = k.split('|');
  if (p[0] === 'v'){ const [c, v] = p[1].split(':'); return (D.txt[c] || [])[+v - 1] || ''; }
  const b = VMAP[p[1]]; if (!b) return '';
  const html = b[p[2]] || '';
  const paras = html.split(/<\/p>/).map(x => x.replace(/<[^>]+>/g, '').trim()).filter(Boolean);
  return paras[+p[3]] || '';
}
/* make every <p> in the exposition HTML tappable */
function tagParas(html, kp){
  if (!html) return '';
  let i = -1;
  return html.replace(/<p>([\s\S]*?)<\/p>/g, (m, inner) => {
    i++; const k = kp + '|' + i, on = mkHas(k);
    const note = on && mkNote(k)
      ? `<div class="mknote"><b>Reflection</b>　${esc(mkNote(k))}
         <button class="mkask" onclick="event.stopPropagation();askXz(mkText('${k}'),'My reflection: ${escA(mkNote(k))}')">✨ Ask Sage</button></div>` : '';
    return `<p class="mkp${on ? ' hl' : ''}" onclick="mkTap('${k}',this)">${inner}</p>${note}`;
  });
}
const escA = s => String(s || '').replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/\n/g, ' ').slice(0, 200);

/* My highlights & reflections */
function vMarks(){
  setTitle('My highlights & reflections', false);

function exportMarks(){
  let t = '# My Highlights & Reflections | 321 Bible Study · Romans\n\n';
  Object.keys(S.mk).sort().forEach(k => {
    t += `## Romans ${k.split('|')[1]}\n\n> ${mkText(k)}\n\n`;
    if (mkNote(k)) t += `**Reflection:** ${mkNote(k)}\n\n`;
  });

  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'my-highlights-and-reflections.md'; a.click();

async function xzCall(){
  XZ.busy = true; drawXz();
  if (navigator.onLine === false){
    XZ.msgs.push({ role:'assistant', text:'There is no connection right now, so Sage cannot be with you for the moment.\nDon\'t forget — the best companion is the Holy Spirit and the word of God. You can pour out your heart to the Lord directly, any time.' });
    XZ.busy = false; return drawXz();
  }
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => { try { ctrl.abort(); } catch(e){} }, 40000) : null;
  try {
    const res = await fetch(SVC.xz, { method:'POST', headers:{ 'Content-Type':'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model:SVC.model, max_tokens:1000, system:xzSystem(),
        messages: XZ.msgs.slice(-12).map(m => ({ role:m.role, content:m.text })) }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let t = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    if (!t) t = 'Sage cannot find the right words just now — but God\'s word never fails. Would you like to ask that another way?';
    XZ.msgs.push({ role:'assistant', text:t });
  } catch(e){
    XZ.msgs.push({ role:'assistant', text:(e && e.name === 'AbortError' ? 'That took longer than expected, so Sage has paused.' : 'Sage cannot reach the server just now. Please try again shortly.')
      + '\nDon\'t forget — the best companion is the Holy Spirit and the word of God. You can pour out your heart to the Lord directly, any time.' });
  } finally { if (timer) clearTimeout(timer); }
  XZ.busy = false; drawXz();
}

/* ===== full-screen modes: pulpit teleprompter + group leading ===== */
let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode === 'tele' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = '《' + meta(n).t + '》';
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = 'Chapter ' + n + ' · Group';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}
function fClose(){
  F = null; clearInterval(FT); FT = null;
  document.documentElement.setAttribute('data-tele', '0');
  $('#full').classList.remove('on'); keepAwake(false);
}
async function keepAwake(on){
  try {
    if (on && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen');
    else if (WAKE) { WAKE.release(); WAKE = null; }
  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // a beat in the manuscript = a page break
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', 'Text　' + p[1]], ['p', p[2]]] }));
  ps.push({ blocks:[['h','Conclusion'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'1. Opening　10 min', q:m.grp[0], tip:'Let everyone say something. Leader goes first.' });
  ps.push({ sec:900, ttl:'2. Reading together　15 min', q:'「' + m.mv.t + '」　' + m.mv.r,
            tip:'Read the chapter\'s key text around the circle. When you finish, sit in silence for thirty seconds before anyone explains anything.' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'3. Discussion　question ' + (i + 2), q,
    tip: i === 1 ? 'This is the deepest question. Leader, answer first yourself. Do not press for detail. If someone weeps, stop and pray for them — do not move on.'
       : i === 3 ? 'Ask someone in the group to check in on day seven.' : '' }));
  ps.push({ sec:900, ttl:'4. Practice and prayer　15 min', q:m.prac.main,
            tip:'One practice each — only one. Pair up for the day-seven check-in, then pray for one another.' });
  return ps;
}

}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('That is the last section'); return; }
  F.i = i; fDraw();
}
$('#fx').onclick = () => { if (confirm('Exit this mode?')) fClose(); };
$('#fprev').onclick = () => fGo(-1);
$('#fnext').onclick = () => fGo(1);
$('#fplay').onclick = () => { F.run = !F.run; $('#fplay').textContent = F.run ? 'Pause' : 'Resume'; };
$('#fA').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); };
document.addEventListener('keydown', e => {
  if (!F) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fGo(1); }
  if (e.key === 'ArrowLeft') fGo(-1);
  if (e.key === 'Escape') fClose();
});

/* ===== search ===== */
function vSearch(){
  setTitle('Search', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">Search</p>
    <input class="sbox" id="sq" placeholder="Verse, Greek word, key term… (e.g. 8:28, selflessness, οἰκέω)" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">Searches all sixteen lessons, the Scripture text, the word tracks and the disputed-passage maps.</p></div>`;
  if (q.length >= 1){
    const hit = (t) => t && t.indexOf(q) >= 0;
    const mk = (t) => esc(t).split(esc(q)).join('<mark>' + esc(q) + '</mark>');
    let r = '';
    // verses
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">Scripture　${vs.length}</h3>`;
      vs.slice(0, 15).forEach(v => r += `<button class="chrow" onclick="openV('${v[0]}')">
        <span class="chn">${esc(v[0])}</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(v[1])}</b></span></button>`);
      if (vs.length > 15) r += `<p class="xs muted">(showing the first 15)</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">My highlights　${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 40))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 30))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">Exposition　${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 38))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">(showing the first 12)</p>`; }
    // chapters
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(hit) || c.grp.some(hit) || c.safe.some(hit) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">Lessons　${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // word tracks
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">Word tracks　${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">Gk</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)}　·　${mk(t.ins)}</span></span></button>`); }
    // disputed passages
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">Disputed　${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">Romans ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">Nothing found for “${esc(q)}”. Try a reference (8:28), a Greek word (οἰκέω), or a key term (selflessness, accept, carry).</p>`;
  }
  return h;
}
function bindSearch(){
  const el = $('#sq'); if (!el) return;
  el.oninput = () => { R.q = el.value; const p = el.selectionStart; render(); const e2 = $('#sq'); if (e2){ e2.focus(); try { e2.setSelectionRange(p, p); } catch(x){} } };
}

/* ===== first run: role ===== */
function vRole(){
  setTitle('321 Bible Study', true);
  return `<div class="sect"><p class="eyebrow">Before you begin</p>
    <h2 class="big">How will you mainly use this?</h2>
    <p class="sm muted">This only sets your starting point. Nothing is locked, and you can change it any time under “Mine”.</p></div>
  <button class="chrow" onclick="setRole('read')"><span class="chn">①</span>
    <span style="flex:1"><b>Reading on my own</b><span class="s">Start with the card; Greek switched off</span></span></button>
  <button class="chrow" onclick="setRole('group')"><span class="chn">②</span>
    <span style="flex:1"><b>Leading a group</b><span class="s">Go to the group page and leading mode</span></span></button>
  <button class="chrow" onclick="setRole('preach')"><span class="chn">③</span>
    <span style="flex:1"><b>Preaching</b><span class="s">Greek, sermon and pulpit checks all on</span></span></button>`;
}
function setRole(r){
  S.set.role = r;
  if (r === 'read') S.set.grk = 0;
  if (r === 'preach') S.set.grk = 1;
  save(); go(r === 'read' ? 'today' : 'course');
  toast('All set — you can change this any time under “Mine”');
}

/* ===== branding: icon, manifest, splash ===== */
(function brand(){
 try {
  const src = '../icons/apple-touch-icon.png';
  const b = $('#brand'), sp = $('#splashIcon');
  if (b && src) b.src = src;
  if (sp && src) sp.src = src;

  // manifest (generated so that “Add to Home Screen” gets the right name and icon)
  try {
    const i192 = document.querySelector('link[sizes="192x192"]');
    const mf = {
      name: '321 Bible Study | Romans',
      short_name: '321 Bible Study',
      description: 'All sixteen chapters of Romans: exposition, sermon outlines, and living out the 3-2-1.',
      start_url: '.', scope: '.', display: 'standalone',
      orientation: 'portrait', background_color: '#12305E', theme_color: '#1F4D3D',
      lang: 'zh-Hant',
      icons: [
        { src: src, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      ],
    };
    const el = $('#MF');
    if (el) el.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
  } catch(e){}

  // splash: hold a moment so the logo is seen
  const s = $('#splash');
  if (s){
    const off = () => { s.classList.add('gone'); setTimeout(() => { try { s.remove(); } catch(e){} }, 500); };
    setTimeout(off, 1100);
    if (s.addEventListener) s.addEventListener('click', off);
  }
 } catch(e){}
})();
</script>
