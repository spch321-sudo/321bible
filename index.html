 First light: how Paul uses Deuteronomy 30</b></p><p>Deuteronomy 30:11–14 originally speaks of <b>the commandment</b>:</p><p>“It is not in heaven, that you should say, ‘Who will <b>go up to heaven</b> for us and bring it to us?’… Neither is it beyond the sea… <b>the word is very near you</b>, in your <b>mouth</b> and in your <b>heart</b>.”</p><p>And Paul does three things with it:</p><table><tr><th>What Paul does</th><th>Content</th></tr><tr><td>changes “beyond the sea” to “down into the abyss”</td><td>because he is pointing to <b>the resurrection of Christ</b></td></tr><tr><td>adds two glosses</td><td>“that is, to bring Christ down” / “that is, to bring Christ up from the dead”</td></tr><tr><td>identifies “the word” with the gospel</td><td>“that is, the word of faith which we preach”</td></tr></table><p><b>Is Paul entitled to do this?</b> (See the disputed material for the full discussion.) Three key observations here:</p><p><b>①</b> The context of Deuteronomy 30 is itself a new-covenant promise:<br>Deuteronomy 30:6, “the LORD your God will <b>circumcise</b> your heart… to love the LORD your God with all your heart.” <b>That passage is already about God acting himself so that people can obey.</b></p><p><b>②</b> The point of Deuteronomy 30 is “you need not go up or across”:<br>the emphasis of the original is not the content of the law but <b>“God has already brought the word to you.”</b> That is exactly what Paul seizes on.</p><p><b>③</b> Paul’s “do not say in your heart” in 10:6 comes from Deuteronomy 9:4:<br>Deuteronomy 9:4, “<b>Do not say in your heart</b>… ‘Because of my righteousness the LORD has brought me in to possess this land.’”</p><p><b>That detail is superb:</b> Paul fuses Deuteronomy 9:4 (do not think it is because of your righteousness) with Deuteronomy 30:12–14 (the word is very near you) — <b>aimed precisely at 10:3, “seeking to establish their own righteousness.”</b></p><p><b>★ Second light: the picture of ascending and descending</b></p><pre>“Who will ascend into heaven?”  —  must I climb up and pull him down?\n“Who will descend into the abyss?” —  must I dig down and haul him up?</pre><p><b>Paul is saying: both of those things have already been done.</b></p><p>The incarnation — <b>he has already come down.</b><br>The resurrection — <b>he has already come up.</b></p><p><b>You do not have to do either.</b></p><p><b>★ Third light: rhēma, not logos</b></p><p>Paul uses <b>ῥῆμα — a word that is spoken</b>.</p><p>That runs straight on into 10:14, “how shall they believe in him of whom they have not <b>heard</b>?” and 10:17, “faith comes by <b>hearing</b>.”</p><p><b>The gospel is a word to be said aloud and heard.</b></p>","exp":"<p>10:6–8 is the warmest passage in the chapter.</p><p>Paul is saying: <b>the religious instinct always assumes we must do something enormous in order to draw near to God.</b> Ascend to heaven. Descend to the abyss. Climb the stairs. Walk the hard road.</p><p>And the gospel says: <b>the word — is already at your lips.</b></p>"},{"a":9,"z":10,"star":true,"grk":"<p>9 ὅτι ἐὰν ὁμολογήσῃς ἐν τῷ στόματί σου κύριον Ἰησοῦν καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ· 10 καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν.</p>","lit":"<p>9 “Because if you <b>confess with your mouth</b> that <b>Jesus is Lord</b>, and <b>believe in your heart</b> that God raised him from the dead, <b>you will be saved</b>.”</p><p>10 “For with the heart one believes, unto <b>righteousness</b>; and with the mouth one confesses, unto <b>salvation</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>confess</td><td>ὁμολογέω</td><td>homologeō</td><td>G3670</td><td>ὁμός (same) + λόγος (word)</td><td><b>to say the same thing, to align oneself publicly</b></td><td>see below</td></tr><tr><td>Lord</td><td>κύριος</td><td>kyrios</td><td>G2962</td><td>—</td><td>master, sovereign</td><td><b>see below — crucial</b></td></tr><tr><td>raised</td><td>ἤγειρεν</td><td>ēgeiren</td><td>G1453</td><td>ἐγείρω</td><td><b>to raise up</b> (God is the subject)</td><td>—</td></tr></table>","gram":"<p><b>★ First light: homologeō — “to say the same thing”</b></p><p>The word is ὁμός (same) + λέγω (to say). Literally: <b>to say the same thing — to agree publicly, to stand openly on the same side.</b></p><p><b>So “confessing Jesus as Lord” is not a religious slogan. It is publicly declaring which side you are on.</b></p><p><b>★★ Second light: the weight of kyrios (the deepest point in this chapter)</b></p><p>“Confess with your mouth <b>Jesus as Lord</b> (κύριον Ἰησοῦν).”</p><p>That sentence carries two kinds of weight:</p><p><b>① Political weight</b><br>The imperial loyalty formula of the day was <b>Kyrios Kaisar — “Caesar is Lord.”</b> To say “Jesus is Lord” in the city of Rome was to say: <b>there is another Lord, and he is greater than Caesar.</b></p><p><b>② Theological weight (deeper still)</b><br>Look at what Paul quotes in 10:13:</p><p><b>“Everyone who calls on the name of the Lord will be saved.” (Joel 2:32)</b></p><p>And the “Lord” of Joel 2:32, in Hebrew, is <b>YHWH</b>.</p><p><b>This is the most staggering thing in the chapter:</b></p><p>Joel says: everyone who calls on the name of <b>YHWH</b> will be saved.<br>Paul says: everyone who calls on the name of <b>the Lord</b> will be saved — and the Lord in this context is <b>Jesus</b> (10:9).</p><p><b>Paul applies to Jesus, without hesitation, a text that in the Old Testament belongs to YHWH alone.</b></p><p><b>★ Third light: the order differs between 10:9 and 10:10</b></p><pre>10:9   mouth confesses → heart believes\n10:10  heart believes  → mouth confesses</pre><p>Why? Two main explanations:</p><table><tr><th>Explanation</th><th>Comment</th></tr><tr><td><b>a chiasm</b></td><td>10:9 follows the order of the quotation in 10:8 (“in your <b>mouth</b>, in your <b>heart</b>”); 10:10 follows the <b>logical</b> order (believing first, then confessing)</td></tr><tr><td><b>stressing that the two are inseparable</b></td><td>Paul deliberately scrambles the order to show these are not “two steps”</td></tr></table><p>I judge the first explanation fits best: 10:9 follows <b>the order of the text quoted</b> (Deuteronomy 30:14, “in your mouth and in your heart”), while 10:10 follows <b>the actual logic</b>.</p><p><b>★ Fourth light: two passives in 10:10</b></p><p>“With the heart one <b>believes</b> (πιστεύεται)… with the mouth one <b>confesses</b> (ὁμολογεῖται)” — both verbs are in <b>passive or impersonal form</b>.</p><p>Paul does not say “you must believe, you must confess” (which would read like two conditions). He uses <b>a descriptive</b> construction: “with the heart, it is believed unto righteousness; with the mouth, it is confessed unto salvation.”</p>","exp":"<p>10:9–10 is often misread as “two steps to salvation”: “Step one: confess with your mouth. Step two: believe in your heart. Do both, and you are saved.”</p><p>That reading has two problems:</p><p><b>① It turns the gospel into a formula.<br>② It does not fit Paul’s teaching elsewhere</b> (3:28, “a man is justified by faith” — faith alone is named).</p><p>The right understanding is: <b>10:9–10 describes the inside and the outside of one thing.</b></p><p><b>Believing in the heart</b> — is <b>the root</b> of that thing.<br><b>Confessing with the mouth</b> — is <b>the fruit</b> of it.</p><p>A person who truly believes in his heart cannot go on forever without confessing; and a person who confesses only with his mouth, with nothing in his heart, does not have faith.</p><p>(The Lord Jesus said: “Everyone who confesses me before men, I will also confess before my Father who is in heaven.” Matthew 10:32)</p>"},{"a":11,"z":13,"star":true,"grk":"<p>12 οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·</p>","lit":"<p>11 “For the Scripture says: ‘<b>Everyone who believes in him will not be put to shame.</b>’”</p><p>12 “For there is <b>no distinction</b> between Jew and Greek — for the same Lord is Lord of all, <b>rich toward all who call on him</b>.”</p><p>13 “For ‘<b>everyone who calls on the name of the Lord will be saved</b>.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>distinction</td><td>διαστολή</td><td>diastolē</td><td>G1293</td><td><b>a division, a line drawn</b> (<b>the same word as 3:22!</b>)</td></tr><tr><td>rich</td><td>πλουτῶν</td><td>ploutōn</td><td>G4147</td><td>πλοῦτος (wealth): <b>to be rich toward, generous toward</b></td></tr><tr><td>call on</td><td>ἐπικαλουμένους</td><td>epikaloumenous</td><td>G1941</td><td><b>to call on someone’s name</b></td></tr></table>","gram":"<p><b>★ First light: Paul adds a word</b></p><p>10:11 quotes Isaiah 28:16. And the Septuagint of Isaiah 28:16 reads:</p><p>“He who believes will not act hastily.”</p><p>When Paul quotes it, he adds one word at the front:</p><p><b>“EVERYONE (πᾶς) who believes in him will not be put to shame.”</b></p><p><b>Paul added a word when he quoted Scripture. And the word he added was — “everyone.”</b></p><p><b>★ Second light: diastolē — the word from 3:22</b></p><pre>3:22   “there is NO DISTINCTION (διαστολή)”  —  because [ALL HAVE SINNED] (3:23)\n10:12  “there is NO DISTINCTION (διαστολή)”  —  because [THE SAME LORD IS LORD OF ALL]</pre><p><b>This is the most beautiful matched pair in the letter:</b></p><p><b>Before sin, no distinction. Before grace, no distinction either.</b></p><p><b>★★ Third light: the Old Testament source of 10:13 (the highest christology in the chapter)</b></p><p>“Everyone who calls on the name of the Lord will be saved” — quoted from <b>Joel 2:32</b>.</p><p>And the “Lord” of Joel, in Hebrew, is <b>YHWH</b>.</p><p>In what context does Paul quote it?</p><p>10:9, “if you confess with your mouth <b>Jesus as Lord</b>.”<br>10:12, “<b>the same Lord</b> is Lord of all.”<br>10:13, “everyone who calls on <b>the name of the Lord</b> will be saved.”</p><p><b>Paul takes a promise that in the Old Testament belongs to YHWH alone, and applies it directly to Jesus.</b></p><p><b>This is one of the highest christological declarations in the New Testament — and Paul writes it so naturally that it seems to him a matter of course.</b><br>(Peter quotes the same passage of Joel at Pentecost: Acts 2:21.)</p><p><b>★ Fourth light: three “everyone”s</b></p><pre>10:11  EVERYONE (πᾶς) who believes in him\n10:12  ALL (πάντας) who call on him\n10:13  EVERYONE (πᾶς) who calls on the name of the Lord</pre><p><b>Paul strikes that word three times in three verses.</b></p>","exp":"<p>10:13 is one of the simplest and widest promises in the whole Bible:</p><p><b>“EVERYONE who calls on the name of the Lord will be saved.”</b></p><p>Notice how wide it is:</p><p>· it does not say “everyone who is good”<br>· it does not say “everyone who understands theology”<br>· it does not say “everyone with a religious background”<br>· it says only: <b>everyone who calls</b>.</p><p>And “to call on” (ἐπικαλέω) means something very simple: <b>to shout his name.</b></p>"},{"a":14,"z":15,"star":true,"grk":"<p>14 Πῶς οὖν ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ἀκούσωσιν χωρὶς κηρύσσοντος; 15 πῶς δὲ κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; καθὼς γέγραπται· ὡς ὡραῖοι οἱ πόδες τῶν εὐαγγελιζομένων [τὰ] ἀγαθά.</p>","lit":"<p>14 “<b>How</b>, then, shall they call on him in whom they have not believed? And <b>how</b> shall they believe in him of whom they have not heard? And <b>how</b> shall they hear <b>without someone preaching</b>?”</p><p>15 “And <b>how</b> shall they preach <b>unless they are sent</b>? As it is written: ‘<b>How beautiful are the feet</b> of those who bring good news!’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>how</td><td>πῶς</td><td>pōs</td><td>G4459</td><td><b>how is it possible</b> (four times!)</td></tr><tr><td>preach</td><td>κηρύσσω</td><td>kēryssō</td><td>G2784</td><td><b>to announce as a herald</b></td></tr><tr><td>be sent</td><td>ἀποσταλῶσιν</td><td>apostalōsin</td><td>G649</td><td>ἀποστέλλω (<b>the root of ἀπόστολος, apostle</b>): <b>to be sent out</b></td></tr><tr><td>beautiful</td><td>ὡραῖος</td><td>hōraios</td><td>G5611</td><td>ὥρα (season): <b>in season, ripe, timely and lovely</b></td></tr></table>","gram":"<p><b>★ First light: the chain of four “how”s, reasoning backwards</b></p><pre>call on ← believe ← hear ← preach ← be sent\nπῶς      πῶς       πῶς    πῶς</pre><p>Paul reasons backwards from effect to cause, and stops at:</p><p><b>“And how shall they preach unless they are sent?”</b></p><p><b>The bottom link of that chain is: someone has to be sent out.</b></p><p><b>★ Second light: apostellō — the verb behind “apostle”</b></p><p>The verb for “sent,” ἀποστέλλω, is the root of <b>ἀπόστολος (apostle)</b>. It means <b>one who is despatched with a commission</b>.</p><p>And the verb is <b>passive</b>: <b>not “you decide to go,” but “you are sent.”</b></p><p><b>★ Third light: hōraios — “beautiful in season”</b></p><p>“How <b>beautiful</b> are the feet” — the root of ὡραῖος is ὥρα (hour, season). Its original sense is <b>in season, ripe, exactly at the right time</b>.</p><p><b>The picture is of a fruit ripening in exactly the right season.</b></p><p>And what is the context of Isaiah 52:7?</p><p>It is exiled Israel, waiting for news of return.</p><p><b>Isaiah 52:7, “How beautiful upon the mountains are the feet of him who brings good news, who proclaims peace… who says to Zion, ‘Your God reigns!’”</b></p><p>The picture is this: <b>a besieged city, and people on the wall watching the distant hills. And then — over the ridge, a running figure appears.</b></p><p><b>Before he has said a word, they have already seen his feet.</b></p><p><b>★ Fourth light: why are feet beautiful?</b></p><p>Feet are among the least beautiful parts of the body. The feet of someone who has run a long road are dirty, blistered and covered in dust.</p><p><b>But to the people waiting on the wall — those feet are the most beautiful in the world.</b></p><p><b>Because those feet have brought the news.</b></p>","exp":"<p>10:14–15 is one of the most important missionary passages in the Bible. And its logic comes <b>straight out of chapter 9</b>:</p><pre>chapter 9:  God’s sovereign election\n  ↓\n10:1:       therefore I pray for them\n  ↓\n10:13:      everyone who calls on the name of the Lord will be saved\n  ↓\n10:14:      and yet — how shall they believe in him of whom they have not heard?\n  ↓\ntherefore — [SOMEONE MUST GO]</pre><p><b>Paul evidently saw no conflict between God’s sovereignty and the urgency of mission. For him, the first was the ground of the second.</b></p>"},{"a":16,"z":17,"star":false,"grk":"<p>17 ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος Χριστοῦ.</p>","lit":"<p>16 “But <b>they did not all listen and obey</b> the good news. For Isaiah says: ‘Lord, <b>who has believed our report</b>?’”</p><p>17 “<b>So then</b>, faith comes <b>from hearing</b>; and hearing, <b>through the word of Christ</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>obeyed</td><td>ὑπήκουσαν</td><td>hypēkousan</td><td>G5219</td><td><b>to hear from underneath</b> (<b>the same root as 5:19 and 6:16!</b>)</td></tr><tr><td>hearing</td><td>ἀκοή</td><td>akoē</td><td>G189</td><td><b>what is heard / the message reported</b></td></tr><tr><td>the word of Christ</td><td>ῥήματος Χριστοῦ</td><td>—</td><td>G4487</td><td><b>the word of Christ</b> (see below)</td></tr></table>","gram":"<p><b>★ First light: hypakouō — “hearing from underneath” again</b></p><p>“They have not all <b>obeyed</b> the gospel” — ὑπακούω.</p><p>We have tracked this word:</p><pre>5:19   “by the OBEDIENCE (ὑπακοή) of one”  —  Christ listening from underneath\n6:16   “slaves of OBEDIENCE (ὑπακοή)”\n10:16  “they have not all OBEYED (ὑπακούω) the gospel”</pre><p><b>Paul uses “obey” rather than “believe” — because the essence of faith is listening from underneath.</b></p><p><b>★ Second light: 10:16 quotes Isaiah 53:1</b></p><p>“Lord, who has believed our report?”</p><p>That is <b>the opening line of the Servant Song</b>.</p><p><b>The first sentence of Isaiah 53 is a sigh: “Who has believed?”</b></p><p>Paul is saying: the prophet already knew that not everyone would believe.</p><p><b>★ Third light: two ways to read “the word of Christ”</b></p><table><tr><th>Reading</th><th>Comment</th></tr><tr><td><b>the word about Christ</b></td><td>objective genitive: the message preached concerns Christ</td></tr><tr><td><b>the word Christ speaks</b></td><td>subjective genitive: Christ himself speaks in the preacher’s words</td></tr></table><p>Both have supporters, and both fit Paul’s theology.</p><p><b>The second is particularly lovely: when the preacher opens his mouth, it is Christ who is speaking.</b><br>(Compare 2 Corinthians 5:20, “God making his appeal through us.”)</p>","exp":"<p>10:17 is the Bible’s most concise answer to the question of where faith comes from:</p><pre>faith ← hearing ← the word of Christ</pre><p><b>And this verse says two things at once:</b></p><p><b>① Faith is not generated from within — it comes from hearing.<br>② Therefore someone must speak.</b></p>"},{"a":18,"z":20,"star":false,"grk":"<p>18 …εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν. 19 …ἐγὼ παραζηλώσω ὑμᾶς ἐπ' οὐκ ἔθνει, ἐπ' ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς. 20 …εὑρέθην [ἐν] τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.</p>","lit":"<p>18 “But I say: <b>did they not hear?</b> <b>Indeed they did</b> — ‘their <b>sound</b> went out into all the earth, and their words to <b>the ends of the world</b>.’”</p><p>19 “But I say: <b>did Israel not know?</b> <b>First Moses says</b>: ‘I will <b>provoke you to jealousy</b> by those who are not a nation; by a <b>foolish nation</b> I will <b>anger</b> you.’”</p><p>20 “And Isaiah <b>is very bold</b> and says: ‘<b>I was found by those who did not seek me</b>; <b>I became manifest to those who did not ask for me</b>.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>provoke to jealousy</td><td>παραζηλώσω</td><td>parazēlōsō</td><td>G3863</td><td>παρά + ζῆλος: <b>to stir up jealousy or zeal</b></td></tr><tr><td>is very bold</td><td>ἀποτολμᾷ</td><td>apotolma</td><td>G662</td><td><b>to dare to the utmost, to say it outright</b></td></tr></table>","gram":"<p><b>★ First light: parazēloō — the key to chapter 11</b></p><p>10:19 quotes Deuteronomy 32:21: “I will <b>provoke them to jealousy</b> by those who are not a nation.”</p><p>The word (παραζηλόω) is παρά + ζῆλος (zeal, jealousy). <b>And ζῆλος is the very word of 10:2, “they have a zeal for God”!</b></p><p>That word becomes decisive in chapter 11:</p><p>11:11, “through their trespass salvation has come to the Gentiles, to <b>provoke them to jealousy</b> (παραζηλόω).”<br>11:14, “if somehow I may <b>provoke to jealousy</b> (παραζηλόω) those who are my flesh, and save some of them.”</p><p><b>God’s strategy is: through the Gentiles receiving mercy, to stir up longing in Israel.</b></p><p><b>★ Second light: apotolmaō — “very bold”</b></p><p>“Isaiah is <b>very bold</b>” — this word occurs only here in the New Testament. It means <b>to dare to the limit, to come right out with it</b>.</p><p>Paul is saying: Isaiah said something extremely daring —</p><p><b>“I was found by those who did not seek me.” (Isaiah 65:1)</b></p><p>And that sentence answers perfectly to Romans 3:11:</p><pre>3:11   “there is none who seeks after God”\n10:20  “I was found by those who did not seek me”</pre><p><b>Since no one seeks God — the only remaining possibility is that God comes looking for people.</b></p>","exp":"<p>Verses 18–20 answer an excuse: “perhaps they simply never had the chance?”</p><p>Paul’s answer is three “no”s:</p><pre>v.18  did they not hear?   —  they did\nv.19  did they not know?   —  Moses said it long ago\nv.20  is this something new? —  Isaiah said it long ago</pre><p><b>What the text plainly says:</b> the message did indeed go out; and the Gentiles receiving mercy was foretold long before in the Old Testament (Deuteronomy 32:21; Isaiah 65:1).</p><p><b>What may fairly be drawn from it:</b> verse 20 forms a beautiful pair with 3:11 —</p><p>3:11, “<b>there is none who seeks after God.</b>”<br>10:20, “<b>I was found by those who did not seek me.</b>”</p><p><b>Since no one seeks God, the only remaining possibility is that God comes looking for people.</b></p><p><b>⚠ Pulpit note:</b> 10:18 quotes Psalm 19:4 about the sound going out into all the earth. <b>It must not be used to argue that “the gospel has already reached the whole world, so mission is no longer necessary”</b> — because Paul himself, in 15:20–24, was still planning to go to Spain, to places where Christ had not been named.</p>"},{"a":21,"z":21,"star":true,"grk":"<p>πρὸς δὲ τὸν Ἰσραὴλ λέγει· ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.</p>","lit":"<p>“But concerning Israel he says: ‘<b>All day long</b> I have <b>stretched out my hands</b> to a people who <b>refuse to be persuaded</b> and <b>talk back</b>.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>all day long</td><td>ὅλην τὴν ἡμέραν</td><td>holēn tēn hēmeran</td><td>G3650</td><td>—</td><td><b>a whole day, from morning to night</b></td><td>—</td></tr><tr><td>stretched out</td><td>ἐξεπέτασα</td><td>exepetasa</td><td>G1600</td><td>ἐκ + πετάννυμι (to spread)</td><td><b>to open out fully, to spread wide</b></td><td>see below</td></tr><tr><td>disobedient</td><td>ἀπειθοῦντα</td><td>apeithounta</td><td>G544</td><td>ἀ + πείθω (to persuade)</td><td><b>refusing to be persuaded</b></td><td>the same word as 2:8</td></tr><tr><td>contrary</td><td>ἀντιλέγοντα</td><td>antilegonta</td><td>G483</td><td>ἀντί + λέγω</td><td><b>to speak against, to answer back</b></td><td>—</td></tr></table>","gram":"<p><b>★ First light: ekpetannymi — “stretched out the hands”</b></p><p>The verb means <b>to open out fully, to spread wide</b> (as of spreading wings, or unfurling a sail).</p><p>And “hands” is <b>plural</b>.</p><p>What posture is that?</p><p><b>Not a pointing finger. Not a clenched fist. It is the posture of arms spread wide, waiting for someone to come home.</b></p><p><b>★ Second light: holēn tēn hēmeran — all day long</b></p><p>“All day long” is not “sometimes.” It is <b>from morning to night, without once lowering them</b>.</p><p><b>★ Third light: apeitheō — “refusing to be persuaded”</b></p><p>This word does not mean “not knowing.” It is <b>ἀ + πείθω (to persuade)</b> — <b>refusing to be persuaded</b>.</p><p>And we met it in 2:8: “to those who are self-seeking and <b>do not obey</b> (ἀπειθοῦσιν) the truth, but obey unrighteousness.”</p><p><b>The problem is not lack of information. It is unwillingness.</b></p><p><b>★ Fourth light: the last picture in the chapter is God’s posture</b></p><p>This is enormously important.</p><p>Paul has spent a whole chapter on <b>human responsibility</b>:</p><p>· you must believe (10:9)<br>· you must confess (10:9)<br>· you must call on him (10:13)<br>· someone must go and preach (10:14–15)</p><p>And then, in the last verse, <b>the camera turns</b>.</p><p>From the hands of people, to <b>the hands of God</b>.</p><p><b>And God’s hands are open wide. All day long.</b></p>","exp":"<p>10:21 quotes Isaiah 65:2. And the context of that passage is:</p><p><b>Isaiah 65:2, “I have spread out my hands all day long to a rebellious people — who walk in a way that is not good, after their own thoughts.”</b></p><p><b>It is an indictment.</b></p><p>But the form that indictment takes is — <b>a pair of hands held out all day.</b></p><p><b>If there is a name on your heart today — someone you have waited for a long time — remember this verse.</b></p><p><b>You have waited a long while for him.<br>And God — his hands have already been open all day.</b></p>"}],"11":[{"a":1,"z":2,"star":true,"grk":"<p>1 Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν. 2 οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω.</p>","lit":"<p>1 “I say then: has God <b>pushed away</b> his people? <b>By no means!</b> For I myself am an Israelite, of the seed of Abraham, of the tribe of Benjamin.”</p><p>2 “God has not pushed away his people <b>whom he foreknew</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>cast away</td><td>ἀπώσατο</td><td>apōsato</td><td>G683</td><td>ἀπό + ὠθέω (to push)</td><td><b>to push away, to shove off</b></td><td>see below</td></tr><tr><td>foreknew</td><td>προέγνω</td><td>proegnō</td><td>G4267</td><td>πρό + γινώσκω</td><td><b>knew beforehand</b></td><td><b>the same word as 8:29!</b></td></tr></table>","gram":"<p><b>★ First light: the Old Testament background of apōtheomai</b></p><p>The word (ἀπό + ὠθέω, “to push”) means <b>to push away, to shove off</b>.</p><p>And it appears in the Septuagint in two extremely important places:</p><p><b>1 Samuel 12:22</b>, “the LORD will not <b>forsake</b> his people, for his great name’s sake.”<br><b>Psalm 94:14</b> (LXX 93:14), “the LORD will not <b>cast off</b> his people, nor will he forsake his inheritance.”</p><p>Paul’s question in 11:1 is almost a direct citation of the wording of Psalm 94:14.</p><p><b>He is saying: Scripture answered this question long ago.</b></p><p><b>★ Second light: proginōskō — the word from chapter 8</b></p><pre>8:29   “those whom he FOREKNEW (προέγνω), he also predestined…”\n  ↓\n11:2   “God has not cast away his people whom he FOREKNEW (προέγνω).”</pre><p>The same word.</p><p>Chapter 8: the <b>people</b> God foreknew, he will bring to glory.<br>Chapter 11: the <b>nation</b> God foreknew, he has not pushed away.</p><p><b>★ Third light: Paul offers himself as the first piece of evidence</b></p><p>“For <b>I myself am</b> an Israelite.”</p><p>This is an extremely simple and extremely powerful argument:</p><p><b>You ask whether God has cast off Israel? Then — who is writing this letter?</b></p>","exp":"<p>Chapter 11 opens with a question — and it is a question forced out by the last verse of chapter 10.</p><p>10:21, “<b>all day long</b> I have stretched out my hands to a disobedient and contrary people.”</p><p>Those hands were out all day. And they would not come.</p><p>So: <b>is God about to lower them?</b></p><p><b>What the text plainly says:</b> God has not pushed away (ἀπωθέομαι) his people; and one piece of the evidence is Paul himself.</p><p><b>What may fairly be drawn from it:</b> the verb Paul uses is <b>the Old Testament’s own wording</b> — Psalm 94:14, “the LORD will not cast off his people”; 1 Samuel 12:22, “he will not forsake you, for his great name’s sake.”<br><b>He is saying: Scripture answered this question long ago.</b></p><p>And “whom he <b>foreknew</b>” (προγινώσκω) in verse 2 is the very word of 8:29.</p><p><b>What that means for us: if God could go back on his word to Israel, then the golden chain of chapter 8 would be loose too. And he will not.</b></p>"},{"a":2,"z":5,"star":true,"grk":"<p>4 ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ. 5 οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ' ἐκλογὴν χάριτος γέγονεν·</p>","lit":"<p>2b “Or do you not know what the Scripture says <b>in the passage about Elijah</b> — how he <b>pleads with God against Israel</b>:”</p><p>3 “‘Lord, they have killed your prophets and torn down your altars; <b>I alone am left</b>, and they are seeking my life.’”</p><p>4 “But what does <b>the divine answer</b> say to him? — ‘<b>I have kept for myself seven thousand men</b> who have <b>not bowed the knee to Baal</b>.’”</p><p>5 “So too, <b>at this present time</b>, there is a <b>remnant</b> <b>according to the election of grace</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>the answer of God</td><td>χρηματισμός</td><td>chrēmatismos</td><td>G5538</td><td><b>a divine oracle, God’s formal reply</b> (<b>only here in the NT</b>)</td></tr><tr><td>I have reserved</td><td>κατέλιπον</td><td>katelipon</td><td>G2641</td><td><b>I have kept for myself</b> (<b>active — the subject is God</b>)</td></tr><tr><td>remnant</td><td>λεῖμμα</td><td>leimma</td><td>G3005</td><td><b>what is left over</b></td></tr><tr><td>election of grace</td><td>ἐκλογὴν χάριτος</td><td>eklogēn charitos</td><td>G1589 / G5485</td><td>the election of grace</td></tr></table>","gram":"<p><b>★ First light: Elijah’s situation</b></p><p>When Elijah said these words, he had just won an overwhelming victory on Mount Carmel (1 Kings 18).</p><p>Then Jezebel sent him a single message, and he fled into the wilderness, sat down under a broom tree, and asked to die (1 Kings 19:4).</p><p>And what he said to God was:</p><p><b>“I alone am left.”</b></p><p><b>This is a spiritual giant, speaking out of the deepest loneliness.</b></p><p><b>And God’s reply is not a rebuke.</b></p><p><b>★ Second light: katelipon emautō — “I have kept for MYSELF”</b></p><p>Notice two details in this verb:</p><pre>κατέλιπον  —  [ACTIVE VOICE], and the subject is [GOD]\nἐμαυτῷ     —  [FOR MYSELF]</pre><p><b>Those seven thousand did not happen not to bow to Baal. They were kept, by God, for himself.</b><br>(The Hebrew of 1 Kings 19:18 likewise reads “I have <b>left for myself</b> seven thousand in Israel.”)</p><p><b>★ Third light: “so too at this present time” in 11:5</b></p><p>“So too at this present time, there is a remnant <b>according to the election of grace</b>.”</p><p>Paul is saying: it was so in Elijah’s day. And now — <b>it is so still.</b></p><p><b>There is a remnant today as well.</b></p>","exp":"<p>When Elijah said this, he had just won a total victory on Mount Carmel. Then Jezebel sent one message — and he fled into the wilderness and sat under a broom tree, asking to die.</p><p><b>“I alone am left.”</b></p><p><b>And God’s answer is not a rebuke.</b></p><p><b>What the text plainly says:</b> God kept seven thousand for himself; and so too there is now a remnant according to the election of grace.</p><p><b>What may fairly be drawn from it:</b> the verb is <b>active</b>, the subject is <b>God</b>, and he adds <b>“for myself”</b> (κατέλιπον ἐμαυτῷ).</p><p><b>Those seven thousand did not happen not to bow to Baal — they were kept by God for himself.</b></p><p><b>And Elijah had no idea.</b></p><p><b>⚠ Pastoral note:</b> if someone feels today that “I am the only one left,” the most important word in this passage is not “be strong.” It is:</p><p><b>What you do not know is more than what you know.</b></p>"},{"a":6,"z":6,"star":true,"grk":"<p>εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται χάρις.</p>","lit":"<p>“But if it is by grace, then it is no longer of works; <b>otherwise grace is no longer grace</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>grace</td><td>χάρις</td><td>charis</td><td>G5485</td><td><b>freely given, incapable of being earned</b></td></tr><tr><td>works</td><td>ἔργα</td><td>erga</td><td>G2041</td><td>work, what is done</td></tr><tr><td>otherwise</td><td>ἐπεί</td><td>epei</td><td>G1893</td><td><b>otherwise, if it were not so</b> (introducing the counter-proof)</td></tr><tr><td>is no longer</td><td>οὐκέτι γίνεται</td><td>ouketi ginetai</td><td>G3765 / G1096</td><td><b>no longer becomes / is</b></td></tr></table>","gram":"<p><b>★ This is the Bible’s cleanest definitional statement about grace</b></p><p>Paul’s logic is spotless:</p><p><b>grace + a little works = not grace</b></p><p><b>Grace cannot be diluted.</b> Add one drop of “because I…” and <b>by definition</b> it is no longer grace.</p><p>This is exactly consistent with chapter 4:</p><p>4:4, “to the one who works, the wage is not counted as grace, but as what is owed.”</p>","exp":"<p>11:6 is the cleanest definition of grace in the whole Bible. And its logic is not moral but <b>definitional</b>:</p><p><b>grace + a little works = not grace</b></p><p><b>What the text plainly says:</b> if it is of grace, it is no longer of works; otherwise grace is no longer grace.</p><p><b>What may fairly be drawn from it:</b> Paul is not saying “mixing in some works makes it slightly worse.” He is saying: <b>once you mix it, the thing has changed its name.</b></p><p>Add one drop of “but I did…” and <b>by definition</b> it has already stopped being grace.</p><p><b>⚠ Pastoral note:</b> this verse is most often used on other people; it is most needed on ourselves.</p><p>Ask one question: <b>is there a sentence in my heart that begins, “but after all, I…”?</b></p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 …ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν, 8 …ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.</p>","lit":"<p>7 “What then? <b>What Israel was seeking, it did not obtain</b>; but <b>the elect obtained it</b>, and the rest <b>were hardened over</b> (grew a callus).”</p><p>8 “As it is written: ‘God gave them <b>a spirit of stupor</b>, <b>eyes that do not see</b> and <b>ears that do not hear</b>, <b>to this very day</b>.’”</p><p>9 “And David says: ‘Let their <b>table</b> become a <b>snare</b> and a <b>trap</b>, a <b>stumbling block</b> and a <b>recompense</b> to them;’”</p><p>10 “‘let their eyes be <b>darkened so as not to see</b>, and <b>bend their backs continually</b>.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>hardened</td><td>ἐπωρώθησαν</td><td>epōrōthēsan</td><td>G4456</td><td>πῶρος (<b>a callus, a stone</b>): <b>to grow hard, to form a callus</b></td></tr><tr><td>spirit of stupor</td><td>πνεῦμα κατανύξεως</td><td>pneuma katanyxeōs</td><td>G2659</td><td><b>a spirit of numbness, of torpor</b></td></tr></table>","gram":"<p><b>★ First light: the difference between pōroō and sklērynō</b></p><p>Romans uses two different words for hardening:</p><table><tr><th>Word</th><th>Reference</th><th>Picture</th></tr><tr><td><b>σκληρύνω</b></td><td>9:18 (Pharaoh)</td><td><b>to harden, to become hard</b></td></tr><tr><td><b>πωρόω</b></td><td>11:7, 11:25</td><td>πῶρος = <b>a stone, a callus</b> — <b>like skin thickening over</b></td></tr></table><p>The picture in πωρόω is striking: <b>it is a callus formed by long friction.</b><br>(In medical usage it is also used of the bony callus that forms as a fracture knits.)</p><p><b>★ Second light: this is the heaviest passage in the chapter</b></p><p>11:8–10 quotes Deuteronomy 29:4, Isaiah 29:10 and Psalm 69:22–23 — all words of judgement.</p><p><b>Paul does not soften it. He says honestly: the rest were hardened.</b></p><p>But note what comes next, in 11:11:</p><p><b>“Did they stumble so as to fall? By no means!”</b></p><p><b>Having said the heaviest thing in the chapter, Paul turns immediately toward hope.</b></p>","exp":"<p>Verses 7–10 are <b>the heaviest</b> passage in the chapter. Paul does not soften it. He even quotes three Old Testament passages to press it harder (Deuteronomy 29:4; Isaiah 29:10; Psalm 69:22–23).</p><p><b>What the text plainly says:</b> what Israel sought it did not obtain; the elect obtained it; the rest were hardened.</p><p><b>What may fairly be drawn from it:</b> the root of “hardened” (πωρόω) is <b>πῶρος = a stone, a callus</b> — <b>the thickening that grows from long friction</b>. That differs from σκληρύνω in 9:18 (to become hard): this is <b>growing a callus</b>.</p><p>And the balance that must be kept in view:</p><table><tr><th>Reference</th><th>Statement</th></tr><tr><td>11:8</td><td><b>God gave</b> them a spirit of stupor</td></tr><tr><td>11:20</td><td><b>because of unbelief</b> they were broken off</td></tr><tr><td>11:23</td><td><b>if they do not continue in unbelief</b>, they will be grafted in again</td></tr></table><p><b>Paul says both sides within one chapter. Any reading that presents only one side is incomplete.</b></p><p><b>⚠ Pastoral note:</b> <b>you must not stop reading here.</b> The very next verse (11:11) asks: “Did they stumble so as to fall? <b>By no means!</b>”</p>"},{"a":11,"z":12,"star":true,"grk":"<p>11 …μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν εἰς τὸ παραζηλῶσαι αὐτούς.</p>","lit":"<p>11 “I say then: <b>did they stumble in order that they might fall down</b>? <b>By no means!</b> Rather, through their <b>trespass</b> salvation has come to the Gentiles, <b>to provoke them to jealousy</b>.”</p><p>12 “Now if their <b>trespass</b> means <b>riches</b> for the world, and their <b>loss</b> riches for the Gentiles — <b>how much more their fullness</b>!”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>stumbled</td><td>ἔπταισαν</td><td>eptaisan</td><td>G4417</td><td>πταίω</td><td><b>to trip, to stumble</b></td><td>see below</td></tr><tr><td>fall</td><td>πέσωσιν</td><td>pesōsin</td><td>G4098</td><td>πίπτω</td><td><b>to fall down</b> (<b>and not get up</b>)</td><td>see below</td></tr><tr><td>provoke to jealousy</td><td>παραζηλῶσαι</td><td>parazēlōsai</td><td>G3863</td><td>παρά + ζῆλος</td><td><b>to stir up jealousy or longing</b></td><td><b>the same word as 10:19</b></td></tr><tr><td>fullness</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td>πληρόω (to fill)</td><td><b>fullness, full number</b></td><td>the same word as 11:25</td></tr></table>","gram":"<p><b>★ First light: the crucial distinction between ptaiō and piptō</b></p><p>Paul has deliberately used two different verbs:</p><pre>ἔπταισαν (πταίω) —  [TO TRIP, TO STUMBLE]  —  you can get up again\nπέσωσιν (πίπτω)  —  [TO FALL DOWN]         —  down, and not rising</pre><p>So Paul’s question is:</p><p><b>“Did they stumble in order that they should go down and not get up?”</b><br>Answer: <b>By no means.</b></p><p><b>That distinction of verbs is the first ground of hope in this chapter.</b></p><p><b>★ Second light: parazēloō — the word from chapter 10</b></p><pre>10:19  “I will provoke you to jealousy (παραζηλόω) by those who are not a nation”\n  ↓\n11:11  “to provoke them to jealousy (παραζηλόω)”\n11:14  “if somehow I may provoke to jealousy (παραζηλόω) my own flesh”</pre><p><b>This is God’s strategy: through the Gentiles receiving mercy, to stir longing in Israel.</b></p><p>And that carries a direct implication for Gentile believers: <b>your receiving mercy exists, in part, to bring them back. So you have no room whatever to boast.</b></p><p><b>★ Third light: plērōma (fullness) — a key word in this chapter</b></p><p>It occurs once in 11:12 and once in 11:25:</p><pre>11:12  their (Israel’s) [FULLNESS]\n11:25  the [FULL NUMBER] (πλήρωμα) of the Gentiles</pre><p>Paul uses the same word of the “full number” of both groups.</p>","exp":"<p>The key to verse 11 lies in <b>two different verbs</b>.</p><pre>πταίω (stumble) —  to trip, to lose your footing  —  [YOU CAN STILL GET UP]\nπίπτω (fall)    —  to go down, to lie on the ground —  [YOU DO NOT GET UP]</pre><p>Paul asks: “Did they <b>stumble</b> in order that they should <b>go down and not rise</b>?” Answer: <b>by no means</b>.</p><p><b>What the text plainly says:</b> Israel’s trespass is not the end of the story; in God’s plan it has a purpose — that salvation should come to the Gentiles, and that Israel should be stirred to longing.</p><p><b>What may fairly be drawn from it:</b> <b>that distinction of verbs is the first ground of hope in the whole chapter.</b></p><p>And it has something to say to us too: <b>that person on your heart — he has stumbled. But that is not the same as being down and unable to rise.</b></p><p>And verse 12 is Paul’s argument from lesser to greater (the “how much more” of chapter 5):</p><p><b>If their failure brought blessing on that scale — what will their return bring?</b></p>"},{"a":13,"z":16,"star":false,"grk":"<p>13 Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν· ἐφ' ὅσον μὲν οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω, 15 εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;</p>","lit":"<p>13 “<b>I am speaking to you Gentiles.</b> Inasmuch as I am <b>an apostle to the Gentiles</b>, I <b>glorify my ministry</b> —”</p><p>14 “<b>if somehow I may provoke to jealousy those of my own flesh</b>, and <b>save some of them</b>.”</p><p>15 “For if their being <b>cast away</b> means the <b>reconciliation</b> of the world, what will their <b>being received</b> be but <b>life from the dead</b>?”</p><p>16 “If the <b>firstfruits of the dough</b> are holy, so is <b>the whole lump</b>; and if <b>the root</b> is holy, so are <b>the branches</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>magnify</td><td>δοξάζω</td><td>doxazō</td><td>G1392</td><td><b>to glorify, to hold in honour</b> (literally “I glorify my ministry”)</td></tr><tr><td>reconciliation</td><td>καταλλαγή</td><td>katallagē</td><td>G2643</td><td><b>reconciliation</b> (the same word as 5:10–11)</td></tr><tr><td>life from the dead</td><td>ζωὴ ἐκ νεκρῶν</td><td>zōē ek nekrōn</td><td>—</td><td><b>life out of the dead</b></td></tr><tr><td>firstfruits</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>the firstfruits</b> (the same word as 8:23)</td></tr></table>","gram":"<p><b>★ First light: Paul’s strategy in 11:13–14</b></p><p>“I am an apostle to the Gentiles, so I <b>glorify my ministry</b>, <b>if somehow</b> I may provoke my own flesh to jealousy and save some of them.”</p><p><b>This is a moving thing:</b> Paul threw himself into being an apostle to the Gentiles — partly in the hope that <b>when Jews saw Gentiles receiving it, they would long for it too</b>.</p><p><b>★ Second light: the two images of 11:16</b></p><pre>firstfruits (ἀπαρχή) / whole lump (φύραμα)  —  the offering of firstfruits (Numbers 15:20–21)\nroot (ῥίζα) / branches (κλάδοι)             —  introducing the olive tree that follows</pre><p>What does “the root” refer to? Two main readings:</p><table><tr><th>Reading</th><th>Comment</th></tr><tr><td><b>the patriarchs</b> (Abraham, Isaac, Jacob)</td><td>11:28, “beloved for the sake of the fathers,” supports this</td></tr><tr><td><b>God’s promise / the covenant</b></td><td>answering to 11:29, “the gifts and calling of God”</td></tr></table><p>The two readings converge: <b>the root is the promise God gave to the fathers.</b></p>","exp":"<p>The sentence in verse 13 is <b>the addressee statement</b> for the whole chapter:</p><p><b>“I am speaking to you Gentiles.”</b></p><p>That one line determines how 11:17–24 must be read — <b>it is a warning to Gentile believers, not a verdict on Jews.</b></p><p><b>What the text plainly says:</b> Paul takes his apostleship to the Gentiles seriously, partly in hope of stirring longing in his own people and saving some of them.</p><p><b>What may fairly be drawn from it:</b> this carries a direct implication for Gentile believers — <b>your receiving mercy exists, in part, to bring them back. So you have no room whatever to boast.</b></p><p><b>⚠ Pastoral note:</b> “that I may save <b>some</b> of them” — Paul does not exaggerate his own effectiveness. His language is very modest.</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου, 18 μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.</p>","lit":"<p>17 “But if some of the branches <b>were broken off</b>, and you, being <b>a wild olive</b>, <b>were grafted in</b> among them, and became a sharer in the rich sap of the olive root —”</p><p>18 “then <b>do not boast over those branches</b>. And if you do boast: <b>it is not you who carry the root, but the root that carries you</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>were broken off</td><td>ἐξεκλάσθησαν</td><td>exeklasthēsan</td><td>G1575</td><td>ἐκ + κλάω (to break)</td><td><b>were broken off</b> (passive)</td><td>—</td></tr><tr><td>wild olive</td><td>ἀγριέλαιος</td><td>agrielaios</td><td>G65</td><td>ἄγριος (wild)</td><td><b>a wild olive</b></td><td>—</td></tr><tr><td>were grafted in</td><td>ἐνεκεντρίσθης</td><td>enekentristhēs</td><td>G1461</td><td>ἐν + κεντρίζω (to prick in)</td><td><b>were grafted in</b> (passive)</td><td>occurs six times in this chapter</td></tr><tr><td>boast over</td><td>κατακαυχῶ</td><td>katakauchō</td><td>G2620</td><td>κατά + καυχάομαι</td><td><b>to boast against, to look down on</b></td><td>see below</td></tr><tr><td>carry</td><td>βαστάζεις</td><td>bastazeis</td><td>G941</td><td>βαστάζω</td><td><b>to bear a weight, to support</b></td><td>see below</td></tr></table>","gram":"<p><b>★ First light: two passives</b></p><pre>ἐξεκλάσθησαν —  [WERE] broken off\nἐνεκεντρίσθης —  [WERE] grafted in</pre><p>Both verbs are passive.</p><p><b>The branches did not fall off by themselves, and they did not climb up by themselves. Someone is doing this.</b></p><p><b>★ Second light: katakauchaomai — “to boast against”</b></p><p>This word is heavier than the ordinary “boast” (καυχάομαι):</p><p>κατά (against, down) + καυχάομαι (to boast) = <b>to boast against someone, to exalt yourself with another’s fall as your backdrop</b>.</p><p><b>What Paul forbids is not merely pride. It is using another person’s failure to raise your own height.</b></p><p><b>★★ Third light: bastazō — “to carry”</b></p><p>“It is not you who <b>carry</b> the root, but the root that <b>carries</b> you.”</p><p>βαστάζω means <b>to bear a weight, to hold something up</b>.<br>(Matthew 8:17, “he took our infirmities and <b>bore</b> our diseases”; Galatians 6:2, “<b>bear</b> one another’s burdens” — the same word.)</p><p><b>The picture is unmistakable: a branch never carries the root. The root carries the branch.</b></p><p><b>And if a branch begins to feel important — that only shows it has forgotten it was grafted in.</b></p><p><b>★ Fourth light: “the rich sap” (πιότης)</b></p><p>“A sharer in the <b>rich sap</b> of the olive root” — πιότης = <b>fatness, rich nourishment</b>.</p><p>The nourishment Gentile believers receive <b>comes from that root</b> — that is, from the promise God gave to Israel’s fathers.</p>","exp":"<p>11:17–18 is the heart of the chapter, and the main reason Paul wrote it.</p><p>11:13 said it plainly: <b>“I am speaking to you Gentiles.”</b></p><p>And Paul’s warning is:</p><p><b>You were grafted in.<br>The sap you are drinking comes from a root that is not yours.<br>So — say nothing. Do not boast.</b></p>"},{"a":19,"z":22,"star":true,"grk":"<p>20 …τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ὑψηλὰ φρόνει ἀλλὰ φοβοῦ· 22 ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ·</p>","lit":"<p>19 “You will say then: ‘<b>Branches were broken off so that I might be grafted in.</b>’”</p><p>20 “<b>Quite so.</b> They were broken off <b>because of unbelief</b>, and you <b>stand</b> <b>by faith</b>. <b>Do not be high-minded, but fear.</b>”</p><p>21 “For if God <b>did not spare the natural branches</b>, <b>neither will he spare you</b>.”</p><p>22 “See then the <b>kindness</b> and the <b>severity</b> of God: severity toward those who fell; but toward you, God’s kindness — <b>if you continue in his kindness</b>; otherwise <b>you also will be cut off</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>be high-minded</td><td>ὑψηλὰ φρόνει</td><td>hypsēla phronei</td><td>G5308 / G5426</td><td><b>to set the mind on high things</b> (φρονέω is the word of 8:5)</td></tr><tr><td>fear</td><td>φοβοῦ</td><td>phobou</td><td>G5399</td><td><b>to fear, to stand in awe</b> (imperative)</td></tr><tr><td>kindness</td><td>χρηστότης</td><td>chrēstotēs</td><td>G5544</td><td><b>the very word of 2:4!</b></td></tr><tr><td>severity</td><td>ἀποτομία</td><td>apotomia</td><td>G663</td><td>ἀπό + τέμνω (to cut): <b>the decisiveness of a clean cut</b> (<b>only here in the NT</b>)</td></tr></table>","gram":"<p><b>★ First light: apotomia — “cutting clean off”</b></p><p>The word is ἀπό (away) + τέμνω (to cut) — literally <b>the decisiveness of a clean cut</b>.</p><p>And it answers exactly to the verb in the same verse:</p><p>11:22, “otherwise you also <b>will be cut off</b> (ἐκκοπήσῃ).”</p><p><b>This word occurs only here in the New Testament. And it occurs inside a warning addressed to Gentile believers.</b></p><p><b>★ Second light: chrēstotēs — the word from chapter 2</b></p><pre>2:4    “do you despise the riches of his [KINDNESS] (χρηστότης), forbearance and patience,\n        not knowing that his kindness [IS LEADING YOU TO REPENTANCE]?”\n  ↓\n11:22  “the [KINDNESS] (χρηστότης) and severity of God… toward you, kindness —\n        [IF YOU CONTINUE IN HIS KINDNESS].”</pre><p><b>This link is extremely important:</b></p><p>Chapter 2: God’s kindness <b>is leading people to repentance</b>.<br>Chapter 11: God’s kindness is something <b>to be continued in</b>.</p><p><b>Kindness has never been a ground for complacency.</b></p><p><b>★ Third light: “do not be high-minded, but fear”</b></p><p>μὴ ὑψηλὰ φρόνει — “do not set your mind on high things.”</p><p>And φρονέω is the very word of 8:5, “<b>setting the mind</b> on the flesh / on the Spirit.”</p><p>Paul is saying: <b>do not let your mind drift upward.</b></p><p>(On how the warning of 11:20–22 is to be held together with assurance, see the disputed material.)</p>","exp":"<p>Verse 19 writes out the sentence in our hearts. We rarely say it aloud, but it is often there:</p><p><b>“Those branches were broken off so that I could be grafted in.”</b></p><p>In plain speech: <b>at least I am not one of them.</b></p><p>And Paul’s reply begins with one word: <b>“Quite so.”</b></p><p><b>He does not deny the fact.</b> He simply asks: <b>on what grounds does that make you exalt yourself?</b></p><p><b>What the text plainly says:</b> they were broken off because of unbelief and you stand by faith; so do not be high-minded but fear, and continue in God’s kindness.</p><p><b>What may fairly be drawn from it:</b> the opposite of “fear” (φοβοῦ) here is <b>“being high-minded,” not “assurance”</b> — so its sense is <b>reverence, sobriety, not daring to look down on anyone</b>, not “you must live in constant anxiety about whether you are saved.”</p><p>And χρηστότης (kindness) is the very word of 2:4: God’s kindness <b>leads to repentance</b>; it has never been a ground for complacency.</p><p><b>⚠ Pulpit note:</b> 11:22 <b>must not</b> be used to frighten believers (that would demolish the assurance of chapter 8), <b>and it must not</b> be diluted into something harmless (that would betray Paul’s intent).</p><p><b>The most faithful way to put it:</b> Paul gives warning and assurance together, and <b>God’s preserving is realised precisely through the believer’s reverent fear</b> (Philippians 2:12–13).</p>"},{"a":23,"z":24,"star":false,"grk":"<p>23 κἀκεῖνοι δέ, ἐὰν μὴ ἐπιμένωσιν τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ἐστιν ὁ θεὸς πάλιν ἐγκεντρίσαι αὐτούς. 24 εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.</p>","lit":"<p>23 “And they too, <b>if they do not remain in unbelief</b>, will <b>be grafted in</b>; for <b>God is able</b> to graft them in <b>again</b>.”</p><p>24 “For if you were <b>cut out of what is by nature a wild olive</b>, and <b>contrary to nature</b> were grafted into a cultivated olive — <b>how much more shall these, the natural branches, be grafted into their own olive tree</b>!”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>able</td><td>δυνατός</td><td>dynatos</td><td>G1415</td><td><b>having power, able</b></td></tr><tr><td>contrary to nature</td><td>παρὰ φύσιν</td><td>para physin</td><td>G5449</td><td><b>against nature, contrary to the ordinary course</b></td></tr></table>","gram":"<p><b>★ First light: “God is able” (δυνατὸς γάρ ἐστιν ὁ θεός)</b></p><p>This sentence answers across the letter to chapter 4:</p><p>4:21, “being fully assured that what God had promised, <b>he was able</b> (δυνατός) also to do.”</p><p><b>The God Abraham believed in — “who gives life to the dead and calls into being what does not exist” — is also able to graft broken branches back in.</b></p><p><b>★ Second light: para physin — Paul admits this is not how it is done</b></p><p>“You… <b>contrary to nature</b> were grafted into a cultivated olive.”</p><p>This matters: <b>Paul knows that ordinary grafting does not work this way.</b> He has deliberately used an unnatural grafting, and pointed it out himself.</p><p>Why?</p><p><b>Because the salvation of Gentiles is itself a “contrary to nature” thing.</b></p><p><b>And if God has already done the unnatural thing — of course he can do the natural one: graft the tree’s own branches back into their own tree.</b></p>","exp":"<p>The most important words in this paragraph are three: <b>“God is able.”</b></p><p>And that word (δυνατός) we met in chapter 4:</p><p>4:21, “being fully assured that what God had promised, <b>he was able</b> also to do.”</p><p><b>What the text plainly says:</b> if they do not remain in unbelief, God is able to graft them in again.</p><p><b>What may fairly be drawn from it:</b> the God who “gives life to the dead and calls into being what does not exist” (4:17) <b>can also graft a broken branch back on</b>.</p><p>And the “contrary to nature” of verse 24 (παρὰ φύσιν) is something <b>Paul admits himself</b> — he knows ordinary grafting does not work this way. He chose an unnatural grafting on purpose, because <b>the salvation of Gentiles is itself contrary to nature</b>.</p><p><b>⚠ Pastoral note:</b> the conditional clause in verse 23 (“if they do not <b>remain</b> in unbelief”) is given for hope, not for calculation.</p><p>Its use is this: <b>to make you go on praying for the person you had already given up on.</b></p>"},{"a":25,"z":27,"star":true,"grk":"<p>25 …ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ· 26 καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται…</p>","lit":"<p>25 “…that <b>a partial</b> hardening has come upon Israel, <b>until</b> the <b>full number</b> of the Gentiles has come in;”</p><p>26 “<b>and so</b> (καὶ οὕτως) all Israel will be saved…”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>mystery</td><td>μυστήριον</td><td>mystērion</td><td>G3466</td><td><b>what was hidden and has now been revealed</b></td></tr><tr><td>in part</td><td>ἀπὸ μέρους</td><td>apo merous</td><td>G3313</td><td><b>partially</b> (not wholly)</td></tr><tr><td>hardening</td><td>πώρωσις</td><td>pōrōsis</td><td>G4457</td><td><b>a callusing, a hardening</b> (the same root as 11:7)</td></tr><tr><td>fullness</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td><b>the full number</b> (the same word as 11:12)</td></tr><tr><td>and so</td><td>καὶ οὕτως</td><td>kai houtōs</td><td>G3779</td><td><b>and so / in this manner</b> (see below)</td></tr></table>","gram":"<p><b>★ First light: apo merous — “in part”</b></p><p>Paul does <b>not</b> say “Israel has been hardened.”</p><p>He says: <b>a partial</b> (ἀπὸ μέρους) hardening has come upon Israel.</p><p>That is consistent with 11:5, “there is a remnant”: <b>the hardening is partial, not total.</b></p><p><b>★ Second light: achri hou — “until”</b></p><p>“<b>Until</b> the full number of the Gentiles has come in.”</p><p><b>The word “until” implies a limit in time. That hardening is not a permanent state.</b></p><p><b>★★ Third light: kai houtōs — “and then,” or “and in this manner”?</b></p><p>This is the most decisive grammatical question in 11:26.</p><p>The basic sense of οὕτως is <b>“thus, in this manner”</b> (mode), not “then” (time).</p><table><tr><th>Reading</th><th>Rendering</th><th>Implication</th></tr><tr><td><b>temporal</b></td><td>“and then all Israel will be saved”</td><td><b>a future event</b> after the fullness of the Gentiles</td></tr><tr><td><b>modal</b> (the basic sense of οὕτως)</td><td>“<b>and in this way</b> all Israel will be saved”</td><td>salvation happens <b>through this process</b> (the provoking to jealousy)</td></tr></table><p>Most scholars acknowledge that the basic meaning of οὕτως is <b>manner</b>, while also noting that here it carries a temporal implication (because “until” precedes it).</p><p><b>★★ Fourth light: what does “all Israel will be saved” mean?</b></p><p>This is one of the most famous interpretive disputes in Romans. It must be presented fairly.</p><table><tr><th>View</th><th>Claim</th><th>Main grounds</th></tr><tr><td><b>A. A future national turning</b></td><td>after the fullness of the Gentiles, Israel will turn to Christ on a large scale</td><td>“until” implies a limit; the “fullness” and “acceptance” of 11:12, 15; “grafted in again” in 11:23–24</td></tr><tr><td><b>B. The total number of elect Jews through history</b></td><td>“all Israel” = all the Jews God elects, saved gradually through history</td><td>the “remnant” of 11:5; οὕτως denotes manner; avoids conflict with 9:6, “not all are Israel”</td></tr><tr><td><b>C. “Israel” = the people of God, including the church</b></td><td>“all Israel” means all the elect, Jew and Gentile</td><td>Galatians 6:16, “the Israel of God”; Romans 9:6</td></tr></table><p><b>A and B are the two main evangelical positions today; C also has representatives in the Reformed tradition (Calvin inclined toward this kind of reading).</b></p><p><b>Assessment.</b></p><p><b>Stronger reasons for A:</b><br>· “Israel” in this chapter (11:1, 7, 25, 26) consistently means <b>ethnic Israel</b> — if verse 26 suddenly meant the church, the sense would break<br>· 11:12 “their fullness” and 11:15 “their acceptance” imply something not yet happened<br>· 11:28, “as regards election, they are beloved for the sake of the fathers”</p><p><b>Stronger reasons for B:</b><br>· the basic meaning of οὕτως is <b>manner</b><br>· it sits more easily with 9:6, “not all who are of Israel are Israel”</p><p><b>My judgement:</b> A fits the semantic flow of this chapter better (the consistent use of “Israel”), but <b>B rests on solid grammatical ground and is a fully orthodox position.</b></p><p><b>★ Pulpit note:</b> this is <b>a long-standing difference among godly scholars</b>; neither side may be called heretical or unbiblical.</p><p><b>And more importantly: whichever position you hold, the pastoral point of this chapter is the same</b> — <b>“do not boast over the branches.”</b></p>","exp":"<p>This is <b>the most disputed</b> passage in the chapter. And before reading it, note two qualifiers.</p><p><b>① “In part” (ἀπὸ μέρους)</b> — Paul does <b>not</b> say “Israel has been hardened.” He says: <b>a partial</b> hardening has come upon Israel.</p><p><b>② “Until” (ἄχρι οὗ)</b> — that is <b>a limit</b>. That hardening is <b>not a permanent state</b>.</p><p><b>What the text plainly says:</b> a partial hardening has come upon Israel until the fullness of the Gentiles comes in; and God will fulfil what he promised in Isaiah 59:20–21 and 27:9.</p><p><b>What may fairly be drawn from it:</b> the precise reference of “all Israel will be saved” <b>has been understood differently by godly interpreters through the centuries</b> (see the disputed material).</p><p><b>⚠ Pulpit note (the most important in this chapter):</b></p><p><b>①</b> There are three main readings of this verse; <b>no one of them may be declared the only correct answer</b>.<br><b>②</b> Whichever position you hold, <b>what Paul says to Gentile believers is exactly the same</b>: <b>“Do not boast over the branches.” (11:18)</b><br><b>③ ❌❌ This passage is about redemptive history, not modern politics.</b> Paul says nothing here about any modern state’s borders or policies. A pastor may hold personal political views, but <b>he must not present his own political position as the teaching of Scripture.</b></p>"},{"a":28,"z":29,"star":true,"grk":"<p>29 ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.</p>","lit":"<p>29 “For the <b>gifts</b> and the <b>calling</b> of God are <b>not things he goes back on</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>irrevocable</td><td>ἀμεταμέλητα</td><td>ametamelēta</td><td>G278</td><td>ἀ + μεταμέλομαι (to regret)</td><td><b>not to be taken back, not repented of</b></td><td>see below</td></tr><tr><td>gifts</td><td>χαρίσματα</td><td>charismata</td><td>G5486</td><td>χάρις</td><td><b>what grace produces</b></td><td>the same word as 5:15, 6:23</td></tr><tr><td>calling</td><td>κλῆσις</td><td>klēsis</td><td>G2821</td><td>καλέω (to call)</td><td>a calling</td><td>the same root as “he called” in 8:30</td></tr></table>","gram":"<p><b>★ First light: ametamelētos — “not gone back on”</b></p><p>This word occurs only twice in the New Testament:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td>2 Corinthians 7:10</td><td>“godly sorrow produces repentance leading to salvation, <b>not to be regretted</b>”</td></tr><tr><td>Romans 11:29</td><td>“the gifts and calling of God are <b>irrevocable</b>”</td></tr></table><p><b>The word means: he will not change his mind; he will not take it back.</b></p><p><b>★ Second light: the double statement of 11:28</b></p><pre>as regards the gospel   —  they are [ENEMIES] (because they rejected the Messiah)\nas regards election     —  they are [BELOVED] (for the sake of the fathers)</pre><p><b>Paul says both of these at once, and sees no contradiction.</b></p><p>That is an important reminder for us: <b>a person may stand, at the same moment, in the tension of “rejecting the gospel” and “still within God’s love.”</b></p>","exp":"<p>11:29 is the greatest assurance in the chapter — and in the letter:</p><p><b>“The gifts and calling of God are irrevocable.”</b></p><p>The logic is very simple:</p><p><b>If God could go back on his word to Israel — then he could go back on it with you.</b></p><p><b>And if he will not — then “nothing can separate us” in chapter 8 has its final guarantee.</b></p>"},{"a":30,"z":32,"star":true,"grk":"<p>32 συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν, ἵνα τοὺς πάντας ἐλεήσῃ.</p>","lit":"<p>32 “For God has <b>shut them all up together</b> into disobedience, in order that he might <b>have mercy on them all</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>shut up together</td><td>συνέκλεισεν</td><td>synekleisen</td><td>G4788</td><td>σύν + κλείω (to shut)</td><td><b>to shut up together, to enclose</b></td><td>see below</td></tr><tr><td>disobedience</td><td>ἀπείθεια</td><td>apeitheia</td><td>G543</td><td>ἀ + πείθω</td><td><b>refusal to be persuaded</b></td><td>the same root as 10:21</td></tr><tr><td>have mercy</td><td>ἐλεήσῃ</td><td>eleēsē</td><td>G1653</td><td>ἔλεος (mercy)</td><td>to show mercy</td><td>—</td></tr></table>","gram":"<p><b>★ First light: synkleiō — “to shut up together”</b></p><p>This word occurs four times in the New Testament:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Luke 5:6</b></td><td>“they <b>enclosed</b> (συνέκλεισαν) a great multitude of fish” — a net</td></tr><tr><td>Galatians 3:22</td><td>“the Scripture <b>shut up</b> all under sin”</td></tr><tr><td>Galatians 3:23</td><td>“we were kept under the law, <b>shut up</b> until the faith should be revealed”</td></tr><tr><td><b>Romans 11:32</b></td><td>“God has <b>shut up</b> all into disobedience”</td></tr></table><p><b>The use in Luke 5:6 is especially helpful:</b> it is <b>the drawing of a net</b> — gathering all the fish inside it.</p><p><b>Paul’s picture is: God has drawn a net and enclosed everyone inside it.</b></p><p>And to what end?</p><p><b>Not in order to judge — but “that he might have mercy on them all.”</b></p><p><b>★ Second light: two occurrences of tous pantas (them all)</b></p><pre>συνέκλεισεν... τοὺς πάντας εἰς ἀπείθειαν  —  shut up [THEM ALL]\nἵνα τοὺς πάντας ἐλεήσῃ                   —  have mercy on [THEM ALL]</pre><p>The same phrase, twice over.</p><p>(On whether this supports universalism, see the disputed material.)</p>","exp":"<p>11:32 is <b>the terminus</b> of the whole argument of chapters 9–11.</p><p>And its conclusion is not “some are inside and some are outside.”</p><p>Its conclusion is:</p><p><b>“God has shut them all up into disobedience, in order that he might have mercy on them all.”</b></p><p>Paul has walked three chapters of a labyrinth, and comes to rest on one word:</p><p><b>Mercy.</b></p>"},{"a":33,"z":36,"star":true,"grk":"<p>33 Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ. 36 ὅτι ἐξ αὐτοῦ καὶ δι' αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>33 “<b>Oh, the depth</b> — of the riches and wisdom and knowledge of God! How <b>unsearchable</b> are his judgements, and <b>how untrackable</b> his ways!”</p><p>36 “For <b>of</b> him, and <b>through</b> him, and <b>to</b> him are all things. To him be the glory forever. Amen.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>Oh, the depth</td><td>Ὦ βάθος</td><td>ō bathos</td><td>G899</td><td>—</td><td><b>Oh, the depth!</b> (opening with an interjection)</td><td>see below</td></tr><tr><td>unsearchable</td><td>ἀνεξεραύνητα</td><td>anexeraunēta</td><td>G419</td><td>ἀ + ἐξεραυνάω (to search out)</td><td><b>impossible to search out</b></td><td><b>only here in the NT</b></td></tr><tr><td>untraceable</td><td>ἀνεξιχνίαστοι</td><td>anexichniastoi</td><td>G421</td><td>ἀ + ἐξιχνιάζω (<b>to track footprints</b>)</td><td><b>whose footprints cannot be tracked</b></td><td>see below</td></tr><tr><td>ways</td><td>ὁδοί</td><td>hodoi</td><td>G3598</td><td>—</td><td>paths, ways</td><td>—</td></tr></table>","gram":"<p><b>★ First light: Ō bathos — an interjection</b></p><p>The first word of 11:33 is <b>Ὦ</b> — <b>an interjection</b> (“Oh!”).<br>The second word is <b>βάθος — depth</b>.</p><p><b>Having finished three of the hardest chapters of theology ever written, Paul’s first word is not a proposition.</b></p><p><b>It is a sound — “Oh.”</b></p><p><b>★★ Second light: anexichniastos — “his footprints cannot be tracked”</b></p><p>This word is too beautiful not to take apart:</p><pre>ἀ-      (not able)\nἐκ-     (out)\nἴχνος   (a FOOTPRINT!)</pre><p>And ἴχνος we met in chapter 4:</p><p>4:12, “those who walk in the <b>steps</b> (ἴχνεσιν) of the faith of our father Abraham.”</p><p><b>The picture is: a hunter tracking footprints across snow. He follows them, and follows them — and then the footprints stop.</b></p><p><b>Paul is saying: the road God has walked, you cannot follow to the end.</b> You can follow a stretch of it. But there is always a place where the prints simply are not there.</p><p>(The word occurs only twice in the New Testament: Romans 11:33 and Ephesians 3:8, “the <b>unsearchable</b> riches of Christ.”)</p><p><b>★ Third light: three rhetorical questions (11:34–35)</b></p><pre>Who has known the mind of the Lord?  —  quoting Isaiah 40:13\nOr who has been his counsellor?      —  quoting Isaiah 40:13\nOr who has first given to him?       —  quoting Job 41:11</pre><p>Note especially the force of the last question:</p><p><b>“Or who has first given to him, that it should be repaid to him?”</b></p><p>The meaning is: <b>no one has ever given God anything first. Therefore God owes no one.</b></p><p>(That is precisely the ground of 9:15–16, “I will have mercy on whom I have mercy.”)</p><p><b>★★ Fourth light: three prepositions (11:36)</b></p><pre>ἐξ αὐτοῦ  (OF him)      —  the [ORIGIN] of everything\nδι' αὐτοῦ (THROUGH him) —  the [PROCESS] of everything\nεἰς αὐτόν (TO him)      —  the [END] of everything</pre><p><b>This is the whole theology of Romans in miniature, and the firmest ground there is for “let Jesus receive all the glory”:</b></p><p><b>If the origin is him, the process is him, and the end is him — then there is nowhere in the middle where “I” can be inserted.</b></p><p>Which is why the next line is:</p><p><b>“To him be the glory forever. Amen!”</b></p>","exp":"<p>These four verses are the key to the whole of chapters 9–11.</p><p>Paul has written three chapters. He has handled election, hardening, the remnant, the olive tree, the mystery.</p><p>And what is his conclusion?</p><p><b>Not a complete system. Not a position to take into a debate.</b></p><p>It is —</p><p><b>“Oh, the depth!”</b></p><p><b>If a person finishes Romans 9–11 holding a system he can win arguments with — then what he has come away with is not what Paul came away with.</b></p><p><b>What Paul came away with was: he knelt down.</b></p>"}]},"tracks":[{"id":"T1","gk":"οἰκέω","tr":"oikeō","gl":"to dwell, to live in","code":"G3611","root":"from oikos (house)","head":"The same word. A different resident.","lv":"g","stops":[["7:17","sin dwelling in me","dark"],["7:18","nothing good dwells in me","dark"],["7:20","sin dwelling in me","dark"],["8:9","God's Spirit dwells in you","light"],["8:11","the Spirit of the One who raised Jesus dwells in you","light"]],"ins":"The whole difference between chapter 7 and chapter 8 is that the resident has changed."},{"id":"T2","gk":"λογίζομαι","tr":"logizomai","gl":"to count, to reckon","code":"G3049","root":"a bookkeeping term","head":"God reckons → you reckon → I reckon","lv":"g","stops":[["4:3","God counted it to Abraham (passive, indicative)","light"],["6:11","reckon yourselves dead (imperative)","light"],["8:18","I reckon: the sufferings do not compare (Paul shows how)","light"]],"ins":"Paul does not only give the command. He does the sum himself."},{"id":"T3","gk":"κυριεύω","tr":"kyrieuō","gl":"to be lord over, to rule","code":"G2961","root":"from kyrios (lord)","head":"Four masters, one throne","lv":"g","stops":[["6:9","death no longer has dominion","dark"],["6:14","sin shall not have dominion over you","dark"],["7:1","the law has dominion while a person lives","dark"],["14:9","Lord of both the dead and the living","light"]],"ins":"Romans keeps dismantling one 'lord' after another — and then someone sits down in the empty seat."},{"id":"T4","gk":"βαστάζω","tr":"bastazō","gl":"to carry a weight, to bear","code":"G941","root":"also used in Matthew 8:17, 'He bore our diseases'","head":"You were the one being carried — now it is your turn.","lv":"g","stops":[["11:18","it is not you who support the root, but the root that supports you","light"],["15:1","we who are strong ought to bear the weaknesses of the weak","light"]],"ins":"Humility is not giving up your strength. It is changing the direction of your strength."},{"id":"T5","gk":"παρίστημι","tr":"paristēmi","gl":"to present; to stand beside","code":"G3936","root":"para (beside) + histēmi (to stand)","head":"Present yourself now; stand before Him then.","lv":"g","stops":[["6:13","present yourselves to God","light"],["12:1","present your bodies a living sacrifice","light"],["14:10","we will all stand before the judgement seat of God","light"],["16:2","assist her (stand beside her)","light"]],"ins":"You present yourself now; you will stand before Him then. One action, two tenses."},{"id":"T6","gk":"χρηστότης / χρηστολογία","tr":"chrēstotēs / chrēstologia","gl":"kindness / smooth talk","code":"G5544 / G5542","root":"both from chrēstos (good, kind)","head":"Same root. Opposite nature.","lv":"g","stops":[["2:4","God's kindness leads you to repentance","light"],["11:22","the kindness and severity of God","light"],["16:18","by smooth talk they deceive the innocent","dark"]],"ins":"The counterfeit almost always looks a great deal like the real thing."},{"id":"T7","gk":"ἐξαπατάω → συντρίβω","tr":"exapataō → syntribō","gl":"to deceive → to crush","code":"G1818 / G4937","root":"Genesis 3:13 'the serpent deceived me' / 3:15 'bruise your head'","head":"The serpent's method, and the serpent's end.","lv":"g","stops":[["7:11","sin deceived me through the commandment","dark"],["16:18","they deceive by smooth talk","dark"],["16:20","the God of peace will soon crush Satan under your feet","light"]],"ins":"Those who divide use the serpent's method — and that serpent is about to be crushed."},{"id":"T8","gk":"ὅπλα","tr":"hopla","gl":"weapons, instruments of war","code":"G3696","root":"a military term","head":"Your body parts are weapons — and weapons are to be put on.","lv":"g","stops":[["6:13","present your members as instruments of righteousness","light"],["13:12","put on the armour of light","light"]],"ins":"Chapter 6: your body parts are weapons. Chapter 13: those weapons are to be worn."},{"id":"T9","gk":"εἰς ὑπακοὴν πίστεως","tr":"eis hypakoēn pisteōs","gl":"unto the obedience of faith","code":"G5218 / G4102","root":"only twice in the whole letter","head":"One at the front, one at the back. The whole letter is framed.","lv":"g","stops":[["1:5","for obedience of faith among all the nations","light"],["16:26","made known to all the nations for obedience of faith","light"]],"ins":"Sixteen chapters of theology, with the same phrase written at each end."},{"id":"T10","gk":"στηρίζω","tr":"stērizō","gl":"to establish, to make firm","code":"G4741","root":"","head":"The distance of a whole letter.","lv":"g","stops":[["1:11","that you may be established (what Paul wanted to do)","dark"],["16:25","to him who is able to establish you","light"]],"ins":"From 'I long to strengthen you' to 'only God is able to establish you' — that is the distance of a whole letter."},{"id":"T11","gk":"διαστολή","tr":"diastolē","gl":"distinction, a line drawn","code":"G1293","root":"","head":"No distinction before sin. No distinction before grace.","lv":"g","stops":[["3:22","there is no distinction — for all have sinned","dark"],["10:12","there is no distinction — for the same Lord is Lord of all","light"]],"ins":"The most beautiful pair of matching sentences in the letter."},{"id":"T12","gk":"προσλαμβάνω","tr":"proslambanō","gl":"to welcome, to take to oneself","code":"G4355","root":"pros (toward) + lambanō (to take)","head":"God has already received him. On what grounds do you refuse?","lv":"g","stops":[["14:1","accept the one who is weak in faith","light"],["14:3","for God has accepted him","light"],["15:7","accept one another, just as Christ accepted you","light"]],"ins":"That 'just as' — on the day He accepted you, you were not all right either."}],"issues":[{"id":"ISS01","t":"Who is the 'I' in Romans 7?","r":"7:14–25","ch":[7],"why":"7:7–13 is in the past tense; at 7:14 the tense shifts to the present and stays there.","pos":[["A regenerate believer","Augustine (later), Luther, Calvin","7:14–25 is entirely present tense; 7:22 'I delight in God's law' set against 8:7 'cannot submit'"],["An unregenerate person","Most of the early fathers; Wesley","7:14 'sold under sin' set against 6:18 'set free from sin'; 7:23 'taken captive' set against 8:2 'has set me free'"],["A rhetorical 'I' — Adam, or Israel","Käsemann, Dunn, Wright","exapataō in 7:11 is the verb of Genesis 3:13"],["Anyone pursuing holiness by law","A synthetic reading","It accounts for the evidence on both sides"]],"con":["Keeping the law in your own strength ends at 7:24","The way out is not a method but a person (7:25; 8:1–4)","The struggle itself is evidence of life — the dead feel no pain"],"say":"Godly interpreters have read this 'I' in more than one way. But both sides agree on one thing: keeping the law in your own strength ends at 7:24.","care":"If you preach 7:14–25 as entirely unregenerate, believers who are struggling may begin to doubt their salvation. You must end by pointing to chapter 8."},{"id":"ISS02","t":"Predestination and election","r":"9:6–24","ch":[9,8],"why":"9:11 says it does not depend on works but on Him who calls; yet 9:32 says they did not pursue it by faith.","pos":[["'Foreknew' = set His love upon","Reformed","The object is people (hous), not their faith; the Hebrew yada' often carries covenant love (Amos 3:2; Jeremiah 1:5)"],["'Foreknew' = foresaw their faith","Arminian / Wesleyan","proginōskō plainly means 'to know beforehand'; Paul stresses human response in 10:9–13"]],"con":["Every link in the chain has God as its subject","Not one link is completed by me","People must genuinely believe and respond (10:9–13)"],"say":"Godly believers have understood 'foreknew' in more than one way. But both sides agree: every link in that chain has God as its subject.","care":"The Greek of 9:22–23 is deliberately asymmetrical: destruction is passive with no agent named; glory is active with God as the subject. Paul did not write the two sides to match."},{"id":"ISS03","t":"'All Israel will be saved'","r":"11:26","ch":[11],"why":"9:6 says not all who are descended from Israel are Israel; 11:26 says all Israel will be saved.","pos":[["A future national turning","Dispensational and some Reformed","'Israel' in this chapter consistently means ethnic Israel; 11:12 'fullness', 11:15 'acceptance'"],["The total number of elect Jews through history","Some Reformed","houtōs means 'in this manner' rather than 'at that time'; consistent with the remnant of 11:5"],["'Israel' = the people of God, including the church","Calvin and others","9:6; Galatians 6:16 'the Israel of God'"]],"con":["God has not rejected His people (11:1)","God's gifts and calling are irrevocable (11:29)","Whichever reading you take, the warning of 11:18 is the same: do not boast over the branches"],"say":"This verse has been read in more than one way through history. But whichever reading you take, Paul's word to the Gentile believer is identical: do not be arrogant.","care":"This passage is about redemptive history, not modern politics. It must never be used to endorse or attack any contemporary state or policy."},{"id":"ISS04","t":"The limits of submitting to authority","r":"13:1–7","ch":[13],"why":"13:1 says everyone must be subject; Acts 5:29 says we must obey God rather than men.","pos":[["Submission is the rule; disobedience the exception","The mainstream evangelical consensus","When a government commands sin or forbids obedience to God, we must not comply — and we accept the consequences"],["The lesser magistrate","Calvin, Institutes IV.20.31","A private person may not rebel, but lawful lower magistrates bear a duty to resist tyranny above them"],["Non-violent non-compliance","The Anabaptist tradition","Disobedience must take a non-violent form"]],"con":["13:3–4 is a functional description: reward good, punish evil — that is both the office and the measure of it","Paul's verb is hypotassō (order yourself under), not hypakouō (do whatever you are told)","The Paul who wrote 13:1 also stood on his rights (Acts 16:37), claimed citizenship (Acts 22:25), and appealed to Caesar (Acts 25:11)"],"say":"This passage teaches submission to the order God has appointed. And the same Bible says, 'We must obey God rather than men' (Acts 5:29).","care":"This text has been used to justify slavery, segregation and totalitarian regimes. Never endorse or attack any particular contemporary government from the pulpit."},{"id":"ISS05","t":"Where is the line on disputable matters?","r":"14:1–23","ch":[14,15],"why":"Romans 14 says 'accept one another'; yet Galatians 2:11 has Paul opposing Peter to
