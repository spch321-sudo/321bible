ged from the law of the husband.","So then if, while the husband lives, she is joined to another man, she would be called an adulteress. But if the husband dies, she is free from the law, so that she is no adulteress, though she is joined to another man.","Therefore, my brothers, you also were made dead to the law through the body of Christ, that you would be joined to another, to him who was raised from the dead, that we might produce fruit to God.","For when we were in the flesh, the sinful passions which were through the law worked in our members to bring out fruit to death.","But now we have been discharged from the law, having died to that in which we were held; so that we serve in newness of the spirit, and not in oldness of the letter.","What shall we say then? Is the law sin? May it never be! However, I wouldn’t have known sin except through the law. For I wouldn’t have known coveting unless the law had said, “You shall not covet.”","But sin, finding occasion through the commandment, produced in me all kinds of coveting. For apart from the law, sin is dead.","I was alive apart from the law once, but when the commandment came, sin revived and I died.","The commandment which was for life, this I found to be for death;","for sin, finding occasion through the commandment, deceived me, and through it killed me.","Therefore the law indeed is holy, and the commandment holy, righteous, and good.","Did then that which is good become death to me? May it never be! But sin, that it might be shown to be sin, was producing death in me through that which is good; that through the commandment sin might become exceedingly sinful.","For we know that the law is spiritual, but I am fleshly, sold under sin.","For I don’t understand what I am doing. For I don’t practice what I desire to do; but what I hate, that I do.","But if what I don’t desire, that I do, I consent to the law that it is good.","So now it is no more I that do it, but sin which dwells in me.","For I know that in me, that is, in my flesh, dwells no good thing. For desire is present with me, but I don’t find it doing that which is good.","For the good which I desire, I don’t do; but the evil which I don’t desire, that I practice.","But if what I don’t desire, that I do, it is no more I that do it, but sin which dwells in me.","I find then the law that, while I desire to do good, evil is present.","For I delight in God’s law after the inward person,","but I see a different law in my members, warring against the law of my mind, and bringing me into captivity under the law of sin which is in my members.","What a wretched man I am! Who will deliver me out of the body of this death?","I thank God through Jesus Christ, our Lord! So then with the mind, I myself serve God’s law, but with the flesh, sin’s law."],"8":["There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit.","For the law of the Spirit of life in Christ Jesus made me free from the law of sin and of death.","For what the law couldn’t do, in that it was weak through the flesh, God did, sending his own Son in the likeness of sinful flesh and for sin, he condemned sin in the flesh,","that the ordinance of the law might be fulfilled in us who don’t walk according to the flesh, but according to the Spirit.","For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, the things of the Spirit.","For the mind of the flesh is death, but the mind of the Spirit is life and peace;","because the mind of the flesh is hostile toward God, for it is not subject to God’s law, neither indeed can it be.","Those who are in the flesh can’t please God.","But you are not in the flesh but in the Spirit, if it is so that the Spirit of God dwells in you. But if any man doesn’t have the Spirit of Christ, he is not his.","If Christ is in you, the body is dead because of sin, but the spirit is alive because of righteousness.","But if the Spirit of him who raised up Jesus from the dead dwells in you, he who raised up Christ Jesus from the dead will also give life to your mortal bodies through his Spirit who dwells in you.","So then, brothers, we are debtors, not to the flesh, to live after the flesh.","For if you live after the flesh, you must die; but if by the Spirit you put to death the deeds of the body, you will live.","For as many as are led by the Spirit of God, these are children of God.","For you didn’t receive the spirit of bondage again to fear, but you received the Spirit of adoption, by whom we cry, “Abba! Father!”","The Spirit himself testifies with our spirit that we are children of God;","and if children, then heirs—heirs of God and joint heirs with Christ, if indeed we suffer with him, that we may also be glorified with him.","For I consider that the sufferings of this present time are not worthy to be compared with the glory which will be revealed toward us.","For the creation waits with eager expectation for the children of God to be revealed.","For the creation was subjected to vanity, not of its own will, but because of him who subjected it, in hope","that the creation itself also will be delivered from the bondage of decay into the liberty of the glory of the children of God.","For we know that the whole creation groans and travails in pain together until now.","Not only so, but ourselves also, who have the first fruits of the Spirit, even we ourselves groan within ourselves, waiting for adoption, the redemption of our body.","For we were saved in hope, but hope that is seen is not hope. For who hopes for that which he sees?","But if we hope for that which we don’t see, we wait for it with patience.","In the same way, the Spirit also helps our weaknesses, for we don’t know how to pray as we ought. But the Spirit himself makes intercession for us with groanings which can’t be uttered.","He who searches the hearts knows what is on the Spirit’s mind, because he makes intercession for the saints according to God.","We know that all things work together for good for those who love God, for those who are called according to his purpose.","For whom he foreknew, he also predestined to be conformed to the image of his Son, that he might be the firstborn among many brothers.","Whom he predestined, those he also called. Whom he called, those he also justified. Whom he justified, those he also glorified.","What then shall we say about these things? If God is for us, who can be against us?","He who didn’t spare his own Son, but delivered him up for us all, how would he not also with him freely give us all things?","Who could bring a charge against God’s chosen ones? It is God who justifies.","Who is he who condemns? It is Christ who died, yes rather, who was raised from the dead, who is at the right hand of God, who also makes intercession for us.","Who shall separate us from the love of Christ? Could oppression, or anguish, or persecution, or famine, or nakedness, or peril, or sword?","Even as it is written, “For your sake we are killed all day long. We were accounted as sheep for the slaughter.”","No, in all these things we are more than conquerors through him who loved us.","For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers,","nor height, nor depth, nor any other created thing will be able to separate us from God’s love which is in Christ Jesus our Lord."],"9":["I tell the truth in Christ. I am not lying, my conscience testifying with me in the Holy Spirit","that I have great sorrow and unceasing pain in my heart.","For I could wish that I myself were accursed from Christ for my brothers’ sake, my relatives according to the flesh","who are Israelites; whose is the adoption, the glory, the covenants, the giving of the law, the service, and the promises;","of whom are the fathers, and from whom is Christ as concerning the flesh, who is over all, God, blessed forever. Amen.","But it is not as though the word of God has come to nothing. For they are not all Israel that are of Israel.","Neither, because they are Abraham’s offspring, are they all children. But, “your offspring will be accounted as from Isaac.”","That is, it is not the children of the flesh who are children of God, but the children of the promise are counted as heirs.","For this is a word of promise: “At the appointed time I will come, and Sarah will have a son.”","Not only so, but Rebekah also conceived by one, by our father Isaac.","For being not yet born, neither having done anything good or bad, that the purpose of God according to election might stand, not of works, but of him who calls,","it was said to her, “The elder will serve the younger.”","Even as it is written, “Jacob I loved, but Esau I hated.”","What shall we say then? Is there unrighteousness with God? May it never be!","For he said to Moses, “I will have mercy on whom I have mercy, and I will have compassion on whom I have compassion.”","So then it is not of him who wills, nor of him who runs, but of God who has mercy.","For the Scripture says to Pharaoh, “For this very purpose I caused you to be raised up, that I might show in you my power, and that my name might be proclaimed in all the earth.”","So then, he has mercy on whom he desires, and he hardens whom he desires.","You will say then to me, “Why does he still find fault? For who withstands his will?”","But indeed, O man, who are you to reply against God? Will the thing formed ask him who formed it, “Why did you make me like this?”","Or hasn’t the potter a right over the clay, from the same lump to make one part a vessel for honor, and another for dishonor?","What if God, willing to show his wrath and to make his power known, endured with much patience vessels of wrath prepared for destruction,","and that he might make known the riches of his glory on vessels of mercy, which he prepared beforehand for glory—","us, whom he also called, not from the Jews only, but also from the Gentiles?","As he says also in Hosea, “I will call them ‘my people,’ which were not my people; and her ‘beloved,’ who was not beloved.”","“It will be that in the place where it was said to them, ‘You are not my people,’ there they will be called ‘children of the living God.’”","Isaiah cries concerning Israel, “If the number of the children of Israel are as the sand of the sea, it is the remnant who will be saved;","for he will finish the work and cut it short in righteousness, because the Lord will make a short work upon the earth.”","As Isaiah has said before, “Unless the Lord of Armies had left us a seed, we would have become like Sodom, and would have been made like Gomorrah.”","What shall we say then? That the Gentiles, who didn’t follow after righteousness, attained to righteousness, even the righteousness which is of faith;","but Israel, following after a law of righteousness, didn’t arrive at the law of righteousness.","Why? Because they didn’t seek it by faith, but as it were by works of the law. They stumbled over the stumbling stone,","even as it is written, “Behold, I lay in Zion a stumbling stone and a rock of offense; and no one who believes in him will be disappointed.”"],"10":["Brothers, my heart’s desire and my prayer to God is for Israel, that they may be saved.","For I testify about them that they have a zeal for God, but not according to knowledge.","For being ignorant of God’s righteousness, and seeking to establish their own righteousness, they didn’t subject themselves to the righteousness of God.","For Christ is the fulfillment of the law for righteousness to everyone who believes.","For Moses writes about the righteousness of the law, “The one who does them will live by them.”","But the righteousness which is of faith says this, “Don’t say in your heart, ‘Who will ascend into heaven?’ (that is, to bring Christ down);","or, ‘Who will descend into the abyss?’ (that is, to bring Christ up from the dead.)”","But what does it say? “The word is near you, in your mouth and in your heart;” that is, the word of faith which we preach:","that if you will confess with your mouth that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved.","For with the heart one believes resulting in righteousness; and with the mouth confession is made resulting in salvation.","For the Scripture says, “Whoever believes in him will not be disappointed.”","For there is no distinction between Jew and Greek; for the same Lord is Lord of all, and is rich to all who call on him.","For, “Whoever will call on the name of the Lord will be saved.”","How then will they call on him in whom they have not believed? How will they believe in him whom they have not heard? How will they hear without a preacher?","And how will they preach unless they are sent? As it is written: “How beautiful are the feet of those who preach the Good News of peace, who bring glad tidings of good things!”","But they didn’t all listen to the glad news. For Isaiah says, “Lord, who has believed our report?”","So faith comes by hearing, and hearing by the word of God.","But I say, didn’t they hear? Yes, most certainly, “Their sound went out into all the earth, their words to the ends of the world.”","But I ask, didn’t Israel know? First Moses says, “I will provoke you to jealousy with that which is no nation. I will make you angry with a nation void of understanding.”","Isaiah is very bold and says, “I was found by those who didn’t seek me. I was revealed to those who didn’t ask for me.”","But about Israel he says, “All day long I stretched out my hands to a disobedient and contrary people.”"],"11":["I ask then, did God reject his people? May it never be! For I also am an Israelite, a descendant of Abraham, of the tribe of Benjamin.","God didn’t reject his people, whom he foreknew. Or don’t you know what the Scripture says about Elijah? How he pleads with God against Israel:","“Lord, they have killed your prophets. They have broken down your altars. I am left alone, and they seek my life.”","But how does God answer him? “I have reserved for myself seven thousand men who have not bowed the knee to Baal.”","Even so too at this present time also there is a remnant according to the election of grace.","And if by grace, then it is no longer of works; otherwise grace is no longer grace. But if it is of works, it is no longer grace; otherwise work is no longer work.","What then? That which Israel seeks for, that he didn’t obtain, but the chosen ones obtained it, and the rest were hardened.","According as it is written, “God gave them a spirit of stupor, eyes that they should not see, and ears that they should not hear, to this very day.”","David says, “Let their table be made a snare, a trap, a stumbling block, and a retribution to them.","Let their eyes be darkened, that they may not see. Always keep their backs bent.”","I ask then, did they stumble that they might fall? May it never be! But by their fall salvation has come to the Gentiles, to provoke them to jealousy.","Now if their fall is the riches of the world, and their loss the riches of the Gentiles, how much more their fullness!","For I speak to you who are Gentiles. Since then as I am an apostle to Gentiles, I glorify my ministry,","if by any means I may provoke to jealousy those who are my flesh, and may save some of them.","For if the rejection of them is the reconciling of the world, what would their acceptance be, but life from the dead?","If the first fruit is holy, so is the lump. If the root is holy, so are the branches.","But if some of the branches were broken off, and you, being a wild olive, were grafted in among them and became partaker with them of the root and of the richness of the olive tree,","don’t boast over the branches. But if you boast, remember that it is not you who support the root, but the root supports you.","You will say then, “Branches were broken off, that I might be grafted in.”","True; by their unbelief they were broken off, and you stand by your faith. Don’t be conceited, but fear;","for if God didn’t spare the natural branches, neither will he spare you.","See then the goodness and severity of God. Toward those who fell, severity; but toward you, goodness, if you continue in his goodness; otherwise you also will be cut off.","They also, if they don’t continue in their unbelief, will be grafted in, for God is able to graft them in again.","For if you were cut out of that which is by nature a wild olive tree, and were grafted contrary to nature into a good olive tree, how much more will these, which are the natural branches, be grafted into their own olive tree?","For I don’t desire you to be ignorant, brothers, of this mystery, so that you won’t be wise in your own conceits, that a partial hardening has happened to Israel, until the fullness of the Gentiles has come in,","and so all Israel will be saved. Even as it is written, “There will come out of Zion the Deliverer, and he will turn away ungodliness from Jacob.","This is my covenant with them, when I will take away their sins.”","Concerning the Good News, they are enemies for your sake. But concerning the election, they are beloved for the fathers’ sake.","For the gifts and the calling of God are irrevocable.","For as you in time past were disobedient to God, but now have obtained mercy by their disobedience,","even so these also have now been disobedient, that by the mercy shown to you they may also obtain mercy.","For God has bound all to disobedience, that he might have mercy on all.","Oh the depth of the riches both of the wisdom and the knowledge of God! How unsearchable are his judgments, and his ways past tracing out!","“For who has known the mind of the Lord? Or who has been his counselor?”","“Or who has first given to him, and it will be repaid to him again?”","For of him and through him and to him are all things. To him be the glory for ever! Amen."],"12":["Therefore I urge you, brothers, by the mercies of God, to present your bodies a living sacrifice, holy, acceptable to God, which is your spiritual service.","Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God.","For I say through the grace that was given me, to everyone who is among you, not to think of yourself more highly than you ought to think; but to think reasonably, as God has apportioned to each person a measure of faith.","For even as we have many members in one body, and all the members don’t have the same function,","so we, who are many, are one body in Christ, and individually members of one another,","having gifts differing according to the grace that was given to us: if prophecy, let’s prophesy according to the proportion of our faith;","or service, let’s give ourselves to service; or he who teaches, to his teaching;","or he who exhorts, to his exhorting; he who gives, let him do it with generosity; he who rules, with diligence; he who shows mercy, with cheerfulness.","Let love be without hypocrisy. Abhor that which is evil. Cling to that which is good.","In love of the brothers be tenderly affectionate to one another; in honor prefer one another,","not lagging in diligence, fervent in spirit, serving the Lord,","rejoicing in hope, enduring in troubles, continuing steadfastly in prayer,","contributing to the needs of the saints, and given to hospitality.","Bless those who persecute you; bless, and don’t curse.","Rejoice with those who rejoice. Weep with those who weep.","Be of the same mind one toward another. Don’t set your mind on high things, but associate with the humble. Don’t be wise in your own conceits.","Repay no one evil for evil. Respect what is honorable in the sight of all men.","If it is possible, as much as it is up to you, be at peace with all men.","Don’t seek revenge yourselves, beloved, but give place to God’s wrath. For it is written, “Vengeance belongs to me; I will repay, says the Lord.”","Therefore “If your enemy is hungry, feed him. If he is thirsty, give him a drink; for in doing so, you will heap coals of fire on his head.”","Don’t be overcome by evil, but overcome evil with good."],"13":["Let every soul be in subjection to the higher authorities, for there is no authority except from God, and those who exist are ordained by God.","Therefore he who resists the authority withstands the ordinance of God; and those who withstand will receive to themselves judgment.","For rulers are not a terror to the good work, but to the evil. Do you desire to have no fear of the authority? Do that which is good, and you will have praise from the authority,","for he is a servant of God to you for good. But if you do that which is evil, be afraid, for he doesn’t bear the sword in vain; for he is a servant of God, an avenger for wrath to him who does evil.","Therefore you need to be in subjection, not only because of the wrath, but also for conscience’ sake.","For this reason you also pay taxes, for they are servants of God’s service, continually doing this very thing.","Therefore give everyone what you owe: if you owe taxes, pay taxes; if customs, then customs; if respect, then respect; if honor, then honor.","Owe no one anything, except to love one another; for he who loves his neighbor has fulfilled the law.","For the commandments, “You shall not commit adultery,” “You shall not murder,” “You shall not steal,” “You shall not covet,” and whatever other commandments there are, are all summed up in this saying, namely, “You shall love your neighbor as yourself.”","Love doesn’t harm a neighbor. Love therefore is the fulfillment of the law.","Do this, knowing the time, that it is already time for you to awaken out of sleep, for salvation is now nearer to us than when we first believed.","The night is far gone, and the day is near. Let’s therefore throw off the deeds of darkness, and let’s put on the armor of light.","Let’s walk properly, as in the day; not in reveling and drunkenness, not in sexual promiscuity and lustful acts, and not in strife and jealousy.","But put on the Lord Jesus Christ, and make no provision for the flesh, for its lusts."],"14":["Now accept one who is weak in faith, but not for disputes over opinions.","One man has faith to eat all things, but he who is weak eats only vegetables.","Don’t let him who eats despise him who doesn’t eat. Don’t let him who doesn’t eat judge him who eats, for God has accepted him.","Who are you who judge another’s servant? To his own lord he stands or falls. Yes, he will be made to stand, for God has power to make him stand.","One man esteems one day as more important. Another esteems every day alike. Let each man be fully assured in his own mind.","He who observes the day, observes it to the Lord; and he who does not observe the day, to the Lord he does not observe it. He who eats, eats to the Lord, for he gives God thanks. He who doesn’t eat, to the Lord he doesn’t eat, and gives God thanks.","For none of us lives to himself, and none dies to himself.","For if we live, we live to the Lord. Or if we die, we die to the Lord. If therefore we live or die, we are the Lord’s.","For to this end Christ died, rose, and lived again, that he might be Lord of both the dead and the living.","But you, why do you judge your brother? Or you again, why do you despise your brother? For we will all stand before the judgment seat of Christ.","For it is written, “‘As I live,’ says the Lord, ‘to me every knee will bow. Every tongue will confess to God.’”","So then each one of us will give account of himself to God.","Therefore let’s not judge one another any more, but judge this rather, that no man put a stumbling block in his brother’s way, or an occasion for falling.","I know and am persuaded in the Lord Jesus that nothing is unclean of itself; except that to him who considers anything to be unclean, to him it is unclean.","Yet if because of food your brother is grieved, you walk no longer in love. Don’t destroy with your food him for whom Christ died.","Then don’t let your good be slandered,","for God’s Kingdom is not eating and drinking, but righteousness, peace, and joy in the Holy Spirit.","For he who serves Christ in these things is acceptable to God and approved by men.","So then, let’s follow after things which make for peace, and things by which we may build one another up.","Don’t overthrow God’s work for food’s sake. All things indeed are clean, however it is evil for that man who creates a stumbling block by eating.","It is good to not eat meat, drink wine, nor do anything by which your brother stumbles, is offended, or is made weak.","Do you have faith? Have it to yourself before God. Happy is he who doesn’t judge himself in that which he approves.","But he who doubts is condemned if he eats, because it isn’t of faith; and whatever is not of faith is sin."],"15":["Now we who are strong ought to bear the weaknesses of the weak, and not to please ourselves.","Let each one of us please his neighbor for that which is good, to be building him up.","For even Christ didn’t please himself. But, as it is written, “The reproaches of those who reproached you fell on me.”","For whatever things were written before were written for our learning, that through perseverance and through encouragement of the Scriptures we might have hope.","Now the God of perseverance and of encouragement grant you to be of the same mind with one another according to Christ Jesus,","that with one accord you may with one mouth glorify the God and Father of our Lord Jesus Christ.","Therefore accept one another, even as Christ also accepted you, to the glory of God.","Now I say that Christ has been made a servant of the circumcision for the truth of God, that he might confirm the promises given to the fathers,","and that the Gentiles might glorify God for his mercy. As it is written, “Therefore I will give praise to you among the Gentiles and sing to your name.”","Again he says, “Rejoice, you Gentiles, with his people.”","Again, “Praise the Lord, all you Gentiles! Let all the peoples praise him.”","Again, Isaiah says, “There will be the root of Jesse, he who arises to rule over the Gentiles; in him the Gentiles will hope.”","Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope in the power of the Holy Spirit.","I myself am also persuaded about you, my brothers, that you yourselves are full of goodness, filled with all knowledge, able also to admonish others.","But I write the more boldly to you in part as reminding you, because of the grace that was given to me by God,","that I should be a servant of Christ Jesus to the Gentiles, serving as a priest of the Good News of God, that the offering up of the Gentiles might be made acceptable, sanctified by the Holy Spirit.","I have therefore my boasting in Christ Jesus in things pertaining to God.","For I will not dare to speak of any things except those which Christ worked through me for the obedience of the Gentiles, by word and deed,","in the power of signs and wonders, in the power of God’s Spirit; so that from Jerusalem and around as far as to Illyricum, I have fully preached the Good News of Christ;","yes, making it my aim to preach the Good News, not where Christ was already named, that I might not build on another’s foundation.","But, as it is written, “They will see, to whom no news of him came. They who haven’t heard will understand.”","Therefore also I was hindered these many times from coming to you,","but now, no longer having any place in these regions, and having these many years a longing to come to you,","whenever I travel to Spain, I will come to you. For I hope to see you on my journey, and to be helped on my way there by you, if first I may enjoy your company for a while.","But now, I say, I am going to Jerusalem, serving the saints.","For it has been the good pleasure of Macedonia and Achaia to make a certain contribution for the poor among the saints who are at Jerusalem.","Yes, it has been their good pleasure, and they are their debtors. For if the Gentiles have been made partakers of their spiritual things, they owe it to them also to serve them in material things.","When therefore I have accomplished this, and have sealed to them this fruit, I will go on by way of you to Spain.","I know that when I come to you, I will come in the fullness of the blessing of the Good News of Christ.","Now I beg you, brothers, by our Lord Jesus Christ and by the love of the Spirit, that you strive together with me in your prayers to God for me,","that I may be delivered from those who are disobedient in Judea, and that my service which I have for Jerusalem may be acceptable to the saints,","that I may come to you in joy through the will of God, and together with you, find rest.","Now the God of peace be with you all. Amen."],"16":["I commend to you Phoebe, our sister, who is a servant of the assembly that is at Cenchreae,","that you receive her in the Lord in a way worthy of the saints, and that you assist her in whatever matter she may need from you, for she herself also has been a helper of many, and of my own self.","Greet Prisca and Aquila, my fellow workers in Christ Jesus,","who risked their own necks for my life, to whom not only I give thanks, but also all the assemblies of the Gentiles.","Greet the assembly that is in their house. Greet Epaenetus, my beloved, who is the first fruits of Achaia to Christ.","Greet Mary, who labored much for us.","Greet Andronicus and Junia, my relatives and my fellow prisoners, who are notable among the apostles, who were also in Christ before me.","Greet Amplias, my beloved in the Lord.","Greet Urbanus, our fellow worker in Christ, and Stachys, my beloved.","Greet Apelles, the approved in Christ. Greet those who are of the household of Aristobulus.","Greet Herodion, my kinsman. Greet them of the household of Narcissus, who are in the Lord.","Greet Tryphaena and Tryphosa, who labor in the Lord. Greet Persis, the beloved, who labored much in the Lord.","Greet Rufus, the chosen in the Lord, and his mother and mine.","Greet Asyncritus, Phlegon, Hermes, Patrobas, Hermas, and the brothers who are with them.","Greet Philologus and Julia, Nereus and his sister, and Olympas, and all the saints who are with them.","Greet one another with a holy kiss. The assemblies of Christ greet you.","Now I beg you, brothers, look out for those who are causing the divisions and occasions of stumbling, contrary to the doctrine which you learned, and turn away from them.","For those who are such don’t serve our Lord Jesus Christ, but their own belly; and by their smooth and flattering speech they deceive the hearts of the innocent.","For your obedience has become known to all. I rejoice therefore over you. But I desire to have you wise in that which is good, but innocent in that which is evil.","And the God of peace will quickly crush Satan under your feet. The grace of our Lord Jesus Christ be with you.","Timothy, my fellow worker, greets you, as do Lucius, Jason, and Sosipater, my relatives.","I, Tertius, who write the letter, greet you in the Lord.","Gaius, my host and host of the whole assembly, greets you. Erastus, the treasurer of the city, greets you, as does Quartus, the brother.","The grace of our Lord Jesus Christ be with you all! Amen.","Now to him who is able to establish you according to my Good News and the preaching of Jesus Christ, according to the revelation of the mystery which has been kept secret through long ages,","but now is revealed, and by the Scriptures of the prophets, according to the commandment of the eternal God, is made known for obedience of faith to all the nations;","to the only wise God, through Jesus Christ, to whom be the glory forever! Amen."]},"blk":{"8":[{"a":1,"z":1,"star":true,"grk":"<p>Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>“So <b>now</b>, for those who are in Christ Jesus, <b>there is not one bit of condemnation</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>nothing</td><td>οὐδέν</td><td>ouden</td><td>G3762</td><td>οὐδέ + εἷς</td><td><b>not one thing</b> (emphatic negative)</td><td>see below</td></tr><tr><td>now</td><td>νῦν</td><td>nyn</td><td>G3568</td><td>—</td><td><b>now, at this moment</b></td><td>echoes the “but now” of 3:21</td></tr><tr><td>condemnation</td><td>κατάκριμα</td><td>katakrima</td><td>G2631</td><td>κατά + κρίνω</td><td><b>the sentence; the verdict itself</b></td><td>same word as 5:16, 5:18</td></tr><tr><td>in Christ Jesus</td><td>ἐν Χριστῷ Ἰησοῦ</td><td>—</td><td>—</td><td>—</td><td>the heart of Paul’s theology</td><td>a location, not a flourish</td></tr></table>","gram":"<p><b>★ First light: the sentence opens with Οὐδέν, in the emphatic position</b></p><p>The very first word of the Greek sentence is <b>“not one bit.”</b></p><p>English word order gives us “there is therefore now no condemnation.” The Greek runs:<br><b>“Not one bit of condemnation</b> — therefore, now, for those in Christ Jesus.”<br>Paul puts the “nothing” right at the front, like a hammer coming down first.</p><p><b>★ Second light: κατάκριμα is not the act of condemning — it is the verdict itself</b></p><p>Greek has two related words:</p><table><tr><th>Word</th><th>Meaning</th></tr><tr><td><b>κατάκρισις</b></td><td>the <b>act</b> of condemning</td></tr><tr><td><b>κατάκριμα</b></td><td><b>the content of the verdict — the sentence itself</b> (the -μα ending marks a result)</td></tr></table><p>So 8:1 does not only say “God does not condemn you now.”<br>It says: <b>that written verdict does not exist.</b></p><p>The word occurs only three times in Romans, all in chapters 5 and 8:</p><pre>5:16  judgement came from one sin and brought condemnation (κατάκριμα)\n5:18  through one trespass, condemnation (κατάκριμα) came to all\n8:1   now … no condemnation (κατάκριμα)</pre><p>Chapter 5: Adam brought that verdict in.<br>Chapter 8: for those in Christ, that verdict is gone.</p><p><b>★ Third light: the textual question at 8:1 (to be handled honestly)</b></p><p>Some later manuscripts add at the end of 8:1: “who do not walk according to the flesh, but according to the Spirit.”</p><p>Most scholars today judge that this phrase was carried over by a copyist from 8:4 (assimilation). The earlier manuscripts (Sinaiticus, Vaticanus) do not have it at 8:1.</p><p><b>Why does this matter?</b> Because with that clause added, 8:1 becomes <b>conditional</b>: “If you walk by the Spirit, there is no condemnation.”<br>On the earlier reading, 8:1 is <b>unconditional</b>: “For those in Christ Jesus — no condemnation.”</p><p><b>Pulpit note:</b> you may say “the earliest manuscripts do not have that added clause here.” The World English Bible does carry the longer reading at 8:1; say plainly that the manuscript evidence is divided and that the shorter reading is preferred by most modern scholars.</p>","exp":"<p>8:1 has to be read straight after 7:24 before you feel how large it is.</p><pre>7:24  “What a wretched man I am! Who will deliver me?”\n8:1   “There is therefore now no condemnation to those who are in Christ Jesus.”</pre><p>A man who has just confessed total failure hears, as the very next word:</p><p><b>No condemnation.</b></p><p>Not “you must do better.”<br>Not “don’t let it happen again.”<br>It is — <b>not one bit of condemnation</b>.</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.</p>","lit":"<p>“For <b>the law of the Spirit of life</b>, in Christ Jesus, <b>has set you free</b> from the law of sin and of death.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>law</td><td>νόμος</td><td>nomos</td><td>G3551</td><td>here: <b>an operating principle, a governing power</b> (as in “the law of gravity”)</td></tr><tr><td>set free</td><td>ἠλευθέρωσεν</td><td>ēleutherōsen</td><td>G1659</td><td><b>to make free</b> (same word as 6:18, 6:22)</td></tr></table>","gram":"<p><b>★ First light: what does “law” mean here?</b></p><p>Paul has already used νόμος with two senses in 7:21–23:</p><table><tr><th>Reference</th><th>What “law” means</th></tr><tr><td>7:22 “the law of God”</td><td>the law of Moses</td></tr><tr><td>7:23 “the law of sin in my members”</td><td><b>an operating principle, a power</b></td></tr><tr><td>8:2 “the law of the Spirit of life”</td><td><b>an operating principle, a power</b></td></tr></table><p>Paul is not saying “a new set of rules has replaced the old set of rules.”<br>He is saying: <b>a stronger power has overcome another power.</b></p><p>Think of it this way. Gravity is a law — things fall. Then an aeroplane takes off. Has gravity been repealed? No. A <b>stronger force</b> has overcome it.</p><p><b>★ Second light: a textual note</b></p><p>Does 8:2 end “has set <b>me</b> free” or “has set <b>you</b> free”?<br>Some manuscripts read με (me); some earlier ones read σε (you).</p><p>Nothing theological hangs on it. If it is “you,” Paul turns suddenly to the reader, and the tone is more direct: “you” — the very one still crying out back in 7:24.</p><p><b>★ Third light: the verbs of 7:24 and 8:2 side by side</b></p><pre>7:24  τίς με ῥύσεται     —  who will “rescue” me (drag me out)?\n8:2   ἠλευθέρωσέν σε     —  the law of the Spirit “has set you free”</pre><p>Chapter 7 asks a question. Chapter 8 answers with a <b>completed</b> verb (aorist).<br>Not “the Spirit will set you free,” but <b>“has already set you free.”</b></p>","exp":"<p>8:1 gave the result — no condemnation. 8:2 gives the <b>reason</b>.</p><p>And Paul puts it in a striking way: <b>two “laws” wrestling</b>.</p><pre>the law of sin and death   —  in chapter 7, this is the side that wins (7:23)\nthe law of the Spirit of life —  in chapter 8, a stronger one has taken over</pre><p><b>What the text plainly says:</b> in Christ Jesus, the law of the Spirit has already (aorist) freed a person from the law of sin and death.</p><p><b>What may fairly be drawn from it:</b> “freed” does not mean “that law has disappeared.” Gravity was not repealed; a stronger force simply overcame it.<br>So the struggle of chapter 7 does not vanish entirely in chapter 8. What changes is this: <b>you are no longer fighting alone</b> (8:26).</p><p><b>⚠ Pastoral note:</b> if someone finishes chapter 8 thinking “real believers don’t struggle any more,” they have misread it. 8:23 says plainly that those who have the Spirit <b>also</b> groan inwardly.</p>"},{"a":3,"z":4,"star":true,"grk":"<p>3 Τὸ γὰρ ἀδύνατον τοῦ νόμου ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινεν τὴν ἁμαρτίαν ἐν τῇ σαρκί,</p><p>4 ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα.</p>","lit":"<p>3 “For what the law <b>could not do</b> — the point at which it was weak through the flesh — God did: sending his own Son <b>in the likeness of sinful flesh</b>, and concerning sin, <b>he condemned sin in the flesh</b>;”</p><p>4 “so that the <b>righteous requirement</b> of the law <b>might be fulfilled in us</b> — in us who walk not according to the flesh but according to the Spirit.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>what it could not do</td><td>τὸ ἀδύνατον</td><td>to adynaton</td><td>G102</td><td>ἀ + δύναμις (power)</td><td><b>the point of powerlessness</b></td><td>the law’s inability</td></tr><tr><td>likeness</td><td>ὁμοίωμα</td><td>homoiōma</td><td>G3667</td><td>ὅμοιος (like)</td><td><b>likeness, the form of a thing</b></td><td><b>crucial</b> — see below</td></tr><tr><td>condemned</td><td>κατέκρινεν</td><td>katekrinen</td><td>G2632</td><td>κατά + κρίνω</td><td>to condemn, to sentence</td><td>the verb behind κατάκριμα in 8:1</td></tr><tr><td>righteous requirement</td><td>δικαίωμα</td><td>dikaiōma</td><td>G1345</td><td>δίκαιος</td><td><b>the just requirement; the verdict</b></td><td>same word as 2:26</td></tr><tr><td>be fulfilled</td><td>πληρωθῇ</td><td>plērōthē</td><td>G4137</td><td>πληρόω</td><td><b>to be fulfilled</b> (<b>passive!</b>)</td><td>see below</td></tr></table>","gram":"<p><b>★ First light: ὁμοίωμα — Paul choosing his words with extreme care</b></p><p>“in the likeness of sinful flesh” — Paul writes this with great precision.</p><p>He does <b>not</b> say:<br>✗ “he became sinful flesh” (that would give Christ a sinful nature)<br>✗ “he came in the likeness of flesh” (that is docetism — denying real humanity)</p><p>What he says is: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας — <b>“in the likeness of sinful flesh.”</b></p><p>That phrase protects two truths at once:</p><table><tr><th>The truth protected</th><th>How</th></tr><tr><td><b>He truly became human</b></td><td>real flesh, not a phantom (John 1:14; Hebrews 2:14)</td></tr><tr><td><b>He was without sin</b></td><td>a “likeness,” not the sinful nature itself (Hebrews 4:15; 2 Corinthians 5:21)</td></tr></table><p>This is one of the most finely calibrated christological statements in the New Testament.<br>He came <b>inside</b> our situation — without contracting the sin of that situation.</p><p><b>★ Second light: “condemned sin in the flesh” — where did the condemnation land?</b></p><p>κατέκρινεν τὴν ἁμαρτίαν ἐν τῇ σαρκί — “in the flesh, he condemned sin.”</p><p>Notice: the object condemned is <b>sin</b>, not the person. And the <b>place</b> of the condemning is “in the flesh” — in <b>his</b> flesh. On the cross.</p><p>So 8:1 and 8:3 form a single couplet:</p><pre>8:3  God condemned (κατέκρινεν) sin in Christ’s flesh\n  ↓ therefore\n8:1  those in Christ face no condemnation (κατάκριμα)</pre><p><b>Condemnation did not vanish. Condemnation changed address.</b></p><p><b>★ Third light: “fulfilled” in 8:4 is passive</b></p><p>“that the righteous requirement of the law might be <b>fulfilled</b> in us” — πληρωθῇ is <b>passive</b>.</p><p>Not “we fulfil the righteous requirement of the law,” but “the righteous requirement of the law <b>is fulfilled</b> in us.”</p><p>Who is the actor? God, by the Spirit. And the preposition is ἐν ἡμῖν — <b>“in us,”</b> not “by us.”</p>","exp":"<p>8:3 is the direct answer to chapter 7.</p><pre>7:18  “to will is present with me, but to do what is good is not”  —  I cannot\n8:3   “what the law could not do, in that it was weak”              —  the law cannot either\n  ↓\n8:3   “God, sending his own Son…”                                   —  so God did it himself</pre><p>The despair of chapter 7 is not because you were not good enough.<br>It is because that road <b>never went through</b> — not even the law could travel it.</p><p>So God took another road: he sent his Son.</p>"},{"a":5,"z":8,"star":false,"grk":"<p>6 τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·</p>","lit":"<p>5 “For those who live according to the flesh <b>set their minds on</b> the things of the flesh; those who live according to the Spirit, on the things of the Spirit.”</p><p>6 “For the <b>mindset</b> of the flesh is <b>death</b>; but the mindset of the Spirit is <b>life and peace</b>.”</p><p>7 “Because the mindset of the flesh <b>is hostile toward God</b>: it <b>does not submit</b> to God’s law — <b>indeed it cannot</b>;”</p><p>8 “and those who are in the flesh <b>cannot please God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>mind, set the mind on</td><td>φρονέω / φρόνημα</td><td>phroneō / phronēma</td><td>G5426 / G5427</td><td>φρήν (the mind)</td><td><b>the bent of the heart, what one is set on</b></td><td>see below</td></tr><tr><td>peace</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>—</td><td>peace (shalom)</td><td>same word as 5:1, “peace with God”</td></tr><tr><td>cannot</td><td>οὐδὲ γὰρ δύναται</td><td>—</td><td>G1410</td><td>δύναμαι</td><td><b>it is not even able</b></td><td>see below</td></tr></table>","gram":"<p><b>★ First light: φρόνημα is not merely “what you think about” but “where your heart is turned”</b></p><p>φρονέω does not mean simple cognition. It means <b>the orientation of the mind, what one cares about, what one values</b>.</p><p>(Philippians 2:5, “have this mind in you which was also in Christ Jesus” — same root; Philippians 3:19, “who set their mind on earthly things” — same word.)</p><p>So the question is not “what is going through my head?” but <b>“who is my heart facing?”</b></p><p><b>★ Second light: the absoluteness of “cannot” in 8:7</b></p><p>“it does not submit to God’s law — neither indeed <b>can it</b> (οὐδὲ δύναται).”</p><p>This is not “it would rather not.” It is <b>“it has no capacity to.”</b></p><p>Set this beside 7:22 and you feel the tension:</p><pre>7:22  “I delight in God’s law after the inward man”\n8:7   “the mind of the flesh … does not submit to God’s law, neither indeed can it”</pre><p>This is one of the central pressure points in the debate over who the “I” of chapter 7 is (see the disputed-passage card).</p><p>Either way, 8:7 is clear: the mind of the flesh <b>has no power</b> to submit to God.<br>So the way out is not “submit harder.” It is <b>a different mind</b>.</p>","exp":"<p>8:5–8 gives a very practical test.</p><p>Do not ask, “did I slip up today?”<br>Ask, <b>“where has my heart been facing lately?”</b></p><p>Behaviour is the fruit. The bent of the heart is the root.</p>"},{"a":9,"z":9,"star":true,"grk":"<p>ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλ' ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.</p>","lit":"<p>“But you are not in the flesh but in the Spirit — <b>since</b> the Spirit of God <b>dwells in you</b>. And if anyone does not have the Spirit of Christ, that person does not belong to him.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>dwells</td><td>οἰκεῖ</td><td>oikei</td><td>G3611</td><td><b>oikeō — the very word of 7:17, 18, 20</b></td></tr><tr><td>if</td><td>εἴπερ</td><td>eiper</td><td>G1512</td><td><b>since, assuming this is in fact the case</b> (not doubt, but a settled premise)</td></tr></table>","gram":"<p><b>★ First light: oikeō — the most important pairing in the whole letter</b></p><pre>7:17  it is sin “dwelling” (οἰκοῦσα) in me that does it\n7:18  I know that in me … no good thing “dwells” (οἰκεῖ)\n7:20  it is sin “dwelling” (οἰκοῦσα) in me that does it\n  ↓\n8:9   the Spirit of God “dwells” (οἰκεῖ) in you\n8:11  the Spirit of him who raised Jesus “dwells” (οἰκεῖ) in you</pre><p>The same verb, running through both chapters.<br>Chapter 7: sin lives in me. Chapter 8: the Spirit lives in me.</p><p>That is the whole difference between the two chapters: <b>the resident has changed.</b></p><p><b>★ Second light: εἴπερ is not doubt — it is a settled premise</b></p><p>The English “if” can make it sound as though Paul is questioning whether his readers have the Spirit.</p><p>In Greek, εἴπερ normally carries the sense <b>“since this is in fact so.”</b> Paul’s tone is:<br>“<b>Since</b> the Spirit of God dwells in you — then you are not in the flesh.”</p><p><b>★ Third light: three names for one Person</b></p><p>In the space of three verses Paul uses three names:</p><pre>8:9   the Spirit of God (πνεῦμα θεοῦ)\n8:9   the Spirit of Christ (πνεῦμα Χριστοῦ)\n8:11  the Spirit of him who raised Jesus from the dead</pre><p>This is one of the important trinitarian texts of the New Testament: one and the same Spirit, who is the Spirit of the Father and the Spirit of the Son.</p><p><b>★ Fourth light: the flat statement in the second half of 8:9</b></p><p>“If anyone does not have the Spirit of Christ, <b>he does not belong to him</b>.”</p><p>That sentence is grave, and it is clear. Having the Spirit is not an optional upgrade for advanced Christians. It is <b>the definition of being a Christian at all</b>.</p>","exp":"<p>8:9 is the <b>answer</b> to the problem of chapter 7.</p><p>What was the deadlock in chapter 7? 7:17, 7:18, 7:20 — <b>sin dwelling in me</b> (oikeō).</p><p>And 8:9 uses <b>the same verb</b>: “the Spirit of God <b>dwells</b> in you.”</p><p><b>What the text plainly says:</b> whether a person “belongs to Christ” turns on whether the Spirit of Christ dwells in him.</p><p><b>What may fairly be drawn from it:</b> the difference between chapter 7 and chapter 8 is <b>not “I tried harder” — it is “the resident changed.”</b><br>This is exactly what the 3-2-1 means by selflessness: not emptying yourself by your own effort, but Christ living in you.</p><p><b>⚠ Pastoral note:</b> this verse is <b>not</b> given so that people will doubt their salvation. Paul’s tone (εἴπερ = “since this is so”) <b>affirms</b> that his readers have the Spirit; it does not interrogate them. If someone is frightened by it, take them to 8:15–16: the One who enables you to cry “Abba” is himself the evidence.</p>"},{"a":10,"z":11,"star":false,"grk":"<p>11 …ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ τοῦ ἐνοικοῦντος αὐτοῦ πνεύματος ἐν ὑμῖν.</p>","lit":"<p>10 “But if Christ is in you, the body is indeed <b>dead</b> because of sin, but the spirit <b>is life</b> because of righteousness.”</p><p>11 “And if the Spirit <b>of him who raised Jesus from the dead</b> dwells in you, he who raised Christ from the dead will also, through <b>his Spirit who dwells in you</b>, <b>give life to your mortal bodies</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>will give life</td><td>ζῳοποιήσει</td><td>zōopoiēsei</td><td>G2227</td><td>ζωή + ποιέω: <b>to make alive</b> (<b>same word as 4:17</b>)</td></tr><tr><td>mortal</td><td>θνητός</td><td>thnētos</td><td>G2349</td><td>subject to death, perishable (<b>same word as 6:12</b>)</td></tr></table>","gram":"<p><b>★ First light: zōopoieō — the word from chapter 4 returns</b></p><pre>4:17  Abraham believed in the God who “gives life to the dead” (ζῳοποιοῦντος)\n  ↓\n8:11  he will also “give life to your mortal bodies” (ζῳοποιήσει)</pre><p>The God Abraham believed in is the very God who will raise your body.</p><p><b>★ Second light: thnētos — the word from chapter 6 returns</b></p><pre>6:12  do not let sin reign in your “mortal” (θνητῷ) body\n  ↓\n8:11  will give life to your “mortal” (θνητά) bodies</pre><p>Chapter 6: this mortal body is a battlefield.<br>Chapter 8: this mortal body will be raised.</p><p>Paul never treats the body as something to be despised.</p>","exp":"<p>8:11 is one of the most hopeful verses in the whole Bible about the <b>body</b>.</p><p>The Christian hope is <b>not</b> that the soul escapes the body.<br>It is that <b>this body will live again</b>.</p>"},{"a":12,"z":13,"star":false,"grk":"<p>13 …εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.</p>","lit":"<p>12 “So then, brothers, <b>we are debtors</b> — <b>but not to the flesh</b>, to live according to the flesh.”</p><p>13 “For if you live according to the flesh, <b>you must die</b>; but if <b>by the Spirit</b> you <b>keep putting to death</b> the deeds of the body, <b>you will live</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>debtors</td><td>ὀφειλέται</td><td>opheiletai</td><td>G3781</td><td><b>those who owe a debt</b> (same root as 4:4)</td></tr><tr><td>put to death</td><td>θανατοῦτε</td><td>thanatoute</td><td>G2289</td><td><b>to put to death</b> (present tense: continually)</td></tr><tr><td>deeds</td><td>πράξεις</td><td>praxeis</td><td>G4234</td><td>practices, things done</td></tr></table>","gram":"<p><b>★ First light: “not debtors to the flesh”</b></p><p>Paul uses a bookkeeping word: ὀφειλέτης, one who owes.</p><p>This matters enormously: <b>the flesh holds no note against you.</b> It comes demanding payment all day long — but it has no promissory note in its hand.</p><p><b>★ Second light: “by the Spirit put to death” — the actor and the instrument</b></p><p>πνεύματι is <b>dative</b>: it marks the <b>means</b>.</p><pre>the actor:      you (θανατοῦτε is second person plural)\nthe instrument: the Spirit (πνεύματι)</pre><p>Notice two things:<br>1. The subject of the verb is <b>“you”</b> — this is something you are to do.<br>2. But the instrument is the Spirit — <b>it is not done by willpower</b>.</p><p>That balances the tension of chapters 6 and 7 exactly: not passively waiting for God to act (which becomes irresponsibility), and not gritting your teeth alone (which lands you back in chapter 7).</p><p><b>★ Third light: “put to death” is present tense</b></p><p>θανατοῦτε is present — <b>continually, daily</b>. This matches 6:11 “reckon” (present imperative) exactly.<br>There is a once-for-all surrender, and there is a daily battle.</p><p>(On whether 8:13 implies salvation by works, see the disputed-passage material.)</p>","exp":"<p>These two verses are the <b>only direct command</b> in chapter 8.</p><p>And Paul’s wording is interesting. He says we are <b>debtors</b> — and then he leaves the sentence unfinished.</p><p>“We are not debtors <b>to the flesh</b>” — then to whom are we debtors?</p><p>Paul does not say here. But the letter answers it: 1:14 “<b>I am a debtor</b>”; 13:8 “owe no one anything, <b>except to love one another</b>.”</p><p><b>What the text plainly says:</b> believers owe the flesh nothing; to live by the flesh is to die, and to put the deeds of the body to death by the Spirit is to live.</p><p><b>What may fairly be drawn from it:</b> dealing with sin has two components and <b>neither can be dropped</b>:<br>1. The subject of the verb is <b>you</b> — this is yours to do, not to wait for.<br>2. But the instrument is <b>the Spirit</b> — not your willpower (that was chapter 7).<br>And θανατοῦτε is present tense — <b>daily</b>, not once.</p><p><b>⚠ Pastoral note:</b> this must not be preached as salvation by works. Paul is saying that those who truly have the Spirit will walk this road — and that the road itself is walked by the Spirit.</p>"},{"a":14,"z":15,"star":true,"grk":"<p>14 ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι υἱοὶ θεοῦ εἰσιν. 15 οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον ἀλλ' ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· αββα ὁ πατήρ.</p>","lit":"<p>14 “For as many as <b>are led</b> by the Spirit of God, these are sons of God.”</p><p>15 “For you did not receive a spirit of slavery, falling back into fear; you received <b>the Spirit of adoption</b>, by whom we <b>cry out</b>: ‘Abba! Father!’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>are led</td><td>ἄγονται</td><td>agontai</td><td>G71</td><td>ἄγω</td><td><b>are being led</b> (<b>present passive</b>)</td><td>see below</td></tr><tr><td>adoption</td><td>υἱοθεσία</td><td>huiothesia</td><td>G5206</td><td>υἱός + τίθημι</td><td><b>adoption; being placed as a son</b></td><td>a Roman legal term</td></tr><tr><td>cry out</td><td>κράζομεν</td><td>krazomen</td><td>G2896</td><td>κράζω</td><td><b>to cry aloud, to shout</b></td><td>not a whisper</td></tr><tr><td>Abba</td><td>αββα</td><td>abba</td><td>G5</td><td>Aramaic</td><td>father</td><td>see below</td></tr></table>","gram":"<p><b>★ First light: ἄγονται is present passive</b></p><p>“as many as <b>are led</b> by the Spirit of God” — not “as many as lead themselves.”</p><p>The verb is <b>passive</b>: <b>being led</b>. And it is <b>present</b>: <b>being led continually</b>.<br>(The same verb stands behind Galatians 5:18, “if you are led by the Spirit.”)</p><p><b>★ Second light: huiothesia — Roman adoption</b></p><p>The word occurs five times in the New Testament, all in Paul (Romans 8:15, 8:23, 9:4; Galatians 4:5; Ephesians 1:5). It is a term from Roman law, and Roman adoption had several features:</p><table><tr><th>Feature</th><th>What it means for 8:15</th></tr><tr><td><b>All former debts cancelled</b></td><td>your whole past no longer exists in law</td></tr><tr><td><b>Full rights of inheritance</b></td><td>equal with a natural son (8:17, “joint heirs with Christ”)</td></tr><tr><td><b>Witnesses required</b></td><td>8:16, “the Spirit himself testifies with our spirit”</td></tr><tr><td><b>Irrevocable</b></td><td>8:38–39, “nothing shall separate us”</td></tr></table><p>This is not a warm metaphor. It is a <b>legal instrument</b>.</p><p><b>★ Third light: Abba — Jesus’ own word</b></p><p>Paul keeps the Aramaic sound and does not translate it. “Abba” appears only three times in the whole New Testament:</p><table><tr><th>Reference</th><th>Who is speaking</th></tr><tr><td><b>Mark 14:36</b></td><td>Jesus in Gethsemane: “Abba, Father, all things are possible to you…”</td></tr><tr><td><b>Romans 8:15</b></td><td>us</td></tr><tr><td><b>Galatians 4:6</b></td><td>God sent the Spirit of his Son into our hearts, crying “Abba, Father!”</td></tr></table><p>Consider what that means. The word Jesus used on the night his sweat was like drops of blood — <b>he has given it to us to use as well.</b></p><p>On the meaning of “Abba,” avoid the common exaggeration.<br>“Abba” is <b>not</b> merely infant babble — that popular claim has been corrected by scholarship. It is the intimate, ordinary word used within a family; grown children addressed their fathers this way.</p><p>What is astonishing about it is not that it is childish, but that <b>a creature may address the Creator of the universe in the language of family.</b></p><p><b>★ Fourth light: krazō — a cry, not a murmur</b></p><p>“Cry out” is not gentle speech. κράζω means <b>to shout aloud</b>. (Matthew 27:50: “Jesus cried again with a loud voice (κράξας) and yielded up his spirit” — the same word.)</p><p>Paul is not describing a quiet religious habit. He is describing the sound a child makes when he needs something — <b>the cry that comes out before you think.</b></p>","exp":"<p>8:15 answers something Paul raised back in chapter 6.</p><p>There he used the picture of a <b>slave</b>, and even apologised for it: “I speak in human terms because of the weakness of your flesh” (6:19).</p><p>Now, two chapters later — “you did not receive <b>a spirit of slavery</b>… but <b>the Spirit of adoption</b>.”</p><p>Paul has moved up.<br>Chapter 6: the absoluteness of belonging (a slave).<br>Chapter 8: the intimacy of relationship (a son).<br>The two chapters are meant to be read together.</p>"},{"a":16,"z":17,"star":false,"grk":"<p>16 αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ. 17 …συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.</p>","lit":"<p>16 “The Spirit himself <b>testifies together with our spirit</b> that we are <b>children of God</b>.”</p><p>17 “And if children, then <b>heirs</b> — heirs of God and <b>joint heirs with Christ</b>; <b>since we suffer with him</b>, so that we may <b>also be glorified with him</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>testifies with</td><td>συμμαρτυρεῖ</td><td>symmartyrei</td><td>G4828</td><td>σύν + μαρτυρέω: <b>to bear witness together</b> (<b>same word as 2:15</b>)</td></tr><tr><td>joint heirs</td><td>συγκληρονόμοι</td><td>synklēronomoi</td><td>G4789</td><td><b>co-heirs</b></td></tr><tr><td>suffer with</td><td>συμπάσχομεν</td><td>sympaschomen</td><td>G4841</td><td><b>to suffer together</b></td></tr><tr><td>glorified with</td><td>συνδοξασθῶμεν</td><td>syndoxasthōmen</td><td>G4888</td><td><b>to be glorified together</b></td></tr></table>","gram":"<p><b>★ First light: symmartyreō — the word from 2:15 returns</b></p><pre>2:15  their conscience “bearing witness with” (συμμαρτυρούσης) —\n      an inner courtroom of accusation and defence\n  ↓\n8:16  the Spirit “testifies with” (συμμαρτυρεῖ) our spirit —\n      that we are children of God</pre><p>Chapter 2: that inner court only ever accuses.<br>Chapter 8: now a witness stands up and testifies <b>in your favour</b>.</p><p><b>★ Second light: four συν- words stacked into two verses</b></p><pre>8:16  συμμαρτυρεῖ    — bearing witness together\n8:17  συγκληρονόμοι  — inheriting together\n8:17  συμπάσχομεν    — suffering together\n8:17  συνδοξασθῶμεν  — being glorified together</pre><p>Paul pushes “together with Christ” as far as it will go: inherit together, suffer together, be glorified together.</p><p><b>★ Third light: the “if” of 8:17 (εἴπερ)</b></p><p>As in 8:9, εἴπερ normally means <b>“since this is in fact so.”</b></p><p>Paul is not saying “you must suffer in order to earn glory” — that would be merit. He is saying: <b>the road walked with Christ contains both of these.</b> To be a joint heir is to suffer with him, and to be glorified with him.</p>","exp":"<p>8:16 answers a question many people carry: <b>“How do I know I really am a child of God?”</b></p><p>Paul’s answer is not “look at your performance.” It is: <b>there are two witnesses.</b><br>One is your own spirit. The other is <b>the Spirit</b>.</p><p>And 8:17 immediately adds a very honest sentence: <b>this sonship includes suffering.</b></p><p>Not “become a child of God and life goes smoothly.”<br>Rather: “become a child of God, and walk that road with him.”</p>"},{"a":18,"z":18,"star":false,"grk":"<p>Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.</p>","lit":"<p>“For <b>I reckon</b> that the sufferings of this present time are <b>not of equal weight</b> with the glory that is going to be <b>revealed to us</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>I consider</td><td>Λογίζομαι</td><td>logizomai</td><td>G3049</td><td><b>I reckon</b> (the bookkeeping word of 4:3 and 6:11)</td></tr><tr><td>not worthy to be compared</td><td>οὐκ ἄξια</td><td>ouk axia</td><td>G514</td><td><b>not of equal weight</b> (ἄξιος originally: balancing a scale)</td></tr><tr><td>revealed to us</td><td>ἀποκαλυφθῆναι εἰς ἡμᾶς</td><td>—</td><td>G601</td><td>revealed <b>into</b> us — not merely shown to us</td></tr></table>","gram":"<p><b>★ First light: the third appearance of logizomai</b></p><pre>4:3   ἐλογίσθη   — God reckoned (passive, indicative)\n6:11  λογίζεσθε  — you are to reckon (imperative)\n8:18  λογίζομαι  — I reckon (Paul shows how it is done)</pre><p>Paul does not only issue the command. He does the sum himself.</p><p>And what he is weighing is <b>an account on a set of scales</b>: present suffering on one side, coming glory on the other. The result: <b>they are not in the same order of magnitude.</b></p><p><b>★ Second light: the balance imagery in ἄξιος</b></p><p>The word originally means <b>“of equal weight with.”</b></p><p>Paul is not saying suffering does not matter, and he is not saying you should not feel it. He is saying: put it on the other pan of the scales, and <b>it does not bring it down</b>.</p><p><b>★ Third light: eis hēmas — revealed <b>into</b> us</b></p><p>Paul does not say “shown to us” but <b>“revealed into us.”</b> That glory is not something we watch; it is something we are to <b>enter and carry</b>.<br>(8:30, “those he justified, he also glorified”; Colossians 3:4, “you also will appear with him in glory.”)</p>","exp":"<p>8:18 opens the second half of chapter 8. And it is a sentence about <b>accounts</b>, not a sentence of comfort.</p><p>Paul says: <b>“I reckon.”</b> That is the bookkeeping word from chapters 4 and 6.</p><pre>4:3   God reckons  — passive, indicative (an accomplished fact)\n6:11  you reckon   — imperative (something to do)\n8:18  I reckon     — Paul demonstrating it</pre><p><b>What the text plainly says:</b> present suffering and the glory to be revealed into us are <b>not of comparable weight</b> (ἄξιος = of equal weight).</p><p><b>What may fairly be drawn from it:</b> Paul does <b>not</b> say suffering is unimportant, and he does <b>not</b> say you should not feel it. He says: put it on the other side of the scales, and <b>it will not tip them</b>.</p><p><b>⚠ Pastoral note:</b> like 8:28, <b>this verse is for the sufferer to reckon with himself — not for a bystander to comfort someone else with.</b> Thrown at a person while they are still in pain, it sounds like “your pain does not count.” That is not what Paul means.</p>"},{"a":19,"z":22,"star":true,"grk":"<p>19 ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται. 22 οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν.</p>","lit":"<p>19 “For the creation, <b>craning its neck</b>, is <b>waiting</b> for the <b>unveiling</b> of the sons of God.”</p><p>20 “For the creation <b>was subjected to futility</b> — <b>not of its own will</b>, but because of him who <b>subjected it</b>;”</p><p>21 “and in <b>hope</b>: that the creation itself will also be <b>set free from the slavery of decay</b>, into the <b>freedom of the glory</b> of the children of God.”</p><p>22 “For we know that <b>the whole creation groans together and travails together in birth pains, until now</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>earnest expectation</td><td>ἀποκαραδοκία</td><td>apokaradokia</td><td>G603</td><td>ἀπό + κάρα (head) + δοκέω</td><td><b>to stretch the neck out and look</b></td><td>see below</td></tr><tr><td>futility</td><td>ματαιότης</td><td>mataiotēs</td><td>G3153</td><td>μάταιος (empty)</td><td><b>emptiness, vanity</b></td><td>the word of Ecclesiastes</td></tr><tr><td>groans together</td><td>συστενάζει</td><td>systenazei</td><td>G4959</td><td>σύν + στενάζω</td><td><b>to groan together</b></td><td><b>only here in the NT</b></td></tr><tr><td>travails together</td><td>συνωδίνει</td><td>synōdinei</td><td>G4944</td><td>σύν + ὠδίν (birth pang)</td><td><b>to be in labour together</b></td><td><b>only here in the NT</b></td></tr></table>","gram":"<p><b>★ First light: apokaradokia — craning the neck</b></p><p>The word is built with striking vividness:</p><pre>ἀπό (away, out) + κάρα (head) + δοκέω (to look)\n= to put the head out and look into the distance</pre><p>Picture a person on tiptoe, neck stretched out, eyes fixed on the horizon.<br>(Only twice in the New Testament: Romans 8:19 and Philippians 1:20, “according to my earnest expectation and hope.”)</p><p>Paul says the whole created order is standing on tiptoe, waiting for one thing.<br>Waiting for what? <b>“For the revealing of the sons of God.”</b></p><p><b>★ Second light: mataiotēs — the word of Ecclesiastes</b></p><p>“The creation was subjected to <b>futility</b>.”</p><p>In the Septuagint, ματαιότης is the very word that opens Ecclesiastes:<br>Ecclesiastes 1:2, <b>“Vanity of vanities; all is vanity.”</b> The Hebrew is <b>hevel</b>; the LXX renders it ματαιότης.</p><p>Paul is saying: the futility Ecclesiastes describes is <b>real</b>. The whole creation genuinely is subject to it.</p><p>But Ecclesiastes does not finish the sentence. Romans 8:21 finishes it:<br><b>“the creation itself also will be delivered from the bondage of decay.”</b></p><p><b>★ Third light: two συν- words and the picture of childbirth</b></p><pre>συστενάζει  —  groaning together\nσυνωδίνει   —  in labour together</pre><p>ὠδίν is <b>the pain of giving birth</b>.</p><p>This image is decisive: <b>labour pain is not the pain of dying. It is the pain of delivering.</b> It has a direction. It has an end. Something comes out of it.</p><p>(Jesus uses the same image in John 16:21: “A woman, when she gives birth, has sorrow because her hour has come; but when she has delivered the child, she no longer remembers the anguish.”)</p>","exp":"<p>8:19–22 gives suffering a cosmic frame.</p><p>What you are going through is not an exception inside the universe.<br><b>The whole creation is in pain</b> — and has been since Genesis 3.</p><p>And Paul makes one decisive distinction:</p><p>Not the groan of a <b>deathbed</b>.<br>The groan of a <b>delivery room</b>.</p>"},{"a":23,"z":25,"star":false,"grk":"<p>23 …ἡμεῖς καὶ αὐτοὶ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες, ἡμεῖς καὶ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν υἱοθεσίαν ἀπεκδεχόμενοι, τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.</p>","lit":"<p>23 “And not only so, but <b>we ourselves, who have the firstfruits of the Spirit</b>, <b>we ourselves groan within</b>, waiting eagerly for <b>adoption</b> — <b>the redemption of our body</b>.”</p><p>24 “For we were saved <b>in hope</b>. But <b>hope that is seen is not hope</b>; for who hopes for what he sees?”</p><p>25 “But if we hope for <b>what we do not see</b>, we <b>wait for it with patience</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>firstfruits</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>the firstfruits</b> (see below)</td></tr><tr><td>groan</td><td>στενάζομεν</td><td>stenazomen</td><td>G4727</td><td><b>to groan</b> (the second groan)</td></tr><tr><td>redemption</td><td>ἀπολύτρωσις</td><td>apolytrōsis</td><td>G629</td><td><b>a buying back</b> (<b>same word as 3:24</b>)</td></tr></table>","gram":"<p><b>★ First light: aparchē — the firstfruits</b></p><p>This is Old Testament sacrificial language (Leviticus 23:10; Deuteronomy 26:1–11): at harvest, you brought <b>the first sheaf to ripen</b> and offered it to God.</p><p>Its meaning is this: the firstfruits are not “a small portion.” They are <b>the guarantee of the whole harvest</b>. Once the firstfruits are in, the rest is certain to follow.</p><p>Paul says: the Spirit is that first sheaf. What you experience of the Spirit now is not the whole — it is <b>the guarantee</b>.<br>(Ephesians 1:14 uses a different word, ἀρραβών, a <b>deposit</b> — the same logic.)</p><p><b>★ Second light: a crucial tension</b></p><pre>8:15  we have “already” received adoption (υἱοθεσία)\n8:23  we are “waiting” for adoption (υἱοθεσία)</pre><p>The same word: one “already,” one “not yet.”</p><p>This is the heart of New Testament eschatology: <b>already / not yet</b>.<br>In law, the adoption is complete (8:15). But <b>the son’s estate has not yet been handed over in full</b> (8:23).</p><p><b>★ Third light: “the redemption of our body” is the content of Paul’s hope</b></p><p>Note that Paul does not say “the release of the soul,” but <b>“the redemption of our body.”</b></p><p>Again: the Christian hope is <b>bodily resurrection</b>, not escape from the body.</p>","exp":"<p>8:23 is a very honest sentence: <b>people who have the Spirit still groan.</b></p><p>Paul does not say, “You have the Spirit, so you should not feel anything negative.”<br>He says: we <b>who have the firstfruits of the Spirit</b> — we <b>also</b> groan within.</p><p>Groaning is not unspiritual.<br>Groaning is the evidence that <b>you are not home yet</b>.</p>"},{"a":26,"z":27,"star":true,"grk":"<p>26 Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται τῇ ἀσθενείᾳ ἡμῶν· τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις·</p>","lit":"<p>26 “In the same way the Spirit also <b>comes alongside and lifts with us</b> in our weakness; for we <b>do not know</b> what we ought to pray, but the Spirit himself <b>intercedes for us</b> with <b>groanings that cannot be put into words</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>helps</td><td>συναντιλαμβάνεται</td><td>synantilambanetai</td><td>G4878</td><td>σύν + ἀντί + λαμβάνω</td><td><b>to take hold together, from the other end</b></td><td>see below — a beautiful word</td></tr><tr><td>that cannot be uttered</td><td>ἀλάλητος</td><td>alalētos</td><td>G215</td><td>ἀ + λαλέω (to speak)</td><td><b>beyond words</b></td><td><b>only here in the NT</b></td></tr><tr><td>makes intercession</td><td>ὑπερεντυγχάνει</td><td>hyperentynchanei</td><td>G5241</td><td>ὑπέρ + ἐν + τυγχάνω</td><td><b>to plead earnestly on behalf of</b></td><td><b>only here in the NT</b></td></tr></table>","gram":"<p><b>★ First light: synantilambanomai — “to take hold at the other end”</b></p><p>The word is built of three parts:</p><pre>σύν     (together)\nἀντί    (opposite, facing)\nλαμβάνω (to take hold, to lift)</pre><p>Put together, the picture is this:</p><p>A man cannot lift a heavy beam on his own.<br>Another man comes over, <b>takes the other end</b>, bends down, and <b>lifts it with him</b>.</p><p>The word occurs only twice in the New Testament:</p><table><tr><th>Reference</th><th>Where</th></tr><tr><td><b>Luke 10:40</b></td><td>Martha: “Tell her to <b>help</b> me.”</td></tr><tr><td><b>Romans 8:26</b></td><td>“The Spirit <b>helps</b> our weakness.”</td></tr></table><p>Notice the force of it: <b>the Spirit is not standing on the side shouting encouragement. The Spirit walks to the other end and lifts with you.</b></p><p><b>★ Second light: alalētos — beyond words</b></p><p>Only here in the New Testament. ἀ (not) + λαλέω (to speak) = <b>what cannot be put into speech</b>.</p><p>Paul is describing something very deep: <b>some prayers go down further than sentences can reach.</b></p><p><b>★ Third light: hyperentynchanei — a word Paul appears to have built</b></p><p>Also only here, and very possibly coined by Paul:</p><pre>ἐντυγχάνω    = to intercede, to petition on behalf of someone\nὑπερεντυγχάνω = ὑπέρ (on behalf of / beyond) + intercede</pre><p>And 8:34 uses the same root of Christ:<br>8:34 “who is at the right hand of God, who also <b>makes intercession</b> (ἐντυγχάνει) for us.”</p><p>So chapter 8 has <b>two intercessors</b>: the Spirit prays for me from within (8:26); Christ prays for me in heaven (8:34).<br>One below, one above. One in the heart, one before the throne.</p><p><b>★ Fourth light: 8:26 is the third groan</b></p><pre>8:22  creation   —  groaning together (συστενάζει)\n8:23  we          —  groaning within (στενάζομεν)\n8:26  the Spirit  —  groanings beyond words (στεναγμοῖς ἀλαλήτοις)</pre><p>This is the most staggering thing in the chapter: <b>God himself groans.</b></p><p>He does not stand outside our pain. He comes inside that groan, and with the sound we cannot make, he prays on our behalf.</p><p>(On whether “groanings that cannot be uttered” refers to tongues, see the disputed material.)</p>","exp":"<p>8:26 answers a question many people are afraid to ask: <b>“I don’t even know how to pray — what now?”</b></p><p>Paul’s answer is: <b>that is right, you don’t.</b> “We do not know what we ought to pray.”</p><p>But that is not the problem — because there is One inside you praying for you.</p>"},{"a":28,"z":28,"star":true,"grk":"<p>οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσιν τὸν θεὸν πάντα συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.</p>","lit":"<p>“And <b>we know</b> that for those who love God, all things <b>work together</b> for good — for those who are called according to his <b>purpose</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>work together</td><td>συνεργεῖ</td><td>synergei</td><td>G4903</td><td>σύν + ἔργον: <b>to work together</b> (English “synergy”)</td></tr><tr><td>good</td><td>ἀγαθόν</td><td>agathon</td><td>G18</td><td>good, benefit</td></tr><tr><td>purpose</td><td>πρόθεσις</td><td>prothesis</td><td>G4286</td><td><b>a plan set out beforehand</b></td></tr></table>","gram":"<p><b>★ First light: a textual note</b></p><p>Some early manuscripts (P46, Vaticanus) have ὁ θεός (God) after συνεργεῖ:<br>“<b>God</b> works all things together for good…”</p><table><tr><th>Reading</th><th>Sense</th></tr><tr><td>without ὁ θεός</td><td>all things work together for good</td></tr><tr><td>with ὁ θεός</td><td><b>God</b> works all things together for good</td></tr></table><p>Either way the effective subject is God — “all things” do not cooperate by themselves, and the context (8:29–30) says explicitly that God is the one at work.</p><p><b>★ Second light: the two qualifiers in the verse</b></p><p>Paul gives two qualifiers that are usually dropped when the verse is quoted:</p><pre>Qualifier one: “for those who LOVE GOD”\nQualifier two: “who are CALLED according to his purpose”</pre><p>This is not a piece of universal optimism. It is a promise made to the children of God.</p><p><b>★ Third light: what is “the good”? The next verse defines it</b></p><p>Many read “good” as “things will turn out well.” But Paul defines it immediately in 8:29:<br><b>“to be conformed to the image of his Son.”</b></p><p>This is one of the most important clarifications in the chapter: the good God speaks of is not <b>“your circumstances will improve”</b> but <b>“you will come to look more and more like his Son.”</b></p>","exp":"<p>(On the misuse of this verse, see the disputed material — it may be the single most misapplied verse in the Bible.)</p><p>Paul does <b>not</b> say “all things are good.”</p><p>He says all things <b>work together</b> — the things themselves may be bad, painful, and things that ought never to have happened. But God is able to <b>weave them into</b> a purpose.</p>"},{"a":29,"z":30,"star":true,"grk":"<p>29 ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς· 30 οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.</p>","lit":"<p>29 “For <b>those whom he foreknew</b>, he also <b>predestined</b> to be <b>conformed to the image of his Son</b>, that he might be the <b>firstborn</b> among many brothers.”</p><p>30 “And <b>those whom he predestined</b>, he also <b>called</b>; and those whom he called, he also <b>justified</b>; and those whom he justified, he also <b>glorified</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>foreknew</td><td>προέγνω</td><td>proegnō</td><td>G4267</td><td>πρό + γινώσκω: <b>to know beforehand</b> (see below)</td></tr><tr><td>predestined</td><td>προώρισεν</td><td>proōrisen</td><td>G4309</td><td>πρό + ὁρίζω (to mark a boundary): <b>to mark out beforehand</b></td></tr><tr><td>conformed to</td><td>συμμόρφους</td><td>symmorphous</td><td>G4832</td><td>σύν + μορφή: <b>having the same form as</b></td></tr><tr><td>firstborn</td><td>πρωτότοκος</td><td>prōtotokos</td><td>G4416</td><td><b>firstborn; holding first place</b></td></tr><tr><td>glorified</td><td>ἐδόξασεν</td><td>edoxasen</td><td>G1392</td><td><b>aorist!</b> (see below)</td></tr></table>","gram":"<p><b>★ First light: five aorists — including the last one</b></p><pre>προέγνω    (foreknew)    — aorist\nπροώρισεν  (predestined) — aorist\nἐκάλεσεν   (called)      — aorist\nἐδικαίωσεν (justified)   — aorist\nἐδόξασεν   (glorified)   — aorist  ★★</pre><p>That last one is the point.</p><p>“Glorified” is something that <b>has not happened yet</b> — 8:18 has just spoken of “the glory that is going to be revealed.”<br>Yet Paul uses the <b>aorist</b>, the tense for something already accomplished.</p><p>This usage is sometimes called the <b>prophetic aorist</b>: a future God has spoken, so certain that it can be told in the past tense.</p><p><b>★ Second light: two readings of proginōskō (★ the main dispute)</b></p><p>“Those whom he foreknew” — this word sits at the centre of the predestination debate.</p><table><tr><th>Reading</th><th>Argument</th><th>Tradition</th></tr><tr><td><b>Foreknowledge = electing love</b></td><td>“To know” carries the biblical, relational sense (Genesis 4:1, “Adam <b>knew</b> his wife”; Amos 3:2, “You only have I <b>known</b> of all the families of the earth”); God set his love upon them beforehand</td><td>Reformed</td></tr><tr><td><b>Foreknowledge = foreseeing</b></td><td>God <b>saw beforehand</b> who would believe, and predestined accordi
