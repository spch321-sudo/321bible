妹，10:14–15是全本聖經最重要的宣教經文之一。</p><p>而它的邏輯是<b>從第九章直接推出來的</b>：</p><pre>第九章：神主權的揀選\n   ↓\n第十章1節：所以我為他們禱告\n   ↓\n第十章13節：凡求告主名的，就必得救\n   ↓\n第十章14節：然而，未曾聽見的，怎能信呢？\n   ↓\n所以——【要有人去】</pre><p>弟兄姊妹，保羅顯然不覺得「神的主權」與「宣教的迫切」互相矛盾。</p><p>對他來說，前者正是後者的<b>根據</b>。</p>"},{"a":16,"z":17,"star":false,"grk":"<p>17 ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος Χριστοῦ.</p>","lit":"<p>16「只是<b>他們並非都聽從了</b>那福音。因為以賽亞說：『主啊，<b>我們所傳的，有誰信呢</b>？』」<br>17「<b>所以</b>，信是<b>從聽而來</b>；而聽，是<b>藉著基督的話</b>。」</p><p>【第四段｜10:18–21　他們聽見了嗎？】</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>聽從</td><td>ὑπήκουσαν</td><td>hypēkousan</td><td>G5219</td><td><b>在底下聽</b>（<b>5:19、6:16同字根！</b>）</td></tr><tr><td>聽道</td><td>ἀκοή</td><td>akoē</td><td>G189</td><td><b>聽見的內容／所傳的信息</b></td></tr><tr><td>基督的話</td><td>ῥήματος Χριστοῦ</td><td>—</td><td>G4487</td><td><b>基督的話</b>（見下）</td></tr></table>","gram":"<p>★ 亮光一：ὑπακούω ——又是「在底下聽」</p><p>「人沒有都<b>聽從</b>福音」——ὑπακούω。</p><p>這個字我們追蹤過：</p><pre>5:19  「因一人的順從（ὑπακοή）」—— 基督在底下聽\n6:16  「作順命（ὑπακοή）的奴僕」\n10:16 「人沒有都聽從（ὑπακούω）福音」</pre><p>弟兄姊妹，保羅用「聽從」而不是「相信」——</p><p>因為信心的本質，就是<b>在底下聽</b>。</p><p>★ 亮光二：10:16引以賽亞書53:1</p><p>「主啊，我們所傳的有誰信呢？」</p><p>這是<b>受苦僕人之歌</b>的開頭。</p><p>弟兄姊妹，以賽亞書53章的第一句話，就是一聲<b>歎息</b>：</p><p>「有誰信呢？」</p><p>保羅在說：先知早就知道，不是所有人都會信。</p><p>★ 亮光三：「基督的話」的兩種理解</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>關於基督的話</b></td><td>受詞所有格：所傳的信息是關於基督的</td></tr><tr><td><b>基督所說的話</b></td><td>主詞所有格：是基督親自在傳道人的話語中說話</td></tr></table><p>兩種都有支持者，而且都合乎保羅的神學。</p><p>第二種特別美：當傳道人開口，是<b>基督在說話</b>。<br>（比較林後5:20「神藉我們勸你們」）</p>","exp":"<p>10:17是全本聖經對「信心從哪裡來」最簡潔的回答：</p><pre>信心 ← 聽見 ← 基督的話</pre><p>弟兄姊妹，這一節同時說了兩件事：</p><p>① 信心不是自己生出來的——它從<b>聽</b>來。<br>② 所以<b>必須有人說</b>。</p>"},{"a":18,"z":20,"star":false,"grk":"<p>18 …εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.<br>19 …ἐγὼ παραζηλώσω ὑμᾶς ἐπ' οὐκ ἔθνει, ἐπ' ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.<br>20 …εὑρέθην [ἐν] τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.</p>","lit":"<p>18「但我要說：<b>他們難道沒有聽見嗎</b>？<b>誠然聽見了</b>——『他們的<b>聲音</b>傳遍全地，他們的<b>話語</b>傳到<b>世界的盡頭</b>。』」<br>19「但我要說：<b>以色列難道不知道嗎</b>？<b>首先摩西說</b>：『我要用<b>那不成子民的</b>，<b>惹動你們的嫉妒</b>；用<b>那無知的民</b>，<b>觸動你們的怒氣</b>。』」<br>20「而以賽亞<b>放膽說</b>：『<b>那沒有尋找我的，我讓他們遇見了我</b>；<b>那沒有求問我的，我向他們顯現了</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>惹動憤恨</td><td>παραζηλώσω</td><td>parazēlōsō</td><td>G3863</td><td>παρά + ζῆλος：<b>激起嫉妒／熱心</b></td></tr><tr><td>放膽</td><td>ἀποτολμᾷ</td><td>apotolma</td><td>G662</td><td><b>大膽到底、豁出去說</b></td></tr></table>","gram":"<p>★ 亮光一：παραζηλόω ——第十一章的鑰匙</p><p>10:19引申命記32:21：「我要用那不成子民的，<b>惹動你們的憤恨</b>。」</p><p>這個字（παραζηλόω）由 παρά + ζῆλος（熱心、嫉妒）組成。</p><p>而ζῆλος 正是10:2「他們向神有<b>熱心</b>」的那個字！</p><p>弟兄姊妹，這個字在第十一章成為關鍵：</p><p>11:11「反倒因他們的過失，救恩便臨到外邦人，要<b>激動他們發憤</b>（παραζηλόω）。」<br>11:14「或者可以<b>激動</b>我骨肉之親<b>發憤</b>（παραζηλόω），好救他們一些人。」</p><p>神的策略是：藉著外邦人的蒙恩，激起以色列的渴慕。</p><p>★ 亮光二：ἀποτολμάω ——「放膽」</p><p>「以賽亞<b>放膽</b>說」——這個字在新約只出現這一次。</p><p>它的意思是：<b>豁出去、大膽到底</b>。</p><p>保羅在說：以賽亞說了一句很大膽的話——</p><p>「<b>沒有尋找我的</b>，我叫他們遇見。」（賽65:1）</p><p>弟兄姊妹，這句話與羅3:11形成完美的對應：</p><pre>3:11   「沒有尋求神的」\n10:20  「沒有尋找我的，我叫他們遇見」</pre><p>既然沒有人尋求神——<br>那唯一的可能，就是<b>神來找人</b>。</p>","exp":"<p>弟兄姊妹，18–20節在回答一個藉口：「他們是不是根本沒機會？」</p><p>保羅的回答是三個「不」：</p><pre>18節：他們沒聽見嗎？—— 聽見了\n19節：他們不知道嗎？—— 摩西早就說了\n20節：那是新的嗎？   —— 以賽亞早就說了</pre><p><b>經文本身明確表達的：</b> 信息確實傳開了；而外邦人蒙恩，是舊約早已預告的（申32:21；賽65:1）。</p><p><b>可以合理推論的：</b> 20節與3:11形成一組極美的對照——</p><p>3:11「<b>沒有尋求神的</b>。」<br>10:20「<b>沒有尋找我的</b>，我叫他們遇見。」</p><p>既然沒有人尋求神，那唯一的可能，就是<b>神來找人</b>。</p><p><b>⚠ 講台誠信提醒：</b> 10:18引詩19:4講「聲音傳遍全地」，<br>不可用來論證「福音已經傳遍世界，所以不必再宣教」——<br>因為保羅自己在15:20–24仍然計畫要去西班牙，去「未曾聞知他信息的」地方。</p>"},{"a":21,"z":21,"star":true,"grk":"<p>πρὸς δὲ τὸν Ἰσραὴλ λέγει· ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.</p>","lit":"<p>「但論到以色列，祂說：『<b>整整一天</b>，我<b>張開了我的雙手</b>，向著一個<b>不肯被說服、又頂嘴</b>的百姓。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>整天</td><td>ὅλην τὴν ἡμέραν</td><td>holēn tēn hēmeran</td><td>G3650</td><td>—</td><td><b>一整天，從早到晚</b></td><td>—</td></tr><tr><td>伸手</td><td>ἐξεπέτασα</td><td>exepetasa</td><td>G1600</td><td>ἐκ + πετάννυμι（張開）</td><td><b>完全張開、展開</b></td><td>見下</td></tr><tr><td>悖逆</td><td>ἀπειθοῦντα</td><td>apeithounta</td><td>G544</td><td>ἀ + πείθω（說服）</td><td><b>不肯被說服</b></td><td><b>2:8同字</b></td></tr><tr><td>頂嘴</td><td>ἀντιλέγοντα</td><td>antilegonta</td><td>G483</td><td>ἀντί + λέγω</td><td><b>對著說、反駁</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ἐκπετάννυμι ——「張開雙手」</p><p>這個動詞的意思是「<b>完全張開、展開</b>」（如張開翅膀、展開帆）。</p><p>而「雙手」是<b>複數</b>。</p><p>弟兄姊妹，這個姿勢是什麼？</p><p>不是指責的手指。<br>不是握緊的拳頭。</p><p>是一個<b>張開雙臂、等著人回來</b>的姿勢。</p><p>★ 亮光二：ὅλην τὴν ἡμέραν ——整整一天</p><p>「整天」不是「有時候」。</p><p>是<b>從早到晚，一刻沒有放下</b>。</p><p>★ 亮光三：ἀπειθέω ——「不肯被說服」</p><p>這個字不是「不知道」，是 <b>ἀ + πείθω（說服）</b>——</p><p>「<b>不肯被說服</b>」。</p><p>而這個字我們在2:8見過：</p><p>2:8「惟有結黨、<b>不順從</b>（ἀπειθοῦσιν）真理、反順從不義的。」</p><p>問題不是資訊不足，是<b>不肯</b>。</p><p>★ 亮光四：全章的最後一個畫面是神的姿勢</p><p>弟兄姊妹，這一點極其重要。</p><p>保羅講了一整章「人的責任」：</p><p>- 你要相信（10:9）<br>- 你要承認（10:9）<br>- 你要求告（10:13）<br>- 有人要去傳（10:14–15）</p><p>然後最後一節，鏡頭轉了。</p><p>從人的手，轉到<b>神的手</b>。</p><p>而神的手，是<b>張開的</b>。</p><p>而且——<b>整天</b>。</p>","exp":"<p>弟兄姊妹，10:21引自以賽亞書65:2。</p><p>而那一段的上下文是：</p><p>賽65:2「我整天伸手招呼那悖逆的百姓——<br>就是隨自己的意念行不善之道的。」</p><p>這是一段<b>控訴</b>。</p><p>但那個控訴的形式，是——</p><p>一雙伸了一整天的手。</p><p>弟兄姊妹，如果你今天心裡有一個名字——一個你等了很久的人——</p><p>請記得這一節。</p><p>你等他等了很久。</p><p>而神——</p><p>祂的手，已經伸了一整天。</p>"}],"11":[{"a":1,"z":2,"star":true,"grk":"<p>1 Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.<br>2 οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω.</p>","lit":"<p>1「那麼我說，神<b>推開</b>了祂的百姓嗎？<b>絕不可能</b>！因為我自己也是以色列人，亞伯拉罕的後裔，屬便雅憫支派。」<br>2「神並沒有推開祂<b>預先所認識</b>的百姓。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>棄絕</td><td>ἀπώσατο</td><td>apōsato</td><td>G683</td><td>ἀπό + ὠθέω（推）</td><td><b>推開、推走</b></td><td>見下</td></tr><tr><td>預先所知道</td><td>προέγνω</td><td>proegnō</td><td>G4267</td><td>πρό + γινώσκω</td><td><b>預先認識</b></td><td><b>8:29同字！</b></td></tr></table>","gram":"<p>★ 亮光一：ἀπωθέομαι 的舊約背景</p><p>這個字（ἀπό ＋ ὠθέω「推」）的意思是「<b>推開、推走</b>」。</p><p>而它在七十士譯本中，出現在兩處極重要的經文：</p><p>撒上12:22「耶和華既喜悅選你們作他的子民，就必因他的大名<b>不撇棄</b>你們。」<br>詩94:14（LXX 93:14）「因為耶和華必不<b>丟棄</b>他的百姓，也不離棄他的產業。」</p><p>弟兄姊妹，保羅在11:1用的問句，幾乎就是引用詩篇94:14的用語。</p><p>他在說：<b>這個問題，聖經自己早就回答過了</b>。</p><p>★ 亮光二：προγινώσκω ——第八章那個字</p><pre>8:29  「因為他預先所知道（προέγνω）的人，就預先定下……」\n   ↓\n11:2  「神並沒有棄絕他預先所知道（προέγνω）的百姓。」</pre><p>同一個字。</p><p>第八章：神預先所知道的<b>人</b>，祂會帶到得榮耀。<br>第十一章：神預先所知道的<b>百姓</b>，祂沒有推開。</p><p>★ 亮光三：保羅拿自己當第一個證據</p><p>「因為<b>我也是</b>以色列人。」</p><p>弟兄姊妹，這是一個極簡單、卻極有力的論證：</p><p>你問神有沒有丟棄以色列人？</p><p>那麼——<b>寫這封信的人是誰</b>？</p>","exp":"<p>弟兄姊妹，第十一章從一個問題開始——而那是第十章最後一節逼出來的。</p><p>10:21「我<b>整天伸手</b>招呼那悖逆頂嘴的百姓。」</p><p>那隻手伸了一整天。而他們不理。</p><p>所以：<b>神是不是要收手了</b>？</p><p><b>經文本身明確表達的：</b> 神沒有推開（ἀπωθέομαι）祂的百姓；證據之一，就是保羅自己。</p><p><b>可以合理推論的：</b> 保羅用的動詞，正是舊約的用語——<br>詩94:14「耶和華必不<b>丟棄</b>他的百姓」；撒上12:22「必因他的大名<b>不撇棄</b>你們」。</p><p>他在說：<b>這個問題，聖經自己早就回答過了</b>。</p><p>而2節「他<b>預先所知道</b>的百姓」（προγινώσκω），正是8:29那個字。</p><p>弟兄姊妹，這對我們的意義是：</p><p>如果神會對以色列反悔，那第八章的金鏈也會鬆。<br>而祂不會。</p>"},{"a":2,"z":5,"star":true,"grk":"<p>4 ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.<br>5 οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ' ἐκλογὴν χάριτος γέγονεν·</p>","lit":"<p>2下「你們豈不曉得經上在<b>以利亞那一段</b>說什麼嗎？——他怎樣<b>向神控訴以色列</b>：」<br>3「『主啊，他們殺了你的先知，拆了你的祭壇；<b>只剩下我一個人</b>，他們還在尋索我的命。』」<br>4「但神的<b>回話</b>（神諭）對他說什麼呢？——『<b>我為自己留下了七千人</b>，是<b>未曾向巴力屈膝</b>的。』」<br>5「照樣，<b>在現今這時候</b>，也有<b>照著恩典的揀選</b>所留下的<b>餘數</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>回話</td><td>χρηματισμός</td><td>chrēmatismos</td><td>G5538</td><td><b>神諭、神的正式答覆</b>（新約僅此一次）</td></tr><tr><td>留下</td><td>κατέλιπον</td><td>katelipon</td><td>G2641</td><td><b>我為自己保留下來</b>（<b>主動，主詞是神</b>）</td></tr><tr><td>餘數</td><td>λεῖμμα</td><td>leimma</td><td>G3005</td><td><b>剩下的</b></td></tr><tr><td>揀選的恩典</td><td>ἐκλογὴν χάριτος</td><td>eklogēn charitos</td><td>G1589/G5485</td><td><b>恩典的揀選</b></td></tr></table>","gram":"<p>★ 亮光一：以利亞的處境</p><p>以利亞說這話的時候，剛剛在迦密山上大獲全勝（王上18章）。</p><p>然後耶洗別派人傳一句話，他就逃到曠野，坐在羅騰樹下求死（王上19:4）。</p><p>而他對神說的話是：</p><p>「<b>只剩下我一個人</b>。」</p><p>弟兄姊妹，這是一個屬靈偉人，在最深的孤單中說的話。</p><p>而神的回答不是責備。</p><p>★ 亮光二：κατέλιπον ἐμαυτῷ ——「我為<b>自己</b>留下」</p><p>注意這個動詞的兩個細節：</p><pre>κατέλιπον —— 【主動語態】，主詞是【神】\nἐμαυτῷ    —— 【為我自己】</pre><p>弟兄姊妹，那七千人不是「碰巧沒有跪拜巴力」。</p><p>是<b>神為自己保留下來的</b>。</p><p>（王上19:18希伯來原文同樣是「我要在以色列人中<b>為自己存留</b>七千人」。）</p><p>★ 亮光三：11:5的「如今也是這樣」</p><p>「如今也是這樣，照著<b>揀選的恩典</b>，還有所留的餘數。」</p><p>弟兄姊妹，保羅在說：</p><p>以利亞的時代是這樣。</p><p>現在——<b>也是這樣</b>。</p><p>今天仍然有餘數。</p>","exp":"<p>弟兄姊妹，以利亞說這句話的時候，剛剛在迦密山上大獲全勝（王上18章）。</p><p>然後耶洗別派人傳一句話——他就逃到曠野，坐在羅騰樹下求死。</p><p>「<b>只剩下我一個人</b>。」</p><p>而神的回答不是責備。</p><p><b>經文本身明確表達的：</b> 神為自己保留了七千人；照樣，現今也有照恩典揀選所留的餘數。</p><p><b>可以合理推論的：</b> 那個動詞是<b>主動語態</b>，主詞是<b>神</b>，而且加了「<b>為自己</b>」（κατέλιπον ἐμαυτῷ）。</p><p>那七千人不是「碰巧沒有跪拜巴力」——是<b>神為自己保留下來的</b>。</p><p>而以利亞，<b>完全不知道</b>。</p><p><b>⚠ 牧養提醒：</b> 若有人今天覺得「只剩我一個」，<br>這一段最重要的話不是「你要剛強」，是：<b>你不知道的事，比你知道的多</b>。</p>"},{"a":6,"z":6,"star":true,"grk":"<p>εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται χάρις.</p>","lit":"<p>「但若是出於恩典，就不再是出於行為；<b>否則，恩典就不再成其為恩典了</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>恩典</td><td>χάρις</td><td>charis</td><td>G5485</td><td><b>白白給的、不能賺的</b></td></tr><tr><td>行為</td><td>ἔργα</td><td>erga</td><td>G2041</td><td>工作、所做的事</td></tr><tr><td>不然</td><td>ἐπεί</td><td>epei</td><td>G1893</td><td><b>否則、若不然</b>（引出反證）</td></tr><tr><td>就不是</td><td>οὐκέτι γίνεται</td><td>ouketi ginetai</td><td>G3765/G1096</td><td><b>就不再成其為</b></td></tr></table>","gram":"<p>★ 這是全本聖經對「恩典」最簡潔的定義性宣告</p><p>保羅的邏輯極其乾淨：</p><pre>恩典 ＋ 一點行為 ＝ 不是恩典</pre><p>弟兄姊妹，這句話的意思是：</p><p>恩典<b>不能摻水</b>。</p><p>只要摻進一滴「因為我……」，它就<b>在定義上</b>不再是恩典了。</p><p>這與第四章完全一致：</p><p>4:4「作工的得工價，<b>不算恩典</b>，乃是該得的。」</p>","exp":"<p>弟兄姊妹，11:6是全本聖經對「恩典」最乾淨的一句定義。</p><p>而它的邏輯不是道德性的，是<b>定義性的</b>：</p><pre>恩典 ＋ 一點行為 ＝ 不是恩典</pre><p><b>經文本身明確表達的：</b> 若是出於恩典，就不再是出於行為；否則恩典就不再成其為恩典。</p><p><b>可以合理推論的：</b> 保羅不是說「摻一點行為會比較不好」，<br>他是說：<b>摻了之後，那個東西就換了名字</b>。</p><p>只要摻進一滴「因為我……」，它在<b>定義上</b>已經不是恩典了。</p><p><b>⚠ 牧養提醒：</b> 這一節最常被用在別人身上，其實最該用在自己身上。<br>問一句：我心裡是不是有一句「可是我畢竟……」？</p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 …ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,<br>8 …ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.</p>","lit":"<p>7「那麼怎麼樣呢？<b>以色列所尋求的，他們沒有得著</b>；<b>惟有蒙揀選的得著了</b>，其餘的<b>就變硬了</b>（結了繭）。」<br>8「正如經上所記：『神給了他們<b>昏沉的靈</b>、<b>看不見的眼</b>、<b>聽不見的耳</b>，<b>直到今日</b>。』」<br>9「大衛也說：『願他們的<b>筵席</b>變成<b>網羅</b>、<b>陷阱</b>、<b>絆腳石</b>，作他們的<b>報應</b>；』」<br>10「『願他們的眼睛<b>昏暗看不見</b>，願你使他們的<b>腰永遠彎下</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>頑梗不化</td><td>ἐπωρώθησαν</td><td>epōrōthēsan</td><td>G4456</td><td>πῶρος（<b>硬皮、結石</b>）：<b>變硬、結痂</b></td></tr><tr><td>昏迷的心</td><td>πνεῦμα κατανύξεως</td><td>pneuma katanyxeōs</td><td>G2659</td><td><b>麻木、昏沉的靈</b></td></tr></table>","gram":"<p>★ 亮光一：πωρόω 與 σκληρύνω 的差別</p><p>羅馬書用了兩個不同的「剛硬」：</p><table><tr><th>字</th><th>出處</th><th>畫面</th></tr><tr><td><b>σκληρύνω</b></td><td>9:18（法老）</td><td><b>硬化、變硬</b></td></tr><tr><td><b>πωρόω</b></td><td>11:7、11:25</td><td><b>πῶρος ＝ 結石、硬皮</b>——像<b>長繭、結痂</b></td></tr></table><p>弟兄姊妹，πωρόω 的畫面很有意思：</p><p>它是一種<b>長期摩擦之後長出來的繭</b>。</p><p>（醫學上也用於骨折癒合時形成的骨痂）</p><p>★ 亮光二：這一段是本章最沉重的</p><p>11:8–10引用了申29:4、賽29:10、詩69:22–23——全部是審判的話。</p><p>弟兄姊妹，保羅沒有淡化這件事。</p><p>他誠實地說：<b>其餘的成了頑梗不化的</b>。</p><p>但請注意接下來的11:11：</p><p>「他們失腳是要他們<b>跌倒</b>嗎？<b>斷乎不是</b>！」</p><p>保羅講完最沉重的一段，立刻轉向盼望。</p>","exp":"<p>弟兄姊妹，7–10節是全章<b>最沉重</b>的一段。</p><p>保羅沒有淡化它。他甚至引了三段舊約來加重它（申29:4、賽29:10、詩69:22–23）。</p><p><b>經文本身明確表達的：</b> 以色列所尋求的沒有得著；蒙揀選的得著了；其餘的變硬了。</p><p><b>可以合理推論的：</b> 「頑梗」（πωρόω）的字根是 <b>πῶρος ＝ 硬皮、結石</b>——<br>那是<b>長期摩擦之後長出來的繭</b>。</p><p>這與9:18的 σκληρύνω（硬化）不同：那是「變硬」，這是「<b>結了繭</b>」。</p><p>而必須注意的平衡：</p><table><tr><th>經文</th><th>說法</th></tr><tr><td><b>11:8</b></td><td><b>神</b>給他們昏迷的心</td></tr><tr><td><b>11:20</b></td><td>他們<b>因為不信</b>，所以被折下來</td></tr><tr><td><b>11:23</b></td><td>他們<b>若不是長久不信</b>，仍要被接上</td></tr></table><p>保羅在同一章裡，兩面都說了。任何只講一面的讀法都不完整。</p><p><b>⚠ 牧養提醒：</b> 讀到這裡<b>不可以停</b>。<br>下一節（11:11）立刻問：「他們失腳是要他們跌倒嗎？<b>斷乎不是</b>！」</p><p>【第二段｜11:11–16　跌倒的目的】</p>"},{"a":11,"z":12,"star":true,"grk":"<p>11 …μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν εἰς τὸ παραζηλῶσαι αὐτούς.</p>","lit":"<p>11「那麼我要說：<b>他們絆了一下，是為了要他們倒下去嗎</b>？<b>絕不可能</b>！反倒因著他們的<b>過失</b>，救恩臨到了外邦人，<b>為要激起他們的嫉妒</b>。」<br>12「如果他們的<b>過失</b>成了世界的<b>富足</b>，他們的<b>虧損</b>成了外邦人的富足，<b>何況他們的滿數呢</b>！」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>失腳</td><td>ἔπταισαν</td><td>eptaisan</td><td>G4417</td><td>πταίω</td><td><b>絆了一下、踉蹌</b></td><td>見下</td></tr><tr><td>跌倒</td><td>πέσωσιν</td><td>pesōsin</td><td>G4098</td><td>πίπτω</td><td><b>摔倒、倒下去</b>（<b>不能起來</b>）</td><td>見下</td></tr><tr><td>激動發憤</td><td>παραζηλῶσαι</td><td>parazēlōsai</td><td>G3863</td><td>παρά + ζῆλος</td><td><b>激起嫉妒／渴慕</b></td><td><b>10:19同字</b></td></tr><tr><td>豐滿</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td>πληρόω（充滿）</td><td><b>滿數、完全</b></td><td>11:25同字</td></tr></table>","gram":"<p>★ 亮光一：πταίω 與 πίπτω 的關鍵區別</p><p>保羅刻意用了兩個不同的動詞：</p><pre>ἔπταισαν（πταίω）—— 【絆了一下、踉蹌】—— 可以再站起來\nπέσωσιν（πίπτω） —— 【摔倒、倒下】—— 倒下去起不來</pre><p>弟兄姊妹，保羅的問題是：</p><p>「他們<b>絆了一下</b>，是為了要他們<b>倒下去起不來</b>嗎？」</p><p>回答：<b>斷乎不是</b>。</p><p>這個動詞的區分，是本章盼望的第一個根據。</p><p>★ 亮光二：παραζηλόω ——第十章那個字</p><pre>10:19  「我要用那不成子民的，惹動你們的憤恨（παραζηλόω）」（引申32:21）\n   ↓\n11:11  「要激動他們發憤（παραζηλόω）」\n11:14  「或者可以激動我骨肉之親發憤（παραζηλόω）」</pre><p>弟兄姊妹，這是神的策略：</p><p>藉著<b>外邦人的蒙恩</b>，激起以色列的<b>渴慕</b>。</p><p>而這對外邦信徒有一個直接的含意：</p><p>你們的蒙恩，本身就是為了<b>把他們帶回來</b>。</p><p>所以你們<b>沒有任何誇口的餘地</b>。</p><p>★ 亮光三：πλήρωμα（豐滿）——本章的關鍵字</p><p>這個字在11:12與11:25各出現一次：</p><pre>11:12  他們（以色列）的【豐滿】\n11:25  外邦人的【數目添滿】（πλήρωμα）</pre><p>保羅用同一個字，講兩群人的「滿數」。</p>","exp":"<p>弟兄姊妹，11節的關鍵在<b>兩個不同的動詞</b>上，而中文都譯成「跌」。</p><pre>πταίω（失腳）—— 絆了一下、踉蹌 —— 【還可以站起來】\nπίπτω（跌倒）—— 摔下去、倒在地上 —— 【起不來了】</pre><p>保羅問的是：「他們<b>絆了一下</b>，是為了讓他們<b>倒下去起不來</b>嗎？」</p><p>答案：<b>斷乎不是</b>。</p><p><b>經文本身明確表達的：</b> 以色列的過失不是終局；它在神的計畫中有一個目的——使救恩臨到外邦人，並激起以色列的渴慕。</p><p><b>可以合理推論的：</b> 這個動詞的區分，<b>是全章盼望的第一個根據</b>。</p><p>而它對我們也有話說：<b>你心裡那個人，他絆了一下——但那不等於他倒下去起不來了</b>。</p><p>而12節是保羅的「輕重論證」（第五章那個「何況」）：</p><p>如果他們的<b>失敗</b>都帶來這麼大的祝福——</p><p>那他們的<b>歸回</b>會帶來什麼？</p>"},{"a":13,"z":16,"star":false,"grk":"<p>13 Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν· ἐφ' ὅσον μὲν οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,<br>15 εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;</p>","lit":"<p>13「我是<b>對你們外邦人</b>說這話：既然我是<b>外邦人的使徒</b>，我就<b>榮耀我的職分</b>——」<br>14「<b>或者可以激起我骨肉之親的嫉妒</b>，好<b>救他們一些人</b>。」<br>15「因為，若他們被<b>丟棄</b>，就使世界<b>與神和好</b>；那他們<b>被收納</b>，<b>豈不是死裡復生嗎</b>？」<br>16「所獻的<b>初熟麵團</b>若是聖潔，<b>全團</b>也就聖潔了；<b>樹根</b>若是聖潔，<b>樹枝</b>也就聖潔了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>敬重</td><td>δοξάζω</td><td>doxazō</td><td>G1392</td><td><b>榮耀、看重</b>（原文是「榮耀我的職分」）</td></tr><tr><td>和好</td><td>καταλλαγή</td><td>katallagē</td><td>G2643</td><td><b>和好</b>（<b>5:10–11同字</b>）</td></tr><tr><td>死而復生</td><td>ζωὴ ἐκ νεκρῶν</td><td>zōē ek nekrōn</td><td>—</td><td><b>從死人中來的生命</b></td></tr><tr><td>新麵</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>初熟的果子</b>（<b>8:23同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：11:13–14保羅的策略</p><p>「我是外邦人的使徒，所以<b>榮耀我的職分</b>，<br>或者可以<b>激動我骨肉之親發憤</b>，好救他們一些人。」</p><p>弟兄姊妹，這是一件很動人的事：</p><p>保羅認真做外邦人的使徒——<br>部分原因是他希望：<b>當猶太人看見外邦人得著了，會渴慕</b>。</p><p>★ 亮光二：11:16的兩個比喻</p><pre>新麵（ἀπαρχή）／全團（φύραμα）—— 獻祭的初熟果子（民15:20–21）\n樹根（ῥίζα）／樹枝（κλάδοι） —— 引出下面的橄欖樹比喻</pre><p>「根」指什麼？主要有兩種理解：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>列祖（亞伯拉罕、以撒、雅各）</b></td><td>11:28「為列祖的緣故是蒙愛的」支持此說</td></tr><tr><td><b>神的應許／聖約</b></td><td>與11:29「神的恩賜和選召」呼應</td></tr></table><p>兩種理解相通：<b>根是神給列祖的應許</b>。</p>","exp":"<p>弟兄姊妹，13節那句話，是整章的<b>收信人聲明</b>：</p><p>「我<b>對你們外邦人</b>說這話。」</p><p>這一句決定了11:17–24怎麼讀——那是<b>對外邦信徒的警告</b>，不是對猶太人的判詞。</p><p>而13–14節透露了保羅一件很動人的事：</p><p><b>經文本身明確表達的：</b> 保羅認真看重他外邦使徒的職分，部分原因是盼望藉此激起同胞的渴慕，救他們一些人。</p><p><b>可以合理推論的：</b> 這對外邦信徒有一個直接的含意——</p><p>你們的蒙恩，<b>本身就是為了把他們帶回來</b>。<br>所以你們<b>沒有任何誇口的餘地</b>。</p><p><b>⚠ 牧養提醒：</b> 「或者可以救他們<b>一些人</b>」——<br>保羅沒有誇大自己的果效。他用的是很謙卑的說法。</p><p>【第三段｜11:17–24　★ 橄欖樹】</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,<br>18 μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.</p>","lit":"<p>17「但若有些枝子<b>被折斷</b>了，而你這<b>野橄欖</b>卻<b>被接</b>在其中，一同有分於那橄欖根的肥汁——」<br>18「你就<b>不可向那些枝子誇口</b>。你若誇口，<b>不是你在扛著根，乃是根在扛著你</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>被折下來</td><td>ἐξεκλάσθησαν</td><td>exeklasthēsan</td><td>G1575</td><td>ἐκ + κλάω（折斷）</td><td><b>被折斷</b>（被動式）</td><td>—</td></tr><tr><td>野橄欖</td><td>ἀγριέλαιος</td><td>agrielaios</td><td>G65</td><td>ἄγριος（野生的）</td><td><b>野生橄欖</b></td><td>—</td></tr><tr><td>得接</td><td>ἐνεκεντρίσθης</td><td>enekentristhēs</td><td>G1461</td><td>ἐν + κεντρίζω（刺入）</td><td><b>被嫁接進去</b>（被動式）</td><td>本章出現6次</td></tr><tr><td>誇口</td><td>κατακαυχῶ</td><td>katakauchō</td><td>G2620</td><td>κατά + καυχάομαι</td><td><b>對著……誇口、輕看</b></td><td>見下</td></tr><tr><td>托著</td><td>βαστάζεις</td><td>bastazeis</td><td>G941</td><td>βαστάζω</td><td><b>扛著、承受重量</b></td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：兩個被動式</p><pre>ἐξεκλάσθησαν —— 【被】折斷\nἐνεκεντρίσθης —— 【被】接上</pre><p>弟兄姊妹，兩個動詞都是被動式。</p><p>枝子不是自己掉下來的，也不是自己爬上去的。</p><p>有一位在做這件事。</p><p>★ 亮光二：κατακαυχάομαι ——「對著誇口」</p><p>這個字比一般的「誇口」（καυχάομαι）更重：</p><p>κατά（對著、向下）＋ καυχάομαι（誇口）＝ <b>對著某人誇口、以某人為襯托而自誇</b>。</p><p>弟兄姊妹，保羅禁止的不只是「驕傲」，<br>是<b>拿別人的失敗來墊高自己</b>。</p><p>★★ 亮光三：βαστάζω ——「扛著」</p><p>「不是你<b>托著</b>根，乃是根<b>托著</b>你。」</p><p>βαστάζω 的意思是<b>扛起重量、承載</b>。</p><p>（太8:17「代替我們的軟弱，<b>擔當</b>我們的疾病」；加6:2「各人的重擔要互相<b>擔當</b>」——同字）</p><p>弟兄姊妹，這個畫面極其清楚：</p><p>一根枝子從來不會扛著樹根。</p><p>是<b>根在扛著枝子</b>。</p><p>而枝子如果覺得自己很重要——<br>那只說明它忘了自己是被接上去的。</p><p>★ 亮光四：「肥汁」（πιότης）</p><p>「一同得著橄欖根的<b>肥汁</b>」——πιότης ＝ 豐潤的養分、油脂。</p><p>外邦信徒所得的養分，<b>來自那個根</b>——<br>也就是說：來自神給以色列列祖的應許。</p>","exp":"<p>弟兄姊妹，11:17–18是全章的心臟，也是保羅寫第十一章的主要目的。</p><p>11:13說得很清楚：「我<b>對你們外邦人</b>說這話。」</p><p>保羅的警告是：</p><p>你們是<b>被接上去</b>的。</p><p>你們喝的養分，來自一個<b>不是你們的根</b>。</p><p>所以——<b>閉嘴，不要誇口</b>。</p>"},{"a":19,"z":22,"star":true,"grk":"<p>20 …τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ὑψηλὰ φρόνει ἀλλὰ φοβοῦ·<br>22 ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ·</p>","lit":"<p>19「那麼你要說：『<b>那些枝子被折下來，是為了叫我可以接上</b>。』」<br>20「<b>不錯</b>！他們因<b>不信</b>而被折下來；而你因<b>信</b>而<b>站立著</b>。<b>不要心思高傲，反要懼怕</b>。」<br>21「因為神既然<b>沒有愛惜那天然的枝子</b>，<b>也必不愛惜你</b>。」<br>22「所以你要看見神的<b>恩慈</b>與<b>嚴厲</b>：對那些跌倒的人，是嚴厲；對你，是神的恩慈——<b>只要你持續住在祂的恩慈裡</b>；不然，<b>你也要被砍下來</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>自高</td><td>ὑψηλὰ φρόνει</td><td>hypsēla phronei</td><td>G5308/G5426</td><td><b>心思高傲</b>（φρονέω ＝ 8:5「體貼」那個字）</td></tr><tr><td>懼怕</td><td>φοβοῦ</td><td>phobou</td><td>G5399</td><td><b>敬畏、懼怕</b>（命令語氣）</td></tr><tr><td>恩慈</td><td>χρηστότης</td><td>chrēstotēs</td><td>G5544</td><td><b>2:4那個字！</b></td></tr><tr><td>嚴厲</td><td>ἀποτομία</td><td>apotomia</td><td>G663</td><td><b>ἀπό + τέμνω（切）：切斷的果決</b>（新約僅此一次）</td></tr></table>","gram":"<p>★ 亮光一：ἀποτομία ——「切下去」</p><p>這個字由 ἀπό（離開）＋ τέμνω（切）組成——</p><p>字面是：<b>乾脆地切斷</b>。</p><p>而它與同段的動詞完全呼應：</p><p>11:22「不然，你也要<b>被砍下來</b>（ἐκκοπήσῃ）。」</p><p>弟兄姊妹，這個字在新約只出現這一次。</p><p>而它出現在一段對<b>外邦信徒</b>的警告裡。</p><p>★ 亮光二：χρηστότης ——第二章那個字</p><pre>2:4   「你藐視他豐富的【恩慈】（χρηστότης）、寬容、忍耐，\n       不曉得他的恩慈是【領你悔改】呢？」\n   ↓\n11:22 「神的【恩慈】（χρηστότης）和嚴厲……向你是有恩慈的，\n       【只要你長久在他的恩慈裡】。」</pre><p>弟兄姊妹，這個連結極其重要：</p><p>第二章：神的恩慈是<b>領人悔改</b>的。<br>第十一章：神的恩慈是<b>要人長久住在裡面</b>的。</p><p>恩慈從來不是讓人放心自滿的理由。</p><p>★ 亮光三：「你不可自高，反要懼怕」</p><p>μὴ ὑψηλὰ φρόνει ——「不要心思高傲」。</p><p>而 φρονέω 正是8:5「<b>體貼</b>肉體／體貼聖靈」那個字。</p><p>保羅在說：不要讓你的心思往上飄。</p><p>（關於11:20–22的「警告」與「保守」如何協調，見第二十部分。）</p>","exp":"<p>弟兄姊妹，19節把我們心裡那句話寫出來了。</p><p>我們很少把它說出口，但它常常在那裡：</p><p>「那枝子被折下來，是<b>特為叫我接上</b>。」</p><p>白話版就是：<b>還好我不是他們</b>。</p><p>而保羅的回答，第一個字是「<b>不錯</b>」。</p><p>他<b>沒有否認那個事實</b>。他只是問：<b>你憑什麼因為這個而自高</b>？</p><p><b>經文本身明確表達的：</b> 他們因不信被折下，你因信站立；所以不可自高，反要懼怕；並要長久住在神的恩慈裡。</p><p><b>可以合理推論的：</b> 這裡的「懼怕」（φοβοῦ）的<b>對立面是「自高」，不是「確據」</b>——<br>所以它的意思是<b>敬畏、清醒、不敢輕看</b>，不是「你要一直擔心自己會不會得救」。</p><p>而 χρηστότης（恩慈）正是2:4那個字：神的恩慈是<b>領人悔改</b>的，從來不是讓人放心自滿的理由。</p><p><b>⚠ 講台誠信提醒：</b> 不可用11:22恐嚇信徒（那會摧毀第八章的確據），<br>也不可把它淡化成無關痛癢（那會違背保羅的用意）。<br>最忠實的講法：<b>保羅同時給警告與保證，而神的保守正是透過信徒的敬畏實現的</b>（腓2:12–13）。</p>"},{"a":23,"z":24,"star":false,"grk":"<p>23 κἀκεῖνοι δέ, ἐὰν μὴ ἐπιμένωσιν τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ἐστιν ὁ θεὸς πάλιν ἐγκεντρίσαι αὐτούς.<br>24 εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.</p>","lit":"<p>23「而他們，<b>若不是持續停留在不信裡</b>，也必<b>被接上</b>；因為<b>神能夠</b>把他們<b>重新接上</b>。」<br>24「因為你既是<b>從天生的野橄欖上被砍下來</b>，又<b>逆著本性</b>被接在好橄欖上，<b>何況這些本樹的枝子，要被接回自己的橄欖樹上呢</b>！」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>能夠</td><td>δυνατός</td><td>dynatos</td><td>G1415</td><td><b>有能力的</b></td></tr><tr><td>逆著性</td><td>παρὰ φύσιν</td><td>para physin</td><td>G5449</td><td><b>違反自然、反常</b></td></tr></table>","gram":"<p>★ 亮光一：「神<b>能夠</b>」（δυνατὸς γάρ ἐστιν ὁ θεός）</p><p>弟兄姊妹，這句話與第四章遙相呼應：</p><p>4:21「且滿心相信神所應許的<b>必能做成</b>（δυνατός）。」</p><p>亞伯拉罕所信的那位「叫死人復活、使無變為有」的神——<br>也能把折下來的枝子重新接上。</p><p>★ 亮光二：παρὰ φύσιν ——保羅自己承認這是反常的</p><p>「你……尚且<b>逆著性</b>得接在好橄欖上。」</p><p>弟兄姊妹，這一點很重要：</p><p>保羅<b>知道</b>正常的嫁接不是這樣做的。</p><p>他刻意用了一個反常的嫁接，並且自己點出來。</p><p>為什麼？</p><p>因為外邦人得救這件事，本身就是「逆著性」的。</p><p>而如果神連「逆著性」的事都做了——<br>祂當然能做那件「順著性」的事：<b>把本樹的枝子接回本樹</b>。</p>","exp":"<p>弟兄姊妹，這一段最重要的一句是三個字：「<b>神能夠</b>。」</p><p>而這個字（δυνατός），我們在第四章見過：</p><p>4:21「且滿心相信神所應許的<b>必能做成</b>（δυνατός）。」</p><p><b>經文本身明確表達的：</b> 若他們不是長久停留在不信裡，神能夠把他們重新接上。</p><p><b>可以合理推論的：</b> 那位「叫死人復活、使無變為有」的神（4:17），<br>也能把折下來的枝子重新接上。</p><p>而24節的「逆著性」（παρὰ φύσιν）是保羅<b>自己承認</b>的——他知道正常的嫁接不是這樣做的。<br>他刻意用了一個反常的嫁接，因為<b>外邦人得救這件事本身就是逆著性的</b>。</p><p><b>⚠ 牧養提醒：</b> 23節那個條件句（「若不是<b>長久</b>不信」）是給盼望的，不是給計算的。<br>它的用途是：<b>讓你為那個你已經放棄的人，繼續禱告</b>。</p><p>【第四段｜11:25–32　那個奧祕】</p>"},{"a":25,"z":27,"star":true,"grk":"<p>25 …ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ·<br>26 καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται…</p>","lit":"<p>25「……就是<b>部分的</b>硬心臨到以色列，<b>直到</b>外邦人的<b>滿數</b>進來；」<br>26「<b>並且如此</b>（καὶ οὕτως），全以色列都要得救……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>奧祕</td><td>μυστήριον</td><td>mystērion</td><td>G3466</td><td><b>從前隱藏、如今被啟示出來的事</b></td></tr><tr><td>有幾分</td><td>ἀπὸ μέρους</td><td>apo merous</td><td>G3313</td><td><b>部分地</b>（不是全部）</td></tr><tr><td>硬心</td><td>πώρωσις</td><td>pōrōsis</td><td>G4457</td><td><b>結繭、變硬</b>（11:7同字根）</td></tr><tr><td>數目添滿</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td><b>滿數</b>（11:12同字）</td></tr><tr><td>於是</td><td>καὶ οὕτως</td><td>kai houtōs</td><td>G3779</td><td><b>並且如此／照這樣</b>（見下）</td></tr></table>","gram":"<p>★ 亮光一：ἀπὸ μέρους ——「有幾分」</p><p>保羅<b>沒有</b>說「以色列人硬心了」。</p><p>他說：「<b>部分地</b>（ἀπὸ μέρους）硬心臨到以色列。」</p><p>這與11:5「還有所留的餘數」一致：</p><p>硬心是<b>部分的</b>，不是全體的。</p><p>★ 亮光二：ἄχρι οὗ ——「直到」</p><p>「<b>直到</b>外邦人的數目添滿了。」</p><p>弟兄姊妹，「直到」這個詞暗示了一個<b>時限</b>。</p><p>那個硬心，不是永久的狀態。</p><p>★★ 亮光三：καὶ οὕτως ——「於是」還是「照這樣」？</p><p>這是11:26最關鍵的一個文法問題。</p><p>οὕτως 的基本意思是「<b>如此、照這樣</b>」（方式），而不是「然後」（時間）。</p><table><tr><th>讀法</th><th>中譯</th><th>含意</th></tr><tr><td><b>時間性</b></td><td>「然後，以色列全家都要得救」</td><td>外邦人滿數之後，有一個<b>未來的事件</b></td></tr><tr><td><b>方式性</b>（οὕτως 的本義）</td><td>「<b>照這樣</b>，以色列全家都要得救」</td><td>得救是<b>藉著這個過程</b>（激動發憤）發生的</td></tr></table><p>多數學者承認 οὕτως 的基本意義是「方式」，但也指出它在此帶有時間的含意（因為前面有「直到」）。</p><p>★★ 亮光四：「以色列全家都要得救」是什麼意思？</p><p>這是羅馬書最著名的解經爭議之一。必須公平呈現。</p><table><tr><th>觀點</th><th>主張</th><th>主要根據</th></tr><tr><td><b>A. 未來民族性的歸主</b></td><td>在外邦人滿數之後，以色列人將大規模歸向基督</td><td>「直到」暗示時限；11:12、15的「豐滿」「收納」；11:23–24「重新接上」</td></tr><tr><td><b>B. 歷世歷代蒙揀選的以色列人之總數</b></td><td>「全以色列」＝ 神所揀選的所有猶太人，透過歷史逐漸得救</td><td>11:5「餘數」；οὕτως 是方式；避免與9:6「不都是以色列人」衝突</td></tr><tr><td><b>C. 「以色列」＝ 神的子民（包括教會）</b></td><td>「全以色列」指所有蒙揀選的人，猶太人與外邦人</td><td>加6:16「神的以色列」；羅9:6</td></tr></table><p>A、B 是今日福音派的兩種主要立場；C 在改革宗傳統中亦有代表（加爾文傾向此類理解）。</p><p>評估：</p><p>支持A的較強理由：</p><p>- <b>本章的「以色列」（11:1、7、25、26）一貫指</b>血統上的以色列<b>——若26節突然改指教會，語意會斷裂<br>- </b>11:12「他們的豐滿」、11:15「他們被收納」暗示一個尚未發生的事<b><br>- </b>11:28「就著揀選說，他們為列祖的緣故是蒙愛的」</p><p>支持B的較強理由：</p><p>- <b>οὕτως 的基本意義是「方式」</b><br>- <b>與9:6「從以色列生的不都是以色列人」較一致</b></p><p>我的判斷：A 較貼合本章的語意脈絡（「以色列」的一貫用法），但 B 有紮實的文法根據，是完全正統的立場。</p><p>★ 講台誠信提醒：</p><p>這是<b>敬虔學者之間長期存在的差異</b>，不可把任何一方說成異端或不信聖經。</p><p>更重要的是：<b>無論持哪一種立場，本章的</b>牧養重點<b>都一樣</b>——</p><p>「你不可向舊枝子誇口」（11:18）；「不是你托著根，乃是根托著你」。</p><p>★ 亮光五：11:26–27的引文</p><p>引自賽59:20–21 ＋ 賽27:9。</p><p>「必有一位救主從錫安出來」——</p><p>希伯來原文（賽59:20）是「必有一位救贖主<b>來到錫安</b>」；<br>七十士譯本作「<b>從錫安</b>出來」。保羅所引接近七十士譯本。</p><p>（關於這是指第一次來或第二次來，學者也有不同看法。）</p>","exp":"<p>弟兄姊妹，這是全章<b>最有爭議</b>的一段。而讀它之前，要先注意兩個限定詞。</p><p>① 「有幾分」（ἀπὸ μέρους）——</p><p>保羅<b>沒有</b>說「以色列硬心了」。他說：<b>部分地</b>硬心臨到以色列。</p><p>② 「等到」（ἄχρι οὗ）——</p><p>那是一個<b>時限</b>。那個硬心，<b>不是永久的狀態</b>。</p><p><b>經文本身明確表達的：</b> 部分的硬心臨到以色列，直到外邦人的滿數進來；而神必要成就祂在賽59:20–21、27:9所應許的。</p><p><b>可以合理推論的：</b> 「以色列全家都要得救」的確切所指，<b>歷代敬虔的解經家有不同理解</b>（見第二十部分第一題）。</p><p>⚠ 講台誠信提醒（本章最重要的一條）：</p><p>① 這一節有三種主要理解，<b>不可宣告任何一方為唯一正解</b>。</p><p>② 無論持哪一種立場，<b>保羅要對外邦信徒說的話完全一樣</b>：</p><p>「你<b>不可向舊枝子誇口</b>。」（11:18）</p><p>③ ❌❌ 本段講的是<b>救恩歷史</b>，不是<b>現代政治</b>。<br>保羅在此沒有談任何現代國家的邊界或政策。<br>牧者可以有個人的政治看法，但<b>不應把個人的政治立場說成聖經的教導</b>。</p>"},{"a":28,"z":29,"star":true,"grk":"<p>29 ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.</p>","lit":"<p>29「因為神的<b>恩賜</b>與<b>呼召</b>，是<b>不會反悔的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>沒有後悔</td><td>ἀμεταμέλητα</td><td>ametamelēta</td><td>G278</td><td>ἀ + μεταμέλομαι（後悔）</td><td><b>不可撤回的、不會反悔的</b></td><td>見下</td></tr><tr><td>恩賜</td><td>χαρίσματα</td><td>charismata</td><td>G5486</td><td>χάρις</td><td><b>恩典的產物</b>（<b>5:15、6:23同字</b>）</td></tr><tr><td>選召</td><td>κλῆσις</td><td>klēsis</td><td>G2821</td><td>καλέω（召）</td><td><b>呼召</b></td><td><b>8:30「所召來的」同字根</b></td></tr></table>","gram":"<p>★ 亮光一：ἀμεταμέλητος ——「不會反悔」</p><p>這個字在新約只出現兩次：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>林後7:10</b></td><td>「依著神的意思憂愁，就生出<b>沒有後悔</b>的懊悔來」</td></tr><tr><td><b>羅11:29</b></td><td>「神的恩賜和選召是<b>沒有後悔</b>的」</td></tr></table><p>弟兄姊妹，這個字的意思是：<b>不會改變主意、不會撤回</b>。</p><p>★ 亮光二：11:28的雙面陳述</p><pre>就著福音說 —— 他們是【仇敵】（因為拒絕了彌賽亞）\n就著揀選說 —— 他們是【蒙愛的】（為列祖的緣故）</pre><p>弟兄姊妹，保羅同時說了這兩句話，而且沒有覺得矛盾。</p><p>這對我們是重要的提醒：</p><p>一個人可能同時處在「拒絕福音」與「仍在神愛中」的張力裡。</p>","exp":"<p>11:29是全章、也是全卷書最大的一句保證：</p><p>「神的恩賜和選召，是<b>沒有後悔</b>的。」</p><p>弟兄姊妹，這句話的邏輯很簡單：</p><p>如果神會對以色列反悔——</p><p>那祂對你也可能反悔。</p><p>而如果祂<b>不會</b>——</p><p>那第八章「都不能隔絕」就有了最終的保證。</p>"},{"a":30,"z":32,"star":true,"grk":"<p>32 συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν, ἵνα τοὺς πάντας ἐλεήσῃ.</p>","lit":"<p>32「因為神把<b>眾人一同關進</b>不順服裡，為要<b>憐恤眾人</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>圈在</td><td>συνέκλεισεν</td><td>synekleisen</td><td>G4788</td><td>σύν + κλείω（關）</td><td><b>一同關起來、圍住</b></td><td>見下</td></tr><tr><td>不順服</td><td>ἀπείθεια</td><td>apeitheia</td><td>G543</td><td>ἀ + πείθω</td><td><b>不肯被說服</b></td><td>10:21同字根</td></tr><tr><td>憐恤</td><td>ἐλεήσῃ</td><td>eleēsē</td><td>G1653</td><td>ἔλεος（憐憫）</td><td>施憐憫</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：συγκλείω ——「一同關起來」</p><p>這個字在新約出現四次：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>路5:6</b></td><td>「就<b>圈住</b>（συνέκλεισαν）許多魚」——漁網</td></tr><tr><td><b>加3:22</b></td><td>「聖經把眾人都<b>圈在</b>罪裡」</td></tr><tr><td><b>加3:23</b></td><td>「我們被看守在律法之下，直<b>圈到</b>那將來的真道顯明出來」</td></tr><tr><td><b>羅11:32</b></td><td>「神將眾人都<b>圈在</b>不順服之中」</td></tr></table><p>路加福音5:6的用法極有幫助：</p><p>那是<b>收網</b>的畫面——把魚全部圍在網裡。</p><p>弟兄姊妹，保羅的畫面是：</p><p>神收了一張網，把所有人都圍在裡面。</p><p>而目的是什麼？</p><p>不是為了審判——</p><p>是為了「<b>憐恤眾人</b>」。</p><p>★ 亮光二：兩個 τοὺς πάντας（眾人）</p><pre>συνέκλεισεν... τοὺς πάντας εἰς ἀπείθειαν  —— 圈住【眾人】\nἵνα τοὺς πάντας ἐλεήσῃ                    —— 憐恤【眾人】</pre><p>同樣的詞組，出現兩次。</p><p>（關於這是否支持普救論，見第二十部分。）</p>","exp":"<p>弟兄姊妹，11:32是羅馬書9–11章整個論證的<b>終點</b>。</p><p>而它的結論不是「有些人在裡面，有些人在外面」。</p><p>它的結論是：</p><p>「神將眾人都圈在不順服之中，<b>特意要憐恤眾人</b>。」</p><p>保羅走了三章的迷宮，最後停在一個字上：</p><p>憐恤。</p><p>【第五段｜11:33–36　★ 頌讚】</p>"},{"a":33,"z":36,"star":true,"grk":"<p>33 Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.<br>36 ὅτι ἐξ αὐτοῦ καὶ δι' αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>33「<b>啊，深哪</b>——神的豐富、智慧、知識！祂的判斷<b>何等無法查究</b>，祂的道路<b>何等無法追蹤</b>！」<br>36「因為萬有都是<b>出於</b>祂，<b>藉著</b>祂，<b>歸向</b>祂。願榮耀歸給祂，直到永遠。阿們。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>深哉</td><td>Ὦ βάθος</td><td>ō bathos</td><td>G899</td><td>—</td><td><b>啊，深度！</b>（感歎詞開頭）</td><td>見下</td></tr><tr><td>難測</td><td>ἀνεξεραύνητα</td><td>anexeraunēta</td><td>G419</td><td>ἀ + ἐξεραυνάω（徹查）</td><td><b>無法徹底查究的</b></td><td><b>新約僅此一次</b></td></tr><tr><td>難尋</td><td>ἀνεξιχνίαστοι</td><td>anexichniastoi</td><td>G421</td><td>ἀ + ἐξιχνιάζω（<b>追蹤腳印</b>）</td><td><b>無法追蹤腳印的</b></td><td>見下</td></tr><tr><td>蹤跡</td><td>ὁδοί</td><td>hodoi</td><td>G3598</td><td>—</td><td><b>道路</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：Ὦ βάθος ——一個感歎詞</p><p>11:33的第一個字是 <b>Ὦ</b>——一個<b>感歎詞</b>（「啊！」）。</p><p>第二個字是 <b>βάθος</b>——<b>深度</b>。</p><p>弟兄姊妹，保羅講完三章最艱難的神學之後，</p><p>第一個字不是一個論點。</p><p>是一聲——<b>啊</b>。</p><p>★★ 亮光二：ἀνεξιχνίαστος ——「追不到腳印」</p><p>這個字太美了，必須拆開來看：</p><pre>ἀ-       （不能）\nἐκ-      （出來）\nἴχνος    （腳印！）</pre><p>ἴχνος 這個字我們在第四章見過：</p><p>4:12「按我們的祖宗亞伯拉罕未受割禮而信之<b>蹤跡</b>（ἴχνεσιν）去行的人。」</p><p>弟兄姊妹，這個字的畫面是：</p><p>一個獵人在雪地上追蹤腳印。</p><p>他跟著走、跟著走——</p><p>然後腳印<b>消失了</b>。</p><p>而和合本譯「祂的<b>蹤跡</b>何其難尋」，把這個畫面完整保留了。</p><p>保羅在說：神走過的路，<b>你追不到底</b>。</p><p>你可以跟一段。但總有一個地方，腳印就沒有了。</p><p>（這個字在新約只出現兩次：羅11:33、弗3:8「基督那<b>測不透</b>的豐富」。）</p><p>★ 亮光三：三個修辭問句（11:34–35）</p><pre>誰知道主的心？      —— 引賽40:13\n誰作過他的謀士呢？  —— 引賽40:13\n誰是先給了他？      —— 引伯41:11</pre><p>特別注意最後一個問句的意義：</p><p>「誰是<b>先給了他</b>，使他後來償還呢？」</p><p>弟兄姊妹，這句話的意思是：</p><p>沒有人<b>先給過神什麼</b>。</p><p>所以神<b>不欠任何人</b>。</p><p>（這正是9:15–16「我要憐憫誰就憐憫誰」的根據）</p><p>★★ 亮光四：三個介詞（11:36）</p><pre>ἐξ αὐτοῦ  （出於祂）—— 一切的【起源】\nδι' αὐτοῦ （藉著祂）—— 一切的【過程】\nεἰς αὐτόν （歸向祂）—— 一切的【終點】</pre><p>弟兄姊妹，這是全卷羅馬書神學的濃縮，也是「讓耶穌得到一切榮耀」最紮實的根據：</p><p>如果起點是祂，過程是祂，終點也是祂——</p><p>那中間<b>沒有一個地方</b>，可以插進「我」。</p><p>所以下一句是：</p><p>「願<b>榮耀歸給他</b>，直到永遠。阿們！」</p>","exp":"<p>弟兄姊妹，這四節是理解整個9–11章的鑰匙。</p><p>保羅講了三章。他處理了揀選、剛硬、餘數、橄欖樹、奧祕。</p><p>然後他的結論是什麼？</p><p>不是一套完整的系統。</p><p>不是一個可以拿去辯論的立場。</p><p>是——</p><p>「<b>啊，深哪！</b>」</p><p>弟兄姊妹，如果一個人讀完羅馬書9–11章，</p><p>得到的是<b>一套可以贏辯論的系統</b>——</p><p>那他得到的，跟保羅得到的不一樣。</p><p>保羅得到的是：</p><p>跪下來。</p>"}],"12":[{"a":1,"z":1,"star":true,"grk":"<p>Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν εὐάρεστον τῷ θεῷ, τὴν λογικὴν λατρείαν ὑμῶν·</p>","lit":"<p>「所以弟兄們，我<b>藉著神的眾多憐憫</b>勸你們，把你們的<b>身體</b>呈獻上去，作一個<b>活的祭物</b>、聖潔的、神所悅納的——這就是你們<b>合乎理性／屬靈的敬拜事奉</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>所以</td><td>οὖν</td><td>oun</td><td>G3767</td><td>—</td><td><b>因此</b></td><td><b>全卷書的樞紐</b></td></tr><tr><td>勸</td><td>Παρακαλῶ</td><td>parakalō</td><td>G3870</td><td>παρά + καλέω</td><td><b>在旁邊呼喚、懇求、鼓勵</b></td><td>不是命令，是懇求</td></tr><tr><td>慈悲</td><td>οἰκτιρμοί</td><td>oiktirmoi</td><td>G3628</td><td>οἰκτίρω（憐恤）</td><td><b>深切的憐憫</b>（<b>複數！</b>）</td><td>見下</td></tr><tr><td>獻上</td><td>παραστῆσαι</td><td>parastēsai</td><td>G3936</td><td>παρά + ἵστημι</td><td><b>牽到祭壇前呈獻</b></td><td><b>6:13同字</b></td></tr><tr><td>身體</td><td>σώματα</td><td>sōmata</td><td>G4983</td><td>—</td><td>身體</td><td><b>不是「心靈」</b></td></tr><tr><td>活祭</td><td>θυσίαν ζῶσαν</td><td>thysian zōsan</td><td>G2378</td><td>—</td><td><b>活著的祭物</b></td><td>見下</td></tr><tr><td>喜悅</td><td>εὐάρεστος</td><td>euarestos</td><td>G2101</td><td>εὖ + ἀρέσκω</td><td><b>蒙悅納的</b></td><td>LXX 獻祭用語</td></tr><tr><td>理所當然</td><td>λογικός</td><td>logikos</td><td>G3050</td><td>λόγος</td><td><b>合乎理性的／屬靈的</b></td><td>新約僅兩次</td></tr><tr><td>事奉</td><td>λατρεία</td><td>latreia</td><td>G2999</td><td>—</td><td><b>敬拜的事奉</b></td><td><b>9:4「禮儀」同字</b></td></tr></table>","gram":"<p>★ 亮光一：οὖν ——全卷書的樞紐</p><p>弟兄姊妹，「所以」這兩個字，是羅馬書的分水嶺。</p><pre>1–11章：神做了什麼（教義）\n   ↓ 【所以】\n12–16章：所以你們要怎麼活（實踐）</pre><p>保羅的順序永遠是：<b>先講神做了什麼，才講你要做什麼</b>。</p><p>他花了十一章講「你是誰」，才開始講「你要做什麼」。</p><p>★ 亮光二：Παρακαλῶ ——「勸」而不是「命令」</p><p>保羅<b>沒有</b>用命令的語氣說「你們必須獻上」。</p><p>他用的是 παρακαλέω——<b>在旁邊呼喚、懇求</b>。</p><p>（同字根是 παράκλητος——約翰福音中聖靈的稱號「<b>保惠師</b>」）</p><p>弟兄姊妹，保羅是一個使徒，他有權柄命令。</p><p>但講到獻身這件事，他選擇——<b>懇求</b>。</p><p>★ 亮光三：οἰκτιρμοί ——複數的「慈悲」</p><p>「我以神的<b>慈悲</b>勸你們」——οἰκτιρμῶν 是<b>複數</b>。</p><p>這個字在 LXX 中翻譯希伯來文 <b>רַחֲמִים（rachamim）</b>——</p><p>它的字根是 <b>רֶחֶם（rechem，子宮）</b>——<br>是一種<b>母親對孩子的、從肺腑深處來的憐憫</b>。</p><p>而「複數」意味著什麼？</p><p>不是一次的慈悲，是<b>一件又一件的慈悲</b>。</p><p>弟兄姊妹，保羅指的是哪些慈悲？</p><p>就是前面十一章的<b>每一件事</b>：</p><p>稱義、和好、聖靈內住、不定罪、不隔絕、憐恤眾人……</p><p>這就是獻身的動力：<b>不是罪疚，是慈悲</b>。</p><p>★ 亮光四：παρίστημι ——第六章那個字</p><pre>6:13  「將肢體作義的器具【獻給】（παραστήσατε）神」\n   ↓\n12:1  「將身體【獻上】（παραστῆσαι）」</pre><p>弟兄姊妹，這是全卷書一個美麗的呼應：</p><p>保羅在第六章種下的那顆種子，在第十二章開花了。</p><p>★ 亮光五：「身體」而不是「心靈」</p><p>保羅說的是 <b>τὰ σώματα</b>（身體，複數）。</p><p>不是「把你的心獻給神」。<br>是「把你的<b>身體</b>獻上」。</p><p>為什麼？</p><p>因為身體是<b>具體的</b>。</p><p>身體有地址、有行事曆、有錢包、有手機、有一雙腳。</p><p>「把心獻給神」可以是一種感動；<br>「把身體獻上」是<b>明天早上你人在哪裡</b>。</p><p>★★ 亮光六：θυσία ζῶσα ——一個矛盾修辭</p><p>「<b>活祭</b>」——在第一世紀，這是一個驚人的說法。</p><p>因為所有的祭物，定義上都是<b>死的</b>。</p><p>弟兄姊妹，一個活的祭物，會有什麼問題？</p><p>它<b>會爬下來</b>。</p><p>（這正是為什麼下一節的命令是<b>現在式</b>——持續的。）</p><p>★ 亮光七：λογικὴ λατρεία</p><p>兩種理解（見第二部分）：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>合乎理性的</b></td><td>面對那麼大的慈悲，這是<b>唯一合理</b>的回應</td></tr><tr><td><b>屬靈的敬拜</b></td><td>不是外在的儀式，是<b>整個人</b>的敬拜</td></tr></table><p>而 λατρεία 這個字，在9:4指的是<b>聖殿的敬拜服事</b>。</p><p>弟兄姊妹，保羅在說：</p><p>你的日常生活，就是聖殿裡的敬拜。</p>","exp":"<p><b>經文本身明確表達的：</b> 因著神的眾多憐憫，信徒要把身體呈獻為活的、聖潔的、蒙悅納的祭物，這是合理／屬靈的敬拜。<br><b>合理推論的生命應用：</b> 獻身的動力若是罪疚感，那不是12:1；12:1的動力是「神的慈悲」——是十一章的「深哉」帶出來的。</p>"},{"a":2,"z":2,"star":true,"grk":"<p>καὶ μὴ συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.</p>","lit":"<p>「不要（持續）<b>被塑造成這個世代的外形</b>，反要（持續）<b>被變化</b>——藉著<b>心思的更新</b>——好使你們能<b>察驗出</b>什麼是神的旨意，就是那善良的、可悅納的、完全的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>效法</td><td>συσχηματίζεσθε</td><td>syschēmatizesthe</td><td>G4964</td><td>σύν + σχῆμα</td><td><b>被塑成同一個外形</b></td><td>見下</td></tr><tr><td>這個世界</td><td>τῷ αἰῶνι τούτῳ</td><td>tō aiōni toutō</td><td>G165</td><td>—</td><td><b>這個世代</b>（不是「地球」）</td><td>—</td></tr><tr><td>變化</td><td>μεταμορφοῦσθε</td><td>metamorphousthe</td><td>G3339</td><td>μετά + μορφή</td><td><b>形態被改變</b>（英文 metamorphosis）</td><td>見下</td></tr><tr><td>更新</td><td>ἀνακαίνωσις</td><td>anakainōsis</td><td>G342</td><td>ἀνά + καινός（<b>質地上的新</b>）</td><td><b>更新、翻新</b></td><td>6:4同字根</td></tr><tr><td>心意</td><td>νοῦς</td><td>nous</td><td>G3563</td><td>—</td><td><b>心思、理智、思維方式</b></td><td>7:23、7:25同字</td></tr><tr><td>察驗</td><td>δοκιμάζειν</td><td>dokimazein</td><td>G1381</td><td>—</td><td><b>試驗並認可</b></td><td><b>5:4「老練」同字根</b></td></tr></table>","gram":"<p>★★ 亮光一：σχῆμα 與 μορφή 的差別</p><p>希臘文有兩個表達「形狀」的字：</p><table><tr><th>字</th><th>意思</th><th>特性</th></tr><tr><td><b>σχῆμα</b></td><td><b>外形、樣式、外表的形狀</b></td><td><b>可變的、暫時的</b>（英文 scheme）</td></tr><tr><td><b>μορφή</b></td><td><b>本質的形態、內在的形狀</b></td><td><b>本質性的</b>（英文 morph）</td></tr></table><p>（腓2:6–7用了這兩個字：基督本有神的<b>形像</b>（μορφή），卻取了奴僕的<b>形像</b>（μορφή），成為人的<b>樣式</b>（σχῆμα））</p><p>所以12:2的意思是：</p><pre>μὴ συσχηματίζεσθε —— 不要被塑成這世代的【外形】\nἀλλὰ μεταμορφοῦσθε —— 反要在【本質】上被改變</pre><p>弟兄姊妹，保羅在說：</p><p>世界要你<b>改變外表</b>去配合它。<br>神要你<b>從裡面本質性地改變</b>。</p><p>一個是<b>貼上去的</b>；一個是<b>長出來的</b>。</p><p>（誠實提醒：有些學者認為在保羅時代這兩個字的區別已不如古典時期嚴格。但兩個字的<b>字根含意</b>確實不同，而保羅在這裡刻意並列，這個對比是站得住的。）</p><p>★★ 亮光二：兩個現在式被動命令</p><p>兩個動詞的三個文法特徵，每一個都重要：</p><table><tr><th>特徵</th><th>意義</th></tr><tr><td><b>現在式</b></td><td><b>持續的</b>——不是一次完成的</td></tr><tr><td><b>被動語態</b></td><td><b>不是我改變自己，是我被改變</b></td></tr><tr><td><b>命令語氣</b></td><td><b>但我仍然有責任讓自己被改變</b></td></tr></table><p>弟兄姊妹，這三點合起來，正好回答了第六、七、八章的張力：</p><p>不是靠自己咬牙（第七章）。<br>也不是被動地等（那是不負責任）。<br>是——<b>把自己放在會被改變的位置上</b>。</p><p>★★★ 亮光三：改變的機制是「心思的更新」</p><p>「藉著<b>心思的更新</b>」——τῇ ἀνακαινώσει τοῦ νοός。</p><p>這個與格（dative）表達的是<b>方法／途徑</b>：</p><p>變化是<b>怎麼發生</b>的？</p><p>透過<b>心思被更新</b>。</p><p>弟兄姊妹，這一點極其重要，因為它排除了另外兩條路：</p><table><tr><th>錯誤的路</th><th>問題</th></tr><tr><td><b>靠意志力改變行為</b></td><td>那是第七章：「立志為善由得我，只是行出來由不得我」</td></tr><tr><td><b>等一次超自然的經驗</b></td><td>保羅說的是 ἀνακαίνωσις——一個<b>過程</b></td></tr></table><p>正確的路是：<b>心思被更新 → 生命就變化</b>。</p><p>這正是321最核心的一句話的直接經文根據：</p><p>改變觀念，就改變生命。</p><p>★ 亮光四：νοῦς ——第七章那個字</p><pre>7:23  「肢體中另有個律和我【心中】（νοῦς）的律交戰」\n7:25  「我以【內心】（νοῦς）順服神的律」\n   ↓\n12:2  「【心意】（νοῦς）更新而變化」</pre><p>第七章：我的心思是對的，但我做不到。<br>第十二章：那個心思<b>本身要被更新</b>。</p><p>★ 亮光五：δοκιμάζω ——「察驗」</p><p>「叫你們<b>察驗</b>何為神的旨意」——δοκιμάζειν。</p><p>這個字的字根是<b>驗金屬</b>（δοκιμή，5:4「老練」那個字）。</p><p>意思不是「猜測」，是<b>試驗之後認出來</b>。</p><p>弟兄姊妹，這一節回答了一個很多人問的問題：</p><p>「我怎麼知道神的旨意？」</p><p>而保羅的答案不是「求一個記號」或「等一個聲音」。</p><p>保羅的答案是：</p><p>讓你的<b>心思被更新</b>——</p><p>然後你就<b>認得出來</b>。</p><p>（正如一個被訓練過的驗金師，一看就知道那是不是真金。）</p><p>★ 亮光六：神的旨意的三個形容詞</p><pre>τὸ ἀγαθόν     —— 善良的\nκαὶ εὐάρεστον —— 可喜悅的（12:1的同一個字！）\nκαὶ τέλειον   —— 完全的</pre><p>注意 εὐάρεστος 在12:1與12:2都出現：</p><p>12:1 我們獻上的祭是「神所<b>喜悅</b>的」。<br>12:2 神的旨意是「可<b>喜悅</b>的」。</p><p>同一個字。</p>","exp":"<p>弟兄姊妹，12:1–2的關係是這樣的：</p><pre>12:1  一個【決斷的動作】：παραστῆσαι（不定過去式）—— 把身體放上去\n   ↓\n12:2  一個【持續的過程】：μεταμορφοῦσθε（現在式）—— 持續地被變化</pre><p>有一次的獻上，也有每天的更新。</p><p>（這與6:13的兩種時態完全一致。）</p><p>【第二段｜12:3–8　身體裡】</p>"},{"a":3,"z":3,"star":true,"grk":"<p>Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ' ὃ δεῖ φρονεῖν ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.</p>","lit":"<p>「因為我藉著所賜給我的恩，對你們中間每一個人說：<b>不要想得超過所當想的</b>，倒要<b>想到健全清醒的地步</b>——照著神<b>分給</b>各人<b>信心的量</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>看自己過於所當看</td><td>ὑπερφρονεῖν</td><td>hyperphronein</td><td>G5252</td><td><b>ὑπέρ + φρονέω：想得太高</b>（新約僅此一次）</td></tr><tr><td>合乎中道</td><td>σωφρονεῖν</td><td>sōphronein</td><td>G4993</td><td><b>σῶς（健全）+ φρήν（心思）：心思健全、清醒</b></td></tr><tr><td>分給</td><td>ἐμέρισεν</td><td>emerisen</td><td>G3307</td><td><b>分配、量給</b></td></tr><tr><td>信心的大小</td><td>μέτρον πίστεως</td><td>metron pisteōs</td><td>G3358</td><td><b>信心的量／度量</b></td></tr></table>","gram":"<p>★ 亮光一：四個 φρον- 字的文字遊戲</p><pre>μὴ ὑπερφρονεῖν  （不要「過度」地想）\nπαρ' ὃ δεῖ φρονεῖν （超過所當想的）\nἀλλὰ φρονεῖν    （倒要想）\nεἰς τὸ σωφρονεῖν （以致「健全地」想）</pre><p>弟兄姊妹，這四個字中文完全譯不出來。</p><p>但它證明了一件事：<b>12:3談的仍然是「心思」</b>——<br>與12:2的「心意更新」是同一條線。</p><p>★ 亮光二：σωφρονέω ——「健全的心思」</p><p>這個字由 σῶς（健全、安全）＋ φρήν（心思）組成。</p><p>在希臘倫理學中，σωφροσύνη（節制、自制）是<b>四樞德</b>之一。</p><p>和合本譯「<b>看得合乎中道</b>」極為傳神。</p><p>弟兄姊妹，注意：保羅<b>沒有</b>說「要看自己低於所當看的」。</p><p>他說的是「<b>健全</b>」——不高估，也不低估。</p><p>★ 亮光三：「信心的大小」（μέτρον πίστεως）</p><p>兩種主要理解：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>神量給各人的信心／恩賜的度量</b></td><td>每個人領受的不同，所以不要比較</td></tr><tr><td><b>信心本身作為衡量的標準</b></td><td>用「信心」這把尺來衡量自己</td></tr></table><p>上下文（12:6「按我們所得的恩賜，各有不同」）支持第一種：</p><p>神<b>分給</b>（ἐμέρισεν）各人的不一樣。</p>","exp":"<p>弟兄姊妹，注意保羅在講恩賜之前，先講什麼？</p><p>先講<b>怎麼看自己</b>。</p><p>這個次序很重要：</p><p>一個沒有「看得合乎中道」的人，恩賜越大越危險。</p>"},{"a":4,"z":5,"star":false,"grk":"<p>5 οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, τὸ δὲ καθ' εἷς ἀλλήλων μέλη.</p>","lit":"<p>5「我們這許多人，在基督裡是<b>一個身體</b>；而各人<b>彼此互為肢體</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>肢體</td><td>μέλη</td><td>melē</td><td>G3196</td><td><b>身體的部位</b>（<b>6:13、6:19、7:23同字</b>）</td></tr><tr><td>互相</td><td>ἀλλήλων</td><td>allēlōn</td><td>G240</td><td><b>彼此</b></td></tr></table>","gram":"<p>★ 亮光一：μέλη ——第六章那個字的轉向</p><pre>6:13  「將你們的【肢體】獻給神」—— 我的肢體屬於神\n6:19  「將【肢體】獻給義作奴僕」\n7:23  「我覺得【肢體】中另有個律」—— 肢體是戰場\n   ↓\n12:5  「互相聯絡作【肢體】」—— 我是別人的肢體！</pre><p>弟兄姊妹，這是一個極美的推進：</p><p>前面：我的<b>肢體</b>要獻給神。<br>這裡：<b>我自己</b>就是別人的<b>肢體</b>。</p><p>★ 亮光二：ἀλλήλων μέλη ——「彼此互為肢體」</p><p>保羅<b>沒有</b>說「我們都是基督身體的肢體」（那是林前12:27）。</p><p>他說的是：「<b>各人互相</b>作肢體。」</p><p>意思是：<b>我是你的手，你是我的眼</b>。</p><p>不只是「我們都屬於同一個身體」，而是「<b>我們彼此需要</b>」。</p>","exp":"<p>弟兄姊妹，4–5節緊接在12:3之後——那不是巧合。</p><pre>12:3  不要看自己過於所當看的\n   ↓ 為什麼？\n12:4  因為你只是【一個肢體】</pre><p><b>經文本身明確表達的：</b> 一個身子有許多肢體，各有不同的用處；我們在基督裡是一個身體，並且<b>各人互相作肢體</b>。</p><p><b>可以合理推論的：</b> 「看得合乎中道」的根據，不是心理建設，是<b>解剖學</b>。</p><p>一隻手不必自卑，因為身體需要它；<br>一隻手也不必自大，因為它<b>不是身體</b>。</p><p><b>⚠ 牧養提醒：</b> 這一段對兩種人都有話說——<br>對覺得自己沒用的人：<b>身體需要你</b>。<br>對覺得教會少了自己就不行的人：<b>你是肢體，不是身體</b>。</p>"},{"a":6,"z":8,"star":false,"grk":"<p>6 ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,<br>7 εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ,<br>8 εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει· ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.</p>","lit":"<p>6「我們既照著<b>所賜給我們的恩</b>，得了<b>各樣不同的恩賜</b>：或是說預言，就照著<b>信心的比例</b>；」<br>7「或是<b>服事</b>，就在服事上；或是<b>教導的</b>，就在教導上；」<br>8「或是<b>勸慰的</b>，就在勸慰上；<b>分給人的</b>，就要<b>單純不夾雜</b>；<b>帶領的</b>，就要<b>殷勤</b>；<b>憐憫人的</b>，就要<b>歡歡喜喜</b>。」</p>","key":"<table><tr><th>恩賜</th><th>原文</th><th>音譯</th><th>附加的態度</th><th>原文</th><th>意義</th></tr><tr><td>說預言</td><td>προφητεία</td><td>prophēteia</td><td>照著信心的程度</td><td>κατὰ τὴν ἀναλογίαν τῆς πίστεως</td><td>按信心的比例</td></tr><tr><td>作執事</td><td>διακονία</td><td>diakonia</td><td>專一執事</td><td>ἐν τῇ διακονίᾳ</td><td>就在服事上</td></tr><tr><td>教導</td><td>διδάσκων</td><td>didaskōn</td><td>專一教導</td><td>ἐν τῇ διδασκαλίᾳ</td><td>—</td></tr><tr><td>勸化</td><td>παρακαλῶν</td><td>parakalōn</td><td>專一勸化</td><td>ἐν τῇ παρακλήσει</td><td><b>12:1「勸」同字</b></td></tr><tr><td>施捨</td><td>μεταδιδούς</td><td>metadidous</td><td><b>誠實</b></td><td><b>ἐν ἁπλότητι</b></td><td><b>單純、不摻雜</b></td></tr><tr><td>治理</td><td>προϊστάμενος</td><td>proistamenos</td><td><b>殷勤</b></td><td><b>ἐν σπουδῇ</b></td><td><b>急切、認真</b></td></tr><tr><td>憐憫人</td><td>ἐλεῶν</td><td>eleōn</td><td><b>甘心</b></td><td><b>ἐν ἱλαρότητι</b></td><td><b>歡歡喜喜</b>（見下）</td></tr></table>","gram":"<p>★ 亮光一：後三樣附加了「態度」</p><p>弟兄姊妹，注意保羅的安排：</p><p>前四樣（預言、執事、教導、勸化）——他說「就當專一去做」。</p><p>後三樣（施捨、治理、憐憫）——他加了<b>態度</b>：</p><pre>施捨   —— ἐν ἁπλότητι （單純、不摻雜動機）\n治理   —— ἐν σπουδῇ   （殷勤、認真）\n憐憫人 —— ἐν ἱλαρότητι（歡歡喜喜）</pre><p>★★ 亮光二：ἱλαρότης ——「歡歡喜喜」</p><p>這個字（新約僅此一次）的形容詞形式 <b>ἱλαρός</b>，出現在一節很有名的經文：</p><p>林後9:7「因為神喜愛<b>捐得樂意</b>（ἱλαρὸν δότην）的人。」</p><p>（英文 hilarious 就是從這個字來的。）</p><p>弟兄姊妹，保羅在說：</p><p>憐憫人的時候，<b>臉要好看</b>。</p><p>這是一個非常實際、也非常扎心的要求：</p><p>憐憫最容易變質的地方，不是<b>做不做</b>，是<b>做的時候那張臉</b>。</p><p>一個帶著不耐煩去幫助人的人，那不是憐憫，那是施捨。</p><p>★ 亮光三：ἁπλότης ——「單純」</p><p>這個字的字面是「<b>不摺疊的、單一的</b>」——沒有夾層。</p><p>施捨最容易夾雜什麼？</p><p>要被看見。要被感謝。要有回報。</p><p>而 ἁπλότης 的意思是：<b>沒有夾層</b>。</p>","exp":"<p>弟兄姊妹，這份恩賜清單有一個很值得注意的特點：</p><p>保羅<b>不是在排名</b>，他是在說「<b>做那件事的時候，要怎麼做</b>」。</p><p>而後面三樣，各配了一個<b>態度</b>：</p><table><tr><th>恩賜</th><th>該有的態度</th><th>原文</th></tr><tr><td>施捨</td><td><b>單純、不夾雜</b></td><td>ἁπλότης</td></tr><tr><td>治理</td><td><b>殷勤</b></td><td>σπουδή</td></tr><tr><td>憐憫</td><td><b>歡歡喜喜</b></td><td>ἱλαρότης</td></tr></table><p><b>經文本身明確表達的：</b> 恩賜各有不同，都是按所賜的恩；各人要專一在自己的恩賜上，並帶著合宜的態度。</p><p><b>可以合理推論的：</b> 保羅在意的<b>不只是做了什麼，還有帶著什麼心</b>。</p><p>施捨最容易夾雜什麼？<b>要被看見、要被感謝、要有回報</b>。<br>而 ἁπλότης 的意思是：<b>沒有夾層</b>。</p><p>而「憐憫人的，就當<b>甘心</b>」（ἱλαρότης，林後9:7「<b>樂意</b>的人」同字根）——<br>一個板著臉的憐憫，會傷害被憐憫的人。</p><p>【第三段｜12:9–13　家裡】</p>"},{"a":9,"z":9,"star":true,"grk":"<p>Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ,</p>","lit":"<p>「愛，<b>不戴面具</b>。<b>極其厭惡</b>那惡的，<b>黏住</b>那善的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>不可虛假</td><td>ἀνυπόκριτος</td><td>anypokritos</td><td>G505</td><td>ἀ + ὑποκριτής（<b>演員</b>）</td><td><b>不演戲的、沒有面具的</b></td><td>見下</td></tr><tr><td>厭惡</td><td>ἀποστυγοῦντες</td><td>apostygountes</td><td>G655</td><td>ἀπό + στυγέω</td><td><b>極度憎惡</b>（新約僅此一次）</td><td>強烈的字</td></tr><tr><td>親近</td><td>κολλώμενοι</td><td>kollōmenoi</td><td>G2853</td><td>κόλλα（<b>膠</b>）</td><td><b>黏住</b></td><td>見下</td></tr></table>","gram":"<p>★★ 亮光一：ἀνυπόκριτος ——「不戴面具」</p><p>這個字由 ἀ（不）＋ ὑποκριτής（<b>演員</b>）組成。</p><p>而 ὑποκριτής 在古希臘的意思是：</p><p>在劇場裡<b>戴著面具演戲的人</b>。</p><p>（主耶穌用這個字罵法利賽人「假冒為善的人」——太23:13等處）</p><p>弟兄姊妹，所以「愛人不可虛假」的字面是：</p><p>「愛，<b>不要戴面具</b>。」</p><p>而保羅把這句話放在12:9–21這一整段的<b>最前面</b>——</p><p>它是後面所有事情的<b>標題</b>。</p><p>★ 亮光二：κολλάω ——「黏住」</p><p>「善要<b>親近</b>」——κόλλα 就是<b>膠水</b>。</p><p>（太19:5「二人成為一體」的「<b>連合</b>」；徒5:13「沒有一個人敢<b>貼近</b>他們」——同字）</p><p>不是「多接近一點」，是<b>黏上去，黏死</b>。</p><p>★ 亮光三：兩個極端的動作</p><pre>ἀποστυγέω —— 【極度憎惡】那惡的\nκολλάω    —— 【黏住】那善的</pre><p>弟兄姊妹，保羅在這裡用了兩個很激烈的動詞。</p><p>無偽的愛，不是溫吞的。</p><p>它對惡是<b>極度憎惡</b>，對善是<b>黏住不放</b>。</p>","exp":"<p>弟兄姊妹，12:9是整個第三段的<b>標題</b>。</p><p>而原文的第一句沒有動詞，字面是：「愛——<b>無偽的</b>。」</p><p>ἀνυπόκριτος ＝ ἀ（不）＋ ὑποκριτής（<b>演員</b>）。</p><p>字面就是：<b>不戴面具的</b>。</p><p><b>經文本身明確表達的：</b> 愛不可虛假；要極度憎惡惡，要緊緊黏住善。</p><p><b>可以合理推論的：</b> 保羅在教會倫理的第一句，講的不是「要多愛一點」，<br>是「<b>把面具拿下來</b>」。</p><p>因為在教會裡，最容易出現的不是「沒有愛」，是<b>表演出來的愛</b>。</p><p><b>⚠ 牧養提醒：</b> 這一節不是要人「把真實的情緒都說出來」。<br>無偽的愛不等於口無遮攔——12:10下一句就說「恭敬人，要<b>彼此推讓</b>」。</p>"},{"a":10,"z":13,"star":false,"grk":"<p>10 τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,<br>11 τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,<br>12 τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,<br>13 ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.</p>","lit":"<p>10「在<b>弟兄之愛</b>上，要<b>彼此有家人般的深情</b>；在<b>尊重</b>上，要<b>彼此推讓、把對方擺在前面</b>；」<br>11「在<b>殷勤</b>上，不可<b>遲鈍</b>；在<b>靈裡</b>要<b>沸騰</b>；要<b>服事主</b>；」<br>12「在<b>盼望</b>中<b>喜樂</b>；在<b>患難</b>中<b>忍耐</b>；在<b>禱告</b>上<b>恆切不放</b>；」<br>13「與聖徒的<b>需要</b>有<b>分</b>；<b>追趕</b>款待客旅的機會。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>彼此親熱</td><td>φιλόστοργοι</td><td>philostorgoi</td><td>G5387</td><td>φιλία + <b>στοργή（家人之愛）</b>——見下</td></tr><tr><td>推讓</td><td>προηγούμενοι</td><td>proēgoumenoi</td><td>G4285</td><td><b>走在前面帶路</b>／<b>看別人比自己重要</b></td></tr><tr><td>火熱</td><td>ζέοντες</td><td>zeontes</td><td>G2204</td><td><b>沸騰</b>（<b>10:2 ζῆλος 同字根</b>）</td></tr><tr><td>忍耐</td><td>ὑπομένοντες</td><td>hypomenontes</td><td>G5278</td><td><b>在壓力下站住</b>（<b>5:3同字根</b>）</td></tr><tr><td>恆切</td><td>προσκαρτεροῦντες</td><td>proskarterountes</td><td>G4342</td><td><b>持續黏著、堅持不放</b></td></tr><tr><td>幫補</td><td>κοινωνοῦντες</td><td>koinōnountes</td><td>G2841</td><td><b>有分於、分享</b>（κοινωνία 同字根）</td></tr><tr><td>一味地款待</td><td>φιλοξενίαν διώκοντες</td><td>—</td><td>G5381/G1377</td><td><b>追趕款待客旅的機會</b></td></tr></table>","gram":"<p>★ 亮光一：στοργή ——希臘文四種愛的其中一種</p><p>希臘文有幾個表達「愛」的字：</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>ἀγάπη</b></td><td>意志性的、捨己的愛</td></tr><tr><td><b>φιλία</b></td><td>友愛、朋友之愛</td></tr><tr><td><b>ἔρως</b></td><td>情慾之愛（新約未用）</td></tr><tr><td><b>στοργή</b></td><td><b>家人之間的、自然的親情</b></td></tr></table><p>而12:10的 <b>φιλόστοργος</b> 是 φιλία ＋ στοργή 的合成字（新約僅此一次）。</p><p>弟兄姊妹，保羅在說：</p><p>對弟兄姊妹的愛，要像<b>家人之間</b>那樣。</p><p>不是同事，不是會友，是<b>家人</b>。</p><p>★ 亮光二：προηγέομαι ——「推讓」</p><p>這個字有兩種可能的意思：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>看別人比自己重要</b></td><td>和合本「彼此<b>推讓</b>」</td></tr><tr><td><b>在尊敬人上走在前面</b></td><td>「搶著先尊敬對方」</td></tr></table><p>兩種都很美：</p><p>一種是<b>讓</b>；一種是<b>搶著讓</b>。</p><p>★ 亮光三：ζέω ——「沸騰」</p><p>「要心裡<b>火熱</b>」——ζέοντες，字面是<b>沸騰</b>。</p><p>而這正是10:2的字根：</p><pre>10:2  「他們向神有【熱心】（ζῆλος），但不是按著真知識」\n12:11 「要心裡【火熱】（ζέω），常常服事主」</pre><p>弟兄姊妹，第十章說：熱心可以走錯方向。<br>第十二章說：但<b>方向對了就要火熱</b>。</p><p>保羅從來不反對熱心，他反對的是<b>沒有校正過方向的熱心</b>。</p><p>★ 亮光四：12:12 是第五章的回音</p><pre>5:2–3  「歡歡喜喜【盼望】神的榮耀……就是在【患難】中也是歡歡喜喜的，\n        因為知道患難生【忍耐】」\n   ↓\n12:12  「在【指望】中要喜樂；在【患難】中要【忍耐】」</pre><p>同樣三個字：盼望、患難、忍耐。</p><p>第五章是<b>神學陳述</b>；第十二章是<b>生活命令</b>。</p><p>★ 亮光五：12:13的「一味地款待」</p><p>「客要<b>一味地款待</b>」——φιλοξενίαν <b>διώκοντες</b>。</p><p>διώκω 的意思是<b>追趕、竭力追求</b>。</p><p>保羅<b>沒有</b>說「有客人來的時候要接待」。</p><p>他說：<b>去追那個機會</b>。</p>","exp":"<p>弟兄姊妹，10–13節在原文裡幾乎全部是<b>分詞</b>，不是一條一條的命令。</p><p>分詞的效果是什麼？</p><p>它不像清單，像<b>一幅正在進行的畫面</b>——一個群體活著的樣子。</p><p><b>經文本身明確表達的：</b> 這是一連串教會生活的實際樣貌：深情、推讓、火熱、忍耐、恆切禱告、供應需要、款待客旅。</p><p><b>可以合理推論的：</b> 其中兩個動詞特別有力——</p><p>① ζέοντες（火熱）字面是「<b>沸騰</b>」——那是水滾起來的樣子。<br>② διώκοντες（款待）字面是「<b>追趕</b>」——保羅沒有說「有客人來的時候要接待」，他說：<b>去追那個機會</b>。</p><p>（而13節的「追趕」，在下一節就變成了「<b>追趕你們的人</b>」——保羅在兩節之間玩了同一個字 διώκω。）</p><p>【第四段｜12:14–21　街上】</p>"},{"a":14,"z":14,"star":true,"grk":"<p>εὐλογεῖτε τοὺς διώκοντας [ὑμᾶς], εὐλογεῖτε καὶ μὴ καταρᾶσθε.</p>","lit":"<p>「要<b>祝福</b>那些<b>逼迫（追趕）你們的人</b>；<b>要祝福，不可咒詛</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>祝福</td><td>εὐλογεῖτε</td><td>eulogeite</td><td>G2127</td><td>εὖ（好）+ λόγος（話）：<b>說好話</b>（現在式命令：<b>持續地</b>）</td></tr><tr><td>逼迫</td><td>διώκοντας</td><td>diōkontas</td><td>G1377</td><td><b>追趕</b>（<b>12:13「一味地款待」同字</b>）</td></tr><tr><td>咒詛</td><td>καταρᾶσθε</td><td>katarasthe</td><td>G2672</td><td>咒罵、求禍臨到</td></tr></table>","gram":"<p>★ 亮光一：與12:13的文字遊戲</p><pre>12:13  τὴν φιλοξενίαν διώκοντες   —— 【追求】款待\n12:14  εὐλογεῖτε τοὺς διώκοντας   —— 為【追趕／逼迫】你們的人祝福</pre><p>同一個字根 διώκω。</p><p>弟兄姊妹，保羅在說：</p><p>你追著機會去愛人；<br>而有人追著你要害你。</p><p>兩種「追」，同一個字。</p><p>★ 亮光二：這是主耶穌的話</p><p>路6:28「<b>咒詛你們的，要為他祝福</b>；凌辱你們的，要為他禱告。」<br>太5:44「要愛你們的仇敵，為那<b>逼迫</b>你們的禱告。」</p><p>弟兄姊妹，12:14–21這一整段，幾乎就是登山寶訓的保羅版。</p>","exp":"<p>弟兄姊妹，13節說「客要一味地<b>款待</b>」——原文是<b>追趕</b>（διώκω）。</p><p>而14節說「<b>逼迫</b>你們的」——<b>同一個字</b>。</p><pre>12:13  φιλοξενίαν διώκοντες      —— 【追趕】款待的機會\n12:14  εὐλογεῖτε τοὺς διώκοντας  —— 給那些【追趕】你們的人祝福</pre><p><b>經文本身明確表達的：</b> 要持續地為逼迫者祝福，並且不可咒詛。</p><p><b>可以合理推論的：</b> 保羅在兩節之間玩了同一個字——</p><p>你要<b>追趕</b>款待；而對那些<b>追趕</b>你的人——<b>祝福他們</b>。</p><p>而「祝福」是<b>現在式命令</b>：不是「原諒他一次」，是<b>持續地說好話</b>。</p><p><b>⚠ 牧養提醒：</b> 這一節對正在受傷害的人，可能太重。<br>請注意保羅<b>沒有</b>說「假裝沒事」——12:19明說那是一件需要伸冤的事。<br>祝福不等於否認傷害；祝福是<b>把報復權交出去</b>。</p>"},{"a":15,"z":16,"star":false,"grk":"<p>15 χαίρειν μετὰ χαιρόντων, κλαίειν μετὰ κλαιόντων.<br>16 τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ' ἑαυτοῖς.</p>","lit":"<p>15「要<b>與喜樂的人同喜樂</b>，<b>與哀哭的人同哀哭</b>。」<br>16「要<b>彼此想同一件事</b>；<b>不要心思高傲</b>，倒要<b>讓自己被帶往卑微之處</b>。<b>不要自以為聰明</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>同樂／同哭</td><td>χαίρειν／κλαίειν μετά</td><td>—</td><td>G5463/G2799</td><td><b>不定詞</b>：不帶命令口氣，像一句素描</td></tr><tr><td>同心</td><td>τὸ αὐτὸ φρονοῦντες</td><td>—</td><td>G5426</td><td><b>想同一件事</b>（<b>15:5同詞組</b>）</td></tr><tr><td>志氣高大</td><td>τὰ ὑψηλὰ φρονοῦντες</td><td>—</td><td>G5308</td><td><b>心思往高處飄</b>（<b>11:20同詞組</b>）</td></tr><tr><td>俯就卑微</td><td>συναπαγόμενοι</td><td>synapagomenoi</td><td>G4879</td><td><b>被一同帶走</b>（被動語態）</td></tr></table>","gram":"<p>★ 亮光一：12:15是兩個不定詞，極其簡潔</p><p>原文只有六個字：</p><p>χαίρειν μετὰ χαιρόντων, κλαίειν μετὰ κλαιόντων</p><p>「與喜樂的人喜樂，與哭泣的人哭泣。」</p><p>弟兄姊妹，注意順序：<b>先講同樂，再講同哭</b>。</p><p>而通常，<b>同樂比同哭更難</b>。</p><p>同哭時，我在上面；同樂時，他在上面。</p><p>★ 亮光二：12:16的三個 φρον- 字</p><pre>τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες  （彼此同心）\nμὴ τὰ ὑψηλὰ φρονοῦντες           （不要志氣高大）\nμὴ γίνεσθε φρόνιμοι παρ' ἑαυτοῖς （不要自以為聰明）</pre><p>★ 亮光三：「不要志氣高大」＝ 11:20那個詞組</p><pre>11:20 「你不可【自高】（μὴ ὑψηλὰ φρόνει），反要懼怕」\n12:16 「不要【志氣高大】（μὴ τὰ ὑψηλὰ φρονοῦντες）」</pre><p>同一個詞組。</p><p>第十一章是對<b>外邦信徒整體</b>說的；<br>第十二章是對<b>每一個人在關係中</b>說的。</p><p>★ 亮光四：「俯就卑微的人」</p><p>τοῖς ταπεινοῖς συναπαγόμενοι ——字面是「<b>被一同帶往卑微之處</b>」。</p><p>συναπάγω 的意思是「一同被帶走」。</p><p>弟兄姊妹，這不是「屈尊去幫助小人物」。</p><p>是「<b>讓自己被帶到低處去</b>」。</p>","exp":"<p>弟兄姊妹，15節在原文裡不是命令式，是<b>兩個不定詞</b>——</p><p>保羅不是在下令，他是在<b>素描</b>一個群體該有的樣子。</p><p><b>經文本身明確表達的：</b> 與喜樂的人同樂，與哀哭的人同哭；彼此同心，不可高傲，倒要俯就卑微的人。</p><p><b>可以合理推論的：</b> 這兩件事的難度<b>並不對稱</b>。</p><p>與哀哭的人同哭，需要<b>同情</b>。<br>而與喜樂的人同樂——需要<b>沒有嫉妒</b>。</p><p>（想想看：當一個人得到你一直想要卻沒得到的東西，你笑得出來嗎？）</p><p>而16節的「俯就卑微」（συναπαγόμενοι）是<b>被動語態</b>：</p><p>不是「屈尊去幫助小人物」，是「<b>讓自己被帶到低處去</b>」。</p><p><b>⚠ 補充：</b> 「不要志氣高大」的原文詞組（τὰ ὑψηλὰ φρονοῦντες），<br>與11:20「不可自高」<b>完全相同</b>——保羅在講外邦信徒的優越感時用過同一句話。</p>"},{"a":17,"z":18,"star":false,"grk":"<p>17 μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες, προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·<br>18 εἰ δυνατόν, τὸ ἐξ ὑμῶν, μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·</p>","lit":"<p>17「<b>不要以惡報惡</b>；要<b>預先籌劃</b>那在眾人面前<b>看為美好</b>的事。」<br>18「<b>若是可能</b>，<b>就你們這一邊而言</b>，要<b>與眾人和睦</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>以惡報惡</td><td>κακὸν ἀντὶ κακοῦ</td><td>—</td><td>G2556</td><td><b>惡換惡</b>（ἀντί ＝ 交換）</td></tr><tr><td>留心去做</td><td>προνοούμενοι</td><td>pronooumenoi</td><td>G4306</td><td><b>πρό + νοέω：預先籌劃</b>（<b>13:14 πρόνοια 同字根</b>）</td></tr><tr><td>若是能行</td><td>εἰ δυνατόν</td><td>ei dynaton</td><td>G1415</td><td>若是可能的</td></tr><tr><td>盡力</td><td>τὸ ἐξ ὑμῶν</td><td>to ex hymōn</td><td>—</td><td><b>就出於你們這一邊而言</b></td></tr></table>","gram":"<p>★ 12:18的三個限定詞（★ 極其重要的牧養智慧）</p><p>弟兄姊妹，這一節有三個限定，中文可以看見兩個：</p><pre>εἰ δυνατόν      —— 【若是能行】（可能不能行）\nτὸ ἐξ ὑμῶν      —— 【在於你們的部分】（你只負責你這一半）\nμετὰ πάντων ἀνθρώπων εἰρηνεύοντες —— 與眾人和睦</pre><p>弟兄姊妹，保羅是一個非常實際的人。</p><p>他<b>沒有</b>說「你一定要跟每個人都和好」。</p><p>他說了三件事：</p><p>① 若是能行——<b>有時候不能行</b>。<br>② 在於你們的部分——<b>你只負責你這一半</b>。<br>③ 總要盡力——<b>但你要盡你那一半的全力</b>。</p><p>這對受過關係傷害的人，是極大的釋放：</p><p>和睦需要兩個人。</p><p>而神只要求你負責<b>你那一邊</b>。</p>","exp":"<p>弟兄姊妹，18節是全本聖經對「和睦」最誠實、也最有恩典的一句話。</p><p>因為保羅加了<b>三個限定</b>：</p><pre>① 若是能行     —— 有時候不能行\n② 總要盡力     —— 但你要盡你那一半的全力\n③ 就你們這一邊 —— 你只負責你這一半</pre><p><b>經文本身明確表達的：</b> 不要以惡報惡；要預先籌劃眾人看為美的事；並且在自己這一邊，盡力與眾人和睦。</p><p><b>可以合理推論的：</b> 保羅<b>沒有</b>說「你一定要跟每個人和好」。</p><p>和睦需要兩個人；而神只要求你負責<b>你那一邊</b>。</p><p><b>⚠ 牧養提醒：</b> 這一節對受過關係傷害的人，是極大的釋放。<br>若對方不願意，那不是你的失敗。<br>（同時也要誠實：「就你們這一邊」也意味著——<b>你那一邊，要真的盡力</b>。）</p><p>而17節的「留心去做」（προνοέω），正是13:14「不要為肉體<b>安排</b>」（πρόνοια）那個字根：</p><p>同一種「預先籌劃」的能力——</p><p>可以用來為肉體鋪路，也可以用來為善鋪路。</p>"},{"a":19,"z":19,"star":true,"grk":"<p>μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ· γέγραπται γάρ· ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.</p>","lit":"<p>「親愛的，不要自己伸冤，<b>倒要給忿怒讓出地方</b>；因為經上記著：『伸冤在我，我必報應，主說。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>伸冤</td><td>ἐκδικοῦντες</td><td>ekdikountes</td><td>G1556</td><td><b>為自己討回公道</b></td></tr><tr><td>讓步</td><td>δότε τόπον</td><td>dote topon</td><td>G5117</td><td><b>給出空間、讓出位置</b></td></tr><tr><td>主怒</td><td>τῇ ὀργῇ</td><td>tē orgē</td><td>G3709</td><td><b>那忿怒</b>（帶冠詞——見下）</td></tr></table>","gram":"<p>★ 亮光一：「讓步」的字面是「<b>給出空間</b>」</p><p>δότε τόπον ——<b>讓出一個位置</b>。</p><p>弟兄姊妹，這個畫面很有意思：</p><p>你站在那裡，準備要動手。</p><p>而神說：<b>讓開，給我一個位置</b>。</p><p>★ 亮光二：「主怒」帶著冠詞</p><p>τῇ ὀργῇ ——「<b>那</b>忿怒」。</p><p>在羅馬書中，「那忿怒」有特定的所指：</p><pre>1:18  神的忿怒從天上顯明\n2:5   在忿怒的日子\n5:9   免去神的忿怒</pre><p>所以12:19的意思是：</p><p>不是「讓對方發完脾氣」，是「<b>把這件事交給神的忿怒去處理</b>」。</p><p>★ 亮光三：這不是「算了」</p><p>弟兄姊妹，保羅<b>沒有</b>說「這件事不重要」。</p><p>他說的是：<b>這件事很重要，重要到必須交給神親自處理</b>。</p><p>不伸冤，不是因為那件事不值得伸冤。<br>是因為<b>有一位更有資格伸冤的</b>。</p>","exp":"<p>弟兄姊妹，12:19是這一段的<b>神學根據</b>。</p><p>而它引的是申命記32:35——摩西之歌裡的一句話。</p><p><b>經文本身明確表達的：</b> 不要自己伸冤，要把地方讓出來給神的忿怒；因為伸冤在神。</p><p><b>可以合理推論的：</b> 「寧可讓步」的原文是 <b>δότε τόπον</b>——字面是「<b>給出地方</b>」。</p><p>保羅的畫面是：<b>你站在那個位置上，神就不好動手；你讓開，祂才能來</b>。</p><p>而下一章立刻給了這句話的<b>配套</b>：</p><p>13:4「他是神的用人，是<b>伸冤的</b>（ἔκδικος），刑罰那作惡的。」</p><p>12:19的 ἐκδίκησις 與13:4的 ἔκδικος，是<b>同一個字根</b>。</p><p>所以12:19<b>不是</b>說「這件事沒有人管」。</p><p>是說：<b>不是由你來管</b>。</p><p>⚠⚠ 牧養提醒（極重要）：</p><p>這一節對受過傷害、特別是受過侵害的人，極容易被誤用成「你要忍」。</p><p>必須說清楚三件事：</p><p>① 這不是撤案，是<b>移送到更高的法庭</b>。</p><p>② 保羅在下一章就說了：神設立了政府「是伸冤的」——<b>尋求法律途徑，並不違背這一節</b>。</p><p>③ 講這一節的時候，應當預備<b>會後的實際協助</b>（陪同、轉介、通報），而不只是一句「交給神」。</p>"},{"a":20,"z":21,"star":true,"grk":"<p>21 μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.</p>","lit":"<p>21「不要<b>被惡所勝</b>，反要<b>用善去勝過惡</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>炭火</td><td>ἄνθρακας πυρός</td><td>anthrakas pyros</td><td>G440</td><td><b>燒著的炭</b></td></tr><tr><td>勝</td><td>νικάω</td><td>nikaō</td><td>G3528</td><td><b>得勝</b>（<b>8:37 ὑπερνικάω 同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：「炭火堆在他頭上」是什麼意思？（見第二十部分的完整討論）</p><p>這是引自箴言25:21–22。主要有三種理解：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>A. 使人羞愧悔改</b></td><td>善行使對方良心不安，如頭上頂著火炭般難受 → 導向悔改</td></tr><tr><td><b>B. 古埃及的悔罪儀式</b></td><td>有學者認為古埃及有頂著火盆表示悔改的儀式</td></tr><tr><td><b>C. 加重審判</b></td><td>若對方仍不悔改，這善行反而加重他的責任</td></tr></table><p>上下文（12:21「以善勝惡」）明顯支持 A：</p><p>保羅的目的是<b>勝過惡</b>，不是報復。</p><p>★★ 亮光二：νικάω ——第八章那個字</p><pre>8:37  「靠著愛我們的主，在這一切的事上已經【得勝有餘】（ὑπερνικῶμεν）了」\n   ↓\n12:21 「你不可為惡所【勝】（νικάω），反要【以善勝惡】（νίκα）」</pre><p>弟兄姊妹，這是一個美麗的呼應：</p><p>第八章：<b>你已經得勝有餘了</b>（地位）。<br>第十二章：<b>所以去得勝吧</b>（實踐）。</p><p>★ 亮光三：兩個語態的對比</p><pre>μὴ νικῶ ὑπὸ τοῦ κακοῦ —— 【被動】：不要被惡「所勝」\nἀλλὰ νίκα            —— 【主動命令】：你要去勝</pre><p>弟兄姊妹，保羅在說：</p><p>在這件事上，你只有兩種可能：</p><p>要嘛惡勝過你，要嘛你用善勝過惡。</p><p>沒有「中立」這個選項。</p>","exp":"<p>弟兄姊妹，12:21是全章的結論，也是最實際的一句話。</p><p>「你不可為惡所勝」——這是什麼意思？</p><p>當有人惡待你，而你用惡回應——</p><p>表面上你在報復他。</p><p>實際上——<b>惡已經贏了</b>。</p><p>因為它成功地讓你也變成了一個惡人。</p><p>而「以善勝惡」的意思是：</p><p>我不讓那件惡事，<b>改變我是誰</b>。</p>"}],"13":[{"a":1,"z":1,"star":true,"grk":"<p>Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω. οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ οὖσαι ὑπὸ θεοῦ τεταγμέναι εἰσίν.</p>","lit":"<p>「<b>每一個魂</b>都要<b>排到</b>那些<b>在上的權柄</b>底下。因為除了出於神的以外，沒有權柄；而那些存在的，都是<b>被神排定</b>的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>人人</td><td>πᾶσα ψυχή</td><td>pasa psychē</td><td>G5590</td><td>—</td><td><b>每一個魂</b>（希伯來式表達：每一個人）</td><td>沒有人例外</td></tr><tr><td>順服</td><td>ὑποτασσέσθω</td><td>hypotassesthō</td><td>G5293</td><td>ὑπό + τάσσω</td><td><b>排到……底下</b></td><td><b>10:3同字</b></td></tr><tr><td>權柄</td><td>ἐξουσία</td><td>exousia</td><td>G1849</td><td>—</td><td>權柄、當局</td><td>廣義，不專指皇帝</td></tr><tr><td>神所命的</td><td>τεταγμέναι</td><td>tetagmenai</td><td>G5021</td><td><b>τάσσω</b></td><td><b>被排定、被指派位置</b></td><td><b>完成被動分詞</b></td></tr></table>","gram":"<p>★ 亮光一：τάσσω 字群——這是一個軍事用語</p><p>τάσσω 的意思是「<b>排列、編排、指派位置</b>」——用於軍隊列陣。</p><p>而13:1–2用了四個同字根的字：</p><pre>ὑποτασσέσθω （13:1）—— 排到……底下  = 順服\nτεταγμέναι  （13:1）—— 被排定       = 神所命的\nἀντιτασσόμενος（13:2）—— 排到對面   = 抗拒\nδιαταγή     （13:2）—— 所排定的     = 神的命</pre><p>弟兄姊妹，這個字群的畫面是：</p><p>神在一張大棋盤上，把每一個權柄<b>排在它的位置</b>。</p><p>而你要做的，是<b>站在你的位置上</b>，不是跳到對面去。</p><p>★ 亮光二：ὑποτάσσω ≠ 盲目服從</p><p>這一點極其重要（見第二十部分的完整討論）。</p><p>ὑποτάσσω 的意思是「<b>認可某個秩序、站在其中的位置上</b>」，</p><p>它與 ὑπακούω（<b>聽從、照著做</b>）是<b>不同的字</b>。</p><p>保羅在此用的是 ὑποτάσσω（順服秩序），<br>不是 ὑπακούω（凡事照做）。</p><p>證據：使徒行傳5:29——同一批使徒在公會前說：</p><p>「順從神，不順從人（πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις），是應當的。」</p><p>弟兄姊妹，同一本聖經。</p><p>所以「順服」不可能等於「無論吩咐什麼都照做」。</p><p>★ 亮光三：τεταγμέναι 是完成被動式</p><p>「凡掌權的都是<b>神所命的</b>」——被動式，施動者是神。</p><p>保羅在說：<b>權柄這個制度</b>，是神設立的。</p><p>（關於「這是否表示每一個掌權者的每一個行為都是神所認可的」，見第二十部分。）</p>","exp":"<p>弟兄姊妹，13:1必須放在12:19–21的脈絡裡讀：</p><pre>12:19  不要自己伸冤\n12:21  以善勝惡\n   ↓\n13:1–4 因為神已經設立了一個機制來對付惡</pre><p>保羅的邏輯是：</p><p>你不可以私下報復——<br>但這不表示惡沒有人管。</p><p>神設立了政府來管。</p>"},{"a":2,"z":4,"star":true,"grk":"<p>4 θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.</p>","lit":"<p>2「所以，那<b>抵擋掌權的</b>，就是<b>抵擋神所排定的秩序</b>；而抵擋的人，<b>必自取審判</b>。」<br>3「因為作官的<b>不是叫行善的懼怕</b>，乃是叫<b>作惡的</b>懼怕。你願意不懼怕掌權的嗎？<b>就行善吧</b>——你必得他的稱讚；」<br>4「因為他是<b>神的僕役</b>，<b>是為了你的益處</b>。但你若作惡，就當懼怕；因為他<b>不是徒然佩劍</b>——他是神的僕役，是<b>執行公義者</b>，向作惡的<b>施行忿怒</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>用人</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td>—</td><td><b>僕人、執事</b></td><td>見下</td></tr><tr><td>與你有益</td><td>εἰς τὸ ἀγαθόν</td><td>eis to agathon</td><td>G18</td><td>—</td><td><b>為你的益處</b></td><td><b>★ 見下——功能性的定義</b></td></tr><tr><td>空空地</td><td>εἰκῇ</td><td>eikē</td><td>G1500</td><td>—</td><td>無故地、白白地</td><td>—</td></tr><tr><td>劍</td><td>μάχαιρα</td><td>machaira</td><td>G3162</td><td>—</td><td><b>短劍</b>（見下）</td><td>—</td></tr><tr><td>伸冤的</td><td>ἔκδικος</td><td>ekdikos</td><td>G1558</td><td>ἐκ + δίκη</td><td><b>執行公義者</b></td><td><b>12:19同字根</b></td></tr></table>","gram":"<p>★★ 亮光一：13:3–4是一個<b>功能性的定義</b></p><p>這是理解全段最關鍵的一點。</p><p>保羅在13:3–4描述政府的時候，用的是<b>功能性的語言</b>：</p><table><tr><th>經文</th><th>政府的功能</th></tr><tr><td>13:3</td><td><b>不是叫行善的懼怕，乃是叫作惡的懼怕</b></td></tr><tr><td>13:4</td><td><b>是神的用人，是</b>與你有益<b>的</b></td></tr><tr><td>13:4</td><td><b>是伸冤的，刑罰</b>那作惡的</td></tr></table><p>弟兄姊妹，保羅在此定義的，是政府<b>受託的職分</b>：</p><p>賞善、罰惡。</p><p>這一點在第二十部分的討論中極其重要：</p><p>當一個政權<b>顛倒</b>這個功能——賞惡、罰善——<br>它就正在背叛13:3–4所描述的那個受託身分。</p><p>（這正是啟示錄13章的處境）</p><p>★ 亮光二：διάκονος ——政府是神的「執事」</p><p>保羅用了兩次 διάκονος（13:4），又在13:6用了 <b>λειτουργός</b>。</p><p>這兩個字都是<b>教會用語</b>：</p><table><tr><th>字</th><th>一般用法</th></tr><tr><td><b>διάκονος</b></td><td><b>執事</b>（提前3:8；腓1:1）</td></tr><tr><td><b>λειτουργός</b></td><td><b>供職者</b>（來8:2用於基督；羅15:16保羅自稱）</td></tr></table><p>弟兄姊妹，保羅刻意用了兩個「神聖服事」的字，來稱呼羅馬的官員。</p><p>這是一個極高的評價——<br>但同時也是一個極重的<b>責任</b>：</p><p>他們是<b>在替神辦事</b>。</p><p>★ 亮光三：μάχαιρα ——那把劍</p><p>μάχαιρα 是<b>短劍</b>，不是戰場上的大劍（ῥομφαία）。</p><p>它在第一世紀主要用於：</p><p>- 士兵佩帶的隨身武器<br>- <b>執法時的象徵</b>（羅馬總督有 ius gladii ——「持劍權」，即審判死刑的權柄）</p><p>弟兄姊妹，「他不是空空地佩劍」的意思是：</p><p>政府手上的強制力，<b>不是裝飾品</b>。</p><p>（關於這節是否支持死刑，見第二十部分——本文不作裁決。）</p><p>★ 亮光四：ἔκδικος ——12:19那個字回來了</p><pre>12:19  「伸冤（ἐκδίκησις）在我，我必報應」—— 個人不可報復\n   ↓\n13:4   「他是神的用人，是伸冤的（ἔκδικος）」—— 神設立了機制</pre><p>弟兄姊妹，這一組字根的呼應，是12–13章之間最重要的橋樑：</p><p>12:19不是說「惡沒有人管」。<br>12:19是說「<b>不是由你來管</b>」。</p><p>而13:4說：神已經指派了。</p>","exp":"<p>弟兄姊妹，3–4節不是在描述「政府都是好的」——</p><p>它是在描述<b>政府受託的職分</b>。</p><table><tr><th>經文</th><th>政府該做的</th></tr><tr><td>13:3</td><td><b>不是叫行善的懼怕，乃是叫作惡的懼怕</b></td></tr><tr><td>13:4</td><td><b>是神的用人，是</b>與你有益<b>的</b></td></tr><tr><td>13:4</td><td><b>是伸冤的，刑罰</b>那作惡的</td></tr></table><p><b>經文本身明確表達的：</b> 掌權者是神所排定的，其職分是賞善罰惡；抵擋這個秩序的人自取審判。</p><p><b>可以合理推論的：</b> 保羅在這裡給的是一個<b>功能性的定義</b>——</p><p>這既是政府的<b>託付</b>，也是<b>衡量它的標準</b>。</p><p>當一個政權<b>顛倒</b>這個功能——賞惡、罰善、以行善為罪——<br>它就正在背叛13:3–4所描述的那個受託身分。</p><p>⚠⚠ 講台誠信提醒（本章最重要的一條）：</p><p>這段經文在歷史上曾被用來為奴隸制度、種族隔離、極權政權背書。</p><p>必須同時講明：</p><p>① 保羅用的字是 ὑποτάσσω（排到秩序底下），<b>不是</b> ὑπακούω（凡事照做）。</p><p>② 同一本聖經說：「<b>順從神，不順從人</b>，是應當的」（徒5:29）；<br>但3:18「即或不然，我們決不事奉你的神」；出1:17收生婆「不照埃及王的吩咐行」——而神厚待她們。</p><p>③ 寫13:1的保羅自己，曾要求官長親自來釋放他（徒16:37）、提出羅馬公民權（徒22:25）、上告於凱撒（徒25:11）。</p><p>④ ❌❌ 絕不可用這段經文為任何特定的當代政權背書或攻擊。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν.</p>","lit":"<p>「所以，<b>必須要順服</b>——<b>不只是因為那忿怒</b>，<b>也是因為良心</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>必須</td><td>ἀνάγκη</td><td>anankē</td><td>G318</td><td><b>必要、不得不</b></td></tr><tr><td>良心</td><td>συνείδησις</td><td>syneidēsis</td><td>G4893</td><td><b>共同知道</b>（<b>2:15同字</b>）</td></tr></table>","gram":"<p>★ 兩個動機的層次</p><pre>διὰ τὴν ὀργήν      —— 因為【刑罰】（怕被罰）\nδιὰ τὴν συνείδησιν —— 因為【良心】（知道這是對的）</pre><p>弟兄姊妹，保羅在說：</p><p>一個基督徒守法，<b>不應該只是因為怕被抓</b>。</p><p>而是因為他知道：那個秩序，是神設立的。</p><p>而 συνείδησις 這個字，我們在2:15見過：</p><p>2:15「他們<b>是非之心</b>（συνείδησις）同作見證。」</p>","exp":"<p>弟兄姊妹，13:5給了守法的<b>兩層動機</b>——而次序很重要。</p><pre>διὰ τὴν ὀργήν      —— 因為【刑罰】（怕被罰）\nδιὰ τὴν συνείδησιν —— 因為【良心】（知道這是對的）</pre><p><b>經文本身明確表達的：</b> 順服不只是為了避免刑罰，也是出於良心。</p><p><b>可以合理推論的：</b> 一個基督徒守法，<b>不應該只是因為怕被抓</b>。</p><p>而是因為他知道：<b>那個秩序，是神排定的</b>。</p><p>⚠ 補充：<b> συνείδησις 是2:15那個字——</b>保羅在第二章說，外邦人的「是非之心」同作見證。<br>而在第十三章，那顆良心成了守法的內在根據。</p><p>【第二段｜13:6–7　納稅與償還】</p>"},{"a":6,"z":7,"star":false,"grk":"<p>6 …λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.<br>7 ἀπόδοτε πᾶσιν τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.</p>","lit":"<p>6「因為這個緣故，你們也<b>納稅</b>；因為他們是<b>神的差役</b>（供職者），<b>恆切專注於</b>這件事。」<br>7「<b>把所欠的都還給眾人</b>：當得<b>糧稅</b>的，給他糧稅；當得<b>關稅</b>的，給他關稅；當得<b>懼怕</b>的，給他懼怕；當得<b>尊敬</b>的，給他尊敬。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>差役</td><td>λειτουργός</td><td>leitourgos</td><td>G3011</td><td><b>公職服事者／聖職供奉者</b>（見下）</td></tr><tr><td>常常特管</td><td>προσκαρτεροῦντες</td><td>proskarterountes</td><td>G4342</td><td><b>恆切專注於</b>（<b>12:12「禱告要恆切」同字</b>）</td></tr><tr><td>所當得的</td><td>ὀφειλάς</td><td>opheilas</td><td>G3782</td><td><b>所欠的債</b></td></tr><tr><td>糧</td><td>φόρος</td><td>phoros</td><td>G5411</td><td><b>直接稅</b>（人頭稅、土地稅）</td></tr><tr><td>稅</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>間接稅</b>（關稅、通行稅）</td></tr></table>","gram":"<p>★ 亮光一：λειτουργός 的宗教色彩</p><p>這個字的字根 λειτουργία 在七十士譯本中，專指<b>祭司在聖殿中的供職</b>（出28:35；民8:22）。</p><p>而在新約：</p><p>- <b>來8:2</b> 基督是「聖所……的<b>執事</b>（λειτουργός）」<br>- <b>羅15:16</b> 保羅自稱「作外邦人的<b>祭司</b>（λειτουργός）」</p><p>弟兄姊妹，保羅用一個<b>祭司性的字</b>，來稱呼收稅的官員。</p><p>這是何等驚人的評價。</p><p>★ 亮光二：προσκαρτερέω ——12:12那個字</p><pre>12:12  「禱告要【恆切】（προσκαρτεροῦντες）」\n13:6   「【常常特管】（προσκαρτεροῦντες）這事」</pre><p>同一個字。</p><p>保羅用形容「恆切禱告」的字，來形容官員盡忠職守。</p><p>★ 亮光三：13:7的四對稱</p><p>原文的結構極其整齊：</p><pre>τῷ τὸν φόρον  τὸν φόρον  —— 當得糧的，給他糧\nτῷ τὸ τέλος   τὸ τέλος   —— 當得稅的，給他稅\nτῷ τὸν φόβον  τὸν φόβον  —— 當得懼怕的，給他懼怕\nτῷ τὴν τιμὴν  τὴν τιμήν  —— 當得恭敬的，給他恭敬</pre><p>四組，每組重複同一個字。</p><p>保羅的重點是：<b>該給誰的，就給誰</b>。</p><p>★ 亮光四：與主耶穌的話呼應</p><p>可12:17「凱撒的物當歸給凱撒，神的物當歸給神。」</p><p>弟兄姊妹，主耶穌的那句話有<b>兩半</b>。</p><p>而13:7只講了前半——因為13:8–10、以及全卷書，講的是後半。</p>","exp":"<p>弟兄姊妹，13:6用了一個很重的字來稱呼收稅的官員：λειτουργός。</p><p>那個字在七十士譯本中，專指<b>祭司在聖殿中的供職</b>（來8:2用它形容<b>基督</b>）。</p><p><b>經文本身明確表達的：</b> 納稅有其正當理由——他們是神的差役，專責於此；凡人所當得的，都要給他。</p><p><b>可以合理推論的：</b> 保羅刻意用了兩個「神聖服事」的字（13:4 διάκονος、13:6 λειτουργός）來稱呼羅馬官員。</p><p>這是一個極高的評價，同時也是一個極重的責任：<b>他們是在替神辦事</b>。</p><p>而13:7的原文是<b>四組對稱</b>，每組重複同一個字：</p><pre>τῷ τὸν φόρον  τὸν φόρον  —— 當得糧的，給他糧\nτῷ τὸ τέλος   τὸ τέλος   —— 當得稅的，給他稅\nτῷ τὸν φόβον  τὸν φόβον  —— 當得懼怕的，給他懼怕\nτῷ τὴν τιμὴν  τὴν τιμήν  —— 當得恭敬的，給他恭敬</pre><p>重點很簡單：<b>該給誰的，就給誰</b>。</p><p><b>⚠ 牧養提醒：</b> 一個基督徒的見證，常常不是毀在大事上，<br>是毀在<b>該給的沒給</b>上——該還的錢、該說的道歉、該履行的承諾。</p><p>【第三段｜13:8–10　一筆還不完的債】</p>"},{"a":8,"z":8,"star":true,"grk":"<p>Μηδενὶ μηδὲν ὀφείλετε εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.</p>","lit":"<p>「<b>不要虧欠任何人任何東西</b>，除了<b>彼此相愛</b>這一筆；因為那愛人的，就<b>已經成全了</b>律法。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>虧欠</td><td>ὀφείλετε</td><td>opheilete</td><td>G3784</td><td><b>欠債</b>（13:7 ὀφειλάς 同字根）</td></tr><tr><td>完全了</td><td>πεπλήρωκεν</td><td>peplērōken</td><td>G4137</td><td><b>完成式：已經成全了</b></td></tr></table>","gram":"<p>★ 亮光一：13:7與13:8的字根連結</p><pre>13:7  ἀπόδοτε πᾶσιν τὰς ὀφειλάς —— 把所【欠的】都還給眾人\n13:8  Μηδενὶ μηδὲν ὀφείλετε    —— 【不要虧欠】任何人任何東西\n      εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν —— 除了彼此相愛</pre><p>弟兄姊妹，保羅的邏輯很美：</p><p>把所有的債都還清。</p><p>只留一筆——</p><p>而那一筆，你<b>永遠還不完</b>。</p><p>★ 亮光二：為什麼愛的債還不完？</p><p>因為愛不是一次性的付款，是一種<b>持續的關係</b>。</p><p>你今天愛了，不代表明天不用愛。</p><p>這筆帳，<b>每天重新開立</b>。</p><p>★ 亮光三：πεπλήρωκεν 是完成式</p><p>「愛人的就<b>完全了</b>律法」——完成式：<b>已經成全了，而且效果持續</b>。</p><p>不是「愛人可以幫助你守律法」，<br>是「愛人的，<b>已經把律法成全了</b>」。</p>","exp":"<p>弟兄姊妹，13:7與13:8之間，有一個字的轉折——而中文看不太出來。</p><pre>13:7  ἀπόδοτε πᾶσιν τὰς ὀφειλάς —— 把所【欠的】都還給眾人\n13:8  Μηδενὶ μηδὲν ὀφείλετε    —— 【不要虧欠】任何人任何東西\n      εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν —— 除了彼此相愛</pre><p><b>經文本身明確表達的：</b> 凡事都不可虧欠人；惟有彼此相愛這一筆，要常以為虧欠。因為愛人的，就已成全了律法。</p><p><b>可以合理推論的：</b> 保羅的畫面是——</p><p>把所有的債<b>全部還清</b>；<br>只留一筆——而那一筆，<b>你永遠還不完</b>。</p><p>為什麼還不完？</p><p>因為愛不是一次性的付款，是一種<b>持續的關係</b>。</p><p>你今天愛了，不代表明天不用愛。這筆帳，<b>每天重新開立</b>。</p><p><b>⚠ 補充（一個常見的誤讀）：</b> 13:8<b>不是</b>在說「基督徒不可以有房貸、車貸」。<br>ὀφείλω 的重點是「<b>該給而未給</b>」，不是禁止一切信貸。<br>（比較詩37:21「<b>惡人借貸而不償還</b>」；但箴22:7也警告債務的捆綁。）</p>"},{"a":9,"z":10,"star":false,"grk":"<p>9 …ἐν τῷ λόγῳ τούτῳ ἀνακεφαλαιοῦται, ἐν τῷ· ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.<br>10 ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.</p>","lit":"<p>9「因為那『不可姦淫、不可殺人、不可偷盜、不可貪心』，以及其他任何誡命，<b>都總括在這一句話裡</b>：『<b>要愛你的鄰舍如同自己</b>。』」<br>10「<b>愛是不對鄰舍作惡的</b>；所以，<b>愛就是律法的滿全</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>包在……之內</td><td>ἀνακεφαλαιοῦται</td><td>anakephalaioutai</td><td>G346</td><td>ἀνά + κεφάλαιον（<b>標題／總計</b>）</td><td><b>總括在一個標題之下</b></td><td>見下</td></tr><tr><td>完全</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td>πληρόω</td><td><b>滿全、完滿</b></td><td><b>11:12、25同字</b></td></tr></table>","gram":"<p>★ 亮光一：ἀνακεφαλαιόω ——「加總」</p><p>κεφάλαιον 這個字在商業上的意思是「<b>總計、總額</b>」（就像我們說「合計」）。</p><p>所以 ἀνακεφαλαιόω 的意思是：</p><p>把一串項目<b>加總在一個標題底下</b>。</p><p>（弗1:10用同一個字：「要照所安排的，在日期滿足的時候，使天上、地上、一切所有的都在基督裡<b>同歸於一</b>。」）</p><p>弟兄姊妹，保羅在說：</p><p>你把十誡的後半列成一張清單——<br>不可姦淫、不可殺人、不可偷盜、不可貪婪……</p><p>然後在下面畫一條線，寫上<b>總計</b>。</p><p>那個總計是：<b>愛人如己</b>。</p><p>★ 亮光二：13:10的定義是<b>否定式</b>的</p><p>「愛是<b>不加害與人</b>的。」</p><p>弟兄姊妹，注意保羅在此<b>沒有</b>給一個抒情的定義。</p><p>他給的是一個<b>最低標準</b>：</p><p>愛，至少不傷害人。</p><p>這是一個很實際、也很扎人的檢驗：</p><p>你說你愛他——那你有沒有傷害他？</p><p>★ 亮光三：引自利未記19:18</p><p>「愛人如己」出自<b>利未記19:18</b>——而主耶穌稱它為<b>第二條誡命</b>（太22:39）。</p><p>保羅在此與主耶穌完全一致。</p>","exp":"<p>弟兄姊妹，9節那個動詞（ἀνακεφαλαιόω）很有意思。</p><p>它的字根 κεφάλαιον，在商業上的意思是「<b>總計、合計</b>」。</p><p>保羅的畫面是：</p><p>你把誡命一條一條列成清單——不可姦淫、不可殺人、不可偷盜、不可貪婪……</p><p>然後在下面畫一條線，寫上——</p><p>總計：<b>愛人如己</b>。</p><p><b>經文本身明確表達的：</b> 一切誡命都總括於「愛人如己」；而愛是不加害於人的，所以愛成全了律法。</p><p><b>可以合理推論的：</b> 10節給的<b>不是</b>愛的最高境界，是<b>最低標準</b>——</p><p>「愛是<b>不加害與人</b>的。」</p><p>而正因為它是最低標準，它特別扎人：<br>你說你愛他——那你有沒有<b>傷害</b>他？（用一句話、一個眼神、一次沉默）</p><p><b>⚠ 補充：</b> 「愛人如己」出自利19:18，正是主耶穌所說的<b>第二條誡命</b>（太22:39）。<br>而「鄰舍」（πλησίον）的意思是「<b>鄰近的人</b>」——不是抽象的全人類，是<b>離你最近的那一個</b>。</p><p>【第四段｜13:11–14　看清時候】</p>"},{"a":11,"z":12,"star":true,"grk":"<p>11 Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ἤδη ὑμᾶς ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.<br>12 ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ἀποθώμεθα οὖν τὰ ἔργα τοῦ σκότους, ἐνδυσώμεθα δὲ τὰ ὅπλα τοῦ φωτός.</p>","lit":"<p>11「而且要這樣——<b>知道這個時機</b>：時候到了，你們該<b>從睡中醒起來</b>；因為我們的救恩，現今比我們初信的時候<b>更近了</b>。」<br>12「<b>夜已經深了</b>，<b>白晝已經臨近</b>。所以我們要<b>脫下</b>黑暗的行為，<b>穿上</b>光明的<b>兵器</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>時候</td><td>καιρός</td><td>kairos</td><td>G2540</td><td>—</td><td><b>決定性的時機</b>（不是 χρόνος 時間長度）</td><td>5:6同字</td></tr><tr><td>睡醒</td><td>ἐξ ὕπνου ἐγερθῆναι</td><td>—</td><td>G5258/G1453</td><td>—</td><td><b>從睡中被叫起來</b></td><td>—</td></tr><tr><td>已深</td><td>προέκοψεν</td><td>proekopsen</td><td>G4298</td><td>πρό + κόπτω</td><td><b>推進、走了大半</b></td><td>—</td></tr><tr><td>將近</td><td>ἤγγικεν</td><td>ēngiken</td><td>G1448</td><td>ἐγγύς（近）</td><td><b>完成式：已經臨近了</b></td><td>—</td></tr><tr><td>脫去</td><td>ἀποθώμεθα</td><td>apothōmetha</td><td>G659</td><td>ἀπό + τίθημι</td><td><b>脫下（衣服）、放下</b></td><td>—</td></tr><tr><td>兵器</td><td>ὅπλα</td><td>hopla</td><td>G3696</td><td>—</td><td><b>武器</b>（<b>6:13同字！</b>）</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ὅπλα ——第六章那個字</p><pre>6:13   「將肢體作義的【兵器】（ὅπλα）獻給神」\n   ↓\n13:12  「帶上光明的【兵器】（ὅπλα）」</pre><p>弟兄姊妹，同一個字。</p><p>第六章：你的肢體是兵器。<br>第十三章：那些兵器要<b>穿上身</b>。</p><p>★ 亮光二：ἤγγικεν 是完成式</p><p>「白晝<b>將近</b>」——完成式：<b>已經臨近，而且維持在臨近的狀態</b>。</p><p>（這正是主耶穌傳道的第一句話用的字：可1:15「神的國<b>近了</b>」）</p><p>★ 亮光三：「我們得救，現今比初信的時候更近了」</p><p>弟兄姊妹，這一節的「得救」指的是什麼？</p><p>不是「稱義」——那已經發生了（5:1）。</p><p>是<b>救恩的完成</b>——身體得贖（8:23）、主的再來。</p><p>（關於「近」的理解，見第二十部分。）</p><p>★ 亮光四：一個很簡單卻很有力的邏輯</p><p>每過一天，那日子就近一天。</p><p>這不是猜測，這是算術。</p>","exp":"<p>弟兄姊妹，13:11換了一個角度——保羅開始講<b>時間</b>。</p><p>而他的邏輯其實非常簡單：</p><p>「我們得救，現今<b>比初信的時候更近了</b>。」</p><p><b>經文本身明確表達的：</b> 現今正是該從睡中醒來的時候；黑夜已深，白晝已經臨近；所以要脫去暗昧的行為，穿上光明的兵器。</p><p><b>可以合理推論的：</b> 這裡的「得救」不是指稱義（那已經發生了，5:1），<br>是指<b>救恩的完成</b>——身體得贖（8:23）、主的再來。</p><p>而「將近」（ἤγγικεν）是<b>完成式</b>：已經臨近，並且維持在臨近的狀態。<br>（這正是主耶穌傳道的第一句話用的字：可1:15「神的國<b>近了</b>」。）</p><p>而「兵器」（ὅπλα）是6:13那個字：</p><pre>6:13   將肢體作【義的兵器】獻給神\n13:12  帶上【光明的兵器】</pre><p>第六章：你的肢體是兵器。第十三章：那些兵器要<b>穿上身</b>。</p><p><b>⚠ 講台誠信提醒：</b> 不可用13:11推算任何時間表。<br>保羅的重點是「<b>該醒了</b>」，不是時刻表。（太24:36「那日子、那時辰，沒有人知道」）</p>"},{"a":13,"z":13,"star":false,"grk":"<p>ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ.</p>","lit":"<p>「我們要<b>行事為人得體</b>，<b>像在白晝一樣</b>：不可<b>狂歡宴樂</b>與<b>醉酒</b>，不可<b>淫亂</b>與<b>放蕩</b>，不可<b>紛爭</b>與<b>嫉妒</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>端正</td><td>εὐσχημόνως</td><td>euschēmonōs</td><td>G2156</td><td>εὖ + σχῆμα：<b>得體的、合宜的</b>（<b>12:2 συσχηματίζω 同字根</b>）</td></tr><tr><td>荒宴</td><td>κῶμος</td><td>kōmos</td><td>G2970</td><td><b>狂歡的宴會</b>（原指酒神遊行）</td></tr><tr><td>醉酒</td><td>μέθη</td><td>methē</td><td>G3178</td><td>醉酒</td></tr><tr><td>好色</td><td>κοίτη</td><td>koitē</td><td>G2845</td><td>床笫之事（性的放縱）</td></tr><tr><td>邪蕩</td><td>ἀσέλγεια</td><td>aselgeia</td><td>G766</td><td><b>無恥、放肆</b>（毫無節制）</td></tr><tr><td>爭競</td><td>ἔρις</td><td>eris</td><td>G2054</td><td>紛爭</td></tr><tr><td>嫉妒</td><td>ζῆλος</td><td>zēlos</td><td>G2205</td><td><b>10:2「熱心」那個字</b>（負面用法）</td></tr></table>","gram":"<p>★ 亮光一：三對罪的排列</p><pre>【放縱】荒宴 ＋ 醉酒\n【情慾】好色 ＋ 邪蕩\n【關係】爭競 ＋ 嫉妒</pre><p>弟兄姊妹，注意保羅把第三對放在同一份清單裡。</p><p>在教會裡，我們對前面兩對很敏感。<br>但「爭競、嫉妒」——</p><p>保羅把它們放在跟醉酒、淫亂<b>同一行</b>。</p><p>★ 亮光二：ζῆλος 的兩面</p><pre>10:2   「他們向神有【熱心】（ζῆλος），但不是按著真知識」—— 中性偏正面\n13:13  「不可爭競【嫉妒】（ζῆλος）」—— 負面</pre><p>同一個字。</p><p>ζῆλος 是「沸騰」——而沸騰的東西，可以是熱心，也可以是嫉妒。</p><p>差別在於：<b>它燒的方向</b>。</p><p>★ 亮光三：εὐσχημόνως 與12:2的字根呼應</p><pre>12:2   μὴ συσχηματίζεσθε —— 不要被【模成】這世界的樣子（σχῆμα）\n13:13  εὐσχημόνως        —— 行事為人要【得體】（εὖ + σχῆμα）</pre><p>弟兄姊妹，同一個字根 σχῆμα（外面的樣子）。</p><p>12:2說：不要被這世界模成它的<b>樣子</b>。<br>13:13說：要有一個<b>得體的樣子</b>。</p><p>不是「沒有樣子」，是「<b>換一個樣子</b>」。</p>","exp":"<p>弟兄姊妹，13:13列了六樣要脫掉的東西——而它們是<b>三對</b>：</p><pre>κώμοις καὶ μέθαις      —— 荒宴、醉酒     【放縱】\nκοίταις καὶ ἀσελγείαις —— 好色、邪蕩     【情慾】\nἔριδι καὶ ζήλῳ         —— 爭競、嫉妒     【關係】</pre><p><b>經文本身明確表達的：</b> 既然是白晝的人，行事為人就要得體，脫離這三對行為。</p><p><b>可以合理推論的：</b> 前兩對在教會裡人人喊打。</p><p>而第三對——<b>爭競與嫉妒</b>——我們常常把它當成「個性問題」或「他就是比較有想法」。</p><p>而保羅把它們放在跟醉酒、淫亂<b>同一行</b>。<br>（加5:19–21也是如此：「爭競、忌恨、惱怒、結黨」與「姦淫、污穢、醉酒」列在一起。）</p><p>而 ζῆλος（嫉妒）正是10:2「熱心」、12:11「心裡火熱」那個字根：</p><p>同一種<b>沸騰</b>；差別在於——<b>它燒的方向</b>。</p>"},{"a":14,"z":14,"star":true,"grk":"<p>ἀλλ' ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστὸν καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.</p>","lit":"<p>「反倒要<b>穿上</b>主耶穌基督；並且<b>不要為肉體作預備</b>，以致（滿足）私慾。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>披戴</td><td>ἐνδύσασθε</td><td>endysasthe</td><td>G1746</td><td>ἐν + δύω（進入）</td><td><b>穿上（衣服）</b></td><td><b>不定過去命令式</b></td></tr><tr><td>安排</td><td>πρόνοια</td><td>pronoia</td><td>G4307</td><td>πρό + νοέω（想）</td><td><b>預先計畫、事先安排</b></td><td><b>見下——極重要</b></td></tr><tr><td>私慾</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>ἐπί + θυμός</td><td>強烈的渴望</td><td>6:12同字</td></tr></table>","gram":"<p>★ 亮光一：ἐνδύω ——「穿上一個人」</p><p>「披戴主耶穌基督」——ἐνδύσασθε，<b>穿上衣服</b>。</p><p>在古代，「穿上某人的衣服」意味著：</p><p>1. <b>取得那個身分</b>（如羅馬男孩成年時穿上 toga virilis）<br>2. <b>在戲劇中扮演那個角色</b></p><p>而保羅在別處用同一個字：</p><p><b>加3:27「你們受洗歸入基督的，都是</b>披戴<b>基督了。」</b>（不定過去式：已經發生）</p><p><b>羅13:14「總要</b>披戴<b>主耶穌基督。」</b>（命令式：你要去做）</p><p>弟兄姊妹，這是新約一貫的「已然未然」結構：</p><p>你已經穿上了（加3:27）——<br>所以每天早上，把它穿上（羅13:14）。</p><p>★★ 亮光二：πρόνοια ——「不要為肉體<b>預先安排</b>」</p><p>這是本節最實用、也最扎人的一個字。</p><p>πρόνοια ＝ πρό（預先）+ νοέω（想）——</p><p>意思是：<b>事先的計畫、預備、安排</b>。</p><p>（徒24:2用同一個字：腓力斯的「<b>先見</b>」）</p><p>弟兄姊妹，保羅在說什麼？</p><p>他<b>不是</b>說「不要放縱私慾」——</p><p>他說：<b>不要為那件事作預備</b>。</p><p>這是一個極其實際的教導：</p><pre>一般的想法：我要在試探來的那一刻，努力抵擋\n保羅的教導：不要走到那個試探來得到你的地方</pre><p>因為當一個人開始「為肉體安排」的時候——</p><p>他其實已經決定了。</p><p>（例如：不是「看到的時候要忍住」，而是「不要把手機帶進那個房間」。）</p><p>★ 亮光三：13:14的兩半是一組</p><pre>【積極】穿上主耶穌基督\n【消極】不要為肉體預先安排</pre><p>弟兄姊妹，這兩半缺一不可。</p><p>只有消極的（「不要」），會變成一場沒有終點的壓抑。<br>只有積極的（「穿上」），會忽略實際的防線。</p><p>保羅兩個都給。</p>","exp":"<p>弟兄姊妹，13:14是教會歷史上最有名的一節經文之一。</p><p>因為它是<b>奧古斯丁歸主的那一節</b>。</p><p>奧古斯丁在《懺悔錄》第八卷記載：</p><p>他在米蘭的花園中極度掙扎，痛哭。</p><p>然後他聽見鄰家傳來孩童反覆吟唱的聲音：</p><p>「拿起來讀，拿起來讀（Tolle lege, tolle lege）。」</p><p>他起身，拿起保羅書信，隨手翻開，讀到的正是：</p><p>「不可荒宴醉酒，不可好色邪蕩，不可爭競嫉妒。總要披戴主耶穌基督，不要為肉體安排，去放縱私慾。」</p><p>他寫道：讀完之後，「一道確定的光，彷彿注入我心，一切疑慮的陰霾都消散了」。</p><p>弟兄姊妹，這是有第一手文獻的記載。</p><p>而那個掙扎了多年的人，最後改變他的，不是一套論證——</p><p>是一句話：<b>穿上祂</b>。</p>"}],"14":[{"a":1,"z":1,"star":true,"grk":"<p>Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.</p>","lit":"<p>「那在信心上<b>軟弱的</b>，你們要<b>接到自己這裡來</b>；<b>不是為了</b>（陷入）<b>意見的爭辯</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>軟弱</td><td>ἀσθενοῦντα</td><td>asthenounta</td><td>G770</td><td>ἀ + σθένος（力量）</td><td><b>沒有力氣的</b></td><td><b>5:6同字</b></td></tr><tr><td>接納</td><td>προσλαμβάνεσθε</td><td>proslambanesthe</td><td>G4355</td><td>πρός + λαμβάνω</td><td><b>接到自己身邊來</b></td><td><b>中間語態</b>（見下）</td></tr><tr><td>辯論</td><td>διακρίσεις</td><td>diakriseis</td><td>G1253</td><td>διά + κρίνω</td><td><b>爭辯、評斷</b></td><td>—</td></tr><tr><td>疑惑的事</td><td>διαλογισμῶν</td><td>dialogismōn</td><td>G1261</td><td>διά + λογίζομαι</td><td><b>內心的思量、意見</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：προσλαμβάνω 的畫面</p><p>這個字由 πρός（向著）+ λαμβάνω（拿、接）組成，而且是<b>中間語態</b>——</p><p>意思是：<b>把某人接到自己這裡來、收進自己的圈子裡</b>。</p><p>新約的其他用法：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>徒28:2</b></td><td>島上的土人「<b>接待</b>我們」（生火款待保羅一行）</td></tr><tr><td><b>門1:17</b></td><td>保羅為阿尼西母說：「就<b>收納</b>他，如同收納我一樣」</td></tr><tr><td><b>羅15:7</b></td><td><b>「你們要</b>彼此接納<b>，如同</b>基督接納你們一樣<b>」</b></td></tr></table><p>弟兄姊妹，「接納」不是「容忍他存在」。</p><p>是<b>把他接到自己這裡來</b>。</p><p>★ 亮光二：「軟弱」是指什麼？</p><p>ἀσθενέω 在此<b>不是</b>指道德軟弱或屬靈不成熟。</p><p>從14:2的例子看，它指的是：</p><p>在<b>自由的良心</b>上，還不能放開的人。</p><p>（他覺得某些事不可以做，而其實那件事並不是罪。）</p><p>弟兄姊妹，這一點很重要：</p><p>保羅稱他「軟弱」，卻<b>完全沒有要他改變</b>。</p><p>他要改變的，是<b>強的人的態度</b>。</p><p>★ 亮光三：「不要辯論所疑惑的事」</p><p>原文的意思接近：</p><p>接納他——<b>但不是為了把他拉進一場意見的辯論</b>。</p><p>弟兄姊妹，這是很實際的提醒：</p><p>有一種「接納」，是先歡迎你進來，然後開始糾正你。</p><p>保羅說：不是那樣。</p>","exp":"<p>弟兄姊妹，14:1是這一整段（14:1–15:13）的<b>開場命令</b>。</p><p>而它有兩半，第二半常被跳過：</p><pre>① 你們要接納（προσλαμβάνεσθε）—— 把他接到自己這裡來\n② 但不要為了辯論他所疑惑的事</pre><p><b>經文本身明確表達的：</b> 要接納信心軟弱的人，但接納的目的不是把他拉進意見的爭辯。</p><p><b>可以合理推論的：</b> 「接納」不是「容忍他存在」——<br>προσλαμβάνω 是<b>中間語態</b>，字面是「<b>把某人接到自己這裡來</b>」。<br>（門1:17保羅為逃跑的奴僕阿尼西母用同一個字：「就<b>收納他，如同收納我一樣</b>。」）</p><p>而「軟弱」（ἀσθενέω）在此<b>不是</b>指道德軟弱或屬靈不成熟——</p><p>從14:2的例子看，它指的是：<b>在自由的良心上，還不能放開的人</b>。</p><p><b>⚠ 牧養提醒：</b> 絕不可用「軟弱」去貼標籤（「你就是14章那個軟弱的」）。<br>那正好是14:3所禁止的「輕看」。<br>而值得注意的是：保羅稱他「軟弱」，卻<b>完全沒有要他改變</b>——他要改變的是<b>強的人的態度</b>。</p>"},{"a":2,"z":3,"star":true,"grk":"<p>3 ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ὁ δὲ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.</p>","lit":"<p>2「有人<b>相信可以吃一切的東西</b>；但<b>那軟弱的，只吃蔬菜</b>。」<br>3「那吃的，<b>不可把不吃的當作零</b>；那不吃的，<b>不可論斷那吃的</b>——<b>因為神已經接納他了</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>輕看</td><td>ἐξουθενείτω</td><td>exoutheneitō</td><td>G1848</td><td>ἐξ + οὐθέν（<b>零、無</b>）</td><td><b>當作零、視為無物</b></td><td>見下</td></tr><tr><td>論斷</td><td>κρινέτω</td><td>krinetō</td><td>G2919</td><td>κρίνω</td><td><b>判定、定罪</b></td><td><b>2:1同字</b></td></tr><tr><td>收納</td><td>προσελάβετο</td><td>proselabeto</td><td>G4355</td><td>—</td><td><b>接納</b>（14:1同字）</td><td><b>主詞是神</b></td></tr></table>","gram":"<p>★ 亮光一：ἐξουθενέω ——「把人當成零」</p><p>這個字的字根是 <b>οὐθέν（＝ οὐδέν，「無、零」）</b>。</p><p>字面意思是：<b>把某人當作「什麼都不是」</b>。</p><p>（路23:11希律「藐視」耶穌；林前1:28「被人<b>厭惡</b>的」——同字）</p><p>弟兄姊妹，這個字的畫面很傳神：</p><p>輕看，不是恨他。</p><p>是——<b>把他歸零</b>。</p><p>在你心裡的名單上，他的分量是零。</p><p>★ 亮光二：兩種罪的精準區分</p><pre>【強的人】ἐξουθενέω（輕看）—— 把人當成零\n【弱的人】κρίνω（論斷）    —— 坐上審判席</pre><p>弟兄姊妹，保羅的觀察極其準確：</p><p>強的人<b>不會</b>說你有罪，他只是覺得你「還不懂」。<br>弱的人<b>不會</b>看不起你，他會覺得你「墮落了」。</p><p>而兩邊——<b>都被保羅點名了</b>。</p><p>★ 亮光三：14:3的理由</p><p>「<b>因為神已經收納他了</b>。」</p><p>弟兄姊妹，這是全章第一個、也是最根本的理由：</p><p>神已經收了。</p><p>那你憑什麼不收？</p>","exp":"<p>弟兄姊妹，3節指出兩邊各有各的罪——而且<b>方向相反</b>。</p><table><tr><th></th><th>原文</th><th>那是什麼</th></tr><tr><td><b>強的人</b></td><td><b>ἐξουθενέω（輕看）</b></td><td>字根是 οὐθέν ＝ <b>零</b>：把人當作什麼都不是</td></tr><tr><td><b>弱的人</b></td><td><b>κρίνω（論斷）</b></td><td>法庭的字：<b>定他的罪</b></td></tr></table><p><b>經文本身明確表達的：</b> 吃的不可輕看不吃的，不吃的不可論斷吃的；因為神已經接納他了。</p><p><b>可以合理推論的：</b> 保羅的觀察極其精準——</p><p>強的人<b>不會</b>說你有罪，他只是覺得你「還不懂」——他把你<b>歸零</b>。<br>弱的人<b>不會</b>看不起你，他會覺得你「墮落了」—
