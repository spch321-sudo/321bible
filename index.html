"我想：「那我自己呢？」"],["p","死不能。生不能。天使不能。"],["p","可是我呢？"],["p","如果哪一天，我自己搞砸了，我自己走開了——"],["p","我會不會把自己弄丟？"],["w",3],["p","弟兄姊妹，答案就在那份清單的最後一項。"],["p","保羅寫的是："],["q","「或是別的受造之物。」"],["p","我問一個問題："],["p","我是不是受造之物？"],["p","是。"],["p","所以——"],["q","我也在那份清單裡。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["p","第一，一位新住客。"],["p","第七章：罪住在我裡面。"],["p","第八章：聖靈住在我裡面。"],["p","同一個字。不同的住客。"],["p","所以你不必再靠自己了。"],["w",3],["p","第二，三聲嘆息。"],["p","受造之物在歎息。你在歎息。神也在歎息。"],["p","而那不是臨終的呻吟，是產房裡的呻吟。"],["p","它有終點。它會生出東西來。"],["w",3],["p","第三，一把沒有停下來的刀。"],["p","摩利亞山上，那把刀停住了。"],["p","各各他，那把刀沒有停。"],["p","所以——"],["q","「神既不愛惜自己的兒子，為我們眾人捨了，\n\n豈不也把萬物和他一同白白地賜給我們嗎？」"],["w",3],["p","弟兄姊妹，第八章是以「不定罪」開始的。"],["p","是以「不隔絕」結束的。"],["p","而中間，住著聖靈。"],["w",3],["p","我最後要唸一次那最後一句話。"],["p","請大家注意最後幾個字："],["q","「都不能叫我們與神的愛隔絕；\n\n這愛是在我們主基督耶穌裡的。」"],["p","弟兄姊妹，保羅寫完了全本聖經最壯闊的一段之後——"],["p","最後落在哪裡？"],["p","落在一個詞上："],["q","「我們的主。」"],["p","不是「那位主」。"],["p","是——我們的主。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的阿爸父，\n\n我們今天要用這個稱呼來禱告。因為祢的兒子在客西馬尼那一夜這樣叫祢，而祢讓我們也可以這樣叫。\n\n阿爸，謝謝祢——一點定罪也沒有。那份判決書，已經落在祢兒子的身上了。\n\n謝謝祢，住在我們裡面的那一位，換了。我們不用再靠自己了。\n\n主啊，我們當中有人正在歎息。求祢讓他知道：歎息不是不屬靈，那是還沒到家的證據。而祢自己，也在那個歎息裡面。\n\n我們當中有人不會禱告。求祢讓他知道：有一位在他裡面，用他發不出來的聲音替他說話。\n\n阿爸，最後——謝謝祢那把沒有停下來的刀。\n\n在摩利亞山上，祢說：「不可下手。」\n在各各他，祢沒有這樣說。\n\n因為祢愛我們。\n\n求祢讓我們今天走出去的時候，心裡帶著那份清單的最後一項——\n連我們自己，都不能叫我們與祢的愛隔絕。\n\n奉我們主基督耶穌的名禱告，阿們。"],["w",3]]},"9":{"min":35,"blocks":[["h","神的話落空了嗎？"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","上個禮拜，我們一起讀完了羅馬書第八章。"],["p","我們停在那句全本聖經最壯闊的話上："],["q","「因為我深信，無論是死，是生……都不能叫我們與神的愛隔絕。」"],["p","弟兄姊妹，那是一個高峰。"],["p","而今天，我們要讀下一句。"],["w",3],["p","羅馬書9章1到3節："],["q","「我在基督裡說真話，並不謊言……我是大有憂愁，心裡時常傷痛；為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意。」"],["p","弟兄姊妹，你們聽出來了嗎？"],["p","一個人剛剛才說完：「沒有什麼能叫我與神的愛隔絕。」"],["p","下一句就說：「為了我的同胞，我願意自己被隔絕。」"],["w",3],["p","這不是矛盾。"],["p","這是——愛的爆發。"],["q","一個人真的知道自己被抓得多牢的時候，\n\n他會開始為那些還在外面的人心碎。"],["w",3],["p","不過弟兄姊妹，我要先說明一件事。"],["p","羅馬書第九章，是全卷書最容易吵架的一章。"],["p","因為它講「揀選」，講「窯匠與泥土」，講「神要憐憫誰就憐憫誰」。"],["p","而歷代敬虔的基督徒，在這一章的一些細節上，確實有不同的看法。"],["p","所以我今天要做兩件事："],["p","第一，我會誠實地告訴大家哪些地方有不同看法。"],["p","第二——也是更重要的——我要按照保羅自己提出的問題來講這一章。"],["p","而保羅自己的問題，在第6節："],["q","「這不是說神的話落了空。」"],["p","弟兄姊妹，這就是第九章的問題："],["h","神的話，會不會有一天不算數？"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一顆碎了的心。\n第二，一位有主權的窯匠。\n第三，一塊絆腳的石頭。"],["w",3],["h","第一大段｜一顆碎了的心（9:1–5）"],["h","他先哭了"],["p","弟兄姊妹，我要請大家注意一件事。"],["p","保羅要講神的主權了。他要講揀選、講窯匠、講「我要憐憫誰就憐憫誰」。"],["p","而他的第一句話是什麼？"],["p","不是「讓我來解釋預定論」。"],["p","是——"],["p","眼淚。"],["w",3],["p","第2節：「我是大有憂愁，心裡時常傷痛。」"],["p","「時常傷痛」這四個字，希臘文是兩個字：不止息的、劇痛。"],["p","弟兄姊妹，那個「劇痛」不是「有點難過」。那是一個很重的字。"],["p","而第3節更重："],["q","「為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意。」"],["p","「被咒詛」，希臘文是 ἀνάθεμα。"],["p","這個字在舊約的希臘文譯本裡，翻譯的是「當滅之物」——就是約書亞記裡，那個被分別出來、交給神毀滅的東西。"],["p","保羅在說：如果可以，我願意成為那個。"],["w",3],["p","不過弟兄姊妹，這裡有一個文法上的細節，我覺得很重要。"],["p","「我也願意」——這個動詞在原文是未完成式。"],["p","在希臘文裡，這種用法通常表示一個「知道不可能實現的願望」。"],["p","所以保羅的意思是："],["q","「我曾這樣希望過——\n\n可是我知道，這是不可能的。」"],["p","弟兄姊妹，這是一個心碎到極處的人，說出來的話。"],["h","這句話有一個先例"],["p","而且這句話，不是保羅第一次有人說。"],["p","出埃及記32章。金牛犢事件之後。"],["p","摩西對神說："],["q","「倘或你肯赦免他們的罪……不然，求你從你所寫的冊上塗抹我的名。」"],["p","弟兄姊妹，兩個最偉大的僕人，都說了同一句話。"],["p","摩西願意。做不到。"],["p","保羅願意。也做不到。"],["p","只有一位——"],["p","真的做到了。"],["q","「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛。」（加3:13）"],["h","八項特權"],["p","然後第4、5節，保羅開始數。"],["p","他一項一項地數，他的同胞有什麼："],["q","「他們是以色列人；那兒子的名分、榮耀、諸約、律法、禮儀、應許都是他們的。列祖就是他們的祖宗；按肉體說，基督也是從他們出來的。」"],["p","弟兄姊妹，八項。"],["p","而我要請大家注意其中一項——「兒子的名分」。"],["p","這個詞，我們上個禮拜才學過。"],["p","羅馬書8章15節：「你們所受的……乃是兒子的心。」——同一個字。"],["p","那個羅馬法律上不可撤銷的收養。"],["w",3],["p","弟兄姊妹，你感覺到保羅的痛了嗎？"],["q","那份「兒子的名分」——是他們的。\n\n而他們大部分人，站在門外。"],["p","而且保羅一項都沒有否認。"],["p","他沒有說「你們那些特權其實不算什麼」。"],["p","他說：全部是真的。"],["p","只是——"],["p","那些救不了你。"],["w",3],["h","第二大段｜一位有主權的窯匠（9:6–29）"],["h","那個問題"],["p","好，現在我們來到全章的鑰匙。第6節："],["q","「這不是說神的話落了空。」"],["p","「落了空」這個字，希臘文是 ἐκπίπτω。"],["p","它的字面意思是：掉下來、掉出去。"],["p","它用在哪裡？"],["p","用在花凋謝掉落（雅各書1章）。"],["p","用在船觸礁失去方向（使徒行傳27章）。"],["p","保羅說：神的話——"],["p","沒有掉下來。"],["p","沒有凋謝。沒有觸礁。"],["w",3],["p","但弟兄姊妹，這個問題為什麼重要？"],["p","我請大家想一想。"],["p","如果神對以色列說過的話，最後可以不算數——"],["p","那上個禮拜第八章那句「都不能叫我們與神的愛隔絕」，"],["p","憑什麼算數？"],["q","弟兄姊妹，第九章不是一篇關於預定論的獨立論文。\n\n第九章是保羅在為神的信實辯護。"],["h","兩個例子，一個比一個緊"],["p","那保羅怎麼證明神的話沒有落空？"],["p","他說：「因為從以色列生的不都是以色列人。」（9:6）"],["p","意思是：神的應許，從一開始就不是給「所有血統上的以色列人」的。"],["p","然後他舉了兩個例子。"],["w",3],["p","第一個例子：亞伯拉罕有兩個兒子。"],["p","以實瑪利和以撒。"],["p","兩個都是亞伯拉罕的兒子。血統上都合格。"],["p","但神說：「從以撒生的才要稱為你的後裔。」"],["w",3],["p","弟兄姊妹，但這個例子有一個漏洞。有人可以說："],["q","「那是因為母親不同啊——一個是使女生的，一個是正室生的。」"],["p","所以保羅加了第二個例子。而這個例子，把那個漏洞堵死了。"],["p","第10節：「還有利百加，既從一個人，就是從我們的祖宗以撒懷了孕。」"],["p","雅各和以掃。"],["p","同一個父親。同一個母親。"],["p","而且——同一次懷孕。雙胞胎。"],["p","然後第11節說："],["q","「雙子還沒有生下來，善惡還沒有做出來……」"],["p","弟兄姊妹，神說話的時候，這兩個孩子還在腹中。"],["p","所以揀選的根據——"],["p","不可能是他們的行為。"],["p","保羅的結論是："],["q","「不在乎人的行為，乃在乎召人的主。」（9:11）"],["h","關於「以掃是我所惡的」"],["p","弟兄姊妹，第13節有一句話，我必須好好處理，因為它很容易被誤解，也很容易傷害人。"],["q","「雅各是我所愛的；以掃是我所惡的。」"],["p","我要說三件事。"],["w",3],["p","第一，這句話引自瑪拉基書——而瑪拉基書寫在以掃死後一千多年。"],["p","而瑪拉基書那一段講的是什麼？"],["p","它講的是以東這個民族：「我使他的山嶺荒涼……以東人說……」"],["q","那不是在講一個嬰兒的永恆歸宿，是在講兩個民族。"],["w",3],["p","第二，創世記25章23節原文就說：「兩國在你腹內；兩族要從你身上出來。」"],["w",3],["p","第三——這一點最重要——"],["p","在希伯來人的說話方式裡，「愛A、恨B」常常是一種比較式的表達。"],["p","弟兄姊妹，最清楚的例子是主耶穌自己說的話。"],["p","路加福音14章26節："],["q","「人到我這裡來，若不愛我勝過愛自己的父母、妻子、兒女……就不能作我的門徒。」"],["p","弟兄姊妹，「愛我勝過愛」——原文其實是「恨」。"],["p","主耶穌顯然不是叫我們真的憎恨父母。那會違背第五誡。"],["p","那是一種比較式的說法。"],["w",3],["p","所以第13節的重點是什麼？"],["q","是「神揀選了雅各，沒有揀選以掃」。\n\n不是「神在以掃出生之前，就在情感上憎恨他」。"],["h","一句在金牛犢之後說的話"],["p","接下來保羅問了一個很尖銳的問題。第14節："],["q","「難道神有什麼不公平嗎？」"],["p","保羅的回答是：「斷乎沒有！」"],["p","然後他引了一句話："],["q","「我要憐憫誰就憐憫誰，要恩待誰就恩待誰。」（9:15）"],["p","弟兄姊妹，這句話是神在什麼時候說的？"],["p","你們知道嗎？"],["p","出埃及記33章。"],["p","而出埃及記33章的前一章，發生了什麼事？"],["p","金牛犢。"],["w",3],["p","弟兄姊妹，這一點很重要。"],["p","這句話的原始處境，不是「神隨意決定誰下地獄」。"],["p","這句話的原始處境是："],["q","一個剛剛拜了金牛犢的民族，\n\n竟然還能繼續存在。\n\n為什麼？\n\n因為——憐憫。"],["h","想，不算。跑，也不算。"],["p","然後第16節，保羅下了一個結論。弟兄姊妹，這一節我希望大家記住："],["q","「這不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神。」"],["p","「定意的」——原文的意思是「想要、意志的決定」。"],["p","「奔跑的」——原文是賽跑。"],["p","弟兄姊妹，保羅把人所能做的兩件事，全部列出來了："],["p","想。"],["p","跑。"],["p","然後他說："],["p","都不算。"],["w",3],["p","弟兄姊妹，我要在這裡誠實地說一件事。"],["p","很多人讀到這裡會不舒服。我自己第一次讀的時候也不舒服。"],["p","因為我們心裡都有一份資格清單。"],["p","我們會想："],["q","「我信主，多少有一點是因為我比較願意吧？\n\n我比較開放，比較誠實，比較願意謙卑下來。」"],["p","而第16節說："],["p","不在乎那定意的。"],["p","也不在乎那奔跑的。"],["w",3],["p","弟兄姊妹，我想這樣說："],["q","如果神欠你，那叫公平。\n\n如果神不欠你，那叫——憐憫。\n\n而羅馬書前面八章已經證明了：神不欠任何人。"],["h","窯匠與泥土"],["p","接下來是全章最有名、也最容易被誤用的一段。"],["p","第20、21節："],["q","「你這個人哪，你是誰，竟敢向神強嘴呢？……窯匠難道沒有權柄從一團泥裡拿一塊做成貴重的器皿，又拿一塊做成卑賤的器皿嗎？」"],["p","「強嘴」這個字，希臘文的意思是——頂回去、對著幹。"],["p","弟兄姊妹，我要在這裡分辨一件很重要的事。"],["p","保羅不是在說「你不可以問問題」。"],["p","你怎麼知道？"],["p","因為保羅自己在第14節和第19節，就在問問題！"],["p","他禁止的是什麼？"],["q","是把神拉到被告席，要祂向我交代。"],["p","弟兄姊妹，差別在於——"],["p","你是跪在祂面前問，還是站在祂對面問。"],["h","一個中文看不出來的細節"],["p","接下來我要講一個原文的細節。這個細節，我認為是解釋整章最重要的線索之一。"],["p","第22節和第23節，保羅講到兩種器皿。"],["p","中文是這樣的："],["q","22節：「那可怒預備遭毀滅的器皿」\n\n23節：「那蒙憐憫、早預備得榮耀的器皿」"],["p","看起來很對稱，對不對？"],["p","但在原文裡，這兩句的語法完全不一樣。"],["w",3],["p","第23節講得榮耀的時候，保羅用的是主動語態，而且主詞明明白白就是神："],["q","「祂預先預備得榮耀的。」"],["p","而第22節講遭毀滅的時候，保羅用的是被動式——"],["q","「已被預備好走向毀滅的。」"],["p","而且——"],["q","經文沒有說是誰預備的。"],["w",3],["p","弟兄姊妹，保羅在這裡的用字，精準到令人震動。"],["q","講到榮耀，他明說：神預先預備的。\n\n講到毀滅，他用被動式，沒有指明是誰。"],["p","這個不對稱，是刻意的。"],["p","（我要誠實地說：關於這一段，歷代敬虔的解經家有不同的理解。但這個語法上的不對稱，是大家都看得見的事實。）"],["h","還有一個字"],["p","而第22節還有一個字，我覺得非常重要。"],["q","「就多多忍耐寬容那可怒……的器皿。」"],["p","「忍耐」這個字，希臘文是 μακροθυμία。"],["p","弟兄姊妹，這個字我們在羅馬書第二章學過。"],["p","它的意思是「怒氣的引線很長」。"],["p","而第二章第4節說什麼？"],["q","「還是你藐視他豐富的恩慈、寬容、忍耐，\n\n不曉得他的恩慈是領你悔改呢？」"],["p","同一個字。"],["w",3],["p","弟兄姊妹，所以第22節的畫面不是「神迫不及待要毀滅他們」。"],["p","第22節的畫面是："],["q","神擔待了他們很久很久。"],["h","那個蒙憐憫的器皿是誰？"],["p","然後第24節，保羅說出了他講這一切的目的："],["q","「這器皿就是我們被神所召的，不但是從猶太人中，也是從外邦人中。」"],["p","弟兄姊妹，講了半天的窯匠與泥土，保羅要說什麼？"],["p","他要說："],["q","那個蒙憐憫的器皿——就是你們。"],["p","而且他接著引了何西阿書："],["q","「那本來不是我子民的，我要稱為『我的子民』。」（9:25）"],["p","弟兄姊妹，如果你今天是外邦人的後裔——"],["p","你能坐在這裡讀聖經，"],["p","你本身就是這節經文的應驗。"],["w",3],["p","所以第九章講揀選的目的，不是讓我們去猜誰在裡面、誰在外面。"],["p","是讓我們問一個問題："],["h","我怎麼會在這裡？"],["w",3],["h","第三大段｜一塊絆腳的石頭（9:30–33）"],["h","保羅自己的結論"],["p","弟兄姊妹，現在我要講今天最重要的一段。"],["p","而這一段，是很多人讀第九章的時候，跳過去的。"],["p","因為他們讀到窯匠就停了。"],["p","但保羅自己在第30到33節，給了整章一個結論。"],["p","而那個結論，可能跟你想的不一樣。"],["w",3],["p","第30、31節："],["q","「那本來不追求義的外邦人，反得了義……\n\n但以色列人追求律法的義，反得不著律法的義。」"],["p","弟兄姊妹，你看見這個對照了嗎？"],["p","外邦人：根本沒在追——結果得了。"],["p","以色列：竭力在追——結果沒得著。"],["w",3],["p","然後第32節，保羅問：「這是什麼緣故呢？」"],["p","弟兄姊妹，請注意保羅怎麼回答。"],["p","他沒有說：「因為神沒有揀選他們。」"],["p","他說的是："],["q","「是因為他們不憑著信心求，只憑著行為求。」"],["w",3],["p","弟兄姊妹，我覺得這一節，是第九章最重要的一節。"],["p","保羅講了三十節的神主權——"],["p","然後他把整章，收在人憑什麼求上。"],["h","一塊石頭"],["p","而第32節後半說："],["q","「他們正跌在那絆腳石上。」"],["p","「跌」這個字，原文的意思是——撞上、踢到。"],["p","弟兄姊妹，這個畫面很殘酷："],["q","一群人，用盡全力在跑。\n\n方向是對的——他們追求的是「義」。\n\n然後——\n\n他們撞上了一塊石頭。"],["w",3],["p","而第33節說，那塊石頭是神放的："],["q","「我在錫安放一塊絆腳的石頭，跌人的磐石；\n\n信靠他的人必不至於羞愧。」"],["p","弟兄姊妹，這一節是保羅把兩段以賽亞書合在一起引用的。"],["p","以賽亞書28章16節說：神在錫安放一塊石頭，作為房角石。"],["p","以賽亞書8章14節說：那石頭要作絆腳的石頭。"],["p","保羅把它們合起來了。"],["w",3],["p","弟兄姊妹，你聽出來了嗎？"],["q","是同一塊石頭。\n\n對信靠的人——它是房角石。\n\n對憑行為求的人——它是絆腳石。"],["h","那塊石頭是誰？"],["p","第九章沒有說那塊石頭是誰。"],["p","但下一章第4節說了："],["q","「律法的總結就是基督，使凡信他的都得著義。」"],["p","弟兄姊妹，第九章講了那麼多奧祕——揀選、窯匠、憐憫、剛硬——"],["p","最後，保羅把它全部收在一個位格上。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["p","第一，一顆碎了的心。"],["p","保羅講神的主權之前，先哭了。"],["p","而在他之前，主自己先為耶路撒冷哭過。"],["p","弟兄姊妹，如果我們讀完第九章，得到的是一套贏辯論的武器——"],["p","那我們讀錯了。"],["p","因為保羅讀第九章的時候，是流著眼淚的。"],["w",3],["p","第二，一位有主權的窯匠。"],["p","「不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神。」"],["p","弟兄姊妹，我想這是今天最需要我們安靜下來的一句話。"],["p","因為它拿走了我心裡最後一份資格清單。"],["p","我不是因為比較願意才在這裡。"],["p","我不是因為比較努力才在這裡。"],["p","我在這裡，純粹是憐憫。"],["w",3],["p","第三，一塊石頭。"],["p","同一塊石頭。"],["p","信靠的人得房角石。"],["p","憑行為求的人，撞上絆腳石。"],["w",3],["p","弟兄姊妹，我最後要問兩個問題。"],["p","第一個問題，是問你自己的："],["q","你最近在追求的那件屬靈的事——\n\n是「憑信心求」，還是「憑行為求」？"],["p","我教大家一個檢驗的方法。"],["p","當你在那件事上失敗的時候，你第一個反應是什麼？"],["p","如果是「我要更努力」——"],["p","那可能是憑行為求。"],["p","如果是「主啊，救我」——"],["p","那是憑信心求。"],["w",3],["p","第二個問題，是問你身邊的人的。"],["p","保羅為他的同胞「大有憂愁，心裡時常傷痛」。"],["p","弟兄姊妹，你心裡有沒有一個名字？"],["p","一個還在外面的人？"],["p","可能是你的父母。你的孩子。你的配偶。你那個從來不肯來教會的兄弟。"],["w",3],["p","如果有——"],["p","我要用第22節那個字，對你說："],["q","神對他，是「多多忍耐」。\n\n而那個「忍耐」，在羅馬書第二章的意思是——\n\n祂的恩慈，正在領他悔改。"],["p","弟兄姊妹，你等他等了很久。"],["p","但神——"],["p","等得比你更久。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，先為一件事求赦免。我們常常把第九章當成一場辯論，卻忘記保羅寫這一章的時候，是流著眼淚的。\n\n主啊，求祢給我們保羅的那顆心——為那些還在外面的人，有不止息的心痛。\n\n我們也承認，我們心裡有一份資格清單。我們一直以為，我們能信主多少有一點是因為我們比較願意、比較開放、比較努力。\n\n今天祢的話說：不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神。\n\n主啊，我們沒有一點功勞。我們在這裡，純粹是憐憫。\n\n求祢也讓我們知道：祢對我們心裡想著的那個人，是多多忍耐的。祢的恩慈，正在領他悔改。祢等得比我們更久。\n\n最後，主啊——祢是那塊石頭。求祢讓我們不再憑行為求，只憑信心求。\n\n因為經上說：信靠祢的人，必不至於羞愧。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"10":{"min":35,"blocks":[["h","那話離你不遠"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","上個禮拜我們讀了羅馬書第九章。"],["p","那一章講神的主權——講揀選，講窯匠與泥土，講「不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神」。"],["p","而我上個禮拜說過：如果只讀第九章，是會出問題的。"],["w",3],["p","弟兄姊妹，今天我要請大家看一件事。"],["p","第九章結束之後，同一位保羅，第十章第一節寫了什麼？"],["q","「弟兄們，我心裡所願的，向神所求的，是要以色列人得救。」"],["p","他禱告。"],["w",3],["p","弟兄姊妹，你們注意到了嗎？"],["p","一個剛剛講完「神要憐憫誰就憐憫誰」的人——"],["p","下一句就開始為人的得救禱告。"],["p","而再過十幾節，他要說："],["q","「沒有傳道的，怎能聽見呢？」（10:14）"],["p","弟兄姊妹，保羅顯然不覺得這兩件事互相矛盾。"],["p","對他來說，神的主權不是停止禱告的理由。"],["p","神的主權，是開始禱告的理由。"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一場很累的工程。\n第二，一句很近的話。\n第三，一雙很髒的腳。"],["w",3],["h","第一大段｜一場很累的工程（10:1–4）"],["h","他們是真的熱心"],["p","第2節，保羅為他的同胞說了一句話："],["q","「我可以證明他們向神有熱心。」"],["p","弟兄姊妹，「證明」這個字，原文的意思是「作見證」。"],["p","保羅在說：我替他們作證——他們的熱心，是真的。"],["w",3],["p","而「熱心」這個字，希臘文是 ζῆλος。"],["p","它的字根是「沸騰」。"],["p","弟兄姊妹，保羅有資格說這句話。"],["p","因為他自己就是那個最火熱的人。"],["p","腓立比書3章6節，他說："],["q","「就熱心說，我是逼迫教會的。」"],["p","弟兄姊妹，你聽見了嗎？"],["q","他一生中最火熱的那一天——\n\n是他拿著大祭司的文書，往大馬色去的那一天。\n\n而他那天，正在逼迫神的兒子。"],["h","但方向錯了"],["p","第2節後半："],["q","「但不是按著真知識。」"],["p","「真知識」這個字，希臘文是 ἐπίγνωσις。"],["p","保羅沒有說他們「沒有知識」。他們知識多得很。"],["p","這個字是加強版的：完全的、切身的認識。"],["w",3],["p","然後第3節，保羅講出了原因。弟兄姊妹，我覺得這是全本聖經對「宗教人」最精準的一句診斷："],["q","「因為不知道神的義，想要立自己的義，就不服神的義了。」"],["p","我要把這一節拆開來講。"],["h","一個很累的動作"],["p","「想要立自己的義」——「立」這個字，希臘文是 ἵστημι。"],["p","它的意思是：把一樣東西扶起來、立穩。"],["p","弟兄姊妹，你們想像一下這個畫面："],["q","一個人蹲在地上。\n\n他手上有一樣東西，一直立不穩。\n\n他扶。它倒。他再扶。它又倒。\n\n他就這樣蹲在那裡，扶了一輩子。"],["w",3],["p","弟兄姊妹，我做牧師這些年，看過很多這樣的人。"],["p","而最累的地方在哪裡？"],["p","在於——"],["q","他以為那就是敬虔。"],["h","沒有空排到神的旗下"],["p","而第3節最後說：「就不服神的義了。」"],["p","「不服」這個字，希臘文是 ὑποτάσσω。"],["p","它是一個軍事用語：ὑπό（在下面）＋ τάσσω（列隊）。"],["p","意思是：排到某人的旗下、進入某人的隊列。"],["p","所以保羅的意思是："],["q","他們沒有讓自己排到神的義底下。\n\n他們——另外開了一支隊伍。"],["w",3],["p","弟兄姊妹，我想這一段最誠實的地方在這裡："],["q","保羅沒有說：「他們公開反抗神。」\n\n他說的是：他們忙著立自己的，所以——\n\n沒有空排到祂底下。"],["p","弟兄姊妹，這說中了很多人。"],["p","我們不是不信神。"],["p","我們只是——太忙了。忙著扶那個一直倒的東西。"],["h","那塊石頭有名字"],["p","然後第4節，保羅講了一句話。而這句話，回答了上個禮拜留下的問題。"],["p","還記得第九章最後那塊石頭嗎？"],["q","「我在錫安放一塊絆腳的石頭。」（9:33）"],["p","那塊石頭是誰？"],["p","第10章第4節說："],["q","「律法的總結就是基督，使凡信他的都得著義。」"],["w",3],["p","弟兄姊妹，「總結」這個字，希臘文是 τέλος。"],["p","我要誠實地說：這個字有不同的翻譯可能，歷代學者也有不同的看法。"],["p","因為 τέλος 同時可以有兩個意思："],["p","它可以是「終點」。"],["p","也可以是「目標」。"],["w",3],["p","弟兄姊妹，我想用一個畫面來說明。"],["p","你們有沒有跑過操場？"],["p","跑道上有一條終點線。"],["p","那條線，同時是兩件事："],["q","它是跑道的盡頭。\n\n它也是整場賽跑的目的。"],["p","弟兄姊妹，基督之於律法，正是如此。"],["q","在「靠行律法得義」這條路上——祂是終點。那條路到祂為止。\n\n而在「律法一直指向什麼」這件事上——祂是目標。"],["w",3],["p","所以弟兄姊妹，你一直在扶的那個東西——"],["p","祂已經替你立好了。"],["w",3],["h","第二大段｜一句很近的話（10:5–13）"],["h","誰要上天？誰要下陰間？"],["p","接下來保羅引了一段舊約。而這一段，我覺得是全章最美的。"],["p","第6、7節："],["q","「你不要心裡說：誰要升到天上去呢？（就是要領下基督來；）\n\n誰要下到陰間去呢？（就是要領基督從死裡上來。）」"],["p","弟兄姊妹，這兩句話出自申命記30章。"],["p","摩西當時在說什麼？"],["p","他說：神的話不是在天上，不必有人替你上去取下來；"],["p","也不是在海外，不必有人替你過海拿回來。"],["w",3],["p","而保羅在這兩句話後面，各加了一個註解。"],["p","「誰要升到天上去呢？」——保羅說：就是要領基督下來。"],["p","「誰要下到陰間去呢？」——保羅說：就是要領基督從死裡上來。"],["w",3],["p","弟兄姊妹，你聽出保羅在說什麼了嗎？"],["p","他在說："],["q","這兩件事——\n\n都做完了。"],["p","要有人上天把祂領下來嗎？"],["p","不用。道成了肉身。祂已經下來了。"],["p","要有人下陰間把祂領上來嗎？"],["p","不用。祂已經從死裡復活了。"],["w",3],["h","那話在哪裡？"],["p","所以第8節說："],["q","「他到底怎麼說呢？他說：這道離你不遠，正在你口裡，在你心裡——就是我們所傳信主的道。」"],["p","弟兄姊妹，我請大家聽這句話："],["h","「這道離你不遠。」"],["w",3],["p","你知道人的宗教本能是什麼嗎？"],["p","總覺得要做什麼大事才能親近神。"],["p","要爬階梯。要走苦路。要上天。要下陰間。"],["p","而如果做不到——就以為神很遠。"],["p","而保羅說："],["q","那話——\n\n已經在你嘴邊了。"],["h","一句在羅馬城裡有代價的話"],["p","第9節："],["q","「你若口裡認耶穌為主，心裡信神叫他從死裡復活，就必得救。」"],["p","弟兄姊妹，我要講一件歷史背景，這樣你們會知道這句話有多重。"],["p","在第一世紀的羅馬帝國，通行的效忠口號是四個字："],["q","「凱撒是主。」"],["p","（希臘文 Κύριος Καῖσαρ。）"],["p","後來在逼迫中，官員要求基督徒說的，就是這句話。"],["w",3],["p","所以弟兄姊妹，在羅馬城裡說「耶穌是主」——"],["p","那不是一句溫和的宗教宣告。"],["p","那句話的意思是："],["q","還有另一位主。\n\n而祂——比凱撒大。"],["h","一個保羅加上去的字"],["p","接下來第11節，保羅引了以賽亞書28章16節："],["q","「凡信他的人必不至於羞愧。」"],["p","弟兄姊妹，我要跟你們說一件很小、卻很美的事。"],["p","以賽亞書28章16節的希臘文譯本，原文是："],["q","「信靠的人必不著急。」"],["p","而保羅引用的時候——"],["p","他加了一個字。"],["p","那個字是——"],["h","「凡」。"],["w",3],["p","而且他不只加了一次。"],["p","第12節：「他也厚待一切求告他的人。」"],["p","第13節：「凡求告主名的，就必得救。」"],["p","弟兄姊妹，三節之內，保羅敲了三次。"],["p","凡。一切。凡。"],["h","那位「主」是誰"],["p","而第13節，是全章最深的一句話。表面上很簡單："],["q","「凡求告主名的，就必得救。」"],["p","這句話引自約珥書2章32節。"],["p","弟兄姊妹，我要問一個問題。"],["p","約珥書那一節的「主」，希伯來原文是哪個字？"],["p","是——"],["q","יְהוָה。\n\n耶和華。"],["w",3],["p","弟兄姊妹，你們聽懂了嗎？"],["p","約珥書說：凡求告耶和華名的，就必得救。"],["p","而保羅在什麼上下文引用它？"],["p","第9節：「你若口裡認耶穌為主。」"],["p","第12節：「眾人同有一位主。」"],["p","第13節：「凡求告主名的，就必得救。」"],["w",3],["p","保羅把舊約中專屬耶和華的應許——"],["p","直接用在耶穌身上。"],["p","而且他寫得那麼自然，好像那是理所當然的事。"],["w",3],["h","它有多寬"],["p","弟兄姊妹，我要請大家看第13節有多寬。"],["q","「凡求告主名的，就必得救。」"],["p","它沒有說「凡好人」。"],["p","它沒有說「凡懂神學的」。"],["p","它沒有說「凡有宗教背景的」。"],["p","它只說——"],["p","凡求告的。"],["w",3],["p","而「求告」這個字，意思很簡單。"],["p","它的意思是："],["q","喊祂的名字。"],["w",3],["h","第三大段｜一雙很髒的腳（10:14–21）"],["h","四個「怎能」"],["p","弟兄姊妹，那話這麼近，這麼寬——"],["p","那為什麼還有這麼多人沒有得救？"],["p","保羅在第14、15節，問了四個問題。"],["p","而這四個問題，是倒著推的。"],["q","「人未曾信他，怎能求他呢？\n\n未曾聽見他，怎能信他呢？\n\n沒有傳道的，怎能聽見呢？\n\n若沒有奉差遣，怎能傳道呢？」"],["p","四個「怎能」。像四級台階，一級一級往下推。"],["p","```\n求告  ←  相信  ←  聽見  ←  傳講  ←  差遣\n```"],["w",3],["p","弟兄姊妹，我要你們注意最底下那一級。"],["p","「若沒有奉差遣，怎能傳道呢？」"],["p","「奉差遣」這個字，希臘文是 ἀποστέλλω——"],["p","它正是「使徒」（ἀπόστολος）那個字的動詞。"],["p","而它在這裡是——被動式。"],["q","不是「我決定要去」。\n\n是「我被差出去」。"],["h","那雙腳"],["p","然後第15節，保羅引了以賽亞書52章7節："],["q","「報福音、傳喜信的人，他們的腳蹤何等佳美！」"],["p","弟兄姊妹，我要先講以賽亞書52章的畫面。"],["p","那時候的處境是什麼？"],["q","一座被圍困的城。\n\n城牆上站著人，望著遠方的山。\n\n他們在等消息——不知道是好消息，還是壞消息。"],["p","然後——"],["q","山那頭，出現了一個人。\n\n他在跑。"],["p","弟兄姊妹，他還沒開口。他還離得很遠。"],["p","但城牆上的人，已經看見了什麼？"],["q","他的腳。"],["w",3],["p","而以賽亞書說：「這人的腳登山何等佳美！」"],["w",3],["p","弟兄姊妹，我要問一個問題。"],["p","腳，美嗎？"],["p","說實話，腳是我們身上最不美的部位之一。"],["p","而走遠路的腳，更是——"],["p","髒的。磨破的。滿是塵土的。"],["p","那為什麼聖經說它「何等佳美」？"],["w",3],["q","因為那雙腳，\n\n帶來了消息。"],["p","弟兄姊妹，那雙腳之所以美，不是因為腳。"],["p","是因為——它帶來的那件事。"],["h","一個關於動力的提醒"],["p","弟兄姊妹，講到這裡，我要說一件牧養上很重要的事。"],["p","第14、15節常常被這樣用："],["q","「你不去傳，他們就下地獄。他們的血要歸在你頭上。」"],["p","弟兄姊妹，我不想這樣講。"],["p","因為那不是保羅的語氣。"],["w",3],["p","保羅的起點在哪裡？"],["p","在第1節：「我心裡所願的，向神所求的。」"],["p","那是渴望，不是罪疚。"],["w",3],["p","所以我想這樣說："],["q","不是「你不去，他們就完了」。\n\n是——\n\n「那道離他們不遠。\n\n而你手上，剛好有。」"],["h","最後一個畫面"],["p","弟兄姊妹，現在我們來到第十章的最後一節。"],["p","而我要說：這是我讀羅馬書時，最讓我停下來的一節之一。"],["w",3],["p","保羅講了一整章「人的責任」。"],["p","你要信。你要承認。你要求告。有人要去傳。"],["p","然後——最後一節，鏡頭轉了。"],["p","從人的手，轉到——"],["p","神的手。"],["w",3],["p","第21節："],["q","「至於以色列人，他說：\n\n我整天伸手招呼那悖逆頂嘴的百姓。」"],["w",3],["p","弟兄姊妹，我要把這一節拆開來。"],["p","「伸手」——原文的意思是「完全張開」。"],["p","而且「手」是複數。"],["p","是一雙手，完全張開。"],["w",3],["p","弟兄姊妹，那是什麼姿勢？"],["p","不是指責的手指。"],["p","不是握緊的拳頭。"],["p","是一個——"],["q","張開雙臂、等著人回來的姿勢。"],["w",3],["p","而前面還有三個字：「整天」。"],["p","原文是：整整一天，從早到晚。"],["p","不是「有時候」。"],["p","不是「祂試過幾次」。"],["p","是——"],["p","一整天。一刻沒有放下。"],["w",3],["p","而祂向著誰伸手？"],["p","「向著那悖逆頂嘴的百姓。」"],["p","弟兄姊妹，「悖逆」這個字在原文的意思是——"],["p","「不肯被說服」。"],["p","不是「不知道」。"],["p","是不肯。"],["w",3],["p","所以這一節的畫面是："],["q","一個不肯的人，\n\n和一雙整天張開、沒有放下的手。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["p","第一，一場很累的工程。"],["p","你一直在扶的那個東西——那個「自己的義」——"],["p","它立不穩。"],["p","它從來沒有立穩過。"],["p","而你以為那就是敬虔。"],["w",3],["p","第二，一句很近的話。"],["p","不必上天。不必下陰間。"],["p","因為那兩件事，祂都做完了。"],["p","那話——已經在你嘴邊了。"],["p","而你要做的，只有一個動作："],["p","喊祂的名字。"],["w",3],["p","第三，一雙很髒的腳。"],["p","那道離人不遠——"],["p","但總要有人去說。"],["w",3],["p","弟兄姊妹，我最後要對兩種人說話。"],["w",3],["p","第一種，是心裡覺得「我離神很遠」的人。"],["p","可能你今天是第一次來。"],["p","可能你信了很久，但你心裡有一件事，讓你覺得你不配。"],["p","弟兄姊妹，我要把第8節送給你："],["q","「這道離你不遠，正在你口裡，在你心裡。」"],["p","你不必先變好。"],["p","你不必先搞懂。"],["p","你不必上天，也不必下陰間。"],["p","因為第13節說："],["q","「凡求告主名的，就必得救。」"],["p","凡。"],["p","包括你。"],["w",3],["p","第二種，是心裡有一個名字的人。"],["p","一個你等了很久的人。"],["p","你為他禱告了很多年。你講過，你也被拒絕過。"],["p","你可能已經快要放棄了。"],["w",3],["p","弟兄姊妹，我要把第21節送給你。"],["p","神說："],["q","「我整天伸手招呼那悖逆頂嘴的百姓。」"],["w",3],["p","你等他，等了很久。"],["p","但是——"],["p","神的手，已經伸了一整天。"],["p","而且——"],["p","還沒有放下。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，先承認一件事：我們當中有人已經很累了。我們一直在扶那個立不穩的東西——我們自己的義。扶了很多年。而它一直倒。\n\n主啊，今天祢的話說：律法的總結就是基督。祢已經替我們立好了。\n\n也求祢對今天在這裡、心裡覺得離祢很遠的人說話。求祢讓他們聽見那句話：這道離你不遠，正在你口裡，在你心裡。\n\n主啊，我們不必上天，不必下陰間，因為祢都做完了。我們只要喊祢的名字。\n\n最後，主啊，我們把心裡那些名字帶到祢面前。那些我們等了很久的人。\n\n求祢提醒我們：祢的手，已經伸了一整天，而且還沒有放下。\n\n也求祢差遣我們——讓我們成為那雙腳。雖然髒，雖然磨破了，但求祢使用它，把消息帶到那個人那裡。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"11":{"min":35,"blocks":[["h","深哉"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天，我們要讀完羅馬書第九、十、十一章這一整個段落。"],["p","這三章，是全卷羅馬書最難的部分。"],["p","第九章講神的主權。\n第十章講人的責任。\n而今天的第十一章，講神的計畫與奧祕。"],["w",3],["p","弟兄姊妹，我先問一個問題。"],["p","你們覺得，保羅講完這三章，他的結論會是什麼？"],["p","我以前以為，他會給我們一個完整的系統。"],["p","像是：「所以，神的主權和人的責任是這樣配合的，第一點、第二點、第三點……」"],["w",3],["p","但保羅沒有。"],["p","他講完之後，寫下的第一個字，是一個感歎詞。"],["p","羅馬書11章33節，原文的第一個字是："],["q","「Ὦ」——啊！」"],["p","第二個字是「深」。"],["p","和合本翻譯得非常好："],["q","「深哉，神豐富的智慧和知識！」"],["w",3],["p","弟兄姊妹，保羅講了三章最艱難的神學。"],["p","然後他的結論不是一套系統。"],["p","是——"],["p","跪下來。"],["w",3],["p","今天我們要看三樣東西："],["p","第一，七千人。\n第二，一棵不屬於你的樹。\n第三，一聲讚嘆。"],["w",3],["h","第一大段｜還有七千人（11:1–10）"],["h","那隻手還沒放下"],["p","弟兄姊妹，我們先接上禮拜。"],["p","第十章的最後一節，是一個畫面："],["q","「我整天伸手招呼那悖逆頂嘴的百姓。」（10:21）"],["p","然後第十一章第一節，保羅立刻問："],["q","「我且說，神棄絕了他的百姓嗎？」"],["p","回答是兩個字："],["q","「斷乎沒有！」"],["w",3],["p","弟兄姊妹，「棄絕」這個字，原文是 ἀπωθέομαι。"],["p","它是由「ἀπό（離開）」加上「ὠθέω（推）」組成的。"],["p","意思是：推開。"],["p","而這個字，出現在舊約的兩個地方——"],["p","撒母耳記上12章22節：「耶和華……必因他的大名不撇棄你們。」"],["p","詩篇94篇14節：「因為耶和華必不丟棄他的百姓。」"],["q","弟兄姊妹，保羅問的這個問題，\n\n用的就是詩篇的話。\n\n他在說：這個問題，聖經自己早就回答過了。"],["h","第一個證據：保羅自己"],["p","而保羅拿出的第一個證據，很簡單也很有力："],["q","「因為我也是以色列人，亞伯拉罕的後裔，屬便雅憫支派的。」"],["p","弟兄姊妹，他在說："],["q","你問神有沒有丟棄以色列人？\n\n你看看——寫這封信的人是誰。"],["h","只剩下我一個人"],["p","然後保羅講了一個故事。而我覺得，這個故事是今天最安慰人的一段。"],["p","第2到4節，他提到以利亞。"],["p","弟兄姊妹，我們回到列王紀上。"],["p","列王紀上18章，以利亞在迦密山上做了什麼？"],["p","他一個人對抗四百五十個巴力先知。"],["p","火從天上降下來。全民俯伏在地喊：「耶和華是神！」"],["p","那是他一生中最高的一天。"],["w",3],["p","然後——列王紀上19章。"],["p","耶洗別派人傳了一句話：「明日約在這時候，我若不使你的性命像那些人的性命一樣，願神明重重地降罰與我。」"],["p","就一句話。"],["p","而那個剛剛叫火從天降下來的人——"],["p","逃了。"],["p","他一路逃到曠野，坐在一棵羅騰樹下，求死。"],["w",3],["p","弟兄姊妹，他對神說了什麼？"],["p","列王紀上19章10節，也就是羅馬書11章3節引用的："],["q","「主啊，他們殺了你的先知，拆了你的祭壇，\n\n只剩下我一個人；他們還要尋索我的命。」"],["w",3],["p","弟兄姊妹，我要停在這一句話上。"],["p","「只剩下我一個人。」"],["p","這不是懶惰。這不是不屬靈。"],["p","這是一個筋疲力盡的人說的話。"],["p","而我想，今天在座有人說過類似的話。"],["p","- 在家裡，只有我一個人信主\n- 在公司，只有我一個人不參與那些事\n- 在教會，好像只有我還在乎這件事\n- 我禱告了這麼多年，我快撐不下去了"],["h","神的回答"],["p","弟兄姊妹，神怎麼回答？"],["p","祂沒有說：「你太軟弱了。」"],["p","祂沒有說：「你怎麼可以這樣？」"],["p","神說了一句話。羅馬書11章4節："],["q","「我為自己留下七千人，是未曾向巴力屈膝的。」"],["w",3],["p","弟兄姊妹，我要跟你們講原文裡的一個細節。"],["p","「我為自己留下」——這個動詞是主動語態，主詞是神。"],["p","而且還有兩個字：「為自己」。"],["p","所以完整的意思是："],["q","「我——為我自己——保留下來了七千人。」"],["w",3],["p","弟兄姊妹，那七千人不是「碰巧沒有跪拜巴力」。"],["p","是神為自己保留的。"],["p","而以利亞——"],["p","完全不知道。"],["w",3],["p","弟兄姊妹，我想這是今天第一個要帶回去的話："],["q","以利亞不是真的只剩一個。\n\n他只是——不知道。"],["p","而神說「還有七千」的時候，祂沒有告訴以利亞那七千個人的名字。"],["p","祂只是說：有。"],["h","恩典不能摻水"],["p","而第5節說："],["q","「如今也是這樣，照著揀選的恩典，還有所留的餘數。」"],["p","「如今也是這樣」——弟兄姊妹，那是現在式。"],["p","以利亞的時代是這樣。"],["p","保羅的時代是這樣。"],["p","今天——也是這樣。"],["w",3],["p","然後第6節，保羅加了一句話。這句話很短，但它是全本聖經對恩典最乾淨的一個定義："],["q","「既是出於恩典，就不在乎行為；\n\n不然，恩典就不是恩典了。」"],["p","弟兄姊妹，這句話的意思是："],["q","恩典不能摻水。\n\n只要摻進一滴「因為我……」——\n\n它就在定義上，不再是恩典了。"],["w",3],["h","第二大段｜一棵不屬於你的樹（11:11–24）"],["h","絆了一下，不是倒下去"],["p","弟兄姊妹，第11節，保羅問了第二個問題："],["q","「我且說，他們失腳是要他們跌倒嗎？斷乎不是！」"],["p","這一節在原文裡，用了兩個不同的動詞。中文都翻成「跌」，但它們不一樣。"],["p","「失腳」是 πταίω——意思是絆了一下、踉蹌。"],["p","「跌倒」是 πίπτω——意思是摔下去、倒在地上。"],["w",3],["p","弟兄姊妹，你看出差別了嗎？"],["q","絆了一下——還可以站起來。\n\n摔倒——起不來了。"],["p","而保羅問的是："],["q","「他們絆了一下，是為了讓他們倒下去起不來嗎？」"],["p","答案是：斷乎不是。"],["w",3],["p","弟兄姊妹，這一個動詞的差別，是整章盼望的第一個根據。"],["p","而它也是給我們的："],["q","你心裡那個人——他絆了一下。\n\n但那不等於他倒下去起不來了。"],["h","一棵橄欖樹"],["p","接下來第17節開始，保羅講了一個比喻。而這個比喻，是第十一章的心臟。"],["p","他說：有一棵橄欖樹。"],["p","（在舊約裡，橄欖樹常常象徵以色列——耶利米書11章16節說：「耶和華曾稱你的名為青橄欖樹。」）"],["p","這棵樹上，有些枝子被折下來了。"],["p","然後——"],["q","「你這野橄欖得接在其中，一同得著橄欖根的肥汁。」（11:17）"],["w",3],["p","弟兄姊妹，我要先講一件農業常識。"],["p","在地中海世界，嫁接是這樣做的："],["q","你把好品種的枝子，接到野生的、根強壯的樹上。"],["p","因為好品種的枝子結好果子，野生的根比較強壯。"],["p","這是正常的做法。"],["w",3],["p","但保羅講的是什麼？"],["p","他說：把野橄欖，接到好橄欖上。"],["p","弟兄姊妹，這是反的。"],["p","而保羅——"],["p","自己知道。"],["p","第24節他說："],["q","「你是從那天生的野橄欖上砍下來的，尚且逆著性得接在好橄欖上。」"],["p","「逆著性」——原文是 παρὰ φύσιν，意思是「違反自然」。"],["w",3],["p","弟兄姊妹，保羅為什麼刻意用一個反常的嫁接？"],["p","因為——"],["q","外邦人得救這件事，本身就是逆著性的。\n\n這件事本來不該發生。"],["h","那句最扎心的話"],["p","然後第18節，保羅說了一句話。"],["p","弟兄姊妹，這句話是他寫整章的主要目的。"],["p","而且他在第13節已經說清楚了對象是誰：「我對你們外邦人說這話。」"],["p","第18節："],["q","「你就不可向舊枝子誇口；\n\n若是誇口，當知道不是你托著根，乃是根托著你。」"],["w",3],["p","「托著」這個字，原文是 βαστάζω。"],["p","它的意思是：扛起重量、承載。"],["p","（加拉太書6章2節「各人的重擔要互相擔當」——同一個字。）"],["w",3],["p","弟兄姊妹，我請大家想像一棵樹。"],["p","一根枝子，長在樹上。"],["p","它會不會扛著樹根？"],["p","不會。"],["p","從來不會。"],["p","是根在扛著枝子。"],["p","而枝子如果哪一天覺得「這棵樹靠我撐著」——"],["q","那只說明一件事：\n\n它忘了自己是被接上去的。"],["h","那句我們很少說出口的話"],["p","而第19節，保羅把我們心裡那句話寫出來了。"],["p","他說：「你若說……」"],["p","弟兄姊妹，聽聽這句話："],["q","「那枝子被折下來，是特為叫我接上。」"],["w",3],["p","弟兄姊妹，我們很少把這句話說出口。"],["p","但它常常在那裡。"],["p","它的白話版是："],["q","「還好我不是他們。」"],["p","- 那間教會怎麼衰退成那樣？還好我們不是\n- 那個弟兄怎麼會跌倒？還好我不是\n- 那個家庭怎麼弄成這樣？還好我們不是"],["w",3],["p","而保羅怎麼回答？"],["p","第20節。弟兄姊妹，請注意他的第一個字："],["q","「不錯！他們因為不信，所以被折下來；你因為信，所以立得住。」"],["p","他沒有否認那個事實。"],["p","他說：對，你說得沒錯。"],["p","但是——"],["q","「你不可自高，反要懼怕。」"],["p","然後第21節："],["q","「神既不愛惜原來的枝子，也必不愛惜你。」"],["h","恩慈和嚴厲"],["p","第22節："],["q","「可見，神的恩慈和嚴厲……向你是有恩慈的，只要你長久在他的恩慈裡。」"],["p","弟兄姊妹，「恩慈」這個字，我們在羅馬書第二章學過。"],["p","χρηστότης。"],["p","而第二章第4節說什麼？"],["q","「還是你藐視他豐富的恩慈、寬容、忍耐，\n\n不曉得他的恩慈是領你悔改呢？」"],["w",3],["p","弟兄姊妹，同一個字。"],["p","第二章說：神的恩慈，是領人悔改的。"],["p","第十一章說：神的恩慈，是要人長久住在裡面的。"],["q","所以——\n\n恩慈從來不是讓人放心自滿的理由。"],["h","神能夠"],["p","但弟兄姊妹，這一段不是以警告結束的。"],["p","第23節說："],["q","「而且他們若不是長久不信，仍要被接上，\n\n因為神能夠把他們從新接上。」"],["p","「神能夠」——弟兄姊妹，這句話讓我想起羅馬書第四章。"],["p","第4章21節，講亞伯拉罕："],["q","「且滿心相信神所應許的必能做成。」"],["p","同一個字。δυνατός。"],["w",3],["q","那位「叫死人復活、使無變為有」的神——\n\n也能把折下來的枝子，重新接上。"],["p","而第24節說："],["q","「你……尚且逆著性得接在好橄欖上，\n\n何況這本樹的枝子，要接在本樹上呢！」"],["p","弟兄姊妹，這是一個很有力的邏輯："],["q","如果神連那件反常的事都做了——\n\n祂當然能做那件順理成章的事。"],["w",3],["h","第三大段｜一聲讚嘆（11:25–36）"],["h","一個奧祕"],["p","弟兄姊妹，第25節開始，保羅要講一個「奧祕」。"],["q","「弟兄們，我不願意你們不知道這奧祕（恐怕你們自以為聰明）……」"],["p","注意括號裡那一句：「恐怕你們自以為聰明」。"],["p","保羅講這個奧祕的目的，仍然是防止外邦人自高。"],["w",3],["p","而那個奧祕是："],["q","「以色列人有幾分是硬心的，等到外邦人的數目添滿了，\n\n於是以色列全家都要得救。」（11:25–26）"],["w",3],["p","弟兄姊妹，我要在這裡誠實地說一件事。"],["p","「以色列全家都要得救」這一句話，歷代敬虔的解經家有不同的理解。"],["p","有人認為，這是指將來以色列民族會大規模歸向基督。"],["p","有人認為，這是指歷世歷代蒙揀選的猶太人，加起來的總數。"],["p","也有人認為，「以色列」在這裡指的是神所有的子民。"],["p","弟兄姊妹，我今天不打算在講台上裁決這件事。"],["p","但我要說一件更重要的事："],["q","無論你持哪一種看法——\n\n保羅要對外邦信徒說的話，完全一樣：\n\n「你不可向舊枝子誇口。」"],["w",3],["p","我也要說：這一章講的是救恩歷史，不是現代的政治。"],["p","保羅在這裡沒有談任何一個現代國家的邊界或政策。"],["p","我們不要把自己的政治立場，講成聖經的教導。"],["h","一句不會反悔的話"],["p","但第25節有兩個小地方，我要請大家注意。"],["p","第一，保羅說「以色列人有幾分是硬心的」。"],["p","「有幾分」——原文是「部分地」。"],["p","不是全部。"],["p","第二，保羅說「等到外邦人的數目添滿了」。"],["p","「等到」——那是一個時限。"],["p","不是永久。"],["w",3],["p","然後第29節，保羅說了一句話。弟兄姊妹，我認為這是全章最大的一句保證："],["q","「因為神的恩賜和選召，是沒有後悔的。」"],["p","「沒有後悔」，原文是 ἀμεταμέλητος——"],["p","意思是：不會改變主意、不可撤回。"],["w",3],["p","弟兄姊妹，你們知道這句話為什麼對我們重要嗎？"],["p","因為——"],["q","如果神會對以色列反悔，\n\n那祂對你，也可能反悔。\n\n而如果祂不會——\n\n那羅馬書第八章那句「都不能叫我們與神的愛隔絕」，\n\n就有了最終的保證。"],["h","一張網"],["p","然後是第32節。弟兄姊妹，這一節是九到十一章整個論證的終點："],["q","「因為神將眾人都圈在不順服之中，特意要憐恤眾人。」"],["p","「圈在」這個字，原文是 συγκλείω。"],["p","它的意思是：一同關起來、圍住。"],["w",3],["p","弟兄姊妹，這個字最有幫助的一個用法，在路加福音第5章。"],["p","那是彼得打魚的那一段。"],["p","他整夜勞力，什麼都沒打著。主說：把網撒下去。"],["p","然後路加福音5章6節說："],["q","「他們下了網，就圈住許多魚。」"],["p","同一個字。"],["w",3],["p","弟兄姊妹，所以第32節的畫面是什麼？"],["q","神撒下一張網。\n\n把所有人——猶太人、外邦人，全部圍在裡面。"],["p","而目的是什麼？"],["p","不是為了審判。"],["p","經文說："],["q","「特意要憐恤眾人。」"],["w",3],["p","弟兄姊妹，保羅走了三章的迷宮。"],["p","揀選、剛硬、餘數、橄欖樹、奧祕——"],["p","最後他停在一個字上："],["p","憐恤。"],["h","追不到的腳印"],["p","然後——第33節。"],["p","弟兄姊妹，原文的第一個字，是一個感歎詞："],["q","「Ὦ」——「啊！」"],["p","然後："],["q","「深哉，神豐富的智慧和知識！\n\n他的判斷何其難測！他的蹤跡何其難尋！」"],["w",3],["p","我要講「蹤跡何其難尋」這個字。因為它太美了。"],["p","原文是 ἀνεξιχνίαστος。"],["p","它由三個部分組成："],["p","ἀ ——「不能」。"],["p","ἐκ ——「出來」。"],["p","ἴχνος ——「腳印」。"],["p","合起來的意思是：追不到腳印。"],["w",3],["p","弟兄姊妹，這個字的畫面是什麼？"],["q","一個獵人，在雪地上追蹤腳印。\n\n他跟著走。跟著走。跟著走——\n\n然後——\n\n腳印消失了。"],["w",3],["p","而和合本翻譯成「他的蹤跡何其難尋」——"],["p","把這個畫面完整地保留下來了。"],["w",3],["p","弟兄姊妹，保羅在說："],["q","神走過的路，你追不到底。\n\n你可以跟一段。\n\n但總有一個地方，腳印就沒有了。"],["h","三個介詞"],["p","而最後一節，第36節："],["q","「因為萬有都是本於他，倚靠他，歸於他。\n\n願榮耀歸給他，直到永遠。阿們！」"],["p","弟兄姊妹，這一節在原文裡，是三個介詞："],["p","ἐξ αὐτοῦ ——出於祂。"],["p","δι' αὐτοῦ ——藉著祂。"],["p","εἰς αὐτόν ——歸向祂。"],["w",3],["p","起源，是祂。"],["p","過程，是祂。"],["p","終點，是祂。"],["w",3],["p","弟兄姊妹，如果起點、過程、終點都是祂——"],["p","那中間——"],["q","沒有一個地方，可以插進「我」。"],["p","所以下一句必然是："],["q","「願榮耀歸給他，直到永遠。阿們！」"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。而它們對應三種「我以為」。"],["w",3],["p","第一，七千人。"],["p","我以為——只剩我一個。"],["p","而神說：還有七千。"],["p","弟兄姊妹，以利亞不是真的只剩一個。"],["p","他只是不知道。"],["p","而如果你今天覺得孤單——"],["p","我要告訴你：你不知道的事，比你知道的多。"],["w",3],["p","第二，一棵不屬於你的樹。"],["p","我以為——我站得穩。"],["p","而保羅說：不是你托著根，乃是根托著你。"],["p","你是被接上去的。"],["p","而且是逆著性接上去的——這件事本來不該發生。"],["p","所以下次當你想說「還好我不是他們」的時候——"],["p","請改成一句話："],["q","「若不是恩典，那就是我。」"],["w",3],["p","第三，一聲讚嘆。"],["p","我以為——我可以想通。"],["p","而保羅說：祂的蹤跡何其難尋。"],["p","你可以跟一段。"],["p","但總有一個地方，腳印就沒有了。"],["w",3],["p","弟兄姊妹，我最後要說一件事。"],["p","我們今天讀完了羅馬書第九、十、十一章。"],["p","這三章講的是全本聖經最難的題目之一。"],["p","而我要問："],["p","保羅講完之後，他得到了什麼？"],["w",3],["p","他沒有得到一套可以拿去辯論的系統。"],["p","他也沒有說「所以我全都搞懂了」。"],["p","他得到的是——"],["p","一聲「啊」。"],["p","然後跪下來。"],["w",3],["p","弟兄姊妹，如果一個人讀完羅馬書九到十一章，"],["p","得到的是一套可以贏辯論的系統——"],["p","那他得到的，跟保羅得到的不一樣。"],["w",3],["p","而如果你今天心裡有一件事，你想了很久、還是想不通——"],["p","我要把保羅的話送給你。"],["p","不是一個解釋。"],["p","是一句話："],["h","深哉。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天讀完了三章最難的經文。而我們承認，我們沒有全部弄懂。\n\n主啊，求祢先安慰今天在這裡覺得「只剩我一個」的人。求祢讓他知道：祢說「我為自己留下七千人」。他不知道的事，比他知道的多。\n\n主啊，也求祢對付我們心裡那句很少說出口的話——「還好我不是他們」。求祢提醒我們：我們是被接上去的，而且是逆著性接上去的。不是我們托著根，乃是根托著我們。\n\n主啊，我們當中有人心裡有一件想不通的事。想了很多年。求祢讓我們今天可以不再追那些追不到的腳印，只是安靜下來，說一句：深哉。\n\n因為萬有都是本於祢，倚靠祢，歸於祢。\n\n願榮耀歸給祢，直到永遠。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"12":{"min":35,"blocks":[["h","所以"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天的講題只有兩個字。"],["p","《所以》。"],["w",3],["p","我先問大家一個問題。"],["p","你們有沒有算過，羅馬書前面十一章，保羅講了多少東西？"],["p","他從「沒有義人，連一個也沒有」開始。"],["p","講到「但如今，神的義在律法以外已經顯明出來」。"],["p","講到「神既不愛惜自己的兒子」。"],["p","講到「都不能叫我們與神的愛隔絕」。"],["p","上禮拜我們讀到最後，他跪下來說：「深哉，神豐富的智慧和知識！」"],["w",3],["p","十一章。"],["p","弟兄姊妹，然後——"],["p","第十二章第一節，第一個字是："],["h","「所以。」"],["w",3],["p","而那個「所以」後面接的，不是一套新的教義。"],["p","不是第十二個論點。"],["p","是一個動作："],["q","「將身體獻上。」"],["w",3],["p","弟兄姊妹，今天我們要跟著保羅走三個地方："],["p","第一，祭壇上。\n第二，身體裡。\n第三，街上。"],["w",3],["h","第一大段｜祭壇上（12:1–2）"],["h","動力是什麼？"],["p","我們先讀第1節："],["q","「所以弟兄們，我以神的慈悲勸你們，將身體獻上，當作活祭。」"],["p","弟兄姊妹，我要先講「慈悲」這個字。"],["p","因為獻身的動力，全在這兩個字上。"],["w",3],["p","「慈悲」的希臘文是 οἰκτιρμοί。"],["p","而它在舊約的希臘文譯本裡，翻譯的是希伯來文 רַחֲמִים（rachamim）。"],["p","弟兄姊妹，這個希伯來字的字根很有意思。"],["p","它的字根是 רֶחֶם（rechem）——意思是「子宮」。"],["w",3],["p","所以「慈悲」這個字的畫面是什麼？"],["q","一個母親對她孩子的那種感情。\n\n從肺腑深處來的。"],["p","而且保羅用的是複數——"],["q","不是「一次的慈悲」，是「一件又一件的慈悲」。"],["w",3],["p","弟兄姊妹，保羅指的是哪些慈悲？"],["p","就是前面十一章的每一件事："],["p","稱義。和好。聖靈住進來。一點定罪也沒有。都不能隔絕。憐恤眾人。"],["w",3],["p","所以弟兄姊妹，我要在這裡說一件很重要的事。"],["p","保羅沒有說：「你欠神這麼多，還債吧。」"],["p","他說：「我以神的慈悲勸你們。」"],["q","獻身的動力不是罪疚。\n\n是——慈悲。"],["h","「勸」而不是「命令」"],["p","而「勸」這個字也很有意思。"],["p","保羅是使徒。他有權柄命令。"],["p","但他用的字是 παρακαλέω——意思是「在旁邊呼喚、懇求」。"],["p","（順帶一提，這個字的名詞形 παράκλητος，就是約翰福音裡聖靈的稱號——「保惠師」。）"],["q","弟兄姊妹，講到獻身這件事，保羅選擇——\n\n不用命令，用懇求。"],["h","為什麼是「身體」？"],["p","現在請大家注意保羅說要獻上什麼。"],["p","他沒有說：「把你的心獻給神。」"],["p","他說的是："],["q","「將身體獻上。」"],["w",3],["p","弟兄姊妹，為什麼是身體？"],["p","我想是因為——"],["p","身體是具體的。"],["p","你們想想看，身體有什麼？"],["p","身體有地址——我住在哪裡，我每天去哪裡。"],["p","身體有行事曆——我的時間給了誰。"],["p","身體有錢包——我的錢流向哪裡。"],["p","身體有一雙眼睛——我看什麼。"],["p","身體有一條舌頭——我說什麼。"],["p","身體有一雙腳——我往哪裡走。"],["w",3],["p","弟兄姊妹，「把心獻給主」——可以是一種感動。"],["p","而「把身體獻上」是——"],["q","明天早上，你人在哪裡。"],["h","一個會爬下來的祭物"],["p","接下來保羅用了一個詞。而這個詞，在第一世紀是很驚人的。"],["p","他說：「當作活祭。」"],["w",3],["p","弟兄姊妹，你們想一想。"],["p","在所有的宗教裡——猶太教、希臘羅馬的異教——"],["p","祭物的定義是什麼？"],["q","祭物是死的。\n\n牽到壇前，宰殺，然後獻上。"],["p","而保羅說：把身體獻上，當作——"],["p","活祭。"],["w",3],["p","一個活著的祭物。"],["p","弟兄姊妹，這樣的祭物有一個問題。"],["p","你們猜是什麼？"],["q","它——\n\n會爬下來。"],["w",3],["p","（笑）弟兄姊妹，這不是在開玩笑。"],["p","這正是為什麼下一節的動詞，是現在式——持續的。"],["p","因為獻上是一次的動作，"],["p","而爬下來——是每天的事。"],["h","你改不了自己"],["p","第2節。弟兄姊妹，這一節，我認為是全卷羅馬書對我們日常生活最重要的一節："],["q","「不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。」"],["w",3],["p","我要先講兩個動詞。"],["p","「效法」的原文是 συσχηματίζω。它的字根是 σχῆμα。"],["p","σχῆμα 的意思是「外形、樣式」——是貼上去的、可以換的。"],["p","（英文的 scheme 就是從這個字來的。）"],["p","而「變化」的原文是 μεταμορφόω。它的字根是 μορφή。"],["p","μορφή 的意思是「本質的形態」——是從裡面長出來的。"],["p","（英文的 metamorphosis——毛毛蟲變蝴蝶——就是這個字。）"],["w",3],["p","弟兄姊妹，所以保羅在說什麼？"],["q","這個世代要你改變外表去配合它。\n\n而神要你從裡面本質性地改變。\n\n一個是貼上去的。\n\n一個是長出來的。"],["h","三個文法特徵"],["p","但弟兄姊妹，這一節最重要的，還不是這兩個字。"],["p","是這兩個動詞的文法。"],["p","它們有三個特徵，每一個都重要。"],["w",3],["p","第一，它們是現在式。"],["p","意思是：這是持續的，不是一次完成的。"],["p","第二——這一點最重要——它們是被動語態。"],["p","弟兄姊妹，「要變化」的原文，不是「你要改變自己」。"],["p","是："],["q","「你要被變化。」"],["w",3],["p","而第三，它們是命令語氣。"],["w",3],["p","弟兄姊妹，這三點合起來，是什麼意思？"],["q","你改不了自己。\n\n但你有責任——\n\n把自己放在會被改變的位置上。"],["h","從哪裡改起？"],["p","而中間那一句，說出了改變的機制："],["q","「藉著心意更新而變化。」"],["p","「心意」的原文是 νοῦς——心思、思維方式。"],["w",3],["p","弟兄姊妹，我要請大家想一想。"],["p","我們想要改變的時候，通常從哪裡開始？"],["p","從行為。"],["p","我要戒掉那個習慣。我要少發脾氣。我要早起靈修。"],["p","然後呢？"],["p","立志。失敗。羞愧。再立志。"],["w",3],["p","弟兄姊妹，那就是羅馬書第七章。"],["p","「立志為善由得我，只是行出來由不得我。」"],["w",3],["p","而第十二章2節說：不是那樣。"],["q","是心思被更新——\n\n然後生命就變化了。"],["p","弟兄姊妹，用一句話說就是："],["h","改變觀念，就改變生命。"],["h","怎麼知道神的旨意？"],["p","而這一節的最後一句，回答了一個很多人問的問題："],["q","「叫你們察驗何為神的善良、純全、可喜悅的旨意。」"],["p","「察驗」這個字，希臘文是 δοκιμάζω。"],["p","它的字根是——驗金屬。"],["p","（我們在第五章看過：「忍耐生老練」，就是這個字根。）"],["w",3],["p","弟兄姊妹，很多人問：「我怎麼知道神的旨意？」"],["p","而保羅的答案，不是「求一個記號」。"],["p","也不是「等一個聲音」。"],["p","保羅的答案是："],["q","讓你的心思被更新——\n\n然後你就認得出來。"],["p","就像一個受過訓練的驗金師，"],["p","他一看，就知道那是不是真金。"],["w",3],["h","第二大段｜身體裡（12:3–8）"],["h","心意更新的第一個結果"],["p","弟兄姊妹，接下來我要問一個問題。"],["p","如果一個人的心思真的被更新了——"],["p","第一個看得出來的地方，是哪裡？"],["w",3],["p","保羅的答案在第3節。而這個答案，可能跟你想的不一樣。"],["p","不是「他開始服事了」。"],["p","不是「他開始奉獻了」。"],["p","是——"],["q","他看自己的方式，變了。"],["p","第3節："],["q","「不要看自己過於所當看的，要照著神所分給各人信心的大小，看得合乎中道。」"],["h","一個中文譯不出來的文字遊戲"],["p","弟兄姊妹，這一節在原文裡，是一個文字遊戲。"],["p","保羅在一句話裡，用了四個同一個字根的字。"],["p","那個字根是 φρον-，意思是「想、心思」。"],["p","我唸一次，你們聽聽看："],["q","μὴ ὑπερφρονεῖν（不要「超過」地想）\n\nπαρ' ὃ δεῖ φρονεῖν（超過所當想的）\n\nἀλλὰ φρονεῖν（倒要想）\n\nεἰς τὸ σωφρονεῖν（以致「健全地」想）"],["w",3],["p","弟兄姊妹，四個字，一句話。"],["p","而這證明了一件事："],["q","第3節談的，仍然是「心思」——\n\n它跟第2節「心意更新」，是同一條線。"],["h","合乎中道"],["p","而最後那個字 σωφρονέω，很值得講。"],["p","它是由兩個字組成的："],["p","σῶς——健全、安全。"],["p","φρήν——心思。"],["p","合起來就是：心思健全、清醒。"],["p","和合本翻譯成「看得合乎中道」，翻得非常好。"],["w",3],["p","弟兄姊妹，我要在這裡糾正一個很普遍的誤解。"],["p","很多人以為謙卑就是「要看低自己」。"],["p","但保羅沒有這樣說。"],["p","他說的是「健全」——"],["q","不高估。\n\n也不低估。"],["w",3],["p","弟兄姊妹，一直說「我什麼都不是」，其實也是一種以自己為中心。"],["p","因為那還是一直在講我。"],["p","而「合乎中道」的意思是："],["q","我知道神給了我什麼，也知道那是神給的。"],["h","我是你的手"],["p","接下來第5節，保羅講到身體。而這裡有一個細節，中文很容易讀過去："],["q","「我們這許多人，在基督裡成為一身，互相聯絡作肢體。」"],["p","原文是 ἀλλήλων μέλη——「彼此互為肢體」。"],["w",3],["p","弟兄姊妹，注意保羅沒有說："],["p","「我們都是基督身體的肢體。」"],["p","他說的是："],["q","「我們彼此互為肢體。」"],["p","意思是什麼？"],["q","我是你的手。\n\n你是我的眼睛。"],["p","不只是「我們都屬於同一個身體」——"],["p","是「我們彼此需要」。"],["h","憐憫人的時候，臉要好看"],["p","然後第6到8節，保羅列了七樣恩賜。"],["p","弟兄姊妹，我今天不逐項講。但我要請大家注意最後三樣。"],["p","因為保羅在那三樣後面，加了態度。"],["w",3],["p","第8節："],["q","「施捨的，就當誠實；治理的，就當殷勤；憐憫人的，就當甘心。」"],["w",3],["p","「施捨的，就當誠實」——「誠實」的原文是 ἁπλότης，字面是「不摺疊的、沒有夾層的」。"],["p","弟兄姊妹，施捨最容易夾雜什麼？"],["p","要被看見。要被感謝。要有回報。"],["p","而 ἁπλότης 的意思是：沒有夾層。"],["w",3],["p","而最後一項，我覺得是全章最扎人的一句話。"],["q","「憐憫人的，就當甘心。」"],["p","「甘心」的原文是 ἱλαρότης。"],["p","這個字在整本新約，只出現這一次。"],["p","它的意思是：歡歡喜喜、開朗。"],["p","（英文的 hilarious 就是從這個字來的。）"],["p","而它的形容詞形式，出現在哥林多後書9章7節那句很有名的話："],["q","「神喜愛捐得樂意的人。」"],["w",3],["p","弟兄姊妹，所以12:8的意思是："],["q","憐憫人的時候——\n\n臉要好看。"],["w",3],["p","弟兄姊妹，我想這一句話值得我們每個人停一下。"],["p","因為憐憫最容易變質的地方，"],["p","不是「做不做」。"],["p","是——"],["q","做的時候，那張臉。"],["p","一個帶著不耐煩去幫助人的人——"],["p","那不是憐憫。那是施捨。"],["w",3],["h","第三大段｜街上（12:9–21）"],["h","愛，不要戴面具"],["p","弟兄姊妹，從第9節開始，保羅像機關槍一樣，一口氣說了十幾件事。"],["p","而第一句話，是整段的標題："],["q","「愛人不可虛假。」"],["w",3],["p","「不可虛假」的原文是 ἀνυπόκριτος。"],["p","它是 ἀ（不）加上 ὑποκριτής。"],["p","而 ὑποκριτής 在古希臘文裡，本來的意思是——"],["q","在劇場裡戴著面具演戲的人。"],["p","（主耶穌罵法利賽人「假冒為善的人」，用的就是這個字。）"],["w",3],["p","弟兄姊妹，所以「愛人不可虛假」的字面是："],["h","「愛，不要戴面具。」"],["w",3],["p","而弟兄姊妹，我要說一句實話。"],["p","教會裡最難說出口的一句話，是什麼？"],["p","是——"],["q","「我不好。」"],["p","所以我們戴著面具彼此相愛。"],["p","問「你好嗎」，答「感謝主，很好」。"],["h","像家人一樣"],["p","第10節：「愛弟兄，要彼此親熱。」"],["p","「親熱」的原文是 φιλόστοργος。"],["p","而裡面藏著一個字：στοργή。"],["w",3],["p","弟兄姊妹，希臘文有好幾個字講「愛」。"],["p","ἀγάπη——捨己的愛。"],["p","φιλία——朋友之愛。"],["p","而 στοργή 是什麼？"],["q","στοργή 是——家人之間的、自然的親情。"],["w",3],["p","所以保羅在說："],["q","對弟兄姊妹的愛，要像家人那樣。\n\n不是同事。\n\n不是會友。\n\n是——家人。"],["h","同樂比同哭難"],["p","第15節，只有一句話，但我覺得它是全章最實際的一節："],["q","「與喜樂的人要同樂；與哀哭的人要同哭。」"],["p","弟兄姊妹，請注意保羅的順序。"],["p","他先講「同樂」，再講「同哭」。"],["w",3],["p","而我想問大家一個問題："],["p","這兩件事，哪一件比較難？"],["w",3],["p","弟兄姊妹，我做牧師這些年，我的觀察是——"],["q","同哭比較容易。\n\n同樂比較難。"],["p","為什麼？"],["q","因為同哭的時候——我在上面。\n\n而同樂的時候——他在上面。"],["w",3],["p","弟兄姊妹，你們知道那個感覺嗎？"],["p","教會裡有人升遷了。有人的孩子考上了。有人的事奉有果效了。"],["p","而你剛好在低谷。"],["p","你要恭喜他。你也真的說了。"],["p","但心裡有一個很小的聲音——"],["w",3],["p","保羅說：與喜樂的人要同樂。"],["p","而那需要一顆被更新的心思。"],["h","三個限定"],["p","第18節，弟兄姊妹，這一節對受過關係傷害的人，是極大的釋放。"],["q","「若是能行，總要盡力與眾人和睦。」"],["p","原文在這裡，有三個限定："],["p","第一：若是能行——意思是，有時候不能行。"],["p","第二：原文有一句話中文比較看不出來——「在於你們的部分」。"],["p","第三：總要盡力。"],["w",3],["p","弟兄姊妹，保羅是一個非常實際的人。"],["p","他沒有說：「你一定要跟每個人都和好。」"],["p","他說的是："],["q","和睦需要兩個人。\n\n而神只要求你負責——\n\n你那一半。"],["w",3],["p","弟兄姊妹，如果你一直為一段修不好的關係自責——"],["p","這一節是給你的。"],["p","你那一半，盡力了嗎？"],["p","如果盡力了——"],["p","另外那一半，不在你的責任範圍內。"],["h","讓出一個位置"],["p","第19節："],["q","「親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒；因為經上記著：『伸冤在我，我必報應。』」"],["p","「讓步」這個字，原文的字面很有畫面："],["q","δότε τόπον ——「給出一個位置」。"],["p","弟兄姊妹，那個畫面是什麼？"],["q","你站在那裡，握著拳頭，準備要動手。\n\n而神說：\n\n「讓開。給我一個位置。」"],["w",3],["p","但弟兄姊妹，我必須在這裡把一件事講清楚。"],["p","因為這一節常常被誤用。"],["p","保羅沒有說："],["p","「那件事不重要。」"],["p","「你不該覺得受傷。」"],["p","「算了吧。」"],["w",3],["p","他說的是："],["q","「伸冤在我，我必報應。」"],["p","弟兄姊妹，這不是撤案。"],["p","這是——"],["q","移送到更高的法庭。"],["w",3],["p","而我要特別對一種人說話。"],["p","如果你現在正在一段持續傷害你的關係裡——"],["p","家暴、虐待、犯罪——"],["p","弟兄姊妹，第19節絕對不是叫你留在裡面。"],["p","因為下一章，羅馬書13章4節說："],["q","掌權的「是神的用人，是伸冤的，刑罰那作惡的」。"],["q","尋求合法的保護——報警、法律的途徑、離開危險的環境——\n\n那正是神所設立的途徑之一。"],["p","如果你是那個人，請在聚會之後找我，或找一位你信任的同工。"],["h","沒有中立這個選項"],["p","弟兄姊妹，最後一節。第21節。"],["q","「你不可為惡所勝，反要以善勝惡。」"],["w",3],["p","「勝」這個字，希臘文是 νικάω。"],["p","而它讓我想起羅馬書第八章那句話："],["q","8:37「靠著愛我們的主，在這一切的事上已經得勝有餘了。」"],["p","同一個字根。"],["q","第八章說：你已經得勝有餘了——那是地位。\n\n第十二章說：所以去得勝吧——那是實踐。"],["w",3],["p","而這一節在原文裡，有一個對比："],["p","前半句是被動：「不要被惡所勝。」"],["p","後半句是主動命令：「你要去勝。」"],["w",3],["p","弟兄姊妹，這意味著什麼？"],["p","意味著在這件事上——"],["q","沒有「中立」這個選項。\n\n要嘛惡勝過你。\n\n要嘛你用善勝過惡。"],["w",3],["p","而「你不可為惡所勝」是什麼意思？"],["p","弟兄姊妹，我想是這樣："],["q","當有人惡待你，而你用惡回應——\n\n表面上，你在報復他。\n\n實際上——\n\n惡，已經贏了。\n\n因為它成功地讓你也變成了一個惡人。"],["w",3],["p","而「以善勝惡」的意思是："],["q","我不讓那件惡事，改變我是誰。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天走了三個地方。"],["w",3],["p","第一，祭壇上。"],["p","保羅講完十一章，說了兩個字：「所以。」"],["p","然後他要的不是你的感動，是你的身體——"],["p","你的地址、你的行事曆、你的錢包、你的眼睛、你的舌頭、你的腳。"],["p","而動力不是罪疚，是慈悲——"],["p","那個從肺腑深處來的、母親對孩子的慈悲。"],["w",3],["p","第二，身體裡。"],["p","心意更新的第一個結果，是你看自己的方式變了。"],["p","不高估。也不低估。"],["p","而在服事上，保羅提醒我們一句："],["p","憐憫人的時候——臉要好看。"],["w",3],["p","第三，街上。"],["p","愛，不要戴面具。"],["p","跟弟兄姊妹的關係，要像家人。"],["p","與喜樂的人同樂——雖然那常常比同哭更難。"],["p","而面對惡的時候，記得：沒有中立這個選項。"],["w",3],["p","弟兄姊妹，我最後要回到今天最重要的那一節。"],["p","羅馬書12章2節。"],["p","而我要請大家記住那兩個動詞是被動式的。"],["q","「要被變化。」"],["w",3],["p","弟兄姊妹，這句話同時說了兩件事。"],["p","第一件，是壞消息："],["q","你改不了自己。"],["p","你已經試過很多次了，對不對？"],["p","立志。失敗。羞愧。再立志。"],["w",3],["p","但第二件，是好消息："],["q","你不必改變自己。\n\n你只要——\n\n把自己放在會被改變的位置上。"],["w",3],["p","而那個位置在哪裡？"],["p","第1節說了："],["p","祭壇上。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，先為十一章的每一件慈悲感謝祢。因為那是我們今天願意獻上的唯一理由——不是我們欠祢，是祢先愛了我們。\n\n主啊，我們現在把身體交給祢。不只是我們的感動，是我們的地址、我們的行事曆、我們的錢包、我們的眼睛、我們的舌頭、我們的腳。\n\n我們也承認，我們是會爬下來的祭物。求祢每一天把我們放回去。\n\n主啊，我們試過很多次靠自己改變，都失敗了。今天祢的話說：要「被」變化。求祢的靈更新我們的心思。因為我們知道——改變觀念，就改變生命。\n\n求祢也對付我們的面具。讓我們在弟兄姊妹面前，可以說一句「我不好」。\n\n最後，主啊，我們當中有人被惡待了很久。求祢讓他們知道，祢說「伸冤在我」——那不是撤案，是祢要親自處理。也求祢保護那些正在危險中的人，賜給他們勇氣去尋求該有的幫助。\n\n求祢叫我們不被惡所勝，反要以善勝惡。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"13":{"min":35,"blocks":[["h","穿上"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天的講題，只有兩個字。"],["p","《穿上》。"],["w",3],["p","不過在講到那件衣服之前，我要先講兩樣東西。"],["p","一把刀。"],["p","和一筆債。"],["w",3],["p","我先問一個問題。"],["p","你心裡有沒有一件事，是你覺得「他欠我一個公道」？"],["p","可能是很多年前的事。"],["p","可能對方早就忘了。"],["p","而你——"],["p","沒有忘。"],["w",3],["p","弟兄姊妹，上個禮拜我們讀羅馬書第十二章，讀到一節經文："],["q","「不要自己伸冤……因為經上記著：『主說：伸冤在我，我必報應。』」（12:19）"],["p","而我猜，有些人聽完心裡會想："],["q","「可是——如果我不伸冤，那這件事就沒有人管了啊。」"],["w",3],["p","弟兄姊妹，今天的第十三章，就是在回答這個問題。"],["w",3],["h","第一大段｜一把不是你的刀（13:1–7）"],["h","一個排隊的字"],["p","羅馬書13章1節："],["q","「在上有權柄的，人人當順服他，因為沒有權柄不是出於神的。凡掌權的都是神所命的。」"],["p","弟兄姊妹，這一節在原文裡有一個字根，出現了好幾次。中文看不太出來。"],["p","那個字根是 τάσσω。"],["p","它的意思是——排列、編排、指派位置。"],["p","它是一個軍事用語：軍隊列陣的時候，每一個人站在指定的位置上。"],["w",3],["p","現在我們來看這幾個字："],["p","「凡掌權的都是神所命的」——原文是 τεταγμέναι，意思是「被神排定了位置」。"],["p","「人人當順服」——原文是 ὑποτάσσω，字面是「排到底下」。"],["p","而第2節說「抗拒掌權的」——原文是 ἀντιτάσσω，字面是「排到對面」。"],["w",3],["p","弟兄姊妹，所以這一段的畫面是什麼？"],["q","神在一張大棋盤上，把每一個權柄，排在它的位置上。\n\n而你要做的，是站在你的位置上——\n\n不是跳到對面去。"],["w",3],["p","弟兄姊妹，我們前幾個禮拜學過一句話："],["q","驕傲是離開本位，抓住權力。\n\n謙卑是放下權力，回到本位。"],["p","而13章1到2節，幾乎就是這句話的原文版。"],["h","那把刀"],["p","然後第4節，保羅講到一樣東西。"],["q","「因為他是神的用人，是與你有益的……\n\n因為他不是空空地佩劍；他是神的用人，是伸冤的，刑罰那作惡的。」"],["p","弟兄姊妹，「伸冤的」這個字，原文是 ἔκδικος。"],["p","而上個禮拜我們讀的12章19節，「伸冤在我」——原文是 ἐκδίκησις。"],["p","同一個字根。"],["w",3],["p","弟兄姊妹，你聽出來了嗎？"],["p","12章19節說：不要自己伸冤。"],["p","而13章4節說：神已經指派了一位伸冤的。"],["q","所以12:19的意思不是「這件事沒有人管」。\n\n12:19的意思是：不是由你來管。"],["w",3],["p","而「他不是空空地佩劍」——"],["p","弟兄姊妹，那把刀是真的。"],["p","它只是——"],["p","不在你手上。"],["p","也不該在你手上。"],["h","一個很高的評價"],["p","而保羅在這一段裡，用了兩個字來稱呼羅馬的官員。而這兩個字，都是教會用語。"],["p","第4節：「他是神的用人」——原文是 διάκονος。"],["p","弟兄姊妹，那是「執事」的意思。"],["p","第6節：「因他們是神的差役」——原文是 λειτουργός。"],["p","這個字更重。它在舊約的希臘文譯本裡，是用來形容祭司在聖殿裡的供職的。"],["p","（希伯來書8章2節用同一個字形容基督是「聖所的執事」。）"],["w",3],["p","弟兄姊妹，保羅在說什麼？"],["p","他用「執事」和「祭司性的服事」這兩個字，來稱呼那些收稅的、判案的羅馬官員。"],["q","這是一個極高的評價。\n\n但同時，也是一個極重的責任——\n\n因為那意味著：他們是在替神辦事。"],["h","一個必要的平衡"],["p","弟兄姊妹，講到這裡，我必須停下來說一件很重要的事。"],["p","因為這一段經文，在歷史上被嚴重誤用過。"],["p","它曾經被拿來為奴隸制度辯護。被拿來為種族隔離辯護。被拿來要求人對邪惡的政權絕對服從。"],["p","所以我要講三件事。"],["w",3],["p","第一，保羅用的字是「順服秩序」，不是「凡事照做」。"],["p","希臘文有兩個不同的字。13章1節用的是前者。"],["w",3],["p","第二，同一本聖經說了另一句話。"],["p","使徒行傳5章29節，彼得和使徒們站在公會面前說："],["q","「順從神，不順從人，是應當的。」"],["p","還有但以理的三個朋友，站在尼布甲尼撒面前說："],["q","「即或不然，我們決不事奉你的神。」（但3:18）"],["p","還有出埃及記第一章，那兩個收生婆——"],["p","聖經說她們「不照埃及王的吩咐行」（出1:17）。"],["p","而下面幾節說：神厚待她們。"],["w",3],["p","第三——弟兄姊妹，這一點最有意思——"],["p","寫13章1節的這個人，自己做了什麼？"],["p","在腓立比被打之後，他要求官長親自來釋放他（徒16:37）。"],["p","在快要被鞭打的時候，他提出自己的羅馬公民權（徒22:25）。"],["p","最後，他上告於凱撒（徒25:11）。"],["w",3],["q","弟兄姊妹，所以「順服」顯然不等於：\n\n不能據理力爭、不能使用法律途徑、不能說真話。"],["p","而主耶穌自己——"],["p","祂站在彼拉多面前，說了兩句話。"],["p","第一句：「若不是從上頭賜給你的，你就毫無權柄辦我。」（約19:11）——祂承認那權柄的來源。"],["p","第二句：「我為此而生，也為此來到世間，特為給真理作見證。」（約18:37）——祂說了真話。"],["p","而祂——"],["p","沒有自己伸冤。"],["p","（彼前2:23「被罵不還口，受害不說威嚇的話，只將自己交託那按公義審判人的主。」）"],["h","該給的，就給"],["p","而第7節說了一句很不浪漫、但很重要的話："],["q","「凡人所當得的，就給他。」"],["p","弟兄姊妹，這一節在原文裡是四組對稱："],["p","當得糧的，給他糧。\n當得稅的，給他稅。\n當得懼怕的，給他懼怕。\n當得恭敬的，給他恭敬。"],["w",3],["p","保羅的重點是：該給誰的，就給誰。"],["p","弟兄姊妹，我做牧師這些年，看過一件事："],["q","一個基督徒的見證，常常不是毀在大事上。\n\n是毀在——該給的沒給。"],["p","該還的錢。該說的道歉。該回的訊息。該履行的承諾。"],["w",3],["h","第二大段｜一筆還不完的債（13:8–10）"],["h","一個字的轉折"],["p","弟兄姊妹，第7節說「凡人所當得的」——原文是 ὀφειλάς，意思是「所欠的債」。"],["p","然後第8節，保羅用了同一個字："],["q","「凡事都不可虧欠（ὀφείλετε）人，\n\n惟有彼此相愛要常以為虧欠。」"],["w",3],["p","弟兄姊妹，保羅在兩節之間，玩了同一個字：債。"],["p","他說："],["q","把所有的債——\n\n全部還清。\n\n只留一筆。"],["p","而那一筆是什麼？"],["p","愛。"],["w",3],["p","而那一筆，有一個特點："],["q","你永遠還不完。"],["p","因為愛不是一次性的付款。"],["p","你今天愛了，不代表明天不用愛。"],["p","這筆帳——"],["p","每天重新開立。"],["w",3],["p","弟兄姊妹，我想這對我們有一個很重要的意義："],["q","一個永遠還不完的債，意味著——\n\n你永遠沒有可以邀功的一天。"],["h","一張帳單的總計"],["p","然後第9節，保羅列了一張清單："],["q","「像那不可姦淫，不可殺人，不可偷盜，不可貪婪，或有別的誡命，\n\n都包在愛人如己這一句話之內了。」"],["p","「包在……之內」這個字很有意思。原文是 ἀνακεφαλαιόω。"],["p","它的字根 κεφάλαιον，在商業上的意思是——"],["p","「總計」。"],["p","就像我們今天在帳單最下面看到的那一行：合計。"],["w",3],["p","弟兄姊妹，所以保羅的畫面是："],["q","你把誡命一條一條列成清單。\n\n不可姦淫。不可殺人。不可偷盜。不可貪婪。\n\n然後在下面畫一條線，寫上——\n\n總計：愛人如己。"],["h","一個最低標準"],["p","而第10節，保羅給了「愛」一個定義。"],["p","弟兄姊妹，我第一次注意到這個定義的時候，有點意外。"],["p","因為它不是抒情的。"],["p","它是這樣說的："],["q","「愛是不加害與人的。」"],["w",3],["p","弟兄姊妹，這不是愛的最高境界。"],["p","這是——最低標準。"],["p","而正因為它是最低標準，它特別扎人："],["q","你說你愛他——\n\n那你有沒有傷害他？"],["p","用一句話。用一個眼神。用一次沉默。用一個在別人面前的玩笑。"],["w",3],["p","而「愛人如己」的那個「人」，原文是 πλησίον——意思是「鄰近的人」。"],["p","不是抽象的「全人類」。"],["p","是——離你最近的那一個。"],["w",3],["h","第三大段｜一件要穿上的衣服（13:11–14）"],["h","現在幾點了？"],["p","弟兄姊妹，第11節，保羅換了一個角度。他開始講時間。"],["q","「再者，你們曉得現今就是該趁早睡醒的時候；\n\n因為我們得救，現今比初信的時候更近了。」"],["w",3],["p","而第12節說："],["q","「黑夜已深，白晝將近。」"],["p","弟兄姊妹，「將近」這個字在原文是完成式——"],["p","意思是：已經臨近了，而且維持在臨近的狀態。"],["w",3],["p","而保羅的邏輯，其實非常簡單："],["q","每過一天，那日子就近一天。"],["p","弟兄姊妹，這不是預測。"],["p","這是——算術。"],["w",3],["p","而保羅要的不是一個時間表。"],["p","（主耶穌自己說：「那日子、那時辰，沒有人知道。」太24:36）"],["p","保羅要的是一件事："],["q","該醒了。"],["h","脫下來，穿上去"],["p","第12節下半："],["q","「我們就當脫去暗昧的行為，帶上光明的兵器。」"],["p","弟兄姊妹，「兵器」這個字——ὅπλα——"],["p","我們在羅馬書第六章學過。"],["p","6章13節：「將肢體作義的兵器獻給神。」"],["w",3],["p","所以："],["q","第六章說：你的肢體，是兵器。\n\n第十三章說：那些兵器——穿上身。"],["h","那三對"],["p","而第13節，保羅列了六樣要脫掉的東西。而它們是三對："],["p","荒宴、醉酒。"],["p","好色、邪蕩。"],["p","爭競、嫉妒。"],["w",3],["p","弟兄姊妹，我要請大家注意最後那一對。"],["p","前面兩對，在教會裡人人喊打。"],["p","而「爭競、嫉妒」——"],["p","我們常常把它當成「個性問題」，或者「他就是比較有想法」。"],["p","而保羅——"],["p","把它放在跟醉酒、淫亂同一行。"],["h","穿上一個人"],["p","然後，第14節。弟兄姊妹，這是全章的高峰："],["q","「總要披戴主耶穌基督，\n\n不要為肉體安排，去放縱私慾。」"],["w",3],["p","「披戴」這個字，原文是 ἐνδύω。"],["p","它的意思很簡單：穿上衣服。"],["w",3],["p","弟兄姊妹，請注意這裡有一個升級。"],["p","第12節說：穿上「光明的兵器」——那是一樣東西。"],["p","第14節說：穿上「主耶穌基督」——那是一個位格。"],["w",3],["p","而在古代，「穿上某人的衣服」是有意義的。"],["p","羅馬男孩到了成年的那一天，會脫下童袍，穿上成人的長袍——"],["p","那件衣服代表：他現在是一個成年公民了。"],["w",3],["p","弟兄姊妹，我覺得這一節最大的安慰在這裡："],["p","保羅沒有說：「你要變成主耶穌基督的樣子。」"],["p","他說的是："],["q","穿上祂。"],["p","你不必做成一個新的自己。"],["p","你只要——穿上一個已經完成的人。"],["w",3],["p","（而加拉太書3章27節說：「凡受洗歸入基督的，都是披戴基督了。」——那是已經發生的事。"],["p","所以羅13:14的命令是：那件衣服你已經有了；每天早上，把它穿上。）"],["h","不要為它鋪路"],["p","而14節的後半句，弟兄姊妹，我認為是全本聖經對付罪最實際的一句話。"],["q","「不要為肉體安排，去放縱私慾。」"],["p","「安排」這個字，原文是 πρόνοια。"],["p","它由兩個部分組成：πρό（預先）＋ νοέω（想）。"],["p","意思是：事先的計畫、預備、鋪路。"],["w",3],["p","弟兄姊妹，你們注意到保羅說什麼了嗎？"],["p","他沒有說「不要放縱私慾」。"],["p","他說："],["q","不要為那件事作預備。"],["w",3],["p","弟兄姊妹，我想這句話說中了很多人。"],["p","我們對付反覆的罪，方法幾乎都一樣："],["q","在試探來的那一刻，努力抵擋。"],["p","然後呢？"],["p","失敗。自責。再立志。"],["p","然後下一次，再來一遍。"],["w",3],["p","而保羅說：問題不在那一刻。"],["p","問題在——"],["p","那一刻之前。"],["w",3],["p","因為當一個人開始「為肉體安排」的時候——"],["p","他其實已經決定了。"],["p","他只是還沒承認。"],["w",3],["p","弟兄姊妹，所以真正的問題不是："],["p","「我怎麼在那個時候忍住？」"],["p","真正的問題是："],["p","「我為什麼會走到那裡？」"],["w",3],["p","而答案常常很具體："],["p","不是「看到的時候要忍住」——是「不要在那個時間，把手機帶進那個房間」。"],["p","不是「聚會的時候不要說那些話」——是「不要跟那個人單獨吃那頓飯」。"],["p","不是「不要買」——是「不要打開那個 app」。"],["h","一個花園裡的孩子"],["p","弟兄姊妹，最後我要講一個故事。而這個故事，是有第一手記載的。"],["p","主後四世紀，北非有一個年輕人，非常聰明，也非常放縱。"],["p","他的名字叫奧古斯丁。"],["p","他母親為他禱告了很多年。"],["p","而他自己也掙扎了很多年——他知道什麼是對的，但他做不到。"],["p","（他甚至寫下一句很有名的禱告：「主啊，求祢賜給我貞潔——但不是現在。」）"],["w",3],["p","有一天，他在米蘭的一個花園裡，痛哭。"],["p","他在《懺悔錄》第八卷裡自己記下了接下來發生的事。"],["p","他說：他聽見鄰家傳來一個孩子的聲音，反覆地唱著一句話："],["q","「拿起來讀，拿起來讀。」"],["w",3],["p","他起身，回到座位，拿起放在那裡的保羅書信。"],["p","隨手翻開。"],["p","而他讀到的第一段，是："],["q","「不可荒宴醉酒，不可好色邪蕩，不可爭競嫉妒。\n\n總要披戴主耶穌基督，不要為肉體安排，去放縱私慾。」"],["w",3],["p","羅馬書13章13到14節。"],["p","他寫道：讀完之後，「一道確定的光，彷彿注入我心，一切疑慮的陰霾都消散了」。"],["w",3],["p","弟兄姊妹，那個掙扎了很多年的人——"],["p","最後改變他的，不是一套論證。"],["p","是一句話："],["p","穿上祂。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。而它們的範圍，是一層一層往內收的。"],["w",3],["p","第一，一把不是你的刀。"],["p","你不必自己當法官。"],["p","神已經指派了一位伸冤的。"],["p","（而順服，不等於盲從——同一本聖經說：「順從神，不順從人，是應當的。」）"],["w",3],["p","第二，一筆還不完的債。"],["p","把該給的都給了。"],["p","只留一筆——"],["p","而那一筆，你永遠還不完。"],["p","所以你永遠沒有可以邀功的一天。"],["w",3],["p","第三，一件要穿上的衣服。"],["p","你不必做成一個新的自己。"],["p","你只要——"],["p","穿上一個人。"],["w",3],["p","而且不要再為那件事鋪路了。"],["w",3],["p","弟兄姊妹，我最後要說一句話。"],["p","明天早上，你會做一件事——"],["p","你會穿衣服。"],["p","你不會想太多。你就是穿上。"],["w",3],["p","而保羅說："],["p","在你穿那件衣服之前——"],["h","先穿上祂。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，先把手上那把不該拿的刀放下。主啊，我們心裡有一些「他欠我一個公道」的事。今天我們知道了：那不是沒有人管，只是不該由我們來管。\n\n主啊，也求祢提醒我們那些該給而還沒給的——該還的錢，該說的道歉，該履行的承諾，該回的那一句話。求祢給我們勇氣，這禮拜還掉一項。\n\n主啊，我們承認：我們對付那個反覆的罪，一直用同一個方法——在最後一刻硬撐。而我們一直輸。\n\n今天祢的話說：不要為它鋪路。\n\n求祢給我們智慧，看見那條路是什麼；也給我們決心，把它斷掉。\n\n最後，主啊——\n\n我們不必做成一個新的自己。\n\n求祢讓我們明天早上起來的時候，在穿任何一件衣服之前，先穿上祢。\n\n也叫我們不被惡所勝，反要以善勝惡。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"14":{"min":35,"blocks":[["h","接納"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","我先問一個問題。"],["p","在你認識的基督徒裡面，有沒有一個人——"],["p","你心裡對他有一句話："],["q","「跟他講不通。」"],["w",3],["p","可能是教會裡的一位同工。"],["p","可能是你的家人。"],["p","可能是網路上那個常常發文的弟兄。"],["p","你們信同一位主。你們讀同一本聖經。"],["p","但你們在某一件事上，就是不一樣。"],["w",3],["p","而弟兄姊妹，我要說一句實話："],["p","「跟他講不通」這句話的意思，其實是——"],["p","我已經把他歸零了。"],["w",3],["p","今天我們要讀羅馬書第十四章。"],["p","而我要先說一件事："],["p","保羅講完「愛仇敵」（12章），講完「順服政府」（13章），"],["p","最後才講這一章。"],["p","你們猜為什麼？"],["w",3],["p","因為有時候——"],["q","愛仇敵，比愛那個坐在你旁邊、卻跟你想法不一樣的弟兄，\n\n還容易一點。"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一個不是你的僕人。\n第二，一塊石頭。\n第三，一間正在蓋的房子。"],["w",3],["h","第一大段｜一個不是你的僕人（14:1–12）"],["h","當時到底在吵什麼"],["p","羅馬書14章1到2節："],["q","「信心軟弱的，你們要接納，但不要辯論所疑惑的事。\n\n有人信百物都可吃；但那軟弱的，只吃蔬菜。」"],["p","弟兄姊妹，當時羅馬教會在吵什麼？"],["p","兩件事："],["p","第一，吃什麼。"],["p","第二，第5節說的：守哪一天。"],["w",3],["p","為什麼會吵這個？"],["p","弟兄姊妹，我們這幾個禮拜一直在追蹤羅馬教會的背景："],["p","主後49年，皇帝革老丟把猶太人趕出羅馬城。"],["p","所以有好幾年，羅馬教會幾乎全部是外邦人。"],["p","那些猶太人的規矩——不吃某些肉、守安息日——就慢慢淡掉了。"],["p","然後主後54年，革老丟死了。猶太信徒陸續回來。"],["w",3],["p","弟兄姊妹，你想想那個場面。"],["p","他們回到自己的教會——"],["p","發現一切都變了。"],["p","而那些外邦弟兄看著他們，心裡想："],["p","「怎麼還在守這些？」"],["h","兩種相反的罪"],["p","而第3節，保羅同時對兩邊說話。而他用了兩個不同的字："],["q","「吃的人不可輕看不吃的人；\n\n不吃的人不可論斷吃的人。」"],["w",3],["p","「輕看」這個字，希臘文是 ἐξουθενέω。"],["p","它的字根是 οὐθέν——意思是「零」「沒有」。"],["p","所以「輕看」的字面意思是："],["q","把某個人，當作零。"],["w",3],["p","而「論斷」是 κρίνω——那是法庭的字：定罪、判決。"],["w",3],["p","弟兄姊妹，保羅的觀察太準了："],["q","強的人不會說你有罪。\n\n他只是覺得你「還不懂」——\n\n他把你歸零。"],["q","而弱的人不會看不起你。\n\n他會覺得你「墮落了」——\n\n他定你的罪。"],["p","兩種方向相反。"],["p","而保羅說：兩種都不可以。"],["h","因為神已經收了"],["p","而第3節最後給了理由："],["q","「因為神已經收納他了。」"],["p","弟兄姊妹，「收納」這個字，跟第1節「接納」是同一個字——προσλαμβάνω。"],["p","它的意思不是「容忍他存在」。"],["p","它的字面是：把某人接到自己這裡來。"],["w",3],["p","（保羅在腓利門書用同一個字，為那個逃跑的奴僕阿尼西母說情："],["p","「你就收納他，如同收納我一樣。」）"],["w",3],["p","所以第3節的邏輯是："],["q","神已經把他接進來了。\n\n那你憑什麼把他推出去？"],["h","那不是你的僕人"],["p","然後第4節。弟兄姊妹，我覺得這是全章最有力的一句話："],["q","「你是誰，竟論斷別人的僕人呢？」"],["w",3],["p","「你是誰」——這個句型我們在第九章見過。"],["p","羅馬書9章20節：「你這個人哪，你是誰，竟敢向神強嘴呢？」"],["p","同一個句型。"],["q","第九章問：你憑什麼審問神？\n\n第十四章問：你憑什麼審問神的僕人？"],["w",3],["p","而「別人的僕人」這個詞，在原文裡很具體。"],["p","「僕人」是 οἰκέτης——家裡的僕人，屬於某一家的。"],["p","「別人的」是 ἀλλότριος——屬於別人的。"],["w",3],["p","弟兄姊妹，我想像一個畫面。"],["p","你走進鄰居家。"],["p","你看見他家的傭人在做事，做得不合你的意。"],["p","你會不會走過去說：「你這樣做不對」？"],["p","不會。"],["p","為什麼？"],["q","因為——那不是你的僕人。\n\n他做得好不好，是向他的主人交代，不是向你。"],["h","而扶他的不是你"],["p","而第4節還有下半句。弟兄姊妹，這半句是全章最溫暖的："],["q","「他或站住或跌倒，自有他的主人在；\n\n而且他也必要站住，因為主能使他站住。」"],["w",3],["p","「必要站住」——這個動詞在原文是被動式。"],["p","意思是：他必被扶立。"],["p","被誰扶？"],["p","下半句說了：主。"],["w",3],["p","弟兄姊妹，我想這句話對很多人是釋放。"],["p","因為我們心裡常常有一個聲音："],["q","「如果我不盯著他，他就會倒。」\n\n「這個教會如果我不管，就完了。」"],["p","而保羅說："],["q","扶他的——\n\n不是你。"],["p","所以你可以放手。"],["h","他們都在謝飯"],["p","而第6節，弟兄姊妹，我要請大家注意一個細節。"],["q","「守日的人是為主守的。\n\n吃的人是為主吃的，因他感謝神；\n\n不吃的人是為主不吃的，也感謝神。」"],["w",3],["p","弟兄姊妹，你看見了嗎？"],["p","兩個人做的事，完全相反。"],["p","一個吃。一個不吃。"],["p","但他們在做同一個動作——"],["q","他們都在謝飯。"],["w",3],["p","而且保羅說：兩個人都是「為主」。"],["p","弟兄姊妹，這一節讓我安靜了很久。"],["p","因為它提醒我："],["q","那個跟我做法完全相反的弟兄——\n\n他也在低頭謝飯。"],["h","我們都要站在同一個地方"],["p","而第10到12節，保羅講到一個地方："],["q","「你這個人，為什麼論斷弟兄呢？又為什麼輕看弟兄呢？\n\n因我們都要站在神的臺前。」"],["w",3],["p","「臺」這個字，原文是 βῆμα。"],["p","弟兄姊妹，那是一個很具體的東西："],["p","一個高起的平臺，官長坐在上面審案子。"],["p","（馬太福音27章19節，彼拉多「坐堂」的時候——就是這個字。）"],["w",3],["p","而弟兄姊妹，有一件事我覺得很有意思。"],["p","保羅寫羅馬書的時候，人在哥林多。"],["p","而使徒行傳18章記載：保羅在哥林多，曾經被人拉到方伯迦流的「公堂」前受審——"],["p","用的就是這個字：βῆμα。"],["p","（那座審判臺的遺址，到今天還在哥林多。）"],["q","所以保羅寫「我們都要站在神的臺前」的時候，\n\n他心裡可能有一個很具體的畫面。"],["w",3],["p","而第12節說了一句話，堵死了論斷最後的藉口："],["q","「我們各人必要將自己的事在神面前說明。」"],["p","弟兄姊妹，那一天——"],["p","你不會被問：「你那個弟兄做得怎麼樣？」"],["p","你會被問："],["p","你自己。"],["w",3],["h","第二大段｜一塊石頭（14:13–18）"],["h","你可以判，但要判對東西"],["p","第13節："],["q","「所以，我們不可再彼此論斷，\n\n寧可定意誰也不給弟兄放下絆腳跌人之物。」"],["p","弟兄姊妹，「論斷」和「定意」，在原文裡是同一個動詞——κρίνω。"],["p","保羅在說："],["q","你要「判」，可以。\n\n但不要判那個人。\n\n判這件事：我不要成為他的絆腳石。"],["h","保羅站在哪一邊？"],["p","然後第14節。弟兄姊妹，這一節很重要，因為它告訴我們保羅站在哪一邊："],["q","「我憑著主耶穌確知深信，凡物本來沒有不潔淨的。」"],["w",3],["p","弟兄姊妹，你聽清楚了嗎？"],["p","保羅在神學上——"],["p","站在「強的人」那一邊。"],["p","他說：那些東西本來就沒問題。"],["p","（他在15章1節說得更明白：「我們堅固的人……」——他把自己算在裡面。）"],["w",3],["p","而然後呢？"],["p","他花了整整一章，教強的人怎麼讓步。"],["q","弟兄姊妹，這一點讓這一章的分量完全不同。\n\n這不是一個中立的人在勸架。\n\n是其中一方的人在說：我這一邊的人，要讓。"],["h","最重的那個理由"],["p","而第15節，保羅給了理由。弟兄姊妹，我認為這是全章最重的一句話："],["q","「你若因食物叫弟兄憂愁，就不是按著愛人的道理行。\n\n基督已經替他死，你不可因你的食物叫他敗壞。」"],["w",3],["p","弟兄姊妹，我要請大家把這句話聽進去："],["q","基督已經替他死。"],["w",3],["p","那個讓你覺得「跟他講不通」的人——"],["p","那個你已經歸零的人——"],["p","那個你覺得「他就是那種人」的人——"],["q","神的兒子，為他死過。"],["p","他身上——"],["p","有基督的血。"],["h","你爭的那件事，在清單上嗎？"],["p","而第17節，保羅講了一句話，我覺得應該掛在每一間教會的辦公室裡："],["q","「因為神的國不在乎吃喝，\n\n只在乎公義、和平，並聖靈中的喜樂。」"],["w",3],["p","弟兄姊妹，我要請大家注意這三樣。"],["p","公義。和平。聖靈中的喜樂。"],["p","這三個詞，正好是羅馬書前面的關鍵字："],["p","「公義」——第一章17節、第三章。因信稱義。"],["p","「和平」——第五章1節。「我們既因信稱義，就……得與神相和」。"],["p","「喜樂」——第八章、第十五章。"],["w",3],["p","而保羅說：神的國，在乎的是這三樣。"],["p","弟兄姊妹，所以我想問一個很實際的問題："],["q","你最近堅持的那件事——\n\n在不在這份清單上？"],["w",3],["p","而更扎人的是："],["q","如果它不在清單上，\n\n而你為它爭吵——\n\n你正在破壞的，是清單上的那一項：\n\n和平。"],["w",3],["p","弟兄姊妹，我要在這裡停下來說一件很重要的事。"],["p","因為這一章非常容易被誤用。"],["p","有人會說：「所以什麼都不要堅持，什麼都可以。」"],["p","不是的。"],["w",3],["p","保羅自己在別的地方，是寸步不讓的。"],["p","加拉太書2章，彼得因為怕人，就在飯桌上退縮。"],["p","保羅怎麼做？"],["p","他當面抵擋他（加2:11）。"],["p","加拉太書1章8節，他說：如果有人傳別的福音——"],["p","「就應當被咒詛。」"],["p","還有哥林多前書第5章，教會裡有明顯的、不悔改的罪——"],["p","保羅說：「把那惡人從你們中間趕出去。」"],["w",3],["q","弟兄姊妹，所以保羅有三種處理方式：\n\n福音的核心真理——絕不讓步。\n\n明顯而不悔改的罪——必須處理。\n\n而可爭議的事——接納、不論斷、為弟兄放下。"],["p","而第十四章講的，是第三種。"],["p","（至於哪些屬於第三種——那需要智慧，也需要謙卑。而保羅的態度是：寧可在界線的判斷上謙卑，也不要輕易把弟兄推出去。）"],["w",3],["h","第三大段｜一間正在蓋的房子（14:19–23；15:1–7）"],["h","兩個建築的字"],["p","弟兄姊妹，第19和20節，保羅用了兩個相反的建築用語。"],["p","第19節："],["q","「我們務要追求和睦的事與彼此建立德行的事。」"],["p","「建立」——希臘文是 οἰκοδομή。"],["p","它的字根是 οἶκος（房子）。"],["p","意思就是：蓋房子。"],["w",3],["p","然後第20節："],["q","「不可因食物毀壞神的工程。」"],["p","「毀壞」——希臘文是 καταλύω。"],["p","意思是：拆房子。"],["w",3],["p","而弟兄姊妹，καταλύω 這個字，在福音書裡用在哪裡？"],["p","馬太福音26章61節，他們控告耶穌說："],["q","「這個人曾說：『我能拆毀神的殿。』」"],["p","馬可福音13章2節，主耶穌說聖殿："],["q","「將來在這裡沒有一塊石頭留在石頭上，不被拆毀了。」"],["w",3],["p","弟兄姊妹，保羅用了一個拆聖殿的字。"],["p","而他說："],["q","不可因食物——\n\n拆毀神的工程。"],["w",3],["p","所以這裡的畫面是："],["q","神在蓋一棟房子。\n\n一磚一瓦，很慢。\n\n而你——\n\n為了一口食物，\n\n拿著鐵鎚。"],["p","弟兄姊妹，這是一個極不成比例的交易。"],["h","「如同」"],["p","而現在，我要跳到下一章的第7節。"],["p","因為第十四章講了一大堆「不可以」——"],["p","不可論斷、不可輕看、不可放絆腳石、不可拆毀。"],["p","而那個「可以做的」，在15章7節。"],["p","弟兄姊妹，這是這一整段的高峰："],["q","「所以，你們要彼此接納，\n\n如同基督接納你們一樣，\n\n使榮耀歸與神。」"],["w",3],["p","「接納」——還是那個字：προσλαμβάνω。"],["p","把人接到自己這裡來。"],["w",3],["p","但弟兄姊妹，我要請大家聽中間那三個字："],["h","「如同」。"],["w",3],["p","「如同基督接納你們一樣。」"],["w",3],["p","我想問一個問題。"],["p","基督接納你的那一天——"],["p","你是全對的嗎？"],["p","你的神學都正確嗎？"],["p","你的良心都清潔嗎？"],["p","你在每一件事上的看法，都成熟嗎？"],["w",3],["p","弟兄姊妹，我知道我不是。"],["p","而祂接納我，不是因為我合格。"],["p","是因為——"],["p","祂為我死了。"],["w",3],["p","所以15章7節的邏輯是："],["q","你要用祂接納你的方式，去接納他。"],["h","而祂自己也放下過"],["p","而15章3節，保羅給了一句話，是全段的根基："],["q","「因為基督也不求自己的喜悅。」"],["w",3],["p","弟兄姊妹，祂有沒有權利？"],["p","祂有一切的權利。"],["p","腓立比書2章6節說：祂「本有神的形像，不以自己與神同等為強奪的」。"],["p","而祂做了什麼？"],["p","「反倒虛己，取了奴僕的形像。」"],["w",3],["p","所以15章1節說："],["q","「我們堅固的人應該擔代不堅固人的軟弱，不求自己的喜悅。」"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。而它們是三個理由，一層比一層重。"],["w",3],["p","第一，他不是你的僕人。"],["p","你論斷他的時候，你坐上了一個不屬於你的位置。"],["p","而且——"],["p","扶他的不是你。是主。"],["p","所以你可以放手。"],["w",3],["p","第二，他身上有基督的血。"],["p","「基督已經替他死。」"],["p","弟兄姊妹，當你為了一件小事，準備堅持到底的時候——"],["p","請想一想那句話。"],["w",3],["p","第三，你在拆祂的房子。"],["p","神在蓋。你在拆。"],["p","而拆的理由是——"],["p","一口食物。"],["w",3],["p","弟兄姊妹，我最後要說一件事。"],["p","今天我沒有點名任何一件具體的爭議。"],["p","因為每一間教會、每一個家庭的爭議都不一樣。"],["p","但我想，你心裡剛才已經浮現了一個名字。"],["w",3],["p","如果有——"],["p","我要請你這個禮拜做一件事。"],["p","不是去說服他。"],["p","不是去糾正他。"],["w",3],["p","是去——"],["p","接納他。"],["p","（也許就是一起吃一頓飯，而且不談那件事。）"],["w",3],["p","而當你覺得做不到的時候，請記得那三個字："],["h","「如同」。"],["p","「你們要彼此接納，如同基督接納你們一樣。」"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，心裡都浮現了一個名字。\n\n主啊，我們承認：我們把他歸零了。我們在心裡說過「跟他講不通」。而我們一直以為那是因為我們比較成熟。\n\n今天祢的話說：他不是我們的僕人。他是祢的。而扶他的，也不是我們，是祢。\n\n主啊，求祢赦免我們坐上了不屬於我們的位置。\n\n也求祢提醒我們一件事：那個人身上，有祢的血。祢為他死過。\n\n主啊，我們也承認：我們常常為了一件不在清單上的事，破壞了清單上的那一項——和平。求祢憐憫。\n\n最後，主啊，求祢讓我們記得那三個字：如同。\n\n因為祢接納我們的那一天，我們也不是全對的。\n\n求祢給我們勇氣，這禮拜去接納那一個人。\n\n使榮耀歸與祢。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"15":{"min":35,"blocks":[["h","扛"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天的講題，只有一個字。"],["p","《扛》。"],["w",3],["p","我先問一個問題。"],["p","你有沒有背過人？"],["p","可能是小時候背弟弟妹妹。"],["p","可能是抱著生病的孩子走一段路。"],["p","可能是扶著年邁的父母上樓梯。"],["w",3],["p","弟兄姊妹，背人跟拿東西不一樣。"],["p","東西重了，你可以放下。"],["p","人重了——"],["p","你不能放。"],["w",3],["p","而今天我們要讀的羅馬書第十五章，第一節就用了一個字："],["q","「我們堅固的人應該擔代不堅固人的軟弱。」"],["p","「擔代」——原文是 βαστάζω。"],["p","它的意思是："],["p","扛。"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一個扛著的人。\n第二，一個接納的主。\n第三，一個捧著人的祭司。"],["w",3],["h","第一大段｜一個扛著的人（15:1–6）"],["h","這個字，我們見過"],["p","弟兄姊妹，「擔代」這個字，我們在羅馬書見過。"],["p","在第十一章。"],["p","還記得那棵橄欖樹嗎？"],["p","保羅對外邦信徒說："],["q","「你就不可向舊枝子誇口；若是誇口，當知道\n\n不是你托著根，乃是根托著你。」（11:18）"],["w",3],["p","「托著」——"],["p","就是這個字。βαστάζω。"],["w",3],["p","弟兄姊妹，你看見那個順序了嗎？"],["p","第十一章說："],["q","你不是扛的那一個。\n\n你是被扛的。"],["p","而第十五章說："],["q","所以現在——\n\n換你去扛。"],["h","這不是恩惠，是還債"],["p","而15章1節還有一個字，中文翻成「應該」。"],["p","原文是 ὀφείλω——"],["p","意思是：欠著。"],["w",3],["p","弟兄姊妹，這個字我們在13章8節見過："],["q","「凡事都不可虧欠人，惟有彼此相愛要常以為虧欠。」"],["p","同一個字。"],["w",3],["p","所以15章1節的意思是："],["q","強的人扛弱的人——\n\n不是一種美德。\n\n是一筆債。"],["h","一個必要的提醒"],["p","弟兄姊妹，講到這裡我要停一下。"],["p","因為「堅固」「不堅固」這兩個詞，非常容易被誤用。"],["p","很容易變成："],["q","「你就是那個軟弱的」「我是堅固的，所以你要聽我的」。"],["w",3],["p","我要說三件事。"],["w",3],["p","第一，這一節的責任，是放在強的人身上的。"],["p","主詞是「我們堅固的人」，動詞是「應該擔代」。"],["p","這不是特權，是責任。"],["w",3],["p","第二，「不堅固」原文是 ἀδύνατος——「沒有能力的」。"],["p","而這個字，我們在第八章見過。"],["p","羅馬書8章3節：「律法既因肉體軟弱，有所不能行的……」"],["p","同一個字根。"],["w",3],["p","第三——弟兄姊妹，這一點最重要——"],["p","還記得第七章那個人嗎？"],["q","「立志為善由得我，只是行出來由不得我。」（7:18）\n\n「我真是苦啊！」（7:24）"],["p","那個「不能」的人是誰？"],["p","是保羅自己。"],["w",3],["q","弟兄姊妹，所以沒有一個人有資格用「軟弱」去壓人。\n\n因為我們每一個人，都曾經是那個「不能」的。"],["h","力氣要用在哪裡？"],["p","而15章1節下半說："],["q","「不求自己的喜悅。」"],["p","弟兄姊妹，我想這是全本聖經對「有己」最簡單的定義："],["p","求自己的喜悅。"],["w",3],["p","但請注意，保羅沒有說：「你們堅固的人要變軟弱一點。」"],["p","他說："],["q","你是堅固的——\n\n所以你去扛。"],["w",3],["p","弟兄姊妹，謙卑不是放棄力量。"],["p","謙卑是——"],["q","改變力量的方向。"],["p","從「用我的力氣求自己的喜悅」，"],["p","變成「用我的力氣去扛別人」。"],["h","那我到底可不可以討人喜歡？"],["p","而第2節說："],["q","「我們各人務要叫鄰舍喜悅。」"],["p","弟兄姊妹，這裡有一個問題。"],["p","因為加拉太書1章10節，保羅說："],["q","「我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。」"],["p","兩節用的是同一個動詞。"],["p","那到底可不可以？"],["w",3],["p","答案在第2節的兩個限定裡："],["q","「使他得益處，建立德行。」"],["w",3],["p","弟兄姊妹，差別在動機："],["q","加1:10的「討人喜歡」——是為了我自己。\n\n怕被討厭。想被接納。想保住地位。"],["q","而羅15:2的「叫鄰舍喜悅」——是為了他。\n\n為了他得益處。為了建立他。"],["w",3],["p","同一個動作。兩種動機。"],["p","而檢驗的方法很簡單："],["q","這件事，如果沒有人知道是我做的——\n\n我還會做嗎？"],["h","唯一的理由"],["p","而第3節，保羅給了理由。"],["p","弟兄姊妹，整章講了那麼多——"],["p","而理由只有一句話："],["q","「因為基督也不求自己的喜悅。」"],["w",3],["p","保羅沒有說：「因為這樣教會才會和諧。」"],["p","他沒有說：「因為你比較成熟。」"],["p","他說："],["p","因為祂沒有。"],["w",3],["p","而第3節後半，他引了一句舊約。詩篇69篇9節："],["q","「辱罵你人的辱罵，都落在我身上。」"],["w",3],["p","弟兄姊妹，我要請大家聽清楚這句話的方向。"],["p","那些人罵的對象是誰？"],["p","經文說：「辱罵你人的」——"],["p","他們罵的是——"],["p","神。"],["w",3],["p","而那些罵，最後掉在誰身上？"],["q","「都落在我身上。」"],["w",3],["p","弟兄姊妹，祂承受的——"],["p","是本來要罵神的話。"],["w",3],["p","而我——"],["p","連一句不順耳的話，都受不了。"],["h","合一是求來的"],["p","而第5節，弟兄姊妹，這一節有一個文法細節，我覺得很重要。"],["q","「但願賜忍耐安慰的神叫你們彼此同心。」"],["p","「叫」這個字，在原文是祈願語氣——"],["p","意思是：「願祂賜給」。"],["w",3],["p","弟兄姊妹，你們注意到了嗎？"],["p","保羅講了一整章的「不可論斷、不可輕看」（第十四章）。"],["p","然後在這裡——"],["p","他禱告。"],["w",3],["q","合一不是一個技巧。\n\n合一是一個恩賜。"],["w",3],["p","弟兄姊妹，我做牧師這些年，看過很多教會處理不合一。"],["p","我們開會。我們溝通。我們調整制度。我們安排座談。"],["p","這些都是好的。"],["p","但保羅在這裡做的第一件事是——"],["p","跪下來求。"],["h","而目的是什麼？"],["p","而第6節說出了目的："],["q","「一心一口榮耀神——我們主耶穌基督的父！」"],["w",3],["p","「一心一口」——原文是兩個詞。"],["p","「一心」是 ὁμοθυμαδόν——「同一股心志」。"],["p","（使徒行傳裡「同心合意」用的就是這個字。）"],["p","「一口」是 ἐν ἑνὶ στόματι——字面是「用一張嘴」。"],["w",3],["p","弟兄姊妹，那是一個敬拜的畫面："],["q","一群人——猶太人和外邦人，強的和弱的——\n\n發出同一個聲音。"],["w",3],["p","所以請注意："],["q","合一的目的不是合一本身。\n\n是——敬拜。"],["w",3],["h","第二大段｜一個接納的主（15:7–13）"],["h","那個「如同」"],["p","弟兄姊妹，第7節是第十四章到第十五章這一整段的高潮："],["q","「所以，你們要彼此接納，\n\n如同基督接納你們一樣，\n\n使榮耀歸與神。」"],["w",3],["p","「接納」這個字，我們在第十四章見過兩次。"],["p","14章1節：「信心軟弱的，你們要接納。」"],["p","14章3節：「因為神已經收納他了。」"],["p","而現在，第15章7節——"],["p","同一個字，出現了兩次。"],["w",3],["p","但弟兄姊妹，最重的不是那個動詞。"],["p","是中間那兩個字："],["h","「如同」。"],["w",3],["p","「如同基督接納你們一樣。」"],["w",3],["p","我想問一個問題。"],["p","基督接納你的那一天——"],["p","你是全對的嗎？"],["p","你的神學都正確嗎？"],["p","你的良心都清潔嗎？"],["p","你在每一件事上的看法，都成熟嗎？"],["w",3],["p","弟兄姊妹，我知道我不是。"],["w",3],["p","而如果不是——"],["q","那你就知道，「如同」的標準有多寬了。"],["h","兩群人，兩個理由"],["p","而第8、9節，保羅做了一件很精細的事。"],["p","他為兩群人，給了兩個不同的理由："],["q","第8節：「基督是為神真理作了受割禮人的執事，要證實所應許列祖的話。」\n\n第9節：「並叫外邦人因他的憐憫榮耀神。」"],["w",3],["p","弟兄姊妹，你看見差別了嗎？"],["q","猶太人蒙恩——是因為神的真理。\n\n因為祂應許過列祖，而祂守約。"],["q","外邦人蒙恩——是因為神的憐憫。\n\n因為祂沒有應許過我們什麼。"],["w",3],["p","而這剛好對付了羅馬教會兩邊的驕傲。"],["p","猶太信徒可能想：「我們才是有應許的。」"],["p","保羅說：對——而基督來，正是為了證實那些應許。"],["p","外邦信徒可能想：「神已經把他們挪開了。」"],["p","保羅說：你們在這裡，純粹是憐憫。"],["h","這不是新聞"],["p","而第9到12節，保羅一口氣引了四段舊約。"],["p","弟兄姊妹，這四段的分佈非常講究："],["p","第9節，引詩篇18篇。"],["p","第10節，引申命記32章——那是律法書。"],["p","第11節，引詩篇117篇。"],["p","第12節，引以賽亞書11章——那是先知書。"],["w",3],["p","弟兄姊妹，保羅在做什麼？"],["q","他從律法書、先知書、詩篇——\n\n也就是猶太人所說的整本聖經的三大部分——\n\n各拿出一段證據。"],["p","他要證明什麼？"],["q","外邦人蒙恩，不是新聞。\n\n那是舊約從頭到尾的計畫。"],["w",3],["p","而這四段引文，還有一個很美的遞進："],["p","第9節：「在外邦中」——我在他們中間稱讚神。"],["p","第10節：「與主的百姓一同」——兩群人在一起了。"],["p","第11節：「外邦啊，你們當讚美主」——他們自己開口了。"],["p","第12節：「外邦人要仰望他」——他們的盼望在祂身上。"],["w",3],["p","從「在他們中間」，到「與他們一同」，到「他們自己讚美」，到「他們仰望祂」。"],["h","第二個祝福"],["p","而第13節，是整個實踐部分的祝福："],["q","「但願使人有盼望的神，因信將諸般的喜樂、平安充滿你們的心，\n\n使你們藉著聖靈的能力大有盼望！」"],["w",3],["p","弟兄姊妹，「充滿」這個動詞，跟第5節一樣——"],["p","也是祈願語氣：「願祂充滿」。"],["w",3],["p","而請注意保羅求的是什麼。"],["p","他沒有求：「願你們都意見一致。」"],["p","他求的是："],["p","喜樂。平安。盼望。"],["w",3],["p","弟兄姊妹，我想這很有智慧。"],["q","因為一群有喜樂、有平安、有盼望的人——\n\n比較不會為了食物吵架。"],["w",3],["h","第三大段｜一個捧著人的祭司（15:14–33）"],["h","保羅怎麼看自己的工作"],["p","弟兄姊妹，從15章14節開始，保羅講到他自己。"],["p","而15章16節，他用了三個聖殿的字："],["q","「使我為外邦人作基督耶穌的僕役，\n\n作神福音的祭司，\n\n叫所獻上的外邦人……可蒙悅納。」"],["w",3],["p","第一個字「僕役」——λειτουργός。那是祭司在聖殿裡供職的字。"],["p","第二個字「作祭司」——ἱερουργέω。這個字在整本新約，只出現這一次。"],["p","第三個字「所獻上的」——προσφορά。那是祭壇上的供物。"],["w",3],["p","弟兄姊妹，保羅在說什麼？"],["q","他把「傳福音」，看作一場獻祭。\n\n他自己是祭司。\n\n而祭壇上的供物是——\n\n那些歸主的人。"],["w",3],["p","弟兄姊妹，我要說一句實話。"],["p","我們談事工，很容易談成別的東西。"],["p","「這個月有幾個人？」「聚會人數成長了沒有？」"],["p","而慢慢地——"],["p","人，變成了數字。"],["w",3],["p","而15章16節說：不是的。"],["q","你不是在「做一件事」。\n\n你是祭司。\n\n而你手上捧著的——\n\n是要獻到神面前的人。"],["w",3],["p","而那個供物，憑什麼被收下？"],["p","經文說：「因著聖靈成為聖潔。」"],["p","這是一個被動式："],["q","不是因為它本身好。\n\n是因為——有一位把它分別為聖了。"],["h","跟我一起下場"],["p","而15章30節，我要講今天最後一個字。"],["q","「弟兄們……\n\n勸你們與我一同竭力，為我祈求神。」"],["w",3],["p","「一同竭力」——原文是 συναγωνίσασθαι。"],["p","它由兩個部分組成："],["p","σύν ——「一同」。"],["p","ἀγωνίζομαι ——「在競技場上搏鬥」。"],["w",3],["p","弟兄姊妹，ἀγών 這個字，是「格鬥、拚命」的意思。"],["p","（英文說的 agony——「極度的痛苦」——就是從這個字根來的。）"],["p","而更重要的是："],["q","路加福音22章44節，形容主耶穌在客西馬尼「極其傷痛」——\n\n用的就是這個字根。"],["w",3],["p","所以保羅請人為他禱告的時候，他說的是："],["h","跟我一起下場。"],["w",3],["p","弟兄姊妹，我要問一個扎人的問題。"],["p","我們說「我會為你禱告」的時候——"],["p","那是下場，還是揮手？"],["h","而這個禱告，蒙應允了嗎？"],["p","弟兄姊妹，最後我要講一件事。"],["p","保羅在15章31、32節求了什麼？"],["q","「叫我脫離在猶太不順從的人……\n\n並叫我……歡歡喜喜地到你們那裡。」"],["w",3],["p","後來呢？"],["p","使徒行傳21章：他到了耶路撒冷——"],["p","被抓了。"],["p","然後坐監兩年。"],["p","然後坐船去羅馬——"],["p","船壞了。"],["p","最後，使徒行傳28章16節：他到了羅馬。"],["w",3],["p","但是——"],["p","戴著鎖鏈。"],["p","（他自己在徒28章20節說：「我為以色列人所指望的，被這鍊子捆鎖。」）"],["w",3],["p","所以我要問："],["p","那個禱告，蒙應允了嗎？"],["w",3],["p","弟兄姊妹，請聽使徒行傳28章15節："],["q","「那裡的弟兄們一聽見我們的信息，就出來……迎接我們。\n\n保羅見了他們，就感謝神，放心壯膽。」"],["w",3],["p","他求的是什麼？"],["p","「叫我歡歡喜喜地到你們那裡。」"],["p","而聖經說：他見了他們，就感謝神，放心壯膽。"],["w",3],["q","他到了。\n\n他也歡歡喜喜了。\n\n只是——\n\n方式跟他想的，完全不一樣。"],["w",3],["p","弟兄姊妹，如果你今天有一個禱告，禱告了很久，事情卻不照你想的走——"],["p","我想把這一段送給你。"],["q","神應允了。\n\n用祂的方式。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["w",3],["p","第一，一個扛著的人。"],["p","你曾經是被扛的（11:18）。"],["p","所以現在——換你去扛。"],["p","而唯一的理由是：因為基督也不求自己的喜悅。"],["p","祂承受的，是本來要罵神的話。"],["w",3],["p","第二，一個接納的主。"],["p","「彼此接納，如同基督接納你們一樣。」"],["p","而祂接納你的那一天，你不是全對的。"],["w",3],["p","第三，一個捧著人的祭司。"],["p","你不是在做事。"],["p","你是祭司——手上捧著要獻到神面前的人。"],["w",3],["p","弟兄姊妹，我最後要說一件事。"],["p","第十五章有一個很美的骨架。"],["p","保羅在這一章裡，用了三個不同的稱呼來稱呼神。"],["p","而每一個，都在祝福的位置："],["w",3],["p","15章5節：「賜忍耐安慰的神。」"],["p","15章13節：「使人有盼望的神。」"],["p","15章33節：「賜平安的神。」"],["w",3],["p","忍耐。安慰。盼望。平安。"],["w",3],["p","弟兄姊妹，你們知道嗎——"],["p","這一章講的，是一間因為食物和日子而緊張的教會。"],["p","而保羅為他們求的，正是他們最缺的那些東西。"],["w",3],["p","所以我今天要用第33節，作為結束的祝福。"],["p","而請注意最後那三個字："],["q","「願賜平安的神，\n\n常和你們眾人同在。\n\n阿們！」"],["w",3],["p","不是「與那些對的人」。"],["p","是——"],["p","眾人。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，先承認一件事：我們常常忘了，我們是被扛的那一個。\n\n主啊，第十一章說：不是我們托著根，乃是根托著我們。而我們一站穩了，就開始覺得自己在扛。\n\n求祢提醒我們：我們有的力氣，是拿來扛人的，不是拿來求自己喜悅的。\n\n主啊，我們也承認：我們接納人，心裡總有一把尺。而今天祢的話說：「如同基督接納你們一樣。」\n\n主啊，祢接納我們的那一天，我們也不是全對的。求祢用祢的度量，重新量我們的度量。\n\n我們也把教會的不合一帶到祢面前。主啊，我們常常想用開會、用溝通、用制度來解決。而祢的話說：合一是求來的。\n\n所以現在我們求：但願賜忍耐安慰的神，叫我們彼此同心，一心一口榮耀祢。\n\n最後，主啊，我們當中有人禱告了很久，事情卻不照他想的走。\n\n求祢讓他今天聽見：保羅到了羅馬，戴著鎖鏈——但他感謝神，放心壯膽。\n\n祢應允了。用祢的方式。\n\n願賜平安的神，常和我們眾人同在。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"16":{"min":35,"blocks":[["h","名字"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天，是我們讀羅馬書的最後一講。"],["w",3],["p","這幾個月，我們一起走過了十六章。"],["p","我們讀過「世人都犯了罪，虧缺了神的榮耀」。"],["p","讀過「但如今，神的義……已經顯明出來」。"],["p","讀過「如今，那些在基督耶穌裡的就不定罪了」。"],["p","讀過「深哉，神豐富的智慧和知識」。"],["p","讀過「所以……將身體獻上，當作活祭」。"],["p","讀過「你們要彼此接納，如同基督接納你們一樣」。"],["w",3],["p","而今天，我要問一個問題："],["q","這麼偉大的一卷書——\n\n它是怎麼結束的？"],["w",3],["p","弟兄姊妹，答案可能會讓你意外。"],["p","羅馬書的結尾，是——"],["p","一份名單。"],["w",3],["p","第十六章，保羅一個一個地問安。"],["p","點名的個人超過二十六位。"],["p","還有一些名字，我們念都念不太順："],["p","土非拿氏。土富撒氏。亞遜其土。希羅天。非羅羅古。"],["w",3],["p","弟兄姊妹，我要老實說：我第一次認真讀第十六章的時候，心裡有一個念頭："],["p","「這一章……可以跳過吧？」"],["p","而後來我發現——"],["q","這一章，可能是整卷書最有力的證據。"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一份名單。\n第二，一個警告。\n第三，一段頌讚。"],["w",3],["h","第一大段｜一份名單（16:1–16）"],["h","一位帶信的姊妹"],["p","弟兄姊妹，第十六章從一個人開始。"],["p","第1、2節："],["q","「我對你們舉薦我們的姊妹非比，她是堅革哩教會中的女執事。\n\n請你們為主接待她……她在何事上要你們幫助，你們就幫助她；\n\n因她素來幫助許多人，也幫助了我。」"],["w",3],["p","「舉薦」這個字，希臘文是 συνίστημι。"],["p","弟兄姊妹，這在第一世紀是一個專門用語——"],["p","它是推薦信用的字。"],["w",3],["p","那個時代，一個人要到陌生的城市，需要一封推薦信，"],["p","好讓當地的人知道：這個人可以接待，是自己人。"],["w",3],["p","而16章1到2節，正是一封標準推薦信的格式。"],["p","所以多數的解經家判斷："],["q","非比，極可能就是把這封信從哥林多帶到羅馬的那個人。"],["w",3],["p","弟兄姊妹，如果是這樣的話——"],["q","人類歷史上，第一個把羅馬書送到羅馬的人，\n\n是一位姊妹。"],["w",3],["p","而第2節說她「素來幫助許多人」。"],["p","「幫助」這個字，原文是 προστάτις。"],["p","和合本譯得比較輕。原文的意思是："],["q","「保護人、資助者」——\n\n一個有地位或財力，為別人提供保護與支持的人。"],["p","保羅說：她是許多人的保護人——"],["p","「也幫助了我」。"],["h","二十六個名字"],["p","然後從第3節開始，保羅就一路寫名字。"],["p","弟兄姊妹，我唸幾個給大家聽："],["p","百基拉。亞居拉。以拜尼土。馬利亞。安多尼古。猶尼亞。暗伯利。耳巴奴。士他古。亞比利。希羅天。土非拿氏。土富撒氏。彼息氏。魯孚。亞遜其土。弗勒干。黑米。八羅巴。黑馬。非羅羅古。猶利亞。尼利亞……"],["w",3],["p","超過二十六位。"],["p","而其中——"],["p","至少九位是女性。"],["h","但最動人的不是名字"],["p","弟兄姊妹，最動人的不是他記得名字。"],["p","是——"],["q","他記得每一個人做過什麼。"],["p","你們聽："],["p","「非比……她素來幫助許多人，也幫助了我。」"],["p","「百基拉和亞居拉……也為我的命將自己的頸項置之度外。」"],["p","（「頸項置之度外」——原文的字面是：把自己的脖子放上去。那是一個斬首的畫面。）"],["p","「以拜尼土……他在亞西亞是歸基督初結的果子。」"],["p","「馬利亞……她為你們多受勞苦。」"],["p","「安多尼古和猶尼亞……與我一同坐監。」"],["p","「亞比利……在基督裡經過試驗的。」"],["w",3],["p","弟兄姊妹，「亞比利」這一個描述，我停了很久。"],["p","「經過試驗的」——原文是 δόκιμος。"],["p","那個字，是說金屬經過火煉之後，還在的那個部分。"],["w",3],["p","我們不知道亞比利經歷過什麼。"],["p","聖經沒有記載。"],["p","但——"],["p","保羅記得。"],["h","一個字，用在四位姊妹身上"],["p","而「勞苦」這個字，希臘文是 κοπιάω。"],["p","弟兄姊妹，它的意思不是「服事」。"],["p","它的意思是："],["q","做到筋疲力盡的苦工。"],["w",3],["p","而這個字在第十六章出現了四次。"],["p","馬利亞。土非拿氏。土富撒氏。彼息氏。"],["p","四次——"],["p","全部用在女性身上。"],["w",3],["p","（我要順帶誠實地說一句：第1節的非比、第7節的猶尼亞，牽涉到一些解經上的討論，"],["p","敬虔的學者有不同的理解。"],["p","但有一件事沒有人爭議："],["p","保羅高度尊重她們，並且記得她們做過什麼。）"],["h","一句最溫暖的話"],["p","而第13節，弟兄姊妹，這半句話我每次讀都會停下來："],["q","「又問在主蒙揀選的魯孚和他母親安；\n\n他的母親就是我的母親。」"],["w",3],["p","弟兄姊妹，保羅顯然不是說她生了他。"],["p","他是說："],["q","這位姊妹，待我如同待自己的兒子。"],["w",3],["p","而我要請大家想一件事。"],["p","保羅是一個什麼樣的人？"],["p","他一生在路上。"],["p","坐監。船壞。被打。被石頭打。被趕出城。"],["p","他沒有家。"],["w",3],["p","而在某一個城市，有一位姊妹——"],["p","把他當兒子。"],["w",3],["p","弟兄姊妹，這就是教會。"],["p","（而關於「魯孚」，有一個有意思的可能：馬可福音15章21節提到，替耶穌背十字架的古利奈人西門，是「亞歷山大和魯孚的父親」。"],["p","有學者認為可能是同一位——但這無法確定，我不敢說死。）"],["h","一條隱藏的線"],["p","弟兄姊妹，讀名單的時候很容易只看見名字。"],["p","但如果你留意，會發現一個詞組一直出現："],["p","第2節：「請你們為主接待她。」"],["p","第3節：「他們在基督耶穌裡與我同工。」"],["p","第7節：「也是比我先在基督裡。」"],["p","第8節：「我在主裡面所親愛的。」"],["p","第10節：「在基督裡經過試驗的。」"],["p","第11節：「拿其數家在主裡的人。」"],["p","第12節：「為主勞苦的……為主多受勞苦的。」"],["p","第13節：「在主蒙揀選的魯孚。」"],["p","第22節：「我這代筆寫信的德丟，在主裡面問你們安。」"],["w",3],["p","弟兄姊妹，「在主裡」在這一章出現十次以上。"],["p","那不是客套話。"],["q","那是把整份名單串起來的那條線。"],["w",3],["p","而「在基督裡」，正是整卷羅馬書的核心："],["p","8章1節：「如今，那些在基督耶穌裡的就不定罪了。」"],["p","8章39節：「這愛是在我們主基督耶穌裡的。」"],["w",3],["p","所以第十六章在做什麼？"],["q","它把「在基督耶穌裡」這個詞——\n\n一個一個地，填上名字。"],["h","這是一間什麼樣的教會？"],["p","弟兄姊妹，我要請大家從這份名單，看一件事。"],["p","名單裡有一些名字——"],["p","在當時是奴隸和釋奴常用的名字。"],["p","（暗伯利、耳巴奴、黑米、彼息氏、非羅羅古、尼利亞……）"],["w",3],["p","而第23節提到一個人："],["q","「城內管銀庫的以拉都。」"],["p","那是一個公職——城市的財務管理者。"],["w",3],["p","弟兄姊妹，你看見了嗎？"],["q","在同一封信裡被問安的人當中——\n\n有城市的財政官員，\n\n也有奴隸出身的信徒。\n\n而保羅，用同一個詞問他們安。"],["w",3],["p","這就是十五章的神學，長出來的樣子。"],["w",3],["h","第二大段｜一個警告（16:17–20）"],["h","溫暖之後，是清醒"],["p","弟兄姊妹，讀完十四節的問安，我們心裡是暖的。"],["p","然後第17節，保羅的語氣突然變了："],["q","「弟兄們，那些離間你們、叫你們跌倒、背乎所學之道的人，\n\n我勸你們要留意躲避他們。」"],["w",3],["p","「留意」這個字，希臘文是 σκοπέω——"],["p","它的字根是「目標、標的」（英文 scope 就是從這個字來的）。"],["p","意思是：盯著看。"],["w",3],["p","弟兄姊妹，保羅沒有說「不要理他們」。"],["p","他說："],["q","先盯著看清楚——\n\n然後轉開。"],["p","分辨在前，避開在後。"],["h","一個聽起來很好的東西"],["p","而第18節，保羅描述了那些人："],["q","「因為這樣的人不服事我們的主基督，只服事自己的肚腹，\n\n用花言巧語誘惑那些老實人的心。」"],["w",3],["p","弟兄姊妹，「花言巧語」這個字，我一定要跟大家分享。"],["p","原文是 χρηστολογία。"],["p","它在整本新約，只出現這一次。"],["w",3],["p","而它是由兩個部分組成的："],["p","λόγος ——「話」。"],["p","χρηστός ——「良善的、恩慈的」。"],["w",3],["p","弟兄姊妹，χρηστός 這個字，我們在羅馬書見過。"],["p","它的名詞形是 χρηστότης——"],["p","羅馬書2章4節："],["q","「還是你藐視他豐富的恩慈（χρηστότης）、寬容、忍耐，\n\n不曉得他的恩慈是領你悔改呢？」"],["w",3],["p","同一個字根。"],["w",3],["p","弟兄姊妹，你聽出來了嗎？"],["q","神的恩慈，是真的——而且領人悔改。\n\n而他們的「聽起來很恩慈的話」，是假的——用來誘惑人。"],["w",3],["q","弟兄姊妹，這是一個很嚴肅的提醒：\n\n假的東西，常常長得跟真的——\n\n很像。"],["h","那是蛇的方法"],["p","而第18節還有一個字，我覺得是本章最精彩的線索。"],["p","「誘惑那些老實人的心」——原文是 ἐξαπατάω。"],["w",3],["p","弟兄姊妹，這個字我們在羅馬書第七章見過。"],["p","7章11節："],["q","「因為罪趁著機會，就藉著誡命引誘（ἐξηπάτησέν）我，並且殺了我。」"],["w",3],["p","而那個字，來自哪裡？"],["p","創世記3章13節。夏娃說："],["q","「那蛇引誘我，我就吃了。」"],["p","（哥林多後書11章3節也用這個字：「就像蛇用詭詐誘惑了夏娃一樣。」）"],["w",3],["p","所以保羅在說什麼？"],["q","那些離間的人，用的是——\n\n蛇的方法。"],["h","而那條蛇，快要被踩碎了"],["p","弟兄姊妹，然後第20節。"],["p","而我要請大家注意，這一節緊接在第18節後面："],["q","「賜平安的神快要將撒但踐踏在你們腳下。」"],["w",3],["p","「踐踏」這個字，原文是 συντρίβω——意思是：壓碎。"],["w",3],["p","而弟兄姊妹，這句話的背後是什麼？"],["p","是創世記第三章。"],["p","創3章15節："],["q","「女人的後裔要傷你的頭。」"],["w",3],["p","你們看見保羅的安排了嗎？"],["p","第18節：他們用蛇的方法（ἐξαπατάω ＝ 創3:13）。"],["p","第20節：而那條蛇，快要被踩碎（συντρίβω ＝ 創3:15）。"],["w",3],["p","弟兄姊妹，這不是巧合。"],["p","保羅在信的最後，把我們帶回到聖經最古老的那個應許。"],["h","一個很重要的提醒"],["p","弟兄姊妹，講到這裡，我必須說一件很重要的事。"],["p","因為第17節，是一節很容易被誤用的經文。"],["w",3],["p","它很容易變成："],["q","「他跟我意見不同——他就是16章17節那種人。」"],["w",3],["p","所以請大家看清楚保羅給的判準。"],["p","他列了五樣："],["p","第一，離間——造成分裂。"],["p","第二，叫人跌倒——放陷阱。"],["p","第三，背乎所學之道。"],["p","第四，不服事主，只服事自己的肚腹。"],["p","第五，用花言巧語誘惑老實人。"],["w",3],["p","弟兄姊妹，請注意第三項：「背乎所學之道」。"],["p","那是一個客觀的、教義上的標準——"],["p","不是「他不同意我的看法」。"],["w",3],["q","判準不是「跟我意見不同」。\n\n判準是：背離所傳的道 ＋ 以分裂為手段 ＋ 以自己為目的。"],["w",3],["p","（而弟兄姊妹，這一點跟我們前幾週讀的第十四章完全不衝突。"],["p","第十四章說：接納那些跟你不一樣的弟兄。"],["p","第十六章說：躲避那些以分裂為手段、以自己為目的的人。"],["p","兩章講的是完全不同的人。"],["p","接納——不等於沒有界線。）"],["w",3],["h","第三大段｜一段頌讚（16:21–27）"],["h","一個寫字的人"],["p","弟兄姊妹，第21節開始，是保羅身邊同工們的問安。"],["p","而第22節，有一句話我很喜歡："],["q","「我這代筆寫信的德丟，在主裡面問你們安。」"],["w",3],["p","弟兄姊妹，在第一世紀，長信通常由專業的代筆人書寫。"],["p","保羅口述。德丟一筆一筆地寫。"],["w",3],["p","十六章。"],["p","幾個小時，甚至幾天。"],["w",3],["p","而寫到問安的部分，保羅可能停了一下——"],["p","然後德丟說：「我……可以也問個安嗎？」"],["w",3],["p","弟兄姊妹，你看保羅怎麼做的："],["q","他讓那個幫他寫字的人，\n\n在他自己的書信裡——\n\n留下名字。"],["h","回到起點"],["p","而現在，我們來到全卷羅馬書的最後三節。"],["p","弟兄姊妹，我要請大家注意一件事。"],["p","第25節說："],["q","「惟有神能……堅固你們的心。」"],["w",3],["p","「堅固」這個字，希臘文是 στηρίζω。"],["w",3],["p","弟兄姊妹，這個字我們在第一章見過。"],["p","羅馬書1章11節，保羅說："],["q","「因為我切切地想見你們，\n\n要把些屬靈的恩賜分給你們，使你們可以堅固。」"],["w",3],["p","同一個字。"],["w",3],["p","第一章：「我想去堅固你們。」"],["p","第十六章：「惟有神能堅固你們的心。」"],["w",3],["q","弟兄姊妹，那是——\n\n一卷書的距離。"],["w",3],["p","而保羅並沒有變得消極。"],["p","他仍然在計畫去西班牙。他仍然在請人代禱。他仍然一個一個地寫名字。"],["p","他只是——"],["p","知道了。"],["q","堅固人的，不是我。"],["h","一個把整卷書框起來的詞"],["p","而第26節，還有一個詞。"],["p","「使他們信服真道。」"],["p","原文是：εἰς ὑπακοὴν πίστεως ——「以致於信心的順服」。"],["w",3],["p","弟兄姊妹，這個詞組在整卷羅馬書，只出現兩次。"],["p","一次在第一章第5節："],["q","「在萬國之中叫人為他的名信服真道。」"],["p","另一次——"],["p","就是這裡。第十六章第26節。"],["w",3],["p","一頭。"],["p","一尾。"],["q","保羅用同一句話，\n\n把整卷書——\n\n框了起來。"],["h","最後一句"],["p","而第27節，是羅馬書的最後一句："],["q","「願榮耀因耶穌基督歸與獨一全智的神，\n\n直到永遠。阿們！」"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["w",3],["p","第一，一份名單。"],["p","保羅記得的不只是名字，是他們做過什麼。"],["p","而那份名單裡，有奴隸，有官員，有九位以上的姊妹，"],["p","還有一位——把保羅當兒子的母親。"],["w",3],["p","第二，一個警告。"],["p","有些人要提防——"],["p","但判準是背乎所學之道，不是「跟我意見不同」。"],["p","而他們用的是蛇的方法。"],["p","好消息是：那條蛇，快要被踩碎了。"],["w",3],["p","第三，一段頌讚。"],["p","「我想去堅固你們」——變成了「惟有神能堅固你們的心」。"],["p","那是一卷書的距離。"],["w",3],["p","弟兄姊妹，我最後要說一件事。"],["p","我們這幾個月讀了羅馬書。"],["p","這是全本聖經最偉大的神學論文之一。"],["p","它講稱義。講聖靈。講揀選。講奧祕。"],["p","而它的結尾——"],["p","是一份名單。"],["w",3],["p","我想，這件事本身，就是一篇講道。"],["q","因為神從來不是在拯救「人類」。\n\n祂是在拯救——\n\n有名字的人。"],["w",3],["p","主耶穌說過一句話。約翰福音10章3節："],["q","「他按著名叫自己的羊。」"],["w",3],["p","弟兄姊妹，所以我今天要給大家一個作業。"],["p","很簡單。"],["w",3],["p","回去拿一張紙。"],["p","寫下十個名字。"],["p","教會裡的、你身邊的。"],["w",3],["p","然後在每一個名字後面，寫一句話："],["p","「他做過什麼。」"],["w",3],["p","然後——"],["p","這禮拜，跟其中一位說出來。"],["w",3],["p","因為弟兄姊妹，"],["p","十六章的神學，最後落在哪裡？"],["p","落在一個一個——"],["p","有名字的人身上。"],["w",3],["p","而那份名單上，"],["p","也有你的名字。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天讀完了羅馬書。\n\n主啊，這幾個月祢的話對我們說了很多。祢說我們都犯了罪；祢說但如今神的義顯明了；祢說在基督裡就不定罪了；祢說沒有什麼能叫我們與祢的愛隔絕。\n\n而今天，祢用一份名單提醒我們：這一切最後要落在人身上。\n\n主啊，求祢赦免我們——我們常常把事工做成數字，把人做成人次。我們記得誰有用，卻不記得誰做過什麼。\n\n求祢讓我們像保羅一樣，記得名字，也記得他們做過什麼。\n\n主啊，也求祢給我們分辨的心。求祢讓我們守住界線，卻不用界線去排除跟我們不一樣的弟兄。\n\n也謝謝祢：那些用蛇的方法的，祢說那條蛇快要被踩碎了。\n\n最後，主啊——\n\n我們承認：堅固人的，不是我們。惟有祢能堅固我們的心。\n\n願榮耀因耶穌基督歸與獨一全智的祢，直到永遠。\n\n阿們。"],["w",3]]}}}</script>
<script>/* ===== 321聖經講義｜羅馬書 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && o.v === 1) return o; } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, prac:{}, mem:{}, set:{ fs:1, grk:1, dark:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

/* ===== 進度 ===== */
const STEPS = [
  ['資訊','讀完本章卡片'], ['啟示','讀經文，寫下你看見的一件事'], ['信服','記住本章金句'],
  ['實踐','選一項本週操練'], ['檢討','第七天回填：做了嗎'], ['修正','回到哪一節重讀'],
  ['反覆','複習通過三次'], ['繁殖','講給一位課外的人聽'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

/* ===== 複習 ===== */
function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

function say(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, ''));
  u.lang = 'zh-TW'; u.rate = 0.94;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H = 96, pad = 14;
  const x = c => pad + (c - 1) / 15 * (W - pad * 2);
  const y = v => 10 + v / 100 * (H - 26);
  let d = `M ${x(1)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(16)} ${y(30)}`;
  const labs = P.filter(p => p[4]).map(p => {
    const yy = p[4] === 'bot' ? y(p[1]) + 11 : y(p[1]) - 6;
    return `<text class="tlab ${p[4] === 'top' ? 'hi' : ''}" x="${x(p[0]).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="middle">${esc(p[3])}</text>`;
  }).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  return `<div class="terrain"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="羅馬書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">兩個最低點 · 兩個「如今」 · 一個「所以」</p></div>`;
}

function openV(ref){

  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">

      <span class="caret">${on ? '▾' : '▸'}</span></div>

  };
  let h = `<h4>羅馬書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}

    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}

    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];

  sheet(h);

const TTS_DB = 'r321_tts';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}
