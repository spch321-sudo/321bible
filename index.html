<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321 Bible Study">
<meta name="application-name" content="321 Bible Study">
<meta name="description" content="321 Bible Study | Romans — all sixteen chapters: exposition, sermon outlines, and living out the 3-2-1.">
<title>321 Bible Study | Romans</title>
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">

<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --sans:"Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── header ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.02em}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}

/* ── tab bar ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:10px;letter-spacing:.02em;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── shared ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:14px}
.xs{font-size:12.5px}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── terrain ── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── chapter list ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── Scripture ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── six layers ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── tables ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── word tracks ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── disputed passages ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── level badges ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── check-ins ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── bottom sheet ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── misc ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:17px;line-height:1.75;margin:0 0 4px}
.tip{font-size:13.5px;color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── full-screen (pulpit / group) ── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* teleprompter */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* group */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* search */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── branding & splash ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── highlights & reflections ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkp{cursor:pointer;border-radius:6px;transition:background .15s}
.mkp:active{background:var(--line)}
.mkp.hl{background:linear-gradient(transparent 60%, rgba(156,107,24,.3) 60%)}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:14.5px;line-height:1.8
}
.mknote b{color:var(--brass);font-size:12px;letter-spacing:.1em}
.mkask{
  display:inline-block;margin-left:8px;border:1px solid var(--line);background:var(--card);
  color:var(--pine);border-radius:8px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer
}
.mkq{
  font-family:var(--serif);font-size:16px;line-height:1.85;border-left:3px solid var(--brass);
  padding:8px 0 8px 12px;margin:6px 0 12px;color:var(--dusk)
}
.hlq{font-family:var(--serif);font-size:15.5px;line-height:1.8;margin:0;cursor:pointer}
.btn.xs2{font-size:12.5px;padding:6px 11px}
.mkhint{
  font-size:12.5px;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:9px;padding:9px 11px;margin:4px 0 12px;line-height:1.75
}

/* ── audio status bar ── */
.spkbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));z-index:110;
  display:flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--paper);border-radius:999px;
  padding:8px 8px 8px 15px;font-size:13.5px;max-width:calc(100% - 32px);
  box-shadow:0 6px 24px rgba(0,0,0,.22)
}
.spkbar b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.spkbar .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.spkbar button{
  border:0;background:rgba(255,255,255,.16);color:inherit;width:30px;height:30px;
  border-radius:50%;font-size:13px;cursor:pointer;flex:0 0 auto
}

/* ── Sage ── */
.xzfab{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:70;
  width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
  background:var(--pine);color:#fff;font-size:21px;
  box-shadow:0 8px 26px rgba(31,77,61,.4);display:grid;place-items:center
}
html[data-dark="1"] .xzfab{color:#0E1412}
.xz{position:fixed;inset:0;z-index:150;display:none}
.xz.on{display:block}
.xzmask{position:absolute;inset:0;background:rgba(10,16,14,.44)}
.xzcard{
  position:absolute;left:0;right:0;bottom:0;max-height:86vh;
  background:var(--paper);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:up .22s ease
}
.xzh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.xzh b{font-family:var(--serif);font-size:17px}
.xzb{flex:1;overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.xzm{
  max-width:88%;padding:11px 14px;border-radius:15px;margin:0 0 11px;
  font-size:15px;line-height:1.85;white-space:normal
}
.xzm.user{background:var(--pine);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
html[data-dark="1"] .xzm.user{color:#0E1412}
.xzm.assistant{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.xzm.xzwait{opacity:.6;font-style:italic}
.xzspk{
  display:block;margin-top:8px;border:1px solid var(--line);background:transparent;
  color:var(--dusk);border-radius:8px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer
}
.xzhi{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:15px;line-height:1.85;margin-bottom:12px
}
.xzq{display:flex;flex-direction:column;gap:7px}
.xzq button{
  text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:11px;padding:11px 13px;font:inherit;font-size:14.5px;cursor:pointer;line-height:1.7
}
.xzf{
  display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)
}
.xzf input{
  flex:1;border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:inherit;font:inherit;font-size:16px;padding:11px 13px
}

/* ── 語音選擇 ── */
.vrow{display:flex;gap:8px}
.vpill{
  flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:13px;padding:11px 6px;font:inherit;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:3px;transition:all .15s
}
.vpill{text-decoration:none}
.vpill b{font-size:15px;font-weight:600}
.vpill span{font-size:11.5px;color:var(--dusk);line-height:1.4}
.vpill.on{background:var(--pine);border-color:var(--pine);color:#fff}
.vpill.on span{color:rgba(255,255,255,.75)}
html[data-dark="1"] .vpill.on{color:#0E1412}
html[data-dark="1"] .vpill.on span{color:rgba(0,0,0,.6)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash">
  <img id="splashIcon" alt="321 Bible Study">
  <h2>321 Bible Study</h2>
  <p>ROMANS</p>
  <small>KINGDOM 321 ONLINE FELLOWSHIP</small>
</div>

<header class="top">
  <div class="bar">
    <button class="ico hide" id="back" aria-label="Back">‹</button>
    <img class="brand" id="brand" alt="">
    <h1 id="ttl">321 Bible Study</h1>
    <button class="ico" id="spk" aria-label="Read aloud">🔊</button>
    <button class="ico" id="fsz" aria-label="Text size">Ａ</button>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"I Am Not Ashamed of the Good News","sub":"Three Exchanges","lv":"A","arc":"Exposure","q":"How did people ever come to this? And isn't God's wrath too severe?","truth":"Humanity exchanged God away; and in the gospel, God exchanged righteousness in.","mv":{"t":"For I am not ashamed of the Good News of Christ, because it is the power of God for salvation for everyone who believes.","r":"Romans 1:16"},"card":["Sin does not begin with murder or violence. It begins with not glorifying God and not giving thanks.","People made three exchanges: they exchanged God's glory, they exchanged the truth, and they exchanged their own nature.","And God's answer was to 'give them over' three times — He let go, and let people have exactly what they insisted on."],"sec":[["1:1–7","Greeting: the gospel, a servant, all nations"],["1:8–15","Why Paul longed to come to Rome"],["1:16–17","The theme: the righteous shall live by faith"],["1:18–32","Wrath revealed: three exchanges, three surrenders"]],"serm":{"pts":[["I. A Man Who Was Not Ashamed","1:1–17","The gospel is the power of God — not the power of my persuasion"],["II. Three Exchanges","1:21–27","When people exchanged God away, they exchanged themselves away too"],["III. Three Times 'Gave Them Over'","1:24–28","The most terrifying judgement is when God lets go"]]},"self":"Not glorifying God, not giving thanks — taking God off the throne and treating myself as the source.","t321":{"k":"Who is on the throne? Sin begins with sovereignty, not with behaviour.","g":"The power of the gospel does not rest on the one who preaches it.","p":"A person who never gives thanks cannot build God's system."},"grp":["Since you came to faith, what has been your biggest misunderstanding about God?","Why is 'not giving thanks' the starting point of sin? What does that say to you?","When did you last truly say 'thank you' to God — and mean it?","What does it stir in you that God would simply 'give people over'?","This week, what is one thing you will open your mouth and thank God for again?"],"prac":{"main":"Every night this week, write down three specific things you are thankful to God for. Seven days.","items":["Toward God — pray once with nothing but thanks; ask for nothing","Toward yourself — write down what you have been treating as your source","Toward others — tell one person what you are thankful for in them","Toward daily life — actually give thanks before every meal this week"]},"safe":["1:18 'wrath' is not a loss of temper — it is holiness responding to sin. Do not preach it as 'God got angry'.","The three 'gave them over' are judicial release, not God actively causing people to sin.","1:26–27 must be preached from the text, with pastoral warmth. Never use it to shame anyone.","Do not preach 1:20 as 'so people can be saved without hearing the gospel'. The point is that they are without excuse."]},{"n":2,"t":"That Measuring Stick Will Turn Around","sub":"A Stick, an Account, a Knife","lv":"A","arc":"Conviction","q":"I haven't done any of those things — surely I count as a good person?","truth":"The measuring stick you use on other people will turn around and measure you.","mv":{"t":"Therefore you are without excuse, O man, whoever you are who judge. For in that which you judge another, you condemn yourself.","r":"Romans 2:1"},"card":["Chapter 1 was about 'those people'. Chapter 2 says: so are you.","God's kindness is not indulgence. It is meant to lead you to repentance.","A true Jew is not one outwardly; true circumcision is of the heart, in the spirit."],"sec":[["2:1–5","The stick turns around"],["2:6–11","He will repay each according to his works"],["2:12–16","Gentiles without the law, and conscience"],["2:17–29","True circumcision is of the heart"]],"serm":{"pts":[["I. A Stick That Turns Around","2:1–5","What you condemn is exactly what you are doing"],["II. An Account Kept Until That Day","2:5–11","Storing up wrath is a kind of storing up too"],["III. A Knife That Cuts Inward","2:25–29","Circumcision is of the heart, by the Spirit, not the letter"]]},"self":"Taking the judge's seat — measuring others by God's standard, and never myself.","t321":{"k":"To judge is to sit in a seat that does not belong to me.","g":"An outward mark can never take the place of an inward life.","p":"A community that judges one another cannot be God's system."},"grp":["When did you last judge someone in your heart? What was it about?","'God's kindness leads you to repentance' — how do you understand that?","Is there something you require of others that you cannot do yourself?","'The one who is a Jew inwardly' — what does that say to you?","This week, who do you need to apologise to, or take a sentence back from?"],"prac":{"main":"This week, whenever you are about to judge someone, stop and ask: have I done this myself?","items":["Toward God — ask Him to let you see yourself","Toward yourself — count how many times you judged this week","Toward others — say nothing negative about anyone behind their back","Toward daily life — turn the stick on yourself first"]},"safe":["2:6 'repay according to works' must not be preached as salvation by works. Read it with 3:20.","2:14–16 must not be preached as 'Gentiles can be saved by conscience'.","The audience here is the self-righteous, not the seeker. Watch your tone."]},{"n":3,"t":"But Now","sub":"A Mouth, a Seat, a Door","lv":"A","arc":"Release","q":"If there is not one righteous person, what can God possibly do?","truth":"God is both just and the one who justifies the person who believes in Jesus — and both are true at the cross.","mv":{"t":"But now apart from the law, a righteousness of God has been revealed, being testified by the law and the prophets.","r":"Romans 3:21"},"card":["3:20 — every mouth is stopped, and the whole world stands accountable before God.","3:21 — 'But now.' The first great turn of the whole letter.","hilastērion: the mercy seat. God took the place a priest could enter once a year, and set it out in the open."],"sec":[["3:1–8","The Jew's advantage and God's faithfulness"],["3:9–20","No one is righteous, not even one"],["3:21–26","But now: the righteousness of God revealed"],["3:27–31","Where then is boasting? It is excluded"]],"serm":{"pts":[["I. A Mouth That Has Been Stopped","3:9–20","The law's work is to bring us to silence"],["II. A Seat Set Out in the Open","3:21–25","hilastērion: the mercy seat, put on public display"],["III. A Door Opened Freely","3:24–26","God is just, and He justifies"]]},"self":"Still having one more 'but' — always wanting to add something of my own after grace.","t321":{"k":"There is nothing left to boast in — not even my faith is my achievement.","g":"Justification is free, so the glory cannot possibly come to me.","p":"If the door is not free, the system becomes a hierarchy."},"grp":["'No one is righteous, not even one' — when did you first truly agree with that?","What do those three words 'but now' say into your situation right now?","The mercy seat — once a year, behind a curtain; now set out in the open. How does that picture strike you?","What 'but' is still in your heart?","This week, what is one thing you will stop trying to fix on your own?"],"prac":{"main":"Say this every morning this week: 'I have nothing to boast in — only grace, freely given.'","items":["Toward God — give thanks once for 'but now'","Toward yourself — write down the 'but' that is still in your heart","Toward others — speak a blessing over someone you think doesn't deserve it","Toward daily life — stop one thing you do to earn God's approval"]},"safe":["hilastērion may be rendered 'propitiation' or 'mercy seat'; present both, do not settle it from the pulpit.","paresis (3:25, 'passed over') is not aphesis (forgiveness). You may use this, but say it clearly.","The point of 3:25–26 is how God can be just and still justify. Don't reduce it to 'God loves you'."]},{"n":4,"t":"God Actually Justifies the Ungodly","sub":"A Ledger, a Seal, a Grave","lv":"B","arc":"Confirmation","q":"Is this some new doctrine Paul invented?","truth":"God justifying sinners is not news — it is already there in Genesis 15.","mv":{"t":"But to him who doesn't work, but believes in him who justifies the ungodly, his faith is accounted for righteousness.","r":"Romans 4:5"},"card":["logizomai ('to count, to reckon') appears eleven times in chapter 4. This is a bookkeeping chapter.","To the one who works, the wages are not counted as grace, but as what is owed.","What Abraham believed was a God who gives life to the dead and calls into being what does not exist."],"sec":[["4:1–8","Abraham and David: counted righteous"],["4:9–12","Circumcision is a seal, not a condition"],["4:13–17","The promise is by faith, so that it may be by grace"],["4:18–25","Hoping against hope"]],"serm":{"pts":[["I. A Ledger Entered 'Wrongly'","4:1–8","God credited righteousness to a man who had done no work"],["II. A Seal Applied Afterward","4:9–12","Circumcision was a seal, not an entry ticket"],["III. An Empty Grave","4:17–25","The God he believed in raises the dead"]]},"self":"Keeping my own ledger — quietly wanting God to owe me something.","t321":{"k":"'To the one who does not work, but believes' — that is a transfer of sovereignty.","g":"Wages can be boasted in. A gift cannot.","p":"A system built on seniority will sooner or later push people out."},"grp":["Have you ever thought, 'I've done so much — God really ought to…'?","'To the one who works, wages are not grace' — what does that say about your serving?","Abraham's body was 'as good as dead'. Is there something in your life that has already died?","What is your 'seal', and what have you turned into a 'condition'?","This week, what account will you stop keeping with God?"],"safe":["4:5 asebēs means 'the ungodly' — a very strong word. Safe to use.","Do not use chapter 4 to dismiss the place of works; James 2:24 must be handled too.","The order (faith first, then circumcision) is a hard fact. Use it with confidence."],"prac":{"main":"Write down the account in your heart where you feel 'God owes me' — then cross it out.","items":["Toward God — pray for one situation that looks hopeless","Toward yourself — check whether you are calculating wages with God","Toward others — keep no score of what you gave this week","Toward daily life — do one good thing no one will ever know you did"]}},{"n":5,"t":"How Much More","sub":"A Ceasefire, an Outpouring, a Change of King","lv":"A","arc":"Assurance","q":"How can I know that God will love me all the way to the end?","truth":"He did the hardest thing when you were at your worst. Now that you are His — how much more?","mv":{"t":"But God commends his own love toward us, in that while we were yet sinners, Christ died for us.","r":"Romans 5:8"},"card":["eirēnē ('peace') is not a mood. It is a state — the war is over.","'Poured out' is perfect passive: it was poured out, and it is still there.","parakoē and hypakoē both come from the word 'to hear'. Adam heard it wrong; Christ listened from underneath."],"sec":[["5:1–5","The fruit of justification: peace, access, hope"],["5:6–11","How much more: the argument from greater to lesser"],["5:12–21","The two Adams"]],"serm":{"pts":[["I. A War That Is Already Over","5:1–2","Peace with God is a state, not a feeling"],["II. A Love That Was Poured Out","5:5–8","Poured out — and still there"],["III. A Kingdom That Changed Hands","5:17–19","No longer sin reigning, but us reigning in life"]]},"self":"Hearing it wrong — taking God's word to mean something else.","t321":{"k":"A change of king: no longer letting sin reign.","g":"Love is poured out, never earned.","p":"Only those who reign in life can build anything for God."},"grp":["'Peace with God' is a state, not a mood. What difference does that make to you?","'While we were still sinners' — how does God see the worst season of your life before Christ?","The logic of 'how much more' (He already did the hardest thing) — what does it say to your present worry?","Adam 'heard it wrong'. Have you misheard God's word lately?","This week, in what one thing will you let Jesus be King?"],"prac":{"main":"Say Romans 5:8 aloud each morning, and add: 'He did it when I was at my worst.'","items":["Toward God — give thanks for reconciliation, and ask for nothing else","Toward yourself — write down what you most fear God knowing, and hand it over","Toward others — take the first step toward someone you are estranged from","Toward daily life — stop trading performance for security"]},"safe":["5:12 eph' hō is translated in more than one way; say so.","Do not settle the mode of original sin (imputed vs. realistic) from the pulpit.","5:18 'all' must not be preached as universalism; read it with 5:17 'those who receive'."]},{"n":6,"t":"You Have Already Died","sub":"A Funeral, a Ledger, a Set of Weapons","lv":"A","arc":"Turning to Life","q":"If grace is this large, why should I care about sin at all?","truth":"Grace is not a licence to sin. It is a change of master.","mv":{"t":"Thus consider yourselves also to be dead to sin, but alive to God in Christ Jesus our Lord.","r":"Romans 6:11"},"card":["The pōs in 6:2 means 'how could we possibly' — not 'we shouldn't'. It is an impossibility of identity.","symphytos ('grown together') is a grafting word: two branches grown into one tree.","katargeō does not mean 'destroyed'. It means 'relieved of office'. Sin has been fired — but it is still in the building."],"sec":[["6:1–11","Dead and raised with Christ"],["6:12–14","Do not let sin reign"],["6:15–23","Two masters"]],"serm":{"pts":[["I. A Funeral Already Held","6:3–5","You are not going to die. You have died"],["II. A Ledger to Be Recalculated","6:11","The first command in the letter: reckon"],["III. Weapons to Be Handed Over","6:13","Your body parts are weapons. To whom?"]]},"self":"Still taking orders from a master who has already been fired.","t321":{"k":"Do not let sin reign — there is only one throne.","g":"It is grace that reigns, not my self-discipline.","p":"The foundation of the system is a new identity, not new rules."},"grp":["'You have already died' — is that comforting to you, or heavy?","What does it mean to 'reckon yourself dead'? How do you actually do that?","Sin has been fired but is still in the building — do you know that experience?","Who have your body parts been handed over to lately?","This week, which 'weapon' will you hand back to God?"],"prac":{"main":"Reckon it every morning: 'To sin, I am dead. To God, I am alive.'","items":["Toward God — present your body to Him concretely, once","Toward yourself — name one fired voice you are still obeying","Toward others — use your hands to serve someone","Toward daily life — cut off one arrangement that makes sin easy"]},"safe":["6:6 katargeō means 'relieved of office' — a hard fact. Safe to use.","Do not preach 6:11 as self-suggestion. It is reckoning on the basis of fact, not positive thinking.","6:14 'not under law' must not be preached as 'the law is useless'."]},{"n":7,"t":"What a Wretched Man I Am","sub":"A Marriage Certificate, a Beachhead, a Cry","lv":"A","arc":"Honest Failure","q":"I know what I should do. Why can't I do it?","truth":"The law is holy. The problem is not the law — it is me. And the way out is not a method, but a person.","mv":{"t":"What a wretched man I am! Who will deliver me out of the body of this death?","r":"Romans 7:24"},"card":["In 7:7–25, 'I' appears about forty times. The Spirit appears zero times.","aphormē ('opportunity') is a military word: a beachhead. Sin established a base of operations on the commandment.","parakeimai: the willing is right there within reach. What is missing is the power to carry it out."],"sec":[["7:1–6","The marriage illustration: you died to the law"],["7:7–13","Is the law sin? By no means"],["7:14–25","The struggle: what I want to do, I do not do"]],"serm":{"pts":[["I. A Marriage Certificate No Longer in Force","7:1–6","Someone has died — so you are free"],["II. A Beachhead Sin Took","7:7–13","Paul singles out the tenth commandment — the only one no one can see"],["III. A Cry in the Night","7:14–25","Not 'help me try harder', but 'Lord, save me'"]]},"self":"'I know, so I must try harder' — the most devout form of self.","t321":{"k":"Chapter 7 is the limit of the head relying on itself.","g":"The way out is not a method. It is a person.","p":"You cannot build God's system on better rules."},"grp":["'The good I want to do, I don't do' — where do you feel this most?","Why did Paul single out 'you shall not covet'?","Is that struggle itself a sign of life? How do you see it?","When you fight sin, do you rely on willpower or on the Spirit?","This week, in what one thing will you start saying 'Lord, save me' instead?"],"prac":{"main":"When you fail this week, don't say 'I'll try harder'. Say 'Lord, save me'.","items":["Toward God — say the recurring thing out loud to Him, once","Toward yourself — remember: that struggle is evidence of life","Toward others — tell one companion about your struggle","Toward daily life — cut off one route that leads to failure"]},"safe":["Who the 'I' is in 7:14–25 is a famous, long-standing debate. Present the positions; do not settle it.","NEVER use the story that Romans tied a corpse to a criminal. There is no reliable ancient source for it.","You must end by pointing toward chapter 8. Do not leave people at 7:24.","If you sense serious self-condemnation or depression, help the person get real support."]},{"n":8,"t":"Now","sub":"A New Resident, Three Groans, a Knife That Did Not Stop","lv":"A","arc":"The Summit","q":"How can someone who still fails be at the same time uncondemned and never separated?","truth":"The one living inside you has changed. And the one holding on to you will never let go.","mv":{"t":"There is therefore now no condemnation to those who are in Christ Jesus.","r":"Romans 8:1"},"card":["Chapter 6: the Spirit appears zero times. 7:7–25: zero times. Chapter 8: more than twenty times.","oikeō: in 7:17 sin lives in me; in 8:9 the Spirit lives in you. The resident has changed.","ouk epheisato ('did not spare') is the same verb as Genesis 22:12 — 'you have not withheld your son'."],"sec":[["8:1–4","No condemnation: what the law could not do, God did"],["8:5–11","Two mindsets; the Spirit dwells in you"],["8:12–17","Sonship: Abba! Father!"],["8:18–25","Creation groans, and so do we"],["8:26–27","The Spirit's groan and intercession"],["8:28–30","The golden chain"],["8:31–39","Who can? No one"]],"serm":{"pts":[["I. The Resident Has Changed","8:1–17","Condemnation did not vanish. It changed address"],["II. Three Groans","8:18–27","Not the groan of a deathbed, but of a delivery room"],["III. A Knife That Did Not Stop","8:28–39","On Moriah the knife stopped. At Calvary it did not"]]},"self":"Fighting sin by willpower — and then collapsing. The loop of chapter 7.","t321":{"k":"'Those who are led by the Spirit' — passive. Letting Jesus be King means being led.","g":"Five links in the golden chain, and God is the subject of every one.","p":"Creation itself waits eagerly for the children of God to be revealed."},"grp":["8:1 says 'no condemnation'. Is there still a voice in you bringing charges?","How much of your obedience is driven by fear? (8:15)","8:23 says even those who have the Spirit groan. What is the groan in you right now?","The knife stopped on Moriah; it did not stop at Calvary. What does that mean to you?","This week, in what one thing will you stop doubting that God will let go?"],"prac":{"main":"Once a day this week, begin a prayer not with 'Lord' but with 'Abba'.","items":["Toward God — say 'there is no condemnation' out loud for seven days","Toward yourself — copy out 8:38–39 and add your own name at the end of the list","Toward others — tell someone who is weak: 'groaning is not unspiritual'","Toward daily life — put one concrete sin to death by the Spirit, not by willpower"]},"safe":["8:3 'the likeness of sinful flesh' must be stated precisely: real humanity, without a sinful nature.","8:28 must not be preached as 'things will get better'. The good is defined in 8:29 — conformity to His Son.","8:28 must not be quoted at the wrong moment. It is for the sufferer to digest, not for a bystander on day three.","The two readings of 'foreknew' in 8:29 must be named honestly. Do not declare one as the only answer.","Do not say 'Abba' means 'Daddy'. That popular claim has been corrected by scholarship.","8:38–39 must not be preached as 'you can never fall away'. Every item Paul lists is an external threat."]},{"n":9,"t":"Has God's Word Failed?","sub":"A Broken Heart, a Potter, a Stone","lv":"A","arc":"Contemplation","q":"Could there ever be a day when what God has said no longer stands?","truth":"God's word has not failed. What has failed is any possibility of standing on our own.","mv":{"t":"But it is not as though the word of God has come to nothing.","r":"Romans 9:6"},"card":["Before Paul speaks about God's sovereignty, he weeps (9:1–3).","The grammar of 9:22–23 is deliberately asymmetrical: destruction is passive with no agent named; glory is active, and God is the subject.","Paul's own conclusion to chapter 9 is 9:32 — they did not pursue it by faith, but as though by works."],"sec":[["9:1–5","Paul's grief and eight privileges"],["9:6–13","God's choosing has always worked this way"],["9:14–18","Is God unjust? Moses and Pharaoh"],["9:19–24","The potter and the clay"],["9:25–29","The witness of the Old Testament: a remnant"],["9:30–33","The conclusion: they pursued it by works"]],"serm":{"pts":[["I. A Broken Heart","9:1–5","Before he taught sovereignty, he wept"],["II. A Potter Who Has the Right","9:6–29","If God owed you, that would be fairness. He doesn't — so it is mercy"],["III. A Stone of Stumbling","9:30–33","The same stone: a cornerstone, or a stumbling block"]]},"self":"'I have a right to this' — treating God's gift as my own capital.","t321":{"k":"Step back from the seat of the interrogator to the place of the created.","g":"It is not of him who wills, nor of him who runs.","p":"God's system does not run on qualifications."},"grp":["If you listed your 'spiritual assets', what would be on the list?","Have you ever felt that you believed partly because you were more willing than others?","Is there a name still outside? Does it grieve you, or have you given up?","9:22 says God bears with great patience. What does that mean for that name?","This week, will you pray for three names for seven days?"],"prac":{"main":"Write down three people who don't yet believe. Pray for them for seven days.","items":["Toward God — say once a day: 'I am here purely by mercy'","Toward yourself — list your spiritual credentials, then write: 'these are gifts, not capital'","Toward others — when you assess whether someone could ever believe, say: 'neither did I qualify'","Toward daily life — do not use God's sovereignty as an excuse for inaction"]},"safe":["9:13 'Esau I hated' must be explained as comparative language, in the national context of Malachi.","The asymmetry in 9:22–23 is a hard fact of the Greek, but interpreters differ on what it means.","Differences over predestination must be named honestly. Never call either side heretical.","Do not stop at the potter. Paul's own conclusion is in 9:30–33.","Chapter 9 must never become an excuse not to evangelise — chapter 10 turns immediately to preaching."]},{"n":10,"t":"The Word Is Near You","sub":"An Exhausting Project, a Word Close By, a Pair of Dirty Feet","lv":"A","arc":"Invitation","q":"How can someone so zealous, so hard-working, so devout — get it wrong?","truth":"The word is not far from you. What is far is our self-righteousness, and the places no one has gone yet.","mv":{"t":"The word is near you, in your mouth, and in your heart.","r":"Romans 10:8"},"card":["zēlos ('zeal') means to boil. And on the day Paul burned hottest, he was persecuting the church.","stēsai ('to establish their own') means to prop something up and hold it steady — an exhausting project.","10:13 quotes Joel 2:32, where 'the Lord' is YHWH."],"sec":[["10:1–4","Zeal, but in the wrong direction"],["10:5–13","The word is near you"],["10:14–17","The chain of mission"],["10:18–21","Did they hear?"]],"serm":{"pts":[["I. An Exhausting Project","10:1–4","The thing you keep propping up — He has already set it in place"],["II. A Word Close By","10:5–13","No need to ascend or descend — He has done it all"],["III. A Pair of Dirty Feet","10:14–21","Those feet are beautiful because of the news they carry"]]},"self":"Establishing my own righteousness — a very devout, very exhausting act.","t321":{"k":"Confessing with your mouth that Jesus is Lord — in Rome, that sentence had a cost.","g":"Salvation takes only calling on a name — so the glory goes to that name.","p":"The system is built one pair of sent feet at a time."},"grp":["In your most zealous season, was the direction right?","Is there something you keep propping up that keeps falling over?","Is there something that makes you feel 'I am not fit to come near God'?","'Everyone who calls' — what does that 'everyone' mean for the person on your heart?","This week, what one sentence will you say to that person?"],"prac":{"main":"Say one caring sentence to a friend who doesn't yet believe. It doesn't have to be a sermon.","items":["Toward God — ask daily: 'am I doing this to be accepted, or because I already am?'","Toward yourself — write down the thing you keep propping up","Toward others — don't let guilt be what drives your witness","Toward daily life — give or pray concretely for one missionary"]},"safe":["telos in 10:4 can mean 'end' or 'goal'. Say that interpreters differ.","10:9–10 is not two steps to salvation. It is the inside and outside of one thing.","Do not use 10:14–15 to manufacture guilt. Paul's starting point is the longing of 10:1.","Do not use 10:18 to argue that the gospel has already reached everyone, so mission is finished."]},{"n":11,"t":"Oh, the Depth","sub":"Seven Thousand, a Tree, a Cry of Wonder","lv":"A","arc":"Worship","q":"Will there come a day when God lets go?","truth":"God has never let go. And His ways run so deep that all we can do is kneel.","mv":{"t":"Oh the depth of the riches both of the wisdom and the knowledge of God!","r":"Romans 11:33"},"card":["Elijah said, 'I alone am left.' God said, 'I have kept for myself seven thousand.'","bastazō: it is not you who support the root, but the root that supports you.","anexichniastos: untraceable. You follow the footprints in the snow — and then they stop."],"sec":[["11:1–10","God has not rejected: seven thousand and a remnant"],["11:11–16","The purpose of their stumbling"],["11:17–24","The olive tree: do not boast"],["11:25–32","The mystery: mercy on all"],["11:33–36","Doxology"]],"serm":{"pts":[["I. There Are Still Seven Thousand","11:1–10","Elijah was not really alone. He simply did not know"],["II. A Tree That Is Not Yours","11:11–24","It is not you who support the root, but the root that supports you"],["III. A Cry of Wonder","11:25–36","Some changes of mind end not in understanding, but in worship"]]},"self":"The superiority of the one who has received mercy — 'at least I'm not like them'.","t321":{"k":"A branch never carries the root.","g":"Of Him, through Him, and to Him are all things.","p":"A healthy system keeps a place for those still outside."},"grp":["Have you ever felt 'I'm the only one left'?","Who have you recently said 'at least I'm not like him' about — even silently?","Is there something you feel is being held up entirely by you?","'Stumbling is not falling' — is there someone on your heart who has tripped?","This week, will you pray for that person?"],"prac":{"main":"When you catch yourself thinking 'at least I'm not…', say instead: 'but for grace, that would be me.'","items":["Toward God — for the thing you cannot make sense of, say only: 'oh, the depth'","Toward yourself — write down who has carried you","Toward others — pray for someone who has fallen, for seven days","Toward daily life — let go of one demand to have it all figured out"]},"safe":["'All Israel will be saved' (11:26) has three main readings. Present them; do not settle it.","NEVER draw this chapter into modern Middle East politics. It is about redemptive history.","11:22 must not be used to frighten believers. Set it beside 11:29.","11:32 must not be used to argue universalism — but do not shrink its breadth either."]},{"n":12,"t":"Therefore","sub":"On the Altar, In the Body, On the Street","lv":"A","arc":"The Turn","q":"I know so much now. How does any of it actually change me?","truth":"The path of change is not more effort. It is a different mind.","mv":{"t":"Don't be conformed to this world, but be transformed by the renewing of your mind.","r":"Romans 12:2"},"card":["The 'therefore' of 12:1 is the hinge of the whole letter: from doctrine to life.","Both verbs in 12:2 are passive: either you are moulded by the world, or you are transformed by God.","metamorphoō is the very word used of the Transfiguration."],"sec":[["12:1–2","The summary: present, and be renewed"],["12:3–8","In the body"],["12:9–13","Love without a mask"],["12:14–21","Overcome evil with good"]],"serm":{"pts":[["I. On the Altar","12:1–2","You are not the one doing the changing"],["II. In the Body","12:3–8","Think with sober judgement"],["III. On the Street","12:9–21","Do not be overcome by evil, but overcome evil with good"]]},"self":"Trying to remake myself by myself.","t321":{"k":"Renewing of the mind — change the mindset and you change the life.","g":"Do not think of yourself more highly than you ought.","p":"One body, many members."},"grp":["'Present your bodies' — which part of your body is hardest to present?","Where have you been 'moulded' by this world lately?","What is your gift? Are you using it?","12:13 says 'pursue hospitality'. When did you last have someone in?","This week, who will you overcome evil with good toward?"],"prac":{"main":"Pick one way the world has shaped you, and deliberately go the other way this week.","items":["Toward God — present your body to Him each morning","Toward yourself — identify one mindset that needs renewing","Toward others — do something good for someone who has hurt you","Toward daily life — have one person over for a meal"]},"safe":["The passive voice in 12:2 is a hard fact. Safe to use.","12:19 'do not avenge yourselves' needs great care with those who have been harmed. This is not withdrawing the case; it is moving it to a higher court.","12:19 must be balanced with 13:4, and you should be ready to give real help afterwards."]},{"n":13,"t":"Put On","sub":"A Sword, a Debt, a Garment","lv":"A","arc":"Practice","q":"How does someone who does not belong to this world live inside it?","truth":"Pay off what you owe the world. Keep only one debt. Then put on a person.","mv":{"t":"But put on the Lord Jesus Christ, and make no provision for the flesh, for its lusts.","r":"Romans 13:14"},"card":["12:19 'vengeance is mine' and 13:4 'an avenger' share the same root.","13:12 puts on armour — a thing. 13:14 puts on the Lord Jesus Christ — a person.","pronoia means planning ahead. The problem is not the moment of temptation. It is what came before."],"sec":[["13:1–7","Toward government"],["13:8–10","A debt never paid off"],["13:11–14","Knowing the time"]],"serm":{"pts":[["I. A Sword That Is Not Yours","13:1–7","That sword is not in your hand — and it should not be"],["II. A Debt Never Paid Off","13:8–10","Settle every debt. Keep one"],["III. A Garment to Put On","13:11–14","You don't have to manufacture a new self. You put on a person"]]},"self":"Appointing myself to the office of avenger.","t321":{"k":"The tassō word group: God orders, and I take my place under it.","g":"Put on — what people see is the garment, not the body.","p":"God's system is not detached from society."},"grp":["Is there something where you feel 'he owes me an apology'?","Is there anything you owe and have not given? (money, a promise, an apology, a word you should have said)","13:13 lists 'strife and jealousy' alongside drunkenness. Who were you jealous of this week?","'Put on a person' — what does that mean to you?","This week, what one 'provision' will you concretely cut off?"],"prac":{"main":"Cut off one concrete 'provision' that leads to sin: delete it, move it, change the route, change the time, or bring someone along.","items":["Toward God — before you dress each morning, say: 'Lord, today I put You on'","Toward yourself — list what you owe people, and settle one item","Toward others — say nothing harmful behind anyone's back this week","Toward daily life — check whether something owed is still unpaid"]},"safe":["13:1–7 has been badly misused in history. You must also preach Acts 5:29, Daniel 3:18, Exodus 1:17.","13:3–4 is functional description — it is both the government's office and the standard by which it is measured.","NEVER endorse or attack any particular contemporary regime.","13:8 must not be preached as 'a Christian may never take on debt'."]},{"n":14,"t":"Welcome One Another","sub":"A Servant Who Is Not Yours, a Stone, a House Being Built","lv":"A","arc":"Repair","q":"When I am sure I am right, and my brother is not with me — what then?","truth":"That person is not your servant. And Christ has already died for him.","mv":{"t":"Therefore accept one another, even as Christ also accepted you, to the glory of God.","r":"Romans 15:7"},"card":["exoutheneō ('despise') comes from the word for 'zero' — to treat a person as nothing.","14:6: one eats, one abstains — and both of them are giving thanks over the food.","katalyō ('destroy') is the very word the Gospels use for tearing down the temple."],"sec":[["14:1–4","Welcome: he is another's servant"],["14:5–9","Each one to the Lord"],["14:10–12","Before God's judgement seat"],["14:13–18","A stumbling block"],["14:19–23","Building and tearing down"]],"serm":{"pts":[["I. A Servant Who Is Not Yours","14:1–12","The one holding him up is not you — it is the Lord"],["II. A Stone","14:13–18","Christ has already died for him"],["III. A House Being Built","14:19–15:7","Just as Christ accepted you"]]},"self":"'I am right' — self-centredness in its theologically correct form.","t321":{"k":"To judge is to sit in a seat that does not belong to me.","g":"Accept one another, to the glory of God.","p":"Not built on qualifications, but on 'just as'."},"grp":["Is there a Christian you know about whom you think, 'there's no talking to him'?","Is there a believer you have quietly reduced to zero?","Do you often feel that if you don't keep watch, he will fall?","'Christ has already died for him' — how does that change the way you see him?","This week, which brother or sister who disagrees with you will you reach out to?"],"prac":{"main":"Reach out to someone you disagree with — not to convince them, but to welcome them.","items":["Toward God — say for seven days: 'just as Christ accepted me'","Toward yourself — write down the name you have reduced to zero","Toward others — mention nothing negative about that person this week","Toward daily life — do not comment publicly on other Christians or churches"]},"safe":["You must set out Paul's three modes (core truth / open sin / disputable matters), or this becomes 'anything goes'.","Do not skip 15:7. Chapter 14 is full of 'do nots'; the 'do' is in 15:7.","Do not use 'weak' as a label. That is exactly the 'despising' 14:3 forbids.","Do not name specific present controversies from the pulpit; people will identify themselves."]},{"n":15,"t":"Carry","sub":"One Who Carries, a Lord Who Welcomes, a Priest Who Lifts People Up","lv":"A","arc":"Bearing","q":"Why should I give up my rights for a brother who is not like me?","truth":"He carried you, so you can carry him. He welcomed you, so you can welcome him.","mv":{"t":"Now we who are strong ought to bear the weaknesses of the weak, and not to please ourselves.","r":"Romans 15:1"},"card":["bastazō: 11:18 'the root supports you' → 15:1 'you ought to bear'. You were the one being carried.","15:3 quotes Psalm 69:9 — the insults were aimed at God, and they landed on Him.","The verb in 15:5 is optative: unity is asked for, not achieved."],"sec":[["15:1–6","Carry: because Christ did not please Himself"],["15:7–13","Welcome: four Old Testament quotations"],["15:14–21","Offer: a priest of the gospel"],["15:22–33","Wrestle: strive together with me"]],"serm":{"pts":[["I. One Who Carries","15:1–6","You were the one being carried — now it is your turn"],["II. A Lord Who Welcomes","15:7–13","'Just as' — on the day He welcomed you, you were not all right"],["III. A Priest Who Lifts People Up","15:14–33","You are not doing a job. You are lifting people to God"]]},"self":"Pleasing myself.","t321":{"k":"Humility is not giving up your strength. It is changing the direction of your strength.","g":"With one mind and one mouth, glorify God.","p":"The engine of the system is carrying; the foundation is 'just as'."},"grp":["On your journey of faith, who carried you?","Is there something lately you could have let go of, but held on to?","What you did for someone — was it for their good, or so that you would not be disliked?","'The insults aimed at You fell on Me' — what does that mean to you?","This week, pray for the unity of your church for seven days — instead of complaining for seven days."],"prac":{"main":"For one brother or sister, give up one thing you have every right to do.","items":["Toward God — begin your prayer with one of chapter 15's names for God: of patience and encouragement, of hope, of peace","Toward yourself — recall a time you were carried, and write down the name","Toward others — remove one condition from someone you 'accept if…'","Toward daily life — read Scripture for endurance, comfort and hope, not for answers"]},"safe":["'Strong / weak' in 15:1 is easily turned into a label. You must preach the threefold balance.","15:2 must include the two qualifiers (for his good, for building up), set against Galatians 1:10.","Do not skip the optative in 15:5, or the whole thing becomes 'try harder to be united'.","'Same mind' in 15:5 is not 'same opinion' — chapter 14 spends itself saying opinions may differ."]},{"n":16,"t":"Names","sub":"A List, a Warning, a Doxology","lv":"A","arc":"Gathering In","q":"Where does all this theology finally land?","truth":"God has never been saving 'humanity'. He is saving people with names.","mv":{"t":"To the only wise God, through Jesus Christ, to whom be the glory forever! Amen.","r":"Romans 16:27"},"card":["Paul greets more than twenty-six individuals by name — at least nine of them women.","kopiaō ('laboured') means work to the point of exhaustion — and in this chapter it is used only of women.","1:11 'I long to strengthen you' → 16:25 'to him who is able to establish you'. That is the distance of a whole letter."],"sec":[["16:1–2","Commending Phoebe"],["16:3–16","The list"],["16:17–20","Warning and promise"],["16:21–24","Greetings from co-workers"],["16:25–27","Doxology"]],"serm":{"pts":[["I. A List","16:1–16","He remembered not only the names, but what they had done"],["II. A Warning","16:17–20","They use the serpent's method — and the serpent is to be crushed"],["III. A Doxology","16:21–27","To him who is able to establish you"]]},"self":"Serving my own appetite — self dressed in the clothes of kindness.","t321":{"k":"Only God can establish — it is not being held up by me.","g":"Someone who truly gives God the glory is free to praise other people.","p":"A list with names, with stories, with thanksgiving."},"grp":["On your journey of faith, whose name would you write on the list? What did they do?","Is there someone in your church who is like family to you? Or could you become that for someone?","Have you ever been swayed by words that sounded good but served the speaker?","Is there something right now that you feel depends on you?","This week, who will you tell: 'I remember what you did'?"],"prac":{"main":"Write down ten names. After each, write one line about what they did. Then tell one of them.","items":["Toward God — pray for those who serve quietly","Toward yourself — check how much of your language is numbers, and how much is names","Toward others — publicly thank someone who serves out of sight","Toward daily life — ask the name of someone you cannot name yet"]},"safe":["16:1 (Phoebe) and 16:7 (Junia) touch sensitive contemporary questions. Say clearly that interpreters differ.","16:17 is easily misused to exclude people. You must give the five criteria — especially 'contrary to the teaching you learned'.","The archaeological leads (Rufus, Ampliatus, Erastus) must always carry 'we cannot be certain'.","Do not skip 16:25–27 — it is where the whole letter closes."]}],"txt":{"1":["Paul, a servant of Jesus Christ, called to be an apostle, set apart for the Good News of God,","which he promised before through his prophets in the holy Scriptures,","concerning his Son, who was born of the offspring of David according to the flesh,","who was declared to be the Son of God with power according to the Spirit of holiness, by the resurrection from the dead, Jesus Christ our Lord,","through whom we received grace and apostleship for obedience of faith among all the nations for his name’s sake;","among whom you are also called to belong to Jesus Christ;","to all who are in Rome, beloved of God, called to be saints: Grace to you and peace from God our Father and the Lord Jesus Christ.","First, I thank my God through Jesus Christ for all of you, that your faith is proclaimed throughout the whole world.","For God is my witness, whom I serve in my spirit in the Good News of his Son, how unceasingly I make mention of you always in my prayers,","requesting, if by any means now at last I may be prospered by the will of God to come to you.","For I long to see you, that I may impart to you some spiritual gift, to the end that you may be established;","that is, that I with you may be encouraged in you, each of us by the other’s faith, both yours and mine.","Now I don’t desire to have you unaware, brothers, that I often planned to come to you (and was hindered so far), that I might have some fruit among you also, even as among the rest of the Gentiles.","I am debtor both to Greeks and to foreigners, both to the wise and to the foolish.","So as much as is in me, I am eager to preach the Good News to you also who are in Rome.","For I am not ashamed of the Good News of Christ, because it is the power of God for salvation for everyone who believes, for the Jew first, and also for the Greek.","For in it is revealed God’s righteousness from faith to faith. As it is written, “But the righteous shall live by faith.”","For the wrath of God is revealed from heaven against all ungodliness and unrighteousness of men who suppress the truth in unrighteousness,","because that which is known of God is revealed in them, for God revealed it to them.","For the invisible things of him since the creation of the world are clearly seen, being perceived through the things that are made, even his everlasting power and divinity, that they may be without excuse.","Because knowing God, they didn’t glorify him as God, and didn’t give thanks, but became vain in their reasoning, and their senseless heart was darkened.","Professing themselves to be wise, they became fools,","and traded the glory of the incorruptible God for the likeness of an image of corruptible man, and of birds, four-footed animals, and creeping things.","Therefore God also gave them up in the lusts of their hearts to uncleanness, that their bodies should be dishonored among themselves;","who exchanged the truth of God for a lie, and worshiped and served the creature rather than the Creator, who is blessed forever. Amen.","For this reason, God gave them up to vile passions. For their women changed the natural function into that which is against nature.","Likewise also the men, leaving the natural function of the woman, burned in their lust toward one another, men doing what is inappropriate with men, and receiving in themselves the due penalty of their error.","Even as they refused to have God in their knowledge, God gave them up to a reprobate mind, to do those things which are not fitting;","being filled with all unrighteousness, sexual immorality, wickedness, covetousness, malice; full of envy, murder, strife, deceit, evil habits, secret slanderers,","backbiters, hateful to God, insolent, arrogant, boastful, inventors of evil things, disobedient to parents,","without understanding, covenant breakers, without natural affection, unforgiving, unmerciful;","who, knowing the ordinance of God, that those who practice such things are worthy of death, not only do the same, but also approve of those who practice them."],"2":["Therefore you are without excuse, O man, whoever you are who judge. For in that which you judge another, you condemn yourself. For you who judge practice the same things.","We know that the judgment of God is according to truth against those who practice such things.","Do you think this, O man who judges those who practice such things, and do the same, that you will escape the judgment of God?","Or do you despise the riches of his goodness, forbearance, and patience, not knowing that the goodness of God leads you to repentance?","But according to your hardness and unrepentant heart you are treasuring up for yourself wrath in the day of wrath, revelation, and of the righteous judgment of God,","who “will pay back to everyone according to their works:”","to those who by perseverance in well-doing seek for glory, honor, and incorruptibility, eternal life;","but to those who are self-seeking and don’t obey the truth, but obey unrighteousness, will be wrath, indignation,","oppression, and anguish on every soul of man who does evil, to the Jew first, and also to the Greek.","But glory, honor, and peace go to every man who does good, to the Jew first, and also to the Greek.","For there is no partiality with God.","For as many as have sinned without the law will also perish without the law. As many as have sinned under the law will be judged by the law.","For it isn’t the hearers of the law who are righteous before God, but the doers of the law will be justified","(for when Gentiles who don’t have the law do by nature the things of the law, these, not having the law, are a law to themselves,","in that they show the work of the law written in their hearts, their conscience testifying with them, and their thoughts among themselves accusing or else excusing them)","in the day when God will judge the secrets of men, according to my Good News, by Jesus Christ.","Indeed you bear the name of a Jew, rest on the law, glory in God,","know his will, and approve the things that are excellent, being instructed out of the law,","and are confident that you yourself are a guide of the blind, a light to those who are in darkness,","a corrector of the foolish, a teacher of babies, having in the law the form of knowledge and of the truth.","You therefore who teach another, don’t you teach yourself? You who preach that a man shouldn’t steal, do you steal?","You who say a man shouldn’t commit adultery, do you commit adultery? You who abhor idols, do you rob temples?","You who glory in the law, do you dishonor God by disobeying the law?","For “the name of God is blasphemed among the Gentiles because of you,” just as it is written.","For circumcision indeed profits, if you are a doer of the law, but if you are a transgressor of the law, your circumcision has become uncircumcision.","If therefore the uncircumcised keep the ordinances of the law, won’t his uncircumcision be accounted as circumcision?","Won’t those who are physically uncircumcised, but fulfill the law, judge you, who with the letter and circumcision are a transgressor of the law?","For he is not a Jew who is one outwardly, neither is that circumcision which is outward in the flesh;","but he is a Jew who is one inwardly, and circumcision is that of the heart, in the spirit, not in the letter; whose praise is not from men, but from God."],"3":["Then what advantage does the Jew have? Or what is the profit of circumcision?","Much in every way! Because first of all, they were entrusted with the revelations of God.","For what if some were without faith? Will their lack of faith nullify the faithfulness of God?","May it never be! Yes, let God be found true, but every man a liar. As it is written, “that you might be justified in your words, and might prevail when you come into judgment.”","But if our unrighteousness commends the righteousness of God, what will we say? Is God unrighteous who inflicts wrath? I speak like men do.","May it never be! For then how will God judge the world?","For if the truth of God through my lie abounded to his glory, why am I also still judged as a sinner?","Why not (as we are slanderously reported, and as some affirm that we say), “Let’s do evil, that good may come?” Those who say so are justly condemned.","What then? Are we better than they? No, in no way. For we previously warned both Jews and Greeks that they are all under sin.","As it is written, “There is no one righteous; no, not one.","There is no one who understands. There is no one who seeks after God.","They have all turned away. They have together become unprofitable. There is no one who does good, no, not so much as one.”","“Their throat is an open tomb. With their tongues they have used deceit.” “The poison of vipers is under their lips.”","“Their mouth is full of cursing and bitterness.”","“Their feet are swift to shed blood.","Destruction and misery are in their ways.","The way of peace, they haven’t known.”","“There is no fear of God before their eyes.”","Now we know that whatever things the law says, it speaks to those who are under the law, that every mouth may be closed, and all the world may be brought under the judgment of God.","Because by the works of the law, no flesh will be justified in his sight; for through the law comes the knowledge of sin.","But now apart from the law, a righteousness of God has been revealed, being testified by the law and the prophets;","even the righteousness of God through faith in Jesus Christ to all and on all those who believe. For there is no distinction,","for all have sinned, and fall short of the glory of God;","being justified freely by his grace through the redemption that is in Christ Jesus,","whom God sent to be an atoning sacrifice through faith in his blood, for a demonstration of his righteousness through the passing over of prior sins, in God’s forbearance;","to demonstrate his righteousness at this present time, that he might himself be just and the justifier of him who has faith in Jesus.","Where then is the boasting? It is excluded. By what kind of law? Of works? No, but by a law of faith.","We maintain therefore that a man is justified by faith apart from the works of the law.","Or is God the God of Jews only? Isn’t he the God of Gentiles also? Yes, of Gentiles also,","since indeed there is one God who will justify the circumcised by faith and the uncircumcised through faith.","Do we then nullify the law through faith? May it never be! No, we establish the law."],"4":["What then will we say that Abraham, our forefather, has found according to the flesh?","For if Abraham was justified by works, he has something to boast about, but not toward God.","For what does the Scripture say? “Abraham believed God, and it was accounted to him for righteousness.”","Now to him who works, the reward is not counted as grace, but as something owed.","But to him who doesn’t work, but believes in him who justifies the ungodly, his faith is accounted for righteousness.","Even as David also pronounces blessing on the man to whom God counts righteousness apart from works:","“Blessed are they whose iniquities are forgiven, whose sins are covered.","Blessed is the man whom the Lord will by no means charge with sin.”","Is this blessing then pronounced only on the circumcised, or on the uncircumcised also? For we say that faith was accounted to Abraham for righteousness.","How then was it counted? When he was in circumcision, or in uncircumcision? Not in circumcision, but in uncircumcision.","He received the sign of circumcision, a seal of the righteousness of the faith which he had while he was in uncircumcision, that he might be the father of all those who believe, though they might be in uncircumcision, that righteousness might also be accounted to them.","He is the father of circumcision to those who not only are of the circumcision, but who also walk in the steps of that faith of our father Abraham, which he had in uncircumcision.","For the promise to Abraham and to his offspring that he would be heir of the world wasn’t through the law, but through the righteousness of faith.","For if those who are of the law are heirs, faith is made void, and the promise is made of no effect.","For the law produces wrath; for where there is no law, neither is there disobedience.","For this cause it is of faith, that it may be according to grace, to the end that the promise may be sure to all the offspring, not to that only which is of the law, but to that also which is of the faith of Abraham, who is the father of us all.","As it is written, “I have made you a father of many nations.” This is in the presence of him whom he believed: God, who gives life to the dead, and calls the things that are not, as though they were.","Against hope, Abraham in hope believed, to the end that he might become a father of many nations, according to that which had been spoken, “So will your offspring be.”","Without being weakened in faith, he didn’t consider his own body, already having been worn out, (he being about a hundred years old), and the deadness of Sarah’s womb.","Yet, looking to the promise of God, he didn’t waver through unbelief, but grew strong through faith, giving glory to God,","and being fully assured that what he had promised, he was also able to perform.","Therefore it also was “credited to him for righteousness.”","Now it was not written that it was accounted to him for his sake alone,","but for our sake also, to whom it will be accounted, who believe in him who raised Jesus our Lord from the dead,","who was delivered up for our trespasses, and was raised for our justification."],"5":["Being therefore justified by faith, we have peace with God through our Lord Jesus Christ;","through whom we also have our access by faith into this grace in which we stand. We rejoice in hope of the glory of God.","Not only this, but we also rejoice in our sufferings, knowing that suffering produces perseverance;","and perseverance, proven character; and proven character, hope;","and hope doesn’t disappoint us, because God’s love has been poured into our hearts through the Holy Spirit who was given to us.","For while we were yet weak, at the right time Christ died for the ungodly.","For one will hardly die for a righteous man. Yet perhaps for a good person someone would even dare to die.","But God commends his own love toward us, in that while we were yet sinners, Christ died for us.","Much more then, being now justified by his blood, we will be saved from God’s wrath through him.","For if while we were enemies, we were reconciled to God through the death of his Son, much more, being reconciled, we will be saved by his life.","Not only so, but we also rejoice in God through our Lord Jesus Christ, through whom we have now received the reconciliation.","Therefore, as sin entered into the world through one man, and death through sin, so death passed to all men because all sinned.","For until the law, sin was in the world; but sin is not charged when there is no law.","Nevertheless death reigned from Adam until Moses, even over those whose sins weren’t like Adam’s disobedience, who is a foreshadowing of him who was to come.","But the free gift isn’t like the trespass. For if by the trespass of the one the many died, much more did the grace of God and the gift by the grace of the one man, Jesus Christ, abound to the many.","The gift is not as through one who sinned; for the judgment came by one to condemnation, but the free gift followed many trespasses to justification.","For if by the trespass of the one, death reigned through the one; so much more will those who receive the abundance of grace and of the gift of righteousness reign in life through the one, Jesus Christ.","So then as through one trespass, all men were condemned; even so through one act of righteousness, all men were justified to life.","For as through the one man’s disobedience many were made sinners, even so through the obedience of the one, many will be made righteous.","The law came in that the trespass might abound; but where sin abounded, grace abounded more exceedingly,","that as sin reigned in death, even so grace might reign through righteousness to eternal life through Jesus Christ our Lord."],"6":["What shall we say then? Shall we continue in sin, that grace may abound?","May it never be! We who died to sin, how could we live in it any longer?","Or don’t you know that all of us who were baptized into Christ Jesus were baptized into his death?","We were buried therefore with him through baptism into death, that just as Christ was raised from the dead through the glory of the Father, so we also might walk in newness of life.","For if we have become united with him in the likeness of his death, we will also be part of his resurrection;","knowing this, that our old man was crucified with him, that the body of sin might be done away with, so that we would no longer be in bondage to sin.","For he who has died has been freed from sin.","But if we died with Christ, we believe that we will also live with him,","knowing that Christ, being raised from the dead, dies no more. Death no longer has dominion over him!","For the death that he died, he died to sin one time; but the life that he lives, he lives to God.","Thus consider yourselves also to be dead to sin, but alive to God in Christ Jesus our Lord.","Therefore don’t let sin reign in your mortal body, that you should obey it in its lusts.","Also, do not present your members to sin as instruments of unrighteousness, but present yourselves to God as alive from the dead, and your members as instruments of righteousness to God.","For sin will not have dominion over you, for you are not under law, but under grace.","What then? Shall we sin because we are not under law but under grace? May it never be!","Don’t you know that when you present yourselves as servants and obey someone, you are the servants of whomever you obey, whether of sin to death, or of obedience to righteousness?","But thanks be to God that, whereas you were bondservants of sin, you became obedient from the heart to that form of teaching to which you were delivered.","Being made free from sin, you became bondservants of righteousness.","I speak in human terms because of the weakness of your flesh; for as you presented your members as servants to uncleanness and to wickedness upon wickedness, even so now present your members as servants to righteousness for sanctification.","For when you were servants of sin, you were free from righteousness.","What fruit then did you have at that time in the things of which you are now ashamed? For the end of those things is death.","But now, being made free from sin and having become servants of God, you have your fruit of sanctification and the result of eternal life.","For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord."],"7":["Or don’t you know, brothers (for I speak to men who know the law), that the law has dominion over a man for as long as he lives?","For the woman that has a husband is bound by law to the husband while he lives, but if the husband dies, she is dischar
