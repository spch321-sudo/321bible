<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321圣经讲义">
<meta name="application-name" content="321圣经讲义">
<meta name="description" content="321圣经讲义｜罗马书：全书十六章逐节原文解经、讲章逐字稿与321生命应用。">
<title>321圣经讲义｜罗马书</title>
<link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">

<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 页首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.02em}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}

/* ── 分页 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:14px}
.xs{font-size:12.5px}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形图（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清单 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 经文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六层 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 轨迹 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 争议 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分级 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屉 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:17px;line-height:1.75;margin:0 0 4px}
.tip{font-size:13.5px;color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全屏幕模式（讲台／小组）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提词机 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小组 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜寻 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌与启动画面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 画线与领受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkp{cursor:pointer;border-radius:6px;transition:background .15s}
.mkp:active{background:var(--line)}
.mkp.hl{background:linear-gradient(transparent 60%, rgba(156,107,24,.3) 60%)}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:14.5px;line-height:1.8
}
.mknote b{color:var(--brass);font-size:12px;letter-spacing:.1em}
.mkask{
  display:inline-block;margin-left:8px;border:1px solid var(--line);background:var(--card);
  color:var(--pine);border-radius:8px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer
}
.mkq{
  font-family:var(--serif);font-size:16px;line-height:1.85;border-left:3px solid var(--brass);
  padding:8px 0 8px 12px;margin:6px 0 12px;color:var(--dusk)
}
.hlq{font-family:var(--serif);font-size:15.5px;line-height:1.8;margin:0;cursor:pointer}
.btn.xs2{font-size:12.5px;padding:6px 11px}
.mkhint{
  font-size:12.5px;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:9px;padding:9px 11px;margin:4px 0 12px;line-height:1.75
}

/* ── 朗读状态列 ── */
.spkbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));z-index:110;
  display:flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--paper);border-radius:999px;
  padding:8px 8px 8px 15px;font-size:13.5px;max-width:calc(100% - 32px);
  box-shadow:0 6px 24px rgba(0,0,0,.22)
}
.spkbar b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.spkbar .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.spkbar button{
  border:0;background:rgba(255,255,255,.16);color:inherit;width:30px;height:30px;
  border-radius:50%;font-size:13px;cursor:pointer;flex:0 0 auto
}

/* ── 小智 ── */
.xzfab{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:70;
  width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
  background:var(--pine);color:#fff;font-size:21px;
  box-shadow:0 8px 26px rgba(31,77,61,.4);display:grid;place-items:center
}
html[data-dark="1"] .xzfab{color:#0E1412}
.xz{position:fixed;inset:0;z-index:150;display:none}
.xz.on{display:block}
.xzmask{position:absolute;inset:0;background:rgba(10,16,14,.44)}
.xzcard{
  position:absolute;left:0;right:0;bottom:0;max-height:86vh;
  background:var(--paper);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:up .22s ease
}
.xzh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.xzh b{font-family:var(--serif);font-size:17px}
.xzb{flex:1;overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.xzm{
  max-width:88%;padding:11px 14px;border-radius:15px;margin:0 0 11px;
  font-size:15px;line-height:1.85;white-space:normal
}
.xzm.user{background:var(--pine);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
html[data-dark="1"] .xzm.user{color:#0E1412}
.xzm.assistant{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.xzm.xzwait{opacity:.6;font-style:italic}
.xzspk{
  display:block;margin-top:8px;border:1px solid var(--line);background:transparent;
  color:var(--dusk);border-radius:8px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer
}
.xzhi{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:15px;line-height:1.85;margin-bottom:12px
}
.xzq{display:flex;flex-direction:column;gap:7px}
.xzq button{
  text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:11px;padding:11px 13px;font:inherit;font-size:14.5px;cursor:pointer;line-height:1.7
}
.xzf{
  display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)
}
.xzf input{
  flex:1;border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:inherit;font:inherit;font-size:16px;padding:11px 13px
}

/* ── 語音選擇 ── */
.vrow{display:flex;gap:8px}
.vpill{
  flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:13px;padding:11px 6px;font:inherit;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:3px;transition:all .15s
}
.vpill{text-decoration:none}
.vpill b{font-size:15px;font-weight:600}
.vpill span{font-size:11.5px;color:var(--dusk);line-height:1.4}
.vpill.on{background:var(--pine);border-color:var(--pine);color:#fff}
.vpill.on span{color:rgba(255,255,255,.75)}
html[data-dark="1"] .vpill.on{color:#0E1412}
html[data-dark="1"] .vpill.on span{color:rgba(0,0,0,.6)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="boot" style="position:fixed;inset:0;z-index:400;background:#12305E;color:#fff;

谁道歉，或收回哪一句话？"],"prac":{"main":"这礼拜每次要论断人时，停下来问：「这件事我自己做到了吗？」","items":["对神：求祂让我看见自己","对自己：记录一周论断了几次","对人：不在背后说任何一个人的缺点","对生活：把那把尺先量自己"]},"safe":["不可把「不要论断」讲成「不要分辨是非」 ——必须在同一段内补上界线（本讲稿在第一大段已处理）。","不可把「照行为报应」（2:6）略过不提，也不可讲成「行为得救」 ——本讲稿选择不在台上展开这个争议，改放在小组材料；若会众提问，用第二十部分的三种观点诚实回答。","不可把「神的名因你们受了亵渎」讲成「别人不信主都是你的错」 ——本讲稿已加入护栏句。"]},{"n":3,"t":"但如今","sub":"一张嘴、一张座、一道门","lv":"A","arc":"释放","q":"如果没有一个义人，神还能怎么办？","truth":"神既是义的，又称信耶稣的人为义——这两件事在十字架上同时成立。","mv":{"t":"但如今，神的义在律法以外已经显明出来。","r":"罗3:21"},"card":["3:20——每一张嘴被封住，全世界都伏在神审判之下。","3:21——「但如今」。全卷书的第一个转折。","ἱλαστήριον：施恩座。神把那个一年只能进去一次的地方，摆在众人眼前。"],"sec":[["3:1–8","犹太人的长处与神的信实"],["3:9–20","没有义人，连一个也没有"],["3:21–26","但如今：神的义显明"],["3:27–31","夸口在哪里？没有可夸的了"]],"serm":{"pts":[["一、一张被封住的嘴","3:9–20","律法的功用是让人闭嘴"],["二、一张摆出来的座","3:21–25","ἱλαστήριον：施恩座被摆在众人眼前"],["三、一道白白开的门","3:24–26","神既是义的，又称人为义"]]},"self":"还有一句「可是」——总想在恩典后面加上自己的一点。","t321":{"k":"没有可夸的了——连信心都不是我的功劳。","g":"称义是白白的，所以荣耀不可能归给我。","p":"门若不是白白的，体系就会变成阶级。"},"grp":["「没有义人，连一个也没有」——你第一次真的认同这句话是什么时候？","「但如今」这三个字，对你现在的处境说了什么？","施恩座的画面（一年一次 vs 摆在众人眼前）给你什么感觉？","你心里还有哪一句「可是」？","这礼拜你要为哪一件事，停止想靠自己补救？"],"prac":{"main":"这礼拜每天早上说一次：「我没有可夸的，只有白白的恩典。」","items":["对神：为「但如今」感谢一次","对自己：写下你心里那句「可是」","对人：对一个你觉得「他不配」的人，说一句祝福","对生活：停止一件想靠表现换取神喜悦的事"]},"safe":["不可把「挽回祭」讲成「愤怒的父神被慈爱的耶稣安抚」 ——3:25的主词是神。必须强调：是神自己摆出来的（约壹4:10）。","不可把「律法」讲成坏东西 ——3:31明说「更是坚固律法」。","不可太早给安慰 ——第一大段若心软提前给福音，第二大段的「但如今」就没有力量了。这篇讲章的力量，全在于前段有没有讲透。","不可把「白白地」讲成「所以怎么活都没关系」 ——3:8保罗已经把这个误解称为毁谤。"]},{"n":4,"t":"神竟然称罪人为义","sub":"一本帐、一个印、一座坟","lv":"B","arc":"印证","q":"这是不是保罗发明的新道理？","truth":"神称罪人为义，不是新闻——创世记十五章就有了。","mv":{"t":"惟有不做工的，只信称罪人为义的神，他的信就算为义。","r":"罗4:5"},"card":["λογίζομαι（算）在第四章出现十一次——这是一本记帐的章。","作工的得工价，不算恩典，乃是该得的。","亚伯拉罕所信的，是叫死人复活、使无变为有的神。"],"sec":[["4:1–8","亚伯拉罕与大卫：算为义"],["4:9–12","割礼是印记，不是条件"],["4:13–17","应许本乎信，属乎恩"],["4:18–25","在无可指望的时候，因信仍有指望"]],"serm":{"pts":[["一、一本记错的帐","4:1–8","神把义记在一个没有做工的人名下"],["二、一个后盖的印","4:9–12","割礼是印记，不是入场券"],["三、一座空的坟","4:17–25","他所信的是叫死人复活的神"]]},"self":"自己记帐——想让神欠我一点什么。","t321":{"k":"不做工的，只信——那是主权的移交。","g":"工价可以夸口，恩赐不能。","p":"靠资历建立的体系，迟早会排挤人。"},"grp":["你有没有过「我做了这么多，神应该……」的想法？","「作工的得工价，不算恩典」——这对你的服事有什么提醒？","亚伯拉罕「身体如同已死」——你有没有一件事已经死了？","什么是你的「印记」，什么是你的「条件」？","这礼拜你要停止在哪一件事上跟神记帐？"],"prac":{"main":"写下你心里「神欠我」的那笔帐，然后划掉它。","items":["对神：为一件「无可指望」的事祷告","对自己：检视我是否在跟神算工价","对人：不跟任何人计较这礼拜的付出","对生活：做一件没有人会知道是你做的好事"]},"safe":["不可把「不作工」讲成「基督徒不必做事」 ——同一章4:12就说要「按踪迹去行」。","不可把「称罪人为义」讲成「神不在乎罪」 ——必须配上3:25「神追讨了，追讨在自己儿子身上」。","不可把4:15讲成「没听过福音的人没有罪」 ——παράβασις（过犯）不等于 ἁμαρτία（罪）；罗5:13–14已说明。","不可把4:19讲成「亚伯拉罕从来没有失败过」 ——创世记诚实记录了他的软弱；那正是4:8「主不算为有罪」的示范。","不可把雅各书2:24讲成与保罗矛盾 ——两人对付不同的敌人，用的是不同的字义。"]},{"n":5,"t":"何况","sub":"一场停战、一次倾倒、一场换王","lv":"A","arc":"确据","q":"我怎么知道神会爱我到底？","truth":"祂在你最糟的时候做了最难的事；现在你已经是祂的了，何况呢？","mv":{"t":"惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们显明了。","r":"罗5:8"},"card":["εἰρήνη（和平）不是心情，是状态——战争结束了。","「浇灌」是完成被动式：倒下去了，而且还在。","παρακοή／ὑπακοή 的字根都是「听」——亚当听偏了，基督在底下听。"],"sec":[["5:1–5","称义的果效：和好、进入、盼望"],["5:6–11","何况：轻重论证"],["5:12–21","两个亚当"]],"serm":{"pts":[["一、一场已经结束的战争","5:1–2","与神相和是状态，不是感觉"],["二、一次倒下去的爱","5:5–8","浇灌，而且还在"],["三、一场换了王的统治","5:17–19","不再是罪作王，是我们在生命中作王"]]},"self":"听偏了——把神的话听成别的意思。","t321":{"k":"换王：不再容罪作王。","g":"爱是被浇灌的，不是被赚来的。","p":"在生命中作王的人，才建得出体系。"},"grp":["「与神相和」是状态不是心情——这对你有什么分别？","「还作罪人的时候」——你信主前最不堪的那一段，神怎么看？","「何况」的逻辑（最难的都做了）对你现在的担忧说什么？","亚当「听偏了」——你最近有没有把神的话听偏？","这礼拜你要在哪一件事上，让耶稣作王？"],"prac":{"main":"每天早上说一次5:8，并加一句：「祂在我最糟的时候就做了。」","items":["对神：为「和好」感谢，不求别的","对自己：写下你最怕神知道的那件事，交给祂","对人：主动与一位关系紧张的人和好","对生活：停止用表现换取安全感"]},"safe":["不可把5:1的「相和」讲成心情 ——那会让感觉不好的人以为自己失去了救恩。","不可拿5:3去对受苦的人说教 ——那节经文是给受苦的人自己用的。","不可把5:20讲成犯罪的许可证 ——必须立刻补上6:1「断乎不可」。","不可在5:12把某一种原罪模型讲成唯一正统 ——联邦说与实存说都是福音派立场。","不可把5:18的「众人」讲成普救论 ——5:17已用「领受的人」限定。"]},{"n":6,"t":"你已经死了","sub":"一场葬礼、一本帐、一批兵器","lv":"A","arc":"转向生活","q":"恩典这么大，那我还在意犯罪做什么？","truth":"恩典不是犯罪的许可证，是换了主人。","mv":{"t":"向罪也当看自己是死的；向神在基督耶稣里，却当看自己是活的。","r":"罗6:11"},"card":["6:2的πῶς是「怎么可能」，不是「不应该」——那是身分的不可能。","σύμφυτος（同长成）是嫁接的字：两根枝子长成一棵。","καταργέω 不是「消灭」，是「解除职权」——罪被免职了，但还在办公室里。"],"sec":[["6:1–11","与基督同死同活"],["6:12–14","不要容罪作王"],["6:15–23","两个主人"]],"serm":{"pts":[["一、一场已经办过的葬礼","6:3–5","你不是要去死，你已经死了"],["二、一本要重新算的帐","6:11","全书第一个命令：算"],["三、一批要交出去的兵器","6:13","你的肢体是兵器，交给谁？"]]},"self":"继续听那个被免职的主人讲话。","t321":{"k":"不要容罪作王——王位只有一个。","g":"是恩典作王，不是我的自律。","p":"体系的地基是新身分，不是新规矩。"},"grp":["「你已经死了」——这句话对你是安慰还是压力？","「算自己是死的」是什么意思？怎么算？","罪被免职了却还在办公室里——你有这种经验吗？","你的肢体最近交给了谁？","这礼拜你要把哪一件事的「兵器」交还给神？"],"prac":{"main":"每天早上算一次：「向罪，我是死的；向神，我是活的。」","items":["对神：把身体具体献上一次","对自己：找出一个被免职却还在听的声音","对人：用你的手做一件服事人的事","对生活：断掉一项让罪好办事的预备"]},"safe":["不可把 καταργέω 讲成「消灭」 ——那会产生「基督徒不会再有罪的挣扎」的错误期待，害了正在挣扎的人。","不可把6:11讲成自我催眠 ——必须把6:3–10的八节事实讲在前面。","不可只讲第六章就要求会众胜过罪 ——必须至少提一句：能力的来源在第八章。否则这篇道会变成一场高级的意志力训练。","不可把「奴仆」讲成神与我们关系的全貌 ——保罗自己在6:19道歉了，并在8:15升级为「儿子」。","不可把6:23的「死」讲成单纯的恐吓 ——若牧养对象中有忧郁或自伤风险者，重点应放在「神的恩赐是永生」，并鼓励寻求专业与教会的实际帮助。"]},{"n":7,"t":"我真是苦啊","sub":"一纸婚书、一个滩头堡、一声呼喊","lv":"A","arc":"诚实面对失败","q":"我知道该怎么做，为什么还是做不到？","truth":"律法是圣洁的；问题不在律法，在我——而出路不是一个方法，是一位。","mv":{"t":"我真是苦啊！谁能救我脱离这取死的身体呢？","r":"罗7:24"},"card":["第七章7–25节：「我」约四十次，圣灵零次。","ἀφορμή（机会）是军事用语：滩头堡。罪在诫命上建立了据点。","παράκειμαι：愿望随手可得；缺的是把它做出来的力量。"],"sec":[["7:1–6","婚姻的比喻：你在律法上死了"],["7:7–13","律法是罪吗？不是"],["7:14–25","挣扎：我所愿意的，我不做"]],"serm":{"pts":[["一、一纸已经失效的婚书","7:1–6","有人被处死了，所以你自由了"],["二、一个罪占住的滩头堡","7:7–13","保罗单挑第十诫——只有它看不见"],["三、一声半夜的呼喊","7:14–25","不是「帮助我努力」，是「主啊，救我」"]]},"self":"「我知道，所以我要努力」——最虔诚的一种有己。","t321":{"k":"用脑靠自己的极限，就是第七章。","g":"出路不是方法，是一位。","p":"靠更好的规矩建不出属神的体系。"},"grp":["「立志为善由得我，行出来由不得我」——你在哪一件事上最有共鸣？","保罗单挑「不可起贪心」——为什么是这一条？","「那个挣扎」是不是生命的证据？你怎么看？","你对付罪的方法，是靠意志力还是靠圣灵？","这礼拜你要在哪一件事上，改说「主啊，救我」？"],"prac":{"main":"这礼拜失败时，不说「我要更努力」，改说「主啊，救我」。","items":["对神：把那件反复的事说出来一次","对自己：那个挣扎是生命的证据——记住它","对人：找一位同伴说出你的挣扎","对生活：断掉一条通往失败的预备路线"]},"safe":["不可把某一种「我是谁」的读法说成唯一正统 ——必须在台上说明历代有不同看法，并指出两边的共同结论。","不可让讲章停在绝望 ——必须明确给出第八章的方向。","不可使用「尸体绑在犯人身上」的素材 ——缺乏可靠史料。","不可把7:17讲成推卸责任 ——保罗整章在承担，最后喊「我真是苦啊」。","不可把7:18讲成全面的自我否定 ——保罗自己限定了范围：「就是我肉体之中」。","不可忽略会后的关怀 ——这篇道会使一些人第一次愿意开口；若察觉严重的自我定罪、忧郁或自伤风险，除属灵陪伴外，应鼓励并协助寻求专业协助。"]},{"n":8,"t":"如今","sub":"一位新住客、三声叹息、一把没有停下来的刀","lv":"A","arc":"全书最高点","q":"一个还会失败的人，怎么可能同时是不被定罪、而且永不隔绝的？","truth":"住在你里面的那一位换了；而抓住你的那一位，永远不会松手。","mv":{"t":"如今，那些在基督耶稣里的就不定罪了。","r":"罗8:1"},"card":["罗6章圣灵0次；罗7:7–25圣灵0次；罗8章圣灵20次以上。","οἰκέω：7:17罪住在我里头 → 8:9圣灵住在你们心里。住客换了。","οὐκ ἐφείσατο（不爱惜）＝创22:12「你没有留下你的儿子」同一个动词。"],"sec":[["8:1–4","不定罪：律法所不能行的，神做了"],["8:5–11","两种心思；圣灵住在你里面"],["8:12–17","儿子的名分：阿爸！父！"],["8:18–25","受造之物与我们的叹息"],["8:26–27","圣灵的叹息与代求"],["8:28–30","金链"],["8:31–39","谁能？没有"]],"serm":{"pts":[["一、住客换了","8:1–17","定罪没有消失，定罪换了地址"],["二、三声叹息","8:18–27","那不是临终的呻吟，是产房里的呻吟"],["三、一把没有停下来的刀","8:28–39","摩利亚的刀停了；各各他的刀没有停"]]},"self":"靠意志力对付罪，然后累垮——第七章的循环。","t321":{"k":"凡「被」神的灵引导的——被动式。让耶稣作王＝我被带领。","g":"金链五环，主词全部是神。","p":"受造之物切望等候神的众子显出来。"},"grp":["8:1「一点定罪也没有」——你心里还有没有一个起诉的声音？","你顺服神的动力，有多少成分是害怕？（8:15）","8:23说有圣灵的人「也是」叹息——你现在心里的那一声叹息是什么？","摩利亚的刀停了，各各他的刀没有停——这对你有什么意义？","这一周，你要在哪一件事上停止怀疑神会放手？"],"prac":{"main":"每天有一次祷告，开头不说「主啊」，说「阿爸」。","items":["对神：连续七天说一次「一点定罪也没有」","对自己：把8:38–39抄下来，在清单最后加上自己的名字","对人：告诉一位软弱的弟兄：「叹息不是不属灵」","对生活：靠着圣灵治死一个具体的恶行，不靠意志力"]},"safe":["不可把8:3讲得不精确 ——「罪身的形状」：真实的人性，却没有罪性。这一句必须讲清楚。","不可把8:28讲成「事情会变好」 ——8:29已经定义了那个「益处」：效法祂儿子的模样。","不可在错的时机引用8:28 ——这节是给受苦者自己消化的，不是给旁观者第三天用来安慰人的。","不可把8:29的某一种读法说成唯一正统 ——预定论的分歧是宗教改革以来的老问题，必须诚实提及。","不可把「阿爸」说成「幼儿语」 ——这个流行说法已被学界修正。","不可把8:38–39讲成「怎样都不会掉」的许可 ——保罗列的十样全部是外在的威胁，这一段的处境是逼迫，不是放纵。"]},{"n":9,"t":"神的话落空了吗？","sub":"一颗碎了的心、一位窑匠、一块石头","lv":"A","arc":"沉思","q":"神说过的话，会不会有一天不算数？","truth":"神的话没有落空——落空的是人靠自己站住的可能。","mv":{"t":"这不是说神的话落了空。","r":"罗9:6"},"card":["保罗讲神的主权之前，先哭了（9:1–3）。","9:22–23的语法不对称：毁灭用被动且未指明施动者；荣耀主词是神。","保罗自己给第九章的结论是9:32：他们不凭信心求，只凭行为求。"],"sec":[["9:1–5","保罗的心碎与八项特权"],["9:6–13","神的拣选一向如此"],["9:14–18","神不公平吗？摩西与法老"],["9:19–24","窑匠与泥土"],["9:25–29","旧约的见证：余数"],["9:30–33","结论：他们凭行为求"]],"serm":{"pts":[["一、一颗碎了的心","9:1–5","讲主权之前，他先哭了"],["二、一位有主权的窑匠","9:6–29","如果神欠你，那叫公平；祂不欠你，那叫怜悯"],["三、一块绊脚的石头","9:30–33","同一块石头：房角石，或绊脚石"]]},"self":"「我有资格」——把神给的礼物当成自己的资本。","t321":{"k":"从审问者的位置，退回受造者的位置。","g":"不在乎那定意的，也不在乎那奔跑的。","p":"属神的体系不是靠资格制运作的。"},"grp":["如果要列出「你的属灵资产清单」，你会写什么？","你是不是曾觉得，你信主多少有一点是因为「你比较愿意」？","你心里有没有一个还在外面的名字？你对他是心痛，还是已经放弃？","9:22说神对「可怒的器皿」是多多忍耐——这对那个名字有什么意义？","这一周，你要为那三个名字祷告七天吗？"],"prac":{"main":"写下三个还没信主的人的名字，为他们祷告七天。","items":["对神：每天说一次「我在这里，纯粹是怜悯」","对自己：写下属灵资格清单，然后写「这些是礼物，不是资本」","对人：当你评估某人「有没有可能信主」时，说「当初我也没有资格」","对生活：不用神的主权当作不作为的借口"]},"safe":["不可跳过9:1–3就直接讲主权 ——保罗讲主权之前先哭了；次序不可颠倒。","不可读到窑匠就停 ——保罗自己的结论在9:30–33：「他们不凭着信心求，只凭着行为求。」","不可把9:13讲成「神憎恨某些人」 ——必须说明比较式表达与玛拉基书的民族性上下文。","不可把9:22–23讲成对称的双重预定 ——原文的语法本身就不对称。","不可省略9:22的「多多忍耐」 ——那是2:4「领你悔改」的同一个字。","不可把第九章与第十、十一章分开 ——尤其11:1「神弃绝了他的百姓吗？断乎没有！」与11:32。","不可让第九章变成不传福音的借口 ——第十章立刻说：「没有传道的，怎能听见呢？」"]},{"n":10,"t":"那话离你不远","sub":"一场很累的工程、一句很近的话、一双很脏的脚","lv":"A","arc":"邀请","q":"一个很热心、很努力、很虔诚的人，为什么会走错？","truth":"那道离你不远——远的是我们的自义，和那些还没有人去的地方。","mv":{"t":"这道离你不远，正在你口里，在你心里。","r":"罗10:8"},"card":["ζῆλος（热心）＝沸腾。而保罗自己最火热的那天，正在逼迫教会。","στῆσαι（立自己的义）＝把一样东西扶起来、立稳——一个很累的工程。","10:13引珥2:32，而那里的「主」是耶和华（YHWH）。"],"sec":[["10:1–4","热心，却走错了"],["10:5–13","那道离你不远"],["10:14–17","宣教的链条"],["10:18–21","他们听见了吗？"]],"serm":{"pts":[["一、一场很累的工程","10:1–4","你一直在扶的那个东西，祂已经替你立好了"],["二、一句很近的话","10:5–13","不必上天，不必下阴间——祂都做完了"],["三、一双很脏的脚","10:14–21","那双脚之所以美，是因为它带来的消息"]]},"self":"立自己的义——一个很虔诚、很费力的动作。","t321":{"k":"口里认耶稣为主——在罗马说这句话是有代价的。","g":"得救只需要喊一个名字，荣耀归给那个名字。","p":"体系靠一双一双被差出去的脚。"},"grp":["你最热心的那段日子，方向对吗？","你心里有没有一个一直在扶、却一直倒的东西？","有没有一件事，让你觉得「我不配靠近神」？","「凡求告主名的」——这个「凡」对你心里那个人有什么意义？","这一周，你要对哪一个人说一句话？"],"prac":{"main":"这礼拜对一位未信的朋友，说一句关心的话（不必是讲道）。","items":["对神：每天问「我今天做的这件事，是为了让神接纳我，还是因为祂已经接纳我？」","对自己：写下你正在「扶」的那个东西","对人：不用罪疚感推动自己传福音","对生活：为一位宣教士具体奉献或代祷一次"]},"safe":["不可把10:4讲成「律法作废了」 ——必须配上3:31「更是坚固律法」与8:4。","不可把10:9–10讲成得救的两个步骤 ——那是一件事的里外两面。","不可把10:13讲成「喊一喊就得救」 ——下一节就说：不信的人求告不出来。","不可用10:14–15制造罪疚感 ——保罗的起点是10:1的渴望，不是罪疚。","不可用10:18论证「不必再宣教」 ——保罗写此信时正计划去西班牙（15:24、28）。","不可跳过10:21 ——全章讲人的责任，最后一个画面却是神的姿势。这一节不可省略。"]},{"n":11,"t":"深哉","sub":"七千人、一棵树、一声赞叹","lv":"A","arc":"敬拜","q":"神会不会有一天放手？","truth":"神从来没有放手；而祂的路，深到我们只能跪下来。","mv":{"t":"深哉，神丰富的智慧和知识！","r":"罗11:33"},"card":["以利亚说「只剩下我一个人」；神说「我为自己留下七千人」。","βαστάζω：不是你托着根，乃是根托着你。","ἀνεξιχνίαστος＝追不到脚印：雪地上跟着走，然后脚印消失了。"],"sec":[["11:1–10","神没有弃绝：七千人与余数"],["11:11–16","跌倒的目的"],["11:17–24","橄榄树：不可夸口"],["11:25–32","奥秘：怜恤众人"],["11:33–36","颂赞"]],"serm":{"pts":[["一、还有七千人","11:1–10","以利亚不是真的只剩一个，他只是不知道"],["二、一棵不属于你的树","11:11–24","不是你托着根，乃是根托着你"],["三、一声赞叹","11:25–36","有些观念的改变，终点不是明白，是敬拜"]]},"self":"蒙恩者的优越感——「还好我不是他们」。","t321":{"k":"一根枝子从来不会扛着树根。","g":"本于他、倚靠他、归于他。","p":"健康的体系为还在外面的人留位置。"},"grp":["你有没有过「只剩我一个」的时候？","你最近对谁（在心里）说过「还好我不是他」？","有没有一件事，让你觉得「这都靠我在撑」？","「失脚不等于跌倒」——你心里有没有一个绊了一下的人？","这一周，你要为那个人祷告吗？"],"prac":{"main":"这礼拜当你想说「还好我不是」，改说「若不是恩典，那就是我」。","items":["对神：那件想不通的事，只说一句「深哉」","对自己：写下谁扛过你","对人：为一个跌倒的人祷告七天","对生活：停止一次「一定要想清楚」的追问"]},"safe":["不可把11:26讲成唯一正确的末世时间表 ——必须说明有不同理解。","★ 不可涉入当代中东政治 ——本章讲救恩历史，不是现代政治。牧者可以有个人看法，但不应把它说成圣经的教导。","不可用11:22恐吓信徒 ——必须并列11:29「神的恩赐和选召是没有后悔的」。","不可用11:32论证普救论 ——但也不可把它的宽度讲小了。","不可只讲11:8（神使他们硬心）而不讲11:20（他们因为不信） ——两面都要说。","不可跳过11:18的警告 ——那是保罗写本章的主要目的（11:13「我对你们外邦人说这话」）。","★ 不可让讲章停在「系统」上 ——保罗自己的终点是敬拜（11:33）。"]},{"n":12,"t":"所以","sub":"祭坛上、身体里、街上","lv":"A","arc":"转折","q":"知道了这么多，怎么才能真的改变？","truth":"改变的路径不是更用力，是换一个心思。","mv":{"t":"不要效法这个世界，只要心意更新而变化。","r":"罗12:2"},"card":["12:1的「所以」是全卷书的转轴：教义→实践。","12:2两个动词都是被动：你不是被世界模成，就是被神变成。","μεταμορφόω 正是登山变像那个字。"],"sec":[["12:1–2","总纲：献上与更新"],["12:3–8","在身体里"],["12:9–13","没有面具的爱"],["12:14–21","以善胜恶"]],"serm":{"pts":[["一、祭坛上","12:1–2","你不是靠自己变的"],["二、身体里","12:3–8","看得合乎中道"],["三、街上","12:9–21","不可为恶所胜，反要以善胜恶"]]},"self":"想靠自己改造自己。","t321":{"k":"心意更新而变化——改变观念就改变生命。","g":"不要看自己过于所当看的。","p":"一个身子，许多肢体。"},"grp":["「将身体献上」——对你而言最难献上的是身体的哪一部分？","你最近被这个世界「模成」了什么样子？","你的恩赐是什么？你有没有在用？","12:13「客要一味地款待」——你上一次接待人是什么时候？","这礼拜你要对哪一个人以善胜恶？"],"prac":{"main":"选一件你被世界模成的样子，这礼拜刻意反其道而行。","items":["对神：每天早上把身体献上一次","对自己：找出一个需要更新的观念","对人：对一个伤害过你的人做一件好事","对生活：接待一个人吃一顿饭"]},"safe":["不可跳过12:1的「所以」 ——那是全卷书的枢纽；若跳过，第十二章就变成独立的道德教训。","不可把献身的动力讲成罪疚 ——12:1的动力是「神的慈悲」。","★ 不可漏掉12:2的被动语态 ——若讲成「你要改变自己」，会直接把会众推回第七章。","不可把12:3讲成「要看低自己」 ——σωφρονέω 是健全，不高估也不低估。","★ 不可用12:19压制受伤害的人 ——必须并列13:4，并提供实际的协助与转介。","不可把12:9–21讲成一张检查表 ——那正好违背12:9「不戴面具」；它是心思被更新的结果，不是条件。"]},{"n":13,"t":"穿上","sub":"一把刀、一笔债、一件衣服","lv":"A","arc":"实践","q":"一个不属这世界的人，怎么在这世界里活？","truth":"付清你欠世界的，只留下一笔永远还不完的；然后穿上一个人。","mv":{"t":"总要披戴主耶稣基督，不要为肉体安排，去放纵私欲。","r":"罗13:14"},"card":["12:19「伸冤在我」↔13:4「他是伸冤的」——同一个字根。","13:12穿的是兵器（东西）；13:14穿的是主耶稣基督（位格）。","πρόνοια＝预先铺路。问题不在试探那一刻，在之前。"],"sec":[["13:1–7","对政府"],["13:8–10","一笔还不完的债"],["13:11–14","看清时候"]],"serm":{"pts":[["一、一把不是你的刀","13:1–7","那把刀不在你手上，也不该在"],["二、一笔还不完的债","13:8–10","把所有的债还清，只留一笔"],["三、一件要穿上的衣服","13:11–14","你不必做成新的自己，你只要穿上一个人"]]},"self":"自己兼任伸冤者的职位。","t321":{"k":"τάσσω字群：神排定，我排到底下，抗拒是排到对面。","g":"穿上——让人看见的是衣服，不是身体。","p":"属神的体系不与社会脱节。"},"grp":["你心里有没有一件事，是你觉得「他欠我一个公道」？","你有没有「该给而还没给」的？（钱、承诺、道歉、一句该说的话）","13:13把「争竞嫉妒」跟醉酒淫乱列在一起——你这礼拜嫉妒了谁？","「穿上一个人」——这对你有什么意义？","这一周，你要具体断掉哪一项「预备」？"],"prac":{"main":"具体断掉一项通往罪的「预备」：删掉、搬走、换路线、改时间、找人同行。","items":["对神：每天在穿衣服之前说「主啊，今天我要穿上祢」","对自己：列出「我欠人的」清单，还掉一项","对人：这礼拜不在背后说一句伤害人的话","对生活：检查有没有该缴而未缴的"]},"safe":["★ 不可只讲13:1而不讲徒5:29 ——只讲一半，就是误导。历史上这段经文曾被用来为奴隶制度、种族隔离、极权政权背书。","★ 绝不可用13:1–7为任何特定的当代政权背书或攻击 ——无论哪一方。","不可跳过13:3–4的功能性描述 ——那既是政府的职分，也是衡量它的标准。","不可把13:8讲成「基督徒不可有任何债务」 ——重点是「该给而未给」。","不可用13:11推算任何时间表 ——保罗要的是紧迫感，不是时刻表。","不可把13:14只讲前半（穿上）而不讲后半（不要铺路） ——那会变成一句好听却不落地的话。"]},{"n":14,"t":"接纳","sub":"一个不是你的仆人、一块石头、一间正在盖的房子","lv":"A","arc":"修复","q":"当我确信我是对的，而弟兄跟我不一样，我该怎么办？","truth":"那个人不是你的仆人；而基督已经为他死了。","mv":{"t":"你们要彼此接纳，如同基督接纳你们一样。","r":"罗15:7"},"card":["ἐξουθενέω（轻看）字根是「零」——把人当作什么都不是。","14:6：一个吃，一个不吃，而他们都在谢饭。","καταλύω（毁坏）正是福音书中「拆圣殿」的那个字。"],"sec":[["14:1–4","接纳：他是别人的仆人"],["14:5–9","各人为主"],["14:10–12","神的台前"],["14:13–18","绊脚石"],["14:19–23","建立与拆毁"]],"serm":{"pts":[["一、一个不是你的仆人","14:1–12","扶他的不是你，是主"],["二、一块石头","14:13–18","基督已经替他死"],["三、一间正在盖的房子","14:19–15:7","如同基督接纳你们一样"]]},"self":"「我是对的」——在神学上正确的有己。","t321":{"k":"论断＝坐上不属于我的位置。","g":"彼此接纳，使荣耀归与神。","p":"不是靠资格制，是靠「如同」。"},"grp":["在你认识的基督徒里，有没有一个人你心里想「跟他讲不通」？","你心里有没有一个基督徒，是你已经「归零」的？","你是不是常觉得「如果我不盯着，他就会倒」？","「基督已经替他死」——这对你怎么看他有什么改变？","这一周，你要主动接触哪一位意见不合的弟兄姊妹？"],"prac":{"main":"主动接触一位跟你意见不合的弟兄姊妹——不是去说服他，是去接纳他。","items":["对神：连续七天说「如同基督接纳我一样」","对自己：写下你心里「归零」的那个名字","对人：这礼拜不对任何人提起那个人的缺点","对生活：不公开评论其他基督徒或教会"]},"safe":["★ 不可让本章变成「什么都可以」 ——必须讲出保罗的三种处理方式（加2／林前5／罗14）。","★ 不可跳过15:7 ——第十四章有一堆「不可」；那个「可以」在15:7。","不可用「软弱」贴标签 ——那正好是14:3所禁止的「轻看」。","不可让会众以为「最保守的人决定一切」 ——保罗自己立场清楚（14:14），且15:1的「担代」是暂时扛着。","不可在讲台上点名具体的争议 ——会使会众对号入座，反而制造新的分裂。","不可用14:23教「跟着感觉走」 ——那节的上下文是「可争议的事上不可违背良心」。"]},{"n":15,"t":"扛","sub":"一个扛着的人、一个接纳的主、一个捧着人的祭司","lv":"A","arc":"承担","q":"我凭什么要为一个跟我不一样的弟兄，放下我的权利？","truth":"祂扛过你，所以你扛得动他；祂接纳了你，所以你接纳得了他。","mv":{"t":"我们坚固的人应该担代不坚固人的软弱，不求自己的喜悦。","r":"罗15:1"},"card":["βαστάζω：11:18「根托着你」→15:1「你要担代」。你曾经是被扛的。","15:3引诗69:9：人骂的是神，而那些骂落在祂身上。","15:5的动词是祈愿语气——合一是求来的，不是做出来的。"],"sec":[["15:1–6","扛：因为基督也不求自己的喜悦"],["15:7–13","接纳：四段旧约"],["15:14–21","献上：福音的祭司"],["15:22–33","搏斗：与我一同竭力"]],"serm":{"pts":[["一、一个扛着的人","15:1–6","你曾经是被扛的，所以现在换你去扛"],["二、一个接纳的主","15:7–13","如同——祂接纳你那天，你不是全对的"],["三、一个捧着人的祭司","15:14–33","你不是在做事，你是在把人捧到神面前"]]},"self":"求自己的喜悦。","t321":{"k":"谦卑不是放弃力量，是改变力量的方向。","g":"一心一口荣耀神。","p":"体系的动力是扛，地基是「如同」。"},"grp":["在你的信仰路上，谁扛过你？","你最近有没有一件事，是明明可以放下、却坚持到底的？","你为某人做的事，是为了「他得益处」，还是「我不想被讨厌」？","「辱骂你人的辱骂都落在我身上」——这对你有什么意义？","这一周，为教会的合一祷告七天——而不是抱怨七天。"],"prac":{"main":"为一位弟兄，放下一件你有权利做的事。","items":["对神：用15章的三个称呼之一开始祷告（忍耐安慰／盼望／平安）","对自己：回想一次你「被扛」的经验，写下他的名字","对人：把一个「有条件才接纳」的条件拿掉一次","对生活：读经时求忍耐、安慰、盼望，不是求答案"]},"safe":["★ 不可用「坚固／不坚固」贴标签 ——必须讲出三重平衡：责任不是特权／ἀδύνατος ＝ 8:3同字根／第七章那个「不能」的人是保罗自己。","不可把15:2讲成「要讨好人」 ——必须讲出两个限定（为他的益处、为建立），并对照加1:10。","★ 不可跳过15:5的祈愿语气 ——那会让整篇变成「你们要努力合一」的道德劝说。","不可把15:5的「同心」讲成「意见一致」 ——第十四章整章都在说看法可以不一样。","不可用15:7论证「什么都可以接纳」 ——必须与16:17及罗14的界线一起读。","不可把15:32讲成「所以祷告不必具体」或「神一定照你求的做」 ——他求得很具体；而神没有照他写的方式做。"]},{"n":16,"t":"名字","sub":"一份名单、一个警告、一段颂赞","lv":"A","arc":"收拢","q":"这么伟大的神学，最后要落在哪里？","truth":"神从来不是在拯救「人类」；祂是在拯救有名字的人。","mv":{"t":"愿荣耀因耶稣基督归与独一全智的神，直到永远。阿们！","r":"罗16:27"},"card":["保罗点名超过二十六位，其中至少九位是女性。","κοπιάω（劳苦）＝做到筋疲力尽的苦工——本章全部用在女性身上。","1:11「我想去坚固你们」→16:25「惟有神能坚固你们的心」——一卷书的距离。"],"sec":[["16:1–2","举荐非比"],["16:3–16","名单"],["16:17–20","警告与应许"],["16:21–24","同工的问安"],["16:25–27","颂赞"]],"serm":{"pts":[["一、一份名单","16:1–16","他记得的不只是名字，是他们做过什么"],["二、一个警告","16:17–20","那些人用的是蛇的方法——而蛇要被踩碎"],["三、一段颂赞","16:21–27","惟有神能坚固你们的心"]]},"self":"只服事自己的肚腹——披着恩慈外衣的有己。","t321":{"k":"惟有神能坚固——不是我在撑。","g":"把荣耀归给神的人，会很自由地称赞别人。","p":"一份有名字、有故事、有感谢的清单。"},"grp":["在你的信仰路上，有哪一个人是你会想写在名单上的？他做过什么？","在教会里，有没有一个人像你的家人？或者你可以成为谁的家人？","你有没有被「听起来很好、其实是为了对方自己」的话影响过？","你现在有没有一件事，是你一直觉得「靠我」的？","这一周，你要跟哪一位说出「我记得你做过……」？"],"prac":{"main":"写下十个名字，在每一个后面写一句「他做过什么」，然后跟其中一位说出来。","items":["对神：为那些默默做事的人祷告","对自己：检视我的语言里有多少是数字，多少是名字","对人：公开感谢一位默默做事的人","对生活：主动问一个你叫不出名字的人的名字"]},"safe":["★ 不可把考古线索讲成定论（鲁孚、暗伯利、以拉都）。","★ 不可在16:1、16:7上宣告某一方是唯一正解 ——应诚实说明有不同理解，并把重点放在无争议的部分。","★ 不可用16:17排除异己 ——必须明确讲出五个判准，特别是「背乎所学之道」是客观的教义标准。","不可把16:17与罗14对立 ——两章讲的是完全不同的人。","不可用16:20推算时间表 ——重点是确定性，不是时刻表。","不可跳过16:25–27 ——那是全卷书的收尾，也是整个系列的收尾。"]}],"txt":{"1":["耶稣基督的仆人保罗，奉召为使徒，特派传神的福音。","这福音是神从前藉众先知在圣经上所应许的，","论到他儿子—我主耶稣基督。按肉体说，是从大卫后裔生的；","按圣善的灵说，因从死里复活，以大能显明是神的儿子。","我们从他受了恩惠并使徒的职分，在万国之中叫人为他的名信服真道；","其中也有你们这蒙召属耶稣基督的人。","我写信给你们在罗马、为神所爱、奉召作圣徒的众人。愿恩惠、平安从我们的父神并主耶稣基督归与你们！","第一，我靠着耶稣基督，为你们众人感谢我的神，因你们的信德传遍了天下。","我在他儿子福音上，用心灵所事奉的神，可以见证我怎样不住地提到你们；","在祷告之间常常恳求，或者照神的旨意，终能亨通地到你们那里去。","因为我切切地想见你们，要把些属灵的恩赐分给你们，使你们可以坚固；","这样，我在你们中间，因你与我彼此的信心，就可以同得安慰。","弟兄们，我不愿意你们不知道，我屡次定意往你们那里去，要在你们中间得些果子，如同在其余的外邦人中一样；只是到如今仍有阻隔。","无论是希腊人、化外人、聪明人、愚拙人，我都欠他们的债，","所以情愿尽我的力量，将福音也传给你们在罗马的人。","我不以福音为耻；这福音本是神的大能，要救一切相信的，先是犹太人，后是希腊人。","因为神的义正在这福音上显明出来；这义是本于信，以致于信。如经上所记：义人必因信得生。","原来，神的忿怒从天上显明在一切不虔不义的人身上，就是那些行不义阻挡真理的人。","神的事情，人所能知道的，原显明在人心里，因为神已经给他们显明。","自从造天地以来，神的永能和神性是明明可知的，虽是眼不能见，但借着所造之物就可以晓得，叫人无可推诿。","因为，他们虽然知道神，却不当作神荣耀他，也不感谢他。他们的思念变为虚妄，无知的心就昏暗了。","自称为聪明，反成了愚拙，","将不能朽坏之神的荣耀变为偶像，仿佛必朽坏的人和飞禽、走兽、昆虫的样式。","所以，神任凭他们逞着心里的情欲行污秽的事，以致彼此玷辱自己的身体。","他们将神的真实变为虚谎，去敬拜事奉受造之物，不敬奉那造物的主；主乃是可称颂的，直到永远。阿们！","因此，神任凭他们放纵可羞耻的情欲。他们的女人把顺性的用处变为逆性的用处；","男人也是如此，弃了女人顺性的用处，欲火攻心，彼此贪恋，男和男行可羞耻的事，就在自己身上受这妄为当得的报应。","他们既然故意不认识神，神就任凭他们存邪僻的心，行那些不合理的事；","装满了各样不义、邪恶、贪婪、恶毒，满心是嫉妒、凶杀、争竞、诡诈、毒恨；","又是谗毁的、背后说人的、怨恨神的、侮慢人的、狂傲的、自夸的、捏造恶事的、违背父母的、","无知的、背约的、无亲情的、不怜悯人的。","他们虽知道神判定行这样事的人是当死的，然而他们不但自己去行，还喜欢别人去行。"],"2":["你这论断人的，无论你是谁，也无可推诿。你在什么事上论断人，就在什么事上定自己的罪；因你这论断人的，自己所行却和别人一样。","我们知道这样行的人，神必照真理审判他。","你这人哪，你论断行这事的人，自己所行的却和别人一样，你以为能逃脱神的审判吗？","还是你藐视他丰富的恩慈、宽容、忍耐，不晓得他的恩慈是领你悔改呢？","你竟任着你刚硬不悔改的心，为自己积蓄忿怒，以致神震怒，显他公义审判的日子来到。","他必照各人的行为报应各人。","凡恒心行善、寻求荣耀、尊贵和不能朽坏之福的，就以永生报应他们；","惟有结党、不顺从真理、反顺从不义的，就以忿怒、恼恨报应他们；","将患难、困苦加给一切作恶的人，先是犹太人，后是希腊人；","却将荣耀、尊贵、平安加给一切行善的人，先是犹太人，后是希腊人。","因为神不偏待人。","凡没有律法犯了罪的，也必不按律法灭亡；凡在律法以下犯了罪的，也必按律法受审判。","（原来在神面前，不是听律法的为义，乃是行律法的称义。","没有律法的外邦人若顺着本性行律法上的事，他们虽然没有律法，自己就是自己的律法。","这是显出律法的功用刻在他们心里，他们是非之心同作见证，并且他们的思念互相较量，或以为是，或以为非。）","就在神藉耶稣基督审判人隐秘事的日子，照着我的福音所言。","你称为犹太人，又倚靠律法，且指着神夸口；","既从律法中受了教训，就晓得神的旨意，也能分别是非；","又深信自己是给瞎子领路的，是黑暗中人的光，","是蠢笨人的师傅，是小孩子的先生，在律法上有知识和真理的模范。","你既是教导别人，还不教导自己吗？你讲说人不可偷窃，自己还偷窃吗？","你说人不可奸淫，自己还奸淫吗？你厌恶偶像，自己还偷窃庙中之物吗？","你指着律法夸口，自己倒犯律法，玷辱神吗？","神的名在外邦人中，因你们受了亵渎，正如经上所记的。","你若是行律法的，割礼固然于你有益；若是犯律法的，你的割礼就算不得割礼。","所以那未受割礼的，若遵守律法的条例，他虽然未受割礼，岂不算是有割礼吗？","而且那本来未受割礼的，若能全守律法，岂不是要审判你这有仪文和割礼竟犯律法的人吗？","因为外面作犹太人的，不是真犹太人；外面肉身的割礼，也不是真割礼。","惟有里面作的，才是真犹太人；真割礼也是心里的，在乎灵，不在乎仪文。这人的称赞不是从人来的，乃是从神来的。"],"3":["这样说来，犹太人有什么长处？割礼有什么益处呢？","凡事大有好处：第一是神的圣言交托他们。","即便有不信的，这有何妨呢？难道他们的不信就废掉神的信吗？","断乎不能！不如说，神是真实的，人都是虚谎的。如经上所记：你责备人的时候，显为公义；被人议论的时候，可以得胜。","我且照着人的常话说，我们的不义若显出神的义来，我们可以怎么说呢？神降怒，是他不义吗？","断乎不是！若是这样，神怎能审判世界呢？","若神的真实，因我的虚谎越发显出他的荣耀，为什么我还受审判，好像罪人呢？","为什么不说，我们可以作恶以成善呢？这是毁谤我们的人说我们有这话。这等人定罪是该当的。","这却怎么样呢？我们比他们强吗？决不是的！因我们已经证明：犹太人和希腊人都在罪恶之下。","就如经上所记：没有义人，连一个也没有。","没有明白的；没有寻求神的；","都是偏离正路，一同变为无用。没有行善的，连一个也没有。","他们的喉咙是敞开的坟墓；他们用舌头弄诡诈，嘴唇里有虺蛇的毒气，","满口是咒骂苦毒。","杀人流血，他们的脚飞跑，","所经过的路便行残害暴虐的事。","平安的路，他们未曾知道；","他们眼中不怕神。","我们晓得律法上的话都是对律法以下之人说的，好塞住各人的口，叫普世的人都伏在神审判之下。","所以凡有血气的，没有一个因行律法能在神面前称义，因为律法本是叫人知罪。","但如今，神的义在律法以外已经显明出来，有律法和先知为证：","就是神的义，因信耶稣基督加给一切相信的人，并没有分别。","因为世人都犯了罪，亏缺了神的荣耀；","如今却蒙神的恩典，因基督耶稣的救赎，就白白地称义。","神设立耶稣作挽回祭，是凭着耶稣的血，借着人的信，要显明神的义；因为他用忍耐的心宽容人先时所犯的罪，","好在今时显明他的义，使人知道他自己为义，也称信耶稣的人为义。","既是这样，哪里能夸口呢？没有可夸的了。用何法没有的呢？是用立功之法吗？不是，乃用信主之法。","所以我们看定了：人称义是因着信，不在乎遵行律法。","难道神只作犹太人的神吗？不也是作外邦人的神吗？是的，也作外邦人的神。","神既是一位，他就要因信称那受割礼的为义，也要因信称那未受割礼的为义。","这样，我们因信废了律法吗？断乎不是！更是坚固律法。"],"4":["如此说来，我们的祖宗亚伯拉罕凭着肉体得了什么呢？","倘若亚伯拉罕是因行为称义，就有可夸的；只是在神面前并无可夸。","经上说什么呢？说：『亚伯拉罕信神，这就算为他的义。』","作工的得工价，不算恩典，乃是该得的；","惟有不做工的，只信称罪人为义的神，他的信就算为义。","正如大卫称那在行为以外蒙神算为义的人是有福的。","他说：得赦免其过、遮盖其罪的，这人是有福的。","主不算为有罪的，这人是有福的。","如此看来，这福是单加给那受割礼的人吗？不也是加给那未受割礼的人吗？因我们所说，亚伯拉罕的信，就算为他的义，","是怎么算的呢？是在他受割礼的时候呢？是在他未受割礼的时候呢？不是在受割礼的时候，乃是在未受割礼的时候。","并且他受了割礼的记号，作他未受割礼的时候因信称义的印证，叫他作一切未受割礼而信之人的父，使他们也算为义；","又作受割礼之人的父，就是那些不但受割礼，并且按我们的祖宗亚伯拉罕未受割礼而信之踪迹去行的人。","因为神应许亚伯拉罕和他后裔，必得承受世界，不是因律法，乃是因信而得的义。","若是属乎律法的人才得为后嗣，信就归于虚空，应许也就废弃了。","因为律法是惹动忿怒的；哪里没有律法，那里就没有过犯。","所以人得为后嗣是本乎信，因此就属乎恩，叫应许定然归给一切后裔；不但归给那属乎律法的，也归给那效法亚伯拉罕之信的。","亚伯拉罕所信的，是那叫死人复活、使无变为有的神，他在主面前作我们世人的父。如经上所记：「我已经立你作多国的父。","他在无可指望的时候，因信仍有指望，就得以作多国的父，正如先前所说：『你的后裔将要如此。』","他将近百岁的时候，虽然想到自己的身体如同已死，撒拉的生育已经断绝，他的信心还是不软弱；","并且仰望神的应许，总没有因不信心里起疑惑，反倒因信心里得坚固，将荣耀归给神，","且满心相信神所应许的必能做成。","所以，这就算为他的义。","算为他义」的这句话不是单为他写的，","也是为我们将来得算为义之人写的，就是我们这信神使我们的主耶稣从死里复活的人。","耶稣被交给人，是为我们的过犯；复活，是为叫我们称义。"],"5":["我们既因信称义，就借着我们的主耶稣基督得与神相和。","我们又借着他，因信得进入现在所站的这恩典中，并且欢欢喜喜盼望神的荣耀。","不但如此，就是在患难中也是欢欢喜喜的；因为知道患难生忍耐，","忍耐生老练，老练生盼望；","盼望不至于羞耻，因为所赐给我们的圣灵将神的爱浇灌在我们心里。","因我们还软弱的时候，基督就按所定的日期为罪人死。","为义人死，是少有的；为仁人死，或者有敢做的。","惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们显明了。","现在我们既靠着他的血称义，就更要借着他免去神的忿怒。","因为我们作仇敌的时候，且借着神儿子的死，得与神和好；既已和好，就更要因他的生得救了。","不但如此，我们既借着我主耶稣基督得与神和好，也就借着他以神为乐。","这就如罪是从一人入了世界，死又是从罪来的；于是死就临到众人，因为众人都犯了罪。","没有律法之先，罪已经在世上；但没有律法，罪也不算罪。","然而从亚当到摩西，死就作了王，连那些不与亚当犯一样罪过的，也在他的权下。亚当乃是那以后要来之人的预像。","只是过犯不如恩赐，若因一人的过犯，众人都死了，何况神的恩典，与那因耶稣基督一人恩典中的赏赐，岂不更加倍地临到众人吗？","因一人犯罪就定罪，也不如恩赐，原来审判是由一人而定罪，恩赐乃是由许多过犯而称义。","若因一人的过犯，死就因这一人作了王，何况那些受洪恩又蒙所赐之义的，岂不更要因耶稣基督一人在生命中作王吗？","如此说来，因一次的过犯，众人都被定罪；照样，因一次的义行，众人也就被称义得生命了。","因一人的悖逆，众人成为罪人；照样，因一人的顺从，众人也成为义了。","律法本是外添的，叫过犯显多；只是罪在哪里显多，恩典就更显多了。","就如罪作王叫人死；照样，恩典也借着义作王，叫人因我们的主耶稣基督得永生。"],"6":["这样，怎么说呢？我们可以仍在罪中、叫恩典显多吗？","断乎不可！我们在罪上死了的人岂可仍在罪中活着呢？","岂不知我们这受洗归入基督耶稣的人是受洗归入他的死吗？","所以，我们借着洗礼归入死，和他一同埋葬，原是叫我们一举一动有新生的样式，像基督借着父的荣耀从死里复活一样。","我们若在他死的形状上与他联合，也要在他复活的形状上与他联合。","因为知道我们的旧人和他同钉十字架，使罪身灭绝，叫我们不再作罪的奴仆。","因为已死的人是脱离了罪。","我们若是与基督同死，就信必与他同活。","因为知道基督既从死里复活，就不再死，死也不再作他的主了。","他死是向罪死了，只有一次；他活是向神活着。","这样，你们向罪也当看自己是死的；向神在基督耶稣里，却当看自己是活的。","所以，不要容罪在你们必死的身上作王，使你们顺从身子的私欲。","也不要将你们的肢体献给罪作不义的器具；倒要像从死里复活的人，将自己献给神，并将肢体作义的器具献给神。","罪必不能作你们的主，因你们不在律法之下，乃在恩典之下。","这却怎么样呢？我们在恩典之下，不在律法之下，就可以犯罪吗？断乎不可！","岂不晓得你们献上自己作奴仆，顺从谁，就作谁的奴仆吗？或作罪的奴仆，以至于死；或作顺命的奴仆，以至成义。","感谢神！因为你们从前虽然作罪的奴仆，现今却从心里顺服了所传给你们道理的模范。","你们既从罪里得了释放，就作了义的奴仆。","我因你们肉体的软弱，就照人的常话对你们说。你们从前怎样将肢体献给不洁不法作奴仆，以至于不法；现今也要照样将肢体献给义作奴仆，以至于成圣。","因为你们作罪之奴仆的时候，就不被义约束了。","你们现今所看为羞耻的事，当日有什么果子呢？那些事的结局就是死。","但现今，你们既从罪里得了释放，作了神的奴仆，就有成圣的果子，那结局就是永生。","因为罪的工价乃是死；惟有神的恩赐，在我们的主基督耶稣里，乃是永生。"],"7":["弟兄们，我现在对明白律法的人说，你们岂不晓得律法管人是在活着的时候吗？","就如女人有了丈夫，丈夫还活着，就被律法约束；丈夫若死了，就脱离了丈夫的律法。","所以丈夫活着，她若归于别人，便叫淫妇；丈夫若死了，她就脱离了丈夫的律法，虽然归于别人，也不是淫妇。","我的弟兄们，这样说来，你们借着基督的身体，在律法上也是死了，叫你们归于别人，就是归于那从死里复活的，叫我们结果子给神。","因为我们属肉体的时候，那因律法而生的恶欲就在我们肢体中发动，以致结成死亡的果子。","但我们既然在捆我们的律法上死了，现今就脱离了律法，叫我们服事主，要按着心灵的新样，不按着仪文的旧样。","这样，我们可说什么呢？律法是罪吗？断乎不是！只是非因律法，我就不知何为罪。非律法说『不可起贪心』，我就不知何为贪心。","然而罪趁着机会，就借着诫命叫诸般的贪心在我里头发动；因为没有律法，罪是死的。","我以前没有律法是活着的；但是诫命来到，罪又活了，我就死了。","那本来叫人活的诫命，反倒叫我死；","因为罪趁着机会，就借着诫命引诱我，并且杀了我。","这样看来，律法是圣洁的，诫命也是圣洁、公义、良善的。","既然如此，那良善的是叫我死吗？断乎不是！叫我死的乃是罪。但罪借着那良善的叫我死，就显出真是罪，叫罪因着诫命更显出是恶极了。","我们原晓得律法是属乎灵的，但我是属乎肉体的，是已经卖给罪了。","因为我所做的，我自己不明白；我所愿意的，我并不做；我所恨恶的，我倒去做。","若我所做的，是我所不愿意的，我就应承律法是善的。","既是这样，就不是我做的，乃是住在我里头的罪做的。","我也知道，在我里头，就是我肉体之中，没有良善。因为，立志为善由得我，只是行出来由不得我。","故此，我所愿意的善，我反不做；我所不愿意的恶，我倒去做。","若我去做所不愿意做的，就不是我做的，乃是住在我里头的罪做的。","我觉得有个律，就是我愿意为善的时候，便有恶与我同在。","因为按着我里面的意思，我是喜欢神的律；","但我觉得肢体中另有个律和我心中的律交战，把我掳去，叫我附从那肢体中犯罪的律。","我真是苦啊！谁能救我脱离这取死的身体呢？","感谢神，靠着我们的主耶稣基督就能脱离了。这样看来，我以内心顺服神的律，我肉体却顺服罪的律了。"],"8":["如今，那些在基督耶稣里的就不定罪了。","因为赐生命圣灵的律，在基督耶稣里释放了我，使我脱离罪和死的律了。","律法既因肉体软弱，有所不能行的，神就差遣自己的儿子，成为罪身的形状，作了赎罪祭，在肉体中定了罪案，","使律法的义成就在我们这不随从肉体、只随从圣灵的人身上。","因为随从肉体的人体贴肉体的事，随从圣灵的人体贴圣灵的事。","体贴肉体的，就是死；体贴圣灵的，乃是生命、平安。","原来体贴肉体的，就是与神为仇；因为不服神的律法，也是不能服，","而且属肉体的人不能得神的喜欢。","如果神的灵住在你们心里，你们就不属肉体，乃属圣灵了。人若没有基督的灵，就不是属基督的。","基督若在你们心里，身体就因罪而死，心灵却因义而活。","然而，叫耶稣从死里复活者的灵若住在你们心里，那叫基督耶稣从死里复活的，也必借着住在你们心里的圣灵，使你们必死的身体又活过来。","弟兄们，这样看来，我们并不是欠肉体的债去顺从肉体活着。","你们若顺从肉体活着，必要死；若靠着圣灵治死身体的恶行，必要活着。","因为凡被神的灵引导的，都是神的儿子。","你们所受的，不是奴仆的心，仍旧害怕；所受的，乃是儿子的心，因此我们呼叫：「阿爸！父！","圣灵与我们的心同证我们是神的儿女；","既是儿女，便是后嗣，就是神的后嗣，和基督同作后嗣。如果我们和他一同受苦，也必和他一同得荣耀。","我想，现在的苦楚若比起将来要显于我们的荣耀就不足介意了。","受造之物切望等候神的众子显出来。","因为受造之物服在虚空之下，不是自己愿意，乃是因那叫他如此的缘故。","但受造之物仍然指望脱离败坏的辖制，得享神儿女自由的荣耀。","我们知道一切受造之物一同叹息、劳苦，直到如今。","不但如此，就是我们这有圣灵初结果子的，也是自己心里叹息，等候得着儿子的名分，乃是我们的身体得赎。","我们得救是在乎盼望；只是所见的盼望不是盼望，谁还盼望他所见的呢？","但我们若盼望那所不见的，就必忍耐等候。","况且，我们的软弱有圣灵帮助；我们本不晓得当怎样祷告，只是圣灵亲自用说不出来的叹息替我们祷告。","鉴察人心的，晓得圣灵的意思，因为圣灵照着神的旨意替圣徒祈求。","我们晓得万事都互相效力，叫爱神的人得益处，就是按他旨意被召的人。","因为他预先所知道的人，就预先定下效法他儿子的模样，使他儿子在许多弟兄中作长子。","预先所定下的人又召他们来；所召来的人又称他们为义；所称为义的人又叫他们得荣耀。","既是这样，还有什么说的呢？神若帮助我们，谁能敌挡我们呢？","神既不爱惜自己的儿子，为我们众人舍了，岂不也把万物和他一同白白地赐给我们吗？","谁能控告神所拣选的人呢？有神称他们为义了。","谁能定他们的罪呢？有基督耶稣已经死了，而且从死里复活，现今在神的右边，也替我们祈求。","谁能使我们与基督的爱隔绝呢？难道是患难吗？是困苦吗？是逼迫吗？是饥饿吗？是赤身露体吗？是危险吗？是刀剑吗？","如经上所记：我们为你的缘故终日被杀；人看我们如将宰的羊。","然而，靠着爱我们的主，在这一切的事上已经得胜有余了。","因为我深信无论是死，是生，是天使，是掌权的，是有能的，是现在的事，是将来的事，","是高处的，是低处的，是别的受造之物，都不能叫我们与神的爱隔绝；这爱是在我们主基督耶稣里的。"],"9":["我在基督里说真话，并不谎言，有我良心被圣灵感动，给我作见证：","我是大有忧愁，心里时常伤痛；","为我弟兄，我骨肉之亲，就是自己被咒诅，与基督分离，我也愿意。","他们是以色列人；那儿子的名分、荣耀、诸约、律法、礼仪、应许都是他们的。","列祖就是他们的祖宗；按肉体说，基督也是从他们出来的，他是在万有之上，永远可称颂的神。阿们！","这不是说神的话落了空。因为从以色列生的不都是以色列人，","也不因为是亚伯拉罕的后裔就都作他的儿女；惟独「从以撒生的才要称为你的后裔。","这就是说，肉身所生的儿女不是神的儿女，惟独那应许的儿女才算是后裔。","因为所应许的话是这样说：「到明年这时候我要来，撒拉必生一个儿子。","不但如此，还有利百加，既从一个人，就是从我们的祖宗以撒怀了孕，","（双子还没有生下来，善恶还没有做出来，只因要显明神拣选人的旨意，不在乎人的行为，乃在乎召人的主。）","神就对利百加说：「将来大的要服事小的。","正如经上所记：雅各是我所爱的；以扫是我所恶的。","这样，我们可说什么呢？难道神有什么不公平吗？断乎没有！","因他对摩西说：我要怜悯谁就怜悯谁，要恩待谁就恩待谁。","据此看来，这不在乎那定意的，也不在乎那奔跑的，只在乎发怜悯的神。","因为经上有话向法老说：「我将你兴起来，特要在你身上彰显我的权能，并要使我的名传遍天下。","如此看来，神要怜悯谁就怜悯谁，要叫谁刚硬就叫谁刚硬。","这样，你必对我说：「他为什么还指责人呢？有谁抗拒他的旨意呢？","你这个人哪，你是谁，竟敢向神强嘴呢？受造之物岂能对造他的说：「你为什么这样造我呢？","窑匠难道没有权柄从一团泥里拿一块做成贵重的器皿，又拿一块做成卑贱的器皿吗？","倘若神要显明他的忿怒，彰显他的权能，就多多忍耐宽容那可怒预备遭毁灭的器皿，","又要将他丰盛的荣耀彰显在那蒙怜悯、早预备得荣耀的器皿上。","这器皿就是我们被神所召的，不但是从犹太人中，也是从外邦人中。","就像神在何西阿书上说：那本来不是我子民的，我要称为「我的子民」；本来不是蒙爱的，我要称为「蒙爱的」。","从前在什么地方对他们说：你们不是我的子民，将来就在那里称他们为「永生神的儿子」。","以赛亚指着以色列人喊着说：「以色列人虽多如海沙，得救的不过是剩下的余数；","因为主要在世上施行他的话，叫他的话都成全，速速地完结。","又如以赛亚先前说过：若不是万军之主给我们存留余种，我们早已像所多玛，蛾摩拉的样子了。","这样，我们可说什么呢？那本来不追求义的外邦人反得了义，就是因信而得的义。","但以色列人追求律法的义，反得不着律法的义。","这是什么缘故呢？是因为他们不凭着信心求，只凭着行为求，他们正跌在那绊脚石上。","就如经上所记：我在锡安放一块绊脚的石头，跌人的磐石；信靠他的人必不至于羞愧。"],"10":["弟兄们，我心里所愿的，向神所求的，是要以色列人得救。","我可以证明他们向神有热心，但不是按着真知识；","因为不知道神的义，想要立自己的义，就不服神的义了。","律法的总结就是基督，使凡信他的都得着义。","摩西写着说：『人若行那出于律法的义，就必因此活着。』","惟有出于信心的义如此说：「你不要心里说：谁要升到天上去呢？（就是要领下基督来；）","谁要下到阴间去呢？（就是要领基督从死里上来。）","他到底怎么说呢？他说：这道离你不远，正在你口里，在你心里——就是我们所传信主的道。","你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。","因为人心里相信，就可以称义；口里承认，就可以得救。","经上说：「凡信他的人必不至于羞愧。","犹太人和希腊人并没有分别，因为众人同有一位主；他也厚待一切求告他的人。","因为「凡求告主名的，就必得救。","然而，人未曾信他，怎能求他呢？未曾听见他，怎能信他呢？没有传道的，怎能听见呢？","若没有奉差遣，怎能传道呢？如经上所记：「报福音、传喜信的人，他们的脚踪何等佳美！","只是人没有都听从福音，因为以赛亚说：「主啊，我们所传的有谁信呢？","可见信道是从听道来的，听道是从基督的话来的。","但我说，人没有听见吗？诚然听见了。他们的声音传遍天下；他们的言语传到地极。","我再说，以色列人不知道吗？先有摩西说：我要用那不成子民的，惹动你们的愤恨；我要用那无知的民触动你们的怒气。","又有以赛亚放胆说：没有寻找我的，我叫他们遇见；没有访问我的，我向他们显现。","至于以色列人，他说：我整天伸手招呼那悖逆顶嘴的百姓。"],"11":["我且说，神弃绝了他的百姓吗？断乎没有！因为我也是以色列人，亚伯拉罕的后裔，属便雅悯支派的。","神并没有弃绝他预先所知道的百姓。你们岂不晓得经上论到以利亚是怎么说的呢？他在神面前怎样控告以色列人说：","主啊，他们杀了你的先知，拆了你的祭坛，只剩下我一个人；他们还要寻索我的命。","神的回话是怎么说的呢？他说：「我为自己留下七千人，是未曾向巴力屈膝的。","如今也是这样，照着拣选的恩典，还有所留的余数。","既是出于恩典，就不在乎行为；不然，恩典就不是恩典了。","这是怎么样呢？以色列人所求的，他们没有得着，惟有蒙拣选的人得着了；其余的就成了顽梗不化的。","如经上所记：神给他们昏迷的心，眼睛不能看见，耳朵不能听见，直到今日。","大卫也说：愿他们的筵席变为网罗，变为机槛，变为绊脚石，作他们的报应。","愿他们的眼睛昏蒙，不得看见；愿你时常弯下他们的腰。","我且说，他们失脚是要他们跌倒吗？断乎不是！反倒因他们的过失，救恩便临到外邦人，要激动他们发愤。","若他们的过失为天下的富足，他们的缺乏为外邦人的富足；何况他们的丰满呢？","我对你们外邦人说这话；因我是外邦人的使徒，所以敬重我的职分，","或者可以激动我骨肉之亲发愤，好救他们一些人。","若他们被丢弃，天下就得与神和好；他们被收纳，岂不是死而复生吗？","所献的新面若是圣洁，全团也就圣洁了；树根若是圣洁，树枝也就圣洁了。","若有几根枝子被折下来，你这野橄榄得接在其中，一同得着橄榄根的肥汁，","你就不可向旧枝子夸口；若是夸口，当知道不是你托着根，乃是根托着你。","你若说，那枝子被折下来是特为叫我接上。","不错！他们因为不信，所以被折下来；你因为信，所以立得住；你不可自高，反要惧怕。","神既不爱惜原来的枝子，也必不爱惜你。","可见，神的恩慈和严厉向那跌倒的人是严厉的，向你是有恩慈的，只要你长久在他的恩慈里；不然，你也要被砍下来。","而且他们若不是长久不信，仍要被接上，因为神能够把他们从新接上。","你是从那天生的野橄榄上砍下来的，尚且逆着性得接在好橄榄上，何况这本树的枝子，要接在本树上呢！","弟兄们，我不愿意你们不知道这奥秘（恐怕你们自以为聪明），就是以色列人有几分是硬心的，等到外邦人的数目添满了，","于是以色列全家都要得救。如经上所记：必有一位救主从锡安出来，要消除雅各家的一切罪恶；","又说：我除去他们罪的时候，这就是我与他们所立的约。","就着福音说，他们为你们的缘故是仇敌；就着拣选说，他们为列祖的缘故是蒙爱的。","因为神的恩赐和选召是没有后悔的。","你们从前不顺服神，如今因他们的不顺服，你们倒蒙了怜恤。","这样，他们也是不顺服，叫他们因着施给你们的怜恤，现在也就蒙怜恤。","因为神将众人都圈在不顺服之中，特意要怜恤众人。","深哉，神丰富的智慧和知识！他的判断何其难测！他的踪迹何其难寻！","谁知道主的心？谁作过他的谋士呢？","谁是先给了他，使他后来偿还呢？","因为万有都是本于他，倚靠他，归于他。愿荣耀归给他，直到永远。阿们！"],"12":["所以弟兄们，我以神的慈悲劝你们，将身体献上，当作活祭，是圣洁的，是神所喜悦的；你们如此事奉乃是理所当然的。","不要效法这个世界，只要心意更新而变化，叫你们察验何为神的善良、纯全、可喜悦的旨意。","我凭着所赐我的恩对你们各人说：不要看自己过于所当看的，要照着神所分给各人信心的大小，看得合乎中道。","正如我们一个身子上有好些肢体，肢体也不都是一样的用处。","我们这许多人，在基督里成为一身，互相联络作肢体，也是如此。","按我们所得的恩赐，各有不同。或说预言，就当照着信心的程度说预言；","或作执事，就当专一执事；或作教导的，就当专一教导；","或作劝化的，就当专一劝化；施舍的，就当诚实；治理的，就当殷勤；怜悯人的，就当甘心。","爱人不可虚假。恶要厌恶，善要亲近。","爱弟兄，要彼此亲热；恭敬人，要彼此推让。","殷勤，不可懒惰；要心里火热，常常服事主。","在指望中要喜乐；在患难中要忍耐；祷告要恒切。","圣徒缺乏要帮补；客要一味地款待。","逼迫你们的，要给他们祝福；只要祝福，不可咒诅。","与喜乐的人要同乐；与哀哭的人要同哭。","要彼此同心；不要志气高大，倒要俯就卑微的人。不要自以为聪明。","不要以恶报恶；众人以为美的事要留心去做。","若是能行，总要尽力与众人和睦。","亲爱的弟兄，不要自己伸冤，宁可让步，听凭主怒；因为经上记着：『主说：伸冤在我，我必报应。』","所以，「你的仇敌若饿了，就给他吃；若渴了，就给他喝；因为你这样行就是把炭火堆在他的头上。","你不可为恶所胜，反要以善胜恶。"],"13":["在上有权柄的，人人当顺服他，因为没有权柄不是出于神的。凡掌权的都是神所命的。","所以，抗拒掌权的就是抗拒神的命；抗拒的必自取刑罚。","作官的原不是叫行善的惧怕，乃是叫作恶的惧怕。你愿意不惧怕掌权的吗？你只要行善，就可得他的称赞；","因为他是神的用人，是与你有益的。你若作恶，却当惧怕；因为他不是空空地佩剑；他是神的用人，是伸冤的，刑罚那作恶的。","所以，你们必须顺服，不但是因为刑罚，也是因为良心。","你们纳粮，也为这个缘故；因他们是神的差役，常常特管这事。","凡人所当得的，就给他。当得粮的，给他纳粮；当得税的，给他上税；当惧怕的，惧怕他；当恭敬的，恭敬他。","凡事都不可亏欠人，惟有彼此相爱要常以为亏欠，因为爱人的就完全了律法。","像那不可奸淫，不可杀人，不可偷盗，不可贪婪，或有别的诫命，都包在爱人如己这一句话之内了。","爱是不加害与人的，所以爱就完全了律法。","再者，你们晓得现今就是该趁早睡醒的时候；因为我们得救，现今比初信的时候更近了。","黑夜已深，白昼将近；我们就当脱去暗昧的行为，带上光明的兵器。","行事为人要端正，好像行在白昼。不可荒宴醉酒，不可好色邪荡，不可争竞嫉妒。","总要披戴主耶稣基督，不要为肉体安排，去放纵私欲。"],"14":["信心软弱的，你们要接纳，但不要辩论所疑惑的事。","有人信百物都可吃；但那软弱的，只吃蔬菜。","吃的人不可轻看不吃的人；不吃的人不可论断吃的人；因为神已经收纳他了。","你是谁，竟论断别人的仆人呢？他或站住或跌倒，自有他的主人在；而且他也必要站住，因为主能使他站住。","有人看这日比那日强；有人看日日都是一样。只是各人心里要意见坚定。","守日的人是为主守的。吃的人是为主吃的，因他感谢神；不吃的人是为主不吃的，也感谢神。","我们没有一个人为自己活，也没有一个人为自己死。","我们若活着，是为主而活；若死了，是为主而死。所以，我们或活或死总是主的人。","因此基督死了，又活了，为要作死人并活人的主。","你这个人，为什么论断弟兄呢？又为什么轻看弟兄呢？因我们都要站在神的台前。","经上写着：主说：我凭着我的永生起誓：万膝必向我跪拜；万口必向我承认。","这样看来，我们各人必要将自己的事在神面前说明。","所以，我们不可再彼此论断，宁可定意谁也不给弟兄放下绊脚跌人之物。","我凭着主耶稣确知深信，凡物本来没有不洁净的；惟独人以为不洁净的，在他就不洁净了。","你若因食物叫弟兄忧愁，就不是按着爱人的道理行。基督已经替他死，你不可因你的食物叫他败坏。","不可叫你的善被人毁谤；","因为神的国不在乎吃喝，只在乎公义、和平，并圣灵中的喜乐。","在这几样上服事基督的，就为神所喜悦，又为人所称许。","所以，我们务要追求和睦的事与彼此建立德行的事。","不可因食物毁坏神的工程。凡物固然洁净，但有人因食物叫人跌倒，就是他的罪了。","无论是吃肉，是喝酒，是甚么别的事，叫弟兄跌倒，一概不做才好。","你有信心，就当在神面前守着。人在自己以为可行的事上能不自责，就有福了。","若有疑心而吃的，就必有罪，因为他吃不是出于信心。凡不出于信心的都是罪。"],"15":["我们坚固的人应该担代不坚固人的软弱，不求自己的喜悦。","我们各人务要叫邻舍喜悦，使他得益处，建立德行。","因为基督也不求自己的喜悦，如经上所记：『辱骂你人的辱骂都落在我身上。』","从前所写的圣经都是为教训我们写的，叫我们因圣经所生的忍耐和安慰可以得着盼望。","但愿赐忍耐安慰的神叫你们彼此同心，效法基督耶稣，","一心一口荣耀神—我们主耶稣基督的父！","所以，你们要彼此接纳，如同基督接纳你们一样，使荣耀归与神。","我说，基督是为神真理作了受割礼人的执事，要证实所应许列祖的话，","并叫外邦人因他的怜悯荣耀神。如经上所记：因此，我要在外邦中称赞你，歌颂你的名；","又说：你们外邦人当与主的百姓一同欢乐；","又说：外邦啊，你们当赞美主！万民哪，你们都当颂赞他！","又有以赛亚说：将来有耶西的根，就是那兴起来要治理外邦的；外邦人要仰望他。","但愿使人有盼望的神，因信将诸般的喜乐、平安充满你们的心，使你们借着圣灵的能力大有盼望！","弟兄们，我自己也深信你们是满有良善，充足了诸般的知识，也能彼此劝戒。","但我稍微放胆写信给你们，是要提醒你们的记性，特因神所给我的恩典，","使我为外邦人作基督耶稣的仆役，作神福音的祭司，叫所献上的外邦人，因着圣灵成为圣洁，可蒙悦纳。","所以论到神的事，我在基督耶稣里有可夸的。","除了基督藉我做的那些事，我甚么都不敢提，只提他藉我言语作为，用神迹奇事的能力，并圣灵的能力，使外邦人顺服；","甚至我从耶路撒冷，直转到以利哩古，到处传了基督的福音。","我立了志向，不在基督的名被称过的地方传福音，免得建造在别人的根基上。","就如经上所记：未曾闻知他信息的，将要看见；未曾听过的，将要明白。","我因多次被拦阻，总不得到你们那里去。","但如今，在这里再没有可传的地方，而且这好几年，我切心想望到西班牙去的时候，可以到你们那里，","盼望从你们那里经过，得见你们，先与你们彼此交往，心里稍微满足，然后蒙你们送行。","但现在，我往耶路撒冷去供给圣徒。","因为马其顿和亚该亚人乐意凑出捐项给耶路撒冷圣徒中的穷人。","这固然是他们乐意的，其实也算是所欠的债；因外邦人既然在他们属灵的好处上有分，就当把养身之物供给他们。","等我办完了这事，把这善果向他们交付明白，我就要路过你们那里，往西班牙去。","我也晓得去的时候，必带着基督丰盛的恩典而去。","弟兄们，我借着我们主耶稣基督，又借着圣灵的爱，劝你们与我一同竭力，为我祈求神，","叫我脱离在犹太不顺从的人，也叫我为耶路撒冷所办的捐项可蒙圣徒悦纳，","并叫我顺着神的旨意，欢欢喜喜地到你们那里，与你们同得安息。","愿赐平安的神常和你们众人同在。阿们！"],"16":["我对你们举荐我们的姊妹非比，她是坚革哩教会中的女执事。","请你们为主接待她，合乎圣徒的体统。她在何事上要你们帮助，你们就帮助她；因她素来帮助许多人，也帮助了我。","问百基拉和亚居拉安。他们在基督耶稣里与我同工，","也为我的命将自己的颈项置之度外。不但我感谢他们，就是外邦的众教会也感谢他们。","又问在他们家中的教会安。问我所亲爱的以拜尼土安；他在亚西亚是归基督初结的果子。","又问马利亚安；她为你们多受劳苦。","又问我亲属与我一同坐监的安多尼古和犹尼亚安；他们在使徒中是有名望的，也是比我先在基督里。","又问我在主里面所亲爱的暗伯利安。","又问在基督里与我们同工的耳巴奴，并我所亲爱的士他古安。","又问在基督里经过试验的亚比利安。问亚利多布家里的人安。","又问我亲属希罗天安。问拿其数家在主里的人安。","又问为主劳苦的土非拿氏和土富撒氏安。问可亲爱的、为主多受劳苦的彼息氏安。","又问在主蒙拣选的鲁孚和他母亲安；他的母亲就是我的母亲。","又问亚逊其土、弗勒干、黑米、八罗巴、黑马，并与他们在一处的弟兄们安。","又问非罗罗古和犹利亚，尼利亚和他姊妹，同阿林巴并与他们在一处的众圣徒安。","你们亲嘴问安，彼此务要圣洁。基督的众教会都问你们安。","弟兄们，那些离间你们、叫你们跌倒、背乎所学之道的人，我劝你们要留意躲避他们。","因为这样的人不服事我们的主基督，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。","你们的顺服已经传于众人，所以我为你们欢喜；但我愿意你们在善上聪明，在恶上愚拙。","赐平安的神快要将撒但践踏在你们脚下。愿我主耶稣基督的恩常和你们同在！","与我同工的提摩太，和我的亲属路求、耶孙、所西巴德，问你们安。","我这代笔写信的德丢，在主里面问你们安。","那接待我、也接待全教会的该犹问你们安。城内管银库的以拉都，和兄弟括土问你们安。","愿我主耶稣基督的恩常和你们众人同在。阿们！","惟有神能照我所传的福音和所讲的耶稣基督，并照永古隐藏不言的奥秘，坚固你们的心。","这奥秘如今显明出来，而且按着永生神的命，藉众先知的书指示万国的民，使他们信服真道。","愿荣耀因耶稣基督归与独一全智的神，直到永远。阿们！"]},"blk":{"1":[{"a":1,"z":1,"star":false,"grk":"<p>Παῦλος δοῦλος Χριστοῦ Ἰησοῦ, κλητὸς ἀπόστολος ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ</p>","lit":"<p>「保罗，基督耶稣的奴仆，被召的使徒，已被分别出来归于神的福音。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th><th>本节语境</th></tr><tr><td>仆人</td><td>δοῦλος</td><td>doulos</td><td>G1401</td><td>奴隶，属于主人的财产</td><td>不是雇工，是被买赎、全然属主的人</td></tr><tr><td>奉召</td><td>κλητός</td><td>klētos</td><td>G2822</td><td>被召的（形容词）</td><td>使徒职分是被召出来的，不是自取的</td></tr><tr><td>特派</td><td>ἀφωρισμένος</td><td>aphōrismenos</td><td>G873</td><td>分别、划界、隔开</td><td>完成式被动分词：已被分别出来，状态持续</td></tr><tr><td>福音</td><td>εὐαγγέλιον</td><td>euangelion</td><td>G2098</td><td>好消息、捷报</td><td>帝国用语被夺回，归给神</td></tr></table>","gram":"<p>- <b>δοῦλος</b>：无冠词，同位语。保罗不说「我是一位传道人」，他说「我是一个奴隶」。<br>- <b>κλητός</b>：形容词，被动含义——「被叫来的」。施动者是神。<br>- <b>ἀφωρισμένος</b>：<b>完成式被动分词</b>（perfect passive participle）。这是本节最重要的文法。完成式＝过去发生、结果持续到现在；被动＝不是他自己分别自己。有趣的是：「法利赛人」（Pharisee）一字很可能源于「分别」的字根——保罗曾经被「分别」归给律法，如今被神分别归给福音。<br>- <b>εἰς εὐαγγέλιον</b>：εἰς＋直接受格，表<b>目标／归属</b>——被分别「进入」福音。</p>","exp":"<p>保罗的自我介绍，把整卷书的属灵逻辑先立了起来：<b>人生真正的次序，不是「我要做什么」，而是「我属于谁」。</b></p><p>- 这是经文本身的意思：保罗的使徒职分不是自封的，福音也不是他的产物，是<b>神的</b>福音（θεοῦ，主词所有格：源于神、属于神）。<br>- 这是根据经文真理的生命应用：一个被福音抓住的人，第一句话不会是「我是谁」，而是「我是谁的」。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις</p>","lit":"<p>「这（福音）是祂借着祂的众先知在圣洁的经卷中，预先所应许的。」</p>","key":"<p>- <b>προεπηγγείλατο</b>（G4279 προεπαγγέλλομαι）：προ（预先）＋ ἐπαγγέλλομαι（应许）。新约仅出现两次（罗1:2；林后9:5）。<br>- <b>γραφαῖς ἁγίαις</b>：无冠词，「圣洁的经卷」——保罗在此指旧约。</p>","gram":"<p>- <b>προεπηγγείλατο</b>：不定过去式关身直说语气，第三人称单数。主词是神（承上文 θεοῦ）。<br>- <b>διὰ ＋ 所有格</b>：表「借着、透过」——先知是管道，不是源头。</p>","exp":"<p>福音<b>不是新发明</b>。这是保罗一开始就要打的一根桩：对犹太读者，福音不是背叛祖宗的信仰，是应许的兑现；对外邦读者，这信仰不是新兴宗教，是有根、有历史、有神亲自签名的应许。</p><p><b>救恩历史的意义</b>：从创世记3:15 女人的后裔，到亚伯拉罕之约，到大卫之约（撒下7），到以赛亚的仆人之歌，到耶利米的新约——整本旧约都在指向一个人。福音不是Ｂ计划。</p>"},{"a":3,"z":4,"star":false,"grk":"<p>περὶ τοῦ υἱοῦ αὐτοῦ τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα, τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν</p>","lit":"<p>「关于祂的儿子——按着肉体，是从大卫的后裔生的；按着圣善的灵，因着从死人中复活，被有能力地指定为神的儿子——就是耶稣基督，我们的主。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th><th>语境</th></tr><tr><td>生的</td><td>γενομένου</td><td>genomenou</td><td>G1096</td><td>成为、生成</td><td>不用 γεννάω（生育），暗示「成为」——道成肉身</td></tr><tr><td>显明／立定</td><td>ὁρισθέντος</td><td>horisthentos</td><td>G3724</td><td>划定界线、<b>指派、任命</b>（徒10:42、17:31 皆译「立定」）</td><td>英文 horizon 由此而来</td></tr><tr><td>大能</td><td>δυνάμει</td><td>dynamei</td><td>G1411</td><td>能力</td><td>与 1:16「神的大能」呼应</td></tr><tr><td>圣善的灵</td><td>πνεῦμα ἁγιωσύνης</td><td>pneuma hagiōsynēs</td><td>G4151/G42</td><td>圣洁的灵</td><td>罕见片语，可能是闪族语式表达</td></tr></table>","gram":"<p>- <b>τοῦ γενομένου</b> 与 <b>τοῦ ὁρισθέντος</b>：两个带冠词的分词，工整平行——一个不定过去式关身，一个不定过去式被动。<br>- <b>ὁρισθέντος</b>：不定过去式被动分词——<b>是父神立定祂</b>。ὁρίζω 的常态字义是「指派、任命」，不是「宣告」（徒10:42「神所立定的」；徒17:31「他所设立的人」）。<br>- <b>κατὰ σάρκα / κατὰ πνεῦμα ἁγιωσύνης</b>：两个 κατά＋直接受格的平行片语，指<b>两种存在领域或两个阶段</b>，而非「人性／神性」二分。<br>- 3–4节很可能是保罗引用<b>教会早期已有的信仰告白</b>（节奏工整、用词非保罗惯用），这使它更有份量：<b>这不只是保罗的信，是全教会的信。</b></p>","exp":"<p>这里有一个必须澄清的重点，而且要比一般讲法更精准。</p><p>ὁρισθέντος 绝<b>不是</b>说耶稣「复活以后才变成神的儿子」——那是嗣子论异端，而且第3节已经先称祂为「<b>祂的儿子</b>」，可见在道成肉身之前，祂就是子。</p><p>但也不宜把 ὁρίζω 一律译成「宣告」（传统中文译本作「显明」）。这字的常态意义是<b>指派、任命、立定</b>。因此更贴近原文、也更合乎救赎历史的理解是：</p><p>那位一直是子的，如今借着复活，被父「立定」为有能力的神子——就是就任为掌权的弥赛亚君王。</p><p>这正是使徒行传13:33 引用诗篇2:7「你是我的儿子，我今日生你」来指基督复活的同一条线：诗篇2篇本是<b>君王登基</b>的诗。所以：<b>祂的身分没有改变，祂的职任进入了新的阶段。</b>从「软弱中的大卫子孙」，到「以大能掌权的神子」（ἐν δυνάμει 修饰「神的儿子」）。</p><p>另有一个常被漏掉的细节：<b> ἐξ ἀναστάσεως </b>νεκρῶν<b>——「死人（们）」是</b>复数<b>。保罗不只说「祂复活了」，他说的是「</b>从死人中的那场复活<b>」。也就是说，基督的复活不是一个孤立事件，而是那场总复活的</b>开端<b>——正如林前15:20 说祂是「睡了之人初熟的果子」。</b>祂不是唯一被叫醒的人，祂是第一个。</p><p>- 经文明确表达的：耶稣是应许的大卫子孙（弥赛亚），也是藉复活被有力宣告的神子。<br>- 合理推论的神学：福音的内容<b>不是一套道理，是一个位格</b>。保罗说「神的福音……论到他儿子」——福音的中心不是「你能得到什么」，是「祂是谁」。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>δι' οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ</p>","lit":"<p>「借着祂，我们领受了恩惠与使徒职分，为要在万民中，为祂的名，带出信心的顺服。」</p>","key":"<p>- <b>ὑπακοὴ πίστεως</b>（G5218 ＋ G4102）：字面「信的顺服」。ὑπακοή 源自 ὑπό（在……之下）＋ ἀκούω（听）——<b>顺服的本质是「在话语之下听」</b>。<br>- <b>ὑπὲρ τοῦ ὀνόματος αὐτοῦ</b>：「为了祂的名」——最终目的。</p>","gram":"<p>「信服真道」的所有格 πίστεως 有几种可能：<br>1. <b>同位所有格</b>：顺服，就是信（信本身即顺服的行动）<br>2. <b>来源所有格</b>：由信心产生的顺服<br>3. <b>目的</b>：以信为对象的顺服</p><p>保罗在罗马书中两次用这片语框住全书（1:5；16:26），最好的理解可能是<b>兼容前两者</b>：真信心必然带出顺服，顺服的根源必然是信心。这正好回答一个常见的误解——<b>因信称义从来不是「信了就可以随便活」</b>。</p><p><b>最后那句最重要：ὑπὲρ τοῦ ὀνόματος αὐτοῦ——为祂的名。</b>不是为保罗的名，不是为教会的名，不是为事工的名。宣教的终极动机是<b>神的荣耀</b>。</p>","exp":"<p><b>经文本身明确表达的：</b> 保罗的使徒职分是<b>领受</b>的（ἐλάβομεν），目的是在万国中带出「信心的顺服」，而终极的指向是「为祂的名」。</p><p><b>可以合理推论的生命应用：</b> 这一节把三件事按次序排好了——</p><p><b>恩惠在先</b>（先领受，不是先努力）；<br><b>顺服在中</b>（信心必然带出顺服）；<br><b>祂的名在后</b>（一切的终点）。</p><p>而这正是321的次序：不是先做事，是先领受；不是为自己立名，是为祂的名。</p><p>⚠ 这个词组（εἰς ὑπακοὴν πίστεως）在全卷书只出现两次——1:5与16:26。保罗用它把整卷书框了起来。</p>"},{"a":6,"z":7,"star":false,"grk":"<p>ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ, πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.</p>","lit":"<p>「在他们中间，也有你们——耶稣基督所召的。（我写）给所有在罗马的、神所爱的、被召为圣徒的人：愿恩惠与平安从我们的父神并主耶稣基督归与你们。」</p>","key":"<p>- <b>ἀγαπητοῖς θεοῦ</b>：「神所爱的」——这是旧约对以色列的称呼（申33:12；诗60:5）。保罗把它给了罗马的外邦信徒。<br>- <b>κλητοῖς ἁγίοις</b>：「蒙召的圣徒」——<b>不是「特别圣洁的少数人」，是所有属神的人</b>。ἅγιος 的根本意思是「被分别出来归神」。<br>- <b>χάρις καὶ εἰρήνη</b>：χάρις（希腊式问安 χαίρειν 的变形）＋ εἰρήνη（希伯来式问安 שָׁלוֹם shalom）——<b>希腊与希伯来在福音里合而为一</b>。这个问安本身就是一篇小小的合一讲道。</p>","gram":"","exp":"<p>留意 1:1 与 1:7 的呼应：保罗是 κλητὸς ἀπόστολος（蒙召的使徒），他们是 κλητοὶ ἅγιοι（蒙召的圣徒）。<b>同一位主，同一种呼召的性质。</b>职分不同，地位相同。</p><p>还有一个常被忽略的细节：<b>恩惠与平安同时从「父神」并「主耶稣基督」而来</b>——一个介系词 ἀπό 带两个对象，基督与父并列为恩典的源头。这是最高的基督论宣告，却放在一句最平常的问安里。</p>"},{"a":8,"z":10,"star":false,"grk":"<p>εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ … ᾧ λατρεύω ἐν τῷ πνεύματί μου … ἀδιαλείπτως … δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ</p>","lit":"<p>8「首先，我借着耶稣基督，为你们众人<b>感谢我的神</b>——因为你们的信德<b>在全世界被传扬</b>。」<br>9「神可以为我作见证——就是我在祂儿子的福音上，<b>用我的灵所事奉</b>的那一位——我怎样<b>不间断地</b>提起你们，」<br>10「在我的祷告中常常恳求：<b>或者，总算有一天</b>，我可以照着神的旨意，<b>被开通道路</b>，到你们那里去。」</p>","key":"<p>- <b>λατρεύω</b>（G3000）：<b>事奉</b>，在七十士译本中特指<b>祭司在圣殿中的敬拜事奉</b>。保罗说他是「用心灵事奉」——不在圣殿，在心灵；不是献祭，是传福音。<br>- <b>ἀδιαλείπτως</b>（G89）：不间断地。<br>- <b>εὐοδωθήσομαι</b>（G2137）：εὖ（好）＋ ὁδός（路）——「得好路、路途通达」。</p>","gram":"<p>「或者照神的旨意，终能得平坦的道路」——<b>εὐοδωθήσομαι 是未来被动</b>。保罗不说「我要打通这条路」，他说「但愿我被开路」。</p><p>而 εἴ πως ἤδη ποτέ（若或者终于有一天）连用四个小词，那份<b>压抑的渴望与等候的长度</b>，中文很难完全译出。可以直译成：「不知道究竟哪一天，总算……」</p>","exp":"<p>- 这是经文本身的意思：保罗为罗马信徒感谢神、不住代祷，并多年渴望前往，却顺服在神的旨意与时间表之下。<br>- 这是根据经文的生命应用：<b>保罗有异象、有负担、有能力、有计划，却没有主权。</b>他不说「我一定要去」，他说「照神的旨意」。这正是「让耶稣作王」最实际的样子——不是不作计划，而是计划始终放在神的手里。</p>"},{"a":11,"z":12,"star":false,"grk":"<p>ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς, τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.</p>","lit":"<p>「因为我切切渴望见你们，好把一些属灵的恩赐分给你们，使你们得坚固；也就是说，让我在你们中间，借着我们彼此的信心，同得安慰。」</p>","key":"<p>- <b>ἐπιποθῶ</b>（G1971）：ἐπί（加强）＋ ποθέω（渴慕）——强烈的思念，如诗篇42:1 鹿切慕溪水（七十士译本用同一字根）。<br>- <b>συμπαρακληθῆναι</b>（G4837）：σύν（一同）＋ παρακαλέω（安慰、劝勉）——新约仅此一次。<b>「一同被鼓励」，被动语态。</b></p>","gram":"<p>第11节，保罗是给予者：「我分给你们」。<br>第12节，他立刻<b>改口</b>：τοῦτο δέ ἐστιν（这就是说……）——并且动词变成<b>被动</b>：συμπαρακληθῆναι，「一同被安慰」。</p><p><b>保罗讲到一半，把自己拉下来了。</b> 他原本说的是「我要给你们」，然后马上补充：「不，应该说，是我们彼此。」</p>","exp":"<p>这是一位使徒的谦卑，也是属神体系最美的图画：<b>在基督的身体里，没有纯粹的给予者，也没有纯粹的接受者。</b></p><p>- 经文本身：保罗要造就罗马教会，也承认自己需要从他们得着。<br>- 生命应用（321）：真正属灵的领袖不是站在高处施舍的人，而是愿意在弟兄姊妹中间一同被安慰的人。这正是「属灵同伴（2）」的关系——不是上对下，是肩并肩。</p>"},{"a":13,"z":15,"star":false,"grk":"<p>ἐκωλύθην ἄχρι τοῦ δεῦρο … Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί</p>","lit":"<p>13「弟兄们，我不愿意你们不知道：我<b>屡次定意</b>要到你们那里去，好在你们中间也得些果子，像在其余的外邦人中一样——只是<b>直到如今，我都被拦阻</b>。」<br>14「无论是希腊人或<b>化外人</b>，聪明人或愚拙人，<b>我都是欠债的</b>。」<br>15「所以就我而言，我是<b>迫切的</b>：也要把福音传给你们在罗马的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th><th>语境</th></tr><tr><td>阻隔</td><td>ἐκωλύθην</td><td>ekōlythēn</td><td>G2967</td><td>被拦阻</td><td>不定过去式<b>被动</b></td></tr><tr><td>化外人</td><td>βαρβάροις</td><td>barbarois</td><td>G915</td><td>说话「巴巴巴」的人，非希腊语者</td><td>当时的文化歧视用语</td></tr><tr><td>欠债</td><td>ὀφειλέτης</td><td>opheiletēs</td><td>G3781</td><td>债务人</td><td>保罗欠的不是人情，是福音的债</td></tr></table>","gram":"<p>ἐκωλύθην 是被动式：「我被拦阻」。<b> 保罗没有说「情况不允许」「时机不对」——他知道有一位在拦阻。比较徒16:6–7，圣灵禁止他往亚细亚、庇推尼去。</b>神的拦阻，也是神的引导。</p>","exp":"<p>「我都欠他们的债」——这是惊人的翻转。一般人会觉得：我把福音给你，是你欠我。保罗说：<b>我还没把福音给你之前，我是欠你的。</b></p><p>为什么？因为 1:5——「我们<b>从他受了</b>恩惠并使徒的职分」。<b>保罗是先领受，所以他有债。</b> 恩典若真的临到一个人，会使他变成一个欠债的人。</p><p>而他欠债的对象包括「化外人、愚拙人」——当时罗马社会看不起的人。<b>福音的债，没有阶级。</b></p>"},{"a":16,"z":16,"star":false,"grk":"<p>Οὐ γὰρ ἐπαισχύνομαι τὸ εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι.</p>","lit":"<p>「因为我不以这福音为耻；因为它是神的大能，以致拯救，临到每一个相信的人——先是犹太人，也是希腊人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th><th>语境</th></tr><tr><td>以为耻</td><td>ἐπαισχύνομαι</td><td>epaischynomai</td><td>G1870</td><td>感到羞耻</td><td>现在式关身，持续的态度</td></tr><tr><td>大能</td><td>δύναμις</td><td>dynamis</td><td>G1411</td><td>能力、动力</td><td>英文 dynamite、dynamic 由此而来</td></tr><tr><td>救</td><td>σωτηρίαν</td><td>sōtērian</td><td>G4991</td><td>拯救、得救</td><td>帝国也用此字称凯撒为 σωτήρ</td></tr><tr><td>相信的</td><td>πιστεύοντι</td><td>pisteuonti</td><td>G4100</td><td>信</td><td><b>现在式分词：持续相信的人</b></td></tr></table>","gram":"<p>- <b>οὐ ἐπαισχύνομαι</b>：这是修辞上的「反语法」（litotes）——用否定表达更强的肯定。「我不以福音为耻」＝「我以福音为我唯一的夸口」。<br>- <b>δύναμις θεοῦ ἐστιν</b>：福音<b>是</b>（ἐστιν）神的大能，不是「有」大能，不是「传递」大能。<b>福音本身就是那能力。</b><br>- <b>παντὶ τῷ πιστεύοντι</b>：现在式分词加冠词——「每一个持续在相信的人」。信不是一次的决定，是一种持续的姿态。<br>- <b>πρῶτον</b>（先）：是<b>救恩历史的次序</b>，不是<b>价值的高低</b>（参 2:9–10：审判也是「先是犹太人」）。</p>","exp":"<p><b>为什么保罗要说「不以为耻」？</b>因为福音在当时实在是可耻的。</p><p>在罗马，十字架是留给奴隶与叛乱者的极刑，是文明人不愿启齿的字眼。西塞罗曾说，罗马公民连「十字架」这个字都不该从口中说出。而福音的中心，是一个在帝国边陲行省被钉十字架的犹太木匠。</p><p>在罗马帕拉丁山出土的一幅古代涂鸦（Alexamenos graffito，约主后二至三世纪），画着一个驴头人身的被钉者，旁边一个人举手敬拜，下面写着：「亚历山米诺敬拜他的神。」这就是当时世界看基督徒的眼光——<b>荒谬、可笑、可耻。</b></p><p>保罗说：我不以为耻。不是因为他脸皮厚，而是因为他亲眼看见了这福音的能力：它使逼迫教会的扫罗变成使徒保罗，使凶暴的变成温柔的，使拜偶像的变成敬拜真神的。</p><p>- 经文本身：福音是神施行拯救的大能，临到所有相信的人，不分犹太人或希腊人。<br>- 321应用：这里有一个永恒的次序——<b>福音是神的大能，不是我的大能</b>。传福音的果效不在口才、不在方法、不在人数，在福音本身。所以最后的荣耀，只能归给神。</p>"},{"a":17,"z":17,"star":false,"grk":"<p>δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.</p>","lit":"<p>「因为神的义，在其中（福音中）正被启示出来，本于信、以至于信；正如经上所记：『那义人将要因信而活。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th></tr><tr><td>神的义</td><td>δικαιοσύνη θεοῦ</td><td>dikaiosynē theou</td><td>G1343</td><td>义、公义、合乎标准的状态</td></tr><tr><td>显明</td><td>ἀποκαλύπτεται</td><td>apokalyptetai</td><td>G601</td><td>揭开遮盖、启示</td></tr><tr><td>信</td><td>πίστις</td><td>pistis</td><td>G4102</td><td>信心、信靠、信实</td></tr></table>","gram":"<p>- <b>ἀποκαλύπτεται</b>：现在式被动直说语气——「<b>正在</b>被显明」。不是过去发生了，是每一次福音被传讲时，就再一次发生。<br>- <b>δικαιοσύνη θεοῦ</b> 的所有格是关键争议（见第二十部分）。<br>- <b>ἐκ πίστεως εἰς πίστιν</b>：字面「出于信，进入信」。</p>","exp":"<p><b>这一节是宗教改革的火种。</b>马丁路德曾坦承，他年轻时最恨「神的义」这几个字——因为他理解成「神按公义刑罚罪人的属性」。直到他在这节经文上被光照，看见这义是神<b>赐下</b>的义，不是神<b>要求</b>的义，他说他觉得自己重生了，天堂的门为他敞开。</p><p><b>「这义是本于信，以至于信」</b> 最好的理解：<b>从头到尾都是信</b>（强调的重复，如「从荣耀到荣耀」）。神的义从起点到终点，没有一寸是靠行为。</p><p>哈巴谷书2:4 的引用<b>：希伯来原文 וְצַדִּיק בֶּאֱמוּנָתוֹ יִחְיֶה（*w'ṣaddîq be'ĕmûnātô yiḥyeh*），「义人必因他的</b>信实/信心<b>（אֱמוּנָה 'ĕmûnâ, H530）存活」。原本的处境是：迦勒底人要来了，先知问神为何不管；神说义人要因信活着。</b>这句话原本是在黑暗中的等候之语，保罗把它变成救恩的宪章。</p><p>而保罗引用时，刻意删掉了一个字——这是本节最容易被忽略、却极有力量的细节。</p><p>- 七十士译本主要抄本作：「义人必因<b>我的</b>信实（ἐκ πίστεώς <b>μου</b>）存活」——代名词指神。<br>- 另有抄本传统作：「<b>我的</b>义人必因信存活」——这是希伯来书10:38 所引的形式。<br>- <b>保罗两个代名词都不要。</b> 他写的是最精简的一句：ὁ δίκαιος ἐκ πίστεως ζήσεται。</p><p>保罗把这句话削到只剩骨头。为什么？<b> 因为他正要说「先是犹太人，后是希腊人」。</b>他不要任何一个字，把这句话限缩成只属于某一群人的应许。</p><p>希腊文 ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται 有两种断句：<br>1. 「那<b>因信的</b>义人，必要活着」（ἐκ πίστεως 修饰 δίκαιος）<br>2. 「那义人，必<b>因信</b>而活」（ἐκ πίστεως 修饰 ζήσεται）<br>在罗马书的上下文中（1:16「一切相信的」、3:22、4:5），第一种读法更贴近保罗的论证：<b>人之所以被称为义人，是本于信。</b></p>"},{"a":18,"z":18,"star":false,"grk":"<p>Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ' οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων</p>","lit":"<p>「因为神的忿怒，正从天上被显明出来，临到人一切的不敬虔与不义——就是那些用不义<b>压住</b>真理的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th><th>语境</th></tr><tr><td>忿怒</td><td>ὀργή</td><td>orgē</td><td>G3709</td><td>定意的、有理由的怒</td><td>不是情绪失控，是圣洁对罪必然的反应</td></tr><tr><td>不虔</td><td>ἀσέβεια</td><td>asebeia</td><td>G763</td><td>不敬虔，对神的失败</td><td><b>第一诫层面</b></td></tr><tr><td>不义</td><td>ἀδικία</td><td>adikia</td><td>G93</td><td>不义，对人的失败</td><td><b>第二诫层面</b></td></tr><tr><td>阻挡</td><td>κατεχόντων</td><td>katechontōn</td><td>G2722</td><td>压住、按住、扣留</td><td>现在式分词，持续的动作</td></tr></table>","gram":"<p>- <b>ἀποκαλύπτεται</b>：与17节<b>同一个动词、同一个时态语态</b>，并且摆在句首以示强调。这是刻意的平行：<b>神的义正在显明／神的忿怒正在显明。</b><br>- <b>κατεχόντων</b>：这个字是本节的关键画面。它可以指「扣留、压制」，像用手把一个东西按在水下不让它浮起来。<b>人不是不知道真理，是知道了却用力把它按住。</b></p>","exp":"<p>保罗先讲好消息（16–17），再讲坏消息（18–32）。<b>这个次序本身就是恩典。</b></p><p>「不虔」在「不义」之前——这是全章最重要的顺序之一。<b>人的道德问题，根源是敬拜问题。</b> 不是先做坏事才离开神，是先离开神才做坏事。</p><p>- 经文本身：神的忿怒现在正临到一切压制真理的不敬虔与不义。<br>- 321亮光：这里揭露了「有己」的实质——<b>人不是无知，是不肯</b>。他知道，他却按住。这不是头脑的问题，是宝座的问题。</p>"},{"a":19,"z":20,"star":false,"grk":"<p>διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς· ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν. τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους</p>","lit":"<p>「因为关于神可知的，在他们中间是显明的；因为神向他们显明了。因为祂那些看不见的事——就是祂永恒的大能和神性——自从创世以来，借着所造之物，被思想所领悟，就清楚地被看见了；以致他们无可辩解。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th></tr><tr><td>眼不能见的</td><td>ἀόρατα</td><td>aorata</td><td>G517</td><td>不可见的</td></tr><tr><td>晓得</td><td>νοούμενα</td><td>nooumena</td><td>G3539</td><td>用心思领悟</td></tr><tr><td>可知</td><td>καθορᾶται</td><td>kathoratai</td><td>G2529</td><td>清楚地被看见</td></tr><tr><td>神性</td><td>θειότης</td><td>theiotēs</td><td>G2305</td><td>神的属性、神格特质</td></tr><tr><td>无可推诿</td><td>ἀναπολογήτους</td><td>anapologētous</td><td>G379</td><td>无法申辩（法庭用语）</td></tr></table>","gram":"<p>保罗在此用了一个精彩的<b>矛盾修辞（oxymoron）</b>：<b>「看不见的」（ἀόρατα）被「清楚地看见」（καθορᾶται）。</b></p><p>- <b>νοούμενα</b>：现在式被动分词——「借着被思想」。所以自然启示不是自动的，需要人的心思去领悟。<br>- <b>ἀναπολογήτους</b>：ἀ（不）＋ ἀπολογία（申辩，英文 apologetics 由此而来）。这是法庭语言：<b>被告哑口无言。</b><br>- <b>εἰς τὸ εἶναι</b>：εἰς ＋ 不定词，表<b>结果</b>（有些学者主张表目的）。译作「以致」较安全。</p>","exp":"<p><b>重要澄清</b>：这段<b>不是</b>说人可以借着看星星得救。自然启示所启示的是「神的永能和神性」——<b>足以定罪，不足以拯救。</b>它使人无可推诿，却不能使人称义。称义只在福音里（1:16–17）。</p><p>- 经文本身：神在受造之物中留下了自己的证据，人无法以「我不知道」为借口。<br>- 生命应用：<b>每一个日出、每一片叶脉、每一次呼吸，都是神留给人的信号。</b>问题从来不是神藏得太好，是人把眼睛闭上了。</p>"},{"a":21,"z":21,"star":false,"grk":"<p>διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλ' ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία.</p>","lit":"<p>「因为他们虽然认识了神，却不把祂当作神来荣耀，也不感谢；反倒在他们的思辨中变成虚妄，他们无知的心就被弄暗了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th></tr><tr><td>荣耀</td><td>ἐδόξασαν</td><td>edoxasan</td><td>G1392</td><td>使……得荣耀、承认其重量</td></tr><tr><td>感谢</td><td>ηὐχαρίστησαν</td><td>ēucharistēsan</td><td>G2168</td><td>献上感谢</td></tr><tr><td>变为虚妄</td><td>ἐματαιώθησαν</td><td>emataiōthēsan</td><td>G3154</td><td>变成空虚、无用（被动形式，多为状态变化义）</td></tr><tr><td>思念</td><td>διαλογισμοῖς</td><td>dialogismois</td><td>G1261</td><td>推理、思辨</td></tr><tr><td>昏暗</td><td>ἐσκοτίσθη</td><td>eskotisthē</td><td>G4654</td><td>变得黑暗（被动形式）</td></tr><tr><td>心</td><td>καρδία</td><td>kardia</td><td>G2588</td><td>心——意志、情感、思想的中心</td></tr></table>","gram":"<p>- <b>γνόντες</b>：不定过去式分词，让步用法——「<b>虽然</b>已经认识了神」。定罪的根据在此。<br>- <b>ἐματαιώθησαν</b> 与 <b>ἐσκοτίσθη</b>：两个都是<b>不定过去式被动形式</b>。</p><p><b>这里必须谨慎，不可把文法讲过头。</b> 在 Koine 希腊文中，被动形式（尤其是 aorist passive）<b>常常只表达「进入某种状态」的不及物意义</b>，未必指向一位施动者——例如 ἐγενήθην（成为）、ἐπορεύθην（去）。因此最保守、也最站得住的翻译是：「他们的思念<b>变得</b>虚妄，他们无知的心<b>变得</b>昏暗。」</p><p><b>不可以说</b>：「原文是被动，所以是神把他们的心弄暗的。」这是超出证据的推论。</p><p><b>但值得注意的是这一点</b>：21、22 节这三个被动形式（虚妄、昏暗、愚拙），与 24、26、28 节三次「神就任凭」（παρέδωκεν，<b>主动语态，主词明确是神</b>）同属一个段落，而且中间只隔两节。保罗是否刻意让读者先读到一连串「不知道是谁做的」的被动，再在三节之后揭晓施动者——这是<b>文法无法定案、神学上却极有份量的开放性</b>。</p><p><b>讲台上可以这样说（而且更有力）：</b> 「保罗在这里没有说是谁把他们的心弄暗的。他先不说。可是再往下读三节，他就告诉你了。」</p><p>- <b>ματαιόω</b> 的字根 μάταιος，在七十士译本中常用来翻译希伯来文 הֶבֶל（*hebel*，传道书的「虚空」）与偶像的「虚无」。<b>保罗在说：人拜什么，就变成什么。</b> 拜虚空的，思想就变虚空（比较诗115:8「造他的要和他一样」）。</p>","exp":"<p>罪的第一步不是杀人放火，是不荣耀神、不感谢神。</p><p>「荣耀祂」——就是承认神有祂该有的份量与位置。<br>「感谢祂」——就是承认我所有的都是领受的。</p><p>不荣耀神，就是把神从宝座上请下来。<br>不感谢神，就是把自己当作源头。</p><p>这两件事的合起来，就是「有己」的定义。</p><p>而结果是连锁反应：<b>宝座错了 → 思想虚妄了 → 心昏暗了。</b>注意方向：<b>不是头脑昏暗了才拜错神，是拜错了才昏暗。</b>人生的问题从来不是先从理智开始的，是从敬拜开始的。</p>"},{"a":22,"z":23,"star":false,"grk":"<p>φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.</p>","lit":"<p>「他们宣称自己是有智慧的，却成了愚昧；并且把那不朽坏之神的荣耀，换成了必朽坏的人、飞鸟、四足兽、爬虫的形像的样式。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th></tr><tr><td>自称</td><td>φάσκοντες</td><td>phaskontes</td><td>G5335</td><td>宣称、声称（含虚假意味）</td></tr><tr><td>成了愚拙</td><td>ἐμωράνθησαν</td><td>emōranthēsan</td><td>G3471</td><td>变为愚昧（被动形式；英文 moron 由此）</td></tr><tr><td>换</td><td>ἤλλαξαν</td><td>ēllaxan</td><td>G236</td><td>交换、掉换</td></tr><tr><td>不能朽坏</td><td>ἀφθάρτου</td><td>aphthartou</td><td>G862</td><td>不朽的</td></tr><tr><td>必朽坏</td><td>φθαρτοῦ</td><td>phthartou</td><td>G5349</td><td>会腐烂的</td></tr></table>","gram":"<p>- <b>ἐμωράνθησαν</b> 同样是被动形式，与 21 节的两个动词形成第三次重复（虚妄、昏暗、愚拙）。同样地，此处最稳妥的理解是「变成了愚昧」；重点不在文法能否证明施动者，而在<b>保罗把「自称聪明」与「成了愚昧」直接放在一起</b>——人越自信，越走进自己的愚昧里。<br>- <b>ἄφθαρτος / φθαρτός</b>：刻意的头韵对比。<b>用「会烂的」换「不会烂的」——这是全世界最亏本的交易。</b><br>- <b>列表的次序</b>：人 → 飞禽 → 走兽 → 昆虫。<b>一路往下。</b>这正是创世记1:20–26 的<b>倒转</b>：神造飞鸟、走兽、爬虫，最后造人（按神形像）；人却反过来，把神的荣耀降级成人的形像，再降到昆虫。<b>拜错了，人就一路往下掉。</b></p>","exp":"<p>23节是七十士译本诗篇106:20 的逐字回响——这不是印象，是可以逐字比对的证据。</p><p>- LXX 诗105(106):20：ἠλλάξαντο τὴν <b>δόξαν</b> αὐτῶν <b>ἐν ὁμοιώματι</b> μόσχου ἔσθοντος χόρτον（把他们的<b>荣耀</b>换成吃草之牛的<b>样式</b>）<br>- 罗1:23：ἤλλαξαν τὴν <b>δόξαν</b> τοῦ ἀφθάρτου θεοῦ <b>ἐν ὁμοιώματι</b> εἰκόνος...</p><p><b>同一个动词（ἀλλάσσω）、同一个受词（δόξα）、同一个介系词片语（ἐν ὁμοιώματι）。</b> 保罗是拿着诗篇106篇在写外邦人。</p><p>另外也回响<b>耶利米书2:11</b>：「岂有一国换了他的神吗？……但我的百姓将他们的荣耀换了那无益的神。」</p><p>而 εἰκών（形像）这个字，把三段经文串成一条线：</p><table><tr><th>经文</th><th>内容</th></tr><tr><td>创1:26–27（LXX）</td><td>神照着自己的 <b>εἰκών</b> 造人</td></tr><tr><td>罗1:23</td><td>人把神的荣耀换成必朽坏之<b>人</b>的 <b>εἰκών</b></td></tr><tr><td>西1:15</td><td>基督是那不能看见之神的 <b>εἰκών</b></td></tr></table><p><b>人不是换了一个神，人是把自己的镜子当成了太阳。</b> 而福音的答案是：真正的形像，一直都在——祂就是基督。</p><p>保罗的用意极深<b>：他表面在讲外邦人拜偶像，用的却是</b>神责备以色列<b>的语言。所以到了第二章，犹太读者无法说「这与我无关」。</b>在西乃山下发生的事，是全人类的缩影。</p><p>- 经文本身：人用受造物的形像取代了创造主的荣耀。<br>- 321应用：偶像不一定有形。今天的偶像可能是成就、名声、关系、金钱、健康、儿女、事工——任何一件被我们放在宝座上、被我们用来定义自己价值的东西。<b>问题不是那东西不好，是它坐错了位子。</b></p>"},{"a":24,"z":24,"star":false,"grk":"<p>Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν αὐτοῖς</p>","lit":"<p>「所以神把他们<b>交付</b>在他们心里的情欲中，以致污秽，使他们的身体在彼此之间被玷辱。」</p>","key":"<p>- <b>παραδίδωμι</b>（G3860）：<b>交付、移交</b>。这是一个法律与军事用语：法官把囚犯<b>交给</b>狱卒；将领把城<b>交给</b>敌人。同一个字用在犹大「卖」耶稣（可14:10）、彼拉多把耶稣「交给」人钉十字架（可15:15）。<br>- <b>ἐπιθυμία</b>（G1939）：强烈的渴望、欲望。<br>- <b>ἀκαθαρσία</b>（G167）：污秽、不洁。</p>","gram":"<p>- <b>παρέδωκεν</b>：不定过去式<b>主动</b>直说语气，<b>主词是 ὁ θεός（神）</b>。这是全段最令人震动的文法事实：<b>「任凭」不是神袖手旁观，是神主动的司法行动。</b><br>- <b>Διό</b>（所以）：明确标示因果——因为人做了23节的事，所以神做了24节的事。</p>","exp":"<p>中文「任凭」容易被误解为「随他去吧」的消极放任。原文更重：<b>神把他们「交出去」。</b></p><p>这是圣经中最可怕的一种审判：<b>神不再拦阻你。</b></p><p>想像一个孩子拼命挣脱父亲的手，要往路中间跑。父亲抓了三次、五次、十次；最后父亲松手了。那一刻不是父亲不爱他，是父亲按着公义，把他交给他自己所坚持要的。</p><p><b>罪的最终刑罚之一，就是罪本身。</b>「逞着心里的情欲」——他们得到了他们想要的，这就是刑罚。奥古斯丁说得极准：神有时借着应允我们的祷告来审判我们。</p>"},{"a":25,"z":25,"star":false,"grk":"<p>οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>「这些人把神的真实换成了那虚谎，敬拜并事奉受造之物，过于（或代替）那造物的主——祂是当受颂赞的，直到永远。阿们。」</p>","key":"<p>- <b>μετήλλαξαν</b>（G3337）：比23节的 ἤλλαξαν 更强（加了 μετά）——<b>彻底掉换</b>。<br>- <b>τῷ ψεύδει</b>：<b>有冠词的「那谎言」</b>——不是随便一个谎，是那个根本的谎言。哪一个谎？创世记3:5：「你们便如神能知道善恶。」<b>人类的第一个谎言，就是「你可以自己作神」。</b><br>- <b>ἐσεβάσθησαν καὶ ἐλάτρευσαν</b>：敬拜（心的态度）＋ 事奉（生活的行动）。<b>敬拜必然带出事奉；你事奉什么，就泄漏你敬拜什么。</b><br>- <b>παρὰ τὸν κτίσαντα</b>：παρά ＋ 直接受格，可译「过于」或「代替」。</p>","gram":"","exp":"<p>保罗写到这里，突然停下来加一句颂赞：「主乃是可称颂的，直到永远。阿们！」——<b>这是一个敬虔的人本能的反射。</b>当他描述人如何亵渎神，他忍不住要为神说一句公道话。</p><p>这是讲道者的心：即使在讲最黑暗的罪，眼睛仍然擡起来看神。</p><p>「那谎言」与「神的真实」的对比，是整章的核心：<br>- <b>真理</b>：神是神，人是人。<br>- <b>谎言</b>：我可以作神。</p><p>321的语言说：<b>有己，就是活在那个谎言里。无己，就是回到真实里——让人作人，让神作神。</b></p>"},{"a":26,"z":27,"star":false,"grk":"<p>Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας … μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν …</p>","lit":"<p>26「<b>因此</b>，神<b>任凭</b>他们陷入羞辱的情欲。他们的女人把<b>合乎本性的用处</b>，<b>换成了</b>违反本性的；」<br>27「男人也是一样，离弃了女人合乎本性的用处，彼此欲火焚烧，男人与男人做出可耻的事，就在自己身上，领受了他们那<b>走岔之行为</b>所当得的报应。」</p>","key":"<p>- <b>πάθη ἀτιμίας</b>（G3806/G819）：「羞辱的情欲」。<br>- <b>φυσικὴν χρῆσιν</b>（G5446/G5540）：「合乎本性的用法」。<br>- <b>παρὰ φύσιν</b>：「违反／超出本性」。<br>- <b>μετήλλαξαν</b>：<b>第三次出现的「换」</b>——与25节同一个字。</p>","gram":"<p>这是全段最容易被误读的地方，而解读的钥匙在文法结构里。</p><p>26–27节是由 <b>Διὰ τοῦτο（因此）</b> 引出的<b>第二次任凭</b>，而它承接的是25节的<b>敬拜错乱</b>。保罗刻意用同一个动词 μετήλλαξαν（换）串起 25 与 26 节：</p><pre>25节：把神的真实  换成  虚谎       （垂直的错乱：敬拜）\n26节：把顺性的用处 换成  逆性的用处  （水平的错乱：受造秩序）</pre><p><b>保罗的论点不是「同性性行为是最坏的罪」，而是：当人在敬拜上把创造主与受造物对调，人在受造秩序上也会出现对调。</b>这是神学论证，不是道德排行榜。证据就是：29–31节接着列出嫉妒、争竞、狂傲、违背父母——把「拜偶像」与「背后说人」放在同一份清单上。</p>","exp":"<p>- <b>经文本身明确表达的</b>：保罗在此描述的性行为，是他视为违背创造秩序（φύσις，回指创1–2的男女受造）的行为，并将之作为人类敬拜错乱在受造层面的显现。这是希腊文与上下文最自然的读法，也是历世历代教会的主流理解。<br>- <b>学者间的讨论</b>（公平列出）：有学者（如 Boswell、Countryman 一系）主张保罗只是针对当时的剥削型关系（娈童、庙妓）或个人「本性」的违背。但多数福音派与许多非福音派学者不接受，理由是：(1) 保罗同时提到女性，这超出娈童模式；(2) ἄρσενες ἐν ἄρσεσιν 描述的是<b>彼此</b>（εἰς ἀλλήλους）的贪恋，而非单向剥削；(3) φύσις 在上下文中与创造（κτίσις、κτίσαντα）词群密切相连，指向受造秩序而非个人倾向。<br>- <b>必须立刻加上的牧养话</b>：这段经文<b>不是给教会拿来丢石头的</b>。因为 2:1 立刻说：「你这论断人的，无论你是谁，也无可推诿。」而 29–31节的清单里有「嫉妒、争竞、狂傲、自夸、违背父母、无亲情」——<b>每一间教会的长椅上都坐满了符合这份清单的人，包括讲台上这一位。</b></p><p><b>福音的话必须同时说出来</b>：<br>「你们中间也有人从前是这样；但如今你们奉主耶稣基督的名，并借着我们神的灵，已经洗净，成圣，称义了。」（林前6:11）</p><p>「从前是这样」——福音的能力，就在这四个字里。</p>"},{"a":28,"z":28,"star":false,"grk":"<p>καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα</p>","lit":"<p>「并且，正如他们<b>不认可</b>把神存在认识中，神就把他们交给一个<b>不被认可的</b>心思，去行那些不该行的事。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th></tr><tr><td>不认识（不认可）</td><td>οὐκ ἐδοκίμασαν</td><td>ouk edokimasan</td><td>G1381</td><td>未经察验而认可</td></tr><tr><td>邪僻的</td><td>ἀδόκιμον</td><td>adokimon</td><td>G96</td><td>经察验后被弃绝的（次品）</td></tr><tr><td>心</td><td>νοῦν</td><td>noun</td><td>G3563</td><td>心思、理性</td></tr></table><p><b>δοκιμάζω / ἀδόκιμος 是同一个字根。</b>这在原文中是刺目的双关：</p><p>人「不认可」神，神就把人交给一个「不被认可」的心思。</p><p>δοκιμάζω 原是<b>金属检验</b>的用语：把金属放在火中试验，合格的叫 δόκιμος，不合格被丢弃的叫 ἀδόκιμος（废料）。</p>","gram":"","exp":"<p>「故意不认识神」——和合本的「故意」译得很好，因为 ἐδοκίμασαν 不是「不知道」，是「检验过后决定不要」。<b>人把神放在天平上秤了一秤，然后说：不合我用。</b></p><p>于是神说：好。你不要我作你思想的主，我就让你的思想成为废料。</p><p>这是最深的悲哀：人自以为摆脱了神，得到了自由的心思；实际上得到的是一颗再也不能正确判断的心。</p><p>321的角度看：这正是「用脑靠自己」的终点。<b>人的理性一旦离开了神，就不再是通往真理的工具，而成了合理化罪的工厂。</b></p>"},{"a":29,"z":31,"star":false,"grk":"<p>πεπληρωμένους πάσῃ ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς, καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς, ἀσυνέτους, ἀσυνθέτους, ἀστόργους, ἀνελεήμονας·</p>","lit":"<p>29「他们<b>已被填满</b>了各样的不义、邪恶、贪婪、恶毒；<b>满了</b>嫉妒、凶杀、争竞、诡诈、毒恨；」<br>30「是<b>搬弄是非的</b>、<b>背后说人的</b>、恨神的、<b>施暴傲慢的</b>、高擡自己的、吹嘘的、<b>发明恶事的</b>、不顺从父母的；」<br>31「是<b>没有悟性的</b>、<b>不守信用的</b>、<b>没有亲情的</b>、<b>没有怜悯的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字义</th></tr><tr><td>装满</td><td>πεπληρωμένους</td><td>peplērōmenous</td><td>G4137</td><td>完成式被动分词：已被填满</td></tr><tr><td>满心是</td><td>μεστούς</td><td>mestous</td><td>G3324</td><td>满的</td></tr><tr><td>嫉妒／凶杀</td><td>φθόνου φόνου</td><td>phthonou phonou</td><td>G5355/G5408</td><td><b>仅差一个字母的双关</b></td></tr><tr><td>侮慢人的</td><td>ὑβριστάς</td><td>hybristas</td><td>G5197</td><td>傲慢施暴者（hubris 由此）</td></tr><tr><td>狂傲的</td><td>ὑπερηφάνους</td><td>hyperēphanous</td><td>G5244</td><td>显得高人一等</td></tr><tr><td>自夸的</td><td>ἀλαζόνας</td><td>alazonas</td><td>G213</td><td>吹嘘者</td></tr><tr><td>无亲情的</td><td>ἀστόργους</td><td>astorgous</td><td>G794</td><td>没有家人之爱</td></tr></table>","gram":"","exp":"<p>这份清单里有五个字是<b>关于嘴巴</b>（谗毁、背后说人、侮慢、自夸、捏造恶事）——<b>保罗把「说闲话」与「凶杀」放在同一份清单上。</b></p><p>还有「狂傲的」（ὑπερήφανος）——雅各书4:6与彼前5:5引用箴言3:34：「神阻挡骄傲的人，赐恩给谦卑的人」，用的正是这个字。<b>骄傲被列在这份最黑暗的清单中，因为它就是这一切的源头。</b></p><p>这份清单的功能不是让我们给世界打分数，是让我们照镜子。</p><p>一个重要的文献对照：<b> 次经《所罗门智慧书》13–14章的论证顺序是——自然界应当使人认识造物主 → 人却拜偶像 → 于是道德全面败坏 → 接着列出一长串恶行清单。</b>这与罗1:19–31 的顺序几乎完全一致。</p><p>这说明了两件事：<br>1. 保罗是在使用<b>当时犹太人早已熟悉、且读了会拍手叫好的一套控诉文体</b>。<br>2. 正因如此，<b>2:1 的翻转才那么致命</b>——保罗先让读者一路点头，然后把整篇控诉文转过来砸在他们自己身上。</p><p>（讲台上不必提书名，说「保罗时代犹太人常用的一套论证」即可。）</p>"},{"a":32,"z":32,"star":false,"grk":"<p>οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.</p>","lit":"<p>「这些人虽然完全知道神的判定——就是行这样事的人是该死的——他们不但去行，还赞同、乐于认同那些去行的人。」</p>","key":"<p>- <b>ἐπιγνόντες</b>（G1921）：ἐπί（加强）＋ γινώσκω——<b>完全地知道</b>。<br>- <b>συνευδοκοῦσιν</b>（G4909）：σύν（一同）＋ εὖ（好）＋ δοκέω（认为）——<b>一同认为好、赞同、鼓掌</b>。</p>","gram":"","exp":"<p>保罗把最重的一句留在最后：<b>比犯罪更严重的，是为犯罪鼓掌。</b></p><p>为什么？因为犯罪的人至少可能还有良心的刺痛；但<b>为罪辩护、鼓掌、按赞、推广的人，已经把良心的最后一道防线也交出去了</b>。他不只是跌倒，他在建立一个让跌倒变成正常的体系。</p><p><b>这一节在今天有极其现实的意义。</b>我们生活在一个「按赞」与「分享」的时代——συνευδοκέω 的现代形式，可能只需要动一根手指。</p><p>而请注意：<b>保罗写这一节的时候，他自己心里一定闪过一个画面。</b>使徒行传8:1：「扫罗也<b>喜悦</b>他（司提反）被害。」那里的希腊文正是 συνευδοκῶν——<b>同一个字。</b></p><p>保罗在写这章最后一句的时候，是在写他自己。</p><p>这也解释了为什么他能在下一章立刻说「你这论断人的，无论你是谁，也无可推诿」——因为他知道那个「无可推诿」的人，第一个就是他。<b>而这样的一个人，蒙了怜悯。这就是为什么他不以福音为耻。</b></p>"}],"2":[{"a":1,"z":1,"star":false,"grk":"<p>Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων.</p>","lit":"<p>「所以你是无可辩护的，人哪，每一个论断的——因为在你论断那另一位的事上，你把你自己定罪了；因为你这论断的，正实行着同样的事。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>所以</td><td>Διό</td><td>dio</td><td>G1352</td><td>διά + ὅς</td><td>因此、据此</td><td>直接承接1:18–32，尤其1:32</td></tr><tr><td>无可推诿</td><td>ἀναπολόγητος</td><td>anapologētos</td><td>G379</td><td>ἀ-（否定）+ ἀπολογία（辩词）</td><td>没有辩护词</td><td>法庭用语：被告站起来，一句话说不出</td></tr><tr><td>论断</td><td>κρίνων</td><td>krinōn</td><td>G2919</td><td>κρίνω</td><td>分辨、审判、定案</td><td>不只是「有意见」，是<b>坐上审判席宣判</b></td></tr><tr><td>定罪</td><td>κατακρίνεις</td><td>katakrineis</td><td>G2632</td><td>κατά（下）+ κρίνω</td><td>判下去、定死罪</td><td>加了κατά，语气比κρίνω重得多</td></tr><tr><td>所行</td><td>πράσσεις</td><td>prasseis</td><td>G4238</td><td>πράσσω</td><td>反复地实行</td><td>现在式，指<b>持续的习惯</b>，非偶一为之</td></tr></table>","gram":"<p>- <b>ἀναπολόγητος εἶ</b>：形容词放句首＝<b>强调位置</b>。「无—可—辩—护，是你！」<br>- <b>ὦ ἄνθρωπε πᾶς ὁ κρίνων</b>：呼格＋「每一个」——论辩体的典型招数。保罗不指名道姓，但每个读的人都觉得被点到。<br>- <b>κατακρίνεις</b>：现在式主动直说语气，第二人称单数。<b>不是「你将会被定罪」，而是「你此刻正在定你自己的罪」</b>——这个定罪不是未来式，是现在进行式。<br>- <b>πράσσεις</b>：πράσσω（习惯性地做）而非 ποιέω（做一件事）。保罗选字精准：<b>你不是偶尔失手，你是惯犯。</b></p><p>这个文法对理解本节有什么影响？<br>若是未来式，论断者还有补救的时间差；但保罗用现在式：<b>当你举起手指指向别人的那一刻，判决书上已经签了你自己的名字。</b></p>","exp":"<p>「所以」（Διό）承接的是1:32。刚刚读完那份可怕的罪恶清单，读者心里浮起一句：「阿们，该罚！」</p><p>保罗立刻转身：<b>「你刚才那句『阿们』，就是你的判决书。」</b></p><p>为什么？因为<b>论断的能力，证明你有道德知识；而你有道德知识却仍然去做，你的罪就比无知的人更重。</b> 你举起的那把尺，量完别人之后，会自动转过来量你自己。</p><p><b>注意保罗没有说「不可分辨是非」。</b> κρίνω 在此的意思是<b>篡夺审判者的位置</b>——那种带着优越感、把自己排除在同一标准之外的定罪。圣经从未叫我们是非不分（林前5:12「教内的人岂不是你们审判的吗」），而是禁止我们<b>坐上只属于神的宝座</b>。</p><p><b>经文本身明确表达的：</b> 论断别人的人，因自己行同样的事而自我定罪，在神面前无可推诿。<br><b>可以合理推论的生命应用：</b> 人之所以那么容易论断，往往因为心里有一个没有被对付的自己——我们最会挑剔的，常常正是我们自己身上最不敢面对的。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.</p>","lit":"<p>「但我们知道，神的审判是照着真理，临到那些习惯行这样事的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>审判</td
