看法。"],["p","第二——也是更重要的——我要按照保罗自己提出的问题来讲这一章。"],["p","而保罗自己的问题，在第6节："],["q","「这不是说神的话落了空。」"],["p","弟兄姊妹，这就是第九章的问题："],["h","神的话，会不会有一天不算数？"],["w",3],["p","我们今天要看三样东西："],["p","第一，一颗碎了的心。\n第二，一位有主权的窑匠。\n第三，一块绊脚的石头。"],["w",3],["h","第一大段｜一颗碎了的心（9:1–5）"],["h","他先哭了"],["p","弟兄姊妹，我要请大家注意一件事。"],["p","保罗要讲神的主权了。他要讲拣选、讲窑匠、讲「我要怜悯谁就怜悯谁」。"],["p","而他的第一句话是什么？"],["p","不是「让我来解释预定论」。"],["p","是——"],["p","眼泪。"],["w",3],["p","第2节：「我是大有忧愁，心里时常伤痛。」"],["p","「时常伤痛」这四个字，希腊文是两个字：不止息的、剧痛。"],["p","弟兄姊妹，那个「剧痛」不是「有点难过」。那是一个很重的字。"],["p","而第3节更重："],["q","「为我弟兄，我骨肉之亲，就是自己被咒诅，与基督分离，我也愿意。」"],["p","「被咒诅」，希腊文是 ἀνάθεμα。"],["p","这个字在旧约的希腊文译本里，翻译的是「当灭之物」——就是约书亚记里，那个被分别出来、交给神毁灭的东西。"],["p","保罗在说：如果可以，我愿意成为那个。"],["w",3],["p","不过弟兄姊妹，这里有一个文法上的细节，我觉得很重要。"],["p","「我也愿意」——这个动词在原文是未完成式。"],["p","在希腊文里，这种用法通常表示一个「知道不可能实现的愿望」。"],["p","所以保罗的意思是："],["q","「我曾这样希望过——\n\n可是我知道，这是不可能的。」"],["p","弟兄姊妹，这是一个心碎到极处的人，说出来的话。"],["h","这句话有一个先例"],["p","而且这句话，不是保罗第一次有人说。"],["p","出埃及记32章。金牛犊事件之后。"],["p","摩西对神说："],["q","「倘或你肯赦免他们的罪……不然，求你从你所写的册上涂抹我的名。」"],["p","弟兄姊妹，两个最伟大的仆人，都说了同一句话。"],["p","摩西愿意。做不到。"],["p","保罗愿意。也做不到。"],["p","只有一位——"],["p","真的做到了。"],["q","「基督既为我们受了咒诅，就赎出我们脱离律法的咒诅。」（加3:13）"],["h","八项特权"],["p","然后第4、5节，保罗开始数。"],["p","他一项一项地数，他的同胞有什么："],["q","「他们是以色列人；那儿子的名分、荣耀、诸约、律法、礼仪、应许都是他们的。列祖就是他们的祖宗；按肉体说，基督也是从他们出来的。」"],["p","弟兄姊妹，八项。"],["p","而我要请大家注意其中一项——「儿子的名分」。"],["p","这个词，我们上个礼拜才学过。"],["p","罗马书8章15节：「你们所受的……乃是儿子的心。」——同一个字。"],["p","那个罗马法律上不可撤销的收养。"],["w",3],["p","弟兄姊妹，你感觉到保罗的痛了吗？"],["q","那份「儿子的名分」——是他们的。\n\n而他们大部分人，站在门外。"],["p","而且保罗一项都没有否认。"],["p","他没有说「你们那些特权其实不算什么」。"],["p","他说：全部是真的。"],["p","只是——"],["p","那些救不了你。"],["w",3],["h","第二大段｜一位有主权的窑匠（9:6–29）"],["h","那个问题"],["p","好，现在我们来到全章的钥匙。第6节："],["q","「这不是说神的话落了空。」"],["p","「落了空」这个字，希腊文是 ἐκπίπτω。"],["p","它的字面意思是：掉下来、掉出去。"],["p","它用在哪里？"],["p","用在花凋谢掉落（雅各书1章）。"],["p","用在船触礁失去方向（使徒行传27章）。"],["p","保罗说：神的话——"],["p","没有掉下来。"],["p","没有凋谢。没有触礁。"],["w",3],["p","但弟兄姊妹，这个问题为什么重要？"],["p","我请大家想一想。"],["p","如果神对以色列说过的话，最后可以不算数——"],["p","那上个礼拜第八章那句「都不能叫我们与神的爱隔绝」，"],["p","凭什么算数？"],["q","弟兄姊妹，第九章不是一篇关于预定论的独立论文。\n\n第九章是保罗在为神的信实辩护。"],["h","两个例子，一个比一个紧"],["p","那保罗怎么证明神的话没有落空？"],["p","他说：「因为从以色列生的不都是以色列人。」（9:6）"],["p","意思是：神的应许，从一开始就不是给「所有血统上的以色列人」的。"],["p","然后他举了两个例子。"],["w",3],["p","第一个例子：亚伯拉罕有两个儿子。"],["p","以实玛利和以撒。"],["p","两个都是亚伯拉罕的儿子。血统上都合格。"],["p","但神说：「从以撒生的才要称为你的后裔。」"],["w",3],["p","弟兄姊妹，但这个例子有一个漏洞。有人可以说："],["q","「那是因为母亲不同啊——一个是使女生的，一个是正室生的。」"],["p","所以保罗加了第二个例子。而这个例子，把那个漏洞堵死了。"],["p","第10节：「还有利百加，既从一个人，就是从我们的祖宗以撒怀了孕。」"],["p","雅各和以扫。"],["p","同一个父亲。同一个母亲。"],["p","而且——同一次怀孕。双胞胎。"],["p","然后第11节说："],["q","「双子还没有生下来，善恶还没有做出来……」"],["p","弟兄姊妹，神说话的时候，这两个孩子还在腹中。"],["p","所以拣选的根据——"],["p","不可能是他们的行为。"],["p","保罗的结论是："],["q","「不在乎人的行为，乃在乎召人的主。」（9:11）"],["h","关于「以扫是我所恶的」"],["p","弟兄姊妹，第13节有一句话，我必须好好处理，因为它很容易被误解，也很容易伤害人。"],["q","「雅各是我所爱的；以扫是我所恶的。」"],["p","我要说三件事。"],["w",3],["p","第一，这句话引自玛拉基书——而玛拉基书写在以扫死后一千多年。"],["p","而玛拉基书那一段讲的是什么？"],["p","它讲的是以东这个民族：「我使他的山岭荒凉……以东人说……」"],["q","那不是在讲一个婴儿的永恒归宿，是在讲两个民族。"],["w",3],["p","第二，创世记25章23节原文就说：「两国在你腹内；两族要从你身上出来。」"],["w",3],["p","第三——这一点最重要——"],["p","在希伯来人的说话方式里，「爱A、恨B」常常是一种比较式的表达。"],["p","弟兄姊妹，最清楚的例子是主耶稣自己说的话。"],["p","路加福音14章26节："],["q","「人到我这里来，若不爱我胜过爱自己的父母、妻子、儿女……就不能作我的门徒。」"],["p","弟兄姊妹，「爱我胜过爱」——原文其实是「恨」。"],["p","主耶稣显然不是叫我们真的憎恨父母。那会违背第五诫。"],["p","那是一种比较式的说法。"],["w",3],["p","所以第13节的重点是什么？"],["q","是「神拣选了雅各，没有拣选以扫」。\n\n不是「神在以扫出生之前，就在情感上憎恨他」。"],["h","一句在金牛犊之后说的话"],["p","接下来保罗问了一个很尖锐的问题。第14节："],["q","「难道神有什么不公平吗？」"],["p","保罗的回答是：「断乎没有！」"],["p","然后他引了一句话："],["q","「我要怜悯谁就怜悯谁，要恩待谁就恩待谁。」（9:15）"],["p","弟兄姊妹，这句话是神在什么时候说的？"],["p","你们知道吗？"],["p","出埃及记33章。"],["p","而出埃及记33章的前一章，发生了什么事？"],["p","金牛犊。"],["w",3],["p","弟兄姊妹，这一点很重要。"],["p","这句话的原始处境，不是「神随意决定谁下地狱」。"],["p","这句话的原始处境是："],["q","一个刚刚拜了金牛犊的民族，\n\n竟然还能继续存在。\n\n为什么？\n\n因为——怜悯。"],["h","想，不算。跑，也不算。"],["p","然后第16节，保罗下了一个结论。弟兄姊妹，这一节我希望大家记住："],["q","「这不在乎那定意的，也不在乎那奔跑的，只在乎发怜悯的神。」"],["p","「定意的」——原文的意思是「想要、意志的决定」。"],["p","「奔跑的」——原文是赛跑。"],["p","弟兄姊妹，保罗把人所能做的两件事，全部列出来了："],["p","想。"],["p","跑。"],["p","然后他说："],["p","都不算。"],["w",3],["p","弟兄姊妹，我要在这里诚实地说一件事。"],["p","很多人读到这里会不舒服。我自己第一次读的时候也不舒服。"],["p","因为我们心里都有一份资格清单。"],["p","我们会想："],["q","「我信主，多少有一点是因为我比较愿意吧？\n\n我比较开放，比较诚实，比较愿意谦卑下来。」"],["p","而第16节说："],["p","不在乎那定意的。"],["p","也不在乎那奔跑的。"],["w",3],["p","弟兄姊妹，我想这样说："],["q","如果神欠你，那叫公平。\n\n如果神不欠你，那叫——怜悯。\n\n而罗马书前面八章已经证明了：神不欠任何人。"],["h","窑匠与泥土"],["p","接下来是全章最有名、也最容易被误用的一段。"],["p","第20、21节："],["q","「你这个人哪，你是谁，竟敢向神强嘴呢？……窑匠难道没有权柄从一团泥里拿一块做成贵重的器皿，又拿一块做成卑贱的器皿吗？」"],["p","「强嘴」这个字，希腊文的意思是——顶回去、对着干。"],["p","弟兄姊妹，我要在这里分辨一件很重要的事。"],["p","保罗不是在说「你不可以问问题」。"],["p","你怎么知道？"],["p","因为保罗自己在第14节和第19节，就在问问题！"],["p","他禁止的是什么？"],["q","是把神拉到被告席，要祂向我交代。"],["p","弟兄姊妹，差别在于——"],["p","你是跪在祂面前问，还是站在祂对面问。"],["h","一个中文看不出来的细节"],["p","接下来我要讲一个原文的细节。这个细节，我认为是解释整章最重要的线索之一。"],["p","第22节和第23节，保罗讲到两种器皿。"],["p","中文是这样的："],["q","22节：「那可怒预备遭毁灭的器皿」\n\n23节：「那蒙怜悯、早预备得荣耀的器皿」"],["p","看起来很对称，对不对？"],["p","但在原文里，这两句的语法完全不一样。"],["w",3],["p","第23节讲得荣耀的时候，保罗用的是主动语态，而且主词明明白白就是神："],["q","「祂预先预备得荣耀的。」"],["p","而第22节讲遭毁灭的时候，保罗用的是被动式——"],["q","「已被预备好走向毁灭的。」"],["p","而且——"],["q","经文没有说是谁预备的。"],["w",3],["p","弟兄姊妹，保罗在这里的用字，精准到令人震动。"],["q","讲到荣耀，他明说：神预先预备的。\n\n讲到毁灭，他用被动式，没有指明是谁。"],["p","这个不对称，是刻意的。"],["p","（我要诚实地说：关于这一段，历代敬虔的解经家有不同的理解。但这个语法上的不对称，是大家都看得见的事实。）"],["h","还有一个字"],["p","而第22节还有一个字，我觉得非常重要。"],["q","「就多多忍耐宽容那可怒……的器皿。」"],["p","「忍耐」这个字，希腊文是 μακροθυμία。"],["p","弟兄姊妹，这个字我们在罗马书第二章学过。"],["p","它的意思是「怒气的引线很长」。"],["p","而第二章第4节说什么？"],["q","「还是你藐视他丰富的恩慈、宽容、忍耐，\n\n不晓得他的恩慈是领你悔改呢？」"],["p","同一个字。"],["w",3],["p","弟兄姊妹，所以第22节的画面不是「神迫不及待要毁灭他们」。"],["p","第22节的画面是："],["q","神担待了他们很久很久。"],["h","那个蒙怜悯的器皿是谁？"],["p","然后第24节，保罗说出了他讲这一切的目的："],["q","「这器皿就是我们被神所召的，不但是从犹太人中，也是从外邦人中。」"],["p","弟兄姊妹，讲了半天的窑匠与泥土，保罗要说什么？"],["p","他要说："],["q","那个蒙怜悯的器皿——就是你们。"],["p","而且他接着引了何西阿书："],["q","「那本来不是我子民的，我要称为『我的子民』。」（9:25）"],["p","弟兄姊妹，如果你今天是外邦人的后裔——"],["p","你能坐在这里读圣经，"],["p","你本身就是这节经文的应验。"],["w",3],["p","所以第九章讲拣选的目的，不是让我们去猜谁在里面、谁在外面。"],["p","是让我们问一个问题："],["h","我怎么会在这里？"],["w",3],["h","第三大段｜一块绊脚的石头（9:30–33）"],["h","保罗自己的结论"],["p","弟兄姊妹，现在我要讲今天最重要的一段。"],["p","而这一段，是很多人读第九章的时候，跳过去的。"],["p","因为他们读到窑匠就停了。"],["p","但保罗自己在第30到33节，给了整章一个结论。"],["p","而那个结论，可能跟你想的不一样。"],["w",3],["p","第30、31节："],["q","「那本来不追求义的外邦人，反得了义……\n\n但以色列人追求律法的义，反得不着律法的义。」"],["p","弟兄姊妹，你看见这个对照了吗？"],["p","外邦人：根本没在追——结果得了。"],["p","以色列：竭力在追——结果没得着。"],["w",3],["p","然后第32节，保罗问：「这是什么缘故呢？」"],["p","弟兄姊妹，请注意保罗怎么回答。"],["p","他没有说：「因为神没有拣选他们。」"],["p","他说的是："],["q","「是因为他们不凭着信心求，只凭着行为求。」"],["w",3],["p","弟兄姊妹，我觉得这一节，是第九章最重要的一节。"],["p","保罗讲了三十节的神主权——"],["p","然后他把整章，收在人凭什么求上。"],["h","一块石头"],["p","而第32节后半说："],["q","「他们正跌在那绊脚石上。」"],["p","「跌」这个字，原文的意思是——撞上、踢到。"],["p","弟兄姊妹，这个画面很残酷："],["q","一群人，用尽全力在跑。\n\n方向是对的——他们追求的是「义」。\n\n然后——\n\n他们撞上了一块石头。"],["w",3],["p","而第33节说，那块石头是神放的："],["q","「我在锡安放一块绊脚的石头，跌人的磐石；\n\n信靠他的人必不至于羞愧。」"],["p","弟兄姊妹，这一节是保罗把两段以赛亚书合在一起引用的。"],["p","以赛亚书28章16节说：神在锡安放一块石头，作为房角石。"],["p","以赛亚书8章14节说：那石头要作绊脚的石头。"],["p","保罗把它们合起来了。"],["w",3],["p","弟兄姊妹，你听出来了吗？"],["q","是同一块石头。\n\n对信靠的人——它是房角石。\n\n对凭行为求的人——它是绊脚石。"],["h","那块石头是谁？"],["p","第九章没有说那块石头是谁。"],["p","但下一章第4节说了："],["q","「律法的总结就是基督，使凡信他的都得着义。」"],["p","弟兄姊妹，第九章讲了那么多奥秘——拣选、窑匠、怜悯、刚硬——"],["p","最后，保罗把它全部收在一个位格上。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["p","第一，一颗碎了的心。"],["p","保罗讲神的主权之前，先哭了。"],["p","而在他之前，主自己先为耶路撒冷哭过。"],["p","弟兄姊妹，如果我们读完第九章，得到的是一套赢辩论的武器——"],["p","那我们读错了。"],["p","因为保罗读第九章的时候，是流着眼泪的。"],["w",3],["p","第二，一位有主权的窑匠。"],["p","「不在乎那定意的，也不在乎那奔跑的，只在乎发怜悯的神。」"],["p","弟兄姊妹，我想这是今天最需要我们安静下来的一句话。"],["p","因为它拿走了我心里最后一份资格清单。"],["p","我不是因为比较愿意才在这里。"],["p","我不是因为比较努力才在这里。"],["p","我在这里，纯粹是怜悯。"],["w",3],["p","第三，一块石头。"],["p","同一块石头。"],["p","信靠的人得房角石。"],["p","凭行为求的人，撞上绊脚石。"],["w",3],["p","弟兄姊妹，我最后要问两个问题。"],["p","第一个问题，是问你自己的："],["q","你最近在追求的那件属灵的事——\n\n是「凭信心求」，还是「凭行为求」？"],["p","我教大家一个检验的方法。"],["p","当你在那件事上失败的时候，你第一个反应是什么？"],["p","如果是「我要更努力」——"],["p","那可能是凭行为求。"],["p","如果是「主啊，救我」——"],["p","那是凭信心求。"],["w",3],["p","第二个问题，是问你身边的人的。"],["p","保罗为他的同胞「大有忧愁，心里时常伤痛」。"],["p","弟兄姊妹，你心里有没有一个名字？"],["p","一个还在外面的人？"],["p","可能是你的父母。你的孩子。你的配偶。你那个从来不肯来教会的兄弟。"],["w",3],["p","如果有——"],["p","我要用第22节那个字，对你说："],["q","神对他，是「多多忍耐」。\n\n而那个「忍耐」，在罗马书第二章的意思是——\n\n祂的恩慈，正在领他悔改。"],["p","弟兄姊妹，你等他等了很久。"],["p","但神——"],["p","等得比你更久。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，先为一件事求赦免。我们常常把第九章当成一场辩论，却忘记保罗写这一章的时候，是流着眼泪的。\n\n主啊，求祢给我们保罗的那颗心——为那些还在外面的人，有不止息的心痛。\n\n我们也承认，我们心里有一份资格清单。我们一直以为，我们能信主多少有一点是因为我们比较愿意、比较开放、比较努力。\n\n今天祢的话说：不在乎那定意的，也不在乎那奔跑的，只在乎发怜悯的神。\n\n主啊，我们没有一点功劳。我们在这里，纯粹是怜悯。\n\n求祢也让我们知道：祢对我们心里想着的那个人，是多多忍耐的。祢的恩慈，正在领他悔改。祢等得比我们更久。\n\n最后，主啊——祢是那块石头。求祢让我们不再凭行为求，只凭信心求。\n\n因为经上说：信靠祢的人，必不至于羞愧。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"10":{"min":35,"blocks":[["h","那话离你不远"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","上个礼拜我们读了罗马书第九章。"],["p","那一章讲神的主权——讲拣选，讲窑匠与泥土，讲「不在乎那定意的，也不在乎那奔跑的，只在乎发怜悯的神」。"],["p","而我上个礼拜说过：如果只读第九章，是会出问题的。"],["w",3],["p","弟兄姊妹，今天我要请大家看一件事。"],["p","第九章结束之后，同一位保罗，第十章第一节写了什么？"],["q","「弟兄们，我心里所愿的，向神所求的，是要以色列人得救。」"],["p","他祷告。"],["w",3],["p","弟兄姊妹，你们注意到了吗？"],["p","一个刚刚讲完「神要怜悯谁就怜悯谁」的人——"],["p","下一句就开始为人的得救祷告。"],["p","而再过十几节，他要说："],["q","「没有传道的，怎能听见呢？」（10:14）"],["p","弟兄姊妹，保罗显然不觉得这两件事互相矛盾。"],["p","对他来说，神的主权不是停止祷告的理由。"],["p","神的主权，是开始祷告的理由。"],["w",3],["p","我们今天要看三样东西："],["p","第一，一场很累的工程。\n第二，一句很近的话。\n第三，一双很脏的脚。"],["w",3],["h","第一大段｜一场很累的工程（10:1–4）"],["h","他们是真的热心"],["p","第2节，保罗为他的同胞说了一句话："],["q","「我可以证明他们向神有热心。」"],["p","弟兄姊妹，「证明」这个字，原文的意思是「作见证」。"],["p","保罗在说：我替他们作证——他们的热心，是真的。"],["w",3],["p","而「热心」这个字，希腊文是 ζῆλος。"],["p","它的字根是「沸腾」。"],["p","弟兄姊妹，保罗有资格说这句话。"],["p","因为他自己就是那个最火热的人。"],["p","腓立比书3章6节，他说："],["q","「就热心说，我是逼迫教会的。」"],["p","弟兄姊妹，你听见了吗？"],["q","他一生中最火热的那一天——\n\n是他拿着大祭司的文书，往大马色去的那一天。\n\n而他那天，正在逼迫神的儿子。"],["h","但方向错了"],["p","第2节后半："],["q","「但不是按着真知识。」"],["p","「真知识」这个字，希腊文是 ἐπίγνωσις。"],["p","保罗没有说他们「没有知识」。他们知识多得很。"],["p","这个字是加强版的：完全的、切身的认识。"],["w",3],["p","然后第3节，保罗讲出了原因。弟兄姊妹，我觉得这是全本圣经对「宗教人」最精准的一句诊断："],["q","「因为不知道神的义，想要立自己的义，就不服神的义了。」"],["p","我要把这一节拆开来讲。"],["h","一个很累的动作"],["p","「想要立自己的义」——「立」这个字，希腊文是 ἵστημι。"],["p","它的意思是：把一样东西扶起来、立稳。"],["p","弟兄姊妹，你们想像一下这个画面："],["q","一个人蹲在地上。\n\n他手上有一样东西，一直立不稳。\n\n他扶。它倒。他再扶。它又倒。\n\n他就这样蹲在那里，扶了一辈子。"],["w",3],["p","弟兄姊妹，我做牧师这些年，看过很多这样的人。"],["p","而最累的地方在哪里？"],["p","在于——"],["q","他以为那就是敬虔。"],["h","没有空排到神的旗下"],["p","而第3节最后说：「就不服神的义了。」"],["p","「不服」这个字，希腊文是 ὑποτάσσω。"],["p","它是一个军事用语：ὑπό（在下面）＋ τάσσω（列队）。"],["p","意思是：排到某人的旗下、进入某人的队列。"],["p","所以保罗的意思是："],["q","他们没有让自己排到神的义底下。\n\n他们——另外开了一支队伍。"],["w",3],["p","弟兄姊妹，我想这一段最诚实的地方在这里："],["q","保罗没有说：「他们公开反抗神。」\n\n他说的是：他们忙着立自己的，所以——\n\n没有空排到祂底下。"],["p","弟兄姊妹，这说中了很多人。"],["p","我们不是不信神。"],["p","我们只是——太忙了。忙着扶那个一直倒的东西。"],["h","那块石头有名字"],["p","然后第4节，保罗讲了一句话。而这句话，回答了上个礼拜留下的问题。"],["p","还记得第九章最后那块石头吗？"],["q","「我在锡安放一块绊脚的石头。」（9:33）"],["p","那块石头是谁？"],["p","第10章第4节说："],["q","「律法的总结就是基督，使凡信他的都得着义。」"],["w",3],["p","弟兄姊妹，「总结」这个字，希腊文是 τέλος。"],["p","我要诚实地说：这个字有不同的翻译可能，历代学者也有不同的看法。"],["p","因为 τέλος 同时可以有两个意思："],["p","它可以是「终点」。"],["p","也可以是「目标」。"],["w",3],["p","弟兄姊妹，我想用一个画面来说明。"],["p","你们有没有跑过操场？"],["p","跑道上有一条终点线。"],["p","那条线，同时是两件事："],["q","它是跑道的尽头。\n\n它也是整场赛跑的目的。"],["p","弟兄姊妹，基督之于律法，正是如此。"],["q","在「靠行律法得义」这条路上——祂是终点。那条路到祂为止。\n\n而在「律法一直指向什么」这件事上——祂是目标。"],["w",3],["p","所以弟兄姊妹，你一直在扶的那个东西——"],["p","祂已经替你立好了。"],["w",3],["h","第二大段｜一句很近的话（10:5–13）"],["h","谁要上天？谁要下阴间？"],["p","接下来保罗引了一段旧约。而这一段，我觉得是全章最美的。"],["p","第6、7节："],["q","「你不要心里说：谁要升到天上去呢？（就是要领下基督来；）\n\n谁要下到阴间去呢？（就是要领基督从死里上来。）」"],["p","弟兄姊妹，这两句话出自申命记30章。"],["p","摩西当时在说什么？"],["p","他说：神的话不是在天上，不必有人替你上去取下来；"],["p","也不是在海外，不必有人替你过海拿回来。"],["w",3],["p","而保罗在这两句话后面，各加了一个注解。"],["p","「谁要升到天上去呢？」——保罗说：就是要领基督下来。"],["p","「谁要下到阴间去呢？」——保罗说：就是要领基督从死里上来。"],["w",3],["p","弟兄姊妹，你听出保罗在说什么了吗？"],["p","他在说："],["q","这两件事——\n\n都做完了。"],["p","要有人上天把祂领下来吗？"],["p","不用。道成了肉身。祂已经下来了。"],["p","要有人下阴间把祂领上来吗？"],["p","不用。祂已经从死里复活了。"],["w",3],["h","那话在哪里？"],["p","所以第8节说："],["q","「他到底怎么说呢？他说：这道离你不远，正在你口里，在你心里——就是我们所传信主的道。」"],["p","弟兄姊妹，我请大家听这句话："],["h","「这道离你不远。」"],["w",3],["p","你知道人的宗教本能是什么吗？"],["p","总觉得要做什么大事才能亲近神。"],["p","要爬阶梯。要走苦路。要上天。要下阴间。"],["p","而如果做不到——就以为神很远。"],["p","而保罗说："],["q","那话——\n\n已经在你嘴边了。"],["h","一句在罗马城里有代价的话"],["p","第9节："],["q","「你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。」"],["p","弟兄姊妹，我要讲一件历史背景，这样你们会知道这句话有多重。"],["p","在第一世纪的罗马帝国，通行的效忠口号是四个字："],["q","「凯撒是主。」"],["p","（希腊文 Κύριος Καῖσαρ。）"],["p","后来在逼迫中，官员要求基督徒说的，就是这句话。"],["w",3],["p","所以弟兄姊妹，在罗马城里说「耶稣是主」——"],["p","那不是一句温和的宗教宣告。"],["p","那句话的意思是："],["q","还有另一位主。\n\n而祂——比凯撒大。"],["h","一个保罗加上去的字"],["p","接下来第11节，保罗引了以赛亚书28章16节："],["q","「凡信他的人必不至于羞愧。」"],["p","弟兄姊妹，我要跟你们说一件很小、却很美的事。"],["p","以赛亚书28章16节的希腊文译本，原文是："],["q","「信靠的人必不着急。」"],["p","而保罗引用的时候——"],["p","他加了一个字。"],["p","那个字是——"],["h","「凡」。"],["w",3],["p","而且他不只加了一次。"],["p","第12节：「他也厚待一切求告他的人。」"],["p","第13节：「凡求告主名的，就必得救。」"],["p","弟兄姊妹，三节之内，保罗敲了三次。"],["p","凡。一切。凡。"],["h","那位「主」是谁"],["p","而第13节，是全章最深的一句话。表面上很简单："],["q","「凡求告主名的，就必得救。」"],["p","这句话引自约珥书2章32节。"],["p","弟兄姊妹，我要问一个问题。"],["p","约珥书那一节的「主」，希伯来原文是哪个字？"],["p","是——"],["q","יְהוָה。\n\n耶和华。"],["w",3],["p","弟兄姊妹，你们听懂了吗？"],["p","约珥书说：凡求告耶和华名的，就必得救。"],["p","而保罗在什么上下文引用它？"],["p","第9节：「你若口里认耶稣为主。」"],["p","第12节：「众人同有一位主。」"],["p","第13节：「凡求告主名的，就必得救。」"],["w",3],["p","保罗把旧约中专属耶和华的应许——"],["p","直接用在耶稣身上。"],["p","而且他写得那么自然，好像那是理所当然的事。"],["w",3],["h","它有多宽"],["p","弟兄姊妹，我要请大家看第13节有多宽。"],["q","「凡求告主名的，就必得救。」"],["p","它没有说「凡好人」。"],["p","它没有说「凡懂神学的」。"],["p","它没有说「凡有宗教背景的」。"],["p","它只说——"],["p","凡求告的。"],["w",3],["p","而「求告」这个字，意思很简单。"],["p","它的意思是："],["q","喊祂的名字。"],["w",3],["h","第三大段｜一双很脏的脚（10:14–21）"],["h","四个「怎能」"],["p","弟兄姊妹，那话这么近，这么宽——"],["p","那为什么还有这么多人没有得救？"],["p","保罗在第14、15节，问了四个问题。"],["p","而这四个问题，是倒着推的。"],["q","「人未曾信他，怎能求他呢？\n\n未曾听见他，怎能信他呢？\n\n没有传道的，怎能听见呢？\n\n若没有奉差遣，怎能传道呢？」"],["p","四个「怎能」。像四级台阶，一级一级往下推。"],["p","```\n求告  ←  相信  ←  听见  ←  传讲  ←  差遣\n```"],["w",3],["p","弟兄姊妹，我要你们注意最底下那一级。"],["p","「若没有奉差遣，怎能传道呢？」"],["p","「奉差遣」这个字，希腊文是 ἀποστέλλω——"],["p","它正是「使徒」（ἀπόστολος）那个字的动词。"],["p","而它在这里是——被动式。"],["q","不是「我决定要去」。\n\n是「我被差出去」。"],["h","那双脚"],["p","然后第15节，保罗引了以赛亚书52章7节："],["q","「报福音、传喜信的人，他们的脚踪何等佳美！」"],["p","弟兄姊妹，我要先讲以赛亚书52章的画面。"],["p","那时候的处境是什么？"],["q","一座被围困的城。\n\n城墙上站着人，望着远方的山。\n\n他们在等消息——不知道是好消息，还是坏消息。"],["p","然后——"],["q","山那头，出现了一个人。\n\n他在跑。"],["p","弟兄姊妹，他还没开口。他还离得很远。"],["p","但城墙上的人，已经看见了什么？"],["q","他的脚。"],["w",3],["p","而以赛亚书说：「这人的脚登山何等佳美！」"],["w",3],["p","弟兄姊妹，我要问一个问题。"],["p","脚，美吗？"],["p","说实话，脚是我们身上最不美的部位之一。"],["p","而走远路的脚，更是——"],["p","脏的。磨破的。满是尘土的。"],["p","那为什么圣经说它「何等佳美」？"],["w",3],["q","因为那双脚，\n\n带来了消息。"],["p","弟兄姊妹，那双脚之所以美，不是因为脚。"],["p","是因为——它带来的那件事。"],["h","一个关于动力的提醒"],["p","弟兄姊妹，讲到这里，我要说一件牧养上很重要的事。"],["p","第14、15节常常被这样用："],["q","「你不去传，他们就下地狱。他们的血要归在你头上。」"],["p","弟兄姊妹，我不想这样讲。"],["p","因为那不是保罗的语气。"],["w",3],["p","保罗的起点在哪里？"],["p","在第1节：「我心里所愿的，向神所求的。」"],["p","那是渴望，不是罪疚。"],["w",3],["p","所以我想这样说："],["q","不是「你不去，他们就完了」。\n\n是——\n\n「那道离他们不远。\n\n而你手上，刚好有。」"],["h","最后一个画面"],["p","弟兄姊妹，现在我们来到第十章的最后一节。"],["p","而我要说：这是我读罗马书时，最让我停下来的一节之一。"],["w",3],["p","保罗讲了一整章「人的责任」。"],["p","你要信。你要承认。你要求告。有人要去传。"],["p","然后——最后一节，镜头转了。"],["p","从人的手，转到——"],["p","神的手。"],["w",3],["p","第21节："],["q","「至于以色列人，他说：\n\n我整天伸手招呼那悖逆顶嘴的百姓。」"],["w",3],["p","弟兄姊妹，我要把这一节拆开来。"],["p","「伸手」——原文的意思是「完全张开」。"],["p","而且「手」是复数。"],["p","是一双手，完全张开。"],["w",3],["p","弟兄姊妹，那是什么姿势？"],["p","不是指责的手指。"],["p","不是握紧的拳头。"],["p","是一个——"],["q","张开双臂、等着人回来的姿势。"],["w",3],["p","而前面还有三个字：「整天」。"],["p","原文是：整整一天，从早到晚。"],["p","不是「有时候」。"],["p","不是「祂试过几次」。"],["p","是——"],["p","一整天。一刻没有放下。"],["w",3],["p","而祂向着谁伸手？"],["p","「向着那悖逆顶嘴的百姓。」"],["p","弟兄姊妹，「悖逆」这个字在原文的意思是——"],["p","「不肯被说服」。"],["p","不是「不知道」。"],["p","是不肯。"],["w",3],["p","所以这一节的画面是："],["q","一个不肯的人，\n\n和一双整天张开、没有放下的手。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["p","第一，一场很累的工程。"],["p","你一直在扶的那个东西——那个「自己的义」——"],["p","它立不稳。"],["p","它从来没有立稳过。"],["p","而你以为那就是敬虔。"],["w",3],["p","第二，一句很近的话。"],["p","不必上天。不必下阴间。"],["p","因为那两件事，祂都做完了。"],["p","那话——已经在你嘴边了。"],["p","而你要做的，只有一个动作："],["p","喊祂的名字。"],["w",3],["p","第三，一双很脏的脚。"],["p","那道离人不远——"],["p","但总要有人去说。"],["w",3],["p","弟兄姊妹，我最后要对两种人说话。"],["w",3],["p","第一种，是心里觉得「我离神很远」的人。"],["p","可能你今天是第一次来。"],["p","可能你信了很久，但你心里有一件事，让你觉得你不配。"],["p","弟兄姊妹，我要把第8节送给你："],["q","「这道离你不远，正在你口里，在你心里。」"],["p","你不必先变好。"],["p","你不必先搞懂。"],["p","你不必上天，也不必下阴间。"],["p","因为第13节说："],["q","「凡求告主名的，就必得救。」"],["p","凡。"],["p","包括你。"],["w",3],["p","第二种，是心里有一个名字的人。"],["p","一个你等了很久的人。"],["p","你为他祷告了很多年。你讲过，你也被拒绝过。"],["p","你可能已经快要放弃了。"],["w",3],["p","弟兄姊妹，我要把第21节送给你。"],["p","神说："],["q","「我整天伸手招呼那悖逆顶嘴的百姓。」"],["w",3],["p","你等他，等了很久。"],["p","但是——"],["p","神的手，已经伸了一整天。"],["p","而且——"],["p","还没有放下。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，先承认一件事：我们当中有人已经很累了。我们一直在扶那个立不稳的东西——我们自己的义。扶了很多年。而它一直倒。\n\n主啊，今天祢的话说：律法的总结就是基督。祢已经替我们立好了。\n\n也求祢对今天在这里、心里觉得离祢很远的人说话。求祢让他们听见那句话：这道离你不远，正在你口里，在你心里。\n\n主啊，我们不必上天，不必下阴间，因为祢都做完了。我们只要喊祢的名字。\n\n最后，主啊，我们把心里那些名字带到祢面前。那些我们等了很久的人。\n\n求祢提醒我们：祢的手，已经伸了一整天，而且还没有放下。\n\n也求祢差遣我们——让我们成为那双脚。虽然脏，虽然磨破了，但求祢使用它，把消息带到那个人那里。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"11":{"min":35,"blocks":[["h","深哉"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天，我们要读完罗马书第九、十、十一章这一整个段落。"],["p","这三章，是全卷罗马书最难的部分。"],["p","第九章讲神的主权。\n第十章讲人的责任。\n而今天的第十一章，讲神的计划与奥秘。"],["w",3],["p","弟兄姊妹，我先问一个问题。"],["p","你们觉得，保罗讲完这三章，他的结论会是什么？"],["p","我以前以为，他会给我们一个完整的系统。"],["p","像是：「所以，神的主权和人的责任是这样配合的，第一点、第二点、第三点……」"],["w",3],["p","但保罗没有。"],["p","他讲完之后，写下的第一个字，是一个感叹词。"],["p","罗马书11章33节，原文的第一个字是："],["q","「Ὦ」——啊！」"],["p","第二个字是「深」。"],["p","和合本翻译得非常好："],["q","「深哉，神丰富的智慧和知识！」"],["w",3],["p","弟兄姊妹，保罗讲了三章最艰难的神学。"],["p","然后他的结论不是一套系统。"],["p","是——"],["p","跪下来。"],["w",3],["p","今天我们要看三样东西："],["p","第一，七千人。\n第二，一棵不属于你的树。\n第三，一声赞叹。"],["w",3],["h","第一大段｜还有七千人（11:1–10）"],["h","那只手还没放下"],["p","弟兄姊妹，我们先接上礼拜。"],["p","第十章的最后一节，是一个画面："],["q","「我整天伸手招呼那悖逆顶嘴的百姓。」（10:21）"],["p","然后第十一章第一节，保罗立刻问："],["q","「我且说，神弃绝了他的百姓吗？」"],["p","回答是两个字："],["q","「断乎没有！」"],["w",3],["p","弟兄姊妹，「弃绝」这个字，原文是 ἀπωθέομαι。"],["p","它是由「ἀπό（离开）」加上「ὠθέω（推）」组成的。"],["p","意思是：推开。"],["p","而这个字，出现在旧约的两个地方——"],["p","撒母耳记上12章22节：「耶和华……必因他的大名不撇弃你们。」"],["p","诗篇94篇14节：「因为耶和华必不丢弃他的百姓。」"],["q","弟兄姊妹，保罗问的这个问题，\n\n用的就是诗篇的话。\n\n他在说：这个问题，圣经自己早就回答过了。"],["h","第一个证据：保罗自己"],["p","而保罗拿出的第一个证据，很简单也很有力："],["q","「因为我也是以色列人，亚伯拉罕的后裔，属便雅悯支派的。」"],["p","弟兄姊妹，他在说："],["q","你问神有没有丢弃以色列人？\n\n你看看——写这封信的人是谁。"],["h","只剩下我一个人"],["p","然后保罗讲了一个故事。而我觉得，这个故事是今天最安慰人的一段。"],["p","第2到4节，他提到以利亚。"],["p","弟兄姊妹，我们回到列王纪上。"],["p","列王纪上18章，以利亚在迦密山上做了什么？"],["p","他一个人对抗四百五十个巴力先知。"],["p","火从天上降下来。全民俯伏在地喊：「耶和华是神！」"],["p","那是他一生中最高的一天。"],["w",3],["p","然后——列王纪上19章。"],["p","耶洗别派人传了一句话：「明日约在这时候，我若不使你的性命像那些人的性命一样，愿神明重重地降罚与我。」"],["p","就一句话。"],["p","而那个刚刚叫火从天降下来的人——"],["p","逃了。"],["p","他一路逃到旷野，坐在一棵罗腾树下，求死。"],["w",3],["p","弟兄姊妹，他对神说了什么？"],["p","列王纪上19章10节，也就是罗马书11章3节引用的："],["q","「主啊，他们杀了你的先知，拆了你的祭坛，\n\n只剩下我一个人；他们还要寻索我的命。」"],["w",3],["p","弟兄姊妹，我要停在这一句话上。"],["p","「只剩下我一个人。」"],["p","这不是懒惰。这不是不属灵。"],["p","这是一个筋疲力尽的人说的话。"],["p","而我想，今天在座有人说过类似的话。"],["p","- 在家里，只有我一个人信主\n- 在公司，只有我一个人不参与那些事\n- 在教会，好像只有我还在乎这件事\n- 我祷告了这么多年，我快撑不下去了"],["h","神的回答"],["p","弟兄姊妹，神怎么回答？"],["p","祂没有说：「你太软弱了。」"],["p","祂没有说：「你怎么可以这样？」"],["p","神说了一句话。罗马书11章4节："],["q","「我为自己留下七千人，是未曾向巴力屈膝的。」"],["w",3],["p","弟兄姊妹，我要跟你们讲原文里的一个细节。"],["p","「我为自己留下」——这个动词是主动语态，主词是神。"],["p","而且还有两个字：「为自己」。"],["p","所以完整的意思是："],["q","「我——为我自己——保留下来了七千人。」"],["w",3],["p","弟兄姊妹，那七千人不是「碰巧没有跪拜巴力」。"],["p","是神为自己保留的。"],["p","而以利亚——"],["p","完全不知道。"],["w",3],["p","弟兄姊妹，我想这是今天第一个要带回去的话："],["q","以利亚不是真的只剩一个。\n\n他只是——不知道。"],["p","而神说「还有七千」的时候，祂没有告诉以利亚那七千个人的名字。"],["p","祂只是说：有。"],["h","恩典不能掺水"],["p","而第5节说："],["q","「如今也是这样，照着拣选的恩典，还有所留的余数。」"],["p","「如今也是这样」——弟兄姊妹，那是现在式。"],["p","以利亚的时代是这样。"],["p","保罗的时代是这样。"],["p","今天——也是这样。"],["w",3],["p","然后第6节，保罗加了一句话。这句话很短，但它是全本圣经对恩典最干净的一个定义："],["q","「既是出于恩典，就不在乎行为；\n\n不然，恩典就不是恩典了。」"],["p","弟兄姊妹，这句话的意思是："],["q","恩典不能掺水。\n\n只要掺进一滴「因为我……」——\n\n它就在定义上，不再是恩典了。"],["w",3],["h","第二大段｜一棵不属于你的树（11:11–24）"],["h","绊了一下，不是倒下去"],["p","弟兄姊妹，第11节，保罗问了第二个问题："],["q","「我且说，他们失脚是要他们跌倒吗？断乎不是！」"],["p","这一节在原文里，用了两个不同的动词。中文都翻成「跌」，但它们不一样。"],["p","「失脚」是 πταίω——意思是绊了一下、踉跄。"],["p","「跌倒」是 πίπτω——意思是摔下去、倒在地上。"],["w",3],["p","弟兄姊妹，你看出差别了吗？"],["q","绊了一下——还可以站起来。\n\n摔倒——起不来了。"],["p","而保罗问的是："],["q","「他们绊了一下，是为了让他们倒下去起不来吗？」"],["p","答案是：断乎不是。"],["w",3],["p","弟兄姊妹，这一个动词的差别，是整章盼望的第一个根据。"],["p","而它也是给我们的："],["q","你心里那个人——他绊了一下。\n\n但那不等于他倒下去起不来了。"],["h","一棵橄榄树"],["p","接下来第17节开始，保罗讲了一个比喻。而这个比喻，是第十一章的心脏。"],["p","他说：有一棵橄榄树。"],["p","（在旧约里，橄榄树常常象征以色列——耶利米书11章16节说：「耶和华曾称你的名为青橄榄树。」）"],["p","这棵树上，有些枝子被折下来了。"],["p","然后——"],["q","「你这野橄榄得接在其中，一同得着橄榄根的肥汁。」（11:17）"],["w",3],["p","弟兄姊妹，我要先讲一件农业常识。"],["p","在地中海世界，嫁接是这样做的："],["q","你把好品种的枝子，接到野生的、根强壮的树上。"],["p","因为好品种的枝子结好果子，野生的根比较强壮。"],["p","这是正常的做法。"],["w",3],["p","但保罗讲的是什么？"],["p","他说：把野橄榄，接到好橄榄上。"],["p","弟兄姊妹，这是反的。"],["p","而保罗——"],["p","自己知道。"],["p","第24节他说："],["q","「你是从那天生的野橄榄上砍下来的，尚且逆着性得接在好橄榄上。」"],["p","「逆着性」——原文是 παρὰ φύσιν，意思是「违反自然」。"],["w",3],["p","弟兄姊妹，保罗为什么刻意用一个反常的嫁接？"],["p","因为——"],["q","外邦人得救这件事，本身就是逆着性的。\n\n这件事本来不该发生。"],["h","那句最扎心的话"],["p","然后第18节，保罗说了一句话。"],["p","弟兄姊妹，这句话是他写整章的主要目的。"],["p","而且他在第13节已经说清楚了对象是谁：「我对你们外邦人说这话。」"],["p","第18节："],["q","「你就不可向旧枝子夸口；\n\n若是夸口，当知道不是你托着根，乃是根托着你。」"],["w",3],["p","「托着」这个字，原文是 βαστάζω。"],["p","它的意思是：扛起重量、承载。"],["p","（加拉太书6章2节「各人的重担要互相担当」——同一个字。）"],["w",3],["p","弟兄姊妹，我请大家想像一棵树。"],["p","一根枝子，长在树上。"],["p","它会不会扛着树根？"],["p","不会。"],["p","从来不会。"],["p","是根在扛着枝子。"],["p","而枝子如果哪一天觉得「这棵树靠我撑着」——"],["q","那只说明一件事：\n\n它忘了自己是被接上去的。"],["h","那句我们很少说出口的话"],["p","而第19节，保罗把我们心里那句话写出来了。"],["p","他说：「你若说……」"],["p","弟兄姊妹，听听这句话："],["q","「那枝子被折下来，是特为叫我接上。」"],["w",3],["p","弟兄姊妹，我们很少把这句话说出口。"],["p","但它常常在那里。"],["p","它的白话版是："],["q","「还好我不是他们。」"],["p","- 那间教会怎么衰退成那样？还好我们不是\n- 那个弟兄怎么会跌倒？还好我不是\n- 那个家庭怎么弄成这样？还好我们不是"],["w",3],["p","而保罗怎么回答？"],["p","第20节。弟兄姊妹，请注意他的第一个字："],["q","「不错！他们因为不信，所以被折下来；你因为信，所以立得住。」"],["p","他没有否认那个事实。"],["p","他说：对，你说得没错。"],["p","但是——"],["q","「你不可自高，反要惧怕。」"],["p","然后第21节："],["q","「神既不爱惜原来的枝子，也必不爱惜你。」"],["h","恩慈和严厉"],["p","第22节："],["q","「可见，神的恩慈和严厉……向你是有恩慈的，只要你长久在他的恩慈里。」"],["p","弟兄姊妹，「恩慈」这个字，我们在罗马书第二章学过。"],["p","χρηστότης。"],["p","而第二章第4节说什么？"],["q","「还是你藐视他丰富的恩慈、宽容、忍耐，\n\n不晓得他的恩慈是领你悔改呢？」"],["w",3],["p","弟兄姊妹，同一个字。"],["p","第二章说：神的恩慈，是领人悔改的。"],["p","第十一章说：神的恩慈，是要人长久住在里面的。"],["q","所以——\n\n恩慈从来不是让人放心自满的理由。"],["h","神能够"],["p","但弟兄姊妹，这一段不是以警告结束的。"],["p","第23节说："],["q","「而且他们若不是长久不信，仍要被接上，\n\n因为神能够把他们从新接上。」"],["p","「神能够」——弟兄姊妹，这句话让我想起罗马书第四章。"],["p","第4章21节，讲亚伯拉罕："],["q","「且满心相信神所应许的必能做成。」"],["p","同一个字。δυνατός。"],["w",3],["q","那位「叫死人复活、使无变为有」的神——\n\n也能把折下来的枝子，重新接上。"],["p","而第24节说："],["q","「你……尚且逆着性得接在好橄榄上，\n\n何况这本树的枝子，要接在本树上呢！」"],["p","弟兄姊妹，这是一个很有力的逻辑："],["q","如果神连那件反常的事都做了——\n\n祂当然能做那件顺理成章的事。"],["w",3],["h","第三大段｜一声赞叹（11:25–36）"],["h","一个奥秘"],["p","弟兄姊妹，第25节开始，保罗要讲一个「奥秘」。"],["q","「弟兄们，我不愿意你们不知道这奥秘（恐怕你们自以为聪明）……」"],["p","注意括号里那一句：「恐怕你们自以为聪明」。"],["p","保罗讲这个奥秘的目的，仍然是防止外邦人自高。"],["w",3],["p","而那个奥秘是："],["q","「以色列人有几分是硬心的，等到外邦人的数目添满了，\n\n于是以色列全家都要得救。」（11:25–26）"],["w",3],["p","弟兄姊妹，我要在这里诚实地说一件事。"],["p","「以色列全家都要得救」这一句话，历代敬虔的解经家有不同的理解。"],["p","有人认为，这是指将来以色列民族会大规模归向基督。"],["p","有人认为，这是指历世历代蒙拣选的犹太人，加起来的总数。"],["p","也有人认为，「以色列」在这里指的是神所有的子民。"],["p","弟兄姊妹，我今天不打算在讲台上裁决这件事。"],["p","但我要说一件更重要的事："],["q","无论你持哪一种看法——\n\n保罗要对外邦信徒说的话，完全一样：\n\n「你不可向旧枝子夸口。」"],["w",3],["p","我也要说：这一章讲的是救恩历史，不是现代的政治。"],["p","保罗在这里没有谈任何一个现代国家的边界或政策。"],["p","我们不要把自己的政治立场，讲成圣经的教导。"],["h","一句不会反悔的话"],["p","但第25节有两个小地方，我要请大家注意。"],["p","第一，保罗说「以色列人有几分是硬心的」。"],["p","「有几分」——原文是「部分地」。"],["p","不是全部。"],["p","第二，保罗说「等到外邦人的数目添满了」。"],["p","「等到」——那是一个时限。"],["p","不是永久。"],["w",3],["p","然后第29节，保罗说了一句话。弟兄姊妹，我认为这是全章最大的一句保证："],["q","「因为神的恩赐和选召，是没有后悔的。」"],["p","「没有后悔」，原文是 ἀμεταμέλητος——"],["p","意思是：不会改变主意、不可撤回。"],["w",3],["p","弟兄姊妹，你们知道这句话为什么对我们重要吗？"],["p","因为——"],["q","如果神会对以色列反悔，\n\n那祂对你，也可能反悔。\n\n而如果祂不会——\n\n那罗马书第八章那句「都不能叫我们与神的爱隔绝」，\n\n就有了最终的保证。"],["h","一张网"],["p","然后是第32节。弟兄姊妹，这一节是九到十一章整个论证的终点："],["q","「因为神将众人都圈在不顺服之中，特意要怜恤众人。」"],["p","「圈在」这个字，原文是 συγκλείω。"],["p","它的意思是：一同关起来、围住。"],["w",3],["p","弟兄姊妹，这个字最有帮助的一个用法，在路加福音第5章。"],["p","那是彼得打鱼的那一段。"],["p","他整夜劳力，什么都没打着。主说：把网撒下去。"],["p","然后路加福音5章6节说："],["q","「他们下了网，就圈住许多鱼。」"],["p","同一个字。"],["w",3],["p","弟兄姊妹，所以第32节的画面是什么？"],["q","神撒下一张网。\n\n把所有人——犹太人、外邦人，全部围在里面。"],["p","而目的是什么？"],["p","不是为了审判。"],["p","经文说："],["q","「特意要怜恤众人。」"],["w",3],["p","弟兄姊妹，保罗走了三章的迷宫。"],["p","拣选、刚硬、余数、橄榄树、奥秘——"],["p","最后他停在一个字上："],["p","怜恤。"],["h","追不到的脚印"],["p","然后——第33节。"],["p","弟兄姊妹，原文的第一个字，是一个感叹词："],["q","「Ὦ」——「啊！」"],["p","然后："],["q","「深哉，神丰富的智慧和知识！\n\n他的判断何其难测！他的踪迹何其难寻！」"],["w",3],["p","我要讲「踪迹何其难寻」这个字。因为它太美了。"],["p","原文是 ἀνεξιχνίαστος。"],["p","它由三个部分组成："],["p","ἀ ——「不能」。"],["p","ἐκ ——「出来」。"],["p","ἴχνος ——「脚印」。"],["p","合起来的意思是：追不到脚印。"],["w",3],["p","弟兄姊妹，这个字的画面是什么？"],["q","一个猎人，在雪地上追踪脚印。\n\n他跟着走。跟着走。跟着走——\n\n然后——\n\n脚印消失了。"],["w",3],["p","而和合本翻译成「他的踪迹何其难寻」——"],["p","把这个画面完整地保留下来了。"],["w",3],["p","弟兄姊妹，保罗在说："],["q","神走过的路，你追不到底。\n\n你可以跟一段。\n\n但总有一个地方，脚印就没有了。"],["h","三个介词"],["p","而最后一节，第36节："],["q","「因为万有都是本于他，倚靠他，归于他。\n\n愿荣耀归给他，直到永远。阿们！」"],["p","弟兄姊妹，这一节在原文里，是三个介词："],["p","ἐξ αὐτοῦ ——出于祂。"],["p","δι' αὐτοῦ ——借着祂。"],["p","εἰς αὐτόν ——归向祂。"],["w",3],["p","起源，是祂。"],["p","过程，是祂。"],["p","终点，是祂。"],["w",3],["p","弟兄姊妹，如果起点、过程、终点都是祂——"],["p","那中间——"],["q","没有一个地方，可以插进「我」。"],["p","所以下一句必然是："],["q","「愿荣耀归给他，直到永远。阿们！」"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。而它们对应三种「我以为」。"],["w",3],["p","第一，七千人。"],["p","我以为——只剩我一个。"],["p","而神说：还有七千。"],["p","弟兄姊妹，以利亚不是真的只剩一个。"],["p","他只是不知道。"],["p","而如果你今天觉得孤单——"],["p","我要告诉你：你不知道的事，比你知道的多。"],["w",3],["p","第二，一棵不属于你的树。"],["p","我以为——我站得稳。"],["p","而保罗说：不是你托着根，乃是根托着你。"],["p","你是被接上去的。"],["p","而且是逆着性接上去的——这件事本来不该发生。"],["p","所以下次当你想说「还好我不是他们」的时候——"],["p","请改成一句话："],["q","「若不是恩典，那就是我。」"],["w",3],["p","第三，一声赞叹。"],["p","我以为——我可以想通。"],["p","而保罗说：祂的踪迹何其难寻。"],["p","你可以跟一段。"],["p","但总有一个地方，脚印就没有了。"],["w",3],["p","弟兄姊妹，我最后要说一件事。"],["p","我们今天读完了罗马书第九、十、十一章。"],["p","这三章讲的是全本圣经最难的题目之一。"],["p","而我要问："],["p","保罗讲完之后，他得到了什么？"],["w",3],["p","他没有得到一套可以拿去辩论的系统。"],["p","他也没有说「所以我全都搞懂了」。"],["p","他得到的是——"],["p","一声「啊」。"],["p","然后跪下来。"],["w",3],["p","弟兄姊妹，如果一个人读完罗马书九到十一章，"],["p","得到的是一套可以赢辩论的系统——"],["p","那他得到的，跟保罗得到的不一样。"],["w",3],["p","而如果你今天心里有一件事，你想了很久、还是想不通——"],["p","我要把保罗的话送给你。"],["p","不是一个解释。"],["p","是一句话："],["h","深哉。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天读完了三章最难的经文。而我们承认，我们没有全部弄懂。\n\n主啊，求祢先安慰今天在这里觉得「只剩我一个」的人。求祢让他知道：祢说「我为自己留下七千人」。他不知道的事，比他知道的多。\n\n主啊，也求祢对付我们心里那句很少说出口的话——「还好我不是他们」。求祢提醒我们：我们是被接上去的，而且是逆着性接上去的。不是我们托着根，乃是根托着我们。\n\n主啊，我们当中有人心里有一件想不通的事。想了很多年。求祢让我们今天可以不再追那些追不到的脚印，只是安静下来，说一句：深哉。\n\n因为万有都是本于祢，倚靠祢，归于祢。\n\n愿荣耀归给祢，直到永远。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"12":{"min":35,"blocks":[["h","所以"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天的讲题只有两个字。"],["p","《所以》。"],["w",3],["p","我先问大家一个问题。"],["p","你们有没有算过，罗马书前面十一章，保罗讲了多少东西？"],["p","他从「没有义人，连一个也没有」开始。"],["p","讲到「但如今，神的义在律法以外已经显明出来」。"],["p","讲到「神既不爱惜自己的儿子」。"],["p","讲到「都不能叫我们与神的爱隔绝」。"],["p","上礼拜我们读到最后，他跪下来说：「深哉，神丰富的智慧和知识！」"],["w",3],["p","十一章。"],["p","弟兄姊妹，然后——"],["p","第十二章第一节，第一个字是："],["h","「所以。」"],["w",3],["p","而那个「所以」后面接的，不是一套新的教义。"],["p","不是第十二个论点。"],["p","是一个动作："],["q","「将身体献上。」"],["w",3],["p","弟兄姊妹，今天我们要跟着保罗走三个地方："],["p","第一，祭坛上。\n第二，身体里。\n第三，街上。"],["w",3],["h","第一大段｜祭坛上（12:1–2）"],["h","动力是什么？"],["p","我们先读第1节："],["q","「所以弟兄们，我以神的慈悲劝你们，将身体献上，当作活祭。」"],["p","弟兄姊妹，我要先讲「慈悲」这个字。"],["p","因为献身的动力，全在这两个字上。"],["w",3],["p","「慈悲」的希腊文是 οἰκτιρμοί。"],["p","而它在旧约的希腊文译本里，翻译的是希伯来文 רַחֲמִים（rachamim）。"],["p","弟兄姊妹，这个希伯来字的字根很有意思。"],["p","它的字根是 רֶחֶם（rechem）——意思是「子宫」。"],["w",3],["p","所以「慈悲」这个字的画面是什么？"],["q","一个母亲对她孩子的那种感情。\n\n从肺腑深处来的。"],["p","而且保罗用的是复数——"],["q","不是「一次的慈悲」，是「一件又一件的慈悲」。"],["w",3],["p","弟兄姊妹，保罗指的是哪些慈悲？"],["p","就是前面十一章的每一件事："],["p","称义。和好。圣灵住进来。一点定罪也没有。都不能隔绝。怜恤众人。"],["w",3],["p","所以弟兄姊妹，我要在这里说一件很重要的事。"],["p","保罗没有说：「你欠神这么多，还债吧。」"],["p","他说：「我以神的慈悲劝你们。」"],["q","献身的动力不是罪疚。\n\n是——慈悲。"],["h","「劝」而不是「命令」"],["p","而「劝」这个字也很有意思。"],["p","保罗是使徒。他有权柄命令。"],["p","但他用的字是 παρακαλέω——意思是「在旁边呼唤、恳求」。"],["p","（顺带一提，这个字的名词形 παράκλητος，就是约翰福音里圣灵的称号——「保惠师」。）"],["q","弟兄姊妹，讲到献身这件事，保罗选择——\n\n不用命令，用恳求。"],["h","为什么是「身体」？"],["p","现在请大家注意保罗说要献上什么。"],["p","他没有说：「把你的心献给神。」"],["p","他说的是："],["q","「将身体献上。」"],["w",3],["p","弟兄姊妹，为什么是身体？"],["p","我想是因为——"],["p","身体是具体的。"],["p","你们想想看，身体有什么？"],["p","身体有地址——我住在哪里，我每天去哪里。"],["p","身体有行事历——我的时间给了谁。"],["p","身体有钱包——我的钱流向哪里。"],["p","身体有一双眼睛——我看什么。"],["p","身体有一条舌头——我说什么。"],["p","身体有一双脚——我往哪里走。"],["w",3],["p","弟兄姊妹，「把心献给主」——可以是一种感动。"],["p","而「把身体献上」是——"],["q","明天早上，你人在哪里。"],["h","一个会爬下来的祭物"],["p","接下来保罗用了一个词。而这个词，在第一世纪是很惊人的。"],["p","他说：「当作活祭。」"],["w",3],["p","弟兄姊妹，你们想一想。"],["p","在所有的宗教里——犹太教、希腊罗马的异教——"],["p","祭物的定义是什么？"],["q","祭物是死的。\n\n牵到坛前，宰杀，然后献上。"],["p","而保罗说：把身体献上，当作——"],["p","活祭。"],["w",3],["p","一个活着的祭物。"],["p","弟兄姊妹，这样的祭物有一个问题。"],["p","你们猜是什么？"],["q","它——\n\n会爬下来。"],["w",3],["p","（笑）弟兄姊妹，这不是在开玩笑。"],["p","这正是为什么下一节的动词，是现在式——持续的。"],["p","因为献上是一次的动作，"],["p","而爬下来——是每天的事。"],["h","你改不了自己"],["p","第2节。弟兄姊妹，这一节，我认为是全卷罗马书对我们日常生活最重要的一节："],["q","「不要效法这个世界，只要心意更新而变化，叫你们察验何为神的善良、纯全、可喜悦的旨意。」"],["w",3],["p","我要先讲两个动词。"],["p","「效法」的原文是 συσχηματίζω。它的字根是 σχῆμα。"],["p","σχῆμα 的意思是「外形、样式」——是贴上去的、可以换的。"],["p","（英文的 scheme 就是从这个字来的。）"],["p","而「变化」的原文是 μεταμορφόω。它的字根是 μορφή。"],["p","μορφή 的意思是「本质的形态」——是从里面长出来的。"],["p","（英文的 metamorphosis——毛毛虫变蝴蝶——就是这个字。）"],["w",3],["p","弟兄姊妹，所以保罗在说什么？"],["q","这个世代要你改变外表去配合它。\n\n而神要你从里面本质性地改变。\n\n一个是贴上去的。\n\n一个是长出来的。"],["h","三个文法特征"],["p","但弟兄姊妹，这一节最重要的，还不是这两个字。"],["p","是这两个动词的文法。"],["p","它们有三个特征，每一个都重要。"],["w",3],["p","第一，它们是现在式。"],["p","意思是：这是持续的，不是一次完成的。"],["p","第二——这一点最重要——它们是被动语态。"],["p","弟兄姊妹，「要变化」的原文，不是「你要改变自己」。"],["p","是："],["q","「你要被变化。」"],["w",3],["p","而第三，它们是命令语气。"],["w",3],["p","弟兄姊妹，这三点合起来，是什么意思？"],["q","你改不了自己。\n\n但你有责任——\n\n把自己放在会被改变的位置上。"],["h","从哪里改起？"],["p","而中间那一句，说出了改变的机制："],["q","「借着心意更新而变化。」"],["p","「心意」的原文是 νοῦς——心思、思维方式。"],["w",3],["p","弟兄姊妹，我要请大家想一想。"],["p","我们想要改变的时候，通常从哪里开始？"],["p","从行为。"],["p","我要戒掉那个习惯。我要少发脾气。我要早起灵修。"],["p","然后呢？"],["p","立志。失败。羞愧。再立志。"],["w",3],["p","弟兄姊妹，那就是罗马书第七章。"],["p","「立志为善由得我，只是行出来由不得我。」"],["w",3],["p","而第十二章2节说：不是那样。"],["q","是心思被更新——\n\n然后生命就变化了。"],["p","弟兄姊妹，用一句话说就是："],["h","改变观念，就改变生命。"],["h","怎么知道神的旨意？"],["p","而这一节的最后一句，回答了一个很多人问的问题："],["q","「叫你们察验何为神的善良、纯全、可喜悦的旨意。」"],["p","「察验」这个字，希腊文是 δοκιμάζω。"],["p","它的字根是——验金属。"],["p","（我们在第五章看过：「忍耐生老练」，就是这个字根。）"],["w",3],["p","弟兄姊妹，很多人问：「我怎么知道神的旨意？」"],["p","而保罗的答案，不是「求一个记号」。"],["p","也不是「等一个声音」。"],["p","保罗的答案是："],["q","让你的心思被更新——\n\n然后你就认得出来。"],["p","就像一个受过训练的验金师，"],["p","他一看，就知道那是不是真金。"],["w",3],["h","第二大段｜身体里（12:3–8）"],["h","心意更新的第一个结果"],["p","弟兄姊妹，接下来我要问一个问题。"],["p","如果一个人的心思真的被更新了——"],["p","第一个看得出来的地方，是哪里？"],["w",3],["p","保罗的答案在第3节。而这个答案，可能跟你想的不一样。"],["p","不是「他开始服事了」。"],["p","不是「他开始奉献了」。"],["p","是——"],["q","他看自己的方式，变了。"],["p","第3节："],["q","「不要看自己过于所当看的，要照着神所分给各人信心的大小，看得合乎中道。」"],["h","一个中文译不出来的文字游戏"],["p","弟兄姊妹，这一节在原文里，是一个文字游戏。"],["p","保罗在一句话里，用了四个同一个字根的字。"],["p","那个字根是 φρον-，意思是「想、心思」。"],["p","我念一次，你们听听看："],["q","μὴ ὑπερφρονεῖν（不要「超过」地想）\n\nπαρ' ὃ δεῖ φρονεῖν（超过所当想的）\n\nἀλλὰ φρονεῖν（倒要想）\n\nεἰς τὸ σωφρονεῖν（以致「健全地」想）"],["w",3],["p","弟兄姊妹，四个字，一句话。"],["p","而这证明了一件事："],["q","第3节谈的，仍然是「心思」——\n\n它跟第2节「心意更新」，是同一条线。"],["h","合乎中道"],["p","而最后那个字 σωφρονέω，很值得讲。"],["p","它是由两个字组成的："],["p","σῶς——健全、安全。"],["p","φρήν——心思。"],["p","合起来就是：心思健全、清醒。"],["p","和合本翻译成「看得合乎中道」，翻得非常好。"],["w",3],["p","弟兄姊妹，我要在这里纠正一个很普遍的误解。"],["p","很多人以为谦卑就是「要看低自己」。"],["p","但保罗没有这样说。"],["p","他说的是「健全」——"],["q","不高估。\n\n也不低估。"],["w",3],["p","弟兄姊妹，一直说「我什么都不是」，其实也是一种以自己为中心。"],["p","因为那还是一直在讲我。"],["p","而「合乎中道」的意思是："],["q","我知道神给了我什么，也知道那是神给的。"],["h","我是你的手"],["p","接下来第5节，保罗讲到身体。而这里有一个细节，中文很容易读过去："],["q","「我们这许多人，在基督里成为一身，互相联络作肢体。」"],["p","原文是 ἀλλήλων μέλη——「彼此互为肢体」。"],["w",3],["p","弟兄姊妹，注意保罗没有说："],["p","「我们都是基督身体的肢体。」"],["p","他说的是："],["q","「我们彼此互为肢体。」"],["p","意思是什么？"],["q","我是你的手。\n\n你是我的眼睛。"],["p","不只是「我们都属于同一个身体」——"],["p","是「我们彼此需要」。"],["h","怜悯人的时候，脸要好看"],["p","然后第6到8节，保罗列了七样恩赐。"],["p","弟兄姊妹，我今天不逐项讲。但我要请大家注意最后三样。"],["p","因为保罗在那三样后面，加了态度。"],["w",3],["p","第8节："],["q","「施舍的，就当诚实；治理的，就当殷勤；怜悯人的，就当甘心。」"],["w",3],["p","「施舍的，就当诚实」——「诚实」的原文是 ἁπλότης，字面是「不折叠的、没有夹层的」。"],["p","弟兄姊妹，施舍最容易夹杂什么？"],["p","要被看见。要被感谢。要有回报。"],["p","而 ἁπλότης 的意思是：没有夹层。"],["w",3],["p","而最后一项，我觉得是全章最扎人的一句话。"],["q","「怜悯人的，就当甘心。」"],["p","「甘心」的原文是 ἱλαρότης。"],["p","这个字在整本新约，只出现这一次。"],["p","它的意思是：欢欢喜喜、开朗。"],["p","（英文的 hilarious 就是从这个字来的。）"],["p","而它的形容词形式，出现在哥林多后书9章7节那句很有名的话："],["q","「神喜爱捐得乐意的人。」"],["w",3],["p","弟兄姊妹，所以12:8的意思是："],["q","怜悯人的时候——\n\n脸要好看。"],["w",3],["p","弟兄姊妹，我想这一句话值得我们每个人停一下。"],["p","因为怜悯最容易变质的地方，"],["p","不是「做不做」。"],["p","是——"],["q","做的时候，那张脸。"],["p","一个带着不耐烦去帮助人的人——"],["p","那不是怜悯。那是施舍。"],["w",3],["h","第三大段｜街上（12:9–21）"],["h","爱，不要戴面具"],["p","弟兄姊妹，从第9节开始，保罗像机关枪一样，一口气说了十几件事。"],["p","而第一句话，是整段的标题："],["q","「爱人不可虚假。」"],["w",3],["p","「不可虚假」的原文是 ἀνυπόκριτος。"],["p","它是 ἀ（不）加上 ὑποκριτής。"],["p","而 ὑποκριτής 在古希腊文里，本来的意思是——"],["q","在剧场里戴着面具演戏的人。"],["p","（主耶稣骂法利赛人「假冒为善的人」，用的就是这个字。）"],["w",3],["p","弟兄姊妹，所以「爱人不可虚假」的字面是："],["h","「爱，不要戴面具。」"],["w",3],["p","而弟兄姊妹，我要说一句实话。"],["p","教会里最难说出口的一句话，是什么？"],["p","是——"],["q","「我不好。」"],["p","所以我们戴着面具彼此相爱。"],["p","问「你好吗」，答「感谢主，很好」。"],["h","像家人一样"],["p","第10节：「爱弟兄，要彼此亲热。」"],["p","「亲热」的原文是 φιλόστοργος。"],["p","而里面藏着一个字：στοργή。"],["w",3],["p","弟兄姊妹，希腊文有好几个字讲「爱」。"],["p","ἀγάπη——舍己的爱。"],["p","φιλία——朋友之爱。"],["p","而 στοργή 是什么？"],["q","στοργή 是——家人之间的、自然的亲情。"],["w",3],["p","所以保罗在说："],["q","对弟兄姊妹的爱，要像家人那样。\n\n不是同事。\n\n不是会友。\n\n是——家人。"],["h","同乐比同哭难"],["p","第15节，只有一句话，但我觉得它是全章最实际的一节："],["q","「与喜乐的人要同乐；与哀哭的人要同哭。」"],["p","弟兄姊妹，请注意保罗的顺序。"],["p","他先讲「同乐」，再讲「同哭」。"],["w",3],["p","而我想问大家一个问题："],["p","这两件事，哪一件比较难？"],["w",3],["p","弟兄姊妹，我做牧师这些年，我的观察是——"],["q","同哭比较容易。\n\n同乐比较难。"],["p","为什么？"],["q","因为同哭的时候——我在上面。\n\n而同乐的时候——他在上面。"],["w",3],["p","弟兄姊妹，你们知道那个感觉吗？"],["p","教会里有人升迁了。有人的孩子考上了。有人的事奉有果效了。"],["p","而你刚好在低谷。"],["p","你要恭喜他。你也真的说了。"],["p","但心里有一个很小的声音——"],["w",3],["p","保罗说：与喜乐的人要同乐。"],["p","而那需要一颗被更新的心思。"],["h","三个限定"],["p","第18节，弟兄姊妹，这一节对受过关系伤害的人，是极大的释放。"],["q","「若是能行，总要尽力与众人和睦。」"],["p","原文在这里，有三个限定："],["p","第一：若是能行——意思是，有时候不能行。"],["p","第二：原文有一句话中文比较看不出来——「在于你们的部分」。"],["p","第三：总要尽力。"],["w",3],["p","弟兄姊妹，保罗是一个非常实际的人。"],["p","他没有说：「你一定要跟每个人都和好。」"],["p","他说的是："],["q","和睦需要两个人。\n\n而神只要求你负责——\n\n你那一半。"],["w",3],["p","弟兄姊妹，如果你一直为一段修不好的关系自责——"],["p","这一节是给你的。"],["p","你那一半，尽力了吗？"],["p","如果尽力了——"],["p","另外那一半，不在你的责任范围内。"],["h","让出一个位置"],["p","第19节："],["q","「亲爱的弟兄，不要自己伸冤，宁可让步，听凭主怒；因为经上记着：『伸冤在我，我必报应。』」"],["p","「让步」这个字，原文的字面很有画面："],["q","δότε τόπον ——「给出一个位置」。"],["p","弟兄姊妹，那个画面是什么？"],["q","你站在那里，握着拳头，准备要动手。\n\n而神说：\n\n「让开。给我一个位置。」"],["w",3],["p","但弟兄姊妹，我必须在这里把一件事讲清楚。"],["p","因为这一节常常被误用。"],["p","保罗没有说："],["p","「那件事不重要。」"],["p","「你不该觉得受伤。」"],["p","「算了吧。」"],["w",3],["p","他说的是："],["q","「伸冤在我，我必报应。」"],["p","弟兄姊妹，这不是撤案。"],["p","这是——"],["q","移送到更高的法庭。"],["w",3],["p","而我要特别对一种人说话。"],["p","如果你现在正在一段持续伤害你的关系里——"],["p","家暴、虐待、犯罪——"],["p","弟兄姊妹，第19节绝对不是叫你留在里面。"],["p","因为下一章，罗马书13章4节说："],["q","掌权的「是神的用人，是伸冤的，刑罚那作恶的」。"],["q","寻求合法的保护——报警、法律的途径、离开危险的环境——\n\n那正是神所设立的途径之一。"],["p","如果你是那个人，请在聚会之后找我，或找一位你信任的同工。"],["h","没有中立这个选项"],["p","弟兄姊妹，最后一节。第21节。"],["q","「你不可为恶所胜，反要以善胜恶。」"],["w",3],["p","「胜」这个字，希腊文是 νικάω。"],["p","而它让我想起罗马书第八章那句话："],["q","8:37「靠着爱我们的主，在这一切的事上已经得胜有余了。」"],["p","同一个字根。"],["q","第八章说：你已经得胜有余了——那是地位。\n\n第十二章说：所以去得胜吧——那是实践。"],["w",3],["p","而这一节在原文里，有一个对比："],["p","前半句是被动：「不要被恶所胜。」"],["p","后半句是主动命令：「你要去胜。」"],["w",3],["p","弟兄姊妹，这意味着什么？"],["p","意味着在这件事上——"],["q","没有「中立」这个选项。\n\n要嘛恶胜过你。\n\n要嘛你用善胜过恶。"],["w",3],["p","而「你不可为恶所胜」是什么意思？"],["p","弟兄姊妹，我想是这样："],["q","当有人恶待你，而你用恶回应——\n\n表面上，你在报复他。\n\n实际上——\n\n恶，已经赢了。\n\n因为它成功地让你也变成了一个恶人。"],["w",3],["p","而「以善胜恶」的意思是："],["q","我不让那件恶事，改变我是谁。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天走了三个地方。"],["w",3],["p","第一，祭坛上。"],["p","保罗讲完十一章，说了两个字：「所以。」"],["p","然后他要的不是你的感动，是你的身体——"],["p","你的地址、你的行事历、你的钱包、你的眼睛、你的舌头、你的脚。"],["p","而动力不是罪疚，是慈悲——"],["p","那个从肺腑深处来的、母亲对孩子的慈悲。"],["w",3],["p","第二，身体里。"],["p","心意更新的第一个结果，是你看自己的方式变了。"],["p","不高估。也不低估。"],["p","而在服事上，保罗提醒我们一句："],["p","怜悯人的时候——脸要好看。"],["w",3],["p","第三，街上。"],["p","爱，不要戴面具。"],["p","跟弟兄姊妹的关系，要像家人。"],["p","与喜乐的人同乐——虽然那常常比同哭更难。"],["p","而面对恶的时候，记得：没有中立这个选项。"],["w",3],["p","弟兄姊妹，我最后要回到今天最重要的那一节。"],["p","罗马书12章2节。"],["p","而我要请大家记住那两个动词是被动式的。"],["q","「要被变化。」"],["w",3],["p","弟兄姊妹，这句话同时说了两件事。"],["p","第一件，是坏消息："],["q","你改不了自己。"],["p","你已经试过很多次了，对不对？"],["p","立志。失败。羞愧。再立志。"],["w",3],["p","但第二件，是好消息："],["q","你不必改变自己。\n\n你只要——\n\n把自己放在会被改变的位置上。"],["w",3],["p","而那个位置在哪里？"],["p","第1节说了："],["p","祭坛上。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，先为十一章的每一件慈悲感谢祢。因为那是我们今天愿意献上的唯一理由——不是我们欠祢，是祢先爱了我们。\n\n主啊，我们现在把身体交给祢。不只是我们的感动，是我们的地址、我们的行事历、我们的钱包、我们的眼睛、我们的舌头、我们的脚。\n\n我们也承认，我们是会爬下来的祭物。求祢每一天把我们放回去。\n\n主啊，我们试过很多次靠自己改变，都失败了。今天祢的话说：要「被」变化。求祢的灵更新我们的心思。因为我们知道——改变观念，就改变生命。\n\n求祢也对付我们的面具。让我们在弟兄姊妹面前，可以说一句「我不好」。\n\n最后，主啊，我们当中有人被恶待了很久。求祢让他们知道，祢说「伸冤在我」——那不是撤案，是祢要亲自处理。也求祢保护那些正在危险中的人，赐给他们勇气去寻求该有的帮助。\n\n求祢叫我们不被恶所胜，反要以善胜恶。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"13":{"min":35,"blocks":[["h","穿上"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天的讲题，只有两个字。"],["p","《穿上》。"],["w",3],["p","不过在讲到那件衣服之前，我要先讲两样东西。"],["p","一把刀。"],["p","和一笔债。"],["w",3],["p","我先问一个问题。"],["p","你心里有没有一件事，是你觉得「他欠我一个公道」？"],["p","可能是很多年前的事。"],["p","可能对方早就忘了。"],["p","而你——"],["p","没有忘。"],["w",3],["p","弟兄姊妹，上个礼拜我们读罗马书第十二章，读到一节经文："],["q","「不要自己伸冤……因为经上记着：『主说：伸冤在我，我必报应。』」（12:19）"],["p","而我猜，有些人听完心里会想："],["q","「可是——如果我不伸冤，那这件事就没有人管了啊。」"],["w",3],["p","弟兄姊妹，今天的第十三章，就是在回答这个问题。"],["w",3],["h","第一大段｜一把不是你的刀（13:1–7）"],["h","一个排队的字"],["p","罗马书13章1节："],["q","「在上有权柄的，人人当顺服他，因为没有权柄不是出于神的。凡掌权的都是神所命的。」"],["p","弟兄姊妹，这一节在原文里有一个字根，出现了好几次。中文看不太出来。"],["p","那个字根是 τάσσω。"],["p","它的意思是——排列、编排、指派位置。"],["p","它是一个军事用语：军队列阵的时候，每一个人站在指定的位置上。"],["w",3],["p","现在我们来看这几个字："],["p","「凡掌权的都是神所命的」——原文是 τεταγμέναι，意思是「被神排定了位置」。"],["p","「人人当顺服」——原文是 ὑποτάσσω，字面是「排到底下」。"],["p","而第2节说「抗拒掌权的」——原文是 ἀντιτάσσω，字面是「排到对面」。"],["w",3],["p","弟兄姊妹，所以这一段的画面是什么？"],["q","神在一张大棋盘上，把每一个权柄，排在它的位置上。\n\n而你要做的，是站在你的位置上——\n\n不是跳到对面去。"],["w",3],["p","弟兄姊妹，我们前几个礼拜学过一句话："],["q","骄傲是离开本位，抓住权力。\n\n谦卑是放下权力，回到本位。"],["p","而13章1到2节，几乎就是这句话的原文版。"],["h","那把刀"],["p","然后第4节，保罗讲到一样东西。"],["q","「因为他是神的用人，是与你有益的……\n\n因为他不是空空地佩剑；他是神的用人，是伸冤的，刑罚那作恶的。」"],["p","弟兄姊妹，「伸冤的」这个字，原文是 ἔκδικος。"],["p","而上个礼拜我们读的12章19节，「伸冤在我」——原文是 ἐκδίκησις。"],["p","同一个字根。"],["w",3],["p","弟兄姊妹，你听出来了吗？"],["p","12章19节说：不要自己伸冤。"],["p","而13章4节说：神已经指派了一位伸冤的。"],["q","所以12:19的意思不是「这件事没有人管」。\n\n12:19的意思是：不是由你来管。"],["w",3],["p","而「他不是空空地佩剑」——"],["p","弟兄姊妹，那把刀是真的。"],["p","它只是——"],["p","不在你手上。"],["p","也不该在你手上。"],["h","一个很高的评价"],["p","而保罗在这一段里，用了两个字来称呼罗马的官员。而这两个字，都是教会用语。"],["p","第4节：「他是神的用人」——原文是 διάκονος。"],["p","弟兄姊妹，那是「执事」的意思。"],["p","第6节：「因他们是神的差役」——原文是 λειτουργός。"],["p","这个字更重。它在旧约的希腊文译本里，是用来形容祭司在圣殿里的供职的。"],["p","（希伯来书8章2节用同一个字形容基督是「圣所的执事」。）"],["w",3],["p","弟兄姊妹，保罗在说什么？"],["p","他用「执事」和「祭司性的服事」这两个字，来称呼那些收税的、判案的罗马官员。"],["q","这是一个极高的评价。\n\n但同时，也是一个极重的责任——\n\n因为那意味着：他们是在替神办事。"],["h","一个必要的平衡"],["p","弟兄姊妹，讲到这里，我必须停下来说一件很重要的事。"],["p","因为这一段经文，在历史上被严重误用过。"],["p","它曾经被拿来为奴隶制度辩护。被拿来为种族隔离辩护。被拿来要求人对邪恶的政权绝对服从。"],["p","所以我要讲三件事。"],["w",3],["p","第一，保罗用的字是「顺服秩序」，不是「凡事照做」。"],["p","希腊文有两个不同的字。13章1节用的是前者。"],["w",3],["p","第二，同一本圣经说了另一句话。"],["p","使徒行传5章29节，彼得和使徒们站在公会面前说："],["q","「顺从神，不顺从人，是应当的。」"],["p","还有但以理的三个朋友，站在尼布甲尼撒面前说："],["q","「即或不然，我们决不事奉你的神。」（但3:18）"],["p","还有出埃及记第一章，那两个收生婆——"],["p","圣经说她们「不照埃及王的吩咐行」（出1:17）。"],["p","而下面几节说：神厚待她们。"],["w",3],["p","第三——弟兄姊妹，这一点最有意思——"],["p","写13章1节的这个人，自己做了什么？"],["p","在腓立比被打之后，他要求官长亲自来释放他（徒16:37）。"],["p","在快要被鞭打的时候，他提出自己的罗马公民权（徒22:25）。"],["p","最后，他上告于凯撒（徒25:11）。"],["w",3],["q","弟兄姊妹，所以「顺服」显然不等于：\n\n不能据理力争、不能使用法律途径、不能说真话。"],["p","而主耶稣自己——"],["p","祂站在彼拉多面前，说了两句话。"],["p","第一句：「若不是从上头赐给你的，你就毫无权柄办我。」（约19:11）——祂承认那权柄的来源。"],["p","第二句：「我为此而生，也为此来到世间，特为给真理作见证。」（约18:37）——祂说了真话。"],["p","而祂——"],["p","没有自己伸冤。"],["p","（彼前2:23「被骂不还口，受害不说威吓的话，只将自己交托那按公义审判人的主。」）"],["h","该给的，就给"],["p","而第7节说了一句很不浪漫、但很重要的话："],["q","「凡人所当得的，就给他。」"],["p","弟兄姊妹，这一节在原文里是四组对称："],["p","当得粮的，给他粮。\n当得税的，给他税。\n当得惧怕的，给他惧怕。\n当得恭敬的，给他恭敬。"],["w",3],["p","保罗的重点是：该给谁的，就给谁。"],["p","弟兄姊妹，我做牧师这些年，看过一件事："],["q","一个基督徒的见证，常常不是毁在大事上。\n\n是毁在——该给的没给。"],["p","该还的钱。该说的道歉。该回的讯息。该履行的承诺。"],["w",3],["h","第二大段｜一笔还不完的债（13:8–10）"],["h","一个字的转折"],["p","弟兄姊妹，第7节说「凡人所当得的」——原文是 ὀφειλάς，意思是「所欠的债」。"],["p","然后第8节，保罗用了同一个字："],["q","「凡事都不可亏欠（ὀφείλετε）人，\n\n惟有彼此相爱要常以为亏欠。」"],["w",3],["p","弟兄姊妹，保罗在两节之间，玩了同一个字：债。"],["p","他说："],["q","把所有的债——\n\n全部还清。\n\n只留一笔。"],["p","而那一笔是什么？"],["p","爱。"],["w",3],["p","而那一笔，有一个特点："],["q","你永远还不完。"],["p","因为爱不是一次性的付款。"],["p","你今天爱了，不代表明天不用爱。"],["p","这笔帐——"],["p","每天重新开立。"],["w",3],["p","弟兄姊妹，我想这对我们有一个很重要的意义："],["q","一个永远还不完的债，意味着——\n\n你永远没有可以邀功的一天。"],["h","一张帐单的总计"],["p","然后第9节，保罗列了一张清单："],["q","「像那不可奸淫，不可杀人，不可偷盗，不可贪婪，或有别的诫命，\n\n都包在爱人如己这一句话之内了。」"],["p","「包在……之内」这个字很有意思。原文是 ἀνακεφαλαιόω。"],["p","它的字根 κεφάλαιον，在商业上的意思是——"],["p","「总计」。"],["p","就像我们今天在帐单最下面看到的那一行：合计。"],["w",3],["p","弟兄姊妹，所以保罗的画面是："],["q","你把诫命一条一条列成清单。\n\n不可奸淫。不可杀人。不可偷盗。不可贪婪。\n\n然后在下面画一条线，写上——\n\n总计：爱人如己。"],["h","一个最低标准"],["p","而第10节，保罗给了「爱」一个定义。"],["p","弟兄姊妹，我第一次注意到这个定义的时候，有点意外。"],["p","因为它不是抒情的。"],["p","它是这样说的："],["q","「爱是不加害与人的。」"],["w",3],["p","弟兄姊妹，这不是爱的最高境界。"],["p","这是——最低标准。"],["p","而正因为它是最低标准，它特别扎人："],["q","你说你爱他——\n\n那你有没有伤害他？"],["p","用一句话。用一个眼神。用一次沉默。用一个在别人面前的玩笑。"],["w",3],["p","而「爱人如己」的那个「人」，原文是 πλησίον——意思是「邻近的人」。"],["p","不是抽象的「全人类」。"],["p","是——离你最近的那一个。"],["w",3],["h","第三大段｜一件要穿上的衣服（13:11–14）"],["h","现在几点了？"],["p","弟兄姊妹，第11节，保罗换了一个角度。他开始讲时间。"],["q","「再者，你们晓得现今就是该趁早睡醒的时候；\n\n因为我们得救，现今比初信的时候更近了。」"],["w",3],["p","而第12节说："],["q","「黑夜已深，白昼将近。」"],["p","弟兄姊妹，「将近」这个字在原文是完成式——"],["p","意思是：已经临近了，而且维持在临近的状态。"],["w",3],["p","而保罗的逻辑，其实非常简单："],["q","每过一天，那日子就近一天。"],["p","弟兄姊妹，这不是预测。"],["p","这是——算术。"],["w",3],["p","而保罗要的不是一个时间表。"],["p","（主耶稣自己说：「那日子、那时辰，没有人知道。」太24:36）"],["p","保罗要的是一件事："],["q","该醒了。"],["h","脱下来，穿上去"],["p","第12节下半："],["q","「我们就当脱去暗昧的行为，带上光明的兵器。」"],["p","弟兄姊妹，「兵器」这个字——ὅπλα——"],["p","我们在罗马书第六章学过。"],["p","6章13节：「将肢体作义的兵器献给神。」"],["w",3],["p","所以："],["q","第六章说：你的肢体，是兵器。\n\n第十三章说：那些兵器——穿上身。"],["h","那三对"],["p","而第13节，保罗列了六样要脱掉的东西。而它们是三对："],["p","荒宴、醉酒。"],["p","好色、邪荡。"],["p","争竞、嫉妒。"],["w",3],["p","弟兄姊妹，我要请大家注意最后那一对。"],["p","前面两对，在教会里人人喊打。"],["p","而「争竞、嫉妒」——"],["p","我们常常把它当成「个性问题」，或者「他就是比较有想法」。"],["p","而保罗——"],["p","把它放在跟醉酒、淫乱同一行。"],["h","穿上一个人"],["p","然后，第14节。弟兄姊妹，这是全章的高峰："],["q","「总要披戴主耶稣基督，\n\n不要为肉体安排，去放纵私欲。」"],["w",3],["p","「披戴」这个字，原文是 ἐνδύω。"],["p","它的意思很简单：穿上衣服。"],["w",3],["p","弟兄姊妹，请注意这里有一个升级。"],["p","第12节说：穿上「光明的兵器」——那是一样东西。"],["p","第14节说：穿上「主耶稣基督」——那是一个位格。"],["w",3],["p","而在古代，「穿上某人的衣服」是有意义的。"],["p","罗马男孩到了成年的那一天，会脱下童袍，穿上成人的长袍——"],["p","那件衣服代表：他现在是一个成年公民了。"],["w",3],["p","弟兄姊妹，我觉得这一节最大的安慰在这里："],["p","保罗没有说：「你要变成主耶稣基督的样子。」"],["p","他说的是："],["q","穿上祂。"],["p","你不必做成一个新的自己。"],["p","你只要——穿上一个已经完成的人。"],["w",3],["p","（而加拉太书3章27节说：「凡受洗归入基督的，都是披戴基督了。」——那是已经发生的事。"],["p","所以罗13:14的命令是：那件衣服你已经有了；每天早上，把它穿上。）"],["h","不要为它铺路"],["p","而14节的后半句，弟兄姊妹，我认为是全本圣经对付罪最实际的一句话。"],["q","「不要为肉体安排，去放纵私欲。」"],["p","「安排」这个字，原文是 πρόνοια。"],["p","它由两个部分组成：πρό（预先）＋ νοέω（想）。"],["p","意思是：事先的计划、预备、铺路。"],["w",3],["p","弟兄姊妹，你们注意到保罗说什么了吗？"],["p","他没有说「不要放纵私欲」。"],["p","他说："],["q","不要为那件事作预备。"],["w",3],["p","弟兄姊妹，我想这句话说中了很多人。"],["p","我们对付反复的罪，方法几乎都一样："],["q","在试探来的那一刻，努力抵挡。"],["p","然后呢？"],["p","失败。自责。再立志。"],["p","然后下一次，再来一遍。"],["w",3],["p","而保罗说：问题不在那一刻。"],["p","问题在——"],["p","那一刻之前。"],["w",3],["p","因为当一个人开始「为肉体安排」的时候——"],["p","他其实已经决定了。"],["p","他只是还没承认。"],["w",3],["p","弟兄姊妹，所以真正的问题不是："],["p","「我怎么在那个时候忍住？」"],["p","真正的问题是："],["p","「我为什么会走到那里？」"],["w",3],["p","而答案常常很具体："],["p","不是「看到的时候要忍住」——是「不要在那个时间，把手机带进那个房间」。"],["p","不是「聚会的时候不要说那些话」——是「不要跟那个人单独吃那顿饭」。"],["p","不是「不要买」——是「不要打开那个 app」。"],["h","一个花园里的孩子"],["p","弟兄姊妹，最后我要讲一个故事。而这个故事，是有第一手记载的。"],["p","主后四世纪，北非有一个年轻人，非常聪明，也非常放纵。"],["p","他的名字叫奥古斯丁。"],["p","他母亲为他祷告了很多年。"],["p","而他自己也挣扎了很多年——他知道什么是对的，但他做不到。"],["p","（他甚至写下一句很有名的祷告：「主啊，求祢赐给我贞洁——但不是现在。」）"],["w",3],["p","有一天，他在米兰的一个花园里，痛哭。"],["p","他在《忏悔录》第八卷里自己记下了接下来发生的事。"],["p","他说：他听见邻家传来一个孩子的声音，反复地唱着一句话："],["q","「拿起来读，拿起来读。」"],["w",3],["p","他起身，回到座位，拿起放在那里的保罗书信。"],["p","随手翻开。"],["p","而他读到的第一段，是："],["q","「不可荒宴醉酒，不可好色邪荡，不可争竞嫉妒。\n\n总要披戴主耶稣基督，不要为肉体安排，去放纵私欲。」"],["w",3],["p","罗马书13章13到14节。"],["p","他写道：读完之后，「一道确定的光，仿佛注入我心，一切疑虑的阴霾都消散了」。"],["w",3],["p","弟兄姊妹，那个挣扎了很多年的人——"],["p","最后改变他的，不是一套论证。"],["p","是一句话："],["p","穿上祂。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。而它们的范围，是一层一层往内收的。"],["w",3],["p","第一，一把不是你的刀。"],["p","你不必自己当法官。"],["p","神已经指派了一位伸冤的。"],["p","（而顺服，不等于盲从——同一本圣经说：「顺从神，不顺从人，是应当的。」）"],["w",3],["p","第二，一笔还不完的债。"],["p","把该给的都给了。"],["p","只留一笔——"],["p","而那一笔，你永远还不完。"],["p","所以你永远没有可以邀功的一天。"],["w",3],["p","第三，一件要穿上的衣服。"],["p","你不必做成一个新的自己。"],["p","你只要——"],["p","穿上一个人。"],["w",3],["p","而且不要再为那件事铺路了。"],["w",3],["p","弟兄姊妹，我最后要说一句话。"],["p","明天早上，你会做一件事——"],["p","你会穿衣服。"],["p","你不会想太多。你就是穿上。"],["w",3],["p","而保罗说："],["p","在你穿那件衣服之前——"],["h","先穿上祂。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，先把手上那把不该拿的刀放下。主啊，我们心里有一些「他欠我一个公道」的事。今天我们知道了：那不是没有人管，只是不该由我们来管。\n\n主啊，也求祢提醒我们那些该给而还没给的——该还的钱，该说的道歉，该履行的承诺，该回的那一句话。求祢给我们勇气，这礼拜还掉一项。\n\n主啊，我们承认：我们对付那个反复的罪，一直用同一个方法——在最后一刻硬撑。而我们一直输。\n\n今天祢的话说：不要为它铺路。\n\n求祢给我们智慧，看见那条路是什么；也给我们决心，把它断掉。\n\n最后，主啊——\n\n我们不必做成一个新的自己。\n\n求祢让我们明天早上起来的时候，在穿任何一件衣服之前，先穿上祢。\n\n也叫我们不被恶所胜，反要以善胜恶。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"14":{"min":35,"blocks":[["h","接纳"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","我先问一个问题。"],["p","在你认识的基督徒里面，有没有一个人——"],["p","你心里对他有一句话："],["q","「跟他讲不通。」"],["w",3],["p","可能是教会里的一位同工。"],["p","可能是你的家人。"],["p","可能是网络上那个常常发文的弟兄。"],["p","你们信同一位主。你们读同一本圣经。"],["p","但你们在某一件事上，就是不一样。"],["w",3],["p","而弟兄姊妹，我要说一句实话："],["p","「跟他讲不通」这句话的意思，其实是——"],["p","我已经把他归零了。"],["w",3],["p","今天我们要读罗马书第十四章。"],["p","而我要先说一件事："],["p","保罗讲完「爱仇敌」（12章），讲完「顺服政府」（13章），"],["p","最后才讲这一章。"],["p","你们猜为什么？"],["w",3],["p","因为有时候——"],["q","爱仇敌，比爱那个坐在你旁边、却跟你想法不一样的弟兄，\n\n还容易一点。"],["w",3],["p","我们今天要看三样东西："],["p","第一，一个不是你的仆人。\n第二，一块石头。\n第三，一间正在盖的房子。"],["w",3],["h","第一大段｜一个不是你的仆人（14:1–12）"],["h","当时到底在吵什么"],["p","罗马书14章1到2节："],["q","「信心软弱的，你们要接纳，但不要辩论所疑惑的事。\n\n有人信百物都可吃；但那软弱的，只吃蔬菜。」"],["p","弟兄姊妹，当时罗马教会在吵什么？"],["p","两件事："],["p","第一，吃什么。"],["p","第二，第5节说的：守哪一天。"],["w",3],["p","为什么会吵这个？"],["p","弟兄姊妹，我们这几个礼拜一直在追踪罗马教会的背景："],["p","主后49年，皇帝革老丢把犹太人赶出罗马城。"],["p","所以有好几年，罗马教会几乎全部是外邦人。"],["p","那些犹太人的规矩——不吃某些肉、守安息日——就慢慢淡掉了。"],["p","然后主后54年，革老丢死了。犹太信徒陆续回来。"],["w",3],["p","弟兄姊妹，你想想那个场面。"],["p","他们回到自己的教会——"],["p","发现一切都变了。"],["p","而那些外邦弟兄看着他们，心里想："],["p","「怎么还在守这些？」"],["h","两种相反的罪"],["p","而第3节，保罗同时对两边说话。而他用了两个不同的字："],["q","「吃的人不可轻看不吃的人；\n\n不吃的人不可论断吃的人。」"],["w",3],["p","「轻看」这个字，希腊文是 ἐξουθενέω。"],["p","它的字根是 οὐθέν——意思是「零」「没有」。"],["p","所以「轻看」的字面意思是："],["q","把某个人，当作零。"],["w",3],["p","而「论断」是 κρίνω——那是法庭的字：定罪、判决。"],["w",3],["p","弟兄姊妹，保罗的观察太准了："],["q","强的人不会说你有罪。\n\n他只是觉得你「还不懂」——\n\n他把你归零。"],["q","而弱的人不会看不起你。\n\n他会觉得你「堕落了」——\n\n他定你的罪。"],["p","两种方向相反。"],["p","而保罗说：两种都不可以。"],["h","因为神已经收了"],["p","而第3节最后给了理由："],["q","「因为神已经收纳他了。」"],["p","弟兄姊妹，「收纳」这个字，跟第1节「接纳」是同一个字——προσλαμβάνω。"],["p","它的意思不是「容忍他存在」。"],["p","它的字面是：把某人接到自己这里来。"],["w",3],["p","（保罗在腓利门书用同一个字，为那个逃跑的奴仆阿尼西母说情："],["p","「你就收纳他，如同收纳我一样。」）"],["w",3],["p","所以第3节的逻辑是："],["q","神已经把他接进来了。\n\n那你凭什么把他推出去？"],["h","那不是你的仆人"],["p","然后第4节。弟兄姊妹，我觉得这是全章最有力的一句话："],["q","「你是谁，竟论断别人的仆人呢？」"],["w",3],["p","「你是谁」——这个句型我们在第九章见过。"],["p","罗马书9章20节：「你这个人哪，你是谁，竟敢向神强嘴呢？」"],["p","同一个句型。"],["q","第九章问：你凭什么审问神？\n\n第十四章问：你凭什么审问神的仆人？"],["w",3],["p","而「别人的仆人」这个词，在原文里很具体。"],["p","「仆人」是 οἰκέτης——家里的仆人，属于某一家的。"],["p","「别人的」是 ἀλλότριος——属于别人的。"],["w",3],["p","弟兄姊妹，我想像一个画面。"],["p","你走进邻居家。"],["p","你看见他家的佣人在做事，做得不合你的意。"],["p","你会不会走过去说：「你这样做不对」？"],["p","不会。"],["p","为什么？"],["q","因为——那不是你的仆人。\n\n他做得好不好，是向他的主人交代，不是向你。"],["h","而扶他的不是你"],["p","而第4节还有下半句。弟兄姊妹，这半句是全章最温暖的："],["q","「他或站住或跌倒，自有他的主人在；\n\n而且他也必要站住，因为主能使他站住。」"],["w",3],["p","「必要站住」——这个动词在原文是被动式。"],["p","意思是：他必被扶立。"],["p","被谁扶？"],["p","下半句说了：主。"],["w",3],["p","弟兄姊妹，我想这句话对很多人是释放。"],["p","因为我们心里常常有一个声音："],["q","「如果我不盯着他，他就会倒。」\n\n「这个教会如果我不管，就完了。」"],["p","而保罗说："],["q","扶他的——\n\n不是你。"],["p","所以你可以放手。"],["h","他们都在谢饭"],["p","而第6节，弟兄姊妹，我要请大家注意一个细节。"],["q","「守日的人是为主守的。\n\n吃的人是为主吃的，因他感谢神；\n\n不吃的人是为主不吃的，也感谢神。」"],["w",3],["p","弟兄姊妹，你看见了吗？"],["p","两个人做的事，完全相反。"],["p","一个吃。一个不吃。"],["p","但他们在做同一个动作——"],["q","他们都在谢饭。"],["w",3],["p","而且保罗说：两个人都是「为主」。"],["p","弟兄姊妹，这一节让我安静了很久。"],["p","因为它提醒我："],["q","那个跟我做法完全相反的弟兄——\n\n他也在低头谢饭。"],["h","我们都要站在同一个地方"],["p","而第10到12节，保罗讲到一个地方："],["q","「你这个人，为什么论断弟兄呢？又为什么轻看弟兄呢？\n\n因我们都要站在神的台前。」"],["w",3],["p","「台」这个字，原文是 βῆμα。"],["p","弟兄姊妹，那是一个很具体的东西："],["p","一个高起的平台，官长坐在上面审案子。"],["p","（马太福音27章19节，彼拉多「坐堂」的时候——就是这个字。）"],["w",3],["p","而弟兄姊妹，有一件事我觉得很有意思。"],["p","保罗写罗马书的时候，人在哥林多。"],["p","而使徒行传18章记载：保罗在哥林多，曾经被人拉到方伯迦流的「公堂」前受审——"],["p","用的就是这个字：βῆμα。"],["p","（那座审判台的遗址，到今天还在哥林多。）"],["q","所以保罗写「我们都要站在神的台前」的时候，\n\n他心里可能有一个很具体的画面。"],["w",3],["p","而第12节说了一句话，堵死了论断最后的借口："],["q","「我们各人必要将自己的事在神面前说明。」"],["p","弟兄姊妹，那一天——"],["p","你不会被问：「你那个弟兄做得怎么样？」"],["p","你会被问："],["p","你自己。"],["w",3],["h","第二大段｜一块石头（14:13–18）"],["h","你可以判，但要判对东西"],["p","第13节："],["q","「所以，我们不可再彼此论断，\n\n宁可定意谁也不给弟兄放下绊脚跌人之物。」"],["p","弟兄姊妹，「论断」和「定意」，在原文里是同一个动词——κρίνω。"],["p","保罗在说："],["q","你要「判」，可以。\n\n但不要判那个人。\n\n判这件事：我不要成为他的绊脚石。"],["h","保罗站在哪一边？"],["p","然后第14节。弟兄姊妹，这一节很重要，因为它告诉我们保罗站在哪一边："],["q","「我凭着主耶稣确知深信，凡物本来没有不洁净的。」"],["w",3],["p","弟兄姊妹，你听清楚了吗？"],["p","保罗在神学上——"],["p","站在「强的人」那一边。"],["p","他说：那些东西本来就没问题。"],["p","（他在15章1节说得更明白：「我们坚固的人……」——他把自己算在里面。）"],["w",3],["p","而然后呢？"],["p","他花了整整一章，教强的人怎么让步。"],["q","弟兄姊妹，这一点让这一章的分量完全不同。\n\n这不是一个中立的人在劝架。\n\n是其中一方的人在说：我这一边的人，要让。"],["h","最重的那个理由"],["p","而第15节，保罗给了理由。弟兄姊妹，我认为这是全章最重的一句话："],["q","「你若因食物叫弟兄忧愁，就不是按着爱人的道理行。\n\n基督已经替他死，你不可因你的食物叫他败坏。」"],["w",3],["p","弟兄姊妹，我要请大家把这句话听进去："],["q","基督已经替他死。"],["w",3],["p","那个让你觉得「跟他讲不通」的人——"],["p","那个你已经归零的人——"],["p","那个你觉得「他就是那种人」的人——"],["q","神的儿子，为他死过。"],["p","他身上——"],["p","有基督的血。"],["h","你争的那件事，在清单上吗？"],["p","而第17节，保罗讲了一句话，我觉得应该挂在每一间教会的办公室里："],["q","「因为神的国不在乎吃喝，\n\n只在乎公义、和平，并圣灵中的喜乐。」"],["w",3],["p","弟兄姊妹，我要请大家注意这三样。"],["p","公义。和平。圣灵中的喜乐。"],["p","这三个词，正好是罗马书前面的关键字："],["p","「公义」——第一章17节、第三章。因信称义。"],["p","「和平」——第五章1节。「我们既因信称义，就……得与神相和」。"],["p","「喜乐」——第八章、第十五章。"],["w",3],["p","而保罗说：神的国，在乎的是这三样。"],["p","弟兄姊妹，所以我想问一个很实际的问题："],["q","你最近坚持的那件事——\n\n在不在这份清单上？"],["w",3],["p","而更扎人的是："],["q","如果它不在清单上，\n\n而你为它争吵——\n\n你正在破坏的，是清单上的那一项：\n\n和平。"],["w",3],["p","弟兄姊妹，我要在这里停下来说一件很重要的事。"],["p","因为这一章非常容易被误用。"],["p","有人会说：「所以什么都不要坚持，什么都可以。」"],["p","不是的。"],["w",3],["p","保罗自己在别的地方，是寸步不让的。"],["p","加拉太书2章，彼得因为怕人，就在饭桌上退缩。"],["p","保罗怎么做？"],["p","他当面抵挡他（加2:11）。"],["p","加拉太书1章8节，他说：如果有人传别的福音——"],["p","「就应当被咒诅。」"],["p","还有哥林多前书第5章，教会里有明显的、不悔改的罪——"],["p","保罗说：「把那恶人从你们中间赶出去。」"],["w",3],["q","弟兄姊妹，所以保罗有三种处理方式：\n\n福音的核心真理——绝不让步。\n\n明显而不悔改的罪——必须处理。\n\n而可争议的事——接纳、不论断、为弟兄放下。"],["p","而第十四章讲的，是第三种。"],["p","（至于哪些属于第三种——那需要智慧，也需要谦卑。而保罗的态度是：宁可在界线的判断上谦卑，也不要轻易把弟兄推出去。）"],["w",3],["h","第三大段｜一间正在盖的房子（14:19–23；15:1–7）"],["h","两个建筑的字"],["p","弟兄姊妹，第19和20节，保罗用了两个相反的建筑用语。"],["p","第19节："],["q","「我们务要追求和睦的事与彼此建立德行的事。」"],["p","「建立」——希腊文是 οἰκοδομή。"],["p","它的字根是 οἶκος（房子）。"],["p","意思就是：盖房子。"],["w",3],["p","然后第20节："],["q","「不可因食物毁坏神的工程。」"],["p","「毁坏」——希腊文是 καταλύω。"],["p","意思是：拆房子。"],["w",3],["p","而弟兄姊妹，καταλύω 这个字，在福音书里用在哪里？"],["p","马太福音26章61节，他们控告耶稣说："],["q","「这个人曾说：『我能拆毁神的殿。』」"],["p","马可福音13章2节，主耶稣说圣殿："],["q","「将来在这里没有一块石头留在石头上，不被拆毁了。」"],["w",3],["p","弟兄姊妹，保罗用了一个拆圣殿的字。"],["p","而他说："],["q","不可因食物——\n\n拆毁神的工程。"],["w",3],["p","所以这里的画面是："],["q","神在盖一栋房子。\n\n一砖一瓦，很慢。\n\n而你——\n\n为了一口食物，\n\n拿着铁锤。"],["p","弟兄姊妹，这是一个极不成比例的交易。"],["h","「如同」"],["p","而现在，我要跳到下一章的第7节。"],["p","因为第十四章讲了一大堆「不可以」——"],["p","不可论断、不可轻看、不可放绊脚石、不可拆毁。"],["p","而那个「可以做的」，在15章7节。"],["p","弟兄姊妹，这是这一整段的高峰："],["q","「所以，你们要彼此接纳，\n\n如同基督接纳你们一样，\n\n使荣耀归与神。」"],["w",3],["p","「接纳」——还是那个字：προσλαμβάνω。"],["p","把人接到自己这里来。"],["w",3],["p","但弟兄姊妹，我要请大家听中间那三个字："],["h","「如同」。"],["w",3],["p","「如同基督接纳你们一样。」"],["w",3],["p","我想问一个问题。"],["p","基督接纳你的那一天——"],["p","你是全对的吗？"],["p","你的神学都正确吗？"],["p","你的良心都清洁吗？"],["p","你在每一件事上的看法，都成熟吗？"],["w",3],["p","弟兄姊妹，我知道我不是。"],["p","而祂接纳我，不是因为我合格。"],["p","是因为——"],["p","祂为我死了。"],["w",3],["p","所以15章7节的逻辑是："],["q","你要用祂接纳你的方式，去接纳他。"],["h","而祂自己也放下过"],["p","而15章3节，保罗给了一句话，是全段的根基："],["q","「因为基督也不求自己的喜悦。」"],["w",3],["p","弟兄姊妹，祂有没有权利？"],["p","祂有一切的权利。"],["p","腓立比书2章6节说：祂「本有神的形像，不以自己与神同等为强夺的」。"],["p","而祂做了什么？"],["p","「反倒虚己，取了奴仆的形像。」"],["w",3],["p","所以15章1节说："],["q","「我们坚固的人应该担代不坚固人的软弱，不求自己的喜悦。」"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。而它们是三个理由，一层比一层重。"],["w",3],["p","第一，他不是你的仆人。"],["p","你论断他的时候，你坐上了一个不属于你的位置。"],["p","而且——"],["p","扶他的不是你。是主。"],["p","所以你可以放手。"],["w",3],["p","第二，他身上有基督的血。"],["p","「基督已经替他死。」"],["p","弟兄姊妹，当你为了一件小事，准备坚持到底的时候——"],["p","请想一想那句话。"],["w",3],["p","第三，你在拆祂的房子。"],["p","神在盖。你在拆。"],["p","而拆的理由是——"],["p","一口食物。"],["w",3],["p","弟兄姊妹，我最后要说一件事。"],["p","今天我没有点名任何一件具体的争议。"],["p","因为每一间教会、每一个家庭的争议都不一样。"],["p","但我想，你心里刚才已经浮现了一个名字。"],["w",3],["p","如果有——"],["p","我要请你这个礼拜做一件事。"],["p","不是去说服他。"],["p","不是去纠正他。"],["w",3],["p","是去——"],["p","接纳他。"],["p","（也许就是一起吃一顿饭，而且不谈那件事。）"],["w",3],["p","而当你觉得做不到的时候，请记得那三个字："],["h","「如同」。"],["p","「你们要彼此接纳，如同基督接纳你们一样。」"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，心里都浮现了一个名字。\n\n主啊，我们承认：我们把他归零了。我们在心里说过「跟他讲不通」。而我们一直以为那是因为我们比较成熟。\n\n今天祢的话说：他不是我们的仆人。他是祢的。而扶他的，也不是我们，是祢。\n\n主啊，求祢赦免我们坐上了不属于我们的位置。\n\n也求祢提醒我们一件事：那个人身上，有祢的血。祢为他死过。\n\n主啊，我们也承认：我们常常为了一件不在清单上的事，破坏了清单上的那一项——和平。求祢怜悯。\n\n最后，主啊，求祢让我们记得那三个字：如同。\n\n因为祢接纳我们的那一天，我们也不是全对的。\n\n求祢给我们勇气，这礼拜去接纳那一个人。\n\n使荣耀归与祢。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"15":{"min":35,"blocks":[["h","扛"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天的讲题，只有一个字。"],["p","《扛》。"],["w",3],["p","我先问一个问题。"],["p","你有没有背过人？"],["p","可能是小时候背弟弟妹妹。"],["p","可能是抱着生病的孩子走一段路。"],["p","可能是扶着年迈的父母上楼梯。"],["w",3],["p","弟兄姊妹，背人跟拿东西不一样。"],["p","东西重了，你可以放下。"],["p","人重了——"],["p","你不能放。"],["w",3],["p","而今天我们要读的罗马书第十五章，第一节就用了一个字："],["q","「我们坚固的人应该担代不坚固人的软弱。」"],["p","「担代」——原文是 βαστάζω。"],["p","它的意思是："],["p","扛。"],["w",3],["p","我们今天要看三样东西："],["p","第一，一个扛着的人。\n第二，一个接纳的主。\n第三，一个捧着人的祭司。"],["w",3],["h","第一大段｜一个扛着的人（15:1–6）"],["h","这个字，我们见过"],["p","弟兄姊妹，「担代」这个字，我们在罗马书见过。"],["p","在第十一章。"],["p","还记得那棵橄榄树吗？"],["p","保罗对外邦信徒说："],["q","「你就不可向旧枝子夸口；若是夸口，当知道\n\n不是你托着根，乃是根托着你。」（11:18）"],["w",3],["p","「托着」——"],["p","就是这个字。βαστάζω。"],["w",3],["p","弟兄姊妹，你看见那个顺序了吗？"],["p","第十一章说："],["q","你不是扛的那一个。\n\n你是被扛的。"],["p","而第十五章说："],["q","所以现在——\n\n换你去扛。"],["h","这不是恩惠，是还债"],["p","而15章1节还有一个字，中文翻成「应该」。"],["p","原文是 ὀφείλω——"],["p","意思是：欠着。"],["w",3],["p","弟兄姊妹，这个字我们在13章8节见过："],["q","「凡事都不可亏欠人，惟有彼此相爱要常以为亏欠。」"],["p","同一个字。"],["w",3],["p","所以15章1节的意思是："],["q","强的人扛弱的人——\n\n不是一种美德。\n\n是一笔债。"],["h","一个必要的提醒"],["p","弟兄姊妹，讲到这里我要停一下。"],["p","因为「坚固」「不坚固」这两个词，非常容易被误用。"],["p","很容易变成："],["q","「你就是那个软弱的」「我是坚固的，所以你要听我的」。"],["w",3],["p","我要说三件事。"],["w",3],["p","第一，这一节的责任，是放在强的人身上的。"],["p","主词是「我们坚固的人」，动词是「应该担代」。"],["p","这不是特权，是责任。"],["w",3],["p","第二，「不坚固」原文是 ἀδύνατος——「没有能力的」。"],["p","而这个字，我们在第八章见过。"],["p","罗马书8章3节：「律法既因肉体软弱，有所不能行的……」"],["p","同一个字根。"],["w",3],["p","第三——弟兄姊妹，这一点最重要——"],["p","还记得第七章那个人吗？"],["q","「立志为善由得我，只是行出来由不得我。」（7:18）\n\n「我真是苦啊！」（7:24）"],["p","那个「不能」的人是谁？"],["p","是保罗自己。"],["w",3],["q","弟兄姊妹，所以没有一个人有资格用「软弱」去压人。\n\n因为我们每一个人，都曾经是那个「不能」的。"],["h","力气要用在哪里？"],["p","而15章1节下半说："],["q","「不求自己的喜悦。」"],["p","弟兄姊妹，我想这是全本圣经对「有己」最简单的定义："],["p","求自己的喜悦。"],["w",3],["p","但请注意，保罗没有说：「你们坚固的人要变软弱一点。」"],["p","他说："],["q","你是坚固的——\n\n所以你去扛。"],["w",3],["p","弟兄姊妹，谦卑不是放弃力量。"],["p","谦卑是——"],["q","改变力量的方向。"],["p","从「用我的力气求自己的喜悦」，"],["p","变成「用我的力气去扛别人」。"],["h","那我到底可不可以讨人喜欢？"],["p","而第2节说："],["q","「我们各人务要叫邻舍喜悦。」"],["p","弟兄姊妹，这里有一个问题。"],["p","因为加拉太书1章10节，保罗说："],["q","「我岂是讨人的喜欢吗？若仍旧讨人的喜欢，我就不是基督的仆人了。」"],["p","两节用的是同一个动词。"],["p","那到底可不可以？"],["w",3],["p","答案在第2节的两个限定里："],["q","「使他得益处，建立德行。」"],["w",3],["p","弟兄姊妹，差别在动机："],["q","加1:10的「讨人喜欢」——是为了我自己。\n\n怕被讨厌。想被接纳。想保住地位。"],["q","而罗15:2的「叫邻舍喜悦」——是为了他。\n\n为了他得益处。为了建立他。"],["w",3],["p","同一个动作。两种动机。"],["p","而检验的方法很简单："],["q","这件事，如果没有人知道是我做的——\n\n我还会做吗？"],["h","唯一的理由"],["p","而第3节，保罗给了理由。"],["p","弟兄姊妹，整章讲了那么多——"],["p","而理由只有一句话："],["q","「因为基督也不求自己的喜悦。」"],["w",3],["p","保罗没有说：「因为这样教会才会和谐。」"],["p","他没有说：「因为你比较成熟。」"],["p","他说："],["p","因为祂没有。"],["w",3],["p","而第3节后半，他引了一句旧约。诗篇69篇9节："],["q","「辱骂你人的辱骂，都落在我身上。」"],["w",3],["p","弟兄姊妹，我要请大家听清楚这句话的方向。"],["p","那些人骂的对象是谁？"],["p","经文说：「辱骂你人的」——"],["p","他们骂的是——"],["p","神。"],["w",3],["p","而那些骂，最后掉在谁身上？"],["q","「都落在我身上。」"],["w",3],["p","弟兄姊妹，祂承受的——"],["p","是本来要骂神的话。"],["w",3],["p","而我——"],["p","连一句不顺耳的话，都受不了。"],["h","合一是求来的"],["p","而第5节，弟兄姊妹，这一节有一个文法细节，我觉得很重要。"],["q","「但愿赐忍耐安慰的神叫你们彼此同心。」"],["p","「叫」这个字，在原文是祈愿语气——"],["p","意思是：「愿祂赐给」。"],["w",3],["p","弟兄姊妹，你们注意到了吗？"],["p","保罗讲了一整章的「不可论断、不可轻看」（第十四章）。"],["p","然后在这里——"],["p","他祷告。"],["w",3],["q","合一不是一个技巧。\n\n合一是一个恩赐。"],["w",3],["p","弟兄姊妹，我做牧师这些年，看过很多教会处理不合一。"],["p","我们开会。我们沟通。我们调整制度。我们安排座谈。"],["p","这些都是好的。"],["p","但保罗在这里做的第一件事是——"],["p","跪下来求。"],["h","而目的是什么？"],["p","而第6节说出了目的："],["q","「一心一口荣耀神——我们主耶稣基督的父！」"],["w",3],["p","「一心一口」——原文是两个词。"],["p","「一心」是 ὁμοθυμαδόν——「同一股心志」。"],["p","（使徒行传里「同心合意」用的就是这个字。）"],["p","「一口」是 ἐν ἑνὶ στόματι——字面是「用一张嘴」。"],["w",3],["p","弟兄姊妹，那是一个敬拜的画面："],["q","一群人——犹太人和外邦人，强的和弱的——\n\n发出同一个声音。"],["w",3],["p","所以请注意："],["q","合一的目的不是合一本身。\n\n是——敬拜。"],["w",3],["h","第二大段｜一个接纳的主（15:7–13）"],["h","那个「如同」"],["p","弟兄姊妹，第7节是第十四章到第十五章这一整段的高潮："],["q","「所以，你们要彼此接纳，\n\n如同基督接纳你们一样，\n\n使荣耀归与神。」"],["w",3],["p","「接纳」这个字，我们在第十四章见过两次。"],["p","14章1节：「信心软弱的，你们要接纳。」"],["p","14章3节：「因为神已经收纳他了。」"],["p","而现在，第15章7节——"],["p","同一个字，出现了两次。"],["w",3],["p","但弟兄姊妹，最重的不是那个动词。"],["p","是中间那两个字："],["h","「如同」。"],["w",3],["p","「如同基督接纳你们一样。」"],["w",3],["p","我想问一个问题。"],["p","基督接纳你的那一天——"],["p","你是全对的吗？"],["p","你的神学都正确吗？"],["p","你的良心都清洁吗？"],["p","你在每一件事上的看法，都成熟吗？"],["w",3],["p","弟兄姊妹，我知道我不是。"],["w",3],["p","而如果不是——"],["q","那你就知道，「如同」的标准有多宽了。"],["h","两群人，两个理由"],["p","而第8、9节，保罗做了一件很精细的事。"],["p","他为两群人，给了两个不同的理由："],["q","第8节：「基督是为神真理作了受割礼人的执事，要证实所应许列祖的话。」\n\n第9节：「并叫外邦人因他的怜悯荣耀神。」"],["w",3],["p","弟兄姊妹，你看见差别了吗？"],["q","犹太人蒙恩——是因为神的真理。\n\n因为祂应许过列祖，而祂守约。"],["q","外邦人蒙恩——是因为神的怜悯。\n\n因为祂没有应许过我们什么。"],["w",3],["p","而这刚好对付了罗马教会两边的骄傲。"],["p","犹太信徒可能想：「我们才是有应许的。」"],["p","保罗说：对——而基督来，正是为了证实那些应许。"],["p","外邦信徒可能想：「神已经把他们挪开了。」"],["p","保罗说：你们在这里，纯粹是怜悯。"],["h","这不是新闻"],["p","而第9到12节，保罗一口气引了四段旧约。"],["p","弟兄姊妹，这四段的分布非常讲究："],["p","第9节，引诗篇18篇。"],["p","第10节，引申命记32章——那是律法书。"],["p","第11节，引诗篇117篇。"],["p","第12节，引以赛亚书11章——那是先知书。"],["w",3],["p","弟兄姊妹，保罗在做什么？"],["q","他从律法书、先知书、诗篇——\n\n也就是犹太人所说的整本圣经的三大部分——\n\n各拿出一段证据。"],["p","他要证明什么？"],["q","外邦人蒙恩，不是新闻。\n\n那是旧约从头到尾的计划。"],["w",3],["p","而这四段引文，还有一个很美的递进："],["p","第9节：「在外邦中」——我在他们中间称赞神。"],["p","第10节：「与主的百姓一同」——两群人在一起了。"],["p","第11节：「外邦啊，你们当赞美主」——他们自己开口了。"],["p","第12节：「外邦人要仰望他」——他们的盼望在祂身上。"],["w",3],["p","从「在他们中间」，到「与他们一同」，到「他们自己赞美」，到「他们仰望祂」。"],["h","第二个祝福"],["p","而第13节，是整个实践部分的祝福："],["q","「但愿使人有盼望的神，因信将诸般的喜乐、平安充满你们的心，\n\n使你们借着圣灵的能力大有盼望！」"],["w",3],["p","弟兄姊妹，「充满」这个动词，跟第5节一样——"],["p","也是祈愿语气：「愿祂充满」。"],["w",3],["p","而请注意保罗求的是什么。"],["p","他没有求：「愿你们都意见一致。」"],["p","他求的是："],["p","喜乐。平安。盼望。"],["w",3],["p","弟兄姊妹，我想这很有智慧。"],["q","因为一群有喜乐、有平安、有盼望的人——\n\n比较不会为了食物吵架。"],["w",3],["h","第三大段｜一个捧着人的祭司（15:14–33）"],["h","保罗怎么看自己的工作"],["p","弟兄姊妹，从15章14节开始，保罗讲到他自己。"],["p","而15章16节，他用了三个圣殿的字："],["q","「使我为外邦人作基督耶稣的仆役，\n\n作神福音的祭司，\n\n叫所献上的外邦人……可蒙悦纳。」"],["w",3],["p","第一个字「仆役」——λειτουργός。那是祭司在圣殿里供职的字。"],["p","第二个字「作祭司」——ἱερουργέω。这个字在整本新约，只出现这一次。"],["p","第三个字「所献上的」——προσφορά。那是祭坛上的供物。"],["w",3],["p","弟兄姊妹，保罗在说什么？"],["q","他把「传福音」，看作一场献祭。\n\n他自己是祭司。\n\n而祭坛上的供物是——\n\n那些归主的人。"],["w",3],["p","弟兄姊妹，我要说一句实话。"],["p","我们谈事工，很容易谈成别的东西。"],["p","「这个月有几个人？」「聚会人数成长了没有？」"],["p","而慢慢地——"],["p","人，变成了数字。"],["w",3],["p","而15章16节说：不是的。"],["q","你不是在「做一件事」。\n\n你是祭司。\n\n而你手上捧着的——\n\n是要献到神面前的人。"],["w",3],["p","而那个供物，凭什么被收下？"],["p","经文说：「因着圣灵成为圣洁。」"],["p","这是一个被动式："],["q","不是因为它本身好。\n\n是因为——有一位把它分别为圣了。"],["h","跟我一起下场"],["p","而15章30节，我要讲今天最后一个字。"],["q","「弟兄们……\n\n劝你们与我一同竭力，为我祈求神。」"],["w",3],["p","「一同竭力」——原文是 συναγωνίσασθαι。"],["p","它由两个部分组成："],["p","σύν ——「一同」。"],["p","ἀγωνίζομαι ——「在竞技场上搏斗」。"],["w",3],["p","弟兄姊妹，ἀγών 这个字，是「格斗、拚命」的意思。"],["p","（英文说的 agony——「极度的痛苦」——就是从这个字根来的。）"],["p","而更重要的是："],["q","路加福音22章44节，形容主耶稣在客西马尼「极其伤痛」——\n\n用的就是这个字根。"],["w",3],["p","所以保罗请人为他祷告的时候，他说的是："],["h","跟我一起下场。"],["w",3],["p","弟兄姊妹，我要问一个扎人的问题。"],["p","我们说「我会为你祷告」的时候——"],["p","那是下场，还是挥手？"],["h","而这个祷告，蒙应允了吗？"],["p","弟兄姊妹，最后我要讲一件事。"],["p","保罗在15章31、32节求了什么？"],["q","「叫我脱离在犹太不顺从的人……\n\n并叫我……欢欢喜喜地到你们那里。」"],["w",3],["p","后来呢？"],["p","使徒行传21章：他到了耶路撒冷——"],["p","被抓了。"],["p","然后坐监两年。"],["p","然后坐船去罗马——"],["p","船坏了。"],["p","最后，使徒行传28章16节：他到了罗马。"],["w",3],["p","但是——"],["p","戴着锁链。"],["p","（他自己在徒28章20节说：「我为以色列人所指望的，被这链子捆锁。」）"],["w",3],["p","所以我要问："],["p","那个祷告，蒙应允了吗？"],["w",3],["p","弟兄姊妹，请听使徒行传28章15节："],["q","「那里的弟兄们一听见我们的信息，就出来……迎接我们。\n\n保罗见了他们，就感谢神，放心壮胆。」"],["w",3],["p","他求的是什么？"],["p","「叫我欢欢喜喜地到你们那里。」"],["p","而圣经说：他见了他们，就感谢神，放心壮胆。"],["w",3],["q","他到了。\n\n他也欢欢喜喜了。\n\n只是——\n\n方式跟他想的，完全不一样。"],["w",3],["p","弟兄姊妹，如果你今天有一个祷告，祷告了很久，事情却不照你想的走——"],["p","我想把这一段送给你。"],["q","神应允了。\n\n用祂的方式。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["w",3],["p","第一，一个扛着的人。"],["p","你曾经是被扛的（11:18）。"],["p","所以现在——换你去扛。"],["p","而唯一的理由是：因为基督也不求自己的喜悦。"],["p","祂承受的，是本来要骂神的话。"],["w",3],["p","第二，一个接纳的主。"],["p","「彼此接纳，如同基督接纳你们一样。」"],["p","而祂接纳你的那一天，你不是全对的。"],["w",3],["p","第三，一个捧着人的祭司。"],["p","你不是在做事。"],["p","你是祭司——手上捧着要献到神面前的人。"],["w",3],["p","弟兄姊妹，我最后要说一件事。"],["p","第十五章有一个很美的骨架。"],["p","保罗在这一章里，用了三个不同的称呼来称呼神。"],["p","而每一个，都在祝福的位置："],["w",3],["p","15章5节：「赐忍耐安慰的神。」"],["p","15章13节：「使人有盼望的神。」"],["p","15章33节：「赐平安的神。」"],["w",3],["p","忍耐。安慰。盼望。平安。"],["w",3],["p","弟兄姊妹，你们知道吗——"],["p","这一章讲的，是一间因为食物和日子而紧张的教会。"],["p","而保罗为他们求的，正是他们最缺的那些东西。"],["w",3],["p","所以我今天要用第33节，作为结束的祝福。"],["p","而请注意最后那三个字："],["q","「愿赐平安的神，\n\n常和你们众人同在。\n\n阿们！」"],["w",3],["p","不是「与那些对的人」。"],["p","是——"],["p","众人。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，先承认一件事：我们常常忘了，我们是被扛的那一个。\n\n主啊，第十一章说：不是我们托着根，乃是根托着我们。而我们一站稳了，就开始觉得自己在扛。\n\n求祢提醒我们：我们有的力气，是拿来扛人的，不是拿来求自己喜悦的。\n\n主啊，我们也承认：我们接纳人，心里总有一把尺。而今天祢的话说：「如同基督接纳你们一样。」\n\n主啊，祢接纳我们的那一天，我们也不是全对的。求祢用祢的度量，重新量我们的度量。\n\n我们也把教会的不合一带到祢面前。主啊，我们常常想用开会、用沟通、用制度来解决。而祢的话说：合一是求来的。\n\n所以现在我们求：但愿赐忍耐安慰的神，叫我们彼此同心，一心一口荣耀祢。\n\n最后，主啊，我们当中有人祷告了很久，事情却不照他想的走。\n\n求祢让他今天听见：保罗到了罗马，戴着锁链——但他感谢神，放心壮胆。\n\n祢应允了。用祢的方式。\n\n愿赐平安的神，常和我们众人同在。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"16":{"min":35,"blocks":[["h","名字"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天，是我们读罗马书的最后一讲。"],["w",3],["p","这几个月，我们一起走过了十六章。"],["p","我们读过「世人都犯了罪，亏缺了神的荣耀」。"],["p","读过「但如今，神的义……已经显明出来」。"],["p","读过「如今，那些在基督耶稣里的就不定罪了」。"],["p","读过「深哉，神丰富的智慧和知识」。"],["p","读过「所以……将身体献上，当作活祭」。"],["p","读过「你们要彼此接纳，如同基督接纳你们一样」。"],["w",3],["p","而今天，我要问一个问题："],["q","这么伟大的一卷书——\n\n它是怎么结束的？"],["w",3],["p","弟兄姊妹，答案可能会让你意外。"],["p","罗马书的结尾，是——"],["p","一份名单。"],["w",3],["p","第十六章，保罗一个一个地问安。"],["p","点名的个人超过二十六位。"],["p","还有一些名字，我们念都念不太顺："],["p","土非拿氏。土富撒氏。亚逊其土。希罗天。非罗罗古。"],["w",3],["p","弟兄姊妹，我要老实说：我第一次认真读第十六章的时候，心里有一个念头："],["p","「这一章……可以跳过吧？」"],["p","而后来我发现——"],["q","这一章，可能是整卷书最有力的证据。"],["w",3],["p","我们今天要看三样东西："],["p","第一，一份名单。\n第二，一个警告。\n第三，一段颂赞。"],["w",3],["h","第一大段｜一份名单（16:1–16）"],["h","一位带信的姊妹"],["p","弟兄姊妹，第十六章从一个人开始。"],["p","第1、2节："],["q","「我对你们举荐我们的姊妹非比，她是坚革哩教会中的女执事。\n\n请你们为主接待她……她在何事上要你们帮助，你们就帮助她；\n\n因她素来帮助许多人，也帮助了我。」"],["w",3],["p","「举荐」这个字，希腊文是 συνίστημι。"],["p","弟兄姊妹，这在第一世纪是一个专门用语——"],["p","它是推荐信用的字。"],["w",3],["p","那个时代，一个人要到陌生的城市，需要一封推荐信，"],["p","好让当地的人知道：这个人可以接待，是自己人。"],["w",3],["p","而16章1到2节，正是一封标准推荐信的格式。"],["p","所以多数的解经家判断："],["q","非比，极可能就是把这封信从哥林多带到罗马的那个人。"],["w",3],["p","弟兄姊妹，如果是这样的话——"],["q","人类历史上，第一个把罗马书送到罗马的人，\n\n是一位姊妹。"],["w",3],["p","而第2节说她「素来帮助许多人」。"],["p","「帮助」这个字，原文是 προστάτις。"],["p","和合本译得比较轻。原文的意思是："],["q","「保护人、资助者」——\n\n一个有地位或财力，为别人提供保护与支持的人。"],["p","保罗说：她是许多人的保护人——"],["p","「也帮助了我」。"],["h","二十六个名字"],["p","然后从第3节开始，保罗就一路写名字。"],["p","弟兄姊妹，我念几个给大家听："],["p","百基拉。亚居拉。以拜尼土。马利亚。安多尼古。犹尼亚。暗伯利。耳巴奴。士他古。亚比利。希罗天。土非拿氏。土富撒氏。彼息氏。鲁孚。亚逊其土。弗勒干。黑米。八罗巴。黑马。非罗罗古。犹利亚。尼利亚……"],["w",3],["p","超过二十六位。"],["p","而其中——"],["p","至少九位是女性。"],["h","但最动人的不是名字"],["p","弟兄姊妹，最动人的不是他记得名字。"],["p","是——"],["q","他记得每一个人做过什么。"],["p","你们听："],["p","「非比……她素来帮助许多人，也帮助了我。」"],["p","「百基拉和亚居拉……也为我的命将自己的颈项置之度外。」"],["p","（「颈项置之度外」——原文的字面是：把自己的脖子放上去。那是一个斩首的画面。）"],["p","「以拜尼土……他在亚西亚是归基督初结的果子。」"],["p","「马利亚……她为你们多受劳苦。」"],["p","「安多尼古和犹尼亚……与我一同坐监。」"],["p","「亚比利……在基督里经过试验的。」"],["w",3],["p","弟兄姊妹，「亚比利」这一个描述，我停了很久。"],["p","「经过试验的」——原文是 δόκιμος。"],["p","那个字，是说金属经过火炼之后，还在的那个部分。"],["w",3],["p","我们不知道亚比利经历过什么。"],["p","圣经没有记载。"],["p","但——"],["p","保罗记得。"],["h","一个字，用在四位姊妹身上"],["p","而「劳苦」这个字，希腊文是 κοπιάω。"],["p","弟兄姊妹，它的意思不是「服事」。"],["p","它的意思是："],["q","做到筋疲力尽的苦工。"],["w",3],["p","而这个字在第十六章出现了四次。"],["p","马利亚。土非拿氏。土富撒氏。彼息氏。"],["p","四次——"],["p","全部用在女性身上。"],["w",3],["p","（我要顺带诚实地说一句：第1节的非比、第7节的犹尼亚，牵涉到一些解经上的讨论，"],["p","敬虔的学者有不同的理解。"],["p","但有一件事没有人争议："],["p","保罗高度尊重她们，并且记得她们做过什么。）"],["h","一句最温暖的话"],["p","而第13节，弟兄姊妹，这半句话我每次读都会停下来："],["q","「又问在主蒙拣选的鲁孚和他母亲安；\n\n他的母亲就是我的母亲。」"],["w",3],["p","弟兄姊妹，保罗显然不是说她生了他。"],["p","他是说："],["q","这位姊妹，待我如同待自己的儿子。"],["w",3],["p","而我要请大家想一件事。"],["p","保罗是一个什么样的人？"],["p","他一生在路上。"],["p","坐监。船坏。被打。被石头打。被赶出城。"],["p","他没有家。"],["w",3],["p","而在某一个城市，有一位姊妹——"],["p","把他当儿子。"],["w",3],["p","弟兄姊妹，这就是教会。"],["p","（而关于「鲁孚」，有一个有意思的可能：马可福音15章21节提到，替耶稣背十字架的古利奈人西门，是「亚历山大和鲁孚的父亲」。"],["p","有学者认为可能是同一位——但这无法确定，我不敢说死。）"],["h","一条隐藏的线"],["p","弟兄姊妹，读名单的时候很容易只看见名字。"],["p","但如果你留意，会发现一个词组一直出现："],["p","第2节：「请你们为主接待她。」"],["p","第3节：「他们在基督耶稣里与我同工。」"],["p","第7节：「也是比我先在基督里。」"],["p","第8节：「我在主里面所亲爱的。」"],["p","第10节：「在基督里经过试验的。」"],["p","第11节：「拿其数家在主里的人。」"],["p","第12节：「为主劳苦的……为主多受劳苦的。」"],["p","第13节：「在主蒙拣选的鲁孚。」"],["p","第22节：「我这代笔写信的德丢，在主里面问你们安。」"],["w",3],["p","弟兄姊妹，「在主里」在这一章出现十次以上。"],["p","那不是客套话。"],["q","那是把整份名单串起来的那条线。"],["w",3],["p","而「在基督里」，正是整卷罗马书的核心："],["p","8章1节：「如今，那些在基督耶稣里的就不定罪了。」"],["p","8章39节：「这爱是在我们主基督耶稣里的。」"],["w",3],["p","所以第十六章在做什么？"],["q","它把「在基督耶稣里」这个词——\n\n一个一个地，填上名字。"],["h","这是一间什么样的教会？"],["p","弟兄姊妹，我要请大家从这份名单，看一件事。"],["p","名单里有一些名字——"],["p","在当时是奴隶和释奴常用的名字。"],["p","（暗伯利、耳巴奴、黑米、彼息氏、非罗罗古、尼利亚……）"],["w",3],["p","而第23节提到一个人："],["q","「城内管银库的以拉都。」"],["p","那是一个公职——城市的财务管理者。"],["w",3],["p","弟兄姊妹，你看见了吗？"],["q","在同一封信里被问安的人当中——\n\n有城市的财政官员，\n\n也有奴隶出身的信徒。\n\n而保罗，用同一个词问他们安。"],["w",3],["p","这就是十五章的神学，长出来的样子。"],["w",3],["h","第二大段｜一个警告（16:17–20）"],["h","温暖之后，是清醒"],["p","弟兄姊妹，读完十四节的问安，我们心里是暖的。"],["p","然后第17节，保罗的语气突然变了："],["q","「弟兄们，那些离间你们、叫你们跌倒、背乎所学之道的人，\n\n我劝你们要留意躲避他们。」"],["w",3],["p","「留意」这个字，希腊文是 σκοπέω——"],["p","它的字根是「目标、标的」（英文 scope 就是从这个字来的）。"],["p","意思是：盯着看。"],["w",3],["p","弟兄姊妹，保罗没有说「不要理他们」。"],["p","他说："],["q","先盯着看清楚——\n\n然后转开。"],["p","分辨在前，避开在后。"],["h","一个听起来很好的东西"],["p","而第18节，保罗描述了那些人："],["q","「因为这样的人不服事我们的主基督，只服事自己的肚腹，\n\n用花言巧语诱惑那些老实人的心。」"],["w",3],["p","弟兄姊妹，「花言巧语」这个字，我一定要跟大家分享。"],["p","原文是 χρηστολογία。"],["p","它在整本新约，只出现这一次。"],["w",3],["p","而它是由两个部分组成的："],["p","λόγος ——「话」。"],["p","χρηστός ——「良善的、恩慈的」。"],["w",3],["p","弟兄姊妹，χρηστός 这个字，我们在罗马书见过。"],["p","它的名词形是 χρηστότης——"],["p","罗马书2章4节："],["q","「还是你藐视他丰富的恩慈（χρηστότης）、宽容、忍耐，\n\n不晓得他的恩慈是领你悔改呢？」"],["w",3],["p","同一个字根。"],["w",3],["p","弟兄姊妹，你听出来了吗？"],["q","神的恩慈，是真的——而且领人悔改。\n\n而他们的「听起来很恩慈的话」，是假的——用来诱惑人。"],["w",3],["q","弟兄姊妹，这是一个很严肃的提醒：\n\n假的东西，常常长得跟真的——\n\n很像。"],["h","那是蛇的方法"],["p","而第18节还有一个字，我觉得是本章最精彩的线索。"],["p","「诱惑那些老实人的心」——原文是 ἐξαπατάω。"],["w",3],["p","弟兄姊妹，这个字我们在罗马书第七章见过。"],["p","7章11节："],["q","「因为罪趁着机会，就借着诫命引诱（ἐξηπάτησέν）我，并且杀了我。」"],["w",3],["p","而那个字，来自哪里？"],["p","创世记3章13节。夏娃说："],["q","「那蛇引诱我，我就吃了。」"],["p","（哥林多后书11章3节也用这个字：「就像蛇用诡诈诱惑了夏娃一样。」）"],["w",3],["p","所以保罗在说什么？"],["q","那些离间的人，用的是——\n\n蛇的方法。"],["h","而那条蛇，快要被踩碎了"],["p","弟兄姊妹，然后第20节。"],["p","而我要请大家注意，这一节紧接在第18节后面："],["q","「赐平安的神快要将撒但践踏在你们脚下。」"],["w",3],["p","「践踏」这个字，原文是 συντρίβω——意思是：压碎。"],["w",3],["p","而弟兄姊妹，这句话的背后是什么？"],["p","是创世记第三章。"],["p","创3章15节："],["q","「女人的后裔要伤你的头。」"],["w",3],["p","你们看见保罗的安排了吗？"],["p","第18节：他们用蛇的方法（ἐξαπατάω ＝ 创3:13）。"],["p","第20节：而那条蛇，快要被踩碎（συντρίβω ＝ 创3:15）。"],["w",3],["p","弟兄姊妹，这不是巧合。"],["p","保罗在信的最后，把我们带回到圣经最古老的那个应许。"],["h","一个很重要的提醒"],["p","弟兄姊妹，讲到这里，我必须说一件很重要的事。"],["p","因为第17节，是一节很容易被误用的经文。"],["w",3],["p","它很容易变成："],["q","「他跟我意见不同——他就是16章17节那种人。」"],["w",3],["p","所以请大家看清楚保罗给的判准。"],["p","他列了五样："],["p","第一，离间——造成分裂。"],["p","第二，叫人跌倒——放陷阱。"],["p","第三，背乎所学之道。"],["p","第四，不服事主，只服事自己的肚腹。"],["p","第五，用花言巧语诱惑老实人。"],["w",3],["p","弟兄姊妹，请注意第三项：「背乎所学之道」。"],["p","那是一个客观的、教义上的标准——"],["p","不是「他不同意我的看法」。"],["w",3],["q","判准不是「跟我意见不同」。\n\n判准是：背离所传的道 ＋ 以分裂为手段 ＋ 以自己为目的。"],["w",3],["p","（而弟兄姊妹，这一点跟我们前几周读的第十四章完全不冲突。"],["p","第十四章说：接纳那些跟你不一样的弟兄。"],["p","第十六章说：躲避那些以分裂为手段、以自己为目的的人。"],["p","两章讲的是完全不同的人。"],["p","接纳——不等于没有界线。）"],["w",3],["h","第三大段｜一段颂赞（16:21–27）"],["h","一个写字的人"],["p","弟兄姊妹，第21节开始，是保罗身边同工们的问安。"],["p","而第22节，有一句话我很喜欢："],["q","「我这代笔写信的德丢，在主里面问你们安。」"],["w",3],["p","弟兄姊妹，在第一世纪，长信通常由专业的代笔人书写。"],["p","保罗口述。德丢一笔一笔地写。"],["w",3],["p","十六章。"],["p","几个小时，甚至几天。"],["w",3],["p","而写到问安的部分，保罗可能停了一下——"],["p","然后德丢说：「我……可以也问个安吗？」"],["w",3],["p","弟兄姊妹，你看保罗怎么做的："],["q","他让那个帮他写字的人，\n\n在他自己的书信里——\n\n留下名字。"],["h","回到起点"],["p","而现在，我们来到全卷罗马书的最后三节。"],["p","弟兄姊妹，我要请大家注意一件事。"],["p","第25节说："],["q","「惟有神能……坚固你们的心。」"],["w",3],["p","「坚固」这个字，希腊文是 στηρίζω。"],["w",3],["p","弟兄姊妹，这个字我们在第一章见过。"],["p","罗马书1章11节，保罗说："],["q","「因为我切切地想见你们，\n\n要把些属灵的恩赐分给你们，使你们可以坚固。」"],["w",3],["p","同一个字。"],["w",3],["p","第一章：「我想去坚固你们。」"],["p","第十六章：「惟有神能坚固你们的心。」"],["w",3],["q","弟兄姊妹，那是——\n\n一卷书的距离。"],["w",3],["p","而保罗并没有变得消极。"],["p","他仍然在计划去西班牙。他仍然在请人代祷。他仍然一个一个地写名字。"],["p","他只是——"],["p","知道了。"],["q","坚固人的，不是我。"],["h","一个把整卷书框起来的词"],["p","而第26节，还有一个词。"],["p","「使他们信服真道。」"],["p","原文是：εἰς ὑπακοὴν πίστεως ——「以致于信心的顺服」。"],["w",3],["p","弟兄姊妹，这个词组在整卷罗马书，只出现两次。"],["p","一次在第一章第5节："],["q","「在万国之中叫人为他的名信服真道。」"],["p","另一次——"],["p","就是这里。第十六章第26节。"],["w",3],["p","一头。"],["p","一尾。"],["q","保罗用同一句话，\n\n把整卷书——\n\n框了起来。"],["h","最后一句"],["p","而第27节，是罗马书的最后一句："],["q","「愿荣耀因耶稣基督归与独一全智的神，\n\n直到永远。阿们！」"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["w",3],["p","第一，一份名单。"],["p","保罗记得的不只是名字，是他们做过什么。"],["p","而那份名单里，有奴隶，有官员，有九位以上的姊妹，"],["p","还有一位——把保罗当儿子的母亲。"],["w",3],["p","第二，一个警告。"],["p","有些人要提防——"],["p","但判准是背乎所学之道，不是「跟我意见不同」。"],["p","而他们用的是蛇的方法。"],["p","好消息是：那条蛇，快要被踩碎了。"],["w",3],["p","第三，一段颂赞。"],["p","「我想去坚固你们」——变成了「惟有神能坚固你们的心」。"],["p","那是一卷书的距离。"],["w",3],["p","弟兄姊妹，我最后要说一件事。"],["p","我们这几个月读了罗马书。"],["p","这是全本圣经最伟大的神学论文之一。"],["p","它讲称义。讲圣灵。讲拣选。讲奥秘。"],["p","而它的结尾——"],["p","是一份名单。"],["w",3],["p","我想，这件事本身，就是一篇讲道。"],["q","因为神从来不是在拯救「人类」。\n\n祂是在拯救——\n\n有名字的人。"],["w",3],["p","主耶稣说过一句话。约翰福音10章3节："],["q","「他按著名叫自己的羊。」"],["w",3],["p","弟兄姊妹，所以我今天要给大家一个作业。"],["p","很简单。"],["w",3],["p","回去拿一张纸。"],["p","写下十个名字。"],["p","教会里的、你身边的。"],["w",3],["p","然后在每一个名字后面，写一句话："],["p","「他做过什么。」"],["w",3],["p","然后——"],["p","这礼拜，跟其中一位说出来。"],["w",3],["p","因为弟兄姊妹，"],["p","十六章的神学，最后落在哪里？"],["p","落在一个一个——"],["p","有名字的人身上。"],["w",3],["p","而那份名单上，"],["p","也有你的名字。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天读完了罗马书。\n\n主啊，这几个月祢的话对我们说了很多。祢说我们都犯了罪；祢说但如今神的义显明了；祢说在基督里就不定罪了；祢说没有什么能叫我们与祢的爱隔绝。\n\n而今天，祢用一份名单提醒我们：这一切最后要落在人身上。\n\n主啊，求祢赦免我们——我们常常把事工做成数字，把人做成人次。我们记得谁有用，却不记得谁做过什么。\n\n求祢让我们像保罗一样，记得名字，也记得他们做过什么。\n\n主啊，也求祢给我们分辨的心。求祢让我们守住界线，却不用界线去排除跟我们不一样的弟兄。\n\n也谢谢祢：那些用蛇的方法的，祢说那条蛇快要被踩碎了。\n\n最后，主啊——\n\n我们承认：坚固人的，不是我们。惟有祢能坚固我们的心。\n\n愿荣耀因耶稣基督归与独一全智的祢，直到永远。\n\n阿们。"],["w",3]]}}}</script>
<script>/* ===== 321圣经讲义｜罗马书 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一节 → 所属的解经段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321sc.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try { const o = JSON.parse(localStorage.getItem(KEY)); if (o && o.v === 1) return o; } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, prac:{}, mem:{}, set:{ fs:1, grk:1, dark:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

/* ===== 进度 ===== */
const STEPS = [
  ['信息','读完本章卡片'], ['启示','读经文，写下你看见的一件事'], ['信服','记住本章金句'],
  ['实践','选一项本周操练'], ['检讨','第七天回填：做了吗'], ['修正','回到哪一节重读'],
  ['反复','复习通过三次'], ['繁殖','讲给一位课外的人听'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

/* ===== 复习 ===== */
function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 朗读 ===== */
let VOICE = null;
function say(t){
  if (!window.speechSynthesis) return toast('这台设备不支援朗读');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, ''));
  u.lang = 'zh-CN'; u.rate = 0.94;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]CN|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const plain = el => (el || $('#view')).innerText.slice(0, 3000);

/* ===== 路由 ===== */
let R = { tab:'today', ch:0, sub:'' };
function go(tab, ch, sub){ R = { tab, ch: ch || 0, sub: sub || '' }; if (ch) { S.last = ch; save(); } render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('nav.tabs button'); if (!b) return;
  go(b.dataset.t);
});
$('#back').onclick = () => { if (R.ch) go(R.tab === 'text' ? 'text' : 'course'); else go('today'); };
$('#spk').onclick = () => { if (SPK.on) return stopSpeak(); speak(plain(), $('#ttl').textContent); };
$('#spk').onlongpress = null;
(function(){ let t; const b = $('#spk');
  const st = () => { t = setTimeout(() => { voiceSheet(); t = null; }, 550); };
  const cl = () => { if (t){ clearTimeout(t); t = null; } };
  b.style.webkitTouchCallout = 'none'; b.style.webkitUserSelect = 'none'; b.style.userSelect = 'none';
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('touchstart', st, { passive:true });
  b.addEventListener('touchend', cl); b.addEventListener('touchmove', cl);
  b.addEventListener('mousedown', st); b.addEventListener('mouseup', cl);
})();
$('#fsz').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); toast('字级 ' + (S.set.fs + 1) + ' / 5'); };
function applyFS(){ document.documentElement.style.setProperty('--fs', [15, 17, 19, 22, 25][S.set.fs] + 'px'); }
function applyDark(){ document.documentElement.setAttribute('data-dark', S.set.dark ? '1' : '0'); }

/* ===== 地形图 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H = 96, pad = 14;
  const x = c => pad + (c - 1) / 15 * (W - pad * 2);
  const y = v => 10 + v / 100 * (H - 26);
  let d = `M ${x(1)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(16)} ${y(30)}`;
  const labs = P.filter(p => p[4]).map(p => {
    const yy = p[4] === 'bot' ? y(p[1]) + 11 : y(p[1]) - 6;
    return `<text class="tlab ${p[4] === 'top' ? 'hi' : ''}" x="${x(p[0]).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="middle">${esc(p[3])}</text>`;
  }).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  return `<div class="terrain"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="罗马书全书地形图">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">两个最低点 · 两个「如今」 · 一个「所以」</p></div>`;
}

/* ===== 今日 ===== */
function vToday(){
  setTitle('321圣经讲义', true);
  const n = S.last || 1, m = meta(n), st = stepsOf(n);
  const nx = st.length < 8 ? STEPS[st.length] : null;
  const dl = due();
  let h = `<div class="sect">
    <p class="eyebrow">今日</p>
    <h2 class="big">一封写给你的信。</h2>
    ${terrain(n)}
    <div style="height:14px"></div>
    <button class="bigbtn" onclick="go('course',${n})">
      <small>${st.length ? '接着读' : '从第一章开始'}</small>
      <b>第${n}章　${esc(m.t)}</b>
      <small style="margin-top:9px">${nx ? '下一步 · ' + (st.length + 1) + ' ' + nx[0] + '｜' + nx[1] : '八步已走完　愿你继续繁殖'}</small>
    </button>
  </div>`;

  if (dl.length) h += `<div class="card" style="border-color:var(--brass)">
    <p class="eyebrow" style="color:var(--brass)">今天要复习</p>
    <p style="margin:0 0 10px">有 <b>${dl.length}</b> 节金句等你</p>
    <button class="btn pri" onclick="go('tools',0,'review')">开始复习</button></div>`;

  const p = S.prac[n] || {};
  const items = practiceItems(n);
  const dn = items.filter((_, i) => p[i]).length;
  h += `<div class="card">
    <p class="eyebrow">本周操练 · 第${n}章</p>
    <p class="q">${esc(meta(n).prac.main)}</p>
    <p class="sm muted" style="margin:6px 0 0">已完成 ${dn} / ${items.length}　<a href="#" onclick="go('course',${n},'prac');return false">去打卡</a></p></div>`;

  h += `<div class="card"><p class="eyebrow">进度</p>
    <p style="margin:0">已开始 <b>${startedCh()}</b> 章　·　走完八步 <b>${doneCh()}</b> 章　·　共 16 章</p></div>`;

  h += `<div class="foot">全书十六章 433 节经文、${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} 段逐节解经、16 篇讲章逐字稿，全部收录。<br>

let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>罗马书 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重点段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直译', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '关键字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '经文解释', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">下一段 ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 朗读</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ 问小智</button>
    <button class="btn" onclick="go('course',${v.ch})">整章讲义</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), '罗 ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + '。' + m.mv.r, '本章金句'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

/* 路徑從目前網址推算，不寫死 —— 網站放在網域根目錄或 /倉庫名/ 底下都能運作 */
function langRoot(){
  try {
    let p = location.pathname.replace(/index\.html$/, '');
    if (!p.endsWith('/')) p += '/';
    p = p.replace(/\/(sc|en)\/$/, '/');   // 若目前在子語言資料夾，退回上一層
    return p;
  } catch(e){ return '/'; }
}
const LANGS = [
  { k:'tc', label:'繁體中文', sub:'和合本',              dir:''    },
  { k:'sc', label:'简体中文', sub:'和合本',              dir:'sc/' },
  { k:'en', label:'English',  sub:'World English Bible', dir:'en/' },
];
const LANG_NOW = 'sc';
function langURL(l){ return langRoot() + l.dir; }
function goLang(k){
  const l = LANGS.find(x => x.k === k); if (!l) return;
  const url = langURL(l);
  toast('检查中…');
  fetch(url, { method:'HEAD' })
    .then(r => { if (r.ok) location.href = url; else toast('这个网站上找不到该版本'); })
    .catch(() => { location.href = url; });   // 無法檢查就直接前往
}
