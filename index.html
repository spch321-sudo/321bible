被交付） （因著）（我們的過犯）\nκαὶ ἠγέρθη   διὰ τὴν δικαίωσιν   ἡμῶν\n   （被復活） （因著）（我們的稱義）</pre><p>兩個被動動詞 ＋ 兩個 διά ＋ 兩個 ἡμῶν。</p><p>這種對稱在保羅書信中極為罕見，多數學者認為這是保羅引用的一段<b>早期教會信仰告白</b>——若是如此，它比羅馬書本身更古老。</p><p>② παρεδόθη 與以賽亞書53章的連結</p><p>七十士譯本以賽亞書53章用了 παραδίδωμι 三次：</p><p>- 賽53:6 LXX「耶和華使我們眾人的罪孽都歸在他身上」<br>- 賽53:12 LXX「他將命傾倒，以致於死……他被交付（παρεδόθη）」</p><p>保羅用的是以賽亞書53章的字。這一句話背後，站著那位受苦的僕人。</p><p>③ διά + 直接受格的關鍵解釋</p><p>兩個 διά 都接直接受格，意思是「<b>因為、由於</b>」。</p><p>這造成一個解經上的重要問題：</p><p>「祂被交付，<b>因為</b>我們的過犯」——這很好懂：我們的罪是祂被交的原因。</p><p>但「祂復活，<b>因為</b>我們的稱義」——這是什麼意思？難道我們的稱義是祂復活的原因？</p><p>兩種主要理解：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>目的性理解</b>（多數譯本）</td><td>「為叫我們稱義」——復活是為了成就我們的稱義（和合本、多數中英譯本）</td></tr><tr><td><b>回顧性理解</b></td><td>「因為我們的稱義（已經在十字架上成就了）」——復活是稱義已成的<b>證明</b></td></tr></table><p>兩者其實互補：</p><p>十字架付清了帳；復活是那張蓋了章的收據。</p><p>如果耶穌沒有復活，我們永遠不知道那筆帳到底付清了沒有。<br>祂從墳墓裡出來，就是天上發出的一張收據：</p><p>「已收訖。」</p><p>④ 為什麼保羅用「過犯」（παράπτωμα）而不用「罪」（ἁμαρτία）？</p><p>παράπτωμα 的字面是「跌倒在旁邊」「失足」——強調<b>具體的、一次一次的</b>過失。</p><p>呼應4:15的 παράβασις（跨越界線）。</p>","exp":"<p>這一節是整章的落點，也是把亞伯拉罕與我們接在一起的那個接頭。</p><p>保羅講了二十四節的亞伯拉罕，最後一節突然轉到耶穌——為什麼？</p><p>因為前面所有的問題，都在這一節得到答案：</p><table><tr><th>前面的問題</th><th>4:25的答案</th></tr><tr><td>神憑什麼稱不敬虔的人為義？（4:5）</td><td><b>因為祂的兒子被交付了，為我們的過犯</b></td></tr><tr><td>那些不算為有罪的罪，去哪裡了？（4:8）</td><td><b>算到祂身上了</b></td></tr><tr><td>我怎麼知道我真的被算為義了？（4:24）</td><td><b>因為祂復活了——收據在這裡</b></td></tr></table><p>弟兄姊妹，這就是為什麼第四章一定要以復活結尾。</p><p>因為亞伯拉罕所信的那位「叫死人復活的神」（4:17），<br>在一個星期天的早晨，親自示範了一次。</p>"}],"5":[{"a":1,"z":1,"star":true,"grk":"<p>Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ</p>","lit":"<p>「所以，我們既<b>已被稱義</b>了，本於信——我們<b>就有</b>了與神之間的<b>和平</b>，藉著我們的主耶穌基督。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>既稱義</td><td>δικαιωθέντες</td><td>dikaiōthentes</td><td>G1344</td><td>δίκαιος</td><td><b>不定過去被動分詞：已經被宣告為義</b></td><td>一次完成、定案的事</td></tr><tr><td>相和</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>—</td><td><b>和平</b>（LXX 譯希伯來文 שָׁלוֹם）</td><td><b>不是心情，是狀態</b></td></tr><tr><td>得與……相和</td><td>πρὸς τὸν θεόν</td><td>pros ton theon</td><td>G4314</td><td>—</td><td><b>面對面地朝向神</b></td><td>關係性的介詞</td></tr></table>","gram":"<p>① δικαιωθέντες：不定過去被動分詞</p><p>- <b>不定過去式</b>：一個已經完成的事件，不是持續進行的過程<br>- <b>被動式</b>：是神做的，不是我做的<br>- <b>分詞</b>：這是主句的<b>前提</b>，不是主句本身</p><p>中文的「既」譯得極好：「既然……」——這件事已經定了，我們是站在這個定案上往下說。</p><p>② εἰρήνη 不是心情，是狀態</p><p>這是本節最重要、也最常被誤讀的一點。</p><p>希臘文 εἰρήνη 在七十士譯本中翻譯希伯來文 <b>שָׁלוֹם（shalom）</b>——</p><p>שָׁלוֹם 的字根意思是「完整、無缺、修復到位」，用於：</p><p>- 戰爭結束（書9:15）<br>- 債務還清<br>- 關係修復</p><p>「與神相和」不是說「我覺得很平安」。<br>是說：戰爭結束了。停戰協定已經簽了。</p><p>你的感覺會起起伏伏，但那份停戰協定不會因為你今天心情不好就作廢。</p><p>③ πρὸς τὸν θεόν 的介詞</p><p>πρός + 直接受格，表示<b>面對面的關係方向</b>。</p><p>（約1:1「道與神同在」用的正是 πρὸς τὸν θεόν——<b>面對面的關係</b>）</p><p>④ ★ 本節的抄本問題：ἔχομεν 還是 ἔχωμεν？</p><p>這是新約中最著名的抄本異文之一，必須誠實處理。</p><table><tr><th>讀法</th><th>文法</th><th>意思</th></tr><tr><td><b>ἔχομεν</b></td><td>直說語氣</td><td>「我們<b>有</b>了與神的和平」（<b>陳述事實</b>）</td></tr><tr><td><b>ἔχωμεν</b></td><td>假設語氣</td><td>「讓我們<b>保持</b>與神的和平」（<b>勸勉</b>）</td></tr></table><p>兩者在希臘文中只差一個字母（ο／ω），而在第一世紀，這兩個母音的發音已經接近相同——</p><p>一個抄寫員在聽寫時，幾乎不可能分辨。</p><p>證據評估：</p><p>- <b>抄本外證</b>：較早的抄本多支持 ἔχωμεν（假設語氣）<br>- <b>內證（上下文與保羅的思路）</b>：<b>強烈支持 ἔχομεν（直說語氣）</b></p><p>理由：</p><p>1. 5:1–11整段都是<b>陳述</b>我們所擁有的（我們得進入、我們歡喜、愛已澆灌），<b>不是勸勉</b><br>2. 保羅在羅馬書中，勸勉（12–16章）與教義（1–11章）是分開的<br>3. 5:2「因信得進入現在所站的這恩典中」是完成式直說語氣，5:1若是勸勉會很突兀</p><p>多數現代譯本與註釋（含和合本）採直說語氣。</p><p>講台誠信提醒：可以說「這裡有一個古老的抄本問題，兩種讀法只差一個字母」，但不要說「原文其實是……而中文翻錯了」——因為多數學者的判斷與和合本一致。</p>","exp":"<p>弟兄姊妹，注意保羅的順序：</p><pre>稱義（法庭）  →  相和（關係）</pre><p>稱義是法官的宣判；相和是父親的擁抱。</p><p>你可以在法庭上被判無罪，然後跟法官一輩子不再見面。</p><p>但保羅說：不是這樣。</p><p>神不只把你判無罪，祂還跟你和好了。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>δι' οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν [τῇ πίστει] εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν καὶ καυχώμεθα ἐπ' ἐλπίδι τῆς δόξης τοῦ θεοῦ.</p>","lit":"<p>「藉著祂，我們也<b>已經得著了引見</b>，進入這恩典中——我們就<b>站立</b>在其中；並且我們<b>誇口</b>，在神榮耀的盼望上。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>進入</td><td>προσαγωγή</td><td>prosagōgē</td><td>G4318</td><td>πρός + ἄγω（帶領）</td><td><b>引見、帶到面前</b></td><td><b>宮廷用語</b>（見下）</td></tr><tr><td>得</td><td>ἐσχήκαμεν</td><td>eschēkamen</td><td>G2192</td><td>ἔχω</td><td><b>完成式：已經得著，且一直持有</b></td><td>不會被收回</td></tr><tr><td>所站</td><td>ἑστήκαμεν</td><td>hestēkamen</td><td>G2476</td><td>ἵστημι</td><td><b>完成式：已經站定，且持續站著</b></td><td>站住了</td></tr><tr><td>歡歡喜喜</td><td>καυχώμεθα</td><td>kauchōmetha</td><td>G2744</td><td>—</td><td><b>誇口、以…為榮</b></td><td>3:27被關在門外的那個字</td></tr></table>","gram":"<p>★ 亮光一：προσαγωγή ——引見官</p><p>這個字在新約只出現三次，全部在保羅書信：羅5:2、弗2:18、弗3:12。</p><p>在波斯與希臘化王朝的宮廷制度中，有一個官職叫 προσαγωγεύς——</p><p>「引見官」。他的工作，是把人帶到王的面前。</p><p>沒有他，你連王宮的門都摸不到。</p><p>以斯帖記4:11：「凡未蒙召見擅入內院見王的，無論男女必被治死；除非王向他伸出金杖，不得存活。」</p><p>保羅說：耶穌就是那位引見官。</p><p>而更驚人的是——祂不是把我們帶到門口就走了。</p><p>★ 亮光二：兩個完成式</p><pre>ἐσχήκαμεν  （我們已經得著引見，且一直持有）\nἑστήκαμεν  （我們已經站定，且持續站著）</pre><p>完成式在希臘文中，表示「過去完成的動作，效果持續至今」。</p><p>保羅沒有說「我們曾經被帶進去過」。<br>他說：<b>我們被帶進去了，而且我們現在還站在那裡</b>。</p><p>不是訪客，是常駐。</p><p>★ 亮光三：καυχώμεθα ——誇口回來了</p><p>這個字，我們在3:27見過：</p><p>「既是這樣，哪裡能<b>誇口</b>呢？沒有可誇的了（被關在門外了）。」</p><p>現在在5:2、5:3、5:11，它回來了三次。</p><p>保羅不是要消滅誇口。他是要換掉誇口的<b>對象</b>。</p><p>靠行為的誇口，被關在門外（3:27）。<br>靠恩典的誇口，被請進來（5:2、11）。</p>","exp":"<p>弟兄姊妹，5:1–2給了稱義的三個結果，而它們有時間順序：</p><table><tr><th>時態</th><th>內容</th><th>經文</th></tr><tr><td><b>過去</b></td><td>戰爭結束了（相和）</td><td>5:1</td></tr><tr><td><b>現在</b></td><td>我站在恩典中（進入）</td><td>5:2上</td></tr><tr><td><b>將來</b></td><td>我盼望神的榮耀</td><td>5:2下</td></tr></table><p>注意最後一項：「盼望<b>神的榮耀</b>」。</p><p>羅3:23說什麼？「世人都犯了罪，<b>虧缺了神的榮耀</b>。」</p><p>我們虧缺的那樣東西，現在成了我們的盼望。</p><p>從「虧缺神的榮耀」（3:23）到「盼望神的榮耀」（5:2）——<br>這就是福音在兩章之間走完的距離。</p><p>【第二段｜5:3–5　患難的鏈條】</p>"},{"a":3,"z":4,"star":false,"grk":"<p>3 οὐ μόνον δέ, ἀλλὰ καὶ καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,<br>4 ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.</p>","lit":"<p>3「不僅如此，我們也在<b>擠壓</b>中誇口，因為<b>知道</b>擠壓<b>製造出</b>忍耐，」<br>4「忍耐製造出<b>經過試驗的品格</b>，經過試驗的品格製造出盼望。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>患難</td><td>θλῖψις</td><td>thlipsis</td><td>G2347</td><td>θλίβω（擠壓）</td><td><b>壓力、擠壓、重壓</b></td><td>原意是<b>壓榨</b>（如壓橄欖、壓葡萄）</td></tr><tr><td>生</td><td>κατεργάζεται</td><td>katergazetai</td><td>G2716</td><td>κατά + ἐργάζομαι</td><td><b>製造出、產出</b>（強調結果）</td><td>4:15同字</td></tr><tr><td>忍耐</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td>ὑπό（在下）+ μένω（存留）</td><td><b>在重壓底下站住不跑</b></td><td>2:7同字</td></tr><tr><td>老練</td><td>δοκιμή</td><td>dokimē</td><td>G1382</td><td>δοκιμάζω（試驗金屬）</td><td><b>經過火煉、驗明為真的品質</b></td><td>見下</td></tr><tr><td>知道</td><td>εἰδότες</td><td>eidotes</td><td>G1492</td><td>οἶδα</td><td><b>確知</b>（不是猜測）</td><td>這是歡喜的<b>根據</b></td></tr></table>","gram":"<p>① θλῖψις 的畫面：壓榨</p><p>這個字的動詞 θλίβω 是「擠壓」——用於壓橄欖出油、壓葡萄出酒。</p><p>保羅選的不是「打擊」，是「擠壓」。</p><p>擠壓的重點不是破壞，是<b>把裡面的東西擠出來</b>。</p><p>而擠壓最誠實的地方在於：它只能擠出裡面本來就有的東西。</p><p>② δοκιμή 的冶金背景</p><p>這個字來自 δοκιμάζω——<b>驗金屬</b>。</p><p>古代驗金：把金屬放進火裡，雜質浮上來被撇去，剩下的就是 δόκιμος（驗明為真的）。</p><p>（彼前1:7「你們的信心既被試驗，就比那被火試驗仍然能壞的金子更顯寶貴」——同字根）</p><p>「老練」不是「經驗豐富」，是<b>經過火之後還在的那個部分</b>。</p><p>③ κατεργάζεται 現在式，只出現一次</p><p>注意：4節的「生」在原文中省略了動詞，是承接3節的 κατεργάζεται。</p><p>所以整條鏈子是<b>一個動詞</b>帶下來的：</p><pre>θλῖψις  →  ὑπομονή  →  δοκιμή  →  ἐλπίς\n擠壓    →  在壓下站住  →  驗明為真  →  盼望</pre><p>④ 一個必須說清楚的平衡：「在患難中」不等於「因為患難」</p><p>原文是 ἐν ταῖς θλίψεσιν——「<b>在</b>患難中」，不是「<b>為了</b>患難」。</p><p>保羅沒有說患難是好的。<br>保羅說：在患難<b>裡面</b>，我們仍然可以誇口——因為我們<b>知道</b>神在其中做什麼。</p>","exp":"<p>弟兄姊妹，5:3是全章最容易被誤用的一節。</p><p>它常被拿來對受苦的人說：「你要喜樂啊！患難生忍耐嘛！」</p><p>這種用法是殘忍的，而且違背原文。</p><p>請注意三件事：</p><p>第一，保羅說的是「<b>在</b>患難中」，不是「<b>為著</b>患難」。</p><p>第二，歡喜的根據是「<b>知道</b>」（εἰδότες）——是對神的認識，不是對痛苦的麻木。</p><p>第三，這一整條鏈子是<b>神</b>在做的（κατεργάζεται），不是我們要努力擠出來的。</p><p>這節經文是給<b>受苦的人自己</b>用的，不是給旁觀者拿來說教用的。</p><p>而這條鏈子最誠實的地方在於：</p><p>擠壓只能擠出裡面本來就有的東西。</p><p>所以患難不「製造」品格——患難<b>顯明</b>品格，然後神在那個顯明出來的地方動工。</p>"},{"a":5,"z":5,"star":true,"grk":"<p>ἡ δὲ ἐλπὶς οὐ καταισχύνει, ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.</p>","lit":"<p>「而這盼望<b>不使人蒙羞</b>，因為神的愛<b>已經被澆灌</b>在我們心裡——藉著那<b>已賜給</b>我們的聖靈。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>羞恥</td><td>καταισχύνει</td><td>kataischynei</td><td>G2617</td><td>κατά + αἰσχύνη（羞恥）</td><td><b>使人蒙羞、使人失望丟臉</b></td><td>榮辱文化中的重話</td></tr><tr><td>澆灌</td><td>ἐκκέχυται</td><td>ekkechytai</td><td>G1632</td><td>ἐκ + χέω（倒）</td><td><b>完成被動式：已經被倒出來</b></td><td>見下</td></tr><tr><td>神的愛</td><td>ἡ ἀγάπη τοῦ θεοῦ</td><td>—</td><td>G26</td><td>—</td><td><b>神對我們的愛</b>（主詞所有格）</td><td>見下</td></tr><tr><td>賜給</td><td>δοθέντος</td><td>dothentos</td><td>G1325</td><td>δίδωμι</td><td><b>不定過去被動分詞：已經被賜下</b></td><td>已成的事實</td></tr></table>","gram":"<p>① ἐκκέχυται：完成被動式</p><pre>過去完成的動作 + 效果持續到現在</pre><p>不是「神的愛曾經澆灌過我們」。<br>是：那一桶已經倒下來了，而且到今天還是濕的。</p><p>② ἐκχέω 的舊約背景</p><p>這個字在七十士譯本中用於一個極重要的應許：</p><p><b>「以後，我要將我的靈</b>澆灌<b>凡有血氣的。」</b>（珥2:28；徒2:17引用）</p><p>保羅在5:5把「聖靈的澆灌」與「神的愛的澆灌」連在一起：<br>聖靈來的時候，帶來的第一樣東西，就是神的愛。</p><p>③「神的愛」是誰愛誰？</p><table><tr><th>讀法</th><th>意思</th></tr><tr><td><b>主詞所有格</b></td><td><b>神對我們的愛</b>（多數註釋、和合本語意）</td></tr><tr><td>受詞所有格</td><td>我們對神的愛</td></tr></table><p>支持「神對我們的愛」的決定性理由：</p><p>- <b>下一節（5:6–8）立刻展開解釋</b>：「惟有基督在我們還作罪人的時候為我們死，<b>神的愛</b>就在此向我們顯明了。」<br>- 保羅在5:8用同一個詞組 τὴν ἑαυτοῦ ἀγάπην（祂自己的愛）</p><p>這一節不是說「聖靈讓我更愛神了」，是說「聖靈讓我知道神多愛我」。</p><p>④ 這是羅馬書第一次正式提到聖靈的工作</p><p>羅馬書1–4章幾乎沒有講聖靈（2:29提過一次「在乎靈」）。</p><p>5:5是聖靈第一次以「賜下者」的身分出現，並且從第八章開始，聖靈將成為整卷書的主角（第8章提到聖靈約20次）。</p>","exp":"<p>弟兄姊妹，5:5回答了一個實際的問題：</p><p>「你說患難生忍耐、忍耐生老練、老練生盼望——<br>萬一到最後什麼都沒發生，那我不是空歡喜一場，很丟臉嗎？」</p><p>保羅說：「盼望不至於羞恥。」</p><p>為什麼？</p><p>因為在這條鏈子的終點之前，神已經先給了訂金。</p><p>祂沒有叫我們等到最後才知道祂愛我們。<br>祂把那份愛，現在就倒在我們心裡了。</p><p>【第三段｜5:6–8　神的愛的證據】</p>"},{"a":6,"z":6,"star":false,"grk":"<p>ἔτι γὰρ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.</p>","lit":"<p>「因為當我們<b>還</b>軟弱無力的時候，基督<b>就在那定準的時機</b>，為<b>不敬虔的人</b>死了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>還</td><td>ἔτι</td><td>eti</td><td>G2089</td><td><b>仍然、還在……的時候</b>（本節出現兩次）</td></tr><tr><td>軟弱</td><td>ἀσθενής</td><td>asthenēs</td><td>G772</td><td>ἀ + σθένος（力量）：<b>沒有力氣、無能為力</b></td></tr><tr><td>所定的日期</td><td>κατὰ καιρόν</td><td>kata kairon</td><td>G2540</td><td><b>按照那決定性的時機</b>（καιρός 是「時機」不是「時間長度」）</td></tr><tr><td>罪人</td><td>ἀσεβής</td><td>asebēs</td><td>G765</td><td><b>不敬虔的人</b>（見下）</td></tr></table>","gram":"<p>① ἀσεβής ——第三次出現的關鍵字</p><p>這個字我們已經追蹤了三章：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>1:18</b></td><td>神的忿怒顯明在一切<b>不虔</b>（ἀσέβεια）不義的人身上</td></tr><tr><td><b>4:5</b></td><td>只信稱<b>不敬虔的人</b>（ἀσεβῆ）為義的神</td></tr><tr><td><b>5:6</b></td><td>基督為<b>不敬虔的人</b>（ἀσεβῶν）死</td></tr></table><p>這是同一群人，走過了三站：</p><p>第一站：他們被神的忿怒對付。<br>第二站：他們被神稱為義。<br>第三站：原來是因為有人為他們死了。</p><p>② κατὰ καιρόν ——不是意外，是預定</p><p>καιρός 不是 χρόνος（時間的流逝），是「<b>那個對的時刻</b>」。</p><p>（加4:4「及至時候滿足，神就差遣他的兒子」）</p><p>十字架不是一場失控的悲劇，是一場準時的赴約。</p><p>③ ὑπέρ 的用法</p><p>ὑπέρ + 所有格 ＝「為了……的益處」「代替……」</p><p>在保羅書信中，這個介詞承載了代贖的意義。</p>","exp":"<p>保羅在5:6用了四個字形容我們當時的狀態，接下來三節還會再加：</p><table><tr><th>經文</th><th>我們當時是</th></tr><tr><td>5:6</td><td><b>軟弱的</b>（ἀσθενῶν）——沒有力氣自救</td></tr><tr><td>5:6</td><td><b>不敬虔的</b>（ἀσεβῶν）——不把神當神</td></tr><tr><td>5:8</td><td><b>罪人</b>（ἁμαρτωλῶν）——射不中靶的</td></tr><tr><td>5:10</td><td><b>仇敵</b>（ἐχθροί）——敵對神的</td></tr></table><p>四個詞，一個比一個重。</p><p>保羅像是怕我們不夠明白，所以一層一層加上去：<br>不只是軟弱，是不敬虔；不只是不敬虔，是罪人；不只是罪人，是仇敵。</p><p>而基督，就是在那個時候死的。</p>"},{"a":7,"z":8,"star":true,"grk":"<p>7 μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·<br>8 συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεός, ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.</p>","lit":"<p>7「因為幾乎沒有人會為一個<b>義人</b>死；不過為那<b>好人</b>，或許有人敢去死。」<br>8「但神卻<b>證實／擺出</b>祂自己對我們的愛：就是當我們<b>還是罪人</b>的時候，基督為我們死了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>少有的</td><td>μόλις</td><td>molis</td><td>G3433</td><td><b>勉強、幾乎不可能</b></td></tr><tr><td>義人</td><td>δίκαιος</td><td>dikaios</td><td>G1342</td><td>正直、無可指摘的人</td></tr><tr><td>仁人</td><td>ἀγαθός</td><td>agathos</td><td>G18</td><td><b>好人</b>（帶恩惠的、對你有恩的）</td></tr><tr><td>或者有敢做的</td><td>τάχα...τολμᾷ</td><td>tacha, tolmaō</td><td>G5029 / G5111</td><td>或許、有人<b>敢</b></td></tr><tr><td>顯明</td><td>συνίστησιν</td><td>synistēsin</td><td>G4921</td><td>σύν + ἵστημι：<b>擺在一起證實、當眾展示</b></td></tr></table>","gram":"<p>① δίκαιος 與 ἀγαθός 的區別</p><p>這是本節的解經關鍵。保羅為什麼用兩個不同的字？</p><table><tr><th>字</th><th>意思</th><th>你的反應</th></tr><tr><td><b>δίκαιος（義人）</b></td><td>正直、公正、無可指摘</td><td>你<b>尊敬</b>他，但不一定喜歡他</td></tr><tr><td><b>ἀγαθός（仁人）</b></td><td>良善、慷慨、對你有恩</td><td>你<b>愛戴</b>他，你欠他</td></tr></table><p>保羅的階梯是：</p><p>為一個「很正直的人」死？幾乎沒有人肯。<br>為一個「對我很好的人」死？也許有人敢。</p><p>那為一個「仇敵」死呢？</p><p>——保羅沒有把這句話說完。他直接跳到第8節。</p><p>② συνίστησιν 的驚人回音</p><p>這個字我們在3:5見過：</p><p>3:5「我們的不義若<b>顯出</b>（συνίστησιν）神的義來……」</p><p>同一個字。</p><p>人的不義「顯出」神的義（3:5）；<br>神的作為「顯出」神的愛（5:8）。</p><p>而συνίστημι 的字面是「<b>擺在一起讓人看</b>」——這是一個公開展示的動作。</p><p>這也呼應3:25 προέθετο（神把祂公開擺出來）。</p><p>③ 現在式 συνίστησιν</p><p>「神的愛就在此向我們顯明了」——是<b>現在式</b>。</p><p>十字架是兩千年前的事（ἀπέθανεν 不定過去式），<br>但那個展示是<b>現在進行式</b>。</p><p>十字架至今還立在那裡，天天在證明同一件事。</p><p>④ ἔτι ἁμαρτωλῶν ὄντων ἡμῶν 的語序</p><p>原文的語序是：「當<b>還是罪人</b>的、我們——基督為我們死了。」</p><p>「還是罪人」被提到最前面，是強調位置。</p>","exp":"<p>弟兄姊妹，5:8是全本聖經最有名的經文之一。但它的力量藏在5:7裡。</p><p>如果沒有第7節，第8節只是一句好聽的話。</p><p>有了第7節，第8節就變成了一記重錘。</p><p>因為第7節先建立了人類愛的天花板：</p><p>最高的極限，是為一個對我很好的人去死——而且還只是「或許有人敢」。</p><p>然後第8節說：神為祂的仇敵死。</p><p>這中間的距離，不是程度的差別，是種類的差別。</p><p>而更深的一層是：</p><p>神不是等我們變好了才愛我們。</p><p>祂是在我們最糟的時候，付出了最大的代價。</p><p>所以你今天狀態好不好，跟祂愛不愛你，<b>沒有關係</b>。<br>因為祂愛你的那一天，你比今天糟得多。</p><p>【第四段｜5:9–11　兩個「何況」】</p>"},{"a":9,"z":10,"star":true,"grk":"<p>9 πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι' αὐτοῦ ἀπὸ τῆς ὀργῆς.<br>10 εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·</p>","lit":"<p>9「那麼<b>何況更是</b>——我們既然現在已經在祂的血裡被稱義了，就必藉著祂從忿怒中被拯救。」<br>10「因為如果我們<b>還作仇敵</b>的時候，就藉著神兒子的死與神<b>和好</b>了；<b>何況更是</b>——既已和好，我們必<b>在祂的生命裡</b>得救。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>更要</td><td>πολλῷ μᾶλλον</td><td>pollō mallon</td><td>G4183/G3123</td><td>—</td><td><b>何況更是</b>（輕重論證）</td><td>全章的心跳</td></tr><tr><td>仇敵</td><td>ἐχθροί</td><td>echthroi</td><td>G2190</td><td>—</td><td><b>敵人、敵對者</b></td><td>不是「疏遠」，是「敵對」</td></tr><tr><td>和好</td><td>κατηλλάγημεν</td><td>katēllagēmen</td><td>G2644</td><td>κατά + ἀλλάσσω（交換）</td><td><b>被和好</b>（原意：貨幣兌換）</td><td>被動式：不是我去和好</td></tr><tr><td>因他的生</td><td>ἐν τῇ ζωῇ αὐτοῦ</td><td>—</td><td>G2222</td><td>—</td><td><b>在祂的生命裡</b></td><td>指復活與現今的代求</td></tr></table>","gram":"<p>★ πολλῷ μᾶλλον ——拉比的「輕重論證」</p><p>猶太解經有七條標準法則（希列七則），第一條就是 <b>קל וחומר（qal wachomer，輕與重）</b>：</p><p>「如果較小的情況成立，那較大的情況更成立。」</p><p>保羅在5:9–10做了兩次：</p><p>第一次（5:9）：</p><pre>【難的事已經做了】神使我們靠祂的血稱義（在我們還是罪人時）\n   ↓ 何況\n【容易的事】神會不救我們脫離將來的忿怒嗎？</pre><p>第二次（5:10）：</p><pre>【難的事已經做了】仇敵的時候，靠兒子的「死」與神和好\n   ↓ 何況\n【容易的事】既已和好，靠祂的「生」得救</pre><p>保羅的論證極其有力：</p><p>如果神在我們是<b>仇敵</b>的時候，付了<b>祂兒子的命</b>——<br>那祂現在我們是<b>兒女</b>了，會捨不得給我們什麼？</p><p>（這正是8:32的預告：「神既不愛惜自己的兒子……豈不也把萬物和他一同白白地賜給我們嗎？」）</p><p>★ 「死」與「生」的對照</p><p>5:10有一個常被忽略的精彩對比：</p><pre>藉著神兒子的「死」  →  得與神和好      【過去】\n因他的「生」        →  得救           【現在與將來】</pre><p>十字架完成了和好；復活的生命完成了保守。</p><p>祂死，把我從仇敵變成兒女；<br>祂活，把我從兒女保守到底。</p><p>這正是來7:25：「凡靠著他進到神面前的人，他都能拯救到底；因為他是長遠活著，替他們祈求。」</p><p>★ κατηλλάγημεν 是被動式</p><p>「得與神和好」——不是「我們去跟神和好」，是「<b>我們被和好了</b>」。</p><p>和好的主動者是神。<br>林後5:19：「神在基督裡叫世人與自己和好。」</p><p>不是我們消了神的氣，是神自己來消除那道敵意。</p>","exp":"<p>弟兄姊妹，5:9–10回答了一個非常實際的問題：</p><p>「我信主了，可是我還是會跌倒。我會不會又掉下去？」</p><p>保羅的回答不是「你要更努力」。</p><p>保羅的回答是一個邏輯：</p><p>想想神在你最糟的時候做了什麼。</p><p>祂在你是<b>仇敵</b>的時候，付出了<b>祂兒子的命</b>。</p><p>祂現在會為了你這禮拜的失敗，把那一切收回去嗎？</p><p>這就是「何況」的力量。</p><p>確據不是建立在「我覺得我還可以」上面。<br>確據是建立在「祂已經做過那件更難的事」上面。</p>"},{"a":11,"z":11,"star":false,"grk":"<p>οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δι' οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.</p>","lit":"<p>「不僅如此，我們也<b>在神裡面誇口</b>，藉著我們的主耶穌基督——藉著祂，我們<b>如今已經領受了</b>那和好。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>以神為樂</td><td>καυχώμενοι ἐν τῷ θεῷ</td><td>—</td><td>G2744</td><td><b>在神裡面誇口</b></td></tr><tr><td>和好</td><td>καταλλαγή</td><td>katallagē</td><td>G2643</td><td>和好（名詞）；林後5:18–19「和好的職分／道理」同字</td></tr><tr><td>領受</td><td>ἐλάβομεν</td><td>elabomen</td><td>G2983</td><td><b>不定過去式：已經領受了</b>（是禮物，不是賺的）</td></tr></table>","gram":"<p>① 第三次「誇口」，也是最高的一次</p><pre>5:2   誇口在「盼望神的榮耀」上   —— 誇將來\n5:3   誇口在「患難」中           —— 誇現在\n5:11  誇口「在神裡面」           —— 誇神自己</pre><p>保羅的三重誇口，一層比一層深。</p><p>最後一層不是誇神給我的東西，是誇<b>神自己</b>。</p><p>② ἐλάβομεν（領受）——不是達成，是領受</p><p>和好是<b>被領受</b>的，不是<b>被完成</b>的。</p>","exp":"<p>弟兄姊妹，5:11是5:1–11的收尾，而它把整段拉到最高處。</p><p>前面講了很多好處：相和、進入、盼望、忍耐、老練、免去忿怒、得救……</p><p>然後保羅說：不但如此——</p><p>最好的禮物，不是這些禮物。</p><p>最好的禮物是<b>送禮物的那一位</b>。</p><p>「以神為樂」——這是稱義的終極目的。</p><p>神救我們，不是為了讓我們有一個更好的人生，是為了讓我們得著祂自己。</p><p>【第五段｜5:12–14　一個人帶進來的】</p>"},{"a":12,"z":12,"star":true,"grk":"<p>Διὰ τοῦτο ὥσπερ δι' ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν, ἐφ' ᾧ πάντες ἥμαρτον·</p>","lit":"<p>「為此緣故，正如藉著<b>一個人</b>，罪<b>進入</b>了世界，又藉著罪，死也進入了；於是死就<b>貫穿臨到</b>所有的人——<b>因為</b>（／在其中）眾人都犯了罪……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>一人</td><td>ἑνὸς ἀνθρώπου</td><td>henos anthrōpou</td><td>G1520</td><td>εἷς（一）</td><td><b>一個人</b></td><td>5:12–19出現12次「一」</td></tr><tr><td>入了</td><td>εἰσῆλθεν</td><td>eisēlthen</td><td>G1525</td><td>εἰς + ἔρχομαι</td><td><b>進來、闖入</b></td><td>罪像入侵者</td></tr><tr><td>臨到</td><td>διῆλθεν</td><td>diēlthen</td><td>G1330</td><td>διά + ἔρχομαι</td><td><b>貫穿、蔓延過去</b></td><td>死像瘟疫擴散</td></tr><tr><td>因為</td><td>ἐφ' ᾧ</td><td>eph' hō</td><td>—</td><td>ἐπί + 關係代名詞</td><td><b>本節最大的解經爭議</b></td><td>見下</td></tr></table>","gram":"<p>① 兩個複合動詞的畫面</p><pre>罪：εἰσῆλθεν（εἰς 進入）—— 從外面闖進來\n死：διῆλθεν（διά 貫穿）—— 進來之後蔓延到每一個角落</pre><p>保羅畫的是一幅瘟疫圖：罪是病毒，從一個門進來；死是症狀，蔓延到每一個人身上。</p><p>② ★ ἐφ' ᾧ 的四種理解</p><p>這兩個字，決定了整個「原罪論」的形狀。福音派內部有合理的不同看法，必須公平列出。</p><table><tr><th>理解</th><th>譯法</th><th>意思</th><th>代表</th></tr><tr><td><b>A. 因果</b>（多數現代學者）</td><td>「<b>因為</b>」</td><td>死臨到眾人，因為眾人都犯了罪</td><td>和合本；多數現代註釋</td></tr><tr><td><b>B. 在他裡面</b></td><td>「<b>在他（亞當）裡面</b>」</td><td>眾人在亞當裡犯了罪</td><td>奧古斯丁（根據拉丁文武加大譯本 in quo）</td></tr><tr><td><b>C. 結果</b></td><td>「<b>以致於</b>」</td><td>死臨到眾人，以致於眾人都犯罪</td><td>部分東方教父</td></tr><tr><td><b>D. 條件／根據</b></td><td>「<b>在這條件下</b>」</td><td>綜合性理解</td><td>Fitzmyer 等</td></tr></table><p>關於B（奧古斯丁的理解）的誠實說明：</p><p>拉丁文武加大譯本把 ἐφ' ᾧ 譯為 <b>in quo</b>（「在他裡面」），奧古斯丁據此建立了「我們都在亞當裡犯了罪」的原罪論。</p><p>但從希臘文文法看，ἐφ' ᾧ 譯作「在他裡面」是<b>困難的</b>（ἐπί 通常不表示「在……裡面」，那是 ἐν）。</p><p>多數現代學者（包括改革宗學者如 Murray、Moo、Schreiner）都承認：奧古斯丁的<b>翻譯</b>有問題，但他的<b>神學結論</b>未必錯——因為那個結論是從5:13–19的整體論證得出的，不是只靠 ἐφ' ᾧ 這兩個字。</p><p>③ 那麼，我們到底是怎麼「在亞當裡」的？</p><p>福音派內部有兩種主要模型（都認信原罪，只是解釋機制不同）：</p><table><tr><th>模型</th><th>主張</th><th>比喻</th><th>代表</th></tr><tr><td><b>聯邦元首說</b>（federal headship）</td><td>亞當是全人類的<b>法定代表</b>，他的行為在法律上算作我們的</td><td>一國元首簽了宣戰書，全國就進入戰爭狀態</td><td>Hodge、Berkhof、多數改革宗</td></tr><tr><td><b>實存元首說</b>（seminal/realistic headship）</td><td>全人類在生理與存在上<b>都在亞當裡面</b>，所以真的一同犯了罪</td><td>利未在亞伯拉罕身上納了十分之一（來7:9–10）</td><td>Shedd、奧古斯丁傳統</td></tr></table><p>保羅本人比較接近哪一種？</p><p>從5:12–19的論證形態看，「聯邦元首說」較貼合經文——因為保羅的整個對稱是<b>代表性的</b>：</p><p>「因一人的悖逆，眾人成為罪人；照樣，因一人的順從，眾人也成為義了。」（5:19）</p><p>如果我們是因為「實際在亞當裡犯了罪」才算為罪人，那按對稱邏輯，我們也必須「實際在基督裡行了義」才算為義——<br>但保羅前面四章講得很清楚：我們的義是<b>算</b>給我們的（4:3–8），不是我們實際做的。</p><p>所以：</p><p>兩邊都是<b>代表</b>：一個代表使我落入定罪；另一個代表使我被算為義。<br>這個對稱，正是第四章「算」（λογίζομαι）的宇宙版本。</p><p>講台誠信提醒：這兩種模型都是正統的福音派立場，不可把其中一種說成唯一答案，也不可暗示持另一種看法的人不信原罪。</p><p>④ 5:12是一個「說到一半停住」的句子</p><p>「這就如（ὥσπερ）……」——但「照樣（οὕτως）」呢？</p><p>沒有出現。保羅停住了，插入5:13–17的解釋，直到5:18才把句子補完。</p>","exp":"<p>弟兄姊妹，5:12丟出了一個現代人最不喜歡的觀念：</p><p>我的處境，不完全是我自己造成的。</p><p>現代文化最核心的信念之一是「個人主義」——我為我自己負責，別人的事跟我無關。</p><p>但保羅說：</p><p>在你出生之前，有一件事已經決定了你的處境。</p><p>這聽起來不公平嗎？</p><p>保羅的回答是：</p><p>如果你不接受「一個人可以代表全人類」——<br>那你也就同時放棄了另一個人可以代表你。</p><p>反對亞當代表你，就是反對基督代表你。</p><p>而福音的整個結構，就建立在「一個人代表眾人」上面。</p>"},{"a":13,"z":14,"star":false,"grk":"<p>13 ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,<br>14 ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.</p>","lit":"<p>13「因為直到律法（賜下）之前，罪已經在世上；但在沒有律法的時候，罪<b>不被記帳</b>。」<br>14「然而死<b>作了王</b>，從亞當直到摩西——甚至臨到那些沒有按亞當<b>跨越界線</b>那樣犯罪的人身上。亞當乃是那<b>將要來者</b>的<b>預像</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>算罪</td><td>ἐλλογεῖται</td><td>ellogeitai</td><td>G1677</td><td>ἐν + λόγος</td><td><b>記入帳中</b></td><td><b>與第四章 λογίζομαι 同字根！</b></td></tr><tr><td>作了王</td><td>ἐβασίλευσεν</td><td>ebasileusen</td><td>G936</td><td>βασιλεύς（王）</td><td><b>登基作王、掌權</b></td><td>本章關鍵字（5次）</td></tr><tr><td>過犯</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω</td><td><b>跨越明確的界線</b></td><td>4:15同字</td></tr><tr><td>預像</td><td>τύπος</td><td>typos</td><td>G5179</td><td>τύπτω（打、印）</td><td><b>模子打出來的印記、預表</b></td><td>見下</td></tr></table>","gram":"<p>① ἐλλογέω ——第四章的字在這裡回來了</p><p>這個字（ἐν + λόγος）的意思是「記入帳中」，與 λογίζομαι 同一家族。</p><p>而它在新約只出現兩次：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>腓利門書1:18</b></td><td>「他若虧負你，或欠你什麼，都<b>歸在我的帳上</b>（ἐμοὶ ἐλλόγα）」</td></tr><tr><td><b>羅5:13</b></td><td>「但沒有律法，罪也<b>不算罪</b>（οὐκ ἐλλογεῖται）」</td></tr></table><p>保羅一生只用了兩次這個字。<br>一次說「這筆帳記在我身上」，一次說「那時候的罪沒有記帳」。</p><p>② 5:13–14的論證邏輯</p><p>保羅在回答一個可能的反駁：「你說死是因為罪。但摩西之前沒有律法，那時候的罪不算罪，為什麼那時候的人也會死？」</p><p>保羅的回答：</p><pre>事實：從亞當到摩西，人都死了\n但：那時沒有律法（罪不記帳）\n所以：他們的死，不是因為他們自己「跨越界線」\n結論：他們的死，來自亞當</pre><p>保羅用「摩西之前的人也死」這個歷史事實，證明了死是從亞當來的。</p><p>這是全章最縝密的一段推理。</p><p>③「連那些不與亞當犯一樣罪過的」是誰？</p><p>指的是<b>沒有像亞當那樣違背一條明確誡命</b>的人（亞當有一條清楚的禁令：分別善惡樹的果子不可吃）。</p><p>這包括嬰孩嗎？經文沒有明說，但這節經文在歷史上確實被用於討論嬰孩死亡的問題。</p><p>講台誠信提醒：保羅在此的重點是論證「死來自亞當」，不是在建立嬰孩論。不宜過度延伸。</p><p>④ τύπος（預像）的重量</p><p>τύπος 的字面是「打擊留下的印記」（如約20:25多馬說的「釘痕」用同字）。</p><p>引申為：一個模子打出來的形狀。</p><p>保羅說：亞當是「那以後要來之人」的預像。</p><p>注意方向：不是基督像亞當，是<b>亞當像基督</b>。</p><p>神在造第一個人的時候，心裡想的就是第二個人。</p><p>這是全本聖經最深的一句話之一：<b>亞當從一開始就是為了指向基督而被造的</b>。</p>","exp":"<p>弟兄姊妹，這兩節看起來像是插入的技術性說明，其實是全章論證的<b>關鍵支點</b>。</p><p>保羅要證明的是：<b>死不是你一個人的問題，是全人類的問題</b>。</p><p>而他的證據，是一段<b>歷史</b>：</p><p>從亞當到摩西，那段沒有律法的日子——</p><p>人還是<b>死了</b>。</p><p>如果死只是「個人犯罪的報應」，那沒有律法可犯的時候，人不該死。</p><p>但他們死了。</p><p>所以死的來源，比個人的行為<b>更深</b>。</p><p><b>經文本身明確表達的：</b> 沒有律法時罪不「記帳」，但死仍然作王；可見死的根源在亞當，不在個人的違例。</p><p><b>可以合理推論的：</b> 這正是「有己」不是一種壞習慣、而是一種<b>遺傳的處境</b>的聖經根據。</p><p>人不是因為犯罪才成為罪人；人是因為是罪人，才犯罪。</p><p>而14節最後那半句，把整段的方向翻轉了：</p><p>「亞當乃是那<b>以後要來之人</b>的預像。」</p><p>弟兄姊妹，保羅講了半天亞當——</p><p>然後他說：這個人，是為了讓你看見<b>另一個人</b>。</p><p><b>⚠ 講台誠信提醒：</b> 5:12「眾人都犯了罪」的 ἐφ' ᾧ 譯法、以及原罪傳遞的方式（歸算說／實在說），<br><b>敬虔的學者有不同理解，不宜在台上裁決。</b>（見第二十部分）</p><p>【第六段｜5:15–17　三個「不如」與兩個「何況」】</p>"},{"a":15,"z":17,"star":false,"grk":"<p>15 …πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.<br>17 …πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.</p>","lit":"<p>「若因那一人的過犯，死就藉著那一人作了王——<b>何況更是</b>：那些<b>領受</b>了恩典之豐盛與義之<b>白白恩賜</b>的人，必要<b>在生命中作王</b>，藉著那一位耶穌基督。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>恩賜</td><td>χάρισμα</td><td>charisma</td><td>G5486</td><td>χάρις（恩典）+ -μα：<b>恩典的具體產物</b></td></tr><tr><td>賞賜</td><td>δωρεά</td><td>dōrea</td><td>G1431</td><td><b>白白的禮物</b>（4:4 δωρεάν 的名詞）</td></tr><tr><td>更加倍地臨到</td><td>ἐπερίσσευσεν</td><td>eperisseusen</td><td>G4052</td><td>περισσεύω：<b>滿溢出來、多到滿出邊界</b></td></tr><tr><td>洪恩</td><td>περισσεία τῆς χάριτος</td><td>perisseia</td><td>G4050</td><td><b>恩典的滿溢</b></td></tr><tr><td>領受</td><td>λαμβάνοντες</td><td>lambanontes</td><td>G2983</td><td>現在分詞：<b>正在領受的人</b></td></tr><tr><td>作王</td><td>βασιλεύσουσιν</td><td>basileusousin</td><td>G936</td><td><b>未來式：他們必要作王</b></td></tr></table>","gram":"<p>★ 亮光一：「不如」不是「相似」，是「遠遠不及」</p><p>5:15「只是過犯<b>不如</b>恩賜」——原文是 ἀλλ' οὐχ ὡς…οὕτως καί（「但不是像……那樣」）。</p><p>保羅怕我們把亞當與基督讀成一個對等的天平。</p><p>所以他連續三次強調：不一樣，不一樣，不一樣。</p><p>不是兩邊一樣重。是一顆石子與一座山。</p><p>★ 亮光二：不對稱在哪裡？（5:16）</p><p>「審判是<b>由一人</b>而定罪，恩賜乃是<b>由許多過犯</b>而稱義。」</p><pre>定罪：一次過犯 → 定罪\n稱義：無數過犯 → 稱義</pre><p>這是全章最不對稱的一點：</p><p>一次的犯罪，就足以定罪。<br>但恩典要處理的，是幾千年、幾十億人、無法計數的過犯——<br>而它處理得完。</p><p>一顆火柴可以燒掉一棟房子；但要重建那棟房子，需要的遠遠不只一根木頭。<br>恩典做的，是重建。</p><p>★ 亮光三：5:17的驚人不對稱</p><p>照對稱邏輯，5:17應該說：</p><p>「死作了王……照樣，<b>生命</b>也作王。」</p><p>但保羅沒有這樣寫。他寫的是：</p><p>「何況那些受洪恩又蒙所賜之義的，豈不更要……<b>在生命中作王</b>嗎？」</p><p>主詞換了！</p><pre>【亞當這邊】死 作王   →  我們是被統治的\n【基督這邊】我們 作王  →  我們是統治的</pre><p>弟兄姊妹，這是全章最溫暖的一個文法細節。</p><p>罪作王的時候，我們是奴隸。<br>但恩典作王的時候，我們不是換一個主人——</p><p>我們也一同作王。</p><p>（這正是啟20:6、22:5「他們要作王，直到永永遠遠」的預告）</p><p>★ 亮光四：λαμβάνοντες（領受的人）</p><p>5:17的「受洪恩又蒙所賜之義的」——原文是「<b>那些正在領受</b>的人」。</p><p>這個現在分詞是全段的鑰匙：</p><p>在亞當裡，我們<b>不需要做什麼</b>就進去了（出生就在裡面）。<br>在基督裡，我們要<b>領受</b>。</p><p>這也是5:18「眾人」不等於普救論的關鍵（見第二十部分）。</p>","exp":"<p>弟兄姊妹，5:15–17回答了一個潛在的恐懼：</p><p>「亞當的影響力那麼大，我怎麼跑得掉？」</p><p>保羅的回答是：</p><p>你的問題問反了。</p><p>問題不是「亞當的影響力有多大」，而是「基督的影響力大多少」。</p><p>而答案是：多太多了。</p><p>保羅用了三個「不如」和兩個「何況」，就是要把這件事釘死：</p><p>這不是拔河。這不是勢均力敵的兩股勢力。</p><p>這是一顆石子丟進海裡。</p><p>【第七段｜5:18–19　句子補完】</p>"},{"a":18,"z":19,"star":false,"grk":"<p>18 Ἄρα οὖν ὡς δι' ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι' ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·<br>19 ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.</p>","lit":"<p>18「所以，正如藉著<b>一次過犯</b>，臨到所有人的是<b>定罪</b>；照樣，藉著<b>一次義行</b>，臨到所有人的是<b>生命的稱義</b>。」<br>19「因為正如藉著那一人的<b>不聽</b>，眾人被<b>設立為</b>罪人；照樣，藉著那一位的<b>順從</b>，眾人也將被<b>設立為</b>義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>義行</td><td>δικαίωμα</td><td>dikaiōma</td><td>G1345</td><td>δίκαιος</td><td><b>合乎義的行為／判決</b></td><td>指基督的順服至死</td></tr><tr><td>稱義得生命</td><td>δικαίωσις ζωῆς</td><td>dikaiōsis zōēs</td><td>G1347</td><td>—</td><td><b>導致生命的稱義宣告</b></td><td>4:25同字</td></tr><tr><td>悖逆</td><td>παρακοή</td><td>parakoē</td><td>G3876</td><td>παρά + ἀκούω（聽）</td><td><b>聽偏了、不肯聽</b></td><td>見下</td></tr><tr><td>順從</td><td>ὑπακοή</td><td>hypakoē</td><td>G5218</td><td>ὑπό + ἀκούω</td><td><b>在底下聽、聽從</b></td><td>見下</td></tr><tr><td>成為</td><td>κατεστάθησαν</td><td>katestathēsan</td><td>G2525</td><td>καθίστημι</td><td><b>被設立、被指派</b>（法律／任命用語）</td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：παρακοή 與 ὑπακοή ——都是「聽」</p><p>兩個字的字根都是 ἀκούω（聽）：</p><pre>παρακοή （παρά 旁邊 + 聽）  = 聽偏了、聽到旁邊去了 → 悖逆\nὑπακοή  （ὑπό  底下 + 聽）  = 在底下聽 → 順從</pre><p>中文譯「悖逆」與「順從」，看不出這是同一個字根。</p><p>但原文告訴我們一件極重要的事：</p><p>罪的本質，是<b>聽的問題</b>。<br>順服的本質，也是<b>聽的問題</b>。</p><p>回到伊甸園：亞當犯罪的那一刻，發生了什麼？</p><p>創3:17：「你既<b>聽從</b>妻子的話……」</p><p>他不是沒有聽。他是<b>聽錯了對象</b>。</p><p>而基督呢？</p><p>賽50:5（僕人之歌）：「主耶和華開通我的耳朵，我並沒有違背，也沒有退後。」</p><p>來5:8：「他雖然為兒子，還是因所受的苦難學了<b>順從</b>（ὑπακοή）。」</p><p>一個園子裡，一個人聽錯了。<br>另一個園子裡（客西馬尼），一個人聽對了。</p><p>★ 亮光二：καθίστημι ——被「設立」為</p><p>「成為罪人」「成為義了」，原文是 καθίστημι——</p><p>這個字的意思是「<b>設立、指派、任命</b>」，是法律與行政用語。</p><p>（徒6:3「我們就可以<b>派</b>他們管理這事」；來5:1「凡從人間挑選的大祭司，是奉<b>派</b>替人辦理」——同字）</p><p>保羅沒有說「眾人變成了罪人」（性情的描述），<br>他說「眾人<b>被設立為</b>罪人」（地位的宣告）。</p><p>這與第四章的「算」（λογίζομαι）完全一致——是法庭語言，不是心理學語言。</p><p>而19節下半是<b>未來式被動</b>（κατασταθήσονται）：</p><p>「眾人也將被設立為義。」</p><p>稱義已經開始，但完全的宣告指向那日。</p><p>★ 亮光三：「一次的義行」是什麼？</p><p>δικαίωμα 在此可指：</p><p>1. <b>基督整個順服的一生</b>（多數註釋）<br>2. <b>十字架這一個具體的行動</b></p><p>5:19的「順從」（ὑπακοή）支持第一種：是祂一生的順服，在十字架達到頂點。</p><p>腓2:8：「既有人的樣子，就自己卑微，存心<b>順服</b>，以至於死，且死在十字架上。」</p>","exp":"<p>弟兄姊妹，5:18–19終於把5:12那個停住的句子補完了。</p><p>而補完之後，整幅圖畫出現了：</p><pre>亞當              基督\n一個動作      一次過犯          一次義行\n本質          聽偏了            聽從了\n結果          被設立為罪人      被設立為義\n臨到          所有人            所有領受的人\n統治          死作王            我們作王</pre><p>而這幅圖畫最重要的信息是：</p><p>你的地位，不是靠你的表現決定的，是靠你屬於哪一個人決定的。</p><p>這就是為什麼保羅一定要講這一段。</p><p>因為如果我的稱義是靠我的表現，那我每天都在風險中。</p><p>但如果我的稱義是靠<b>祂</b>的表現——</p><p>那我就穩了。因為祂不會失敗。</p><p>【第八段｜5:20–21　律法的位置與恩典的作王】</p>"},{"a":20,"z":20,"star":true,"grk":"<p>νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,</p>","lit":"<p>「而律法<b>溜了進來</b>，為要使過犯<b>增多</b>；但罪在哪裡增多，恩典就<b>超級加倍地滿溢</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>外添的</td><td>παρεισῆλθεν</td><td>pareisēlthen</td><td>G3922</td><td>παρά + εἰς + ἔρχομαι</td><td><b>從旁邊溜進來、插進來</b></td><td>見下</td></tr><tr><td>顯多</td><td>πλεονάσῃ</td><td>pleonasē</td><td>G4121</td><td>πλέον（更多）</td><td><b>增多、變多</b></td><td>假設語氣</td></tr><tr><td>更顯多</td><td>ὑπερεπερίσσευσεν</td><td>hypereperisseusen</td><td>G5248</td><td><b>ὑπέρ + ἐκ + περισσεύω</b></td><td><b>超級—加倍—滿溢</b></td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：παρεισέρχομαι ——律法是「插進來」的</p><p>這個複合動詞由三部分組成：παρά（旁邊）+ εἰς（進入）+ ἔρχομαι（來）。</p><p>意思是：<b>從旁邊插進來、加進來</b>。</p><p>保羅在說：律法不是主線劇情。</p><p>主線是：亞當 → 基督。<br>律法是中間<b>插進來的一段</b>，有它的任務，但它不是主角。</p><p>（加3:19「這樣說來，律法是為什麼有的呢？原是為過犯添上的」——同一個神學）</p><p>★ 亮光二：ὑπερεπερίσσευσεν ——保羅造的一個字</p><p>這個動詞是保羅疊了三層前綴造出來的：</p><pre>περισσεύω     = 滿溢、有餘\nἐκπερισσεύω   = 加倍滿溢\nὑπερεκπερισσεύω / ὑπερπερισσεύω = 超級加倍滿溢</pre><p>在新約中，這個字只出現兩次（羅5:20；林後7:4）。</p><p>保羅在描述罪的時候，用的是 πλεονάζω（增多）。<br>在描述恩典的時候，他覺得普通的字不夠用——</p><p>所以他自己疊了一個字出來。</p><p>中文「更顯多」譯得已經很努力了，但原文的語氣是：</p><p>罪加了一級；恩典直接爆表。</p><p>★ 亮光三：「叫過犯顯多」的 ἵνα ——目的還是結果？</p><p>這是本節的第二個爭議：ἵνα 是「為要」（目的）還是「以致」（結果）？</p><p>若是目的，那神是故意讓罪增多的嗎？</p><p>保羅的意思應該理解為：</p><p>律法的功能，是把罪從「模糊的病」變成「清楚的罪狀」（4:15 παράβασις）。</p><p>它不製造罪，它<b>顯明</b>罪、<b>加重</b>罪的性質。</p><p>而這個「顯明」，正是為了讓人知道自己需要恩典（3:20「律法本是叫人知罪」）。</p><p>醫生開檢查單，不是為了讓你生病，是為了讓你知道你已經病了、而且有多重。</p>","exp":"<p>弟兄姊妹，5:20是全章最讓人鬆一口氣、也最容易被濫用的一節。</p><p>「罪在哪裡顯多，恩典就更顯多了。」</p><p>這句話對正在罪疚中的人，是天大的好消息。</p><p>但保羅立刻就知道有人會怎麼用它。所以6:1開頭就是：</p><p>「這樣，怎麼說呢？我們可以仍在罪中，叫恩典顯多嗎？」<br>「斷乎不可！」</p><p>這句話是給<b>跌倒的人爬起來</b>用的，不是給<b>要去跌倒的人找藉口</b>用的。</p>"},{"a":21,"z":21,"star":false,"grk":"<p>ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.</p>","lit":"<p>「為要叫——正如罪在死中<b>作了王</b>；照樣，恩典也要<b>作王</b>，藉著義，以致於永生，藉著我們的主耶穌基督。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>作王</td><td>βασιλεύω</td><td>basileuō</td><td>G936</td><td>登基掌權（本章第5次）</td></tr><tr><td>藉著義</td><td>διὰ δικαιοσύνης</td><td>dia dikaiosynēs</td><td>G1343</td><td><b>恩典的統治途徑是「義」</b></td></tr></table>","gram":"<p>① βασιλεύω 在第五章的五次旅程</p><table><tr><th>出處</th><th>誰作王</th></tr><tr><td>5:14</td><td><b>死</b>作了王（從亞當到摩西）</td></tr><tr><td>5:17上</td><td><b>死</b>因這一人作了王</td></tr><tr><td>5:17下</td><td><b>我們</b>要在生命中作王</td></tr><tr><td>5:21上</td><td><b>罪</b>作王叫人死</td></tr><tr><td>5:21下</td><td><b>恩典</b>作王，叫人得永生</td></tr></table><p>整章的主題，其實是一個王位的問題。</p><p>誰在作王？</p><p>② διὰ δικαιοσύνης（藉著義）的重要性</p><p>這半句常被忽略，卻極其重要。</p><p>恩典作王，不是繞過義，是<b>藉著義</b>。</p><p>這正是3:26的迴響：「使人知道他自己為義，也稱信耶穌的人為義。」</p><p>恩典不是把公義踢到一邊。恩典是走過公義的那條路來到我們這裡的。</p>","exp":"<p>弟兄姊妹，第五章是以「王」結尾的。</p><p>這一點很重要，因為它把整章拉回了一個主權的問題。</p><pre>【亞當的國度】罪作王 → 人是奴隸 → 結局是死\n【基督的國度】恩典作王 → 人也作王 → 結局是永生</pre><p>保羅不是在講兩種人生態度，是在講兩個國度。</p><p>而每一個人，都活在其中一個裡面。</p>"}],"6":[{"a":1,"z":1,"star":false,"grk":"<p>Τί οὖν ἐροῦμεν; ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;</p>","lit":"<p>「那麼我們要說什麼呢？我們要<b>繼續住在</b>罪裡，好叫恩典增多嗎？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>仍在</td><td>ἐπιμένωμεν</td><td>epimenōmen</td><td>G1961</td><td>ἐπί + μένω（住）</td><td><b>繼續住下去、賴著不走</b></td><td>不是偶爾去，是<b>住在那裡</b></td></tr><tr><td>罪</td><td>ἁμαρτίᾳ</td><td>hamartia</td><td>G266</td><td>—</td><td>罪（單數、帶冠詞）</td><td><b>指罪的權勢，不只是罪行</b></td></tr><tr><td>顯多</td><td>πλεονάσῃ</td><td>pleonasē</td><td>G4121</td><td>πλέον（更多）</td><td>增多</td><td>直接引用5:20</td></tr></table>","gram":"<p>① ἐπιμένω 的畫面</p><p>這個字不是「犯罪」，是「<b>住在</b>罪裡」。</p><p>（徒10:48「就請彼得<b>住</b>了幾天」；西1:23「只要你們在所信的道上<b>恆心</b>」——同字）</p><p>保羅提出的問題不是「基督徒會不會偶爾跌倒」，<br>而是「基督徒可不可以<b>把罪當成住址</b>」。</p><p>② ἐπιμένωμεν 是假設語氣（deliberative subjunctive）</p><p>這種語氣在希臘文中用於<b>自問自答式的商議</b>：「我們是不是該……？」</p><p>保羅不是在轉述別人的話，他是在<b>替讀者把心裡那個念頭說出來</b>。</p><p>這是論辯體（diatribe）的手法——他知道你在想什麼。</p><p>③ 帶冠詞的 τῇ ἁμαρτίᾳ</p><p>第六章的「罪」幾乎都是<b>單數、帶冠詞</b>——保羅把「罪」<b>擬人化</b>了。</p><p>在本章中，「罪」是一個<b>角色</b>：它作王（6:12）、它作主（6:14）、它有奴隸（6:16–20）、它付薪水（6:23）。</p><p>保羅不是在講「一些不好的行為」。<br>他是在講一個<b>主人</b>。</p>","exp":"<p>弟兄姊妹，這個問題不是保羅捏造出來的稻草人。</p><p>這是他一直被指控的事——3:8已經說了：「這是毀謗我們的人說我們有這話。」</p><p>而這個問題會出現，恰恰證明保羅的福音講對了。</p><p>如果你講恩典，從來沒有人誤會你在鼓勵放縱——<br>那你可能還沒有真的把恩典講出來。</p><p>只有當恩典被講到「白白的、不需要任何條件」的地步，這個誤會才會產生。</p><p>保羅不是要收回那個「白白」，他是要證明：真正領受的人，不會想回去。</p>"},{"a":2,"z":2,"star":true,"grk":"<p>μὴ γένοιτο. οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;</p>","lit":"<p>「絕不可能！我們這些<b>已經向罪死了</b>的人，怎麼還能<b>在其中活著</b>呢？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>斷乎不可</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td><b>願它絕不發生！</b> 希臘文最強的否定</td></tr><tr><td>死了</td><td>ἀπεθάνομεν</td><td>apethanomen</td><td>G599</td><td><b>不定過去式：已經死了</b>（一次完成的事件）</td></tr><tr><td>在罪上</td><td>τῇ ἁμαρτίᾳ</td><td>—</td><td>G266</td><td><b>關係與格：向著罪、就罪而言</b></td></tr><tr><td>豈可</td><td>πῶς</td><td>pōs</td><td>G4459</td><td><b>怎麼可能</b>（不是「不應該」，是「怎麼做得到」）</td></tr></table>","gram":"<p>★ 亮光一：πῶς 不是「不應該」，是「怎麼可能」</p><p>這是全章最容易被讀漏的一個字。</p><p>中文「豈可」聽起來像道德勸誡：「你怎麼可以這樣！」</p><p>但希臘文 πῶς 的重點是：「<b>這在邏輯上怎麼行得通？</b>」</p><p>保羅不是在說：「你不應該住在罪裡。」<br>保羅是在說：「<b>一個死人，怎麼可能還住在那裡？</b>」</p><p>這是一個關於<b>可能性</b>的問句，不是關於<b>責任</b>的問句。</p><p>★ 亮光二：ἀπεθάνομεν 是不定過去式</p><p>「死了」是<b>已經完成的事件</b>，不是一個要努力達成的目標。</p><p>保羅沒有說：「你要向罪死。」<br>保羅說：「你<b>已經</b>向罪死了。」</p><p>這是本章與許多屬靈教導最大的差別。</p><table><tr><th>常見的教導</th><th>保羅的教導</th></tr><tr><td>「你要治死你的老我」</td><td>「你的舊人<b>已經</b>同釘十字架了」（6:6）</td></tr><tr><td>「你要向罪死」</td><td>「你<b>已經</b>向罪死了」（6:2）</td></tr><tr><td>追求一個要達到的境界</td><td>認清一個已成的事實</td></tr></table><p>★ 亮光三：τῇ ἁμαρτίᾳ 是「關係與格」</p><p>「向罪死了」——不是「因為罪而死」，是「<b>就罪這個關係而言，死了</b>」。</p><p>這個文法結構在6:10、6:11再次出現：</p><pre>6:10  他死是「向罪」（τῇ ἁμαρτίᾳ）死了\n      他活是「向神」（τῷ θεῷ）活著\n6:11  你們「向罪」當看自己是死的\n      「向神」當看自己是活的</pre><p>「向……死」的意思是：<b>那個關係結束了，那一方對你不再有法律上的權柄</b>。</p><p>就像一個人死了之後，債主不能再向他追討。</p><p>★ 亮光四：「向罪死」不等於「感覺不到罪的吸引」</p><p>這是必須立刻澄清的，否則整章會被誤讀。</p><p>如果「向罪死了」的意思是「不再有犯罪的慾望」，那6:12–13的命令就是多餘的——</p><p>保羅在6:12說：「不要容罪在你們必死的身上<b>作王</b>。」</p><p>既然要命令「不要容它作王」，就表示<b>它還會來爭奪王位</b>。</p><p>「向罪死」是<b>法律地位的改變</b>，不是<b>感覺經驗的消失</b>。</p>","exp":"<p><b>經文本身明確表達的：</b> 信徒已經向罪死了，因此繼續住在罪中在邏輯上是不可能的。<br><b>合理推論的生命應用：</b> 當我們對付罪的方式是「我要更努力」時，我們其實還沒有站在6:2上。第六章的起點不是決心，是身分。</p><p>弟兄姊妹，這一節改變了整場戰爭的性質。</p><p>如果我還沒死，那我對付罪的方式是<b>掙扎</b>。<br>如果我已經死了，那我對付罪的方式是<b>認清</b>。</p><p>【第二段｜6:3–10　知道：洗禮所宣告的聯合】</p>"},{"a":3,"z":3,"star":false,"grk":"<p>ἢ ἀγνοεῖτε ὅτι, ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν, εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;</p>","lit":"<p>「還是你們<b>不知道</b>：凡我們<b>被浸入</b>基督耶穌的人，都是<b>被浸入祂的死</b>？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>豈不知</td><td>ἀγνοεῖτε</td><td>agnoeite</td><td>G50</td><td>ἀ + γινώσκω</td><td><b>你們不知道嗎</b></td><td>保羅預設他們早就知道</td></tr><tr><td>受洗</td><td>ἐβαπτίσθημεν</td><td>ebaptisthēmen</td><td>G907</td><td>βάπτω（浸）</td><td><b>被浸入</b></td><td>被動式</td></tr><tr><td>歸入</td><td>εἰς</td><td>eis</td><td>G1519</td><td>—</td><td><b>進入……裡面</b></td><td>方向與歸屬</td></tr></table>","gram":"<p>① βαπτίζω 的基本字義</p><p>這個字的基本意思是「<b>浸入、沒入</b>」。</p><p>在古希臘文獻中，它用於：</p><p>- 船沉沒<br>- 布料浸入染缸（浸入之後，布就變成染缸的顏色）<br>- 物件沉入水中</p><p>這個字義本身就攜帶了保羅要的畫面：</p><p>完全沒入 → 出來的時候，不再是原來的顏色。</p><p>② εἰς Χριστὸν（歸入基督）</p><p>εἰς + 直接受格，表示<b>進入、歸屬於</b>。</p><p>這個詞組在加3:27也出現：「你們受洗歸入基督的，都是披戴基督了。」</p><p>「歸入基督」不是「加入一個團體」，是「進入一個位格」。</p><p>③ 保羅的語氣：ἢ ἀγνοεῖτε（還是你們不知道嗎）</p><p>保羅預設這是<b>基本常識</b>。</p><p>這對我們是一記提醒：保羅認為每一個受過洗的信徒，都應該知道自己的洗禮是什麼意思。<br>但今天有多少信徒，說不出自己受洗那天到底發生了什麼？</p>","exp":"<p>（關於「洗禮本身是否使人得救」的爭議，見第二十部分。此處先處理保羅的論證重點。）</p><p>保羅在此不是在教導洗禮的神學，他是在<b>用洗禮作論據</b>。</p><p>他的邏輯是：</p><pre>你受洗了（這是事實，你自己知道）\n   ↓\n你的洗禮所宣告的，是「歸入祂的死」\n   ↓\n所以你已經死了\n   ↓\n所以你不能仍在罪中</pre><p>保羅是在說：你受洗那一天，你自己已經公開承認了這件事。<br>現在你要反悔嗎？</p>"},{"a":4,"z":4,"star":true,"grk":"<p>συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.</p>","lit":"<p>「所以我們藉著那浸禮，<b>與祂一同被埋葬</b>進入死裡，為要叫——正如基督藉著父的榮耀從死人中被復活，照樣我們也可以<b>在生命的新樣中行走</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>一同埋葬</td><td>συνετάφημεν</td><td>synetaphēmen</td><td>G4916</td><td>σύν + θάπτω（埋葬）</td><td><b>與……一同被埋葬</b></td><td>六個 συν- 的第一個</td></tr><tr><td>父的榮耀</td><td>δόξα τοῦ πατρός</td><td>—</td><td>G1391</td><td>—</td><td>父的榮耀</td><td>復活的動力來源</td></tr><tr><td>新生的樣式</td><td>καινότης ζωῆς</td><td>kainotēs zōēs</td><td>G2538</td><td>καινός（質地上的新）</td><td><b>生命的新質地</b></td><td>見下</td></tr><tr><td>一舉一動</td><td>περιπατήσωμεν</td><td>peripatēsōmen</td><td>G4043</td><td>περί + πατέω（走）</td><td><b>四處行走</b>（希伯來式表達：日常生活）</td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：συνετάφημεν ——埋葬的意義</p><p>保羅為什麼要特別提「埋葬」？死了不就夠了嗎？</p><p>因為埋葬是<b>死亡的確認</b>。</p><p>人死了，還有可能被搶救。<br>人被埋了，這件事就結案了。</p><p>埋葬是社會性的、公開的、不可逆的宣告：這個人真的走了。</p><p>★ 亮光二：καινός 而不是 νέος</p><p>希臘文有兩個字表達「新」：</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>νέος</b></td><td>時間上的新（剛出來的、年輕的）</td></tr><tr><td><b>καινός</b></td><td><b>質地上的新</b>（前所未有的、性質不同的）</td></tr></table><p>保羅用的是 <b>καινότης</b>（καινός 的名詞）。</p><p>不是「新出廠的舊型號」。<br>是<b>一種以前沒有過的生命</b>。</p><p>（同字用於林後5:17「若有人在基督裡，他就是<b>新造</b>的人」；啟21:5「我將一切都<b>更新</b>了」）</p><p>★ 亮光三：περιπατέω ——一舉一動</p><p>這個字的字面是「走來走去」，是希伯來文 <b>הָלַךְ（halak）</b> 的希臘化用法，指<b>日常的生活方式</b>。</p><p>和合本譯「一舉一動」極為傳神。</p><p>保羅不是說「你要有一次屬靈的高峰經驗」，<br>是說「你<b>走路的方式</b>要不一樣」。</p><p>新生命顯在哪裡？顯在你怎麼走路——<br>怎麼說話、怎麼用錢、怎麼對待家人、怎麼在沒有人看見的時候做決定。</p><p>★ 亮光四：διὰ τῆς δόξης τοῦ πατρός（藉著父的榮耀）</p><p>保羅本可以說「藉著父的<b>能力</b>」——但他說的是「<b>榮耀</b>」。</p><p>在舊約，「榮耀」（כָּבוֹד／δόξα）是神彰顯自己同在的那個重量。</p><p>保羅在說：把耶穌從死裡拉出來的，是父自己顯明出來的那份榮耀。</p><p>而同一份榮耀，現在推動我們的日常生活。</p>","exp":"<p>弟兄姊妹，第4節有一個常被忽略的邏輯：</p><p>保羅沒有說「我們與祂一同埋葬，也要與祂一同復活（將來）」。</p><p>他說的是：我們與祂一同埋葬，<b>為要叫我們現在就有新生的樣式</b>。</p><p>復活的力量，不是留到將來才用的。</p><p>它現在就在推動你今天怎麼走路。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·</p>","lit":"<p>「因為我們若已經<b>與祂長成一體</b>，在祂死的樣式上，那麼在復活的樣式上也必如此。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>聯合</td><td>σύμφυτος</td><td>symphytos</td><td>G4854</td><td>σύν + φύω（生長）</td><td><b>一同長成、接合生長</b></td><td><b>新約僅此一次</b></td></tr><tr><td>形狀</td><td>ὁμοίωμα</td><td>homoiōma</td><td>G3667</td><td>ὅμοιος（相似）</td><td>樣式、形狀</td><td>見下</td></tr></table>","gram":"<p>★ σύμφυτος ——嫁接的畫面</p><p>這個字在古典希臘文與醫學文獻中用於：</p><p>- <b>植物的嫁接</b>：兩株植物接在一起，長成一體<br>- <b>傷口的癒合</b>：斷骨接回去，長在一起<br>- 天生一體的、與生俱來的</p><p>保羅選的不是「捆在一起」，是「<b>長在一起</b>」。</p><p>捆在一起，還可以解開。<br>長在一起，就分不開了。</p><p>（羅11:17保羅用了另一個相關的嫁接畫面：「野橄欖……接在其中」）</p><p>★ γεγόναμεν 是完成式</p><p>「已經長成」——一個過去完成的動作，效果持續至今。</p><p>這不是我們要努力維持的狀態，是一個已經接合完成的事實。</p>","exp":"<p>弟兄姊妹，這一節給了我們對付罪最深的一個角度。</p><p>問題不是「我要怎麼靠意志力離開罪」。<br>問題是「我已經被接在誰身上」。</p><p>一根枝子如果被接在一棵樹上，它會結什麼果子？</p><p>不是靠它努力，是靠它接在哪裡。</p>"},{"a":6,"z":6,"star":true,"grk":"<p>τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ·</p>","lit":"<p>「我們<b>知道</b>這事：我們的<b>舊人</b>已經與祂<b>一同被釘十字架</b>，為要使那<b>罪的身體被廢掉功用</b>，好叫我們<b>不再作罪的奴隸</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>知道</td><td>γινώσκοντες</td><td>ginōskontes</td><td>G1097</td><td>—</td><td><b>認識、確知</b>（現在分詞）</td><td>三個動詞的第一個</td></tr><tr><td>舊人</td><td>ὁ παλαιὸς ἄνθρωπος</td><td>palaios anthrōpos</td><td>G3820</td><td>παλαιός（舊的、過時的）</td><td><b>舊的那個人</b></td><td>見下</td></tr><tr><td>同釘十字架</td><td>συνεσταυρώθη</td><td>synestaurōthē</td><td>G4957</td><td>σύν + σταυρόω</td><td><b>一同被釘</b></td><td><b>不定過去被動：已成的事</b></td></tr><tr><td>滅絕</td><td>καταργηθῇ</td><td>katargēthē</td><td>G2673</td><td>κατά + ἀργός（無效）</td><td><b>被廢掉功用、被解除職權</b></td><td><b>不是「消滅」！</b></td></tr><tr><td>奴僕</td><td>δουλεύειν</td><td>douleuein</td><td>G1398</td><td>δοῦλος</td><td>作奴隸、服事</td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：καταργέω 不是「消滅」</p><p>這是全章最重要的一個字義澄清。</p><p>和合本譯「滅絕」，容易讓人以為「罪身」已經不存在了。</p><p>但 καταργέω 的意思是：</p><p>κατά（徹底）+ ἀργός（不工作、閒置）＝ <b>使之失去作用、解除職權、使之無效</b>。</p><p>這個字我們在羅馬書已經見過三次：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td>3:3</td><td>人的不信能<b>廢掉</b>神的信實嗎？</td></tr><tr><td>3:31</td><td>我們因信<b>廢了</b>律法嗎？</td></tr><tr><td><b>6:6</b></td><td><b>使罪身「滅絕」</b></td></tr><tr><td>7:2</td><td>丈夫死了，妻子就<b>脫離</b>丈夫的律法</td></tr></table><p>保羅不是說「罪的身體被摧毀了」。<br>保羅是說：<b>它被解職了</b>。</p><p>就像一個被免職的官員——他還在，還會發表意見，還會試圖指揮你，<br>但他已經沒有職權了。</p><p>這正是為什麼6:12還要命令「不要容罪作王」——</p><p>因為那個被解職的傢伙，還在試圖坐上王位。</p><p>★ 亮光二：「舊人」是誰？</p><p>ὁ παλαιὸς ἄνθρωπος——「舊的那個人」。</p><p>保羅在其他地方也用這個詞：</p><p>- <b>弗4:22</b>「脫去你們從前行為上的<b>舊人</b>」<br>- <b>西3:9</b>「因你們已經<b>脫去舊人</b>和舊人的行為」</p><p>兩種主要理解：</p><table><tr><th>理解</th><th>主張</th></tr><tr><td><b>A. 舊的自我／本性</b></td><td>我裡面那個墮落的性情被釘死了</td></tr><tr><td><b>B. 舊的「我」——在亞當裡的那個人</b></td><td>我作為「亞當族類」的那個身分被釘死了</td></tr></table><p>我認為 <b>B</b> 較符合上下文：</p><p>因為第五章剛剛講完「在亞當裡」與「在基督裡」兩個體系。</p><p>「舊人」＝ 那個屬於亞當、活在罪權下、被設立為罪人的<b>我</b>。<br>那個「我」已經和基督一同被釘了。</p><p>注意：不是「我裡面有一部分死了，還有一部分活著」——<br>是「舊的那整個我」死了，「新的我」活了。</p><p>基督徒不是「一半新一半舊」，是<b>一個新人，但還帶著舊習慣</b>。</p><p>★ 亮光三：「罪身」（τὸ σῶμα τῆς ἁμαρτίας）是什麼？</p><p>不是說「身體本身是罪惡的」——那是希臘二元論，不是聖經。</p><p>「罪的身體」指的是：<b>被罪所支配、作為罪之工具的這個身體</b>。</p><p>證據：6:12–13保羅立刻說到「你們必死的<b>身上</b>」與「你們的<b>肢體</b>」——</p><p>保羅的重點不是身體要被摧毀，是<b>身體要換主人</b>。</p><p>同樣的手，同樣的舌頭，同樣的眼睛——<br>從「不義的兵器」變成「義的兵器」（6:13）。</p><p>★ 亮光四：兩個目的子句（ἵνα ... τοῦ ...）</p><pre>συνεσταυρώθη（舊人被同釘）\n   ↓ ἵνα（為要）\nκαταργηθῇ τὸ σῶμα τῆς ἁμαρτίας（罪身被解職）\n   ↓ τοῦ（好叫）\nμηκέτι δουλεύειν（不再作奴隸）</pre><p>這是一條因果鏈：舊人被釘 → 罪身被解職 → 我們不再作奴隸。</p><p>注意最後的目的：不是「我們不再犯錯」，是「我們<b>不再作奴隸</b>」。</p><p>保羅談的是<b>歸屬與權柄</b>，不是<b>行為的完美</b>。</p>","exp":"<p><b>經文本身明確表達的：</b> 舊人已與基督同釘，罪的身體被解除職權，目的是使我們不再作罪的奴隸。<br><b>合理推論的生命應用：</b> 當罪來的時候，正確的回應不是「我要更用力抵抗」，而是「你已經被解職了，你憑什麼命令我？」</p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.<br>9 …θάνατος αὐτοῦ οὐκέτι κυριεύει.<br>10 ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.</p>","lit":"<p>7「因為那已經死了的人，<b>已被判定與罪無涉</b>。」<br>8「我們若與基督同死，就信我們也必<b>與祂同活</b>——」<br>9「因為知道基督既從死人中復活，就<b>不再死了</b>；<b>死也不再作祂的主</b>。」<br>10「因為祂死，是<b>向罪死</b>，<b>只此一次</b>；祂活，是<b>向神活</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>脫離了罪</td><td>δεδικαίωται ἀπὸ τῆς ἁμαρτίας</td><td>dedikaiōtai</td><td>G1344</td><td><b>完成被動式：已被宣告脫離罪</b>（字面是「被稱義」）</td></tr><tr><td>作主</td><td>κυριεύει</td><td>kyrieuei</td><td>G2961</td><td>κύριος（主）：<b>作主人、掌權</b></td></tr><tr><td>只有一次</td><td>ἐφάπαξ</td><td>ephapax</td><td>G2178</td><td>ἐπί + ἅπαξ：<b>一次而永遠</b></td></tr></table>","gram":"<p>★ 亮光一：6:7的動詞是「稱義」</p><p>「已死的人是<b>脫離了罪</b>」——原文用的動詞是 <b>δικαιόω（稱義）</b>！</p><p>字面直譯是：「那已死的人，<b>已經被稱義脫離了罪</b>。」</p><p>保羅把法庭語言用在這裡：</p><p>一個人死了，法律對他的追訴就終止了。<br>死亡結束了罪對他的法律管轄權。</p><p>（當時猶太拉比有一句類似的說法：「人一死，就脫離了律法與誡命的約束。」保羅在此把這個常識神學化了。）</p><p>★ 亮光二：κυριεύω ——「作主」</p><p>這個字的字根是 <b>κύριος（主）</b>。</p><p>「死也不再<b>作他的主</b>了」（6:9）——與6:14「罪必不能<b>作你們的主</b>」是同一個字。</p><p>保羅在建立一個平行：</p><p>死對基督沒有主權了（6:9）。<br>罪對你也沒有主權了（6:14）。</p><p>因為你們是接在一起的（6:5 σύμφυτος）。</p><p>★ 亮光三：ἐφάπαξ ——一次而永遠</p><p>這個字在新約出現5次，其中4次在希伯來書，講基督的獻祭：</p><p>- <b>來7:27</b>「因為他只<b>一次</b>將自己獻上」<br>- <b>來9:12</b>「只<b>一次</b>進入聖所，成了永遠贖罪的事」<br>- <b>來10:10</b>「基督只<b>一次</b>獻上他的身體」</p><p>保羅在6:10說：祂向罪死，只有一次。</p><p>意思是：這件事<b>不需要重複</b>，也<b>不可能被推翻</b>。</p><p>★ 亮光四：6:10的雙重「向」</p><pre>他死是「向罪」（τῇ ἁμαρτίᾳ）死了 —— 那個關係，結束了\n他活是「向神」（τῷ θεῷ）活著     —— 這個關係，是全部</pre><p>而6:11要說：你也照樣。</p>","exp":"<p>弟兄姊妹，6:3–10這一整段，只做了一件事：</p><p>它讓你<b>知道</b>（γινώσκοντες, 6:6；εἰδότες, 6:9）。</p><p>保羅沒有在這裡給任何命令。</p><p>他只是一件一件地陳述事實：</p><p>- 你受洗歸入祂的死（6:3）<br>- 你與祂一同埋葬（6:4）<br>- 你與祂長成一體（6:5）<br>- 你的舊人與祂同釘（6:6）<br>- 罪身被解職（6:6）<br>- 死對祂不再有主權（6:9）<br>- 祂向罪死，一次而永遠（6:10）</p><p>然後——第11節，第一個命令來了。</p><p>【第三段｜6:11　算：全卷書第一個命令】</p>"},{"a":11,"z":11,"star":true,"grk":"<p>οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς [εἶναι] νεκροὺς μὲν τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>「照樣，你們也要<b>持續地把自己算作</b>：向罪是死的，但向神——在基督耶穌裡——是活的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>當看</td><td>λογίζεσθε</td><td>logizesthe</td><td>G3049</td><td>λόγος</td><td><b>記帳、計算、認定</b></td><td><b>現在式命令語氣</b></td></tr><tr><td>自己</td><td>ἑαυτούς</td><td>heautous</td><td>G1438</td><td>—</td><td>你們自己</td><td>反身代名詞</td></tr><tr><td>在基督耶穌裡</td><td>ἐν Χριστῷ Ἰησοῦ</td><td>—</td><td>—</td><td>—</td><td>保羅神學的核心詞組</td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：λογίζομαι ——第四章那個字回來了，但語氣變了</p><p>這是全卷書最精彩的一個安排：</p><table><tr><th>出處</th><th>語態／語氣</th><th>誰在算</th></tr><tr><td><b>4:3</b></td><td>ἐλογίσθη，<b>被動、直說</b></td><td><b>神</b>算亞伯拉罕為義</td></tr><tr><td><b>4:8</b></td><td>λογίσηται，<b>主動、假設</b></td><td><b>主</b>不算他為有罪</td></tr><tr><td><b>4:23–24</b></td><td>λογίζεσθαι，被動</td><td><b>神</b>要算我們為義</td></tr><tr><td><b>6:11</b></td><td>λογίζεσθε，<b>中動、命令語氣</b></td><td><b>你要算！</b></td></tr></table><p>弟兄姊妹，你看見這個次序了嗎？</p><p>第四章：<b>神先算了</b>。<br>第六章：<b>現在你要照著神的算法，算你自己</b>。</p><p>這是全本聖經最重要的一個屬靈次序：<br>我不是靠「算」讓那件事成真；我是因為那件事已經真了，所以我才敢算。</p><p>★ 亮光二：現在式命令語氣</p><p>λογίζεσθε 是<b>現在式</b>命令語氣，表示<b>持續、反覆的動作</b>。</p><p>不是「算一次就好了」。<br>是「一直算下去」。</p><p>每一次試探來的時候，算一次。<br>每一次舊習慣招手的時候，算一次。</p><p>★ 亮光三：這是全卷書的第一個命令句</p><p>羅馬書1:1到6:10，共約140節經文——</p><p>保羅<b>沒有給過一個真正的行為命令</b>。</p><p>（1:11–15、3:4等處有語氣詞，但不是給讀者的生活命令）</p><p>第一個命令，在6:11。</p><p>而那個命令是什麼？</p><p>不是「你要努力」。<br>不是「你要付出」。<br>不是「你要改變」。</p><p>是——<b>「你要這樣算」</b>。</p><p>神給我們的第一個命令，是關於<b>你怎麼看自己</b>。</p><p>這正是321最核心的一句話的聖經根據：</p><p>改變觀念，就改變生命。</p><p>★ 亮光四：「算」不是自我催眠</p><p>這一點必須講清楚，否則6:11會被誤讀成一種積極思想法。</p><table><tr><th>自我催眠</th><th>聖經的「算」</th></tr><tr><td>把不存在的事說成存在</td><td>把<b>已經存在的事</b>認定下來</td></tr><tr><td>靠反覆暗示製造事實</td><td>靠神的宣告接受事實</td></tr><tr><td>根據在我的意志</td><td>根據在基督的死與復活（6:3–10）</td></tr></table><p>這就是為什麼保羅把6:3–10放在6:11前面。</p><p>你要先「知道」，才能「算」。</p><p>沒有前面八節的事實，第11節就只是一句心靈雞湯。</p><p>★ 亮光五：ἐν Χριστῷ Ἰησοῦ（在基督耶穌裡）</p><p>這是保羅神學的招牌詞組（新約中出現約160次以上）。</p><p>注意它在本節的位置：</p><pre>向罪  —— 是死的\n向神  —— 是活的  【在基督耶穌裡】</pre><p>「在基督裡」不是修辭，是<b>地點</b>。</p><p>我向神活著，不是因為我變好了，是因為我在祂裡面。</p>","exp":"<p>弟兄姊妹，6:11是整章的樞紐，也是整個基督徒生活的樞紐。</p><p>它的位置很重要：</p><pre>6:3–10  【知道】—— 事實（沒有命令）\n6:11    【算】  —— 觀念（第一個命令）\n6:12–13 【獻上】—— 行動（一連串命令）</pre><p>保羅沒有從「行動」開始。</p><p>因為從行動開始的，是律法主義。<br>從觀念開始的，才是福音。</p><p>而這一節同時解釋了一件事：為什麼許多基督徒很努力，卻一直原地打轉？</p><p>因為他們跳過了第11節。</p><p>他們知道教義（第3–10節），也很努力行動（第12–13節），<br>但中間那個「算」，從來沒有做過。</p><p>結果就是：知識在腦子裡，行動靠意志力，中間沒有橋。</p><p>【第四段｜6:12–14　獻上：不要容罪作王】</p>"},{"a":12,"z":12,"star":false,"grk":"<p>Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,</p>","lit":"<p>「所以，<b>不要讓</b>罪繼續<b>作王</b>，在你們那必死的身體上，以致你們<b>順從</b>它的私慾。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>作王</td><td>βασιλευέτω</td><td>basileuetō</td><td>G936</td><td><b>現在式命令：不要繼續讓它作王</b>（第五章的字！）</td></tr><tr><td>必死的</td><td>θνητός</td><td>thnētos</td><td>G2349</td><td><b>會死的、必朽壞的</b>（不是「邪惡的」）</td></tr><tr><td>順從</td><td>ὑπακούειν</td><td>hypakouein</td><td>G5219</td><td><b>在底下聽</b>（5:19 ὑπακοή 同字根）</td></tr><tr><td>私慾</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>ἐπί + θυμός：<b>強烈的渴望</b>（本身中性，看對象）</td></tr></table>","gram":"<p>★ 亮光一：βασιλεύω ——第五章的字，換了角色</p><p>這個字我們在第五章追蹤過5次：</p><pre>5:14  死作了王\n5:17  死因這一人作了王\n5:17  我們要在生命中作王\n5:21  罪作王叫人死\n5:21  恩典作王\n   ↓\n6:12  【命令】不要容罪作王</pre><p>第五章：罪作王，是一個<b>已被推翻的政權</b>。<br>第六章：所以——<b>別讓那個被推翻的政權繼續發號施令</b>。</p><p>這正是6:6「罪身被<b>解職</b>」（καταργέω）的實踐面。</p><p>一個被解職的官員，如果你還聽他的，他就還在管你。<br>不是因為他有權柄，是因為你還在服從。</p><p>★ 亮光二：現在式命令的意義</p><p>μὴ βασιλευέτω 是<b>現在式</b>命令的否定式。</p><p>在希臘文中，這通常表示：<b>停止一個正在進行的動作</b>。</p><p>保羅不是說「將來不要讓它作王」，<br>是說：「<b>它現在還在作王的那些地方，停下來</b>。」</p><p>★ 亮光三：θνητός（必死的）不是貶義</p><p>保羅說「你們<b>必死的</b>身上」，不是說「你們邪惡的身體」。</p><p>θνητός 只是說：這個身體會朽壞、會老、會死。</p><p>保羅從不把身體本身當作罪的來源——那是希臘哲學，不是聖經。</p><p>證據：8:11「也必藉著住在你們心裡的聖靈，使你們<b>必死的身體</b>又活過來。」<br>同一個字！那個必死的身體，將來要復活。</p><p>★ 亮光四：ὑπακούειν ——又是「聽」</p><p>「順從身子的私慾」——ὑπακούω，「在底下聽」。</p><p>這正是5:19的字（ὑπακοή）。</p><p>保羅一直在問同一個問題：你在誰的底下聽？</p><p>第五章：亞當聽偏了，基督聽對了。<br>第六章：現在，你在誰的底下聽？私慾，還是神？</p>","exp":"<p>弟兄姊妹，這一節的畫面是政治性的。</p><p>罪的政權已經被推翻了（6:6）。<br>但它還在你的國土上活動，還在下命令。</p><p>而它唯一的權力來源，是——<b>你還在聽</b>。</p>"},{"a":13,"z":13,"star":true,"grk":"<p>μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.</p>","lit":"<p>「也<b>不要繼續</b>把你們的<b>肢體</b>當作不義的<b>兵器</b>獻給罪，<b>乃要（一次決斷地）獻上</b>你們自己給神——像從死人中活過來的人——並把你們的肢體當作義的<b>兵器</b>獻給神。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>獻給</td><td>παριστάνετε／παραστήσατε</td><td>paristanete/parastēsate</td><td>G3936</td><td>παρά + ἵστημι</td><td><b>擺在旁邊、交出去、呈獻</b></td><td>見下</td></tr><tr><td>肢體</td><td>μέλη</td><td>melē</td><td>G3196</td><td>—</td><td>身體的部位</td><td>手、眼、舌、腳……</td></tr><tr><td>器具</td><td>ὅπλα</td><td>hopla</td><td>G3696</td><td>—</td><td><b>兵器、軍械</b></td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：兩個命令，兩種時態</p><p>這是全章最精緻的文法設計：</p><pre>μηδὲ παριστάνετε   —— 【現在式命令，否定】\n                      「不要繼續獻上」——停止一個持續中的習慣\n\nἀλλὰ παραστήσατε   —— 【不定過去式命令，肯定】\n                      「（現在，一次）獻上！」——一個決斷的行動</pre><p>弟兄姊妹，這兩個時態畫出了基督徒生活的兩面：</p><p>一面是<b>每天的停止</b>：那個習慣、那個網站、那個念頭——<b>停下來</b>（現在式）。<br>一面是<b>一次的交出</b>：主啊，我把自己給祢——<b>現在，就一次</b>（不定過去式）。</p><p>兩者缺一不可。<br>只有「每天停止」，會變成一場沒有終點的苦戰。<br>只有「一次奉獻」，會變成一個沒有兌現的承諾。</p><p>★ 亮光二：ὅπλα ——是「兵器」，不是「工具」</p><p>中文「器具」偏中性，容易讓人想到「工具箱」。</p><p>但 ὅπλον 在第一世紀主要指：<b>武器、軍械</b>。</p><p>同字用於：</p><p>- <b>約18:3</b>：猶大帶著兵丁，拿著燈籠、火把、<b>兵器</b><br>- <b>林後10:4</b>：「我們爭戰的<b>兵器</b>本不是屬血氣的」<br>- <b>羅13:12</b>：「當穿上光明的<b>兵器</b>」</p><p>保羅的畫面是：</p><p>你的手、你的眼睛、你的舌頭、你的時間、你的錢包——</p><p>那些不是中立的工具。那些是<b>武器</b>。</p><p>而武器一定在某一方手上。</p><p>這意味著什麼？</p><p>意味著沒有「中立地帶」。</p><p>你今天沒有把舌頭獻給神，不等於那條舌頭在放假。<br>它在另一邊的軍械庫裡。</p><p>★ 亮光三：παρίστημι 的獻祭背景</p><p>這個字在七十士譯本中，用於<b>把祭牲牽到祭壇前呈獻</b>。</p><p>保羅在12:1用同一個字：</p><p>「將身體獻上（παραστῆσαι），當作活祭。」</p><p>羅6:13是羅12:1的第一次出現。<br>保羅在第六章埋下的種子，在第十二章開花。</p><p>★ 亮光四：ὡσεὶ ἐκ νεκρῶν ζῶντας（像從死裡復活的人）</p><p>這半句是全節的理由。</p><p>你憑什麼可以把自己交出去？</p><p>因為你是「從死人中活過來的人」。</p><p>一個死了又活過來的人，對這個世界的東西，握力會不一樣。</p>","exp":"<p>弟兄姊妹，6:13把抽象的神學，落到了具體的身體部位。</p><p>「肢體」（μέλη）——那是很具體的東西：</p><p>- 我的<b>眼睛</b>今天看了什麼？<br>- 我的<b>舌頭</b>今天說了什麼？<br>- 我的<b>手</b>今天做了什麼？<br>- 我的<b>腳</b>今天去了哪裡？<br>- 我的<b>時間</b>今天給了誰？</p><p>成聖不是一個抽象的境界。<br>成聖是一場關於<b>身體部位歸屬權</b>的具體交涉。</p>"},{"a":14,"z":14,"star":false,"grk":"<p>ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει· οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.</p>","lit":"<p>「因為罪<b>必不能作你們的主</b>；因為你們不是<b>在律法之下</b>，乃是<b>在恩典之下</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>作主</td><td>κυριεύσει</td><td>kyrieusei</td><td>G2961</td><td><b>未來式：必不能作主</b>（6:9同字）</td></tr><tr><td>在……之下</td><td>ὑπό + 直接受格</td><td>hypo</td><td>G5259</td><td><b>在……的權柄／統治之下</b></td></tr></table>","gram":"<p>★ 亮光一：未來式是應許，不是命令</p><p>「罪必不能作你們的主」——這是<b>直說語氣未來式</b>，不是命令。</p><p>保羅沒有說：「你要努力，讓罪不作你的主。」<br>保羅說：「罪<b>必不能</b>作你們的主。」</p><p>這是一個<b>應許</b>，一個宣告。</p><p>注意6:12–13是命令，6:14是應許。</p><p>命令的力量，來自那個應許。</p><p>不是「你努力，所以罪不能作主」；<br>是「罪不能作主，所以你努力得動」。</p><p>★ 亮光二：「不在律法之下，乃在恩典之下」是什麼意思？</p><p>這句話極容易被誤解（見第二十部分），所以要看保羅<b>在此的論證用途</b>。</p><p>保羅是在給6:14上半句一個<b>理由</b>：</p><pre>罪必不能作你們的主\n   ↑ 為什麼？\n因為你們不在律法之下，乃在恩典之下</pre><p>保羅在說：律法<b>不能</b>使你勝過罪。</p><p>律法能告訴你哪裡有線，但它給不了你跨不過去的力量（第七章整章就在講這件事）。</p><p>能勝過罪的，是恩典的權勢。</p><p>這正是5:21的迴響：「恩典也藉著義<b>作王</b>。」</p><p>問題從來不是「有沒有規矩」，而是「誰在作王」。</p>","exp":"<p>弟兄姊妹，6:14是全章的轉軸，也是第七、第八章的門。</p><p>保羅說：如果你還想靠「律法之下」的方式對付罪——<br>那你會經歷第七章。</p><p>如果你活在「恩典之下」——<br>那你會經歷第八章。</p><p>【第五段｜6:15–19　作誰的奴僕】</p>"},{"a":15,"z":16,"star":false,"grk":"<p>16 οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;</p>","lit":"<p>16「你們豈不<b>知道</b>：你們把自己獻給誰作奴僕去<b>順從</b>，你們就是那位的奴僕——你們所順從的那一位；或是罪的（奴僕），以至於死；或是順從的（奴僕），以至於義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>犯罪</td><td>ἁμαρτήσωμεν</td><td>hamartēsōmen</td><td>G264</td><td><b>不定過去式假設語氣：偶爾犯一次</b></td></tr><tr><td>奴僕</td><td>δοῦλος</td><td>doulos</td><td>G1401</td><td><b>完全歸屬另一人的奴隸</b>（不是雇工）</td></tr><tr><td>順從</td><td>ὑπακοή／ὑπακούετε</td><td>—</td><td>G5218/G5219</td><td><b>在底下聽</b>（5:19同字根）</td></tr></table>","gram":"<p>★ 亮光一：6:15的問題與6:1不同</p><table><tr><th>6:1</th><th>6:15</th></tr><tr><td>ἐπιμένωμεν（<b>繼續住在</b>罪裡）</td><td>ἁμαρτήσωμεν（<b>犯一次</b>罪）</td></tr><tr><td>現在式：生活方式</td><td><b>不定過去式：偶一為之</b></td></tr><tr><td>回答：你已經死了（6:2）</td><td>回答：你換了主人（6:16–18）</td></tr></table><p>弟兄姊妹，這個區分極其重要，因為它反映了真實的人心。</p><p>第一個問題是：「我可以一直住在罪裡嗎？」——大多數人不敢這樣問。<br>第二個問題是：「那偶爾一次總可以吧？」——這個問題，每個人都問過。</p><p>而保羅的回答同樣是：<b>斷乎不可</b>。</p><p>★ 亮光二：δοῦλος 的絕對性</p><p>在羅馬社會，δοῦλος 不是「員工」。</p><p>一個奴隸：</p><p>- 沒有自己的時間<br>- 沒有自己的財產<br>- <b>不能同時屬於兩個主人</b></p><p>這正是主耶穌說的：「一個人不能事奉兩個主。」（太6:24）</p><p>★ 亮光三：ᾧ ὑπακούετε ——「你所順從的那一位」</p><p>保羅給了一個非常實際的判準：</p><p>你怎麼知道你是誰的奴僕？</p><p>看你<b>聽誰的</b>。</p><p>不是看你怎麼自稱，不是看你的宗教身分，是看——</p><p>當那個聲音響起來的時候，你的身體往哪裡走。</p>","exp":"<p>弟兄姊妹，6:16拆掉了一個很普遍的幻覺：</p><p>「我可以不屬於任何人。我是自由的。」</p><p>保羅說：沒有這種東西。</p><p>人不是在「有主人」與「沒主人」之間選。<br>人是在「哪一個主人」之間選。</p><p>而更深的一層：</p><p>保羅說「你們<b>獻上</b>自己作奴僕」——</p><p>這是一個<b>主動的動作</b>。</p><p>沒有人被綁架。是我們自己把自己交出去的。<br>每一次順從，就是又交了一次。</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,<br>18 ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ.</p>","lit":"<p>17「感謝神！因為你們從前是罪的奴僕，但你們<b>從心裡順從了</b>——<b>你們被交付進去的</b>那個教訓的<b>模子</b>。」<br>18「你們既<b>被釋放</b>脫離了罪，就<b>被奴役</b>於義了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>從心裡</td><td>ἐκ καρδίας</td><td>ek kardias</td><td>G2588</td><td>—</td><td><b>從心發出</b></td><td>不是外在的服從</td></tr><tr><td>傳給</td><td>παρεδόθητε</td><td>paredothēte</td><td>G3860</td><td>παρά + δίδωμι</td><td><b>你們被交付了</b></td><td><b>見下——語序驚人</b></td></tr><tr><td>模範</td><td>τύπος</td><td>typos</td><td>G5179</td><td>τύπτω（打、印）</td><td><b>模子、印記</b></td><td>5:14同字</td></tr><tr><td>得了釋放</td><td>ἐλευθερωθέντες</td><td>eleutherōthentes</td><td>G1659</td><td>ἐλεύθερος（自由）</td><td><b>被釋放</b>（釋奴用語）</td><td>被動式</td></tr><tr><td>作了奴僕</td><td>ἐδουλώθητε</td><td>edoulōthēte</td><td>G1402</td><td>δοῦλος</td><td><b>被奴役</b></td><td>被動式</td></tr></table>","gram":"<p>★ 亮光一：6:17的語序極其驚人</p><p>中文譯「順服了<b>所傳給你們</b>道理的模範」——聽起來是「道理被傳給你們」。</p><p>但希臘文的語序是：</p><p>εἰς ὃν παρεδόθητε τύπον διδαχῆς</p><p>「（你們順從了）那個<b>你們被交付進去的</b>教訓的模子。」</p><p>主詞與受詞對調了！</p><table><tr><th>一般的想法</th><th>保羅的說法</th></tr><tr><td><b>道理</b>被交給<b>你</b></td><td><b>你</b>被交給<b>道理</b></td></tr><tr><td>我掌握真理</td><td><b>真理掌握我</b></td></tr><tr><td>我把聖經拿在手上</td><td>我被放進聖經的模子裡</td></tr></table><p>弟兄姊妹，這是全章最謙卑、也最扎人的一句話。</p><p>我們常說「我學了很多真理」——好像真理是我收藏的東西。</p><p>保羅說：不是。<b>是你被交進去了</b>。</p><p>★ 亮光二：τύπος（模範）——第五章的字</p><p>τύπος 的字面是「打擊留下的印記」，引申為<b>模子</b>。</p><p>在5:14，保羅說「亞當乃是那以後要來之人的<b>預像</b>（τύπος）」。</p><p>同一個字，兩種用法：</p><p>5:14：亞當是一個<b>指向基督</b>的模子。<br>6:17：福音的教訓是一個<b>塑造你</b>的模子。</p><p>這個畫面極美：</p><p>熔化的金屬被倒進模子裡，冷卻之後，就成了模子的形狀。</p><p>保羅說：你被倒進去了。</p><p>★ 亮光三：ἐκ καρδίας（從心裡）</p><p>這正是2:29「真割禮也是心裡的」的實現。</p><p>不是外在的儀文，是心裡的順從。</p><p>★ 亮光四：兩個被動式的張力（6:18）</p><pre>ἐλευθερωθέντες  —— 被釋放（自由了！）\nἐδουλώθητε      —— 被奴役（又作奴僕了？）</pre><p>保羅刻意把「自由」與「奴役」放在同一句話裡。</p><p>這是全章最反直覺、也最真實的一句話：</p><p>自由，不是沒有主人。<br>自由，是有一位對的主人。</p><p>（保羅自己在6:19承認這個比喻的限度——見下一節）</p>","exp":"<p>弟兄姊妹，6:17裡有一個字很容易被跳過：「<b>感謝神</b>！」</p><p>保羅在講一大段嚴肅的教導，突然插進一句敬拜。</p><p>為什麼？</p><p>因為他寫到「你們從前雖然作罪的奴僕，現今卻從心裡順服了」的時候，<br>他想起這件事根本不是他們自己做到的。</p><p>一個奴隸，怎麼可能自己換主人？</p><p>所以保羅停下來，說了兩個字：感謝神。</p>"},{"a":19,"z":19,"star":false,"grk":"<p>ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν. ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.</p>","lit":"<p>「我是<b>照著人的方式</b>說話，因為你們肉體的軟弱。正如你們從前把肢體獻上作奴僕給不潔與不法，以至於<b>更多的不法</b>；照樣，如今也要把肢體獻上作奴僕給義，以至於<b>成聖</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>照人的常話</td><td>ἀνθρώπινον λέγω</td><td>anthrōpinon legō</td><td>G442</td><td><b>我用人的方式說話</b>（保羅的自我限定）</td></tr><tr><td>不法</td><td>ἀνομία</td><td>anomia</td><td>G458</td><td>ἀ + νόμος：<b>無法無天</b></td></tr><tr><td>成聖</td><td>ἁγιασμός</td><td>hagiasmos</td><td>G38</td><td>ἅγιος（聖）：<b>被分別出來歸神的過程</b></td></tr></table>","gram":"<p>★ 亮光一：ἀνθρώπινον λέγω ——保羅為自己的比喻道歉</p><p>保羅在這裡做了一件很少見的事：他為自己剛用的比喻<b>加註</b>。</p><p>「我因你們肉體的軟弱，就照人的常話對你們說。」</p><p>為什麼？</p><p>因為「奴僕」這個比喻，只講對了一半。</p><p>它對的地方：<b>歸屬是絕對的、你只能有一個主人</b>。<br>它不對的地方：<b>神不把我們當奴隸看</b>。</p><p>證據就在兩章之後：</p><p>羅8:15「你們所受的，不是奴僕的心，仍舊害怕；所受的，乃是<b>兒子的心</b>，因此我們呼叫：『阿爸！父！』」</p><p>保羅用「奴僕」來講<b>歸屬的絕對性</b>；<br>然後在第八章立刻升級成「兒子」，來講<b>關係的親密性</b>。</p><p>兩章要一起讀。</p><p>★ 亮光二：兩個「以至於」的方向</p><pre>獻給不潔不法 → εἰς τὴν ἀνομίαν（以至於「更多的」不法）\n獻給義       → εἰς ἁγιασμόν  （以至於成聖）</pre><p>保羅指出罪的一個特性：它會<b>滾雪球</b>。</p><p>不法帶來更多的不法。</p><p>而義也一樣有動能：獻上帶來成聖。</p><p>兩條路，都是會加速的。</p><p>★ 亮光三：ἁγιασμός 是「過程」</p><p>這個以 -μός 結尾的名詞，通常表示<b>過程</b>而非<b>狀態</b>。</p><p>成聖不是一個你某天達到的境界，是一條你每天在走的路。</p>","exp":"<p>弟兄姊妹，6:19把6:13的命令<b>重複了一次</b>，但加上了一個字：</p><p>「現今也要<b>照樣</b>……」</p><p>保羅在說：你已經很會做這件事了。</p><p>你以前每天都在把肢體交出去——交給不潔、交給不法。<br>你做得又熟練、又自然、又不需要提醒。</p><p>現在，<b>用同樣的熟練度</b>，交給義。</p><p>【第六段｜6:20–23　兩種結局】</p>"},{"a":20,"z":22,"star":false,"grk":"<p>21 τίνα οὖν καρπὸν εἴχετε τότε; ἐφ' οἷς νῦν ἐπαισχύνεσθε, τὸ γὰρ τέλος ἐκείνων θάνατος.</p>","lit":"<p>20「因為你們作罪之奴僕的時候，<b>對義是自由的</b>。」<br>21「那麼，你們當時得了什麼<b>果子</b>呢？——就是你們<b>如今以為羞恥</b>的那些事；因為那些事的<b>結局是死</b>。」<br>22「但如今，你們<b>已從罪裡得了自由</b>，<b>作了神的奴僕</b>，就有<b>成聖</b>的果子，而那<b>結局是永生</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>果子</td><td>καρπός</td><td>karpos</td><td>G2590</td><td>果實、收成</td></tr><tr><td>羞恥</td><td>ἐπαισχύνεσθε</td><td>epaischynesthe</td><td>G1870</td><td><b>以……為恥</b>（1:16「我不以福音為恥」同字！）</td></tr><tr><td>結局</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>終點、最終的結果</b></td></tr></table>","gram":"<p>★ 亮光一：ἐπαισχύνομαι ——回到1:16</p><p>「你們現今所看為<b>羞恥</b>的事」——ἐπαισχύνεσθε。</p><p>這正是1:16的那個字：</p><p>「我不以福音為恥（οὐ ἐπαισχύνομαι）。」</p><p>保羅在羅馬書的開頭說：福音不叫我羞恥。<br>在第六章說：罪的果子，才是叫你羞恥的那個。</p><p>一個是你不必以為恥的；一個是你回頭看會臉紅的。</p><p>★ 亮光二：τέλος（結局）的重量</p><p>這個字不只是「結束」，是「<b>最終要走到的那一點</b>」。</p><p>保羅在問一個很實際的問題：</p><p>那條路，走到底，是什麼？</p><p>這是對付試探最有力的問法之一。</p><p>試探從來不讓你看 τέλος。<br>它只讓你看下一步。</p><p>★ 亮光三：6:21的一個尖銳問句</p><p>「當日有什麼果子呢？」</p><p>保羅問的是：那些事，最後給了你什麼？</p><p>弟兄姊妹，這是一個誠實的人才敢回答的問題。</p><p>那些年、那些夜晚、那些選擇——<br>收成在哪裡？</p>","exp":"<p>注意6:22有一個微妙的用詞改變：</p><pre>6:18  你們作了「義」的奴僕\n6:22  你們作了「神」的奴僕</pre><p>從抽象的「義」，變成有位格的「神」。</p><p>保羅在收尾的時候，把焦點從一個原則，帶回到一個位格。</p><p>成聖不是服從一套標準，是屬於一位主。</p>"},{"a":23,"z":23,"star":true,"grk":"<p>τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.</p>","lit":"<p>「因為罪的<b>軍餉</b>是死；但神的<b>白白恩賜</b>，是永生——在我們的主基督耶穌裡。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>工價</td><td>ὀψώνια</td><td>opsōnia</td><td>G3800</td><td>ὄψον（口糧）+ ὠνέομαι（買）</td><td><b>士兵的口糧與軍餉</b></td><td><b>複數</b></td></tr><tr><td>恩賜</td><td>χάρισμα</td><td>charisma</td><td>G5486</td><td>χάρις（恩典）+ -μα</td><td><b>恩典的具體產物</b></td><td><b>單數</b></td></tr><tr><td>永生</td><td>ζωὴ αἰώνιος</td><td>zōē aiōnios</td><td>G2222/G166</td><td>—</td><td>永遠的生命</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ὀψώνια ——是「軍餉」</p><p>這個字原指<b>士兵的口糧與定期薪餉</b>。</p><p>在新約的其他用法：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>路3:14</b></td><td>施洗約翰對兵丁說：「當以自己的<b>錢糧</b>為足。」</td></tr><tr><td><b>林前9:7</b></td><td>「有誰當兵<b>自備糧餉</b>呢？」</td></tr><tr><td><b>林後11:8</b></td><td>「我向他們取了<b>工價</b>，好服事你們。」</td></tr></table><p>兩個關鍵特徵：</p><p>1. <b>是定期發放的</b>——不是一次結清<br>2. <b>是掙來的、應得的</b>——你服役，你領餉</p><p>保羅說：罪是一個<b>準時發薪</b>的雇主。</p><p>它從不欠你。它從不遲發。<br>它每一次都準時，把你該得的，付給你。</p><p>而它付的那樣東西，叫做死。</p><p>★ 亮光二：複數 vs 單數的驚人對比</p><pre>ὀψώνια（工價）—— 複數！  罪一次一次地付，分期發放\nχάρισμα（恩賜）—— 單數！  神一次給完，一個完整的禮物</pre><p>這個單複數的對比，中文完全看不出來，但它極其重要：</p><p>罪的付款方式是<b>分期的</b>——今天付你一點點空虛，明天付你一點點麻木，後天付你一點點失去。<br>你不會在某一天突然收到「死」這個大包裹；你是<b>一小筆一小筆地領</b>的。</p><p>而神的禮物是<b>一次給完的</b>——不是分期，不是試用，是整個給你。</p><p>★ 亮光三：不對稱的對句</p><p>照對稱邏輯，保羅應該寫：</p><p>「罪的工價是死；<b>義的工價</b>是永生。」</p><p>但他沒有。他寫的是：</p><p>「罪的工價是死；神的<b>恩賜</b>是永生。」</p><p>一邊是「掙來的」，一邊是「白給的」。</p><p>這個不對稱，是整章、也是整卷羅馬書的縮影：</p><p>死，是你賺的。<br>生命，是祂給的。</p><p>★ 亮光四：χάρισμα ——第五章的字</p><p>這個字在5:15、5:16已經出現過（和合本譯「恩賜」）。</p><p>它是 χάρις（恩典）加上 -μα 結尾，表示<b>恩典所產生的具體東西</b>。</p><p>恩典不是一種氣氛，是會生出東西來的。<br>而它生出來的，叫做永生。</p><p>★ 亮光五：最後五個字</p><p>ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν——「在我們的主基督耶穌裡」。</p><p>保羅在全章的最後，把地址寫上了。</p><p>這份禮物在哪裡領？<br>在一個人裡面。</p>","exp":"<p>弟兄姊妹，6:23是全本聖經最常被引用的福音經文之一。</p><p>但它常常被抽出來單獨用，失去了整章的脈絡。</p><p>放回第六章來讀，它的意思是：</p><pre>你以前的雇主，罪：每一天都在準時付你薪水\n   ↓\n你有沒有算過，這些年你領了多少？\n   ↓\n它付的是死——一次一點，一次一點\n   ↓\n但神不是雇主，神是給禮物的\n   ↓\n祂不分期，祂一次給完\n   ↓\n而那份禮物的名字，叫做永生</pre><p>這就是為什麼保羅可以斬釘截鐵地回答6:1那個問題：</p><p>「我們可以仍在罪中嗎？」</p><p>保羅的最終回答不是「不可以」，而是——</p><p>「你為什麼要回去領那份薪水？<br>你已經有禮物了。」</p>"}],"7":[{"a":1,"z":1,"star":false,"grk":"<p>Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ' ὅσον χρόνον ζῇ;</p>","lit":"<p>「弟兄們，還是你們<b>不知道</b>——我是對懂律法的人說的——律法<b>作人的主</b>，只在他活著的期間？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>管</td><td>κυριεύει</td><td>kyrieuei</td><td>G2961</td><td>κύριος（主）</td><td><b>作主、掌權</b></td><td><b>6:9、6:14同字</b></td></tr><tr><td>活著的時候</td><td>ἐφ' ὅσον χρόνον ζῇ</td><td>—</td><td>—</td><td>—</td><td>只要他還活著</td><td>律法權柄的時效</td></tr></table>","gram":"<p>★ κυριεύω 的三次旅程</p><p>這個字（「作主」）在羅馬書中的出現，是一條清楚的線：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>6:9</b></td><td><b>死</b>不再<b>作</b>基督的<b>主</b>了</td></tr><tr><td><b>6:14</b></td><td><b>罪</b>必不能<b>作</b>你們的<b>主</b></td></tr><tr><td><b>7:1</b></td><td><b>律法</b>只在人活著時<b>作</b>人的<b>主</b></td></tr></table><p>三個「主人」：死、罪、律法。</p><p>保羅一個一個地說：它們對你都沒有主權了。</p><p>而解除的方式，都是同一個——<b>死亡</b>。</p>","exp":"<p>保羅在此建立一個所有人都同意的法律常識：</p><p>法律只管活人。</p><p>一個人死了，追訴就終止了。</p><p>這正是6:7已經說過的：「已死的人是脫離了罪。」</p>"},{"a":2,"z":3,"star":false,"grk":"<p>2 ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.</p>","lit":"<p>2「因為已婚的婦人，在丈夫還活著的時候，是<b>被律法綁住</b>的；但丈夫若死了，她就<b>從那丈夫的律法上被解除了職權</b>。」<br>3「所以，丈夫還活著時，她若歸於別的男人，就要被稱為<b>淫婦</b>；但丈夫若死了，她就<b>在律法上自由了</b>，即使歸於別的男人，也<b>不是淫婦</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>有了丈夫</td><td>ὕπανδρος</td><td>hypandros</td><td>G5220</td><td>ὑπό（在下）+ ἀνήρ（丈夫）：<b>在丈夫權下的</b></td></tr><tr><td>被約束</td><td>δέδεται</td><td>dedetai</td><td>G1210</td><td><b>完成被動式：已被捆綁，且持續被綁</b></td></tr><tr><td>脫離了</td><td>κατήργηται</td><td>katērgētai</td><td>G2673</td><td><b>καταργέω——6:6那個字！</b></td></tr><tr><td>淫婦</td><td>μοιχαλίς</td><td>moichalis</td><td>G3428</td><td>姦淫的婦人</td></tr></table>","gram":"<p>★ καταργέω 又出現了</p><p>「就<b>脫離了</b>丈夫的律法」——原文正是 6:6「使罪身<b>滅絕</b>」的那個字。</p><p>這一次的用法，把這個字的意思講得更清楚：</p><p>一個寡婦不是「被消滅了」。</p><p>她是<b>從那個法律關係中被解除了</b>。</p><p>婚姻的律法對她<b>不再有效</b>——但她本人還在，還活著，還可以再嫁。</p><p>這正是6:6的意思：罪的權柄對我失效了，但我還在。</p><p>★ δέδεται 是完成被動式</p><p>「被律法約束」——已經被綁上，而且一直綁著。</p><p>保羅要強調：這個約束是<b>真實的、持續的、無法自行解除的</b>。</p>","exp":"<p>弟兄姊妹，保羅選這個比喻，是因為它有一個特點：</p><p>婚約不能靠「努力」解除。</p><p>一個妻子不能說：「我很努力，所以我現在自由了。」</p><p>只有一件事能解除婚約：<b>死</b>。</p><p>這正是保羅的重點：</p><p>你與律法的關係，不能靠你「表現得更好」而改變。</p><p>只能靠死。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι, ἵνα καρποφορήσωμεν τῷ θεῷ.</p>","lit":"<p>「所以，我的弟兄們，你們也<b>被治死</b>了，就律法而言，是<b>藉著基督的身體</b>——為要使你們<b>歸屬於另一位</b>，就是那從死人中被復活的，好叫我們<b>為神結果子</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>死了</td><td>ἐθανατώθητε</td><td>ethanatōthēte</td><td>G2289</td><td>θανατόω</td><td><b>被治死</b>（不定過去被動）</td><td>見下</td></tr><tr><td>基督的身體</td><td>τὸ σῶμα τοῦ Χριστοῦ</td><td>—</td><td>G4983</td><td>—</td><td>基督被釘的身體</td><td>十字架</td></tr><tr><td>歸於</td><td>γενέσθαι ἑτέρῳ</td><td>—</td><td>G2087</td><td>ἕτερος（另一位）</td><td><b>成為屬於另一位的</b></td><td>婚姻用語</td></tr><tr><td>結果子</td><td>καρποφορήσωμεν</td><td>karpophorēsōmen</td><td>G2592</td><td>καρπός + φέρω</td><td>結出果子</td><td>婚姻的自然結果</td></tr></table>","gram":"<p>★ 亮光一：ἐθανατώθητε 是被動式</p><p>「你們……<b>被治死</b>了」——不是「你們死了」，是「<b>你們被處死了</b>」。</p><p>這個動詞在新約用於<b>司法處決</b>（太26:59「要治死他」；可14:55）。</p><p>保羅在說：那不是自然死亡，是一場<b>行刑</b>。</p><p>而行刑的地點是各各他，被處死的是基督的身體——<br>但因為你在祂裡面，你也一同被處死了。</p><p>★ 亮光二：比喻的角色轉換</p><p>這是本段最常被指出的「不對稱」：</p><pre>比喻中（7:2–3）：丈夫死了 → 妻子自由\n應用中（7:4）  ：你死了   → 你自由</pre><p>保羅似乎把角色調換了。</p><p>幾種理解：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>比喻的重點不在角色，在原則</b></td><td>原則是：<b>死亡終止法律關係</b></td></tr><tr><td><b>保羅刻意的調整</b></td><td>因為律法不會「死」（律法是聖潔的、永存的），所以死的必須是我</td></tr><tr><td><b>雙重死亡</b></td><td>我死了，所以那個婚約結束了；同時我在基督裡復活，可以歸於另一位</td></tr></table><p>我認為第二種最貼合上下文：</p><p>保羅不能說「律法死了」——因為7:12馬上要說律法是聖潔、公義、良善的。</p><p>所以死的必須是我。</p><p>★ 亮光三：「歸於別人」是婚姻語言</p><p>γενέσθαι ἑτέρῳ ——字面是「成為屬於另一位的」。</p><p>這正是舊約先知常用的婚姻意象（何西阿書；以賽亞書54:5「你的造物主是你的丈夫」）。</p><p>保羅在說：你不是從一段婚姻走出來，變成單身。</p><p>你是<b>改嫁了</b>。</p><p>★ 亮光四：καρποφορέω（結果子）</p><p>在婚姻的比喻中，「結果子」有一個很自然的含意：<b>生育</b>。</p><p>保羅在說：新的婚姻會結出新的果子。</p><p>而這個果子是「<b>給神的</b>」（τῷ θεῷ）。</p><p>對照7:5：「以致結成<b>死亡</b>的果子。」</p><pre>舊的婚姻（在律法之下） → 死亡的果子\n新的婚姻（歸於基督）   → 給神的果子</pre>","exp":"<p>弟兄姊妹，第4節有一個極美的重點常被忽略：</p><p>保羅講「脫離律法」，不是為了讓我們<b>自由</b>。</p><p>是為了讓我們<b>歸屬另一位</b>。</p><p>「叫你們歸於別人，就是歸於那從死裡復活的。」</p><p>這與第六章完全一致：</p><p>人不是在「有主人」與「沒主人」之間選（6:16）。<br>人也不是在「有婚約」與「沒婚約」之間選。</p><p>你不是離婚變單身，你是改嫁。</p>"},{"a":5,"z":6,"star":false,"grk":"<p>5 ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·<br>6 νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.</p>","lit":"<p>5「因為當我們<b>在肉體中</b>的時候，那些<b>藉著律法而來的</b>罪的情慾，就在我們的肢體中<b>發動運作</b>，以致為死亡結果子。」<br>6「但<b>如今</b>，我們既在那捆綁我們的<b>死了</b>，就<b>從律法被解除</b>了，以致我們<b>在靈的新樣中</b>服事，而不在<b>儀文的舊樣中</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>屬肉體</td><td>ἐν τῇ σαρκί</td><td>en tē sarki</td><td>G4561</td><td><b>在肉體中</b>（一種存在狀態，見下）</td></tr><tr><td>惡慾</td><td>τὰ παθήματα τῶν ἁμαρτιῶν</td><td>pathēmata</td><td>G3804</td><td><b>罪的情慾／激情</b></td></tr><tr><td>發動</td><td>ἐνηργεῖτο</td><td>enērgeito</td><td>G1754</td><td>ἐν + ἔργον：<b>在裡面運作</b>（英文 energy 源出此字）</td></tr><tr><td>現今</td><td>νυνὶ δέ</td><td>nyni de</td><td>G3570</td><td><b>但如今</b>——3:21那個詞組！</td></tr><tr><td>儀文</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>成文的字句（<b>2:29同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：νυνὶ δέ ——「但如今」再次出現</p><p>這個詞組我們在3:21見過：</p><p><b>「</b>但如今<b>，神的義在律法以外已經顯明出來。」</b>（3:21）</p><p><b>「</b>但如今<b>，我們既然在捆我們的律法上死了。」</b>（7:6）</p><p>保羅用同一個轉折詞，標記救恩歷史的兩次分水嶺。</p><p>★ 亮光二：γράμμα ／ πνεῦμα ——2:29的對比再現</p><pre>2:29  真割禮也是心裡的，在乎靈（πνεῦμα），不在乎儀文（γράμμα）\n7:6   按著心靈（πνεύματος）的新樣，不按著儀文（γράμματος）的舊樣\n林後3:6 字句（γράμμα）叫人死，精意（πνεῦμα）叫人活</pre><p>保羅三處使用同一組對比。</p><p>而這組對比<b>不是</b>「聖經的字面 vs 屬靈的意思」，<br>是<b>舊約時代外在的成文體系 vs 新約時代聖靈內住的實際</b>。</p><p>（詳見羅馬書第二章與第三章的相關討論）</p><p>★ 亮光三：第七章唯一一次提到聖靈</p><p>7:6的「心靈」（πνεῦμα）——和合本註明「或譯聖靈」。</p><p>多數註釋認為此處指<b>聖靈</b>。</p><p>弟兄姊妹，請記住這個位置：</p><p>這是第七章唯一一次提到聖靈——而它在7:7的掙扎<b>開始之前</b>。</p><p>7:7–25，聖靈一次都沒有出現。</p><p>然後第八章，聖靈出現約20次。</p><p>★ 亮光四：ἐν τῇ σαρκί 是狀態，不是「有身體」</p><p>「屬肉體」（ἐν σαρκί）在保羅書信中，通常指<b>未被聖靈更新的存在狀態</b>，不是指「有身體」。</p><p>證據：8:9「如果神的靈住在你們心裡，你們就<b>不屬肉體</b>，乃屬聖靈了。」</p><p>保羅顯然不是說信徒沒有身體。他是說信徒不再活在那個舊的存在秩序裡。</p>","exp":"<p>弟兄姊妹，7:5有一句很嚇人的話：</p><p>「那<b>因律法而生</b>的惡慾。」</p><p>保羅說：律法會<b>激起</b>罪的情慾。</p><p>這怎麼可能？</p><p>保羅在7:7–13會詳細解釋。但先給一個生活的例子：</p><p>一張告示上寫著「油漆未乾，請勿觸摸」——</p><p>你本來根本沒注意到那面牆。</p><p>看完告示之後，你的手指開始發癢。</p><p>律法沒有錯。它說的是實話。</p><p>但它照出了我裡面本來就有的東西——</p><p>而那個東西，一被照到，就開始動了。</p><p>【第二段｜7:7–12　律法是罪嗎？】</p>"},{"a":7,"z":7,"star":true,"grk":"<p>Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου· τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· οὐκ ἐπιθυμήσεις.</p>","lit":"<p>「那麼我們要說什麼？律法是罪嗎？<b>絕不可能</b>！但我若不是藉著律法，就<b>不會認識</b>罪。因為若不是律法說『<b>不可貪心</b>』，我就不會知道貪心。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>斷乎不是</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td>希臘文最強的否定</td></tr><tr><td>不知</td><td>οὐκ ἔγνων</td><td>ouk egnōn</td><td>G1097</td><td><b>不會認識</b>（經驗性的認識）</td></tr><tr><td>貪心</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>強烈的渴望；<b>十誡第十條</b></td></tr></table>","gram":"<p>★ 保羅為什麼單挑第十誡？</p><p>十誡的前九條，都可以在<b>外面</b>檢查：</p><table><tr><th>誡命</th><th>可否從外面看見</th></tr><tr><td>不可有別的神</td><td>大致可以（你去哪裡敬拜）</td></tr><tr><td>不可拜偶像</td><td>可以</td></tr><tr><td>不可妄稱神的名</td><td>可以（聽你說話）</td></tr><tr><td>當守安息日</td><td>可以</td></tr><tr><td>當孝敬父母</td><td>大致可以</td></tr><tr><td>不可殺人</td><td>可以</td></tr><tr><td>不可姦淫</td><td>可以</td></tr><tr><td>不可偷盜</td><td>可以</td></tr><tr><td>不可作假見證</td><td>可以</td></tr><tr><td><b>不可貪心</b></td><td><b>完全看不見</b></td></tr></table><p>弟兄姊妹，這就是為什麼保羅單挑這一條。</p><p>保羅在腓3:6說：「就律法上的義說，我是<b>無可指摘</b>的。」</p><p>他在看得見的九條上，拿了滿分。</p><p>然後有一天，第十條找上了他。</p><p>而第十條，是唯一一條<b>只有神和你自己知道</b>的。</p><p>★ οὐκ ἔγνων 的意義</p><p>「我就不知何為罪」——不是說保羅完全沒有罪的概念。</p><p>γινώσκω 常指<b>經驗性的、切身的認識</b>。</p><p>保羅的意思是：若沒有律法，我<b>不會真的認出</b>那是罪。</p><p>我會以為那只是「人之常情」。</p>","exp":"<p>弟兄姊妹，7:7是一句極重要的辯護：</p><p>律法<b>不是</b>罪。</p><p>保羅在這裡守住了一條線。</p><p>很多人讀完第六章「不在律法之下」，會得出結論：律法是敵人。</p><p>保羅說：斷乎不是。</p><p>律法是那個把「我以為只是個人習慣」的東西，正式命名為「罪」的東西。</p><p>它不製造罪。它<b>命名</b>罪。</p>"},{"a":8,"z":11,"star":true,"grk":"<p>8 ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν· χωρὶς γὰρ νόμου ἁμαρτία νεκρά.<br>11 ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι' αὐτῆς ἀπέκτεινεν.</p>","lit":"<p>8「但罪<b>抓住了據點</b>，藉著誡命，在我裡面<b>製造出</b>各樣的貪心；因為沒有律法，罪是死的。」<br>11「因為罪<b>抓住了據點</b>，藉著誡命<b>徹底欺騙了我</b>，並且藉著它<b>殺了我</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>趁著機會</td><td>ἀφορμή</td><td>aphormē</td><td>G874</td><td>ἀπό + ὁρμάω（衝出）</td><td><b>出發點、據點、灘頭堡</b></td><td><b>軍事用語</b>（見下）</td></tr><tr><td>發動</td><td>κατειργάσατο</td><td>kateirgasato</td><td>G2716</td><td>κατά + ἐργάζομαι</td><td><b>製造出</b>（強調結果）</td><td>6:13、5:3同字</td></tr><tr><td>引誘</td><td>ἐξηπάτησεν</td><td>exēpatēsen</td><td>G1818</td><td>ἐκ + ἀπατάω</td><td><b>徹底欺騙</b></td><td><b>見下——極重要</b></td></tr><tr><td>殺了</td><td>ἀπέκτεινεν</td><td>apekteinen</td><td>G615</td><td>ἀπό + κτείνω</td><td>殺死</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ἀφορμή ——軍事上的「灘頭堡」</p><p>這個字在古典希臘文中的軍事用法，是指：</p><p>一支軍隊發動攻擊的<b>出發基地、據點、橋頭堡</b>。</p><p>（其他新約用法：林後5:12、11:12「<b>機會</b>」；加5:13「不可將你們的自由當作放縱情慾的<b>機會</b>」；提前5:14）</p><p>保羅的畫面是：</p><p>罪本來在你的領土上沒有立足點。</p><p>然後誡命一來——</p><p>罪就在那道誡命上，建立了一個灘頭堡。</p><p>弟兄姊妹，這個畫面極其精確，因為它符合我們的經驗：</p><p>「不可貪心」——這道誡命本身是聖潔的。</p><p>但罪一聽見它，就把它變成攻擊我的<b>發射台</b>。</p><p>注意：保羅刻意不把責任推給律法。</p><p>建立據點的是<b>罪</b>（主詞是 ἡ ἁμαρτία）。<br>誡命只是被利用的地形。</p><p>★ 亮光二：ἐξαπατάω ——伊甸園的字</p><p>「引誘我」（7:11）——ἐξηπάτησεν。</p><p>這個字在新約出現5次，其中兩次極其重要：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>林後11:3</b></td><td>「我只怕你們的心或偏於邪，失去那向基督所存純一清潔的心，就像<b>蛇用詭詐誘惑了夏娃</b>一樣。」</td></tr><tr><td><b>提前2:14</b></td><td>「不是亞當<b>被引誘</b>，乃是女人<b>被引誘</b>，陷在罪裡。」</td></tr></table><p>兩處都用同一個字（或其字根），描述<b>伊甸園裡蛇對夏娃所做的事</b>。</p><p>弟兄姊妹，保羅在7:11用的，正是那個字。</p><p>他在說：發生在我身上的事，跟伊甸園裡發生的事，是同一件事。</p><p>而創世記3:13夏娃自己說了什麼？</p><p>「那蛇<b>引誘</b>我，我就吃了。」</p><p>七十士譯本用的正是 ἠπάτησέν με——<b>幾乎與羅7:11一模一樣</b>。</p><p>這是7:7–13「這個『我』是誰」的重要線索之一：</p><p>保羅可能是在用亞當／夏娃的經歷，作為全人類經歷的原型。</p><p>★ 亮光三：「誡命來到，罪又活了，我就死了」（7:9）</p><p>這一節是全章最難解的一節之一。</p><p>「我以前沒有律法是活著的」——這是什麼時候？</p><p>主要的理解：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>亞當在伊甸園</b></td><td>誡命來到（不可吃）→ 罪活了 → 亞當死了</td></tr><tr><td><b>以色列在西奈山之前</b></td><td>律法賜下之前 → 律法來到 → 死</td></tr><tr><td><b>保羅個人：受誡命之前的童年</b></td><td>猶太男孩13歲行 bar mitzvah 之前</td></tr><tr><td><b>任何人在良心真正被光照之前</b></td><td>一種普遍的人類經驗</td></tr></table><p>誠實的說明：這四種理解都有支持者。</p><p>但四種理解的<b>結論一致</b>：</p><p>律法一來到，那個原本蟄伏的東西就活了；而我，就死了。</p><p>★ 亮光四：7:10的悲劇性對句</p><p>「那本來<b>叫人活</b>的誡命，反倒<b>叫我死</b>。」</p><p>律法本來的用意是什麼？</p><p>利18:5「人若遵行，就必因此活著。」<br>申30:19「所以你要揀選生命，使你和你的後裔都得存活。」</p><p>律法本來是<b>生命之路</b>。</p><p>但保羅說：對我，它成了死亡之路。</p><p>不是因為律法變了，是因為<b>我</b>是這樣的人。</p>","exp":"<p>弟兄姊妹，7:8–11畫出了一個完整的犯罪心理學：</p><pre>1. 罪本來在我裡面，但「是死的」（νεκρά，蟄伏、不活動）\n2. 誡命來到，把界線畫出來\n3. 罪抓住那道誡命，建立灘頭堡（ἀφορμή）\n4. 罪用那道誡命欺騙我（ἐξαπατάω，伊甸園的字）\n5. 我以為越過去會得到什麼\n6. 結果：我死了</pre><p>弟兄姊妹，這就是為什麼單靠「訂規矩」永遠不能對付罪。</p><p>因為罪最喜歡的地形，就是規矩。</p>"},{"a":12,"z":13,"star":false,"grk":"<p>12 ὥστε ὁ μὲν νόμος ἅγιος καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.<br>13 …ἵνα γένηται καθ' ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.</p>","lit":"<p>12「所以，<b>律法是聖潔的</b>，<b>誡命也是聖潔、公義、良善的</b>。」<br>13「那麼，那良善的成了我的死嗎？<b>絕不可能</b>！乃是<b>罪</b>——為要顯明它<b>確實是罪</b>，它藉著那良善的，在我身上<b>製造出死</b>；為要使罪<b>藉著誡命，成為極其罪惡的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>聖潔</td><td>ἅγιος</td><td>hagios</td><td>G40</td><td>分別出來歸神的</td></tr><tr><td>公義</td><td>δίκαιος</td><td>dikaios</td><td>G1342</td><td>合乎公義的</td></tr><tr><td>良善</td><td>ἀγαθός</td><td>agathos</td><td>G18</td><td>良善的、有益的</td></tr><tr><td>惡極了</td><td>καθ' ὑπερβολήν</td><td>kath' hyperbolēn</td><td>G5236</td><td><b>超乎尋常地、極度地</b>（英文 hyperbole 源出此字）</td></tr></table>","gram":"<p>★ 7:12是保羅對律法最正面的宣告</p><p>保羅一連用了四個形容詞：</p><pre>律法：ἅγιος（聖潔）\n誡命：ἁγία（聖潔）＋ δικαία（公義）＋ ἀγαθή（良善）</pre><p>弟兄姊妹，這一節必須大聲讀出來。</p><p>因為太多人以為保羅反對律法。</p><p>保羅在這一節，把律法放在最高的位置上。</p><p>★ καθ' ὑπερβολήν ——罪的「爆表」</p><p>「叫罪……更顯出是惡極了」——原文是「<b>超乎尋常地</b>成為罪」。</p><p>這正是律法真正的功用：</p><p>不是讓你變好，是<b>讓罪原形畢露</b>。</p><p>保羅的邏輯是：</p><pre>律法是聖潔、公義、良善的\n   ↓\n罪竟然連這麼好的東西都能拿來害人\n   ↓\n所以罪的惡，超乎尋常地被顯明出來</pre><p>一個能把良藥變成毒藥的東西，有多可怕？</p>","exp":"<p>弟兄姊妹，第七章上半的結論很清楚：</p><p>律法沒有錯。</p><p>律法是聖潔、公義、良善的。</p><p>問題不在鏡子，在鏡子照出來的那張臉。</p><p>而下半章，保羅要把那張臉，湊到我們眼前。</p><p>【第四段｜7:14–20　掙扎的第一輪】</p><p>★ 從這裡開始，時態全部轉為現在式。<br>關於「這個『我』是誰」的完整討論，見第二十部分。此處先按經文本身解釋。</p>"},{"a":14,"z":14,"star":false,"grk":"<p>οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν, ἐγὼ δὲ σάρκινός εἰμι πεπραμένος ὑπὸ τὴν ἁμαρτίαν.</p>","lit":"<p>「因為我們<b>知道</b>律法是屬靈的；但<b>我</b>是<b>肉做的</b>，是<b>已經被賣</b>到罪的權下。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>屬乎靈的</td><td>πνευματικός</td><td>pneumatikos</td><td>G4152</td><td>πνεῦμα</td><td><b>屬靈的、出於聖靈的</b></td><td>律法的來源</td></tr><tr><td>屬乎肉體的</td><td>σάρκινος</td><td>sarkinos</td><td>G4560</td><td>σάρξ（肉）</td><td><b>肉做的、由肉構成的</b></td><td>見下</td></tr><tr><td>賣給罪</td><td>πεπραμένος</td><td>pepramenos</td><td>G4097</td><td>πιπράσκω（賣）</td><td><b>完成被動分詞：已被賣掉</b></td><td>奴隸市場用語</td></tr></table>","gram":"<p>★ 亮光一：σάρκινος 而不是 σαρκικός</p><p>希臘文有兩個相近的形容詞：</p><table><tr><th>字</th><th>字尾</th><th>意思</th></tr><tr><td><b>σάρκινος</b></td><td>-ινος</td><td><b>由某種材料構成的</b>（肉做的）</td></tr><tr><td><b>σαρκικός</b></td><td>-ικος</td><td><b>具有某種特質的</b>（屬肉體的、肉慾的）</td></tr></table><p>保羅在7:14用的是 <b>σάρκινος</b>——「<b>肉做的</b>」。</p><p>這個字強調的是<b>材質、構成、本質上的軟弱</b>，不是道德上的敗壞。</p><p>保羅在說：律法是屬天的材質，我是屬地的材質。<br>兩者根本不匹配。</p><p>（同字用於林後3:3「寫在<b>心版</b>上」——肉做的心版；林前3:1保羅用另一個字 σάρκινος 形容哥林多人是「屬肉體的」）</p><p>★ 亮光二：πεπραμένος ὑπὸ τὴν ἁμαρτίαν（賣給罪）</p><p>這是全章最強烈、也最具爭議的一句話。</p><p>πιπράσκω 是<b>奴隸市場的用語</b>——把人賣掉。</p><p>完成被動分詞：<b>已經被賣了，而且維持在那個狀態</b>。</p><p>這句話造成了第七章最大的解經難題：</p><p>6:18說「你們既從罪裡得了<b>釋放</b>」——<br>7:14卻說「我是已經<b>賣給罪</b>了」。</p><p>怎麼協調？（見第二十部分）</p><p>★ 亮光三：οἴδαμεν（我們知道）vs ἐγώ（但我）</p><pre>οἴδαμεν —— 我們知道（複數，教義的共識）\nἐγὼ δέ  —— 但我（單數，個人的現況）</pre><p>保羅刻意把「大家都知道的道理」與「我實際的光景」對立起來。</p><p>這正是第七章的痛點：</p><p>道理我懂。<br>可是——我做不到。</p>","exp":"<p>弟兄姊妹，7:14是一句誠實到令人不舒服的話。</p><p>保羅沒有說：「律法太難了。」</p><p>保羅說：「律法是屬靈的，<b>我是肉做的</b>。」</p><p>問題不在標準太高，在材質不對。</p>"},{"a":15,"z":17,"star":true,"grk":"<p>15 ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ' ὃ μισῶ τοῦτο ποιῶ.<br>17 νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.</p>","lit":"<p>15「因為我所<b>做成的</b>，我<b>不認識</b>；因為我所<b>願意的</b>，我不去實行；我所<b>恨惡的</b>，我倒去做。」<br>17「但如今，<b>不再是我</b>做成那事，乃是<b>住在我裡面的罪</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>不明白</td><td>οὐ γινώσκω</td><td>ou ginōskō</td><td>G1097</td><td><b>不認識、認不出來</b>（不是「不理解原理」）</td></tr><tr><td>願意</td><td>θέλω</td><td>thelō</td><td>G2309</td><td>意志的決定</td></tr><tr><td>恨惡</td><td>μισῶ</td><td>misō</td><td>G3404</td><td><b>恨惡</b>（強烈的字）</td></tr><tr><td>住</td><td>οἰκοῦσα</td><td>oikousa</td><td>G3611</td><td>οἶκος（房子）：<b>居住、定居</b></td></tr></table>","gram":"<p>★ 亮光一：οὐ γινώσκω ——「我認不出來」</p><p>「我所做的，我自己不明白」——這個字不是「我不懂原理」。</p><p>γινώσκω 是<b>認識、認出</b>。</p><p>保羅的意思是：</p><p>我做出來的那件事，我<b>認不出那是我</b>。</p><p>弟兄姊妹，這是每一個誠實的人都有過的經驗：</p><p>事情做完之後，你看著自己，心裡想：</p><p>「那個人是誰？」</p><p>★ 亮光二：μισῶ（恨惡）的重量</p><p>保羅不是說「我覺得不太好」。</p><p>他說：<b>我恨惡它</b>。</p><p>這一個字，是判斷「這個『我』是誰」的重要線索。</p><p>一個未重生的人，會<b>恨惡</b>自己的罪嗎？</p><p>他可能後悔、可能羞愧、可能怕後果——<br>但「恨惡」是一個很強的道德判斷。</p><p>★ 亮光三：οἰκέω（住）——罪是個房客</p><p>「住在我裡頭的罪」——ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία。</p><p>οἰκέω 的字根是 οἶκος（房子），意思是<b>居住、定居</b>。</p><p>保羅的畫面是：罪是一個<b>住在我房子裡的房客</b>。</p><p>注意：房客不是屋主。</p><p>這正是6:6的延續：罪被<b>解職了</b>（καταργέω），但它還沒搬走。</p><p>而第八章會給出對照：</p><p>羅8:9「如果神的靈<b>住在</b>（οἰκεῖ）你們心裡……」<br>羅8:11「叫耶穌從死裡復活者的靈若<b>住在</b>（οἰκεῖ）你們心裡……」</p><p>同一個字！</p><p>第七章：罪住在我裡面。<br>第八章：聖靈住在我裡面。</p><p>這是兩章之間最重要的一組對照。</p><p>★ 亮光四：7:17「不是我做的」是推卸責任嗎？</p><p>這一節常被誤用：「反正不是我做的，是罪做的。」</p><p>必須澄清：</p><p>1. <b>保羅在7:14–25從頭到尾都用「我」——他沒有否認那是他做的</b><br>2. <b>οὐκέτι ἐγώ（不再是我）的重點是「這不再代表真正的我」</b>——因為7:22說「按著我裡面的意思，我是喜歡神的律」<br>3. <b>保羅在別處毫不含糊地要求負責</b>（6:12–13的命令）</p><p>保羅不是在推卸責任，是在<b>做一個身分的區分</b>：</p><p>那個做出來的行為，不代表我的新身分。<br>那是房客做的，不是屋主做的。</p><p>但屋主仍然要為家裡發生的事負責——<b>這正是為什麼他喊「我真是苦啊」</b>。</p>","exp":"<p>弟兄姊妹，7:15描述的是一種<b>分裂</b>：</p><pre>我所願意的（θέλω）  —— 做不到\n我所恨惡的（μισῶ）  —— 卻做了</pre><p>而這個分裂最痛的地方不是「我做錯了」，是——</p><p>我認不出那個做的人是誰。</p>"},{"a":18,"z":20,"star":false,"grk":"<p>18 οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ' ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν οὔ·</p>","lit":"<p>18「因為我知道，在我裡面——就是在我的肉體中——沒有良善<b>居住</b>。因為<b>願意</b>是<b>擺在我旁邊的</b>，但<b>做成</b>那善的，卻不是。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>沒有良善（住）</td><td>οὐκ οἰκεῖ…ἀγαθόν</td><td>—</td><td>G3611/G18</td><td><b>良善不住在我裡面</b>（οἰκέω 又出現）</td></tr><tr><td>由得我</td><td>παράκειταί μοι</td><td>parakeitai</td><td>G3873</td><td>παρά + κεῖμαι：<b>擺在我旁邊、隨手可得</b></td></tr></table>","gram":"<p>★ 亮光一：「在我裡頭，就是我肉體之中」——保羅的自我修正</p><p>注意保羅說了一半，立刻補一句：</p><pre>「在我裡頭」        —— 太籠統了\n「就是我肉體之中」  —— 精確化</pre><p>保羅不是說「我這個人整個沒有一點良善」。</p><p>他是說：在我的<b>肉體</b>中，沒有良善。</p><p>而7:22立刻說：「按著我<b>裡面的意思</b>，我是喜歡神的律。」</p><p>所以保羅心裡有一個區分：肉體 vs 裡面的人。</p><p>★ 亮光二：παράκειμαι ——「擺在旁邊」</p><p>「立志為善<b>由得我</b>」——原文的畫面是：</p><p>「願意」這樣東西，<b>就擺在我手邊，隨時可以拿到</b>。</p><p>保羅的意思是：</p><p>我從來不缺<b>願望</b>。</p><p>願望多得很，隨手就有。</p><p>我缺的是——<b>把它做出來的力量</b>。</p><p>弟兄姊妹，這一句話，說中了多少人的屬靈生活？</p><p>決心，我有一堆。<br>能力，我沒有。</p><p>★ 亮光三：7:19與7:15的重複</p><p>保羅把同樣的話說了兩次（7:15、7:19）。</p><p>這不是重複，是<b>節奏</b>。</p><p>因為那個循環本身，就是重複的。</p><p>保羅用文字模擬了那個轉不出來的圈子。</p>","exp":"<p><b>經文本身明確表達的：</b> 在「我」的肉體中沒有良善；願意是有的，行出來的力量是沒有的。<br><b>合理推論的生命應用：</b> 若我對付罪的方式只是「下更大的決心」，我就還沒有讀懂7:18——因為問題從來不在願望不夠強。</p><p>【第五段｜7:21–23　兩個律的交戰】</p>"},{"a":21,"z":23,"star":true,"grk":"<p>22 συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον,<br>23 βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.</p>","lit":"<p>22「因為按著<b>裡面的人</b>，我<b>與神的律一同歡喜</b>；」<br>23「但我看見在我肢體中另有一個律，<b>對我心思的律發動戰爭</b>，並且把我<b>擄為戰俘</b>，歸入那在我肢體中的罪的律。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>喜歡</td><td>συνήδομαι</td><td>synēdomai</td><td>G4913</td><td>σύν + ἥδομαι（喜悅）</td><td><b>一同歡喜、由衷地喜悅</b></td><td><b>新約僅此一次</b></td></tr><tr><td>裡面的人</td><td>ὁ ἔσω ἄνθρωπος</td><td>esō anthrōpos</td><td>G2080</td><td>—</td><td><b>內在的那個人</b></td><td>見下</td></tr><tr><td>交戰</td><td>ἀντιστρατεύομαι</td><td>antistrateuomai</td><td>G497</td><td>ἀντί + στρατεύομαι</td><td><b>對抗性的軍事行動</b></td><td><b>新約僅此一次</b></td></tr><tr><td>擄去</td><td>αἰχμαλωτίζω</td><td>aic
