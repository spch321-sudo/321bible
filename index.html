:"<p>18「但我要说：<b>他们难道没有听见吗</b>？<b>诚然听见了</b>——『他们的<b>声音</b>传遍全地，他们的<b>话语</b>传到<b>世界的尽头</b>。』」<br>19「但我要说：<b>以色列难道不知道吗</b>？<b>首先摩西说</b>：『我要用<b>那不成子民的</b>，<b>惹动你们的嫉妒</b>；用<b>那无知的民</b>，<b>触动你们的怒气</b>。』」<br>20「而以赛亚<b>放胆说</b>：『<b>那没有寻找我的，我让他们遇见了我</b>；<b>那没有求问我的，我向他们显现了</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>惹动愤恨</td><td>παραζηλώσω</td><td>parazēlōsō</td><td>G3863</td><td>παρά + ζῆλος：<b>激起嫉妒／热心</b></td></tr><tr><td>放胆</td><td>ἀποτολμᾷ</td><td>apotolma</td><td>G662</td><td><b>大胆到底、豁出去说</b></td></tr></table>","gram":"<p>★ 亮光一：παραζηλόω ——第十一章的钥匙</p><p>10:19引申命记32:21：「我要用那不成子民的，<b>惹动你们的愤恨</b>。」</p><p>这个字（παραζηλόω）由 παρά + ζῆλος（热心、嫉妒）组成。</p><p>而ζῆλος 正是10:2「他们向神有<b>热心</b>」的那个字！</p><p>弟兄姊妹，这个字在第十一章成为关键：</p><p>11:11「反倒因他们的过失，救恩便临到外邦人，要<b>激动他们发愤</b>（παραζηλόω）。」<br>11:14「或者可以<b>激动</b>我骨肉之亲<b>发愤</b>（παραζηλόω），好救他们一些人。」</p><p>神的策略是：借着外邦人的蒙恩，激起以色列的渴慕。</p><p>★ 亮光二：ἀποτολμάω ——「放胆」</p><p>「以赛亚<b>放胆</b>说」——这个字在新约只出现这一次。</p><p>它的意思是：<b>豁出去、大胆到底</b>。</p><p>保罗在说：以赛亚说了一句很大胆的话——</p><p>「<b>没有寻找我的</b>，我叫他们遇见。」（赛65:1）</p><p>弟兄姊妹，这句话与罗3:11形成完美的对应：</p><pre>3:11   「没有寻求神的」\n10:20  「没有寻找我的，我叫他们遇见」</pre><p>既然没有人寻求神——<br>那唯一的可能，就是<b>神来找人</b>。</p>","exp":"<p>弟兄姊妹，18–20节在回答一个借口：「他们是不是根本没机会？」</p><p>保罗的回答是三个「不」：</p><pre>18节：他们没听见吗？—— 听见了\n19节：他们不知道吗？—— 摩西早就说了\n20节：那是新的吗？   —— 以赛亚早就说了</pre><p><b>经文本身明确表达的：</b> 信息确实传开了；而外邦人蒙恩，是旧约早已预告的（申32:21；赛65:1）。</p><p><b>可以合理推论的：</b> 20节与3:11形成一组极美的对照——</p><p>3:11「<b>没有寻求神的</b>。」<br>10:20「<b>没有寻找我的</b>，我叫他们遇见。」</p><p>既然没有人寻求神，那唯一的可能，就是<b>神来找人</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 10:18引诗19:4讲「声音传遍全地」，<br>不可用来论证「福音已经传遍世界，所以不必再宣教」——<br>因为保罗自己在15:20–24仍然计划要去西班牙，去「未曾闻知他信息的」地方。</p>"},{"a":21,"z":21,"star":true,"grk":"<p>πρὸς δὲ τὸν Ἰσραὴλ λέγει· ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.</p>","lit":"<p>「但论到以色列，祂说：『<b>整整一天</b>，我<b>张开了我的双手</b>，向着一个<b>不肯被说服、又顶嘴</b>的百姓。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>整天</td><td>ὅλην τὴν ἡμέραν</td><td>holēn tēn hēmeran</td><td>G3650</td><td>—</td><td><b>一整天，从早到晚</b></td><td>—</td></tr><tr><td>伸手</td><td>ἐξεπέτασα</td><td>exepetasa</td><td>G1600</td><td>ἐκ + πετάννυμι（张开）</td><td><b>完全张开、展开</b></td><td>见下</td></tr><tr><td>悖逆</td><td>ἀπειθοῦντα</td><td>apeithounta</td><td>G544</td><td>ἀ + πείθω（说服）</td><td><b>不肯被说服</b></td><td><b>2:8同字</b></td></tr><tr><td>顶嘴</td><td>ἀντιλέγοντα</td><td>antilegonta</td><td>G483</td><td>ἀντί + λέγω</td><td><b>对着说、反驳</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ἐκπετάννυμι ——「张开双手」</p><p>这个动词的意思是「<b>完全张开、展开</b>」（如张开翅膀、展开帆）。</p><p>而「双手」是<b>复数</b>。</p><p>弟兄姊妹，这个姿势是什么？</p><p>不是指责的手指。<br>不是握紧的拳头。</p><p>是一个<b>张开双臂、等着人回来</b>的姿势。</p><p>★ 亮光二：ὅλην τὴν ἡμέραν ——整整一天</p><p>「整天」不是「有时候」。</p><p>是<b>从早到晚，一刻没有放下</b>。</p><p>★ 亮光三：ἀπειθέω ——「不肯被说服」</p><p>这个字不是「不知道」，是 <b>ἀ + πείθω（说服）</b>——</p><p>「<b>不肯被说服</b>」。</p><p>而这个字我们在2:8见过：</p><p>2:8「惟有结党、<b>不顺从</b>（ἀπειθοῦσιν）真理、反顺从不义的。」</p><p>问题不是信息不足，是<b>不肯</b>。</p><p>★ 亮光四：全章的最后一个画面是神的姿势</p><p>弟兄姊妹，这一点极其重要。</p><p>保罗讲了一整章「人的责任」：</p><p>- 你要相信（10:9）<br>- 你要承认（10:9）<br>- 你要求告（10:13）<br>- 有人要去传（10:14–15）</p><p>然后最后一节，镜头转了。</p><p>从人的手，转到<b>神的手</b>。</p><p>而神的手，是<b>张开的</b>。</p><p>而且——<b>整天</b>。</p>","exp":"<p>弟兄姊妹，10:21引自以赛亚书65:2。</p><p>而那一段的上下文是：</p><p>赛65:2「我整天伸手招呼那悖逆的百姓——<br>就是随自己的意念行不善之道的。」</p><p>这是一段<b>控诉</b>。</p><p>但那个控诉的形式，是——</p><p>一双伸了一整天的手。</p><p>弟兄姊妹，如果你今天心里有一个名字——一个你等了很久的人——</p><p>请记得这一节。</p><p>你等他等了很久。</p><p>而神——</p><p>祂的手，已经伸了一整天。</p>"}],"11":[{"a":1,"z":2,"star":true,"grk":"<p>1 Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.<br>2 οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω.</p>","lit":"<p>1「那么我说，神<b>推开</b>了祂的百姓吗？<b>绝不可能</b>！因为我自己也是以色列人，亚伯拉罕的后裔，属便雅悯支派。」<br>2「神并没有推开祂<b>预先所认识</b>的百姓。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>弃绝</td><td>ἀπώσατο</td><td>apōsato</td><td>G683</td><td>ἀπό + ὠθέω（推）</td><td><b>推开、推走</b></td><td>见下</td></tr><tr><td>预先所知道</td><td>προέγνω</td><td>proegnō</td><td>G4267</td><td>πρό + γινώσκω</td><td><b>预先认识</b></td><td><b>8:29同字！</b></td></tr></table>","gram":"<p>★ 亮光一：ἀπωθέομαι 的旧约背景</p><p>这个字（ἀπό ＋ ὠθέω「推」）的意思是「<b>推开、推走</b>」。</p><p>而它在七十士译本中，出现在两处极重要的经文：</p><p>撒上12:22「耶和华既喜悦选你们作他的子民，就必因他的大名<b>不撇弃</b>你们。」<br>诗94:14（LXX 93:14）「因为耶和华必不<b>丢弃</b>他的百姓，也不离弃他的产业。」</p><p>弟兄姊妹，保罗在11:1用的问句，几乎就是引用诗篇94:14的用语。</p><p>他在说：<b>这个问题，圣经自己早就回答过了</b>。</p><p>★ 亮光二：προγινώσκω ——第八章那个字</p><pre>8:29  「因为他预先所知道（προέγνω）的人，就预先定下……」\n   ↓\n11:2  「神并没有弃绝他预先所知道（προέγνω）的百姓。」</pre><p>同一个字。</p><p>第八章：神预先所知道的<b>人</b>，祂会带到得荣耀。<br>第十一章：神预先所知道的<b>百姓</b>，祂没有推开。</p><p>★ 亮光三：保罗拿自己当第一个证据</p><p>「因为<b>我也是</b>以色列人。」</p><p>弟兄姊妹，这是一个极简单、却极有力的论证：</p><p>你问神有没有丢弃以色列人？</p><p>那么——<b>写这封信的人是谁</b>？</p>","exp":"<p>弟兄姊妹，第十一章从一个问题开始——而那是第十章最后一节逼出来的。</p><p>10:21「我<b>整天伸手</b>招呼那悖逆顶嘴的百姓。」</p><p>那只手伸了一整天。而他们不理。</p><p>所以：<b>神是不是要收手了</b>？</p><p><b>经文本身明确表达的：</b> 神没有推开（ἀπωθέομαι）祂的百姓；证据之一，就是保罗自己。</p><p><b>可以合理推论的：</b> 保罗用的动词，正是旧约的用语——<br>诗94:14「耶和华必不<b>丢弃</b>他的百姓」；撒上12:22「必因他的大名<b>不撇弃</b>你们」。</p><p>他在说：<b>这个问题，圣经自己早就回答过了</b>。</p><p>而2节「他<b>预先所知道</b>的百姓」（προγινώσκω），正是8:29那个字。</p><p>弟兄姊妹，这对我们的意义是：</p><p>如果神会对以色列反悔，那第八章的金链也会松。<br>而祂不会。</p>"},{"a":2,"z":5,"star":true,"grk":"<p>4 ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.<br>5 οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ' ἐκλογὴν χάριτος γέγονεν·</p>","lit":"<p>2下「你们岂不晓得经上在<b>以利亚那一段</b>说什么吗？——他怎样<b>向神控诉以色列</b>：」<br>3「『主啊，他们杀了你的先知，拆了你的祭坛；<b>只剩下我一个人</b>，他们还在寻索我的命。』」<br>4「但神的<b>回话</b>（神谕）对他说什么呢？——『<b>我为自己留下了七千人</b>，是<b>未曾向巴力屈膝</b>的。』」<br>5「照样，<b>在现今这时候</b>，也有<b>照着恩典的拣选</b>所留下的<b>余数</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>回话</td><td>χρηματισμός</td><td>chrēmatismos</td><td>G5538</td><td><b>神谕、神的正式答复</b>（新约仅此一次）</td></tr><tr><td>留下</td><td>κατέλιπον</td><td>katelipon</td><td>G2641</td><td><b>我为自己保留下来</b>（<b>主动，主词是神</b>）</td></tr><tr><td>余数</td><td>λεῖμμα</td><td>leimma</td><td>G3005</td><td><b>剩下的</b></td></tr><tr><td>拣选的恩典</td><td>ἐκλογὴν χάριτος</td><td>eklogēn charitos</td><td>G1589/G5485</td><td><b>恩典的拣选</b></td></tr></table>","gram":"<p>★ 亮光一：以利亚的处境</p><p>以利亚说这话的时候，刚刚在迦密山上大获全胜（王上18章）。</p><p>然后耶洗别派人传一句话，他就逃到旷野，坐在罗腾树下求死（王上19:4）。</p><p>而他对神说的话是：</p><p>「<b>只剩下我一个人</b>。」</p><p>弟兄姊妹，这是一个属灵伟人，在最深的孤单中说的话。</p><p>而神的回答不是责备。</p><p>★ 亮光二：κατέλιπον ἐμαυτῷ ——「我为<b>自己</b>留下」</p><p>注意这个动词的两个细节：</p><pre>κατέλιπον —— 【主动语态】，主词是【神】\nἐμαυτῷ    —— 【为我自己】</pre><p>弟兄姊妹，那七千人不是「碰巧没有跪拜巴力」。</p><p>是<b>神为自己保留下来的</b>。</p><p>（王上19:18希伯来原文同样是「我要在以色列人中<b>为自己存留</b>七千人」。）</p><p>★ 亮光三：11:5的「如今也是这样」</p><p>「如今也是这样，照着<b>拣选的恩典</b>，还有所留的余数。」</p><p>弟兄姊妹，保罗在说：</p><p>以利亚的时代是这样。</p><p>现在——<b>也是这样</b>。</p><p>今天仍然有余数。</p>","exp":"<p>弟兄姊妹，以利亚说这句话的时候，刚刚在迦密山上大获全胜（王上18章）。</p><p>然后耶洗别派人传一句话——他就逃到旷野，坐在罗腾树下求死。</p><p>「<b>只剩下我一个人</b>。」</p><p>而神的回答不是责备。</p><p><b>经文本身明确表达的：</b> 神为自己保留了七千人；照样，现今也有照恩典拣选所留的余数。</p><p><b>可以合理推论的：</b> 那个动词是<b>主动语态</b>，主词是<b>神</b>，而且加了「<b>为自己</b>」（κατέλιπον ἐμαυτῷ）。</p><p>那七千人不是「碰巧没有跪拜巴力」——是<b>神为自己保留下来的</b>。</p><p>而以利亚，<b>完全不知道</b>。</p><p><b>⚠ 牧养提醒：</b> 若有人今天觉得「只剩我一个」，<br>这一段最重要的话不是「你要刚强」，是：<b>你不知道的事，比你知道的多</b>。</p>"},{"a":6,"z":6,"star":true,"grk":"<p>εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται χάρις.</p>","lit":"<p>「但若是出于恩典，就不再是出于行为；<b>否则，恩典就不再成其为恩典了</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>恩典</td><td>χάρις</td><td>charis</td><td>G5485</td><td><b>白白给的、不能赚的</b></td></tr><tr><td>行为</td><td>ἔργα</td><td>erga</td><td>G2041</td><td>工作、所做的事</td></tr><tr><td>不然</td><td>ἐπεί</td><td>epei</td><td>G1893</td><td><b>否则、若不然</b>（引出反证）</td></tr><tr><td>就不是</td><td>οὐκέτι γίνεται</td><td>ouketi ginetai</td><td>G3765/G1096</td><td><b>就不再成其为</b></td></tr></table>","gram":"<p>★ 这是全本圣经对「恩典」最简洁的定义性宣告</p><p>保罗的逻辑极其干净：</p><pre>恩典 ＋ 一点行为 ＝ 不是恩典</pre><p>弟兄姊妹，这句话的意思是：</p><p>恩典<b>不能掺水</b>。</p><p>只要掺进一滴「因为我……」，它就<b>在定义上</b>不再是恩典了。</p><p>这与第四章完全一致：</p><p>4:4「作工的得工价，<b>不算恩典</b>，乃是该得的。」</p>","exp":"<p>弟兄姊妹，11:6是全本圣经对「恩典」最干净的一句定义。</p><p>而它的逻辑不是道德性的，是<b>定义性的</b>：</p><pre>恩典 ＋ 一点行为 ＝ 不是恩典</pre><p><b>经文本身明确表达的：</b> 若是出于恩典，就不再是出于行为；否则恩典就不再成其为恩典。</p><p><b>可以合理推论的：</b> 保罗不是说「掺一点行为会比较不好」，<br>他是说：<b>掺了之后，那个东西就换了名字</b>。</p><p>只要掺进一滴「因为我……」，它在<b>定义上</b>已经不是恩典了。</p><p><b>⚠ 牧养提醒：</b> 这一节最常被用在别人身上，其实最该用在自己身上。<br>问一句：我心里是不是有一句「可是我毕竟……」？</p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 …ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,<br>8 …ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.</p>","lit":"<p>7「那么怎么样呢？<b>以色列所寻求的，他们没有得着</b>；<b>惟有蒙拣选的得着了</b>，其余的<b>就变硬了</b>（结了茧）。」<br>8「正如经上所记：『神给了他们<b>昏沉的灵</b>、<b>看不见的眼</b>、<b>听不见的耳</b>，<b>直到今日</b>。』」<br>9「大卫也说：『愿他们的<b>筵席</b>变成<b>网罗</b>、<b>陷阱</b>、<b>绊脚石</b>，作他们的<b>报应</b>；』」<br>10「『愿他们的眼睛<b>昏暗看不见</b>，愿你使他们的<b>腰永远弯下</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>顽梗不化</td><td>ἐπωρώθησαν</td><td>epōrōthēsan</td><td>G4456</td><td>πῶρος（<b>硬皮、结石</b>）：<b>变硬、结痂</b></td></tr><tr><td>昏迷的心</td><td>πνεῦμα κατανύξεως</td><td>pneuma katanyxeōs</td><td>G2659</td><td><b>麻木、昏沉的灵</b></td></tr></table>","gram":"<p>★ 亮光一：πωρόω 与 σκληρύνω 的差别</p><p>罗马书用了两个不同的「刚硬」：</p><table><tr><th>字</th><th>出处</th><th>画面</th></tr><tr><td><b>σκληρύνω</b></td><td>9:18（法老）</td><td><b>硬化、变硬</b></td></tr><tr><td><b>πωρόω</b></td><td>11:7、11:25</td><td><b>πῶρος ＝ 结石、硬皮</b>——像<b>长茧、结痂</b></td></tr></table><p>弟兄姊妹，πωρόω 的画面很有意思：</p><p>它是一种<b>长期摩擦之后长出来的茧</b>。</p><p>（医学上也用于骨折愈合时形成的骨痂）</p><p>★ 亮光二：这一段是本章最沉重的</p><p>11:8–10引用了申29:4、赛29:10、诗69:22–23——全部是审判的话。</p><p>弟兄姊妹，保罗没有淡化这件事。</p><p>他诚实地说：<b>其余的成了顽梗不化的</b>。</p><p>但请注意接下来的11:11：</p><p>「他们失脚是要他们<b>跌倒</b>吗？<b>断乎不是</b>！」</p><p>保罗讲完最沉重的一段，立刻转向盼望。</p>","exp":"<p>弟兄姊妹，7–10节是全章<b>最沉重</b>的一段。</p><p>保罗没有淡化它。他甚至引了三段旧约来加重它（申29:4、赛29:10、诗69:22–23）。</p><p><b>经文本身明确表达的：</b> 以色列所寻求的没有得着；蒙拣选的得着了；其余的变硬了。</p><p><b>可以合理推论的：</b> 「顽梗」（πωρόω）的字根是 <b>πῶρος ＝ 硬皮、结石</b>——<br>那是<b>长期摩擦之后长出来的茧</b>。</p><p>这与9:18的 σκληρύνω（硬化）不同：那是「变硬」，这是「<b>结了茧</b>」。</p><p>而必须注意的平衡：</p><table><tr><th>经文</th><th>说法</th></tr><tr><td><b>11:8</b></td><td><b>神</b>给他们昏迷的心</td></tr><tr><td><b>11:20</b></td><td>他们<b>因为不信</b>，所以被折下来</td></tr><tr><td><b>11:23</b></td><td>他们<b>若不是长久不信</b>，仍要被接上</td></tr></table><p>保罗在同一章里，两面都说了。任何只讲一面的读法都不完整。</p><p><b>⚠ 牧养提醒：</b> 读到这里<b>不可以停</b>。<br>下一节（11:11）立刻问：「他们失脚是要他们跌倒吗？<b>断乎不是</b>！」</p><p>【第二段｜11:11–16　跌倒的目的】</p>"},{"a":11,"z":12,"star":true,"grk":"<p>11 …μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν εἰς τὸ παραζηλῶσαι αὐτούς.</p>","lit":"<p>11「那么我要说：<b>他们绊了一下，是为了要他们倒下去吗</b>？<b>绝不可能</b>！反倒因着他们的<b>过失</b>，救恩临到了外邦人，<b>为要激起他们的嫉妒</b>。」<br>12「如果他们的<b>过失</b>成了世界的<b>富足</b>，他们的<b>亏损</b>成了外邦人的富足，<b>何况他们的满数呢</b>！」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>失脚</td><td>ἔπταισαν</td><td>eptaisan</td><td>G4417</td><td>πταίω</td><td><b>绊了一下、踉跄</b></td><td>见下</td></tr><tr><td>跌倒</td><td>πέσωσιν</td><td>pesōsin</td><td>G4098</td><td>πίπτω</td><td><b>摔倒、倒下去</b>（<b>不能起来</b>）</td><td>见下</td></tr><tr><td>激动发愤</td><td>παραζηλῶσαι</td><td>parazēlōsai</td><td>G3863</td><td>παρά + ζῆλος</td><td><b>激起嫉妒／渴慕</b></td><td><b>10:19同字</b></td></tr><tr><td>丰满</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td>πληρόω（充满）</td><td><b>满数、完全</b></td><td>11:25同字</td></tr></table>","gram":"<p>★ 亮光一：πταίω 与 πίπτω 的关键区别</p><p>保罗刻意用了两个不同的动词：</p><pre>ἔπταισαν（πταίω）—— 【绊了一下、踉跄】—— 可以再站起来\nπέσωσιν（πίπτω） —— 【摔倒、倒下】—— 倒下去起不来</pre><p>弟兄姊妹，保罗的问题是：</p><p>「他们<b>绊了一下</b>，是为了要他们<b>倒下去起不来</b>吗？」</p><p>回答：<b>断乎不是</b>。</p><p>这个动词的区分，是本章盼望的第一个根据。</p><p>★ 亮光二：παραζηλόω ——第十章那个字</p><pre>10:19  「我要用那不成子民的，惹动你们的愤恨（παραζηλόω）」（引申32:21）\n   ↓\n11:11  「要激动他们发愤（παραζηλόω）」\n11:14  「或者可以激动我骨肉之亲发愤（παραζηλόω）」</pre><p>弟兄姊妹，这是神的策略：</p><p>借着<b>外邦人的蒙恩</b>，激起以色列的<b>渴慕</b>。</p><p>而这对外邦信徒有一个直接的含意：</p><p>你们的蒙恩，本身就是为了<b>把他们带回来</b>。</p><p>所以你们<b>没有任何夸口的余地</b>。</p><p>★ 亮光三：πλήρωμα（丰满）——本章的关键字</p><p>这个字在11:12与11:25各出现一次：</p><pre>11:12  他们（以色列）的【丰满】\n11:25  外邦人的【数目添满】（πλήρωμα）</pre><p>保罗用同一个字，讲两群人的「满数」。</p>","exp":"<p>弟兄姊妹，11节的关键在<b>两个不同的动词</b>上，而中文都译成「跌」。</p><pre>πταίω（失脚）—— 绊了一下、踉跄 —— 【还可以站起来】\nπίπτω（跌倒）—— 摔下去、倒在地上 —— 【起不来了】</pre><p>保罗问的是：「他们<b>绊了一下</b>，是为了让他们<b>倒下去起不来</b>吗？」</p><p>答案：<b>断乎不是</b>。</p><p><b>经文本身明确表达的：</b> 以色列的过失不是终局；它在神的计划中有一个目的——使救恩临到外邦人，并激起以色列的渴慕。</p><p><b>可以合理推论的：</b> 这个动词的区分，<b>是全章盼望的第一个根据</b>。</p><p>而它对我们也有话说：<b>你心里那个人，他绊了一下——但那不等于他倒下去起不来了</b>。</p><p>而12节是保罗的「轻重论证」（第五章那个「何况」）：</p><p>如果他们的<b>失败</b>都带来这么大的祝福——</p><p>那他们的<b>归回</b>会带来什么？</p>"},{"a":13,"z":16,"star":false,"grk":"<p>13 Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν· ἐφ' ὅσον μὲν οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,<br>15 εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;</p>","lit":"<p>13「我是<b>对你们外邦人</b>说这话：既然我是<b>外邦人的使徒</b>，我就<b>荣耀我的职分</b>——」<br>14「<b>或者可以激起我骨肉之亲的嫉妒</b>，好<b>救他们一些人</b>。」<br>15「因为，若他们被<b>丢弃</b>，就使世界<b>与神和好</b>；那他们<b>被收纳</b>，<b>岂不是死里复生吗</b>？」<br>16「所献的<b>初熟面团</b>若是圣洁，<b>全团</b>也就圣洁了；<b>树根</b>若是圣洁，<b>树枝</b>也就圣洁了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>敬重</td><td>δοξάζω</td><td>doxazō</td><td>G1392</td><td><b>荣耀、看重</b>（原文是「荣耀我的职分」）</td></tr><tr><td>和好</td><td>καταλλαγή</td><td>katallagē</td><td>G2643</td><td><b>和好</b>（<b>5:10–11同字</b>）</td></tr><tr><td>死而复生</td><td>ζωὴ ἐκ νεκρῶν</td><td>zōē ek nekrōn</td><td>—</td><td><b>从死人中来的生命</b></td></tr><tr><td>新面</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>初熟的果子</b>（<b>8:23同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：11:13–14保罗的策略</p><p>「我是外邦人的使徒，所以<b>荣耀我的职分</b>，<br>或者可以<b>激动我骨肉之亲发愤</b>，好救他们一些人。」</p><p>弟兄姊妹，这是一件很动人的事：</p><p>保罗认真做外邦人的使徒——<br>部分原因是他希望：<b>当犹太人看见外邦人得着了，会渴慕</b>。</p><p>★ 亮光二：11:16的两个比喻</p><pre>新面（ἀπαρχή）／全团（φύραμα）—— 献祭的初熟果子（民15:20–21）\n树根（ῥίζα）／树枝（κλάδοι） —— 引出下面的橄榄树比喻</pre><p>「根」指什么？主要有两种理解：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>列祖（亚伯拉罕、以撒、雅各）</b></td><td>11:28「为列祖的缘故是蒙爱的」支持此说</td></tr><tr><td><b>神的应许／圣约</b></td><td>与11:29「神的恩赐和选召」呼应</td></tr></table><p>两种理解相通：<b>根是神给列祖的应许</b>。</p>","exp":"<p>弟兄姊妹，13节那句话，是整章的<b>收信人声明</b>：</p><p>「我<b>对你们外邦人</b>说这话。」</p><p>这一句决定了11:17–24怎么读——那是<b>对外邦信徒的警告</b>，不是对犹太人的判词。</p><p>而13–14节透露了保罗一件很动人的事：</p><p><b>经文本身明确表达的：</b> 保罗认真看重他外邦使徒的职分，部分原因是盼望借此激起同胞的渴慕，救他们一些人。</p><p><b>可以合理推论的：</b> 这对外邦信徒有一个直接的含意——</p><p>你们的蒙恩，<b>本身就是为了把他们带回来</b>。<br>所以你们<b>没有任何夸口的余地</b>。</p><p><b>⚠ 牧养提醒：</b> 「或者可以救他们<b>一些人</b>」——<br>保罗没有夸大自己的果效。他用的是很谦卑的说法。</p><p>【第三段｜11:17–24　★ 橄榄树】</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,<br>18 μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.</p>","lit":"<p>17「但若有些枝子<b>被折断</b>了，而你这<b>野橄榄</b>却<b>被接</b>在其中，一同有分于那橄榄根的肥汁——」<br>18「你就<b>不可向那些枝子夸口</b>。你若夸口，<b>不是你在扛着根，乃是根在扛着你</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>被折下来</td><td>ἐξεκλάσθησαν</td><td>exeklasthēsan</td><td>G1575</td><td>ἐκ + κλάω（折断）</td><td><b>被折断</b>（被动式）</td><td>—</td></tr><tr><td>野橄榄</td><td>ἀγριέλαιος</td><td>agrielaios</td><td>G65</td><td>ἄγριος（野生的）</td><td><b>野生橄榄</b></td><td>—</td></tr><tr><td>得接</td><td>ἐνεκεντρίσθης</td><td>enekentristhēs</td><td>G1461</td><td>ἐν + κεντρίζω（刺入）</td><td><b>被嫁接进去</b>（被动式）</td><td>本章出现6次</td></tr><tr><td>夸口</td><td>κατακαυχῶ</td><td>katakauchō</td><td>G2620</td><td>κατά + καυχάομαι</td><td><b>对着……夸口、轻看</b></td><td>见下</td></tr><tr><td>托着</td><td>βαστάζεις</td><td>bastazeis</td><td>G941</td><td>βαστάζω</td><td><b>扛着、承受重量</b></td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：两个被动式</p><pre>ἐξεκλάσθησαν —— 【被】折断\nἐνεκεντρίσθης —— 【被】接上</pre><p>弟兄姊妹，两个动词都是被动式。</p><p>枝子不是自己掉下来的，也不是自己爬上去的。</p><p>有一位在做这件事。</p><p>★ 亮光二：κατακαυχάομαι ——「对着夸口」</p><p>这个字比一般的「夸口」（καυχάομαι）更重：</p><p>κατά（对着、向下）＋ καυχάομαι（夸口）＝ <b>对着某人夸口、以某人为衬托而自夸</b>。</p><p>弟兄姊妹，保罗禁止的不只是「骄傲」，<br>是<b>拿别人的失败来垫高自己</b>。</p><p>★★ 亮光三：βαστάζω ——「扛着」</p><p>「不是你<b>托着</b>根，乃是根<b>托着</b>你。」</p><p>βαστάζω 的意思是<b>扛起重量、承载</b>。</p><p>（太8:17「代替我们的软弱，<b>担当</b>我们的疾病」；加6:2「各人的重担要互相<b>担当</b>」——同字）</p><p>弟兄姊妹，这个画面极其清楚：</p><p>一根枝子从来不会扛着树根。</p><p>是<b>根在扛着枝子</b>。</p><p>而枝子如果觉得自己很重要——<br>那只说明它忘了自己是被接上去的。</p><p>★ 亮光四：「肥汁」（πιότης）</p><p>「一同得着橄榄根的<b>肥汁</b>」——πιότης ＝ 丰润的养分、油脂。</p><p>外邦信徒所得的养分，<b>来自那个根</b>——<br>也就是说：来自神给以色列列祖的应许。</p>","exp":"<p>弟兄姊妹，11:17–18是全章的心脏，也是保罗写第十一章的主要目的。</p><p>11:13说得很清楚：「我<b>对你们外邦人</b>说这话。」</p><p>保罗的警告是：</p><p>你们是<b>被接上去</b>的。</p><p>你们喝的养分，来自一个<b>不是你们的根</b>。</p><p>所以——<b>闭嘴，不要夸口</b>。</p>"},{"a":19,"z":22,"star":true,"grk":"<p>20 …τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ὑψηλὰ φρόνει ἀλλὰ φοβοῦ·<br>22 ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ·</p>","lit":"<p>19「那么你要说：『<b>那些枝子被折下来，是为了叫我可以接上</b>。』」<br>20「<b>不错</b>！他们因<b>不信</b>而被折下来；而你因<b>信</b>而<b>站立着</b>。<b>不要心思高傲，反要惧怕</b>。」<br>21「因为神既然<b>没有爱惜那天然的枝子</b>，<b>也必不爱惜你</b>。」<br>22「所以你要看见神的<b>恩慈</b>与<b>严厉</b>：对那些跌倒的人，是严厉；对你，是神的恩慈——<b>只要你持续住在祂的恩慈里</b>；不然，<b>你也要被砍下来</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>自高</td><td>ὑψηλὰ φρόνει</td><td>hypsēla phronei</td><td>G5308/G5426</td><td><b>心思高傲</b>（φρονέω ＝ 8:5「体贴」那个字）</td></tr><tr><td>惧怕</td><td>φοβοῦ</td><td>phobou</td><td>G5399</td><td><b>敬畏、惧怕</b>（命令语气）</td></tr><tr><td>恩慈</td><td>χρηστότης</td><td>chrēstotēs</td><td>G5544</td><td><b>2:4那个字！</b></td></tr><tr><td>严厉</td><td>ἀποτομία</td><td>apotomia</td><td>G663</td><td><b>ἀπό + τέμνω（切）：切断的果决</b>（新约仅此一次）</td></tr></table>","gram":"<p>★ 亮光一：ἀποτομία ——「切下去」</p><p>这个字由 ἀπό（离开）＋ τέμνω（切）组成——</p><p>字面是：<b>干脆地切断</b>。</p><p>而它与同段的动词完全呼应：</p><p>11:22「不然，你也要<b>被砍下来</b>（ἐκκοπήσῃ）。」</p><p>弟兄姊妹，这个字在新约只出现这一次。</p><p>而它出现在一段对<b>外邦信徒</b>的警告里。</p><p>★ 亮光二：χρηστότης ——第二章那个字</p><pre>2:4   「你藐视他丰富的【恩慈】（χρηστότης）、宽容、忍耐，\n       不晓得他的恩慈是【领你悔改】呢？」\n   ↓\n11:22 「神的【恩慈】（χρηστότης）和严厉……向你是有恩慈的，\n       【只要你长久在他的恩慈里】。」</pre><p>弟兄姊妹，这个连结极其重要：</p><p>第二章：神的恩慈是<b>领人悔改</b>的。<br>第十一章：神的恩慈是<b>要人长久住在里面</b>的。</p><p>恩慈从来不是让人放心自满的理由。</p><p>★ 亮光三：「你不可自高，反要惧怕」</p><p>μὴ ὑψηλὰ φρόνει ——「不要心思高傲」。</p><p>而 φρονέω 正是8:5「<b>体贴</b>肉体／体贴圣灵」那个字。</p><p>保罗在说：不要让你的心思往上飘。</p><p>（关于11:20–22的「警告」与「保守」如何协调，见第二十部分。）</p>","exp":"<p>弟兄姊妹，19节把我们心里那句话写出来了。</p><p>我们很少把它说出口，但它常常在那里：</p><p>「那枝子被折下来，是<b>特为叫我接上</b>。」</p><p>白话版就是：<b>还好我不是他们</b>。</p><p>而保罗的回答，第一个字是「<b>不错</b>」。</p><p>他<b>没有否认那个事实</b>。他只是问：<b>你凭什么因为这个而自高</b>？</p><p><b>经文本身明确表达的：</b> 他们因不信被折下，你因信站立；所以不可自高，反要惧怕；并要长久住在神的恩慈里。</p><p><b>可以合理推论的：</b> 这里的「惧怕」（φοβοῦ）的<b>对立面是「自高」，不是「确据」</b>——<br>所以它的意思是<b>敬畏、清醒、不敢轻看</b>，不是「你要一直担心自己会不会得救」。</p><p>而 χρηστότης（恩慈）正是2:4那个字：神的恩慈是<b>领人悔改</b>的，从来不是让人放心自满的理由。</p><p><b>⚠ 讲台诚信提醒：</b> 不可用11:22恐吓信徒（那会摧毁第八章的确据），<br>也不可把它淡化成无关痛痒（那会违背保罗的用意）。<br>最忠实的讲法：<b>保罗同时给警告与保证，而神的保守正是透过信徒的敬畏实现的</b>（腓2:12–13）。</p>"},{"a":23,"z":24,"star":false,"grk":"<p>23 κἀκεῖνοι δέ, ἐὰν μὴ ἐπιμένωσιν τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ἐστιν ὁ θεὸς πάλιν ἐγκεντρίσαι αὐτούς.<br>24 εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.</p>","lit":"<p>23「而他们，<b>若不是持续停留在不信里</b>，也必<b>被接上</b>；因为<b>神能够</b>把他们<b>重新接上</b>。」<br>24「因为你既是<b>从天生的野橄榄上被砍下来</b>，又<b>逆着本性</b>被接在好橄榄上，<b>何况这些本树的枝子，要被接回自己的橄榄树上呢</b>！」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>能够</td><td>δυνατός</td><td>dynatos</td><td>G1415</td><td><b>有能力的</b></td></tr><tr><td>逆着性</td><td>παρὰ φύσιν</td><td>para physin</td><td>G5449</td><td><b>违反自然、反常</b></td></tr></table>","gram":"<p>★ 亮光一：「神<b>能够</b>」（δυνατὸς γάρ ἐστιν ὁ θεός）</p><p>弟兄姊妹，这句话与第四章遥相呼应：</p><p>4:21「且满心相信神所应许的<b>必能做成</b>（δυνατός）。」</p><p>亚伯拉罕所信的那位「叫死人复活、使无变为有」的神——<br>也能把折下来的枝子重新接上。</p><p>★ 亮光二：παρὰ φύσιν ——保罗自己承认这是反常的</p><p>「你……尚且<b>逆着性</b>得接在好橄榄上。」</p><p>弟兄姊妹，这一点很重要：</p><p>保罗<b>知道</b>正常的嫁接不是这样做的。</p><p>他刻意用了一个反常的嫁接，并且自己点出来。</p><p>为什么？</p><p>因为外邦人得救这件事，本身就是「逆着性」的。</p><p>而如果神连「逆着性」的事都做了——<br>祂当然能做那件「顺着性」的事：<b>把本树的枝子接回本树</b>。</p>","exp":"<p>弟兄姊妹，这一段最重要的一句是三个字：「<b>神能够</b>。」</p><p>而这个字（δυνατός），我们在第四章见过：</p><p>4:21「且满心相信神所应许的<b>必能做成</b>（δυνατός）。」</p><p><b>经文本身明确表达的：</b> 若他们不是长久停留在不信里，神能够把他们重新接上。</p><p><b>可以合理推论的：</b> 那位「叫死人复活、使无变为有」的神（4:17），<br>也能把折下来的枝子重新接上。</p><p>而24节的「逆着性」（παρὰ φύσιν）是保罗<b>自己承认</b>的——他知道正常的嫁接不是这样做的。<br>他刻意用了一个反常的嫁接，因为<b>外邦人得救这件事本身就是逆着性的</b>。</p><p><b>⚠ 牧养提醒：</b> 23节那个条件句（「若不是<b>长久</b>不信」）是给盼望的，不是给计算的。<br>它的用途是：<b>让你为那个你已经放弃的人，继续祷告</b>。</p><p>【第四段｜11:25–32　那个奥秘】</p>"},{"a":25,"z":27,"star":true,"grk":"<p>25 …ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ·<br>26 καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται…</p>","lit":"<p>25「……就是<b>部分的</b>硬心临到以色列，<b>直到</b>外邦人的<b>满数</b>进来；」<br>26「<b>并且如此</b>（καὶ οὕτως），全以色列都要得救……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>奥秘</td><td>μυστήριον</td><td>mystērion</td><td>G3466</td><td><b>从前隐藏、如今被启示出来的事</b></td></tr><tr><td>有几分</td><td>ἀπὸ μέρους</td><td>apo merous</td><td>G3313</td><td><b>部分地</b>（不是全部）</td></tr><tr><td>硬心</td><td>πώρωσις</td><td>pōrōsis</td><td>G4457</td><td><b>结茧、变硬</b>（11:7同字根）</td></tr><tr><td>数目添满</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td><b>满数</b>（11:12同字）</td></tr><tr><td>于是</td><td>καὶ οὕτως</td><td>kai houtōs</td><td>G3779</td><td><b>并且如此／照这样</b>（见下）</td></tr></table>","gram":"<p>★ 亮光一：ἀπὸ μέρους ——「有几分」</p><p>保罗<b>没有</b>说「以色列人硬心了」。</p><p>他说：「<b>部分地</b>（ἀπὸ μέρους）硬心临到以色列。」</p><p>这与11:5「还有所留的余数」一致：</p><p>硬心是<b>部分的</b>，不是全体的。</p><p>★ 亮光二：ἄχρι οὗ ——「直到」</p><p>「<b>直到</b>外邦人的数目添满了。」</p><p>弟兄姊妹，「直到」这个词暗示了一个<b>时限</b>。</p><p>那个硬心，不是永久的状态。</p><p>★★ 亮光三：καὶ οὕτως ——「于是」还是「照这样」？</p><p>这是11:26最关键的一个文法问题。</p><p>οὕτως 的基本意思是「<b>如此、照这样</b>」（方式），而不是「然后」（时间）。</p><table><tr><th>读法</th><th>中译</th><th>含意</th></tr><tr><td><b>时间性</b></td><td>「然后，以色列全家都要得救」</td><td>外邦人满数之后，有一个<b>未来的事件</b></td></tr><tr><td><b>方式性</b>（οὕτως 的本义）</td><td>「<b>照这样</b>，以色列全家都要得救」</td><td>得救是<b>借着这个过程</b>（激动发愤）发生的</td></tr></table><p>多数学者承认 οὕτως 的基本意义是「方式」，但也指出它在此带有时间的含意（因为前面有「直到」）。</p><p>★★ 亮光四：「以色列全家都要得救」是什么意思？</p><p>这是罗马书最著名的解经争议之一。必须公平呈现。</p><table><tr><th>观点</th><th>主张</th><th>主要根据</th></tr><tr><td><b>A. 未来民族性的归主</b></td><td>在外邦人满数之后，以色列人将大规模归向基督</td><td>「直到」暗示时限；11:12、15的「丰满」「收纳」；11:23–24「重新接上」</td></tr><tr><td><b>B. 历世历代蒙拣选的以色列人之总数</b></td><td>「全以色列」＝ 神所拣选的所有犹太人，透过历史逐渐得救</td><td>11:5「余数」；οὕτως 是方式；避免与9:6「不都是以色列人」冲突</td></tr><tr><td><b>C. 「以色列」＝ 神的子民（包括教会）</b></td><td>「全以色列」指所有蒙拣选的人，犹太人与外邦人</td><td>加6:16「神的以色列」；罗9:6</td></tr></table><p>A、B 是今日福音派的两种主要立场；C 在改革宗传统中亦有代表（加尔文倾向此类理解）。</p><p>评估：</p><p>支持A的较强理由：</p><p>- <b>本章的「以色列」（11:1、7、25、26）一贯指</b>血统上的以色列<b>——若26节突然改指教会，语意会断裂<br>- </b>11:12「他们的丰满」、11:15「他们被收纳」暗示一个尚未发生的事<b><br>- </b>11:28「就着拣选说，他们为列祖的缘故是蒙爱的」</p><p>支持B的较强理由：</p><p>- <b>οὕτως 的基本意义是「方式」</b><br>- <b>与9:6「从以色列生的不都是以色列人」较一致</b></p><p>我的判断：A 较贴合本章的语意脉络（「以色列」的一贯用法），但 B 有扎实的文法根据，是完全正统的立场。</p><p>★ 讲台诚信提醒：</p><p>这是<b>敬虔学者之间长期存在的差异</b>，不可把任何一方说成异端或不信圣经。</p><p>更重要的是：<b>无论持哪一种立场，本章的</b>牧养重点<b>都一样</b>——</p><p>「你不可向旧枝子夸口」（11:18）；「不是你托着根，乃是根托着你」。</p><p>★ 亮光五：11:26–27的引文</p><p>引自赛59:20–21 ＋ 赛27:9。</p><p>「必有一位救主从锡安出来」——</p><p>希伯来原文（赛59:20）是「必有一位救赎主<b>来到锡安</b>」；<br>七十士译本作「<b>从锡安</b>出来」。保罗所引接近七十士译本。</p><p>（关于这是指第一次来或第二次来，学者也有不同看法。）</p>","exp":"<p>弟兄姊妹，这是全章<b>最有争议</b>的一段。而读它之前，要先注意两个限定词。</p><p>① 「有几分」（ἀπὸ μέρους）——</p><p>保罗<b>没有</b>说「以色列硬心了」。他说：<b>部分地</b>硬心临到以色列。</p><p>② 「等到」（ἄχρι οὗ）——</p><p>那是一个<b>时限</b>。那个硬心，<b>不是永久的状态</b>。</p><p><b>经文本身明确表达的：</b> 部分的硬心临到以色列，直到外邦人的满数进来；而神必要成就祂在赛59:20–21、27:9所应许的。</p><p><b>可以合理推论的：</b> 「以色列全家都要得救」的确切所指，<b>历代敬虔的解经家有不同理解</b>（见第二十部分第一题）。</p><p>⚠ 讲台诚信提醒（本章最重要的一条）：</p><p>① 这一节有三种主要理解，<b>不可宣告任何一方为唯一正解</b>。</p><p>② 无论持哪一种立场，<b>保罗要对外邦信徒说的话完全一样</b>：</p><p>「你<b>不可向旧枝子夸口</b>。」（11:18）</p><p>③ ❌❌ 本段讲的是<b>救恩历史</b>，不是<b>现代政治</b>。<br>保罗在此没有谈任何现代国家的边界或政策。<br>牧者可以有个人的政治看法，但<b>不应把个人的政治立场说成圣经的教导</b>。</p>"},{"a":28,"z":29,"star":true,"grk":"<p>29 ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.</p>","lit":"<p>29「因为神的<b>恩赐</b>与<b>呼召</b>，是<b>不会反悔的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>没有后悔</td><td>ἀμεταμέλητα</td><td>ametamelēta</td><td>G278</td><td>ἀ + μεταμέλομαι（后悔）</td><td><b>不可撤回的、不会反悔的</b></td><td>见下</td></tr><tr><td>恩赐</td><td>χαρίσματα</td><td>charismata</td><td>G5486</td><td>χάρις</td><td><b>恩典的产物</b>（<b>5:15、6:23同字</b>）</td></tr><tr><td>选召</td><td>κλῆσις</td><td>klēsis</td><td>G2821</td><td>καλέω（召）</td><td><b>呼召</b></td><td><b>8:30「所召来的」同字根</b></td></tr></table>","gram":"<p>★ 亮光一：ἀμεταμέλητος ——「不会反悔」</p><p>这个字在新约只出现两次：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>林后7:10</b></td><td>「依着神的意思忧愁，就生出<b>没有后悔</b>的懊悔来」</td></tr><tr><td><b>罗11:29</b></td><td>「神的恩赐和选召是<b>没有后悔</b>的」</td></tr></table><p>弟兄姊妹，这个字的意思是：<b>不会改变主意、不会撤回</b>。</p><p>★ 亮光二：11:28的双面陈述</p><pre>就着福音说 —— 他们是【仇敌】（因为拒绝了弥赛亚）\n就着拣选说 —— 他们是【蒙爱的】（为列祖的缘故）</pre><p>弟兄姊妹，保罗同时说了这两句话，而且没有觉得矛盾。</p><p>这对我们是重要的提醒：</p><p>一个人可能同时处在「拒绝福音」与「仍在神爱中」的张力里。</p>","exp":"<p>11:29是全章、也是全卷书最大的一句保证：</p><p>「神的恩赐和选召，是<b>没有后悔</b>的。」</p><p>弟兄姊妹，这句话的逻辑很简单：</p><p>如果神会对以色列反悔——</p><p>那祂对你也可能反悔。</p><p>而如果祂<b>不会</b>——</p><p>那第八章「都不能隔绝」就有了最终的保证。</p>"},{"a":30,"z":32,"star":true,"grk":"<p>32 συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν, ἵνα τοὺς πάντας ἐλεήσῃ.</p>","lit":"<p>32「因为神把<b>众人一同关进</b>不顺服里，为要<b>怜恤众人</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>圈在</td><td>συνέκλεισεν</td><td>synekleisen</td><td>G4788</td><td>σύν + κλείω（关）</td><td><b>一同关起来、围住</b></td><td>见下</td></tr><tr><td>不顺服</td><td>ἀπείθεια</td><td>apeitheia</td><td>G543</td><td>ἀ + πείθω</td><td><b>不肯被说服</b></td><td>10:21同字根</td></tr><tr><td>怜恤</td><td>ἐλεήσῃ</td><td>eleēsē</td><td>G1653</td><td>ἔλεος（怜悯）</td><td>施怜悯</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：συγκλείω ——「一同关起来」</p><p>这个字在新约出现四次：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>路5:6</b></td><td>「就<b>圈住</b>（συνέκλεισαν）许多鱼」——渔网</td></tr><tr><td><b>加3:22</b></td><td>「圣经把众人都<b>圈在</b>罪里」</td></tr><tr><td><b>加3:23</b></td><td>「我们被看守在律法之下，直<b>圈到</b>那将来的真道显明出来」</td></tr><tr><td><b>罗11:32</b></td><td>「神将众人都<b>圈在</b>不顺服之中」</td></tr></table><p>路加福音5:6的用法极有帮助：</p><p>那是<b>收网</b>的画面——把鱼全部围在网里。</p><p>弟兄姊妹，保罗的画面是：</p><p>神收了一张网，把所有人都围在里面。</p><p>而目的是什么？</p><p>不是为了审判——</p><p>是为了「<b>怜恤众人</b>」。</p><p>★ 亮光二：两个 τοὺς πάντας（众人）</p><pre>συνέκλεισεν... τοὺς πάντας εἰς ἀπείθειαν  —— 圈住【众人】\nἵνα τοὺς πάντας ἐλεήσῃ                    —— 怜恤【众人】</pre><p>同样的词组，出现两次。</p><p>（关于这是否支持普救论，见第二十部分。）</p>","exp":"<p>弟兄姊妹，11:32是罗马书9–11章整个论证的<b>终点</b>。</p><p>而它的结论不是「有些人在里面，有些人在外面」。</p><p>它的结论是：</p><p>「神将众人都圈在不顺服之中，<b>特意要怜恤众人</b>。」</p><p>保罗走了三章的迷宫，最后停在一个字上：</p><p>怜恤。</p><p>【第五段｜11:33–36　★ 颂赞】</p>"},{"a":33,"z":36,"star":true,"grk":"<p>33 Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.<br>36 ὅτι ἐξ αὐτοῦ καὶ δι' αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>33「<b>啊，深哪</b>——神的丰富、智慧、知识！祂的判断<b>何等无法查究</b>，祂的道路<b>何等无法追踪</b>！」<br>36「因为万有都是<b>出于</b>祂，<b>借着</b>祂，<b>归向</b>祂。愿荣耀归给祂，直到永远。阿们。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>深哉</td><td>Ὦ βάθος</td><td>ō bathos</td><td>G899</td><td>—</td><td><b>啊，深度！</b>（感叹词开头）</td><td>见下</td></tr><tr><td>难测</td><td>ἀνεξεραύνητα</td><td>anexeraunēta</td><td>G419</td><td>ἀ + ἐξεραυνάω（彻查）</td><td><b>无法彻底查究的</b></td><td><b>新约仅此一次</b></td></tr><tr><td>难寻</td><td>ἀνεξιχνίαστοι</td><td>anexichniastoi</td><td>G421</td><td>ἀ + ἐξιχνιάζω（<b>追踪脚印</b>）</td><td><b>无法追踪脚印的</b></td><td>见下</td></tr><tr><td>踪迹</td><td>ὁδοί</td><td>hodoi</td><td>G3598</td><td>—</td><td><b>道路</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：Ὦ βάθος ——一个感叹词</p><p>11:33的第一个字是 <b>Ὦ</b>——一个<b>感叹词</b>（「啊！」）。</p><p>第二个字是 <b>βάθος</b>——<b>深度</b>。</p><p>弟兄姊妹，保罗讲完三章最艰难的神学之后，</p><p>第一个字不是一个论点。</p><p>是一声——<b>啊</b>。</p><p>★★ 亮光二：ἀνεξιχνίαστος ——「追不到脚印」</p><p>这个字太美了，必须拆开来看：</p><pre>ἀ-       （不能）\nἐκ-      （出来）\nἴχνος    （脚印！）</pre><p>ἴχνος 这个字我们在第四章见过：</p><p>4:12「按我们的祖宗亚伯拉罕未受割礼而信之<b>踪迹</b>（ἴχνεσιν）去行的人。」</p><p>弟兄姊妹，这个字的画面是：</p><p>一个猎人在雪地上追踪脚印。</p><p>他跟着走、跟着走——</p><p>然后脚印<b>消失了</b>。</p><p>而和合本译「祂的<b>踪迹</b>何其难寻」，把这个画面完整保留了。</p><p>保罗在说：神走过的路，<b>你追不到底</b>。</p><p>你可以跟一段。但总有一个地方，脚印就没有了。</p><p>（这个字在新约只出现两次：罗11:33、弗3:8「基督那<b>测不透</b>的丰富」。）</p><p>★ 亮光三：三个修辞问句（11:34–35）</p><pre>谁知道主的心？      —— 引赛40:13\n谁作过他的谋士呢？  —— 引赛40:13\n谁是先给了他？      —— 引伯41:11</pre><p>特别注意最后一个问句的意义：</p><p>「谁是<b>先给了他</b>，使他后来偿还呢？」</p><p>弟兄姊妹，这句话的意思是：</p><p>没有人<b>先给过神什么</b>。</p><p>所以神<b>不欠任何人</b>。</p><p>（这正是9:15–16「我要怜悯谁就怜悯谁」的根据）</p><p>★★ 亮光四：三个介词（11:36）</p><pre>ἐξ αὐτοῦ  （出于祂）—— 一切的【起源】\nδι' αὐτοῦ （借着祂）—— 一切的【过程】\nεἰς αὐτόν （归向祂）—— 一切的【终点】</pre><p>弟兄姊妹，这是全卷罗马书神学的浓缩，也是「让耶稣得到一切荣耀」最扎实的根据：</p><p>如果起点是祂，过程是祂，终点也是祂——</p><p>那中间<b>没有一个地方</b>，可以插进「我」。</p><p>所以下一句是：</p><p>「愿<b>荣耀归给他</b>，直到永远。阿们！」</p>","exp":"<p>弟兄姊妹，这四节是理解整个9–11章的钥匙。</p><p>保罗讲了三章。他处理了拣选、刚硬、余数、橄榄树、奥秘。</p><p>然后他的结论是什么？</p><p>不是一套完整的系统。</p><p>不是一个可以拿去辩论的立场。</p><p>是——</p><p>「<b>啊，深哪！</b>」</p><p>弟兄姊妹，如果一个人读完罗马书9–11章，</p><p>得到的是<b>一套可以赢辩论的系统</b>——</p><p>那他得到的，跟保罗得到的不一样。</p><p>保罗得到的是：</p><p>跪下来。</p>"}],"12":[{"a":1,"z":1,"star":true,"grk":"<p>Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν εὐάρεστον τῷ θεῷ, τὴν λογικὴν λατρείαν ὑμῶν·</p>","lit":"<p>「所以弟兄们，我<b>借着神的众多怜悯</b>劝你们，把你们的<b>身体</b>呈献上去，作一个<b>活的祭物</b>、圣洁的、神所悦纳的——这就是你们<b>合乎理性／属灵的敬拜事奉</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>所以</td><td>οὖν</td><td>oun</td><td>G3767</td><td>—</td><td><b>因此</b></td><td><b>全卷书的枢纽</b></td></tr><tr><td>劝</td><td>Παρακαλῶ</td><td>parakalō</td><td>G3870</td><td>παρά + καλέω</td><td><b>在旁边呼唤、恳求、鼓励</b></td><td>不是命令，是恳求</td></tr><tr><td>慈悲</td><td>οἰκτιρμοί</td><td>oiktirmoi</td><td>G3628</td><td>οἰκτίρω（怜恤）</td><td><b>深切的怜悯</b>（<b>复数！</b>）</td><td>见下</td></tr><tr><td>献上</td><td>παραστῆσαι</td><td>parastēsai</td><td>G3936</td><td>παρά + ἵστημι</td><td><b>牵到祭坛前呈献</b></td><td><b>6:13同字</b></td></tr><tr><td>身体</td><td>σώματα</td><td>sōmata</td><td>G4983</td><td>—</td><td>身体</td><td><b>不是「心灵」</b></td></tr><tr><td>活祭</td><td>θυσίαν ζῶσαν</td><td>thysian zōsan</td><td>G2378</td><td>—</td><td><b>活着的祭物</b></td><td>见下</td></tr><tr><td>喜悦</td><td>εὐάρεστος</td><td>euarestos</td><td>G2101</td><td>εὖ + ἀρέσκω</td><td><b>蒙悦纳的</b></td><td>LXX 献祭用语</td></tr><tr><td>理所当然</td><td>λογικός</td><td>logikos</td><td>G3050</td><td>λόγος</td><td><b>合乎理性的／属灵的</b></td><td>新约仅两次</td></tr><tr><td>事奉</td><td>λατρεία</td><td>latreia</td><td>G2999</td><td>—</td><td><b>敬拜的事奉</b></td><td><b>9:4「礼仪」同字</b></td></tr></table>","gram":"<p>★ 亮光一：οὖν ——全卷书的枢纽</p><p>弟兄姊妹，「所以」这两个字，是罗马书的分水岭。</p><pre>1–11章：神做了什么（教义）\n   ↓ 【所以】\n12–16章：所以你们要怎么活（实践）</pre><p>保罗的顺序永远是：<b>先讲神做了什么，才讲你要做什么</b>。</p><p>他花了十一章讲「你是谁」，才开始讲「你要做什么」。</p><p>★ 亮光二：Παρακαλῶ ——「劝」而不是「命令」</p><p>保罗<b>没有</b>用命令的语气说「你们必须献上」。</p><p>他用的是 παρακαλέω——<b>在旁边呼唤、恳求</b>。</p><p>（同字根是 παράκλητος——约翰福音中圣灵的称号「<b>保惠师</b>」）</p><p>弟兄姊妹，保罗是一个使徒，他有权柄命令。</p><p>但讲到献身这件事，他选择——<b>恳求</b>。</p><p>★ 亮光三：οἰκτιρμοί ——复数的「慈悲」</p><p>「我以神的<b>慈悲</b>劝你们」——οἰκτιρμῶν 是<b>复数</b>。</p><p>这个字在 LXX 中翻译希伯来文 <b>רַחֲמִים（rachamim）</b>——</p><p>它的字根是 <b>רֶחֶם（rechem，子宫）</b>——<br>是一种<b>母亲对孩子的、从肺腑深处来的怜悯</b>。</p><p>而「复数」意味着什么？</p><p>不是一次的慈悲，是<b>一件又一件的慈悲</b>。</p><p>弟兄姊妹，保罗指的是哪些慈悲？</p><p>就是前面十一章的<b>每一件事</b>：</p><p>称义、和好、圣灵内住、不定罪、不隔绝、怜恤众人……</p><p>这就是献身的动力：<b>不是罪疚，是慈悲</b>。</p><p>★ 亮光四：παρίστημι ——第六章那个字</p><pre>6:13  「将肢体作义的器具【献给】（παραστήσατε）神」\n   ↓\n12:1  「将身体【献上】（παραστῆσαι）」</pre><p>弟兄姊妹，这是全卷书一个美丽的呼应：</p><p>保罗在第六章种下的那颗种子，在第十二章开花了。</p><p>★ 亮光五：「身体」而不是「心灵」</p><p>保罗说的是 <b>τὰ σώματα</b>（身体，复数）。</p><p>不是「把你的心献给神」。<br>是「把你的<b>身体</b>献上」。</p><p>为什么？</p><p>因为身体是<b>具体的</b>。</p><p>身体有地址、有行事历、有钱包、有手机、有一双脚。</p><p>「把心献给神」可以是一种感动；<br>「把身体献上」是<b>明天早上你人在哪里</b>。</p><p>★★ 亮光六：θυσία ζῶσα ——一个矛盾修辞</p><p>「<b>活祭</b>」——在第一世纪，这是一个惊人的说法。</p><p>因为所有的祭物，定义上都是<b>死的</b>。</p><p>弟兄姊妹，一个活的祭物，会有什么问题？</p><p>它<b>会爬下来</b>。</p><p>（这正是为什么下一节的命令是<b>现在式</b>——持续的。）</p><p>★ 亮光七：λογικὴ λατρεία</p><p>两种理解（见第二部分）：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>合乎理性的</b></td><td>面对那么大的慈悲，这是<b>唯一合理</b>的回应</td></tr><tr><td><b>属灵的敬拜</b></td><td>不是外在的仪式，是<b>整个人</b>的敬拜</td></tr></table><p>而 λατρεία 这个字，在9:4指的是<b>圣殿的敬拜服事</b>。</p><p>弟兄姊妹，保罗在说：</p><p>你的日常生活，就是圣殿里的敬拜。</p>","exp":"<p><b>经文本身明确表达的：</b> 因着神的众多怜悯，信徒要把身体呈献为活的、圣洁的、蒙悦纳的祭物，这是合理／属灵的敬拜。<br><b>合理推论的生命应用：</b> 献身的动力若是罪疚感，那不是12:1；12:1的动力是「神的慈悲」——是十一章的「深哉」带出来的。</p>"},{"a":2,"z":2,"star":true,"grk":"<p>καὶ μὴ συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.</p>","lit":"<p>「不要（持续）<b>被塑造成这个世代的外形</b>，反要（持续）<b>被变化</b>——借着<b>心思的更新</b>——好使你们能<b>察验出</b>什么是神的旨意，就是那善良的、可悦纳的、完全的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>效法</td><td>συσχηματίζεσθε</td><td>syschēmatizesthe</td><td>G4964</td><td>σύν + σχῆμα</td><td><b>被塑成同一个外形</b></td><td>见下</td></tr><tr><td>这个世界</td><td>τῷ αἰῶνι τούτῳ</td><td>tō aiōni toutō</td><td>G165</td><td>—</td><td><b>这个世代</b>（不是「地球」）</td><td>—</td></tr><tr><td>变化</td><td>μεταμορφοῦσθε</td><td>metamorphousthe</td><td>G3339</td><td>μετά + μορφή</td><td><b>形态被改变</b>（英文 metamorphosis）</td><td>见下</td></tr><tr><td>更新</td><td>ἀνακαίνωσις</td><td>anakainōsis</td><td>G342</td><td>ἀνά + καινός（<b>质地上的新</b>）</td><td><b>更新、翻新</b></td><td>6:4同字根</td></tr><tr><td>心意</td><td>νοῦς</td><td>nous</td><td>G3563</td><td>—</td><td><b>心思、理智、思维方式</b></td><td>7:23、7:25同字</td></tr><tr><td>察验</td><td>δοκιμάζειν</td><td>dokimazein</td><td>G1381</td><td>—</td><td><b>试验并认可</b></td><td><b>5:4「老练」同字根</b></td></tr></table>","gram":"<p>★★ 亮光一：σχῆμα 与 μορφή 的差别</p><p>希腊文有两个表达「形状」的字：</p><table><tr><th>字</th><th>意思</th><th>特性</th></tr><tr><td><b>σχῆμα</b></td><td><b>外形、样式、外表的形状</b></td><td><b>可变的、暂时的</b>（英文 scheme）</td></tr><tr><td><b>μορφή</b></td><td><b>本质的形态、内在的形状</b></td><td><b>本质性的</b>（英文 morph）</td></tr></table><p>（腓2:6–7用了这两个字：基督本有神的<b>形像</b>（μορφή），却取了奴仆的<b>形像</b>（μορφή），成为人的<b>样式</b>（σχῆμα））</p><p>所以12:2的意思是：</p><pre>μὴ συσχηματίζεσθε —— 不要被塑成这世代的【外形】\nἀλλὰ μεταμορφοῦσθε —— 反要在【本质】上被改变</pre><p>弟兄姊妹，保罗在说：</p><p>世界要你<b>改变外表</b>去配合它。<br>神要你<b>从里面本质性地改变</b>。</p><p>一个是<b>贴上去的</b>；一个是<b>长出来的</b>。</p><p>（诚实提醒：有些学者认为在保罗时代这两个字的区别已不如古典时期严格。但两个字的<b>字根含意</b>确实不同，而保罗在这里刻意并列，这个对比是站得住的。）</p><p>★★ 亮光二：两个现在式被动命令</p><p>两个动词的三个文法特征，每一个都重要：</p><table><tr><th>特征</th><th>意义</th></tr><tr><td><b>现在式</b></td><td><b>持续的</b>——不是一次完成的</td></tr><tr><td><b>被动语态</b></td><td><b>不是我改变自己，是我被改变</b></td></tr><tr><td><b>命令语气</b></td><td><b>但我仍然有责任让自己被改变</b></td></tr></table><p>弟兄姊妹，这三点合起来，正好回答了第六、七、八章的张力：</p><p>不是靠自己咬牙（第七章）。<br>也不是被动地等（那是不负责任）。<br>是——<b>把自己放在会被改变的位置上</b>。</p><p>★★★ 亮光三：改变的机制是「心思的更新」</p><p>「借着<b>心思的更新</b>」——τῇ ἀνακαινώσει τοῦ νοός。</p><p>这个与格（dative）表达的是<b>方法／途径</b>：</p><p>变化是<b>怎么发生</b>的？</p><p>透过<b>心思被更新</b>。</p><p>弟兄姊妹，这一点极其重要，因为它排除了另外两条路：</p><table><tr><th>错误的路</th><th>问题</th></tr><tr><td><b>靠意志力改变行为</b></td><td>那是第七章：「立志为善由得我，只是行出来由不得我」</td></tr><tr><td><b>等一次超自然的经验</b></td><td>保罗说的是 ἀνακαίνωσις——一个<b>过程</b></td></tr></table><p>正确的路是：<b>心思被更新 → 生命就变化</b>。</p><p>这正是321最核心的一句话的直接经文根据：</p><p>改变观念，就改变生命。</p><p>★ 亮光四：νοῦς ——第七章那个字</p><pre>7:23  「肢体中另有个律和我【心中】（νοῦς）的律交战」\n7:25  「我以【内心】（νοῦς）顺服神的律」\n   ↓\n12:2  「【心意】（νοῦς）更新而变化」</pre><p>第七章：我的心思是对的，但我做不到。<br>第十二章：那个心思<b>本身要被更新</b>。</p><p>★ 亮光五：δοκιμάζω ——「察验」</p><p>「叫你们<b>察验</b>何为神的旨意」——δοκιμάζειν。</p><p>这个字的字根是<b>验金属</b>（δοκιμή，5:4「老练」那个字）。</p><p>意思不是「猜测」，是<b>试验之后认出来</b>。</p><p>弟兄姊妹，这一节回答了一个很多人问的问题：</p><p>「我怎么知道神的旨意？」</p><p>而保罗的答案不是「求一个记号」或「等一个声音」。</p><p>保罗的答案是：</p><p>让你的<b>心思被更新</b>——</p><p>然后你就<b>认得出来</b>。</p><p>（正如一个被训练过的验金师，一看就知道那是不是真金。）</p><p>★ 亮光六：神的旨意的三个形容词</p><pre>τὸ ἀγαθόν     —— 善良的\nκαὶ εὐάρεστον —— 可喜悦的（12:1的同一个字！）\nκαὶ τέλειον   —— 完全的</pre><p>注意 εὐάρεστος 在12:1与12:2都出现：</p><p>12:1 我们献上的祭是「神所<b>喜悦</b>的」。<br>12:2 神的旨意是「可<b>喜悦</b>的」。</p><p>同一个字。</p>","exp":"<p>弟兄姊妹，12:1–2的关系是这样的：</p><pre>12:1  一个【决断的动作】：παραστῆσαι（不定过去式）—— 把身体放上去\n   ↓\n12:2  一个【持续的过程】：μεταμορφοῦσθε（现在式）—— 持续地被变化</pre><p>有一次的献上，也有每天的更新。</p><p>（这与6:13的两种时态完全一致。）</p><p>【第二段｜12:3–8　身体里】</p>"},{"a":3,"z":3,"star":true,"grk":"<p>Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ' ὃ δεῖ φρονεῖν ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.</p>","lit":"<p>「因为我借着所赐给我的恩，对你们中间每一个人说：<b>不要想得超过所当想的</b>，倒要<b>想到健全清醒的地步</b>——照着神<b>分给</b>各人<b>信心的量</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>看自己过于所当看</td><td>ὑπερφρονεῖν</td><td>hyperphronein</td><td>G5252</td><td><b>ὑπέρ + φρονέω：想得太高</b>（新约仅此一次）</td></tr><tr><td>合乎中道</td><td>σωφρονεῖν</td><td>sōphronein</td><td>G4993</td><td><b>σῶς（健全）+ φρήν（心思）：心思健全、清醒</b></td></tr><tr><td>分给</td><td>ἐμέρισεν</td><td>emerisen</td><td>G3307</td><td><b>分配、量给</b></td></tr><tr><td>信心的大小</td><td>μέτρον πίστεως</td><td>metron pisteōs</td><td>G3358</td><td><b>信心的量／度量</b></td></tr></table>","gram":"<p>★ 亮光一：四个 φρον- 字的文字游戏</p><pre>μὴ ὑπερφρονεῖν  （不要「过度」地想）\nπαρ' ὃ δεῖ φρονεῖν （超过所当想的）\nἀλλὰ φρονεῖν    （倒要想）\nεἰς τὸ σωφρονεῖν （以致「健全地」想）</pre><p>弟兄姊妹，这四个字中文完全译不出来。</p><p>但它证明了一件事：<b>12:3谈的仍然是「心思」</b>——<br>与12:2的「心意更新」是同一条线。</p><p>★ 亮光二：σωφρονέω ——「健全的心思」</p><p>这个字由 σῶς（健全、安全）＋ φρήν（心思）组成。</p><p>在希腊伦理学中，σωφροσύνη（节制、自制）是<b>四枢德</b>之一。</p><p>和合本译「<b>看得合乎中道</b>」极为传神。</p><p>弟兄姊妹，注意：保罗<b>没有</b>说「要看自己低于所当看的」。</p><p>他说的是「<b>健全</b>」——不高估，也不低估。</p><p>★ 亮光三：「信心的大小」（μέτρον πίστεως）</p><p>两种主要理解：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>神量给各人的信心／恩赐的度量</b></td><td>每个人领受的不同，所以不要比较</td></tr><tr><td><b>信心本身作为衡量的标准</b></td><td>用「信心」这把尺来衡量自己</td></tr></table><p>上下文（12:6「按我们所得的恩赐，各有不同」）支持第一种：</p><p>神<b>分给</b>（ἐμέρισεν）各人的不一样。</p>","exp":"<p>弟兄姊妹，注意保罗在讲恩赐之前，先讲什么？</p><p>先讲<b>怎么看自己</b>。</p><p>这个次序很重要：</p><p>一个没有「看得合乎中道」的人，恩赐越大越危险。</p>"},{"a":4,"z":5,"star":false,"grk":"<p>5 οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, τὸ δὲ καθ' εἷς ἀλλήλων μέλη.</p>","lit":"<p>5「我们这许多人，在基督里是<b>一个身体</b>；而各人<b>彼此互为肢体</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>肢体</td><td>μέλη</td><td>melē</td><td>G3196</td><td><b>身体的部位</b>（<b>6:13、6:19、7:23同字</b>）</td></tr><tr><td>互相</td><td>ἀλλήλων</td><td>allēlōn</td><td>G240</td><td><b>彼此</b></td></tr></table>","gram":"<p>★ 亮光一：μέλη ——第六章那个字的转向</p><pre>6:13  「将你们的【肢体】献给神」—— 我的肢体属于神\n6:19  「将【肢体】献给义作奴仆」\n7:23  「我觉得【肢体】中另有个律」—— 肢体是战场\n   ↓\n12:5  「互相联络作【肢体】」—— 我是别人的肢体！</pre><p>弟兄姊妹，这是一个极美的推进：</p><p>前面：我的<b>肢体</b>要献给神。<br>这里：<b>我自己</b>就是别人的<b>肢体</b>。</p><p>★ 亮光二：ἀλλήλων μέλη ——「彼此互为肢体」</p><p>保罗<b>没有</b>说「我们都是基督身体的肢体」（那是林前12:27）。</p><p>他说的是：「<b>各人互相</b>作肢体。」</p><p>意思是：<b>我是你的手，你是我的眼</b>。</p><p>不只是「我们都属于同一个身体」，而是「<b>我们彼此需要</b>」。</p>","exp":"<p>弟兄姊妹，4–5节紧接在12:3之后——那不是巧合。</p><pre>12:3  不要看自己过于所当看的\n   ↓ 为什么？\n12:4  因为你只是【一个肢体】</pre><p><b>经文本身明确表达的：</b> 一个身子有许多肢体，各有不同的用处；我们在基督里是一个身体，并且<b>各人互相作肢体</b>。</p><p><b>可以合理推论的：</b> 「看得合乎中道」的根据，不是心理建设，是<b>解剖学</b>。</p><p>一只手不必自卑，因为身体需要它；<br>一只手也不必自大，因为它<b>不是身体</b>。</p><p><b>⚠ 牧养提醒：</b> 这一段对两种人都有话说——<br>对觉得自己没用的人：<b>身体需要你</b>。<br>对觉得教会少了自己就不行的人：<b>你是肢体，不是身体</b>。</p>"},{"a":6,"z":8,"star":false,"grk":"<p>6 ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,<br>7 εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ,<br>8 εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει· ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.</p>","lit":"<p>6「我们既照着<b>所赐给我们的恩</b>，得了<b>各样不同的恩赐</b>：或是说预言，就照着<b>信心的比例</b>；」<br>7「或是<b>服事</b>，就在服事上；或是<b>教导的</b>，就在教导上；」<br>8「或是<b>劝慰的</b>，就在劝慰上；<b>分给人的</b>，就要<b>单纯不夹杂</b>；<b>带领的</b>，就要<b>殷勤</b>；<b>怜悯人的</b>，就要<b>欢欢喜喜</b>。」</p>","key":"<table><tr><th>恩赐</th><th>原文</th><th>音译</th><th>附加的态度</th><th>原文</th><th>意义</th></tr><tr><td>说预言</td><td>προφητεία</td><td>prophēteia</td><td>照着信心的程度</td><td>κατὰ τὴν ἀναλογίαν τῆς πίστεως</td><td>按信心的比例</td></tr><tr><td>作执事</td><td>διακονία</td><td>diakonia</td><td>专一执事</td><td>ἐν τῇ διακονίᾳ</td><td>就在服事上</td></tr><tr><td>教导</td><td>διδάσκων</td><td>didaskōn</td><td>专一教导</td><td>ἐν τῇ διδασκαλίᾳ</td><td>—</td></tr><tr><td>劝化</td><td>παρακαλῶν</td><td>parakalōn</td><td>专一劝化</td><td>ἐν τῇ παρακλήσει</td><td><b>12:1「劝」同字</b></td></tr><tr><td>施舍</td><td>μεταδιδούς</td><td>metadidous</td><td><b>诚实</b></td><td><b>ἐν ἁπλότητι</b></td><td><b>单纯、不掺杂</b></td></tr><tr><td>治理</td><td>προϊστάμενος</td><td>proistamenos</td><td><b>殷勤</b></td><td><b>ἐν σπουδῇ</b></td><td><b>急切、认真</b></td></tr><tr><td>怜悯人</td><td>ἐλεῶν</td><td>eleōn</td><td><b>甘心</b></td><td><b>ἐν ἱλαρότητι</b></td><td><b>欢欢喜喜</b>（见下）</td></tr></table>","gram":"<p>★ 亮光一：后三样附加了「态度」</p><p>弟兄姊妹，注意保罗的安排：</p><p>前四样（预言、执事、教导、劝化）——他说「就当专一去做」。</p><p>后三样（施舍、治理、怜悯）——他加了<b>态度</b>：</p><pre>施舍   —— ἐν ἁπλότητι （单纯、不掺杂动机）\n治理   —— ἐν σπουδῇ   （殷勤、认真）\n怜悯人 —— ἐν ἱλαρότητι（欢欢喜喜）</pre><p>★★ 亮光二：ἱλαρότης ——「欢欢喜喜」</p><p>这个字（新约仅此一次）的形容词形式 <b>ἱλαρός</b>，出现在一节很有名的经文：</p><p>林后9:7「因为神喜爱<b>捐得乐意</b>（ἱλαρὸν δότην）的人。」</p><p>（英文 hilarious 就是从这个字来的。）</p><p>弟兄姊妹，保罗在说：</p><p>怜悯人的时候，<b>脸要好看</b>。</p><p>这是一个非常实际、也非常扎心的要求：</p><p>怜悯最容易变质的地方，不是<b>做不做</b>，是<b>做的时候那张脸</b>。</p><p>一个带着不耐烦去帮助人的人，那不是怜悯，那是施舍。</p><p>★ 亮光三：ἁπλότης ——「单纯」</p><p>这个字的字面是「<b>不折叠的、单一的</b>」——没有夹层。</p><p>施舍最容易夹杂什么？</p><p>要被看见。要被感谢。要有回报。</p><p>而 ἁπλότης 的意思是：<b>没有夹层</b>。</p>","exp":"<p>弟兄姊妹，这份恩赐清单有一个很值得注意的特点：</p><p>保罗<b>不是在排名</b>，他是在说「<b>做那件事的时候，要怎么做</b>」。</p><p>而后面三样，各配了一个<b>态度</b>：</p><table><tr><th>恩赐</th><th>该有的态度</th><th>原文</th></tr><tr><td>施舍</td><td><b>单纯、不夹杂</b></td><td>ἁπλότης</td></tr><tr><td>治理</td><td><b>殷勤</b></td><td>σπουδή</td></tr><tr><td>怜悯</td><td><b>欢欢喜喜</b></td><td>ἱλαρότης</td></tr></table><p><b>经文本身明确表达的：</b> 恩赐各有不同，都是按所赐的恩；各人要专一在自己的恩赐上，并带着合宜的态度。</p><p><b>可以合理推论的：</b> 保罗在意的<b>不只是做了什么，还有带着什么心</b>。</p><p>施舍最容易夹杂什么？<b>要被看见、要被感谢、要有回报</b>。<br>而 ἁπλότης 的意思是：<b>没有夹层</b>。</p><p>而「怜悯人的，就当<b>甘心</b>」（ἱλαρότης，林后9:7「<b>乐意</b>的人」同字根）——<br>一个板着脸的怜悯，会伤害被怜悯的人。</p><p>【第三段｜12:9–13　家里】</p>"},{"a":9,"z":9,"star":true,"grk":"<p>Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ,</p>","lit":"<p>「爱，<b>不戴面具</b>。<b>极其厌恶</b>那恶的，<b>黏住</b>那善的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>不可虚假</td><td>ἀνυπόκριτος</td><td>anypokritos</td><td>G505</td><td>ἀ + ὑποκριτής（<b>演员</b>）</td><td><b>不演戏的、没有面具的</b></td><td>见下</td></tr><tr><td>厌恶</td><td>ἀποστυγοῦντες</td><td>apostygountes</td><td>G655</td><td>ἀπό + στυγέω</td><td><b>极度憎恶</b>（新约仅此一次）</td><td>强烈的字</td></tr><tr><td>亲近</td><td>κολλώμενοι</td><td>kollōmenoi</td><td>G2853</td><td>κόλλα（<b>胶</b>）</td><td><b>黏住</b></td><td>见下</td></tr></table>","gram":"<p>★★ 亮光一：ἀνυπόκριτος ——「不戴面具」</p><p>这个字由 ἀ（不）＋ ὑποκριτής（<b>演员</b>）组成。</p><p>而 ὑποκριτής 在古希腊的意思是：</p><p>在剧场里<b>戴着面具演戏的人</b>。</p><p>（主耶稣用这个字骂法利赛人「假冒为善的人」——太23:13等处）</p><p>弟兄姊妹，所以「爱人不可虚假」的字面是：</p><p>「爱，<b>不要戴面具</b>。」</p><p>而保罗把这句话放在12:9–21这一整段的<b>最前面</b>——</p><p>它是后面所有事情的<b>标题</b>。</p><p>★ 亮光二：κολλάω ——「黏住」</p><p>「善要<b>亲近</b>」——κόλλα 就是<b>胶水</b>。</p><p>（太19:5「二人成为一体」的「<b>连合</b>」；徒5:13「没有一个人敢<b>贴近</b>他们」——同字）</p><p>不是「多接近一点」，是<b>黏上去，黏死</b>。</p><p>★ 亮光三：两个极端的动作</p><pre>ἀποστυγέω —— 【极度憎恶】那恶的\nκολλάω    —— 【黏住】那善的</pre><p>弟兄姊妹，保罗在这里用了两个很激烈的动词。</p><p>无伪的爱，不是温吞的。</p><p>它对恶是<b>极度憎恶</b>，对善是<b>黏住不放</b>。</p>","exp":"<p>弟兄姊妹，12:9是整个第三段的<b>标题</b>。</p><p>而原文的第一句没有动词，字面是：「爱——<b>无伪的</b>。」</p><p>ἀνυπόκριτος ＝ ἀ（不）＋ ὑποκριτής（<b>演员</b>）。</p><p>字面就是：<b>不戴面具的</b>。</p><p><b>经文本身明确表达的：</b> 爱不可虚假；要极度憎恶恶，要紧紧黏住善。</p><p><b>可以合理推论的：</b> 保罗在教会伦理的第一句，讲的不是「要多爱一点」，<br>是「<b>把面具拿下来</b>」。</p><p>因为在教会里，最容易出现的不是「没有爱」，是<b>表演出来的爱</b>。</p><p><b>⚠ 牧养提醒：</b> 这一节不是要人「把真实的情绪都说出来」。<br>无伪的爱不等于口无遮拦——12:10下一句就说「恭敬人，要<b>彼此推让</b>」。</p>"},{"a":10,"z":13,"star":false,"grk":"<p>10 τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,<br>11 τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,<br>12 τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,<br>13 ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.</p>","lit":"<p>10「在<b>弟兄之爱</b>上，要<b>彼此有家人般的深情</b>；在<b>尊重</b>上，要<b>彼此推让、把对方摆在前面</b>；」<br>11「在<b>殷勤</b>上，不可<b>迟钝</b>；在<b>灵里</b>要<b>沸腾</b>；要<b>服事主</b>；」<br>12「在<b>盼望</b>中<b>喜乐</b>；在<b>患难</b>中<b>忍耐</b>；在<b>祷告</b>上<b>恒切不放</b>；」<br>13「与圣徒的<b>需要</b>有<b>分</b>；<b>追赶</b>款待客旅的机会。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>彼此亲热</td><td>φιλόστοργοι</td><td>philostorgoi</td><td>G5387</td><td>φιλία + <b>στοργή（家人之爱）</b>——见下</td></tr><tr><td>推让</td><td>προηγούμενοι</td><td>proēgoumenoi</td><td>G4285</td><td><b>走在前面带路</b>／<b>看别人比自己重要</b></td></tr><tr><td>火热</td><td>ζέοντες</td><td>zeontes</td><td>G2204</td><td><b>沸腾</b>（<b>10:2 ζῆλος 同字根</b>）</td></tr><tr><td>忍耐</td><td>ὑπομένοντες</td><td>hypomenontes</td><td>G5278</td><td><b>在压力下站住</b>（<b>5:3同字根</b>）</td></tr><tr><td>恒切</td><td>προσκαρτεροῦντες</td><td>proskarterountes</td><td>G4342</td><td><b>持续黏着、坚持不放</b></td></tr><tr><td>帮补</td><td>κοινωνοῦντες</td><td>koinōnountes</td><td>G2841</td><td><b>有分于、分享</b>（κοινωνία 同字根）</td></tr><tr><td>一味地款待</td><td>φιλοξενίαν διώκοντες</td><td>—</td><td>G5381/G1377</td><td><b>追赶款待客旅的机会</b></td></tr></table>","gram":"<p>★ 亮光一：στοργή ——希腊文四种爱的其中一种</p><p>希腊文有几个表达「爱」的字：</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>ἀγάπη</b></td><td>意志性的、舍己的爱</td></tr><tr><td><b>φιλία</b></td><td>友爱、朋友之爱</td></tr><tr><td><b>ἔρως</b></td><td>情欲之爱（新约未用）</td></tr><tr><td><b>στοργή</b></td><td><b>家人之间的、自然的亲情</b></td></tr></table><p>而12:10的 <b>φιλόστοργος</b> 是 φιλία ＋ στοργή 的合成字（新约仅此一次）。</p><p>弟兄姊妹，保罗在说：</p><p>对弟兄姊妹的爱，要像<b>家人之间</b>那样。</p><p>不是同事，不是会友，是<b>家人</b>。</p><p>★ 亮光二：προηγέομαι ——「推让」</p><p>这个字有两种可能的意思：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>看别人比自己重要</b></td><td>和合本「彼此<b>推让</b>」</td></tr><tr><td><b>在尊敬人上走在前面</b></td><td>「抢着先尊敬对方」</td></tr></table><p>两种都很美：</p><p>一种是<b>让</b>；一种是<b>抢着让</b>。</p><p>★ 亮光三：ζέω ——「沸腾」</p><p>「要心里<b>火热</b>」——ζέοντες，字面是<b>沸腾</b>。</p><p>而这正是10:2的字根：</p><pre>10:2  「他们向神有【热心】（ζῆλος），但不是按着真知识」\n12:11 「要心里【火热】（ζέω），常常服事主」</pre><p>弟兄姊妹，第十章说：热心可以走错方向。<br>第十二章说：但<b>方向对了就要火热</b>。</p><p>保罗从来不反对热心，他反对的是<b>没有校正过方向的热心</b>。</p><p>★ 亮光四：12:12 是第五章的回音</p><pre>5:2–3  「欢欢喜喜【盼望】神的荣耀……就是在【患难】中也是欢欢喜喜的，\n        因为知道患难生【忍耐】」\n   ↓\n12:12  「在【指望】中要喜乐；在【患难】中要【忍耐】」</pre><p>同样三个字：盼望、患难、忍耐。</p><p>第五章是<b>神学陈述</b>；第十二章是<b>生活命令</b>。</p><p>★ 亮光五：12:13的「一味地款待」</p><p>「客要<b>一味地款待</b>」——φιλοξενίαν <b>διώκοντες</b>。</p><p>διώκω 的意思是<b>追赶、竭力追求</b>。</p><p>保罗<b>没有</b>说「有客人来的时候要接待」。</p><p>他说：<b>去追那个机会</b>。</p>","exp":"<p>弟兄姊妹，10–13节在原文里几乎全部是<b>分词</b>，不是一条一条的命令。</p><p>分词的效果是什么？</p><p>它不像清单，像<b>一幅正在进行的画面</b>——一个群体活着的样子。</p><p><b>经文本身明确表达的：</b> 这是一连串教会生活的实际样貌：深情、推让、火热、忍耐、恒切祷告、供应需要、款待客旅。</p><p><b>可以合理推论的：</b> 其中两个动词特别有力——</p><p>① ζέοντες（火热）字面是「<b>沸腾</b>」——那是水滚起来的样子。<br>② διώκοντες（款待）字面是「<b>追赶</b>」——保罗没有说「有客人来的时候要接待」，他说：<b>去追那个机会</b>。</p><p>（而13节的「追赶」，在下一节就变成了「<b>追赶你们的人</b>」——保罗在两节之间玩了同一个字 διώκω。）</p><p>【第四段｜12:14–21　街上】</p>"},{"a":14,"z":14,"star":true,"grk":"<p>εὐλογεῖτε τοὺς διώκοντας [ὑμᾶς], εὐλογεῖτε καὶ μὴ καταρᾶσθε.</p>","lit":"<p>「要<b>祝福</b>那些<b>逼迫（追赶）你们的人</b>；<b>要祝福，不可咒诅</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>祝福</td><td>εὐλογεῖτε</td><td>eulogeite</td><td>G2127</td><td>εὖ（好）+ λόγος（话）：<b>说好话</b>（现在式命令：<b>持续地</b>）</td></tr><tr><td>逼迫</td><td>διώκοντας</td><td>diōkontas</td><td>G1377</td><td><b>追赶</b>（<b>12:13「一味地款待」同字</b>）</td></tr><tr><td>咒诅</td><td>καταρᾶσθε</td><td>katarasthe</td><td>G2672</td><td>咒骂、求祸临到</td></tr></table>","gram":"<p>★ 亮光一：与12:13的文字游戏</p><pre>12:13  τὴν φιλοξενίαν διώκοντες   —— 【追求】款待\n12:14  εὐλογεῖτε τοὺς διώκοντας   —— 为【追赶／逼迫】你们的人祝福</pre><p>同一个字根 διώκω。</p><p>弟兄姊妹，保罗在说：</p><p>你追着机会去爱人；<br>而有人追着你要害你。</p><p>两种「追」，同一个字。</p><p>★ 亮光二：这是主耶稣的话</p><p>路6:28「<b>咒诅你们的，要为他祝福</b>；凌辱你们的，要为他祷告。」<br>太5:44「要爱你们的仇敌，为那<b>逼迫</b>你们的祷告。」</p><p>弟兄姊妹，12:14–21这一整段，几乎就是登山宝训的保罗版。</p>","exp":"<p>弟兄姊妹，13节说「客要一味地<b>款待</b>」——原文是<b>追赶</b>（διώκω）。</p><p>而14节说「<b>逼迫</b>你们的」——<b>同一个字</b>。</p><pre>12:13  φιλοξενίαν διώκοντες      —— 【追赶】款待的机会\n12:14  εὐλογεῖτε τοὺς διώκοντας  —— 给那些【追赶】你们的人祝福</pre><p><b>经文本身明确表达的：</b> 要持续地为逼迫者祝福，并且不可咒诅。</p><p><b>可以合理推论的：</b> 保罗在两节之间玩了同一个字——</p><p>你要<b>追赶</b>款待；而对那些<b>追赶</b>你的人——<b>祝福他们</b>。</p><p>而「祝福」是<b>现在式命令</b>：不是「原谅他一次」，是<b>持续地说好话</b>。</p><p><b>⚠ 牧养提醒：</b> 这一节对正在受伤害的人，可能太重。<br>请注意保罗<b>没有</b>说「假装没事」——12:19明说那是一件需要伸冤的事。<br>祝福不等于否认伤害；祝福是<b>把报复权交出去</b>。</p>"},{"a":15,"z":16,"star":false,"grk":"<p>15 χαίρειν μετὰ χαιρόντων, κλαίειν μετὰ κλαιόντων.<br>16 τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ' ἑαυτοῖς.</p>","lit":"<p>15「要<b>与喜乐的人同喜乐</b>，<b>与哀哭的人同哀哭</b>。」<br>16「要<b>彼此想同一件事</b>；<b>不要心思高傲</b>，倒要<b>让自己被带往卑微之处</b>。<b>不要自以为聪明</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>同乐／同哭</td><td>χαίρειν／κλαίειν μετά</td><td>—</td><td>G5463/G2799</td><td><b>不定词</b>：不带命令口气，像一句素描</td></tr><tr><td>同心</td><td>τὸ αὐτὸ φρονοῦντες</td><td>—</td><td>G5426</td><td><b>想同一件事</b>（<b>15:5同词组</b>）</td></tr><tr><td>志气高大</td><td>τὰ ὑψηλὰ φρονοῦντες</td><td>—</td><td>G5308</td><td><b>心思往高处飘</b>（<b>11:20同词组</b>）</td></tr><tr><td>俯就卑微</td><td>συναπαγόμενοι</td><td>synapagomenoi</td><td>G4879</td><td><b>被一同带走</b>（被动语态）</td></tr></table>","gram":"<p>★ 亮光一：12:15是两个不定词，极其简洁</p><p>原文只有六个字：</p><p>χαίρειν μετὰ χαιρόντων, κλαίειν μετὰ κλαιόντων</p><p>「与喜乐的人喜乐，与哭泣的人哭泣。」</p><p>弟兄姊妹，注意顺序：<b>先讲同乐，再讲同哭</b>。</p><p>而通常，<b>同乐比同哭更难</b>。</p><p>同哭时，我在上面；同乐时，他在上面。</p><p>★ 亮光二：12:16的三个 φρον- 字</p><pre>τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες  （彼此同心）\nμὴ τὰ ὑψηλὰ φρονοῦντες           （不要志气高大）\nμὴ γίνεσθε φρόνιμοι παρ' ἑαυτοῖς （不要自以为聪明）</pre><p>★ 亮光三：「不要志气高大」＝ 11:20那个词组</p><pre>11:20 「你不可【自高】（μὴ ὑψηλὰ φρόνει），反要惧怕」\n12:16 「不要【志气高大】（μὴ τὰ ὑψηλὰ φρονοῦντες）」</pre><p>同一个词组。</p><p>第十一章是对<b>外邦信徒整体</b>说的；<br>第十二章是对<b>每一个人在关系中</b>说的。</p><p>★ 亮光四：「俯就卑微的人」</p><p>τοῖς ταπεινοῖς συναπαγόμενοι ——字面是「<b>被一同带往卑微之处</b>」。</p><p>συναπάγω 的意思是「一同被带走」。</p><p>弟兄姊妹，这不是「屈尊去帮助小人物」。</p><p>是「<b>让自己被带到低处去</b>」。</p>","exp":"<p>弟兄姊妹，15节在原文里不是命令式，是<b>两个不定词</b>——</p><p>保罗不是在下令，他是在<b>素描</b>一个群体该有的样子。</p><p><b>经文本身明确表达的：</b> 与喜乐的人同乐，与哀哭的人同哭；彼此同心，不可高傲，倒要俯就卑微的人。</p><p><b>可以合理推论的：</b> 这两件事的难度<b>并不对称</b>。</p><p>与哀哭的人同哭，需要<b>同情</b>。<br>而与喜乐的人同乐——需要<b>没有嫉妒</b>。</p><p>（想想看：当一个人得到你一直想要却没得到的东西，你笑得出来吗？）</p><p>而16节的「俯就卑微」（συναπαγόμενοι）是<b>被动语态</b>：</p><p>不是「屈尊去帮助小人物」，是「<b>让自己被带到低处去</b>」。</p><p><b>⚠ 补充：</b> 「不要志气高大」的原文词组（τὰ ὑψηλὰ φρονοῦντες），<br>与11:20「不可自高」<b>完全相同</b>——保罗在讲外邦信徒的优越感时用过同一句话。</p>"},{"a":17,"z":18,"star":false,"grk":"<p>17 μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες, προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·<br>18 εἰ δυνατόν, τὸ ἐξ ὑμῶν, μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·</p>","lit":"<p>17「<b>不要以恶报恶</b>；要<b>预先筹划</b>那在众人面前<b>看为美好</b>的事。」<br>18「<b>若是可能</b>，<b>就你们这一边而言</b>，要<b>与众人和睦</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>以恶报恶</td><td>κακὸν ἀντὶ κακοῦ</td><td>—</td><td>G2556</td><td><b>恶换恶</b>（ἀντί ＝ 交换）</td></tr><tr><td>留心去做</td><td>προνοούμενοι</td><td>pronooumenoi</td><td>G4306</td><td><b>πρό + νοέω：预先筹划</b>（<b>13:14 πρόνοια 同字根</b>）</td></tr><tr><td>若是能行</td><td>εἰ δυνατόν</td><td>ei dynaton</td><td>G1415</td><td>若是可能的</td></tr><tr><td>尽力</td><td>τὸ ἐξ ὑμῶν</td><td>to ex hymōn</td><td>—</td><td><b>就出于你们这一边而言</b></td></tr></table>","gram":"<p>★ 12:18的三个限定词（★ 极其重要的牧养智慧）</p><p>弟兄姊妹，这一节有三个限定，中文可以看见两个：</p><pre>εἰ δυνατόν      —— 【若是能行】（可能不能行）\nτὸ ἐξ ὑμῶν      —— 【在于你们的部分】（你只负责你这一半）\nμετὰ πάντων ἀνθρώπων εἰρηνεύοντες —— 与众人和睦</pre><p>弟兄姊妹，保罗是一个非常实际的人。</p><p>他<b>没有</b>说「你一定要跟每个人都和好」。</p><p>他说了三件事：</p><p>① 若是能行——<b>有时候不能行</b>。<br>② 在于你们的部分——<b>你只负责你这一半</b>。<br>③ 总要尽力——<b>但你要尽你那一半的全力</b>。</p><p>这对受过关系伤害的人，是极大的释放：</p><p>和睦需要两个人。</p><p>而神只要求你负责<b>你那一边</b>。</p>","exp":"<p>弟兄姊妹，18节是全本圣经对「和睦」最诚实、也最有恩典的一句话。</p><p>因为保罗加了<b>三个限定</b>：</p><pre>① 若是能行     —— 有时候不能行\n② 总要尽力     —— 但你要尽你那一半的全力\n③ 就你们这一边 —— 你只负责你这一半</pre><p><b>经文本身明确表达的：</b> 不要以恶报恶；要预先筹划众人看为美的事；并且在自己这一边，尽力与众人和睦。</p><p><b>可以合理推论的：</b> 保罗<b>没有</b>说「你一定要跟每个人和好」。</p><p>和睦需要两个人；而神只要求你负责<b>你那一边</b>。</p><p><b>⚠ 牧养提醒：</b> 这一节对受过关系伤害的人，是极大的释放。<br>若对方不愿意，那不是你的失败。<br>（同时也要诚实：「就你们这一边」也意味着——<b>你那一边，要真的尽力</b>。）</p><p>而17节的「留心去做」（προνοέω），正是13:14「不要为肉体<b>安排</b>」（πρόνοια）那个字根：</p><p>同一种「预先筹划」的能力——</p><p>可以用来为肉体铺路，也可以用来为善铺路。</p>"},{"a":19,"z":19,"star":true,"grk":"<p>μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ· γέγραπται γάρ· ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.</p>","lit":"<p>「亲爱的，不要自己伸冤，<b>倒要给忿怒让出地方</b>；因为经上记着：『伸冤在我，我必报应，主说。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>伸冤</td><td>ἐκδικοῦντες</td><td>ekdikountes</td><td>G1556</td><td><b>为自己讨回公道</b></td></tr><tr><td>让步</td><td>δότε τόπον</td><td>dote topon</td><td>G5117</td><td><b>给出空间、让出位置</b></td></tr><tr><td>主怒</td><td>τῇ ὀργῇ</td><td>tē orgē</td><td>G3709</td><td><b>那忿怒</b>（带冠词——见下）</td></tr></table>","gram":"<p>★ 亮光一：「让步」的字面是「<b>给出空间</b>」</p><p>δότε τόπον ——<b>让出一个位置</b>。</p><p>弟兄姊妹，这个画面很有意思：</p><p>你站在那里，准备要动手。</p><p>而神说：<b>让开，给我一个位置</b>。</p><p>★ 亮光二：「主怒」带着冠词</p><p>τῇ ὀργῇ ——「<b>那</b>忿怒」。</p><p>在罗马书中，「那忿怒」有特定的所指：</p><pre>1:18  神的忿怒从天上显明\n2:5   在忿怒的日子\n5:9   免去神的忿怒</pre><p>所以12:19的意思是：</p><p>不是「让对方发完脾气」，是「<b>把这件事交给神的忿怒去处理</b>」。</p><p>★ 亮光三：这不是「算了」</p><p>弟兄姊妹，保罗<b>没有</b>说「这件事不重要」。</p><p>他说的是：<b>这件事很重要，重要到必须交给神亲自处理</b>。</p><p>不伸冤，不是因为那件事不值得伸冤。<br>是因为<b>有一位更有资格伸冤的</b>。</p>","exp":"<p>弟兄姊妹，12:19是这一段的<b>神学根据</b>。</p><p>而它引的是申命记32:35——摩西之歌里的一句话。</p><p><b>经文本身明确表达的：</b> 不要自己伸冤，要把地方让出来给神的忿怒；因为伸冤在神。</p><p><b>可以合理推论的：</b> 「宁可让步」的原文是 <b>δότε τόπον</b>——字面是「<b>给出地方</b>」。</p><p>保罗的画面是：<b>你站在那个位置上，神就不好动手；你让开，祂才能来</b>。</p><p>而下一章立刻给了这句话的<b>配套</b>：</p><p>13:4「他是神的用人，是<b>伸冤的</b>（ἔκδικος），刑罚那作恶的。」</p><p>12:19的 ἐκδίκησις 与13:4的 ἔκδικος，是<b>同一个字根</b>。</p><p>所以12:19<b>不是</b>说「这件事没有人管」。</p><p>是说：<b>不是由你来管</b>。</p><p>⚠⚠ 牧养提醒（极重要）：</p><p>这一节对受过伤害、特别是受过侵害的人，极容易被误用成「你要忍」。</p><p>必须说清楚三件事：</p><p>① 这不是撤案，是<b>移送到更高的法庭</b>。</p><p>② 保罗在下一章就说了：神设立了政府「是伸冤的」——<b>寻求法律途径，并不违背这一节</b>。</p><p>③ 讲这一节的时候，应当预备<b>会后的实际协助</b>（陪同、转介、通报），而不只是一句「交给神」。</p>"},{"a":20,"z":21,"star":true,"grk":"<p>21 μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.</p>","lit":"<p>21「不要<b>被恶所胜</b>，反要<b>用善去胜过恶</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>炭火</td><td>ἄνθρακας πυρός</td><td>anthrakas pyros</td><td>G440</td><td><b>烧着的炭</b></td></tr><tr><td>胜</td><td>νικάω</td><td>nikaō</td><td>G3528</td><td><b>得胜</b>（<b>8:37 ὑπερνικάω 同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：「炭火堆在他头上」是什么意思？（见第二十部分的完整讨论）</p><p>这是引自箴言25:21–22。主要有三种理解：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>A. 使人羞愧悔改</b></td><td>善行使对方良心不安，如头上顶着火炭般难受 → 导向悔改</td></tr><tr><td><b>B. 古埃及的悔罪仪式</b></td><td>有学者认为古埃及有顶着火盆表示悔改的仪式</td></tr><tr><td><b>C. 加重审判</b></td><td>若对方仍不悔改，这善行反而加重他的责任</td></tr></table><p>上下文（12:21「以善胜恶」）明显支持 A：</p><p>保罗的目的是<b>胜过恶</b>，不是报复。</p><p>★★ 亮光二：νικάω ——第八章那个字</p><pre>8:37  「靠着爱我们的主，在这一切的事上已经【得胜有余】（ὑπερνικῶμεν）了」\n   ↓\n12:21 「你不可为恶所【胜】（νικάω），反要【以善胜恶】（νίκα）」</pre><p>弟兄姊妹，这是一个美丽的呼应：</p><p>第八章：<b>你已经得胜有余了</b>（地位）。<br>第十二章：<b>所以去得胜吧</b>（实践）。</p><p>★ 亮光三：两个语态的对比</p><pre>μὴ νικῶ ὑπὸ τοῦ κακοῦ —— 【被动】：不要被恶「所胜」\nἀλλὰ νίκα            —— 【主动命令】：你要去胜</pre><p>弟兄姊妹，保罗在说：</p><p>在这件事上，你只有两种可能：</p><p>要嘛恶胜过你，要嘛你用善胜过恶。</p><p>没有「中立」这个选项。</p>","exp":"<p>弟兄姊妹，12:21是全章的结论，也是最实际的一句话。</p><p>「你不可为恶所胜」——这是什么意思？</p><p>当有人恶待你，而你用恶回应——</p><p>表面上你在报复他。</p><p>实际上——<b>恶已经赢了</b>。</p><p>因为它成功地让你也变成了一个恶人。</p><p>而「以善胜恶」的意思是：</p><p>我不让那件恶事，<b>改变我是谁</b>。</p>"}],"13":[{"a":1,"z":1,"star":true,"grk":"<p>Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω. οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ οὖσαι ὑπὸ θεοῦ τεταγμέναι εἰσίν.</p>","lit":"<p>「<b>每一个魂</b>都要<b>排到</b>那些<b>在上的权柄</b>底下。因为除了出于神的以外，没有权柄；而那些存在的，都是<b>被神排定</b>的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>人人</td><td>πᾶσα ψυχή</td><td>pasa psychē</td><td>G5590</td><td>—</td><td><b>每一个魂</b>（希伯来式表达：每一个人）</td><td>没有人例外</td></tr><tr><td>顺服</td><td>ὑποτασσέσθω</td><td>hypotassesthō</td><td>G5293</td><td>ὑπό + τάσσω</td><td><b>排到……底下</b></td><td><b>10:3同字</b></td></tr><tr><td>权柄</td><td>ἐξουσία</td><td>exousia</td><td>G1849</td><td>—</td><td>权柄、当局</td><td>广义，不专指皇帝</td></tr><tr><td>神所命的</td><td>τεταγμέναι</td><td>tetagmenai</td><td>G5021</td><td><b>τάσσω</b></td><td><b>被排定、被指派位置</b></td><td><b>完成被动分词</b></td></tr></table>","gram":"<p>★ 亮光一：τάσσω 字群——这是一个军事用语</p><p>τάσσω 的意思是「<b>排列、编排、指派位置</b>」——用于军队列阵。</p><p>而13:1–2用了四个同字根的字：</p><pre>ὑποτασσέσθω （13:1）—— 排到……底下  = 顺服\nτεταγμέναι  （13:1）—— 被排定       = 神所命的\nἀντιτασσόμενος（13:2）—— 排到对面   = 抗拒\nδιαταγή     （13:2）—— 所排定的     = 神的命</pre><p>弟兄姊妹，这个字群的画面是：</p><p>神在一张大棋盘上，把每一个权柄<b>排在它的位置</b>。</p><p>而你要做的，是<b>站在你的位置上</b>，不是跳到对面去。</p><p>★ 亮光二：ὑποτάσσω ≠ 盲目服从</p><p>这一点极其重要（见第二十部分的完整讨论）。</p><p>ὑποτάσσω 的意思是「<b>认可某个秩序、站在其中的位置上</b>」，</p><p>它与 ὑπακούω（<b>听从、照着做</b>）是<b>不同的字</b>。</p><p>保罗在此用的是 ὑποτάσσω（顺服秩序），<br>不是 ὑπακούω（凡事照做）。</p><p>证据：使徒行传5:29——同一批使徒在公会前说：</p><p>「顺从神，不顺从人（πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις），是应当的。」</p><p>弟兄姊妹，同一本圣经。</p><p>所以「顺服」不可能等于「无论吩咐什么都照做」。</p><p>★ 亮光三：τεταγμέναι 是完成被动式</p><p>「凡掌权的都是<b>神所命的</b>」——被动式，施动者是神。</p><p>保罗在说：<b>权柄这个制度</b>，是神设立的。</p><p>（关于「这是否表示每一个掌权者的每一个行为都是神所认可的」，见第二十部分。）</p>","exp":"<p>弟兄姊妹，13:1必须放在12:19–21的脉络里读：</p><pre>12:19  不要自己伸冤\n12:21  以善胜恶\n   ↓\n13:1–4 因为神已经设立了一个机制来对付恶</pre><p>保罗的逻辑是：</p><p>你不可以私下报复——<br>但这不表示恶没有人管。</p><p>神设立了政府来管。</p>"},{"a":2,"z":4,"star":true,"grk":"<p>4 θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.</p>","lit":"<p>2「所以，那<b>抵挡掌权的</b>，就是<b>抵挡神所排定的秩序</b>；而抵挡的人，<b>必自取审判</b>。」<br>3「因为作官的<b>不是叫行善的惧怕</b>，乃是叫<b>作恶的</b>惧怕。你愿意不惧怕掌权的吗？<b>就行善吧</b>——你必得他的称赞；」<br>4「因为他是<b>神的仆役</b>，<b>是为了你的益处</b>。但你若作恶，就当惧怕；因为他<b>不是徒然佩剑</b>——他是神的仆役，是<b>执行公义者</b>，向作恶的<b>施行忿怒</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>用人</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td>—</td><td><b>仆人、执事</b></td><td>见下</td></tr><tr><td>与你有益</td><td>εἰς τὸ ἀγαθόν</td><td>eis to agathon</td><td>G18</td><td>—</td><td><b>为你的益处</b></td><td><b>★ 见下——功能性的定义</b></td></tr><tr><td>空空地</td><td>εἰκῇ</td><td>eikē</td><td>G1500</td><td>—</td><td>无故地、白白地</td><td>—</td></tr><tr><td>剑</td><td>μάχαιρα</td><td>machaira</td><td>G3162</td><td>—</td><td><b>短剑</b>（见下）</td><td>—</td></tr><tr><td>伸冤的</td><td>ἔκδικος</td><td>ekdikos</td><td>G1558</td><td>ἐκ + δίκη</td><td><b>执行公义者</b></td><td><b>12:19同字根</b></td></tr></table>","gram":"<p>★★ 亮光一：13:3–4是一个<b>功能性的定义</b></p><p>这是理解全段最关键的一点。</p><p>保罗在13:3–4描述政府的时候，用的是<b>功能性的语言</b>：</p><table><tr><th>经文</th><th>政府的功能</th></tr><tr><td>13:3</td><td><b>不是叫行善的惧怕，乃是叫作恶的惧怕</b></td></tr><tr><td>13:4</td><td><b>是神的用人，是</b>与你有益<b>的</b></td></tr><tr><td>13:4</td><td><b>是伸冤的，刑罚</b>那作恶的</td></tr></table><p>弟兄姊妹，保罗在此定义的，是政府<b>受托的职分</b>：</p><p>赏善、罚恶。</p><p>这一点在第二十部分的讨论中极其重要：</p><p>当一个政权<b>颠倒</b>这个功能——赏恶、罚善——<br>它就正在背叛13:3–4所描述的那个受托身分。</p><p>（这正是启示录13章的处境）</p><p>★ 亮光二：διάκονος ——政府是神的「执事」</p><p>保罗用了两次 διάκονος（13:4），又在13:6用了 <b>λειτουργός</b>。</p><p>这两个字都是<b>教会用语</b>：</p><table><tr><th>字</th><th>一般用法</th></tr><tr><td><b>διάκονος</b></td><td><b>执事</b>（提前3:8；腓1:1）</td></tr><tr><td><b>λειτουργός</b></td><td><b>供职者</b>（来8:2用于基督；罗15:16保罗自称）</td></tr></table><p>弟兄姊妹，保罗刻意用了两个「神圣服事」的字，来称呼罗马的官员。</p><p>这是一个极高的评价——<br>但同时也是一个极重的<b>责任</b>：</p><p>他们是<b>在替神办事</b>。</p><p>★ 亮光三：μάχαιρα ——那把剑</p><p>μάχαιρα 是<b>短剑</b>，不是战场上的大剑（ῥομφαία）。</p><p>它在第一世纪主要用于：</p><p>- 士兵佩带的随身武器<br>- <b>执法时的象征</b>（罗马总督有 ius gladii ——「持剑权」，即审判死刑的权柄）</p><p>弟兄姊妹，「他不是空空地佩剑」的意思是：</p><p>政府手上的强制力，<b>不是装饰品</b>。</p><p>（关于这节是否支持死刑，见第二十部分——本文不作裁决。）</p><p>★ 亮光四：ἔκδικος ——12:19那个字回来了</p><pre>12:19  「伸冤（ἐκδίκησις）在我，我必报应」—— 个人不可报复\n   ↓\n13:4   「他是神的用人，是伸冤的（ἔκδικος）」—— 神设立了机制</pre><p>弟兄姊妹，这一组字根的呼应，是12–13章之间最重要的桥梁：</p><p>12:19不是说「恶没有人管」。<br>12:19是说「<b>不是由你来管</b>」。</p><p>而13:4说：神已经指派了。</p>","exp":"<p>弟兄姊妹，3–4节不是在描述「政府都是好的」——</p><p>它是在描述<b>政府受托的职分</b>。</p><table><tr><th>经文</th><th>政府该做的</th></tr><tr><td>13:3</td><td><b>不是叫行善的惧怕，乃是叫作恶的惧怕</b></td></tr><tr><td>13:4</td><td><b>是神的用人，是</b>与你有益<b>的</b></td></tr><tr><td>13:4</td><td><b>是伸冤的，刑罚</b>那作恶的</td></tr></table><p><b>经文本身明确表达的：</b> 掌权者是神所排定的，其职分是赏善罚恶；抵挡这个秩序的人自取审判。</p><p><b>可以合理推论的：</b> 保罗在这里给的是一个<b>功能性的定义</b>——</p><p>这既是政府的<b>托付</b>，也是<b>衡量它的标准</b>。</p><p>当一个政权<b>颠倒</b>这个功能——赏恶、罚善、以行善为罪——<br>它就正在背叛13:3–4所描述的那个受托身分。</p><p>⚠⚠ 讲台诚信提醒（本章最重要的一条）：</p><p>这段经文在历史上曾被用来为奴隶制度、种族隔离、极权政权背书。</p><p>必须同时讲明：</p><p>① 保罗用的字是 ὑποτάσσω（排到秩序底下），<b>不是</b> ὑπακούω（凡事照做）。</p><p>② 同一本圣经说：「<b>顺从神，不顺从人</b>，是应当的」（徒5:29）；<br>但3:18「即或不然，我们决不事奉你的神」；出1:17收生婆「不照埃及王的吩咐行」——而神厚待她们。</p><p>③ 写13:1的保罗自己，曾要求官长亲自来释放他（徒16:37）、提出罗马公民权（徒22:25）、上告于凯撒（徒25:11）。</p><p>④ ❌❌ 绝不可用这段经文为任何特定的当代政权背书或攻击。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν.</p>","lit":"<p>「所以，<b>必须要顺服</b>——<b>不只是因为那忿怒</b>，<b>也是因为良心</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>必须</td><td>ἀνάγκη</td><td>anankē</td><td>G318</td><td><b>必要、不得不</b></td></tr><tr><td>良心</td><td>συνείδησις</td><td>syneidēsis</td><td>G4893</td><td><b>共同知道</b>（<b>2:15同字</b>）</td></tr></table>","gram":"<p>★ 两个动机的层次</p><pre>διὰ τὴν ὀργήν      —— 因为【刑罚】（怕被罚）\nδιὰ τὴν συνείδησιν —— 因为【良心】（知道这是对的）</pre><p>弟兄姊妹，保罗在说：</p><p>一个基督徒守法，<b>不应该只是因为怕被抓</b>。</p><p>而是因为他知道：那个秩序，是神设立的。</p><p>而 συνείδησις 这个字，我们在2:15见过：</p><p>2:15「他们<b>是非之心</b>（συνείδησις）同作见证。」</p>","exp":"<p>弟兄姊妹，13:5给了守法的<b>两层动机</b>——而次序很重要。</p><pre>διὰ τὴν ὀργήν      —— 因为【刑罚】（怕被罚）\nδιὰ τὴν συνείδησιν —— 因为【良心】（知道这是对的）</pre><p><b>经文本身明确表达的：</b> 顺服不只是为了避免刑罚，也是出于良心。</p><p><b>可以合理推论的：</b> 一个基督徒守法，<b>不应该只是因为怕被抓</b>。</p><p>而是因为他知道：<b>那个秩序，是神排定的</b>。</p><p>⚠ 补充：<b> συνείδησις 是2:15那个字——</b>保罗在第二章说，外邦人的「是非之心」同作见证。<br>而在第十三章，那颗良心成了守法的内在根据。</p><p>【第二段｜13:6–7　纳税与偿还】</p>"},{"a":6,"z":7,"star":false,"grk":"<p>6 …λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.<br>7 ἀπόδοτε πᾶσιν τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.</p>","lit":"<p>6「因为这个缘故，你们也<b>纳税</b>；因为他们是<b>神的差役</b>（供职者），<b>恒切专注于</b>这件事。」<br>7「<b>把所欠的都还给众人</b>：当得<b>粮税</b>的，给他粮税；当得<b>关税</b>的，给他关税；当得<b>惧怕</b>的，给他惧怕；当得<b>尊敬</b>的，给他尊敬。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>差役</td><td>λειτουργός</td><td>leitourgos</td><td>G3011</td><td><b>公职服事者／圣职供奉者</b>（见下）</td></tr><tr><td>常常特管</td><td>προσκαρτεροῦντες</td><td>proskarterountes</td><td>G4342</td><td><b>恒切专注于</b>（<b>12:12「祷告要恒切」同字</b>）</td></tr><tr><td>所当得的</td><td>ὀφειλάς</td><td>opheilas</td><td>G3782</td><td><b>所欠的债</b></td></tr><tr><td>粮</td><td>φόρος</td><td>phoros</td><td>G5411</td><td><b>直接税</b>（人头税、土地税）</td></tr><tr><td>税</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>间接税</b>（关税、通行税）</td></tr></table>","gram":"<p>★ 亮光一：λειτουργός 的宗教色彩</p><p>这个字的字根 λειτουργία 在七十士译本中，专指<b>祭司在圣殿中的供职</b>（出28:35；民8:22）。</p><p>而在新约：</p><p>- <b>来8:2</b> 基督是「圣所……的<b>执事</b>（λειτουργός）」<br>- <b>罗15:16</b> 保罗自称「作外邦人的<b>祭司</b>（λειτουργός）」</p><p>弟兄姊妹，保罗用一个<b>祭司性的字</b>，来称呼收税的官员。</p><p>这是何等惊人的评价。</p><p>★ 亮光二：προσκαρτερέω ——12:12那个字</p><pre>12:12  「祷告要【恒切】（προσκαρτεροῦντες）」\n13:6   「【常常特管】（προσκαρτεροῦντες）这事」</pre><p>同一个字。</p><p>保罗用形容「恒切祷告」的字，来形容官员尽忠职守。</p><p>★ 亮光三：13:7的四对称</p><p>原文的结构极其整齐：</p><pre>τῷ τὸν φόρον  τὸν φόρον  —— 当得粮的，给他粮\nτῷ τὸ τέλος   τὸ τέλος   —— 当得税的，给他税\nτῷ τὸν φόβον  τὸν φόβον  —— 当得惧怕的，给他惧怕\nτῷ τὴν τιμὴν  τὴν τιμήν  —— 当得恭敬的，给他恭敬</pre><p>四组，每组重复同一个字。</p><p>保罗的重点是：<b>该给谁的，就给谁</b>。</p><p>★ 亮光四：与主耶稣的话呼应</p><p>可12:17「凯撒的物当归给凯撒，神的物当归给神。」</p><p>弟兄姊妹，主耶稣的那句话有<b>两半</b>。</p><p>而13:7只讲了前半——因为13:8–10、以及全卷书，讲的是后半。</p>","exp":"<p>弟兄姊妹，13:6用了一个很重的字来称呼收税的官员：λειτουργός。</p><p>那个字在七十士译本中，专指<b>祭司在圣殿中的供职</b>（来8:2用它形容<b>基督</b>）。</p><p><b>经文本身明确表达的：</b> 纳税有其正当理由——他们是神的差役，专责于此；凡人所当得的，都要给他。</p><p><b>可以合理推论的：</b> 保罗刻意用了两个「神圣服事」的字（13:4 διάκονος、13:6 λειτουργός）来称呼罗马官员。</p><p>这是一个极高的评价，同时也是一个极重的责任：<b>他们是在替神办事</b>。</p><p>而13:7的原文是<b>四组对称</b>，每组重复同一个字：</p><pre>τῷ τὸν φόρον  τὸν φόρον  —— 当得粮的，给他粮\nτῷ τὸ τέλος   τὸ τέλος   —— 当得税的，给他税\nτῷ τὸν φόβον  τὸν φόβον  —— 当得惧怕的，给他惧怕\nτῷ τὴν τιμὴν  τὴν τιμήν  —— 当得恭敬的，给他恭敬</pre><p>重点很简单：<b>该给谁的，就给谁</b>。</p><p><b>⚠ 牧养提醒：</b> 一个基督徒的见证，常常不是毁在大事上，<br>是毁在<b>该给的没给</b>上——该还的钱、该说的道歉、该履行的承诺。</p><p>【第三段｜13:8–10　一笔还不完的债】</p>"},{"a":8,"z":8,"star":true,"grk":"<p>Μηδενὶ μηδὲν ὀφείλετε εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.</p>","lit":"<p>「<b>不要亏欠任何人任何东西</b>，除了<b>彼此相爱</b>这一笔；因为那爱人的，就<b>已经成全了</b>律法。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>亏欠</td><td>ὀφείλετε</td><td>opheilete</td><td>G3784</td><td><b>欠债</b>（13:7 ὀφειλάς 同字根）</td></tr><tr><td>完全了</td><td>πεπλήρωκεν</td><td>peplērōken</td><td>G4137</td><td><b>完成式：已经成全了</b></td></tr></table>","gram":"<p>★ 亮光一：13:7与13:8的字根连结</p><pre>13:7  ἀπόδοτε πᾶσιν τὰς ὀφειλάς —— 把所【欠的】都还给众人\n13:8  Μηδενὶ μηδὲν ὀφείλετε    —— 【不要亏欠】任何人任何东西\n      εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν —— 除了彼此相爱</pre><p>弟兄姊妹，保罗的逻辑很美：</p><p>把所有的债都还清。</p><p>只留一笔——</p><p>而那一笔，你<b>永远还不完</b>。</p><p>★ 亮光二：为什么爱的债还不完？</p><p>因为爱不是一次性的付款，是一种<b>持续的关系</b>。</p><p>你今天爱了，不代表明天不用爱。</p><p>这笔帐，<b>每天重新开立</b>。</p><p>★ 亮光三：πεπλήρωκεν 是完成式</p><p>「爱人的就<b>完全了</b>律法」——完成式：<b>已经成全了，而且效果持续</b>。</p><p>不是「爱人可以帮助你守律法」，<br>是「爱人的，<b>已经把律法成全了</b>」。</p>","exp":"<p>弟兄姊妹，13:7与13:8之间，有一个字的转折——而中文看不太出来。</p><pre>13:7  ἀπόδοτε πᾶσιν τὰς ὀφειλάς —— 把所【欠的】都还给众人\n13:8  Μηδενὶ μηδὲν ὀφείλετε    —— 【不要亏欠】任何人任何东西\n      εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν —— 除了彼此相爱</pre><p><b>经文本身明确表达的：</b> 凡事都不可亏欠人；惟有彼此相爱这一笔，要常以为亏欠。因为爱人的，就已成全了律法。</p><p><b>可以合理推论的：</b> 保罗的画面是——</p><p>把所有的债<b>全部还清</b>；<br>只留一笔——而那一笔，<b>你永远还不完</b>。</p><p>为什么还不完？</p><p>因为爱不是一次性的付款，是一种<b>持续的关系</b>。</p><p>你今天爱了，不代表明天不用爱。这笔帐，<b>每天重新开立</b>。</p><p><b>⚠ 补充（一个常见的误读）：</b> 13:8<b>不是</b>在说「基督徒不可以有房贷、车贷」。<br>ὀφείλω 的重点是「<b>该给而未给</b>」，不是禁止一切信贷。<br>（比较诗37:21「<b>恶人借贷而不偿还</b>」；但箴22:7也警告债务的捆绑。）</p>"},{"a":9,"z":10,"star":false,"grk":"<p>9 …ἐν τῷ λόγῳ τούτῳ ἀνακεφαλαιοῦται, ἐν τῷ· ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.<br>10 ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.</p>","lit":"<p>9「因为那『不可奸淫、不可杀人、不可偷盗、不可贪心』，以及其他任何诫命，<b>都总括在这一句话里</b>：『<b>要爱你的邻舍如同自己</b>。』」<br>10「<b>爱是不对邻舍作恶的</b>；所以，<b>爱就是律法的满全</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>包在……之内</td><td>ἀνακεφαλαιοῦται</td><td>anakephalaioutai</td><td>G346</td><td>ἀνά + κεφάλαιον（<b>标题／总计</b>）</td><td><b>总括在一个标题之下</b></td><td>见下</td></tr><tr><td>完全</td><td>πλήρωμα</td><td>plērōma</td><td>G4138</td><td>πληρόω</td><td><b>满全、完满</b></td><td><b>11:12、25同字</b></td></tr></table>","gram":"<p>★ 亮光一：ἀνακεφαλαιόω ——「加总」</p><p>κεφάλαιον 这个字在商业上的意思是「<b>总计、总额</b>」（就像我们说「合计」）。</p><p>所以 ἀνακεφαλαιόω 的意思是：</p><p>把一串项目<b>加总在一个标题底下</b>。</p><p>（弗1:10用同一个字：「要照所安排的，在日期满足的时候，使天上、地上、一切所有的都在基督里<b>同归于一</b>。」）</p><p>弟兄姊妹，保罗在说：</p><p>你把十诫的后半列成一张清单——<br>不可奸淫、不可杀人、不可偷盗、不可贪婪……</p><p>然后在下面画一条线，写上<b>总计</b>。</p><p>那个总计是：<b>爱人如己</b>。</p><p>★ 亮光二：13:10的定义是<b>否定式</b>的</p><p>「爱是<b>不加害与人</b>的。」</p><p>弟兄姊妹，注意保罗在此<b>没有</b>给一个抒情的定义。</p><p>他给的是一个<b>最低标准</b>：</p><p>爱，至少不伤害人。</p><p>这是一个很实际、也很扎人的检验：</p><p>你说你爱他——那你有没有伤害他？</p><p>★ 亮光三：引自利未记19:18</p><p>「爱人如己」出自<b>利未记19:18</b>——而主耶稣称它为<b>第二条诫命</b>（太22:39）。</p><p>保罗在此与主耶稣完全一致。</p>","exp":"<p>弟兄姊妹，9节那个动词（ἀνακεφαλαιόω）很有意思。</p><p>它的字根 κεφάλαιον，在商业上的意思是「<b>总计、合计</b>」。</p><p>保罗的画面是：</p><p>你把诫命一条一条列成清单——不可奸淫、不可杀人、不可偷盗、不可贪婪……</p><p>然后在下面画一条线，写上——</p><p>总计：<b>爱人如己</b>。</p><p><b>经文本身明确表达的：</b> 一切诫命都总括于「爱人如己」；而爱是不加害于人的，所以爱成全了律法。</p><p><b>可以合理推论的：</b> 10节给的<b>不是</b>爱的最高境界，是<b>最低标准</b>——</p><p>「爱是<b>不加害与人</b>的。」</p><p>而正因为它是最低标准，它特别扎人：<br>你说你爱他——那你有没有<b>伤害</b>他？（用一句话、一个眼神、一次沉默）</p><p><b>⚠ 补充：</b> 「爱人如己」出自利19:18，正是主耶稣所说的<b>第二条诫命</b>（太22:39）。<br>而「邻舍」（πλησίον）的意思是「<b>邻近的人</b>」——不是抽象的全人类，是<b>离你最近的那一个</b>。</p><p>【第四段｜13:11–14　看清时候】</p>"},{"a":11,"z":12,"star":true,"grk":"<p>11 Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ἤδη ὑμᾶς ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.<br>12 ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ἀποθώμεθα οὖν τὰ ἔργα τοῦ σκότους, ἐνδυσώμεθα δὲ τὰ ὅπλα τοῦ φωτός.</p>","lit":"<p>11「而且要这样——<b>知道这个时机</b>：时候到了，你们该<b>从睡中醒起来</b>；因为我们的救恩，现今比我们初信的时候<b>更近了</b>。」<br>12「<b>夜已经深了</b>，<b>白昼已经临近</b>。所以我们要<b>脱下</b>黑暗的行为，<b>穿上</b>光明的<b>兵器</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>时候</td><td>καιρός</td><td>kairos</td><td>G2540</td><td>—</td><td><b>决定性的时机</b>（不是 χρόνος 时间长度）</td><td>5:6同字</td></tr><tr><td>睡醒</td><td>ἐξ ὕπνου ἐγερθῆναι</td><td>—</td><td>G5258/G1453</td><td>—</td><td><b>从睡中被叫起来</b></td><td>—</td></tr><tr><td>已深</td><td>προέκοψεν</td><td>proekopsen</td><td>G4298</td><td>πρό + κόπτω</td><td><b>推进、走了大半</b></td><td>—</td></tr><tr><td>将近</td><td>ἤγγικεν</td><td>ēngiken</td><td>G1448</td><td>ἐγγύς（近）</td><td><b>完成式：已经临近了</b></td><td>—</td></tr><tr><td>脱去</td><td>ἀποθώμεθα</td><td>apothōmetha</td><td>G659</td><td>ἀπό + τίθημι</td><td><b>脱下（衣服）、放下</b></td><td>—</td></tr><tr><td>兵器</td><td>ὅπλα</td><td>hopla</td><td>G3696</td><td>—</td><td><b>武器</b>（<b>6:13同字！</b>）</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ὅπλα ——第六章那个字</p><pre>6:13   「将肢体作义的【兵器】（ὅπλα）献给神」\n   ↓\n13:12  「带上光明的【兵器】（ὅπλα）」</pre><p>弟兄姊妹，同一个字。</p><p>第六章：你的肢体是兵器。<br>第十三章：那些兵器要<b>穿上身</b>。</p><p>★ 亮光二：ἤγγικεν 是完成式</p><p>「白昼<b>将近</b>」——完成式：<b>已经临近，而且维持在临近的状态</b>。</p><p>（这正是主耶稣传道的第一句话用的字：可1:15「神的国<b>近了</b>」）</p><p>★ 亮光三：「我们得救，现今比初信的时候更近了」</p><p>弟兄姊妹，这一节的「得救」指的是什么？</p><p>不是「称义」——那已经发生了（5:1）。</p><p>是<b>救恩的完成</b>——身体得赎（8:23）、主的再来。</p><p>（关于「近」的理解，见第二十部分。）</p><p>★ 亮光四：一个很简单却很有力的逻辑</p><p>每过一天，那日子就近一天。</p><p>这不是猜测，这是算术。</p>","exp":"<p>弟兄姊妹，13:11换了一个角度——保罗开始讲<b>时间</b>。</p><p>而他的逻辑其实非常简单：</p><p>「我们得救，现今<b>比初信的时候更近了</b>。」</p><p><b>经文本身明确表达的：</b> 现今正是该从睡中醒来的时候；黑夜已深，白昼已经临近；所以要脱去暗昧的行为，穿上光明的兵器。</p><p><b>可以合理推论的：</b> 这里的「得救」不是指称义（那已经发生了，5:1），<br>是指<b>救恩的完成</b>——身体得赎（8:23）、主的再来。</p><p>而「将近」（ἤγγικεν）是<b>完成式</b>：已经临近，并且维持在临近的状态。<br>（这正是主耶稣传道的第一句话用的字：可1:15「神的国<b>近了</b>」。）</p><p>而「兵器」（ὅπλα）是6:13那个字：</p><pre>6:13   将肢体作【义的兵器】献给神\n13:12  带上【光明的兵器】</pre><p>第六章：你的肢体是兵器。第十三章：那些兵器要<b>穿上身</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 不可用13:11推算任何时间表。<br>保罗的重点是「<b>该醒了</b>」，不是时刻表。（太24:36「那日子、那时辰，没有人知道」）</p>"},{"a":13,"z":13,"star":false,"grk":"<p>ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ.</p>","lit":"<p>「我们要<b>行事为人得体</b>，<b>像在白昼一样</b>：不可<b>狂欢宴乐</b>与<b>醉酒</b>，不可<b>淫乱</b>与<b>放荡</b>，不可<b>纷争</b>与<b>嫉妒</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>端正</td><td>εὐσχημόνως</td><td>euschēmonōs</td><td>G2156</td><td>εὖ + σχῆμα：<b>得体的、合宜的</b>（<b>12:2 συσχηματίζω 同字根</b>）</td></tr><tr><td>荒宴</td><td>κῶμος</td><td>kōmos</td><td>G2970</td><td><b>狂欢的宴会</b>（原指酒神游行）</td></tr><tr><td>醉酒</td><td>μέθη</td><td>methē</td><td>G3178</td><td>醉酒</td></tr><tr><td>好色</td><td>κοίτη</td><td>koitē</td><td>G2845</td><td>床笫之事（性的放纵）</td></tr><tr><td>邪荡</td><td>ἀσέλγεια</td><td>aselgeia</td><td>G766</td><td><b>无耻、放肆</b>（毫无节制）</td></tr><tr><td>争竞</td><td>ἔρις</td><td>eris</td><td>G2054</td><td>纷争</td></tr><tr><td>嫉妒</td><td>ζῆλος</td><td>zēlos</td><td>G2205</td><td><b>10:2「热心」那个字</b>（负面用法）</td></tr></table>","gram":"<p>★ 亮光一：三对罪的排列</p><pre>【放纵】荒宴 ＋ 醉酒\n【情欲】好色 ＋ 邪荡\n【关系】争竞 ＋ 嫉妒</pre><p>弟兄姊妹，注意保罗把第三对放在同一份清单里。</p><p>在教会里，我们对前面两对很敏感。<br>但「争竞、嫉妒」——</p><p>保罗把它们放在跟醉酒、淫乱<b>同一行</b>。</p><p>★ 亮光二：ζῆλος 的两面</p><pre>10:2   「他们向神有【热心】（ζῆλος），但不是按着真知识」—— 中性偏正面\n13:13  「不可争竞【嫉妒】（ζῆλος）」—— 负面</pre><p>同一个字。</p><p>ζῆλος 是「沸腾」——而沸腾的东西，可以是热心，也可以是嫉妒。</p><p>差别在于：<b>它烧的方向</b>。</p><p>★ 亮光三：εὐσχημόνως 与12:2的字根呼应</p><pre>12:2   μὴ συσχηματίζεσθε —— 不要被【模成】这世界的样子（σχῆμα）\n13:13  εὐσχημόνως        —— 行事为人要【得体】（εὖ + σχῆμα）</pre><p>弟兄姊妹，同一个字根 σχῆμα（外面的样子）。</p><p>12:2说：不要被这世界模成它的<b>样子</b>。<br>13:13说：要有一个<b>得体的样子</b>。</p><p>不是「没有样子」，是「<b>换一个样子</b>」。</p>","exp":"<p>弟兄姊妹，13:13列了六样要脱掉的东西——而它们是<b>三对</b>：</p><pre>κώμοις καὶ μέθαις      —— 荒宴、醉酒     【放纵】\nκοίταις καὶ ἀσελγείαις —— 好色、邪荡     【情欲】\nἔριδι καὶ ζήλῳ         —— 争竞、嫉妒     【关系】</pre><p><b>经文本身明确表达的：</b> 既然是白昼的人，行事为人就要得体，脱离这三对行为。</p><p><b>可以合理推论的：</b> 前两对在教会里人人喊打。</p><p>而第三对——<b>争竞与嫉妒</b>——我们常常把它当成「个性问题」或「他就是比较有想法」。</p><p>而保罗把它们放在跟醉酒、淫乱<b>同一行</b>。<br>（加5:19–21也是如此：「争竞、忌恨、恼怒、结党」与「奸淫、污秽、醉酒」列在一起。）</p><p>而 ζῆλος（嫉妒）正是10:2「热心」、12:11「心里火热」那个字根：</p><p>同一种<b>沸腾</b>；差别在于——<b>它烧的方向</b>。</p>"},{"a":14,"z":14,"star":true,"grk":"<p>ἀλλ' ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστὸν καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.</p>","lit":"<p>「反倒要<b>穿上</b>主耶稣基督；并且<b>不要为肉体作预备</b>，以致（满足）私欲。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>披戴</td><td>ἐνδύσασθε</td><td>endysasthe</td><td>G1746</td><td>ἐν + δύω（进入）</td><td><b>穿上（衣服）</b></td><td><b>不定过去命令式</b></td></tr><tr><td>安排</td><td>πρόνοια</td><td>pronoia</td><td>G4307</td><td>πρό + νοέω（想）</td><td><b>预先计划、事先安排</b></td><td><b>见下——极重要</b></td></tr><tr><td>私欲</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>ἐπί + θυμός</td><td>强烈的渴望</td><td>6:12同字</td></tr></table>","gram":"<p>★ 亮光一：ἐνδύω ——「穿上一个人」</p><p>「披戴主耶稣基督」——ἐνδύσασθε，<b>穿上衣服</b>。</p><p>在古代，「穿上某人的衣服」意味着：</p><p>1. <b>取得那个身分</b>（如罗马男孩成年时穿上 toga virilis）<br>2. <b>在戏剧中扮演那个角色</b></p><p>而保罗在别处用同一个字：</p><p><b>加3:27「你们受洗归入基督的，都是</b>披戴<b>基督了。」</b>（不定过去式：已经发生）</p><p><b>罗13:14「总要</b>披戴<b>主耶稣基督。」</b>（命令式：你要去做）</p><p>弟兄姊妹，这是新约一贯的「已然未然」结构：</p><p>你已经穿上了（加3:27）——<br>所以每天早上，把它穿上（罗13:14）。</p><p>★★ 亮光二：πρόνοια ——「不要为肉体<b>预先安排</b>」</p><p>这是本节最实用、也最扎人的一个字。</p><p>πρόνοια ＝ πρό（预先）+ νοέω（想）——</p><p>意思是：<b>事先的计划、预备、安排</b>。</p><p>（徒24:2用同一个字：腓力斯的「<b>先见</b>」）</p><p>弟兄姊妹，保罗在说什么？</p><p>他<b>不是</b>说「不要放纵私欲」——</p><p>他说：<b>不要为那件事作预备</b>。</p><p>这是一个极其实际的教导：</p><pre>一般的想法：我要在试探来的那一刻，努力抵挡\n保罗的教导：不要走到那个试探来得到你的地方</pre><p>因为当一个人开始「为肉体安排」的时候——</p><p>他其实已经决定了。</p><p>（例如：不是「看到的时候要忍住」，而是「不要把手机带进那个房间」。）</p><p>★ 亮光三：13:14的两半是一组</p><pre>【积极】穿上主耶稣基督\n【消极】不要为肉体预先安排</pre><p>弟兄姊妹，这两半缺一不可。</p><p>只有消极的（「不要」），会变成一场没有终点的压抑。<br>只有积极的（「穿上」），会忽略实际的防线。</p><p>保罗两个都给。</p>","exp":"<p>弟兄姊妹，13:14是教会历史上最有名的一节经文之一。</p><p>因为它是<b>奥古斯丁归主的那一节</b>。</p><p>奥古斯丁在《忏悔录》第八卷记载：</p><p>他在米兰的花园中极度挣扎，痛哭。</p><p>然后他听见邻家传来孩童反复吟唱的声音：</p><p>「拿起来读，拿起来读（Tolle lege, tolle lege）。」</p><p>他起身，拿起保罗书信，随手翻开，读到的正是：</p><p>「不可荒宴醉酒，不可好色邪荡，不可争竞嫉妒。总要披戴主耶稣基督，不要为肉体安排，去放纵私欲。」</p><p>他写道：读完之后，「一道确定的光，仿佛注入我心，一切疑虑的阴霾都消散了」。</p><p>弟兄姊妹，这是有第一手文献的记载。</p><p>而那个挣扎了多年的人，最后改变他的，不是一套论证——</p><p>是一句话：<b>穿上祂</b>。</p>"}],"14":[{"a":1,"z":1,"star":true,"grk":"<p>Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.</p>","lit":"<p>「那在信心上<b>软弱的</b>，你们要<b>接到自己这里来</b>；<b>不是为了</b>（陷入）<b>意见的争辩</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>软弱</td><td>ἀσθενοῦντα</td><td>asthenounta</td><td>G770</td><td>ἀ + σθένος（力量）</td><td><b>没有力气的</b></td><td><b>5:6同字</b></td></tr><tr><td>接纳</td><td>προσλαμβάνεσθε</td><td>proslambanesthe</td><td>G4355</td><td>πρός + λαμβάνω</td><td><b>接到自己身边来</b></td><td><b>中间语态</b>（见下）</td></tr><tr><td>辩论</td><td>διακρίσεις</td><td>diakriseis</td><td>G1253</td><td>διά + κρίνω</td><td><b>争辩、评断</b></td><td>—</td></tr><tr><td>疑惑的事</td><td>διαλογισμῶν</td><td>dialogismōn</td><td>G1261</td><td>διά + λογίζομαι</td><td><b>内心的思量、意见</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：προσλαμβάνω 的画面</p><p>这个字由 πρός（向着）+ λαμβάνω（拿、接）组成，而且是<b>中间语态</b>——</p><p>意思是：<b>把某人接到自己这里来、收进自己的圈子里</b>。</p><p>新约的其他用法：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>徒28:2</b></td><td>岛上的土人「<b>接待</b>我们」（生火款待保罗一行）</td></tr><tr><td><b>门1:17</b></td><td>保罗为阿尼西母说：「就<b>收纳</b>他，如同收纳我一样」</td></tr><tr><td><b>罗15:7</b></td><td><b>「你们要</b>彼此接纳<b>，如同</b>基督接纳你们一样<b>」</b></td></tr></table><p>弟兄姊妹，「接纳」不是「容忍他存在」。</p><p>是<b>把他接到自己这里来</b>。</p><p>★ 亮光二：「软弱」是指什么？</p><p>ἀσθενέω 在此<b>不是</b>指道德软弱或属灵不成熟。</p><p>从14:2的例子看，它指的是：</p><p>在<b>自由的良心</b>上，还不能放开的人。</p><p>（他觉得某些事不可以做，而其实那件事并不是罪。）</p><p>弟兄姊妹，这一点很重要：</p><p>保罗称他「软弱」，却<b>完全没有要他改变</b>。</p><p>他要改变的，是<b>强的人的态度</b>。</p><p>★ 亮光三：「不要辩论所疑惑的事」</p><p>原文的意思接近：</p><p>接纳他——<b>但不是为了把他拉进一场意见的辩论</b>。</p><p>弟兄姊妹，这是很实际的提醒：</p><p>有一种「接纳」，是先欢迎你进来，然后开始纠正你。</p><p>保罗说：不是那样。</p>","exp":"<p>弟兄姊妹，14:1是这一整段（14:1–15:13）的<b>开场命令</b>。</p><p>而它有两半，第二半常被跳过：</p><pre>① 你们要接纳（προσλαμβάνεσθε）—— 把他接到自己这里来\n② 但不要为了辩论他所疑惑的事</pre><p><b>经文本身明确表达的：</b> 要接纳信心软弱的人，但接纳的目的不是把他拉进意见的争辩。</p><p><b>可以合理推论的：</b> 「接纳」不是「容忍他存在」——<br>προσλαμβάνω 是<b>中间语态</b>，字面是「<b>把某人接到自己这里来</b>」。<br>（门1:17保罗为逃跑的奴仆阿尼西母用同一个字：「就<b>收纳他，如同收纳我一样</b>。」）</p><p>而「软弱」（ἀσθενέω）在此<b>不是</b>指道德软弱或属灵不成熟——</p><p>从14:2的例子看，它指的是：<b>在自由的良心上，还不能放开的人</b>。</p><p><b>⚠ 牧养提醒：</b> 绝不可用「软弱」去贴标签（「你就是14章那个软弱的」）。<br>那正好是14:3所禁止的「轻看」。<br>而值得注意的是：保罗称他「软弱」，却<b>完全没有要他改变</b>——他要改变的是<b>强的人的态度</b>。</p>"},{"a":2,"z":3,"star":true,"grk":"<p>3 ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ὁ δὲ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.</p>","lit":"<p>2「有人<b>相信可以吃一切的东西</b>；但<b>那软弱的，只吃蔬菜</b>。」<br>3「那吃的，<b>不可把不吃的当作零</b>；那不吃的，<b>不可论断那吃的</b>——<b>因为神已经接纳他了</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>轻看</td><td>ἐξουθενείτω</td><td>exoutheneitō</td><td>G1848</td><td>ἐξ + οὐθέν（<b>零、无</b>）</td><td><b>当作零、视为无物</b></td><td>见下</td></tr><tr><td>论断</td><td>κρινέτω</td><td>krinetō</td><td>G2919</td><td>κρίνω</td><td><b>判定、定罪</b></td><td><b>2:1同字</b></td></tr><tr><td>收纳</td><td>προσελάβετο</td><td>proselabeto</td><td>G4355</td><td>—</td><td><b>接纳</b>（14:1同字）</td><td><b>主词是神</b></td></tr></table>","gram":"<p>★ 亮光一：ἐξουθενέω ——「把人当成零」</p><p>这个字的字根是 <b>οὐθέν（＝ οὐδέν，「无、零」）</b>。</p><p>字面意思是：<b>把某人当作「什么都不是」</b>。</p><p>（路23:11希律「藐视」耶稣；林前1:28「被人<b>厌恶</b>的」——同字）</p><p>弟兄姊妹，这个字的画面很传神：</p><p>轻看，不是恨他。</p><p>是——<b>把他归零</b>。</p><p>在你心里的名单上，他的分量是零。</p><p>★ 亮光二：两种罪的精准区分</p><pre>【强的人】ἐξουθενέω（轻看）—— 把人当成零\n【弱的人】κρίνω（论断）    —— 坐上审判席</pre><p>弟兄姊妹，保罗的观察极其准确：</p><p>强的人<b>不会</b>说你有罪，他只是觉得你「还不懂」。<br>弱的人<b>不会</b>看不起你，他会觉得你「堕落了」。</p><p>而两边——<b>都被保罗点名了</b>。</p><p>★ 亮光三：14:3的理由</p><p>「<b>因为神已经收纳他了</b>。」</p><p>弟兄姊妹，这是全章第一个、也是最根本的理由：</p><p>神已经收了。</p><p>那你凭什么不收？</p>","exp":"<p>弟兄姊妹，3节指出两边各有各的罪——而且<b>方向相反</b>。</p><table><tr><th></th><th>原文</th><th>那是什么</th></tr><tr><td><b>强的人</b></td><td><b>ἐξουθενέω（轻看）</b></td><td>字根是 οὐθέν ＝ <b>零</b>：把人当作什么都不是</td></tr><tr><td><b>弱的人</b></td><td><b>κρίνω（论断）</b></td><td>法庭的字：<b>定他的罪</b></td></tr></table><p><b>经文本身明确表达的：</b> 吃的不可轻看不吃的，不吃的不可论断吃的；因为神已经接纳他了。</p><p><b>可以合理推论的：</b> 保罗的观察极其精准——</p><p>强的人<b>不会</b>说你有罪，他只是觉得你「还不懂」——他把你<b>归零</b>。<br>弱的人<b>不会</b>看不起你，他会觉得你「堕落了」——他<b>定你的罪</b>。</p><p>而两边——<b>都被保罗点名了</b>。</p><p>而理由只有一句：「<b>因为神已经收纳他了</b>。」</p><p>神已经收了。那你凭什么不收？</p>"},{"a":4,"z":4,"star":true,"grk":"<p>σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν.</p>","lit":"<p>「<b>你是谁</b>，竟去论断<b>别人家的仆人</b>？他站住或跌倒，是<b>对他自己的主人</b>（而言）；而且他<b>必要被扶立</b>，因为主<b>有能力</b>使他站住。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>你是谁</td><td>σὺ τίς εἶ</td><td>sy tis ei</td><td>—</td><td><b>你到底是谁？</b>（<b>9:20同样的句型</b>）</td></tr><tr><td>别人的</td><td>ἀλλότριος</td><td>allotrios</td><td>G245</td><td><b>属于别人的</b>（不是你的）</td></tr><tr><td>仆人</td><td>οἰκέτης</td><td>oiketēs</td><td>G3610</td><td>οἶκος（家）：<b>家仆</b></td></tr><tr><td>必要站住</td><td>σταθήσεται</td><td>stathēsetai</td><td>G2476</td><td><b>被动式：他必被扶立</b></td></tr><tr><td>能</td><td>δυνατεῖ</td><td>dynatei</td><td>G1414</td><td><b>有能力</b>（<b>4:21同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：σὺ τίς εἶ ——第九章那个句型</p><pre>9:20  「你这个人哪，【你是谁】（σὺ τίς εἶ），竟敢向神强嘴呢？」\n14:4  「【你是谁】（σὺ τίς εἶ），竟论断别人的仆人呢？」</pre><p>弟兄姊妹，同一个句型。</p><p>第九章：你凭什么审问<b>神</b>？<br>第十四章：你凭什么审问<b>神的仆人</b>？</p><p>★ 亮光二：ἀλλότριος οἰκέτης ——「别人家的仆人」</p><p>οἰκέτης ＝ 家中的仆人（不是一般的 δοῦλος，更强调「属于某一家」）。</p><p>而 ἀλλότριος ＝ <b>属于别人的</b>。</p><p>弟兄姊妹，这个画面在第一世纪极其清楚：</p><p>你走进邻居家，看见他家的仆人做事做得不合你意。</p><p>你会去责备他吗？</p><p>不会。因为——<b>那不是你的仆人</b>。</p><p>他的表现，是<b>向他的主人负责</b>，不是向你。</p><p>★ 亮光三：σταθήσεται 是被动式</p><p>「而且他也<b>必要站住</b>」——被动：<b>他必被扶立</b>。</p><p>而下半句解释了谁扶：</p><p>「因为<b>主能使他站住</b>。」</p><p>弟兄姊妹，这一句是全章最温暖的：</p><p>保罗<b>没有</b>说：「他会不会站住，我们拭目以待。」</p><p>他说：<b>他必站住</b>。</p><p>因为扶他的不是他自己，是<b>主</b>。</p><p>★ 亮光四：δυνατεῖ ——第四章那个字根</p><pre>4:21  「且满心相信神所应许的【必能】（δυνατός）做成」\n14:4  「因为主【能】（δυνατεῖ）使他站住」</pre><p>那位使亚伯拉罕从「身体如同已死」中得着儿子的神——</p><p>也能扶住那个你觉得「不太行」的弟兄。</p>","exp":"<p>弟兄姊妹，14:4是全章最有力的一句话。</p><p>而它的力量在于：它处理的不是「谁对」，是「<b>谁有资格判</b>」。</p><p>保罗没有说：「你的看法不对。」</p><p>他说：「<b>那不是你的仆人</b>。」</p><p>【第二段｜14:5–9　各人为主】</p>"},{"a":5,"z":6,"star":false,"grk":"<p>5 …ἕκαστος ἐν
