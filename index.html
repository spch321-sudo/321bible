—他<b>定你的罪</b>。</p><p>而兩邊——<b>都被保羅點名了</b>。</p><p>而理由只有一句：「<b>因為神已經收納他了</b>。」</p><p>神已經收了。那你憑什麼不收？</p>"},{"a":4,"z":4,"star":true,"grk":"<p>σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν.</p>","lit":"<p>「<b>你是誰</b>，竟去論斷<b>別人家的僕人</b>？他站住或跌倒，是<b>對他自己的主人</b>（而言）；而且他<b>必要被扶立</b>，因為主<b>有能力</b>使他站住。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>你是誰</td><td>σὺ τίς εἶ</td><td>sy tis ei</td><td>—</td><td><b>你到底是誰？</b>（<b>9:20同樣的句型</b>）</td></tr><tr><td>別人的</td><td>ἀλλότριος</td><td>allotrios</td><td>G245</td><td><b>屬於別人的</b>（不是你的）</td></tr><tr><td>僕人</td><td>οἰκέτης</td><td>oiketēs</td><td>G3610</td><td>οἶκος（家）：<b>家僕</b></td></tr><tr><td>必要站住</td><td>σταθήσεται</td><td>stathēsetai</td><td>G2476</td><td><b>被動式：他必被扶立</b></td></tr><tr><td>能</td><td>δυνατεῖ</td><td>dynatei</td><td>G1414</td><td><b>有能力</b>（<b>4:21同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：σὺ τίς εἶ ——第九章那個句型</p><pre>9:20  「你這個人哪，【你是誰】（σὺ τίς εἶ），竟敢向神強嘴呢？」\n14:4  「【你是誰】（σὺ τίς εἶ），竟論斷別人的僕人呢？」</pre><p>弟兄姊妹，同一個句型。</p><p>第九章：你憑什麼審問<b>神</b>？<br>第十四章：你憑什麼審問<b>神的僕人</b>？</p><p>★ 亮光二：ἀλλότριος οἰκέτης ——「別人家的僕人」</p><p>οἰκέτης ＝ 家中的僕人（不是一般的 δοῦλος，更強調「屬於某一家」）。</p><p>而 ἀλλότριος ＝ <b>屬於別人的</b>。</p><p>弟兄姊妹，這個畫面在第一世紀極其清楚：</p><p>你走進鄰居家，看見他家的僕人做事做得不合你意。</p><p>你會去責備他嗎？</p><p>不會。因為——<b>那不是你的僕人</b>。</p><p>他的表現，是<b>向他的主人負責</b>，不是向你。</p><p>★ 亮光三：σταθήσεται 是被動式</p><p>「而且他也<b>必要站住</b>」——被動：<b>他必被扶立</b>。</p><p>而下半句解釋了誰扶：</p><p>「因為<b>主能使他站住</b>。」</p><p>弟兄姊妹，這一句是全章最溫暖的：</p><p>保羅<b>沒有</b>說：「他會不會站住，我們拭目以待。」</p><p>他說：<b>他必站住</b>。</p><p>因為扶他的不是他自己，是<b>主</b>。</p><p>★ 亮光四：δυνατεῖ ——第四章那個字根</p><pre>4:21  「且滿心相信神所應許的【必能】（δυνατός）做成」\n14:4  「因為主【能】（δυνατεῖ）使他站住」</pre><p>那位使亞伯拉罕從「身體如同已死」中得著兒子的神——</p><p>也能扶住那個你覺得「不太行」的弟兄。</p>","exp":"<p>弟兄姊妹，14:4是全章最有力的一句話。</p><p>而它的力量在於：它處理的不是「誰對」，是「<b>誰有資格判</b>」。</p><p>保羅沒有說：「你的看法不對。」</p><p>他說：「<b>那不是你的僕人</b>。」</p><p>【第二段｜14:5–9　各人為主】</p>"},{"a":5,"z":6,"star":false,"grk":"<p>5 …ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω.</p>","lit":"<p>5「有人<b>看某一日比別日重要</b>；有人<b>看每一日都一樣</b>。<b>只要各人在自己的心思裡，被充分說服</b>。」<br>6「那<b>看重某日的</b>，是<b>為主</b>看重的；那<b>吃的</b>，是為主吃的——<b>因為他感謝神</b>；那<b>不吃的</b>，是為主不吃的——<b>他也感謝神</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>心裡</td><td>νοῦς</td><td>nous</td><td>G3563</td><td><b>心思、理智</b>（<b>12:2同字</b>）</td></tr><tr><td>意見堅定</td><td>πληροφορείσθω</td><td>plērophoreisthō</td><td>G4135</td><td><b>被完全裝滿、被充分說服</b>（<b>4:21同字</b>）</td></tr><tr><td>感謝神</td><td>εὐχαριστεῖ</td><td>eucharistei</td><td>G2168</td><td>獻上感謝</td></tr></table>","gram":"<p>★ 亮光一：πληροφορέω ——第四章那個字</p><pre>4:21  亞伯拉罕「【滿心相信】（πληροφορηθείς）神所應許的必能做成」\n14:5  「各人心裡要【意見堅定】（πληροφορείσθω）」</pre><p>這個字的字面是「<b>被裝滿到頂</b>」，也用於「船隻滿帆」。</p><p>弟兄姊妹，保羅在說：</p><p>你不必跟別人一樣——</p><p>但你要在<b>你自己的心思裡</b>，被充分說服。</p><p>（換句話說：<b>不要因為別人這樣做，你就跟著做</b>；也不要因為別人那樣做，你就跟著批評。）</p><p>★ 亮光二：14:6的關鍵——兩邊都感謝神</p><pre>吃的人   —— 為主吃的，【因他感謝神】\n不吃的人 —— 為主不吃的，【也感謝神】</pre><p>弟兄姊妹，這是全章最令人安靜的一句話。</p><p>兩個人做的事相反。</p><p>但兩個人做的<b>動作</b>是一樣的——</p><p>他們都在<b>謝飯</b>。</p><p>★ 亮光三：νοῦς ——12:2那個字</p><pre>12:2  「只要【心意】（νοῦς）更新而變化」\n14:5  「各人【心裡】（νοῦς）要意見堅定」</pre><p>保羅在12:2說：心思要被更新。<br>在14:5說：而更新後的心思，<b>每個人的進度不一樣</b>。</p>","exp":"<p>弟兄姊妹，6節是全章<b>最令人安靜</b>的一句話。</p><p>兩個人做的事<b>完全相反</b>：一個吃，一個不吃。</p><p>但他們在做<b>同一個動作</b>——</p><p>他們都在<b>謝飯</b>。</p><p><b>經文本身明確表達的：</b> 在守日與飲食這類事上，各人要在自己心裡意見堅定；而兩邊都是「為主」，並且都感謝神。</p><p><b>可以合理推論的：</b> 「意見堅定」（πληροφορέω）的字面是「<b>被裝滿到頂</b>」，也用於「船隻滿帆」——<br>那是4:21形容亞伯拉罕「<b>滿心相信</b>」的同一個字。</p><p>所以保羅要的不是「你跟大家一樣」，是「<b>你自己在神面前被說服</b>」。</p><p>換句話說：<b>不要因為別人這樣做你就跟著做；也不要因為別人那樣做你就跟著批評</b>。</p><p><b>⚠ 講台誠信提醒：</b> 14:5「有人看這日比那日強」與安息日的關係，<br>敬虔的基督徒有不同看法（見第二十部分）。<br>而值得注意的是：<b>連保羅自己都沒有在這件事上定案</b>——他只說「各人心裡要意見堅定」。</p>"},{"a":7,"z":9,"star":true,"grk":"<p>9 εἰς τοῦτο γὰρ Χριστὸς ἀπέθανεν καὶ ἔζησεν, ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.</p>","lit":"<p>7「因為我們<b>沒有一個人為自己活</b>，也<b>沒有一個人為自己死</b>。」<br>8「因為我們若活著，是<b>向著主</b>活；若死了，是<b>向著主</b>死。所以，我們或活或死，<b>都是屬主的</b>。」<br>9「因為基督<b>死了，又活了</b>，正是為這緣故：<b>要作死人與活人的主</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>主的人</td><td>τοῦ κυρίου ἐσμέν</td><td>tou kyriou esmen</td><td>G2962</td><td><b>我們是主的</b>（所有格：屬於祂）</td></tr><tr><td>作主</td><td>κυριεύσῃ</td><td>kyrieusē</td><td>G2961</td><td><b>作主、掌權</b>（<b>6:9、6:14、7:1同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：κυριεύω 的旅程</p><pre>6:9   死不再【作主】了\n6:14  罪必不能【作】你們的【主】\n7:1   律法【管】人是在活著的時候\n   ↓\n14:9  基督死了又活了，為要【作】死人並活人的【主】</pre><p>弟兄姊妹，羅馬書一路在拆掉各種「主」——死、罪、律法。</p><p>到了第十四章，那個空出來的位置，有人坐上去了：</p><p>基督。</p><p>★ 亮光二：14:9是整段的基督論根據</p><p>保羅為什麼說「你是誰，竟論斷別人的僕人」？</p><p>因為：</p><pre>基督死了又活了 → 為要作主 → 所以那個人是【祂的】\n   ↓\n你論斷他，等於在祂的家裡替祂管家</pre><p>★ 亮光三：「沒有一個人為自己活」</p><p>弟兄姊妹，14:7常被引用成一句勵志的話（「人要為別人而活」）。</p><p>但保羅的意思更精確：</p><p>我們<b>不屬於自己</b>——<b>我們屬於主</b>（14:8）。</p>","exp":"<p>弟兄姊妹，這三節是14:4那句反問（「你是誰，竟論斷<b>別人的</b>僕人」）的<b>神學根據</b>。</p><p>保羅的推論鏈很清楚：</p><pre>基督死了又活了（14:9）\n   ↓ 為要作主\n所以那個人是【祂的】（14:8）\n   ↓\n所以審判權在祂，不在你（14:4、14:10）</pre><p><b>經文本身明確表達的：</b> 沒有人為自己活或死；我們或活或死都屬於主；因為基督死而復活，正是為要作死人與活人的主。</p><p><b>可以合理推論的：</b> 「沒有一個人為自己活」常被引成一句勵志的話（「人要為別人而活」）。</p><p>但保羅的意思更精確：<b>我們不屬於自己——我們屬於主</b>。</p><p>而 κυριεύω（作主）這個字，在羅馬書一路被拆過：</p><pre>6:9   死不再【作主】了\n6:14  罪必不能【作】你們的【主】\n7:1   律法【管】人是在活著的時候\n   ↓\n14:9  基督【作】死人並活人的【主】</pre><p>羅馬書一路在拆掉各種「主」——而那個空出來的位置，有人坐上去了。</p><p>【第三段｜14:10–12　神的臺前】</p>"},{"a":10,"z":12,"star":true,"grk":"<p>10 …πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ.<br>12 ἄρα οὖν ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον δώσει τῷ θεῷ.</p>","lit":"<p>10「但<b>你</b>——你為什麼論斷你的弟兄？或者<b>你</b>——你為什麼把你的弟兄當作零？<b>因為我們都要站在神的審判臺前</b>。」<br>11「因為經上記著：『主說：<b>我指著我的永生起誓</b>：<b>萬膝必向我跪拜</b>，<b>萬口必向神承認</b>。』」<br>12「這樣看來，<b>我們各人都要為自己的事，向神交帳</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>站</td><td>παραστησόμεθα</td><td>parastēsometha</td><td>G3936</td><td><b>παρίστημι——6:13、12:1「獻上」那個字！</b></td></tr><tr><td>臺</td><td>βῆμα</td><td>bēma</td><td>G968</td><td><b>審判臺</b>（見下）</td></tr><tr><td>說明</td><td>λόγον δώσει</td><td>logon dōsei</td><td>G3056</td><td><b>交帳、給出說明</b></td></tr></table>","gram":"<p>★ 亮光一：βῆμα ——一個很具體的東西</p><p>βῆμα 是一個<b>高起的平臺</b>，官長坐在上面審案。</p><p>新約中：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>太27:19</b></td><td>彼拉多<b>坐堂</b>（βῆμα）的時候</td></tr><tr><td><b>徒18:12</b></td><td><b>保羅在哥林多被拉到迦流的公堂（βῆμα）前</b></td></tr><tr><td><b>林後5:10</b></td><td>「我們眾人必要在<b>基督臺前</b>顯露出來」</td></tr></table><p>弟兄姊妹，保羅寫羅馬書的地點，正是<b>哥林多</b>。</p><p>而他自己就曾站在哥林多的那個 βῆμα 前面受審。</p><p>★ 亮光二：παρίστημι ——「獻上」那個字</p><pre>6:13  「將自己【獻給】（παραστήσατε）神」\n12:1  「將身體【獻上】（παραστῆσαι），當作活祭」\n   ↓\n14:10 「我們都要【站在】（παραστησόμεθα）神的臺前」</pre><p>弟兄姊妹，同一個字。</p><p>你現在<b>獻上</b>自己（12:1）；<br>將來你要<b>站在</b>祂面前（14:10）。</p><p>是同一個動作的兩個時態。</p><p>★ 亮光三：ἕκαστος περὶ ἑαυτοῦ ——「各人為<b>自己</b>」</p><p>14:12的重點在兩個詞：</p><pre>ἕκαστος   —— 【各人】\nπερὶ ἑαυτοῦ —— 【為自己的事】</pre><p>弟兄姊妹，這一節堵死了論斷最後的藉口：</p><p>那一天，你不會被問到「你弟兄做得怎麼樣」。</p><p>你會被問到——<b>你自己</b>。</p><p>★ 亮光四：14:11引賽45:23</p><p>而腓2:10–11把同一段用在<b>基督</b>身上。</p><p>這與羅10:13（珥2:32的「主」＝耶和華）是同一個模式。</p>","exp":"<p>弟兄姊妹，10節用了兩個很強的「你」（σὺ δὲ… ἢ καὶ σὺ…）——</p><p>保羅是<b>指著鼻子問</b>的。</p><p>而「臺」（βῆμα）是一個很具體的東西：</p><p>一個<b>高起的平臺</b>，官長坐在上面審案。</p><p>（太27:19彼拉多「<b>坐堂</b>」；徒18:12<b>保羅自己在哥林多被拉到迦流的公堂前</b>——而他正是在哥林多寫這封信。）</p><p><b>經文本身明確表達的：</b> 我們都要站在神的臺前，各人要為自己的事向神交帳。</p><p><b>可以合理推論的：</b> 12節堵死了論斷最後的藉口——</p><p>那一天，你<b>不會</b>被問到「你弟兄做得怎麼樣」。<br>你會被問到——<b>你自己</b>。</p><p><b>⚠ 補充：</b> 「站在」（παραστησόμεθα）正是6:13、12:1「<b>獻上</b>」那個字。</p><p>你現在<b>獻上</b>自己（12:1）；將來你要<b>站在</b>祂面前（14:10）。</p><p>是同一個動作的兩個時態。</p><p>【第四段｜14:13–18　絆腳石】</p>"},{"a":13,"z":13,"star":true,"grk":"<p>Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.</p>","lit":"<p>「所以，<b>我們不可再彼此論斷</b>；<b>倒要判定這一件事</b>：<b>不給弟兄放下絆腳石或陷阱</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>論斷／定意</td><td>κρίνωμεν／κρίνατε</td><td>krinōmen/krinate</td><td>G2919</td><td><b>同一個動詞，兩次</b>（見下）</td></tr><tr><td>絆腳</td><td>πρόσκομμα</td><td>proskomma</td><td>G4348</td><td><b>絆倒人的東西</b>（<b>9:33同字</b>）</td></tr><tr><td>跌人之物</td><td>σκάνδαλον</td><td>skandalon</td><td>G4625</td><td><b>捕獸夾的觸發桿</b>（見下）</td></tr></table>","gram":"<p>★ 亮光一：κρίνω 的文字遊戲</p><pre>μηκέτι ἀλλήλους κρίνωμεν —— 不可再彼此【論斷】\nἀλλὰ τοῦτο κρίνατε μᾶλλον —— 寧可【判定】這件事</pre><p>弟兄姊妹，保羅在說：</p><p>你要「判」，可以。</p><p>但不要判<b>那個人</b>——判<b>這件事</b>：</p><p>我不要成為他的絆腳石。</p><p>★ 亮光二：σκάνδαλον 的原意</p><p>這個字原指<b>捕獸夾上的那根觸發桿</b>——動物一碰，夾子就合起來。</p><p>弟兄姊妹，πρόσκομμα 是「絆一下」；<br>σκάνδαλον 是「<b>踩到就被夾住</b>」。</p><p>保羅用了兩個字，一個比一個嚴重。</p><p>★ 亮光三：πρόσκομμα ——9:33那個字</p><pre>9:33  「我在錫安放一塊【絆腳的石頭】（πρόσκομμα）」—— 那是【基督】\n   ↓\n14:13 「誰也不給弟兄放下【絆腳】（πρόσκομμα）跌人之物」</pre><p>弟兄姊妹，這個對照很嚴肅：</p><p>神放了一塊絆腳石，是為了叫人<b>面對基督</b>。</p><p>而你若放一塊絆腳石——<b>那是叫人跌倒</b>。</p>","exp":"<p>弟兄姊妹，13節在原文裡是一個<b>文字遊戲</b>——同一個動詞用了兩次。</p><pre>μηκέτι ἀλλήλους κρίνωμεν   —— 不可再彼此【論斷】\nἀλλὰ τοῦτο κρίνατε μᾶλλον  —— 寧可【判定】這件事</pre><p><b>經文本身明確表達的：</b> 不要再彼此論斷；要下的判斷是：不給弟兄放下絆腳跌人之物。</p><p><b>可以合理推論的：</b> 保羅<b>沒有</b>說「不要judge」。</p><p>他說：<b>你要「判」，可以——但不要判那個人，判這件事</b>。</p><p>而那件事是：<b>我不要成為他的絆腳石</b>。</p><p><b>⚠ 補充：</b> 保羅用了<b>兩個</b>字，一個比一個嚴重——</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>πρόσκομμα</b></td><td><b>絆一下</b>（9:33「絆腳的石頭」同字）</td></tr><tr><td><b>σκάνδαλον</b></td><td><b>陷阱的觸發桿</b>——踩到就被夾住</td></tr></table><p>而9:33那塊絆腳石是<b>神放的、指向基督的</b>；14:13這塊是<b>你放的、叫人跌倒的</b>。</p>"},{"a":14,"z":15,"star":true,"grk":"<p>15 …μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.</p>","lit":"<p>14「<b>我知道，並且在主耶穌裡已被說服</b>：<b>沒有一樣東西本身是不潔淨的</b>；只是<b>對那以為某物不潔淨的人，那物對他就是不潔淨的</b>。」<br>15「因為你若因食物<b>使你的弟兄憂愁</b>，你就<b>不再是照著愛而行</b>了。<b>不要因你的食物，毀掉那位基督為他死的人</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>確知深信</td><td>οἶδα καὶ πέπεισμαι</td><td>oida kai pepeismai</td><td>G1492/G3982</td><td><b>我知道，並且已被說服</b>（<b>8:38同字</b>）</td></tr><tr><td>不潔淨</td><td>κοινός</td><td>koinos</td><td>G2839</td><td><b>共用的、普通的</b> → 禮儀上不潔</td></tr><tr><td>憂愁</td><td>λυπεῖται</td><td>lypeitai</td><td>G3076</td><td>使之憂傷</td></tr><tr><td>敗壞</td><td>ἀπόλλυε</td><td>apollye</td><td>G622</td><td><b>毀掉、使之滅亡</b>（<b>現在式命令的否定</b>）</td></tr></table>","gram":"<p>★ 亮光一：保羅站在「強的」那一邊</p><p>「我憑著主耶穌<b>確知深信</b>，凡物本來沒有不潔淨的。」</p><p>πέπεισμαι 是<b>完成被動式</b>——「我已經被說服了」（8:38「我深信」同字）。</p><p>弟兄姊妹，這一節極其重要：</p><p>保羅<b>在神學上完全同意「強的人」</b>。</p><p>然後——</p><p>他花了整整一章，教強的人要讓步。</p><p>★ 亮光二：κοινός ——「普通的」</p><p>這個字的本義是「<b>共用的、大家的、普通的</b>」。</p><p>（徒2:44「凡物<b>公用</b>」——同字）</p><p>在猶太的用法中，它引申為「<b>未經分別為聖的 → 不潔淨的</b>」。</p><p>弟兄姊妹，保羅說的是：那件事本身沒有問題。</p><p>問題在<b>那個人的良心</b>。</p><p>★ 亮光三：14:15的兩個理由</p><pre>理由一：「就不是按著【愛人】的道理行」—— 13:8–10的愛\n理由二：「【基督已經替他死】」        —— 十字架的代價</pre><p>弟兄姊妹，第二個理由是全章最重的一句話：</p><p>你為了一口食物，可能傷害的那個人——</p><p>基督<b>為他死過</b>。</p><p>★ 亮光四：ἀπόλλυμι 的力度</p><p>「叫他<b>敗壞</b>」——ἀπόλλυμι 是很重的字（滅亡、毀掉）。</p><p>（關於這是否指「失去救恩」，見第二十部分。）</p>","exp":"<p>弟兄姊妹，14節極其重要——因為它告訴我們<b>保羅站在哪一邊</b>。</p><p>「我憑著主耶穌<b>確知深信</b>（πέπεισμαι，完成被動式：我已經被說服了），<br>凡物本來<b>沒有不潔淨的</b>。」</p><p>保羅在神學上<b>完全同意「強的人」</b>。（15:1他更明說：「我們<b>堅固的人</b>……」）</p><p>然後——</p><p>他花了整整一章，教<b>強的人</b>要讓步。</p><p><b>經文本身明確表達的：</b> 沒有一樣東西本身不潔淨；但若因食物使弟兄憂愁，就不是按愛而行；不可因食物毀掉基督為他死的人。</p><p><b>可以合理推論的：</b> 保羅給的兩個理由，一個比一個重——</p><p>理由一：「就不是按著<b>愛人的道理</b>行」（呼應13:8–10）。<br>理由二：「<b>基督已經替他死</b>」。</p><p>弟兄姊妹，第二個理由是全章最重的一句話：</p><p>你為了一口食物，可能傷害的那個人——</p><p>基督<b>為他死過</b>。</p><p>他身上，有基督的血。</p><p><b>⚠ 講台誠信提醒：</b> 「敗壞」（ἀπόλλυμι）是很重的字。<br>不可用它恐嚇人（「你會害弟兄下地獄」）；但也不可淡化成「傷他感情」。<br>保羅講的是<b>實質的屬靈傷害</b>（比較林前8:11–12）。而14:4已經給了平衡：「<b>主能使他站住</b>。」</p>"},{"a":16,"z":18,"star":false,"grk":"<p>17 οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ.</p>","lit":"<p>16「所以，<b>不要讓你所看為善的，被人毀謗</b>。」<br>17「因為<b>神的國不是吃喝</b>，乃是<b>公義、和平，並聖靈裡的喜樂</b>。」<br>18「因為<b>在這幾樣上服事基督的人</b>，就<b>為神所喜悅</b>，也<b>為人所稱許</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>公義</td><td>δικαιοσύνη</td><td>dikaiosynē</td><td>G1343</td><td><b>全卷書的主題字</b></td></tr><tr><td>和平</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td><b>5:1「與神相和」同字</b></td></tr><tr><td>喜樂</td><td>χαρά</td><td>chara</td><td>G5479</td><td>喜樂</td></tr></table>","gram":"<p>★ 亮光一：14:17是全章的神學重心</p><p>「神的國<b>不在乎吃喝</b>，只在乎<b>公義、和平，並聖靈中的喜樂</b>。」</p><p>弟兄姊妹，注意這三樣，正好是羅馬書前面各章的關鍵字：</p><table><tr><th>詞</th><th>出處</th></tr><tr><td><b>公義</b>（δικαιοσύνη）</td><td><b>1:17、3:21–26——因信稱義</b></td></tr><tr><td><b>和平</b>（εἰρήνη）</td><td><b>5:1「與神相和」</b></td></tr><tr><td><b>聖靈中的喜樂</b></td><td><b>5:2、8章、15:13</b></td></tr></table><p>弟兄姊妹，保羅在說：</p><p>你為之爭吵的那件事，<b>不在清單上</b>。</p><p>★ 亮光二：這一節同時說了兩件事</p><pre>消極面：神的國不在乎吃喝 —— 所以不要為那件事吵\n積極面：只在乎公義、和平、喜樂 —— 而你的爭吵，正在破壞【和平】</pre><p>弟兄姊妹，這是很深的一刀：</p><p>你為了一件「不在清單上」的事，<br>破壞了一件「在清單上」的事。</p>","exp":"<p>弟兄姊妹，14:17是全章的<b>神學重心</b>。</p><p>而那三樣東西，正好是羅馬書前面各章的關鍵字：</p><table><tr><th>詞</th><th>出處</th></tr><tr><td><b>公義</b>（δικαιοσύνη）</td><td><b>1:17、3:21–26——因信稱義</b></td></tr><tr><td><b>和平</b>（εἰρήνη）</td><td><b>5:1「與神相和」</b></td></tr><tr><td><b>聖靈中的喜樂</b></td><td><b>5:2、8章、15:13</b></td></tr></table><p><b>經文本身明確表達的：</b> 神的國的實質不在飲食，而在公義、和平與聖靈裡的喜樂。</p><p><b>可以合理推論的：</b> 這一節同時說了兩件事——</p><p>消極面：你為之爭吵的那件事，<b>不在清單上</b>。<br>積極面：而你的爭吵，正在破壞清單上的那一項——<b>和平</b>。</p><p>⚠ 一個很實際的檢驗：</p><p>我最近堅持的這件事，<b>在不在那份清單上</b>？</p><p>【第五段｜14:19–23　建立與拆毀】</p>"},{"a":19,"z":20,"star":true,"grk":"<p>19 ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.<br>20 μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ.</p>","lit":"<p>19「所以，我們要<b>追趕那屬於和睦的事</b>，以及那<b>彼此建造</b>的事。」<br>20「<b>不可為了食物，拆毀神的工程</b>。凡物固然都是潔淨的，但<b>人若因著食物使人絆倒，那就是他的惡了</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>追求</td><td>διώκωμεν</td><td>diōkōmen</td><td>G1377</td><td>—</td><td><b>追趕</b>（<b>12:13、14同字</b>）</td><td>—</td></tr><tr><td>建立</td><td>οἰκοδομή</td><td>oikodomē</td><td>G3619</td><td>οἶκος（房子）+ δέμω（建造）</td><td><b>造房子</b></td><td>見下</td></tr><tr><td>毀壞</td><td>κατάλυε</td><td>katalye</td><td>G2647</td><td>κατά + λύω（鬆開）</td><td><b>拆房子</b></td><td>見下</td></tr><tr><td>工程</td><td>ἔργον τοῦ θεοῦ</td><td>—</td><td>G2041</td><td>—</td><td><b>神的工作</b></td><td>—</td></tr></table>","gram":"<p>★★ 亮光一：兩個相反的建築用語</p><pre>14:19  οἰκοδομή —— 【建造】（造房子）\n14:20  κατάλυε  —— 【拆毀】（拆房子）</pre><p>καταλύω 這個字在福音書中，正是用來說聖殿的拆毀：</p><p>太26:61「這個人曾說：『我能<b>拆毀</b>（καταλῦσαι）神的殿。』」<br>可13:2「將來在這裡沒有一塊石頭留在石頭上，不被<b>拆毀</b>了。」</p><p>弟兄姊妹，保羅用了一個<b>拆聖殿</b>的字。</p><p>而他說：<b>不可因食物毀壞神的工程</b>。</p><p>★ 亮光二：一個殘酷的算術</p><pre>神在蓋   ——  一棟房子（οἰκοδομή）\n你為了   ——  一口食物（βρῶμα）\n把它     ——  拆了（κατάλυε）</pre><p>弟兄姊妹，這是一個極不成比例的交易。</p><p>★ 亮光三：διώκω ——12:13那個字</p><pre>12:13  「客要一味地【款待】」—— φιλοξενίαν διώκοντες（追趕款待）\n12:14  「【逼迫】（διώκοντας）你們的，要給他們祝福」\n   ↓\n14:19  「務要【追求】（διώκωμεν）和睦的事」</pre><p>和睦不是「碰巧發生」的，是要<b>追趕</b>的。</p>","exp":"<p>弟兄姊妹，19與20節用了<b>兩個相反的建築用語</b>。</p><pre>14:19  οἰκοδομή —— 【建造】（οἶκος 房子 + δέμω 建造）\n14:20  κατάλυε  —— 【拆毀】</pre><p>而 καταλύω 這個字，在福音書中正是用來說<b>拆聖殿</b>的：</p><p>太26:61「這個人曾說：『我能<b>拆毀</b>（καταλῦσαι）神的殿。』」<br>可13:2「沒有一塊石頭留在石頭上，不被<b>拆毀</b>了。」</p><p><b>經文本身明確表達的：</b> 要追求和睦與彼此建造；不可因食物拆毀神的工程。</p><p><b>可以合理推論的：</b> 保羅用了一個<b>拆聖殿</b>的字，來形容「因食物毀壞神的工程」。</p><p>而這是一個極不成比例的交易：</p><p>神在蓋一棟房子——一磚一瓦，很慢。<br>而你，<b>為了一口食物，拿著鐵鎚</b>。</p><p><b>⚠ 補充：</b> 「追求」（διώκω）是12:13、12:14那個字——<b>追趕</b>。</p><p>和睦不是「碰巧發生」的，是要<b>追趕</b>的。</p>"},{"a":21,"z":23,"star":false,"grk":"<p>22 σὺ πίστιν [ἣν] ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·<br>23 …πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ἐστίν.</p>","lit":"<p>21「<b>不吃肉、不喝酒、不做任何使你弟兄絆倒的事</b>，這才是好的。」<br>22「<b>你所有的那份信心，就你自己在神面前持守它</b>。<b>那在自己所察驗認可的事上不定自己罪的人，是有福的</b>。」<br>23「但那<b>心裡分裂</b>卻仍然吃的人，<b>就已被定罪</b>——因為他不是<b>出於信心</b>；而<b>凡不出於信心的，都是罪</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>守著</td><td>κατὰ σεαυτὸν ἔχε</td><td>kata seauton eche</td><td>—</td><td><b>就你自己保有它</b>（在神面前）</td></tr><tr><td>自責</td><td>μὴ κρίνων ἑαυτόν</td><td>—</td><td>G2919</td><td><b>不定自己的罪</b>（κρίνω 又出現）</td></tr><tr><td>以為可行</td><td>δοκιμάζει</td><td>dokimazei</td><td>G1381</td><td><b>察驗、判定為可</b>（<b>12:2同字</b>）</td></tr><tr><td>疑心</td><td>διακρινόμενος</td><td>diakrinomenos</td><td>G1252</td><td><b>心被撕成兩半、猶疑</b>（<b>4:20同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：14:22「就當在神面前守著」</p><p>這一節常被誤讀成「不要傳講你的信念」。</p><p>原文的意思較接近：</p><p>你所有的那份確信，<b>就你自己在神面前保有它</b>。</p><p>弟兄姊妹，保羅不是叫人隱藏信仰，<br>是說：<b>你的自由，不必拿到弟兄面前去證明</b>。</p><p>★ 亮光二：δοκιμάζω ——12:2那個字</p><pre>12:2   「叫你們【察驗】（δοκιμάζειν）何為神的……旨意」\n14:22  「人在自己【以為可行】（δοκιμάζει）的事上能不自責，就有福了」</pre><p>★ 亮光三：διακρίνομαι ——第四章那個字</p><pre>4:20  亞伯拉罕「總沒有因不信心裡【起疑惑】（διεκρίθη）」\n14:23 「若有【疑心】（διακρινόμενος）而吃的，就必有罪」</pre><p>這個字的字面是「<b>被撕成兩半</b>」。</p><p>弟兄姊妹，14:23講的不是「做錯事」，是——</p><p>在心裡分裂的狀態下去做。</p><p>★ 亮光四：14:23「凡不出於信心的都是罪」</p><p>這句話的<b>上下文限定</b>極其重要（見第二十部分）。</p><p>保羅在講的是：<b>在可爭議的事上，違背自己被說服的良心去做，就是罪</b>。</p><p>他<b>不是</b>在說「凡不是基督徒做的事都是罪」，<br>也<b>不是</b>在說「跟著感覺走就對了」。</p>","exp":"<p>弟兄姊妹，22節常被誤讀成「不要傳講你的信念」。</p><p>原文的意思較接近：</p><p>你所有的那份確信，<b>就你自己在神面前保有它</b>。</p><p><b>經文本身明確表達的：</b> 不做使弟兄絆倒的事才是好的；有信心的人在神面前持守；而違背自己良心去做的，就是罪。</p><p><b>可以合理推論的：</b> 保羅不是叫人隱藏信仰，<br>是說：<b>你的自由，不必拿到弟兄面前去證明</b>。</p><p>而23節的「疑心」（διακρινόμενος）字面是「<b>被撕成兩半</b>」——</p><p>那是4:20形容亞伯拉罕「總沒有因不信心裡<b>起疑惑</b>」的同一個字。</p><p>所以14:23講的<b>不是</b>「做錯事」，是——</p><p>在<b>心裡分裂的狀態下</b>去做。</p><p>⚠ 講台誠信提醒（一個常見的誤用）：</p><p>「凡不出於信心的都是罪」<b>不可以</b>被講成「只要我心裡平安，做什麼都可以」。</p><p>必須注意上下文的三個限定：</p><p>① 這一節是在講<b>可爭議的事</b>（食物、日子）。<br>② 「信心」在此指的是「<b>對自己在神面前所行之事的確信</b>」（14:22 δοκιμάζει）。<br>③ 與它相對的是 διακρινόμενος——<b>心被撕成兩半</b>。</p><p>良心不是最高權威——聖經才是。<br>但一個<b>被聖經教育過的良心</b>，不可違背。</p>"}],"15":[{"a":1,"z":1,"star":true,"grk":"<p>Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν καὶ μὴ ἑαυτοῖς ἀρέσκειν.</p>","lit":"<p>「我們<b>有能力的人</b>，<b>欠著一筆債</b>：要<b>扛起</b>那些<b>沒有能力的人</b>的軟弱，而<b>不是討自己的喜悅</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>應該</td><td>Ὀφείλομεν</td><td>opheilomen</td><td>G3784</td><td>ὀφείλω</td><td><b>欠債、有義務</b></td><td><b>13:8同字！</b></td></tr><tr><td>堅固的</td><td>δυνατοί</td><td>dynatoi</td><td>G1415</td><td>δύναμις（能力）</td><td><b>有能力的</b></td><td>—</td></tr><tr><td>不堅固的</td><td>ἀδυνάτων</td><td>adynatōn</td><td>G102</td><td>ἀ + δύναμις</td><td><b>沒有能力的</b></td><td><b>8:3同字</b>（律法「不能行的」）</td></tr><tr><td>擔代</td><td>βαστάζειν</td><td>bastazein</td><td>G941</td><td>βαστάζω</td><td><b>扛起重量、承載</b></td><td><b>11:18同字！</b></td></tr><tr><td>喜悅</td><td>ἀρέσκειν</td><td>areskein</td><td>G700</td><td>ἀρέσκω</td><td><b>討……的喜歡</b></td><td>見下</td></tr></table>","gram":"<p>★★ 亮光一：βαστάζω ——第十一章那個字</p><p>弟兄姊妹，這是本章最重要的一個字詞連結。</p><pre>11:18  「你就不可向舊枝子誇口；若是誇口，當知道\n        【不是你托著（βαστάζεις）根，乃是根托著你】。」\n   ↓\n15:1   「我們堅固的人應該【擔代】（βαστάζειν）不堅固人的軟弱。」</pre><p>同一個動詞：<b>扛起重量</b>。</p><p>弟兄姊妹，你看見那個順序了嗎？</p><p>第十一章：<b>你不是扛的那一個，你是被扛的</b>。</p><p>第十五章：<b>所以現在，換你去扛別人</b>。</p><p>（同字也用於太8:17「代替我們的軟弱，<b>擔當</b>我們的疾病」；加6:2「各人的重擔要互相<b>擔當</b>」。）</p><p>★ 亮光二：ὀφείλω ——這是一筆「債」</p><p>「<b>應該</b>」——原文不是「最好要」，是「<b>欠著</b>」。</p><p>而這個字我們在13:8見過：</p><pre>13:8   「凡事都不可【虧欠】（ὀφείλετε）人，惟有彼此相愛要常以為虧欠」\n15:1   「我們堅固的人【應該】（Ὀφείλομεν）擔代……」</pre><p>弟兄姊妹，保羅在說：</p><p>強的人扛弱的人，<b>不是一種美德，是一筆債</b>。</p><p>★ 亮光三：δυνατοί ／ ἀδύνατοι 的對稱</p><pre>δυνατοί  —— 【有】能力的\nἀδύνατοι —— 【沒有】能力的</pre><p>而 ἀδύνατος 這個字，我們在8:3見過：</p><p>8:3「律法既因肉體軟弱，有所<b>不能行的</b>（τὸ ἀδύνατον）……」</p><p>弟兄姊妹，這是一個很謙卑的提醒：</p><p>「不能」這件事，我們自己也曾經是（第七、八章）。</p><p>★ 亮光四：「不求自己的喜悅」</p><p>ἀρέσκω ＝ <b>討某人的喜歡、使某人滿意</b>。</p><p>保羅在別處用同一個字：</p><p>加1:10「我現在是要得人的心呢？還是要得神的心呢？我豈是<b>討人的喜歡</b>嗎？」</p><p>弟兄姊妹，注意這裡有一個張力：</p><p>加1:10說<b>不要討人的喜歡</b>；<br>羅15:2說<b>要叫鄰舍喜悅</b>。</p><p>差別在哪裡？——<b>下一節就說了</b>。</p>","exp":"<p>弟兄姊妹，15:1的第一個字（Ὀφείλομεν）不是「最好要」，是「<b>欠著</b>」。</p><p>而那個字，我們在13:8見過：「凡事都不可<b>虧欠</b>人。」</p><p><b>經文本身明確表達的：</b> 有能力的人<b>欠著一筆債</b>：要扛起沒有能力之人的軟弱，而不是討自己的喜悅。</p><p><b>可以合理推論的：</b> 「擔代」（βαστάζω）正是11:18那個字——</p><p>11:18「不是你<b>托著</b>根，乃是根<b>托著</b>你。」<br>15:1「堅固的人應該<b>擔代</b>不堅固人的軟弱。」</p><p>你曾經是<b>被扛的</b>；所以現在，<b>換你去扛</b>。</p><p>而保羅<b>沒有</b>說「你們堅固的人要變軟弱一點」——</p><p>他說：你<b>是</b>堅固的——<b>所以你去扛</b>。</p><p>謙卑不是放棄力量，是<b>改變力量的方向</b>。</p><p>⚠⚠ 講台誠信提醒（本章最容易失守的一點）：</p><p>「堅固／不堅固」極易被拿來貼標籤（「我是堅固的，所以你要聽我的」）。</p><p>必須同時講明三件事：</p><p>① 這一節的主詞是「我們<b>堅固的人</b>」，而動詞是「<b>應該擔代</b>」——<b>這是責任，不是特權</b>。</p><p>② 「不堅固」（ἀδύνατος）正是8:3「律法所<b>不能行</b>的」（τὸ ἀδύνατον）同一個字根。</p><p>③ 而第七章那個「立志為善由得我，行出來由不得我」的人——<b>是保羅自己</b>。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν.</p>","lit":"<p>「我們各人<b>要叫鄰舍喜悅</b>——<b>為了他的益處</b>，<b>為了建造</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>鄰舍</td><td>πλησίον</td><td>plēsion</td><td>G4139</td><td><b>鄰近的人</b>（<b>13:9「愛人如己」同字</b>）</td></tr><tr><td>建立德行</td><td>οἰκοδομή</td><td>oikodomē</td><td>G3619</td><td><b>造房子</b>（<b>14:19同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：兩個限定詞解開了與加1:10的張力</p><p>保羅說「叫鄰舍喜悅」，但立刻加了<b>兩個限定</b>：</p><pre>εἰς τὸ ἀγαθόν  —— 【為了他的益處】\nπρὸς οἰκοδομήν —— 【為了建立】</pre><p>弟兄姊妹，差別就在這裡：</p><p>加1:10的「討人喜歡」，是<b>為了我自己</b>（怕被討厭、想被接納）。<br>羅15:2的「叫鄰舍喜悅」，是<b>為了他的益處與建立</b>。</p><p>同一個動作，兩種動機。</p><p>★ 亮光二：οἰκοδομή ——14:19那個字</p><pre>14:19  「務要追求和睦的事與彼此【建立】（οἰκοδομῆς）德行的事」\n14:20  「不可因食物【毀壞】（κατάλυε）神的工程」—— 拆房子\n   ↓\n15:2   「使他得益處，【建立德行】（οἰκοδομήν）」</pre><p>神在蓋房子（14:19–20）——而15:2說：<b>你去幫忙蓋</b>。</p>","exp":"<p>弟兄姊妹，15:2解開了一個看似矛盾的地方。</p><p>因為加1:10說：「我豈是<b>討人的喜歡</b>嗎？若仍舊討人的喜歡，我就不是基督的僕人了。」</p><p>而兩節用的是<b>同一個動詞</b>（ἀρέσκω）。</p><p>解開的關鍵，在15:2的<b>兩個限定</b>：</p><pre>εἰς τὸ ἀγαθόν  —— 為了【他的】益處\nπρὸς οἰκοδομήν —— 為了【建立】</pre><p><b>經文本身明確表達的：</b> 要叫鄰舍喜悅，但目的必須是他的益處與建造。</p><p><b>可以合理推論的：</b> 同一個動作，<b>兩種動機</b>——</p><p>加1:10的「討人喜歡」，是<b>為了我自己</b>（怕被討厭、想被接納、想保住地位）。<br>羅15:2的「叫鄰舍喜悅」，是<b>為了他的益處與建立</b>。</p><p>⚠ 一個很實際的檢驗：</p><p>這件事，如果<b>沒有人知道是我做的</b>——我還會做嗎？</p>"},{"a":3,"z":3,"star":true,"grk":"<p>καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν, ἀλλὰ καθὼς γέγραπται· οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ' ἐμέ.</p>","lit":"<p>「因為連基督也<b>不討自己的喜悅</b>；乃如經上所記：『那些辱罵你之人的<b>辱罵</b>，都<b>落在我身上</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>辱罵</td><td>ὀνειδισμοί</td><td>oneidismoi</td><td>G3680</td><td><b>公開的羞辱、責罵</b></td></tr><tr><td>落在</td><td>ἐπέπεσαν</td><td>epepesan</td><td>G1968</td><td>ἐπί + πίπτω：<b>掉落在……身上</b></td></tr></table>","gram":"<p>★ 亮光一：這是全章最短、也最重的一句理由</p><p>保羅講了兩節的命令（15:1–2），然後給理由。</p><p>而那個理由只有八個字：</p><p>「<b>因為基督也不求自己的喜悅</b>。」</p><p>弟兄姊妹，保羅<b>沒有</b>說：「因為這樣教會才會和諧。」<br>他也<b>沒有</b>說：「因為你是成熟的。」</p><p>他說：<b>因為祂沒有</b>。</p><p>★ 亮光二：引詩篇69:9下半</p><p>「辱罵你人的辱罵都落在我身上。」</p><p>注意這一節的<b>方向</b>：</p><pre>那些人辱罵的對象是 ——【神】（「辱罵【你】人的」）\n而那些辱罵最後落在 ——【基督】身上</pre><p>弟兄姊妹，這句話的意思是：</p><p>人本來是在罵<b>神</b>。</p><p>而那些罵——<b>掉在祂身上了</b>。</p><p>★ 亮光三：詩篇69篇在新約的位置</p><table><tr><th>出處</th><th>引用</th></tr><tr><td><b>約2:17</b></td><td>詩69:9<b>上半</b>「我為你的殿心裡焦急」</td></tr><tr><td><b>羅15:3</b></td><td><b>詩69:9下半「辱罵你人的辱罵都落在我身上」</b></td></tr><tr><td>約15:25</td><td>詩69:4「他們無故地恨我」</td></tr><tr><td>太27:34、48</td><td>詩69:21（苦膽與醋）</td></tr></table><p>初代教會顯然把詩篇69篇整篇，當作<b>受苦的彌賽亞</b>的詩來讀。</p>","exp":"<p><b>經文本身明確表達的：</b> 基督不討自己的喜悅，而是承受了本該落在神身上的辱罵。<br><b>合理推論的生命應用：</b> 一個人若不知道「祂為我承受了什麼」，就很難為弟兄放下一件小事。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ὅσα γὰρ προεγράφη, εἰς τὴν ἡμετέραν διδασκαλίαν ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.</p>","lit":"<p>「因為<b>從前所寫的一切</b>，都是<b>為教訓我們</b>而寫的；好叫我們<b>藉著聖經所生的忍耐與安慰</b>，<b>持續握有盼望</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>從前所寫的</td><td>προεγράφη</td><td>proegraphē</td><td>G4270</td><td><b>預先寫下的</b></td></tr><tr><td>教訓</td><td>διδασκαλία</td><td>didaskalia</td><td>G1319</td><td><b>教導</b></td></tr><tr><td>忍耐</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td><b>在重壓下站住</b>（<b>5:3–4同字</b>）</td></tr><tr><td>安慰</td><td>παράκλησις</td><td>paraklēsis</td><td>G3874</td><td>παρά + καλέω：<b>被叫到旁邊來</b>（見下）</td></tr></table>","gram":"<p>★ 亮光一：保羅為什麼在這裡插一句「聖經論」？</p><p>弟兄姊妹，15:4看起來像是離題。</p><p>但它其實是緊接著15:3的：</p><pre>15:3  保羅引了一段【詩篇】來證明基督不求自己的喜悅\n   ↓\n15:4  「從前所寫的聖經，都是為【教訓我們】寫的」</pre><p>保羅在說：</p><p>我剛才引的那節舊約——</p><p>那不是古人的事，那是<b>寫給我們的</b>。</p><p>★ 亮光二：παράκλησις ——「被叫到旁邊來」</p><p>這個字由 παρά（旁邊）+ καλέω（叫）組成。</p><p>字面是：<b>把某人叫到身邊來（陪伴、鼓勵、扶持）</b>。</p><p>（而聖靈的稱呼 παράκλητος「保惠師」——約14:16——正是同一個字根。）</p><p>弟兄姊妹，「安慰」不是說幾句好聽的話。</p><p>是<b>走到你旁邊來</b>。</p><p>★ 亮光三：ὑπομονή ——第五章那個字</p><pre>5:3–4  「患難生【忍耐】（ὑπομονή），忍耐生老練，老練生盼望（ἐλπίς）」\n   ↓\n15:4   「因聖經所生的【忍耐】和安慰，可以得著【盼望】（ἐλπίδα）」</pre><p>弟兄姊妹，這兩節的終點是同一個：<b>盼望</b>。</p><p>第五章：<b>患難</b>生出盼望。<br>第十五章：<b>聖經</b>生出盼望。</p><p>★ 亮光四：一個很實際的觀察</p><p>弟兄姊妹，15:4放在14–15章的脈絡裡，有一層很實際的意思：</p><p>一群人在為「食物與日子」爭執——</p><p>而保羅說：<b>去讀聖經</b>。</p><p>不是為了找到「誰對」的證據，<br>是為了得著<b>忍耐</b>與<b>安慰</b>，好叫你們<b>有盼望</b>。</p>","exp":"<p>弟兄姊妹，15:4看起來像離題——其實它緊接著15:3。</p><p>保羅剛引了一段詩篇（詩69:9）來證明基督不求自己的喜悅，然後說：</p><p>那不是古人的事。<b>那是寫給我們的</b>。</p><p><b>經文本身明確表達的：</b> 舊約聖經是為教訓我們而寫的；它生出忍耐與安慰，使我們得著盼望。</p><p><b>可以合理推論的：</b> 這一節給了「聖經是我的準則」一個<b>完整的流程</b>：</p><pre>聖經 → 忍耐 ＋ 安慰 → 盼望</pre><p>讀經的終點<b>不是資料</b>，是<b>盼望</b>。</p><p>而「安慰」（παράκλησις）的字面是 παρά（旁邊）＋ καλέω（叫）——</p><p>「<b>被叫到旁邊來</b>」。</p><p>（而聖靈的稱呼 παράκλητος「保惠師」，約14:16，正是同一個字根。）</p><p>⚠ 而放在14–15章的脈絡裡，這一節有一層很實際的意思：</p><p>一群人正在為「食物與日子」爭執——</p><p>而保羅說：<b>去讀聖經</b>。</p><p>不是為了找到「誰對」的證據，是為了得著忍耐與安慰，好叫你們有盼望。</p>"},{"a":5,"z":6,"star":true,"grk":"<p>5 ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ Χριστὸν Ἰησοῦν,<br>6 ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.</p>","lit":"<p>5「願那<b>忍耐與安慰的神</b>，<b>賜給</b>你們彼此<b>想同一件事</b>，照著基督耶穌；」<br>6「好叫你們<b>同一個心思</b>、<b>用一張嘴</b>，榮耀神——我們主耶穌基督的父。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>賜</td><td>δῴη</td><td>dōē</td><td>G1325</td><td>δίδωμι</td><td><b>祈願語氣：願祂賜下</b></td><td><b>見下——極重要</b></td></tr><tr><td>同心</td><td>τὸ αὐτὸ φρονεῖν</td><td>—</td><td>G5426</td><td>φρονέω</td><td><b>想同一件事</b></td><td><b>12:16同詞組</b></td></tr><tr><td>一心</td><td>ὁμοθυμαδόν</td><td>homothymadon</td><td>G3661</td><td>ὁμός（同）+ θυμός（<b>情緒、衝動</b>）</td><td><b>同一股心志</b></td><td>—</td></tr><tr><td>一口</td><td>ἐν ἑνὶ στόματι</td><td>—</td><td>G4750</td><td>—</td><td><b>用一張嘴</b></td><td>—</td></tr></table>","gram":"<p>★★ 亮光一：δῴη 是<b>祈願語氣</b>——合一是<b>求來的</b></p><p>弟兄姊妹，這是本段最重要的文法觀察。</p><p>15:5的動詞 δῴη 是<b>祈願語氣（optative）</b>——</p><p>意思是：「<b>願祂賜給</b>」。</p><p>保羅<b>沒有</b>說：「你們要努力同心。」</p><p>他說：</p><p>「<b>願賜忍耐安慰的神，叫你們彼此同心</b>。」</p><p>弟兄姊妹，這一點極其重要：</p><p>合一<b>不是一個技巧</b>，是一個<b>恩賜</b>。</p><p>保羅講了一整章的「不可論斷、不可輕看」（14章），<br>然後在這裡——<b>他禱告</b>。</p><p>★ 亮光二：τὸ αὐτὸ φρονεῖν ——「想同一件事」</p><p>這個詞組保羅在12:16已經用過：</p><p>12:16「要<b>彼此同心</b>（τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες）。」</p><p>而 φρονέω 這個字，我們在羅馬書追蹤過：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td>8:5</td><td><b>體貼</b>肉體／<b>體貼</b>聖靈</td></tr><tr><td>12:3</td><td>不要<b>看</b>自己過於所當<b>看</b>的</td></tr><tr><td>12:16</td><td>不要<b>志氣高大</b></td></tr><tr><td><b>15:5</b></td><td><b>彼此同心</b></td></tr></table><p>弟兄姊妹，φρονέω 不是「意見一致」，是「<b>心之所向相同</b>」。</p><p>★ 亮光三：一個重要的限定——「效法基督耶穌」</p><p>15:5的原文是 κατὰ Χριστὸν Ἰησοῦν ——「<b>照著基督耶穌</b>」。</p><p>弟兄姊妹，這個限定很重要：</p><p>保羅求的<b>不是「什麼都一樣」的合一</b>，<br>是「<b>照著基督</b>」的合一。</p><p>★ 亮光四：ὁμοθυμαδόν ——「同一股心志」</p><p>這個字由 ὁμός（同）+ θυμός（<b>情緒、衝動、心志</b>）組成。</p><p>它在使徒行傳出現了<b>十次以上</b>，幾乎是初代教會的招牌詞：</p><p>徒1:14「這些人<b>同心合意</b>地恆切禱告」<br>徒2:46「他們天天<b>同心合意</b>恆切地在殿裡」<br>徒4:24「他們聽見了，就<b>同心合意</b>地高聲向神說」</p><p>★ 亮光五：「一張嘴」的畫面</p><p>ἐν ἑνὶ στόματι ——字面是「<b>在一張嘴裡</b>」。</p><p>弟兄姊妹，這是一個<b>敬拜</b>的畫面：</p><p>一群人——猶太人與外邦人，強的與弱的——</p><p>發出<b>同一個聲音</b>。</p>","exp":"<p>弟兄姊妹，15:5–6是14章一整章教導的<b>目的</b>。</p><p>保羅為什麼要他們接納？</p><p>不是為了「教會比較和平」。</p><p>是為了：</p><p>「一心一口<b>榮耀神</b>。」</p><p>合一的目的不是合一本身，是<b>敬拜</b>。</p><p>【第二段｜15:7–13　接納】</p>"},{"a":7,"z":7,"star":true,"grk":"<p>Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ὑμᾶς εἰς δόξαν τοῦ θεοῦ.</p>","lit":"<p>「所以，你們要<b>彼此接到自己這裡來</b>，<b>正如基督也把你們接到祂那裡</b>——為使神得榮耀。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>接納</td><td>προσλαμβάνεσθε</td><td>proslambanesthe</td><td>G4355</td><td><b>接到自己這裡來</b>（<b>14:1、14:3同字</b>）</td></tr><tr><td>如同</td><td>καθώς</td><td>kathōs</td><td>G2531</td><td><b>正如、照著……的樣子</b></td></tr><tr><td>使榮耀歸與神</td><td>εἰς δόξαν τοῦ θεοῦ</td><td>—</td><td>G1391</td><td><b>為使神得榮耀</b></td></tr></table>","gram":"<p>★ 亮光一：προσλαμβάνω 把整段串起來</p><pre>14:1  你們要【接納】（προσλαμβάνεσθε）信心軟弱的\n14:3  因為神已經【收納】（προσελάβετο）他了\n   ↓\n15:7  你們要彼此【接納】（προσλαμβάνεσθε），\n      如同基督【接納】（προσελάβετο）你們一樣</pre><p>弟兄姊妹，同一個字，四次。</p><p>而15:7是那個高潮：<b>它同時是命令，也是根據</b>。</p><p>★★ 亮光二：那個「如同」（καθώς）</p><p>弟兄姊妹，這是全段的心臟。</p><p>保羅<b>沒有</b>說：「你們要盡量接納。」</p><p>他說：</p><p>「<b>如同基督接納你們一樣</b>。」</p><p>而這個「如同」，逼出一個問題：</p><p>基督接納你的那一天——</p><p>你是全對的嗎？</p><p>你的神學都正確嗎？<br>你的良心都清潔嗎？<br>你在每一件事上的看法，都成熟嗎？</p><p>弟兄姊妹，如果不是——</p><p>那你就知道「如同」的標準有多寬了。</p><p>★ 亮光三：目的是「使榮耀歸與神」</p><p>εἰς δόξαν τοῦ θεοῦ ——</p><p>弟兄姊妹，注意這個因果：</p><p>彼此接納 → 神得榮耀。</p><p>反過來說也成立：</p><p>當教會為了可爭議的事分裂——<br>失去的不只是和睦，是<b>神的榮耀</b>。</p>","exp":"<p>弟兄姊妹，15:7是14:1–15:13這一整段的<b>高潮</b>。</p><p>而 προσλαμβάνω（接納）這個字，在這一段出現了四次：</p><pre>14:1  你們要【接納】信心軟弱的\n14:3  因為神已經【收納】他了\n   ↓\n15:7  你們要彼此【接納】，如同基督【接納】你們一樣</pre><p><b>經文本身明確表達的：</b> 要彼此接納，其標準與根據是「基督接納了你們」；而其目的是使神得榮耀。</p><p><b>可以合理推論的：</b> 全句最重的不是那個動詞，是中間那兩個字——</p><p>「<b>如同</b>」（καθώς）。</p><p>而這個「如同」逼出一個問題：</p><p>基督接納你的那一天——</p><p>你是全對的嗎？你的神學都正確嗎？你的良心都清潔嗎？</p><p>如果不是——<b>那你就知道「如同」的標準有多寬了</b>。</p><p><b>⚠ 講台誠信提醒：</b> 15:7的範圍是<b>可爭議的事</b>，不是所有的事。<br>保羅自己在16:17就給了界線：「那些<b>離間</b>你們、<b>背乎所學之道</b>的人……要留意躲避他們。」<br>（三種處理方式的完整說明，見第二十部分。）</p>"},{"a":8,"z":9,"star":true,"grk":"<p>8 λέγω γὰρ Χριστὸν διάκονον γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,</p>","lit":"<p>8「因為我說：基督<b>為著神的真實</b>，作了<b>受割禮之人的僕役</b>，為要<b>證實</b>（使之生效）<b>神給列祖的那些應許</b>；」<br>9上「並且<b>叫外邦人因祂的憐憫榮耀神</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>執事</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td><b>僕人、執事</b>（13:4、16:1同字）</td></tr><tr><td>證實</td><td>βεβαιῶσαι</td><td>bebaiōsai</td><td>G950</td><td><b>使之穩固、確立</b>（<b>4:16 βέβαιος 同字根</b>）</td></tr><tr><td>憐憫</td><td>ἔλεος</td><td>eleos</td><td>G1656</td><td><b>憐憫</b>（<b>11:30–32 ἐλεέω 同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：兩群人，兩個不同的理由</p><p>弟兄姊妹，注意保羅為兩群人給的理由<b>不一樣</b>：</p><table><tr><th>對象</th><th>理由</th></tr><tr><td><b>猶太人</b></td><td>「為神的<b>真理</b>」——要<b>證實所應許列祖的話</b></td></tr><tr><td><b>外邦人</b></td><td>「因他的<b>憐憫</b>」</td></tr></table><p>弟兄姊妹，這個區分極其精細：</p><p>猶太人蒙恩，是因為神<b>守約</b>（祂應許過列祖）。<br>外邦人蒙恩，是因為神<b>憐憫</b>（祂沒有應許過我們什麼）。</p><p>而這兩個，剛好對應羅馬教會兩邊的驕傲：</p><pre>猶太人可能想：我們是有應許的\n   → 保羅說：對，而基督來正是為了【證實】那些應許\n外邦人可能想：神已經把他們挪開了\n   → 保羅說：你們在這裡，純粹是【憐憫】</pre><p>★ 亮光二：βεβαιόω ——第四章那個字根</p><pre>4:16  「叫應許【定然】（βέβαιος）歸給一切後裔」\n15:8  「要【證實】（βεβαιῶσαι）所應許列祖的話」</pre><p>而 βέβαιος 是一個<b>法律用語</b>：<b>具有法律效力的擔保</b>。</p><p>基督來，是為了讓神給列祖的應許<b>在法律上生效</b>。</p><p>★ 亮光三：「受割禮人的執事」</p><p>弟兄姊妹，這句話很重要：</p><p>保羅在對外邦信徒說話（11:13、15:15–16），<br>而他提醒他們：<b>基督是作了猶太人的執事</b>。</p><p>（這與11:18「不是你托著根，乃是根托著你」完全一致。）</p>","exp":"<p>弟兄姊妹，8–9節做了一件很精細的事：保羅為兩群人，給了<b>兩個不同的理由</b>。</p><table><tr><th>對象</th><th>理由</th></tr><tr><td><b>猶太人</b></td><td>為神的<b>真理</b>——要<b>證實所應許列祖的話</b>（神<b>守約</b>）</td></tr><tr><td><b>外邦人</b></td><td>因祂的<b>憐憫</b>（神<b>沒有應許過我們什麼</b>）</td></tr></table><p><b>經文本身明確表達的：</b> 基督作了受割禮之人的執事，為要證實給列祖的應許；同時使外邦人因神的憐憫榮耀神。</p><p><b>可以合理推論的：</b> 這不是在分高低，是在對付<b>兩邊各自的驕傲</b>——</p><p>對猶太信徒：對，應許是給你們列祖的——<b>而基督來，正是為了證實它</b>。<br>對外邦信徒：你們在這裡，<b>純粹是憐憫</b>。</p><p>而「證實」（βεβαιόω）是一個<b>法律用語</b>：<b>使之具有效力的擔保</b>。</p><p>它的形容詞形 βέβαιος，正是4:16「叫應許<b>定然</b>歸給一切後裔」那個字。</p><p>基督來，是為了讓神給列祖的應許——<b>在法律上生效</b>。</p>"},{"a":9,"z":12,"star":true,"grk":"<p>9下 …διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσιν καὶ τῷ ὀνόματί σου ψαλῶ.<br>10 …εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.<br>11 …αἰνεῖτε, πάντα τὰ ἔθνη, τὸν κύριον καὶ ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.<br>12 …ἔσται ἡ ῥίζα τοῦ Ἰεσσαὶ καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν, ἐπ' αὐτῷ ἔθνη ἐλπιοῦσιν.</p>","lit":"<p>9下「正如經上所記：『因此我要<b>在外邦中稱謝你</b>，<b>歌頌你的名</b>。』」<br>10「又說：『<b>外邦啊，你們要與祂的百姓一同歡樂</b>。』」<br>11「又說：『<b>萬國啊，你們都當讚美主</b>；<b>萬民哪，都當稱頌祂</b>。』」<br>12「以賽亞又說：『將有<b>耶西的根</b>，就是那<b>興起來要治理外邦的</b>；<b>外邦人要仰望祂</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>稱讚</td><td>ἐξομολογήσομαι</td><td>exomologēsomai</td><td>G1843</td><td><b>公開承認、稱謝</b></td></tr><tr><td>歡樂</td><td>εὐφράνθητε</td><td>euphranthēte</td><td>G2165</td><td>歡欣（命令語氣）</td></tr><tr><td>耶西的根</td><td>ἡ ῥίζα τοῦ Ἰεσσαί</td><td>—</td><td>G4491</td><td><b>大衛父親的名</b>——即大衛的後裔</td></tr><tr><td>仰望</td><td>ἐλπιοῦσιν</td><td>elpiousin</td><td>G1679</td><td><b>把盼望放在祂身上</b></td></tr></table>","gram":"<p>★ 亮光一：四段引文的分佈</p><table><tr><th>出處</th><th>引自</th><th>舊約分類</th><th>關鍵詞</th></tr><tr><td><b>15:9</b></td><td><b>詩18:49</b></td><td>詩篇／歷史</td><td>「在<b>外邦中</b>稱讚你」</td></tr><tr><td><b>15:10</b></td><td><b>申32:43</b></td><td><b>律法書</b></td><td>「外邦人<b>與主的百姓一同</b>歡樂」</td></tr><tr><td><b>15:11</b></td><td><b>詩117:1</b></td><td>詩篇</td><td>「<b>外邦啊</b>，你們當讚美主」</td></tr><tr><td><b>15:12</b></td><td><b>賽11:10</b></td><td><b>先知書</b></td><td>「<b>外邦人</b>要仰望他」</td></tr></table><p>弟兄姊妹，保羅從<b>律法書、先知書、詩篇</b>——<br>猶太人所說的整本聖經的三大部分——各取證據。</p><p>他要證明的是：<b>外邦人蒙恩，不是新聞，是舊約從頭到尾的計畫</b>。</p><p>★ 亮光二：四段引文的遞進</p><pre>15:9  「在外邦【中】」  —— 我在他們中間稱讚神\n15:10 「【與】主的百姓【一同】」 —— 兩群人在一起\n15:11 「外邦啊，【你們】當讚美主」 —— 外邦人自己開口\n15:12 「外邦人要【仰望他】」 —— 他們的盼望在祂身上</pre><p>弟兄姊妹，這是一個<b>逐步靠近</b>的過程：</p><p>從「在他們中間」→「與他們一同」→「他們自己讚美」→「他們仰望祂」。</p><p>★ 亮光三：15:12「耶西的根」</p><p>引自賽11:10。</p><p>「耶西」是大衛的父親。</p><p>所以「耶西的根」＝ <b>大衛的後裔</b>（比較啟22:16「我是大衛的根，又是他的後裔」）。</p><p>而這正好呼應羅馬書的開頭：</p><pre>1:3   「論到他兒子——我主耶穌基督。按肉體說，是從【大衛後裔】生的」\n15:12 「將來有【耶西的根】……外邦人要仰望他」</pre>","exp":"<p>弟兄姊妹，保羅為了證明「外邦人蒙恩不是新聞」，一口氣引了<b>四段舊約</b>。</p><p>而這四段的<b>分佈</b>極其講究：</p><table><tr><th>出處</th><th>引自</th><th>舊約的分類</th></tr><tr><td>15:9</td><td><b>詩18:49</b></td><td>詩篇／歷史書</td></tr><tr><td>15:10</td><td><b>申32:43</b></td><td><b>律法書</b></td></tr><tr><td>15:11</td><td><b>詩117:1</b></td><td>詩篇</td></tr><tr><td>15:12</td><td><b>賽11:10</b></td><td><b>先知書</b></td></tr></table><p><b>經文本身明確表達的：</b> 外邦人與神的百姓一同讚美神，是舊約律法、先知、詩篇一致的見證。</p><p><b>可以合理推論的：</b> 保羅是從<b>猶太人所說的整本聖經的三大部分</b>，各取證據。<br>（比較路24:44：「摩西的律法、先知的書，和詩篇上所記的」）</p><p>他要證明的是：<b>外邦人蒙恩，不是新聞，是舊約從頭到尾的計畫</b>。</p><p>而這四段引文還有一個很美的<b>遞進</b>：</p><pre>15:9  「在外邦【中】」        —— 我在他們中間稱讚神\n15:10 「【與】主的百姓【一同】」 —— 兩群人在一起了\n15:11 「外邦啊，【你們】當讚美主」—— 他們自己開口了\n15:12 「外邦人要【仰望他】」    —— 他們的盼望在祂身上</pre>"},{"a":13,"z":13,"star":true,"grk":"<p>ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.</p>","lit":"<p>「願那<b>盼望的神</b>，在你們相信的時候，<b>用一切的喜樂與平安充滿</b>你們，使你們<b>在盼望上滿溢出來</b>，藉著<b>聖靈的能力</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>充滿</td><td>πληρώσαι</td><td>plērōsai</td><td>G4137</td><td><b>祈願語氣：願祂充滿</b></td></tr><tr><td>大有盼望</td><td>περισσεύειν</td><td>perisseuein</td><td>G4052</td><td><b>滿溢出來</b>（<b>5:15同字根</b>）</td></tr><tr><td>能力</td><td>δύναμις</td><td>dynamis</td><td>G1411</td><td><b>能力</b>（<b>1:16「神的大能」同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：又是祈願語氣</p><p>與15:5一樣，πληρώσαι 是<b>祈願語氣</b>——「<b>願祂充滿</b>」。</p><p>喜樂、平安、盼望——<b>都不是我努力擠出來的</b>。</p><p>★ 亮光二：14:17的完整版</p><pre>14:17  「神的國……只在乎【公義】、【和平】，並【聖靈中的喜樂】」\n   ↓\n15:13  「將諸般的【喜樂】、【平安】充滿你們的心，\n        使你們藉著【聖靈的能力】大有【盼望】」</pre><p>弟兄姊妹，14:17列出了神的國在乎什麼；<br>15:13就求神把那些<b>充滿他們</b>。</p><p>★ 亮光三：περισσεύω ——「滿溢出來」</p><p>這個字我們在5:15見過（「更加倍地臨到眾人」）。</p><p>畫面是：<b>倒到滿出來</b>。</p><p>保羅求的不是「有一點盼望」，是<b>盼望滿到溢出來</b>。</p><p>★ 亮光四：三個「神」的第二個</p><pre>15:5   賜【忍耐安慰】的神\n15:13  使人有【盼望】的神   ← 本節\n15:33  賜【平安】的神</pre>","exp":"<p>弟兄姊妹，15:13是整個實踐部分（12–15章）的<b>收尾祝福</b>。</p><p>而它的內容很值得注意：</p><p>保羅<b>沒有</b>求「願你們都意見一致」。</p><p>他求的是：<b>喜樂、平安、盼望</b>。</p><p>因為一群有喜樂、有平安、有盼望的人——</p><p>比較不會為了食物吵架。</p><p>【第三段｜15:14–21　獻上】</p>"},{"a":14,"z":16,"star":true,"grk":"<p>16 εἰς τὸ εἶναί με λειτουργὸν Χριστοῦ Ἰησοῦ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.</p>","lit":"<p>14「弟兄們，<b>我自己也深信</b>你們：你們<b>滿有良善</b>，<b>充滿了各樣的知識</b>，<b>也能彼此勸戒</b>。」<br>15「但我<b>稍微放膽</b>寫信給你們，是要<b>再一次提醒你們</b>，這是因著神所賜給我的恩——」<br>16「使我作<b>基督耶穌向外邦人的供職者</b>，<b>執行神福音的祭司職務</b>，好使<b>外邦人這供物成為蒙悅納的</b>，<b>在聖靈裡被分別為聖</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>勸戒</td><td>νουθετεῖν</td><td>nouthetein</td><td>G3560</td><td>νοῦς + τίθημι：<b>把東西放進心思裡</b></td></tr><tr><td>僕役</td><td>λειτουργός</td><td>leitourgos</td><td>G3011</td><td><b>祭司性的供職者</b>（13:6同字）</td></tr><tr><td>作祭司</td><td>ἱερουργοῦντα</td><td>hierourgounta</td><td>G2418</td><td><b>執行祭司的職務</b>（<b>新約僅此一次</b>）</td></tr><tr><td>所獻上的</td><td>προσφορά</td><td>prosphora</td><td>G4376</td><td><b>供物、祭物</b></td></tr><tr><td>成為聖潔</td><td>ἡγιασμένη</td><td>hēgiasmenē</td><td>G37</td><td><b>被分別為聖</b>（完成被動分詞）</td></tr></table>","gram":"<p>★ 亮光一：15:14的謙和</p><p>保羅寫了十五章最嚴密的論證。</p><p>然後他說：</p><p>「我自己也<b>深信</b>你們是滿有良善……<b>也能彼此勸戒</b>。」</p><p>他沒有說「你們什麼都不懂」。<br>他說：<b>你們本來就懂，我只是提醒你們的記性</b>（15:15）。</p><p>★★ 亮光二：15:16三個聖殿用語疊在一節裡</p><pre>λειτουργός  —— 祭司性的供職者\nἱερουργέω   —— 執行祭司的職務（新約僅此一次）\nπροσφορά    —— 供物</pre><p>弟兄姊妹，保羅把「傳福音」看作一場<b>獻祭</b>。</p><p>他自己是<b>祭司</b>；而祭壇上的供物是——<b>那些歸主的人</b>。</p><p>★ 亮光三：與12:1的呼應</p><pre>12:1   「將【身體】獻上（παραστῆσαι），當作【活祭】」—— 信徒獻上自己\n15:16  「叫【所獻上的】（προσφορά）外邦人……可蒙悅納」—— 保羅獻上他們</pre><p>★ 亮光四：供物憑什麼被收下？</p><p>「因著<b>聖靈</b>成為聖潔」——<b>完成被動分詞</b>。</p><p>不是因為它本身好，是因為<b>聖靈已經把它分別為聖了</b>。</p>","exp":"<p>弟兄姊妹，14節顯出保羅的謙和。</p><p>他寫了十五章最嚴密的神學論證，然後說：</p><p>「我自己也<b>深信</b>你們是滿有良善……<b>也能彼此勸戒</b>。」</p><p>他沒有說「你們什麼都不懂，所以我來教你們」——他說：<b>你們本來就懂，我只是提醒你們的記性</b>。</p><p><b>經文本身明確表達的：</b> 保羅承認羅馬信徒本有良善與知識；他寫信是出於神所賜的恩，使他作外邦人的祭司性供職者。</p><p><b>可以合理推論的：</b> 15:16在<b>一節之內</b>用了三個<b>聖殿用語</b>——</p><p>λειτουργός（祭司性的供職者）＋ ἱερουργέω（執行祭司職務，<b>新約僅此一次</b>）＋ προσφορά（供物）。</p><p>保羅把「傳福音」看作一場<b>獻祭</b>：他自己是<b>祭司</b>，而祭壇上的供物，是<b>那些歸主的人</b>。</p><p>而這與12:1完全呼應：</p><pre>12:1   將【身體】獻上（παραστῆσαι），當作【活祭】—— 信徒獻上自己\n15:16  叫【所獻上的】（προσφορά）外邦人……可蒙悅納 —— 保羅獻上他們</pre><p>⚠ 而最後那半句最重要：「因著<b>聖靈</b>成為聖潔」是<b>完成被動分詞</b>——</p><p>那個供物之所以被收下，<b>不是因為它本身好</b>，</p><p>是因為<b>有一位把它分別為聖了</b>。</p>"},{"a":17,"z":21,"star":false,"grk":"<p>18 οὐ γὰρ τολμήσω τι λαλεῖν ὧν οὐ κατειργάσατο Χριστὸς δι' ἐμοῦ εἰς ὑπακοὴν ἐθνῶν…</p>","lit":"<p>18「因為我<b>不敢</b>說任何一件<b>不是基督藉著我做成</b>的事——祂藉著我，用言語和作為，使外邦人<b>順服</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>可誇的</td><td>καύχησις</td><td>kauchēsis</td><td>G2746</td><td><b>誇口</b>（<b>3:27「沒有可誇的了」同字根</b>）</td></tr><tr><td>不敢</td><td>οὐ τολμήσω</td><td>ou tolmēsō</td><td>G5111</td><td><b>我不敢</b>（<b>15:15「稍微放膽」同字根</b>）</td></tr><tr><td>使…順服</td><td>εἰς ὑπακοὴν ἐθνῶν</td><td>—</td><td>G5218</td><td><b>外邦人的順服</b>（<b>1:5、16:26同詞組</b>）</td></tr></table>","gram":"<p>★ 亮光一：15:17–18的一組張力——「有可誇的」與「我甚麼都不敢提」</p><p>弟兄姊妹，這兩節連著讀很有意思。</p><p>15:17說：「我<b>有可誇的</b>。」</p><p>而15:18立刻補上：「<b>除了基督藉我做的那些事</b>，我甚麼都不敢提。」</p><p>保羅<b>沒有</b>假裝自己什麼都沒做。</p><p>他只是把「誰做的」講清楚了。</p><p>而 καύχησις（可誇的）正是3:27那個字：</p><pre>3:27   「哪裡能誇口呢？【沒有可誇的了】」—— 在稱義上，沒有\n15:17  「我在基督耶穌裡【有可誇的】」   —— 在事奉上，有；但只誇祂做的</pre><p>這正是「讓耶穌得到一切榮耀」最精準的分寸：</p><p>不是否認果效，是<b>把果效的作者說對</b>。</p><p>★ 亮光二：τολμάω ——「我不敢」</p><p>15:15保羅說他「稍微<b>放膽</b>（τολμηρότερον）寫信」；而15:18他說「我甚麼都<b>不敢</b>（οὐ τολμήσω）提」。</p><p>同一個字根，兩個方向。</p><p>弟兄姊妹，保羅的膽量與他的不敢，落在不同的地方：</p><p>講神的話——他<b>放膽</b>。<br>講自己的功勞——他<b>不敢</b>。</p><p>★ 亮光三：εἰς ὑπακοὴν ἐθνῶν ——全書的框，在這裡再出現一次</p><pre>1:5    在【萬國】之中叫人為他的名【信服真道】\n15:18  使【外邦人】【順服】\n16:26  指示【萬國】的民，使他們【信服真道】</pre><p>保羅的事奉目標，從第一章到第十六章，沒有變過。</p><p>★ 亮光四：以利哩古在哪裡？（15:19）</p><p>「從耶路撒冷，直轉到<b>以利哩古</b>」——</p><table><tr><th>地點</th><th>位置</th></tr><tr><td><b>耶路撒冷</b></td><td>保羅宣教版圖的<b>東端</b></td></tr><tr><td><b>以利哩古</b>（Illyricum）</td><td>亞得里亞海東岸，約當今日巴爾幹半島西部——當時保羅所及的<b>西北端</b></td></tr></table><p>而15:24、28說他要去<b>西班牙</b>——那幾乎是當時所知世界的<b>西端</b>。</p><p>弟兄姊妹，保羅的地圖是：<b>從耶路撒冷，到地的兩端</b>。</p><p>（使徒行傳沒有記載保羅在以利哩古的宣教；一般理解為他曾到達其邊界一帶。<br>講台上宜說「他的腳蹤已經走到那一帶」，不必給精確的行程。）</p><p>★ 亮光五：φιλοτιμέομαι ——「以此為榮」</p><p>新約僅三次：羅15:20；林後5:9；帖前4:11。</p><p>不是「我打算」，是「<b>我把這件事當作我的榮耀來追求</b>」。</p><p>★ 亮光六：ἀλλότριος ——第十四章那個字</p><pre>14:4   「你是誰，竟論斷【別人的】僕人呢？」\n15:20  「免得建造在【別人的】根基上」</pre><p>保羅對「別人的」很有分寸：<b>別人的僕人不管，別人的根基不建</b>。</p><p>★ 亮光七：15:21引賽52:15</p><p>而賽52:15正是<b>受苦僕人之歌的開頭</b>（賽52:13–53:12）。</p><p>保羅把他向未得之民傳福音的異象，建立在以賽亞書53章上。</p><p>（關於15:20的誤用，見第二十部分。）</p>","exp":"<p>弟兄姊妹，17與18節連著讀，是一組很重要的張力。</p><p>15:17說：「我<b>有可誇的</b>。」</p><p>15:18立刻補上：「<b>除了基督藉我做的那些事</b>，我甚麼都不敢提。」</p><p><b>經文本身明確表達的：</b> 保羅在事奉上有可誇的，但他只提基督藉他所做的；他的志向是向未曾聽過的人傳福音。</p><p><b>可以合理推論的：</b> 保羅<b>沒有</b>假裝自己什麼都沒做——</p><p>他只是把「<b>誰做的</b>」講清楚了。</p><p>而 καύχησις（可誇的）正是3:27那個字：「哪裡能誇口呢？<b>沒有可誇的了</b>。」</p><p>在<b>稱義</b>上，沒有可誇的（3:27）。<br>在<b>事奉</b>上，有——但只誇<b>祂做的</b>（15:17–18）。</p><p>這正是「讓耶穌得到一切榮耀」最精準的分寸：</p><p>不是否認果效，是<b>把果效的作者說對</b>。</p><p>而20節的「立了志向」（φιλοτιμέομαι ＝ φίλος 愛 ＋ τιμή 尊榮）——</p><p>不是「我打算」，是「<b>我把這件事當作我的榮耀來追求</b>」。</p><p><b>⚠ 講台誠信提醒：</b> 15:20<b>不可</b>用來論斷別人的事奉安排（「不可以在已有教會的地方植堂」）。<br>保羅講的是<b>他自己的呼召</b>：他自己正計畫去羅馬（那裡已有教會）；他把提摩太留在以弗所；亞波羅在他之後澆灌哥林多。</p><p>【第四段｜15:22–32　搏鬥】</p>"},{"a":22,"z":29,"star":false,"grk":"<p>25 νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.<br>28 τοῦτο οὖν ἐπιτελέσας καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον…</p>","lit":"<p>25「但現在，我正往耶路撒冷去，<b>服事</b>眾聖徒。」<br>28「所以，等我辦完這事，並且把這果子<b>蓋印封好</b>交給他們，我就要經過你們那裡，往西班牙去。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>攔阻</td><td>ἐνεκοπτόμην</td><td>enekoptomēn</td><td>G1465</td><td><b>被切斷去路</b>（軍事用語：破壞道路阻敵）</td></tr><tr><td>送行</td><td>προπεμφθῆναι</td><td>propemphthēnai</td><td>G4311</td><td><b>差派、供應路費送上路</b></td></tr><tr><td>供給</td><td>διακονῶν</td><td>diakonōn</td><td>G1247</td><td><b>服事</b>（<b>διάκονος 的動詞形</b>）</td></tr><tr><td>捐項</td><td>κοινωνία</td><td>koinōnia</td><td>G2842</td><td><b>團契、分享、有分</b></td></tr><tr><td>所欠的債</td><td>ὀφειλέται</td><td>opheiletai</td><td>G3781</td><td><b>欠債的人</b>（<b>15:1、13:8同字根</b>）</td></tr><tr><td>交付明白</td><td>σφραγισάμενος</td><td>sphragisamenos</td><td>G4972</td><td><b>蓋印封好</b>（<b>4:11「印證」同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：ἐγκόπτω（15:22「攔阻」）——被切斷去路</p><p>這個字是<b>軍事用語</b>：破壞道路、切斷通路，使敵軍無法前進。</p><p>保羅在別處也用它：</p><p>帖前2:18「只是<b>撒但阻擋</b>了我們。」<br>加5:7「你們向來跑得好，有誰<b>攔阻</b>你們？」</p><p>弟兄姊妹，注意15:22用的是<b>未完成式被動</b>——「我<b>一再地被攔阻</b>」。</p><p>這不是一次的耽延，是<b>好幾年</b>。</p><p>而他的回應是什麼？</p><p>15:23「但如今……」——他<b>繼續計畫</b>。</p><p>★ 亮光二：15:23–24 保羅的地圖</p><pre>【現在】哥林多\n   ↓\n耶路撒冷（15:25）—— 送捐項，而他知道那裡有危險（15:31）\n   ↓\n羅馬（15:24、28）—— 「先與你們彼此交往，心裡稍微滿足」\n   ↓\n西班牙（15:24、28）—— 當時所知世界的西端</pre><p>而15:24有一個很客氣、卻很具體的請求：</p><p>「然後<b>蒙你們送行</b>。」</p><p>（προπέμπω 是差傳的技術用語，見亮光四。）</p><p>弟兄姊妹，保羅去羅馬<b>不是終點站</b>，是<b>中途站</b>。</p><p>他真正要去的是——<b>還沒有人去過的地方</b>（15:20–21）。</p><p>★ 亮光三：διακονέω（15:25「供給」）——與15:16同一個家族</p><p>「我往耶路撒冷去<b>供給</b>聖徒」——διακονῶν。</p><p>而15:16保羅稱自己是「基督耶穌的<b>僕役</b>」（λειτουργός），15:27又用 λειτουργῆσαι（供給）。</p><p>弟兄姊妹，保羅用<b>同一組事奉用語</b>，來說兩件事：</p><p>傳福音是事奉（15:16）。<br>送一筆錢，也是事奉（15:25、27）。</p><p>在他的觀念裡，<b>這兩件事沒有高下之分</b>。</p><p>★ 亮光四：προπέμπω ——差傳的技術用語</p><p>這個字常指<b>教會為傳道人預備路費、供應需要、送他上路</b>。</p><p>（徒15:3；林前16:6、11；多3:13；約參1:6）</p><p>保羅在15:24其實是在<b>請羅馬教會作他去西班牙的差傳支持</b>。</p><p>★ 亮光五：κοινωνία ——「捐項」原文是「團契」</p><p>保羅<b>沒有</b>用「捐款」這個字。</p><p>在他的觀念裡，<b>金錢的分享，就是團契的一種形式</b>。</p><p>★ 亮光六：15:27的「債」——與15:1呼應</p><pre>15:1   「我們堅固的人【應該】（Ὀφείλομεν）擔代……」\n15:27  「其實也算是【所欠的債】（ὀφειλέται）」</pre><p>而15:27的邏輯是：</p><pre>外邦人在猶太人【屬靈的好處】上有分\n   ↓\n所以外邦人就當在【養身之物】上供給他們</pre><p>弟兄姊妹，這正是11:18的實際版：</p><p>「不是你托著根，乃是根托著你。」</p><p>而現在，被接上的枝子，<b>把果子送回去</b>。</p><p>★ 亮光七：σφραγίζω（15:28「交付明白」）——蓋印封好</p><p>和合本譯「把這善果向他們<b>交付明白</b>」——原文是 σφραγισάμενος，字面是：</p><p>把這果子<b>蓋上印、封好</b>，交給他們。</p><p>這個字在當時的商業與運送上，指<b>封緘</b>：貨物送到，蓋印為憑，表示<b>如數送達、責任完成</b>。</p><p>而它的名詞形 σφραγίς，正是第四章那個字：</p><pre>4:11   「他受了割禮的【記號】，作他……因信稱義的【印證】（σφραγίς）」\n15:28  「把這善果向他們【交付明白】（σφραγισάμενος）」</pre><p>弟兄姊妹，保羅在錢的事上極其謹慎。</p><p>（比較林後8:20–21：「這就免得有人因我們收的捐銀很多，就挑我們的不是。<br>我們留心行光明的事，不但在主面前，就在人面前也是這樣。」）</p><p>這是一個很實際的提醒：</p><p>屬靈的事奉，在<b>金錢的交代</b>上要能「蓋印封好」。</p><p>★ 亮光八：15:29「必帶著基督豐盛的恩典而去」</p><p>弟兄姊妹，這一節讀起來很篤定。</p><p>而後來發生的事是：</p><pre>徒21     他到了耶路撒冷 —— 被捕\n徒23–26  在該撒利亞坐監兩年\n徒27     船壞\n徒28:16  終於到了羅馬 —— 【戴著鎖鏈】</pre><p>他說對了嗎？</p><p>弟兄姊妹，說對了。</p><p>因為腓立比書1:12–13（在羅馬監中寫的）說：</p><p>「我所遭遇的事<b>更是叫福音興旺</b>……以致我受的捆鎖在御營全軍和其餘的人中，已經顯明是為基督的緣故。」</p><p>他確實「帶著基督豐盛的恩典」去了羅馬。</p><p>只是——<b>那份恩典的形狀，跟他想的不一樣</b>。</p><p>（這一段與15:30–32的禱告一起讀，是全章最有牧養力的材料。見第二十部分第八題。）</p>","exp":"<p>弟兄姊妹，這一段是保羅的<b>行程表</b>——而它透露了三件事。</p><p>① 他被攔阻了好幾年（15:22）。</p><p>ἐγκόπτω 是<b>軍事用語</b>：破壞道路、切斷通路。而它是<b>未完成式被動</b>——「我<b>一再地被攔阻</b>」。</p><p>而他的回應是什麼？15:23：「<b>但如今</b>……」——<b>他繼續計畫</b>。</p><p>② 羅馬不是終點站，是中途站（15:24、28）。</p><p>保羅真正要去的是<b>西班牙</b>——當時所知世界的西端。</p><p>而15:19說他已「從耶路撒冷，直轉到以利哩古」。<br>他的地圖是：<b>從耶路撒冷，到地的兩端</b>。</p><p>③ 他把「送捐項」與「傳福音」放在同一個位階（15:25、27）。</p><p><b>經文本身明確表達的：</b> 保羅先往耶路撒冷送捐項，然後才要經過羅馬往西班牙去；而外邦人在物質上供給猶太信徒，是「所欠的債」。</p><p><b>可以合理推論的：</b> 「捐項」（κοινωνία）原文是「<b>團契</b>」——<br>保羅<b>沒有</b>用「捐款」這個字。在他的觀念裡，<b>金錢的分享，就是團契的一種形式</b>。</p><p>而15:27的邏輯，正是11:18的實際版：</p><p>「不是你托著根，乃是根托著你。」<br>而現在——<b>被接上的枝子，把果子送回去</b>。</p><p>⚠ 而15:24那句「然後<b>蒙你們送行</b>」（προπέμπω）是差傳的技術用語：<br>供應路費、預備需要、送他上路。</p><p>換句話說：保羅在這一節，其實是在<b>請羅馬教會作他去西班牙的差傳支持</b>。</p>"},{"a":30,"z":32,"star":true,"grk":"<p>30 …συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,</p>","lit":"<p>30「弟兄們，我<b>藉著我們的主耶穌基督</b>，又<b>藉著聖靈的愛</b>，勸你們：<b>在為我向神的禱告上，與我一同下場搏鬥</b>；」<br>31「叫我<b>得蒙拯救，脫離猶太地那些不順從的人</b>；也叫我<b>為耶路撒冷所辦的這供職，可蒙聖徒悅納</b>；」<br>32「好叫我<b>照著神的旨意，歡歡喜喜地到你們那裡</b>，<b>與你們同得安息</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>一同竭力</td><td>συναγωνίσασθαι</td><td>synagōnisasthai</td><td>G4865</td><td><b>σύν + ἀγών（競技場的搏鬥）</b></td><td><b>與……一同下場搏鬥</b></td><td><b>新約僅此一次</b></td></tr></table>","gram":"<p>★★ 亮光一：συναγωνίζομαι ——「與我一同下場」</p><p>這個字由 σύν（一同）+ ἀγωνίζομαι（<b>在競技場上搏鬥</b>）組成。</p><p>而 ἀγών 是「<b>競技、格鬥、拚命</b>」——英文 agony 的字根。</p><p>保羅在別處用同一字根：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>西4:12</b></td><td>以巴弗「常為你們<b>竭力</b>（ἀγωνιζόμενος）祈求」</td></tr><tr><td><b>提後4:7</b></td><td>「那<b>美好的仗</b>（ἀγῶνα）我已經打過了」</td></tr><tr><td><b>路22:44</b></td><td>耶穌在客西馬尼「<b>極其傷痛</b>」（ἀγωνίᾳ）</td></tr></table><p>弟兄姊妹，保羅請人為他禱告——</p><p>而他用的字是：<b>跟我一起下場搏鬥</b>。</p><p>★ 亮光二：「藉著聖靈的愛」</p><p>15:30說禱告的根據有兩個：</p><pre>「藉著我們主耶穌基督」\n「又藉著【聖靈的愛】」</pre><p>代禱的動力，是<b>聖靈放在我們裡面的那份愛</b>。</p><p>★ 亮光三：★ 這個禱告蒙應允了嗎？</p><p>保羅求了三件事：</p><table><tr><th>求的內容</th><th>後來</th></tr><tr><td>脫離猶太不順從的人（15:31）</td><td><b>在耶路撒冷被捕</b>（徒21:27–33）</td></tr><tr><td>捐項蒙聖徒悅納（15:31）</td><td>聖經未明說（徒21:17–20暗示受到接待）</td></tr><tr><td><b>歡歡喜喜地到你們那裡</b>（15:32）</td><td><b>到了羅馬——戴著鎖鏈</b>（徒28:16、20）</td></tr></table><p>而使徒行傳28:15記載：</p><p>「那裡的弟兄們一聽見我們的信息，就出來……迎接我們。<br>保羅見了他們，就<b>感謝神，放心壯膽</b>。」</p><p>弟兄姊妹，他到了。</p><p>他也「歡歡喜喜」了。</p><p>只是——<b>方式跟他想的完全不一樣</b>。</p>","exp":"<p>弟兄姊妹，30節那個字（συναγωνίζομαι）是<b>新約僅此一次</b>。</p><p>它由 σύν（一同）＋ ἀγωνίζομαι（<b>在競技場上搏鬥</b>）組成。</p><p>而 ἀγών 這個字根，正是路22:44形容主耶穌在客西馬尼「<b>極其傷痛</b>」（ἀγωνίᾳ）的那個字。</p><p><b>經文本身明確表達的：</b> 保羅請羅馬教會在禱告上與他一同竭力，求三件事：脫離危險、捐項蒙悅納、歡喜地到他們那裡。</p><p><b>可以合理推論的：</b> 保羅請人代禱，用的字是——</p><p>「<b>跟我一起下場</b>。」</p><p>而我們說「我會為你禱告」的時候：那是<b>下場</b>，還是<b>揮手</b>？</p><p>★ 而這段禱告後來怎麼了？</p><table><tr><th>他求的</th><th>後來</th></tr><tr><td>脫離猶太不順從的人（15:31）</td><td><b>在耶路撒冷被捕</b>（徒21:27–33）</td></tr><tr><td>捐項蒙聖徒悅納（15:31）</td><td>聖經未明說（徒21:17–20暗示受到接待）</td></tr><tr><td><b>歡歡喜喜到你們那裡</b>（15:32）</td><td><b>到了羅馬——戴著鎖鏈</b>（徒28:16、20）</td></tr></table><p>而使徒行傳28:15記載：</p><p>「那裡的弟兄們一聽見我們的信息，就出來……迎接我們。<br>保羅見了他們，就<b>感謝神，放心壯膽</b>。」</p><p>他到了。他也「歡歡喜喜」了。</p><p>只是——<b>方式跟他想的完全不一樣</b>。</p><p><b>⚠ 講台誠信提醒：</b> 這一段<b>不可</b>講成「所以禱告不必求具體的事」——保羅求得非常具體。<br>也<b>不可</b>講成「神一定會照你求的做」——祂沒有照保羅寫的方式做。<br>最忠實的講法：<b>他求了，神應允了，而過程完全不是他想的樣子</b>。<br>（對正在久求未應的人，這段是極大的安慰；但不要說得太快、太輕。）</p><p>【第五段｜15:33　第三個祝福】</p>"},{"a":33,"z":33,"star":false,"grk":"<p>ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν, ἀμήν.</p>","lit":"<p>「願那<b>平安的神</b>，<b>與你們眾人同在</b>。阿們。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>賜平安的神</td><td>ὁ θεὸς τῆς εἰρήνης</td><td>—</td><td>G1515</td><td><b>平安的神</b>（16:20再次出現）</td></tr><tr><td>眾人</td><td>πάντων ὑμῶν</td><td>pantōn hymōn</td><td>G3956</td><td><b>你們所有的人</b>（不是「對的那些人」）</td></tr><tr><td>阿們</td><td>ἀμήν</td><td>amēn</td><td>G281</td><td>誠心所願、確實如此</td></tr></table>","gram":"<p>★ 亮光一：三個「神」的第三個</p><pre>15:5   賜【忍耐安慰】的神\n15:13  使人有【盼望】的神\n15:33  賜【平安】的神   ← 本節</pre><p>★ 亮光二：「賜平安的神」在保羅書信中</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>羅15:33</b></td><td>「願<b>賜平安的神</b>常和你們眾人同在」</td></tr><tr><td><b>羅16:20</b></td><td>「<b>賜平安的神</b>快要將撒但踐踏在你們腳下」</td></tr><tr><td>腓4:9</td><td>「<b>賜平安的神</b>就必與你們同在」</td></tr><tr><td>帖前5:23</td><td>「願<b>賜平安的神</b>親自使你們全然成聖」</td></tr><tr><td>來13:20</td><td>「但願<b>賜平安的神</b>……」</td></tr></table><p>★ 亮光三：「和你們<b>眾人</b>」</p><p>μετὰ πάντων ὑμῶν ——「與你們<b>所有的人</b>」。</p><p>弟兄姊妹，在一封處理「強與弱」張力的信裡，</p><p>保羅最後說：<b>眾人</b>。</p><p>不是「與那些對的人」。</p>","exp":"<p>弟兄姊妹，14–15章講的是什麼？</p><p>是一間<b>因為食物與日子而緊張</b>的教會。</p><p>而保羅的祝福是：</p><p>「願<b>賜平安的神</b>，常和你們<b>眾人</b>同在。」</p><p>他求的正是那間教會最缺的東西。</p>"}],"16":[{"a":1,"z":1,"star":true,"grk":"<p>Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν [καὶ] διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,</p>","lit":"<p>「我向你們<b>正式介紹</b>我們的姊妹非比，她是<b>堅革哩教會的</b> διάκονος。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>舉薦</td><td>Συνίστημι</td><td>synistēmi</td><td>G4921</td><td>σύν + ἵστημι</td><td><b>正式介紹、推薦</b></td><td><b>3:5、5:8同字</b></td></tr><tr><td>姊妹</td><td>ἀδελφή</td><td>adelphē</td><td>G79</td><td>—</td><td>姊妹</td><td>—</td></tr><tr><td>女執事</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td>—</td><td><b>執事／僕人</b></td><td><b>見第二十部分</b></td></tr></table>","gram":"<p>★ 亮光一：συνίστημι ——推薦信的格式</p><p>這個字在第一世紀是<b>推薦信的專門用語</b>。</p><p>（林後3:1「豈像別人用<b>舉薦書</b>給你們或用你們的舉薦書呢？」——同字根）</p><p>弟兄姊妹，16:1–2的結構，正是一封標準的推薦信：</p><p>① 介紹身分（16:1）<br>② 請求接待（16:2上）<br>③ 說明她的功勞（16:2下）</p><p>而這使多數註釋家判斷：</p><p>非比<b>極可能就是把這封信從哥林多帶到羅馬的人</b>。</p><p>（經文沒有明說，但推薦信的功能通常如此。）</p><p>弟兄姊妹，如果是這樣——</p><p>人類歷史上第一個把羅馬書送到羅馬的人，</p><p>是一位姊妹。</p><p>★ 亮光二：συνίστημι 在羅馬書的另外兩處</p><pre>3:5   「我們的不義若【顯出】（συνίστησιν）神的義來」\n5:8   「惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們【顯明】（συνίστησιν）了」</pre><p>同一個字。神用十字架「舉薦」祂的愛（5:8）；<br>保羅用這封信「舉薦」非比。</p><p>★ 亮光三：「堅革哩教會中的」</p><p>這個限定很重要：保羅<b>沒有</b>只說「非比是一個服事的人」，</p><p>他說：「<b>堅革哩教會的</b> διάκονος」。</p><p>（關於這是否為職分，見第二十部分——本文不作裁決。）</p>","exp":"<p>弟兄姊妹，16:1看起來只是一句客套的介紹。</p><p>但它在第一世紀是一份<b>有效力的文件</b>。</p><p>一個人要到陌生的城市，需要一封推薦信，<br>好讓當地的人知道：<b>這個人可以接待，是自己人</b>。</p><p>而保羅在這封信裡，把三件事講清楚了：</p><table><tr><th>他說了什麼</th><th>意思</th></tr><tr><td><b>「我們的姊妹」</b></td><td>她<b>屬於這個家</b>——不是外人</td></tr><tr><td><b>「堅革哩教會中的 διάκονος」</b></td><td>她在<b>一間具體的教會</b>裡，有<b>實際的服事地位</b></td></tr><tr><td><b>（16:2）「她素來幫助許多人，也幫助了我」</b></td><td>她的信用，<b>保羅自己作保</b></td></tr></table><p><b>經文本身明確表達的：</b> 保羅正式推薦非比，並要求羅馬教會接待她、支援她。</p><p><b>可以合理推論的：</b> 若她正是送信的人，那麼「第一個把羅馬書帶進羅馬城的」，是一位姊妹。<br>（經文沒有明說，但推薦信的功能通常如此。）</p>"},{"a":2,"z":2,"star":true,"grk":"<p>ἵνα αὐτὴν προσδέξησθε ἐν κυρίῳ ἀξίως τῶν ἁγίων καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι· καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ἐμοῦ αὐτοῦ.</p>","lit":"<p>「好叫你們<b>在主裡接待她</b>，用<b>配得聖徒的方式</b>；並且在她所需要的任何事上，<b>站到她旁邊去</b>——因為她自己<b>素來就是許多人的保護人</b>，也是我的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>接待</td><td>προσδέξησθε</td><td>prosdexēsthe</td><td>G4327</td><td><b>歡迎、接受</b>（比較14:1、15:7的 προσλαμβάνω）</td></tr><tr><td>幫助（你們）</td><td>παραστῆτε</td><td>parastēte</td><td>G3936</td><td><b>παρίστημι——站在她旁邊</b>（見下）</td></tr><tr><td>幫助（她）</td><td>προστάτις</td><td>prostatis</td><td>G4368</td><td><b>保護人、資助者</b></td></tr></table>","gram":"<p>★ 亮光一：παρίστημι ——「站到她旁邊去」</p><p>「你們就<b>幫助</b>她」——原文是 παρίστημι（παρά「旁邊」+ ἵστημι「站」）。</p><p>弟兄姊妹，這個字我們在羅馬書追蹤過：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>6:13</b></td><td>「將自己<b>獻給</b>（παραστήσατε）神」</td></tr><tr><td><b>12:1</b></td><td>「將身體<b>獻上</b>（παραστῆσαι），當作活祭」</td></tr><tr><td><b>14:10</b></td><td>「我們都要<b>站在</b>（παραστησόμεθα）神的臺前」</td></tr><tr><td><b>16:2</b></td><td><b>「你們就</b>幫助<b>（παραστῆτε）她」</b></td></tr></table><p>弟兄姊妹，這個字的字面是：<b>站到旁邊去</b>。</p><p>保羅在說：<b>她若有需要，你們就站到她旁邊去</b>。</p><p>★ 亮光二：兩個「幫助」，原文是兩個不同的字</p><pre>「你們就【幫助】她」    —— παρίστημι（站到旁邊）\n「因她素來【幫助】許多人」—— προστάτις（保護人、資助者）</pre><p>弟兄姊妹，中文都譯「幫助」，但份量不同：</p><p>前者是「你們去幫她」。<br>後者是說：<b>她本來就是那個幫助許多人的人</b>。</p><p>★ 亮光三：προστάτις 的社會意義</p><p>這個字指一個<b>有地位或財力、為他人提供保護與支持的人</b>。</p><p>（在羅馬社會，這是 patronus「保護人」制度的希臘文對應詞。）</p><p>保羅說：她是「許多人的 προστάτις，<b>也是我的</b>」。</p>","exp":"<p>弟兄姊妹，16:2有一個很美的邏輯：</p><pre>她曾經幫助許多人（包括保羅）\n   ↓\n所以：現在輪到你們去幫助她</pre><p>這正是屬神體系的樣子：<b>不是單向的，是流通的</b>。</p><p>【第二段｜16:3–16　★ 名單】</p>"},{"a":3,"z":5,"star":true,"grk":"<p>3 Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,<br>4 οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν…</p>","lit":"<p>3「<b>問百基拉和亞居拉安</b>——他們是我在基督耶穌裡的<b>同工</b>，」<br>4「他們曾為我的性命，<b>把自己的脖子放上去</b>。」<br>5「也問<b>在他們家中的那個教會</b>安。問我所親愛的以拜尼土安——他是亞西亞歸給基督的<b>初熟果子</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>同工</td><td>συνεργός</td><td>synergos</td><td>G4904</td><td>σύν + ἔργον：<b>一同做工的人</b></td></tr><tr><td>頸項</td><td>τράχηλος</td><td>trachēlos</td><td>G5137</td><td><b>脖子</b></td></tr><tr><td>置之度外</td><td>ὑπέθηκαν</td><td>hypethēkan</td><td>G5294</td><td>ὑπό + τίθημι：<b>放在下面</b></td></tr><tr><td>初結的果子</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>初熟的果子</b>（<b>8:23、11:16同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：百基拉的名字排在前面</p><p>新約中提到這對夫婦共六次，其中<b>四次是百基拉在前</b>：</p><table><tr><th>出處</th><th>順序</th></tr><tr><td>徒18:2</td><td>亞居拉、百基拉</td></tr><tr><td><b>徒18:18</b></td><td><b>百基拉、亞居拉</b></td></tr><tr><td><b>徒18:26</b></td><td><b>百基拉、亞居拉</b>（他們一同教導亞波羅）</td></tr><tr><td><b>羅16:3</b></td><td><b>百基拉、亞居拉</b></td></tr><tr><td>林前16:19</td><td>亞居拉、百基拉</td></tr><tr><td><b>提後4:19</b></td><td><b>百基拉、亞居拉</b></td></tr></table><p>弟兄姊妹，在第一世紀的文書慣例中，這個順序是值得注意的。</p><p>（學者對原因有不同推測：可能與她的社會地位有關，也可能與她在教會中的角色有關。<br>講台上宜說「這個順序值得注意」，不必過度推論。）</p><p>★ 亮光二：「將自己的頸項置之度外」</p><p>原文的字面是：<b>把自己的脖子放上去</b>。</p><p>弟兄姊妹，那是一個<b>斬首的畫面</b>。</p><p>（我們不知道那件事發生在哪裡——可能是徒19章以弗所的暴動，也可能是別的事。聖經沒有記載細節。）</p><p>★ 亮光三：他們的家就是教會</p><p>16:5「又問<b>在他們家中的教會</b>安」。</p><p>而林前16:19也說：「亞居拉和百基拉並<b>在他們家裡的教會</b>……問你們安。」</p><p>弟兄姊妹，他們搬到哪裡，教會就在哪裡。</p><p>★ 亮光四：ἀπαρχή（初結的果子）——第八章那個字</p><pre>8:23   「我們這有【聖靈初結果子】（ἀπαρχή）的」\n11:16  「所獻的【新麵】（ἀπαρχή）若是聖潔」\n16:5   「他在亞西亞是歸基督【初結的果子】（ἀπαρχή）」</pre><p>弟兄姊妹，初熟的果子不是「一小部分」，是<b>整場收成的保證</b>。</p><p>以拜尼土是亞西亞第一個信主的人——<br>而他背後，是後來整個亞西亞的收成。</p>","exp":"<p>弟兄姊妹，這三節裡有一對夫婦，和一間在他們家裡的教會。</p><p>而保羅記得的，不是他們的職位，是<b>他們做過什麼</b>：</p><p>「他們<b>為我的命</b>，把自己的脖子放上去。」</p><p>而下一句更值得注意：</p><p>「不但我感謝他們，就是<b>外邦的眾教會</b>也感謝他們。」</p><p>弟兄姊妹，這意味著：他們的付出，<b>不只一間教會知道</b>。</p><p><b>經文本身明確表達的：</b> 百基拉與亞居拉曾為保羅冒生命危險，並且他們的家就是教會。</p><p><b>可以合理推論的：</b> 一對做帳棚的夫婦，搬到哪裡，教會就在哪裡（比較徒18:2–3、18:18–19；林前16:19）。<br>屬神的體系，不一定需要一棟建築；有時候只需要一個願意開門的家。</p>"},{"a":6,"z":15,"star":true,"grk":"<p>6 ἀσπάσασθε Μαρίαν, ἥτις πολλὰ ἐκοπίασεν εἰς ὑμᾶς.<br>7 ἀσπάσασθε Ἀνδρόνικον καὶ Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ.<br>8 ἀσπάσασθε Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.<br>9 ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.<br>10 ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.<br>11 ἀσπάσασθε Ἡρῳδίωνα τὸν συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.<br>12 ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.<br>13 ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.<br>14 ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.<br>15 ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.</p>","lit":"<p>6「問馬利亞安——她<b>為你們做了許多苦工</b>。」<br>7「問安多尼古和猶尼亞安——我的親屬，也是<b>與我一同作戰俘的</b>；他們在使徒中是<b>被標記出來的</b>，而且<b>比我先在基督裡</b>。」<br>8「問暗伯利安——<b>我在主裡蒙愛的</b>。」<br>9「問耳巴奴安——我們在基督裡的<b>同工</b>；也問士他古安——<b>我所蒙愛的</b>。」<br>10「問亞比利安——那<b>在基督裡經過試驗的</b>。問亞利多布家裡的人安。」<br>11「問希羅天安——我的親屬。問拿其數家中<b>那些在主裡的人</b>安。」<br>12「問土非拿氏和土富撒氏安——<b>那些在主裡做苦工的</b>（女性）。問可親愛的彼息氏安——她<b>在主裡做了許多苦工</b>。」<br>13「問魯孚安——<b>那在主裡蒙揀選的</b>；也問他母親安，<b>她也是我的母親</b>。」<br>14「問亞遜其土、弗勒干、黑米、八羅巴、黑馬，以及<b>與他們在一起的弟兄們</b>安。」<br>15「問非羅羅古和猶利亞、尼利亞和他姊妹、阿林巴，以及<b>與他們在一起的眾聖徒</b>安。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>多受勞苦</td><td>πολλὰ ἐκοπίασεν</td><td>ekopiasen</td><td>G2872</td><td><b>κοπιάω ＝ 做到筋疲力盡的苦工</b></td></tr><tr><td>一同坐監</td><td>συναιχμαλώτους</td><td>synaichmalōtous</td><td>G4869</td><td><b>σύν + αἰχμάλωτος（戰俘）</b>——<b>7:23同字根</b></td></tr><tr><td>有名望的</td><td>ἐπίσημοι</td><td>episēmoi</td><td>G1978</td><td><b>被標記出來的、顯著的</b></td></tr><tr><td>所親愛的</td><td>ἀγαπητός</td><td>agapētos</td><td>G27</td><td><b>蒙愛的</b>（<b>1:7、太3:17同字</b>）</td></tr><tr><td>同工</td><td>συνεργός</td><td>synergos</td><td>G4904</td><td><b>σύν + ἔργον：一同做工的人</b></td></tr><tr><td>經過試驗的</td><td>δόκιμος</td><td>dokimos</td><td>G1384</td><td><b>經過試驗而合格的</b>（<b>5:4 δοκιμή 同字根</b>）</td></tr><tr><td>蒙揀選的</td><td>ἐκλεκτός</td><td>eklektos</td><td>G1588</td><td><b>被揀選的</b>（<b>8:33同字</b>）</td></tr><tr><td>在一處的</td><td>σὺν αὐτοῖς</td><td>syn autois</td><td>—</td><td><b>與他們同在一起的</b>（16:14、15）</td></tr></table>","gram":"<p>★ 亮光一：κοπιάω ——「做苦工」，而且全部用在女性身上</p><p>這個字的意思不是「服事」，是：</p><p>做到<b>筋疲力盡</b>的苦工。</p><p>（保羅用它形容自己：林前15:10「我比眾使徒格外<b>勞苦</b>」；西1:29）</p><p>而在羅馬書16章，這個字出現<b>四次</b>：</p><pre>16:6   馬利亞          —— 多受勞苦\n16:12  土非拿氏、土富撒氏 —— 為主勞苦\n16:12  彼息氏          —— 為主多受勞苦</pre><p>弟兄姊妹，四次，<b>全部用在女性身上</b>。</p><p>★ 亮光二：συναιχμάλωτος ——「一同坐監」，字面是「一同作戰俘」</p><p>這個字由 σύν + <b>αἰχμάλωτος（戰俘）</b> 組成。</p><p>而那個字根，我們在羅7:23見過：</p><p>7:23「把我<b>擄去</b>（αἰχμαλωτίζοντά），叫我附從那肢體中犯罪的律。」</p><p>弟兄姊妹，安多尼古和猶尼亞——</p><p>是保羅的<b>牢友</b>。</p><p>★ 亮光三：δόκιμος（16:10「經過試驗的」）——第五章那個字根</p><pre>5:3–4  「患難生忍耐，忍耐生【老練】（δοκιμή），老練生盼望」\n16:10  「在基督裡【經過試驗的】（δόκιμον）亞比利」</pre><p>δοκιμή 是<b>金屬經過火煉之後，還在的那個部分</b>。</p><p>弟兄姊妹，保羅對亞比利的描述只有五個字：</p><p>「在基督裡經過試驗的。」</p><p>我們不知道他經歷過什麼。</p><p>但保羅記得。</p><p>★ 亮光四：ἐκλεκτός（16:13「在主蒙揀選的」）——第八、九章那個字</p><pre>8:33   「誰能控告神所【揀選】（ἐκλεκτῶν）的人呢？」\n9:11   「神【揀選】（ἐκλογή）人的旨意」\n16:13  「在主【蒙揀選】（ἐκλεκτόν）的魯孚」</pre><p>弟兄姊妹，保羅講了兩章的「揀選」神學（9–11章）。</p><p>而在第十六章，那個字落在一個人身上：</p><p>魯孚。</p><p>★★ 亮光五：16:13「他的母親就是我的母親」</p><p>弟兄姊妹，這半句話是全章最溫暖的：</p><p>「又問在主蒙揀選的魯孚和他母親安；</p><p>他的母親<b>就是我的母親</b>。」</p><p>保羅顯然不是說她生了他。</p><p>他是說：</p><p>這位姊妹，<b>待我如同待自己的兒子</b>。</p><p>弟兄姊妹，保羅是一個<b>沒有家的人</b>。</p><p>他一生在路上，坐監、船壞、被打、被趕。</p><p>而在某一個城市，有一位姊妹——</p><p>把他當兒子。</p><p>（關於「魯孚」是否為可15:21古利奈人西門的兒子，見第二十部分——<b>無法確定</b>。）</p><p>★ 亮光六：16:8–9 三個沒有事蹟的名字</p><p>弟兄姊妹，這一份名單裡，多數人後面都跟著一句「他做過什麼」。</p><p>但有三個人不是：</p><pre>16:8  暗伯利 —— 「我在主裡面【所親愛的】」\n16:9  耳巴奴 —— 「在基督裡與我們【同工的】」\n16:9  士他古 —— 「我【所親愛的】」</pre><p>「所親愛的」是 ἀγαπητός——<b>蒙愛的</b>。</p><p>而這個字，我們在第一章見過：</p><p>1:7「我寫信給你們在羅馬、<b>為神所愛</b>（ἀγαπητοῖς θεοῦ）、奉召作聖徒的眾人。」</p><p>（也是天父在約旦河邊對子說的那個字：太3:17「這是我的<b>愛子</b>。」）</p><p>弟兄姊妹，暗伯利與士他古沒有任何事蹟被記下來。</p><p>保羅只說了一句：<b>我愛他</b>。</p><p>而這對一份「記得誰做過什麼」的名單，是一個很重要的平衡：</p><p>有些人被記得，是因為他<b>做了什麼</b>。<br>有些人被記得，是因為他<b>是誰</b>。</p><p>（附帶一提：暗伯利、耳巴奴、士他古都是當時<b>奴隸與釋奴常用的名字</b>。<br>而保羅稱一位奴隸出身的弟兄為「我在主裡面所親愛的」。）</p><p>★ 亮光七：16:14–15 兩個「與他們在一處的」群體</p><p>弟兄姊妹，這兩節的結尾都有同一句話：</p><pre>16:14 「並【與他們在一處的】弟兄們安」\n16:15 「同阿林巴並【與他們在一處的】眾聖徒安」</pre><p>加上16:5「又問在他們<b>家中的教會</b>安」——</p><p>羅馬教會<b>不是一間大教會</b>，</p><p>而是<b>散佈在城中各處的幾個家庭聚會</b>。</p><p>而16:14、15兩組人的名字有一個共同點：</p><p>亞遜其土、弗勒干、黑米、八羅巴、黑馬；非羅羅古、猶利亞、尼利亞、阿林巴——</p><p>多是當時<b>奴隸與釋奴常見的名字</b>。</p><p>（這是碑銘研究的一般判斷。講台上宜說「在當時是奴隸和釋奴常用的名字」，不必給更強的斷語。）</p><p>弟兄姊妹，把這兩節與16:23放在一起看：</p><p>16:23提到「<b>城內管銀庫的</b>以拉都」——那是一個<b>公職</b>。</p><p>而16:14–15是兩群連名字都像奴隸的人。</p><p>保羅——<b>用同一個詞，問他們安</b>。</p><p>★ 亮光八：16:15「尼利亞和他姊妹」</p><p>弟兄姊妹，注意這一句：那位姊妹<b>連名字都沒有留下</b>。</p><p>保羅只說：「尼利亞<b>和他姊妹</b>」。</p><p>她在名單上。</p><p>只是我們不知道她叫什麼。</p><p>（而那份最終的名單——路10:20「你們的名記錄在天上」——上面有。）</p>","exp":"<p>弟兄姊妹，這十節是全本聖經最密集的一份名單。</p><p>而保羅在做的，有三件事：</p><p>① 他記得名字。</p><p>② 他記得<b>他們做過什麼</b>——多受勞苦、一同坐監、經過試驗、把我當兒子。</p><p>③ 他<b>吩咐羅馬教會去問他們安</b>（ἀσπάσασθε 是命令語氣）。</p><p>也就是說：保羅不只是自己記得，<br>他要<b>這些名字，在羅馬教會裡被叫出來</b>。</p><p>而這份名單的組成，本身就是一篇講道：</p><table><tr><th>面向</th><th>名單裡的證據</th></tr><tr><td><b>跨越階級</b></td><td>暗伯利、耳巴奴、黑米、彼息氏等，<b>是當時奴隸與釋奴常用的名字</b></td></tr><tr><td><b>跨越性別</b></td><td>至少九位女性被點名；而 κοπιάω（做苦工）<b>全部用在女性身上</b></td></tr><tr><td><b>跨越族群</b></td><td>猶太名字（馬利亞、希羅天）與希臘、拉丁名字並列</td></tr><tr><td><b>跨越有無事蹟</b></td><td>有人被記得是因為<b>做了什麼</b>；也有人被記得是因為<b>他是誰</b>（16:8、9）</td></tr></table><p><b>經文本身明確表達的：</b> 保羅認識羅馬教會中的許多人，並知道他們各自的服事與經歷。</p><p><b>可以合理推論的：</b> 十五章的神學，最後長成的樣子，就是這樣一份名單。<br>神不是在拯救「人類」，祂是在拯救<b>有名字的人</b>。</p>"},{"a":16,"z":16,"star":false,"grk":"<p>ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι πᾶσαι τοῦ Χριστοῦ.</p>","lit":"<p>「你們要<b>用聖潔的親嘴彼此問安</b>。基督的<b>眾教會</b>都問你們安。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>問安</td><td>ἀσπάσασθε</td><td>aspasasthe</td><td>G782</td><td><b>命令語氣</b>：你們要問安（見下）</td></tr><tr><td>親嘴</td><td>φίλημα</td><td>philēma</td><td>G5370</td><td><b>親吻</b>（φιλέω 的名詞形）</td></tr><tr><td>聖潔</td><td>ἅγιος</td><td>hagios</td><td>G40</td><td>分別為聖的</td></tr><tr><td>彼此</td><td>ἀλλήλους</td><td>allēlous</td><td>G240</td><td><b>互相</b>（羅馬書出現多次的關鍵詞）</td></tr><tr><td>眾教會</td><td>αἱ ἐκκλησίαι πᾶσαι</td><td>—</td><td>G1577</td><td><b>所有的教會</b></td></tr></table>","gram":"<p>★★ 亮光零：一個貫穿全章的動詞——ἀσπάζομαι</p><p>弟兄姊妹，這是讀第十六章時最容易漏掉、卻最能看出結構的一件事。</p><p>「問……安」這個動詞（ἀσπάζομαι），在本章出現的<b>語氣不同</b>：</p><table><tr><th>段落</th><th>形式</th><th>意思</th></tr><tr><td><b>16:3–16</b></td><td><b>ἀσπάσασθε（命令語氣）</b></td><td><b>「你們要去問……安」</b></td></tr><tr><td><b>16:16下、21、23</b></td><td><b>ἀσπάζεται／ἀσπάζονται（直說語氣）</b></td><td>「某某人<b>問你們安</b>」</td></tr></table><p>而在16:3–16這一段，命令語氣的 ἀσπάσασθε 出現了<b>十六次</b>。</p><p>弟兄姊妹，這個區分很重要：</p><p>保羅<b>不是</b>在說「我向他們問好」。</p><p>他是在<b>吩咐羅馬教會</b>：<b>你們要去問他安</b>。</p><p>換句話說：</p><p>保羅在做的，不只是「記得這些人」——</p><p>他在<b>把這些人，介紹給彼此</b>。</p><p>（而16:16正是這一連串命令的收尾：「你們要<b>彼此</b>問安。」）</p><p>★ 亮光一：φίλημα ἅγιον ——「聖潔的親嘴」</p><p>這是第一世紀的一般問安禮節（頰吻），保羅加上了「<b>聖潔的</b>」。</p><p>弟兄姊妹，重點不在動作的形式（那是文化性的），<br>在於：<b>這是一個家庭式的、身體性的接觸</b>——</p><p>發生在一間橫跨奴隸與官員、猶太與外邦的教會裡。</p><p>★ 亮光二：「基督的<b>眾教會</b>都問你們安」</p><p>弟兄姊妹，保羅把整個教會網絡的問安，帶到羅馬。</p><p>他在說：<b>你們不是孤立的</b>。</p><p>【第三段｜16:17–20　警告與應許】</p>","exp":"<p>弟兄姊妹，16:16是那一連串命令的<b>收尾</b>。</p><p>前面十四節，保羅一個一個地說：「問某某安。」</p><p>而到了16節，他說：</p><p>「你們<b>彼此</b>問安。」</p><p>從「去問他安」，變成「<b>你們彼此</b>」。</p><p>而他加的那個形容詞很重要：「<b>聖潔的</b>親嘴」。</p><p>頰吻是當時的一般禮節；<br>保羅沒有廢掉那個文化形式，他<b>把它分別為聖</b>。</p><p>而下半句把鏡頭拉遠了：</p><p>「<b>基督的眾教會</b>都問你們安。」</p><p><b>經文本身明確表達的：</b> 信徒之間要以真實、聖潔的方式彼此問安；而其他教會也向羅馬教會問安。</p><p><b>可以合理推論的：</b> 在一間橫跨奴隸與官員、猶太與外邦的教會裡，<br>「彼此親嘴問安」是一個<b>身體性的、看得見的和好宣告</b>。</p><p><b>⚠ 牧養提醒：</b> 形式是文化性的（不同文化對身體接觸的界線不同），<br>原則卻是不變的：<b>這是一家人</b>。今日實行時，仍須顧及安全與合宜的界線。</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ἐκκλίνετε ἀπ' αὐτῶν·<br>18 οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.</p>","lit":"<p>17「弟兄們，我勸你們<b>盯緊</b>那些製造<b>分裂</b>與<b>絆腳陷阱</b>、違背你們所學之教訓的人；並且<b>要從他們那裡轉開</b>。」<br>18「因為這樣的人<b>不是在服事我們的主基督，乃是服事自己的肚腹</b>；他們藉著<b>聽起來很良善的話</b>和奉承，<b>徹底欺騙</b>那些心裡沒有惡的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>留意</td><td>σκοπεῖν</td><td>skopein</td><td>G4648</td><td>σκοπός（目標）</td><td><b>盯著看、留心觀察</b></td><td>見下</td></tr><tr><td>離間</td><td>διχοστασίας</td><td>dichostasias</td><td>G1370</td><td>δίχα（分開）+ στάσις</td><td><b>分裂</b></td><td>—</td></tr><tr><td>叫你們跌倒</td><td>σκάνδαλα</td><td>skandala</td><td>G4625</td><td>—</td><td><b>陷阱的機關</b></td><td><b>14:13同字</b></td></tr><tr><td>躲避</td><td>ἐκκλίνετε</td><td>ekklinete</td><td>G1578</td><td>ἐκ + κλίνω（偏轉）</td><td><b>轉開、避開</b></td><td>—</td></tr><tr><td>花言巧語</td><td>χρηστολογία</td><td>chrēstologia</td><td>G5542</td><td><b>χρηστός（良善的）+ λόγος</b></td><td><b>聽起來很好的話</b></td><td><b>新約僅此一次</b></td></tr><tr><td>誘惑</td><td>ἐξαπατῶσιν</td><td>exapatōsin</td><td>G1818</td><td>ἐκ + ἀπατάω</td><td><b>徹底欺騙</b></td><td><b>7:11同字！</b></td></tr><tr><td>老實人</td><td>ἀκάκων</td><td>akakōn</td><td>G172</td><td>ἀ + κακός（惡）</td><td><b>心裡沒有惡的人</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：σκοπέω ——「盯著看」</p><p>這個字的字根是 σκοπός（<b>目標、標的</b>）——英文 scope 的來源。</p><p>弟兄姊妹，保羅<b>沒有</b>說「不要理他們」。</p><p>他說：<b>盯著看</b>。</p><p>先看清楚，然後才「轉開」（ἐκκλίνω）。</p><p>★★ 亮光二：χρηστολογία ——與2:4「恩慈」同一個字根</p><p>這個字在新約<b>只出現這一次</b>。</p><p>它由 <b>χρηστός（良善的、恩慈的）</b> + λόγος（話）組成。</p><p>而 χρηστός 的名詞形 χρηστότης，正是2:4與11:22那個字：</p><pre>2:4    「你藐視他豐富的【恩慈】（χρηστότης）……\n        不曉得他的【恩慈】是領你悔改呢？」\n11:22  「神的【恩慈】（χρηστότης）和嚴厲」\n   ↓\n16:18  「用【花言巧語】（χρηστολογία）誘惑那些老實人的心」</pre><p>弟兄姊妹，字根一樣，性質完全相反：</p><p>神的恩慈是<b>真的</b>，而且<b>領人悔改</b>。<br>他們的「聽起來很恩慈的話」是<b>假的</b>，用來<b>誘惑人</b>。</p><p>這是一個很嚴肅的提醒：</p><p>假的東西，常常長得跟真的<b>很像</b>。</p><p>★★ 亮光三：ἐξαπατάω ——蛇的那個字</p><p>「<b>誘惑</b>那些老實人的心」——ἐξαπατῶσιν。</p><p>而這個字，我們在羅7:11見過：</p><p>7:11「因為罪趁著機會，就藉著誡命<b>引誘</b>（ἐξηπάτησέν）我，並且殺了我。」</p><p>而那個字，來自創世記3:13：</p><p><b>「那蛇</b>引誘<b>我，我就吃了。」</b>（七十士譯本用同一字根）</p><p>（保羅在林後11:3也用它：「就像<b>蛇用詭詐誘惑了夏娃</b>一樣。」）</p><p>弟兄姊妹，保羅在說：</p><p>那些離間的人，用的是<b>蛇的方法</b>。</p><p>★ 亮光四：判準是什麼？</p><p>弟兄姊妹，16:17–18給了非常清楚的判準（<b>必須嚴格遵守，見第二十部分</b>）：</p><table><tr><th>特徵</th><th>出處</th></tr><tr><td><b>離間</b>（造成分裂）</td><td>16:17</td></tr><tr><td><b>叫人跌倒</b>（放陷阱）</td><td>16:17</td></tr><tr><td><b>背乎所學之道</b></td><td>16:17</td></tr><tr><td><b>不服事主，只服事自己的肚腹</b></td><td>16:18</td></tr><tr><td><b>用花言巧語誘惑老實人</b></td><td>16:18</td></tr></table><p>弟兄姊妹，注意：判準<b>不是「跟我意見不同」</b>。</p><p>判準是：<b>背離所傳的道 ＋ 以分裂為手段 ＋ 以自己為目的</b>。</p><p>★ 亮光五：這與14:1「你們要接納」不衝突</p><table><tr><th>羅14</th><th>羅16:17–18</th></tr><tr><td>「信心<b>軟弱</b>的」</td><td>「<b>離間</b>、<b>叫人跌倒</b>、<b>背乎所學之道</b>的人」</td></tr><tr><td>他仍然「為主」而行、「感謝神」（14:6）</td><td>他「<b>只服事自己的肚腹</b>」（16:18）</td></tr><tr><td><b>接納</b>（14:1）</td><td><b>留意躲避</b>（16:17）</td></tr></table><p>接納<b>不等於</b>沒有界線。</p>","exp":"<p>弟兄姊妹，讀完十四節的問安，我們心裡是暖的。</p><p>然後保羅的語氣突然變了。</p><p>而這個轉折本身，就是一個重要的教導：</p><p>接納（14:1）——<b>不等於</b>沒有界線（16:17）。</p><p>但要看清楚：保羅給的判準<b>極其具體</b>，共五項：</p><pre>① 離間（造成分裂）\n② 叫人跌倒（放陷阱）\n③ 背乎所學之道\n④ 不服事主，只服事自己的肚腹\n⑤ 用花言巧語誘惑老實人</pre><p>而其中第③項是<b>客觀的教義標準</b>——「背乎<b>所學之道</b>」。</p><p><b>經文本身明確表達的：</b> 要留心觀察並避開那些背離所傳之道、以分裂為手段、以自己為目的的人。</p><p><b>可以合理推論的：</b> 判準<b>不是「跟我意見不同」</b>。<br>羅14要接納的是「信心軟弱的」——他仍然「為主」而行、並「感謝神」（14:6）；<br>而羅16:18這種人「<b>不服事主，只服事自己的肚腹</b>」。<br>這是兩種完全不同的人。</p><p><b>⚠ 牧養提醒：</b> 這一節在教會史上被誤用來排除異己。<br>使用它之前，請先誠實地逐條對照那五個判準。</p>"},{"a":19,"z":20,"star":true,"grk":"<p>19 …θέλω δὲ ὑμᾶς σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.<br>20 ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει.</p>","lit":"<p>19「你們的<b>順服</b>已經傳到眾人那裡，所以我為你們歡喜；但我願意你們<b>在善上有智慧，在惡上未經摻雜</b>。」<br>20「而<b>賜平安的神</b>，快要把撒但<b>壓碎在你們的腳下</b>。願我們主耶穌的恩，與你們同在。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>順服</td><td>ὑπακοή</td><td>hypakoē</td><td>G5218</td><td><b>在底下聽</b>（<b>1:5、16:26同字</b>）</td></tr><tr><td>聰明</td><td>σοφός</td><td>sophos</td><td>G4680</td><td>有智慧的</td></tr><tr><td>愚拙</td><td>ἀκέραιος</td><td>akeraios</td><td>G185</td><td>ἀ + κεράννυμι（混雜）：<b>未經混雜的、純真的</b></td></tr><tr><td>踐踏</td><td>συντρίψει</td><td>syntripsei</td><td>G4937</td><td><b>壓碎、擊碎</b></td></tr><tr><td>快要</td><td>ἐν τάχει</td><td>en tachei</td><td>G5034</td><td><b>迅速地</b></td></tr></table>","gram":"<p>★ 亮光一：ὑπακοή（16:19「順服」）——全書的框</p><pre>1:5    「叫人為他的名【信服真道】（ὑπακοὴν πίστεως）」\n16:19  「你們的【順服】（ὑπακοή）已經傳於眾人」\n16:26  「使他們【信服真道】（ὑπακοὴν πίστεως）」</pre><p>★ 亮光二：ἀκέραιος ——「未經混雜的」</p><p>這個字的字面是「<b>沒有摻雜</b>」（如未摻水的酒、未摻雜質的金屬）。</p><p>而主耶穌用同一個字：</p><p>太10:16「你們要<b>靈巧</b>像蛇，<b>馴良</b>（ἀκέραιοι）像鴿子。」</p><p>弟兄姊妹，「在惡上愚拙」不是「笨」，<br>是<b>在惡的事上不沾</b>——<b>乾乾淨淨，沒有摻雜</b>。</p><p>★★ 亮光三：16:20回到創世記3:15</p><p>「賜平安的神快要將撒但<b>踐踏</b>（συντρίψει）在你們腳下。」</p><p>而創世記3:15說：</p><p>「女人的後裔要<b>傷你的頭</b>。」</p><p>弟兄姊妹，保羅在信的最後，把讀者帶回到<b>聖經最古老的那個應許</b>。</p><p>而請注意16:18與16:20的連結：</p><pre>16:18  他們用【蛇的方法】（ἐξαπατάω）誘惑人\n   ↓\n16:20  而那條【蛇】，快要被踩碎了</pre><p>★ 亮光四：「在<b>你們</b>腳下」</p><p>弟兄姊妹，注意保羅<b>沒有</b>說「在基督的腳下」。</p><p>他說：「在<b>你們</b>腳下。」</p><p>這與前面各章一致：</p><pre>5:17  「要在生命中【作王】」\n8:37  「已經【得勝有餘】了」\n16:20 「撒但……在【你們】腳下」</pre><p>★ 亮光五：「賜平安的神」</p><pre>15:33  「願【賜平安的神】常和你們眾人同在」\n16:20  「【賜平安的神】快要將撒但踐踏在你們腳下」</pre><p>弟兄姊妹，兩節連著看很有意思：</p><p>同一位「賜平安的神」——<br>一面<b>與你們同在</b>，一面<b>把撒但踩碎</b>。</p><p>平安不是消極的，是<b>得勝之後的平安</b>。</p><p>【第四段｜16:21–24　同工的問安】</p>","exp":"<p>弟兄姊妹，警告之後，保羅做了兩件事。</p><p>第一，他先肯定他們（16:19上）：「你們的<b>順服</b>已經傳於眾人。」</p><p>他不是在罵人。他是在保護一群本來就好的人。</p><p>第二，他給了一個很平衡的期待：</p><p>「在善上<b>聰明</b>，在惡上<b>愚拙</b>。」</p><p>而「愚拙」（ἀκέραιος）的字面是「<b>未經摻雜的</b>」——</p><p>主耶穌用同一個字：「靈巧像蛇，<b>馴良</b>（ἀκέραιοι）像鴿子。」（太10:16）</p><p>不是叫人變笨，是叫人<b>在惡的事上乾乾淨淨、不沾</b>。</p><p>然後是16:20——而這一節，緊接在16:18之後讀，才看得出保羅的安排：</p><pre>16:18  他們用【蛇的方法】（ἐξαπατάω ＝ 創3:13「那蛇引誘我」）\n   ↓\n16:20  而那條【蛇】，快要被【壓碎】（συντρίβω ＝ 創3:15「傷你的頭」）</pre><p><b>經文本身明確表達的：</b> 神很快要將撒但踐踏在信徒腳下。</p><p><b>可以合理推論的：</b> 保羅在信的最後，把讀者帶回<b>聖經最古老的那個應許</b>（創3:15）。<br>而他說的是「在<b>你們</b>腳下」，不是「在基督的腳下」——這與5:17「要在生命中作王」、8:37「得勝有餘」一致。</p><p><b>⚠ 講台誠信：</b> 「快要」（ἐν τάχει）不可用來推算任何時間表。保羅的重點是<b>確定性</b>，不是時刻表。</p>"},{"a":21,"z":24,"star":true,"grk":"<p>21 Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.<br>22 ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.<br>23 ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ὅλης τῆς ἐκκλησίας. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.</p>","lit":"<p>21「我的<b>同工</b>提摩太問你們安；我的親屬路求、耶孫、所西巴德也問你們安。」<br>22「<b>我，德丟——就是那寫下這封信的</b>——在主裡問你們安。」<br>23「該猶問你們安——他是<b>我的東道主，也是全教會的</b>。城裡的<b>財務管理者</b>以拉都，和弟兄括土，問你們安。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>問你們安</td><td>ἀσπάζεται</td><td>aspazetai</td><td>G782</td><td><b>直說語氣</b>：某人問你們安（↔ 16:3–16的<b>命令語氣</b>）</td></tr><tr><td>代筆寫信的</td><td>ὁ γράψας τὴν ἐπιστολήν</td><td>—</td><td>G1125</td><td><b>那寫下這封信的</b></td></tr><tr><td>接待</td><td>ξένος</td><td>xenos</td><td>G3581</td><td><b>主人／客人</b>（見下）</td></tr><tr><td>管銀庫的</td><td>οἰκονόμος τῆς πόλεως</td><td>oikonomos</td><td>G3623</td><td><b>城市的財務管理者</b></td></tr></table>","gram":"<p>★★ 亮光一：德丟的那一句（16:22）</p><p>「我這<b>代筆寫信的德丟</b>，在主裡面問你們安。」</p><p>弟兄姊妹，這是新約中極罕見的一句話：</p><p>一個代筆的人，在別人的信裡，<b>探出頭來說了一句話</b>。</p><p>想像那個場景：</p><p>保羅在口述。德丟在寫。</p><p>十六章。幾個小時，甚至幾天。</p><p>然後寫到問安的部分，保羅可能停了一下——</p><p>而德丟說：「我可以也問個安嗎？」</p><p>弟兄姊妹，保羅讓那個<b>幫他寫字的人</b>，</p><p>在他自己的書信裡，<b>留下名字</b>。</p><p>★ 亮光二：ξένος（16:23「接待」）</p><p>這個字很有意思：它同時可以指「<b>客人</b>」與「<b>主人</b>」。</p><p>在此指「<b>東道主</b>」。</p><p>而保羅說該猶不只接待他，還「接待<b>全教會</b>」——</p><p>意思可能是：教會在他家聚會。</p><p>（比較林前1:14：保羅提到他在哥林多為「該猶」施洗。）</p><p>★ 亮光三：以拉都——「城內管銀庫的」</p><p>οἰκονόμος τῆς πόλεως ——<b>城市的財務管理者</b>。</p><p>弟兄姊妹，這一節顯示：</p><p>在同一封信裡被問安的人當中，有奴隸出身的信徒，也有城市的公職人員。</p><p>（關於哥林多出土的「以拉都」鋪道銘文，見第二十部分——<b>學者有不同看法</b>。）</p><p>★ 亮光四：關於16:24</p><p>部分抄本在此有一節16:24（「願我主耶穌基督的恩常和你們眾人同在。阿們！」）。</p><p>多數現代學者認為這是抄寫員從16:20重複而來。</p><p>這不影響任何教義（16:20已有相同的話）。<br>講台上不必提。</p><p>【第五段｜16:25–27　★ 頌讚】</p>","exp":"<p>弟兄姊妹，這幾節看起來只是附帶的問安。</p><p>但這裡有兩件事值得停下來。</p><p>第一，語氣換了。</p><p>前面16:3–16是<b>命令語氣</b>（你們要去問他安）；<br>到了這裡是<b>直說語氣</b>（某某人問你們安）。</p><p>保羅在做的是<b>把兩邊接起來</b>：</p><p>哥林多這邊的同工，向羅馬那邊的弟兄姊妹問安。</p><p>第二，德丟那一句（16:22）。</p><p>在第一世紀，長信通常由<b>專業的代筆者</b>書寫。保羅口述，德丟一筆一筆地寫。</p><p>而寫到問安的部分——</p><p>這個代筆的人，<b>在別人的信裡探出頭來，說了一句話</b>。</p><p>而名單的組成也值得注意：</p><table><tr><th>人</th><th>身分</th></tr><tr><td>提摩太</td><td>保羅的<b>同工</b></td></tr><tr><td>德丟</td><td><b>代筆者</b></td></tr><tr><td>該猶</td><td><b>東道主</b>（教會可能在他家聚會）</td></tr><tr><td><b>以拉都</b></td><td><b>城內管銀庫的——公職人員</b></td></tr></table><p><b>經文本身明確表達的：</b> 保羅身邊的同工向羅馬教會問安；其中包括代筆的德丟。</p><p><b>可以合理推論的：</b> 保羅讓那個<b>幫他寫字的人</b>，在他自己的書信裡<b>留下名字</b>。<br>聖經的「無己」不是「消滅名字」，是「<b>不為自己爭名字，卻很認真地記得別人的名字</b>」。</p><p><b>關於第24節：</b> 部分抄本有此節，多數現代學者認為是抄寫員從16:20重複而來。<br>這不影響任何教義（16:20已有相同的話），講台上不必主動提；若被問，誠實說明這是抄本傳遞的正常現象。</p>"},{"a":25,"z":27,"star":true,"grk":"<p>25 Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,<br>26 φανερωθέντος δὲ νῦν διά τε γραφῶν προφητικῶν κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,<br>27 μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>25「願榮耀歸與<b>那位能使你們站穩的</b>——照著我所傳的福音、所宣講的耶穌基督，照著那<b>永古被保持沉默的奧祕</b>的啟示；」<br>26「這奧祕<b>如今卻已顯露出來</b>，並且照著永生神的命令，藉著<b>眾先知的書</b>，向<b>萬國</b>顯明，為要使他們<b>信心的順服</b>——」<br>27「願榮耀，<b>藉著耶穌基督</b>，歸與<b>獨一智慧的神</b>，直到永遠。阿們。」</p><p>（附註：25–27節在原文是<b>一個很長的句子</b>，主要動詞在27節的頌讚上；中文譯本為求可讀，作了拆分。）</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>堅固</td><td>στηρίξαι</td><td>stērixai</td><td>G4741</td><td><b>使之站穩、扶立</b>（<b>1:11同字！</b>）</td></tr><tr><td>隱藏不言</td><td>σεσιγημένου</td><td>sesigēmenou</td><td>G4601</td><td><b>σιγάω ＝ 保持沉默</b>（完成被動分詞）</td></tr><tr><td>奧祕</td><td>μυστήριον</td><td>mystērion</td><td>G3466</td><td><b>從前隱藏、如今被啟示的</b>（11:25同字）</td></tr><tr><td>顯明</td><td>φανερωθέντος</td><td>phanerōthentos</td><td>G5319</td><td><b>被顯露出來</b>（<b>3:21同字！</b>）</td></tr><tr><td>信服真道</td><td>εἰς ὑπακοὴν πίστεως</td><td>—</td><td>—</td><td><b>以致於信心的順服</b>（<b>1:5同詞組！</b>）</td></tr><tr><td>獨一全智</td><td>μόνῳ σοφῷ</td><td>monō sophō</td><td>G3441/G4680</td><td><b>獨一智慧的</b></td></tr></table>","gram":"<p>★★ 亮光一：στηρίζω ——第一章那個字</p><pre>1:11   「因為我切切地想見你們，要把些屬靈的恩賜分給你們，\n        使你們可以【堅固】（στηριχθῆναι）」\n   ↓ 十六章\n16:25  「【惟有神能】……【堅固】（στηρίξαι）你們的心」</pre><p>弟兄姊妹，這是全卷書最動人的一組呼應：</p><p>第一章：「<b>我想去</b>堅固你們。」</p><p>第十六章：「<b>惟有神能</b>堅固你們的心。」</p><p>那是<b>一卷書的距離</b>。</p><p>★★ 亮光二：εἰς ὑπακοὴν πίστεως ——全卷書的框</p><p>這個詞組在羅馬書<b>只出現兩次</b>：</p><pre>1:5    「在萬國之中叫人為他的名【信服真道】」\n16:26  「指示萬國的民，使他們【信服真道】」</pre><p>弟兄姊妹，保羅用同一個詞組，把整卷書<b>框起來</b>。</p><p>十六章的神學，一頭一尾寫著同一句話：</p><p>「<b>信心的順服</b>」。</p><p>★ 亮光三：φανερόω ——第三章那個字</p><pre>3:21   「但如今，神的義在律法以外已經【顯明】（πεφανέρωται）出來」\n16:26  「這奧祕如今【顯明】（φανερωθέντος）出來」</pre><p>★ 亮光四：σιγάω ——「那個奧祕沉默了很久」</p><p>「永古<b>隱藏不言</b>的奧祕」——σεσιγημένου，字面是「<b>被保持沉默</b>」。</p><p>弟兄姊妹，這個字很美：</p><p>那個奧祕，<b>安靜了好幾個世代</b>。</p><p>然後——如今顯明出來了。</p><p>★ 亮光五：最後一個介詞短語</p><p>「願榮耀<b>因耶穌基督</b>（διὰ Ἰησοῦ Χριστοῦ）歸與獨一全智的神。」</p><p>弟兄姊妹，這與11:36完全一致：</p><p>11:36「因為萬有都是<b>本於他，倚靠他，歸於他</b>。願榮耀歸給他。」</p><p>榮耀歸給神——<b>而通道是耶穌基督</b>。</p>","exp":"<p>弟兄姊妹，羅馬書的最後三節，把整卷書收攏了：</p><pre>「惟有神能堅固你們」（16:25）    ← 呼應 1:11\n「照我所傳的福音」（16:25）      ← 呼應 1:1、1:16\n「奧祕如今顯明」（16:25–26）     ← 呼應 3:21、11:25\n「藉眾先知的書」（16:26）        ← 呼應 1:2\n「使萬國信服真道」（16:26）      ← 呼應 1:5\n「願榮耀……歸與神」（16:27）     ← 呼應 11:36</pre><p>弟兄姊妹，這不是一個隨手寫的結尾。</p><p>這是一個<b>回到起點的結尾</b>。</p>"}]},"tracks":[{"id":"T1","gk":"οἰκέω","tr":"oikeō","gl":"居住、定居","code":"G3611","root":"οἶκος（房子）","head":"同一個字。不同的住客。","lv":"g","stops":[["7:17","罪住在我裡頭","dark"],["7:18","我裡頭沒有良善居住","dark"],["7:20","罪住在我裡頭","dark"],["8:9","神的靈住在你們心裡","light"],["8:11","叫耶穌復活者的靈住在你們心裡","light"]],"ins":"第七章到第八章的全部差別，就是住在裡面的那一位換了。"},{"id":"T2","gk":"λογίζομαι","tr":"logizomai","gl":"算、記帳","code":"G3049","root":"商業記帳用語","head":"神算 → 你算 → 我算","lv":"g","stops":[["4:3","神算亞伯拉罕為義（被動·直說）","light"],["6:11","你要算自己是死的（命令）","light"],["8:18","我算：苦楚比不上榮耀（保羅示範）","light"]],"ins":"保羅不只下命令，他自己也在算。"},{"id":"T3","gk":"κυριεύω","tr":"kyrieuō","gl":"作主、掌權","code":"G2961","root":"κύριος（主）","head":"四個主人，一個王座","lv":"g","stops":[["6:9","死不再作主了","dark"],["6:14","罪必不能作你們的主","dark"],["7:1","律法管人是在活著的時候","dark"],["14:9","基督作死人並活人的主","light"]],"ins":"羅馬書一路在拆掉各種「主」；而那個空出來的位置，有人坐上去了。"},{"id":"T4","gk":"βαστάζω","tr":"bastazō","gl":"扛起重量、承載","code":"G941","root":"也用於太8:17「擔當我們的疾病」","head":"你曾經是被扛的，所以現在換你去扛。","lv":"g","stops":[["11:18","不是你托著根，乃是根托著你","light"],["15:1","堅固的人應該擔代不堅固人的軟弱","light"]],"ins":"謙卑不是放棄力量，是改變力量的方向。"},{"id":"T5","gk":"παρίστημι","tr":"paristēmi","gl":"獻上、站在旁邊","code":"G3936","root":"παρά（旁邊）＋ἵστημι（站）","head":"現在獻上，將來站立。","lv":"g","stops":[["6:13","將自己獻給神","light"],["12:1","將身體獻上，當作活祭","light"],["14:10","我們都要站在神的臺前","light"],["16:2","你們就幫助她（站到她旁邊去）","light"]],"ins":"你現在獻上自己；將來你要站在祂面前。是同一個動作的兩個時態。"},{"id":"T6","gk":"χρηστότης／χρηστολογία","tr":"chrēstotēs / chrēstologia","gl":"恩慈／花言巧語","code":"G5544 / G5542","root":"同一個字根 χρηστός（良善的）","head":"字根一樣，性質相反。","lv":"g","stops":[["2:4","神的恩慈是領你悔改的","light"],["11:22","神的恩慈和嚴厲","light"],["16:18","用花言巧語誘惑那些老實人的心","dark"]],"ins":"假的東西，常常長得跟真的很像。"},{"id":"T7","gk":"ἐξαπατάω → συντρίβω","tr":"exapataō → syntribō","gl":"引誘 → 踐踏","code":"G1818 / G4937","root":"創3:13「那蛇引誘我」／創3:15「傷你的頭」","head":"蛇的方法，與蛇的結局。","lv":"g","stops":[["7:11","罪藉著誡命引誘我","dark"],["16:18","他們用花言巧語誘惑人","dark"],["16:20","賜平安的神快要將撒但踐踏在你們腳下","light"]],"ins":"那些離間的人用的是蛇的方法——而那條蛇，快要被踩碎了。"},{"id":"T8","gk":"ὅπλα","tr":"hopla","gl":"兵器、軍械","code":"G3696","root":"軍事用語","head":"肢體是兵器；而兵器要穿上身。","lv":"g","stops":[["6:13","將肢體作義的兵器獻給神","light"],["13:12","帶上光明的兵器","light"]],"ins":"第六章：你的肢體是兵器。第十三章：那些兵器要穿上身。"},{"id":"T9","gk":"εἰς ὑπακοὴν πίστεως","tr":"eis hypakoēn pisteōs","gl":"信服真道（信心的順服）","code":"G5218 / G4102","root":"全卷書僅兩次","head":"一頭，一尾。把整卷書框起來。","lv":"g","stops":[["1:5","在萬國之中叫人為他的名信服真道","light"],["16:26","指示萬國的民，使他們信服真道","light"]],"ins":"十六章的神學，一頭一尾寫著同一句話。"},{"id":"T10","gk":"στηρίζω","tr":"stērizō","gl":"堅固、使之站穩","code":"G4741","root":"","head":"一卷書的距離。","lv":"g","stops":[["1:11","要把恩賜分給你們，使你們可以堅固","dark"],["16:25","惟有神能堅固你們的心","light"]],"ins":"從「我想去堅固你們」到「惟有神能堅固你們」——那是一卷書的距離。"},{"id":"T11","gk":"διαστολή","tr":"diastolē","gl":"分別、劃界線","code":"G1293","root":"","head":"在罪面前沒有分別；在恩典面前也沒有分別。","lv":"g","stops":[["3:22","並沒有分別——因為眾人都犯了罪","dark"],["10:12","並沒有分別——因為眾人同有一位主","light"]],"ins":"全卷書最美的一組對稱。"},{"id":"T12","gk":"προσλαμβάνω","tr":"proslambanō","gl":"接納（接到自己這裡來）","code":"G4355","root":"πρός＋λαμβάνω","head":"神已經收了，那你憑什麼不收？","lv":"g","stops":[["14:1","你們要接納信心軟弱的","light"],["14:3","因為神已經收納他了","light"],["15:7","你們要彼此接納，如同基督接納你們一樣","light"]],"ins":"那個「如同」——祂接納你的那一天，你不是全對的。"}],"issues":[{"id":"ISS01","t":"羅七章的「我」是誰？","r":"7:14–25","ch":[7],"why":"7:7–13是過去式，7:14–25突然轉為現在式，而且一直維持到底。","pos":[["重生的信徒","奧古斯丁晚年、路德、加爾文","7:14–25全是現在式；7:22「由衷歡喜」↔8:7「不能服」"],["未重生的人","早期教父多數、Wesley","7:14「賣給罪」↔6:18「得了釋放」；7:23「被擄去」↔8:2「釋放了我」"],["修辭性的「我」＝亞當／以色列","Käsemann、Dunn、Wright","7:11 ἐξαπατάω ＝ 創3:13"],["任何靠律法追求聖潔的人","綜合性讀法","兩邊的論據都能解釋"]],"con":["靠自己守律法，結局就是7:24","出路不是一個方法，是一位（7:25；8:1–4）","那個掙扎本身是生命的證據——死人不會覺得痛"],"say":"歷代敬虔的解經家對這個「我」有不同看法。但兩邊都同意一件事：靠自己守律法，結局就是7:24。","care":"若把7:14–25全讀成未重生，會使正在掙扎的信徒懷疑自己的救恩。結尾必須給出第八章的方向。"},{"id":"ISS02","t":"預定與揀選","r":"9:6–24","ch":[9,8],"why":"9:11說「不在乎人的行為，乃在乎召人的主」；而9:32又說「他們不憑信心求」。","pos":[["預知＝揀選之愛","改革宗","受詞是人（οὕς），不是他們的信；舊約 יָדַע 常帶揀選之愛（摩3:2；耶1:5）"],["預知＝預見人的信","亞米念／衛斯理傳統","προγινώσκω 字面即「預先知道」；保羅在10:9–13強調人的回應"]],"con":["這條鏈子的每一環，主詞都是神","沒有一環是靠我完成的","人必須真實地相信與回應（10:9–13）"],"say":"歷代敬虔的信徒在「預知」的意思上有不同看法。但兩邊都同意：這條鏈子的每一環，主詞都是神。","care":"★ 9:22–23的原文語法是不對稱的：毀滅用被動式且未指明施動者，榮耀用主動式且主詞是神。保羅刻意沒有把兩邊講成對稱。"},{"id":"ISS03","t":"「以色列全家都要得救」","r":"11:26","ch":[11],"why":"9:6說「從以色列生的不都是以色列人」；11:26卻說「以色列全家都要得救」。","pos":[["未來民族性的歸主","時代論與部分改革宗","本章的「以色列」一貫指血統上的以色列；11:12「豐滿」、11:15「收納」"],["歷世歷代蒙揀選的猶太人之總數","部分改革宗","οὕτως 的基本意義是「方式」而非「時間」；與11:5「餘數」一致"],["「以色列」＝神的子民（含教會）","加爾文等","9:6；加6:16「神的以色列」"]],"con":["神沒有棄絕祂的百姓（11:1）","神的恩賜和選召是沒有後悔的（11:29）","無論哪一種，11:18的警告都一樣：你不可向舊枝子誇口"],"say":"這一節歷代有不同的理解。但無論哪一種，保羅要對外邦信徒說的話都是同一句：不可自高。","care":"❌❌ 本章講的是救恩歷史，不是現代政治。絕不可用它為任何當代政權背書或攻擊。"},{"id":"ISS04","t":"順服掌權者的界線","r":"13:1–7","ch":[13],"why":"13:1說「人人當順服」；而徒5:29說「順從神，不順從人，是應當的」。","pos":[["順服為原則，抗命為例外","多數福音派的共識","當政權命令犯罪或禁止順服神時，必須不從，但仍承受後果"],["次級官長論","加爾文《要義》IV.20.31","個人不可造反，但較低層級的合法官長有責任抵抗上級的暴政"],["和平主義／不合作","重洗派傳統","抗命必須以非暴力的方式"]],"con":["13:3–4是功能性的描述：賞善、罰惡——那既是政府的職分，也是衡量它的標準","保羅用的字是 ὑποτάσσω（順服秩序），不是 ὑπακούω（凡事照做）","寫13:1的保羅自己曾據理力爭（徒16:37）、提出公民權（徒22:25）、上告凱撒（徒25:11）"],"say":"這段經文教導我們順服神所排定的秩序；但同一本聖經也說：「順從神，不順從人，是應當的。」（徒5:29）","care":"❌❌ 歷史上這段經文曾被用來為奴隸制度、種族隔離、極權政權背書。絕不可為任何特定的當代政權背書或攻擊。"},{"id":"ISS05","t":"可爭議之事的界線在哪？","r":"14:1–23","ch":[14,15],"why":"羅14說「你們要接納」；而加2:11保羅當面抵擋彼得，林前5說「把那惡人趕出去」。","pos":[["福音的核心真理","絕不讓步","加2:11–14；加1:8–9「就應當被咒詛」"],["明顯而不悔改的罪","必須處理","林前5:1–13「把那惡人從你們中間趕出去」"],["可爭議的事","接納、不論斷、為弟兄放下","羅14；羅15:7；林前8–10"]],"con":["判準之一：在這件事上持不同看法的人，是否仍然「為主」而行、並「感謝神」（14:6）","羅16:17的判準是「背乎所學之道」＋「只服事自己的肚腹」，不是「跟我意見不同」","寧可在界線的判斷上謙卑，也不要輕易把弟兄推出去"],"say":"保羅有三種處理方式：核心真理絕不讓步；明顯的罪必須處理；而可爭議的事——接納。","care":"不宜在講台上點名具體爭議，會使會眾對號入座，反而製造新的分裂。"},{"id":"ISS06","t":"非比與猶尼亞","r":"16:1、16:7","ch":[16],"why":"16:1稱非比為 διάκονος；16:7說猶尼亞「在使徒中是有名望的」。","pos":[["猶尼亞是女性","今日多數學者的判斷","「Junia」是常見的女性名；作為男性名的「Junias」在古代文獻中幾乎沒有證據；屈梭多模明確視為女性"],["「在使徒中間是有名望的」","一種讀法","他們本身是使徒（和合本較接近此讀法）"],["「為使徒們所熟知的」","另一種讀法","他們不是使徒，但使徒們都認識他們"]],"con":["非比在堅革哩教會中有實際的服事地位","她很可能是送這封信的人（16:1–2是推薦信的格式）","保羅高度尊重她們，並且記得她們做過什麼","安多尼古與猶尼亞是保羅的親屬、與他一同坐監、比他更早在基督裡"],"say":"猶尼亞很可能是一位女性；而她與安多尼古「在使徒中是有名望的」——這句話的確切意思，敬
