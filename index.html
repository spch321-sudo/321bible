at God may be glorified</td></tr></table>","gram":"<p><b>★ First light: proslambanō ties the whole section together</b></p><pre>14:1  ACCEPT (προσλαμβάνεσθε) the one weak in faith\n14:3  for God has ACCEPTED (προσελάβετο) him\n  ↓\n15:7  ACCEPT (προσλαμβάνεσθε) one another,\n      just as Christ ACCEPTED (προσελάβετο) you</pre><p>The same word, four times. And 15:7 is the climax: <b>it is at once the command and the ground of the command.</b></p><p><b>★★ Second light: that “just as” (kathōs)</b></p><p>This is the heart of the whole section.</p><p>Paul does <b>not</b> say, “accept one another as much as you can.”<br>He says: <b>“just as Christ accepted you.”</b></p><p>And that “just as” forces a question:</p><p><b>On the day Christ accepted you — were you entirely right?<br>Was your theology all correct? Was your conscience clean?<br>Was your judgement mature on every question?</b></p><p><b>If not — then you know how wide the standard of that “just as” is.</b></p><p><b>★ Third light: the purpose is “to the glory of God”</b></p><p>εἰς δόξαν τοῦ θεοῦ — note the causal chain: <b>accept one another → God is glorified.</b></p><p>And the reverse also holds:</p><p><b>When a church divides over a disputable matter, what is lost is not merely peace. It is the glory of God.</b></p>","exp":"<p>15:7 is the <b>climax</b> of the whole section, 14:1–15:13. And προσλαμβάνω (accept) occurs four times across it.</p><p><b>What the text plainly says:</b> accept one another; the standard and the ground is that “Christ accepted you”; and the purpose is that God may be glorified.</p><p><b>What may fairly be drawn from it:</b> the weight of the sentence falls not on the verb but on the two words in the middle — <b>“just as” (καθώς)</b>.</p><p>And that “just as” forces a question:</p><p><b>On the day Christ accepted you — were you entirely right? Was your theology correct? Was your conscience clean?<br>If not — then you know how wide the standard of that “just as” is.</b></p><p><b>⚠ Pulpit note:</b> the scope of 15:7 is <b>disputable matters</b>, not everything. Paul himself draws the line in 16:17: “those who cause divisions… <b>contrary to the teaching you learned</b>… turn away from them.”<br>(For the full account of the three modes, see the disputed material.)</p>"},{"a":8,"z":9,"star":true,"grk":"<p>8 λέγω γὰρ Χριστὸν διάκονον γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,</p>","lit":"<p>8 “For I say that Christ became <b>a servant of the circumcision</b> <b>for the sake of God’s truthfulness</b>, in order to <b>confirm</b> (make legally effective) <b>the promises given to the fathers</b>;”</p><p>9a “and that the <b>Gentiles might glorify God for his mercy</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>servant</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td><b>servant, minister</b> (the word of 13:4 and 16:1)</td></tr><tr><td>to confirm</td><td>βεβαιῶσαι</td><td>bebaiōsai</td><td>G950</td><td><b>to make firm, to establish</b> (the root of βέβαιος in 4:16)</td></tr><tr><td>mercy</td><td>ἔλεος</td><td>eleos</td><td>G1656</td><td><b>mercy</b> (the root of ἐλεέω in 11:30–32)</td></tr></table>","gram":"<p><b>★ First light: two groups, two different reasons</b></p><p>Notice that Paul gives <b>different reasons</b> for the two groups:</p><table><tr><th>To whom</th><th>The reason</th></tr><tr><td><b>Jews</b></td><td>for God’s <b>truthfulness</b> — to <b>confirm the promises made to the fathers</b></td></tr><tr><td><b>Gentiles</b></td><td>because of his <b>mercy</b></td></tr></table><p>The distinction is exquisitely fine:</p><p><b>Jews receive grace because God keeps covenant</b> (he made promises to their fathers).<br><b>Gentiles receive grace because God is merciful</b> (he never promised us anything).</p><p>And these two correspond precisely to the two prides in the Roman church:</p><pre>a Jewish believer may think:   we are the ones with the promises\n  → Paul says: yes — and Christ came precisely to [CONFIRM] those promises\na Gentile believer may think:  God has set them aside\n  → Paul says: you are here purely by [MERCY]</pre><p><b>★ Second light: bebaioō — the root from chapter 4</b></p><pre>4:16   “that the promise might be SURE (βέβαιος) to all the offspring”\n15:8   “to CONFIRM (βεβαιῶσαι) the promises made to the fathers”</pre><p>And βέβαιος is <b>a legal term</b>: <b>a guarantee with binding force</b>.</p><p><b>Christ came so that the promises God made to the fathers would take legal effect.</b></p><p><b>★ Third light: “a servant of the circumcision”</b></p><p>This clause matters. Paul is speaking to Gentile believers (11:13; 15:15–16), and he reminds them: <b>Christ became a servant of the Jews.</b></p><p>(Which is entirely consistent with 11:18, “it is not you who support the root, but the root that supports you.”)</p>","exp":"<p>Verses 8–9 do something very finely calibrated: <b>Paul gives two groups two different reasons.</b></p><p><b>What the text plainly says:</b> Christ became a servant of the circumcision to confirm the promises to the fathers; and at the same time so that the Gentiles would glorify God for his mercy.</p><p><b>What may fairly be drawn from it:</b> this is not ranking one above the other. It is dealing with <b>the pride on each side</b> —</p><p>To Jewish believers: yes, the promises were made to your fathers — <b>and Christ came precisely to confirm them</b>.<br>To Gentile believers: <b>you are here purely by mercy</b>.</p><p>And “confirm” (βεβαιόω) is <b>a legal term</b>: a guarantee that has binding force. Its adjective βέβαιος is the very word of 4:16, “that the promise might be <b>sure</b> to all the offspring.”</p><p><b>Christ came so that the promises God made to the fathers would take legal effect.</b></p>"},{"a":9,"z":12,"star":true,"grk":"<p>9b …διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσιν καὶ τῷ ὀνόματί σου ψαλῶ. 10 …εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ. 11 …αἰνεῖτε, πάντα τὰ ἔθνη, τὸν κύριον καὶ ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί. 12 …ἔσται ἡ ῥίζα τοῦ Ἰεσσαὶ καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν, ἐπ' αὐτῷ ἔθνη ἐλπιοῦσιν.</p>","lit":"<p>9b “As it is written: ‘Therefore I will <b>confess you among the Gentiles</b>, and <b>sing to your name</b>.’”</p><p>10 “And again: ‘<b>Rejoice, you Gentiles, with his people.</b>’”</p><p>11 “And again: ‘<b>Praise the Lord, all you Gentiles; let all the peoples extol him.</b>’”</p><p>12 “And again, Isaiah says: ‘There shall be <b>the root of Jesse</b>, and <b>he who arises to rule the Gentiles</b>; <b>in him the Gentiles will hope</b>.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>confess</td><td>ἐξομολογήσομαι</td><td>exomologēsomai</td><td>G1843</td><td><b>to acknowledge publicly, to give thanks</b></td></tr><tr><td>rejoice</td><td>εὐφράνθητε</td><td>euphranthēte</td><td>G2165</td><td>rejoice (imperative)</td></tr><tr><td>the root of Jesse</td><td>ἡ ῥίζα τοῦ Ἰεσσαί</td><td>—</td><td>G4491</td><td><b>the name of David’s father</b> — i.e. David’s offspring</td></tr><tr><td>will hope</td><td>ἐλπιοῦσιν</td><td>elpiousin</td><td>G1679</td><td><b>to set their hope on him</b></td></tr></table>","gram":"<p><b>★ First light: the spread of the four quotations</b></p><table><tr><th>Reference</th><th>Quoted from</th><th>Section of the OT</th><th>Key phrase</th></tr><tr><td>15:9</td><td>Psalm 18:49</td><td>Psalms / history</td><td>“<b>among the Gentiles</b> I will confess you”</td></tr><tr><td>15:10</td><td>Deuteronomy 32:43</td><td><b>the Law</b></td><td>“Gentiles, rejoice <b>with his people</b>”</td></tr><tr><td>15:11</td><td>Psalm 117:1</td><td>Psalms</td><td>“<b>you Gentiles</b>, praise the Lord”</td></tr><tr><td>15:12</td><td>Isaiah 11:10</td><td><b>the Prophets</b></td><td>“<b>the Gentiles</b> will hope in him”</td></tr></table><p>Paul draws his evidence from <b>the Law, the Prophets and the Psalms</b> — the three great divisions of what a Jew meant by “the Scriptures.”<br>(Compare Luke 24:44, “the Law of Moses, the Prophets and the Psalms.”)</p><p>What he means to prove is: <b>Gentile inclusion is not news. It was the plan of the Old Testament from beginning to end.</b></p><p><b>★ Second light: the progression across the four quotations</b></p><pre>15:9   “AMONG the Gentiles”         —  I praise God in their midst\n15:10  “WITH his people”            —  the two groups are together\n15:11  “YOU Gentiles, praise”       —  they open their own mouths\n15:12  “the Gentiles WILL HOPE in him” —  their hope rests on him</pre><p>It is a steady drawing near: from “in their midst” → “together with them” → “they praise for themselves” → “they hope in him.”</p><p><b>★ Third light: “the root of Jesse” in 15:12</b></p><p>Quoted from Isaiah 11:10. Jesse was David’s father, so “the root of Jesse” = <b>David’s offspring</b> (compare Revelation 22:16, “I am the root and the offspring of David”).</p><p>And this answers exactly to the opening of the letter:</p><pre>1:3    “concerning his Son… born of the SEED OF DAVID according to the flesh”\n15:12  “there shall be the ROOT OF JESSE… in him the Gentiles will hope”</pre>","exp":"<p>To prove that Gentile inclusion is not news, Paul quotes <b>four Old Testament passages</b> in a row. And their <b>distribution</b> is deliberate.</p><p><b>What the text plainly says:</b> that Gentiles praise God together with his people is the united testimony of the Law, the Prophets and the Psalms.</p><p><b>What may fairly be drawn from it:</b> Paul takes his evidence from <b>each of the three divisions of what a Jew called “the Scriptures.”</b></p><p>What he means to prove is: <b>Gentile inclusion is not news. It was the plan of the Old Testament from beginning to end.</b></p>"},{"a":13,"z":13,"star":true,"grk":"<p>ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.</p>","lit":"<p>“May <b>the God of hope</b> <b>fill</b> you with all joy and peace in believing, so that you may <b>overflow</b> in hope, by <b>the power of the Holy Spirit</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>fill</td><td>πληρώσαι</td><td>plērōsai</td><td>G4137</td><td><b>optative: may he fill</b></td></tr><tr><td>abound</td><td>περισσεύειν</td><td>perisseuein</td><td>G4052</td><td><b>to overflow</b> (the root of 5:15)</td></tr><tr><td>power</td><td>δύναμις</td><td>dynamis</td><td>G1411</td><td><b>power</b> (the word of 1:16, “the power of God”)</td></tr></table>","gram":"<p><b>★ First light: another optative</b></p><p>As in 15:5, πληρώσαι is <b>optative</b> — <b>“may he fill.”</b></p><p><b>Joy, peace, hope — none of them is something I squeeze out of myself.</b></p><p><b>★ Second light: the full version of 14:17</b></p><pre>14:17  “the kingdom of God is… RIGHTEOUSNESS, PEACE, and JOY IN THE HOLY SPIRIT”\n  ↓\n15:13  “fill you with all JOY and PEACE… that you may abound in HOPE\n        by the POWER OF THE HOLY SPIRIT”</pre><p>14:17 listed what the kingdom of God consists in;<br>15:13 asks God to <b>fill them with those very things</b>.</p><p><b>★ Third light: perisseuō — to overflow</b></p><p>We met this word in 5:15 (“abounded to the many”). The picture is <b>poured until it runs over</b>.</p><p>Paul does not pray for “a little hope.” He prays for <b>hope overflowing</b>.</p><p><b>★ Fourth light: the second of three names for God</b></p><pre>15:5   the God of [ENDURANCE AND ENCOURAGEMENT]\n15:13  the God of [HOPE]     ← this verse\n15:33  the God of [PEACE]</pre>","exp":"<p>15:13 is <b>the closing blessing</b> of the whole practical section (chapters 12–15). And its content is worth noticing.</p><p>Paul does <b>not</b> pray, “may you all come to agree.”<br>What he prays for is: <b>joy, peace, hope.</b></p><p>Because a people who have joy and peace and hope — <b>are much less likely to quarrel about food.</b></p>"},{"a":14,"z":16,"star":true,"grk":"<p>16 εἰς τὸ εἶναί με λειτουργὸν Χριστοῦ Ἰησοῦ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.</p>","lit":"<p>14 “Brothers, <b>I myself am convinced</b> about you: that you are <b>full of goodness</b>, <b>filled with all knowledge</b>, and <b>able to admonish one another</b>.”</p><p>15 “But I have written to you <b>rather boldly</b>, <b>to remind you again</b>, because of the grace given me by God —”</p><p>16 “that I should be <b>a minister of Christ Jesus to the Gentiles</b>, <b>serving as a priest the gospel of God</b>, so that <b>the offering of the Gentiles might be acceptable</b>, <b>sanctified by the Holy Spirit</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>admonish</td><td>νουθετεῖν</td><td>nouthetein</td><td>G3560</td><td>νοῦς + τίθημι: <b>to put something into the mind</b></td></tr><tr><td>minister</td><td>λειτουργός</td><td>leitourgos</td><td>G3011</td><td><b>a priestly minister</b> (the word of 13:6)</td></tr><tr><td>serving as a priest</td><td>ἱερουργοῦντα</td><td>hierourgounta</td><td>G2418</td><td><b>to perform priestly service</b> (<b>only here in the NT</b>)</td></tr><tr><td>offering</td><td>προσφορά</td><td>prosphora</td><td>G4376</td><td><b>an offering, a sacrifice</b></td></tr><tr><td>sanctified</td><td>ἡγιασμένη</td><td>hēgiasmenē</td><td>G37</td><td><b>set apart as holy</b> (perfect passive participle)</td></tr></table>","gram":"<p><b>★ First light: the humility of 15:14</b></p><p>Paul has written fifteen chapters of the most rigorous argument. And then he says:</p><p><b>“I myself am convinced about you, that you are full of goodness… and able to admonish one another.”</b></p><p>He does not say “you understand nothing.”<br>He says: <b>you already know this; I am only reminding you</b> (15:15).</p><p><b>★★ Second light: three temple words stacked into one verse</b></p><pre>λειτουργός —  a priestly minister\nἱερουργέω  —  to perform priestly service (only here in the NT)\nπροσφορά   —  an offering</pre><p><b>Paul regards preaching the gospel as an act of sacrifice.</b><br>He himself is <b>the priest</b>; and the offering on the altar is — <b>the people who have come to the Lord</b>.</p><p><b>★ Third light: the echo of 12:1</b></p><pre>12:1   “PRESENT (παραστῆσαι) your BODIES a LIVING SACRIFICE”  —  believers offer themselves\n15:16  “that the OFFERING (προσφορά) of the Gentiles… may be acceptable”  —  Paul offers them</pre><p><b>★ Fourth light: on what grounds is the offering received?</b></p><p>“<b>Sanctified by the Holy Spirit</b>” — <b>a perfect passive participle</b>.</p><p><b>Not because the offering is good in itself, but because the Holy Spirit has already set it apart.</b></p>","exp":"<p>Verse 14 shows Paul’s humility.</p><p>He has written fifteen chapters of the tightest theology in Scripture, and then says: <b>“I myself am convinced about you, that you are full of goodness… and able to admonish one another.”</b></p><p>He does not say, “you know nothing, so let me teach you.” He says: <b>you already understand this; I am only jogging your memory.</b></p><p><b>What the text plainly says:</b> Paul acknowledges the Roman believers’ own goodness and knowledge; he writes out of the grace given him, which made him a priestly minister to the Gentiles.</p><p><b>What may fairly be drawn from it:</b> 15:16 stacks <b>three temple words into a single verse</b> — λειτουργός (a priestly minister) + ἱερουργέω (to perform priestly service, <b>only here in the NT</b>) + προσφορά (an offering).</p><p><b>Paul sees preaching the gospel as an act of sacrifice: he is the priest, and the offering on the altar is the people who have come to the Lord.</b></p><p><b>⚠ And the last clause matters most:</b> “sanctified by the Holy Spirit” is <b>a perfect passive participle</b> —</p><p><b>that offering is received not because it is good in itself, but because someone has set it apart.</b></p>"},{"a":17,"z":21,"star":false,"grk":"<p>18 οὐ γὰρ τολμήσω τι λαλεῖν ὧν οὐ κατειργάσατο Χριστὸς δι' ἐμοῦ εἰς ὑπακοὴν ἐθνῶν…</p>","lit":"<p>18 “For I <b>will not dare</b> to speak of anything <b>except what Christ has accomplished through me</b>, to bring the Gentiles to <b>obedience</b> — by word and deed.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>boasting</td><td>καύχησις</td><td>kauchēsis</td><td>G2746</td><td><b>boasting</b> (the root of 3:27, “boasting is excluded”)</td></tr><tr><td>I will not dare</td><td>οὐ τολμήσω</td><td>ou tolmēsō</td><td>G5111</td><td><b>I will not dare</b> (the root of “boldly” in 15:15)</td></tr><tr><td>obedience of the Gentiles</td><td>εἰς ὑπακοὴν ἐθνῶν</td><td>—</td><td>G5218</td><td><b>the obedience of the Gentiles</b> (the phrase of 1:5 and 16:26)</td></tr></table>","gram":"<p><b>★ First light: the tension of 15:17–18 — “I have something to boast of” and “I dare mention nothing”</b></p><p>These two verses read together are striking.</p><p>15:17 says: <b>“I have something to boast of.”</b></p><p>And 15:18 immediately adds: <b>“except what Christ has accomplished through me, I dare mention nothing.”</b></p><p>Paul does <b>not</b> pretend he has done nothing. <b>He simply makes clear who did it.</b></p><p>And καύχησις (boasting) is the very word of 3:27:</p><pre>3:27   “where then is boasting? [IT IS EXCLUDED]”      —  in justification, none\n15:17  “I HAVE something to boast of in Christ Jesus”  —  in service, yes; but only in what he did</pre><p><b>This is the most exact calibration of “let Jesus receive all the glory”:<br>not to deny the fruit, but to name its author rightly.</b></p><p><b>★ Second light: tolmaō — “I will not dare”</b></p><p>In 15:15 Paul says he has written “rather <b>boldly</b>” (τολμηρότερον); in 15:18 he says “I <b>dare</b> not mention anything” (οὐ τολμήσω).</p><p>The same root, pointing two ways:</p><p><b>When it comes to God’s word — he is bold.<br>When it comes to his own achievements — he does not dare.</b></p><p><b>★ Third light: eis hypakoēn ethnōn — the frame of the letter appears once more</b></p><pre>1:5    for [OBEDIENCE OF FAITH] among all the [NATIONS]\n15:18  to bring the [GENTILES] to [OBEDIENCE]\n16:26  made known to all the [NATIONS] for [OBEDIENCE OF FAITH]</pre><p><b>Paul’s aim in ministry did not change from chapter 1 to chapter 16.</b></p><p><b>★ Fourth light: where is Illyricum? (15:19)</b></p><p>“From Jerusalem, all the way round to <b>Illyricum</b>” —</p><table><tr><th>Place</th><th>Position</th></tr><tr><td><b>Jerusalem</b></td><td>the <b>eastern edge</b> of Paul’s missionary map</td></tr><tr><td><b>Illyricum</b></td><td>the eastern shore of the Adriatic, roughly the western Balkans today — the <b>north-western limit</b> Paul had reached</td></tr></table><p>And 15:24, 28 say he intends to go to <b>Spain</b> — very nearly the <b>western edge</b> of the world as then known.</p><p><b>Paul’s map runs: from Jerusalem to both ends of the earth.</b></p><p>(Acts records no mission of Paul in Illyricum; it is generally understood that he reached its borders. From the pulpit it is better to say “his steps had reached that region” than to give a precise itinerary.)</p><p><b>★ Fifth light: philotimeomai — “I make it my ambition”</b></p><p>Only three times in the New Testament: Romans 15:20; 2 Corinthians 5:9; 1 Thessalonians 4:11.</p><p>The word is φίλος (to love) + τιμή (honour) — <b>not “I intend to,” but “I pursue this as my honour.”</b></p><p><b>★ Sixth light: allotrios — the word from chapter 14</b></p><pre>14:4   “who are you to judge ANOTHER MAN’S (ἀλλότριον) servant?”\n15:20  “lest I build on ANOTHER MAN’S (ἀλλότριον) foundation”</pre><p>Paul has a fine sense of what belongs to others: <b>he does not manage another man’s servant, and he does not build on another man’s foundation.</b></p><p><b>★ Seventh light: 15:21 quotes Isaiah 52:15</b></p><p>And Isaiah 52:15 is <b>the opening of the Servant Song</b> (Isaiah 52:13–53:12).</p><p><b>Paul grounded his vision for reaching the unreached in Isaiah 53.</b></p>","exp":"<p>Verses 17 and 18 read together form an important tension.</p><p>15:17 says: <b>“I have something to boast of.”</b><br>15:18 immediately adds: <b>“except what Christ has accomplished through me, I dare mention nothing.”</b></p><p><b>What the text plainly says:</b> Paul has something to boast of in his ministry, but he speaks only of what Christ did through him; and his ambition is to preach where Christ is not named.</p><p><b>What may fairly be drawn from it:</b> Paul does <b>not</b> pretend he has done nothing — <b>he simply makes clear who did it.</b></p><p>And καύχησις is the very word of 3:27, “where then is boasting? <b>It is excluded.</b>”</p><p>In <b>justification</b>, there is nothing to boast of (3:27).<br>In <b>service</b>, there is — but only in <b>what he did</b> (15:17–18).</p><p><b>This is the most exact calibration of “let Jesus receive all the glory”: not to deny the fruit, but to name its author rightly.</b></p><p>And “I make it my ambition” in verse 20 (φιλοτιμέομαι = φίλος love + τιμή honour) is <b>not “I intend to,” but “I pursue this as my honour.”</b></p><p><b>⚠ Pulpit note:</b> 15:20 <b>must not</b> be used to pass judgement on other people’s ministry arrangements (“you may not plant a church where one already exists”). Paul is describing <b>his own calling</b>: he himself was planning to go to Rome (where a church already existed); he left Timothy in Ephesus; and Apollos watered in Corinth after him.</p>"},{"a":22,"z":29,"star":false,"grk":"<p>25 νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις. 28 τοῦτο οὖν ἐπιτελέσας καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον…</p>","lit":"<p>25 “But now I am going to Jerusalem, <b>serving</b> the saints.”</p><p>28 “So when I have completed this, and have <b>sealed to them this fruit</b>, I shall go on by way of you to Spain.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>hindered</td><td>ἐνεκοπτόμην</td><td>enekoptomēn</td><td>G1465</td><td><b>to have one’s road cut</b> (a military term: breaking up a road to block an enemy)</td></tr><tr><td>sent on</td><td>προπεμφθῆναι</td><td>propemphthēnai</td><td>G4311</td><td><b>to be sent on the way, supplied for a journey</b></td></tr><tr><td>serving</td><td>διακονῶν</td><td>diakonōn</td><td>G1247</td><td><b>serving</b> (the verb form of διάκονος)</td></tr><tr><td>contribution</td><td>κοινωνία</td><td>koinōnia</td><td>G2842</td><td><b>fellowship, sharing, having a part in</b></td></tr><tr><td>debtors</td><td>ὀφειλέται</td><td>opheiletai</td><td>G3781</td><td><b>those who owe</b> (the root of 15:1 and 13:8)</td></tr><tr><td>sealed</td><td>σφραγισάμενος</td><td>sphragisamenos</td><td>G4972</td><td><b>sealed up</b> (the root of “seal” in 4:11)</td></tr></table>","gram":"<p><b>★ First light: enkoptō (15:22, “hindered”) — to have the road cut</b></p><p>The word is <b>military</b>: to break up a road, to cut a line of communication so that an enemy cannot advance.</p><p>Paul uses it elsewhere:</p><p><b>1 Thessalonians 2:18:</b> “but <b>Satan hindered</b> us.”<br><b>Galatians 5:7:</b> “You were running well. Who <b>hindered</b> you?”</p><p>Note that 15:22 is <b>imperfect passive</b> — <b>“I was hindered, again and again.”</b></p><p><b>This was not one delay. It was years.</b></p><p>And what was his response? 15:23: <b>“But now…”</b> — <b>he goes on planning.</b></p><p><b>★ Second light: Paul’s map in 15:23–24</b></p><pre>[NOW] Corinth\n  ↓\nJerusalem (15:25) —  to deliver the collection, knowing there is danger there (15:31)\n  ↓\nRome (15:24, 28)  —  “to enjoy your company for a while”\n  ↓\nSpain (15:24, 28) —  the western edge of the world as then known</pre><p>And 15:24 contains a very courteous but very concrete request: <b>“and be sent on my way by you.”</b><br>(προπέμπω is the technical term for missionary support; see the fourth light below.)</p><p><b>Rome was not Paul’s destination. It was a stop along the way.</b><br>Where he was really going was <b>the places no one had yet been</b> (15:20–21).</p><p><b>★ Third light: diakoneō (15:25, “serving”) — the same family as 15:16</b></p><p>“I am going to Jerusalem <b>serving</b> the saints” — διακονῶν.</p><p>And in 15:16 Paul calls himself a <b>minister</b> of Christ Jesus (λειτουργός); in 15:27 he uses λειτουργῆσαι (to minister).</p><p><b>Paul uses the same set of ministry words for two different things:</b></p><p>Preaching the gospel is ministry (15:16).<br>Carrying a sum of money is also ministry (15:25, 27).</p><p><b>In his mind, these two are not ranked one above the other.</b></p><p><b>★ Fourth light: propempō — the technical term for missionary sending</b></p><p>The word regularly denotes <b>a church providing a preacher’s travel costs, supplying his needs, and sending him on his way</b>.<br>(Acts 15:3; 1 Corinthians 16:6, 11; Titus 3:13; 3 John 6)</p><p><b>In 15:24 Paul is in fact asking the church at Rome to become his missionary support for Spain.</b></p><p><b>★ Fifth light: koinōnia — “contribution” is literally “fellowship”</b></p><p>Paul does <b>not</b> use a word for “donation.”</p><p><b>In his mind, the sharing of money is a form of fellowship.</b></p><p><b>★ Sixth light: the “debt” of 15:27 — an echo of 15:1</b></p><pre>15:1   “we who are strong OUGHT (Ὀφείλομεν) to bear…”\n15:27  “indeed they are their DEBTORS (ὀφειλέται)”</pre><p>And the logic of 15:27 is:</p><pre>the Gentiles have shared in the Jews’ [SPIRITUAL THINGS]\n  ↓\nso the Gentiles ought to minister to them in [MATERIAL THINGS]</pre><p><b>This is 11:18 made concrete:</b></p><p>“It is not you who support the root, but the root that supports you.”<br><b>And now the grafted branch sends the fruit back.</b></p><p><b>★ Seventh light: sphragizō (15:28, “sealed”) — stamped and sealed</b></p><p>Literally, Paul says he will <b>seal this fruit to them</b>.</p><p>In the commerce and transport of the day the word denoted <b>sealing</b>: goods delivered and stamped as proof that <b>the full amount arrived and the responsibility was discharged</b>.</p><p>And its noun form σφραγίς is the very word of chapter 4:</p><pre>4:11   “he received the sign of circumcision, a SEAL (σφραγίς) of the righteousness of faith”\n15:28  “having SEALED (σφραγισάμενος) to them this fruit”</pre><p><b>Paul was scrupulous about money.</b></p><p>(Compare 2 Corinthians 8:20–21: “avoiding this, that anyone should blame us in this abundance which is administered by us… <b>not only in the sight of the Lord, but also in the sight of men</b>.”)</p><p><b>Spiritual service must be able to be “sealed and stamped” in its accounting.</b></p><p><b>★ Eighth light: 15:29, “in the fullness of the blessing of Christ”</b></p><p>This sentence sounds very certain. And what actually happened was:</p><pre>Acts 21     he reached Jerusalem  —  and was arrested\nActs 23–26  two years in prison at Caesarea\nActs 27     shipwreck\nActs 28:16  he finally reached Rome  —  [IN CHAINS]</pre><p><b>Was he right?</b></p><p>He was right. Because Philippians 1:12–13 (written from prison in Rome) says:</p><p><b>“The things which happened to me have turned out rather for the progress of the Good News… my bonds became known in Christ throughout the whole palace guard.”</b></p><p><b>He did indeed go “in the fullness of the blessing of Christ.”<br>Only — that blessing had a different shape from the one he had imagined.</b></p>","exp":"<p>This passage is Paul’s <b>itinerary</b> — and it reveals three things.</p><p><b>① He was hindered for years (15:22).</b></p><p>ἐγκόπτω is <b>a military term</b>: to break up a road, to cut a line of advance. And it is <b>imperfect passive</b> — “I was hindered again and again.”<br>And his response? 15:23: <b>“But now…”</b> — <b>he keeps planning.</b></p><p><b>② Rome was not the destination; it was a stop (15:24, 28).</b></p><p>Where Paul was really going was <b>Spain</b> — the western edge of the world as then known. And 15:19 says he had already gone “from Jerusalem round to Illyricum.”<br><b>His map ran: from Jerusalem to both ends of the earth.</b></p><p><b>③ He put “carrying the collection” on the same footing as “preaching the gospel” (15:25, 27).</b></p><p><b>What the text plainly says:</b> Paul goes first to Jerusalem with the collection, and only then intends to pass through Rome on his way to Spain; and the Gentiles’ material support of Jewish believers is “a debt they owe.”</p><p><b>What may fairly be drawn from it:</b> “contribution” (κοινωνία) is literally <b>fellowship</b> — Paul does <b>not</b> use a word for “donation.” <b>In his mind, sharing money is a form of fellowship.</b></p><p>And the logic of 15:27 is 11:18 made concrete:</p><p>“It is not you who support the root, but the root that supports you.”<br><b>And now the grafted branch sends the fruit back.</b></p><p><b>⚠ And the phrase in 15:24, “to be sent on my way by you” (προπέμπω), is the technical term for missionary sending:</b> supplying travel costs, preparing what is needed, sending him off.</p><p>In other words, in this verse Paul is <b>asking the church at Rome to become his missionary support for Spain</b>.</p>"},{"a":30,"z":32,"star":true,"grk":"<p>30 …συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,</p>","lit":"<p>30 “Now I urge you, brothers, <b>by our Lord Jesus Christ</b> and <b>by the love of the Spirit</b>, <b>to strive together with me in your prayers to God for me</b>;”</p><p>31 “that I may be <b>rescued from those in Judea who are disobedient</b>, and that <b>my service for Jerusalem may be acceptable to the saints</b>;”</p><p>32 “so that I may come to you <b>with joy, by the will of God</b>, and <b>be refreshed together with you</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>strive together</td><td>συναγωνίσασθαι</td><td>synagōnisasthai</td><td>G4865</td><td>σύν + ἀγών (<b>a contest in the arena</b>)</td><td><b>to enter the arena and fight alongside</b></td><td><b>only here in the NT</b></td></tr></table>","gram":"<p><b>★★ First light: synagōnizomai — “get down into the arena with me”</b></p><p>The word is σύν (together) + ἀγωνίζομαι (<b>to contend in the arena</b>). And ἀγών means <b>a contest, a struggle, a fight for one’s life</b> — the root of the English “agony.”</p><p>Paul uses the same root elsewhere:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Colossians 4:12</b></td><td>Epaphras “always <b>labours fervently</b> (ἀγωνιζόμενος) for you in prayers”</td></tr><tr><td><b>2 Timothy 4:7</b></td><td>“I have fought <b>the good fight</b> (ἀγῶνα)”</td></tr><tr><td><b>Luke 22:44</b></td><td>Jesus in Gethsemane, “being <b>in agony</b> (ἀγωνίᾳ)”</td></tr></table><p>Paul asks people to pray for him — <b>and the word he uses is: get down into the arena with me.</b></p><p><b>★ Second light: “by the love of the Spirit”</b></p><p>15:30 gives two grounds for the request:<br>· “by our Lord Jesus Christ”<br>· “and by <b>the love of the Spirit</b>”</p><p><b>The energy of intercession is the love the Spirit has put within us.</b></p><p><b>★ Third light: ★ was this prayer answered?</b></p><p>Paul asked for three things:</p><table><tr><th>What he asked</th><th>What happened</th></tr><tr><td>deliverance from the disobedient in Judea (15:31)</td><td><b>arrested in Jerusalem</b> (Acts 21:27–33)</td></tr><tr><td>the collection accepted by the saints (15:31)</td><td>Scripture does not say explicitly (Acts 21:17–20 suggests a welcome)</td></tr><tr><td><b>to come to you with joy</b> (15:32)</td><td><b>he reached Rome — in chains</b> (Acts 28:16, 20)</td></tr></table><p>And Acts 28:15 records:</p><p><b>“When the brothers heard about us, they came to meet us… When Paul saw them, he thanked God and took courage.”</b></p><p><b>He got there. And he did come “with joy.”<br>Only — by a route entirely unlike the one he had in mind.</b></p>","exp":"<p>The word in verse 30 (συναγωνίζομαι) occurs <b>only here in the New Testament</b>.</p><p>It is σύν (together) + ἀγωνίζομαι (<b>to contend in the arena</b>). And the root ἀγών is the very word Luke 22:44 uses of the Lord in Gethsemane, “being <b>in agony</b>” (ἀγωνίᾳ).</p><p><b>What the text plainly says:</b> Paul asks the church at Rome to strive with him in prayer, for three things: deliverance from danger, the acceptance of the collection, and a joyful arrival among them.</p><p><b>What may fairly be drawn from it:</b> Paul asks people to pray for him, and the word he uses is —</p><p><b>“Get down into the arena with me.”</b></p><p>And when we say “I will pray for you” — <b>is that getting into the arena, or waving from the stands?</b></p><p><b>⚠ Pulpit note:</b> this passage <b>must not</b> be preached as “so there is no need to pray for specific things” — Paul’s requests were extremely specific.</p><p>Nor may it be preached as “God will always do what you ask” — <b>he did not do it in the way Paul wrote.</b></p><p><b>The most faithful way to put it: he asked, God answered, and the process was nothing like what he had imagined.</b></p><p>(For someone who has been asking a long time without an answer, this passage is a great comfort — but do not say it too quickly or too lightly.)</p>"},{"a":33,"z":33,"star":false,"grk":"<p>ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν, ἀμήν.</p>","lit":"<p>“Now may <b>the God of peace</b> be <b>with you all</b>. Amen.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>the God of peace</td><td>ὁ θεὸς τῆς εἰρήνης</td><td>—</td><td>G1515</td><td><b>the God of peace</b> (it appears again in 16:20)</td></tr><tr><td>all of you</td><td>πάντων ὑμῶν</td><td>pantōn hymōn</td><td>G3956</td><td><b>all of you</b> (not “the ones who are right”)</td></tr><tr><td>amen</td><td>ἀμήν</td><td>amēn</td><td>G281</td><td>so be it; truly</td></tr></table>","gram":"<p><b>★ First light: the third of three names for God</b></p><pre>15:5   the God of [ENDURANCE AND ENCOURAGEMENT]\n15:13  the God of [HOPE]\n15:33  the God of [PEACE]  ← this verse</pre><p><b>★ Second light: “the God of peace” in Paul’s letters</b></p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Romans 15:33</b></td><td>“may the <b>God of peace</b> be with you all”</td></tr><tr><td><b>Romans 16:20</b></td><td>“the <b>God of peace</b> will soon crush Satan under your feet”</td></tr><tr><td><b>Philippians 4:9</b></td><td>“and the <b>God of peace</b> will be with you”</td></tr><tr><td><b>1 Thessalonians 5:23</b></td><td>“may the <b>God of peace</b> himself sanctify you completely”</td></tr><tr><td><b>Hebrews 13:20</b></td><td>“now may the <b>God of peace</b>…”</td></tr></table><p><b>★ Third light: “with you ALL”</b></p><p>μετὰ πάντων ὑμῶν — <b>“with all of you.”</b></p><p>In a letter devoted to the tension between the strong and the weak, Paul ends by saying: <b>all.</b><br>Not “with those who are right.”</p>","exp":"<p>What have chapters 14 and 15 been about?</p><p>They have been about <b>a church strained over food and days</b>.</p><p>And Paul’s blessing is: <b>“May the God of peace be with you all.”</b></p><p><b>He asks for precisely the thing that church most lacked.</b></p>"}],"16":[{"a":1,"z":1,"star":true,"grk":"<p>Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν [καὶ] διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,</p>","lit":"<p>“I <b>formally commend</b> to you Phoebe our sister, who is a <b>diakonos</b> of the church at Cenchreae.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>commend</td><td>Συνίστημι</td><td>synistēmi</td><td>G4921</td><td>σύν + ἵστημι</td><td><b>to introduce formally, to commend</b></td><td>same word as 3:5, 5:8</td></tr><tr><td>sister</td><td>ἀδελφή</td><td>adelphē</td><td>G79</td><td>—</td><td>sister</td><td>—</td></tr><tr><td>servant / deacon</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td>—</td><td><b>deacon / servant</b></td><td>see the disputed material</td></tr></table>","gram":"<p><b>★ First light: synistēmi — the vocabulary of a letter of commendation</b></p><p>In the first century this was <b>the technical term for a letter of recommendation</b>.<br>(2 Corinthians 3:1, “do we need <b>letters of commendation</b> to you?” — the same root.)</p><p>The structure of 16:1–2 is exactly that of a standard letter of commendation:</p><p>① state who she is (16:1)<br>② request that she be received (16:2a)<br>③ describe what she has done (16:2b)</p><p>Which leads most commentators to judge that <b>Phoebe was very likely the person who carried this letter from Corinth to Rome.</b><br>(The text does not say so outright, but that is what a letter of commendation normally did.)</p><p>If so — <b>the first person in history to bring the letter to the Romans into Rome was a woman.</b></p><p><b>★ Second light: synistēmi in the two other places in Romans</b></p><pre>3:5   “if our unrighteousness DEMONSTRATES (συνίστησιν) the righteousness of God”\n5:8   “God COMMENDS (συνίστησιν) his own love toward us, in that while we were\n       still sinners, Christ died for us”</pre><p>The same word. <b>God “commends” his love by the cross (5:8); Paul “commends” Phoebe by this letter.</b></p><p><b>★ Third light: “of the church at Cenchreae”</b></p><p>That qualifier matters. Paul does <b>not</b> merely say “Phoebe serves.” He says: <b>“a diakonos of the church at Cenchreae.”</b></p><p>(On whether this denotes an office, see the disputed material — this edition does not settle it.)</p>","exp":"<p>16:1 looks like a courteous introduction. In the first century it was <b>a document with force</b>.</p><p>To travel to a strange city you needed a letter of commendation, so that the people there would know: <b>this person may be received; she is one of us.</b></p><p>And in this letter Paul makes three things clear:</p><table><tr><th>What he says</th><th>What it means</th></tr><tr><td>“<b>our sister</b>”</td><td>she <b>belongs to this family</b> — not an outsider</td></tr><tr><td>“a <b>diakonos</b> of the church at Cenchreae”</td><td>she has <b>a real place of service in a specific church</b></td></tr><tr><td>(16:2) “she has been a helper of many, and of me also”</td><td>her credit is <b>guaranteed by Paul himself</b></td></tr></table><p><b>What the text plainly says:</b> Paul formally commends Phoebe and asks the church at Rome to receive and support her.</p><p><b>What may fairly be drawn from it:</b> if she was indeed the letter-carrier, then <b>the first person to bring the letter to the Romans into Rome was a woman.</b><br>(The text does not say so outright, but that is the normal function of such a letter.)</p>"},{"a":2,"z":2,"star":true,"grk":"<p>ἵνα αὐτὴν προσδέξησθε ἐν κυρίῳ ἀξίως τῶν ἁγίων καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι· καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ἐμοῦ αὐτοῦ.</p>","lit":"<p>“that you may <b>receive her in the Lord</b>, in a manner <b>worthy of the saints</b>, and <b>stand beside her</b> in whatever matter she may have need of you — for she herself has been <b>a patroness of many</b>, and of me also.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>receive</td><td>προσδέξησθε</td><td>prosdexēsthe</td><td>G4327</td><td><b>to welcome, to accept</b> (compare προσλαμβάνω in 14:1, 15:7)</td></tr><tr><td>assist</td><td>παραστῆτε</td><td>parastēte</td><td>G3936</td><td><b>παρίστημι — to stand beside her</b> (see below)</td></tr><tr><td>helper</td><td>προστάτις</td><td>prostatis</td><td>G4368</td><td><b>a patroness, a protector and provider</b></td></tr></table>","gram":"<p><b>★ First light: paristēmi — “go and stand beside her”</b></p><p>“Assist her” — the Greek is παρίστημι (παρά, beside + ἵστημι, to stand).</p><p>We have tracked this word through Romans:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td>6:13</td><td>“<b>present</b> (παραστήσατε) yourselves to God”</td></tr><tr><td>12:1</td><td>“<b>present</b> (παραστῆσαι) your bodies a living sacrifice”</td></tr><tr><td>14:10</td><td>“we shall all <b>stand</b> (παραστησόμεθα) before the judgement seat of God”</td></tr><tr><td><b>16:2</b></td><td>“<b>assist</b> (παραστῆτε) her”</td></tr></table><p>The literal sense of the word is: <b>go and stand beside</b>.</p><p>Paul is saying: <b>if she has a need, go and stand next to her.</b></p><p><b>★ Second light: two different words behind one English word</b></p><pre>“you should [ASSIST] her”         —  παρίστημι (stand beside)\n“she has been a [HELPER] of many” —  προστάτις (patroness, provider)</pre><p>English renders both as “help,” but the weight differs:</p><p>The first is “you go and help her.”<br>The second says: <b>she is the one who has been helping many people all along.</b></p><p><b>★ Third light: the social meaning of prostatis</b></p><p>The word denotes <b>a person of standing or means who provides protection and support to others</b>. (In Roman society this is the Greek counterpart of the <i>patronus</i>.)</p><p>Paul says she has been the prostatis of many — <b>“and of me also.”</b></p>","exp":"<p>There is a beautiful logic in 16:2:</p><pre>she has helped many people (including Paul)\n  ↓\ntherefore: now it is your turn to help her</pre><p><b>This is what God’s system looks like: not one-directional, but circulating.</b></p>"},{"a":3,"z":5,"star":true,"grk":"<p>3 Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ, 4 οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν…</p>","lit":"<p>3 “<b>Greet Prisca and Aquila</b> — my <b>fellow workers</b> in Christ Jesus,”</p><p>4 “who <b>laid down their own necks</b> for my life.”</p><p>5 “Greet also <b>the church that is in their house</b>. Greet Epaenetus, my beloved — who is the <b>firstfruits</b> of Asia unto Christ.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>fellow worker</td><td>συνεργός</td><td>synergos</td><td>G4904</td><td>σύν + ἔργον: <b>one who works alongside</b></td></tr><tr><td>neck</td><td>τράχηλος</td><td>trachēlos</td><td>G5137</td><td><b>the neck</b></td></tr><tr><td>laid down</td><td>ὑπέθηκαν</td><td>hypethēkan</td><td>G5294</td><td>ὑπό + τίθημι: <b>to lay under</b></td></tr><tr><td>firstfruits</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>the firstfruits</b> (the word of 8:23, 11:16)</td></tr></table>","gram":"<p><b>★ First light: Prisca’s name comes first</b></p><p>This couple are mentioned six times in the New Testament, and in <b>four of them Prisca comes first</b>:</p><table><tr><th>Reference</th><th>Order</th></tr><tr><td>Acts 18:2</td><td>Aquila, Priscilla</td></tr><tr><td><b>Acts 18:18</b></td><td><b>Priscilla, Aquila</b></td></tr><tr><td><b>Acts 18:26</b></td><td><b>Priscilla, Aquila</b> (together they instructed Apollos)</td></tr><tr><td><b>Romans 16:3</b></td><td><b>Prisca, Aquila</b></td></tr><tr><td>1 Corinthians 16:19</td><td>Aquila, Prisca</td></tr><tr><td><b>2 Timothy 4:19</b></td><td><b>Prisca, Aquila</b></td></tr></table><p>By the documentary conventions of the first century, that order is worth noticing.<br>(Scholars suggest different reasons: it may relate to her social standing, or to her role in the church. From the pulpit it is better to say “this order is worth noticing” than to press the inference further.)</p><p><b>★ Second light: “they laid down their own necks”</b></p><p>The Greek is literally: <b>they put their own necks under</b>.</p><p>That is <b>the image of the executioner’s block</b>.</p><p>(We do not know where this happened — possibly the riot at Ephesus in Acts 19, possibly something else. Scripture does not record the details.)</p><p><b>★ Third light: their house was the church</b></p><p>16:5, “greet also <b>the church that is in their house</b>.”</p><p>And 1 Corinthians 16:19 also says: “Aquila and Priscilla greet you… with <b>the church that is in their house</b>.”</p><p><b>Wherever they moved, the church was there.</b></p><p><b>★ Fourth light: aparchē (firstfruits) — the word from chapter 8</b></p><pre>8:23   “we who have the FIRSTFRUITS (ἀπαρχή) of the Spirit”\n11:16  “if the FIRSTFRUIT (ἀπαρχή) is holy, so is the lump”\n16:5   “Epaenetus… the FIRSTFRUITS (ἀπαρχή) of Asia unto Christ”</pre><p>Firstfruits are not “a small portion.” They are <b>the guarantee of the whole harvest</b>.</p><p>Epaenetus was the first person in Asia to believe — <b>and behind him stands the whole later harvest of Asia.</b></p>","exp":"<p>These three verses contain a married couple, and a church meeting in their house.</p><p>And what Paul remembers is not their position, but <b>what they did</b>:</p><p><b>“They laid down their own necks for my life.”</b></p><p>And the next clause is still more striking:</p><p><b>“not only I, but also all the churches of the Gentiles give thanks for them.”</b></p><p>Which means: <b>what they gave was known in more than one church.</b></p><p><b>What the text plainly says:</b> Prisca and Aquila risked their lives for Paul, and their house was the church.</p><p><b>What may fairly be drawn from it:</b> a tentmaking couple — wherever they moved, the church was there (compare Acts 18:2–3, 18:18–19; 1 Corinthians 16:19).</p><p><b>God’s system does not necessarily require a building. Sometimes it requires only a home that is willing to open its door.</b></p>"},{"a":6,"z":15,"star":true,"grk":"<p>6 ἀσπάσασθε Μαρίαν, ἥτις πολλὰ ἐκοπίασεν εἰς ὑμᾶς. 7 ἀσπάσασθε Ἀνδρόνικον καὶ Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ. 12 ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. 13 ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.</p>","lit":"<p>6 “Greet Mary, who <b>laboured hard</b> for you.”</p><p>7 “Greet Andronicus and Junia, my kinsfolk and <b>my fellow prisoners of war</b>, who are <b>of note among the apostles</b>, and who were <b>in Christ before me</b>.”</p><p>8 “Greet Ampliatus, <b>my beloved in the Lord</b>.”</p><p>9 “Greet Urbanus, our <b>fellow worker</b> in Christ, and Stachys, <b>my beloved</b>.”</p><p>10 “Greet Apelles, <b>who has been tested and approved</b> in Christ. Greet those of the household of Aristobulus.”</p><p>11 “Greet Herodion my kinsman. Greet those of the household of Narcissus <b>who are in the Lord</b>.”</p><p>12 “Greet Tryphaena and Tryphosa, <b>women who labour in the Lord</b>. Greet the beloved Persis, who <b>laboured hard in the Lord</b>.”</p><p>13 “Greet Rufus, <b>chosen in the Lord</b>, and his mother — <b>who is a mother to me too</b>.”</p><p>14 “Greet Asyncritus, Phlegon, Hermes, Patrobas, Hermas, and <b>the brothers who are with them</b>.”</p><p>15 “Greet Philologus and Julia, Nereus and his sister, and Olympas, and <b>all the saints who are with them</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>laboured hard</td><td>πολλὰ ἐκοπίασεν</td><td>ekopiasen</td><td>G2872</td><td><b>κοπιάω = to work to exhaustion</b></td></tr><tr><td>fellow prisoners</td><td>συναιχμαλώτους</td><td>synaichmalōtous</td><td>G4869</td><td>σύν + αἰχμάλωτος (<b>a prisoner of war</b>) — the root of 7:23</td></tr><tr><td>of note</td><td>ἐπίσημοι</td><td>episēmoi</td><td>G1978</td><td><b>marked out, notable</b></td></tr><tr><td>beloved</td><td>ἀγαπητός</td><td>agapētos</td><td>G27</td><td><b>beloved</b> (the word of 1:7 and Matthew 3:17)</td></tr><tr><td>fellow worker</td><td>συνεργός</td><td>synergos</td><td>G4904</td><td>σύν + ἔργον: one who works alongside</td></tr><tr><td>approved</td><td>δόκιμος</td><td>dokimos</td><td>G1384</td><td><b>tested and found genuine</b> (the root of δοκιμή in 5:4)</td></tr><tr><td>chosen</td><td>ἐκλεκτός</td><td>eklektos</td><td>G1588</td><td><b>chosen</b> (the word of 8:33)</td></tr><tr><td>who are with them</td><td>σὺν αὐτοῖς</td><td>syn autois</td><td>—</td><td><b>those together with them</b> (16:14, 15)</td></tr></table>","gram":"<p><b>★ First light: kopiaō — “to work to exhaustion” — and every use is of a woman</b></p><p>This verb does not mean simply “to serve.” It means <b>to labour to the point of exhaustion</b>.<br>(Paul uses it of himself: 1 Corinthians 15:10, “I <b>laboured</b> more abundantly than they all”; Colossians 1:29.)</p><p>And in Romans 16 it occurs <b>four times</b>:</p><pre>16:6   Mary                  —  laboured hard\n16:12  Tryphaena, Tryphosa   —  women who labour in the Lord\n16:12  Persis                —  laboured hard in the Lord</pre><p><b>Four occurrences — every one of them of a woman.</b></p><p><b>★ Second light: synaichmalōtos — “fellow prisoners,” literally “fellow prisoners of war”</b></p><p>The word is σύν + αἰχμάλωτος (<b>a captive taken in war</b>).</p><p>And that root we met in Romans 7:23: “<b>taking me captive</b> (αἰχμαλωτίζοντά) to the law of sin which is in my members.”</p><p><b>Andronicus and Junia were Paul’s cellmates.</b></p><p><b>★ Third light: dokimos (16:10) — the root from chapter 5</b></p><pre>5:3–4  “suffering produces endurance, endurance CHARACTER (δοκιμή), character hope”\n16:10  “Apelles, TESTED AND APPROVED (δόκιμον) in Christ”</pre><p>δοκιμή is <b>the part of the metal that remains after the fire</b>.</p><p>Paul’s description of Apelles is four words: <b>“approved in Christ.”</b></p><p><b>We do not know what he went through. But Paul remembered.</b></p><p><b>★ Fourth light: eklektos (16:13) — the word from chapters 8 and 9</b></p><pre>8:33   “who shall bring a charge against God’s ELECT (ἐκλεκτῶν)?”\n9:11   “God’s purpose according to ELECTION (ἐκλογή)”\n16:13  “Rufus, CHOSEN (ἐκλεκτόν) in the Lord”</pre><p>Paul spent two chapters on the theology of election (chapters 9–11).<br>And in chapter 16, that word lands on <b>one man: Rufus</b>.</p><p><b>★★ Fifth light: 16:13, “his mother — and mine”</b></p><p>That half-sentence is the warmest in the chapter:</p><p><b>“Greet Rufus, chosen in the Lord, and his mother — who is a mother to me too.”</b></p><p>Paul plainly does not mean she gave birth to him. He means: <b>this woman treated me as her own son.</b></p><p><b>Paul was a man without a home.</b> He spent his life on the road — prison, shipwreck, beatings, expulsion.</p><p>And somewhere, in some city, <b>a woman treated him as her son.</b></p><p>(On whether this Rufus is the son of Simon of Cyrene in Mark 15:21, see the disputed material — <b>it cannot be established</b>.)</p><p><b>★ Sixth light: 16:8–9 — three names with no deeds attached</b></p><p>In this list, most names are followed by a note of <b>what the person did</b>. But three are not:</p><pre>16:8  Ampliatus —  “MY BELOVED in the Lord”\n16:9  Urbanus   —  “our FELLOW WORKER in Christ”\n16:9  Stachys   —  “MY BELOVED”</pre><p>“Beloved” is ἀγαπητός — <b>the one who is loved</b>. And we met that word in chapter 1:</p><p><b>1:7:</b> “to all who are in Rome, <b>beloved of God</b> (ἀγαπητοῖς θεοῦ), called to be saints.”<br>(It is also the word the Father spoke over the Son at the Jordan: Matthew 3:17, “this is my <b>beloved</b> Son.”)</p><p>Ampliatus and Stachys have no recorded deeds at all. <b>Paul says only one thing: I love him.</b></p><p>And for a list built on remembering what people did, that is an important balance:</p><p><b>Some are remembered because of what they did. Some are remembered because of who they are.</b></p><p>(A further note: Ampliatus, Urbanus and Stachys were all <b>names commonly borne by slaves and freedmen</b> in that period. And Paul calls a brother of slave origin “my beloved in the Lord.”)</p><p><b>★ Seventh light: 16:14–15 — two groups “who are with them”</b></p><p>Both verses end with the same phrase: <b>“who are with them.”</b></p><p>Add 16:5, “the church that is in their house,” and it becomes clear: <b>the church in Rome was not one large congregation, but several household gatherings scattered across the city.</b></p><p>And the names in 16:14–15 have something in common: <b>most were names commonly borne by slaves and freedmen.</b><br>(This is the general judgement of epigraphic study. From the pulpit it is better to say “these were names commonly used by slaves and freedmen at the time” and leave it there.)</p><p>Set those two verses beside 16:23, which mentions <b>Erastus, the city treasurer — a public office</b>.</p><p><b>Two groups whose very names sound like slaves, and a city financial officer — and Paul greets them with the same word.</b></p><p><b>★ Eighth light: 16:15, “Nereus and his sister”</b></p><p>Notice: that sister <b>left no name at all</b>. Paul says only, “Nereus <b>and his sister</b>.”</p><p><b>She is on the list. We simply do not know what she was called.</b></p><p>(And on that final list — Luke 10:20, “your names are written in heaven” — <b>it is there.</b>)</p>","exp":"<p>These ten verses are the most concentrated list of names in the whole Bible. And Paul is doing three things:</p><p><b>① He remembers the names.</b><br><b>② He remembers what they did</b> — laboured hard, was in prison with me, was tested and approved, was a mother to me.<br><b>③ He commands the church at Rome to greet them</b> (ἀσπάσασθε is imperative).</p><p>That is: <b>Paul does not merely remember them himself. He wants these names spoken aloud in the church at Rome.</b></p><p>And the composition of the list is itself a sermon:</p><table><tr><th>Dimension</th><th>The evidence in the list</th></tr><tr><td><b>across class</b></td><td>Ampliatus, Urbanus, Hermes, Persis and others bore <b>names common among slaves and freedmen</b></td></tr><tr><td><b>across gender</b></td><td>at least nine women are named; and κοπιάω (to labour to exhaustion) is used <b>only of women</b></td></tr><tr><td><b>across ethnicity</b></td><td>Jewish names (Mary, Herodion) stand beside Greek and Latin ones</td></tr><tr><td><b>across deeds and no deeds</b></td><td>some are remembered for <b>what they did</b>; some simply for <b>who they are</b> (16:8, 9)</td></tr></table><p><b>What the text plainly says:</b> Paul knew many people in the church at Rome, and knew each one’s service and history.</p><p><b>What may fairly be drawn from it:</b> this list is what fifteen chapters of theology finally grew into.</p><p><b>God is not saving “humanity.” He is saving people with names.</b></p>"},{"a":16,"z":16,"star":false,"grk":"<p>ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι πᾶσαι τοῦ Χριστοῦ.</p>","lit":"<p>“<b>Greet one another with a holy kiss.</b> <b>All the churches</b> of Christ greet you.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>greet</td><td>ἀσπάσασθε</td><td>aspasasthe</td><td>G782</td><td><b>imperative</b>: you are to greet (see below)</td></tr><tr><td>kiss</td><td>φίλημα</td><td>philēma</td><td>G5370</td><td><b>a kiss</b> (the noun of φιλέω)</td></tr><tr><td>holy</td><td>ἅγιος</td><td>hagios</td><td>G40</td><td>set apart to God</td></tr><tr><td>one another</td><td>ἀλλήλους</td><td>allēlous</td><td>G240</td><td><b>one another</b> (a key word all through Romans)</td></tr><tr><td>all the churches</td><td>αἱ ἐκκλησίαι πᾶσαι</td><td>—</td><td>G1577</td><td><b>all the churches</b></td></tr></table>","gram":"<p><b>★★ Light zero: one verb running through the whole chapter — aspazomai</b></p><p>This is the thing most easily missed in Romans 16, and the thing that shows its structure most clearly.</p><p>The verb “greet” (ἀσπάζομαι) appears in <b>two different moods</b> in this chapter:</p><table><tr><th>Section</th><th>Form</th><th>Meaning</th></tr><tr><td><b>16:3–16</b></td><td><b>ἀσπάσασθε (imperative)</b></td><td><b>“you go and greet…”</b></td></tr><tr><td><b>16:16b, 21, 23</b></td><td>ἀσπάζεται / ἀσπάζονται (indicative)</td><td>“so-and-so <b>greets you</b>”</td></tr></table><p>And in the run of 16:3–16, the imperative ἀσπάσασθε occurs <b>sixteen times</b>.</p><p>The distinction matters:</p><p>Paul is <b>not</b> saying “I send them my regards.”<br>He is <b>commanding the church at Rome</b>: <b>you go and greet him.</b></p><p>In other words: <b>what Paul is doing is not merely remembering these people. He is introducing them to one another.</b></p><p>(And 16:16 is the close of that whole run of commands: “greet <b>one another</b>.”)</p><p><b>★ First light: philēma hagion — “a holy kiss”</b></p><p>The kiss on the cheek was the ordinary greeting of the day; Paul adds <b>“holy.”</b></p><p>The point is not the form of the gesture (that is cultural) but this: <b>a family, bodily contact — happening in a church that spanned slaves and officials, Jews and Gentiles.</b></p><p><b>★ Second light: “all the churches of Christ greet you”</b></p><p>Paul brings the greeting of the whole network of churches to Rome. He is saying: <b>you are not on your own.</b></p>","exp":"<p>16:16 is <b>the close</b> of that whole run of commands.</p><p>For fourteen verses Paul has said, one by one: “greet so-and-so.”<br>And at verse 16 he says:</p><p><b>“Greet one another.”</b></p><p><b>From “go and greet him” to “you, one another.”</b></p><p>And the adjective he adds matters: <b>a holy kiss</b>.</p><p>The kiss on the cheek was the ordinary greeting of the day. <b>Paul does not abolish the cultural form; he sets it apart as holy.</b></p><p>And the second half pulls the camera back: <b>“all the churches of Christ greet you.”</b></p><p><b>What the text plainly says:</b> believers are to greet one another genuinely and in holiness; and other churches send their greetings to Rome.</p><p><b>What may fairly be drawn from it:</b> in a church spanning slaves and officials, Jews and Gentiles, “greeting one another with a kiss” is <b>a bodily, visible declaration of reconciliation</b>.</p><p><b>⚠ Pastoral note:</b> the form is cultural (different cultures draw the line on physical contact in different places); the principle does not change: <b>this is one family.</b> In practice today, safety and propriety must still be considered.</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ἐκκλίνετε ἀπ' αὐτῶν· 18 οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.</p>","lit":"<p>17 “Brothers, I urge you to <b>keep your eye on</b> those who cause <b>divisions</b> and <b>traps</b>, contrary to the teaching you learned; and <b>turn away from them</b>.”</p><p>18 “For such people <b>are not serving our Lord Christ, but their own belly</b>; and by <b>smooth-sounding words</b> and flattery they <b>thoroughly deceive</b> the hearts of those who have no evil in them.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>watch out for</td><td>σκοπεῖν</td><td>skopein</td><td>G4648</td><td>σκοπός (a target)</td><td><b>to keep the eye on, to observe closely</b></td><td>see below</td></tr><tr><td>divisions</td><td>διχοστασίας</td><td>dichostasias</td><td>G1370</td><td>δίχα (apart) + στάσις</td><td>division</td><td>—</td></tr><tr><td>stumbling blocks</td><td>σκάνδαλα</td><td>skandala</td><td>G4625</td><td>—</td><td><b>the trigger of a trap</b></td><td>same word as 14:13</td></tr><tr><td>turn away</td><td>ἐκκλίνετε</td><td>ekklinete</td><td>G1578</td><td>ἐκ + κλίνω (to turn)</td><td>to turn away from</td><td>—</td></tr><tr><td>smooth talk</td><td>χρηστολογία</td><td>chrēstologia</td><td>G5542</td><td>χρηστός (kind) + λόγος</td><td><b>words that sound good</b></td><td><b>only here in the NT</b></td></tr><tr><td>deceive</td><td>ἐξαπατῶσιν</td><td>exapatōsin</td><td>G1818</td><td>ἐκ + ἀπατάω</td><td><b>to deceive thoroughly</b></td><td><b>the word of 7:11!</b></td></tr><tr><td>the innocent</td><td>ἀκάκων</td><td>akakōn</td><td>G172</td><td>ἀ + κακός (evil)</td><td>those with no evil in them</td><td>—</td></tr></table>","gram":"<p><b>★ First light: skopeō — “keep your eye on”</b></p><p>The root is σκοπός (<b>a target, a mark</b>) — the source of English “scope.”</p><p>Paul does <b>not</b> say “pay them no attention.” He says <b>watch them closely</b>.<br>First see clearly, and then “turn away” (ἐκκλίνω).</p><p><b>★★ Second light: chrēstologia — the same root as “kindness” in 2:4</b></p><p>This word occurs <b>only here</b> in the New Testament. It is χρηστός (kind, good) + λόγος (word).</p><p>And the noun form of χρηστός, χρηστότης, is the very word of 2:4 and 11:22:</p><pre>2:4    “do you despise the riches of his KINDNESS (χρηστότης)…\n        not knowing that God’s KINDNESS leads you to repentance?”\n11:22  “the KINDNESS (χρηστότης) and severity of God”\n  ↓\n16:18  “by SMOOTH TALK (χρηστολογία) they deceive the hearts of the innocent”</pre><p>Same root, opposite nature:</p><p><b>God’s kindness is real, and it leads people to repentance.<br>Their “kind-sounding words” are false, and they use them to deceive.</b></p><p>It is a very serious warning: <b>the counterfeit often looks a great deal like the real thing.</b></p><p><b>★★ Third light: exapataō — the serpent’s word</b></p><p>“<b>Deceive</b> the hearts of the innocent” — ἐξαπατῶσιν.</p><p>And that word we met in Romans 7:11:</p><p>7:11, “for sin, taking occasion through the commandment, <b>deceived</b> (ἐξηπάτησέν) me, and killed me.”</p><p>And that word comes from Genesis 3:13:</p><p><b>“The serpent deceived me, and I ate.”</b> (the Septuagint uses the same root)<br>(Paul uses it again in 2 Corinthians 11:3: “as <b>the serpent deceived Eve</b> by his craftiness.”)</p><p><b>Paul is saying: those who divide are using the serpent’s method.</b></p><p><b>★ Fourth light: what are the criteria?</b></p><p>16:17–18 gives extremely specific criteria (<b>and they must be applied strictly</b> — see the disputed material):</p><table><tr><th>The mark</th><th>Reference</th></tr><tr><td><b>causing divisions</b></td><td>16:17</td></tr><tr><td><b>setting traps that make people fall</b></td><td>16:17</td></tr><tr><td><b>contrary to the teaching you learned</b></td><td>16:17</td></tr><tr><td><b>not serving the Lord, but their own belly</b></td><td>16:18</td></tr><tr><td><b>deceiving the innocent with smooth talk</b></td><td>16:18</td></tr></table><p>Note carefully: <b>the criterion is not “he disagrees with me.”</b><br>The criterion is: <b>departing from the teaching handed down + using division as the method + serving oneself as the end.</b></p><p><b>★ Fifth light: this does not conflict with “accept one another” in 14:1</b></p><table><tr><th>Romans 14</th><th>Romans 16:17–18</th></tr><tr><td>“the one <b>weak</b> in faith”</td><td>those who <b>divide</b>, <b>trap</b>, and are <b>contrary to the teaching</b></td></tr><tr><td>he still acts “to the Lord” and “gives thanks to God” (14:6)</td><td>he serves “<b>his own belly</b>” (16:18)</td></tr><tr><td><b>accept</b> (14:1)</td><td><b>watch and turn away</b> (16:17)</td></tr></table><p><b>Acceptance is not the same as having no boundaries.</b></p>","exp":"<p>After fourteen verses of greetings, the reader’s heart is warm. And then Paul’s tone changes abruptly.</p><p>And that turn is itself an important lesson:</p><p><b>Acceptance (14:1) is not the same as having no boundaries (16:17).</b></p><p>But look carefully: <b>the criteria Paul gives are extremely specific — there are five of them:</b></p><pre>① causing divisions\n② setting traps that make people fall\n③ contrary to the teaching you learned\n④ not serving the Lord, but their own belly\n⑤ deceiving the innocent with smooth talk</pre><p>And the third is <b>an objective doctrinal standard</b> — “contrary to <b>the teaching you learned</b>.”</p><p><b>What the text plainly says:</b> watch closely and turn away from those who depart from the teaching handed down, who use division as their method and themselves as their end.</p><p><b>What may fairly be drawn from it:</b> <b>the criterion is not “he disagrees with me.”</b></p><p>The one Romans 14 tells us to accept still acts “to the Lord” and “gives thanks to God” (14:6);<br>the person in 16:18 <b>“is not serving the Lord, but his own belly.”</b><br><b>These are two entirely different people.</b></p><p><b>⚠ Pastoral note:</b> this verse has been misused in church history to exclude those we dislike. <b>Before using it, check each of those five criteria honestly.</b></p>"},{"a":19,"z":20,"star":true,"grk":"<p>19 …θέλω δὲ ὑμᾶς σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν. 20 ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει.</p>","lit":"<p>19 “Your <b>obedience</b> has become known to everyone, so I rejoice over you; but I want you to be <b>wise as to what is good, and unmixed as to what is evil</b>.”</p><p>20 “And <b>the God of peace</b> will soon <b>crush Satan under your feet</b>. The grace of our Lord Jesus be with you.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>obedience</td><td>ὑπακοή</td><td>hypakoē</td><td>G5218</td><td><b>hearing from underneath</b> (the word of 1:5 and 16:26)</td></tr><tr><td>wise</td><td>σοφός</td><td>sophos</td><td>G4680</td><td>wise</td></tr><tr><td>innocent</td><td>ἀκέραιος</td><td>akeraios</td><td>G185</td><td>ἀ + κεράννυμι (to mix): <b>unmixed, unadulterated</b></td></tr><tr><td>will crush</td><td>συντρίψει</td><td>syntripsei</td><td>G4937</td><td><b>to crush, to shatter</b></td></tr><tr><td>soon</td><td>ἐν τάχει</td><td>en tachei</td><td>G5034</td><td>quickly</td></tr></table>","gram":"<p><b>★ First light: hypakoē (16:19) — the frame of the letter</b></p><pre>1:5    “for the OBEDIENCE OF FAITH (ὑπακοὴν πίστεως) among all the nations”\n16:19  “your OBEDIENCE (ὑπακοή) has become known to everyone”\n16:26  “for the OBEDIENCE OF FAITH (ὑπακοὴν πίστεως)”</pre><p><b>★ Second light: akeraios — “unmixed”</b></p><p>The literal sense is <b>“without anything mixed in”</b> — as of unwatered wine, or unalloyed metal.</p><p>And the Lord Jesus uses the same word:</p><p>Matthew 10:16, “be <b>wise</b> as serpents and <b>harmless</b> (ἀκέραιοι) as doves.”</p><p><b>“Innocent as to evil” does not mean stupid. It means untouched by evil — clean, with nothing mixed in.</b></p><p><b>★★ Third light: 16:20 goes back to Genesis 3:15</b></p><p>“The God of peace will soon <b>crush</b> (συντρίψει) Satan under your feet.”</p><p>And Genesis 3:15 says: <b>“he shall bruise your head.”</b></p><p>At the very end of the letter Paul takes his readers back to <b>the oldest promise in Scripture</b>.</p><p>And notice the link between 16:18 and 16:20:</p><pre>16:18  they use the [SERPENT’S] method (ἐξαπατάω)\n  ↓\n16:20  and that [SERPENT] is about to be crushed</pre><p><b>★ Fourth light: “under YOUR feet”</b></p><p>Notice Paul does <b>not</b> say “under Christ’s feet.” He says <b>“under your feet.”</b></p><p>Which is consistent with the earlier chapters:</p><pre>5:17   “they shall REIGN in life”\n8:37   “we are MORE THAN CONQUERORS”\n16:20  “Satan… under YOUR feet”</pre><p><b>★ Fifth light: “the God of peace”</b></p><pre>15:33  “may the GOD OF PEACE be with you all”\n16:20  “the GOD OF PEACE will soon crush Satan under your feet”</pre><p>Read together they are striking: the same “God of peace” — <b>on one hand with you, on the other crushing Satan.</b><br><b>Peace here is not passive. It is the peace that follows victory.</b></p>","exp":"<p>After the warning, Paul does two things.</p><p><b>First, he affirms them</b> (16:19a): “your <b>obedience</b> has become known to everyone.”</p><p>He is not scolding. He is protecting a people who were already good.</p><p><b>Second, he gives a very balanced expectation:</b></p><p><b>“Wise as to good, innocent as to evil.”</b></p><p>And “innocent” (ἀκέραιος) literally means <b>“unmixed”</b> — the Lord uses the same word: “wise as serpents and <b>harmless</b> (ἀκέραιοι) as doves” (Matthew 10:16).</p><p><b>It is not a call to be stupid. It is a call to stay clean of evil, with nothing mixed in.</b></p><p>And then 16:20 — a verse whose placement only becomes clear when read immediately after 16:18:</p><pre>16:18  they use the [SERPENT’S] method (ἐξαπατάω = Genesis 3:13, “the serpent deceived me”)\n  ↓\n16:20  and that [SERPENT] is about to be [CRUSHED] (συντρίβω = Genesis 3:15, “bruise your head”)</pre><p><b>What the text plainly says:</b> God will soon crush Satan under the feet of his people.</p><p><b>What may fairly be drawn from it:</b> at the close of the letter Paul takes his readers back to <b>the oldest promise in Scripture</b> (Genesis 3:15).</p><p>And he says “under <b>your</b> feet,” not “under Christ’s feet” — consistent with 5:17, “reign in life,” and 8:37, “more than conquerors.”</p><p><b>⚠ Pulpit integrity:</b> “soon” (ἐν τάχει) must not be used to calculate any timetable. <b>Paul’s point is certainty, not schedule.</b></p>"},{"a":21,"z":24,"star":true,"grk":"<p>21 Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου. 22 ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ. 23 ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ὅλης τῆς ἐκκλησίας. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.</p>","lit":"<p>21 “Timothy my <b>fellow worker</b> greets you; and so do Lucius, Jason and Sosipater, my kinsfolk.”</p><p>22 “<b>I, Tertius — the one who wrote this letter down</b> — greet you in the Lord.”</p><p>23 “Gaius greets you — <b>my host, and host of the whole church</b>. Erastus, <b>the city’s treasurer</b>, greets you, and Quartus the brother.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>greets you</td><td>ἀσπάζεται</td><td>aspazetai</td><td>G782</td><td><b>indicative</b>: so-and-so greets you (↔ the <b>imperative</b> of 16:3–16)</td></tr><tr><td>who wrote this letter</td><td>ὁ γράψας τὴν ἐπιστολήν</td><td>—</td><td>G1125</td><td><b>the one who wrote this letter down</b></td></tr><tr><td>host</td><td>ξένος</td><td>xenos</td><td>G3581</td><td><b>host / guest</b> (see below)</td></tr><tr><td>city treasurer</td><td>οἰκονόμος τῆς πόλεως</td><td>oikonomos</td><td>G3623</td><td><b>the city’s financial officer</b></td></tr></table>","gram":"<p><b>★★ First light: Tertius’ one sentence (16:22)</b></p><p><b>“I, Tertius, who wrote this letter, greet you in the Lord.”</b></p><p>This is an extremely rare thing in the New Testament: <b>an amanuensis putting his head up inside someone else’s letter and saying a word of his own.</b></p><p>Picture the scene: Paul dictating; Tertius writing. Sixteen chapters. Hours, perhaps days.</p><p>And then they come to the greetings, and Paul perhaps pauses — and Tertius says, <b>“may I send a greeting too?”</b></p><p><b>Paul let the man who was doing the writing put his own name in Paul’s letter.</b></p><p><b>★ Second light: xenos (16:23, “host”)</b></p><p>An interesting word: it can mean either <b>guest</b> or <b>host</b>. Here it means <b>host</b>.</p><p>And Paul says Gaius hosted not only him but <b>the whole church</b> — most likely meaning that the church met in his house.<br>(Compare 1 Corinthians 1:14, where Paul mentions baptising a Gaius at Corinth.)</p><p><b>★ Third light: Erastus — “the city treasurer”</b></p><p>οἰκονόμος τῆς πόλεως — <b>the city’s financial officer</b>.</p><p>This verse shows that among the people greeted in one letter there were <b>believers of slave origin and a municipal public official</b>.</p><p>(On the paving inscription bearing the name “Erastus” excavated at Corinth, see the disputed material — <b>scholars differ</b>.)</p><p><b>★ Fourth light: on verse 24</b></p><p>Some manuscripts include a verse 24 here (“the grace of our Lord Jesus Christ be with you all. Amen”). Most modern scholars judge it to be a scribal repetition from 16:20.</p><p><b>Nothing doctrinal hangs on it</b> (16:20 already contains the same words). There is no need to raise it from the pulpit.</p>","exp":"<p>These verses look like an incidental postscript. But two things are worth pausing over.</p><p><b>First, the mood changes.</b></p><p>16:3–16 was <b>imperative</b> (you go and greet him); here it is <b>indicative</b> (so-and-so greets you).</p><p><b>What Paul is doing is joining the two ends together:</b> the co-workers here in Corinth greeting the brothers and sisters there in Rome.</p><p><b>Second, Tertius’ one sentence (16:22).</b></p><p>In the first century a long letter was normally written out by <b>a professional amanuensis</b>. Paul dictated; Tertius wrote, stroke by stroke.</p><p>And when they came to the greetings — <b>the man doing the writing put his head up inside someone else’s letter and said a word.</b></p><p>The composition of this list is worth noticing too:</p><table><tr><th>Person</th><th>Standing</th></tr><tr><td>Timothy</td><td>Paul’s <b>fellow worker</b></td></tr><tr><td>Tertius</td><td><b>the amanuensis</b></td></tr><tr><td>Gaius</td><td><b>the host</b> (the church probably met in his house)</td></tr><tr><td><b>Erastus</b></td><td><b>the city treasurer — a public official</b></td></tr></table><p><b>What the text plainly says:</b> Paul’s co-workers send greetings to the church at Rome, including Tertius who wrote the letter.</p><p><b>What may fairly be drawn from it:</b> Paul let <b>the man who did his writing</b> <b>leave his name in Paul’s own letter</b>.</p><p><b>Biblical selflessness is not “erasing names.” It is “not fighting for your own name, while taking very great care to remember other people’s.”</b></p><p><b>On verse 24:</b> some manuscripts have it; most modern scholars judge it a scribal repetition from 16:20. Nothing doctrinal hangs on it, and there is no need to raise it from the pulpit; if asked, explain honestly that this is a normal feature of manuscript transmission.</p>"},{"a":25,"z":27,"star":true,"grk":"<p>25 Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου, 26 φανερωθέντος δὲ νῦν διά τε γραφῶν προφητικῶν κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος, 27 μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>25 “Now to him who is <b>able to make you stand</b> — according to my gospel and the preaching of Jesus Christ, according to the revelation of <b>the mystery kept in silence through eternal ages</b>;”</p><p>26 “<b>but now made manifest</b>, and by <b>the prophetic Scriptures</b>, according to the command of the eternal God, <b>made known to all nations</b> for <b>the obedience of faith</b> —”</p><p>27 “to <b>the only wise God</b>, <b>through Jesus Christ</b>, be the glory forever. Amen.”</p><p>(Note: in the Greek, 25–27 is <b>a single long sentence</b>, whose main weight falls on the doxology in verse 27; translations break it up for readability.)</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>establish</td><td>στηρίξαι</td><td>stērixai</td><td>G4741</td><td><b>to make firm, to make stand</b> (<b>the word of 1:11!</b>)</td></tr><tr><td>kept secret</td><td>σεσιγημένου</td><td>sesigēmenou</td><td>G4601</td><td>σιγάω = <b>to keep silence</b> (perfect passive participle)</td></tr><tr><td>mystery</td><td>μυστήριον</td><td>mystērion</td><td>G3466</td><td><b>hidden before, now revealed</b> (the word of 11:25)</td></tr><tr><td>made manifest</td><td>φανερωθέντος</td><td>phanerōthentos</td><td>G5319</td><td><b>made manifest</b> (<b>the word of 3:21!</b>)</td></tr><tr><td>obedience of faith</td><td>εἰς ὑπακοὴν πίστεως</td><td>—</td><td>—</td><td><b>unto the obedience of faith</b> (<b>the phrase of 1:5!</b>)</td></tr><tr><td>only wise</td><td>μόνῳ σοφῷ</td><td>monō sophō</td><td>G3441 / G4680</td><td>the only wise</td></tr></table>","gram":"<p><b>★★ First light: stērizō — the word from chapter 1</b></p><pre>1:11   “I long to see you, that I may impart to you some spiritual gift,\n        so that you may be ESTABLISHED (στηριχθῆναι)”\n  ↓ sixteen chapters\n16:25  “to HIM WHO IS ABLE… to ESTABLISH (στηρίξαι) you”</pre><p>This is the most moving echo in the whole letter:</p><p>Chapter 1: <b>“I long to strengthen you.”</b><br>Chapter 16: <b>“only God is able to establish you.”</b></p><p><b>That is the distance of an entire letter.</b></p><p><b>★★ Second light: eis hypakoēn pisteōs — the frame of the whole letter</b></p><p>This phrase occurs <b>only twice</b> in Romans:</p><pre>1:5    “for the OBEDIENCE OF FAITH among all the nations, for his name’s sake”\n16:26  “made known to all the nations, for the OBEDIENCE OF FAITH”</pre><p><b>Paul frames the whole letter with the same phrase.</b><br>Sixteen chapters of theology, with one sentence written at each end: <b>the obedience of faith.</b></p><p><b>★ Third light: phaneroō — the word from chapter 3</b></p><pre>3:21   “but now, apart from the law, the righteousness of God has been MANIFESTED (πεφανέρωται)”\n16:26  “but now MADE MANIFEST (φανερωθέντος)”</pre><p><b>★ Fourth light: sigaō — “that mystery was silent a long time”</b></p><p>“The mystery kept secret through eternal ages” — σεσιγημένου, literally <b>“having been kept in silence.”</b></p><p>It is a lovely word: <b>that mystery was quiet for generation after generation.</b><br>And then — now it has been made manifest.</p><p><b>★ Fifth light: the last prepositional phrase</b></p><p>“To the only wise God, <b>through Jesus Christ</b> (διὰ Ἰησοῦ Χριστοῦ), be the glory.”</p><p>This is exactly consistent with 11:36:</p><p>11:36, “for of him and through him and to him are all things. To him be the glory.”</p><p><b>The glory goes to God — and the road it travels is Jesus Christ.</b></p>","exp":"<p>The last three verses of Romans gather up the whole letter:</p><pre>“him who is able to establish you” (16:25)   ← echoes 1:11\n“according to my gospel” (16:25)             ← echoes 1:1, 1:16\n“the mystery… now made manifest” (16:25–26)  ← echoes 3:21, 11:25\n“by the prophetic Scriptures” (16:26)        ← echoes 1:2\n“to all nations, for the obedience of faith” (16:26) ← echoes 1:5\n“to God be the glory” (16:27)                ← echoes 11:36</pre><p><b>This is not an ending written off the cuff.<br>This is an ending that goes back to the beginning.</b></p>"}],"1":[{"a":1,"z":1,"star":false,"grk":"<p>Παῦλος δοῦλος Χριστοῦ Ἰησοῦ, κλητὸς ἀπόστολος ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ</p>","lit":"<p>“Paul, a <b>slave</b> of Christ Jesus, a <b>called</b> apostle, <b>having been set apart</b> for the gospel of God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>servant</td><td>δοῦλος</td><td>doulos</td><td>G1401</td><td><b>a slave, the property of a master</b></td><td>not a hired man — one bought and wholly owned</td></tr><tr><td>called</td><td>κλητός</td><td>klētos</td><td>G2822</td><td>called (adjective, with passive force)</td><td>the apostleship was <b>given</b>, not taken</td></tr><tr><td>set apart</td><td>ἀφωρισμένος</td><td>aphōrismenos</td><td>G873</td><td><b>to separate, to mark off</b></td><td><b>perfect passive participle</b>: separated, and still so</td></tr><tr><td>gospel</td><td>εὐαγγέλιον</td><td>euangelion</td><td>G2098</td><td><b>good news, a report of victory</b></td><td>an imperial word, taken back for God</td></tr></table>","gram":"<p>· <b>δοῦλος</b> stands without an article, in apposition. Paul does not say “I am a preacher.” He says <b>“I am a slave.”</b></p><p>· <b>κλητός</b> is an adjective with passive force — <b>“the one who was called.”</b> The one who called is God.</p><p>· <b>ἀφωρισμένος</b> is a <b>perfect passive participle</b>. This is the most important piece of grammar in the verse
