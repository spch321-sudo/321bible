<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321聖經講義">
<meta name="application-name" content="321聖經講義">
<meta name="description" content="321聖經講義｜羅馬書：全書十六章逐節原文解經、講章逐字稿與321生命應用。">
<title>321聖經講義｜羅馬書</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.02em}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:14px}
.xs{font-size:12.5px}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:17px;line-height:1.75;margin:0 0 4px}
.tip{font-size:13.5px;color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkp{cursor:pointer;border-radius:6px;transition:background .15s}
.mkp:active{background:var(--line)}
.mkp.hl{background:linear-gradient(transparent 60%, rgba(156,107,24,.3) 60%)}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:14.5px;line-height:1.8
}
.mknote b{color:var(--brass);font-size:12px;letter-spacing:.1em}
.mkask{
  display:inline-block;margin-left:8px;border:1px solid var(--line);background:var(--card);
  color:var(--pine);border-radius:8px;padding:3px 9px;font:inherit;font-size:12.5px;cursor:pointer
}
.mkq{
  font-family:var(--serif);font-size:16px;line-height:1.85;border-left:3px solid var(--brass);
  padding:8px 0 8px 12px;margin:6px 0 12px;color:var(--dusk)
}
.hlq{font-family:var(--serif);font-size:15.5px;line-height:1.8;margin:0;cursor:pointer}
.btn.xs2{font-size:12.5px;padding:6px 11px}
.mkhint{
  font-size:12.5px;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:9px;padding:9px 11px;margin:4px 0 12px;line-height:1.75
}

/* ── 朗讀狀態列 ── */
.spkbar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(74px + env(safe-area-inset-bottom));z-index:110;
  display:flex;align-items:center;gap:9px;
  background:var(--ink);color:var(--paper);border-radius:999px;
  padding:8px 8px 8px 15px;font-size:13.5px;max-width:calc(100% - 32px);
  box-shadow:0 6px 24px rgba(0,0,0,.22)
}
.spkbar b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.spkbar .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.spkbar button{
  border:0;background:rgba(255,255,255,.16);color:inherit;width:30px;height:30px;
  border-radius:50%;font-size:13px;cursor:pointer;flex:0 0 auto
}

/* ── 小智 ── */
.xzfab{
  position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:70;
  width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
  background:var(--pine);color:#fff;font-size:21px;
  box-shadow:0 8px 26px rgba(31,77,61,.4);display:grid;place-items:center
}
html[data-dark="1"] .xzfab{color:#0E1412}
.xz{position:fixed;inset:0;z-index:150;display:none}
.xz.on{display:block}
.xzmask{position:absolute;inset:0;background:rgba(10,16,14,.44)}
.xzcard{
  position:absolute;left:0;right:0;bottom:0;max-height:86vh;
  background:var(--paper);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:up .22s ease
}
.xzh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.xzh b{font-family:var(--serif);font-size:17px}
.xzb{flex:1;overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.xzm{
  max-width:88%;padding:11px 14px;border-radius:15px;margin:0 0 11px;
  font-size:15px;line-height:1.85;white-space:normal
}
.xzm.user{background:var(--pine);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
html[data-dark="1"] .xzm.user{color:#0E1412}
.xzm.assistant{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.xzm.xzwait{opacity:.6;font-style:italic}
.xzspk{
  display:block;margin-top:8px;border:1px solid var(--line);background:transparent;
  color:var(--dusk);border-radius:8px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer
}
.xzhi{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;font-size:15px;line-height:1.85;margin-bottom:12px
}
.xzq{display:flex;flex-direction:column;gap:7px}
.xzq button{
  text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:11px;padding:11px 13px;font:inherit;font-size:14.5px;cursor:pointer;line-height:1.7
}
.xzf{
  display:flex;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line)
}
.xzf input{
  flex:1;border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:inherit;font:inherit;font-size:16px;padding:11px 13px
}

/* ── 語音選擇 ── */
.vrow{display:flex;gap:8px}
.vpill{
  flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:13px;padding:11px 6px;font:inherit;cursor:pointer;text-align:center;
  display:flex;flex-direction:column;gap:3px;transition:all .15s
}
.vpill{text-decoration:none}
.vpill b{font-size:15px;font-weight:600}
.vpill span{font-size:11.5px;color:var(--dusk);line-height:1.4}
.vpill.on{background:var(--pine);border-color:var(--pine);color:#fff}
.vpill.on span{color:rgba(255,255,255,.75)}
html[data-dark="1"] .vpill.on{color:#0E1412}
html[data-dark="1"] .vpill.on span{color:rgba(0,0,0,.6)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="splash">
  <img id="splashIcon" alt="321聖經講義">

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"我不以福音為恥","sub":"三場交換","lv":"A","arc":"揭露","q":"人怎麼會走到這一步？神的忿怒是不是太重了？","truth":"人把神換掉了；而神在福音裡，把義換給了人。","mv":{"t":"這福音本是神的大能，要救一切相信的。","r":"羅1:16"},"card":["罪的第一步不是殺人放火，是不榮耀神、不感謝神。","人做了三場交換：換掉神的榮耀、換掉真理、換掉本性。","而神的回應是三次「任憑」——祂鬆手，讓人得著他所要的。"],"sec":[["1:1–7","問安：福音、僕人、萬國"],["1:8–15","保羅為什麼想去羅馬"],["1:16–17","主題：義人必因信得生"],["1:18–32","忿怒顯明：三場交換與三次任憑"]],"serm":{"pts":[["一、一個不以為恥的人","1:1–17","福音是神的大能，不是我的說服力"],["二、三場交換","1:21–27","人換掉了神，就換掉了自己"],["三、三次任憑","1:24–28","最可怕的審判，是神鬆手"]]},"self":"不榮耀神、不感謝神——把神從寶座上請下來，把自己當源頭。","t321":{"k":"誰坐在寶座上？罪的起點是主權，不是行為。","g":"福音的大能不在傳的人身上。","p":"一個不感謝的人，建不出屬神的體系。"},"grp":["你信主以來，對神最大的一個誤會是什麼？","「不感謝」為什麼是罪的起點？這對你有什麼提醒？","你最近一次真心對神說「謝謝」，是什麼時候？","「任憑」這件事，讓你想到什麼？","這禮拜你要為哪一件事，重新開口感謝神？"],"prac":{"main":"每天睡前寫下三件感謝神的具體事，連續七天。","items":["對神：一次禱告只感謝，不求任何事","對自己：寫下我最近把什麼當成源頭","對人：向一個人說出你對他的感謝","對生活：這禮拜飯前都真的謝飯"]},"safe":["不可把1:18的「忿怒」講成情緒失控 ——那是聖潔對罪的必然反應，不是「神生氣了」。","不可把三次「任憑」講成神主動使人犯罪 ——παρέδωκεν 是司法性的鬆手：神放手，讓人得著他所堅持要的。","不可把1:21「思念變為虛妄」的被動式，講成「所以是神把他們的心弄暗的」 ——希臘文的被動形式常只表達「進入某種狀態」，未必指向施動者。這是超出證據的推論。","不可用1:26–27羞辱人 ——保羅的論證是敬拜的錯亂帶出受造秩序的錯亂，不是道德排行榜；證據就是29–31節把「嫉妒、背後說人、違背父母」列在同一份清單上。講這一段必須有牧養的溫度。","不可把1:20講成「所以人不必聽福音也能得救」 ——1:20說的是無可推諉，不是已經得救。","⚠ 引註必須誠實 ——本章素材中，「換真跡的老先生」是來源不明的通俗故事、亞歷山米諾塗鴉的年代有爭議、路德的見證是他晚年的回憶。每一項都必須照附錄A的注意事項處理。"]},{"n":2,"t":"那把尺，會轉過來","sub":"尺、帳、刀","lv":"A","arc":"扎心","q":"我沒有做那些事，我算好人吧？","truth":"你用來量別人的那把尺，會轉過來量你自己。","mv":{"t":"你這論斷人的，無論你是誰，也無可推諉。","r":"羅2:1"},"card":["第一章講「那些人」；第二章說：你也一樣。","神的恩慈不是縱容，是要領你悔改。","真猶太人不在外面，在裡面；不在肉身，在心裡。"],"sec":[["2:1–5","那把尺轉過來"],["2:6–11","照各人的行為報應"],["2:12–16","沒有律法的外邦人與良心"],["2:17–29","真割禮在乎心"]],"serm":{"pts":[["一、一把會轉過來的尺","2:1–5","你論斷的，正是你自己在做的"],["二、一本記到那日的帳","2:5–11","積蓄忿怒，也是一種積蓄"],["三、一把往心裡切的刀","2:25–29","割禮是心裡的，在乎靈不在乎儀文"]]},"self":"坐上審判席——用神的尺量別人，不量自己。","t321":{"k":"論斷就是坐上不屬於我的位置。","g":"外面的記號不能代替裡面的生命。","p":"一個彼此論斷的群體，不可能是屬神的體系。"},"grp":["你最近一次在心裡論斷人，是什麼事？","「神的恩慈是領你悔改」——這句話你怎麼理解？","有沒有一件事，你要求別人做到，自己卻做不到？","「裡面作的才是真猶太人」——對你有什麼提醒？","這禮拜你要向誰道歉，或收回哪一句話？"],"prac":{"main":"這禮拜每次要論斷人時，停下來問：「這件事我自己做到了嗎？」","items":["對神：求祂讓我看見自己","對自己：記錄一週論斷了幾次","對人：不在背後說任何一個人的缺點","對生活：把那把尺先量自己"]},"safe":["不可把「不要論斷」講成「不要分辨是非」 ——必須在同一段內補上界線（本講稿在第一大段已處理）。","不可把「照行為報應」（2:6）略過不提，也不可講成「行為得救」 ——本講稿選擇不在台上展開這個爭議，改放在小組材料；若會眾提問，用第二十部分的三種觀點誠實回答。","不可把「神的名因你們受了褻瀆」講成「別人不信主都是你的錯」 ——本講稿已加入護欄句。"]},{"n":3,"t":"但如今","sub":"一張嘴、一張座、一道門","lv":"A","arc":"釋放","q":"如果沒有一個義人，神還能怎麼辦？","truth":"神既是義的，又稱信耶穌的人為義——這兩件事在十字架上同時成立。","mv":{"t":"但如今，神的義在律法以外已經顯明出來。","r":"羅3:21"},"card":["3:20——每一張嘴被封住，全世界都伏在神審判之下。","3:21——「但如今」。全卷書的第一個轉折。","ἱλαστήριον：施恩座。神把那個一年只能進去一次的地方，擺在眾人眼前。"],"sec":[["3:1–8","猶太人的長處與神的信實"],["3:9–20","沒有義人，連一個也沒有"],["3:21–26","但如今：神的義顯明"],["3:27–31","誇口在哪裡？沒有可誇的了"]],"serm":{"pts":[["一、一張被封住的嘴","3:9–20","律法的功用是讓人閉嘴"],["二、一張擺出來的座","3:21–25","ἱλαστήριον：施恩座被擺在眾人眼前"],["三、一道白白開的門","3:24–26","神既是義的，又稱人為義"]]},"self":"還有一句「可是」——總想在恩典後面加上自己的一點。","t321":{"k":"沒有可誇的了——連信心都不是我的功勞。","g":"稱義是白白的，所以榮耀不可能歸給我。","p":"門若不是白白的，體系就會變成階級。"},"grp":["「沒有義人，連一個也沒有」——你第一次真的認同這句話是什麼時候？","「但如今」這三個字，對你現在的處境說了什麼？","施恩座的畫面（一年一次 vs 擺在眾人眼前）給你什麼感覺？","你心裡還有哪一句「可是」？","這禮拜你要為哪一件事，停止想靠自己補救？"],"prac":{"main":"這禮拜每天早上說一次：「我沒有可誇的，只有白白的恩典。」","items":["對神：為「但如今」感謝一次","對自己：寫下你心裡那句「可是」","對人：對一個你覺得「他不配」的人，說一句祝福","對生活：停止一件想靠表現換取神喜悅的事"]},"safe":["不可把「挽回祭」講成「憤怒的父神被慈愛的耶穌安撫」 ——3:25的主詞是神。必須強調：是神自己擺出來的（約壹4:10）。","不可把「律法」講成壞東西 ——3:31明說「更是堅固律法」。","不可太早給安慰 ——第一大段若心軟提前給福音，第二大段的「但如今」就沒有力量了。這篇講章的力量，全在於前段有沒有講透。","不可把「白白地」講成「所以怎麼活都沒關係」 ——3:8保羅已經把這個誤解稱為毀謗。"]},{"n":4,"t":"神竟然稱罪人為義","sub":"一本帳、一個印、一座墳","lv":"B","arc":"印證","q":"這是不是保羅發明的新道理？","truth":"神稱罪人為義，不是新聞——創世記十五章就有了。","mv":{"t":"惟有不做工的，只信稱罪人為義的神，他的信就算為義。","r":"羅4:5"},"card":["λογίζομαι（算）在第四章出現十一次——這是一本記帳的章。","作工的得工價，不算恩典，乃是該得的。","亞伯拉罕所信的，是叫死人復活、使無變為有的神。"],"sec":[["4:1–8","亞伯拉罕與大衛：算為義"],["4:9–12","割禮是印記，不是條件"],["4:13–17","應許本乎信，屬乎恩"],["4:18–25","在無可指望的時候，因信仍有指望"]],"serm":{"pts":[["一、一本記錯的帳","4:1–8","神把義記在一個沒有做工的人名下"],["二、一個後蓋的印","4:9–12","割禮是印記，不是入場券"],["三、一座空的墳","4:17–25","他所信的是叫死人復活的神"]]},"self":"自己記帳——想讓神欠我一點什麼。","t321":{"k":"不做工的，只信——那是主權的移交。","g":"工價可以誇口，恩賜不能。","p":"靠資歷建立的體系，遲早會排擠人。"},"grp":["你有沒有過「我做了這麼多，神應該……」的想法？","「作工的得工價，不算恩典」——這對你的服事有什麼提醒？","亞伯拉罕「身體如同已死」——你有沒有一件事已經死了？","什麼是你的「印記」，什麼是你的「條件」？","這禮拜你要停止在哪一件事上跟神記帳？"],"prac":{"main":"寫下你心裡「神欠我」的那筆帳，然後劃掉它。","items":["對神：為一件「無可指望」的事禱告","對自己：檢視我是否在跟神算工價","對人：不跟任何人計較這禮拜的付出","對生活：做一件沒有人會知道是你做的好事"]},"safe":["不可把「不作工」講成「基督徒不必做事」 ——同一章4:12就說要「按蹤跡去行」。","不可把「稱罪人為義」講成「神不在乎罪」 ——必須配上3:25「神追討了，追討在自己兒子身上」。","不可把4:15講成「沒聽過福音的人沒有罪」 ——παράβασις（過犯）不等於 ἁμαρτία（罪）；羅5:13–14已說明。","不可把4:19講成「亞伯拉罕從來沒有失敗過」 ——創世記誠實記錄了他的軟弱；那正是4:8「主不算為有罪」的示範。","不可把雅各書2:24講成與保羅矛盾 ——兩人對付不同的敵人，用的是不同的字義。"]},{"n":5,"t":"何況","sub":"一場停戰、一次傾倒、一場換王","lv":"A","arc":"確據","q":"我怎麼知道神會愛我到底？","truth":"祂在你最糟的時候做了最難的事；現在你已經是祂的了，何況呢？","mv":{"t":"惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。","r":"羅5:8"},"card":["εἰρήνη（和平）不是心情，是狀態——戰爭結束了。","「澆灌」是完成被動式：倒下去了，而且還在。","παρακοή／ὑπακοή 的字根都是「聽」——亞當聽偏了，基督在底下聽。"],"sec":[["5:1–5","稱義的果效：和好、進入、盼望"],["5:6–11","何況：輕重論證"],["5:12–21","兩個亞當"]],"serm":{"pts":[["一、一場已經結束的戰爭","5:1–2","與神相和是狀態，不是感覺"],["二、一次倒下去的愛","5:5–8","澆灌，而且還在"],["三、一場換了王的統治","5:17–19","不再是罪作王，是我們在生命中作王"]]},"self":"聽偏了——把神的話聽成別的意思。","t321":{"k":"換王：不再容罪作王。","g":"愛是被澆灌的，不是被賺來的。","p":"在生命中作王的人，才建得出體系。"},"grp":["「與神相和」是狀態不是心情——這對你有什麼分別？","「還作罪人的時候」——你信主前最不堪的那一段，神怎麼看？","「何況」的邏輯（最難的都做了）對你現在的擔憂說什麼？","亞當「聽偏了」——你最近有沒有把神的話聽偏？","這禮拜你要在哪一件事上，讓耶穌作王？"],"prac":{"main":"每天早上說一次5:8，並加一句：「祂在我最糟的時候就做了。」","items":["對神：為「和好」感謝，不求別的","對自己：寫下你最怕神知道的那件事，交給祂","對人：主動與一位關係緊張的人和好","對生活：停止用表現換取安全感"]},"safe":["不可把5:1的「相和」講成心情 ——那會讓感覺不好的人以為自己失去了救恩。","不可拿5:3去對受苦的人說教 ——那節經文是給受苦的人自己用的。","不可把5:20講成犯罪的許可證 ——必須立刻補上6:1「斷乎不可」。","不可在5:12把某一種原罪模型講成唯一正統 ——聯邦說與實存說都是福音派立場。","不可把5:18的「眾人」講成普救論 ——5:17已用「領受的人」限定。"]},{"n":6,"t":"你已經死了","sub":"一場葬禮、一本帳、一批兵器","lv":"A","arc":"轉向生活","q":"恩典這麼大，那我還在意犯罪做什麼？","truth":"恩典不是犯罪的許可證，是換了主人。","mv":{"t":"向罪也當看自己是死的；向神在基督耶穌裡，卻當看自己是活的。","r":"羅6:11"},"card":["6:2的πῶς是「怎麼可能」，不是「不應該」——那是身分的不可能。","σύμφυτος（同長成）是嫁接的字：兩根枝子長成一棵。","καταργέω 不是「消滅」，是「解除職權」——罪被免職了，但還在辦公室裡。"],"sec":[["6:1–11","與基督同死同活"],["6:12–14","不要容罪作王"],["6:15–23","兩個主人"]],"serm":{"pts":[["一、一場已經辦過的葬禮","6:3–5","你不是要去死，你已經死了"],["二、一本要重新算的帳","6:11","全書第一個命令：算"],["三、一批要交出去的兵器","6:13","你的肢體是兵器，交給誰？"]]},"self":"繼續聽那個被免職的主人講話。","t321":{"k":"不要容罪作王——王位只有一個。","g":"是恩典作王，不是我的自律。","p":"體系的地基是新身分，不是新規矩。"},"grp":["「你已經死了」——這句話對你是安慰還是壓力？","「算自己是死的」是什麼意思？怎麼算？","罪被免職了卻還在辦公室裡——你有這種經驗嗎？","你的肢體最近交給了誰？","這禮拜你要把哪一件事的「兵器」交還給神？"],"prac":{"main":"每天早上算一次：「向罪，我是死的；向神，我是活的。」","items":["對神：把身體具體獻上一次","對自己：找出一個被免職卻還在聽的聲音","對人：用你的手做一件服事人的事","對生活：斷掉一項讓罪好辦事的預備"]},"safe":["不可把 καταργέω 講成「消滅」 ——那會產生「基督徒不會再有罪的掙扎」的錯誤期待，害了正在掙扎的人。","不可把6:11講成自我催眠 ——必須把6:3–10的八節事實講在前面。","不可只講第六章就要求會眾勝過罪 ——必須至少提一句：能力的來源在第八章。否則這篇道會變成一場高級的意志力訓練。","不可把「奴僕」講成神與我們關係的全貌 ——保羅自己在6:19道歉了，並在8:15升級為「兒子」。","不可把6:23的「死」講成單純的恐嚇 ——若牧養對象中有憂鬱或自傷風險者，重點應放在「神的恩賜是永生」，並鼓勵尋求專業與教會的實際幫助。"]},{"n":7,"t":"我真是苦啊","sub":"一紙婚書、一個灘頭堡、一聲呼喊","lv":"A","arc":"誠實面對失敗","q":"我知道該怎麼做，為什麼還是做不到？","truth":"律法是聖潔的；問題不在律法，在我——而出路不是一個方法，是一位。","mv":{"t":"我真是苦啊！誰能救我脫離這取死的身體呢？","r":"羅7:24"},"card":["第七章7–25節：「我」約四十次，聖靈零次。","ἀφορμή（機會）是軍事用語：灘頭堡。罪在誡命上建立了據點。","παράκειμαι：願望隨手可得；缺的是把它做出來的力量。"],"sec":[["7:1–6","婚姻的比喻：你在律法上死了"],["7:7–13","律法是罪嗎？不是"],["7:14–25","掙扎：我所願意的，我不做"]],"serm":{"pts":[["一、一紙已經失效的婚書","7:1–6","有人被處死了，所以你自由了"],["二、一個罪佔住的灘頭堡","7:7–13","保羅單挑第十誡——只有它看不見"],["三、一聲半夜的呼喊","7:14–25","不是「幫助我努力」，是「主啊，救我」"]]},"self":"「我知道，所以我要努力」——最虔誠的一種有己。","t321":{"k":"用腦靠自己的極限，就是第七章。","g":"出路不是方法，是一位。","p":"靠更好的規矩建不出屬神的體系。"},"grp":["「立志為善由得我，行出來由不得我」——你在哪一件事上最有共鳴？","保羅單挑「不可起貪心」——為什麼是這一條？","「那個掙扎」是不是生命的證據？你怎麼看？","你對付罪的方法，是靠意志力還是靠聖靈？","這禮拜你要在哪一件事上，改說「主啊，救我」？"],"prac":{"main":"這禮拜失敗時，不說「我要更努力」，改說「主啊，救我」。","items":["對神：把那件反覆的事說出來一次","對自己：那個掙扎是生命的證據——記住它","對人：找一位同伴說出你的掙扎","對生活：斷掉一條通往失敗的預備路線"]},"safe":["不可把某一種「我是誰」的讀法說成唯一正統 ——必須在台上說明歷代有不同看法，並指出兩邊的共同結論。","不可讓講章停在絕望 ——必須明確給出第八章的方向。","不可使用「屍體綁在犯人身上」的素材 ——缺乏可靠史料。","不可把7:17講成推卸責任 ——保羅整章在承擔，最後喊「我真是苦啊」。","不可把7:18講成全面的自我否定 ——保羅自己限定了範圍：「就是我肉體之中」。","不可忽略會後的關懷 ——這篇道會使一些人第一次願意開口；若察覺嚴重的自我定罪、憂鬱或自傷風險，除屬靈陪伴外，應鼓勵並協助尋求專業協助。"]},{"n":8,"t":"如今","sub":"一位新住客、三聲嘆息、一把沒有停下來的刀","lv":"A","arc":"全書最高點","q":"一個還會失敗的人，怎麼可能同時是不被定罪、而且永不隔絕的？","truth":"住在你裡面的那一位換了；而抓住你的那一位，永遠不會鬆手。","mv":{"t":"如今，那些在基督耶穌裡的就不定罪了。","r":"羅8:1"},"card":["羅6章聖靈0次；羅7:7–25聖靈0次；羅8章聖靈20次以上。","οἰκέω：7:17罪住在我裡頭 → 8:9聖靈住在你們心裡。住客換了。","οὐκ ἐφείσατο（不愛惜）＝創22:12「你沒有留下你的兒子」同一個動詞。"],"sec":[["8:1–4","不定罪：律法所不能行的，神做了"],["8:5–11","兩種心思；聖靈住在你裡面"],["8:12–17","兒子的名分：阿爸！父！"],["8:18–25","受造之物與我們的歎息"],["8:26–27","聖靈的歎息與代求"],["8:28–30","金鏈"],["8:31–39","誰能？沒有"]],"serm":{"pts":[["一、住客換了","8:1–17","定罪沒有消失，定罪換了地址"],["二、三聲嘆息","8:18–27","那不是臨終的呻吟，是產房裡的呻吟"],["三、一把沒有停下來的刀","8:28–39","摩利亞的刀停了；各各他的刀沒有停"]]},"self":"靠意志力對付罪，然後累垮——第七章的循環。","t321":{"k":"凡「被」神的靈引導的——被動式。讓耶穌作王＝我被帶領。","g":"金鏈五環，主詞全部是神。","p":"受造之物切望等候神的眾子顯出來。"},"grp":["8:1「一點定罪也沒有」——你心裡還有沒有一個起訴的聲音？","你順服神的動力，有多少成分是害怕？（8:15）","8:23說有聖靈的人「也是」歎息——你現在心裡的那一聲歎息是什麼？","摩利亞的刀停了，各各他的刀沒有停——這對你有什麼意義？","這一週，你要在哪一件事上停止懷疑神會放手？"],"prac":{"main":"每天有一次禱告，開頭不說「主啊」，說「阿爸」。","items":["對神：連續七天說一次「一點定罪也沒有」","對自己：把8:38–39抄下來，在清單最後加上自己的名字","對人：告訴一位軟弱的弟兄：「歎息不是不屬靈」","對生活：靠著聖靈治死一個具體的惡行，不靠意志力"]},"safe":["不可把8:3講得不精確 ——「罪身的形狀」：真實的人性，卻沒有罪性。這一句必須講清楚。","不可把8:28講成「事情會變好」 ——8:29已經定義了那個「益處」：效法祂兒子的模樣。","不可在錯的時機引用8:28 ——這節是給受苦者自己消化的，不是給旁觀者第三天用來安慰人的。","不可把8:29的某一種讀法說成唯一正統 ——預定論的分歧是宗教改革以來的老問題，必須誠實提及。","不可把「阿爸」說成「幼兒語」 ——這個流行說法已被學界修正。","不可把8:38–39講成「怎樣都不會掉」的許可 ——保羅列的十樣全部是外在的威脅，這一段的處境是逼迫，不是放縱。"]},{"n":9,"t":"神的話落空了嗎？","sub":"一顆碎了的心、一位窯匠、一塊石頭","lv":"A","arc":"沉思","q":"神說過的話，會不會有一天不算數？","truth":"神的話沒有落空——落空的是人靠自己站住的可能。","mv":{"t":"這不是說神的話落了空。","r":"羅9:6"},"card":["保羅講神的主權之前，先哭了（9:1–3）。","9:22–23的語法不對稱：毀滅用被動且未指明施動者；榮耀主詞是神。","保羅自己給第九章的結論是9:32：他們不憑信心求，只憑行為求。"],"sec":[["9:1–5","保羅的心碎與八項特權"],["9:6–13","神的揀選一向如此"],["9:14–18","神不公平嗎？摩西與法老"],["9:19–24","窯匠與泥土"],["9:25–29","舊約的見證：餘數"],["9:30–33","結論：他們憑行為求"]],"serm":{"pts":[["一、一顆碎了的心","9:1–5","講主權之前，他先哭了"],["二、一位有主權的窯匠","9:6–29","如果神欠你，那叫公平；祂不欠你，那叫憐憫"],["三、一塊絆腳的石頭","9:30–33","同一塊石頭：房角石，或絆腳石"]]},"self":"「我有資格」——把神給的禮物當成自己的資本。","t321":{"k":"從審問者的位置，退回受造者的位置。","g":"不在乎那定意的，也不在乎那奔跑的。","p":"屬神的體系不是靠資格制運作的。"},"grp":["如果要列出「你的屬靈資產清單」，你會寫什麼？","你是不是曾覺得，你信主多少有一點是因為「你比較願意」？","你心裡有沒有一個還在外面的名字？你對他是心痛，還是已經放棄？","9:22說神對「可怒的器皿」是多多忍耐——這對那個名字有什麼意義？","這一週，你要為那三個名字禱告七天嗎？"],"prac":{"main":"寫下三個還沒信主的人的名字，為他們禱告七天。","items":["對神：每天說一次「我在這裡，純粹是憐憫」","對自己：寫下屬靈資格清單，然後寫「這些是禮物，不是資本」","對人：當你評估某人「有沒有可能信主」時，說「當初我也沒有資格」","對生活：不用神的主權當作不作為的藉口"]},"safe":["不可跳過9:1–3就直接講主權 ——保羅講主權之前先哭了；次序不可顛倒。","不可讀到窯匠就停 ——保羅自己的結論在9:30–33：「他們不憑著信心求，只憑著行為求。」","不可把9:13講成「神憎恨某些人」 ——必須說明比較式表達與瑪拉基書的民族性上下文。","不可把9:22–23講成對稱的雙重預定 ——原文的語法本身就不對稱。","不可省略9:22的「多多忍耐」 ——那是2:4「領你悔改」的同一個字。","不可把第九章與第十、十一章分開 ——尤其11:1「神棄絕了他的百姓嗎？斷乎沒有！」與11:32。","不可讓第九章變成不傳福音的藉口 ——第十章立刻說：「沒有傳道的，怎能聽見呢？」"]},{"n":10,"t":"那話離你不遠","sub":"一場很累的工程、一句很近的話、一雙很髒的腳","lv":"A","arc":"邀請","q":"一個很熱心、很努力、很虔誠的人，為什麼會走錯？","truth":"那道離你不遠——遠的是我們的自義，和那些還沒有人去的地方。","mv":{"t":"這道離你不遠，正在你口裡，在你心裡。","r":"羅10:8"},"card":["ζῆλος（熱心）＝沸騰。而保羅自己最火熱的那天，正在逼迫教會。","στῆσαι（立自己的義）＝把一樣東西扶起來、立穩——一個很累的工程。","10:13引珥2:32，而那裡的「主」是耶和華（YHWH）。"],"sec":[["10:1–4","熱心，卻走錯了"],["10:5–13","那道離你不遠"],["10:14–17","宣教的鏈條"],["10:18–21","他們聽見了嗎？"]],"serm":{"pts":[["一、一場很累的工程","10:1–4","你一直在扶的那個東西，祂已經替你立好了"],["二、一句很近的話","10:5–13","不必上天，不必下陰間——祂都做完了"],["三、一雙很髒的腳","10:14–21","那雙腳之所以美，是因為它帶來的消息"]]},"self":"立自己的義——一個很虔誠、很費力的動作。","t321":{"k":"口裡認耶穌為主——在羅馬說這句話是有代價的。","g":"得救只需要喊一個名字，榮耀歸給那個名字。","p":"體系靠一雙一雙被差出去的腳。"},"grp":["你最熱心的那段日子，方向對嗎？","你心裡有沒有一個一直在扶、卻一直倒的東西？","有沒有一件事，讓你覺得「我不配靠近神」？","「凡求告主名的」——這個「凡」對你心裡那個人有什麼意義？","這一週，你要對哪一個人說一句話？"],"prac":{"main":"這禮拜對一位未信的朋友，說一句關心的話（不必是講道）。","items":["對神：每天問「我今天做的這件事，是為了讓神接納我，還是因為祂已經接納我？」","對自己：寫下你正在「扶」的那個東西","對人：不用罪疚感推動自己傳福音","對生活：為一位宣教士具體奉獻或代禱一次"]},"safe":["不可把10:4講成「律法作廢了」 ——必須配上3:31「更是堅固律法」與8:4。","不可把10:9–10講成得救的兩個步驟 ——那是一件事的裡外兩面。","不可把10:13講成「喊一喊就得救」 ——下一節就說：不信的人求告不出來。","不可用10:14–15製造罪疚感 ——保羅的起點是10:1的渴望，不是罪疚。","不可用10:18論證「不必再宣教」 ——保羅寫此信時正計畫去西班牙（15:24、28）。","不可跳過10:21 ——全章講人的責任，最後一個畫面卻是神的姿勢。這一節不可省略。"]},{"n":11,"t":"深哉","sub":"七千人、一棵樹、一聲讚嘆","lv":"A","arc":"敬拜","q":"神會不會有一天放手？","truth":"神從來沒有放手；而祂的路，深到我們只能跪下來。","mv":{"t":"深哉，神豐富的智慧和知識！","r":"羅11:33"},"card":["以利亞說「只剩下我一個人」；神說「我為自己留下七千人」。","βαστάζω：不是你托著根，乃是根托著你。","ἀνεξιχνίαστος＝追不到腳印：雪地上跟著走，然後腳印消失了。"],"sec":[["11:1–10","神沒有棄絕：七千人與餘數"],["11:11–16","跌倒的目的"],["11:17–24","橄欖樹：不可誇口"],["11:25–32","奧祕：憐恤眾人"],["11:33–36","頌讚"]],"serm":{"pts":[["一、還有七千人","11:1–10","以利亞不是真的只剩一個，他只是不知道"],["二、一棵不屬於你的樹","11:11–24","不是你托著根，乃是根托著你"],["三、一聲讚嘆","11:25–36","有些觀念的改變，終點不是明白，是敬拜"]]},"self":"蒙恩者的優越感——「還好我不是他們」。","t321":{"k":"一根枝子從來不會扛著樹根。","g":"本於他、倚靠他、歸於他。","p":"健康的體系為還在外面的人留位置。"},"grp":["你有沒有過「只剩我一個」的時候？","你最近對誰（在心裡）說過「還好我不是他」？","有沒有一件事，讓你覺得「這都靠我在撐」？","「失腳不等於跌倒」——你心裡有沒有一個絆了一下的人？","這一週，你要為那個人禱告嗎？"],"prac":{"main":"這禮拜當你想說「還好我不是」，改說「若不是恩典，那就是我」。","items":["對神：那件想不通的事，只說一句「深哉」","對自己：寫下誰扛過你","對人：為一個跌倒的人禱告七天","對生活：停止一次「一定要想清楚」的追問"]},"safe":["不可把11:26講成唯一正確的末世時間表 ——必須說明有不同理解。","★ 不可涉入當代中東政治 ——本章講救恩歷史，不是現代政治。牧者可以有個人看法，但不應把它說成聖經的教導。","不可用11:22恐嚇信徒 ——必須並列11:29「神的恩賜和選召是沒有後悔的」。","不可用11:32論證普救論 ——但也不可把它的寬度講小了。","不可只講11:8（神使他們硬心）而不講11:20（他們因為不信） ——兩面都要說。","不可跳過11:18的警告 ——那是保羅寫本章的主要目的（11:13「我對你們外邦人說這話」）。","★ 不可讓講章停在「系統」上 ——保羅自己的終點是敬拜（11:33）。"]},{"n":12,"t":"所以","sub":"祭壇上、身體裡、街上","lv":"A","arc":"轉折","q":"知道了這麼多，怎麼才能真的改變？","truth":"改變的路徑不是更用力，是換一個心思。","mv":{"t":"不要效法這個世界，只要心意更新而變化。","r":"羅12:2"},"card":["12:1的「所以」是全卷書的轉軸：教義→實踐。","12:2兩個動詞都是被動：你不是被世界模成，就是被神變成。","μεταμορφόω 正是登山變像那個字。"],"sec":[["12:1–2","總綱：獻上與更新"],["12:3–8","在身體裡"],["12:9–13","沒有面具的愛"],["12:14–21","以善勝惡"]],"serm":{"pts":[["一、祭壇上","12:1–2","你不是靠自己變的"],["二、身體裡","12:3–8","看得合乎中道"],["三、街上","12:9–21","不可為惡所勝，反要以善勝惡"]]},"self":"想靠自己改造自己。","t321":{"k":"心意更新而變化——改變觀念就改變生命。","g":"不要看自己過於所當看的。","p":"一個身子，許多肢體。"},"grp":["「將身體獻上」——對你而言最難獻上的是身體的哪一部分？","你最近被這個世界「模成」了什麼樣子？","你的恩賜是什麼？你有沒有在用？","12:13「客要一味地款待」——你上一次接待人是什麼時候？","這禮拜你要對哪一個人以善勝惡？"],"prac":{"main":"選一件你被世界模成的樣子，這禮拜刻意反其道而行。","items":["對神：每天早上把身體獻上一次","對自己：找出一個需要更新的觀念","對人：對一個傷害過你的人做一件好事","對生活：接待一個人吃一頓飯"]},"safe":["不可跳過12:1的「所以」 ——那是全卷書的樞紐；若跳過，第十二章就變成獨立的道德教訓。","不可把獻身的動力講成罪疚 ——12:1的動力是「神的慈悲」。","★ 不可漏掉12:2的被動語態 ——若講成「你要改變自己」，會直接把會眾推回第七章。","不可把12:3講成「要看低自己」 ——σωφρονέω 是健全，不高估也不低估。","★ 不可用12:19壓制受傷害的人 ——必須並列13:4，並提供實際的協助與轉介。","不可把12:9–21講成一張檢查表 ——那正好違背12:9「不戴面具」；它是心思被更新的結果，不是條件。"]},{"n":13,"t":"穿上","sub":"一把刀、一筆債、一件衣服","lv":"A","arc":"實踐","q":"一個不屬這世界的人，怎麼在這世界裡活？","truth":"付清你欠世界的，只留下一筆永遠還不完的；然後穿上一個人。","mv":{"t":"總要披戴主耶穌基督，不要為肉體安排，去放縱私慾。","r":"羅13:14"},"card":["12:19「伸冤在我」↔13:4「他是伸冤的」——同一個字根。","13:12穿的是兵器（東西）；13:14穿的是主耶穌基督（位格）。","πρόνοια＝預先鋪路。問題不在試探那一刻，在之前。"],"sec":[["13:1–7","對政府"],["13:8–10","一筆還不完的債"],["13:11–14","看清時候"]],"serm":{"pts":[["一、一把不是你的刀","13:1–7","那把刀不在你手上，也不該在"],["二、一筆還不完的債","13:8–10","把所有的債還清，只留一筆"],["三、一件要穿上的衣服","13:11–14","你不必做成新的自己，你只要穿上一個人"]]},"self":"自己兼任伸冤者的職位。","t321":{"k":"τάσσω字群：神排定，我排到底下，抗拒是排到對面。","g":"穿上——讓人看見的是衣服，不是身體。","p":"屬神的體系不與社會脫節。"},"grp":["你心裡有沒有一件事，是你覺得「他欠我一個公道」？","你有沒有「該給而還沒給」的？（錢、承諾、道歉、一句該說的話）","13:13把「爭競嫉妒」跟醉酒淫亂列在一起——你這禮拜嫉妒了誰？","「穿上一個人」——這對你有什麼意義？","這一週，你要具體斷掉哪一項「預備」？"],"prac":{"main":"具體斷掉一項通往罪的「預備」：刪掉、搬走、換路線、改時間、找人同行。","items":["對神：每天在穿衣服之前說「主啊，今天我要穿上祢」","對自己：列出「我欠人的」清單，還掉一項","對人：這禮拜不在背後說一句傷害人的話","對生活：檢查有沒有該繳而未繳的"]},"safe":["★ 不可只講13:1而不講徒5:29 ——只講一半，就是誤導。歷史上這段經文曾被用來為奴隸制度、種族隔離、極權政權背書。","★ 絕不可用13:1–7為任何特定的當代政權背書或攻擊 ——無論哪一方。","不可跳過13:3–4的功能性描述 ——那既是政府的職分，也是衡量它的標準。","不可把13:8講成「基督徒不可有任何債務」 ——重點是「該給而未給」。","不可用13:11推算任何時間表 ——保羅要的是緊迫感，不是時刻表。","不可把13:14只講前半（穿上）而不講後半（不要鋪路） ——那會變成一句好聽卻不落地的話。"]},{"n":14,"t":"接納","sub":"一個不是你的僕人、一塊石頭、一間正在蓋的房子","lv":"A","arc":"修復","q":"當我確信我是對的，而弟兄跟我不一樣，我該怎麼辦？","truth":"那個人不是你的僕人；而基督已經為他死了。","mv":{"t":"你們要彼此接納，如同基督接納你們一樣。","r":"羅15:7"},"card":["ἐξουθενέω（輕看）字根是「零」——把人當作什麼都不是。","14:6：一個吃，一個不吃，而他們都在謝飯。","καταλύω（毀壞）正是福音書中「拆聖殿」的那個字。"],"sec":[["14:1–4","接納：他是別人的僕人"],["14:5–9","各人為主"],["14:10–12","神的臺前"],["14:13–18","絆腳石"],["14:19–23","建立與拆毀"]],"serm":{"pts":[["一、一個不是你的僕人","14:1–12","扶他的不是你，是主"],["二、一塊石頭","14:13–18","基督已經替他死"],["三、一間正在蓋的房子","14:19–15:7","如同基督接納你們一樣"]]},"self":"「我是對的」——在神學上正確的有己。","t321":{"k":"論斷＝坐上不屬於我的位置。","g":"彼此接納，使榮耀歸與神。","p":"不是靠資格制，是靠「如同」。"},"grp":["在你認識的基督徒裡，有沒有一個人你心裡想「跟他講不通」？","你心裡有沒有一個基督徒，是你已經「歸零」的？","你是不是常覺得「如果我不盯著，他就會倒」？","「基督已經替他死」——這對你怎麼看他有什麼改變？","這一週，你要主動接觸哪一位意見不合的弟兄姊妹？"],"prac":{"main":"主動接觸一位跟你意見不合的弟兄姊妹——不是去說服他，是去接納他。","items":["對神：連續七天說「如同基督接納我一樣」","對自己：寫下你心裡「歸零」的那個名字","對人：這禮拜不對任何人提起那個人的缺點","對生活：不公開評論其他基督徒或教會"]},"safe":["★ 不可讓本章變成「什麼都可以」 ——必須講出保羅的三種處理方式（加2／林前5／羅14）。","★ 不可跳過15:7 ——第十四章有一堆「不可」；那個「可以」在15:7。","不可用「軟弱」貼標籤 ——那正好是14:3所禁止的「輕看」。","不可讓會眾以為「最保守的人決定一切」 ——保羅自己立場清楚（14:14），且15:1的「擔代」是暫時扛著。","不可在講台上點名具體的爭議 ——會使會眾對號入座，反而製造新的分裂。","不可用14:23教「跟著感覺走」 ——那節的上下文是「可爭議的事上不可違背良心」。"]},{"n":15,"t":"扛","sub":"一個扛著的人、一個接納的主、一個捧著人的祭司","lv":"A","arc":"承擔","q":"我憑什麼要為一個跟我不一樣的弟兄，放下我的權利？","truth":"祂扛過你，所以你扛得動他；祂接納了你，所以你接納得了他。","mv":{"t":"我們堅固的人應該擔代不堅固人的軟弱，不求自己的喜悅。","r":"羅15:1"},"card":["βαστάζω：11:18「根托著你」→15:1「你要擔代」。你曾經是被扛的。","15:3引詩69:9：人罵的是神，而那些罵落在祂身上。","15:5的動詞是祈願語氣——合一是求來的，不是做出來的。"],"sec":[["15:1–6","扛：因為基督也不求自己的喜悅"],["15:7–13","接納：四段舊約"],["15:14–21","獻上：福音的祭司"],["15:22–33","搏鬥：與我一同竭力"]],"serm":{"pts":[["一、一個扛著的人","15:1–6","你曾經是被扛的，所以現在換你去扛"],["二、一個接納的主","15:7–13","如同——祂接納你那天，你不是全對的"],["三、一個捧著人的祭司","15:14–33","你不是在做事，你是在把人捧到神面前"]]},"self":"求自己的喜悅。","t321":{"k":"謙卑不是放棄力量，是改變力量的方向。","g":"一心一口榮耀神。","p":"體系的動力是扛，地基是「如同」。"},"grp":["在你的信仰路上，誰扛過你？","你最近有沒有一件事，是明明可以放下、卻堅持到底的？","你為某人做的事，是為了「他得益處」，還是「我不想被討厭」？","「辱罵你人的辱罵都落在我身上」——這對你有什麼意義？","這一週，為教會的合一禱告七天——而不是抱怨七天。"],"prac":{"main":"為一位弟兄，放下一件你有權利做的事。","items":["對神：用15章的三個稱呼之一開始禱告（忍耐安慰／盼望／平安）","對自己：回想一次你「被扛」的經驗，寫下他的名字","對人：把一個「有條件才接納」的條件拿掉一次","對生活：讀經時求忍耐、安慰、盼望，不是求答案"]},"safe":["★ 不可用「堅固／不堅固」貼標籤 ——必須講出三重平衡：責任不是特權／ἀδύνατος ＝ 8:3同字根／第七章那個「不能」的人是保羅自己。","不可把15:2講成「要討好人」 ——必須講出兩個限定（為他的益處、為建立），並對照加1:10。","★ 不可跳過15:5的祈願語氣 ——那會讓整篇變成「你們要努力合一」的道德勸說。","不可把15:5的「同心」講成「意見一致」 ——第十四章整章都在說看法可以不一樣。","不可用15:7論證「什麼都可以接納」 ——必須與16:17及羅14的界線一起讀。","不可把15:32講成「所以禱告不必具體」或「神一定照你求的做」 ——他求得很具體；而神沒有照他寫的方式做。"]},{"n":16,"t":"名字","sub":"一份名單、一個警告、一段頌讚","lv":"A","arc":"收攏","q":"這麼偉大的神學，最後要落在哪裡？","truth":"神從來不是在拯救「人類」；祂是在拯救有名字的人。","mv":{"t":"願榮耀因耶穌基督歸與獨一全智的神，直到永遠。阿們！","r":"羅16:27"},"card":["保羅點名超過二十六位，其中至少九位是女性。","κοπιάω（勞苦）＝做到筋疲力盡的苦工——本章全部用在女性身上。","1:11「我想去堅固你們」→16:25「惟有神能堅固你們的心」——一卷書的距離。"],"sec":[["16:1–2","舉薦非比"],["16:3–16","名單"],["16:17–20","警告與應許"],["16:21–24","同工的問安"],["16:25–27","頌讚"]],"serm":{"pts":[["一、一份名單","16:1–16","他記得的不只是名字，是他們做過什麼"],["二、一個警告","16:17–20","那些人用的是蛇的方法——而蛇要被踩碎"],["三、一段頌讚","16:21–27","惟有神能堅固你們的心"]]},"self":"只服事自己的肚腹——披著恩慈外衣的有己。","t321":{"k":"惟有神能堅固——不是我在撐。","g":"把榮耀歸給神的人，會很自由地稱讚別人。","p":"一份有名字、有故事、有感謝的清單。"},"grp":["在你的信仰路上，有哪一個人是你會想寫在名單上的？他做過什麼？","在教會裡，有沒有一個人像你的家人？或者你可以成為誰的家人？","你有沒有被「聽起來很好、其實是為了對方自己」的話影響過？","你現在有沒有一件事，是你一直覺得「靠我」的？","這一週，你要跟哪一位說出「我記得你做過……」？"],"prac":{"main":"寫下十個名字，在每一個後面寫一句「他做過什麼」，然後跟其中一位說出來。","items":["對神：為那些默默做事的人禱告","對自己：檢視我的語言裡有多少是數字，多少是名字","對人：公開感謝一位默默做事的人","對生活：主動問一個你叫不出名字的人的名字"]},"safe":["★ 不可把考古線索講成定論（魯孚、暗伯利、以拉都）。","★ 不可在16:1、16:7上宣告某一方是唯一正解 ——應誠實說明有不同理解，並把重點放在無爭議的部分。","★ 不可用16:17排除異己 ——必須明確講出五個判準，特別是「背乎所學之道」是客觀的教義標準。","不可把16:17與羅14對立 ——兩章講的是完全不同的人。","不可用16:20推算時間表 ——重點是確定性，不是時刻表。","不可跳過16:25–27 ——那是全卷書的收尾，也是整個系列的收尾。"]}],"txt":{"1":["耶穌基督的僕人保羅，奉召為使徒，特派傳神的福音。","這福音是神從前藉眾先知在聖經上所應許的，","論到他兒子—我主耶穌基督。按肉體說，是從大衛後裔生的；","按聖善的靈說，因從死裡復活，以大能顯明是神的兒子。","我們從他受了恩惠並使徒的職分，在萬國之中叫人為他的名信服真道；","其中也有你們這蒙召屬耶穌基督的人。","我寫信給你們在羅馬、為神所愛、奉召作聖徒的眾人。願恩惠、平安從我們的父神並主耶穌基督歸與你們！","第一，我靠著耶穌基督，為你們眾人感謝我的神，因你們的信德傳遍了天下。","我在他兒子福音上，用心靈所事奉的神，可以見證我怎樣不住地提到你們；","在禱告之間常常懇求，或者照神的旨意，終能亨通地到你們那裡去。","因為我切切地想見你們，要把些屬靈的恩賜分給你們，使你們可以堅固；","這樣，我在你們中間，因你與我彼此的信心，就可以同得安慰。","弟兄們，我不願意你們不知道，我屢次定意往你們那裡去，要在你們中間得些果子，如同在其餘的外邦人中一樣；只是到如今仍有阻隔。","無論是希臘人、化外人、聰明人、愚拙人，我都欠他們的債，","所以情願盡我的力量，將福音也傳給你們在羅馬的人。","我不以福音為恥；這福音本是神的大能，要救一切相信的，先是猶太人，後是希臘人。","因為神的義正在這福音上顯明出來；這義是本於信，以致於信。如經上所記：義人必因信得生。","原來，神的忿怒從天上顯明在一切不虔不義的人身上，就是那些行不義阻擋真理的人。","神的事情，人所能知道的，原顯明在人心裡，因為神已經給他們顯明。","自從造天地以來，神的永能和神性是明明可知的，雖是眼不能見，但藉著所造之物就可以曉得，叫人無可推諉。","因為，他們雖然知道神，卻不當作神榮耀他，也不感謝他。他們的思念變為虛妄，無知的心就昏暗了。","自稱為聰明，反成了愚拙，","將不能朽壞之神的榮耀變為偶像，彷彿必朽壞的人和飛禽、走獸、昆蟲的樣式。","所以，神任憑他們逞著心裡的情慾行污穢的事，以致彼此玷辱自己的身體。","他們將神的真實變為虛謊，去敬拜事奉受造之物，不敬奉那造物的主；主乃是可稱頌的，直到永遠。阿們！","因此，神任憑他們放縱可羞恥的情慾。他們的女人把順性的用處變為逆性的用處；","男人也是如此，棄了女人順性的用處，慾火攻心，彼此貪戀，男和男行可羞恥的事，就在自己身上受這妄為當得的報應。","他們既然故意不認識神，神就任憑他們存邪僻的心，行那些不合理的事；","裝滿了各樣不義、邪惡、貪婪、惡毒，滿心是嫉妒、兇殺、爭競、詭詐、毒恨；","又是讒毀的、背後說人的、怨恨神的、侮慢人的、狂傲的、自誇的、捏造惡事的、違背父母的、","無知的、背約的、無親情的、不憐憫人的。","他們雖知道神判定行這樣事的人是當死的，然而他們不但自己去行，還喜歡別人去行。"],"2":["你這論斷人的，無論你是誰，也無可推諉。你在什麼事上論斷人，就在什麼事上定自己的罪；因你這論斷人的，自己所行卻和別人一樣。","我們知道這樣行的人，神必照真理審判他。","你這人哪，你論斷行這事的人，自己所行的卻和別人一樣，你以為能逃脫神的審判嗎？","還是你藐視他豐富的恩慈、寬容、忍耐，不曉得他的恩慈是領你悔改呢？","你竟任著你剛硬不悔改的心，為自己積蓄忿怒，以致神震怒，顯他公義審判的日子來到。","他必照各人的行為報應各人。","凡恆心行善、尋求榮耀、尊貴和不能朽壞之福的，就以永生報應他們；","惟有結黨、不順從真理、反順從不義的，就以忿怒、惱恨報應他們；","將患難、困苦加給一切作惡的人，先是猶太人，後是希臘人；","卻將榮耀、尊貴、平安加給一切行善的人，先是猶太人，後是希臘人。","因為神不偏待人。","凡沒有律法犯了罪的，也必不按律法滅亡；凡在律法以下犯了罪的，也必按律法受審判。","（原來在神面前，不是聽律法的為義，乃是行律法的稱義。","沒有律法的外邦人若順著本性行律法上的事，他們雖然沒有律法，自己就是自己的律法。","這是顯出律法的功用刻在他們心裡，他們是非之心同作見證，並且他們的思念互相較量，或以為是，或以為非。）","就在神藉耶穌基督審判人隱祕事的日子，照著我的福音所言。","你稱為猶太人，又倚靠律法，且指著神誇口；","既從律法中受了教訓，就曉得神的旨意，也能分別是非；","又深信自己是給瞎子領路的，是黑暗中人的光，","是蠢笨人的師傅，是小孩子的先生，在律法上有知識和真理的模範。","你既是教導別人，還不教導自己嗎？你講說人不可偷竊，自己還偷竊嗎？","你說人不可姦淫，自己還姦淫嗎？你厭惡偶像，自己還偷竊廟中之物嗎？","你指著律法誇口，自己倒犯律法，玷辱神嗎？","神的名在外邦人中，因你們受了褻瀆，正如經上所記的。","你若是行律法的，割禮固然於你有益；若是犯律法的，你的割禮就算不得割禮。","所以那未受割禮的，若遵守律法的條例，他雖然未受割禮，豈不算是有割禮嗎？","而且那本來未受割禮的，若能全守律法，豈不是要審判你這有儀文和割禮竟犯律法的人嗎？","因為外面作猶太人的，不是真猶太人；外面肉身的割禮，也不是真割禮。","惟有裡面作的，才是真猶太人；真割禮也是心裡的，在乎靈，不在乎儀文。這人的稱讚不是從人來的，乃是從神來的。"],"3":["這樣說來，猶太人有什麼長處？割禮有什麼益處呢？","凡事大有好處：第一是神的聖言交託他們。","即便有不信的，這有何妨呢？難道他們的不信就廢掉神的信嗎？","斷乎不能！不如說，神是真實的，人都是虛謊的。如經上所記：你責備人的時候，顯為公義；被人議論的時候，可以得勝。","我且照著人的常話說，我們的不義若顯出神的義來，我們可以怎麼說呢？神降怒，是他不義嗎？","斷乎不是！若是這樣，神怎能審判世界呢？","若神的真實，因我的虛謊越發顯出他的榮耀，為什麼我還受審判，好像罪人呢？","為什麼不說，我們可以作惡以成善呢？這是毀謗我們的人說我們有這話。這等人定罪是該當的。","這卻怎麼樣呢？我們比他們強嗎？決不是的！因我們已經證明：猶太人和希臘人都在罪惡之下。","就如經上所記：沒有義人，連一個也沒有。","沒有明白的；沒有尋求神的；","都是偏離正路，一同變為無用。沒有行善的，連一個也沒有。","他們的喉嚨是敞開的墳墓；他們用舌頭弄詭詐，嘴唇裡有虺蛇的毒氣，","滿口是咒罵苦毒。","殺人流血，他們的腳飛跑，","所經過的路便行殘害暴虐的事。","平安的路，他們未曾知道；","他們眼中不怕神。","我們曉得律法上的話都是對律法以下之人說的，好塞住各人的口，叫普世的人都伏在神審判之下。","所以凡有血氣的，沒有一個因行律法能在神面前稱義，因為律法本是叫人知罪。","但如今，神的義在律法以外已經顯明出來，有律法和先知為證：","就是神的義，因信耶穌基督加給一切相信的人，並沒有分別。","因為世人都犯了罪，虧缺了神的榮耀；","如今卻蒙神的恩典，因基督耶穌的救贖，就白白地稱義。","神設立耶穌作挽回祭，是憑著耶穌的血，藉著人的信，要顯明神的義；因為他用忍耐的心寬容人先時所犯的罪，","好在今時顯明他的義，使人知道他自己為義，也稱信耶穌的人為義。","既是這樣，哪裡能誇口呢？沒有可誇的了。用何法沒有的呢？是用立功之法嗎？不是，乃用信主之法。","所以我們看定了：人稱義是因著信，不在乎遵行律法。","難道神只作猶太人的神嗎？不也是作外邦人的神嗎？是的，也作外邦人的神。","神既是一位，他就要因信稱那受割禮的為義，也要因信稱那未受割禮的為義。","這樣，我們因信廢了律法嗎？斷乎不是！更是堅固律法。"],"4":["如此說來，我們的祖宗亞伯拉罕憑著肉體得了什麼呢？","倘若亞伯拉罕是因行為稱義，就有可誇的；只是在神面前並無可誇。","經上說什麼呢？說：『亞伯拉罕信神，這就算為他的義。』","作工的得工價，不算恩典，乃是該得的；","惟有不做工的，只信稱罪人為義的神，他的信就算為義。","正如大衛稱那在行為以外蒙神算為義的人是有福的。","他說：得赦免其過、遮蓋其罪的，這人是有福的。","主不算為有罪的，這人是有福的。","如此看來，這福是單加給那受割禮的人嗎？不也是加給那未受割禮的人嗎？因我們所說，亞伯拉罕的信，就算為他的義，","是怎麼算的呢？是在他受割禮的時候呢？是在他未受割禮的時候呢？不是在受割禮的時候，乃是在未受割禮的時候。","並且他受了割禮的記號，作他未受割禮的時候因信稱義的印證，叫他作一切未受割禮而信之人的父，使他們也算為義；","又作受割禮之人的父，就是那些不但受割禮，並且按我們的祖宗亞伯拉罕未受割禮而信之蹤跡去行的人。","因為神應許亞伯拉罕和他後裔，必得承受世界，不是因律法，乃是因信而得的義。","若是屬乎律法的人才得為後嗣，信就歸於虛空，應許也就廢棄了。","因為律法是惹動忿怒的；哪裡沒有律法，那裡就沒有過犯。","所以人得為後嗣是本乎信，因此就屬乎恩，叫應許定然歸給一切後裔；不但歸給那屬乎律法的，也歸給那效法亞伯拉罕之信的。","亞伯拉罕所信的，是那叫死人復活、使無變為有的神，他在主面前作我們世人的父。如經上所記：「我已經立你作多國的父。","他在無可指望的時候，因信仍有指望，就得以作多國的父，正如先前所說：『你的後裔將要如此。』","他將近百歲的時候，雖然想到自己的身體如同已死，撒拉的生育已經斷絕，他的信心還是不軟弱；","並且仰望神的應許，總沒有因不信心裡起疑惑，反倒因信心裡得堅固，將榮耀歸給神，","且滿心相信神所應許的必能做成。","所以，這就算為他的義。","算為他義」的這句話不是單為他寫的，","也是為我們將來得算為義之人寫的，就是我們這信神使我們的主耶穌從死裡復活的人。","耶穌被交給人，是為我們的過犯；復活，是為叫我們稱義。"],"5":["我們既因信稱義，就藉著我們的主耶穌基督得與神相和。","我們又藉著他，因信得進入現在所站的這恩典中，並且歡歡喜喜盼望神的榮耀。","不但如此，就是在患難中也是歡歡喜喜的；因為知道患難生忍耐，","忍耐生老練，老練生盼望；","盼望不至於羞恥，因為所賜給我們的聖靈將神的愛澆灌在我們心裡。","因我們還軟弱的時候，基督就按所定的日期為罪人死。","為義人死，是少有的；為仁人死，或者有敢做的。","惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。","現在我們既靠著他的血稱義，就更要藉著他免去神的忿怒。","因為我們作仇敵的時候，且藉著神兒子的死，得與神和好；既已和好，就更要因他的生得救了。","不但如此，我們既藉著我主耶穌基督得與神和好，也就藉著他以神為樂。","這就如罪是從一人入了世界，死又是從罪來的；於是死就臨到眾人，因為眾人都犯了罪。","沒有律法之先，罪已經在世上；但沒有律法，罪也不算罪。","然而從亞當到摩西，死就作了王，連那些不與亞當犯一樣罪過的，也在他的權下。亞當乃是那以後要來之人的預像。","只是過犯不如恩賜，若因一人的過犯，眾人都死了，何況神的恩典，與那因耶穌基督一人恩典中的賞賜，豈不更加倍地臨到眾人嗎？","因一人犯罪就定罪，也不如恩賜，原來審判是由一人而定罪，恩賜乃是由許多過犯而稱義。","若因一人的過犯，死就因這一人作了王，何況那些受洪恩又蒙所賜之義的，豈不更要因耶穌基督一人在生命中作王嗎？","如此說來，因一次的過犯，眾人都被定罪；照樣，因一次的義行，眾人也就被稱義得生命了。","因一人的悖逆，眾人成為罪人；照樣，因一人的順從，眾人也成為義了。","律法本是外添的，叫過犯顯多；只是罪在哪裡顯多，恩典就更顯多了。","就如罪作王叫人死；照樣，恩典也藉著義作王，叫人因我們的主耶穌基督得永生。"],"6":["這樣，怎麼說呢？我們可以仍在罪中、叫恩典顯多嗎？","斷乎不可！我們在罪上死了的人豈可仍在罪中活著呢？","豈不知我們這受洗歸入基督耶穌的人是受洗歸入他的死嗎？","所以，我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。","我們若在他死的形狀上與他聯合，也要在他復活的形狀上與他聯合。","因為知道我們的舊人和他同釘十字架，使罪身滅絕，叫我們不再作罪的奴僕。","因為已死的人是脫離了罪。","我們若是與基督同死，就信必與他同活。","因為知道基督既從死裡復活，就不再死，死也不再作他的主了。","他死是向罪死了，只有一次；他活是向神活著。","這樣，你們向罪也當看自己是死的；向神在基督耶穌裡，卻當看自己是活的。","所以，不要容罪在你們必死的身上作王，使你們順從身子的私慾。","也不要將你們的肢體獻給罪作不義的器具；倒要像從死裡復活的人，將自己獻給神，並將肢體作義的器具獻給神。","罪必不能作你們的主，因你們不在律法之下，乃在恩典之下。","這卻怎麼樣呢？我們在恩典之下，不在律法之下，就可以犯罪嗎？斷乎不可！","豈不曉得你們獻上自己作奴僕，順從誰，就作誰的奴僕嗎？或作罪的奴僕，以至於死；或作順命的奴僕，以至成義。","感謝神！因為你們從前雖然作罪的奴僕，現今卻從心裡順服了所傳給你們道理的模範。","你們既從罪裡得了釋放，就作了義的奴僕。","我因你們肉體的軟弱，就照人的常話對你們說。你們從前怎樣將肢體獻給不潔不法作奴僕，以至於不法；現今也要照樣將肢體獻給義作奴僕，以至於成聖。","因為你們作罪之奴僕的時候，就不被義約束了。","你們現今所看為羞恥的事，當日有什麼果子呢？那些事的結局就是死。","但現今，你們既從罪裡得了釋放，作了神的奴僕，就有成聖的果子，那結局就是永生。","因為罪的工價乃是死；惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。"],"7":["弟兄們，我現在對明白律法的人說，你們豈不曉得律法管人是在活著的時候嗎？","就如女人有了丈夫，丈夫還活著，就被律法約束；丈夫若死了，就脫離了丈夫的律法。","所以丈夫活著，她若歸於別人，便叫淫婦；丈夫若死了，她就脫離了丈夫的律法，雖然歸於別人，也不是淫婦。","我的弟兄們，這樣說來，你們藉著基督的身體，在律法上也是死了，叫你們歸於別人，就是歸於那從死裡復活的，叫我們結果子給神。","因為我們屬肉體的時候，那因律法而生的惡慾就在我們肢體中發動，以致結成死亡的果子。","但我們既然在捆我們的律法上死了，現今就脫離了律法，叫我們服事主，要按著心靈的新樣，不按著儀文的舊樣。","這樣，我們可說什麼呢？律法是罪嗎？斷乎不是！只是非因律法，我就不知何為罪。非律法說『不可起貪心』，我就不知何為貪心。","然而罪趁著機會，就藉著誡命叫諸般的貪心在我裡頭發動；因為沒有律法，罪是死的。","我以前沒有律法是活著的；但是誡命來到，罪又活了，我就死了。","那本來叫人活的誡命，反倒叫我死；","因為罪趁著機會，就藉著誡命引誘我，並且殺了我。","這樣看來，律法是聖潔的，誡命也是聖潔、公義、良善的。","既然如此，那良善的是叫我死嗎？斷乎不是！叫我死的乃是罪。但罪藉著那良善的叫我死，就顯出真是罪，叫罪因著誡命更顯出是惡極了。","我們原曉得律法是屬乎靈的，但我是屬乎肉體的，是已經賣給罪了。","因為我所做的，我自己不明白；我所願意的，我並不做；我所恨惡的，我倒去做。","若我所做的，是我所不願意的，我就應承律法是善的。","既是這樣，就不是我做的，乃是住在我裡頭的罪做的。","我也知道，在我裡頭，就是我肉體之中，沒有良善。因為，立志為善由得我，只是行出來由不得我。","故此，我所願意的善，我反不做；我所不願意的惡，我倒去做。","若我去做所不願意做的，就不是我做的，乃是住在我裡頭的罪做的。","我覺得有個律，就是我願意為善的時候，便有惡與我同在。","因為按著我裡面的意思，我是喜歡神的律；","但我覺得肢體中另有個律和我心中的律交戰，把我擄去，叫我附從那肢體中犯罪的律。","我真是苦啊！誰能救我脫離這取死的身體呢？","感謝神，靠著我們的主耶穌基督就能脫離了。這樣看來，我以內心順服神的律，我肉體卻順服罪的律了。"],"8":["如今，那些在基督耶穌裡的就不定罪了。","因為賜生命聖靈的律，在基督耶穌裡釋放了我，使我脫離罪和死的律了。","律法既因肉體軟弱，有所不能行的，神就差遣自己的兒子，成為罪身的形狀，作了贖罪祭，在肉體中定了罪案，","使律法的義成就在我們這不隨從肉體、只隨從聖靈的人身上。","因為隨從肉體的人體貼肉體的事，隨從聖靈的人體貼聖靈的事。","體貼肉體的，就是死；體貼聖靈的，乃是生命、平安。","原來體貼肉體的，就是與神為仇；因為不服神的律法，也是不能服，","而且屬肉體的人不能得神的喜歡。","如果神的靈住在你們心裡，你們就不屬肉體，乃屬聖靈了。人若沒有基督的靈，就不是屬基督的。","基督若在你們心裡，身體就因罪而死，心靈卻因義而活。","然而，叫耶穌從死裡復活者的靈若住在你們心裡，那叫基督耶穌從死裡復活的，也必藉著住在你們心裡的聖靈，使你們必死的身體又活過來。","弟兄們，這樣看來，我們並不是欠肉體的債去順從肉體活著。","你們若順從肉體活著，必要死；若靠著聖靈治死身體的惡行，必要活著。","因為凡被神的靈引導的，都是神的兒子。","你們所受的，不是奴僕的心，仍舊害怕；所受的，乃是兒子的心，因此我們呼叫：「阿爸！父！","聖靈與我們的心同證我們是神的兒女；","既是兒女，便是後嗣，就是神的後嗣，和基督同作後嗣。如果我們和他一同受苦，也必和他一同得榮耀。","我想，現在的苦楚若比起將來要顯於我們的榮耀就不足介意了。","受造之物切望等候神的眾子顯出來。","因為受造之物服在虛空之下，不是自己願意，乃是因那叫他如此的緣故。","但受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀。","我們知道一切受造之物一同歎息、勞苦，直到如今。","不但如此，就是我們這有聖靈初結果子的，也是自己心裡歎息，等候得著兒子的名分，乃是我們的身體得贖。","我們得救是在乎盼望；只是所見的盼望不是盼望，誰還盼望他所見的呢？","但我們若盼望那所不見的，就必忍耐等候。","況且，我們的軟弱有聖靈幫助；我們本不曉得當怎樣禱告，只是聖靈親自用說不出來的歎息替我們禱告。","鑒察人心的，曉得聖靈的意思，因為聖靈照著神的旨意替聖徒祈求。","我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。","因為他預先所知道的人，就預先定下效法他兒子的模樣，使他兒子在許多弟兄中作長子。","預先所定下的人又召他們來；所召來的人又稱他們為義；所稱為義的人又叫他們得榮耀。","既是這樣，還有什麼說的呢？神若幫助我們，誰能敵擋我們呢？","神既不愛惜自己的兒子，為我們眾人捨了，豈不也把萬物和他一同白白地賜給我們嗎？","誰能控告神所揀選的人呢？有神稱他們為義了。","誰能定他們的罪呢？有基督耶穌已經死了，而且從死裡復活，現今在神的右邊，也替我們祈求。","誰能使我們與基督的愛隔絕呢？難道是患難嗎？是困苦嗎？是逼迫嗎？是飢餓嗎？是赤身露體嗎？是危險嗎？是刀劍嗎？","如經上所記：我們為你的緣故終日被殺；人看我們如將宰的羊。","然而，靠著愛我們的主，在這一切的事上已經得勝有餘了。","因為我深信無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，","是高處的，是低處的，是別的受造之物，都不能叫我們與神的愛隔絕；這愛是在我們主基督耶穌裡的。"],"9":["我在基督裡說真話，並不謊言，有我良心被聖靈感動，給我作見證：","我是大有憂愁，心裡時常傷痛；","為我弟兄，我骨肉之親，就是自己被咒詛，與基督分離，我也願意。","他們是以色列人；那兒子的名分、榮耀、諸約、律法、禮儀、應許都是他們的。","列祖就是他們的祖宗；按肉體說，基督也是從他們出來的，他是在萬有之上，永遠可稱頌的神。阿們！","這不是說神的話落了空。因為從以色列生的不都是以色列人，","也不因為是亞伯拉罕的後裔就都作他的兒女；惟獨「從以撒生的才要稱為你的後裔。","這就是說，肉身所生的兒女不是神的兒女，惟獨那應許的兒女才算是後裔。","因為所應許的話是這樣說：「到明年這時候我要來，撒拉必生一個兒子。","不但如此，還有利百加，既從一個人，就是從我們的祖宗以撒懷了孕，","（雙子還沒有生下來，善惡還沒有做出來，只因要顯明神揀選人的旨意，不在乎人的行為，乃在乎召人的主。）","神就對利百加說：「將來大的要服事小的。","正如經上所記：雅各是我所愛的；以掃是我所惡的。","這樣，我們可說什麼呢？難道神有什麼不公平嗎？斷乎沒有！","因他對摩西說：我要憐憫誰就憐憫誰，要恩待誰就恩待誰。","據此看來，這不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神。","因為經上有話向法老說：「我將你興起來，特要在你身上彰顯我的權能，並要使我的名傳遍天下。","如此看來，神要憐憫誰就憐憫誰，要叫誰剛硬就叫誰剛硬。","這樣，你必對我說：「他為什麼還指責人呢？有誰抗拒他的旨意呢？","你這個人哪，你是誰，竟敢向神強嘴呢？受造之物豈能對造他的說：「你為什麼這樣造我呢？","窯匠難道沒有權柄從一團泥裡拿一塊做成貴重的器皿，又拿一塊做成卑賤的器皿嗎？","倘若神要顯明他的忿怒，彰顯他的權能，就多多忍耐寬容那可怒預備遭毀滅的器皿，","又要將他豐盛的榮耀彰顯在那蒙憐憫、早預備得榮耀的器皿上。","這器皿就是我們被神所召的，不但是從猶太人中，也是從外邦人中。","就像神在何西阿書上說：那本來不是我子民的，我要稱為「我的子民」；本來不是蒙愛的，我要稱為「蒙愛的」。","從前在什麼地方對他們說：你們不是我的子民，將來就在那裡稱他們為「永生神的兒子」。","以賽亞指著以色列人喊著說：「以色列人雖多如海沙，得救的不過是剩下的餘數；","因為主要在世上施行他的話，叫他的話都成全，速速地完結。","又如以賽亞先前說過：若不是萬軍之主給我們存留餘種，我們早已像所多瑪，蛾摩拉的樣子了。","這樣，我們可說什麼呢？那本來不追求義的外邦人反得了義，就是因信而得的義。","但以色列人追求律法的義，反得不著律法的義。","這是什麼緣故呢？是因為他們不憑著信心求，只憑著行為求，他們正跌在那絆腳石上。","就如經上所記：我在錫安放一塊絆腳的石頭，跌人的磐石；信靠他的人必不至於羞愧。"],"10":["弟兄們，我心裡所願的，向神所求的，是要以色列人得救。","我可以證明他們向神有熱心，但不是按著真知識；","因為不知道神的義，想要立自己的義，就不服神的義了。","律法的總結就是基督，使凡信他的都得著義。","摩西寫著說：『人若行那出於律法的義，就必因此活著。』","惟有出於信心的義如此說：「你不要心裡說：誰要升到天上去呢？（就是要領下基督來；）","誰要下到陰間去呢？（就是要領基督從死裡上來。）","他到底怎麼說呢？他說：這道離你不遠，正在你口裡，在你心裡——就是我們所傳信主的道。","你若口裡認耶穌為主，心裡信神叫他從死裡復活，就必得救。","因為人心裡相信，就可以稱義；口裡承認，就可以得救。","經上說：「凡信他的人必不至於羞愧。","猶太人和希臘人並沒有分別，因為眾人同有一位主；他也厚待一切求告他的人。","因為「凡求告主名的，就必得救。","然而，人未曾信他，怎能求他呢？未曾聽見他，怎能信他呢？沒有傳道的，怎能聽見呢？","若沒有奉差遣，怎能傳道呢？如經上所記：「報福音、傳喜信的人，他們的腳蹤何等佳美！","只是人沒有都聽從福音，因為以賽亞說：「主啊，我們所傳的有誰信呢？","可見信道是從聽道來的，聽道是從基督的話來的。","但我說，人沒有聽見嗎？誠然聽見了。他們的聲音傳遍天下；他們的言語傳到地極。","我再說，以色列人不知道嗎？先有摩西說：我要用那不成子民的，惹動你們的憤恨；我要用那無知的民觸動你們的怒氣。","又有以賽亞放膽說：沒有尋找我的，我叫他們遇見；沒有訪問我的，我向他們顯現。","至於以色列人，他說：我整天伸手招呼那悖逆頂嘴的百姓。"],"11":["我且說，神棄絕了他的百姓嗎？斷乎沒有！因為我也是以色列人，亞伯拉罕的後裔，屬便雅憫支派的。","神並沒有棄絕他預先所知道的百姓。你們豈不曉得經上論到以利亞是怎麼說的呢？他在神面前怎樣控告以色列人說：","主啊，他們殺了你的先知，拆了你的祭壇，只剩下我一個人；他們還要尋索我的命。","神的回話是怎麼說的呢？他說：「我為自己留下七千人，是未曾向巴力屈膝的。","如今也是這樣，照著揀選的恩典，還有所留的餘數。","既是出於恩典，就不在乎行為；不然，恩典就不是恩典了。","這是怎麼樣呢？以色列人所求的，他們沒有得著，惟有蒙揀選的人得著了；其餘的就成了頑梗不化的。","如經上所記：神給他們昏迷的心，眼睛不能看見，耳朵不能聽見，直到今日。","大衛也說：願他們的筵席變為網羅，變為機檻，變為絆腳石，作他們的報應。","願他們的眼睛昏矇，不得看見；願你時常彎下他們的腰。","我且說，他們失腳是要他們跌倒嗎？斷乎不是！反倒因他們的過失，救恩便臨到外邦人，要激動他們發憤。","若他們的過失為天下的富足，他們的缺乏為外邦人的富足；何況他們的豐滿呢？","我對你們外邦人說這話；因我是外邦人的使徒，所以敬重我的職分，","或者可以激動我骨肉之親發憤，好救他們一些人。","若他們被丟棄，天下就得與神和好；他們被收納，豈不是死而復生嗎？","所獻的新麵若是聖潔，全團也就聖潔了；樹根若是聖潔，樹枝也就聖潔了。","若有幾根枝子被折下來，你這野橄欖得接在其中，一同得著橄欖根的肥汁，","你就不可向舊枝子誇口；若是誇口，當知道不是你托著根，乃是根托著你。","你若說，那枝子被折下來是特為叫我接上。","不錯！他們因為不信，所以被折下來；你因為信，所以立得住；你不可自高，反要懼怕。","神既不愛惜原來的枝子，也必不愛惜你。","可見，神的恩慈和嚴厲向那跌倒的人是嚴厲的，向你是有恩慈的，只要你長久在他的恩慈裡；不然，你也要被砍下來。","而且他們若不是長久不信，仍要被接上，因為神能夠把他們從新接上。","你是從那天生的野橄欖上砍下來的，尚且逆著性得接在好橄欖上，何況這本樹的枝子，要接在本樹上呢！","弟兄們，我不願意你們不知道這奧祕（恐怕你們自以為聰明），就是以色列人有幾分是硬心的，等到外邦人的數目添滿了，","於是以色列全家都要得救。如經上所記：必有一位救主從錫安出來，要消除雅各家的一切罪惡；","又說：我除去他們罪的時候，這就是我與他們所立的約。","就著福音說，他們為你們的緣故是仇敵；就著揀選說，他們為列祖的緣故是蒙愛的。","因為神的恩賜和選召是沒有後悔的。","你們從前不順服神，如今因他們的不順服，你們倒蒙了憐恤。","這樣，他們也是不順服，叫他們因著施給你們的憐恤，現在也就蒙憐恤。","因為神將眾人都圈在不順服之中，特意要憐恤眾人。","深哉，神豐富的智慧和知識！他的判斷何其難測！他的蹤跡何其難尋！","誰知道主的心？誰作過他的謀士呢？","誰是先給了他，使他後來償還呢？","因為萬有都是本於他，倚靠他，歸於他。願榮耀歸給他，直到永遠。阿們！"],"12":["所以弟兄們，我以神的慈悲勸你們，將身體獻上，當作活祭，是聖潔的，是神所喜悅的；你們如此事奉乃是理所當然的。","不要效法這個世界，只要心意更新而變化，叫你們察驗何為神的善良、純全、可喜悅的旨意。","我憑著所賜我的恩對你們各人說：不要看自己過於所當看的，要照著神所分給各人信心的大小，看得合乎中道。","正如我們一個身子上有好些肢體，肢體也不都是一樣的用處。","我們這許多人，在基督裡成為一身，互相聯絡作肢體，也是如此。","按我們所得的恩賜，各有不同。或說預言，就當照著信心的程度說預言；","或作執事，就當專一執事；或作教導的，就當專一教導；","或作勸化的，就當專一勸化；施捨的，就當誠實；治理的，就當殷勤；憐憫人的，就當甘心。","愛人不可虛假。惡要厭惡，善要親近。","愛弟兄，要彼此親熱；恭敬人，要彼此推讓。","殷勤，不可懶惰；要心裡火熱，常常服事主。","在指望中要喜樂；在患難中要忍耐；禱告要恆切。","聖徒缺乏要幫補；客要一味地款待。","逼迫你們的，要給他們祝福；只要祝福，不可咒詛。","與喜樂的人要同樂；與哀哭的人要同哭。","要彼此同心；不要志氣高大，倒要俯就卑微的人。不要自以為聰明。","不要以惡報惡；眾人以為美的事要留心去做。","若是能行，總要盡力與眾人和睦。","親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒；因為經上記著：『主說：伸冤在我，我必報應。』","所以，「你的仇敵若餓了，就給他吃；若渴了，就給他喝；因為你這樣行就是把炭火堆在他的頭上。","你不可為惡所勝，反要以善勝惡。"],"13":["在上有權柄的，人人當順服他，因為沒有權柄不是出於神的。凡掌權的都是神所命的。","所以，抗拒掌權的就是抗拒神的命；抗拒的必自取刑罰。","作官的原不是叫行善的懼怕，乃是叫作惡的懼怕。你願意不懼怕掌權的嗎？你只要行善，就可得他的稱讚；","因為他是神的用人，是與你有益的。你若作惡，卻當懼怕；因為他不是空空地佩劍；他是神的用人，是伸冤的，刑罰那作惡的。","所以，你們必須順服，不但是因為刑罰，也是因為良心。","你們納糧，也為這個緣故；因他們是神的差役，常常特管這事。","凡人所當得的，就給他。當得糧的，給他納糧；當得稅的，給他上稅；當懼怕的，懼怕他；當恭敬的，恭敬他。","凡事都不可虧欠人，惟有彼此相愛要常以為虧欠，因為愛人的就完全了律法。","像那不可姦淫，不可殺人，不可偷盜，不可貪婪，或有別的誡命，都包在愛人如己這一句話之內了。","愛是不加害與人的，所以愛就完全了律法。","再者，你們曉得現今就是該趁早睡醒的時候；因為我們得救，現今比初信的時候更近了。","黑夜已深，白晝將近；我們就當脫去暗昧的行為，帶上光明的兵器。","行事為人要端正，好像行在白晝。不可荒宴醉酒，不可好色邪蕩，不可爭競嫉妒。","總要披戴主耶穌基督，不要為肉體安排，去放縱私慾。"],"14":["信心軟弱的，你們要接納，但不要辯論所疑惑的事。","有人信百物都可吃；但那軟弱的，只吃蔬菜。","吃的人不可輕看不吃的人；不吃的人不可論斷吃的人；因為神已經收納他了。","你是誰，竟論斷別人的僕人呢？他或站住或跌倒，自有他的主人在；而且他也必要站住，因為主能使他站住。","有人看這日比那日強；有人看日日都是一樣。只是各人心裡要意見堅定。","守日的人是為主守的。吃的人是為主吃的，因他感謝神；不吃的人是為主不吃的，也感謝神。","我們沒有一個人為自己活，也沒有一個人為自己死。","我們若活著，是為主而活；若死了，是為主而死。所以，我們或活或死總是主的人。","因此基督死了，又活了，為要作死人並活人的主。","你這個人，為什麼論斷弟兄呢？又為什麼輕看弟兄呢？因我們都要站在神的臺前。","經上寫著：主說：我憑著我的永生起誓：萬膝必向我跪拜；萬口必向我承認。","這樣看來，我們各人必要將自己的事在神面前說明。","所以，我們不可再彼此論斷，寧可定意誰也不給弟兄放下絆腳跌人之物。","我憑著主耶穌確知深信，凡物本來沒有不潔淨的；惟獨人以為不潔淨的，在他就不潔淨了。","你若因食物叫弟兄憂愁，就不是按著愛人的道理行。基督已經替他死，你不可因你的食物叫他敗壞。","不可叫你的善被人毀謗；","因為神的國不在乎吃喝，只在乎公義、和平，並聖靈中的喜樂。","在這幾樣上服事基督的，就為神所喜悅，又為人所稱許。","所以，我們務要追求和睦的事與彼此建立德行的事。","不可因食物毀壞神的工程。凡物固然潔淨，但有人因食物叫人跌倒，就是他的罪了。","無論是吃肉，是喝酒，是甚麼別的事，叫弟兄跌倒，一概不做才好。","你有信心，就當在神面前守著。人在自己以為可行的事上能不自責，就有福了。","若有疑心而吃的，就必有罪，因為他吃不是出於信心。凡不出於信心的都是罪。"],"15":["我們堅固的人應該擔代不堅固人的軟弱，不求自己的喜悅。","我們各人務要叫鄰舍喜悅，使他得益處，建立德行。","因為基督也不求自己的喜悅，如經上所記：『辱罵你人的辱罵都落在我身上。』","從前所寫的聖經都是為教訓我們寫的，叫我們因聖經所生的忍耐和安慰可以得著盼望。","但願賜忍耐安慰的神叫你們彼此同心，效法基督耶穌，","一心一口榮耀神—我們主耶穌基督的父！","所以，你們要彼此接納，如同基督接納你們一樣，使榮耀歸與神。","我說，基督是為神真理作了受割禮人的執事，要證實所應許列祖的話，","並叫外邦人因他的憐憫榮耀神。如經上所記：因此，我要在外邦中稱讚你，歌頌你的名；","又說：你們外邦人當與主的百姓一同歡樂；","又說：外邦啊，你們當讚美主！萬民哪，你們都當頌讚他！","又有以賽亞說：將來有耶西的根，就是那興起來要治理外邦的；外邦人要仰望他。","但願使人有盼望的神，因信將諸般的喜樂、平安充滿你們的心，使你們藉著聖靈的能力大有盼望！","弟兄們，我自己也深信你們是滿有良善，充足了諸般的知識，也能彼此勸戒。","但我稍微放膽寫信給你們，是要提醒你們的記性，特因神所給我的恩典，","使我為外邦人作基督耶穌的僕役，作神福音的祭司，叫所獻上的外邦人，因著聖靈成為聖潔，可蒙悅納。","所以論到神的事，我在基督耶穌裡有可誇的。","除了基督藉我做的那些事，我甚麼都不敢提，只提他藉我言語作為，用神蹟奇事的能力，並聖靈的能力，使外邦人順服；","甚至我從耶路撒冷，直轉到以利哩古，到處傳了基督的福音。","我立了志向，不在基督的名被稱過的地方傳福音，免得建造在別人的根基上。","就如經上所記：未曾聞知他信息的，將要看見；未曾聽過的，將要明白。","我因多次被攔阻，總不得到你們那裡去。","但如今，在這裡再沒有可傳的地方，而且這好幾年，我切心想望到西班牙去的時候，可以到你們那裡，","盼望從你們那裡經過，得見你們，先與你們彼此交往，心裡稍微滿足，然後蒙你們送行。","但現在，我往耶路撒冷去供給聖徒。","因為馬其頓和亞該亞人樂意湊出捐項給耶路撒冷聖徒中的窮人。","這固然是他們樂意的，其實也算是所欠的債；因外邦人既然在他們屬靈的好處上有分，就當把養身之物供給他們。","等我辦完了這事，把這善果向他們交付明白，我就要路過你們那裡，往西班牙去。","我也曉得去的時候，必帶著基督豐盛的恩典而去。","弟兄們，我藉著我們主耶穌基督，又藉著聖靈的愛，勸你們與我一同竭力，為我祈求神，","叫我脫離在猶太不順從的人，也叫我為耶路撒冷所辦的捐項可蒙聖徒悅納，","並叫我順著神的旨意，歡歡喜喜地到你們那裡，與你們同得安息。","願賜平安的神常和你們眾人同在。阿們！"],"16":["我對你們舉薦我們的姊妹非比，她是堅革哩教會中的女執事。","請你們為主接待她，合乎聖徒的體統。她在何事上要你們幫助，你們就幫助她；因她素來幫助許多人，也幫助了我。","問百基拉和亞居拉安。他們在基督耶穌裡與我同工，","也為我的命將自己的頸項置之度外。不但我感謝他們，就是外邦的眾教會也感謝他們。","又問在他們家中的教會安。問我所親愛的以拜尼土安；他在亞西亞是歸基督初結的果子。","又問馬利亞安；她為你們多受勞苦。","又問我親屬與我一同坐監的安多尼古和猶尼亞安；他們在使徒中是有名望的，也是比我先在基督裡。","又問我在主裡面所親愛的暗伯利安。","又問在基督裡與我們同工的耳巴奴，並我所親愛的士他古安。","又問在基督裡經過試驗的亞比利安。問亞利多布家裡的人安。","又問我親屬希羅天安。問拿其數家在主裡的人安。","又問為主勞苦的土非拿氏和土富撒氏安。問可親愛的、為主多受勞苦的彼息氏安。","又問在主蒙揀選的魯孚和他母親安；他的母親就是我的母親。","又問亞遜其土、弗勒干、黑米、八羅巴、黑馬，並與他們在一處的弟兄們安。","又問非羅羅古和猶利亞，尼利亞和他姊妹，同阿林巴並與他們在一處的眾聖徒安。","你們親嘴問安，彼此務要聖潔。基督的眾教會都問你們安。","弟兄們，那些離間你們、叫你們跌倒、背乎所學之道的人，我勸你們要留意躲避他們。","因為這樣的人不服事我們的主基督，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。","你們的順服已經傳於眾人，所以我為你們歡喜；但我願意你們在善上聰明，在惡上愚拙。","賜平安的神快要將撒但踐踏在你們腳下。願我主耶穌基督的恩常和你們同在！","與我同工的提摩太，和我的親屬路求、耶孫、所西巴德，問你們安。","我這代筆寫信的德丟，在主裡面問你們安。","那接待我、也接待全教會的該猶問你們安。城內管銀庫的以拉都，和兄弟括土問你們安。","願我主耶穌基督的恩常和你們眾人同在。阿們！","惟有神能照我所傳的福音和所講的耶穌基督，並照永古隱藏不言的奧祕，堅固你們的心。","這奧祕如今顯明出來，而且按著永生神的命，藉眾先知的書指示萬國的民，使他們信服真道。","願榮耀因耶穌基督歸與獨一全智的神，直到永遠。阿們！"]},"blk":{"1":[{"a":1,"z":1,"star":false,"grk":"<p>Παῦλος δοῦλος Χριστοῦ Ἰησοῦ, κλητὸς ἀπόστολος ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ</p>","lit":"<p>「保羅，基督耶穌的奴僕，被召的使徒，已被分別出來歸於神的福音。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th><th>本節語境</th></tr><tr><td>僕人</td><td>δοῦλος</td><td>doulos</td><td>G1401</td><td>奴隸，屬於主人的財產</td><td>不是雇工，是被買贖、全然屬主的人</td></tr><tr><td>奉召</td><td>κλητός</td><td>klētos</td><td>G2822</td><td>被召的（形容詞）</td><td>使徒職分是被召出來的，不是自取的</td></tr><tr><td>特派</td><td>ἀφωρισμένος</td><td>aphōrismenos</td><td>G873</td><td>分別、劃界、隔開</td><td>完成式被動分詞：已被分別出來，狀態持續</td></tr><tr><td>福音</td><td>εὐαγγέλιον</td><td>euangelion</td><td>G2098</td><td>好消息、捷報</td><td>帝國用語被奪回，歸給神</td></tr></table>","gram":"<p>- <b>δοῦλος</b>：無冠詞，同位語。保羅不說「我是一位傳道人」，他說「我是一個奴隸」。<br>- <b>κλητός</b>：形容詞，被動含義——「被叫來的」。施動者是神。<br>- <b>ἀφωρισμένος</b>：<b>完成式被動分詞</b>（perfect passive participle）。這是本節最重要的文法。完成式＝過去發生、結果持續到現在；被動＝不是他自己分別自己。有趣的是：「法利賽人」（Pharisee）一字很可能源於「分別」的字根——保羅曾經被「分別」歸給律法，如今被神分別歸給福音。<br>- <b>εἰς εὐαγγέλιον</b>：εἰς＋直接受格，表<b>目標／歸屬</b>——被分別「進入」福音。</p>","exp":"<p>保羅的自我介紹，把整卷書的屬靈邏輯先立了起來：<b>人生真正的次序，不是「我要做什麼」，而是「我屬於誰」。</b></p><p>- 這是經文本身的意思：保羅的使徒職分不是自封的，福音也不是他的產物，是<b>神的</b>福音（θεοῦ，主詞所有格：源於神、屬於神）。<br>- 這是根據經文真理的生命應用：一個被福音抓住的人，第一句話不會是「我是誰」，而是「我是誰的」。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις</p>","lit":"<p>「這（福音）是祂藉著祂的眾先知在聖潔的經卷中，預先所應許的。」</p>","key":"<p>- <b>προεπηγγείλατο</b>（G4279 προεπαγγέλλομαι）：προ（預先）＋ ἐπαγγέλλομαι（應許）。新約僅出現兩次（羅1:2；林後9:5）。<br>- <b>γραφαῖς ἁγίαις</b>：無冠詞，「聖潔的經卷」——保羅在此指舊約。</p>","gram":"<p>- <b>προεπηγγείλατο</b>：不定過去式關身直說語氣，第三人稱單數。主詞是神（承上文 θεοῦ）。<br>- <b>διὰ ＋ 所有格</b>：表「藉著、透過」——先知是管道，不是源頭。</p>","exp":"<p>福音<b>不是新發明</b>。這是保羅一開始就要打的一根樁：對猶太讀者，福音不是背叛祖宗的信仰，是應許的兌現；對外邦讀者，這信仰不是新興宗教，是有根、有歷史、有神親自簽名的應許。</p><p><b>救恩歷史的意義</b>：從創世記3:15 女人的後裔，到亞伯拉罕之約，到大衛之約（撒下7），到以賽亞的僕人之歌，到耶利米的新約——整本舊約都在指向一個人。福音不是Ｂ計畫。</p>"},{"a":3,"z":4,"star":false,"grk":"<p>περὶ τοῦ υἱοῦ αὐτοῦ τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα, τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν</p>","lit":"<p>「關於祂的兒子——按著肉體，是從大衛的後裔生的；按著聖善的靈，因著從死人中復活，被有能力地指定為神的兒子——就是耶穌基督，我們的主。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th><th>語境</th></tr><tr><td>生的</td><td>γενομένου</td><td>genomenou</td><td>G1096</td><td>成為、生成</td><td>不用 γεννάω（生育），暗示「成為」——道成肉身</td></tr><tr><td>顯明／立定</td><td>ὁρισθέντος</td><td>horisthentos</td><td>G3724</td><td>劃定界線、<b>指派、任命</b>（徒10:42、17:31 皆譯「立定」）</td><td>英文 horizon 由此而來</td></tr><tr><td>大能</td><td>δυνάμει</td><td>dynamei</td><td>G1411</td><td>能力</td><td>與 1:16「神的大能」呼應</td></tr><tr><td>聖善的靈</td><td>πνεῦμα ἁγιωσύνης</td><td>pneuma hagiōsynēs</td><td>G4151/G42</td><td>聖潔的靈</td><td>罕見片語，可能是閃族語式表達</td></tr></table>","gram":"<p>- <b>τοῦ γενομένου</b> 與 <b>τοῦ ὁρισθέντος</b>：兩個帶冠詞的分詞，工整平行——一個不定過去式關身，一個不定過去式被動。<br>- <b>ὁρισθέντος</b>：不定過去式被動分詞——<b>是父神立定祂</b>。ὁρίζω 的常態字義是「指派、任命」，不是「宣告」（徒10:42「神所立定的」；徒17:31「他所設立的人」）。<br>- <b>κατὰ σάρκα / κατὰ πνεῦμα ἁγιωσύνης</b>：兩個 κατά＋直接受格的平行片語，指<b>兩種存在領域或兩個階段</b>，而非「人性／神性」二分。<br>- 3–4節很可能是保羅引用<b>教會早期已有的信仰告白</b>（節奏工整、用詞非保羅慣用），這使它更有份量：<b>這不只是保羅的信，是全教會的信。</b></p>","exp":"<p>這裡有一個必須澄清的重點，而且要比一般講法更精準。</p><p>ὁρισθέντος 絕<b>不是</b>說耶穌「復活以後才變成神的兒子」——那是嗣子論異端，而且第3節已經先稱祂為「<b>祂的兒子</b>」，可見在道成肉身之前，祂就是子。</p><p>但也不宜把 ὁρίζω 一律譯成「宣告」（傳統中文譯本作「顯明」）。這字的常態意義是<b>指派、任命、立定</b>。因此更貼近原文、也更合乎救贖歷史的理解是：</p><p>那位一直是子的，如今藉著復活，被父「立定」為有能力的神子——就是就任為掌權的彌賽亞君王。</p><p>這正是使徒行傳13:33 引用詩篇2:7「你是我的兒子，我今日生你」來指基督復活的同一條線：詩篇2篇本是<b>君王登基</b>的詩。所以：<b>祂的身分沒有改變，祂的職任進入了新的階段。</b>從「軟弱中的大衛子孫」，到「以大能掌權的神子」（ἐν δυνάμει 修飾「神的兒子」）。</p><p>另有一個常被漏掉的細節：<b> ἐξ ἀναστάσεως </b>νεκρῶν<b>——「死人（們）」是</b>複數<b>。保羅不只說「祂復活了」，他說的是「</b>從死人中的那場復活<b>」。也就是說，基督的復活不是一個孤立事件，而是那場總復活的</b>開端<b>——正如林前15:20 說祂是「睡了之人初熟的果子」。</b>祂不是唯一被叫醒的人，祂是第一個。</p><p>- 經文明確表達的：耶穌是應許的大衛子孫（彌賽亞），也是藉復活被有力宣告的神子。<br>- 合理推論的神學：福音的內容<b>不是一套道理，是一個位格</b>。保羅說「神的福音……論到他兒子」——福音的中心不是「你能得到什麼」，是「祂是誰」。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>δι' οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ</p>","lit":"<p>「藉著祂，我們領受了恩惠與使徒職分，為要在萬民中，為祂的名，帶出信心的順服。」</p>","key":"<p>- <b>ὑπακοὴ πίστεως</b>（G5218 ＋ G4102）：字面「信的順服」。ὑπακοή 源自 ὑπό（在……之下）＋ ἀκούω（聽）——<b>順服的本質是「在話語之下聽」</b>。<br>- <b>ὑπὲρ τοῦ ὀνόματος αὐτοῦ</b>：「為了祂的名」——最終目的。</p>","gram":"<p>「信服真道」的所有格 πίστεως 有幾種可能：<br>1. <b>同位所有格</b>：順服，就是信（信本身即順服的行動）<br>2. <b>來源所有格</b>：由信心產生的順服<br>3. <b>目的</b>：以信為對象的順服</p><p>保羅在羅馬書中兩次用這片語框住全書（1:5；16:26），最好的理解可能是<b>兼容前兩者</b>：真信心必然帶出順服，順服的根源必然是信心。這正好回答一個常見的誤解——<b>因信稱義從來不是「信了就可以隨便活」</b>。</p><p><b>最後那句最重要：ὑπὲρ τοῦ ὀνόματος αὐτοῦ——為祂的名。</b>不是為保羅的名，不是為教會的名，不是為事工的名。宣教的終極動機是<b>神的榮耀</b>。</p>","exp":"<p><b>經文本身明確表達的：</b> 保羅的使徒職分是<b>領受</b>的（ἐλάβομεν），目的是在萬國中帶出「信心的順服」，而終極的指向是「為祂的名」。</p><p><b>可以合理推論的生命應用：</b> 這一節把三件事按次序排好了——</p><p><b>恩惠在先</b>（先領受，不是先努力）；<br><b>順服在中</b>（信心必然帶出順服）；<br><b>祂的名在後</b>（一切的終點）。</p><p>而這正是321的次序：不是先做事，是先領受；不是為自己立名，是為祂的名。</p><p>⚠ 這個詞組（εἰς ὑπακοὴν πίστεως）在全卷書只出現兩次——1:5與16:26。保羅用它把整卷書框了起來。</p>"},{"a":6,"z":7,"star":false,"grk":"<p>ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ, πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.</p>","lit":"<p>「在他們中間，也有你們——耶穌基督所召的。（我寫）給所有在羅馬的、神所愛的、被召為聖徒的人：願恩惠與平安從我們的父神並主耶穌基督歸與你們。」</p>","key":"<p>- <b>ἀγαπητοῖς θεοῦ</b>：「神所愛的」——這是舊約對以色列的稱呼（申33:12；詩60:5）。保羅把它給了羅馬的外邦信徒。<br>- <b>κλητοῖς ἁγίοις</b>：「蒙召的聖徒」——<b>不是「特別聖潔的少數人」，是所有屬神的人</b>。ἅγιος 的根本意思是「被分別出來歸神」。<br>- <b>χάρις καὶ εἰρήνη</b>：χάρις（希臘式問安 χαίρειν 的變形）＋ εἰρήνη（希伯來式問安 שָׁלוֹם shalom）——<b>希臘與希伯來在福音裡合而為一</b>。這個問安本身就是一篇小小的合一講道。</p>","gram":"","exp":"<p>留意 1:1 與 1:7 的呼應：保羅是 κλητὸς ἀπόστολος（蒙召的使徒），他們是 κλητοὶ ἅγιοι（蒙召的聖徒）。<b>同一位主，同一種呼召的性質。</b>職分不同，地位相同。</p><p>還有一個常被忽略的細節：<b>恩惠與平安同時從「父神」並「主耶穌基督」而來</b>——一個介系詞 ἀπό 帶兩個對象，基督與父並列為恩典的源頭。這是最高的基督論宣告，卻放在一句最平常的問安裡。</p>"},{"a":8,"z":10,"star":false,"grk":"<p>εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ … ᾧ λατρεύω ἐν τῷ πνεύματί μου … ἀδιαλείπτως … δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ</p>","lit":"<p>8「首先，我藉著耶穌基督，為你們眾人<b>感謝我的神</b>——因為你們的信德<b>在全世界被傳揚</b>。」<br>9「神可以為我作見證——就是我在祂兒子的福音上，<b>用我的靈所事奉</b>的那一位——我怎樣<b>不間斷地</b>提起你們，」<br>10「在我的禱告中常常懇求：<b>或者，總算有一天</b>，我可以照著神的旨意，<b>被開通道路</b>，到你們那裡去。」</p>","key":"<p>- <b>λατρεύω</b>（G3000）：<b>事奉</b>，在七十士譯本中特指<b>祭司在聖殿中的敬拜事奉</b>。保羅說他是「用心靈事奉」——不在聖殿，在心靈；不是獻祭，是傳福音。<br>- <b>ἀδιαλείπτως</b>（G89）：不間斷地。<br>- <b>εὐοδωθήσομαι</b>（G2137）：εὖ（好）＋ ὁδός（路）——「得好路、路途通達」。</p>","gram":"<p>「或者照神的旨意，終能得平坦的道路」——<b>εὐοδωθήσομαι 是未來被動</b>。保羅不說「我要打通這條路」，他說「但願我被開路」。</p><p>而 εἴ πως ἤδη ποτέ（若或者終於有一天）連用四個小詞，那份<b>壓抑的渴望與等候的長度</b>，中文很難完全譯出。可以直譯成：「不知道究竟哪一天，總算……」</p>","exp":"<p>- 這是經文本身的意思：保羅為羅馬信徒感謝神、不住代禱，並多年渴望前往，卻順服在神的旨意與時間表之下。<br>- 這是根據經文的生命應用：<b>保羅有異象、有負擔、有能力、有計畫，卻沒有主權。</b>他不說「我一定要去」，他說「照神的旨意」。這正是「讓耶穌作王」最實際的樣子——不是不作計畫，而是計畫始終放在神的手裡。</p>"},{"a":11,"z":12,"star":false,"grk":"<p>ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς, τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.</p>","lit":"<p>「因為我切切渴望見你們，好把一些屬靈的恩賜分給你們，使你們得堅固；也就是說，讓我在你們中間，藉著我們彼此的信心，同得安慰。」</p>","key":"<p>- <b>ἐπιποθῶ</b>（G1971）：ἐπί（加強）＋ ποθέω（渴慕）——強烈的思念，如詩篇42:1 鹿切慕溪水（七十士譯本用同一字根）。<br>- <b>συμπαρακληθῆναι</b>（G4837）：σύν（一同）＋ παρακαλέω（安慰、勸勉）——新約僅此一次。<b>「一同被鼓勵」，被動語態。</b></p>","gram":"<p>第11節，保羅是給予者：「我分給你們」。<br>第12節，他立刻<b>改口</b>：τοῦτο δέ ἐστιν（這就是說……）——並且動詞變成<b>被動</b>：συμπαρακληθῆναι，「一同被安慰」。</p><p><b>保羅講到一半，把自己拉下來了。</b> 他原本說的是「我要給你們」，然後馬上補充：「不，應該說，是我們彼此。」</p>","exp":"<p>這是一位使徒的謙卑，也是屬神體系最美的圖畫：<b>在基督的身體裡，沒有純粹的給予者，也沒有純粹的接受者。</b></p><p>- 經文本身：保羅要造就羅馬教會，也承認自己需要從他們得著。<br>- 生命應用（321）：真正屬靈的領袖不是站在高處施捨的人，而是願意在弟兄姊妹中間一同被安慰的人。這正是「屬靈同伴（2）」的關係——不是上對下，是肩並肩。</p>"},{"a":13,"z":15,"star":false,"grk":"<p>ἐκωλύθην ἄχρι τοῦ δεῦρο … Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί</p>","lit":"<p>13「弟兄們，我不願意你們不知道：我<b>屢次定意</b>要到你們那裡去，好在你們中間也得些果子，像在其餘的外邦人中一樣——只是<b>直到如今，我都被攔阻</b>。」<br>14「無論是希臘人或<b>化外人</b>，聰明人或愚拙人，<b>我都是欠債的</b>。」<br>15「所以就我而言，我是<b>迫切的</b>：也要把福音傳給你們在羅馬的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th><th>語境</th></tr><tr><td>阻隔</td><td>ἐκωλύθην</td><td>ekōlythēn</td><td>G2967</td><td>被攔阻</td><td>不定過去式<b>被動</b></td></tr><tr><td>化外人</td><td>βαρβάροις</td><td>barbarois</td><td>G915</td><td>說話「巴巴巴」的人，非希臘語者</td><td>當時的文化歧視用語</td></tr><tr><td>欠債</td><td>ὀφειλέτης</td><td>opheiletēs</td><td>G3781</td><td>債務人</td><td>保羅欠的不是人情，是福音的債</td></tr></table>","gram":"<p>ἐκωλύθην 是被動式：「我被攔阻」。<b> 保羅沒有說「情況不允許」「時機不對」——他知道有一位在攔阻。比較徒16:6–7，聖靈禁止他往亞細亞、庇推尼去。</b>神的攔阻，也是神的引導。</p>","exp":"<p>「我都欠他們的債」——這是驚人的翻轉。一般人會覺得：我把福音給你，是你欠我。保羅說：<b>我還沒把福音給你之前，我是欠你的。</b></p><p>為什麼？因為 1:5——「我們<b>從他受了</b>恩惠並使徒的職分」。<b>保羅是先領受，所以他有債。</b> 恩典若真的臨到一個人，會使他變成一個欠債的人。</p><p>而他欠債的對象包括「化外人、愚拙人」——當時羅馬社會看不起的人。<b>福音的債，沒有階級。</b></p>"},{"a":16,"z":16,"star":false,"grk":"<p>Οὐ γὰρ ἐπαισχύνομαι τὸ εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι.</p>","lit":"<p>「因為我不以這福音為恥；因為它是神的大能，以致拯救，臨到每一個相信的人——先是猶太人，也是希臘人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th><th>語境</th></tr><tr><td>以為恥</td><td>ἐπαισχύνομαι</td><td>epaischynomai</td><td>G1870</td><td>感到羞恥</td><td>現在式關身，持續的態度</td></tr><tr><td>大能</td><td>δύναμις</td><td>dynamis</td><td>G1411</td><td>能力、動力</td><td>英文 dynamite、dynamic 由此而來</td></tr><tr><td>救</td><td>σωτηρίαν</td><td>sōtērian</td><td>G4991</td><td>拯救、得救</td><td>帝國也用此字稱凱撒為 σωτήρ</td></tr><tr><td>相信的</td><td>πιστεύοντι</td><td>pisteuonti</td><td>G4100</td><td>信</td><td><b>現在式分詞：持續相信的人</b></td></tr></table>","gram":"<p>- <b>οὐ ἐπαισχύνομαι</b>：這是修辭上的「反語法」（litotes）——用否定表達更強的肯定。「我不以福音為恥」＝「我以福音為我唯一的誇口」。<br>- <b>δύναμις θεοῦ ἐστιν</b>：福音<b>是</b>（ἐστιν）神的大能，不是「有」大能，不是「傳遞」大能。<b>福音本身就是那能力。</b><br>- <b>παντὶ τῷ πιστεύοντι</b>：現在式分詞加冠詞——「每一個持續在相信的人」。信不是一次的決定，是一種持續的姿態。<br>- <b>πρῶτον</b>（先）：是<b>救恩歷史的次序</b>，不是<b>價值的高低</b>（參 2:9–10：審判也是「先是猶太人」）。</p>","exp":"<p><b>為什麼保羅要說「不以為恥」？</b>因為福音在當時實在是可恥的。</p><p>在羅馬，十字架是留給奴隸與叛亂者的極刑，是文明人不願啟齒的字眼。西塞羅曾說，羅馬公民連「十字架」這個字都不該從口中說出。而福音的中心，是一個在帝國邊陲行省被釘十字架的猶太木匠。</p><p>在羅馬帕拉丁山出土的一幅古代塗鴉（Alexamenos graffito，約主後二至三世紀），畫著一個驢頭人身的被釘者，旁邊一個人舉手敬拜，下面寫著：「亞歷山米諾敬拜他的神。」這就是當時世界看基督徒的眼光——<b>荒謬、可笑、可恥。</b></p><p>保羅說：我不以為恥。不是因為他臉皮厚，而是因為他親眼看見了這福音的能力：它使逼迫教會的掃羅變成使徒保羅，使凶暴的變成溫柔的，使拜偶像的變成敬拜真神的。</p><p>- 經文本身：福音是神施行拯救的大能，臨到所有相信的人，不分猶太人或希臘人。<br>- 321應用：這裡有一個永恆的次序——<b>福音是神的大能，不是我的大能</b>。傳福音的果效不在口才、不在方法、不在人數，在福音本身。所以最後的榮耀，只能歸給神。</p>"},{"a":17,"z":17,"star":false,"grk":"<p>δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.</p>","lit":"<p>「因為神的義，在其中（福音中）正被啟示出來，本於信、以至於信；正如經上所記：『那義人將要因信而活。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th></tr><tr><td>神的義</td><td>δικαιοσύνη θεοῦ</td><td>dikaiosynē theou</td><td>G1343</td><td>義、公義、合乎標準的狀態</td></tr><tr><td>顯明</td><td>ἀποκαλύπτεται</td><td>apokalyptetai</td><td>G601</td><td>揭開遮蓋、啟示</td></tr><tr><td>信</td><td>πίστις</td><td>pistis</td><td>G4102</td><td>信心、信靠、信實</td></tr></table>","gram":"<p>- <b>ἀποκαλύπτεται</b>：現在式被動直說語氣——「<b>正在</b>被顯明」。不是過去發生了，是每一次福音被傳講時，就再一次發生。<br>- <b>δικαιοσύνη θεοῦ</b> 的所有格是關鍵爭議（見第二十部分）。<br>- <b>ἐκ πίστεως εἰς πίστιν</b>：字面「出於信，進入信」。</p>","exp":"<p><b>這一節是宗教改革的火種。</b>馬丁路德曾坦承，他年輕時最恨「神的義」這幾個字——因為他理解成「神按公義刑罰罪人的屬性」。直到他在這節經文上被光照，看見這義是神<b>賜下</b>的義，不是神<b>要求</b>的義，他說他覺得自己重生了，天堂的門為他敞開。</p><p><b>「這義是本於信，以至於信」</b> 最好的理解：<b>從頭到尾都是信</b>（強調的重複，如「從榮耀到榮耀」）。神的義從起點到終點，沒有一寸是靠行為。</p><p>哈巴谷書2:4 的引用<b>：希伯來原文 וְצַדִּיק בֶּאֱמוּנָתוֹ יִחְיֶה（*w'ṣaddîq be'ĕmûnātô yiḥyeh*），「義人必因他的</b>信實/信心<b>（אֱמוּנָה 'ĕmûnâ, H530）存活」。原本的處境是：迦勒底人要來了，先知問神為何不管；神說義人要因信活著。</b>這句話原本是在黑暗中的等候之語，保羅把它變成救恩的憲章。</p><p>而保羅引用時，刻意刪掉了一個字——這是本節最容易被忽略、卻極有力量的細節。</p><p>- 七十士譯本主要抄本作：「義人必因<b>我的</b>信實（ἐκ πίστεώς <b>μου</b>）存活」——代名詞指神。<br>- 另有抄本傳統作：「<b>我的</b>義人必因信存活」——這是希伯來書10:38 所引的形式。<br>- <b>保羅兩個代名詞都不要。</b> 他寫的是最精簡的一句：ὁ δίκαιος ἐκ πίστεως ζήσεται。</p><p>保羅把這句話削到只剩骨頭。為什麼？<b> 因為他正要說「先是猶太人，後是希臘人」。</b>他不要任何一個字，把這句話限縮成只屬於某一群人的應許。</p><p>希臘文 ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται 有兩種斷句：<br>1. 「那<b>因信的</b>義人，必要活著」（ἐκ πίστεως 修飾 δίκαιος）<br>2. 「那義人，必<b>因信</b>而活」（ἐκ πίστεως 修飾 ζήσεται）<br>在羅馬書的上下文中（1:16「一切相信的」、3:22、4:5），第一種讀法更貼近保羅的論證：<b>人之所以被稱為義人，是本於信。</b></p>"},{"a":18,"z":18,"star":false,"grk":"<p>Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ' οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων</p>","lit":"<p>「因為神的忿怒，正從天上被顯明出來，臨到人一切的不敬虔與不義——就是那些用不義<b>壓住</b>真理的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th><th>語境</th></tr><tr><td>忿怒</td><td>ὀργή</td><td>orgē</td><td>G3709</td><td>定意的、有理由的怒</td><td>不是情緒失控，是聖潔對罪必然的反應</td></tr><tr><td>不虔</td><td>ἀσέβεια</td><td>asebeia</td><td>G763</td><td>不敬虔，對神的失敗</td><td><b>第一誡層面</b></td></tr><tr><td>不義</td><td>ἀδικία</td><td>adikia</td><td>G93</td><td>不義，對人的失敗</td><td><b>第二誡層面</b></td></tr><tr><td>阻擋</td><td>κατεχόντων</td><td>katechontōn</td><td>G2722</td><td>壓住、按住、扣留</td><td>現在式分詞，持續的動作</td></tr></table>","gram":"<p>- <b>ἀποκαλύπτεται</b>：與17節<b>同一個動詞、同一個時態語態</b>，並且擺在句首以示強調。這是刻意的平行：<b>神的義正在顯明／神的忿怒正在顯明。</b><br>- <b>κατεχόντων</b>：這個字是本節的關鍵畫面。它可以指「扣留、壓制」，像用手把一個東西按在水下不讓它浮起來。<b>人不是不知道真理，是知道了卻用力把它按住。</b></p>","exp":"<p>保羅先講好消息（16–17），再講壞消息（18–32）。<b>這個次序本身就是恩典。</b></p><p>「不虔」在「不義」之前——這是全章最重要的順序之一。<b>人的道德問題，根源是敬拜問題。</b> 不是先做壞事才離開神，是先離開神才做壞事。</p><p>- 經文本身：神的忿怒現在正臨到一切壓制真理的不敬虔與不義。<br>- 321亮光：這裡揭露了「有己」的實質——<b>人不是無知，是不肯</b>。他知道，他卻按住。這不是頭腦的問題，是寶座的問題。</p>"},{"a":19,"z":20,"star":false,"grk":"<p>διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς· ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν. τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους</p>","lit":"<p>「因為關於神可知的，在他們中間是顯明的；因為神向他們顯明了。因為祂那些看不見的事——就是祂永恆的大能和神性——自從創世以來，藉著所造之物，被思想所領悟，就清楚地被看見了；以致他們無可辯解。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th></tr><tr><td>眼不能見的</td><td>ἀόρατα</td><td>aorata</td><td>G517</td><td>不可見的</td></tr><tr><td>曉得</td><td>νοούμενα</td><td>nooumena</td><td>G3539</td><td>用心思領悟</td></tr><tr><td>可知</td><td>καθορᾶται</td><td>kathoratai</td><td>G2529</td><td>清楚地被看見</td></tr><tr><td>神性</td><td>θειότης</td><td>theiotēs</td><td>G2305</td><td>神的屬性、神格特質</td></tr><tr><td>無可推諉</td><td>ἀναπολογήτους</td><td>anapologētous</td><td>G379</td><td>無法申辯（法庭用語）</td></tr></table>","gram":"<p>保羅在此用了一個精彩的<b>矛盾修辭（oxymoron）</b>：<b>「看不見的」（ἀόρατα）被「清楚地看見」（καθορᾶται）。</b></p><p>- <b>νοούμενα</b>：現在式被動分詞——「藉著被思想」。所以自然啟示不是自動的，需要人的心思去領悟。<br>- <b>ἀναπολογήτους</b>：ἀ（不）＋ ἀπολογία（申辯，英文 apologetics 由此而來）。這是法庭語言：<b>被告啞口無言。</b><br>- <b>εἰς τὸ εἶναι</b>：εἰς ＋ 不定詞，表<b>結果</b>（有些學者主張表目的）。譯作「以致」較安全。</p>","exp":"<p><b>重要澄清</b>：這段<b>不是</b>說人可以藉著看星星得救。自然啟示所啟示的是「神的永能和神性」——<b>足以定罪，不足以拯救。</b>它使人無可推諉，卻不能使人稱義。稱義只在福音裡（1:16–17）。</p><p>- 經文本身：神在受造之物中留下了自己的證據，人無法以「我不知道」為藉口。<br>- 生命應用：<b>每一個日出、每一片葉脈、每一次呼吸，都是神留給人的信號。</b>問題從來不是神藏得太好，是人把眼睛閉上了。</p>"},{"a":21,"z":21,"star":false,"grk":"<p>διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλ' ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία.</p>","lit":"<p>「因為他們雖然認識了神，卻不把祂當作神來榮耀，也不感謝；反倒在他們的思辨中變成虛妄，他們無知的心就被弄暗了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th></tr><tr><td>榮耀</td><td>ἐδόξασαν</td><td>edoxasan</td><td>G1392</td><td>使……得榮耀、承認其重量</td></tr><tr><td>感謝</td><td>ηὐχαρίστησαν</td><td>ēucharistēsan</td><td>G2168</td><td>獻上感謝</td></tr><tr><td>變為虛妄</td><td>ἐματαιώθησαν</td><td>emataiōthēsan</td><td>G3154</td><td>變成空虛、無用（被動形式，多為狀態變化義）</td></tr><tr><td>思念</td><td>διαλογισμοῖς</td><td>dialogismois</td><td>G1261</td><td>推理、思辨</td></tr><tr><td>昏暗</td><td>ἐσκοτίσθη</td><td>eskotisthē</td><td>G4654</td><td>變得黑暗（被動形式）</td></tr><tr><td>心</td><td>καρδία</td><td>kardia</td><td>G2588</td><td>心——意志、情感、思想的中心</td></tr></table>","gram":"<p>- <b>γνόντες</b>：不定過去式分詞，讓步用法——「<b>雖然</b>已經認識了神」。定罪的根據在此。<br>- <b>ἐματαιώθησαν</b> 與 <b>ἐσκοτίσθη</b>：兩個都是<b>不定過去式被動形式</b>。</p><p><b>這裡必須謹慎，不可把文法講過頭。</b> 在 Koine 希臘文中，被動形式（尤其是 aorist passive）<b>常常只表達「進入某種狀態」的不及物意義</b>，未必指向一位施動者——例如 ἐγενήθην（成為）、ἐπορεύθην（去）。因此最保守、也最站得住的翻譯是：「他們的思念<b>變得</b>虛妄，他們無知的心<b>變得</b>昏暗。」</p><p><b>不可以說</b>：「原文是被動，所以是神把他們的心弄暗的。」這是超出證據的推論。</p><p><b>但值得注意的是這一點</b>：21、22 節這三個被動形式（虛妄、昏暗、愚拙），與 24、26、28 節三次「神就任憑」（παρέδωκεν，<b>主動語態，主詞明確是神</b>）同屬一個段落，而且中間只隔兩節。保羅是否刻意讓讀者先讀到一連串「不知道是誰做的」的被動，再在三節之後揭曉施動者——這是<b>文法無法定案、神學上卻極有份量的開放性</b>。</p><p><b>講台上可以這樣說（而且更有力）：</b> 「保羅在這裡沒有說是誰把他們的心弄暗的。他先不說。可是再往下讀三節，他就告訴你了。」</p><p>- <b>ματαιόω</b> 的字根 μάταιος，在七十士譯本中常用來翻譯希伯來文 הֶבֶל（*hebel*，傳道書的「虛空」）與偶像的「虛無」。<b>保羅在說：人拜什麼，就變成什麼。</b> 拜虛空的，思想就變虛空（比較詩115:8「造他的要和他一樣」）。</p>","exp":"<p>罪的第一步不是殺人放火，是不榮耀神、不感謝神。</p><p>「榮耀祂」——就是承認神有祂該有的份量與位置。<br>「感謝祂」——就是承認我所有的都是領受的。</p><p>不榮耀神，就是把神從寶座上請下來。<br>不感謝神，就是把自己當作源頭。</p><p>這兩件事的合起來，就是「有己」的定義。</p><p>而結果是連鎖反應：<b>寶座錯了 → 思想虛妄了 → 心昏暗了。</b>注意方向：<b>不是頭腦昏暗了才拜錯神，是拜錯了才昏暗。</b>人生的問題從來不是先從理智開始的，是從敬拜開始的。</p>"},{"a":22,"z":23,"star":false,"grk":"<p>φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.</p>","lit":"<p>「他們宣稱自己是有智慧的，卻成了愚昧；並且把那不朽壞之神的榮耀，換成了必朽壞的人、飛鳥、四足獸、爬蟲的形像的樣式。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th></tr><tr><td>自稱</td><td>φάσκοντες</td><td>phaskontes</td><td>G5335</td><td>宣稱、聲稱（含虛假意味）</td></tr><tr><td>成了愚拙</td><td>ἐμωράνθησαν</td><td>emōranthēsan</td><td>G3471</td><td>變為愚昧（被動形式；英文 moron 由此）</td></tr><tr><td>換</td><td>ἤλλαξαν</td><td>ēllaxan</td><td>G236</td><td>交換、掉換</td></tr><tr><td>不能朽壞</td><td>ἀφθάρτου</td><td>aphthartou</td><td>G862</td><td>不朽的</td></tr><tr><td>必朽壞</td><td>φθαρτοῦ</td><td>phthartou</td><td>G5349</td><td>會腐爛的</td></tr></table>","gram":"<p>- <b>ἐμωράνθησαν</b> 同樣是被動形式，與 21 節的兩個動詞形成第三次重複（虛妄、昏暗、愚拙）。同樣地，此處最穩妥的理解是「變成了愚昧」；重點不在文法能否證明施動者，而在<b>保羅把「自稱聰明」與「成了愚昧」直接放在一起</b>——人越自信，越走進自己的愚昧裡。<br>- <b>ἄφθαρτος / φθαρτός</b>：刻意的頭韻對比。<b>用「會爛的」換「不會爛的」——這是全世界最虧本的交易。</b><br>- <b>列表的次序</b>：人 → 飛禽 → 走獸 → 昆蟲。<b>一路往下。</b>這正是創世記1:20–26 的<b>倒轉</b>：神造飛鳥、走獸、爬蟲，最後造人（按神形像）；人卻反過來，把神的榮耀降級成人的形像，再降到昆蟲。<b>拜錯了，人就一路往下掉。</b></p>","exp":"<p>23節是七十士譯本詩篇106:20 的逐字回響——這不是印象，是可以逐字比對的證據。</p><p>- LXX 詩105(106):20：ἠλλάξαντο τὴν <b>δόξαν</b> αὐτῶν <b>ἐν ὁμοιώματι</b> μόσχου ἔσθοντος χόρτον（把他們的<b>榮耀</b>換成吃草之牛的<b>樣式</b>）<br>- 羅1:23：ἤλλαξαν τὴν <b>δόξαν</b> τοῦ ἀφθάρτου θεοῦ <b>ἐν ὁμοιώματι</b> εἰκόνος...</p><p><b>同一個動詞（ἀλλάσσω）、同一個受詞（δόξα）、同一個介系詞片語（ἐν ὁμοιώματι）。</b> 保羅是拿著詩篇106篇在寫外邦人。</p><p>另外也回響<b>耶利米書2:11</b>：「豈有一國換了他的神嗎？……但我的百姓將他們的榮耀換了那無益的神。」</p><p>而 εἰκών（形像）這個字，把三段經文串成一條線：</p><table><tr><th>經文</th><th>內容</th></tr><tr><td>創1:26–27（LXX）</td><td>神照著自己的 <b>εἰκών</b> 造人</td></tr><tr><td>羅1:23</td><td>人把神的榮耀換成必朽壞之<b>人</b>的 <b>εἰκών</b></td></tr><tr><td>西1:15</td><td>基督是那不能看見之神的 <b>εἰκών</b></td></tr></table><p><b>人不是換了一個神，人是把自己的鏡子當成了太陽。</b> 而福音的答案是：真正的形像，一直都在——祂就是基督。</p><p>保羅的用意極深<b>：他表面在講外邦人拜偶像，用的卻是</b>神責備以色列<b>的語言。所以到了第二章，猶太讀者無法說「這與我無關」。</b>在西乃山下發生的事，是全人類的縮影。</p><p>- 經文本身：人用受造物的形像取代了創造主的榮耀。<br>- 321應用：偶像不一定有形。今天的偶像可能是成就、名聲、關係、金錢、健康、兒女、事工——任何一件被我們放在寶座上、被我們用來定義自己價值的東西。<b>問題不是那東西不好，是它坐錯了位子。</b></p>"},{"a":24,"z":24,"star":false,"grk":"<p>Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν αὐτοῖς</p>","lit":"<p>「所以神把他們<b>交付</b>在他們心裡的情慾中，以致污穢，使他們的身體在彼此之間被玷辱。」</p>","key":"<p>- <b>παραδίδωμι</b>（G3860）：<b>交付、移交</b>。這是一個法律與軍事用語：法官把囚犯<b>交給</b>獄卒；將領把城<b>交給</b>敵人。同一個字用在猶大「賣」耶穌（可14:10）、彼拉多把耶穌「交給」人釘十字架（可15:15）。<br>- <b>ἐπιθυμία</b>（G1939）：強烈的渴望、慾望。<br>- <b>ἀκαθαρσία</b>（G167）：污穢、不潔。</p>","gram":"<p>- <b>παρέδωκεν</b>：不定過去式<b>主動</b>直說語氣，<b>主詞是 ὁ θεός（神）</b>。這是全段最令人震動的文法事實：<b>「任憑」不是神袖手旁觀，是神主動的司法行動。</b><br>- <b>Διό</b>（所以）：明確標示因果——因為人做了23節的事，所以神做了24節的事。</p>","exp":"<p>中文「任憑」容易被誤解為「隨他去吧」的消極放任。原文更重：<b>神把他們「交出去」。</b></p><p>這是聖經中最可怕的一種審判：<b>神不再攔阻你。</b></p><p>想像一個孩子拼命掙脫父親的手，要往路中間跑。父親抓了三次、五次、十次；最後父親鬆手了。那一刻不是父親不愛他，是父親按著公義，把他交給他自己所堅持要的。</p><p><b>罪的最終刑罰之一，就是罪本身。</b>「逞著心裡的情慾」——他們得到了他們想要的，這就是刑罰。奧古斯丁說得極準：神有時藉著應允我們的禱告來審判我們。</p>"},{"a":25,"z":25,"star":false,"grk":"<p>οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>「這些人把神的真實換成了那虛謊，敬拜並事奉受造之物，過於（或代替）那造物的主——祂是當受頌讚的，直到永遠。阿們。」</p>","key":"<p>- <b>μετήλλαξαν</b>（G3337）：比23節的 ἤλλαξαν 更強（加了 μετά）——<b>徹底掉換</b>。<br>- <b>τῷ ψεύδει</b>：<b>有冠詞的「那謊言」</b>——不是隨便一個謊，是那個根本的謊言。哪一個謊？創世記3:5：「你們便如神能知道善惡。」<b>人類的第一個謊言，就是「你可以自己作神」。</b><br>- <b>ἐσεβάσθησαν καὶ ἐλάτρευσαν</b>：敬拜（心的態度）＋ 事奉（生活的行動）。<b>敬拜必然帶出事奉；你事奉什麼，就洩漏你敬拜什麼。</b><br>- <b>παρὰ τὸν κτίσαντα</b>：παρά ＋ 直接受格，可譯「過於」或「代替」。</p>","gram":"","exp":"<p>保羅寫到這裡，突然停下來加一句頌讚：「主乃是可稱頌的，直到永遠。阿們！」——<b>這是一個敬虔的人本能的反射。</b>當他描述人如何褻瀆神，他忍不住要為神說一句公道話。</p><p>這是講道者的心：即使在講最黑暗的罪，眼睛仍然抬起來看神。</p><p>「那謊言」與「神的真實」的對比，是整章的核心：<br>- <b>真理</b>：神是神，人是人。<br>- <b>謊言</b>：我可以作神。</p><p>321的語言說：<b>有己，就是活在那個謊言裡。無己，就是回到真實裡——讓人作人，讓神作神。</b></p>"},{"a":26,"z":27,"star":false,"grk":"<p>Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας … μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν …</p>","lit":"<p>26「<b>因此</b>，神<b>任憑</b>他們陷入羞辱的情慾。他們的女人把<b>合乎本性的用處</b>，<b>換成了</b>違反本性的；」<br>27「男人也是一樣，離棄了女人合乎本性的用處，彼此慾火焚燒，男人與男人做出可恥的事，就在自己身上，領受了他們那<b>走岔之行為</b>所當得的報應。」</p>","key":"<p>- <b>πάθη ἀτιμίας</b>（G3806/G819）：「羞辱的情慾」。<br>- <b>φυσικὴν χρῆσιν</b>（G5446/G5540）：「合乎本性的用法」。<br>- <b>παρὰ φύσιν</b>：「違反／超出本性」。<br>- <b>μετήλλαξαν</b>：<b>第三次出現的「換」</b>——與25節同一個字。</p>","gram":"<p>這是全段最容易被誤讀的地方，而解讀的鑰匙在文法結構裡。</p><p>26–27節是由 <b>Διὰ τοῦτο（因此）</b> 引出的<b>第二次任憑</b>，而它承接的是25節的<b>敬拜錯亂</b>。保羅刻意用同一個動詞 μετήλλαξαν（換）串起 25 與 26 節：</p><pre>25節：把神的真實  換成  虛謊       （垂直的錯亂：敬拜）\n26節：把順性的用處 換成  逆性的用處  （水平的錯亂：受造秩序）</pre><p><b>保羅的論點不是「同性性行為是最壞的罪」，而是：當人在敬拜上把創造主與受造物對調，人在受造秩序上也會出現對調。</b>這是神學論證，不是道德排行榜。證據就是：29–31節接著列出嫉妒、爭競、狂傲、違背父母——把「拜偶像」與「背後說人」放在同一份清單上。</p>","exp":"<p>- <b>經文本身明確表達的</b>：保羅在此描述的性行為，是他視為違背創造秩序（φύσις，回指創1–2的男女受造）的行為，並將之作為人類敬拜錯亂在受造層面的顯現。這是希臘文與上下文最自然的讀法，也是歷世歷代教會的主流理解。<br>- <b>學者間的討論</b>（公平列出）：有學者（如 Boswell、Countryman 一系）主張保羅只是針對當時的剝削型關係（孌童、廟妓）或個人「本性」的違背。但多數福音派與許多非福音派學者不接受，理由是：(1) 保羅同時提到女性，這超出孌童模式；(2) ἄρσενες ἐν ἄρσεσιν 描述的是<b>彼此</b>（εἰς ἀλλήλους）的貪戀，而非單向剝削；(3) φύσις 在上下文中與創造（κτίσις、κτίσαντα）詞群密切相連，指向受造秩序而非個人傾向。<br>- <b>必須立刻加上的牧養話</b>：這段經文<b>不是給教會拿來丟石頭的</b>。因為 2:1 立刻說：「你這論斷人的，無論你是誰，也無可推諉。」而 29–31節的清單裡有「嫉妒、爭競、狂傲、自誇、違背父母、無親情」——<b>每一間教會的長椅上都坐滿了符合這份清單的人，包括講台上這一位。</b></p><p><b>福音的話必須同時說出來</b>：<br>「你們中間也有人從前是這樣；但如今你們奉主耶穌基督的名，並藉著我們神的靈，已經洗淨，成聖，稱義了。」（林前6:11）</p><p>「從前是這樣」——福音的能力，就在這四個字裡。</p>"},{"a":28,"z":28,"star":false,"grk":"<p>καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα</p>","lit":"<p>「並且，正如他們<b>不認可</b>把神存在認識中，神就把他們交給一個<b>不被認可的</b>心思，去行那些不該行的事。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th></tr><tr><td>不認識（不認可）</td><td>οὐκ ἐδοκίμασαν</td><td>ouk edokimasan</td><td>G1381</td><td>未經察驗而認可</td></tr><tr><td>邪僻的</td><td>ἀδόκιμον</td><td>adokimon</td><td>G96</td><td>經察驗後被棄絕的（次品）</td></tr><tr><td>心</td><td>νοῦν</td><td>noun</td><td>G3563</td><td>心思、理性</td></tr></table><p><b>δοκιμάζω / ἀδόκιμος 是同一個字根。</b>這在原文中是刺目的雙關：</p><p>人「不認可」神，神就把人交給一個「不被認可」的心思。</p><p>δοκιμάζω 原是<b>金屬檢驗</b>的用語：把金屬放在火中試驗，合格的叫 δόκιμος，不合格被丟棄的叫 ἀδόκιμος（廢料）。</p>","gram":"","exp":"<p>「故意不認識神」——和合本的「故意」譯得很好，因為 ἐδοκίμασαν 不是「不知道」，是「檢驗過後決定不要」。<b>人把神放在天平上秤了一秤，然後說：不合我用。</b></p><p>於是神說：好。你不要我作你思想的主，我就讓你的思想成為廢料。</p><p>這是最深的悲哀：人自以為擺脫了神，得到了自由的心思；實際上得到的是一顆再也不能正確判斷的心。</p><p>321的角度看：這正是「用腦靠自己」的終點。<b>人的理性一旦離開了神，就不再是通往真理的工具，而成了合理化罪的工廠。</b></p>"},{"a":29,"z":31,"star":false,"grk":"<p>πεπληρωμένους πάσῃ ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς, καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς, ἀσυνέτους, ἀσυνθέτους, ἀστόργους, ἀνελεήμονας·</p>","lit":"<p>29「他們<b>已被填滿</b>了各樣的不義、邪惡、貪婪、惡毒；<b>滿了</b>嫉妒、凶殺、爭競、詭詐、毒恨；」<br>30「是<b>搬弄是非的</b>、<b>背後說人的</b>、恨神的、<b>施暴傲慢的</b>、高抬自己的、吹噓的、<b>發明惡事的</b>、不順從父母的；」<br>31「是<b>沒有悟性的</b>、<b>不守信用的</b>、<b>沒有親情的</b>、<b>沒有憐憫的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字義</th></tr><tr><td>裝滿</td><td>πεπληρωμένους</td><td>peplērōmenous</td><td>G4137</td><td>完成式被動分詞：已被填滿</td></tr><tr><td>滿心是</td><td>μεστούς</td><td>mestous</td><td>G3324</td><td>滿的</td></tr><tr><td>嫉妒／凶殺</td><td>φθόνου φόνου</td><td>phthonou phonou</td><td>G5355/G5408</td><td><b>僅差一個字母的雙關</b></td></tr><tr><td>侮慢人的</td><td>ὑβριστάς</td><td>hybristas</td><td>G5197</td><td>傲慢施暴者（hubris 由此）</td></tr><tr><td>狂傲的</td><td>ὑπερηφάνους</td><td>hyperēphanous</td><td>G5244</td><td>顯得高人一等</td></tr><tr><td>自誇的</td><td>ἀλαζόνας</td><td>alazonas</td><td>G213</td><td>吹噓者</td></tr><tr><td>無親情的</td><td>ἀστόργους</td><td>astorgous</td><td>G794</td><td>沒有家人之愛</td></tr></table>","gram":"","exp":"<p>這份清單裡有五個字是<b>關於嘴巴</b>（讒毀、背後說人、侮慢、自誇、捏造惡事）——<b>保羅把「說閒話」與「凶殺」放在同一份清單上。</b></p><p>還有「狂傲的」（ὑπερήφανος）——雅各書4:6與彼前5:5引用箴言3:34：「神阻擋驕傲的人，賜恩給謙卑的人」，用的正是這個字。<b>驕傲被列在這份最黑暗的清單中，因為它就是這一切的源頭。</b></p><p>這份清單的功能不是讓我們給世界打分數，是讓我們照鏡子。</p><p>一個重要的文獻對照：<b> 次經《所羅門智慧書》13–14章的論證順序是——自然界應當使人認識造物主 → 人卻拜偶像 → 於是道德全面敗壞 → 接著列出一長串惡行清單。</b>這與羅1:19–31 的順序幾乎完全一致。</p><p>這說明了兩件事：<br>1. 保羅是在使用<b>當時猶太人早已熟悉、且讀了會拍手叫好的一套控訴文體</b>。<br>2. 正因如此，<b>2:1 的翻轉才那麼致命</b>——保羅先讓讀者一路點頭，然後把整篇控訴文轉過來砸在他們自己身上。</p><p>（講台上不必提書名，說「保羅時代猶太人常用的一套論證」即可。）</p>"},{"a":32,"z":32,"star":false,"grk":"<p>οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.</p>","lit":"<p>「這些人雖然完全知道神的判定——就是行這樣事的人是該死的——他們不但去行，還贊同、樂於認同那些去行的人。」</p>","key":"<p>- <b>ἐπιγνόντες</b>（G1921）：ἐπί（加強）＋ γινώσκω——<b>完全地知道</b>。<br>- <b>συνευδοκοῦσιν</b>（G4909）：σύν（一同）＋ εὖ（好）＋ δοκέω（認為）——<b>一同認為好、贊同、鼓掌</b>。</p>","gram":"","exp":"<p>保羅把最重的一句留在最後：<b>比犯罪更嚴重的，是為犯罪鼓掌。</b></p><p>為什麼？因為犯罪的人至少可能還有良心的刺痛；但<b>為罪辯護、鼓掌、按讚、推廣的人，已經把良心的最後一道防線也交出去了</b>。他不只是跌倒，他在建立一個讓跌倒變成正常的體系。</p><p><b>這一節在今天有極其現實的意義。</b>我們生活在一個「按讚」與「分享」的時代——συνευδοκέω 的現代形式，可能只需要動一根手指。</p><p>而請注意：<b>保羅寫這一節的時候，他自己心裡一定閃過一個畫面。</b>使徒行傳8:1：「掃羅也<b>喜悅</b>他（司提反）被害。」那裡的希臘文正是 συνευδοκῶν——<b>同一個字。</b></p><p>保羅在寫這章最後一句的時候，是在寫他自己。</p><p>這也解釋了為什麼他能在下一章立刻說「你這論斷人的，無論你是誰，也無可推諉」——因為他知道那個「無可推諉」的人，第一個就是他。<b>而這樣的一個人，蒙了憐憫。這就是為什麼他不以福音為恥。</b></p>"}],"2":[{"a":1,"z":1,"star":false,"grk":"<p>Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων.</p>","lit":"<p
