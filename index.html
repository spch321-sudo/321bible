τῷ ἰδίῳ νοῒ πληροφορείσθω.</p>","lit":"<p>5「有人<b>看某一日比别日重要</b>；有人<b>看每一日都一样</b>。<b>只要各人在自己的心思里，被充分说服</b>。」<br>6「那<b>看重某日的</b>，是<b>为主</b>看重的；那<b>吃的</b>，是为主吃的——<b>因为他感谢神</b>；那<b>不吃的</b>，是为主不吃的——<b>他也感谢神</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>心里</td><td>νοῦς</td><td>nous</td><td>G3563</td><td><b>心思、理智</b>（<b>12:2同字</b>）</td></tr><tr><td>意见坚定</td><td>πληροφορείσθω</td><td>plērophoreisthō</td><td>G4135</td><td><b>被完全装满、被充分说服</b>（<b>4:21同字</b>）</td></tr><tr><td>感谢神</td><td>εὐχαριστεῖ</td><td>eucharistei</td><td>G2168</td><td>献上感谢</td></tr></table>","gram":"<p>★ 亮光一：πληροφορέω ——第四章那个字</p><pre>4:21  亚伯拉罕「【满心相信】（πληροφορηθείς）神所应许的必能做成」\n14:5  「各人心里要【意见坚定】（πληροφορείσθω）」</pre><p>这个字的字面是「<b>被装满到顶</b>」，也用于「船只满帆」。</p><p>弟兄姊妹，保罗在说：</p><p>你不必跟别人一样——</p><p>但你要在<b>你自己的心思里</b>，被充分说服。</p><p>（换句话说：<b>不要因为别人这样做，你就跟着做</b>；也不要因为别人那样做，你就跟着批评。）</p><p>★ 亮光二：14:6的关键——两边都感谢神</p><pre>吃的人   —— 为主吃的，【因他感谢神】\n不吃的人 —— 为主不吃的，【也感谢神】</pre><p>弟兄姊妹，这是全章最令人安静的一句话。</p><p>两个人做的事相反。</p><p>但两个人做的<b>动作</b>是一样的——</p><p>他们都在<b>谢饭</b>。</p><p>★ 亮光三：νοῦς ——12:2那个字</p><pre>12:2  「只要【心意】（νοῦς）更新而变化」\n14:5  「各人【心里】（νοῦς）要意见坚定」</pre><p>保罗在12:2说：心思要被更新。<br>在14:5说：而更新后的心思，<b>每个人的进度不一样</b>。</p>","exp":"<p>弟兄姊妹，6节是全章<b>最令人安静</b>的一句话。</p><p>两个人做的事<b>完全相反</b>：一个吃，一个不吃。</p><p>但他们在做<b>同一个动作</b>——</p><p>他们都在<b>谢饭</b>。</p><p><b>经文本身明确表达的：</b> 在守日与饮食这类事上，各人要在自己心里意见坚定；而两边都是「为主」，并且都感谢神。</p><p><b>可以合理推论的：</b> 「意见坚定」（πληροφορέω）的字面是「<b>被装满到顶</b>」，也用于「船只满帆」——<br>那是4:21形容亚伯拉罕「<b>满心相信</b>」的同一个字。</p><p>所以保罗要的不是「你跟大家一样」，是「<b>你自己在神面前被说服</b>」。</p><p>换句话说：<b>不要因为别人这样做你就跟着做；也不要因为别人那样做你就跟着批评</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 14:5「有人看这日比那日强」与安息日的关系，<br>敬虔的基督徒有不同看法（见第二十部分）。<br>而值得注意的是：<b>连保罗自己都没有在这件事上定案</b>——他只说「各人心里要意见坚定」。</p>"},{"a":7,"z":9,"star":true,"grk":"<p>9 εἰς τοῦτο γὰρ Χριστὸς ἀπέθανεν καὶ ἔζησεν, ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.</p>","lit":"<p>7「因为我们<b>没有一个人为自己活</b>，也<b>没有一个人为自己死</b>。」<br>8「因为我们若活着，是<b>向着主</b>活；若死了，是<b>向着主</b>死。所以，我们或活或死，<b>都是属主的</b>。」<br>9「因为基督<b>死了，又活了</b>，正是为这缘故：<b>要作死人与活人的主</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>主的人</td><td>τοῦ κυρίου ἐσμέν</td><td>tou kyriou esmen</td><td>G2962</td><td><b>我们是主的</b>（所有格：属于祂）</td></tr><tr><td>作主</td><td>κυριεύσῃ</td><td>kyrieusē</td><td>G2961</td><td><b>作主、掌权</b>（<b>6:9、6:14、7:1同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：κυριεύω 的旅程</p><pre>6:9   死不再【作主】了\n6:14  罪必不能【作】你们的【主】\n7:1   律法【管】人是在活着的时候\n   ↓\n14:9  基督死了又活了，为要【作】死人并活人的【主】</pre><p>弟兄姊妹，罗马书一路在拆掉各种「主」——死、罪、律法。</p><p>到了第十四章，那个空出来的位置，有人坐上去了：</p><p>基督。</p><p>★ 亮光二：14:9是整段的基督论根据</p><p>保罗为什么说「你是谁，竟论断别人的仆人」？</p><p>因为：</p><pre>基督死了又活了 → 为要作主 → 所以那个人是【祂的】\n   ↓\n你论断他，等于在祂的家里替祂管家</pre><p>★ 亮光三：「没有一个人为自己活」</p><p>弟兄姊妹，14:7常被引用成一句励志的话（「人要为别人而活」）。</p><p>但保罗的意思更精确：</p><p>我们<b>不属于自己</b>——<b>我们属于主</b>（14:8）。</p>","exp":"<p>弟兄姊妹，这三节是14:4那句反问（「你是谁，竟论断<b>别人的</b>仆人」）的<b>神学根据</b>。</p><p>保罗的推论链很清楚：</p><pre>基督死了又活了（14:9）\n   ↓ 为要作主\n所以那个人是【祂的】（14:8）\n   ↓\n所以审判权在祂，不在你（14:4、14:10）</pre><p><b>经文本身明确表达的：</b> 没有人为自己活或死；我们或活或死都属于主；因为基督死而复活，正是为要作死人与活人的主。</p><p><b>可以合理推论的：</b> 「没有一个人为自己活」常被引成一句励志的话（「人要为别人而活」）。</p><p>但保罗的意思更精确：<b>我们不属于自己——我们属于主</b>。</p><p>而 κυριεύω（作主）这个字，在罗马书一路被拆过：</p><pre>6:9   死不再【作主】了\n6:14  罪必不能【作】你们的【主】\n7:1   律法【管】人是在活着的时候\n   ↓\n14:9  基督【作】死人并活人的【主】</pre><p>罗马书一路在拆掉各种「主」——而那个空出来的位置，有人坐上去了。</p><p>【第三段｜14:10–12　神的台前】</p>"},{"a":10,"z":12,"star":true,"grk":"<p>10 …πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ θεοῦ.<br>12 ἄρα οὖν ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον δώσει τῷ θεῷ.</p>","lit":"<p>10「但<b>你</b>——你为什么论断你的弟兄？或者<b>你</b>——你为什么把你的弟兄当作零？<b>因为我们都要站在神的审判台前</b>。」<br>11「因为经上记着：『主说：<b>我指着我的永生起誓</b>：<b>万膝必向我跪拜</b>，<b>万口必向神承认</b>。』」<br>12「这样看来，<b>我们各人都要为自己的事，向神交帐</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>站</td><td>παραστησόμεθα</td><td>parastēsometha</td><td>G3936</td><td><b>παρίστημι——6:13、12:1「献上」那个字！</b></td></tr><tr><td>台</td><td>βῆμα</td><td>bēma</td><td>G968</td><td><b>审判台</b>（见下）</td></tr><tr><td>说明</td><td>λόγον δώσει</td><td>logon dōsei</td><td>G3056</td><td><b>交帐、给出说明</b></td></tr></table>","gram":"<p>★ 亮光一：βῆμα ——一个很具体的东西</p><p>βῆμα 是一个<b>高起的平台</b>，官长坐在上面审案。</p><p>新约中：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>太27:19</b></td><td>彼拉多<b>坐堂</b>（βῆμα）的时候</td></tr><tr><td><b>徒18:12</b></td><td><b>保罗在哥林多被拉到迦流的公堂（βῆμα）前</b></td></tr><tr><td><b>林后5:10</b></td><td>「我们众人必要在<b>基督台前</b>显露出来」</td></tr></table><p>弟兄姊妹，保罗写罗马书的地点，正是<b>哥林多</b>。</p><p>而他自己就曾站在哥林多的那个 βῆμα 前面受审。</p><p>★ 亮光二：παρίστημι ——「献上」那个字</p><pre>6:13  「将自己【献给】（παραστήσατε）神」\n12:1  「将身体【献上】（παραστῆσαι），当作活祭」\n   ↓\n14:10 「我们都要【站在】（παραστησόμεθα）神的台前」</pre><p>弟兄姊妹，同一个字。</p><p>你现在<b>献上</b>自己（12:1）；<br>将来你要<b>站在</b>祂面前（14:10）。</p><p>是同一个动作的两个时态。</p><p>★ 亮光三：ἕκαστος περὶ ἑαυτοῦ ——「各人为<b>自己</b>」</p><p>14:12的重点在两个词：</p><pre>ἕκαστος   —— 【各人】\nπερὶ ἑαυτοῦ —— 【为自己的事】</pre><p>弟兄姊妹，这一节堵死了论断最后的借口：</p><p>那一天，你不会被问到「你弟兄做得怎么样」。</p><p>你会被问到——<b>你自己</b>。</p><p>★ 亮光四：14:11引赛45:23</p><p>而腓2:10–11把同一段用在<b>基督</b>身上。</p><p>这与罗10:13（珥2:32的「主」＝耶和华）是同一个模式。</p>","exp":"<p>弟兄姊妹，10节用了两个很强的「你」（σὺ δὲ… ἢ καὶ σὺ…）——</p><p>保罗是<b>指着鼻子问</b>的。</p><p>而「台」（βῆμα）是一个很具体的东西：</p><p>一个<b>高起的平台</b>，官长坐在上面审案。</p><p>（太27:19彼拉多「<b>坐堂</b>」；徒18:12<b>保罗自己在哥林多被拉到迦流的公堂前</b>——而他正是在哥林多写这封信。）</p><p><b>经文本身明确表达的：</b> 我们都要站在神的台前，各人要为自己的事向神交帐。</p><p><b>可以合理推论的：</b> 12节堵死了论断最后的借口——</p><p>那一天，你<b>不会</b>被问到「你弟兄做得怎么样」。<br>你会被问到——<b>你自己</b>。</p><p><b>⚠ 补充：</b> 「站在」（παραστησόμεθα）正是6:13、12:1「<b>献上</b>」那个字。</p><p>你现在<b>献上</b>自己（12:1）；将来你要<b>站在</b>祂面前（14:10）。</p><p>是同一个动作的两个时态。</p><p>【第四段｜14:13–18　绊脚石】</p>"},{"a":13,"z":13,"star":true,"grk":"<p>Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.</p>","lit":"<p>「所以，<b>我们不可再彼此论断</b>；<b>倒要判定这一件事</b>：<b>不给弟兄放下绊脚石或陷阱</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>论断／定意</td><td>κρίνωμεν／κρίνατε</td><td>krinōmen/krinate</td><td>G2919</td><td><b>同一个动词，两次</b>（见下）</td></tr><tr><td>绊脚</td><td>πρόσκομμα</td><td>proskomma</td><td>G4348</td><td><b>绊倒人的东西</b>（<b>9:33同字</b>）</td></tr><tr><td>跌人之物</td><td>σκάνδαλον</td><td>skandalon</td><td>G4625</td><td><b>捕兽夹的触发杆</b>（见下）</td></tr></table>","gram":"<p>★ 亮光一：κρίνω 的文字游戏</p><pre>μηκέτι ἀλλήλους κρίνωμεν —— 不可再彼此【论断】\nἀλλὰ τοῦτο κρίνατε μᾶλλον —— 宁可【判定】这件事</pre><p>弟兄姊妹，保罗在说：</p><p>你要「判」，可以。</p><p>但不要判<b>那个人</b>——判<b>这件事</b>：</p><p>我不要成为他的绊脚石。</p><p>★ 亮光二：σκάνδαλον 的原意</p><p>这个字原指<b>捕兽夹上的那根触发杆</b>——动物一碰，夹子就合起来。</p><p>弟兄姊妹，πρόσκομμα 是「绊一下」；<br>σκάνδαλον 是「<b>踩到就被夹住</b>」。</p><p>保罗用了两个字，一个比一个严重。</p><p>★ 亮光三：πρόσκομμα ——9:33那个字</p><pre>9:33  「我在锡安放一块【绊脚的石头】（πρόσκομμα）」—— 那是【基督】\n   ↓\n14:13 「谁也不给弟兄放下【绊脚】（πρόσκομμα）跌人之物」</pre><p>弟兄姊妹，这个对照很严肃：</p><p>神放了一块绊脚石，是为了叫人<b>面对基督</b>。</p><p>而你若放一块绊脚石——<b>那是叫人跌倒</b>。</p>","exp":"<p>弟兄姊妹，13节在原文里是一个<b>文字游戏</b>——同一个动词用了两次。</p><pre>μηκέτι ἀλλήλους κρίνωμεν   —— 不可再彼此【论断】\nἀλλὰ τοῦτο κρίνατε μᾶλλον  —— 宁可【判定】这件事</pre><p><b>经文本身明确表达的：</b> 不要再彼此论断；要下的判断是：不给弟兄放下绊脚跌人之物。</p><p><b>可以合理推论的：</b> 保罗<b>没有</b>说「不要judge」。</p><p>他说：<b>你要「判」，可以——但不要判那个人，判这件事</b>。</p><p>而那件事是：<b>我不要成为他的绊脚石</b>。</p><p><b>⚠ 补充：</b> 保罗用了<b>两个</b>字，一个比一个严重——</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>πρόσκομμα</b></td><td><b>绊一下</b>（9:33「绊脚的石头」同字）</td></tr><tr><td><b>σκάνδαλον</b></td><td><b>陷阱的触发杆</b>——踩到就被夹住</td></tr></table><p>而9:33那块绊脚石是<b>神放的、指向基督的</b>；14:13这块是<b>你放的、叫人跌倒的</b>。</p>"},{"a":14,"z":15,"star":true,"grk":"<p>15 …μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.</p>","lit":"<p>14「<b>我知道，并且在主耶稣里已被说服</b>：<b>没有一样东西本身是不洁净的</b>；只是<b>对那以为某物不洁净的人，那物对他就是不洁净的</b>。」<br>15「因为你若因食物<b>使你的弟兄忧愁</b>，你就<b>不再是照着爱而行</b>了。<b>不要因你的食物，毁掉那位基督为他死的人</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>确知深信</td><td>οἶδα καὶ πέπεισμαι</td><td>oida kai pepeismai</td><td>G1492/G3982</td><td><b>我知道，并且已被说服</b>（<b>8:38同字</b>）</td></tr><tr><td>不洁净</td><td>κοινός</td><td>koinos</td><td>G2839</td><td><b>共用的、普通的</b> → 礼仪上不洁</td></tr><tr><td>忧愁</td><td>λυπεῖται</td><td>lypeitai</td><td>G3076</td><td>使之忧伤</td></tr><tr><td>败坏</td><td>ἀπόλλυε</td><td>apollye</td><td>G622</td><td><b>毁掉、使之灭亡</b>（<b>现在式命令的否定</b>）</td></tr></table>","gram":"<p>★ 亮光一：保罗站在「强的」那一边</p><p>「我凭着主耶稣<b>确知深信</b>，凡物本来没有不洁净的。」</p><p>πέπεισμαι 是<b>完成被动式</b>——「我已经被说服了」（8:38「我深信」同字）。</p><p>弟兄姊妹，这一节极其重要：</p><p>保罗<b>在神学上完全同意「强的人」</b>。</p><p>然后——</p><p>他花了整整一章，教强的人要让步。</p><p>★ 亮光二：κοινός ——「普通的」</p><p>这个字的本义是「<b>共用的、大家的、普通的</b>」。</p><p>（徒2:44「凡物<b>公用</b>」——同字）</p><p>在犹太的用法中，它引申为「<b>未经分别为圣的 → 不洁净的</b>」。</p><p>弟兄姊妹，保罗说的是：那件事本身没有问题。</p><p>问题在<b>那个人的良心</b>。</p><p>★ 亮光三：14:15的两个理由</p><pre>理由一：「就不是按着【爱人】的道理行」—— 13:8–10的爱\n理由二：「【基督已经替他死】」        —— 十字架的代价</pre><p>弟兄姊妹，第二个理由是全章最重的一句话：</p><p>你为了一口食物，可能伤害的那个人——</p><p>基督<b>为他死过</b>。</p><p>★ 亮光四：ἀπόλλυμι 的力度</p><p>「叫他<b>败坏</b>」——ἀπόλλυμι 是很重的字（灭亡、毁掉）。</p><p>（关于这是否指「失去救恩」，见第二十部分。）</p>","exp":"<p>弟兄姊妹，14节极其重要——因为它告诉我们<b>保罗站在哪一边</b>。</p><p>「我凭着主耶稣<b>确知深信</b>（πέπεισμαι，完成被动式：我已经被说服了），<br>凡物本来<b>没有不洁净的</b>。」</p><p>保罗在神学上<b>完全同意「强的人」</b>。（15:1他更明说：「我们<b>坚固的人</b>……」）</p><p>然后——</p><p>他花了整整一章，教<b>强的人</b>要让步。</p><p><b>经文本身明确表达的：</b> 没有一样东西本身不洁净；但若因食物使弟兄忧愁，就不是按爱而行；不可因食物毁掉基督为他死的人。</p><p><b>可以合理推论的：</b> 保罗给的两个理由，一个比一个重——</p><p>理由一：「就不是按着<b>爱人的道理</b>行」（呼应13:8–10）。<br>理由二：「<b>基督已经替他死</b>」。</p><p>弟兄姊妹，第二个理由是全章最重的一句话：</p><p>你为了一口食物，可能伤害的那个人——</p><p>基督<b>为他死过</b>。</p><p>他身上，有基督的血。</p><p><b>⚠ 讲台诚信提醒：</b> 「败坏」（ἀπόλλυμι）是很重的字。<br>不可用它恐吓人（「你会害弟兄下地狱」）；但也不可淡化成「伤他感情」。<br>保罗讲的是<b>实质的属灵伤害</b>（比较林前8:11–12）。而14:4已经给了平衡：「<b>主能使他站住</b>。」</p>"},{"a":16,"z":18,"star":false,"grk":"<p>17 οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ.</p>","lit":"<p>16「所以，<b>不要让你所看为善的，被人毁谤</b>。」<br>17「因为<b>神的国不是吃喝</b>，乃是<b>公义、和平，并圣灵里的喜乐</b>。」<br>18「因为<b>在这几样上服事基督的人</b>，就<b>为神所喜悦</b>，也<b>为人所称许</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>公义</td><td>δικαιοσύνη</td><td>dikaiosynē</td><td>G1343</td><td><b>全卷书的主题字</b></td></tr><tr><td>和平</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td><b>5:1「与神相和」同字</b></td></tr><tr><td>喜乐</td><td>χαρά</td><td>chara</td><td>G5479</td><td>喜乐</td></tr></table>","gram":"<p>★ 亮光一：14:17是全章的神学重心</p><p>「神的国<b>不在乎吃喝</b>，只在乎<b>公义、和平，并圣灵中的喜乐</b>。」</p><p>弟兄姊妹，注意这三样，正好是罗马书前面各章的关键字：</p><table><tr><th>词</th><th>出处</th></tr><tr><td><b>公义</b>（δικαιοσύνη）</td><td><b>1:17、3:21–26——因信称义</b></td></tr><tr><td><b>和平</b>（εἰρήνη）</td><td><b>5:1「与神相和」</b></td></tr><tr><td><b>圣灵中的喜乐</b></td><td><b>5:2、8章、15:13</b></td></tr></table><p>弟兄姊妹，保罗在说：</p><p>你为之争吵的那件事，<b>不在清单上</b>。</p><p>★ 亮光二：这一节同时说了两件事</p><pre>消极面：神的国不在乎吃喝 —— 所以不要为那件事吵\n积极面：只在乎公义、和平、喜乐 —— 而你的争吵，正在破坏【和平】</pre><p>弟兄姊妹，这是很深的一刀：</p><p>你为了一件「不在清单上」的事，<br>破坏了一件「在清单上」的事。</p>","exp":"<p>弟兄姊妹，14:17是全章的<b>神学重心</b>。</p><p>而那三样东西，正好是罗马书前面各章的关键字：</p><table><tr><th>词</th><th>出处</th></tr><tr><td><b>公义</b>（δικαιοσύνη）</td><td><b>1:17、3:21–26——因信称义</b></td></tr><tr><td><b>和平</b>（εἰρήνη）</td><td><b>5:1「与神相和」</b></td></tr><tr><td><b>圣灵中的喜乐</b></td><td><b>5:2、8章、15:13</b></td></tr></table><p><b>经文本身明确表达的：</b> 神的国的实质不在饮食，而在公义、和平与圣灵里的喜乐。</p><p><b>可以合理推论的：</b> 这一节同时说了两件事——</p><p>消极面：你为之争吵的那件事，<b>不在清单上</b>。<br>积极面：而你的争吵，正在破坏清单上的那一项——<b>和平</b>。</p><p>⚠ 一个很实际的检验：</p><p>我最近坚持的这件事，<b>在不在那份清单上</b>？</p><p>【第五段｜14:19–23　建立与拆毁】</p>"},{"a":19,"z":20,"star":true,"grk":"<p>19 ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.<br>20 μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ.</p>","lit":"<p>19「所以，我们要<b>追赶那属于和睦的事</b>，以及那<b>彼此建造</b>的事。」<br>20「<b>不可为了食物，拆毁神的工程</b>。凡物固然都是洁净的，但<b>人若因着食物使人绊倒，那就是他的恶了</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>追求</td><td>διώκωμεν</td><td>diōkōmen</td><td>G1377</td><td>—</td><td><b>追赶</b>（<b>12:13、14同字</b>）</td><td>—</td></tr><tr><td>建立</td><td>οἰκοδομή</td><td>oikodomē</td><td>G3619</td><td>οἶκος（房子）+ δέμω（建造）</td><td><b>造房子</b></td><td>见下</td></tr><tr><td>毁坏</td><td>κατάλυε</td><td>katalye</td><td>G2647</td><td>κατά + λύω（松开）</td><td><b>拆房子</b></td><td>见下</td></tr><tr><td>工程</td><td>ἔργον τοῦ θεοῦ</td><td>—</td><td>G2041</td><td>—</td><td><b>神的工作</b></td><td>—</td></tr></table>","gram":"<p>★★ 亮光一：两个相反的建筑用语</p><pre>14:19  οἰκοδομή —— 【建造】（造房子）\n14:20  κατάλυε  —— 【拆毁】（拆房子）</pre><p>καταλύω 这个字在福音书中，正是用来说圣殿的拆毁：</p><p>太26:61「这个人曾说：『我能<b>拆毁</b>（καταλῦσαι）神的殿。』」<br>可13:2「将来在这里没有一块石头留在石头上，不被<b>拆毁</b>了。」</p><p>弟兄姊妹，保罗用了一个<b>拆圣殿</b>的字。</p><p>而他说：<b>不可因食物毁坏神的工程</b>。</p><p>★ 亮光二：一个残酷的算术</p><pre>神在盖   ——  一栋房子（οἰκοδομή）\n你为了   ——  一口食物（βρῶμα）\n把它     ——  拆了（κατάλυε）</pre><p>弟兄姊妹，这是一个极不成比例的交易。</p><p>★ 亮光三：διώκω ——12:13那个字</p><pre>12:13  「客要一味地【款待】」—— φιλοξενίαν διώκοντες（追赶款待）\n12:14  「【逼迫】（διώκοντας）你们的，要给他们祝福」\n   ↓\n14:19  「务要【追求】（διώκωμεν）和睦的事」</pre><p>和睦不是「碰巧发生」的，是要<b>追赶</b>的。</p>","exp":"<p>弟兄姊妹，19与20节用了<b>两个相反的建筑用语</b>。</p><pre>14:19  οἰκοδομή —— 【建造】（οἶκος 房子 + δέμω 建造）\n14:20  κατάλυε  —— 【拆毁】</pre><p>而 καταλύω 这个字，在福音书中正是用来说<b>拆圣殿</b>的：</p><p>太26:61「这个人曾说：『我能<b>拆毁</b>（καταλῦσαι）神的殿。』」<br>可13:2「没有一块石头留在石头上，不被<b>拆毁</b>了。」</p><p><b>经文本身明确表达的：</b> 要追求和睦与彼此建造；不可因食物拆毁神的工程。</p><p><b>可以合理推论的：</b> 保罗用了一个<b>拆圣殿</b>的字，来形容「因食物毁坏神的工程」。</p><p>而这是一个极不成比例的交易：</p><p>神在盖一栋房子——一砖一瓦，很慢。<br>而你，<b>为了一口食物，拿着铁锤</b>。</p><p><b>⚠ 补充：</b> 「追求」（διώκω）是12:13、12:14那个字——<b>追赶</b>。</p><p>和睦不是「碰巧发生」的，是要<b>追赶</b>的。</p>"},{"a":21,"z":23,"star":false,"grk":"<p>22 σὺ πίστιν [ἣν] ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·<br>23 …πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ἐστίν.</p>","lit":"<p>21「<b>不吃肉、不喝酒、不做任何使你弟兄绊倒的事</b>，这才是好的。」<br>22「<b>你所有的那份信心，就你自己在神面前持守它</b>。<b>那在自己所察验认可的事上不定自己罪的人，是有福的</b>。」<br>23「但那<b>心里分裂</b>却仍然吃的人，<b>就已被定罪</b>——因为他不是<b>出于信心</b>；而<b>凡不出于信心的，都是罪</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>守着</td><td>κατὰ σεαυτὸν ἔχε</td><td>kata seauton eche</td><td>—</td><td><b>就你自己保有它</b>（在神面前）</td></tr><tr><td>自责</td><td>μὴ κρίνων ἑαυτόν</td><td>—</td><td>G2919</td><td><b>不定自己的罪</b>（κρίνω 又出现）</td></tr><tr><td>以为可行</td><td>δοκιμάζει</td><td>dokimazei</td><td>G1381</td><td><b>察验、判定为可</b>（<b>12:2同字</b>）</td></tr><tr><td>疑心</td><td>διακρινόμενος</td><td>diakrinomenos</td><td>G1252</td><td><b>心被撕成两半、犹疑</b>（<b>4:20同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：14:22「就当在神面前守着」</p><p>这一节常被误读成「不要传讲你的信念」。</p><p>原文的意思较接近：</p><p>你所有的那份确信，<b>就你自己在神面前保有它</b>。</p><p>弟兄姊妹，保罗不是叫人隐藏信仰，<br>是说：<b>你的自由，不必拿到弟兄面前去证明</b>。</p><p>★ 亮光二：δοκιμάζω ——12:2那个字</p><pre>12:2   「叫你们【察验】（δοκιμάζειν）何为神的……旨意」\n14:22  「人在自己【以为可行】（δοκιμάζει）的事上能不自责，就有福了」</pre><p>★ 亮光三：διακρίνομαι ——第四章那个字</p><pre>4:20  亚伯拉罕「总没有因不信心里【起疑惑】（διεκρίθη）」\n14:23 「若有【疑心】（διακρινόμενος）而吃的，就必有罪」</pre><p>这个字的字面是「<b>被撕成两半</b>」。</p><p>弟兄姊妹，14:23讲的不是「做错事」，是——</p><p>在心里分裂的状态下去做。</p><p>★ 亮光四：14:23「凡不出于信心的都是罪」</p><p>这句话的<b>上下文限定</b>极其重要（见第二十部分）。</p><p>保罗在讲的是：<b>在可争议的事上，违背自己被说服的良心去做，就是罪</b>。</p><p>他<b>不是</b>在说「凡不是基督徒做的事都是罪」，<br>也<b>不是</b>在说「跟着感觉走就对了」。</p>","exp":"<p>弟兄姊妹，22节常被误读成「不要传讲你的信念」。</p><p>原文的意思较接近：</p><p>你所有的那份确信，<b>就你自己在神面前保有它</b>。</p><p><b>经文本身明确表达的：</b> 不做使弟兄绊倒的事才是好的；有信心的人在神面前持守；而违背自己良心去做的，就是罪。</p><p><b>可以合理推论的：</b> 保罗不是叫人隐藏信仰，<br>是说：<b>你的自由，不必拿到弟兄面前去证明</b>。</p><p>而23节的「疑心」（διακρινόμενος）字面是「<b>被撕成两半</b>」——</p><p>那是4:20形容亚伯拉罕「总没有因不信心里<b>起疑惑</b>」的同一个字。</p><p>所以14:23讲的<b>不是</b>「做错事」，是——</p><p>在<b>心里分裂的状态下</b>去做。</p><p>⚠ 讲台诚信提醒（一个常见的误用）：</p><p>「凡不出于信心的都是罪」<b>不可以</b>被讲成「只要我心里平安，做什么都可以」。</p><p>必须注意上下文的三个限定：</p><p>① 这一节是在讲<b>可争议的事</b>（食物、日子）。<br>② 「信心」在此指的是「<b>对自己在神面前所行之事的确信</b>」（14:22 δοκιμάζει）。<br>③ 与它相对的是 διακρινόμενος——<b>心被撕成两半</b>。</p><p>良心不是最高权威——圣经才是。<br>但一个<b>被圣经教育过的良心</b>，不可违背。</p>"}],"15":[{"a":1,"z":1,"star":true,"grk":"<p>Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν καὶ μὴ ἑαυτοῖς ἀρέσκειν.</p>","lit":"<p>「我们<b>有能力的人</b>，<b>欠着一笔债</b>：要<b>扛起</b>那些<b>没有能力的人</b>的软弱，而<b>不是讨自己的喜悦</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>应该</td><td>Ὀφείλομεν</td><td>opheilomen</td><td>G3784</td><td>ὀφείλω</td><td><b>欠债、有义务</b></td><td><b>13:8同字！</b></td></tr><tr><td>坚固的</td><td>δυνατοί</td><td>dynatoi</td><td>G1415</td><td>δύναμις（能力）</td><td><b>有能力的</b></td><td>—</td></tr><tr><td>不坚固的</td><td>ἀδυνάτων</td><td>adynatōn</td><td>G102</td><td>ἀ + δύναμις</td><td><b>没有能力的</b></td><td><b>8:3同字</b>（律法「不能行的」）</td></tr><tr><td>担代</td><td>βαστάζειν</td><td>bastazein</td><td>G941</td><td>βαστάζω</td><td><b>扛起重量、承载</b></td><td><b>11:18同字！</b></td></tr><tr><td>喜悦</td><td>ἀρέσκειν</td><td>areskein</td><td>G700</td><td>ἀρέσκω</td><td><b>讨……的喜欢</b></td><td>见下</td></tr></table>","gram":"<p>★★ 亮光一：βαστάζω ——第十一章那个字</p><p>弟兄姊妹，这是本章最重要的一个字词连结。</p><pre>11:18  「你就不可向旧枝子夸口；若是夸口，当知道\n        【不是你托着（βαστάζεις）根，乃是根托着你】。」\n   ↓\n15:1   「我们坚固的人应该【担代】（βαστάζειν）不坚固人的软弱。」</pre><p>同一个动词：<b>扛起重量</b>。</p><p>弟兄姊妹，你看见那个顺序了吗？</p><p>第十一章：<b>你不是扛的那一个，你是被扛的</b>。</p><p>第十五章：<b>所以现在，换你去扛别人</b>。</p><p>（同字也用于太8:17「代替我们的软弱，<b>担当</b>我们的疾病」；加6:2「各人的重担要互相<b>担当</b>」。）</p><p>★ 亮光二：ὀφείλω ——这是一笔「债」</p><p>「<b>应该</b>」——原文不是「最好要」，是「<b>欠着</b>」。</p><p>而这个字我们在13:8见过：</p><pre>13:8   「凡事都不可【亏欠】（ὀφείλετε）人，惟有彼此相爱要常以为亏欠」\n15:1   「我们坚固的人【应该】（Ὀφείλομεν）担代……」</pre><p>弟兄姊妹，保罗在说：</p><p>强的人扛弱的人，<b>不是一种美德，是一笔债</b>。</p><p>★ 亮光三：δυνατοί ／ ἀδύνατοι 的对称</p><pre>δυνατοί  —— 【有】能力的\nἀδύνατοι —— 【没有】能力的</pre><p>而 ἀδύνατος 这个字，我们在8:3见过：</p><p>8:3「律法既因肉体软弱，有所<b>不能行的</b>（τὸ ἀδύνατον）……」</p><p>弟兄姊妹，这是一个很谦卑的提醒：</p><p>「不能」这件事，我们自己也曾经是（第七、八章）。</p><p>★ 亮光四：「不求自己的喜悦」</p><p>ἀρέσκω ＝ <b>讨某人的喜欢、使某人满意</b>。</p><p>保罗在别处用同一个字：</p><p>加1:10「我现在是要得人的心呢？还是要得神的心呢？我岂是<b>讨人的喜欢</b>吗？」</p><p>弟兄姊妹，注意这里有一个张力：</p><p>加1:10说<b>不要讨人的喜欢</b>；<br>罗15:2说<b>要叫邻舍喜悦</b>。</p><p>差别在哪里？——<b>下一节就说了</b>。</p>","exp":"<p>弟兄姊妹，15:1的第一个字（Ὀφείλομεν）不是「最好要」，是「<b>欠着</b>」。</p><p>而那个字，我们在13:8见过：「凡事都不可<b>亏欠</b>人。」</p><p><b>经文本身明确表达的：</b> 有能力的人<b>欠着一笔债</b>：要扛起没有能力之人的软弱，而不是讨自己的喜悦。</p><p><b>可以合理推论的：</b> 「担代」（βαστάζω）正是11:18那个字——</p><p>11:18「不是你<b>托着</b>根，乃是根<b>托着</b>你。」<br>15:1「坚固的人应该<b>担代</b>不坚固人的软弱。」</p><p>你曾经是<b>被扛的</b>；所以现在，<b>换你去扛</b>。</p><p>而保罗<b>没有</b>说「你们坚固的人要变软弱一点」——</p><p>他说：你<b>是</b>坚固的——<b>所以你去扛</b>。</p><p>谦卑不是放弃力量，是<b>改变力量的方向</b>。</p><p>⚠⚠ 讲台诚信提醒（本章最容易失守的一点）：</p><p>「坚固／不坚固」极易被拿来贴标签（「我是坚固的，所以你要听我的」）。</p><p>必须同时讲明三件事：</p><p>① 这一节的主词是「我们<b>坚固的人</b>」，而动词是「<b>应该担代</b>」——<b>这是责任，不是特权</b>。</p><p>② 「不坚固」（ἀδύνατος）正是8:3「律法所<b>不能行</b>的」（τὸ ἀδύνατον）同一个字根。</p><p>③ 而第七章那个「立志为善由得我，行出来由不得我」的人——<b>是保罗自己</b>。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν.</p>","lit":"<p>「我们各人<b>要叫邻舍喜悦</b>——<b>为了他的益处</b>，<b>为了建造</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>邻舍</td><td>πλησίον</td><td>plēsion</td><td>G4139</td><td><b>邻近的人</b>（<b>13:9「爱人如己」同字</b>）</td></tr><tr><td>建立德行</td><td>οἰκοδομή</td><td>oikodomē</td><td>G3619</td><td><b>造房子</b>（<b>14:19同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：两个限定词解开了与加1:10的张力</p><p>保罗说「叫邻舍喜悦」，但立刻加了<b>两个限定</b>：</p><pre>εἰς τὸ ἀγαθόν  —— 【为了他的益处】\nπρὸς οἰκοδομήν —— 【为了建立】</pre><p>弟兄姊妹，差别就在这里：</p><p>加1:10的「讨人喜欢」，是<b>为了我自己</b>（怕被讨厌、想被接纳）。<br>罗15:2的「叫邻舍喜悦」，是<b>为了他的益处与建立</b>。</p><p>同一个动作，两种动机。</p><p>★ 亮光二：οἰκοδομή ——14:19那个字</p><pre>14:19  「务要追求和睦的事与彼此【建立】（οἰκοδομῆς）德行的事」\n14:20  「不可因食物【毁坏】（κατάλυε）神的工程」—— 拆房子\n   ↓\n15:2   「使他得益处，【建立德行】（οἰκοδομήν）」</pre><p>神在盖房子（14:19–20）——而15:2说：<b>你去帮忙盖</b>。</p>","exp":"<p>弟兄姊妹，15:2解开了一个看似矛盾的地方。</p><p>因为加1:10说：「我岂是<b>讨人的喜欢</b>吗？若仍旧讨人的喜欢，我就不是基督的仆人了。」</p><p>而两节用的是<b>同一个动词</b>（ἀρέσκω）。</p><p>解开的关键，在15:2的<b>两个限定</b>：</p><pre>εἰς τὸ ἀγαθόν  —— 为了【他的】益处\nπρὸς οἰκοδομήν —— 为了【建立】</pre><p><b>经文本身明确表达的：</b> 要叫邻舍喜悦，但目的必须是他的益处与建造。</p><p><b>可以合理推论的：</b> 同一个动作，<b>两种动机</b>——</p><p>加1:10的「讨人喜欢」，是<b>为了我自己</b>（怕被讨厌、想被接纳、想保住地位）。<br>罗15:2的「叫邻舍喜悦」，是<b>为了他的益处与建立</b>。</p><p>⚠ 一个很实际的检验：</p><p>这件事，如果<b>没有人知道是我做的</b>——我还会做吗？</p>"},{"a":3,"z":3,"star":true,"grk":"<p>καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν, ἀλλὰ καθὼς γέγραπται· οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ' ἐμέ.</p>","lit":"<p>「因为连基督也<b>不讨自己的喜悦</b>；乃如经上所记：『那些辱骂你之人的<b>辱骂</b>，都<b>落在我身上</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>辱骂</td><td>ὀνειδισμοί</td><td>oneidismoi</td><td>G3680</td><td><b>公开的羞辱、责骂</b></td></tr><tr><td>落在</td><td>ἐπέπεσαν</td><td>epepesan</td><td>G1968</td><td>ἐπί + πίπτω：<b>掉落在……身上</b></td></tr></table>","gram":"<p>★ 亮光一：这是全章最短、也最重的一句理由</p><p>保罗讲了两节的命令（15:1–2），然后给理由。</p><p>而那个理由只有八个字：</p><p>「<b>因为基督也不求自己的喜悦</b>。」</p><p>弟兄姊妹，保罗<b>没有</b>说：「因为这样教会才会和谐。」<br>他也<b>没有</b>说：「因为你是成熟的。」</p><p>他说：<b>因为祂没有</b>。</p><p>★ 亮光二：引诗篇69:9下半</p><p>「辱骂你人的辱骂都落在我身上。」</p><p>注意这一节的<b>方向</b>：</p><pre>那些人辱骂的对象是 ——【神】（「辱骂【你】人的」）\n而那些辱骂最后落在 ——【基督】身上</pre><p>弟兄姊妹，这句话的意思是：</p><p>人本来是在骂<b>神</b>。</p><p>而那些骂——<b>掉在祂身上了</b>。</p><p>★ 亮光三：诗篇69篇在新约的位置</p><table><tr><th>出处</th><th>引用</th></tr><tr><td><b>约2:17</b></td><td>诗69:9<b>上半</b>「我为你的殿心里焦急」</td></tr><tr><td><b>罗15:3</b></td><td><b>诗69:9下半「辱骂你人的辱骂都落在我身上」</b></td></tr><tr><td>约15:25</td><td>诗69:4「他们无故地恨我」</td></tr><tr><td>太27:34、48</td><td>诗69:21（苦胆与醋）</td></tr></table><p>初代教会显然把诗篇69篇整篇，当作<b>受苦的弥赛亚</b>的诗来读。</p>","exp":"<p><b>经文本身明确表达的：</b> 基督不讨自己的喜悦，而是承受了本该落在神身上的辱骂。<br><b>合理推论的生命应用：</b> 一个人若不知道「祂为我承受了什么」，就很难为弟兄放下一件小事。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ὅσα γὰρ προεγράφη, εἰς τὴν ἡμετέραν διδασκαλίαν ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.</p>","lit":"<p>「因为<b>从前所写的一切</b>，都是<b>为教训我们</b>而写的；好叫我们<b>借着圣经所生的忍耐与安慰</b>，<b>持续握有盼望</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>从前所写的</td><td>προεγράφη</td><td>proegraphē</td><td>G4270</td><td><b>预先写下的</b></td></tr><tr><td>教训</td><td>διδασκαλία</td><td>didaskalia</td><td>G1319</td><td><b>教导</b></td></tr><tr><td>忍耐</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td><b>在重压下站住</b>（<b>5:3–4同字</b>）</td></tr><tr><td>安慰</td><td>παράκλησις</td><td>paraklēsis</td><td>G3874</td><td>παρά + καλέω：<b>被叫到旁边来</b>（见下）</td></tr></table>","gram":"<p>★ 亮光一：保罗为什么在这里插一句「圣经论」？</p><p>弟兄姊妹，15:4看起来像是离题。</p><p>但它其实是紧接着15:3的：</p><pre>15:3  保罗引了一段【诗篇】来证明基督不求自己的喜悦\n   ↓\n15:4  「从前所写的圣经，都是为【教训我们】写的」</pre><p>保罗在说：</p><p>我刚才引的那节旧约——</p><p>那不是古人的事，那是<b>写给我们的</b>。</p><p>★ 亮光二：παράκλησις ——「被叫到旁边来」</p><p>这个字由 παρά（旁边）+ καλέω（叫）组成。</p><p>字面是：<b>把某人叫到身边来（陪伴、鼓励、扶持）</b>。</p><p>（而圣灵的称呼 παράκλητος「保惠师」——约14:16——正是同一个字根。）</p><p>弟兄姊妹，「安慰」不是说几句好听的话。</p><p>是<b>走到你旁边来</b>。</p><p>★ 亮光三：ὑπομονή ——第五章那个字</p><pre>5:3–4  「患难生【忍耐】（ὑπομονή），忍耐生老练，老练生盼望（ἐλπίς）」\n   ↓\n15:4   「因圣经所生的【忍耐】和安慰，可以得着【盼望】（ἐλπίδα）」</pre><p>弟兄姊妹，这两节的终点是同一个：<b>盼望</b>。</p><p>第五章：<b>患难</b>生出盼望。<br>第十五章：<b>圣经</b>生出盼望。</p><p>★ 亮光四：一个很实际的观察</p><p>弟兄姊妹，15:4放在14–15章的脉络里，有一层很实际的意思：</p><p>一群人在为「食物与日子」争执——</p><p>而保罗说：<b>去读圣经</b>。</p><p>不是为了找到「谁对」的证据，<br>是为了得着<b>忍耐</b>与<b>安慰</b>，好叫你们<b>有盼望</b>。</p>","exp":"<p>弟兄姊妹，15:4看起来像离题——其实它紧接着15:3。</p><p>保罗刚引了一段诗篇（诗69:9）来证明基督不求自己的喜悦，然后说：</p><p>那不是古人的事。<b>那是写给我们的</b>。</p><p><b>经文本身明确表达的：</b> 旧约圣经是为教训我们而写的；它生出忍耐与安慰，使我们得着盼望。</p><p><b>可以合理推论的：</b> 这一节给了「圣经是我的准则」一个<b>完整的流程</b>：</p><pre>圣经 → 忍耐 ＋ 安慰 → 盼望</pre><p>读经的终点<b>不是资料</b>，是<b>盼望</b>。</p><p>而「安慰」（παράκλησις）的字面是 παρά（旁边）＋ καλέω（叫）——</p><p>「<b>被叫到旁边来</b>」。</p><p>（而圣灵的称呼 παράκλητος「保惠师」，约14:16，正是同一个字根。）</p><p>⚠ 而放在14–15章的脉络里，这一节有一层很实际的意思：</p><p>一群人正在为「食物与日子」争执——</p><p>而保罗说：<b>去读圣经</b>。</p><p>不是为了找到「谁对」的证据，是为了得着忍耐与安慰，好叫你们有盼望。</p>"},{"a":5,"z":6,"star":true,"grk":"<p>5 ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ Χριστὸν Ἰησοῦν,<br>6 ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.</p>","lit":"<p>5「愿那<b>忍耐与安慰的神</b>，<b>赐给</b>你们彼此<b>想同一件事</b>，照着基督耶稣；」<br>6「好叫你们<b>同一个心思</b>、<b>用一张嘴</b>，荣耀神——我们主耶稣基督的父。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>赐</td><td>δῴη</td><td>dōē</td><td>G1325</td><td>δίδωμι</td><td><b>祈愿语气：愿祂赐下</b></td><td><b>见下——极重要</b></td></tr><tr><td>同心</td><td>τὸ αὐτὸ φρονεῖν</td><td>—</td><td>G5426</td><td>φρονέω</td><td><b>想同一件事</b></td><td><b>12:16同词组</b></td></tr><tr><td>一心</td><td>ὁμοθυμαδόν</td><td>homothymadon</td><td>G3661</td><td>ὁμός（同）+ θυμός（<b>情绪、冲动</b>）</td><td><b>同一股心志</b></td><td>—</td></tr><tr><td>一口</td><td>ἐν ἑνὶ στόματι</td><td>—</td><td>G4750</td><td>—</td><td><b>用一张嘴</b></td><td>—</td></tr></table>","gram":"<p>★★ 亮光一：δῴη 是<b>祈愿语气</b>——合一是<b>求来的</b></p><p>弟兄姊妹，这是本段最重要的文法观察。</p><p>15:5的动词 δῴη 是<b>祈愿语气（optative）</b>——</p><p>意思是：「<b>愿祂赐给</b>」。</p><p>保罗<b>没有</b>说：「你们要努力同心。」</p><p>他说：</p><p>「<b>愿赐忍耐安慰的神，叫你们彼此同心</b>。」</p><p>弟兄姊妹，这一点极其重要：</p><p>合一<b>不是一个技巧</b>，是一个<b>恩赐</b>。</p><p>保罗讲了一整章的「不可论断、不可轻看」（14章），<br>然后在这里——<b>他祷告</b>。</p><p>★ 亮光二：τὸ αὐτὸ φρονεῖν ——「想同一件事」</p><p>这个词组保罗在12:16已经用过：</p><p>12:16「要<b>彼此同心</b>（τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες）。」</p><p>而 φρονέω 这个字，我们在罗马书追踪过：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td>8:5</td><td><b>体贴</b>肉体／<b>体贴</b>圣灵</td></tr><tr><td>12:3</td><td>不要<b>看</b>自己过于所当<b>看</b>的</td></tr><tr><td>12:16</td><td>不要<b>志气高大</b></td></tr><tr><td><b>15:5</b></td><td><b>彼此同心</b></td></tr></table><p>弟兄姊妹，φρονέω 不是「意见一致」，是「<b>心之所向相同</b>」。</p><p>★ 亮光三：一个重要的限定——「效法基督耶稣」</p><p>15:5的原文是 κατὰ Χριστὸν Ἰησοῦν ——「<b>照着基督耶稣</b>」。</p><p>弟兄姊妹，这个限定很重要：</p><p>保罗求的<b>不是「什么都一样」的合一</b>，<br>是「<b>照着基督</b>」的合一。</p><p>★ 亮光四：ὁμοθυμαδόν ——「同一股心志」</p><p>这个字由 ὁμός（同）+ θυμός（<b>情绪、冲动、心志</b>）组成。</p><p>它在使徒行传出现了<b>十次以上</b>，几乎是初代教会的招牌词：</p><p>徒1:14「这些人<b>同心合意</b>地恒切祷告」<br>徒2:46「他们天天<b>同心合意</b>恒切地在殿里」<br>徒4:24「他们听见了，就<b>同心合意</b>地高声向神说」</p><p>★ 亮光五：「一张嘴」的画面</p><p>ἐν ἑνὶ στόματι ——字面是「<b>在一张嘴里</b>」。</p><p>弟兄姊妹，这是一个<b>敬拜</b>的画面：</p><p>一群人——犹太人与外邦人，强的与弱的——</p><p>发出<b>同一个声音</b>。</p>","exp":"<p>弟兄姊妹，15:5–6是14章一整章教导的<b>目的</b>。</p><p>保罗为什么要他们接纳？</p><p>不是为了「教会比较和平」。</p><p>是为了：</p><p>「一心一口<b>荣耀神</b>。」</p><p>合一的目的不是合一本身，是<b>敬拜</b>。</p><p>【第二段｜15:7–13　接纳】</p>"},{"a":7,"z":7,"star":true,"grk":"<p>Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ὑμᾶς εἰς δόξαν τοῦ θεοῦ.</p>","lit":"<p>「所以，你们要<b>彼此接到自己这里来</b>，<b>正如基督也把你们接到祂那里</b>——为使神得荣耀。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>接纳</td><td>προσλαμβάνεσθε</td><td>proslambanesthe</td><td>G4355</td><td><b>接到自己这里来</b>（<b>14:1、14:3同字</b>）</td></tr><tr><td>如同</td><td>καθώς</td><td>kathōs</td><td>G2531</td><td><b>正如、照着……的样子</b></td></tr><tr><td>使荣耀归与神</td><td>εἰς δόξαν τοῦ θεοῦ</td><td>—</td><td>G1391</td><td><b>为使神得荣耀</b></td></tr></table>","gram":"<p>★ 亮光一：προσλαμβάνω 把整段串起来</p><pre>14:1  你们要【接纳】（προσλαμβάνεσθε）信心软弱的\n14:3  因为神已经【收纳】（προσελάβετο）他了\n   ↓\n15:7  你们要彼此【接纳】（προσλαμβάνεσθε），\n      如同基督【接纳】（προσελάβετο）你们一样</pre><p>弟兄姊妹，同一个字，四次。</p><p>而15:7是那个高潮：<b>它同时是命令，也是根据</b>。</p><p>★★ 亮光二：那个「如同」（καθώς）</p><p>弟兄姊妹，这是全段的心脏。</p><p>保罗<b>没有</b>说：「你们要尽量接纳。」</p><p>他说：</p><p>「<b>如同基督接纳你们一样</b>。」</p><p>而这个「如同」，逼出一个问题：</p><p>基督接纳你的那一天——</p><p>你是全对的吗？</p><p>你的神学都正确吗？<br>你的良心都清洁吗？<br>你在每一件事上的看法，都成熟吗？</p><p>弟兄姊妹，如果不是——</p><p>那你就知道「如同」的标准有多宽了。</p><p>★ 亮光三：目的是「使荣耀归与神」</p><p>εἰς δόξαν τοῦ θεοῦ ——</p><p>弟兄姊妹，注意这个因果：</p><p>彼此接纳 → 神得荣耀。</p><p>反过来说也成立：</p><p>当教会为了可争议的事分裂——<br>失去的不只是和睦，是<b>神的荣耀</b>。</p>","exp":"<p>弟兄姊妹，15:7是14:1–15:13这一整段的<b>高潮</b>。</p><p>而 προσλαμβάνω（接纳）这个字，在这一段出现了四次：</p><pre>14:1  你们要【接纳】信心软弱的\n14:3  因为神已经【收纳】他了\n   ↓\n15:7  你们要彼此【接纳】，如同基督【接纳】你们一样</pre><p><b>经文本身明确表达的：</b> 要彼此接纳，其标准与根据是「基督接纳了你们」；而其目的是使神得荣耀。</p><p><b>可以合理推论的：</b> 全句最重的不是那个动词，是中间那两个字——</p><p>「<b>如同</b>」（καθώς）。</p><p>而这个「如同」逼出一个问题：</p><p>基督接纳你的那一天——</p><p>你是全对的吗？你的神学都正确吗？你的良心都清洁吗？</p><p>如果不是——<b>那你就知道「如同」的标准有多宽了</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 15:7的范围是<b>可争议的事</b>，不是所有的事。<br>保罗自己在16:17就给了界线：「那些<b>离间</b>你们、<b>背乎所学之道</b>的人……要留意躲避他们。」<br>（三种处理方式的完整说明，见第二十部分。）</p>"},{"a":8,"z":9,"star":true,"grk":"<p>8 λέγω γὰρ Χριστὸν διάκονον γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,</p>","lit":"<p>8「因为我说：基督<b>为着神的真实</b>，作了<b>受割礼之人的仆役</b>，为要<b>证实</b>（使之生效）<b>神给列祖的那些应许</b>；」<br>9上「并且<b>叫外邦人因祂的怜悯荣耀神</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>执事</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td><b>仆人、执事</b>（13:4、16:1同字）</td></tr><tr><td>证实</td><td>βεβαιῶσαι</td><td>bebaiōsai</td><td>G950</td><td><b>使之稳固、确立</b>（<b>4:16 βέβαιος 同字根</b>）</td></tr><tr><td>怜悯</td><td>ἔλεος</td><td>eleos</td><td>G1656</td><td><b>怜悯</b>（<b>11:30–32 ἐλεέω 同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：两群人，两个不同的理由</p><p>弟兄姊妹，注意保罗为两群人给的理由<b>不一样</b>：</p><table><tr><th>对象</th><th>理由</th></tr><tr><td><b>犹太人</b></td><td>「为神的<b>真理</b>」——要<b>证实所应许列祖的话</b></td></tr><tr><td><b>外邦人</b></td><td>「因他的<b>怜悯</b>」</td></tr></table><p>弟兄姊妹，这个区分极其精细：</p><p>犹太人蒙恩，是因为神<b>守约</b>（祂应许过列祖）。<br>外邦人蒙恩，是因为神<b>怜悯</b>（祂没有应许过我们什么）。</p><p>而这两个，刚好对应罗马教会两边的骄傲：</p><pre>犹太人可能想：我们是有应许的\n   → 保罗说：对，而基督来正是为了【证实】那些应许\n外邦人可能想：神已经把他们挪开了\n   → 保罗说：你们在这里，纯粹是【怜悯】</pre><p>★ 亮光二：βεβαιόω ——第四章那个字根</p><pre>4:16  「叫应许【定然】（βέβαιος）归给一切后裔」\n15:8  「要【证实】（βεβαιῶσαι）所应许列祖的话」</pre><p>而 βέβαιος 是一个<b>法律用语</b>：<b>具有法律效力的担保</b>。</p><p>基督来，是为了让神给列祖的应许<b>在法律上生效</b>。</p><p>★ 亮光三：「受割礼人的执事」</p><p>弟兄姊妹，这句话很重要：</p><p>保罗在对外邦信徒说话（11:13、15:15–16），<br>而他提醒他们：<b>基督是作了犹太人的执事</b>。</p><p>（这与11:18「不是你托着根，乃是根托着你」完全一致。）</p>","exp":"<p>弟兄姊妹，8–9节做了一件很精细的事：保罗为两群人，给了<b>两个不同的理由</b>。</p><table><tr><th>对象</th><th>理由</th></tr><tr><td><b>犹太人</b></td><td>为神的<b>真理</b>——要<b>证实所应许列祖的话</b>（神<b>守约</b>）</td></tr><tr><td><b>外邦人</b></td><td>因祂的<b>怜悯</b>（神<b>没有应许过我们什么</b>）</td></tr></table><p><b>经文本身明确表达的：</b> 基督作了受割礼之人的执事，为要证实给列祖的应许；同时使外邦人因神的怜悯荣耀神。</p><p><b>可以合理推论的：</b> 这不是在分高低，是在对付<b>两边各自的骄傲</b>——</p><p>对犹太信徒：对，应许是给你们列祖的——<b>而基督来，正是为了证实它</b>。<br>对外邦信徒：你们在这里，<b>纯粹是怜悯</b>。</p><p>而「证实」（βεβαιόω）是一个<b>法律用语</b>：<b>使之具有效力的担保</b>。</p><p>它的形容词形 βέβαιος，正是4:16「叫应许<b>定然</b>归给一切后裔」那个字。</p><p>基督来，是为了让神给列祖的应许——<b>在法律上生效</b>。</p>"},{"a":9,"z":12,"star":true,"grk":"<p>9下 …διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσιν καὶ τῷ ὀνόματί σου ψαλῶ.<br>10 …εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.<br>11 …αἰνεῖτε, πάντα τὰ ἔθνη, τὸν κύριον καὶ ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.<br>12 …ἔσται ἡ ῥίζα τοῦ Ἰεσσαὶ καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν, ἐπ' αὐτῷ ἔθνη ἐλπιοῦσιν.</p>","lit":"<p>9下「正如经上所记：『因此我要<b>在外邦中称谢你</b>，<b>歌颂你的名</b>。』」<br>10「又说：『<b>外邦啊，你们要与祂的百姓一同欢乐</b>。』」<br>11「又说：『<b>万国啊，你们都当赞美主</b>；<b>万民哪，都当称颂祂</b>。』」<br>12「以赛亚又说：『将有<b>耶西的根</b>，就是那<b>兴起来要治理外邦的</b>；<b>外邦人要仰望祂</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>称赞</td><td>ἐξομολογήσομαι</td><td>exomologēsomai</td><td>G1843</td><td><b>公开承认、称谢</b></td></tr><tr><td>欢乐</td><td>εὐφράνθητε</td><td>euphranthēte</td><td>G2165</td><td>欢欣（命令语气）</td></tr><tr><td>耶西的根</td><td>ἡ ῥίζα τοῦ Ἰεσσαί</td><td>—</td><td>G4491</td><td><b>大卫父亲的名</b>——即大卫的后裔</td></tr><tr><td>仰望</td><td>ἐλπιοῦσιν</td><td>elpiousin</td><td>G1679</td><td><b>把盼望放在祂身上</b></td></tr></table>","gram":"<p>★ 亮光一：四段引文的分布</p><table><tr><th>出处</th><th>引自</th><th>旧约分类</th><th>关键词</th></tr><tr><td><b>15:9</b></td><td><b>诗18:49</b></td><td>诗篇／历史</td><td>「在<b>外邦中</b>称赞你」</td></tr><tr><td><b>15:10</b></td><td><b>申32:43</b></td><td><b>律法书</b></td><td>「外邦人<b>与主的百姓一同</b>欢乐」</td></tr><tr><td><b>15:11</b></td><td><b>诗117:1</b></td><td>诗篇</td><td>「<b>外邦啊</b>，你们当赞美主」</td></tr><tr><td><b>15:12</b></td><td><b>赛11:10</b></td><td><b>先知书</b></td><td>「<b>外邦人</b>要仰望他」</td></tr></table><p>弟兄姊妹，保罗从<b>律法书、先知书、诗篇</b>——<br>犹太人所说的整本圣经的三大部分——各取证据。</p><p>他要证明的是：<b>外邦人蒙恩，不是新闻，是旧约从头到尾的计划</b>。</p><p>★ 亮光二：四段引文的递进</p><pre>15:9  「在外邦【中】」  —— 我在他们中间称赞神\n15:10 「【与】主的百姓【一同】」 —— 两群人在一起\n15:11 「外邦啊，【你们】当赞美主」 —— 外邦人自己开口\n15:12 「外邦人要【仰望他】」 —— 他们的盼望在祂身上</pre><p>弟兄姊妹，这是一个<b>逐步靠近</b>的过程：</p><p>从「在他们中间」→「与他们一同」→「他们自己赞美」→「他们仰望祂」。</p><p>★ 亮光三：15:12「耶西的根」</p><p>引自赛11:10。</p><p>「耶西」是大卫的父亲。</p><p>所以「耶西的根」＝ <b>大卫的后裔</b>（比较启22:16「我是大卫的根，又是他的后裔」）。</p><p>而这正好呼应罗马书的开头：</p><pre>1:3   「论到他儿子——我主耶稣基督。按肉体说，是从【大卫后裔】生的」\n15:12 「将来有【耶西的根】……外邦人要仰望他」</pre>","exp":"<p>弟兄姊妹，保罗为了证明「外邦人蒙恩不是新闻」，一口气引了<b>四段旧约</b>。</p><p>而这四段的<b>分布</b>极其讲究：</p><table><tr><th>出处</th><th>引自</th><th>旧约的分类</th></tr><tr><td>15:9</td><td><b>诗18:49</b></td><td>诗篇／历史书</td></tr><tr><td>15:10</td><td><b>申32:43</b></td><td><b>律法书</b></td></tr><tr><td>15:11</td><td><b>诗117:1</b></td><td>诗篇</td></tr><tr><td>15:12</td><td><b>赛11:10</b></td><td><b>先知书</b></td></tr></table><p><b>经文本身明确表达的：</b> 外邦人与神的百姓一同赞美神，是旧约律法、先知、诗篇一致的见证。</p><p><b>可以合理推论的：</b> 保罗是从<b>犹太人所说的整本圣经的三大部分</b>，各取证据。<br>（比较路24:44：「摩西的律法、先知的书，和诗篇上所记的」）</p><p>他要证明的是：<b>外邦人蒙恩，不是新闻，是旧约从头到尾的计划</b>。</p><p>而这四段引文还有一个很美的<b>递进</b>：</p><pre>15:9  「在外邦【中】」        —— 我在他们中间称赞神\n15:10 「【与】主的百姓【一同】」 —— 两群人在一起了\n15:11 「外邦啊，【你们】当赞美主」—— 他们自己开口了\n15:12 「外邦人要【仰望他】」    —— 他们的盼望在祂身上</pre>"},{"a":13,"z":13,"star":true,"grk":"<p>ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.</p>","lit":"<p>「愿那<b>盼望的神</b>，在你们相信的时候，<b>用一切的喜乐与平安充满</b>你们，使你们<b>在盼望上满溢出来</b>，借着<b>圣灵的能力</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>充满</td><td>πληρώσαι</td><td>plērōsai</td><td>G4137</td><td><b>祈愿语气：愿祂充满</b></td></tr><tr><td>大有盼望</td><td>περισσεύειν</td><td>perisseuein</td><td>G4052</td><td><b>满溢出来</b>（<b>5:15同字根</b>）</td></tr><tr><td>能力</td><td>δύναμις</td><td>dynamis</td><td>G1411</td><td><b>能力</b>（<b>1:16「神的大能」同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：又是祈愿语气</p><p>与15:5一样，πληρώσαι 是<b>祈愿语气</b>——「<b>愿祂充满</b>」。</p><p>喜乐、平安、盼望——<b>都不是我努力挤出来的</b>。</p><p>★ 亮光二：14:17的完整版</p><pre>14:17  「神的国……只在乎【公义】、【和平】，并【圣灵中的喜乐】」\n   ↓\n15:13  「将诸般的【喜乐】、【平安】充满你们的心，\n        使你们借着【圣灵的能力】大有【盼望】」</pre><p>弟兄姊妹，14:17列出了神的国在乎什么；<br>15:13就求神把那些<b>充满他们</b>。</p><p>★ 亮光三：περισσεύω ——「满溢出来」</p><p>这个字我们在5:15见过（「更加倍地临到众人」）。</p><p>画面是：<b>倒到满出来</b>。</p><p>保罗求的不是「有一点盼望」，是<b>盼望满到溢出来</b>。</p><p>★ 亮光四：三个「神」的第二个</p><pre>15:5   赐【忍耐安慰】的神\n15:13  使人有【盼望】的神   ← 本节\n15:33  赐【平安】的神</pre>","exp":"<p>弟兄姊妹，15:13是整个实践部分（12–15章）的<b>收尾祝福</b>。</p><p>而它的内容很值得注意：</p><p>保罗<b>没有</b>求「愿你们都意见一致」。</p><p>他求的是：<b>喜乐、平安、盼望</b>。</p><p>因为一群有喜乐、有平安、有盼望的人——</p><p>比较不会为了食物吵架。</p><p>【第三段｜15:14–21　献上】</p>"},{"a":14,"z":16,"star":true,"grk":"<p>16 εἰς τὸ εἶναί με λειτουργὸν Χριστοῦ Ἰησοῦ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.</p>","lit":"<p>14「弟兄们，<b>我自己也深信</b>你们：你们<b>满有良善</b>，<b>充满了各样的知识</b>，<b>也能彼此劝戒</b>。」<br>15「但我<b>稍微放胆</b>写信给你们，是要<b>再一次提醒你们</b>，这是因着神所赐给我的恩——」<br>16「使我作<b>基督耶稣向外邦人的供职者</b>，<b>执行神福音的祭司职务</b>，好使<b>外邦人这供物成为蒙悦纳的</b>，<b>在圣灵里被分别为圣</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>劝戒</td><td>νουθετεῖν</td><td>nouthetein</td><td>G3560</td><td>νοῦς + τίθημι：<b>把东西放进心思里</b></td></tr><tr><td>仆役</td><td>λειτουργός</td><td>leitourgos</td><td>G3011</td><td><b>祭司性的供职者</b>（13:6同字）</td></tr><tr><td>作祭司</td><td>ἱερουργοῦντα</td><td>hierourgounta</td><td>G2418</td><td><b>执行祭司的职务</b>（<b>新约仅此一次</b>）</td></tr><tr><td>所献上的</td><td>προσφορά</td><td>prosphora</td><td>G4376</td><td><b>供物、祭物</b></td></tr><tr><td>成为圣洁</td><td>ἡγιασμένη</td><td>hēgiasmenē</td><td>G37</td><td><b>被分别为圣</b>（完成被动分词）</td></tr></table>","gram":"<p>★ 亮光一：15:14的谦和</p><p>保罗写了十五章最严密的论证。</p><p>然后他说：</p><p>「我自己也<b>深信</b>你们是满有良善……<b>也能彼此劝戒</b>。」</p><p>他没有说「你们什么都不懂」。<br>他说：<b>你们本来就懂，我只是提醒你们的记性</b>（15:15）。</p><p>★★ 亮光二：15:16三个圣殿用语叠在一节里</p><pre>λειτουργός  —— 祭司性的供职者\nἱερουργέω   —— 执行祭司的职务（新约仅此一次）\nπροσφορά    —— 供物</pre><p>弟兄姊妹，保罗把「传福音」看作一场<b>献祭</b>。</p><p>他自己是<b>祭司</b>；而祭坛上的供物是——<b>那些归主的人</b>。</p><p>★ 亮光三：与12:1的呼应</p><pre>12:1   「将【身体】献上（παραστῆσαι），当作【活祭】」—— 信徒献上自己\n15:16  「叫【所献上的】（προσφορά）外邦人……可蒙悦纳」—— 保罗献上他们</pre><p>★ 亮光四：供物凭什么被收下？</p><p>「因着<b>圣灵</b>成为圣洁」——<b>完成被动分词</b>。</p><p>不是因为它本身好，是因为<b>圣灵已经把它分别为圣了</b>。</p>","exp":"<p>弟兄姊妹，14节显出保罗的谦和。</p><p>他写了十五章最严密的神学论证，然后说：</p><p>「我自己也<b>深信</b>你们是满有良善……<b>也能彼此劝戒</b>。」</p><p>他没有说「你们什么都不懂，所以我来教你们」——他说：<b>你们本来就懂，我只是提醒你们的记性</b>。</p><p><b>经文本身明确表达的：</b> 保罗承认罗马信徒本有良善与知识；他写信是出于神所赐的恩，使他作外邦人的祭司性供职者。</p><p><b>可以合理推论的：</b> 15:16在<b>一节之内</b>用了三个<b>圣殿用语</b>——</p><p>λειτουργός（祭司性的供职者）＋ ἱερουργέω（执行祭司职务，<b>新约仅此一次</b>）＋ προσφορά（供物）。</p><p>保罗把「传福音」看作一场<b>献祭</b>：他自己是<b>祭司</b>，而祭坛上的供物，是<b>那些归主的人</b>。</p><p>而这与12:1完全呼应：</p><pre>12:1   将【身体】献上（παραστῆσαι），当作【活祭】—— 信徒献上自己\n15:16  叫【所献上的】（προσφορά）外邦人……可蒙悦纳 —— 保罗献上他们</pre><p>⚠ 而最后那半句最重要：「因着<b>圣灵</b>成为圣洁」是<b>完成被动分词</b>——</p><p>那个供物之所以被收下，<b>不是因为它本身好</b>，</p><p>是因为<b>有一位把它分别为圣了</b>。</p>"},{"a":17,"z":21,"star":false,"grk":"<p>18 οὐ γὰρ τολμήσω τι λαλεῖν ὧν οὐ κατειργάσατο Χριστὸς δι' ἐμοῦ εἰς ὑπακοὴν ἐθνῶν…</p>","lit":"<p>18「因为我<b>不敢</b>说任何一件<b>不是基督借着我做成</b>的事——祂借着我，用言语和作为，使外邦人<b>顺服</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>可夸的</td><td>καύχησις</td><td>kauchēsis</td><td>G2746</td><td><b>夸口</b>（<b>3:27「没有可夸的了」同字根</b>）</td></tr><tr><td>不敢</td><td>οὐ τολμήσω</td><td>ou tolmēsō</td><td>G5111</td><td><b>我不敢</b>（<b>15:15「稍微放胆」同字根</b>）</td></tr><tr><td>使…顺服</td><td>εἰς ὑπακοὴν ἐθνῶν</td><td>—</td><td>G5218</td><td><b>外邦人的顺服</b>（<b>1:5、16:26同词组</b>）</td></tr></table>","gram":"<p>★ 亮光一：15:17–18的一组张力——「有可夸的」与「我甚么都不敢提」</p><p>弟兄姊妹，这两节连着读很有意思。</p><p>15:17说：「我<b>有可夸的</b>。」</p><p>而15:18立刻补上：「<b>除了基督藉我做的那些事</b>，我甚么都不敢提。」</p><p>保罗<b>没有</b>假装自己什么都没做。</p><p>他只是把「谁做的」讲清楚了。</p><p>而 καύχησις（可夸的）正是3:27那个字：</p><pre>3:27   「哪里能夸口呢？【没有可夸的了】」—— 在称义上，没有\n15:17  「我在基督耶稣里【有可夸的】」   —— 在事奉上，有；但只夸祂做的</pre><p>这正是「让耶稣得到一切荣耀」最精准的分寸：</p><p>不是否认果效，是<b>把果效的作者说对</b>。</p><p>★ 亮光二：τολμάω ——「我不敢」</p><p>15:15保罗说他「稍微<b>放胆</b>（τολμηρότερον）写信」；而15:18他说「我甚么都<b>不敢</b>（οὐ τολμήσω）提」。</p><p>同一个字根，两个方向。</p><p>弟兄姊妹，保罗的胆量与他的不敢，落在不同的地方：</p><p>讲神的话——他<b>放胆</b>。<br>讲自己的功劳——他<b>不敢</b>。</p><p>★ 亮光三：εἰς ὑπακοὴν ἐθνῶν ——全书的框，在这里再出现一次</p><pre>1:5    在【万国】之中叫人为他的名【信服真道】\n15:18  使【外邦人】【顺服】\n16:26  指示【万国】的民，使他们【信服真道】</pre><p>保罗的事奉目标，从第一章到第十六章，没有变过。</p><p>★ 亮光四：以利哩古在哪里？（15:19）</p><p>「从耶路撒冷，直转到<b>以利哩古</b>」——</p><table><tr><th>地点</th><th>位置</th></tr><tr><td><b>耶路撒冷</b></td><td>保罗宣教版图的<b>东端</b></td></tr><tr><td><b>以利哩古</b>（Illyricum）</td><td>亚得里亚海东岸，约当今日巴尔干半岛西部——当时保罗所及的<b>西北端</b></td></tr></table><p>而15:24、28说他要去<b>西班牙</b>——那几乎是当时所知世界的<b>西端</b>。</p><p>弟兄姊妹，保罗的地图是：<b>从耶路撒冷，到地的两端</b>。</p><p>（使徒行传没有记载保罗在以利哩古的宣教；一般理解为他曾到达其边界一带。<br>讲台上宜说「他的脚踪已经走到那一带」，不必给精确的行程。）</p><p>★ 亮光五：φιλοτιμέομαι ——「以此为荣」</p><p>新约仅三次：罗15:20；林后5:9；帖前4:11。</p><p>不是「我打算」，是「<b>我把这件事当作我的荣耀来追求</b>」。</p><p>★ 亮光六：ἀλλότριος ——第十四章那个字</p><pre>14:4   「你是谁，竟论断【别人的】仆人呢？」\n15:20  「免得建造在【别人的】根基上」</pre><p>保罗对「别人的」很有分寸：<b>别人的仆人不管，别人的根基不建</b>。</p><p>★ 亮光七：15:21引赛52:15</p><p>而赛52:15正是<b>受苦仆人之歌的开头</b>（赛52:13–53:12）。</p><p>保罗把他向未得之民传福音的异象，建立在以赛亚书53章上。</p><p>（关于15:20的误用，见第二十部分。）</p>","exp":"<p>弟兄姊妹，17与18节连着读，是一组很重要的张力。</p><p>15:17说：「我<b>有可夸的</b>。」</p><p>15:18立刻补上：「<b>除了基督藉我做的那些事</b>，我甚么都不敢提。」</p><p><b>经文本身明确表达的：</b> 保罗在事奉上有可夸的，但他只提基督藉他所做的；他的志向是向未曾听过的人传福音。</p><p><b>可以合理推论的：</b> 保罗<b>没有</b>假装自己什么都没做——</p><p>他只是把「<b>谁做的</b>」讲清楚了。</p><p>而 καύχησις（可夸的）正是3:27那个字：「哪里能夸口呢？<b>没有可夸的了</b>。」</p><p>在<b>称义</b>上，没有可夸的（3:27）。<br>在<b>事奉</b>上，有——但只夸<b>祂做的</b>（15:17–18）。</p><p>这正是「让耶稣得到一切荣耀」最精准的分寸：</p><p>不是否认果效，是<b>把果效的作者说对</b>。</p><p>而20节的「立了志向」（φιλοτιμέομαι ＝ φίλος 爱 ＋ τιμή 尊荣）——</p><p>不是「我打算」，是「<b>我把这件事当作我的荣耀来追求</b>」。</p><p><b>⚠ 讲台诚信提醒：</b> 15:20<b>不可</b>用来论断别人的事奉安排（「不可以在已有教会的地方植堂」）。<br>保罗讲的是<b>他自己的呼召</b>：他自己正计划去罗马（那里已有教会）；他把提摩太留在以弗所；亚波罗在他之后浇灌哥林多。</p><p>【第四段｜15:22–32　搏斗】</p>"},{"a":22,"z":29,"star":false,"grk":"<p>25 νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.<br>28 τοῦτο οὖν ἐπιτελέσας καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον…</p>","lit":"<p>25「但现在，我正往耶路撒冷去，<b>服事</b>众圣徒。」<br>28「所以，等我办完这事，并且把这果子<b>盖印封好</b>交给他们，我就要经过你们那里，往西班牙去。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>拦阻</td><td>ἐνεκοπτόμην</td><td>enekoptomēn</td><td>G1465</td><td><b>被切断去路</b>（军事用语：破坏道路阻敌）</td></tr><tr><td>送行</td><td>προπεμφθῆναι</td><td>propemphthēnai</td><td>G4311</td><td><b>差派、供应路费送上路</b></td></tr><tr><td>供给</td><td>διακονῶν</td><td>diakonōn</td><td>G1247</td><td><b>服事</b>（<b>διάκονος 的动词形</b>）</td></tr><tr><td>捐项</td><td>κοινωνία</td><td>koinōnia</td><td>G2842</td><td><b>团契、分享、有分</b></td></tr><tr><td>所欠的债</td><td>ὀφειλέται</td><td>opheiletai</td><td>G3781</td><td><b>欠债的人</b>（<b>15:1、13:8同字根</b>）</td></tr><tr><td>交付明白</td><td>σφραγισάμενος</td><td>sphragisamenos</td><td>G4972</td><td><b>盖印封好</b>（<b>4:11「印证」同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：ἐγκόπτω（15:22「拦阻」）——被切断去路</p><p>这个字是<b>军事用语</b>：破坏道路、切断通路，使敌军无法前进。</p><p>保罗在别处也用它：</p><p>帖前2:18「只是<b>撒但阻挡</b>了我们。」<br>加5:7「你们向来跑得好，有谁<b>拦阻</b>你们？」</p><p>弟兄姊妹，注意15:22用的是<b>未完成式被动</b>——「我<b>一再地被拦阻</b>」。</p><p>这不是一次的耽延，是<b>好几年</b>。</p><p>而他的回应是什么？</p><p>15:23「但如今……」——他<b>继续计划</b>。</p><p>★ 亮光二：15:23–24 保罗的地图</p><pre>【现在】哥林多\n   ↓\n耶路撒冷（15:25）—— 送捐项，而他知道那里有危险（15:31）\n   ↓\n罗马（15:24、28）—— 「先与你们彼此交往，心里稍微满足」\n   ↓\n西班牙（15:24、28）—— 当时所知世界的西端</pre><p>而15:24有一个很客气、却很具体的请求：</p><p>「然后<b>蒙你们送行</b>。」</p><p>（προπέμπω 是差传的技术用语，见亮光四。）</p><p>弟兄姊妹，保罗去罗马<b>不是终点站</b>，是<b>中途站</b>。</p><p>他真正要去的是——<b>还没有人去过的地方</b>（15:20–21）。</p><p>★ 亮光三：διακονέω（15:25「供给」）——与15:16同一个家族</p><p>「我往耶路撒冷去<b>供给</b>圣徒」——διακονῶν。</p><p>而15:16保罗称自己是「基督耶稣的<b>仆役</b>」（λειτουργός），15:27又用 λειτουργῆσαι（供给）。</p><p>弟兄姊妹，保罗用<b>同一组事奉用语</b>，来说两件事：</p><p>传福音是事奉（15:16）。<br>送一笔钱，也是事奉（15:25、27）。</p><p>在他的观念里，<b>这两件事没有高下之分</b>。</p><p>★ 亮光四：προπέμπω ——差传的技术用语</p><p>这个字常指<b>教会为传道人预备路费、供应需要、送他上路</b>。</p><p>（徒15:3；林前16:6、11；多3:13；约参1:6）</p><p>保罗在15:24其实是在<b>请罗马教会作他去西班牙的差传支持</b>。</p><p>★ 亮光五：κοινωνία ——「捐项」原文是「团契」</p><p>保罗<b>没有</b>用「捐款」这个字。</p><p>在他的观念里，<b>金钱的分享，就是团契的一种形式</b>。</p><p>★ 亮光六：15:27的「债」——与15:1呼应</p><pre>15:1   「我们坚固的人【应该】（Ὀφείλομεν）担代……」\n15:27  「其实也算是【所欠的债】（ὀφειλέται）」</pre><p>而15:27的逻辑是：</p><pre>外邦人在犹太人【属灵的好处】上有分\n   ↓\n所以外邦人就当在【养身之物】上供给他们</pre><p>弟兄姊妹，这正是11:18的实际版：</p><p>「不是你托着根，乃是根托着你。」</p><p>而现在，被接上的枝子，<b>把果子送回去</b>。</p><p>★ 亮光七：σφραγίζω（15:28「交付明白」）——盖印封好</p><p>和合本译「把这善果向他们<b>交付明白</b>」——原文是 σφραγισάμενος，字面是：</p><p>把这果子<b>盖上印、封好</b>，交给他们。</p><p>这个字在当时的商业与运送上，指<b>封缄</b>：货物送到，盖印为凭，表示<b>如数送达、责任完成</b>。</p><p>而它的名词形 σφραγίς，正是第四章那个字：</p><pre>4:11   「他受了割礼的【记号】，作他……因信称义的【印证】（σφραγίς）」\n15:28  「把这善果向他们【交付明白】（σφραγισάμενος）」</pre><p>弟兄姊妹，保罗在钱的事上极其谨慎。</p><p>（比较林后8:20–21：「这就免得有人因我们收的捐银很多，就挑我们的不是。<br>我们留心行光明的事，不但在主面前，就在人面前也是这样。」）</p><p>这是一个很实际的提醒：</p><p>属灵的事奉，在<b>金钱的交代</b>上要能「盖印封好」。</p><p>★ 亮光八：15:29「必带着基督丰盛的恩典而去」</p><p>弟兄姊妹，这一节读起来很笃定。</p><p>而后来发生的事是：</p><pre>徒21     他到了耶路撒冷 —— 被捕\n徒23–26  在该撒利亚坐监两年\n徒27     船坏\n徒28:16  终于到了罗马 —— 【戴着锁链】</pre><p>他说对了吗？</p><p>弟兄姊妹，说对了。</p><p>因为腓立比书1:12–13（在罗马监中写的）说：</p><p>「我所遭遇的事<b>更是叫福音兴旺</b>……以致我受的捆锁在御营全军和其余的人中，已经显明是为基督的缘故。」</p><p>他确实「带着基督丰盛的恩典」去了罗马。</p><p>只是——<b>那份恩典的形状，跟他想的不一样</b>。</p><p>（这一段与15:30–32的祷告一起读，是全章最有牧养力的材料。见第二十部分第八题。）</p>","exp":"<p>弟兄姊妹，这一段是保罗的<b>行程表</b>——而它透露了三件事。</p><p>① 他被拦阻了好几年（15:22）。</p><p>ἐγκόπτω 是<b>军事用语</b>：破坏道路、切断通路。而它是<b>未完成式被动</b>——「我<b>一再地被拦阻</b>」。</p><p>而他的回应是什么？15:23：「<b>但如今</b>……」——<b>他继续计划</b>。</p><p>② 罗马不是终点站，是中途站（15:24、28）。</p><p>保罗真正要去的是<b>西班牙</b>——当时所知世界的西端。</p><p>而15:19说他已「从耶路撒冷，直转到以利哩古」。<br>他的地图是：<b>从耶路撒冷，到地的两端</b>。</p><p>③ 他把「送捐项」与「传福音」放在同一个位阶（15:25、27）。</p><p><b>经文本身明确表达的：</b> 保罗先往耶路撒冷送捐项，然后才要经过罗马往西班牙去；而外邦人在物质上供给犹太信徒，是「所欠的债」。</p><p><b>可以合理推论的：</b> 「捐项」（κοινωνία）原文是「<b>团契</b>」——<br>保罗<b>没有</b>用「捐款」这个字。在他的观念里，<b>金钱的分享，就是团契的一种形式</b>。</p><p>而15:27的逻辑，正是11:18的实际版：</p><p>「不是你托着根，乃是根托着你。」<br>而现在——<b>被接上的枝子，把果子送回去</b>。</p><p>⚠ 而15:24那句「然后<b>蒙你们送行</b>」（προπέμπω）是差传的技术用语：<br>供应路费、预备需要、送他上路。</p><p>换句话说：保罗在这一节，其实是在<b>请罗马教会作他去西班牙的差传支持</b>。</p>"},{"a":30,"z":32,"star":true,"grk":"<p>30 …συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,</p>","lit":"<p>30「弟兄们，我<b>借着我们的主耶稣基督</b>，又<b>借着圣灵的爱</b>，劝你们：<b>在为我向神的祷告上，与我一同下场搏斗</b>；」<br>31「叫我<b>得蒙拯救，脱离犹太地那些不顺从的人</b>；也叫我<b>为耶路撒冷所办的这供职，可蒙圣徒悦纳</b>；」<br>32「好叫我<b>照着神的旨意，欢欢喜喜地到你们那里</b>，<b>与你们同得安息</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>一同竭力</td><td>συναγωνίσασθαι</td><td>synagōnisasthai</td><td>G4865</td><td><b>σύν + ἀγών（竞技场的搏斗）</b></td><td><b>与……一同下场搏斗</b></td><td><b>新约仅此一次</b></td></tr></table>","gram":"<p>★★ 亮光一：συναγωνίζομαι ——「与我一同下场」</p><p>这个字由 σύν（一同）+ ἀγωνίζομαι（<b>在竞技场上搏斗</b>）组成。</p><p>而 ἀγών 是「<b>竞技、格斗、拚命</b>」——英文 agony 的字根。</p><p>保罗在别处用同一字根：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>西4:12</b></td><td>以巴弗「常为你们<b>竭力</b>（ἀγωνιζόμενος）祈求」</td></tr><tr><td><b>提后4:7</b></td><td>「那<b>美好的仗</b>（ἀγῶνα）我已经打过了」</td></tr><tr><td><b>路22:44</b></td><td>耶稣在客西马尼「<b>极其伤痛</b>」（ἀγωνίᾳ）</td></tr></table><p>弟兄姊妹，保罗请人为他祷告——</p><p>而他用的字是：<b>跟我一起下场搏斗</b>。</p><p>★ 亮光二：「借着圣灵的爱」</p><p>15:30说祷告的根据有两个：</p><pre>「借着我们主耶稣基督」\n「又借着【圣灵的爱】」</pre><p>代祷的动力，是<b>圣灵放在我们里面的那份爱</b>。</p><p>★ 亮光三：★ 这个祷告蒙应允了吗？</p><p>保罗求了三件事：</p><table><tr><th>求的内容</th><th>后来</th></tr><tr><td>脱离犹太不顺从的人（15:31）</td><td><b>在耶路撒冷被捕</b>（徒21:27–33）</td></tr><tr><td>捐项蒙圣徒悦纳（15:31）</td><td>圣经未明说（徒21:17–20暗示受到接待）</td></tr><tr><td><b>欢欢喜喜地到你们那里</b>（15:32）</td><td><b>到了罗马——戴着锁链</b>（徒28:16、20）</td></tr></table><p>而使徒行传28:15记载：</p><p>「那里的弟兄们一听见我们的信息，就出来……迎接我们。<br>保罗见了他们，就<b>感谢神，放心壮胆</b>。」</p><p>弟兄姊妹，他到了。</p><p>他也「欢欢喜喜」了。</p><p>只是——<b>方式跟他想的完全不一样</b>。</p>","exp":"<p>弟兄姊妹，30节那个字（συναγωνίζομαι）是<b>新约仅此一次</b>。</p><p>它由 σύν（一同）＋ ἀγωνίζομαι（<b>在竞技场上搏斗</b>）组成。</p><p>而 ἀγών 这个字根，正是路22:44形容主耶稣在客西马尼「<b>极其伤痛</b>」（ἀγωνίᾳ）的那个字。</p><p><b>经文本身明确表达的：</b> 保罗请罗马教会在祷告上与他一同竭力，求三件事：脱离危险、捐项蒙悦纳、欢喜地到他们那里。</p><p><b>可以合理推论的：</b> 保罗请人代祷，用的字是——</p><p>「<b>跟我一起下场</b>。」</p><p>而我们说「我会为你祷告」的时候：那是<b>下场</b>，还是<b>挥手</b>？</p><p>★ 而这段祷告后来怎么了？</p><table><tr><th>他求的</th><th>后来</th></tr><tr><td>脱离犹太不顺从的人（15:31）</td><td><b>在耶路撒冷被捕</b>（徒21:27–33）</td></tr><tr><td>捐项蒙圣徒悦纳（15:31）</td><td>圣经未明说（徒21:17–20暗示受到接待）</td></tr><tr><td><b>欢欢喜喜到你们那里</b>（15:32）</td><td><b>到了罗马——戴着锁链</b>（徒28:16、20）</td></tr></table><p>而使徒行传28:15记载：</p><p>「那里的弟兄们一听见我们的信息，就出来……迎接我们。<br>保罗见了他们，就<b>感谢神，放心壮胆</b>。」</p><p>他到了。他也「欢欢喜喜」了。</p><p>只是——<b>方式跟他想的完全不一样</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 这一段<b>不可</b>讲成「所以祷告不必求具体的事」——保罗求得非常具体。<br>也<b>不可</b>讲成「神一定会照你求的做」——祂没有照保罗写的方式做。<br>最忠实的讲法：<b>他求了，神应允了，而过程完全不是他想的样子</b>。<br>（对正在久求未应的人，这段是极大的安慰；但不要说得太快、太轻。）</p><p>【第五段｜15:33　第三个祝福】</p>"},{"a":33,"z":33,"star":false,"grk":"<p>ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν, ἀμήν.</p>","lit":"<p>「愿那<b>平安的神</b>，<b>与你们众人同在</b>。阿们。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>赐平安的神</td><td>ὁ θεὸς τῆς εἰρήνης</td><td>—</td><td>G1515</td><td><b>平安的神</b>（16:20再次出现）</td></tr><tr><td>众人</td><td>πάντων ὑμῶν</td><td>pantōn hymōn</td><td>G3956</td><td><b>你们所有的人</b>（不是「对的那些人」）</td></tr><tr><td>阿们</td><td>ἀμήν</td><td>amēn</td><td>G281</td><td>诚心所愿、确实如此</td></tr></table>","gram":"<p>★ 亮光一：三个「神」的第三个</p><pre>15:5   赐【忍耐安慰】的神\n15:13  使人有【盼望】的神\n15:33  赐【平安】的神   ← 本节</pre><p>★ 亮光二：「赐平安的神」在保罗书信中</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>罗15:33</b></td><td>「愿<b>赐平安的神</b>常和你们众人同在」</td></tr><tr><td><b>罗16:20</b></td><td>「<b>赐平安的神</b>快要将撒但践踏在你们脚下」</td></tr><tr><td>腓4:9</td><td>「<b>赐平安的神</b>就必与你们同在」</td></tr><tr><td>帖前5:23</td><td>「愿<b>赐平安的神</b>亲自使你们全然成圣」</td></tr><tr><td>来13:20</td><td>「但愿<b>赐平安的神</b>……」</td></tr></table><p>★ 亮光三：「和你们<b>众人</b>」</p><p>μετὰ πάντων ὑμῶν ——「与你们<b>所有的人</b>」。</p><p>弟兄姊妹，在一封处理「强与弱」张力的信里，</p><p>保罗最后说：<b>众人</b>。</p><p>不是「与那些对的人」。</p>","exp":"<p>弟兄姊妹，14–15章讲的是什么？</p><p>是一间<b>因为食物与日子而紧张</b>的教会。</p><p>而保罗的祝福是：</p><p>「愿<b>赐平安的神</b>，常和你们<b>众人</b>同在。」</p><p>他求的正是那间教会最缺的东西。</p>"}],"16":[{"a":1,"z":1,"star":true,"grk":"<p>Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν [καὶ] διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,</p>","lit":"<p>「我向你们<b>正式介绍</b>我们的姊妹非比，她是<b>坚革哩教会的</b> διάκονος。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>举荐</td><td>Συνίστημι</td><td>synistēmi</td><td>G4921</td><td>σύν + ἵστημι</td><td><b>正式介绍、推荐</b></td><td><b>3:5、5:8同字</b></td></tr><tr><td>姊妹</td><td>ἀδελφή</td><td>adelphē</td><td>G79</td><td>—</td><td>姊妹</td><td>—</td></tr><tr><td>女执事</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td>—</td><td><b>执事／仆人</b></td><td><b>见第二十部分</b></td></tr></table>","gram":"<p>★ 亮光一：συνίστημι ——推荐信的格式</p><p>这个字在第一世纪是<b>推荐信的专门用语</b>。</p><p>（林后3:1「岂像别人用<b>举荐书</b>给你们或用你们的举荐书呢？」——同字根）</p><p>弟兄姊妹，16:1–2的结构，正是一封标准的推荐信：</p><p>① 介绍身分（16:1）<br>② 请求接待（16:2上）<br>③ 说明她的功劳（16:2下）</p><p>而这使多数注释家判断：</p><p>非比<b>极可能就是把这封信从哥林多带到罗马的人</b>。</p><p>（经文没有明说，但推荐信的功能通常如此。）</p><p>弟兄姊妹，如果是这样——</p><p>人类历史上第一个把罗马书送到罗马的人，</p><p>是一位姊妹。</p><p>★ 亮光二：συνίστημι 在罗马书的另外两处</p><pre>3:5   「我们的不义若【显出】（συνίστησιν）神的义来」\n5:8   「惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们【显明】（συνίστησιν）了」</pre><p>同一个字。神用十字架「举荐」祂的爱（5:8）；<br>保罗用这封信「举荐」非比。</p><p>★ 亮光三：「坚革哩教会中的」</p><p>这个限定很重要：保罗<b>没有</b>只说「非比是一个服事的人」，</p><p>他说：「<b>坚革哩教会的</b> διάκονος」。</p><p>（关于这是否为职分，见第二十部分——本文不作裁决。）</p>","exp":"<p>弟兄姊妹，16:1看起来只是一句客套的介绍。</p><p>但它在第一世纪是一份<b>有效力的文件</b>。</p><p>一个人要到陌生的城市，需要一封推荐信，<br>好让当地的人知道：<b>这个人可以接待，是自己人</b>。</p><p>而保罗在这封信里，把三件事讲清楚了：</p><table><tr><th>他说了什么</th><th>意思</th></tr><tr><td><b>「我们的姊妹」</b></td><td>她<b>属于这个家</b>——不是外人</td></tr><tr><td><b>「坚革哩教会中的 διάκονος」</b></td><td>她在<b>一间具体的教会</b>里，有<b>实际的服事地位</b></td></tr><tr><td><b>（16:2）「她素来帮助许多人，也帮助了我」</b></td><td>她的信用，<b>保罗自己作保</b></td></tr></table><p><b>经文本身明确表达的：</b> 保罗正式推荐非比，并要求罗马教会接待她、支援她。</p><p><b>可以合理推论的：</b> 若她正是送信的人，那么「第一个把罗马书带进罗马城的」，是一位姊妹。<br>（经文没有明说，但推荐信的功能通常如此。）</p>"},{"a":2,"z":2,"star":true,"grk":"<p>ἵνα αὐτὴν προσδέξησθε ἐν κυρίῳ ἀξίως τῶν ἁγίων καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι· καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ἐμοῦ αὐτοῦ.</p>","lit":"<p>「好叫你们<b>在主里接待她</b>，用<b>配得圣徒的方式</b>；并且在她所需要的任何事上，<b>站到她旁边去</b>——因为她自己<b>素来就是许多人的保护人</b>，也是我的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>接待</td><td>προσδέξησθε</td><td>prosdexēsthe</td><td>G4327</td><td><b>欢迎、接受</b>（比较14:1、15:7的 προσλαμβάνω）</td></tr><tr><td>帮助（你们）</td><td>παραστῆτε</td><td>parastēte</td><td>G3936</td><td><b>παρίστημι——站在她旁边</b>（见下）</td></tr><tr><td>帮助（她）</td><td>προστάτις</td><td>prostatis</td><td>G4368</td><td><b>保护人、资助者</b></td></tr></table>","gram":"<p>★ 亮光一：παρίστημι ——「站到她旁边去」</p><p>「你们就<b>帮助</b>她」——原文是 παρίστημι（παρά「旁边」+ ἵστημι「站」）。</p><p>弟兄姊妹，这个字我们在罗马书追踪过：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>6:13</b></td><td>「将自己<b>献给</b>（παραστήσατε）神」</td></tr><tr><td><b>12:1</b></td><td>「将身体<b>献上</b>（παραστῆσαι），当作活祭」</td></tr><tr><td><b>14:10</b></td><td>「我们都要<b>站在</b>（παραστησόμεθα）神的台前」</td></tr><tr><td><b>16:2</b></td><td><b>「你们就</b>帮助<b>（παραστῆτε）她」</b></td></tr></table><p>弟兄姊妹，这个字的字面是：<b>站到旁边去</b>。</p><p>保罗在说：<b>她若有需要，你们就站到她旁边去</b>。</p><p>★ 亮光二：两个「帮助」，原文是两个不同的字</p><pre>「你们就【帮助】她」    —— παρίστημι（站到旁边）\n「因她素来【帮助】许多人」—— προστάτις（保护人、资助者）</pre><p>弟兄姊妹，中文都译「帮助」，但份量不同：</p><p>前者是「你们去帮她」。<br>后者是说：<b>她本来就是那个帮助许多人的人</b>。</p><p>★ 亮光三：προστάτις 的社会意义</p><p>这个字指一个<b>有地位或财力、为他人提供保护与支持的人</b>。</p><p>（在罗马社会，这是 patronus「保护人」制度的希腊文对应词。）</p><p>保罗说：她是「许多人的 προστάτις，<b>也是我的</b>」。</p>","exp":"<p>弟兄姊妹，16:2有一个很美的逻辑：</p><pre>她曾经帮助许多人（包括保罗）\n   ↓\n所以：现在轮到你们去帮助她</pre><p>这正是属神体系的样子：<b>不是单向的，是流通的</b>。</p><p>【第二段｜16:3–16　★ 名单】</p>"},{"a":3,"z":5,"star":true,"grk":"<p>3 Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,<br>4 οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν…</p>","lit":"<p>3「<b>问百基拉和亚居拉安</b>——他们是我在基督耶稣里的<b>同工</b>，」<br>4「他们曾为我的性命，<b>把自己的脖子放上去</b>。」<br>5「也问<b>在他们家中的那个教会</b>安。问我所亲爱的以拜尼土安——他是亚西亚归给基督的<b>初熟果子</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>同工</td><td>συνεργός</td><td>synergos</td><td>G4904</td><td>σύν + ἔργον：<b>一同做工的人</b></td></tr><tr><td>颈项</td><td>τράχηλος</td><td>trachēlos</td><td>G5137</td><td><b>脖子</b></td></tr><tr><td>置之度外</td><td>ὑπέθηκαν</td><td>hypethēkan</td><td>G5294</td><td>ὑπό + τίθημι：<b>放在下面</b></td></tr><tr><td>初结的果子</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>初熟的果子</b>（<b>8:23、11:16同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：百基拉的名字排在前面</p><p>新约中提到这对夫妇共六次，其中<b>四次是百基拉在前</b>：</p><table><tr><th>出处</th><th>顺序</th></tr><tr><td>徒18:2</td><td>亚居拉、百基拉</td></tr><tr><td><b>徒18:18</b></td><td><b>百基拉、亚居拉</b></td></tr><tr><td><b>徒18:26</b></td><td><b>百基拉、亚居拉</b>（他们一同教导亚波罗）</td></tr><tr><td><b>罗16:3</b></td><td><b>百基拉、亚居拉</b></td></tr><tr><td>林前16:19</td><td>亚居拉、百基拉</td></tr><tr><td><b>提后4:19</b></td><td><b>百基拉、亚居拉</b></td></tr></table><p>弟兄姊妹，在第一世纪的文书惯例中，这个顺序是值得注意的。</p><p>（学者对原因有不同推测：可能与她的社会地位有关，也可能与她在教会中的角色有关。<br>讲台上宜说「这个顺序值得注意」，不必过度推论。）</p><p>★ 亮光二：「将自己的颈项置之度外」</p><p>原文的字面是：<b>把自己的脖子放上去</b>。</p><p>弟兄姊妹，那是一个<b>斩首的画面</b>。</p><p>（我们不知道那件事发生在哪里——可能是徒19章以弗所的暴动，也可能是别的事。圣经没有记载细节。）</p><p>★ 亮光三：他们的家就是教会</p><p>16:5「又问<b>在他们家中的教会</b>安」。</p><p>而林前16:19也说：「亚居拉和百基拉并<b>在他们家里的教会</b>……问你们安。」</p><p>弟兄姊妹，他们搬到哪里，教会就在哪里。</p><p>★ 亮光四：ἀπαρχή（初结的果子）——第八章那个字</p><pre>8:23   「我们这有【圣灵初结果子】（ἀπαρχή）的」\n11:16  「所献的【新面】（ἀπαρχή）若是圣洁」\n16:5   「他在亚西亚是归基督【初结的果子】（ἀπαρχή）」</pre><p>弟兄姊妹，初熟的果子不是「一小部分」，是<b>整场收成的保证</b>。</p><p>以拜尼土是亚西亚第一个信主的人——<br>而他背后，是后来整个亚西亚的收成。</p>","exp":"<p>弟兄姊妹，这三节里有一对夫妇，和一间在他们家里的教会。</p><p>而保罗记得的，不是他们的职位，是<b>他们做过什么</b>：</p><p>「他们<b>为我的命</b>，把自己的脖子放上去。」</p><p>而下一句更值得注意：</p><p>「不但我感谢他们，就是<b>外邦的众教会</b>也感谢他们。」</p><p>弟兄姊妹，这意味着：他们的付出，<b>不只一间教会知道</b>。</p><p><b>经文本身明确表达的：</b> 百基拉与亚居拉曾为保罗冒生命危险，并且他们的家就是教会。</p><p><b>可以合理推论的：</b> 一对做帐棚的夫妇，搬到哪里，教会就在哪里（比较徒18:2–3、18:18–19；林前16:19）。<br>属神的体系，不一定需要一栋建筑；有时候只需要一个愿意开门的家。</p>"},{"a":6,"z":15,"star":true,"grk":"<p>6 ἀσπάσασθε Μαρίαν, ἥτις πολλὰ ἐκοπίασεν εἰς ὑμᾶς.<br>7 ἀσπάσασθε Ἀνδρόνικον καὶ Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ.<br>8 ἀσπάσασθε Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.<br>9 ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.<br>10 ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.<br>11 ἀσπάσασθε Ἡρῳδίωνα τὸν συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.<br>12 ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.<br>13 ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.<br>14 ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.<br>15 ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.</p>","lit":"<p>6「问马利亚安——她<b>为你们做了许多苦工</b>。」<br>7「问安多尼古和犹尼亚安——我的亲属，也是<b>与我一同作战俘的</b>；他们在使徒中是<b>被标记出来的</b>，而且<b>比我先在基督里</b>。」<br>8「问暗伯利安——<b>我在主里蒙爱的</b>。」<br>9「问耳巴奴安——我们在基督里的<b>同工</b>；也问士他古安——<b>我所蒙爱的</b>。」<br>10「问亚比利安——那<b>在基督里经过试验的</b>。问亚利多布家里的人安。」<br>11「问希罗天安——我的亲属。问拿其数家中<b>那些在主里的人</b>安。」<br>12「问土非拿氏和土富撒氏安——<b>那些在主里做苦工的</b>（女性）。问可亲爱的彼息氏安——她<b>在主里做了许多苦工</b>。」<br>13「问鲁孚安——<b>那在主里蒙拣选的</b>；也问他母亲安，<b>她也是我的母亲</b>。」<br>14「问亚逊其土、弗勒干、黑米、八罗巴、黑马，以及<b>与他们在一起的弟兄们</b>安。」<br>15「问非罗罗古和犹利亚、尼利亚和他姊妹、阿林巴，以及<b>与他们在一起的众圣徒</b>安。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>多受劳苦</td><td>πολλὰ ἐκοπίασεν</td><td>ekopiasen</td><td>G2872</td><td><b>κοπιάω ＝ 做到筋疲力尽的苦工</b></td></tr><tr><td>一同坐监</td><td>συναιχμαλώτους</td><td>synaichmalōtous</td><td>G4869</td><td><b>σύν + αἰχμάλωτος（战俘）</b>——<b>7:23同字根</b></td></tr><tr><td>有名望的</td><td>ἐπίσημοι</td><td>episēmoi</td><td>G1978</td><td><b>被标记出来的、显著的</b></td></tr><tr><td>所亲爱的</td><td>ἀγαπητός</td><td>agapētos</td><td>G27</td><td><b>蒙爱的</b>（<b>1:7、太3:17同字</b>）</td></tr><tr><td>同工</td><td>συνεργός</td><td>synergos</td><td>G4904</td><td><b>σύν + ἔργον：一同做工的人</b></td></tr><tr><td>经过试验的</td><td>δόκιμος</td><td>dokimos</td><td>G1384</td><td><b>经过试验而合格的</b>（<b>5:4 δοκιμή 同字根</b>）</td></tr><tr><td>蒙拣选的</td><td>ἐκλεκτός</td><td>eklektos</td><td>G1588</td><td><b>被拣选的</b>（<b>8:33同字</b>）</td></tr><tr><td>在一处的</td><td>σὺν αὐτοῖς</td><td>syn autois</td><td>—</td><td><b>与他们同在一起的</b>（16:14、15）</td></tr></table>","gram":"<p>★ 亮光一：κοπιάω ——「做苦工」，而且全部用在女性身上</p><p>这个字的意思不是「服事」，是：</p><p>做到<b>筋疲力尽</b>的苦工。</p><p>（保罗用它形容自己：林前15:10「我比众使徒格外<b>劳苦</b>」；西1:29）</p><p>而在罗马书16章，这个字出现<b>四次</b>：</p><pre>16:6   马利亚          —— 多受劳苦\n16:12  土非拿氏、土富撒氏 —— 为主劳苦\n16:12  彼息氏          —— 为主多受劳苦</pre><p>弟兄姊妹，四次，<b>全部用在女性身上</b>。</p><p>★ 亮光二：συναιχμάλωτος ——「一同坐监」，字面是「一同作战俘」</p><p>这个字由 σύν + <b>αἰχμάλωτος（战俘）</b> 组成。</p><p>而那个字根，我们在罗7:23见过：</p><p>7:23「把我<b>掳去</b>（αἰχμαλωτίζοντά），叫我附从那肢体中犯罪的律。」</p><p>弟兄姊妹，安多尼古和犹尼亚——</p><p>是保罗的<b>牢友</b>。</p><p>★ 亮光三：δόκιμος（16:10「经过试验的」）——第五章那个字根</p><pre>5:3–4  「患难生忍耐，忍耐生【老练】（δοκιμή），老练生盼望」\n16:10  「在基督里【经过试验的】（δόκιμον）亚比利」</pre><p>δοκιμή 是<b>金属经过火炼之后，还在的那个部分</b>。</p><p>弟兄姊妹，保罗对亚比利的描述只有五个字：</p><p>「在基督里经过试验的。」</p><p>我们不知道他经历过什么。</p><p>但保罗记得。</p><p>★ 亮光四：ἐκλεκτός（16:13「在主蒙拣选的」）——第八、九章那个字</p><pre>8:33   「谁能控告神所【拣选】（ἐκλεκτῶν）的人呢？」\n9:11   「神【拣选】（ἐκλογή）人的旨意」\n16:13  「在主【蒙拣选】（ἐκλεκτόν）的鲁孚」</pre><p>弟兄姊妹，保罗讲了两章的「拣选」神学（9–11章）。</p><p>而在第十六章，那个字落在一个人身上：</p><p>鲁孚。</p><p>★★ 亮光五：16:13「他的母亲就是我的母亲」</p><p>弟兄姊妹，这半句话是全章最温暖的：</p><p>「又问在主蒙拣选的鲁孚和他母亲安；</p><p>他的母亲<b>就是我的母亲</b>。」</p><p>保罗显然不是说她生了他。</p><p>他是说：</p><p>这位姊妹，<b>待我如同待自己的儿子</b>。</p><p>弟兄姊妹，保罗是一个<b>没有家的人</b>。</p><p>他一生在路上，坐监、船坏、被打、被赶。</p><p>而在某一个城市，有一位姊妹——</p><p>把他当儿子。</p><p>（关于「鲁孚」是否为可15:21古利奈人西门的儿子，见第二十部分——<b>无法确定</b>。）</p><p>★ 亮光六：16:8–9 三个没有事迹的名字</p><p>弟兄姊妹，这一份名单里，多数人后面都跟着一句「他做过什么」。</p><p>但有三个人不是：</p><pre>16:8  暗伯利 —— 「我在主里面【所亲爱的】」\n16:9  耳巴奴 —— 「在基督里与我们【同工的】」\n16:9  士他古 —— 「我【所亲爱的】」</pre><p>「所亲爱的」是 ἀγαπητός——<b>蒙爱的</b>。</p><p>而这个字，我们在第一章见过：</p><p>1:7「我写信给你们在罗马、<b>为神所爱</b>（ἀγαπητοῖς θεοῦ）、奉召作圣徒的众人。」</p><p>（也是天父在约旦河边对子说的那个字：太3:17「这是我的<b>爱子</b>。」）</p><p>弟兄姊妹，暗伯利与士他古没有任何事迹被记下来。</p><p>保罗只说了一句：<b>我爱他</b>。</p><p>而这对一份「记得谁做过什么」的名单，是一个很重要的平衡：</p><p>有些人被记得，是因为他<b>做了什么</b>。<br>有些人被记得，是因为他<b>是谁</b>。</p><p>（附带一提：暗伯利、耳巴奴、士他古都是当时<b>奴隶与释奴常用的名字</b>。<br>而保罗称一位奴隶出身的弟兄为「我在主里面所亲爱的」。）</p><p>★ 亮光七：16:14–15 两个「与他们在一处的」群体</p><p>弟兄姊妹，这两节的结尾都有同一句话：</p><pre>16:14 「并【与他们在一处的】弟兄们安」\n16:15 「同阿林巴并【与他们在一处的】众圣徒安」</pre><p>加上16:5「又问在他们<b>家中的教会</b>安」——</p><p>罗马教会<b>不是一间大教会</b>，</p><p>而是<b>散布在城中各处的几个家庭聚会</b>。</p><p>而16:14、15两组人的名字有一个共同点：</p><p>亚逊其土、弗勒干、黑米、八罗巴、黑马；非罗罗古、犹利亚、尼利亚、阿林巴——</p><p>多是当时<b>奴隶与释奴常见的名字</b>。</p><p>（这是碑铭研究的一般判断。讲台上宜说「在当时是奴隶和释奴常用的名字」，不必给更强的断语。）</p><p>弟兄姊妹，把这两节与16:23放在一起看：</p><p>16:23提到「<b>城内管银库的</b>以拉都」——那是一个<b>公职</b>。</p><p>而16:14–15是两群连名字都像奴隶的人。</p><p>保罗——<b>用同一个词，问他们安</b>。</p><p>★ 亮光八：16:15「尼利亚和他姊妹」</p><p>弟兄姊妹，注意这一句：那位姊妹<b>连名字都没有留下</b>。</p><p>保罗只说：「尼利亚<b>和他姊妹</b>」。</p><p>她在名单上。</p><p>只是我们不知道她叫什么。</p><p>（而那份最终的名单——路10:20「你们的名记录在天上」——上面有。）</p>","exp":"<p>弟兄姊妹，这十节是全本圣经最密集的一份名单。</p><p>而保罗在做的，有三件事：</p><p>① 他记得名字。</p><p>② 他记得<b>他们做过什么</b>——多受劳苦、一同坐监、经过试验、把我当儿子。</p><p>③ 他<b>吩咐罗马教会去问他们安</b>（ἀσπάσασθε 是命令语气）。</p><p>也就是说：保罗不只是自己记得，<br>他要<b>这些名字，在罗马教会里被叫出来</b>。</p><p>而这份名单的组成，本身就是一篇讲道：</p><table><tr><th>面向</th><th>名单里的证据</th></tr><tr><td><b>跨越阶级</b></td><td>暗伯利、耳巴奴、黑米、彼息氏等，<b>是当时奴隶与释奴常用的名字</b></td></tr><tr><td><b>跨越性别</b></td><td>至少九位女性被点名；而 κοπιάω（做苦工）<b>全部用在女性身上</b></td></tr><tr><td><b>跨越族群</b></td><td>犹太名字（马利亚、希罗天）与希腊、拉丁名字并列</td></tr><tr><td><b>跨越有无事迹</b></td><td>有人被记得是因为<b>做了什么</b>；也有人被记得是因为<b>他是谁</b>（16:8、9）</td></tr></table><p><b>经文本身明确表达的：</b> 保罗认识罗马教会中的许多人，并知道他们各自的服事与经历。</p><p><b>可以合理推论的：</b> 十五章的神学，最后长成的样子，就是这样一份名单。<br>神不是在拯救「人类」，祂是在拯救<b>有名字的人</b>。</p>"},{"a":16,"z":16,"star":false,"grk":"<p>ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι πᾶσαι τοῦ Χριστοῦ.</p>","lit":"<p>「你们要<b>用圣洁的亲嘴彼此问安</b>。基督的<b>众教会</b>都问你们安。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>问安</td><td>ἀσπάσασθε</td><td>aspasasthe</td><td>G782</td><td><b>命令语气</b>：你们要问安（见下）</td></tr><tr><td>亲嘴</td><td>φίλημα</td><td>philēma</td><td>G5370</td><td><b>亲吻</b>（φιλέω 的名词形）</td></tr><tr><td>圣洁</td><td>ἅγιος</td><td>hagios</td><td>G40</td><td>分别为圣的</td></tr><tr><td>彼此</td><td>ἀλλήλους</td><td>allēlous</td><td>G240</td><td><b>互相</b>（罗马书出现多次的关键词）</td></tr><tr><td>众教会</td><td>αἱ ἐκκλησίαι πᾶσαι</td><td>—</td><td>G1577</td><td><b>所有的教会</b></td></tr></table>","gram":"<p>★★ 亮光零：一个贯穿全章的动词——ἀσπάζομαι</p><p>弟兄姊妹，这是读第十六章时最容易漏掉、却最能看出结构的一件事。</p><p>「问……安」这个动词（ἀσπάζομαι），在本章出现的<b>语气不同</b>：</p><table><tr><th>段落</th><th>形式</th><th>意思</th></tr><tr><td><b>16:3–16</b></td><td><b>ἀσπάσασθε（命令语气）</b></td><td><b>「你们要去问……安」</b></td></tr><tr><td><b>16:16下、21、23</b></td><td><b>ἀσπάζεται／ἀσπάζονται（直说语气）</b></td><td>「某某人<b>问你们安</b>」</td></tr></table><p>而在16:3–16这一段，命令语气的 ἀσπάσασθε 出现了<b>十六次</b>。</p><p>弟兄姊妹，这个区分很重要：</p><p>保罗<b>不是</b>在说「我向他们问好」。</p><p>他是在<b>吩咐罗马教会</b>：<b>你们要去问他安</b>。</p><p>换句话说：</p><p>保罗在做的，不只是「记得这些人」——</p><p>他在<b>把这些人，介绍给彼此</b>。</p><p>（而16:16正是这一连串命令的收尾：「你们要<b>彼此</b>问安。」）</p><p>★ 亮光一：φίλημα ἅγιον ——「圣洁的亲嘴」</p><p>这是第一世纪的一般问安礼节（颊吻），保罗加上了「<b>圣洁的</b>」。</p><p>弟兄姊妹，重点不在动作的形式（那是文化性的），<br>在于：<b>这是一个家庭式的、身体性的接触</b>——</p><p>发生在一间横跨奴隶与官员、犹太与外邦的教会里。</p><p>★ 亮光二：「基督的<b>众教会</b>都问你们安」</p><p>弟兄姊妹，保罗把整个教会网络的问安，带到罗马。</p><p>他在说：<b>你们不是孤立的</b>。</p><p>【第三段｜16:17–20　警告与应许】</p>","exp":"<p>弟兄姊妹，16:16是那一连串命令的<b>收尾</b>。</p><p>前面十四节，保罗一个一个地说：「问某某安。」</p><p>而到了16节，他说：</p><p>「你们<b>彼此</b>问安。」</p><p>从「去问他安」，变成「<b>你们彼此</b>」。</p><p>而他加的那个形容词很重要：「<b>圣洁的</b>亲嘴」。</p><p>颊吻是当时的一般礼节；<br>保罗没有废掉那个文化形式，他<b>把它分别为圣</b>。</p><p>而下半句把镜头拉远了：</p><p>「<b>基督的众教会</b>都问你们安。」</p><p><b>经文本身明确表达的：</b> 信徒之间要以真实、圣洁的方式彼此问安；而其他教会也向罗马教会问安。</p><p><b>可以合理推论的：</b> 在一间横跨奴隶与官员、犹太与外邦的教会里，<br>「彼此亲嘴问安」是一个<b>身体性的、看得见的和好宣告</b>。</p><p><b>⚠ 牧养提醒：</b> 形式是文化性的（不同文化对身体接触的界线不同），<br>原则却是不变的：<b>这是一家人</b>。今日实行时，仍须顾及安全与合宜的界线。</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ἐκκλίνετε ἀπ' αὐτῶν·<br>18 οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσιν τὰς καρδίας τῶν ἀκάκων.</p>","lit":"<p>17「弟兄们，我劝你们<b>盯紧</b>那些制造<b>分裂</b>与<b>绊脚陷阱</b>、违背你们所学之教训的人；并且<b>要从他们那里转开</b>。」<br>18「因为这样的人<b>不是在服事我们的主基督，乃是服事自己的肚腹</b>；他们借着<b>听起来很良善的话</b>和奉承，<b>彻底欺骗</b>那些心里没有恶的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>留意</td><td>σκοπεῖν</td><td>skopein</td><td>G4648</td><td>σκοπός（目标）</td><td><b>盯着看、留心观察</b></td><td>见下</td></tr><tr><td>离间</td><td>διχοστασίας</td><td>dichostasias</td><td>G1370</td><td>δίχα（分开）+ στάσις</td><td><b>分裂</b></td><td>—</td></tr><tr><td>叫你们跌倒</td><td>σκάνδαλα</td><td>skandala</td><td>G4625</td><td>—</td><td><b>陷阱的机关</b></td><td><b>14:13同字</b></td></tr><tr><td>躲避</td><td>ἐκκλίνετε</td><td>ekklinete</td><td>G1578</td><td>ἐκ + κλίνω（偏转）</td><td><b>转开、避开</b></td><td>—</td></tr><tr><td>花言巧语</td><td>χρηστολογία</td><td>chrēstologia</td><td>G5542</td><td><b>χρηστός（良善的）+ λόγος</b></td><td><b>听起来很好的话</b></td><td><b>新约仅此一次</b></td></tr><tr><td>诱惑</td><td>ἐξαπατῶσιν</td><td>exapatōsin</td><td>G1818</td><td>ἐκ + ἀπατάω</td><td><b>彻底欺骗</b></td><td><b>7:11同字！</b></td></tr><tr><td>老实人</td><td>ἀκάκων</td><td>akakōn</td><td>G172</td><td>ἀ + κακός（恶）</td><td><b>心里没有恶的人</b></td><td>—</td></tr></table>","gram":"<p>★ 亮光一：σκοπέω ——「盯着看」</p><p>这个字的字根是 σκοπός（<b>目标、标的</b>）——英文 scope 的来源。</p><p>弟兄姊妹，保罗<b>没有</b>说「不要理他们」。</p><p>他说：<b>盯着看</b>。</p><p>先看清楚，然后才「转开」（ἐκκλίνω）。</p><p>★★ 亮光二：χρηστολογία ——与2:4「恩慈」同一个字根</p><p>这个字在新约<b>只出现这一次</b>。</p><p>它由 <b>χρηστός（良善的、恩慈的）</b> + λόγος（话）组成。</p><p>而 χρηστός 的名词形 χρηστότης，正是2:4与11:22那个字：</p><pre>2:4    「你藐视他丰富的【恩慈】（χρηστότης）……\n        不晓得他的【恩慈】是领你悔改呢？」\n11:22  「神的【恩慈】（χρηστότης）和严厉」\n   ↓\n16:18  「用【花言巧语】（χρηστολογία）诱惑那些老实人的心」</pre><p>弟兄姊妹，字根一样，性质完全相反：</p><p>神的恩慈是<b>真的</b>，而且<b>领人悔改</b>。<br>他们的「听起来很恩慈的话」是<b>假的</b>，用来<b>诱惑人</b>。</p><p>这是一个很严肃的提醒：</p><p>假的东西，常常长得跟真的<b>很像</b>。</p><p>★★ 亮光三：ἐξαπατάω ——蛇的那个字</p><p>「<b>诱惑</b>那些老实人的心」——ἐξαπατῶσιν。</p><p>而这个字，我们在罗7:11见过：</p><p>7:11「因为罪趁着机会，就借着诫命<b>引诱</b>（ἐξηπάτησέν）我，并且杀了我。」</p><p>而那个字，来自创世记3:13：</p><p><b>「那蛇</b>引诱<b>我，我就吃了。」</b>（七十士译本用同一字根）</p><p>（保罗在林后11:3也用它：「就像<b>蛇用诡诈诱惑了夏娃</b>一样。」）</p><p>弟兄姊妹，保罗在说：</p><p>那些离间的人，用的是<b>蛇的方法</b>。</p><p>★ 亮光四：判准是什么？</p><p>弟兄姊妹，16:17–18给了非常清楚的判准（<b>必须严格遵守，见第二十部分</b>）：</p><table><tr><th>特征</th><th>出处</th></tr><tr><td><b>离间</b>（造成分裂）</td><td>16:17</td></tr><tr><td><b>叫人跌倒</b>（放陷阱）</td><td>16:17</td></tr><tr><td><b>背乎所学之道</b></td><td>16:17</td></tr><tr><td><b>不服事主，只服事自己的肚腹</b></td><td>16:18</td></tr><tr><td><b>用花言巧语诱惑老实人</b></td><td>16:18</td></tr></table><p>弟兄姊妹，注意：判准<b>不是「跟我意见不同」</b>。</p><p>判准是：<b>背离所传的道 ＋ 以分裂为手段 ＋ 以自己为目的</b>。</p><p>★ 亮光五：这与14:1「你们要接纳」不冲突</p><table><tr><th>罗14</th><th>罗16:17–18</th></tr><tr><td>「信心<b>软弱</b>的」</td><td>「<b>离间</b>、<b>叫人跌倒</b>、<b>背乎所学之道</b>的人」</td></tr><tr><td>他仍然「为主」而行、「感谢神」（14:6）</td><td>他「<b>只服事自己的肚腹</b>」（16:18）</td></tr><tr><td><b>接纳</b>（14:1）</td><td><b>留意躲避</b>（16:17）</td></tr></table><p>接纳<b>不等于</b>没有界线。</p>","exp":"<p>弟兄姊妹，读完十四节的问安，我们心里是暖的。</p><p>然后保罗的语气突然变了。</p><p>而这个转折本身，就是一个重要的教导：</p><p>接纳（14:1）——<b>不等于</b>没有界线（16:17）。</p><p>但要看清楚：保罗给的判准<b>极其具体</b>，共五项：</p><pre>① 离间（造成分裂）\n② 叫人跌倒（放陷阱）\n③ 背乎所学之道\n④ 不服事主，只服事自己的肚腹\n⑤ 用花言巧语诱惑老实人</pre><p>而其中第③项是<b>客观的教义标准</b>——「背乎<b>所学之道</b>」。</p><p><b>经文本身明确表达的：</b> 要留心观察并避开那些背离所传之道、以分裂为手段、以自己为目的的人。</p><p><b>可以合理推论的：</b> 判准<b>不是「跟我意见不同」</b>。<br>罗14要接纳的是「信心软弱的」——他仍然「为主」而行、并「感谢神」（14:6）；<br>而罗16:18这种人「<b>不服事主，只服事自己的肚腹</b>」。<br>这是两种完全不同的人。</p><p><b>⚠ 牧养提醒：</b> 这一节在教会史上被误用来排除异己。<br>使用它之前，请先诚实地逐条对照那五个判准。</p>"},{"a":19,"z":20,"star":true,"grk":"<p>19 …θέλω δὲ ὑμᾶς σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.<br>20 ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει.</p>","lit":"<p>19「你们的<b>顺服</b>已经传到众人那里，所以我为你们欢喜；但我愿意你们<b>在善上有智慧，在恶上未经掺杂</b>。」<br>20「而<b>赐平安的神</b>，快要把撒但<b>压碎在你们的脚下</b>。愿我们主耶稣的恩，与你们同在。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>顺服</td><td>ὑπακοή</td><td>hypakoē</td><td>G5218</td><td><b>在底下听</b>（<b>1:5、16:26同字</b>）</td></tr><tr><td>聪明</td><td>σοφός</td><td>sophos</td><td>G4680</td><td>有智慧的</td></tr><tr><td>愚拙</td><td>ἀκέραιος</td><td>akeraios</td><td>G185</td><td>ἀ + κεράννυμι（混杂）：<b>未经混杂的、纯真的</b></td></tr><tr><td>践踏</td><td>συντρίψει</td><td>syntripsei</td><td>G4937</td><td><b>压碎、击碎</b></td></tr><tr><td>快要</td><td>ἐν τάχει</td><td>en tachei</td><td>G5034</td><td><b>迅速地</b></td></tr></table>","gram":"<p>★ 亮光一：ὑπακοή（16:19「顺服」）——全书的框</p><pre>1:5    「叫人为他的名【信服真道】（ὑπακοὴν πίστεως）」\n16:19  「你们的【顺服】（ὑπακοή）已经传于众人」\n16:26  「使他们【信服真道】（ὑπακοὴν πίστεως）」</pre><p>★ 亮光二：ἀκέραιος ——「未经混杂的」</p><p>这个字的字面是「<b>没有掺杂</b>」（如未掺水的酒、未掺杂质的金属）。</p><p>而主耶稣用同一个字：</p><p>太10:16「你们要<b>灵巧</b>像蛇，<b>驯良</b>（ἀκέραιοι）像鸽子。」</p><p>弟兄姊妹，「在恶上愚拙」不是「笨」，<br>是<b>在恶的事上不沾</b>——<b>干干净净，没有掺杂</b>。</p><p>★★ 亮光三：16:20回到创世记3:15</p><p>「赐平安的神快要将撒但<b>践踏</b>（συντρίψει）在你们脚下。」</p><p>而创世记3:15说：</p><p>「女人的后裔要<b>伤你的头</b>。」</p><p>弟兄姊妹，保罗在信的最后，把读者带回到<b>圣经最古老的那个应许</b>。</p><p>而请注意16:18与16:20的连结：</p><pre>16:18  他们用【蛇的方法】（ἐξαπατάω）诱惑人\n   ↓\n16:20  而那条【蛇】，快要被踩碎了</pre><p>★ 亮光四：「在<b>你们</b>脚下」</p><p>弟兄姊妹，注意保罗<b>没有</b>说「在基督的脚下」。</p><p>他说：「在<b>你们</b>脚下。」</p><p>这与前面各章一致：</p><pre>5:17  「要在生命中【作王】」\n8:37  「已经【得胜有余】了」\n16:20 「撒但……在【你们】脚下」</pre><p>★ 亮光五：「赐平安的神」</p><pre>15:33  「愿【赐平安的神】常和你们众人同在」\n16:20  「【赐平安的神】快要将撒但践踏在你们脚下」</pre><p>弟兄姊妹，两节连着看很有意思：</p><p>同一位「赐平安的神」——<br>一面<b>与你们同在</b>，一面<b>把撒但踩碎</b>。</p><p>平安不是消极的，是<b>得胜之后的平安</b>。</p><p>【第四段｜16:21–24　同工的问安】</p>","exp":"<p>弟兄姊妹，警告之后，保罗做了两件事。</p><p>第一，他先肯定他们（16:19上）：「你们的<b>顺服</b>已经传于众人。」</p><p>他不是在骂人。他是在保护一群本来就好的人。</p><p>第二，他给了一个很平衡的期待：</p><p>「在善上<b>聪明</b>，在恶上<b>愚拙</b>。」</p><p>而「愚拙」（ἀκέραιος）的字面是「<b>未经掺杂的</b>」——</p><p>主耶稣用同一个字：「灵巧像蛇，<b>驯良</b>（ἀκέραιοι）像鸽子。」（太10:16）</p><p>不是叫人变笨，是叫人<b>在恶的事上干干净净、不沾</b>。</p><p>然后是16:20——而这一节，紧接在16:18之后读，才看得出保罗的安排：</p><pre>16:18  他们用【蛇的方法】（ἐξαπατάω ＝ 创3:13「那蛇引诱我」）\n   ↓\n16:20  而那条【蛇】，快要被【压碎】（συντρίβω ＝ 创3:15「伤你的头」）</pre><p><b>经文本身明确表达的：</b> 神很快要将撒但践踏在信徒脚下。</p><p><b>可以合理推论的：</b> 保罗在信的最后，把读者带回<b>圣经最古老的那个应许</b>（创3:15）。<br>而他说的是「在<b>你们</b>脚下」，不是「在基督的脚下」——这与5:17「要在生命中作王」、8:37「得胜有余」一致。</p><p><b>⚠ 讲台诚信：</b> 「快要」（ἐν τάχει）不可用来推算任何时间表。保罗的重点是<b>确定性</b>，不是时刻表。</p>"},{"a":21,"z":24,"star":true,"grk":"<p>21 Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.<br>22 ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.<br>23 ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ὅλης τῆς ἐκκλησίας. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.</p>","lit":"<p>21「我的<b>同工</b>提摩太问你们安；我的亲属路求、耶孙、所西巴德也问你们安。」<br>22「<b>我，德丢——就是那写下这封信的</b>——在主里问你们安。」<br>23「该犹问你们安——他是<b>我的东道主，也是全教会的</b>。城里的<b>财务管理者</b>以拉都，和弟兄括土，问你们安。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>问你们安</td><td>ἀσπάζεται</td><td>aspazetai</td><td>G782</td><td><b>直说语气</b>：某人问你们安（↔ 16:3–16的<b>命令语气</b>）</td></tr><tr><td>代笔写信的</td><td>ὁ γράψας τὴν ἐπιστολήν</td><td>—</td><td>G1125</td><td><b>那写下这封信的</b></td></tr><tr><td>接待</td><td>ξένος</td><td>xenos</td><td>G3581</td><td><b>主人／客人</b>（见下）</td></tr><tr><td>管银库的</td><td>οἰκονόμος τῆς πόλεως</td><td>oikonomos</td><td>G3623</td><td><b>城市的财务管理者</b></td></tr></table>","gram":"<p>★★ 亮光一：德丢的那一句（16:22）</p><p>「我这<b>代笔写信的德丢</b>，在主里面问你们安。」</p><p>弟兄姊妹，这是新约中极罕见的一句话：</p><p>一个代笔的人，在别人的信里，<b>探出头来说了一句话</b>。</p><p>想像那个场景：</p><p>保罗在口述。德丢在写。</p><p>十六章。几个小时，甚至几天。</p><p>然后写到问安的部分，保罗可能停了一下——</p><p>而德丢说：「我可以也问个安吗？」</p><p>弟兄姊妹，保罗让那个<b>帮他写字的人</b>，</p><p>在他自己的书信里，<b>留下名字</b>。</p><p>★ 亮光二：ξένος（16:23「接待」）</p><p>这个字很有意思：它同时可以指「<b>客人</b>」与「<b>主人</b>」。</p><p>在此指「<b>东道主</b>」。</p><p>而保罗说该犹不只接待他，还「接待<b>全教会</b>」——</p><p>意思可能是：教会在他家聚会。</p><p>（比较林前1:14：保罗提到他在哥林多为「该犹」施洗。）</p><p>★ 亮光三：以拉都——「城内管银库的」</p><p>οἰκονόμος τῆς πόλεως ——<b>城市的财务管理者</b>。</p><p>弟兄姊妹，这一节显示：</p><p>在同一封信里被问安的人当中，有奴隶出身的信徒，也有城市的公职人员。</p><p>（关于哥林多出土的「以拉都」铺道铭文，见第二十部分——<b>学者有不同看法</b>。）</p><p>★ 亮光四：关于16:24</p><p>部分抄本在此有一节16:24（「愿我主耶稣基督的恩常和你们众人同在。阿们！」）。</p><p>多数现代学者认为这是抄写员从16:20重复而来。</p><p>这不影响任何教义（16:20已有相同的话）。<br>讲台上不必提。</p><p>【第五段｜16:25–27　★ 颂赞】</p>","exp":"<p>弟兄姊妹，这几节看起来只是附带的问安。</p><p>但这里有两件事值得停下来。</p><p>第一，语气换了。</p><p>前面16:3–16是<b>命令语气</b>（你们要去问他安）；<br>到了这里是<b>直说语气</b>（某某人问你们安）。</p><p>保罗在做的是<b>把两边接起来</b>：</p><p>哥林多这边的同工，向罗马那边的弟兄姊妹问安。</p><p>第二，德丢那一句（16:22）。</p><p>在第一世纪，长信通常由<b>专业的代笔者</b>书写。保罗口述，德丢一笔一笔地写。</p><p>而写到问安的部分——</p><p>这个代笔的人，<b>在别人的信里探出头来，说了一句话</b>。</p><p>而名单的组成也值得注意：</p><table><tr><th>人</th><th>身分</th></tr><tr><td>提摩太</td><td>保罗的<b>同工</b></td></tr><tr><td>德丢</td><td><b>代笔者</b></td></tr><tr><td>该犹</td><td><b>东道主</b>（教会可能在他家聚会）</td></tr><tr><td><b>以拉都</b></td><td><b>城内管银库的——公职人员</b></td></tr></table><p><b>经文本身明确表达的：</b> 保罗身边的同工向罗马教会问安；其中包括代笔的德丢。</p><p><b>可以合理推论的：</b> 保罗让那个<b>帮他写字的人</b>，在他自己的书信里<b>留下名字</b>。<br>圣经的「无己」不是「消灭名字」，是「<b>不为自己争名字，却很认真地记得别人的名字</b>」。</p><p><b>关于第24节：</b> 部分抄本有此节，多数现代学者认为是抄写员从16:20重复而来。<br>这不影响任何教义（16:20已有相同的话），讲台上不必主动提；若被问，诚实说明这是抄本传递的正常现象。</p>"},{"a":25,"z":27,"star":true,"grk":"<p>25 Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,<br>26 φανερωθέντος δὲ νῦν διά τε γραφῶν προφητικῶν κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,<br>27 μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>25「愿荣耀归与<b>那位能使你们站稳的</b>——照着我所传的福音、所宣讲的耶稣基督，照着那<b>永古被保持沉默的奥秘</b>的启示；」<br>26「这奥秘<b>如今却已显露出来</b>，并且照着永生神的命令，借着<b>众先知的书</b>，向<b>万国</b>显明，为要使他们<b>信心的顺服</b>——」<br>27「愿荣耀，<b>借着耶稣基督</b>，归与<b>独一智慧的神</b>，直到永远。阿们。」</p><p>（附注：25–27节在原文是<b>一个很长的句子</b>，主要动词在27节的颂赞上；中文译本为求可读，作了拆分。）</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>坚固</td><td>στηρίξαι</td><td>stērixai</td><td>G4741</td><td><b>使之站稳、扶立</b>（<b>1:11同字！</b>）</td></tr><tr><td>隐藏不言</td><td>σεσιγημένου</td><td>sesigēmenou</td><td>G4601</td><td><b>σιγάω ＝ 保持沉默</b>（完成被动分词）</td></tr><tr><td>奥秘</td><td>μυστήριον</td><td>mystērion</td><td>G3466</td><td><b>从前隐藏、如今被启示的</b>（11:25同字）</td></tr><tr><td>显明</td><td>φανερωθέντος</td><td>phanerōthentos</td><td>G5319</td><td><b>被显露出来</b>（<b>3:21同字！</b>）</td></tr><tr><td>信服真道</td><td>εἰς ὑπακοὴν πίστεως</td><td>—</td><td>—</td><td><b>以致于信心的顺服</b>（<b>1:5同词组！</b>）</td></tr><tr><td>独一全智</td><td>μόνῳ σοφῷ</td><td>monō sophō</td><td>G3441/G4680</td><td><b>独一智慧的</b></td></tr></table>","gram":"<p>★★ 亮光一：στηρίζω ——第一章那个字</p><pre>1:11   「因为我切切地想见你们，要把些属灵的恩赐分给你们，\n        使你们可以【坚固】（στηριχθῆναι）」\n   ↓ 十六章\n16:25  「【惟有神能】……【坚固】（στηρίξαι）你们的心」</pre><p>弟兄姊妹，这是全卷书最动人的一组呼应：</p><p>第一章：「<b>我想去</b>坚固你们。」</p><p>第十六章：「<b>惟有神能</b>坚固你们的心。」</p><p>那是<b>一卷书的距离</b>。</p><p>★★ 亮光二：εἰς ὑπακοὴν πίστεως ——全卷书的框</p><p>这个词组在罗马书<b>只出现两次</b>：</p><pre>1:5    「在万国之中叫人为他的名【信服真道】」\n16:26  「指示万国的民，使他们【信服真道】」</pre><p>弟兄姊妹，保罗用同一个词组，把整卷书<b>框起来</b>。</p><p>十六章的神学，一头一尾写着同一句话：</p><p>「<b>信心的顺服</b>」。</p><p>★ 亮光三：φανερόω ——第三章那个字</p><pre>3:21   「但如今，神的义在律法以外已经【显明】（πεφανέρωται）出来」\n16:26  「这奥秘如今【显明】（φανερωθέντος）出来」</pre><p>★ 亮光四：σιγάω ——「那个奥秘沉默了很久」</p><p>「永古<b>隐藏不言</b>的奥秘」——σεσιγημένου，字面是「<b>被保持沉默</b>」。</p><p>弟兄姊妹，这个字很美：</p><p>那个奥秘，<b>安静了好几个世代</b>。</p><p>然后——如今显明出来了。</p><p>★ 亮光五：最后一个介词短语</p><p>「愿荣耀<b>因耶稣基督</b>（διὰ Ἰησοῦ Χριστοῦ）归与独一全智的神。」</p><p>弟兄姊妹，这与11:36完全一致：</p><p>11:36「因为万有都是<b>本于他，倚靠他，归于他</b>。愿荣耀归给他。」</p><p>荣耀归给神——<b>而通道是耶稣基督</b>。</p>","exp":"<p>弟兄姊妹，罗马书的最后三节，把整卷书收拢了：</p><pre>「惟有神能坚固你们」（16:25）    ← 呼应 1:11\n「照我所传的福音」（16:25）      ← 呼应 1:1、1:16\n「奥秘如今显明」（16:25–26）     ← 呼应 3:21、11:25\n「藉众先知的书」（16:26）        ← 呼应 1:2\n「使万国信服真道」（16:26）      ← 呼应 1:5\n「愿荣耀……归与神」（16:27）     ← 呼应 11:36</pre><p>弟兄姊妹，这不是一个随手写的结尾。</p><p>这是一个<b>回到起点的结尾</b>。</p>"}]},"tracks":[{"id":"T1","gk":"οἰκέω","tr":"oikeō","gl":"居住、定居","code":"G3611","root":"οἶκος（房子）","head":"同一个字。不同的住客。","lv":"g","stops":[["7:17","罪住在我里头","dark"],["7:18","我里头没有良善居住","dark"],["7:20","罪住在我里头","dark"],["8:9","神的灵住在你们心里","light"],["8:11","叫耶稣复活者的灵住在你们心里","light"]],"ins":"第七章到第八章的全部差别，就是住在里面的那一位换了。"},{"id":"T2","gk":"λογίζομαι","tr":"logizomai","gl":"算、记帐","code":"G3049","root":"商业记帐用语","head":"神算 → 你算 → 我算","lv":"g","stops":[["4:3","神算亚伯拉罕为义（被动·直说）","light"],["6:11","你要算自己是死的（命令）","light"],["8:18","我算：苦楚比不上荣耀（保罗示范）","light"]],"ins":"保罗不只下命令，他自己也在算。"},{"id":"T3","gk":"κυριεύω","tr":"kyrieuō","gl":"作主、掌权","code":"G2961","root":"κύριος（主）","head":"四个主人，一个王座","lv":"g","stops":[["6:9","死不再作主了","dark"],["6:14","罪必不能作你们的主","dark"],["7:1","律法管人是在活着的时候","dark"],["14:9","基督作死人并活人的主","light"]],"ins":"罗马书一路在拆掉各种「主」；而那个空出来的位置，有人坐上去了。"},{"id":"T4","gk":"βαστάζω","tr":"bastazō","gl":"扛起重量、承载","code":"G941","root":"也用于太8:17「担当我们的疾病」","head":"你曾经是被扛的，所以现在换你去扛。","lv":"g","stops":[["11:18","不是你托着根，乃是根托着你","light"],["15:1","坚固的人应该担代不坚固人的软弱","light"]],"ins":"谦卑不是放弃力量，是改变力量的方向。"},{"id":"T5","gk":"παρίστημι","tr":"paristēmi","gl":"献上、站在旁边","code":"G3936","root":"παρά（旁边）＋ἵστημι（站）","head":"现在献上，将来站立。","lv":"g","stops":[["6:13","将自己献给神","light"],["12:1","将身体献上，当作活祭","light"],["14:10","我们都要站在神的台前","light"],["16:2","你们就帮助她（站到她旁边去）","light"]],"ins":"你现在献上自己；将来你要站在祂面前。是同一个动作的两个时态。"},{"id":"T6","gk":"χρηστότης／χρηστολογία","tr":"chrēstotēs / chrēstologia","gl":"恩慈／花言巧语","code":"G5544 / G5542","root":"同一个字根 χρηστός（良善的）","head":"字根一样，性质相反。","lv":"g","stops":[["2:4","神的恩慈是领你悔改的","light"],["11:22","神的恩慈和严厉","light"],["16:18","用花言巧语诱惑那些老实人的心","dark"]],"ins":"假的东西，常常长得跟真的很像。"},{"id":"T7","gk":"ἐξαπατάω → συντρίβω","tr":"exapataō → syntribō","gl":"引诱 → 践踏","code":"G1818 / G4937","root":"创3:13「那蛇引诱我」／创3:15「伤你的头」","head":"蛇的方法，与蛇的结局。","lv":"g","stops":[["7:11","罪借着诫命引诱我","dark"],["16:18","他们用花言巧语诱惑人","dark"],["16:20","赐平安的神快要将撒但践踏在你们脚下","light"]],"ins":"那些离间的人用的是蛇的方法——而那条蛇，快要被踩碎了。"},{"id":"T8","gk":"ὅπλα","tr":"hopla","gl":"兵器、军械","code":"G3696","root":"军事用语","head":"肢体是兵器；而兵器要穿上身。","lv":"g","stops":[["6:13","将肢体作义的兵器献给神","light"],["13:12","带上光明的兵器","light"]],"ins":"第六章：你的肢体是兵器。第十三章：那些兵器要穿上身。"},{"id":"T9","gk":"εἰς ὑπακοὴν πίστεως","tr":"eis hypakoēn pisteōs","gl":"信服真道（信心的顺服）","code":"G5218 / G4102","root":"全卷书仅两次","head":"一头，一尾。把整卷书框起来。","lv":"g","stops":[["1:5","在万国之中叫人为他的名信服真道","light"],["16:26","指示万国的民，使他们信服真道","light"]],"ins":"十六章的神学，一头一尾写着同一句话。"},{"id":"T10","gk":"στηρίζω","tr":"stērizō","gl":"坚固、使之站稳","code":"G4741","root":"","head":"一卷书的距离。","lv":"g","stops":[["1:11","要把恩赐分给你们，使你们可以坚固","dark"],["16:25","惟有神能坚固你们的心","light"]],"ins":"从「我想去坚固你们」到「惟有神能坚固你们」——那是一卷书的距离。"},{"id":"T11","gk":"διαστολή","tr":"diastolē","gl":"分别、划界线","code":"G1293","root":"","head":"在罪面前没有分别；在恩典面前也没有分别。","lv":"g","stops":[["3:22","并没有分别——因为众人都犯了罪","dark"],["10:12","并没有分别——因为众人同有一位主","light"]],"ins":"全卷书最美的一组对称。"},{"id":"T12","gk":"προσλαμβάνω","tr":"proslambanō","gl":"接纳（接到自己这里来）","code":"G4355","root":"πρός＋λαμβάνω","head":"神已经收了，那你凭什么不收？","lv":"g","stops":[["14:1","你们要接纳信心软弱的","light"],["14:3","因为神已经收纳他了","light"],["15:7","你们要彼此接纳，如同基督接纳你们一样","light"]],"ins":"那个「如同」——祂接纳你的那一天，你不是全对的。"}],"issues":[{"id":"ISS01","t":"罗七章的「我」是谁？","r":"7:14–25","ch":[7],"why":"7:7–13是过去式，7:14–25突然转为现在式，而且一直维持到底。","pos":[["重生的信徒","奥古斯丁晚年、路德、加尔文","7:14–25全是现在式；7:22「由衷欢喜」↔8:7「不能服」"],["未重生的人","早期教父多数、Wesley","7:14「卖给罪」↔6:18「得了释放」；7:23「被掳去」↔8:2「释放了我」"],["修辞性的「我」＝亚当／以色列","Käsemann、Dunn、Wright","7:11 ἐξαπατάω ＝ 创3:13"],["任何靠律法追求圣洁的人","综合性读法","两边的论据都能解释"]],"con":["靠自己守律法，结局就是7:24","出路不是一个方法，是一位（7:25；8:1–4）","那个挣扎本身是生命的证据——死人不会觉得痛"],"say":"历代敬虔的解经家对这个「我」有不同看法。但两边都同意一件事：靠自己守律法，结局就是7:24。","care":"若把7:14–25全读成未重生，会使正在挣扎的信徒怀疑自己的救恩。结尾必须给出第八章的方向。"},{"id":"ISS02","t":"预定与拣选","r":"9:6–24","ch":[9,8],"why":"9:11说「不在乎人的行为，乃在乎召人的主」；而9:32又说「他们不凭信心求」。","pos":[["预知＝拣选之爱","改革宗","受词是人（οὕς），不是他们的信；旧约 יָדַע 常带拣选之爱（摩3:2；耶1:5）"],["预知＝预见人的信","亚米念／卫斯理传统","προγινώσκω 字面即「预先知道」；保罗在10:9–13强调人的回应"]],"con":["这条链子的每一环，主词都是神","没有一环是靠我完成的","人必须真实地相信与回应（10:9–13）"],"say":"历代敬虔的信徒在「预知」的意思上有不同看法。但两边都同意：这条链子的每一环，主词都是神。","care":"★ 9:22–23的原文语法是不对称的：毁灭用被动式且未指明施动者，荣耀用主动式且主词是神。保罗刻意没有把两边讲成对称。"},{"id":"ISS03","t":"「以色列全家都要得救」","r":"11:26","ch":[11],"why":"9:6说「从以色列生的不都是以色列人」；11:26却说「以色列全家都要得救」。","pos":[["未来民族性的归主","时代论与部分改革宗","本章的「以色列」一贯指血统上的以色列；11:12「丰满」、11:15「收纳」"],["历世历代蒙拣选的犹太人之总数","部分改革宗","οὕτως 的基本意义是「方式」而非「时间」；与11:5「余数」一致"],["「以色列」＝神的子民（含教会）","加尔文等","9:6；加6:16「神的以色列」"]],"con":["神没有弃绝祂的百姓（11:1）","神的恩赐和选召是没有后悔的（11:29）","无论哪一种，11:18的警告都一样：你不可向旧枝子夸口"],"say":"这一节历代有不同的理解。但无论哪一种，保罗要对外邦信徒说的话都是同一句：不可自高。","care":"❌❌ 本章讲的是救恩历史，不是现代政治。绝不可用它为任何当代政权背书或攻击。"},{"id":"ISS04","t":"顺服掌权者的界线","r":"13:1–7","ch":[13],"why":"13:1说「人人当顺服」；而徒5:29说「顺从神，不顺从人，是应当的」。","pos":[["顺服为原则，抗命为例外","多数福音派的共识","当政权命令犯罪或禁止顺服神时，必须不从，但仍承受后果"],["次级官长论","加尔文《要义》IV.20.31","个人不可造反，但较低层级的合法官长有责任抵抗上级的暴政"],["和平主义／不合作","重洗派传统","抗命必须以非暴力的方式"]],"con":["13:3–4是功能性的描述：赏善、罚恶——那既是政府的职分，也是衡量它的标准","保罗用的字是 ὑποτάσσω（顺服秩序），不是 ὑπακούω（凡事照做）","写13:1的保罗自己曾据理力争（徒16:37）、提出公民权（徒22:25）、上告凯撒（徒25:11）"],"say":"这段经文教导我们顺服神所排定的秩序；但同一本圣经也说：「顺从神，不顺从人，是应当的。」（徒5:29）","care":"❌❌ 历史上这段经文曾被用来为奴隶制度、种族隔离、极权政权背书。绝不可为任何特定的当代政权背书或攻击。"},{"id":"ISS05","t":"可争议之事的界线在哪？","r":"14:1–23","ch":[14,15],"why":"罗14说「你们要接纳」；而加2:11保罗当面抵挡彼得，林前5说「把那恶人赶出去」。","pos":[["福音的核心真理","绝不让步","加2:11–14；加1:8–9「就应当被咒诅」"],["明显而不悔改的罪","必须处理","林前5:1–13「把那恶人从你们中间赶出去」"],["可争议的事","接纳、不论断、为弟兄放下","罗14；罗15:7；林前8–10"]],"con":["判准之一：在这件事上持不同看法的人，是否仍然「为主」而行、并「感谢神」（14:6）","罗16:17的判准是「背乎所学之道」＋「只服事自己的肚腹」，不是「跟我意见不同」","宁可在界线的判断上谦卑，也不要轻易把弟兄推出去"],"say":"保罗有三种处理方式：核心真理绝不让步；明显的罪必须处理；而可争议的事——接纳。","care":"不宜在讲台上点名具体争议，会使会众对号入座，反而制造新的分裂。"},{"id":"ISS06","t":"非比与犹尼亚","r":"16:1、16:7","ch":[16],"why":"16:1称非比为 διάκονος；16:7说犹尼亚「在使徒中是有名望的」。","pos":[["犹尼亚是女性","今日多数学者的判断","「Junia」是常见的女性名；作为男性名的「Junias」在古代文献中几乎没有证据；屈梭多模明确视为女性"],["「在使徒中间是有名望的」","一种读法","他们本身是使徒（和合本较接近此读法）"],["「为使徒们所熟知的」","另一种读法","他们不是使徒，但使徒们都认识他们"]],"con":["非比在坚革哩教会中有实际的服事地位","她很可能是送这封信的人（16:1–2是推荐信的格式）","保罗高度尊重她们，并且记得她们做过什么","安多尼古与犹尼亚是保罗的亲属、与他一同坐监、比他更早在基督里"],"say":"犹尼亚很可能是一位女性；而她与安多尼古「在使徒中是有名望的」——这句话的确切意思，敬虔的学者有不同理解。","care":"不同宗派对女性职分的看法不同。可以说明自己教会的立场，但不宜宣称「经文明明说她是（或不是）执事」。"},{"id":"ISS07","t":"守日与安息日","r":"14:5","ch":[14],"why":"保罗说「有人看这日比那日强；有人看日日都是一样」，却没有裁决。","pos":[["主日／安息日仍有规范性","十诫是道德律","14:5指的是犹太的节期与禁食日，不含第四诫"],["一切日子皆同","保罗把「日子」列为可争议之事","西2:16–17「在节期、月朔、安息日……原是后事的影儿」"],["中间立场","原则永存，形式已成全","安息（安息、敬拜）的原则永存，但其旧约形式已在基督里成全"]],"con":["保罗在此没有裁决——他说：「各人心里要意见坚定。」（14:5）","这件事本身正好示范了本章的原则：连保罗都不定案的事，我们更该用14:1的态度"],"say":"这件事保罗自己没有定案。他只说：各人心里要意见坚定。","care":"可以说明自己教会的实践，但不宜宣告持不同看法的信徒违背圣经。"}],"terrain":{"points":[[1,52,"1:18","忿怒显明","low"],[3,88,"3:20","每一张嘴","bot"],[3.5,18,"3:21","但如今","top"],[5,26,"5:8","何况",""],[7,92,"7:24","我真是苦啊","bot"],[8,8,"8:1","如今","top"],[11,20,"11:33","深哉","top"],[12,42,"12:1","所以",""],[15,38,"15:7","彼此接纳",""],[16,30,"16:27","荣耀归神","top"]]},"serm":{"1":{"min":35,"blocks":[["h","我不以福音为耻"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","在我们读经文之前，我想先请你在心里回答一个问题。不用说出来，就在心里。"],["p","如果失去某一样东西，你的人生就会崩塌——那是什么？"],["p","想到了吗？请你先把它放在心里。今天早上结束之前，我们会再回来看它。"],["w",3],["p","我先讲一个故事。这故事我听人说过好几个版本，所以我不敢说它是真人真事，但它说的道理是真的。"],["p","有一位老先生，家里客厅挂着一幅画，是祖父留下来的。画框有点旧，颜色有点暗。有一天他嫌它老气，就去市场买了一幅颜色鲜艳、看起来时髦的印刷画挂上去，把旧的那幅拿去二手店换了一点钱。"],["p","几年以后，一位懂画的朋友来作客，看见墙上那幅新画，问他：「你以前那幅呢？」"],["p","老先生说：「太旧了，换掉了。」"],["p","朋友愣了很久，才轻声说：「那是真迹。」"],["p","弟兄姊妹，你能体会那一刻的感觉吗？不是被偷、不是被抢——是他自己换掉的。他亲手把真的换成假的，而且当时还觉得自己很聪明。"],["p","今天我们要读的罗马书第一章，讲的就是这样的交换。而且不只一场，是三场。"],["w",3],["p","保罗在这一章写下一句我们都很熟的话：「我不以福音为耻。」"],["p","我们常把这句话读成一句口号，好像保罗在振臂高呼。可是你想想，一个人为什么要特别声明「我不以某件事为耻」？"],["p","因为那件事，在当时看起来就是可耻的。"],["p","这封信是要寄到罗马——当时世界的首都，一百万人口的大城，帝国的心脏。而保罗要传的信息是什么？是一个在帝国边陲的小行省、被罗马人用十字架处死的犹太木匠。"],["p","十字架在当时是什么？那是留给奴隶和叛乱者的极刑。罗马最有名的演说家西塞罗曾经说过，这个字连让罗马公民听见都不合适。"],["p","在罗马的帕拉丁山，考古学家曾挖出一幅古代的涂鸦——年代大约在主后二、三世纪。上面画着一个被钉十字架的人，却长着一颗驴头；旁边一个人举起手，底下写着一行字：「亚历山米诺敬拜他的神。」"],["p","这就是那个世界看基督徒的眼光：荒谬、可笑、可耻。"],["p","而保罗说：我不以为耻。"],["p","今天早上，我想陪大家看这一章里的三场交换。"],["w",3],["h","第一大段｜人换掉了神（1:18–32）"],["p","我们先看一件事。"],["p","第16、17、18节，这三节在原文里是被三个「因为」串起来的。"],["p","保罗说：我不以福音为耻——因为它是神的大能。\n它是神的大能——因为神的义在它上面显明。\n神的义必须显明——因为（第18节）神的忿怒已经显明了。"],["p","弟兄姊妹，这就是
