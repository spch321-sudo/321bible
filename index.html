ngly</td><td>Arminian / Wesleyan</td></tr></table><p><b>Main grounds for the first reading:</b><br>· The object is <b>people</b> (οὕς, “those whom”), not “their faith”<br>· The Hebrew <b>yada‘</b> often carries the sense of <b>covenant love</b> (Amos 3:2; Jeremiah 1:5)<br>· Throughout the chain of 8:29–30, <b>God is the subject of every verb</b></p><p><b>Main grounds for the second reading:</b><br>· προγινώσκω does plainly mean “to know beforehand”<br>· Paul elsewhere stresses the faith that responds (10:9–13)</p><p><b>Pulpit note:</b> this is one of the deepest divisions within evangelicalism since the Reformation. This edition takes the first reading (for the reasons above), but <b>you must say that godly believers hold the other</b>, and you must not belittle either side.</p><p>And what both sides agree on: <b>every link in this chain has God as its subject; not one link is completed by me.</b></p><p><b>★ Third light: the definition of “the good”</b></p><p>8:29 states it plainly. What is predestined is — <b>“conformed to the image of his Son” (συμμόρφους τῆς εἰκόνος)</b>.</p><p>σύμμορφος = having the same form as.<br>(Philippians 3:21, “who will transform the body of our humiliation to be <b>conformed</b> to the body of his glory” — same word.)</p><p>God has not predestined that <b>your life will go smoothly</b>. God has predestined that <b>you will be like his Son</b>.</p><p><b>★ Fourth light: prōtotokos — the firstborn</b></p><p>“That he might be the firstborn among many brothers.” This clause is <b>the purpose</b> of the whole golden chain.</p><p>God does all of this so that, in the end, <b>his Son is at the centre of a large family</b> — not so that I get a good outcome.</p>","exp":"<p>8:29–30 is often called the <b>golden chain</b>, because the five links are welded shut.</p><pre>foreknew → predestined → called → justified → glorified</pre><p>And the most important observation is this: <b>God is the subject of all five verbs.</b></p><p>Not one link says “and then you must try hard.”<br>Both ends of the chain are in God’s hands — and there is no broken link in the middle.</p>"},{"a":31,"z":32,"star":true,"grk":"<p>31 Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ' ἡμῶν? 32 ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο ἀλλ' ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;</p>","lit":"<p>31 “What then shall we say to these things? If God is <b>on our side</b>, who can be <b>against us</b> (on the other side)?”</p><p>32 “He who <b>did not withhold</b> his own Son, but <b>handed him over</b> for us all — how will he not, <b>together with him</b>, also <b>freely give us</b> all things?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>for us</td><td>ὑπὲρ ἡμῶν</td><td>hyper hēmōn</td><td>G5228</td><td>—</td><td><b>on our side</b> (more than “helping”)</td><td>see below</td></tr><tr><td>against us</td><td>καθ' ἡμῶν</td><td>kath' hēmōn</td><td>G2596</td><td>κατά</td><td><b>on the opposite side</b></td><td>courtroom / battlefield</td></tr><tr><td>did not spare</td><td>οὐκ ἐφείσατο</td><td>ouk epheisato</td><td>G5339</td><td>φείδομαι (to spare, withhold)</td><td><b>did not withhold</b></td><td>★★ see below</td></tr><tr><td>delivered up</td><td>παρέδωκεν</td><td>paredōken</td><td>G3860</td><td>παρά + δίδωμι</td><td><b>handed over</b></td><td>same word as 4:25</td></tr><tr><td>freely give</td><td>χαρίσεται</td><td>charisetai</td><td>G5483</td><td>χάρις (grace)</td><td><b>to give as a gift of grace</b></td><td>—</td></tr></table>","gram":"<p><b>★★ First light: ouk epheisato — the echo of Mount Moriah</b></p><p>“He who <b>did not spare</b> his own Son” — οὐκ ἐφείσατο.</p><p>Now look at Genesis 22:12 in the Septuagint, where the angel speaks to Abraham:</p><p>“…for now I know that you fear God, seeing you have <b>not withheld your son, your only son, from me</b> (οὐκ ἐφείσω τοῦ υἱοῦ σου τοῦ ἀγαπητοῦ).”</p><p>And God says it again in Genesis 22:16: “because you have done this thing, and have <b>not withheld your son</b> (οὐκ ἐφείσω τοῦ υἱοῦ σου), your only son…”</p><p><b>The same verb: pheidomai.</b></p><p>That is precisely the word Paul uses in Romans 8:32.</p><p>On Mount Moriah, God said to Abraham: “You <b>did not withhold</b> your son.”<br>In Romans 8:32, Paul says to us: “God <b>did not withhold</b> his own Son.”</p><p>And between the two mountains there is one decisive difference:</p><pre>Moriah:   the knife was raised — then “do not lay a hand on him” (Gen 22:12) — the knife stopped\nCalvary:  the knife was raised — no voice called out            — the knife did not stop</pre><p>On Moriah a ram took Isaac’s place.<br>At Calvary <b>nothing took his place</b>. Because <b>he was</b> the ram.</p><p><b>★ Second light: hyper / kata — this side and that side</b></p><p>“For us” and “against us” in 8:31 are two prepositions:</p><pre>ὑπὲρ ἡμῶν  —  on our side\nκαθ' ἡμῶν  —  on the side opposite us</pre><p>Paul is drawing a <b>courtroom</b> (or a battlefield): God stands on my side. Who then would dare to take the other?</p><p><b>★ Third light: the “how much more” logic returns</b></p><p>The structure of 8:32 is exactly the argument from greater to lesser in chapter 5:</p><pre>[the hardest thing]   he gave his own Son\n  ↓ “how will he not also…?” (πῶς οὐχὶ καί)\n[the lesser thing]    would he withhold anything else from you?</pre><p>(Compare the two “how much more” arguments in 5:9–10.)</p><p>This is one of the most powerful pieces of logic in the whole Bible: <b>he has already given the costliest thing. What is left that he would grudge?</b></p>","exp":"<p>8:32 is the heart of the chapter. It answers the deepest suspicion we carry: <b>“Perhaps God does not really love me that much.”</b></p><p>And Paul’s answer is not a comforting sentence. It is <b>an event that has already happened</b>:</p><p>On Mount Moriah, the knife stopped.<br>At Calvary, the knife <b>did not stop</b>.</p>"},{"a":33,"z":34,"star":false,"grk":"<p>33 τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν· 34 τίς ὁ κατακρινῶν; Χριστὸς [Ἰησοῦς] ὁ ἀποθανών, μᾶλλον δὲ ἐγερθείς, ὃς καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν.</p>","lit":"<p>33 “<b>Who will bring a charge</b> against God’s elect? — <b>It is God who justifies.</b>”</p><p>34 “<b>Who is the one who condemns?</b> — <b>It is Christ Jesus</b>, who died, and <b>more than that, was raised</b>; who is <b>at the right hand of God</b>, and who is <b>even now interceding for us</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>bring a charge</td><td>ἐγκαλέσει</td><td>enkalesei</td><td>G1458</td><td><b>to lay a formal legal charge</b></td></tr><tr><td>condemns</td><td>ὁ κατακρινῶν</td><td>ho katakrinōn</td><td>G2632</td><td><b>the one who condemns</b> (the root of 8:1, 8:3)</td></tr><tr><td>intercedes</td><td>ἐντυγχάνει</td><td>entynchanei</td><td>G1793</td><td><b>to intercede</b> (same root as 8:26)</td></tr></table>","gram":"<p><b>★ First light: every seat in the courtroom is taken</b></p><pre>Prosecution:  who can accuse?  — no one, because [GOD] is the one who justifies\nThe bench:    who can condemn?  — no one, because [CHRIST] died and was raised\nDefence:                       — [CHRIST] intercedes for us (8:34)\nWitness:                       — [THE SPIRIT] testifies with our spirit (8:16)</pre><p>This is a very strange trial.<br>The judge is my Saviour. The defence counsel is my Saviour. The witness is the Holy Spirit.<br>And the prosecution bench — <b>is empty</b>.</p><p><b>★ Second light: two intercessors</b></p><pre>8:26  the Spirit prays for me from within, with groanings beyond words\n8:34  Christ prays for me at the right hand of God</pre><p>One below, one above. One in the heart, one before the throne.</p><p><b>★ Third light: μᾶλλον δέ (more than that)</b></p><p>“who died — <b>and more than that</b>, was raised.”</p><p>μᾶλλον δέ means <b>“or rather, to put it more precisely.”</b> Paul is strengthening his own sentence.<br>Not only did he die. <b>More than that</b> — he was raised.</p>","exp":"<p>33 and 34 are <b>two courtroom questions</b>.</p><p>And Paul answers them in an unusual way: he does not say “no one can.” He <b>points at a person</b>.</p><pre>Who can accuse?  → [It is God who justifies]\nWho can condemn? → [It is Christ — who died, was raised, is at the right hand, is interceding]</pre><p><b>What the text plainly says:</b> the question of accusation and condemnation has been settled by God’s justifying and by the fourfold work of Christ (death, resurrection, session, intercession).</p><p><b>What may fairly be drawn from it:</b> Paul’s logic is not “you are good, so no one can accuse you.” It is: <b>the one with every right to condemn you is at this moment defending you.</b></p><p>And those four acts of Christ are in order:</p><table><tr><th>The act</th><th>What it deals with</th></tr><tr><td><b>He died</b></td><td>my <b>debt of sin</b></td></tr><tr><td><b>He was raised</b></td><td>my <b>death</b></td></tr><tr><td><b>He is at God’s right hand</b></td><td>my <b>standing</b></td></tr><tr><td><b>He intercedes for us</b></td><td>my <b>present weakness</b></td></tr></table><p>That last one matters most: <b>he did not finish and walk away. He is still doing it now.</b></p><p><b>⚠ Pastoral note:</b> if someone has a voice inside that keeps bringing charges, take them to verse 33: <b>that prosecution bench is empty.</b></p>"},{"a":35,"z":37,"star":false,"grk":"<p>37 ἀλλ' ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.</p>","lit":"<p>35 “<b>Who shall separate us</b> from the love of Christ? Shall oppression, or anguish, or persecution, or famine, or nakedness, or peril, or sword?”</p><p>36 “Even as it is written: ‘<b>For your sake we are killed all day long</b>; we were regarded as <b>sheep for the slaughter</b>.’”</p><p>37 “But in all these things we are <b>more than conquerors</b> <b>through him who loved us</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>separate</td><td>χωρίσει</td><td>chōrisei</td><td>G5563</td><td><b>to divide, to sever</b> (the marriage word of Mark 10:9, “let no one separate”)</td></tr><tr><td>more than conquerors</td><td>ὑπερνικῶμεν</td><td>hypernikōmen</td><td>G5245</td><td>ὑπέρ + νικάω: <b>to conquer overwhelmingly</b></td></tr></table>","gram":"<p><b>★ First light: seven troubles</b></p><p>Paul lists seven: oppression, anguish, persecution, famine, nakedness, peril, sword.</p><p>These seven are <b>not</b> an abstract list. Paul had been through <b>every one of them</b> (2 Corinthians 11:23–27).<br>And the church in Rome that received this letter would go through them all <b>within seven years</b>.</p><p><b>★ Second light: 8:36 quotes Psalm 44:22</b></p><p>Psalm 44 is <b>a psalm of complaint</b> — the righteous protesting to God in the middle of suffering.</p><p>Paul does not pretend suffering is not there. <b>He takes a psalm of complaint and sets it inside the most glorious passage in Romans.</b></p><p><b>★ Third light: hypernikaō — Paul builds another word</b></p><p>νικάω is “to conquer.” Paul adds ὑπέρ — <b>“to conquer beyond conquering.”</b> (The word occurs <b>only here</b> in the New Testament.)</p><p>And note his preposition: <b>“in all these things”</b> (ἐν τούτοις πᾶσιν) — not “out of all these things,” but <b>“inside all of them.”</b></p><p><b>Victory is not that the suffering never came. Victory is that it came, and it could not take the love away.</b></p>","exp":"<p>Not one of the seven things Paul lists in verse 35 is a spiritual abstraction.</p><p>Oppression, anguish, persecution, famine, nakedness, peril, sword — every one of them is <b>concrete, bodily, and capable of drawing blood</b>.</p><p>And Paul had been through all of them himself (2 Corinthians 11:23–27). The church at Rome would go through them all within seven years (the persecution under Nero, AD 64).</p><p><b>What the text plainly says:</b> no circumstance can separate a believer from the love of Christ; in the midst of them all we are more than conquerors through the one who loved us.</p><p><b>What may fairly be drawn from it:</b> Paul deliberately quotes Psalm 44 — a psalm of complaint. He does not pretend suffering is not real. He places <b>a psalm of protest</b> inside the most glorious passage in the letter.</p><p>And the key to verse 37 is the preposition: <b>“in all these things”</b> — not “delivered out of them,” but <b>“inside them.”</b></p><p><b>⚠ Pastoral note:</b> 8:35–39 must not be preached as “believe and nothing bad will happen to you.” Every item on Paul’s list is something that <b>really does happen</b>. What he guarantees is not that it will not come, but that <b>when it comes, it cannot take this away</b>.</p>"},{"a":38,"z":39,"star":true,"grk":"<p>38 πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις 39 οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.</p>","lit":"<p>“For <b>I have been persuaded, and I remain convinced</b>, that neither death nor life, nor angels nor rulers, nor things present nor things to come, nor powers, nor height nor depth, nor <b>any other created thing</b>, will be <b>able</b> to separate us from the love of God which is in Christ Jesus our Lord.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>I am persuaded</td><td>πέπεισμαι</td><td>pepeismai</td><td>G3982</td><td><b>perfect passive</b>: I have been persuaded, and remain so</td></tr><tr><td>height / depth</td><td>ὕψωμα / βάθος</td><td>hypsōma / bathos</td><td>G5313 / G899</td><td>height / depth (<b>possibly astronomical terms</b> — see below)</td></tr><tr><td>any other created thing</td><td>τις κτίσις ἑτέρα</td><td>—</td><td>G2937</td><td><b>any other thing that has been made</b></td></tr></table>","gram":"<p><b>★ First light: pepeismai is perfect passive</b></p><p>“I am persuaded” — not “I feel that.” It is: <b>I have been persuaded, and that persuasion stands.</b></p><p>Persuaded by what? By the thirty-seven verses that came before.</p><p>Paul’s certainty is not an emotion. It is <b>the result of having been convinced by evidence</b>.</p><p><b>★ Second light: hypsōma and bathos may be astronomical terms</b></p><p>In Hellenistic astrology these two words were used of a star’s highest and lowest points in the sky — and the ancients believed a star’s position determined a person’s fate.</p><p>If that background holds (many commentators think it possible), Paul is saying: <b>even the “fate” written in the sky at your birth cannot separate you from this love.</b></p><p><b>Pulpit note:</b> this is a <b>possible</b> background. Say “some scholars think,” not “this is what it means.”</p><p><b>★ Third light: the one thing missing from the list</b></p><p>Paul lists ten items and then adds a catch-all: “any other created thing.”</p><p>Someone will ask: <b>what about me? Could I separate myself?</b></p><p>The answer is in that final clause: <b>“or any other created thing” (τις κτίσις ἑτέρα).</b></p><p>Am I a created thing? <b>Yes.</b> So I am on that list too.</p><p><b>★ Fourth light: dynēsetai — “will not be able”</b></p><p>“Will not be <b>able</b> to separate us” — the verb is δύναμαι, to have power.<br>Not “will not,” but <b>“has no power to.”</b></p>","exp":"<p>Chapter 8 begins with <b>no condemnation</b> and ends with <b>no separation</b>.</p><p>And the last clause is the chapter’s address:<br><b>“which is in Christ Jesus our Lord.”</b></p><p>This love is not a feeling floating in the air. It has an address. It is <b>inside a person</b>.</p><p>And the very last word of 8:39 is <b>“our Lord.”</b></p><p>After the most magnificent passage in the whole letter, Paul lands on one word: <b>ours</b>.<br>Not “the Lord.” <b>Our</b> Lord.</p>"}],"7":[{"a":1,"z":1,"star":false,"grk":"<p>Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ' ὅσον χρόνον ζῇ;</p>","lit":"<p>“Or are you <b>unaware</b>, brothers — I am speaking to people who know the law — that the law <b>is lord over</b> a person only for as long as he lives?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>has dominion</td><td>κυριεύει</td><td>kyrieuei</td><td>G2961</td><td>κύριος (lord)</td><td><b>to be lord, to rule</b></td><td>same word as 6:9 and 6:14</td></tr><tr><td>as long as he lives</td><td>ἐφ' ὅσον χρόνον ζῇ</td><td>—</td><td>—</td><td>—</td><td>only while he is alive</td><td>the term of the law’s jurisdiction</td></tr></table>","gram":"<p><b>★ The three-stage journey of kyrieuō</b></p><p>This verb (“to be lord over”) traces a clear line through Romans:</p><table><tr><th>Reference</th><th>What it says</th></tr><tr><td><b>6:9</b></td><td>death <b>no longer</b> has dominion over Christ</td></tr><tr><td><b>6:14</b></td><td>sin <b>shall not</b> have dominion over you</td></tr><tr><td><b>7:1</b></td><td>the law has dominion over a person <b>only while he lives</b></td></tr></table><p>Three masters: death, sin, the law. One by one Paul says: none of them holds jurisdiction over you.</p><p>And the means of release is the same in every case — <b>death</b>.</p>","exp":"<p>Paul begins from a point of law that everyone accepts: <b>the law governs the living.</b></p><p>Once a person dies, the case is closed.</p><p>This is exactly what 6:7 has already said: “he who has died has been freed from sin.”</p>"},{"a":2,"z":3,"star":false,"grk":"<p>2 ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.</p>","lit":"<p>2 “For a married woman is <b>bound by law</b> to her husband while he lives; but if the husband dies, she is <b>discharged from the law of the husband</b>.”</p><p>3 “So then, while her husband lives, if she is joined to another man she will be called <b>an adulteress</b>; but if the husband dies she is <b>free from that law</b>, so that she is <b>no adulteress</b> even if she is joined to another.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>married</td><td>ὕπανδρος</td><td>hypandros</td><td>G5220</td><td>ὑπό (under) + ἀνήρ (husband): <b>under a husband’s authority</b></td></tr><tr><td>is bound</td><td>δέδεται</td><td>dedetai</td><td>G1210</td><td><b>perfect passive</b>: has been bound, and remains bound</td></tr><tr><td>discharged</td><td>κατήργηται</td><td>katērgētai</td><td>G2673</td><td><b>katargeō — the word of 6:6</b></td></tr><tr><td>adulteress</td><td>μοιχαλίς</td><td>moichalis</td><td>G3428</td><td>an adulterous woman</td></tr></table>","gram":"<p><b>★ katargeō appears again</b></p><p>“She is <b>discharged</b> from the law of the husband” — this is precisely the verb of 6:6, “that the body of sin might be <b>done away with</b>.”</p><p>And this use makes the meaning of the word much clearer.</p><p>A widow has not been <b>annihilated</b>. She has been <b>released from a legal relationship</b>. The law of marriage <b>no longer applies</b> to her — but she herself is still here, still alive, and free to marry again.</p><p>That is exactly the sense of 6:6: sin’s authority over me has been made void — but I am still here.</p><p><b>★ dedetai is perfect passive</b></p><p>“Bound by the law” — she has been bound, and she remains bound.</p><p>Paul wants to stress that this binding is <b>real, continuing, and impossible to dissolve by oneself</b>.</p>","exp":"<p>Paul chose this illustration because of one feature of it: <b>a marriage bond cannot be dissolved by effort.</b></p><p>A wife cannot say, “I have tried very hard, so I am free now.”</p><p>Only one thing dissolves a marriage: <b>death</b>.</p><p>And that is Paul’s point exactly: <b>your relationship to the law cannot be changed by performing better. It can only be changed by death.</b></p>"},{"a":4,"z":4,"star":true,"grk":"<p>ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι, ἵνα καρποφορήσωμεν τῷ θεῷ.</p>","lit":"<p>“So then, my brothers, you also <b>were put to death</b> with respect to the law, <b>through the body of Christ</b> — so that you might <b>belong to another</b>, to him who was raised from the dead, that we might <b>bear fruit to God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>were made dead</td><td>ἐθανατώθητε</td><td>ethanatōthēte</td><td>G2289</td><td>θανατόω</td><td><b>were put to death</b> (aorist passive)</td><td>see below</td></tr><tr><td>the body of Christ</td><td>τὸ σῶμα τοῦ Χριστοῦ</td><td>—</td><td>G4983</td><td>—</td><td>the crucified body of Christ</td><td>the cross</td></tr><tr><td>belong to another</td><td>γενέσθαι ἑτέρῳ</td><td>—</td><td>G2087</td><td>ἕτερος (another)</td><td><b>to come to belong to another</b></td><td>marriage language</td></tr><tr><td>bear fruit</td><td>καρποφορήσωμεν</td><td>karpophorēsōmen</td><td>G2592</td><td>καρπός + φέρω</td><td>to bear fruit</td><td>the natural issue of a marriage</td></tr></table>","gram":"<p><b>★ First light: ethanatōthēte is passive</b></p><p>“You <b>were made dead</b>” — not “you died,” but <b>“you were put to death.”</b></p><p>In the New Testament this verb is used of <b>judicial execution</b> (Matthew 26:59, “to put him to death”; Mark 14:55).</p><p>Paul is saying: this was not a natural death. It was <b>an execution</b>.</p><p>And the place of execution was Calvary, and what was executed was the body of Christ — but because you are in him, <b>you were executed with him</b>.</p><p><b>★ Second light: the roles in the illustration change</b></p><p>This is the “asymmetry” most often noted in the passage:</p><pre>in the illustration (7:2–3):  the husband dies  →  the wife is free\nin the application (7:4):     you die           →  you are free</pre><p>Paul appears to have swapped the roles. Several ways of reading it:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>The point is the principle, not the roles</b></td><td>The principle is: <b>death ends a legal relationship</b></td></tr><tr><td><b>Paul adjusts deliberately</b></td><td>Because the law does not “die” (the law is holy and abiding), the one who dies must be me</td></tr><tr><td><b>A double death</b></td><td>I died, so that marriage ended; and I was raised in Christ, so I may belong to another</td></tr></table><p>The second reading fits the context best: Paul cannot say “the law died,” because in 7:12 he is about to say that the law is holy, righteous and good.<br>So the one who dies has to be <b>me</b>.</p><p><b>★ Third light: “belong to another” is marriage language</b></p><p>γενέσθαι ἑτέρῳ — literally “to come to be another’s.”</p><p>This is the marriage imagery the prophets constantly use (Hosea; Isaiah 54:5, “your Maker is your husband”).</p><p>Paul is not saying you have walked out of a marriage and become single.<br><b>You have remarried.</b></p><p><b>★ Fourth light: karpophoreō (bear fruit)</b></p><p>Inside a marriage illustration, “bearing fruit” carries an obvious sense: <b>children</b>.</p><p>Paul is saying the new marriage will bear new fruit. And that fruit is <b>“to God”</b> (τῷ θεῷ).</p><p>Compare 7:5: “to bear fruit <b>to death</b>.”</p><pre>the old marriage (under law)   →  fruit for death\nthe new marriage (to Christ)   →  fruit for God</pre>","exp":"<p>There is a beautiful point in verse 4 that is often missed.</p><p>Paul does not speak of being released from the law in order to make us <b>free</b>.<br>He speaks of it in order that we might <b>belong to another</b>.</p><p>“That you might be joined to another — to him who was raised from the dead.”</p><p>This matches chapter 6 exactly. A person does not choose between having a master and having none (6:16).<br>Nor between being married and being unattached.</p><p><b>You have not divorced into singleness. You have remarried.</b></p>"},{"a":5,"z":6,"star":false,"grk":"<p>5 ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ· 6 νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.</p>","lit":"<p>5 “For when we were <b>in the flesh</b>, the sinful passions <b>that came through the law</b> <b>were at work</b> in our members, to bear fruit for death.”</p><p>6 “But <b>now</b>, having died to that which held us captive, we have been <b>discharged from the law</b>, so that we serve <b>in newness of the Spirit</b> and not <b>in oldness of the letter</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>in the flesh</td><td>ἐν τῇ σαρκί</td><td>en tē sarki</td><td>G4561</td><td><b>in the flesh</b> — a mode of existence (see below)</td></tr><tr><td>sinful passions</td><td>τὰ παθήματα τῶν ἁμαρτιῶν</td><td>pathēmata</td><td>G3804</td><td><b>the passions of sin</b></td></tr><tr><td>were at work</td><td>ἐνηργεῖτο</td><td>enērgeito</td><td>G1754</td><td>ἐν + ἔργον: <b>to operate inside</b> (English “energy”)</td></tr><tr><td>but now</td><td>νυνὶ δέ</td><td>nyni de</td><td>G3570</td><td><b>but now</b> — the phrase of 3:21</td></tr><tr><td>letter</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>the written code (<b>same word as 2:29</b>)</td></tr></table>","gram":"<p><b>★ First light: nyni de — “but now” returns</b></p><p>We met this phrase in 3:21:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>3:21</b></td><td>“<b>But now</b>, apart from the law, a righteousness of God has been revealed.”</td></tr><tr><td><b>7:6</b></td><td>“<b>But now</b>, having died to that which held us captive.”</td></tr></table><p>Paul uses the same hinge word to mark two watersheds in redemptive history.</p><p><b>★ Second light: gramma / pneuma — the contrast of 2:29 returns</b></p><pre>2:29        true circumcision is of the heart, by the Spirit (πνεῦμα), not the letter (γράμμα)\n7:6         we serve in newness of the Spirit (πνεύματος), not oldness of the letter (γράμματος)\n2 Cor 3:6   the letter (γράμμα) kills, but the Spirit (πνεῦμα) gives life</pre><p>Paul uses the same pairing in all three places.</p><p>And this contrast is <b>not</b> “the literal sense of Scripture versus its spiritual sense.” It is <b>the outward written system of the old covenant versus the indwelling reality of the Spirit in the new</b>.</p><p><b>★ Third light: the only mention of the Spirit in chapter 7</b></p><p>The “Spirit” of 7:6 (πνεῦμα) is understood by most commentators as <b>the Holy Spirit</b>.</p><p>Note where it stands: <b>this is the only mention of the Spirit in chapter 7 — and it comes before the struggle of 7:7 begins.</b></p><p>From 7:7 to 7:25, the Spirit does not appear once.<br>Then in chapter 8, the Spirit appears around twenty times.</p><p><b>★ Fourth light: “in the flesh” is a state, not “having a body”</b></p><p>In Paul, “in the flesh” (ἐν σαρκί) usually denotes <b>a mode of existence not yet renewed by the Spirit</b>, not the mere possession of a body.</p><p>The proof is 8:9: “If the Spirit of God dwells in you, you are <b>not in the flesh</b> but in the Spirit.” Paul plainly does not mean that believers have no bodies. He means they no longer live within the old order of existence.</p>","exp":"<p>There is an alarming sentence in 7:5: <b>“the sinful passions that came through the law.”</b></p><p>Paul says the law <b>stirs up</b> the passions of sin. How can that be?</p><p>He will explain in 7:7–13. But here is a picture from ordinary life:</p><p>A sign says, “Wet paint — do not touch.” You had not even noticed that wall before. After reading the sign, your fingers begin to itch.</p><p>The law is not at fault. It tells the truth.<br>But it exposes something already inside me — and the moment that thing is exposed, <b>it begins to move</b>.</p>"},{"a":7,"z":7,"star":true,"grk":"<p>Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου· τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· οὐκ ἐπιθυμήσεις.</p>","lit":"<p>“What shall we say then? Is the law sin? <b>By no means!</b> Yet I would <b>not have come to know</b> sin except through the law. For I would not have known coveting if the law had not said, <b>“You shall not covet.”</b>”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>by no means</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td>the strongest negation in Greek</td></tr><tr><td>would not have known</td><td>οὐκ ἔγνων</td><td>ouk egnōn</td><td>G1097</td><td><b>would not have recognised</b> (experiential knowing)</td></tr><tr><td>coveting</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>strong desire; <b>the tenth commandment</b></td></tr></table>","gram":"<p><b>★ Why does Paul single out the tenth commandment?</b></p><p>The first nine can all be checked <b>from the outside</b>:</p><table><tr><th>Commandment</th><th>Visible from outside?</th></tr><tr><td>No other gods</td><td>more or less (where you go to worship)</td></tr><tr><td>No graven images</td><td>yes</td></tr><tr><td>Not take the Name in vain</td><td>yes (you can hear it)</td></tr><tr><td>Keep the Sabbath</td><td>yes</td></tr><tr><td>Honour father and mother</td><td>more or less</td></tr><tr><td>Do not murder</td><td>yes</td></tr><tr><td>Do not commit adultery</td><td>yes</td></tr><tr><td>Do not steal</td><td>yes</td></tr><tr><td>Do not bear false witness</td><td>yes</td></tr><tr><td><b>Do not covet</b></td><td><b>entirely invisible</b></td></tr></table><p>That is why Paul singles out this one.</p><p>In Philippians 3:6 he says: “as to the righteousness which is in the law, <b>blameless</b>.” On the nine visible commandments, he scored full marks.</p><p>And then one day the tenth found him.<br>And the tenth is the only one that <b>only God and you know about</b>.</p><p><b>★ The force of ouk egnōn</b></p><p>“I would not have known sin” — this does not mean Paul had no concept of sin.</p><p>γινώσκω often means <b>experiential, personal recognition</b>. Paul means: without the law, I would <b>never have recognised it for what it was</b>. I would have assumed it was simply how people are.</p>","exp":"<p>7:7 is a vital defence: <b>the law is not sin.</b></p><p>Paul holds a line here. Many people finish chapter 6 (“not under law”) and conclude that the law is the enemy.<br>Paul says: by no means.</p><p>The law is what takes the thing I assumed was a personal quirk and gives it its proper name: <b>sin</b>.</p><p>It does not manufacture sin. It <b>names</b> sin.</p>"},{"a":8,"z":11,"star":true,"grk":"<p>8 ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν· χωρὶς γὰρ νόμου ἁμαρτία νεκρά. 11 ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι' αὐτῆς ἀπέκτεινεν.</p>","lit":"<p>8 “But sin, <b>seizing a base of operations</b> through the commandment, <b>produced</b> in me every kind of coveting; for apart from the law sin is dead.”</p><p>11 “For sin, <b>seizing a base of operations</b> through the commandment, <b>thoroughly deceived me</b>, and through it <b>killed me</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>opportunity</td><td>ἀφορμή</td><td>aphormē</td><td>G874</td><td>ἀπό + ὁρμάω (to rush out)</td><td><b>a starting point, a base, a beachhead</b></td><td><b>a military term</b> (see below)</td></tr><tr><td>produced</td><td>κατειργάσατο</td><td>kateirgasato</td><td>G2716</td><td>κατά + ἐργάζομαι</td><td><b>to produce, to bring about</b></td><td>same word as 5:3, 6:13</td></tr><tr><td>deceived</td><td>ἐξηπάτησεν</td><td>exēpatēsen</td><td>G1818</td><td>ἐκ + ἀπατάω</td><td><b>to deceive thoroughly</b></td><td>crucial — see below</td></tr><tr><td>killed</td><td>ἀπέκτεινεν</td><td>apekteinen</td><td>G615</td><td>ἀπό + κτείνω</td><td>to kill</td><td>—</td></tr></table>","gram":"<p><b>★ First light: aphormē — the military “beachhead”</b></p><p>In classical Greek this word is used militarily of <b>the base of operations from which an army launches an attack</b>.</p><p>(Other New Testament uses: 2 Corinthians 5:12, 11:12; Galatians 5:13, “do not use your freedom as an <b>opportunity</b> for the flesh”; 1 Timothy 5:14.)</p><p>Paul’s picture is this: sin had no foothold in your territory. Then the commandment arrived — and sin <b>established a beachhead on that commandment</b>.</p><p>This is exact, because it matches experience. “You shall not covet” is itself a holy commandment. But the moment sin hears it, it turns it into <b>a launch pad</b> against me.</p><p>Note carefully: Paul does not shift the blame to the law. The one who takes the base is <b>sin</b> (ἡ ἁμαρτία is the subject). The commandment is merely the terrain being exploited.</p><p><b>★ Second light: exapataō — the word from Eden</b></p><p>“Deceived me” (7:11) — ἐξηπάτησεν. The word occurs five times in the New Testament; two of them matter enormously:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>2 Corinthians 11:3</b></td><td>“I am afraid that, <b>as the serpent deceived Eve</b> by his craftiness, your minds may be corrupted.”</td></tr><tr><td><b>1 Timothy 2:14</b></td><td>“Adam was not <b>deceived</b>, but the woman being <b>deceived</b> fell into transgression.”</td></tr></table><p>Both use the same word (or its root) of <b>what the serpent did to Eve in the garden</b>.</p><p>That is the very word Paul uses in 7:11. He is saying: <b>what happened to me is what happened in Eden.</b></p><p>And what did Eve herself say in Genesis 3:13? <b>“The serpent deceived me, and I ate.”</b><br>The Septuagint reads ἠπάτησέν με — <b>almost identical to Romans 7:11</b>.</p><p>This is one of the significant clues in the question of who the “I” of 7:7–13 is: Paul may be using the experience of Adam and Eve as the archetype of every human experience.</p><p><b>★ Third light: “the commandment came, sin revived, and I died” (7:9)</b></p><p>This is one of the hardest verses in the chapter. “I was alive apart from the law once” — when was that?</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>Adam in Eden</b></td><td>the commandment came (do not eat) → sin revived → Adam died</td></tr><tr><td><b>Israel before Sinai</b></td><td>before the law was given → the law came → death</td></tr><tr><td><b>Paul’s own childhood, before the commandment</b></td><td>a Jewish boy before his bar mitzvah at thirteen</td></tr><tr><td><b>Anyone before conscience is truly awakened</b></td><td>a universal human experience</td></tr></table><p>To be honest, all four have serious advocates. But <b>all four arrive at the same conclusion</b>: the moment the law arrived, the thing that had been dormant came alive — and I died.</p><p><b>★ Fourth light: the tragic couplet of 7:10</b></p><p>“The commandment which was <b>meant for life</b> proved to be <b>death to me</b>.”</p><p>What was the law originally for?<br>Leviticus 18:5, “if a man does them, he shall live by them.”<br>Deuteronomy 30:19, “choose life, that you and your descendants may live.”</p><p>The law was meant to be <b>a road to life</b>. And Paul says: for me it became a road to death — not because there is anything wrong with the law, but because of what was already in me.</p>","exp":"<p>7:8–11 sets out a complete psychology of sin:</p><pre>1. sin is already in me, but it is “dead” (νεκρά — dormant, inactive)\n2. the commandment arrives and draws the line\n3. sin seizes that commandment as a beachhead (ἀφορμή)\n4. sin uses that commandment to deceive me (ἐξαπατάω — the word from Eden)\n5. I imagine that crossing the line will give me something\n6. the result: I die</pre><p>This is why rule-making alone can never deal with sin.<br><b>Because the terrain sin likes best is a rule.</b></p>"},{"a":12,"z":13,"star":false,"grk":"<p>12 ὥστε ὁ μὲν νόμος ἅγιος καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή. 13 …ἵνα γένηται καθ' ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.</p>","lit":"<p>12 “So then, <b>the law is holy</b>, and <b>the commandment is holy, righteous and good</b>.”</p><p>13 “Did then that which is good become death to me? <b>By no means!</b> It was <b>sin</b> — that it might be shown to be <b>truly sin</b>, producing death in me through what is good; so that through the commandment sin might become <b>utterly sinful</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>holy</td><td>ἅγιος</td><td>hagios</td><td>G40</td><td>set apart to God</td></tr><tr><td>righteous</td><td>δίκαιος</td><td>dikaios</td><td>G1342</td><td>conforming to justice</td></tr><tr><td>good</td><td>ἀγαθός</td><td>agathos</td><td>G18</td><td>good, beneficial</td></tr><tr><td>exceedingly sinful</td><td>καθ' ὑπερβολήν</td><td>kath' hyperbolēn</td><td>G5236</td><td><b>beyond all measure</b> (English “hyperbole”)</td></tr></table>","gram":"<p><b>★ 7:12 is Paul’s most positive statement about the law</b></p><p>He stacks up four adjectives:</p><pre>the law:        ἅγιος (holy)\nthe commandment: ἁγία (holy) + δικαία (righteous) + ἀγαθή (good)</pre><p>This verse should be read aloud, because so many people assume Paul is against the law.<br>Here he places the law as high as it can be placed.</p><p><b>★ kath' hyperbolēn — sin off the scale</b></p><p>“That sin might become <b>exceedingly sinful</b>” — literally, “sinful <b>beyond all measure</b>.”</p><p>This is the law’s real function: not to make you better, but <b>to expose sin for what it is</b>.</p><p>Paul’s logic runs:</p><pre>the law is holy, righteous and good\n  ↓\nsin can take even a thing that good and use it to destroy me\n  ↓\ntherefore the evil of sin is exposed beyond all measure</pre><p>How terrible must a thing be, that can turn medicine into poison?</p>","exp":"<p>The conclusion of the first half of chapter 7 is clear: <b>there is nothing wrong with the law.</b></p><p>The law is holy, righteous and good.</p><p>The trouble is not with the mirror. It is with the face the mirror shows.</p><p>And in the second half of the chapter, Paul is going to hold that face right up to our eyes.</p><p><b>★ From 7:14 onward the tense shifts entirely to the present.</b> For the full discussion of who the “I” is, see the disputed-passage card. What follows explains the text on its own terms.</p>"},{"a":14,"z":14,"star":false,"grk":"<p>οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν, ἐγὼ δὲ σάρκινός εἰμι πεπραμένος ὑπὸ τὴν ἁμαρτίαν.</p>","lit":"<p>“For <b>we know</b> that the law is spiritual; but <b>I</b> am <b>made of flesh</b>, <b>sold</b> under the power of sin.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>spiritual</td><td>πνευματικός</td><td>pneumatikos</td><td>G4152</td><td>πνεῦμα</td><td><b>spiritual, of the Spirit</b></td><td>the origin of the law</td></tr><tr><td>of flesh</td><td>σάρκινος</td><td>sarkinos</td><td>G4560</td><td>σάρξ (flesh)</td><td><b>made of flesh; fleshen</b></td><td>see below</td></tr><tr><td>sold</td><td>πεπραμένος</td><td>pepramenos</td><td>G4097</td><td>πιπράσκω (to sell)</td><td><b>perfect passive participle: has been sold</b></td><td>slave-market language</td></tr></table>","gram":"<p><b>★ First light: σάρκινος, not σαρκικός</b></p><p>Greek has two closely related adjectives:</p><table><tr><th>Word</th><th>Ending</th><th>Sense</th></tr><tr><td><b>σάρκινος</b></td><td>-inos</td><td><b>made of a given material</b> (fleshen)</td></tr><tr><td><b>σαρκικός</b></td><td>-ikos</td><td><b>having a given character</b> (fleshly, sensual)</td></tr></table><p>In 7:14 Paul uses <b>σάρκινος</b> — <b>“made of flesh.”</b></p><p>The stress falls on <b>material, constitution, creaturely weakness</b>, not on moral corruption.</p><p>Paul is saying: the law is of heavenly stuff; I am of earthly stuff. <b>The two simply do not match.</b></p><p>(The same word is used in 2 Corinthians 3:3, “tablets of <b>flesh</b>, that is, of the heart.”)</p><p><b>★ Second light: pepramenos hypo tēn hamartian (sold under sin)</b></p><p>This is the strongest — and most disputed — sentence in the chapter.</p><p>πιπράσκω is <b>slave-market language</b>: to sell a person. And the perfect passive participle means <b>has been sold, and remains in that condition</b>.</p><p>This produces the great interpretive difficulty of chapter 7:</p><pre>6:18  “having been set free from sin”\n7:14  “I am sold under sin”</pre><p>How are the two reconciled? (See the disputed-passage card.)</p><p><b>★ Third light: oidamen (we know) versus egō (but I)</b></p><pre>οἴδαμεν  —  we know (plural: shared doctrine)\nἐγὼ δέ   —  but I (singular: my actual condition)</pre><p>Paul deliberately sets the truth everyone agrees on <b>against</b> the state he is actually in.</p><p>And that is the ache of chapter 7 exactly: <b>I understand the doctrine. But I cannot do it.</b></p>","exp":"<p>7:14 is honest to the point of discomfort.</p><p>Paul does not say, “the law is too difficult.”<br>He says, “the law is spiritual; <b>I am made of flesh</b>.”</p><p>The problem is not that the standard is too high. <b>The problem is that the material is wrong.</b></p>"},{"a":15,"z":17,"star":true,"grk":"<p>15 ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ' ὃ μισῶ τοῦτο ποιῶ. 17 νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.</p>","lit":"<p>15 “For what I <b>carry out</b>, I <b>do not recognise</b>; for what I <b>want</b>, I do not practise; but what I <b>hate</b>, that I do.”</p><p>17 “But now it is <b>no longer I</b> who carry it out, but <b>sin dwelling in me</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>I do not understand</td><td>οὐ γινώσκω</td><td>ou ginōskō</td><td>G1097</td><td><b>I do not recognise it</b> (not “I fail to grasp the principle”)</td></tr><tr><td>I want</td><td>θέλω</td><td>thelō</td><td>G2309</td><td>the decision of the will</td></tr><tr><td>I hate</td><td>μισῶ</td><td>misō</td><td>G3404</td><td><b>to hate</b> — a strong word</td></tr><tr><td>dwelling</td><td>οἰκοῦσα</td><td>oikousa</td><td>G3611</td><td>οἶκος (house): <b>to dwell, to reside</b></td></tr></table>","gram":"<p><b>★ First light: ou ginōskō — “I don’t recognise it”</b></p><p>“What I do, I do not understand” — this verb is not “I fail to grasp the principle.” γινώσκω is <b>to know, to recognise</b>.</p><p>Paul means: <b>the thing I have just done — I cannot recognise myself in it.</b></p><p>Every honest person knows this. You finish, and you look at yourself, and think: <b>“Who was that?”</b></p><p><b>★ Second light: the weight of misō (hate)</b></p><p>Paul does not say “I am not entirely comfortable with it.” He says <b>I hate it</b>.</p><p>This word is an important clue in the question of who the “I” is. Would an unregenerate person <b>hate</b> his own sin? He might regret it, feel shame, fear the consequences — but “hate” is a very strong moral judgement.</p><p><b>★ Third light: oikeō (dwell) — sin as a tenant</b></p><p>“Sin dwelling in me” — ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.</p><p>The root of οἰκέω is οἶκος, a house; it means <b>to reside, to live in</b>.</p><p>Paul’s picture is that sin is <b>a tenant living in my house</b>.</p><p>Note: <b>a tenant is not the owner.</b> This continues 6:6 — sin has been <b>relieved of office</b> (katargeō), but it has not yet moved out.</p><p>And chapter 8 will give the counterpart:</p><pre>8:9   “if the Spirit of God DWELLS (οἰκεῖ) in you…”\n8:11  “if the Spirit of him who raised Jesus DWELLS (οἰκεῖ) in you…”</pre><p><b>The same word.</b><br>Chapter 7: sin dwells in me. Chapter 8: the Spirit dwells in me.<br>This is the single most important pairing between the two chapters.</p><p><b>★ Fourth light: is 7:17 “not I” an evasion of responsibility?</b></p><p>This verse is often misused: “so it wasn’t really me, it was sin.” Three clarifications are necessary:</p><p>1. Throughout 7:14–25 Paul keeps saying <b>“I”</b> — he never denies that he did it.<br>2. The point of οὐκέτι ἐγώ (“no longer I”) is that <b>this no longer represents who I truly am</b> — because 7:22 says “I delight in the law of God after the inward man.”<br>3. Paul elsewhere demands responsibility without qualification (the commands of 6:12–13).</p><p>Paul is not evading responsibility; he is making <b>a distinction of identity</b>: the act that came out does not represent my new self. <b>The tenant did it, not the owner.</b><br>But the owner is still answerable for what happens in the house — <b>and that is exactly why he cries out, “What a wretched man I am.”</b></p>","exp":"<p>7:15 describes a <b>split</b>:</p><pre>what I want (θέλω)  —  I cannot do\nwhat I hate (μισῶ)  —  I do</pre><p>And the sharpest pain in that split is not “I did wrong.” It is —<br><b>I cannot recognise the person who did it.</b></p>"},{"a":18,"z":20,"star":false,"grk":"<p>18 οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ' ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν οὔ·</p>","lit":"<p>18 “For I know that in me — that is, in my flesh — no good thing <b>dwells</b>. For the <b>willing</b> is <b>lying right beside me</b>, but the <b>doing</b> of the good is not.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>no good dwells</td><td>οὐκ οἰκεῖ…ἀγαθόν</td><td>—</td><td>G3611 / G18</td><td><b>no good thing resides in me</b> (oikeō again)</td></tr><tr><td>is present with me</td><td>παράκειταί μοι</td><td>parakeitai</td><td>G3873</td><td>παρά + κεῖμαι: <b>lies beside me, within easy reach</b></td></tr></table>","gram":"<p><b>★ First light: “in me, that is, in my flesh” — Paul corrects himself</b></p><p>Notice that Paul says half a sentence and immediately qualifies it:</p><pre>“in me”                —  too broad\n“that is, in my flesh”  —  precise</pre><p>Paul is not saying “there is not one good thing anywhere in this person.”<br>He is saying: in my <b>flesh</b>, no good dwells.</p><p>And 7:22 immediately says: “I delight in the law of God <b>after the inward man</b>.”<br>So there is a distinction in Paul’s mind: the flesh, and the inward person.</p><p><b>★ Second light: parakeimai — “lying beside me”</b></p><p>“To will is present with me” — the picture in the Greek is that the thing called “willing” <b>is lying right there beside me, ready to hand</b>.</p><p>Paul means: <b>I have never been short of wanting.</b> Wanting is abundant; it is always within reach.<br>What I lack is <b>the power to carry it out</b>.</p><p>How many spiritual lives does that one sentence describe? <b>Resolutions I have in abundance. Power I do not.</b></p><p><b>★ Third light: 7:19 repeats 7:15</b></p><p>Paul says the same thing twice (7:15 and 7:19). This is not redundancy. It is <b>rhythm</b>.</p><p>Because the cycle itself is a repetition. Paul is imitating in words the loop he cannot get out of.</p>","exp":"<p><b>What the text plainly says:</b> in “my” flesh there is no good; the willing is there, the power to do it is not.</p><p><b>What may fairly be drawn from it:</b> if my whole method for dealing with sin is “resolve harder,” I have not yet understood 7:18 — <b>because the problem was never that the wanting was too weak</b>.</p>"},{"a":21,"z":23,"star":true,"grk":"<p>22 συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον, 23 βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.</p>","lit":"<p>22 “For after <b>the inward man</b> I <b>delight together with</b> the law of God;”</p><p>23 “but I see another law in my members, <b>waging war against</b> the law of my mind, and <b>taking me captive as a prisoner of war</b> to the law of sin which is in my members.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>delight</td><td>συνήδομαι</td><td>synēdomai</td><td>G4913</td><td>σύν + ἥδομαι (to be glad)</td><td><b>to rejoice together with, to delight from the heart</b></td><td><b>only here in the NT</b></td></tr><tr><td>the inward man</td><td>ὁ ἔσω ἄνθρωπος</td><td>esō anthrōpos</td><td>G2080</td><td>—</td><td><b>the person within</b></td><td>see below</td></tr><tr><td>wage war</td><td>ἀντιστρατεύομαι</td><td>antistrateuomai</td><td>G497</td><td>ἀντί + στρατεύομαι</td><td><b>to campaign against</b></td><td><b>only here in the NT</b></td></tr><tr><td>take captive</td><td>αἰχμαλωτίζω</td><td>aichmalōtizō</td><td>G163</td><td>αἰχμή (spear) + ἁλωτός (captured)</td><td><b>to take as a prisoner of war</b></td><td>military language</td></tr></table>","gram":"<p><b>★ First light: synēdomai — “to delight together with, from the heart”</b></p><p>The word occurs <b>only here</b> in the New Testament.</p><p>It does not mean “I agree” or “I know that is right.” σύν (together) + ἥδομαι (to take pleasure) — it means <b>I delight, from the bottom of my heart, together with the law of God</b>.</p><p>This word matters greatly. Paul has just said in 3:11, “there is none who seeks God.” And in 8:7 he will say, “the mind of the flesh is hostile to God; it does not submit to God’s law, neither can it.”</p><p>Would a person who is <b>hostile to God</b> <b>delight from the heart</b> in God’s law?<br>This is one of the strongest arguments of those who read the “I” as a regenerate believer.</p><p><b>★ Second light: ho esō anthrōpos (the inward man)</b></p><p>Paul uses this phrase elsewhere:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>2 Corinthians 4:16</b></td><td>“though our outward man is decaying, our <b>inward man</b> (ὁ ἔσω) is renewed day by day.”</td></tr><tr><td><b>Ephesians 3:16</b></td><td>“strengthened with power through his Spirit in the <b>inner man</b> (ἔσω ἄνθρωπον).”</td></tr></table><p>In both places “the inward man” clearly refers to <b>the believer’s inner life as renewed by the Spirit</b>. This too is an important argument for the regenerate reading.</p><p>(Those who read it otherwise reply that “the inward man” here means reason and conscience — Greek philosophy used the phrase in a comparable way. See the disputed-passage card.)</p><p><b>★ Third light: two military terms</b></p><pre>ἀντιστρατεύομαι  —  to wage a campaign against (only here in the NT)\nαἰχμαλωτίζω      —  to take as a prisoner of war</pre><p>Paul’s picture is <b>an actual war</b>. And he is <b>the soldier who has been captured</b>.</p><p>Note what αἰχμαλωτίζω implies: <b>a prisoner of war is not a traitor.</b> A prisoner of war is <b>someone on the right side who has been carried off</b>. His loyalty has not changed; his freedom of action has.</p><p>(Paul uses the positive form of the same verb in 2 Corinthians 10:5: “taking every thought <b>captive</b> to the obedience of Christ.”)</p><p><b>★ Fourth light: four different “laws”</b></p><p>Several “laws” (νόμος) appear in 7:21–25, and they must be kept apart:</p><table><tr><th>Reference</th><th>What “law” means</th></tr><tr><td>7:21 “I find a law”</td><td><b>a principle, a regularity</b> (not the Mosaic law)</td></tr><tr><td>7:22 “the law of God”</td><td>the law of Moses / the will of God</td></tr><tr><td>7:23 “the law of my mind”</td><td>the principle my mind assents to</td></tr><tr><td>7:23 “the law of sin in my members”</td><td><b>the regularity and power of sin</b></td></tr><tr><td>8:2 “the law of the Spirit of life”</td><td>the regularity and power of the Spirit</td></tr></table><p>Paul is playing on the double sense of νόμος: both the Mosaic law and “a principle that operates.” Just as we say “the law of gravity” — not a statute, but <b>a force that necessarily operates</b>.</p>","exp":"<p>7:21–23 draws a very concrete situation:</p><pre>my inward man: delights from the heart in God’s law (συνήδομαι)\n  ↓\nmy members: another law is operating\n  ↓\nthe two go to war (ἀντιστρατεύομαι)\n  ↓\nthe result: I am carried off (αἰχμαλωτίζω)</pre><p>And that word “carried off” carries the deepest pain of the passage:</p><p><b>I did not defect. I was taken.</b><br>In my heart I stand on the right side, and my body is in the enemy camp.</p>"},{"a":24,"z":24,"star":true,"grk":"<p>ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;</p>","lit":"<p>“<b>Wretched man that I am!</b> <b>Who</b> will <b>drag me out</b> of <b>this body of death</b>?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>wretched</td><td>ταλαίπωρος</td><td>talaipōros</td><td>G5005</td><td>—</td><td><b>miserable, worn down by hardship</b></td><td>see below</td></tr><tr><td>will deliver</td><td>ῥύσεται</td><td>rhysetai</td><td>G4506</td><td>ῥύομαι</td><td><b>to drag out, to rescue</b></td><td>see below</td></tr><tr><td>body of death</td><td>τὸ σῶμα τοῦ θανάτου</td><td>—</td><td>G4983 / G2288</td><td>—</td><td>the body of death</td><td>see below</td></tr></table>","gram":"<p><b>★ First light: talaipōros — a very heavy word</b></p><p>It occurs only twice in the New Testament:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Romans 7:24</b></td><td>“What a <b>wretched</b> man I am!”</td></tr><tr><td><b>Revelation 3:17</b></td><td>to Laodicea: “you do not know that you are <b>wretched</b>, miserable, poor, blind and naked.”</td></tr></table><p>In the Septuagint it describes exiled Israel and the crushed.<br>(James 5:1 uses the verb: “weep and howl.”)</p><p>This is not “I feel a bit low.” <b>This is the cry of someone at the end.</b></p><p><b>★ Second light: rhyomai — “to drag out”</b></p><p>The verb does not mean “to help.” It means <b>to pull someone out of danger, to rescue</b>. Other uses:</p><p>· Matthew 6:13, “<b>deliver</b> us from evil” (the Lord’s Prayer)<br>· Colossians 1:13, “he <b>delivered</b> us out of the power of darkness”<br>· 1 Thessalonians 1:10, “Jesus, who <b>delivers</b> us from the wrath to come”</p><p>Paul is not asking for help, or guidance, or a method. <b>He is asking to be rescued.</b></p><p><b>★ Third light: “who,” not “what”</b></p><p>τίς με ῥύσεται — <b>“Who</b> will deliver me?”</p><p>Paul does not ask:<br>· “What method will save me?”<br>· “What principle will save me?”<br>· “What must I do to save myself?”</p><p>He asks: <b>who</b>.</p><p>This is the decisive turn of chapter 7: <b>from a question about a method to a question about a person.</b><br>And the next sentence is that person’s name.</p><p><b>★ Fourth light: to sōma tou thanatou (the body of death)</b></p><p>Two main readings:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>“this mortal body”</b></td><td>the perishable body (compare 8:11, “your mortal bodies”)</td></tr><tr><td><b>“this body ruled by death”</b></td><td>the body as the arena in which sin and death operate</td></tr></table><p>(There is an old claim that ancient punishment involved binding a corpse to a criminal — but <b>this claim has no reliable ancient support, and should not be used from the pulpit</b>.)</p><p>On either reading, Paul’s point is the same: <b>I cannot get myself out of this.</b></p>","exp":"<p>7:24 is the emotional low point of the whole letter. But notice two things.</p><p><b>First, this cry is progress, not regress.</b></p><p>To arrive at 7:24 you must first have travelled through 7:18 — “to will is present with me, but to do what is good is not.”<br>That is: <b>you must first have tried with everything you had.</b><br>A person who has never seriously wanted holiness cannot produce the cry of 7:24.</p><p><b>Second, the direction of this cry is outward.</b></p><p>He does not say “I must try harder.” He asks, <b>“Who will deliver me?”</b></p><p>When a person stops asking “what should I do?” and begins asking “who can rescue me?” — <b>the gospel finally has somewhere to enter.</b></p>"},{"a":25,"z":25,"star":true,"grk":"<p>χάρις δὲ τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.</p>","lit":"<p>“But <b>thanks be to God</b> — through Jesus Christ our Lord! So then: I myself <b>with the mind</b> serve the law of God, but <b>with the flesh</b> the law of sin.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>thanks be to God</td><td>χάρις τῷ θεῷ</td><td>charis tō theō</td><td>G5485</td><td><b>grace be to God / thanks be to God</b></td></tr><tr><td>mind</td><td>νοῦς</td><td>nous</td><td>G3563</td><td>the mind, the understanding</td></tr></table>","gram":"<p><b>★ First light: the answer is a name</b></p><pre>7:24 asks:  “WHO will deliver me?”\n7:25 answers: “THROUGH JESUS CHRIST OUR LORD.”</pre><p>Notice: Paul does not give a method, a set of steps, or a spiritual discipline.<br>He gives <b>a name</b>.</p><p><b>★ Second light: the literal sense of charis tō theō</b></p><p>The phrase is literally <b>“grace be to God.”</b></p><p>After the deepest despair, Paul’s first reaction is <b>worship</b>.</p><p><b>★ Third light: the difficulty of the second half of 7:25</b></p><p>After “thanks be to God,” Paul adds: “I myself with the mind serve the law of God, but with the flesh the law of sin.”</p><p>Many readers are puzzled: having reached the answer, why return to the struggle? Two main readings:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>A summarising recapitulation</b></td><td>Paul first cries out the answer (25a), then looks back and <b>summarises</b> the diagnosis just given (25b); 8:1 then opens the answer properly</td></tr><tr><td><b>A description of the present age</b></td><td>the real state of a saved person now: the mind serving God, the flesh still carrying the residue of sin, until the body is redeemed (8:23)</td></tr></table><p>Both readings point to the same thing: <b>the “now” of 8:1 is where the answer really unfolds.</b></p><p>And 8:23 says it plainly: we “wait for adoption, <b>the redemption of our body</b>” — complete release waits for that day.</p>","exp":"<p>The first half of 7:25 is a single sentence, and it is the way out of the whole chapter.</p><p>And that sentence has three features:</p><pre>1. it is thanksgiving, not resolve\n2. it points to a person, not a method\n3. it stands immediately after the deepest despair — with nothing in between</pre><p>Paul does not leave that cry hanging in the air for longer than one sentence.</p><p>And 8:1 will open the sentence out in full:</p><p><b>“There is therefore now no condemnation to those who are in Christ Jesus. For the law of the Spirit of life in Christ Jesus made me free from the law of sin and of death.” (8:1–2)</b></p><p>Notice the verb in 8:2 — ἐλευθερόω, <b>to set free</b>.</p><pre>7:24 asks:   who will RESCUE (ῥύομαι) me?\n8:2 answers: the law of the Spirit has SET ME FREE (ἐλευθερόω)</pre><p><b>The question of chapter 7 receives, in chapter 8, a complete and trinitarian answer.</b></p>"}],"3":[{"a":1,"z":2,"star":false,"grk":"<p>1 Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς; 2 πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν [γὰρ] ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.</p>","lit":"<p>1 “What then is the Jew’s <b>advantage</b>, or what is the <b>benefit</b> of circumcision?”</p><p>2 “Much in every way. First of all, that they were <b>entrusted</b> with the <b>oracles</b> of God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>advantage</td><td>περισσόν</td><td>perisson</td><td>G4053</td><td>περί (beyond)</td><td><b>what is over and above</b></td><td>the “extra” the Jew has</td></tr><tr><td>profit</td><td>ὠφέλεια</td><td>ōpheleia</td><td>G5622</td><td>ὠφελέω (to benefit)</td><td>real, practical benefit</td><td>commercial vocabulary</td></tr><tr><td>oracles</td><td>λόγια</td><td>logia</td><td>G3051</td><td>diminutive of λόγος</td><td><b>divine utterances, the words God spoke</b></td><td>LXX usage for God’s word</td></tr><tr><td>were entrusted</td><td>ἐπιστεύθησαν</td><td>episteuthēsan</td><td>G4100</td><td>πιστεύω (to believe)</td><td><b>were trusted with</b></td><td>passive — and the same root as “faith”</td></tr></table>","gram":"<p><b>★ First light: the wordplay in episteuthēsan</b></p><p>This is the <b>aorist passive</b> of πιστεύω, “to believe.”<br>· Active: <b>to believe</b><br>· Passive: <b>to be trusted, to be entrusted</b></p><p>Paul has chosen a superb word: the Jews were <b>trusted by God</b> (ἐπιστεύθησαν) to keep his words.</p><p>And the very next verse (3:3) says, “What if some were unfaithful (ἠπίστησαν)…?” — <b>the same root</b>.</p><pre>3:2  ἐπιστεύθησαν     entrusted (trusted with)\n3:3  ἠπίστησαν        were unfaithful\n3:3  ἀπιστία          unfaithfulness\n3:3  πίστιν τοῦ θεοῦ  the faithfulness of God</pre><p>Four occurrences of one root, and English cannot show it at all.</p><p>Paul is saying: <b>God trusted you, and you did not keep faith with him — but your faithlessness cannot cancel his faithfulness.</b></p><p><b>★ Second light: “first of all” is never followed by “second”</b></p><p>Paul says “first,” and no “second” ever comes. (He will not give the full list until 9:4–5: “the adoption, the glory, the covenants, the giving of the law, the service, the promises, the fathers, and Christ.”)</p><p>This is the mark of a train of thought interrupted by an objection. <b>This is a live argument, not a rehearsed script.</b></p>","exp":"<p>Paul’s answer is worth noticing. He does not deny Jewish privilege in order to make the point that everyone is equally guilty.</p><p><b>“Much in every way!”</b></p><p>This is a vital pastoral model: <b>you can dismantle someone’s false confidence without denying God’s real grace to them.</b></p><p>What is the Jew’s greatest advantage? Not that they were better, but that <b>they had the words of God in their hands</b>.</p><p>But that is exactly the problem of chapter 2: <b>having God’s word in your hands and having it in your heart are two different things.</b></p><p><b>What the text plainly says:</b> the Jews had real privilege — first of all, the oracles of God were entrusted to them.</p><p><b>What may fairly be drawn from it:</b> we hold entire Bibles today, and endless preaching resources. That is an immense trust. But <b>being entrusted is not the same as being changed</b>.</p>"},{"a":3,"z":4,"star":false,"grk":"<p>3 τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει? 4 μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης…</p>","lit":"<p>3 “For what if some were unfaithful? Will their unfaithfulness nullify the <b>faithfulness</b> of God?”</p><p>4 “By no means! <b>Rather, let God be found true, and every man a liar</b>…”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>were unfaithful</td><td>ἠπίστησαν</td><td>ēpistēsan</td><td>G569</td><td><b>to be unfaithful, to break faith</b> (not merely intellectual disbelief)</td></tr><tr><td>the faithfulness of God</td><td>πίστις τοῦ θεοῦ</td><td>pistis theou</td><td>G4102</td><td><b>God’s own faithfulness</b> (not “faith in God”)</td></tr><tr><td>nullify</td><td>καταργήσει</td><td>katargēsei</td><td>G2673</td><td>κατά + ἀργός (idle): <b>to render void, to cancel</b></td></tr><tr><td>by no means</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td>May it never be! The strongest negation in Greek</td></tr></table>","gram":"<p><b>★ First light: how to translate pistis tou theou</b></p><p>This is a <b>subjective genitive</b>: <b>the faithfulness God himself possesses</b>, not “faith in God.”</p><p>This verse is the floor of the whole chapter, and of the whole letter: if God would break covenant because people failed, the gospel would be worth nothing.</p><p><b>★ Second light: katargeō is a key word in Romans</b></p><pre>3:3   can human unfaithfulness NULLIFY God’s faithfulness? → no\n3:31  do we then NULLIFY the law through faith?           → no\n6:6   that the body of sin might be DONE AWAY WITH\n7:2, 7:6  DISCHARGED from the law</pre><p><b>★ Third light: the force of the imperative ginesthō</b></p><p>“Rather” in Greek is γινέσθω — a <b>third-person imperative</b>: <b>“let it be so!”</b></p><p>This is not a neutral statement. It is a declaration, a taking of sides: <b>“Even if the whole world proves a liar, let God be shown to be true!”</b></p><p><b>★ Fourth light: the quotation is Psalm 51:4</b></p><p>“Against you, you only, have I sinned, and done what is evil in your sight; so you are justified when you speak, and blameless when you judge.”</p><p>Paul quotes David’s confession after his adultery.</p><p>The choice runs very deep: <b>even Israel’s greatest king could only say, “God, you are right, and I am wrong.”</b></p>","exp":"<p>This paragraph answers a lethal question: <b>if God’s people fail, does that prove God has failed?</b></p><p>Paul’s answer: no. Human unfaithfulness cannot prove God unfaithful. It can only prove <b>people</b> unfaithful.</p><p>This matters enormously for the church today:<br>· when you see scandal in the church<br>· when the preacher you admired falls<br>· when you watch yourself fail again</p><p>You can say: “this proves God is not reliable.”<br>Paul says: <b>“this proves people are not reliable. God is still true.”</b></p><p>One definition of faith: <b>to say “God is true” while every piece of evidence in front of you is human failure.</b></p>"},{"a":5,"z":8,"star":false,"grk":"<p>5 …μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω. 8 …ποιήσωμεν τὰ κακά, ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.</p>","lit":"<p>5 “But if our unrighteousness <b>demonstrates</b> the righteousness of God, what shall we say? Is God <b>unjust</b> who inflicts wrath? — <b>I am speaking in human terms.</b>”</p><p>6 “By no means! For then how could God judge the world?”</p><p>7 “But if the truth of God, through my <b>lie</b>, abounded to his glory, why am I still judged as a sinner?”</p><p>8 “And why not say, ‘<b>Let us do evil that good may come</b>’? — some <b>slanderously</b> report that we say this. <b>Their condemnation is just.</b>”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>in human terms</td><td>κατὰ ἄνθρωπον</td><td>kata anthrōpon</td><td>G444</td><td><b>speaking as people speak</b> — Paul apologising for his own phrasing</td></tr><tr><td>demonstrates</td><td>συνίστησιν</td><td>synistēsin</td><td>G4921</td><td><b>to set side by side, to exhibit</b> (as when two things are placed together)</td></tr><tr><td>are slanderously reported</td><td>βλασφημούμεθα</td><td>blasphēmoumetha</td><td>G987</td><td><b>to be blasphemed, slandered</b> (same word as 2:24)</td></tr><tr><td>just</td><td>ἔνδικος</td><td>endikos</td><td>G1738</td><td>well-founded, <b>a verdict that stands</b></td></tr></table>","gram":"<p><b>★ First light: kata anthrōpon legō (“I speak in human terms”)</b></p><p>Paul inserts this clause <b>because what he has just said (“is God unjust who inflicts wrath?”) verges on blasphemy</b>.</p><p>He will not let that sentence stand in the air unmarked. This is a mark of godliness: even to quote a blasphemous argument for the sake of debate, he must first apologise.</p><p><b>★ Second light: blasphēmoumetha echoes 2:24</b></p><pre>2:24  the name of God is BLASPHEMED (βλασφημεῖται) because of you\n3:8   Paul is SLANDERED (βλασφημούμεθα)</pre><p>The same word. In chapter 2 it is God’s name being blasphemed; in chapter 3 it is Paul’s name being slandered.</p><p>Anyone who preaches grace clearly should be prepared for this: <b>a pure gospel of grace will always be misheard as permission.</b></p><p><b>★ Third light: “let us do evil” is a hortatory subjunctive</b></p><p>“Let us do evil that good may come” — this reads like <b>a slogan</b>. It suggests this really was a saying in circulation, put into Paul’s mouth.</p>","exp":"<p>The logic of this paragraph is: “if my sin makes God look more glorious, on what grounds does he punish me?”</p><p>It sounds clever, and it conceals something lethally self-centred: <b>using the glory of God as a shield for my own sin.</b></p><p>Paul’s reply is a single sentence (3:6): <b>“For then how could God judge the world?”</b></p><p>If that logic holds, God can never judge anyone — and Scripture from beginning to end testifies that God is the Judge of all the earth.</p><p>Then Paul does something rare. He does not go on arguing; he passes sentence: <b>“Their condemnation is just.”</b></p><p><b>Some arguments do not need to be answered. They only need to be exposed.</b></p><p>Paul will answer the question fully in chapter 6 (6:1–14): not “doing evil for good is a bad idea,” but <b>“you have died with Christ — how can you still live in sin?”</b></p>"},{"a":9,"z":9,"star":false,"grk":"<p>Τί οὖν; προεχόμεθα; οὐ πάντως· προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ' ἁμαρτίαν εἶναι</p>","lit":"<p>“What then? Are we <b>at an advantage</b>? Not at all! For we have already <b>brought the charge</b> that both Jews and Greeks are <b>all under sin</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>are we better</td><td>προεχόμεθα</td><td>proechometha</td><td>G4284</td><td>προ (before) + ἔχω (to have): <b>to hold an advantage</b></td></tr><tr><td>we previously charged</td><td>προῃτιασάμεθα</td><td>proētiasametha</td><td>G4256</td><td><b>only here in the NT</b>; αἰτία (a charge): <b>to lay a formal accusation beforehand</b></td></tr><tr><td>under sin</td><td>ὑφ' ἁμαρτίαν</td><td>hyph' hamartian</td><td>G266</td><td>ὑπό + accusative: <b>under the power of sin</b></td></tr></table>","gram":"<p><b>★ First light: proētiasametha is a legal term</b></p><p>αἰτία is a “charge”; with προ- it means <b>a charge already formally laid</b>.</p><p>Paul is saying: <b>the indictment has been written (1:18–2:29); now I am calling the witnesses.</b></p><p><b>★ Second light: the force of the preposition in hyph’ hamartian</b></p><p>ὑπό + accusative = <b>“under the authority or rule of”</b> (as in “under law,” 6:14; “kept under guard,” Galatians 3:23).</p><p><b>What does this grammar do to the verse?</b><br>Paul does not say “everyone has committed many sins” (that would be sinful acts). He says <b>everyone is under sin</b> — that is a nature, a power.</p><p><b>Sin is not only what I do. Sin is the master who rules me.</b></p><p>This verse is the seed of “slaves of sin” in chapter 6.</p>","exp":"<p>3:9 is the <b>closing statement</b> of Paul’s whole prosecution.</p><p>He indicted the Gentiles (1:18–32), then the Jews (2:1–29), and at 3:9 he merges the two indictments: <b>“both Jews and Greeks are all under sin.”</b></p><p><b>What the text plainly says:</b> the Jew holds no “advantage” (προεχόμεθα) in the matter of salvation; both groups alike are <b>under the power of sin</b>.</p><p><b>What may fairly be drawn from it:</b> Paul uses <b>legal vocabulary</b> (προαιτιάομαι, to lay a formal charge in advance), which means chapters 1 and 2 are not an emotional scolding — they are <b>a written indictment</b>.</p><p>And ὑφ’ ἁμαρτίαν speaks of <b>power</b>, not only conduct. So the human problem is not “how many bad things I have done,” but <b>“there is a master ruling me”</b> — which is the seed of chapter 6.</p><p><b>⚠ Pastoral note:</b> 3:9 is not meant to make people feel worthless. It is meant to make them <b>silent</b> (3:19). And the sentence that follows the silence is the “but now” of 3:21.</p>"},{"a":10,"z":12,"star":false,"grk":"<p>10 …οὐκ ἔστιν δίκαιος οὐδὲ εἷς, 11 οὐκ ἔστιν ὁ συνίων, οὐκ ἔστιν ὁ ἐκζητῶν τὸν θεόν. 12 πάντες ἐξέκλιναν ἅμα ἠχρεώθησαν· οὐκ ἔστιν ὁ ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.</p>","lit":"<p>10 “<b>There is no one righteous, not even one</b>;”</p><p>11 “<b>there is no one who understands</b>; <b>there is no one who seeks after God</b>.”</p><p>12 “They have <b>all turned aside</b>; together they have <b>become worthless</b>; <b>there is no one who does good, not so much as one</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>who understands</td><td>συνίων</td><td>syniōn</td><td>G4920</td><td>σύν + ἵημι: <b>to put things together and see</b> (spiritual perception)</td></tr><tr><td>who seeks</td><td>ἐκζητῶν</td><td>ekzētōn</td><td>G1567</td><td>ἐκ + ζητέω: <b>to search out earnestly</b> (intensive)</td></tr><tr><td>turned aside</td><td>ἐξέκλιναν</td><td>exeklinan</td><td>G1578</td><td>ἐκ + κλίνω: <b>to turn off, to leave the road</b></td></tr><tr><td>become worthless</td><td>ἠχρεώθησαν</td><td>ēchreōthēsan</td><td>G889</td><td>ἀ + χρηστός (useful): <b>to go sour, to spoil, to become unusable</b></td></tr><tr><td>does good</td><td>ποιῶν χρηστότητα</td><td>chrēstotēs</td><td>G5544</td><td><b>kindness</b> — the very word of 2:4, “God’s kindness”</td></tr></table>","gram":"<p><b>★ First light: the picture in ēchreōthēsan</b></p><p>In classical Greek and the Septuagint this word is used of <b>milk going sour, food spoiling, vessels becoming unusable</b>.</p><p>Quoting Psalm 14:3, Paul says: people are not partly broken. They have <b>gone off</b>.</p><p><b>★ Second light: the astonishing contrast in chrēstotēta</b></p><p>3:12 says “there is no one who does <b>kindness</b> (χρηστότης), not so much as one.”<br>2:4 says God has <b>“riches of kindness”</b> (χρηστότης).</p><p><b>The same word.</b> There is not a scrap of kindness in us; and in God there is an abundance of it.<br><b>That gap is the gospel.</b></p><p><b>★ Third light: oude heis / heōs henos (“not even one”)</b></p><p>Paul says <b>“not one”</b> twice, in 3:10 and 3:12.</p><p>This is the least welcome sentence in the passage, because everyone is thinking: “surely there is at least one? I know someone who is really good…”<br>Paul says: <b>not even one</b>.</p>","exp":"<p>Notice the order in verse 11: first “no one understands,” then “no one seeks after God.”</p><p>That reveals a sequence: <b>it is not that people first decline to look for God — it is that they first cannot see.</b></p><p>And verse 12 adds, “they have all turned aside” — ἐξέκλιναν pictures someone walking on a road and then turning off it. <b>People did not stand still. They actively left.</b></p><p><b>What the text plainly says:</b> the Old Testament itself testifies that there is no righteous person, no one who understands, no one who seeks God.</p><p><b>What may fairly be drawn from it:</b> if not one person seeks God, then the fact that I am sitting here reading Scripture today is not that <b>I found God</b>. It is that <b>God found me first</b>.</p>"},{"a":13,"z":14,"star":false,"grk":"<p>13 τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν· 14 ὧν τὸ στόμα ἀρᾶς καὶ πικρίας γέμει.</p>","lit":"<p>13 “Their <b>throat is an open grave</b>; with their tongues <b>they have used deceit</b>; <b>the poison of asps</b> is under their lips;”</p><p>14 “whose mouth is <b>full of cursing and bitterness</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>throat</td><td>λάρυγξ</td><td>larynx</td><td>G2995</td><td>the throat (English “larynx” comes from it)</td></tr><tr><td>open grave</td><td>τάφος ἀνεῳγμένος</td><td>taphos aneōgmenos</td><td>G5028</td><td><b>perfect passive participle</b>: opened, and standing open</td></tr><tr><td>used deceit</td><td>ἐδολιοῦσαν</td><td>edoliousan</td><td>G1387</td><td>δόλος (bait, a trick): <b>to lure with bait</b></td></tr><tr><td>poison</td><td>ἰός</td><td>ios</td><td>G2447</td><td>venom; also <b>rust</b> (James 5:3)</td></tr><tr><td>cursing</td><td>ἀρά</td><td>ara</td><td>G685</td><td>a curse</td></tr><tr><td>bitterness</td><td>πικρία</td><td>pikria</td><td>G4088</td><td>bitterness, rancour</td></tr><tr><td>is full</td><td>γέμει</td><td>gemei</td><td>G1073</td><td><b>filled to overflowing</b> (as a ship is loaded)</td></tr></table>","gram":"<p><b>★ First light: the perfect participle in taphos aneōgmenos</b></p><p>“An open grave” is not an adjective; it is a <b>perfect passive participle</b>: <b>a grave that has been opened and has remained open</b>.</p><p>Jews had a powerful sense of the defilement of graves (Numbers 19:16: touching a grave made a person unclean for seven days).</p><p>An open grave means two things:<br>1. <b>the stench of decay comes straight out</b><br>2. <b>anyone who comes near is defiled</b></p><p>Paul says: this is what the human throat is like. It died long ago inside; and when the words come out, the smell comes with them — and it contaminates the people nearby.</p><p><b>★ Second light: ios aspidōn (the poison of asps)</b></p><p>ἀσπίς is the Egyptian cobra.</p><p>A serpent’s venom sits in a gland behind the teeth — <b>you cannot see it until it bites</b>.</p><p><b>The serpent of Genesis 3 used exactly this kind of poison: the poison of words.</b></p><p><b>★ Third light: gemei (full)</b></p><p>The present tense marks <b>a continuing state</b> — not the occasional bitter remark, but a mouth that was already loaded.</p><p>Jesus said, “out of the abundance of the heart the mouth speaks” (Matthew 12:34).<br>These verses of Paul are the footnote to that sentence.</p>","exp":"<p>Why does Paul spend four organs — throat, tongue, lips, mouth — on speech?</p><p>Because <b>speech is the outlet of the heart</b>.</p><p>You can manage your behaviour, but you cannot govern your tongue (James 3:8, “no one can tame the tongue”).</p><p>So words are the most honest evidence there is. Your comments online, what you mutter alone in the car, what comes out in the three seconds when you lose your temper — <b>that is you</b>.</p>"},{"a":15,"z":17,"star":false,"grk":"<p>15 ὀξεῖς οἱ πόδες αὐτῶν ἐκχέαι αἷμα, 16 σύντριμμα καὶ ταλαιπωρία ἐν ταῖς ὁδοῖς αὐτῶν, 17 καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν.</p>","lit":"<p>15 “Their feet are <b>swift to shed blood</b>;”</p><p>16 “<b>ruin and misery</b> are in their paths;”</p><p>17 “and <b>the way of peace they have not known</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>swift</td><td>ὀξεῖς</td><td>oxeis</td><td>G3691</td><td><b>sharp, quick</b> (the same word is used of a sharp blade)</td></tr><tr><td>ruin</td><td>σύντριμμα</td><td>syntrimma</td><td>G4938</td><td>σύν + τρίβω: <b>to crush, to shatter</b> (fragments everywhere)</td></tr><tr><td>misery</td><td>ταλαιπωρία</td><td>talaipōria</td><td>G5004</td><td>wretchedness, hardship</td></tr><tr><td>peace</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>translating the Hebrew <b>shalom</b>: <b>wholeness, completeness, reconciliation</b></td></tr></table>","gram":"<p>The quotation is from Isaiah 59:7–8.</p><p>The setting of that chapter is pre-exilic Israel, a society riddled with injustice, where the prophet says “your iniquities have separated you from your God” (Isaiah 59:2).</p><p>σύντριμμα (shattering) and εἰρήνη / shalom (wholeness) are exact opposites:<br>· the root of <b>shalom</b> means <b>whole, with nothing missing</b><br>· <b>syntrimma</b> means <b>broken in pieces</b></p><p>The road people walk leaves fragments behind them; and God’s road is called <b>wholeness</b>.</p><p>People never knew how to walk that road — until the One came who said,
