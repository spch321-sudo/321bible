:"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>苦</td><td>ταλαίπωρος</td><td>talaipōros</td><td>G5005</td><td>—</td><td><b>悲惨的、受尽折磨的</b></td><td>见下</td></tr><tr><td>救</td><td>ῥύσεται</td><td>rhysetai</td><td>G4506</td><td>ῥύομαι</td><td><b>拉出来、抢救出来</b></td><td>见下</td></tr><tr><td>取死的身体</td><td>τὸ σῶμα τοῦ θανάτου</td><td>—</td><td>G4983/G2288</td><td>—</td><td>死亡的身体</td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：ταλαίπωρος ——极重的一个字</p><p>这个字在新约只出现两次：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>罗7:24</b></td><td>「我真是<b>苦</b>啊！」</td></tr><tr><td><b>启3:17</b></td><td>老底嘉教会：「你却不知道你是那<b>困苦</b>、可怜、贫穷、瞎眼、赤身的。」</td></tr></table><p>在七十士译本中，它用于形容被掳的以色列、被压伤的人。</p><p>（雅5:1用其动词形：「你们要哭泣号咷。」）</p><p>这不是「我有点沮丧」。</p><p>这是一个人在绝境中的呼喊。</p><p>★ 亮光二：ῥύομαι ——「拉出来」</p><p>这个动词的意思不是「帮助」，是<b>从危险中把人拉出来、抢救</b>。</p><p>其他用法：</p><p>- <b>太6:13</b>「<b>救</b>我们脱离凶恶」（主祷文！）<br>- <b>西1:13</b>「他<b>救</b>了我们脱离黑暗的权势」<br>- <b>帖前1:10</b>「就是耶稣<b>救</b>我们脱离将来忿怒的」</p><p>保罗要的不是帮助，不是指导，不是方法。</p><p>他要的是<b>抢救</b>。</p><p>★ 亮光三：「谁」而不是「什么」</p><p>τίς με ῥύσεται——「<b>谁</b>能救我？」</p><p>保罗没有问：</p><p>- 「什么方法能救我？」<br>- 「什么原则能救我？」<br>- 「我该做什么才能救自己？」</p><p>他问的是：<b>谁</b>。</p><p>弟兄姊妹，这是第七章最重要的一个转折。</p><p>从一个<b>方法</b>的问题，变成一个<b>位格</b>的问题。</p><p>而下一句话，就是那个名字。</p><p>★ 亮光四：τὸ σῶμα τοῦ θανάτου（取死的身体）</p><p>两种主要理解：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>「这具会死的身体」</b></td><td>指必朽坏的身体（8:11「必死的身体」）</td></tr><tr><td><b>「这具被死辖制的身体」</b></td><td>指身体作为罪与死运作的场所</td></tr></table><p>（历史上曾有一种说法，说古代刑罚会把尸体绑在犯人身上——但这个说法<b>缺乏可靠的古代史料支持</b>，讲台上不宜使用。）</p><p>无论哪一种理解，保罗的重点是：这个处境，我自己出不来。</p>","exp":"<p>弟兄姊妹，7:24是全卷罗马书情绪的最低点。</p><p>但请注意两件事：</p><p>第一，这声呼喊是<b>进步</b>，不是退步。</p><p>一个人要走到7:24，必须先走过7:18——</p><p>「立志为善由得我，只是行出来由不得我。」</p><p>也就是说：他必须先<b>用尽全力尝试过</b>，才会喊出这句话。</p><p>一个从来没有认真想过要圣洁的人，喊不出7:24。</p><p>第二，这声呼喊的方向是<b>向外</b>的。</p><p>他没有说「我要更努力」。<br>他问：「<b>谁</b>能救我？」</p><p>当一个人不再问「我该怎么办」，而开始问「谁能救我」——</p><p>福音就有地方可以进来了。</p>"},{"a":25,"z":25,"star":true,"grk":"<p>χάρις δὲ τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.</p>","lit":"<p>「但<b>感谢神</b>——借着我们的主耶稣基督！所以这样看来：我自己，<b>用心思</b>服事神的律，<b>用肉体</b>却服事罪的律。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>感谢神</td><td>χάρις τῷ θεῷ</td><td>charis tō theō</td><td>G5485</td><td><b>恩典归与神／感谢神</b></td></tr><tr><td>心</td><td>νοῦς</td><td>nous</td><td>G3563</td><td>心思、理智</td></tr></table>","gram":"<p>★ 亮光一：答案是一个名字</p><p>7:24问：「<b>谁</b>能救我？」</p><p>7:25答：「<b>借着我们的主耶稣基督</b>。」</p><p>注意：保罗没有给一个方法、一套步骤、一个属灵操练。</p><p>他给了一个<b>名字</b>。</p><p>★ 亮光二：χάρις τῷ θεῷ 的字面</p><p>这句话的字面是「<b>恩典归与神</b>」。</p><p>在最深的绝望之后，保罗第一个反应是——<b>敬拜</b>。</p><p>★ 亮光三：7:25下半的难题</p><p>「感谢神」之后，保罗又说：「我以内心顺服神的律，我肉体却顺服罪的律了。」</p><p>这让许多读者困惑：既然已经「感谢神」了，为什么又回到挣扎？</p><p>两种主要理解（见第三部分结构分析）：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>总结性倒叙</b></td><td>保罗先喊出答案（25上），再回头<b>总结</b>前面的诊断（25下），然后8:1才正式展开</td></tr><tr><td><b>描述今世的现况</b></td><td>得救之人在今世的真实状态：内心顺服神，肉体仍有罪的残余，直到身体得赎（8:23）</td></tr></table><p>两种理解都指向同一件事：</p><p>8:1的「如今」才是真正的展开。</p><p>而8:23说得很清楚：我们「等候得着儿子的名分，乃是我们的<b>身体得赎</b>」——<br>完全的释放，要等到那一天。</p>","exp":"<p>弟兄姊妹，7:25上半只有一句话，却是整章的出口。</p><p>而这句话有三个特点：</p><p>1. <b>它是感谢</b>，不是决心<br>2. <b>它指向一位</b>，不是一个方法<br>3. <b>它紧接在最深的绝望之后</b>——中间没有过渡</p><p>保罗没有让那声呼喊悬在空中超过一句话。</p><p>而8:1会把这句话完整展开：</p><p><b>「如今，那些在基督耶稣里的就不定罪了。因为赐生命圣灵的律，在基督耶稣里释放了我，使我脱离罪和死的律了。」</b>（8:1–2）</p><p>注意8:2的「释放」——ἐλευθερόω。</p><p>7:24问：谁能救（ῥύομαι）我？<br>8:2答：圣灵的律<b>释放</b>（ἐλευθερόω）了我。</p><p>第七章的问题，在第八章有一个完整的、三一神的答案。</p>"}],"8":[{"a":1,"z":1,"star":true,"grk":"<p>Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>「所以<b>如今</b>，对那些在基督耶稣里的人，<b>没有一点定罪</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>没有</td><td>οὐδέν</td><td>ouden</td><td>G3762</td><td>οὐδέ + εἷς</td><td><b>一点也没有</b>（强调的否定）</td><td>见下</td></tr><tr><td>如今</td><td>νῦν</td><td>nyn</td><td>G3568</td><td>—</td><td><b>现在、此刻</b></td><td>3:21「但如今」的呼应</td></tr><tr><td>定罪</td><td>κατάκριμα</td><td>katakrima</td><td>G2631</td><td>κατά + κρίνω</td><td><b>判决、定罪的判词</b></td><td><b>5:16、18同字</b></td></tr><tr><td>在基督耶稣里</td><td>ἐν Χριστῷ Ἰησοῦ</td><td>—</td><td>—</td><td>—</td><td>保罗神学的核心</td><td>位置，不是修辞</td></tr></table>","gram":"<p>★ 亮光一：句首的 Οὐδέν 是强调位置</p><p>希腊文原句的第一个字，就是「<b>一点也没有</b>」。</p><p>中文的语序是「如今……就不定罪了」；原文是：</p><p>「<b>一点定罪也没有</b>——所以，如今，对那些在基督耶稣里的人。」</p><p>保罗把「没有」放在最前面，像一记重锤先落下来。</p><p>★ 亮光二：κατάκριμα 不是「定罪的行为」，是「判决本身」</p><p>希腊文有两个相关的字：</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>κατάκρισις</b></td><td>定罪的<b>动作</b></td></tr><tr><td><b>κατάκριμα</b></td><td><b>判决的内容／刑罚本身</b>（-μα 结尾表示结果）</td></tr></table><p>所以8:1不只是说「神现在不定你的罪」，<br>而是说：<b>那份判决书，本身不存在了</b>。</p><p>这个字在罗马书只出现三次，全部在第五章与第八章：</p><pre>5:16  审判是由一人而定罪（κατάκριμα）\n5:18  因一次的过犯，众人都被定罪（κατάκριμα）\n8:1   如今……就不定罪（κατάκριμα）了</pre><p>第五章说：亚当带来了那份判决书。<br>第八章说：在基督里的人，那份判决书没有了。</p><p>★ 亮光三：关于8:1的抄本问题（必须诚实处理）</p><p>部分较晚的抄本在8:1末尾加上：「不随从肉体、只随从圣灵的人。」</p><p>多数现代学者认为：</p><p>这句话是抄写员从8:4误抄过来的（同化现象）。</p><p>较早的抄本（如西乃抄本、梵蒂冈抄本）在8:1没有这一句。</p><p>这件事为什么重要？</p><p>因为若加上那句话，8:1就变成<b>有条件的</b>：<br>「你若随从圣灵，就不定罪。」</p><p>而按较早的读法，8:1是<b>无条件的</b>：<br>「在基督耶稣里的，就不定罪了。」</p><p>讲台诚信提醒：可以说「早期抄本在这里没有那个附加句」，但不要说「和合本翻错了」——<br>和合本正文其实就没有那一句，这正符合现代学术的判断。</p>","exp":"<p>弟兄姊妹，8:1要接在7:24之后读，才知道它有多大。</p><pre>7:24  「我真是苦啊！谁能救我？」\n8:1   「如今，那些在基督耶稣里的就不定罪了。」</pre><p>一个刚刚承认自己完全失败的人，听见的第一句话是：</p><p>「没有定罪。」</p><p>不是「你要改进」。<br>不是「下次不可以了」。<br>是——<b>一点定罪也没有</b>。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.</p>","lit":"<p>「因为那<b>生命之灵的律</b>，在基督耶稣里，<b>释放了你</b>，脱离了罪与死的律。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>律</td><td>νόμος</td><td>nomos</td><td>G3551</td><td>此处指<b>运作的规律／权势</b>（如「地心引力定律」）</td></tr><tr><td>释放</td><td>ἠλευθέρωσεν</td><td>ēleutherōsen</td><td>G1659</td><td><b>使之自由</b>（6:18、6:22同字）</td></tr></table>","gram":"<p>★ 亮光一：这里的「律」是什么意思？</p><p>保罗在7:21–23已经用过 νόμος 的双关：</p><table><tr><th>出处</th><th>「律」的意思</th></tr><tr><td>7:22「神的律」</td><td>摩西律法</td></tr><tr><td>7:23「肢体中犯罪的律」</td><td><b>一种运作的规律／权势</b></td></tr><tr><td><b>8:2「赐生命圣灵的律」</b></td><td><b>一种运作的规律／权势</b></td></tr></table><p>保罗在说：这不是「一套新规矩取代旧规矩」。</p><p>这是<b>一种更强的力量，胜过了另一种力量</b>。</p><p>打个比方：</p><p>地心引力是一个定律——东西会往下掉。</p><p>但一架飞机起飞了。</p><p>地心引力被废除了吗？没有。<br>是有一个<b>更强的力量</b>，胜过了它。</p><p>★ 亮光二：一个抄本问题</p><p>8:2末尾「释放了<b>我</b>」还是「释放了<b>你</b>」？</p><p>- 部分抄本作 <b>με</b>（我）——和合本采此读法<br>- 部分较早的抄本作 <b>σε</b>（你）</p><p>两种读法对神学没有影响。<br>若是「你」，则保罗在此突然转向读者，语气更直接：<br>「你」——就是还在7:24里呼喊的那个你。</p><p>★ 亮光三：7:24与8:2的动词对照</p><pre>7:24  τίς με ῥύσεται      —— 谁能「救」（抢救出来）我？\n8:2   ἠλευθέρωσέν σε      —— 圣灵的律「释放」了你</pre><p>第七章问了一个问题，第八章给了一个<b>已完成</b>的动词（不定过去式）。</p><p>不是「圣灵会释放你」，是「<b>已经释放了</b>」。</p>","exp":"<p>弟兄姊妹，8:1说了结果（不定罪）；8:2说的是<b>原因</b>。</p><p>而保罗用了一个很特别的说法：<b>两个「律」在角力</b>。</p><pre>罪和死的律   ——  在第七章，那是赢的一方（7:23）\n赐生命圣灵的律 ——  在第八章，换了一位更强的</pre><p><b>经文本身明确表达的：</b> 在基督耶稣里，圣灵的律已经（不定过去式）把人从罪和死的律之下释放出来。</p><p><b>可以合理推论的：</b> 「释放」不是「那个律消失了」。<br>地心引力没有被废除；只是有一个更强的力量胜过了它。</p><p>所以第七章那个挣扎不会在第八章完全消失——<br>改变的是：<b>你不再是一个人在打</b>（8:26）。</p><p><b>⚠ 牧养提醒：</b> 若有人读完第八章，以为「真信主的人就不会再挣扎了」，<br>那是误读。8:23明说：连有圣灵的人「<b>也是</b>自己心里叹息」。</p>"},{"a":3,"z":4,"star":true,"grk":"<p>3 Τὸ γὰρ ἀδύνατον τοῦ νόμου ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινεν τὴν ἁμαρτίαν ἐν τῇ σαρκί,<br>4 ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα.</p>","lit":"<p>3「因为律法所<b>做不到的</b>——就是它因肉体而软弱之处——神就差遣自己的儿子，<b>在罪之肉身的样式中</b>，并且为了罪，<b>在肉体中定了罪的罪</b>；」<br>4「为要使律法的<b>义的要求</b>，<b>被成就在我们里面</b>——就是我们这些不照着肉体、乃照着圣灵而行的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>不能行的</td><td>τὸ ἀδύνατον</td><td>to adynaton</td><td>G102</td><td>ἀ + δύναμις（能力）</td><td><b>无能为力之处</b></td><td>律法的无能</td></tr><tr><td>形状</td><td>ὁμοίωμα</td><td>homoiōma</td><td>G3667</td><td>ὅμοιος（相似）</td><td><b>样式、相似的形状</b></td><td><b>极重要</b>（见下）</td></tr><tr><td>定了罪案</td><td>κατέκρινεν</td><td>katekrinen</td><td>G2632</td><td>κατά + κρίνω</td><td><b>定罪、判决</b></td><td>8:1 κατάκριμα 的动词</td></tr><tr><td>义（的要求）</td><td>δικαίωμα</td><td>dikaiōma</td><td>G1345</td><td>δίκαιος</td><td><b>义的要求／判决</b></td><td><b>2:26同字！</b></td></tr><tr><td>成就</td><td>πληρωθῇ</td><td>plērōthē</td><td>G4137</td><td>πληρόω</td><td><b>被成全</b>（<b>被动式</b>！）</td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：ὁμοίωμα ——保罗极度精确的用字</p><p>「成为<b>罪身的形状</b>」——这五个字，保罗写得极其小心。</p><p>他<b>没有</b>说：</p><p>- ❌ 「成为罪身」（那就是说基督有罪性）<br>- ❌ 「成为肉身的形状」（那就是幻影说，否认真实的人性）</p><p>他说的是：</p><p>ἐν ὁμοιώματι σαρκὸς ἁμαρτίας ——「在<b>罪之肉身的样式</b>中」。</p><p>这句话同时保住了两件事：</p><table><tr><th>保住的真理</th><th>说明</th></tr><tr><td><b>祂真的成为人</b></td><td>是真实的肉身，不是幻影（约1:14；来2:14）</td></tr><tr><td><b>祂没有罪</b></td><td>是「样式」，不是罪性本身（来4:15「只是他没有犯罪」；林后5:21「那不知罪的」）</td></tr></table><p>弟兄姊妹，这是新约中最精密的一句基督论陈述之一。</p><p>祂进到了我们的处境<b>里面</b>——但祂没有沾染那个处境的罪。</p><p>★ 亮光二：「在肉体中定了罪案」——定罪落在哪里？</p><p>κατέκρινεν τὴν ἁμαρτίαν ἐν τῇ σαρκί ——「在肉体中，定了罪的罪」。</p><p>注意：定罪的对象是<b>罪</b>，不是人。</p><p>而定罪的<b>地点</b>是「在肉体中」——</p><p>在哪一个肉体中？</p><p>在<b>祂的</b>肉体中。在十字架上。</p><p>于是8:1与8:3形成一个完整的对句：</p><pre>8:3  神在基督的肉体中「定了罪」（κατέκρινεν）\n   ↓ 所以\n8:1  在基督里的人「不被定罪」（κατάκριμα）</pre><p>定罪没有消失。定罪换了地址。</p><p>★ 亮光三：8:4「被成就」是被动式！</p><p>「使律法的义<b>成就</b>在我们……身上」——πληρωθῇ 是<b>被动式</b>。</p><p>不是「我们去成就律法的义」，<br>是「律法的义<b>被成就</b>在我们里面」。</p><p>主动者是谁？是神借着圣灵。</p><p>而且介词是 <b>ἐν ἡμῖν</b>——「<b>在我们里面</b>」，不只是「在我们身上」。</p><p>★ 亮光四：δικαίωμα 与2:26的呼应</p><p>「律法的义」（τὸ δικαίωμα τοῦ νόμου）这个词组，在罗马书只出现两次：</p><pre>2:26  那未受割礼的，若遵守律法的条例（δικαιώματα）……\n8:4   使律法的义（δικαίωμα）成就在我们……身上</pre><p>保罗在第二章丢出的问题——「一个外邦人怎么可能遵守律法的条例？」——</p><p>在第八章给了答案：<b>靠圣灵</b>。</p>","exp":"<p>弟兄姊妹，8:3是第七章的直接答案。</p><pre>7:18  「立志为善由得我，只是行出来由不得我」  —— 我做不到\n8:3   「律法既因肉体软弱，有所不能行的」      —— 律法也做不到\n   ↓\n8:3   「神就差遣自己的儿子……」                —— 所以神自己做了</pre><p>第七章的绝望，不是因为你不够好。<br>是因为那条路，<b>本来就走不通</b>——连律法自己都走不通。</p><p>所以神换了一条路：祂差祂的儿子来。</p><p>【第二段｜8:5–11　两种心思】</p>"},{"a":5,"z":8,"star":false,"grk":"<p>6 τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·</p>","lit":"<p>5「因为那些照着肉体而活的人，<b>心思定在</b>肉体的事上；那些照着圣灵而活的人，<b>心思定在</b>圣灵的事上。」<br>6「因为肉体的<b>心思倾向</b>就是<b>死</b>；而圣灵的心思倾向，就是<b>生命与平安</b>。」<br>7「因为肉体的心思倾向<b>是与神为敌</b>：它<b>不服</b>神的律法，<b>实在也不能服</b>；」<br>8「而那些在肉体里的人，<b>不能讨神的喜悦</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>体贴</td><td>φρονέω／φρόνημα</td><td>phroneō/phronēma</td><td>G5426/G5427</td><td>φρήν（心思）</td><td><b>心之所向、思想的定向</b></td><td>见下</td></tr><tr><td>平安</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>—</td><td>和平（שָׁלוֹם）</td><td><b>5:1「与神相和」同字</b></td></tr><tr><td>不能服</td><td>οὐδὲ γὰρ δύναται</td><td>—</td><td>G1410</td><td>δύναμαι</td><td><b>也是不能</b></td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：φρόνημα 不只是「想什么」，是「心朝哪里」</p><p>φρονέω 的意思不是单纯的「思考」，而是</p><p>「心思的定向、关切的方向、所看重的东西」。</p><p>（腓2:5「你们当以基督耶稣的心为心」——同字根；腓3:19「专以地上的事为念」——同字）</p><p>和合本译「体贴」译得极好：</p><p>不是「我脑子里想什么」，是「我的心<b>向着谁</b>」。</p><p>★ 亮光二：8:7「不能服」的绝对性</p><p>「不服神的律法，也是<b>不能</b>服（οὐδὲ δύναται）。」</p><p>这不是「不太愿意」，是「<b>没有这个能力</b>」。</p><p>弟兄姊妹，这一节与7:22形成一个重要的张力：</p><pre>7:22  「按着我里面的意思，我是喜欢神的律」\n8:7   「体贴肉体的……不服神的律法，也是不能服」</pre><p>这正是第七章「这个『我』是谁」争议的核心之一（见罗7的讨论）。</p><p>但无论如何，8:7说得很清楚：肉体的心思，<b>没有能力</b>服神。</p><p>所以出路不是「更用力去服」，是「换一种心思」。</p>","exp":"<p>弟兄姊妹，8:5–8给了一个很实际的检查方式：</p><p>不要问「我今天有没有犯错」。</p><p>问「我的心，最近向着哪里」。</p><p>因为行为是果，心思的定向才是根。</p>"},{"a":9,"z":9,"star":true,"grk":"<p>ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλ' ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.</p>","lit":"<p>「但你们不在肉体里，乃在灵里——<b>既然</b>神的灵<b>住在你们里面</b>。但若有人没有基督的灵，这人就不属于祂。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>住</td><td>οἰκεῖ</td><td>oikei</td><td>G3611</td><td><b>οἰκέω——7:17、18、20那个字！</b></td></tr><tr><td>如果</td><td>εἴπερ</td><td>eiper</td><td>G1512</td><td><b>既然、假定确实如此</b>（不是怀疑，是肯定的前提）</td></tr></table>","gram":"<p>★ 亮光一：οἰκέω ——全书最重要的一组对照</p><pre>7:17  乃是「住」（οἰκοῦσα）在我里头的「罪」做的\n7:18  我知道在我里头……没有良善「居住」（οἰκεῖ）\n7:20  乃是「住」（οἰκοῦσα）在我里头的「罪」做的\n   ↓\n8:9   神的灵「住」（οἰκεῖ）在你们心里\n8:11  叫耶稣从死里复活者的灵若「住」（οἰκεῖ）在你们心里</pre><p>同一个动词，出现在两章。</p><p>第七章：罪住在我里面。<br>第八章：圣灵住在我里面。</p><p>弟兄姊妹，这就是七章到八章的全部差别：</p><p>住在里面的那一位，换了。</p><p>★ 亮光二：εἴπερ 不是怀疑，是肯定的前提</p><p>中文「如果」容易让人以为保罗在质疑读者有没有圣灵。</p><p>εἴπερ 在希腊文中，通常表示「<b>既然事实如此</b>」的前提，而非「不确定」。</p><p>保罗的语气是：</p><p>「你们<b>既然</b>有神的灵住在里面——那你们就不在肉体里了。」</p><p>★ 亮光三：三个名称指同一位</p><p>在8:9–11短短三节里，保罗用了三个名称：</p><pre>8:9   神的灵（πνεῦμα θεοῦ）\n8:9   基督的灵（πνεῦμα Χριστοῦ）\n8:11  叫耶稣从死里复活者的灵</pre><p>这是新约中三一神论的重要经文之一：</p><p>同一位圣灵，既是父的灵，也是子的灵。</p><p>★ 亮光四：8:9下半的断语</p><p>「人若没有基督的灵，就<b>不是属基督的</b>。」</p><p>这句话极其严肃，也极其清楚：</p><p>有没有圣灵，不是「基督徒的进阶选项」。</p><p>它是<b>是不是基督徒</b>的定义。</p>","exp":"<p>弟兄姊妹，8:9是第七章那个问题的<b>答案</b>。</p><p>第七章的困局是什么？</p><p>7:17、7:18、7:20——<b>罪住在我里头</b>（οἰκέω）。</p><p>而8:9用了<b>同一个动词</b>：</p><p>「神的灵<b>住</b>（οἰκεῖ）在你们心里。」</p><p><b>经文本身明确表达的：</b> 一个人是否「属基督」，取决于基督的灵是否住在他里面。</p><p><b>可以合理推论的：</b> 第七章到第八章的差别，<b>不是「我更努力了」，是「住客换了」</b>。</p><p>这正是321所说的：<b>无己不是自己把自己清空，是让基督在我里面活</b>。</p><p>而9节下半是一句极严肃的断语：</p><p>「人若没有基督的灵，就<b>不是属基督的</b>。」</p><p><b>⚠ 牧养提醒：</b> 这句话<b>不是</b>用来让人怀疑自己得救的。<br>保罗的语气（εἴπερ ＝「既然事实如此」）是<b>肯定</b>读者有圣灵，而不是质疑。<br>若有人因此陷入恐惧，请带他回到8:15–16：那位使你能喊「阿爸」的，就是凭据。</p>"},{"a":10,"z":11,"star":false,"grk":"<p>11 …ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ τοῦ ἐνοικοῦντος αὐτοῦ πνεύματος ἐν ὑμῖν.</p>","lit":"<p>10「但基督若在你们里面，身体固然因罪而<b>是死的</b>，灵却因义而<b>是生命</b>。」<br>11「而那位<b>叫耶稣从死人中复活者的灵</b>，若住在你们里面，那叫基督从死人中复活的，也必借着<b>祂那住在你们里面的灵</b>，<b>使你们必死的身体也活过来</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>使……活过来</td><td>ζῳοποιήσει</td><td>zōopoiēsei</td><td>G2227</td><td>ζωή + ποιέω：<b>使之活过来</b>（<b>4:17同字！</b>）</td></tr><tr><td>必死的</td><td>θνητός</td><td>thnētos</td><td>G2349</td><td>会死的、必朽坏的（<b>6:12同字！</b>）</td></tr></table>","gram":"<p>★ 亮光一：ζῳοποιέω ——第四章那个字回来了</p><pre>4:17  亚伯拉罕所信的，是那「叫死人复活」（ζῳοποιοῦντος）……的神\n   ↓\n8:11  也必……「使你们必死的身体又活过来」（ζῳοποιήσει）</pre><p>亚伯拉罕所信的那位神，就是要使你的身体复活的那位神。</p><p>★ 亮光二：θνητός ——第六章那个字回来了</p><pre>6:12  不要容罪在你们「必死的」（θνητῷ）身上作王\n   ↓\n8:11  使你们「必死的」（θνητά）身体又活过来</pre><p>第六章：这个必死的身体，是战场。<br>第八章：这个必死的身体，要复活。</p><p>保罗从来不轻看身体。</p>","exp":"<p>弟兄姊妹，8:11是全本圣经对「身体」最有盼望的一节之一。</p><p>基督教的盼望<b>不是</b>「灵魂脱离身体」。</p><p>是<b>这个身体要活过来</b>。</p><p>【第三段｜8:12–17　儿子的名分】</p>"},{"a":12,"z":13,"star":false,"grk":"<p>13 …εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.</p>","lit":"<p>12「所以弟兄们，我们<b>是欠债的</b>——<b>但不是欠肉体的债</b>，要照着肉体活。」<br>13「因为你们若照着肉体活，<b>必要死</b>；但你们若<b>靠着圣灵</b>，<b>持续治死</b>身体的作为，<b>就必要活</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>欠债</td><td>ὀφειλέται</td><td>opheiletai</td><td>G3781</td><td><b>欠债的人</b>（<b>4:4 ὀφείλημα 同字根</b>）</td></tr><tr><td>治死</td><td>θανατοῦτε</td><td>thanatoute</td><td>G2289</td><td><b>治死、处死</b>（现在式：持续地）</td></tr><tr><td>恶行</td><td>πράξεις</td><td>praxeis</td><td>G4234</td><td>行为、作为</td></tr></table>","gram":"<p>★ 亮光一：「不欠肉体的债」</p><p>保罗用了一个帐目的字：ὀφειλέτης（欠债的人）。</p><p>弟兄姊妹，这是一个极重要的观念：</p><p>肉体对你<b>没有债权</b>。</p><p>它一天到晚来要债——但它手上没有借据。</p><p>★ 亮光二：「靠着圣灵治死」——工具与主体</p><p>πνεύματι 是<b>与格</b>，表示<b>凭借、借着</b>。</p><pre>主体：你们（θανατοῦτε 是第二人称复数）\n工具：圣灵（πνεύματι）</pre><p>注意两件事：</p><p>① 动词的主词是「你们」——<b>这是要你去做的</b>。<br>② 但工具是圣灵——<b>不是靠你的意志力</b>。</p><p>这正好平衡了第六、七章的张力：<br>不是被动地等神做（那会落入不负责任），<br>也不是靠自己咬牙（那会落入第七章）。</p><p>★ 亮光三：现在式「治死」</p><p>θανατοῦτε 是现在式——<b>持续地、每天地</b>。</p><p>这与6:11「当看」（现在式命令）完全一致。</p><p>有一次的降服，也有每天的争战。</p><p>（关于8:13是否暗示「靠行为得救」，见第二十部分。）</p>","exp":"<p>弟兄姊妹，这两节在第八章里，是<b>唯一一段直接的命令</b>。</p><p>而保罗的用字很有意思：他说我们是「<b>欠债的</b>」——</p><p>但那句话没有讲完。</p><p>「我们并不是欠<b>肉体</b>的债」——那我们欠谁的？</p><p>保罗没有明说。而答案在整卷书里：</p><p>1:14「我都<b>欠他们的债</b>」；13:8「凡事都不可亏欠人，<b>惟有彼此相爱要常以为亏欠</b>」。</p><p><b>经文本身明确表达的：</b> 信徒不再欠肉体任何东西；照肉体活必要死，靠着圣灵治死身体的作为就必要活。</p><p><b>可以合理推论的：</b> 对付罪有两个要件，<b>缺一不可</b>：</p><p>① 动词的主词是「<b>你们</b>」——这是要你去做的（不是被动等候）。<br>② 但工具是「<b>圣灵</b>」——不是靠你的意志力（那是第七章）。</p><p>而 θανατοῦτε 是现在式——<b>每天的</b>，不是一次的。</p><p><b>⚠ 牧养提醒：</b> 这一节不可讲成「靠行为得救」。<br>保罗说的是：真有圣灵的人，会走上这条路；而这条路本身，是圣灵在走。</p>"},{"a":14,"z":15,"star":true,"grk":"<p>14 ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι υἱοὶ θεοῦ εἰσιν.<br>15 οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον ἀλλ' ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· αββα ὁ πατήρ.</p>","lit":"<p>14「因为凡<b>被</b>神的灵<b>引导的</b>，这些人就是神的儿子。」<br>15「因为你们所领受的，不是奴役的灵，以致再度陷入惧怕；你们所领受的，乃是<b>儿子名分的灵</b>，借着祂，我们<b>放声呼喊</b>：『阿爸！父啊！』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>引导</td><td>ἄγονται</td><td>agontai</td><td>G71</td><td>ἄγω</td><td><b>被带领</b>（<b>现在被动式</b>）</td><td>见下</td></tr><tr><td>儿子的心</td><td>υἱοθεσία</td><td>huiothesia</td><td>G5206</td><td>υἱός + τίθημι</td><td><b>收养、立为儿子</b></td><td><b>罗马法律用语</b></td></tr><tr><td>呼叫</td><td>κράζομεν</td><td>krazomen</td><td>G2896</td><td>κράζω</td><td><b>放声呼喊、大声叫</b></td><td>不是轻声细语</td></tr><tr><td>阿爸</td><td>αββα</td><td>abba</td><td>G5</td><td><b>亚兰文</b></td><td>父亲</td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：ἄγονται 是<b>现在被动式</b></p><p>「凡<b>被</b>神的灵引导的」——不是「凡引导自己的」。</p><p>这是一个<b>被动</b>的动词：<b>被带领</b>。</p><p>而且是<b>现在式</b>：<b>持续地被带领</b>。</p><p>（注意这与加5:18「你们若被圣灵引导」是同一个字）</p><p>★ 亮光二：υἱοθεσία ——罗马的收养</p><p>这个字在新约出现5次，全部在保罗书信（罗8:15、8:23、9:4；加4:5；弗1:5）。</p><p>它是罗马法律的专门用语，而罗马收养有几个特点：</p><table><tr><th>特点</th><th>对8:15的意义</th></tr><tr><td><b>旧债一笔勾销</b></td><td>你过去的一切，法律上不复存在</td></tr><tr><td><b>获得完整继承权</b></td><td><b>与亲生儿子同等</b>（8:17「和基督同作后嗣」）</td></tr><tr><td><b>需要证人</b></td><td><b>8:16「圣灵与我们的心同证」</b></td></tr><tr><td><b>不可撤销</b></td><td><b>8:38–39「都不能隔绝」</b></td></tr></table><p>弟兄姊妹，这不是一个温馨的比喻。</p><p>这是一份<b>法律文件</b>。</p><p>★ 亮光三：Αββα ——耶稣自己的字</p><p>保罗保留了亚兰文的原音，没有翻译。</p><p>整本新约只有三处出现「阿爸」：</p><table><tr><th>出处</th><th>说话的人</th></tr><tr><td><b>可14:36</b></td><td><b>主耶稣在客西马尼：「阿爸！父啊！在你凡事都能……」</b></td></tr><tr><td><b>罗8:15</b></td><td>我们</td></tr><tr><td><b>加4:6</b></td><td>神差祂儿子的灵进入我们的心，呼叫「阿爸！父！」</td></tr></table><p>弟兄姊妹，这是何等的事：</p><p>耶稣在客西马尼，汗如血点的那一夜，用的那个称呼——</p><p>祂让我们也可以用。</p><p>关于「阿爸」的意思，要避免常见的夸大：</p><p>「阿爸」不只是幼儿的牙牙学语（这个流行说法被学界修正过）。<br>它是家庭中亲密而真实的称呼，成年子女也这样叫父亲。</p><p>它的惊人之处不在于「幼稚」，而在于——<br>一个受造之物，竟然可以用<b>家人的称呼</b>，对创造宇宙的神说话。</p><p>★ 亮光四：κράζω ——放声呼喊</p><p>「呼叫」不是轻声说话。κράζω 是<b>大声喊叫</b>。</p><p>（太27:50「耶稣又大声喊叫（κράξας），气就断了」——同字）</p><p>保罗描写的不是一个安静的宗教习惯，<br>是一个孩子在需要的时候，<b>冲口而出</b>的那一声。</p>","exp":"<p>弟兄姊妹，8:15直接回应了第六章的一个问题。</p><p>第六章保罗用了「奴仆」的比喻，还特别道歉说「我因你们肉体的软弱，就照人的常话对你们说」（6:19）。</p><p>现在，两章之后——</p><p>「你们所受的，<b>不是奴仆的心</b>……乃是<b>儿子的心</b>。」</p><p>保罗升级了。</p><p>第六章：归属的绝对性（奴仆）。<br>第八章：关系的亲密性（儿子）。</p><p>两章要一起读。</p>"},{"a":16,"z":17,"star":false,"grk":"<p>16 αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.<br>17 …συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.</p>","lit":"<p>16「圣灵自己<b>与我们的灵一同作见证</b>：我们是<b>神的儿女</b>。」<br>17「既是儿女，便是<b>后嗣</b>——是神的后嗣，也是<b>与基督同作后嗣</b>的；<b>既然我们与祂一同受苦</b>，为要<b>也与祂一同得荣耀</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>同证</td><td>συμμαρτυρεῖ</td><td>symmartyrei</td><td>G4828</td><td>σύν + μαρτυρέω：<b>一同作证</b>（<b>2:15同字！</b>）</td></tr><tr><td>同作后嗣</td><td>συγκληρονόμοι</td><td>synklēronomoi</td><td>G4789</td><td><b>共同继承人</b></td></tr><tr><td>一同受苦</td><td>συμπάσχομεν</td><td>sympaschomen</td><td>G4841</td><td><b>一同受苦</b></td></tr><tr><td>一同得荣耀</td><td>συνδοξασθῶμεν</td><td>syndoxasthōmen</td><td>G4888</td><td><b>一同得荣耀</b></td></tr></table>","gram":"<p>★ 亮光一：συμμαρτυρέω ——2:15的字回来了</p><pre>2:15  他们是非之心「同作见证」（συμμαρτυρούσης）—— 良心的法庭，控告与辩护\n   ↓\n8:16  圣灵与我们的心「同证」（συμμαρτυρεῖ）—— 我们是神的儿女</pre><p>第二章：那个内心的法庭，只会控告。<br>第八章：现在有一位证人站出来，作<b>有利于你</b>的见证。</p><p>★ 亮光二：四个 συν- 叠在两节里</p><pre>8:16  συμμαρτυρεῖ   —— 一同作证\n8:17  συγκληρονόμοι —— 一同承受\n8:17  συμπάσχομεν   —— 一同受苦\n8:17  συνδοξασθῶμεν —— 一同得荣耀</pre><p>保罗把「与基督一同」推到了极致：</p><p>一同承受、一同受苦、一同得荣耀。</p><p>★ 亮光三：8:17的「如果」（εἴπερ）</p><p>这里的 εἴπερ 与8:9一样，通常表示「<b>既然事实如此</b>」。</p><p>保罗不是在说「你要受苦才配得荣耀」（那是功德观）。</p><p>他是在说：<b>与基督同行的道路，本来就包含这两样</b>。</p><p>同作后嗣，就会同受苦，也会同得荣耀。</p>","exp":"<p>弟兄姊妹，8:16回答了一个很多人心里的问题：</p><p>「我怎么知道我真的是神的儿女？」</p><p>保罗的答案不是「看你的表现」。</p><p>是：</p><p>有两位在作证。</p><p>一位是你自己的心。<br>另一位是<b>圣灵</b>。</p><p>而8:17立刻接上一句很诚实的话：</p><p>这个名分，包含苦难。</p><p>不是「作了神的儿女，日子就顺了」。<br>是「作了神的儿女，就与祂同走那条路」。</p><p>【第四段｜8:18–25　受造之物与我们的叹息】</p>"},{"a":18,"z":18,"star":false,"grk":"<p>Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.</p>","lit":"<p>「因为我<b>这样算</b>：现今这时候的苦楚，与那将要<b>显明到我们身上</b>的荣耀相比，是<b>不成比例的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>我想</td><td>Λογίζομαι</td><td>logizomai</td><td>G3049</td><td><b>我算</b>（记帐用语——4:3、6:11那个字！）</td></tr><tr><td>不足介意</td><td>οὐκ ἄξια</td><td>ouk axia</td><td>G514</td><td><b>不成比例、不够份量</b>（ἄξιος 原指天平的平衡）</td></tr><tr><td>显于</td><td>ἀποκαλυφθῆναι εἰς ἡμᾶς</td><td>—</td><td>G601</td><td><b>显明「到」我们身上</b>（不只是给我们看）</td></tr></table>","gram":"<p>★ 亮光一：λογίζομαι 的第三次登场</p><pre>4:3   ἐλογίσθη   —— 神算（被动、直说）\n6:11  λογίζεσθε  —— 你们要算（命令）\n8:18  λογίζομαι  —— 我算（保罗自己示范）</pre><p>保罗不只下命令，他自己也在算。</p><p>而他算的是一笔<b>天平上的帐</b>：</p><p>一边放「现在的苦楚」，一边放「将来的荣耀」。</p><p>结果是：<b>根本不成比例</b>。</p><p>★ 亮光二：ἄξιος 的天平意象</p><p>这个字原指「<b>与……等重</b>」。</p><p>保罗的意思不是「苦难不重要」，也不是「你不该觉得苦」。</p><p>是：把它放上天平的另一端，<b>压不下去</b>。</p><p>★ 亮光三：εἰς ἡμᾶς ——显明「到」我们身上</p><p>保罗没有说「显给我们看」，而是「<b>显明到我们身上</b>」。</p><p>那个荣耀不只是我们<b>观赏</b>的，是我们<b>要进入、要承载</b>的。</p><p>（8:30「叫他们得荣耀」；西3:4「你们也要与他一同显现在荣耀里」）</p>","exp":"<p>弟兄姊妹，8:18是第八章下半段的<b>开场白</b>。</p><p>而它是一句<b>帐目</b>的话，不是一句安慰的话。</p><p>保罗说：「我<b>算</b>（λογίζομαι）。」</p><p>那是第四章、第六章那个记帐的字。</p><pre>4:3   神算    —— 被动、直说（既成事实）\n6:11  你们算  —— 命令（去做）\n8:18  我算    —— 保罗自己示范</pre><p><b>经文本身明确表达的：</b> 现今的苦楚，与将来要显明到我们身上的荣耀，<b>不成比例</b>（ἄξιος ＝ 等重）。</p><p><b>可以合理推论的：</b> 保罗<b>没有</b>说「苦难不重要」，也<b>没有</b>说「你不该觉得苦」。<br>他说的是：把它放上天平的另一端，<b>压不下去</b>。</p><p><b>⚠ 牧养提醒：</b> 这一节与8:28一样，<b>是给受苦的人自己拿来算的，不是旁观者用来安慰别人的</b>。<br>在人正痛的时候把这句话丢过去，会像是在说「你的痛不算什么」——那不是保罗的意思。</p>"},{"a":19,"z":22,"star":true,"grk":"<p>19 ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται.<br>22 οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν.</p>","lit":"<p>19「因为受造之物<b>伸长脖子的切望</b>，正<b>等候着</b>神众子的<b>显露</b>。」<br>20「因为受造之物<b>被服在虚空之下</b>——<b>不是自己愿意的</b>，乃是因那位<b>使它服在其下</b>者的缘故；」<br>21「并且怀着<b>盼望</b>：受造之物自己也要<b>从败坏的奴役中得释放</b>，进入神儿女<b>荣耀的自由</b>。」<br>22「因为我们知道：<b>一切受造之物，直到如今，都一同叹息、一同经历产难之苦</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>切望等候</td><td>ἀποκαραδοκία</td><td>apokaradokia</td><td>G603</td><td>ἀπό + κάρα（头）+ δοκέω</td><td><b>伸长脖子往前看</b></td><td>见下</td></tr><tr><td>虚空</td><td>ματαιότης</td><td>mataiotēs</td><td>G3153</td><td>μάταιος（虚空）</td><td><b>虚空、徒然</b></td><td><b>传道书的字</b>（见下）</td></tr><tr><td>一同叹息</td><td>συστενάζει</td><td>systenazei</td><td>G4959</td><td>σύν + στενάζω</td><td><b>一同呻吟</b></td><td><b>新约仅此一次</b></td></tr><tr><td>一同劳苦</td><td>συνωδίνει</td><td>synōdinei</td><td>G4944</td><td>σύν + ὠδίν（产痛）</td><td><b>一同经历产难之苦</b></td><td><b>新约仅此一次</b></td></tr></table>","gram":"<p>★ 亮光一：ἀποκαραδοκία ——伸长脖子</p><p>这个字的构词极其生动：</p><pre>ἀπό（离开、远离）+ κάρα（头）+ δοκέω（观看）\n＝ 把头伸出去，往远方看</pre><p>画面：一个人踮起脚、伸长脖子，盯着地平线。</p><p>（新约仅两处：罗8:19、腓1:20「照着我所切慕、所盼望的」）</p><p>保罗说：整个受造界，正踮着脚在等一件事。</p><p>等什么？</p><p>「等候<b>神的众子显出来</b>。」</p><p>★ 亮光二：ματαιότης ——传道书的那个字</p><p>「受造之物服在<b>虚空</b>之下。」</p><p>ματαιότης 在七十士译本中，正是传道书开头那个字：</p><p>传道书1:2「<b>虚空的虚空</b>，凡事都是虚空。」<br>希伯来文是 <b>הֶבֶל（hevel）</b>，LXX 译作 <b>ματαιότης</b>。</p><p>弟兄姊妹，保罗在说：传道书所描述的那个「虚空」——</p><p>那是真的。整个受造界确实服在它之下。</p><p>但传道书没有讲完。罗马书8:21讲完了：</p><p>「受造之物<b>仍然指望</b>脱离败坏的辖制。」</p><p>★ 亮光三：两个 συν- 的产痛意象</p><pre>συστενάζει —— 一同呻吟\nσυνωδίνει  —— 一同经历产难之苦</pre><p>ὠδίν 是<b>生产的阵痛</b>。</p><p>弟兄姊妹，这个意象极其重要：</p><p>产痛不是<b>死亡的痛</b>，是<b>生产的痛</b>。</p><p>它有方向。它有终点。它会生出东西来。</p><p>（主耶稣用同一个意象：约16:21「妇人生产的时候就忧愁，因为她的时候到了；既生了孩子，就不再记念那苦楚」）</p>","exp":"<p>弟兄姊妹，8:19–22给了苦难一个宇宙性的框架。</p><p>你所经历的痛苦，不是宇宙里的一个例外。</p><p>整个受造界都在痛。从创世记第三章开始。</p><p>而保罗给了一个关键的区分：</p><p>不是<b>临终的呻吟</b>。<br>是<b>产房里的呻吟</b>。</p>"},{"a":23,"z":25,"star":false,"grk":"<p>23 …ἡμεῖς καὶ αὐτοὶ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες, ἡμεῖς καὶ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν υἱοθεσίαν ἀπεκδεχόμενοι, τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.</p>","lit":"<p>23「不但如此，<b>连我们这有圣灵初熟果子的人</b>，<b>也是自己在心里叹息</b>，切切等候<b>儿子的名分</b>——就是<b>我们身体的得赎</b>。」<br>24「因为我们得救是<b>在盼望中</b>。只是<b>已经看见的盼望，就不是盼望</b>了；人所看见的，谁还盼望呢？」<br>25「但我们若盼望那<b>还没有看见的</b>，就<b>带着忍耐热切等候</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>初结果子</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>初熟的果子</b>（见下）</td></tr><tr><td>叹息</td><td>στενάζομεν</td><td>stenazomen</td><td>G4727</td><td><b>呻吟</b>（第二重叹息）</td></tr><tr><td>得赎</td><td>ἀπολύτρωσις</td><td>apolytrōsis</td><td>G629</td><td><b>赎回</b>（<b>3:24同字！</b>）</td></tr></table>","gram":"<p>★ 亮光一：ἀπαρχή ——初熟的果子</p><p>这是旧约献祭的用语（利23:10；申26:1–11）：</p><p>收割的时候，把<b>最先熟的那一把</b>带到神面前献上。</p><p>它的意义是：</p><p>初熟果子不是「一小部分」，是「<b>整场收成的保证</b>」。</p><p>有了初熟的果子，就表示：后面的一定会来。</p><p>保罗说：圣灵就是那把初熟的果子。</p><p>你现在所经历的圣灵——不是全部，是<b>保证</b>。</p><p>（弗1:14用另一个字 ἀρραβών「凭据」，是<b>订金</b>的意思——同样的道理）</p><p>★ 亮光二：一个关键的张力</p><pre>8:15  我们「已经」领受了儿子的名分（υἱοθεσία）\n8:23  我们「等候」得着儿子的名分（υἱοθεσία）</pre><p>同一个字，一个「已经」，一个「还没」。</p><p>这正是新约末世论的核心：<b>已然未然</b>（already / not yet）。</p><p>法律上，收养已经完成了（8:15）。<br>但<b>儿子的产业还没有全部交到手上</b>（8:23）。</p><p>★ 亮光三：「身体得赎」是保罗盼望的内容</p><p>注意保罗说的不是「灵魂得释放」，是「<b>我们的身体得赎</b>」。</p><p>这再次证明：基督教的盼望是<b>身体的复活</b>，不是「脱离身体」。</p>","exp":"<p>弟兄姊妹，8:23是一句很诚实的话：</p><p>有圣灵的人，<b>还是会叹息</b>。</p><p>保罗没有说：「你有圣灵了，所以你不该有负面情绪。」</p><p>他说：我们这些<b>有圣灵初结果子的</b>，「也是自己心里叹息」。</p><p>叹息不是不属灵。<br>叹息是<b>还没到家</b>的证据。</p><p>【第五段｜8:26–27　圣灵的叹息】</p>"},{"a":26,"z":27,"star":true,"grk":"<p>26 Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται τῇ ἀσθενείᾳ ἡμῶν· τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις·</p>","lit":"<p>26「照样，圣灵也<b>在旁边一同扶起</b>我们的软弱；因为我们<b>不知道</b>当怎样祷告才合宜，但圣灵自己用<b>说不出来的叹息</b>，<b>替我们恳切代求</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>帮助</td><td>συναντιλαμβάνεται</td><td>synantilambanetai</td><td>G4878</td><td><b>σύν + ἀντί + λαμβάνω</b></td><td><b>在对面、一同抓住扛起</b></td><td><b>见下——极美</b></td></tr><tr><td>说不出来的</td><td>ἀλάλητος</td><td>alalētos</td><td>G215</td><td>ἀ + λαλέω（说）</td><td><b>无法用言语表达的</b></td><td><b>新约仅此一次</b></td></tr><tr><td>替我们祷告</td><td>ὑπερεντυγχάνει</td><td>hyperentynchanei</td><td>G5241</td><td>ὑπέρ + ἐν + τυγχάνω</td><td><b>为我们恳切代求</b></td><td><b>新约仅此一次</b></td></tr></table>","gram":"<p>★ 亮光一：συναντιλαμβάνομαι ——「在对面一起扛」</p><p>这个字由三部分组成：</p><pre>σύν    （一同）\nἀντί   （在对面、面对面）\nλαμβάνω（抓住、拿起）</pre><p>合起来的画面是：</p><p>一个人扛不动一根很重的木头。</p><p>另一个人走过来，<b>站到木头的另一端</b>，<br>弯下腰，跟他<b>一起擡</b>。</p><p>这个字在新约只出现两次：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>路10:40</b></td><td>马大说：「请吩咐她来<b>帮助</b>我。」</td></tr><tr><td><b>罗8:26</b></td><td>「我们的软弱有圣灵<b>帮助</b>。」</td></tr></table><p>弟兄姊妹，注意这个字的重点：</p><p>圣灵不是站在旁边喊「加油」。<br>圣灵是<b>走到另一端，一起扛</b>。</p><p>★ 亮光二：ἀλάλητος ——说不出来的</p><p>新约只出现这一次。</p><p>ἀ（不）+ λαλέω（说话）＝ <b>无法用言语表达的</b>。</p><p>保罗在描写一件极深的事：</p><p>有些祷告，深到没有办法变成句子。</p><p>★ 亮光三：ὑπερεντυγχάνει ——保罗叠出来的字</p><p>这个字也是新约仅此一次，而且很可能是保罗自己造的：</p><pre>ἐντυγχάνω      = 代求、为某人请愿\nὑπερεντυγχάνω  = ὑπέρ（为了／超过）+ 代求</pre><p>而8:34用同一个字根，描写基督：</p><p>8:34「现今在神的右边，也<b>替我们祈求</b>（ἐντυγχάνει）。」</p><p>弟兄姊妹，第八章有<b>两位代求者</b>：</p><p>圣灵在我里面替我祷告（8:26）。<br>基督在天上替我祷告（8:34）。</p><p>一个在下面，一个在上面。<br>一个在心里，一个在宝座前。</p><p>★ 亮光四：8:26是第三重叹息</p><pre>8:22  受造之物 —— 一同叹息（συστενάζει）\n8:23  我们     —— 心里叹息（στενάζομεν）\n8:26  圣灵     —— 说不出来的叹息（στεναγμοῖς ἀλαλήτοις）</pre><p>弟兄姊妹，这是全章最令人震动的一件事：</p><p>神自己，也在叹息。</p><p>祂没有站在我们的痛苦之外。<br>祂进到那个叹息里面，用我们发不出来的声音，替我们祷告。</p><p>（关于「说不出来的叹息」是否指方言，见第二十部分。）</p>","exp":"<p>弟兄姊妹，8:26回答了一个许多人不敢问的问题：</p><p>「我连祷告都不会，怎么办？」</p><p>保罗的回答是：</p><p>对，你不会。</p><p>「我们本<b>不晓得</b>当怎样祷告。」</p><p>但那不是问题——因为有一位在你里面，替你祷告。</p><p>【第六段｜8:28–30　万事互相效力与金链】</p>"},{"a":28,"z":28,"star":true,"grk":"<p>οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσιν τὸν θεὸν πάντα συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.</p>","lit":"<p>「我们<b>知道</b>，对那些爱神的人，万事<b>一同运作</b>以致于善——就是那些照着祂的<b>旨意</b>被召的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>互相效力</td><td>συνεργεῖ</td><td>synergei</td><td>G4903</td><td>σύν + ἔργον：<b>一同做工</b>（英文 synergy）</td></tr><tr><td>益处</td><td>ἀγαθόν</td><td>agathon</td><td>G18</td><td>善、好处</td></tr><tr><td>旨意</td><td>πρόθεσις</td><td>prothesis</td><td>G4286</td><td><b>预先摆定的计划</b></td></tr></table>","gram":"<p>★ 亮光一：一个抄本问题</p><p>部分早期抄本（如 P46、梵蒂冈抄本）在 συνεργεῖ 之后有 <b>ὁ θεός</b>（神）：</p><p>「<b>神</b>使万事互相效力……」</p><p>两种读法：</p><table><tr><th>读法</th><th>意思</th></tr><tr><td>无 ὁ θεός</td><td>万事一同运作以致于善（和合本）</td></tr><tr><td>有 ὁ θεός</td><td><b>神</b>使万事一同运作以致于善</td></tr></table><p>无论哪一种读法，主词的实质都是神——<br>因为「万事」不会自己「合作」；上下文（8:29–30）明说是神在做工。</p><p>★ 亮光二：这节经文的两个限定</p><p>保罗给了两个限定，常被引用时省略：</p><pre>限定一：「叫**爱神的人**得益处」\n限定二：「就是按他**旨意被召**的人」</pre><p>这不是一句普世通用的乐观主义格言。</p><p>这是给神儿女的应许。</p><p>★ 亮光三：「益处」是什么？下一节就说了</p><p>很多人把「益处」读成「事情会变好」。</p><p>但保罗在8:29立刻定义了那个「益处」：</p><p>「就预先定下<b>效法他儿子的模样</b>。」</p><p>弟兄姊妹，这是全章最重要的澄清之一：</p><p>神所说的「益处」，不是「你的处境会改善」，<br>是「<b>你会越来越像祂的儿子</b>」。</p>","exp":"<p>（关于这节经文的误用，见第二十部分——这可能是全本圣经最常被错用的一节。）</p><p>保罗没有说「万事都是好的」。</p><p>他说「万事<b>互相效力</b>」——那些事本身可能是坏的、是痛的、是不该发生的，<br>但神能把它们<b>编织进</b>一个目的里。</p>"},{"a":29,"z":30,"star":true,"grk":"<p>29 ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·<br>30 οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.</p>","lit":"<p>29「因为<b>祂预先所认识的那些人</b>，祂也<b>预先定下</b>他们，要<b>与祂儿子的形像同形</b>，使祂儿子在许多弟兄中作<b>长子</b>。」<br>30「而<b>祂预先所定下的那些人</b>，祂也<b>召了</b>他们；祂所召的那些人，祂也<b>称他们为义</b>；祂所称为义的那些人，祂也<b>叫他们得了荣耀</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>预先知道</td><td>προέγνω</td><td>proegnō</td><td>G4267</td><td>πρό + γινώσκω：<b>预先认识</b>（见下）</td></tr><tr><td>预先定下</td><td>προώρισεν</td><td>proōrisen</td><td>G4309</td><td>πρό + ὁρίζω（划界）：<b>预先划定</b></td></tr><tr><td>效法……模样</td><td>συμμόρφους</td><td>symmorphous</td><td>G4832</td><td>σύν + μορφή：<b>与……同形</b></td></tr><tr><td>长子</td><td>πρωτότοκος</td><td>prōtotokos</td><td>G4416</td><td><b>首生的、居首位的</b></td></tr><tr><td>得荣耀</td><td>ἐδόξασεν</td><td>edoxasen</td><td>G1392</td><td><b>不定过去式！</b>（见下）</td></tr></table>","gram":"<p>★ 亮光一：五个不定过去式，包括最后一个</p><pre>προέγνω    （预先知道）  —— 不定过去式\nπροώρισεν  （预先定下）  —— 不定过去式\nἐκάλεσεν   （召）        —— 不定过去式\nἐδικαίωσεν （称义）      —— 不定过去式\nἐδόξασεν   （得荣耀）    —— 不定过去式 ★★</pre><p>弟兄姊妹，最后一个是重点。</p><p>「得荣耀」是一件<b>还没发生</b>的事——8:18刚说「将来要显于我们的荣耀」。</p><p>但保罗用的是<b>不定过去式</b>，就是讲一件<b>已经完成</b>的事。</p><p>这种用法有时被称为「<b>预言性的不定过去式</b>」（prophetic aorist）——</p><p>神说的未来，确定到可以用过去式来讲。</p><p>★ 亮光二：προγινώσκω 的两种理解（★ 主要争议）</p><p>「预先所知道的」——这个字是预定论争议的核心之一。</p><table><tr><th>理解</th><th>主张</th><th>传统</th></tr><tr><td><b>预知即拣选之爱</b></td><td>「知道」是圣经式的<b>关系性认识</b>（如创4:1「亚当<b>认识</b>他妻子」；摩3:2「在地上万族中，我只<b>认识</b>你们」）；神预先<b>以爱认定</b></td><td>改革宗</td></tr><tr><td><b>预知即预见</b></td><td>神预先<b>看见</b>谁会相信，据此预定</td><td>亚米念主义／卫斯理传统</td></tr></table><p>支持第一种的主要理由：</p><p>- 受词是<b>人</b>（οὓς，「那些人」），不是「他们的信心」<br>- 旧约的 יָדַע（知道）常带有<b>拣选之爱</b>的意思（摩3:2；耶1:5）<br>- 8:29–30整条链子的主词<b>全部是神</b></p><p>支持第二种的主要理由：</p><p>- προγινώσκω 的字面确实是「预先知道」<br>- 保罗在别处强调人的回应之信（10:9–13）</p><p>讲台诚信提醒：这是宗教改革以来福音派内部最深的分歧之一。<br>本文采第一种读法（理由如上），但<b>必须说明有敬虔的信徒持不同看法</b>，不可贬低任何一方。</p><p>而两边都同意的是：<br>这条链子的每一环，主词都是神；没有一环是靠我完成的。</p><p>★ 亮光三：那个「益处」的定义</p><p>8:29说得很清楚：预定的内容是——</p><p>「效法他儿子的<b>模样</b>（συμμόρφους τῆς εἰκόνος）。」</p><p>συμμόρφος ＝ 与……有相同的形态。</p><p>（腓3:21「将我们卑贱的身体改变形状，和他自己荣耀的身体<b>相似</b>」——同字）</p><p>弟兄姊妹，神预定的不是「你的人生会顺利」。</p><p>神预定的是：<b>你要像祂的儿子</b>。</p><p>★ 亮光四：πρωτότοκος ——长子</p><p>「使他儿子在许多弟兄中作长子。」</p><p>这一句是整条金链的<b>目的</b>。</p><p>神做这一切，最终不是为了「拯救个别的人」，<br>是为了<b>给祂的儿子一个大家庭</b>。</p>","exp":"<p>弟兄姊妹，8:29–30被称为「金链」（golden chain），因为五个环节扣得死死的。</p><pre>预知 → 预定 → 召 → 称义 → 得荣耀</pre><p>而最重要的观察是：</p><p>这五个动词的主词，<b>全部是神</b>。</p><p>没有一环是「然后你要努力」。</p><p>链子的两端都在神手上——而中间没有一个环是断的。</p><p>【第七段｜8:31–39　四个问题与最后的宣告】</p>"},{"a":31,"z":32,"star":true,"grk":"<p>31 Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ' ἡμῶν;<br>32 ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο ἀλλ' ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;</p>","lit":"<p>31「那么对这些事，我们要说什么呢？若神在我们<b>这一边</b>，谁能在我们<b>那一边</b>（对面）？」<br>32「祂连自己的儿子都<b>没有留下不给</b>，反倒为我们众人<b>交付了</b>祂——岂不也把万物<b>和祂一同</b>，<b>白白地恩赐</b>给我们吗？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>帮助</td><td>ὑπέρ ἡμῶν</td><td>hyper hēmōn</td><td>G5228</td><td>—</td><td><b>在我们这一边</b>（不只是「帮助」）</td><td>见下</td></tr><tr><td>敌挡</td><td>καθ' ἡμῶν</td><td>kath' hēmōn</td><td>G2596</td><td>κατά</td><td><b>在我们的对面</b></td><td>法庭／战场用语</td></tr><tr><td>不爱惜</td><td>οὐκ ἐφείσατο</td><td>ouk epheisato</td><td>G5339</td><td>φείδομαι（怜惜、留下）</td><td><b>没有留下不给</b></td><td>★★ <b>见下</b></td></tr><tr><td>舍了</td><td>παρέδωκεν</td><td>paredōken</td><td>G3860</td><td>παρά + δίδωμι</td><td><b>交付了</b>（<b>4:25同字</b>）</td><td>—</td></tr><tr><td>白白赐给</td><td>χαρίσεται</td><td>charisetai</td><td>G5483</td><td>χάρις（恩典）</td><td><b>凭恩典赐下</b></td><td>—</td></tr></table>","gram":"<p>★★ 亮光一：οὐκ ἐφείσατο ——摩利亚山的回声</p><p>「神既<b>不爱惜</b>自己的儿子」——οὐκ ἐφείσατο。</p><p>现在请看七十士译本的创世记22:12，天使对亚伯拉罕说的话：</p><p>「……因为我知道你是敬畏神的了；你<b>没有将你的儿子，就是你独生的儿子，留下不给我</b>（οὐκ ἐφείσω τοῦ υἱοῦ σου τοῦ ἀγαπητοῦ）。」</p><p>创22:16神再说一次：</p><p>「你既行了这事，<b>不留下你的儿子</b>（οὐκ ἐφείσω τοῦ υἱοῦ σου），就是你独生的儿子……」</p><p>同一个动词：φείδομαι。</p><p>弟兄姊妹，保罗在罗8:32用的，正是这个字。</p><p>在摩利亚山上，神对亚伯拉罕说：「你<b>没有留下</b>你的儿子。」</p><p>在罗马书8:32，保罗对我们说：「神<b>没有留下</b>祂自己的儿子。」</p><p>而两座山之间，有一个决定性的差别：</p><pre>摩利亚山：刀举起来了 —— 然后「不可下手」（创22:12）—— 刀停住了\n各各他：  刀举起来了 —— 没有声音喊停 —— 刀没有停</pre><p>摩利亚山上有一只公羊代替了以撒。</p><p>各各他，<b>没有任何东西代替祂</b>。</p><p>因为<b>祂</b>就是那只羊。</p><p>★ 亮光二：ὑπέρ ／ κατά ——这一边与那一边</p><p>8:31的「帮助」与「敌挡」，原文是两个介词：</p><pre>ὑπὲρ ἡμῶν —— 在我们这一边\nκαθ' ἡμῶν —— 在我们的对面</pre><p>保罗画的是一个<b>法庭</b>（或战场）的画面：</p><p>神站在我这一边。</p><p>那还有谁敢站到对面去？</p><p>★ 亮光三：「何况」的逻辑又回来了</p><p>8:32的结构，正是第五章那个「轻重论证」：</p><pre>【最难的事】祂连自己的儿子都给了\n   ↓ 「岂不也……吗？」（πῶς οὐχὶ καί）\n【比较容易的事】祂会舍不得给你别的吗？</pre><p>（比较5:9–10的两个「何况」）</p><p>弟兄姊妹，这是全本圣经最有力的一个逻辑：</p><p>祂已经给了最贵的那一样。</p><p>剩下的，还有什么舍不得？</p>","exp":"<p>弟兄姊妹，8:32是整章的心脏。</p><p>它回答了一个我们心里最深的怀疑：</p><p>「神是不是其实没有那么爱我？」</p><p>保罗的回答不是一句安慰的话，是一个<b>已经发生的事件</b>：</p><p>摩利亚山上，那把刀停住了。</p><p>各各他，那把刀，<b>没有停</b>。</p>"},{"a":33,"z":34,"star":false,"grk":"<p>33 τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν·<br>34 τίς ὁ κατακρινῶν; Χριστὸς [Ἰησοῦς] ὁ ἀποθανών, μᾶλλον δὲ ἐγερθείς, ὃς καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν.</p>","lit":"<p>33「<b>谁要提出控告</b>，来敌挡神所拣选的人呢？——<b>是神在称人为义</b>。」<br>34「<b>谁是那要定罪的</b>呢？——<b>是基督耶稣</b>，那位死了的，更是<b>已经复活了</b>的；祂<b>如今在神的右边</b>，也<b>正在为我们代求</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>控告</td><td>ἐγκαλέσει</td><td>enkalesei</td><td>G1458</td><td><b>正式提出法律控告</b></td></tr><tr><td>定罪</td><td>ὁ κατακρινῶν</td><td>ho katakrinōn</td><td>G2632</td><td><b>那要定罪的</b>（8:1、8:3同字根）</td></tr><tr><td>替我们祈求</td><td>ἐντυγχάνει</td><td>entynchanei</td><td>G1793</td><td><b>代求</b>（<b>8:26同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：法庭的四个角色，全部被占满了</p><pre>原告席：谁能控告？   —— 没有人，因为【神】是那称义的\n法官席：谁能定罪？   —— 没有人，因为【基督】是那位死了又复活的\n辩护席：              —— 【基督】替我们祈求（8:34）\n证人席：              —— 【圣灵】与我们的心同证（8:16）</pre><p>弟兄姊妹，这是一场很奇怪的审判：</p><p>法官是我的救主。<br>辩护律师是我的救主。<br>证人是圣灵。</p><p>而原告席——<b>空着</b>。</p><p>★ 亮光二：两位代求者</p><pre>8:26  圣灵在我里面，用说不出来的叹息替我祷告\n8:34  基督在神的右边，替我祈求</pre><p>一个在下面，一个在上面。<br>一个在心里，一个在宝座前。</p><p>★ 亮光三：μᾶλλον δέ（而且更是）</p><p>「已经死了，<b>而且</b>从死里复活。」</p><p>μᾶλλον δέ 的意思是「<b>更确切地说</b>」——保罗在自我加强。</p><p>不只是死了。<b>更是</b>复活了。</p>","exp":"<p>弟兄姊妹，33–34节是<b>两个法庭问句</b>。</p><p>而保罗回答的方式很特别：他不是说「没有人能」，他是<b>指出一个人</b>。</p><pre>谁能控告？  →  【是神在称人为义】\n谁能定罪？  →  【是基督已经死了、复活了、在右边、正在代求】</pre><p><b>经文本身明确表达的：</b> 控告与定罪的问题，已经被神的称义与基督四重的作为（死、复活、坐在右边、代求）解决了。</p><p><b>可以合理推论的：</b> 保罗的逻辑不是「你很好，所以没人能告你」，<br>是「<b>那位有资格定你罪的，正在替你辩护</b>」。</p><p>而基督的那四个动作，是有次序的：</p><table><tr><th>动作</th><th>对付的是</th></tr><tr><td><b>已经死了</b></td><td>我的<b>罪债</b></td></tr><tr><td><b>从死里复活</b></td><td>我的<b>死</b></td></tr><tr><td><b>在神的右边</b></td><td>我的<b>地位</b></td></tr><tr><td><b>替我们祈求</b></td><td>我<b>现在的软弱</b></td></tr></table><p>弟兄姊妹，最后那一项最重要：</p><p>祂不是做完就走了。<b>祂现在还在做</b>。</p><p><b>⚠ 牧养提醒：</b> 若有人心里有一个一直在起诉他的声音，<br>请带他读33节：那个原告席，<b>空着</b>。</p>"},{"a":35,"z":37,"star":false,"grk":"<p>37 ἀλλ' ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.</p>","lit":"<p>35「<b>谁要把我们与基督的爱隔开</b>呢？是患难吗？是困苦吗？是逼迫吗？是饥饿吗？是赤身吗？是危险吗？是刀剑吗？」<br>36「正如经上所记：『<b>为你的缘故，我们终日被杀</b>；人看我们如同<b>将要被宰的羊</b>。』」<br>37「然而，在这一切的事上，我们<b>借着那位爱我们的</b>，<b>已经得胜有余</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>隔绝</td><td>χωρίσει</td><td>chōrisei</td><td>G5563</td><td><b>分开、隔离</b>（婚姻用语，可10:9「不可分开」同字）</td></tr><tr><td>得胜有余</td><td>ὑπερνικῶμεν</td><td>hypernikōmen</td><td>G5245</td><td><b>ὑπέρ + νικάω：超级得胜</b></td></tr></table>","gram":"<p>★ 亮光一：七样患难</p><p>保罗列了七样：患难、困苦、逼迫、饥饿、赤身露体、危险、刀剑。</p><p>弟兄姊妹，这七样<b>不是</b>抽象的清单。</p><p>保罗自己<b>全部经历过</b>（林后11:23–27）。</p><p>而收信的罗马教会，七年后也将全部经历。</p><p>★ 亮光二：8:36引用诗篇44:22</p><p>诗篇44篇是一篇<b>抱怨诗</b>——是义人在受苦时对神的申诉。</p><p>保罗没有假装苦难不存在。</p><p>他引用了一篇<b>抱怨的诗</b>，放进罗马书最荣耀的一段里。</p><p>★ 亮光三：ὑπερνικάω ——保罗又叠了一个字</p><p>νικάω 是「得胜」。</p><p>保罗加了 ὑπέρ ——「<b>超级得胜</b>」。</p><p>（这个字在新约<b>只出现这一次</b>）</p><p>和合本译「得胜<b>有余</b>」，译得极好。</p><p>弟兄姊妹，注意保罗说的是「<b>在这一切的事上</b>」（ἐν τούτοις πᾶσιν）——</p><p>不是「脱离了这一切」，是「<b>在这一切里面</b>」。</p><p>得胜不是苦难没有发生。<br>得胜是苦难发生了，而它夺不走那份爱。</p>","exp":"<p>弟兄姊妹，保罗在35节列的七样东西，<b>没有一样是属灵的抽象概念</b>。</p><p>患难、困苦、逼迫、饥饿、赤身露体、危险、刀剑——</p><p>全部是<b>具体的、身体的、会流血的</b>。</p><p>而这七样，保罗<b>自己都经历过</b>（林后11:23–27）。</p><p>收信的罗马教会，七年后也将全部经历（主后64年，尼禄的逼迫）。</p><p><b>经文本身明确表达的：</b> 没有任何处境能把信徒与基督的爱隔开；在这一切之中，我们借着那位爱我们的，得胜有余。</p><p><b>可以合理推论的：</b> 保罗刻意引用诗篇44篇——那是一篇<b>抱怨诗</b>，是义人在受苦时对神的申诉。</p><p>他没有假装苦难不存在。他把一篇<b>抱怨的诗</b>，放进了罗马书最荣耀的一段里。</p><p>而37节的关键在那个介词：</p><p>「<b>在这一切的事上</b>」（ἐν τούτοις πᾶσιν）——</p><p>不是「脱离了这一切」，是「<b>在这一切里面</b>」。</p><p><b>⚠ 牧养提醒：</b> 不可把8:35–39讲成「信主就不会遇到坏事」。<br>保罗列的每一样，都是<b>会真的发生</b>的事。<br>他保证的不是「不会发生」，是「<b>发生了，也夺不走</b>」。</p>"},{"a":38,"z":39,"star":true,"grk":"<p>38 πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις<br>39 οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.</p>","lit":"<p>「因为我<b>已经被说服而确信</b>：无论是死、是生，是天使、是掌权的，是现在的事、是将来的事，是有能的，是高处、是低处，或是<b>任何别的受造之物</b>，都<b>不能够</b>使我们与神的爱隔绝——这爱是在我们主基督耶稣里的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>深信</td><td>πέπεισμαι</td><td>pepeismai</td><td>G3982</td><td><b>完成被动式</b>：我已经被说服，且持续确信</td></tr><tr><td>高处／低处</td><td>ὕψωμα／βάθος</td><td>hypsōma/bathos</td><td>G5313/G899</td><td>高度／深度（<b>可能是天文学用语</b>，见下）</td></tr><tr><td>别的受造之物</td><td>τις κτίσις ἑτέρα</td><td>—</td><td>G2937</td><td><b>任何其他的受造之物</b></td></tr></table>","gram":"<p>★ 亮光一：πέπεισμαι 是完成被动式</p><p>「我深信」——不是「我觉得」，是：</p><p>我<b>已经被说服了</b>，而且这个确信持续到现在。</p><p>被谁说服？</p><p>被前面三十七节的论证。</p><p>保罗的确信不是情绪，是<b>被证据说服的结果</b>。</p><p>★ 亮光二：ὕψωμα 与 βάθος 可能是天文学用语</p><p>在希腊化的占星术中，这两个字用于星体在天空中的最高点与最低点——</p><p>古代人相信星体的位置决定人的命运。</p><p>若这个背景成立（多数注释认为有此可能），保罗的意思是：</p><p>连你出生时星象所定的「命」，也隔不开这爱。</p><p>讲台使用提醒：这是<b>可能的</b>背景，宜说「有学者认为」，不要说成定论。</p><p>★ 亮光三：那个清单里少了一样</p><p>弟兄姊妹，保罗列了十样，还加了一个兜底条款「别的受造之物」。</p><p>有人会问：那我自己呢？我会不会自己把自己隔绝？</p><p>答案就在最后那句：</p><p>「或是<b>别的受造之物</b>（τις κτίσις ἑτέρα）。」</p><p>我是不是受造之物？</p><p>是。</p><p>所以我也在那份清单里。</p><p>★ 亮光四：δυνήσεται ——「不能够」</p><p>「都<b>不能</b>叫我们与神的爱隔绝」——这个字是 δύναμαι（有能力）。</p><p>不是「不会」，是「<b>没有这个能力</b>」。</p>","exp":"<p>弟兄姊妹，第八章以「不定罪」开始，以「不隔绝」结束。</p><p>而最后一句话，是整章的地址：</p><p>「这爱是<b>在我们主基督耶稣里</b>的。」</p><p>这份爱不是浮在空中的一种情感。</p><p>它有一个地址。</p><p>它在一个人里面。</p><p>而8:39最后一个字，是「<b>我们的主</b>」。</p><p>保罗写完了全卷书最壮阔的一段之后，最后落在一个字上：</p><p>「我们的」。</p><p>不是「那位主」，是——<b>我们的</b>主。</p>"}],"9":[{"a":1,"z":3,"star":true,"grk":"<p>1 Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,<br>2 ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου.<br>3 ηὐχόμην γὰρ ἀνάθεμα εἶναι αὐτὸς ἐγὼ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,</p>","lit":"<p>1「我在基督里说真话，我不说谎——我的良心在圣灵里<b>与我一同作见证</b>：」<br>2「我心里有极大的忧伤，和<b>不止息的剧痛</b>。」<br>3「因为我<b>曾这样祈愿</b>：我自己成为<b>咒诅</b>，与基督分离，为了我的弟兄，我肉身的亲族。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>作见证</td><td>συμμαρτυρούσης</td><td>symmartyrousēs</td><td>G4828</td><td>σύν + μαρτυρέω</td><td><b>一同作证</b></td><td><b>2:15、8:16同字</b></td></tr><tr><td>忧愁</td><td>λύπη</td><td>lypē</td><td>G3077</td><td>—</td><td>悲伤、忧伤</td><td>—</td></tr><tr><td>时常伤痛</td><td>ἀδιάλειπτος ὀδύνη</td><td>adialeiptos odynē</td><td>G88/G3601</td><td>ἀ + διαλείπω（间断）</td><td><b>不止息的剧痛</b></td><td>ὀδύνη 是很重的字</td></tr><tr><td>愿意</td><td>ηὐχόμην</td><td>ēuchomēn</td><td>G2172</td><td>εὔχομαι（祈愿）</td><td><b>未完成式</b>（见下）</td><td>极重要</td></tr><tr><td>被咒诅</td><td>ἀνάθεμα</td><td>anathema</td><td>G331</td><td>—</td><td><b>被交出去毁灭的东西</b></td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：συμμαρτυρέω ——第三次出现</p><p>这个字在罗马书出现三次，每一次的证人都不同：</p><table><tr><th>出处</th><th>证人</th><th>见证的内容</th></tr><tr><td><b>2:15</b></td><td>是非之心（良心）</td><td><b>控告或辩护</b>——内心的法庭</td></tr><tr><td><b>8:16</b></td><td>圣灵</td><td>我们是神的儿女</td></tr><tr><td><b>9:1</b></td><td>良心 <b>在圣灵里</b></td><td><b>保罗说的是真话</b></td></tr></table><p>保罗为什么要如此郑重地起誓？</p><p>因为他知道：一个讲「外邦人也能得救」的犹太人，最容易被指控——<br>「你已经不爱你的同胞了。」</p><p>所以他先立誓：我没有说谎。</p><p>★ 亮光二：ηὐχόμην 是未完成式</p><p>「我也愿意」——这个动词是<b>未完成式</b>（imperfect）。</p><p>在希腊文中，这种用法（有时称为「不可能实现的愿望」）表示：</p><p>「我<b>曾经这样希望过</b>——但我知道这是不可能的。」</p><p>（英文常译 \"I could wish\"，而不是 \"I wish\"）</p><p>弟兄姊妹，这个文法细节很重要。</p><p>保罗不是在提一个他真的打算执行的方案（他刚在8:39说没有什么能隔绝）。</p><p>他是在说：<b>如果可以，我愿意</b>。</p><p>这是一个心碎到极处的人，说出来的话。</p><p>★ 亮光三：ἀνάθεμα 的重量</p><p>这个字在七十士译本中，翻译希伯来文 <b>חֵרֶם（cherem）</b>——</p><p><b>「当灭之物」：被分别出来、交给神毁灭的东西</b>（书6:17–18；7:1的亚干事件）。</p><p>保罗在别处用这个字：</p><p>- <b>林前16:22</b>「若有人不爱主，这人可<b>诅可咒</b>」<br>- <b>加1:8</b>「就应当被<b>咒诅</b>」</p><p>弟兄姊妹，保罗在说：如果可以，我愿意成为那个「当灭之物」——</p><p>只要我的同胞能得救。</p><p>★ 亮光四：这句话有一个先例</p><p>出埃及记32:32，摩西在金牛犊事件之后对神说：</p><p>「倘或你肯赦免他们的罪……不然，求你从你所写的册上涂抹我的名。」</p><p>保罗的话，是摩西的回声。</p><p>而两个人所说的，最终都在一位身上实现了——</p><p>只有一个人真的成了咒诅：</p><p>「基督既为我们受了咒诅，就赎出我们脱离律法的咒诅。」（加3:13）</p>","exp":"<p>弟兄姊妹，9:1–3是全章的门。</p><p>如果不从这里进去，第九章就会变成一场冷冰冰的预定论辩论。</p><p>保罗讲神的主权之前，先哭了。</p><p>而任何人要讲第九章，也应该先走过这三节。</p>"},{"a":4,"z":5,"star":false,"grk":"<p>4 οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,<br>5 ὧν οἱ πατέρες καὶ ἐξ ὧν ὁ Χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>4「他们就是以色列人：<b>儿子的名分</b>、<b>荣耀</b>、<b>诸约</b>、<b>律法的颁赐</b>、<b>圣殿的敬拜</b>、<b>应许</b>，都是他们的；」<br>5「<b>列祖</b>是他们的；而按肉体说，<b>基督也是从他们出来的</b>——祂是在万有之上、永远当受称颂的神。阿们。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>儿子的名分</td><td>υἱοθεσία</td><td>huiothesia</td><td>G5206</td><td><b>收养</b>（<b>8:15、8:23同字！</b>）</td></tr><tr><td>荣耀</td><td>δόξα</td><td>doxa</td><td>G1391</td><td>指<b>神的荣耀同在</b>（שְׁכִינָה 的观念）</td></tr><tr><td>诸约</td><td>διαθῆκαι</td><td>diathēkai</td><td>G1242</td><td><b>复数</b>：与亚伯拉罕、摩西、大卫所立的约</td></tr><tr><td>律法</td><td>νομοθεσία</td><td>nomothesia</td><td>G3548</td><td><b>律法的颁赐</b>（不只是律法本身）</td></tr><tr><td>礼仪</td><td>λατρεία</td><td>latreia</td><td>G2999</td><td><b>敬拜的事奉</b>（圣殿的敬拜）</td></tr></table>","gram":"<p>★ 亮光一：八项特权</p><p>保罗一口气列了八样（有些学者算作九样）：</p><pre>1. 以色列人（这个名字本身）\n2. 儿子的名分（υἱοθεσία）\n3. 荣耀（神同在的荣光）\n4. 诸约（复数）\n5. 律法的颁赐\n6. 敬拜的事奉\n7. 应许（复数）\n8. 列祖\n★ 而且：按肉体说，基督也是从他们出来的</pre><p>弟兄姊妹，保罗在说：<b>这些全部是真的</b>。</p><p>他没有为了强调外邦人，就否认以色列的特权。</p><p>（正如4:1–2，他没有为了讲因信称义，就否认亚伯拉罕的伟大。）</p><p>★ 亮光二：υἱοθεσία ——第八章那个字</p><p>「儿子的名分」正是8:15、8:23的那个字（罗马的收养）。</p><p>这使9:1–5的悲伤更加深：</p><p>那份「儿子的名分」是他们的——<br>而他们大部分人，正站在门外。</p><p>★ 亮光三：9:5的标点争议（是否称基督为神）</p><p>希腊文原稿没有标点。9:5末句有两种主要读法：</p><table><tr><th>读法</th><th>中译</th><th>意思</th></tr><tr><td><b>读法A（多数译本，含和合本）</b></td><td>「基督也是从他们出来的，<b>他是在万有之上，永远可称颂的神</b>」</td><td><b>基督被称为神</b></td></tr><tr><td><b>读法B</b></td><td>「……基督也是从他们出来的。<b>愿在万有之上的神，永远可称颂</b>」</td><td>末句是<b>独立的颂赞</b>，不指基督</td></tr></table><p>支持读法A的主要理由（多数现代学者倾向此读法）：</p><p>1. <b>希腊文的颂赞句通常把「可称颂的」（εὐλογητός）放在句首</b>——但这里放在后面，较符合「形容前面主词」的读法<br>2. <b>ὁ ὤν（那是……的）是关系性的分词</b>，自然承接前面的「基督」<br>3. 保罗刚说「按<b>肉体</b>说」，自然会有一个对比的另一面</p><p>支持读法B的理由：</p><p>- 保罗称基督为「神」的例子不多（虽然多3:13、腓2:6等处有高基督论）</p><p>讲台诚信提醒：可以说「这一节多数学者认为是称基督为神」，但宜补一句「这里有一个标点的问题，因为原稿没有标点」。<br>不要说「所有人都同意」。</p>","exp":"<p>弟兄姊妹，9:4–5使9:1–3的悲伤变得更深。</p><p>保罗的忧愁不是抽象的。</p><p>他一项一项数着：儿子的名分、荣耀、诸约、律法、敬拜、应许、列祖、弥赛亚——</p><p>全部是他们的。</p><p>而他们大部分人，不在里面。</p><p>【第二段｜9:6–13　神的话没有落空】</p>"},{"a":6,"z":6,"star":true,"grk":"<p>Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραὴλ οὗτοι Ἰσραήλ·</p>","lit":"<p>「但这并不是说神的话<b>掉下来了</b>。因为<b>不是所有从以色列出来的，就都是以色列</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>落了空</td><td>ἐκπέπτωκεν</td><td>ekpeptōken</td><td>G1601</td><td>ἐκ + πίπτω（掉落）</td><td><b>掉下来、失效</b></td><td><b>完成式</b>（见下）</td></tr><tr><td>话</td><td>λόγος</td><td>logos</td><td>G3056</td><td>—</td><td>话语、应许</td><td>指神的应许</td></tr></table>","gram":"<p>★ 亮光一：ἐκπίπτω 的画面</p><p>这个字的字面是「<b>掉出来、掉下去</b>」。</p><p>用于：</p><p>- <b>花凋谢掉落</b>（雅1:11「花必凋谢」；彼前1:24）<br>- <b>船只失去方向、触礁</b>（徒27:17、26、29）<br>- 从恩典中<b>坠落</b>（加5:4）</p><p>保罗说：神的话<b>没有掉下来</b>。</p><p>它没有凋谢，没有触礁，没有从架上摔下来。</p><p>★ 亮光二：完成式的意义</p><p>ἐκπέπτωκεν 是<b>完成式</b>——「（并非）已经掉下来且维持在那个状态」。</p><p>保罗要否定的，不只是「神的话曾经失效」，<br>而是「神的话<b>现在处于失效的状态</b>」。</p><p>★ 亮光三：全章的论证方向就在这一节</p><p>注意保罗怎么回答「神的话落空了吗」：</p><p>他<b>没有</b>说：「不会的，将来以色列都会信。」（那是第十一章才说的）</p><p>他说的是：</p><p>「因为从以色列生的<b>不都是</b>以色列人。」</p><p>意思是：<b>神的应许从来就不是给「所有血统上的以色列人」的</b>。</p><p>所以现在有很多人不信——<b>这不表示应许失效了</b>。</p><p>★ 亮光四：与2:28–29的完全呼应</p><pre>2:28–29  外面作犹太人的，不是真犹太人……惟有里面作的，才是真犹太人\n   ↓\n9:6      从以色列生的不都是以色列人</pre><p>保罗在第二章已经说过同样的话。第九章只是把它应用到救恩历史上。</p>","exp":"<p>弟兄姊妹，9:6是全章的<b>钥匙</b>——而它是一句<b>辩护</b>。</p><p>保罗刚数完以色列的八项特权（9:4–5），然后面对一个很尖锐的问题：</p><p>如果神给了他们这么多应许，而他们大部分人不在里面——</p><p>那<b>神的话是不是失效了</b>？</p><p>保罗的回答分两层：</p><pre>第一层：不是。神的话没有「掉下来」（ἐκπίπτω）\n第二层：因为「以色列」从一开始就不是按血统定义的</pre><p><b>经文本身明确表达的：</b> 神的话没有落空；因为「从以色列生的」不等于「以色列」。</p><p><b>可以合理推论的：</b> 这句话不是保罗临时想出来的辩词——<br>旧约本身就是这样：以撒而非以实玛利，雅各而非以扫。</p><p>神从来没有应许「凡是亚伯拉罕的肉身后裔都必得救」。</p><p><b>⚠ 讲台诚信提醒：</b> 第九章的驱动问题是「<b>神的话落空了吗</b>」（9:6），<br>不是「预定论该怎么建构」。<br>若把第九章当成一篇预定论论文来读，就读错了它的文体与目的。</p>"},{"a":7,"z":9,"star":false,"grk":"<p>7 οὐδ' ὅτι εἰσὶν σπέρμα Ἀβραάμ πάντες τέκνα, ἀλλ'· ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.<br>8 τοῦτ' ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα.<br>9 ἐπαγγελίας γὰρ ὁ λόγος οὗτος· κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.</p>","lit":"<p>7「也不是因为是亚伯拉罕的后裔，就都是儿女；乃是『<b>从以撒生的，才要称为你的后裔</b>』。」<br>8「这就是说：<b>肉身的儿女不是神的儿女</b>；<b>惟有应许的儿女，才被算为后裔</b>。」<br>9「因为所应许的话是这样：『<b>到这时候我要来，撒拉必有一个儿子</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>肉身所生的儿女</td><td>τὰ τέκνα τῆς σαρκός</td><td>—</td><td>G4561</td><td><b>肉体的儿女</b></td></tr><tr><td>应许的儿女</td><td>τὰ τέκνα τῆς ἐπαγγελίας</td><td>—</td><td>G1860</td><td><b>应许的儿女</b></td></tr></table>","gram":"<p>★ 保罗的第一个例子：以实玛利 vs 以撒</p><p>这个例子的重点在于：</p><pre>以实玛利：亚伯拉罕的儿子（血统上完全合格）\n以撒：    亚伯拉罕的儿子 ＋ 应许的产物\n   ↓\n神拣选的是以撒</pre><p>而9:9引创18:10、14，强调以撒是<b>应许</b>的结果：</p><p>「到明年这时候我要来，撒拉必生一个儿子。」</p><p>弟兄姊妹，回想第四章：</p><p>4:19「他将近百岁的时候，虽然想到自己的身体如同已死。」</p><p>以撒的出生，是「叫死人复活、使无变为有的神」的作为（4:17）。</p><p>所以保罗的重点是：<b>应许的儿女，从一开始就是神生出来的，不是人生出来的</b>。</p>","exp":"<p>弟兄姊妹，这三节在证明9:6那句话。</p><p>而保罗举的例子，是<b>亚伯拉罕自己家里的事</b>：</p><p>亚伯拉罕有两个儿子。</p><p>以实玛利是<b>血统上的</b>后裔（而且是长子）。<br>以撒是<b>应许的</b>儿女。</p><p>注意8节那个动词：「<b>被算为</b>（λογίζεται）后裔」——</p><p>那是第四章那个记帐的字。</p><p><b>经文本身明确表达的：</b> 神的后裔是按<b>应许</b>定义的，不是按<b>肉身</b>定义的。</p><p><b>可以合理推论的：</b> 这对每一个读者都有话说——</p><p>你能在神的家里，<b>不是因为你的出身</b>，是因为<b>祂的应许</b>。</p><p>而以撒的出生本身就是证据：那是「叫死人复活、使无变为有的神」（4:17）的作为。</p><p><b>⚠ 牧养提醒：</b> 这一段不是要人去猜「谁是应许的儿女」，<br>是要人回到9:6的问题：<b>神的话有没有失效</b>？答案是没有。</p>"},{"a":10,"z":13,"star":true,"grk":"<p>11 μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον, ἵνα ἡ κατ' ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ, οὐκ ἐξ ἔργων ἀλλ' ἐκ τοῦ καλοῦντος,</p>","lit":"<p>11「因为双子还没有生下来，也还没有做出任何善恶，为要使神那<b>按着拣选的旨意</b>得以<b>存留</b>——不是出于行为，乃是出于<b>那位呼召的</b>——」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>拣选</td><td>ἐκλογή</td><td>eklogē</td><td>G1589</td><td>ἐκ + λέγω（挑出）</td><td><b>挑选出来</b></td><td>11:5、11:28同字</td></tr><tr><td>旨意</td><td>πρόθεσις</td><td>prothesis</td><td>G4286</td><td>πρό + τίθημι</td><td><b>预先摆定的计划</b></td><td><b>8:28同字</b></td></tr><tr><td>存留</td><td>μένῃ</td><td>menē</td><td>G3306</td><td>μένω</td><td><b>保持不变、站立得住</b></td><td>—</td></tr><tr><td>恶</td><td>ἐμίσησα</td><td>emisēsa</td><td>G3404</td><td>μισέω</td><td>恨恶</td><td><b>见第二十部分</b></td></tr></table>","gram":"<p>★ 亮光一：保罗为什么要加第二个例子？</p><p>因为以实玛利与以撒的例子，还有一个可能的解释：</p><p>「以实玛利是使女生的，以撒是正室生的——所以是<b>母亲不同</b>。」</p><p>所以保罗加了第二个例子，把这个解释堵死：</p><pre>雅各与以扫：同一个父亲（以撒）、同一个母亲（利百加）\n            而且是双胞胎、同一次怀孕（9:10）</pre><p>不能再说「因为出身不同」了。</p><p>★ 亮光二：「还没有生下来，善恶还没有做出来」</p><p>保罗刻意强调时间点：</p><p>神说话的时候（创25:23），这两个孩子还在腹中。</p><p>所以拣选的根据，<b>不可能是他们的行为</b>。</p><p>★ 亮光三：πρόθεσις ——8:28那个字</p><pre>8:28  「就是按他旨意（πρόθεσις）被召的人」\n9:11  「神拣选人的旨意（πρόθεσις）」</pre><p>第八章的「金链」与第九章的「拣选」，用的是同一个字。</p><p>★ 亮光四：9:13「以扫是我所恶的」（见第二十部分的完整讨论）</p><p>这句话引自玛拉基书1:2–3。</p><p>必须注意三件事：</p><p>1. <b>玛拉基书的上下文讲的是</b>两个民族<b>（以东与以色列），不是两个婴儿的永恒命运<br>2. </b>创25:23原文就说「两国在你腹内」<b>——是民族性的预言<br>3. </b>希伯来语法中，「爱……恨……」常是<b>比较式的表达</b>（见第二十部分）</p><p>讲台诚信提醒：不可把9:13直接读成「神在以扫出生前就决定憎恨他、让他下地狱」——<br>那超出了保罗所引经文的原意。</p>","exp":"<p>弟兄姊妹，9:11的重点是什么？</p><p>「不在乎人的行为，乃在乎<b>召人的主</b>。」</p><p>这句话与整卷罗马书完全一致：</p><pre>3:20  没有一个因行律法能称义\n4:4–5 作工的得工价，不算恩典\n9:11  不在乎人的行为，乃在乎召人的主\n9:16  不在乎那定意的，也不在乎那奔跑的</pre><p>保罗在第九章讲拣选，不是为了满足我们对「谁得救」的好奇，<br>是为了证明<b>同一件事</b>：</p><p>从头到尾，都是恩典。</p><p>【第三段｜9:14–18　神不公平吗？】</p>"},{"a":14,"z":16,"star":false,"grk":"<p>16 ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.</p>","lit":"<p>14「那么我们要说什么呢？<b>神那里有不义吗</b>？<b>绝不可能</b>！」<br>15「因为祂对摩西说：『<b>我要怜悯谁，就怜悯谁</b>；我要恩待谁，就恩待谁。』」<br>16「所以，这<b>不在于那想要的</b>，<b>也不在于那奔跑的</b>，乃<b>在于那施怜悯的神</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>不公平</td><td>ἀδικία</td><td>adikia</td><td>G93</td><td><b>不义</b></td></tr><tr><td>定意的</td><td>τοῦ θέλοντος</td><td>tou thelontos</td><td>G2309</td><td><b>意志的决定</b>（7:18「立志」同字）</td></tr><tr><td>奔跑的</td><td>τοῦ τρέχοντος</td><td>tou trechontos</td><td>G5143</td><td><b>赛跑</b>（保罗爱用的比喻：林前9:24；腓2:16）</td></tr><tr><td>发怜悯</td><td>ἐλεῶντος</td><td>eleōntos</td><td>G1653</td><td>施怜悯</td></tr></table>","gram":"<p>★ 亮光一：9:15引出33:19的上下文极其重要</p><p>这句话是神在什么时候说的？</p><p>金牛犊事件之后。</p><p>以色列刚刚拜了金牛犊，摩西求神显出祂的荣耀，神就说：</p><p>「我要恩待谁就恩待谁；要怜悯谁就怜悯谁。」（出33:19）</p><p>弟兄姊妹，这一点很重要：</p><p>这句话的原始处境，不是「神随意决定谁下地狱」，<br>是「一个刚刚悖逆的民族，<b>竟然还能继续存在</b>——那是因为怜悯」。</p><p>★ 亮光二：「定意的／奔跑的」</p><pre>θέλω   —— 意志（我想要）\nτρέχω  —— 行动（我努力）</pre><p>保罗列出了人所能做的两件事：<b>想</b>与<b>跑</b>。</p><p>然后说：都不在乎。</p><p>弟兄姊妹，这两个字刚好对应第七章：</p><p>7:18「立志为善（θέλειν）由得我，只是行出来由不得我。」</p><p>想，我有。跑，我也试过。<br>而9:16说：这件事的根据不在那里。</p>","exp":"<p>弟兄姊妹，14节那个问题，是每一个读到9:13的人都会问的：</p><p>「这样公平吗？」</p><p>而保罗的回答，不是先辩护，是先<b>引一段经文</b>（出33:19）。</p><p>而那段经文的处境极其重要：</p><p>那是在<b>金牛犊事件之后</b>说的。</p><p>以色列刚刚拜了偶像；摩西求神显出祂的荣耀。<br>而神说的是：「我要怜悯谁，就怜悯谁。」</p><p><b>经文本身明确表达的：</b> 神施怜悯的根据，在祂自己，不在人的意志（θέλω）或努力（τρέχω）。</p><p><b>可以合理推论的：</b> 保罗列出的正是人能做的<b>全部两件事</b>——<b>想</b>与<b>跑</b>。</p><p>而这两个字刚好对应第七章：「立志（θέλειν）为善由得我，只是行出来由不得我。」</p><p>想，我有。跑，我也试过。而9:16说：这件事的根据，不在那里。</p><p><b>⚠ 讲台诚信提醒：</b> 9:16不可用来否定人的责任——<br>同一位保罗在10:9–13说「凡求告主名的，就必得救」，在10:14说「没有传道的，怎能听见呢」。<br>第九章与第十章必须一起读。</p>"},{"a":17,"z":18,"star":false,"grk":"<p>17 λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.<br>18 ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.</p>","lit":"<p>17「因为经上对法老说：『<b>正是为这缘故，我兴起了你</b>——为要在你身上<b>显出我的能力</b>，并要使<b>我的名传遍全地</b>。』」<br>18「所以，祂<b>要怜悯谁就怜悯谁</b>，<b>要叫谁刚硬就叫谁刚硬</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>兴起</td><td>ἐξήγειρα</td><td>exēgeira</td><td>G1825</td><td><b>兴起、使之站立</b>（见下）</td></tr><tr><td>刚硬</td><td>σκληρύνει</td><td>sklērynei</td><td>G4645</td><td><b>使之硬化</b>（<b>2:5 σκληρότης 同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：出埃及记的完整资料（★ 必须诚实呈现）</p><p>关于法老的心，出埃及记的叙述比一般人以为的复杂：</p><table><tr><th>说法</th><th>出处</th></tr><tr><td><b>神使法老的心刚硬</b></td><td>出4:21、7:3、9:12、10:1、10:20、10:27、11:10、14:4、14:8、14:17</td></tr><tr><td><b>法老自己硬着心</b></td><td>出8:15、8:32、9:34</td></tr><tr><td><b>法老的心刚硬（未指明主词）</b></td><td>出7:13、7:14、7:22、8:19、9:7、9:35</td></tr></table><p>弟兄姊妹，这个资料极其重要：</p><p>出埃及记<b>同时</b>说神使他刚硬，也说他自己硬着心。</p><p>而且值得注意的是：<b>在叙事的顺序上，法老自己硬心的记载出现得很早</b>（出7–8章），<br>神「使他刚硬」的实际发生，多在后段（出9:12之后）。</p><p>（不同学者对这个顺序的神学意义有不同解读，但资料本身是清楚的。）</p><p>★ 亮光二：σκληρύνω 与2:5的呼应</p><pre>2:5   「你竟任着你刚硬（σκληρότης）不悔改的心」—— 人自己刚硬\n9:18  「要叫谁刚硬（σκληρύνει）就叫谁刚硬」—— 神使之刚硬</pre><p>保罗在罗马书中两面都说了。</p><p>★ 亮光三：ἐξεγείρω ——「兴起」</p><p>出9:16的希伯来原文有「使你存立」的意思。</p><p>神对法老说的是：我让你活到现在，是有目的的。</p><p>注意：经文说的是「我将你<b>兴起</b>」，不是「我造你出来是为了毁灭你」。</p>","exp":"<p>弟兄姊妹，9:14–18回答了「神公平吗」这个问题——但回答的方式可能出乎意料。</p><p>保罗<b>没有</b>说：「神很公平，因为祂是照着人的表现来决定的。」</p><p>他说的是：</p><p>「我要怜悯谁就怜悯谁。」</p><p>弟兄姊妹，这句话的重点是<b>怜悯</b>。</p><p>而怜悯的定义是什么？</p><p>怜悯是——<b>不欠你的</b>。</p><p>如果神欠你，那叫「公平」。<br>如果神不欠你，那叫「怜悯」。</p><p>而保罗前面八章已经证明了：<b>神不欠任何人</b>。</p><p>【第四段｜9:19–24　窑匠与泥土】</p>"},{"a":19,"z":21,"star":false,"grk":"<p>20 ὦ ἄνθρωπε, μενοῦνγε σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ;</p>","lit":"<p>19「那么你要对我说：『<b>祂为什么还指责人呢</b>？有谁<b>抵挡过祂的旨意</b>呢？』」<br>20「<b>人哪</b>——<b>你到底是谁</b>，竟然<b>回嘴顶撞神</b>？<b>受造的</b>岂能对<b>造它的</b>说：『你为什么把我造成这样？』」<br>21「窑匠岂没有权柄，<b>从同一团泥里</b>，拿一块做成<b>贵重的器皿</b>，又拿一块做成<b>平常的器皿</b>吗？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>你这个人哪</td><td>ὦ ἄνθρωπε</td><td>ō anthrōpe</td><td>G444</td><td>—</td><td>呼格：<b>人哪</b></td><td><b>2:1、2:3同样的呼格</b></td></tr><tr><td>强嘴</td><td>ἀνταποκρινόμενος</td><td>antapokrinomenos</td><td>G470</td><td>ἀντί + ἀποκρίνομαι</td><td><b>顶嘴、对着回话</b></td><td>见下</td></tr><tr><td>窑匠</td><td>κεραμεύς</td><td>kerameus</td><td>G2763</td><td>—</td><td>陶匠</td><td>旧约常见的意象</td></tr><tr><td>泥</td><td>πηλός</td><td>pēlos</td><td>G4081</td><td>—</td><td>泥土</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：「人哪」——第二章的呼格回来了</p><pre>2:1  「你这论断人的（ὦ ἄνθρωπε），无论你是谁」\n2:3  「你这人哪（ὦ ἄνθρωπε）」\n9:20 「你这个人哪（ὦ ἄνθρωπε）」</pre><p>保罗在罗马书用这个呼格三次——每一次都是在对付<b>人的自以为是</b>。</p><p>★ 亮光二：ἀνταποκρίνομαι ——「顶回去」</p><p>这个字由 ἀντί（对着）+ ἀποκρίνομαι（回答）组成。</p><p>它的意思是：<b>回嘴、顶撞、对着干</b>。</p><p>（新约仅两次：路14:6、罗9:20）</p><p>保罗的重点不是「你不可以问问题」——</p><p>他自己在9:14、9:19就在问问题！</p><p>他的重点是：<b>你不可以站到神的对面，把祂当被告审问</b>。</p><p>★ 亮光三：窑匠的意象来自旧约，而且上下文很重要</p><p>保罗在9:20引用了赛29:16与赛45:9，而9:21的窑匠意象在旧约有几处：</p><table><tr><th>出处</th><th>上下文</th></tr><tr><td><b>赛29:16</b></td><td>责备那些「以为神看不见」的人</td></tr><tr><td><b>赛45:9</b></td><td>责备那些质疑神使用古列的人</td></tr><tr><td><b>★ 耶18:1–10</b></td><td><b>窑匠的家：而这一段的重点是——神会照着人的回应改变祂的作法</b></td></tr></table><p>耶利米书18:7–8极其重要：</p><p>「我何时论到一邦或一国说，要拔出、拆毁、毁坏；<br>我所说的那一邦，<b>若是转意离开他们的恶</b>，我就必后悔，不将我想要施行的灾祸降与他们。」</p><p>弟兄姊妹，这一点值得注意：</p><p>旧约的窑匠意象，<b>本身就包含人的回应</b>。</p><p>保罗引用这个意象时，是在讲神的主权——<br>但这个意象在旧约的原始脉络里，并不是宿命论。</p>","exp":"<p>弟兄姊妹，19节的问题很诚实：「那还能怪谁呢？」</p><p>而保罗的回答，让很多人不满意——因为他<b>没有直接回答</b>。</p><p>他做的是：<b>把问问题的人，移回他该站的位置</b>。</p><p>「人哪——<b>你到底是谁</b>？」</p><p><b>经文本身明确表达的：</b> 受造之物没有立场质问造它的那一位；窑匠对泥土有处置权。</p><p><b>可以合理推论的：</b> 保罗在此<b>不是</b>在证明「神是专断的」，<br>他是在指出：<b>提问者站错了位置</b>。</p><p>这正是321所说的：<b>骄傲是离开本位，抓住权力</b>。<br>而这里的「离开本位」，是<b>从受造者的位置，跳到审问者的位置</b>。</p><p><b>⚠ 讲台诚信提醒（极重要）：</b> 读到窑匠<b>不可以停在这里</b>。</p><p>理由有三：</p><p>① 旧约的窑匠意象（耶18:1–10）<b>本身就包含人的回应</b>：<br>「那一邦若是转意离开他们的恶，我就必后悔。」</p><p>② 下一段（9:22–23）的原文语法是<b>不对称的</b>（见下一节）。</p><p>③ 保罗自己给的结论在9:32：「他们<b>不凭着信心求，只凭着行为求</b>。」</p>"},{"a":22,"z":24,"star":true,"grk":"<p>22 εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,<br>23 καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους ἃ προητοίμασεν εἰς δόξαν,</p>","lit":"<p>22「但若神愿意显明祂的忿怒、彰显祂的权能，却<b>以极大的忍耐担待</b>了那些可怒的器皿——<b>那些已被预备好走向毁灭的</b>——」<br>23「又为要彰显祂荣耀的丰富，在那些蒙怜悯的器皿上——<b>就是祂预先预备得荣耀的</b>——」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>语态</th><th>意义</th></tr><tr><td>忍耐</td><td>μακροθυμία</td><td>makrothymia</td><td>G3115</td><td>—</td><td><b>2:4那个字！「长引线」</b></td></tr><tr><td>宽容</td><td>ἤνεγκεν</td><td>ēnenken</td><td>G5342</td><td>主动</td><td><b>担待、承受</b>（φέρω）</td></tr><tr><td>预备遭毁灭</td><td>κατηρτισμένα</td><td>katērtismena</td><td>G2675</td><td><b>完成被动分词</b></td><td><b>见下</b></td></tr><tr><td>早预备得荣耀</td><td>προητοίμασεν</td><td>proētoimasen</td><td>G4282</td><td><b>主动，主词是神</b></td><td><b>见下</b></td></tr></table>","gram":"<p>★★ 亮光一：两节之间的巨大不对称</p><p>请把两个动词并排：</p><pre>9:22  κατηρτισμένα εἰς ἀπώλειαν\n      「已被预备好走向毁灭」\n      —— 完成被动分词\n      —— 【经文没有指明是谁预备的】\n\n9:23  ἃ προητοίμασεν εἰς δόξαν\n      「祂预先预备得荣耀的」\n      —— 主动语态\n      —— 【主词明确：神】</pre><p>弟兄姊妹，保罗在这里的用字，精准到令人震动。</p><p>讲到<b>荣耀</b>，他明说：<b>神预先预备的</b>。<br>讲到<b>毁灭</b>，他用被动式，<b>没有说是谁预备的</b>。</p><p>这个不对称意味着什么？</p><p>至少意味着：保罗<b>没有</b>用一句对称的话说「神预备一些人得荣耀、预备另一些人下地狱」。</p><p>他刻意在两边用了不同的语法。</p><p>（关于「双重预定」的完整讨论，见第二十部分。）</p><p>★ 亮光二：κατηρτισμένα 的字义</p><p>καταρτίζω 的意思是「<b>修补、装配、使之完备</b>」。</p><p>（可1:19「补网」；加6:1「挽回」；来11:3「诸世界是藉神的话造成的」——都是同字）</p><p>这个字本身是中性的：使某物达到它应有的状态。</p><p>★ 亮光三：μακροθυμία ——第二章那个字</p><pre>2:4   「你藐视他丰富的恩慈、宽容、忍耐（μακροθυμία）……\n       不晓得他的恩慈是领你悔改呢？」\n   ↓\n9:22  「就多多忍耐（μακροθυμία）宽容那可怒……的器皿」</pre><p>弟兄姊妹，这个连结极其重要。</p><p>第二章说：神的忍耐，是<b>在领人悔改</b>。<br>第九章说：神对「可怒的器皿」，也是<b>多多忍耐</b>。</p><p>所以9:22的画面<b>不是</b>「神迫不及待要毁灭他们」，<br>而是「神<b>担待了他们很久很久</b>」。</p><p>★ 亮光四：9:24的收尾</p><p>「这器皿就是<b>我们</b>被神所召的，不但是从犹太人中，<b>也是从外邦人中</b>。」</p><p>保罗讲完了窑匠与泥土，然后说：</p><p>那个蒙怜悯的器皿，<b>就是你们</b>。</p><p>而且不只犹太人——<b>也有外邦人</b>。</p><p>弟兄姊妹，这就是第九章讲拣选的目的：</p><p>不是为了让我们去猜谁在里面、谁在外面，<br>是为了让外邦信徒知道：<b>你们能在这里，纯粹是怜悯</b>。</p>","exp":"<p>弟兄姊妹，这三节是全章<b>最需要小心读</b>的一段。</p><p>而钥匙在<b>原文的语法不对称</b>上：</p><table><tr><th></th><th>可怒的器皿（9:22）</th><th>蒙怜悯的器皿（9:23）</th></tr><tr><td><b>动词形式</b></td><td><b>κατηρτισμένα</b>（完成被动分词）</td><td><b>προητοίμασεν</b>（主动，不定过去式）</td></tr><tr><td><b>施动者</b></td><td><b>未指明</b></td><td><b>主词明确是神</b></td></tr><tr><td><b>神的态度</b></td><td><b>多多忍耐宽容</b>（μακροθυμία）</td><td>彰显丰盛的荣耀</td></tr></table><p>保罗<b>刻意</b>没有把两边写成对称的。</p><p>而 μακροθυμία（忍耐）正是2:4那个字：</p><p>2:4「你藐视他丰富的恩慈、宽容、<b>忍耐</b>，不晓得他的恩慈是<b>领你悔改</b>呢？」</p><p><b>经文本身明确表达的：</b> 神在忿怒的器皿上多多忍耐；在蒙怜悯的器皿上彰显荣耀；而这蒙召的器皿，包括犹太人与外邦人。</p><p><b>可以合理推论的：</b> 语法的不对称<b>不能被用来证明任何一方的预定论立场</b>，<br>但它确实显示：<b>保罗不愿意把「毁灭」与「荣耀」讲成同一种作为</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 这个语法观察是硬事实（可查证），<br>但它的<b>神学推论</b>，历代解经家有不同理解。<br>宜说明「保罗在这里的措辞是不对称的」，而不宜宣告「所以某某立场才是对的」。</p><p>而24节把整段拉回地面：</p><p>「这器皿<b>就是我们</b>……不但是从犹太人中，<b>也是从外邦人中</b>。」</p><p>弟兄姊妹，讲了半天的器皿——</p><p>保罗说：<b>就是你们</b>。</p><p>【第五段｜9:25–29　旧约的见证】</p>"},{"a":25,"z":29,"star":false,"grk":"<p>25 …καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·<br>27 …ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ὑπόλειμμα σωθήσεται·<br>29 …εἰ μὴ κύριος σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν…</p>","lit":"<p>25「正如祂在何西阿书上说：『我要<b>称那不是我子民的，为我的子民</b>；称那<b>不蒙爱的，为蒙爱的</b>。』」<br>26「『从前在什么地方对他们说「你们不是我的子民」，将来就在那里，他们要被称为<b>永生神的儿子</b>。』」<br>27「而以赛亚指着以色列<b>放声喊着说</b>：『以色列子孙的数目<b>虽如海沙</b>，<b>得救的不过是那剩下的余数</b>；』」<br>28「『因为主要在地上<b>施行祂的话</b>，<b>又快又彻底地成就</b>。』」<br>29「又如以赛亚先前说过：『<b>若不是万军之主给我们留下后裔</b>，我们<b>早已</b>像所多玛、蛾摩拉一样了。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>余数</td><td>ὑπόλειμμα</td><td>hypoleimma</td><td>G5259</td><td><b>剩下的一小部分</b></td></tr><tr><td>余种</td><td>σπέρμα</td><td>sperma</td><td>G4690</td><td><b>种子</b>（赛1:9 LXX）</td></tr></table>","gram":"<p>★ 亮光一：何西阿书的原始对象是谁？</p><p>何西阿书1–2章的「不是我子民」（לֹא עַמִּי, Lo-Ammi），原指<b>北国以色列</b>——</p><p>神说：因为你们的悖逆，你们不再是我的子民。</p><p>然后神说：有一天，我要再称你们为「我的子民」。</p><p>而保罗把这段经文，应用到<b>外邦人</b>身上（9:24「也是从外邦人中」）。</p><p>这是什么样的解经？</p><p>保罗的逻辑是：如果神能把「不是子民」的以色列人重新收为子民，<br>那祂当然也能把从来不是子民的外邦人收为子民。</p><p>神一向就是做这种事的神。</p><p>★ 亮光二：以赛亚书的「余数」（remnant）观念</p><p>这是旧约先知书的一个重大主题：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td>赛1:9</td><td>「若不是万军之耶和华给我们稍留余种」</td></tr><tr><td>赛10:20–22</td><td>「所剩下的，就是雅各家所剩下的，必归回」</td></tr><tr><td>王上19:18</td><td>「我在以色列人中为自己留下七千人」</td></tr><tr><td><b>罗11:5</b></td><td><b>「如今也是这样，照着拣选的恩典，还有所留的余数。」</b></td></tr></table><p>弟兄姊妹，「余数」这个观念有两面：</p><p>一面是<b>审判</b>：只剩下一小部分。<br>另一面是<b>恩典</b>：<b>竟然还有一小部分</b>。</p><p>9:29说得很清楚：「若不是……我们<b>早已</b>像所多玛。」</p>","exp":"<p>弟兄姊妹，9:25–29的功用是：证明保罗讲的不是新道理。</p><p>保罗说：何西阿早就说了。以赛亚早就说了。</p><p>神从一开始就是这样做的。</p><p>【第六段｜9:30–33　结论：他们跌倒了】</p>"},{"a":30,"z":33,"star":true,"grk":"<p>32 διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ' ὡς ἐξ ἔργων· προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,</p>","lit":"<p>30「那么我们要说什么呢？<b>那些本来不追求义的外邦人</b>，<b>得着了义</b>——就是<b>本于信</b>的义；」<br>31「但以色列<b>追求那使人得义的律法</b>，却<b>没有达到那律法</b>。」<br>32「为什么？<b>因为他们不是本于信，乃是像本于行为</b>。他们<b>撞上了那绊脚的石头</b>——」<br>33「正如经上所记：『看哪，我在锡安放一块<b>绊脚的石头</b>、<b>跌人的磐石</b>；而<b>信靠祂的人，必不至于羞愧</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>追求</td><td>διώκοντα</td><td>diōkonta</td><td>G1377</td><td><b>追赶、竭力追求</b>（赛跑的意象）</td></tr><tr><td>跌</td><td>προσέκοψαν</td><td>prosekopsan</td><td>G4350</td><td>πρός + κόπτω：<b>撞上、踢到</b></td></tr><tr><td>绊脚石</td><td>λίθος τοῦ προσκόμματος</td><td>—</td><td>G4348</td><td><b>使人绊倒的石头</b></td></tr><tr><td>羞愧</td><td>καταισχυνθήσεται</td><td>kataischynthēsetai</td><td>G2617</td><td><b>蒙羞</b>（<b>5:5「盼望不至于羞耻」同字</b>）</td></tr></table>","gram":"<p>★★ 亮光一：这是保罗自己给第九章的结论</p><p>弟兄姊妹，这一点极其重要。</p><p>很多人读第九章，读到窑匠（9:21）就停了。</p><p>但保罗自己在9:30–33下了结论——而那个结论是：</p><p>「这是什么缘故呢？</p><p>是因为他们<b>不凭着信心求，只凭着行为求</b>。」</p><p>保罗把整章收在<b>人的责任</b>上。</p><p>他没有说：「因为神没有拣选他们。」<br>他说：「因为他们<b>凭行为求</b>。」</p><p>这与第十章第一节的开头完全连贯：</p><p>10:2–3「他们向神有热心，但不是按着真知识……想要立自己的义，就不服神的义了。」</p><p>★ 亮光二：ὡς ἐξ ἔργων ——「<b>好像</b>是凭行为」</p><p>9:32的原文有一个小字，中文不容易看出来：</p><p>οὐκ ἐκ πίστεως ἀλλ' <b>ὡς</b> ἐξ ἔργων</p><p>「不是出于信，而是<b>好像</b>出于行为。」</p><p>那个 ὡς（好像、仿佛）是什么意思？</p><p>有学者认为：保罗在暗示，他们<b>以为</b>自己可以凭行为求——<br>但事实上，义从来就不是这样得的。</p><p>（这是一个细微的观察，讲台上可以简单带过。）</p><p>★ 亮光三：9:33是两段以赛亚书的合并引用</p><pre>赛28:16  「看哪，我在锡安放一块石头作为根基……\n          信靠的人必不着急。」（正面：房角石）\n赛8:14   「他必作为圣所，却向以色列两家作绊脚的石头、\n          跌人的磐石。」（负面：绊脚石）\n   ↓\n罗9:33   保罗把两段合并：\n          「我在锡安放一块绊脚的石头、跌人的磐石；\n           信靠他的人必不至于羞愧。」</pre><p>弟兄姊妹，这个合并极其精彩：</p><p>同一块石头。</p><p>对信靠的人，是<b>房角石</b>。<br>对不信的人，是<b>绊脚石</b>。</p><p>（彼前2:6–8做了同样的合并引用）</p><p>★ 亮光四：那块石头是谁？</p><p>9:33没有说。但下一章说了：</p><p>10:4「<b>律法的总结就是基督</b>，使凡信他的都得着义。」<br>10:11「经上说：『凡信他的人必不至于羞愧。』」</p><p>弟兄姊妹，第九章最后那块石头——</p><p>是一个<b>位格</b>。</p>","exp":"<p>弟兄姊妹，9:30–33是全章最重要、却最常被跳过的一段。</p><p>保罗讲了三十节的神主权，最后说了什么？</p><p>「他们<b>不凭着信心求，只凭着行为求</b>。」</p><p>而且他描写的画面极其令人心痛：</p><pre>外邦人：本来不追求义  →  却得了义\n以色列：竭力追求义    →  反而得不着</pre><p>为什么？</p><p>因为他们追的方向对，方法错了。</p><p>他们一路狂奔，然后——<b>撞上了一块石头</b>。</p><p>而那块石头，正是神放在锡安的那一位。</p>"}],"10":[{"a":1,"z":1,"star":false,"grk":"<p>Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ δέησις πρὸς τὸν θεὸν ὑπὲρ αὐτῶν εἰς σωτηρίαν.</p>","lit":"<p>「弟兄们，我心里的<b>渴望</b>，和我为他们<b>向神所作的恳求</b>，是要他们得救。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>所愿的</td><td>εὐδοκία</td><td>eudokia</td><td>G2107</td><td>εὖ（好）+ δοκέω（以为）</td><td><b>善意的渴望、心之所好</b></td><td>见下</td></tr><tr><td>所求的</td><td>δέησις</td><td>deēsis</td><td>G1162</td><td>δέομαι（恳求）</td><td><b>恳切的祈求</b>（不是一般的祷告）</td><td>带着急迫</td></tr><tr><td>得救</td><td>σωτηρία</td><td>sōtēria</td><td>G4991</td><td>—</td><td>拯救</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：εὐδοκία ——这个字通常用在神身上</p><p>εὐδοκία 在新约中，多半用来描述<b>神的美意</b>：</p><p>- <b>太11:26</b>「父啊，是的，因为你的<b>美意</b>本是如此」<br>- <b>弗1:5、9</b>「这是照他自己所预定的<b>美意</b>」<br>- <b>腓2:13</b>「你们立志行事，都是神在你们心里运行，为要成就他的<b>美意</b>」</p><p>弟兄姊妹，保罗用这个字形容自己的心：</p><p>「我心里的<b>美意</b>（εὐδοκία），是要他们得救。」</p><p>这暗示：他心里的那个渴望，本身就是神放进去的。</p><p>★ 亮光二：这一节紧接在第九章之后</p><p>弟兄姊妹，这一节的位置太重要了。</p><p>第九章刚刚讲完：</p><p>「不在乎那定意的，也不在乎那奔跑的，只在乎发怜悯的神。」（9:16）</p><p>如果有人读完第九章，得出「所以祷告也没用」的结论——</p><p>保罗在下一节就把那条路堵死了：</p><p>「我<b>向神所求的</b>，是要以色列人得救。」</p><p>弟兄姊妹，保罗显然不觉得「神的主权」与「为人祷告」互相矛盾。</p>","exp":"<p>弟兄姊妹，第九章与第十章之间，只隔了一节。</p><p>而那一节，是<b>一个祷告</b>。</p><p><b>经文本身明确表达的：</b> 保罗心里的渴望与向神的祈求，是要以色列人得救。</p><p><b>可以合理推论的：</b> 这一节是第九章最重要的<b>使用说明</b>。</p><p>保罗刚讲完「不在乎那定意的，也不在乎那奔跑的」（9:16）——<br>然后他做的第一件事，是<b>跪下来为他们祷告</b>。</p><p>而原文的「所愿的」是 εὐδοκία——<b>心里最深的喜悦与渴望</b>。</p><p>这不是责任感，是<b>渴望</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 神的主权<b>从来不是</b>停止祷告与传福音的理由。<br>第十章接下来要说：「没有传道的，怎能听见呢？」（10:14）</p>"},{"a":2,"z":3,"star":true,"grk":"<p>2 μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν ἀλλ' οὐ κατ' ἐπίγνωσιν·<br>3 ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην καὶ τὴν ἰδίαν [δικαιοσύνην] ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν.</p>","lit":"<p>2「因为我为他们作见证：他们有为神的<b>热心</b>，只是不照着<b>完全的认识</b>。」<br>3「因为他们<b>不知道</b>神的义，却<b>竭力想要建立</b>自己的义，就<b>没有降服于</b>神的义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>热心</td><td>ζῆλος</td><td>zēlos</td><td>G2205</td><td>ζέω（沸腾）</td><td><b>火热、热切</b>（英文 zeal）</td><td>见下</td></tr><tr><td>真知识</td><td>ἐπίγνωσις</td><td>epignōsis</td><td>G1922</td><td>ἐπί（加强）+ γνῶσις</td><td><b>完全的、切身的认识</b></td><td><b>3:20同字</b></td></tr><tr><td>立</td><td>στῆσαι</td><td>stēsai</td><td>G2476</td><td>ἵστημι（站立）</td><td><b>使之站立、建立起来</b></td><td>见下</td></tr><tr><td>不服</td><td>οὐχ ὑπετάγησαν</td><td>ouch hypetagēsan</td><td>G5293</td><td>ὑπό + τάσσω（排列）</td><td><b>没有降服、没有排到底下</b></td><td><b>被动式</b>（见下）</td></tr></table>","gram":"<p>★ 亮光一：ζῆλος ——「沸腾」</p><p>这个字的字根是 ζέω——<b>沸腾、滚烫</b>。</p><p>（徒18:25「他心里<b>火热</b>」；罗12:11「要<b>心里火热</b>」——同字根）</p><p>弟兄姊妹，保罗在说：他们<b>是真的火热</b>。</p><p>这不是讽刺。他说「我可以<b>作见证</b>（μαρτυρῶ）」——<br>我为他们作证：他们的热心是真的。</p><p>而保罗有资格说这句话，因为他自己曾经最火热：</p><p>加1:14「为我祖宗的遗传<b>更加热心</b>（ζηλωτής）。」<br>腓3:6「就<b>热心</b>（ζῆλος）说，我是逼迫教会的。」</p><p>★ 亮光二：ἐπίγνωσις ——「完全的认识」</p><p>注意保罗<b>没有</b>说他们「没有知识」。</p><p>他说：不是按着 <b>ἐπίγνωσις</b>——<b>加强版的、完全的、切身的认识</b>。</p><p>而这个字我们在3:20见过：</p><p>3:20「因为律法本是叫人<b>知罪</b>（ἐπίγνωσις ἁμαρτίας）。」</p><p>弟兄姊妹，这里有一个极深的讽刺：</p><p>律法本是要给人 ἐπίγνωσις（切身地知道自己有罪）；<br>而他们拿着律法，却没有得着那个 ἐπίγνωσις。</p><p>★ 亮光三：στῆσαι ——「立起来」</p><p>「想要<b>立</b>自己的义」——ἵστημι，<b>使之站立</b>。</p><p>画面是：</p><p>一个人蹲在地上，用力想把一样东西<b>扶起来、立稳</b>。</p><p>弟兄姊妹，这个动词是<b>费力的</b>。</p><p>建立自己的义，是一件<b>很累</b>的工程。</p><p>★ 亮光四：ὑποτάσσω ——「不服」是被动式</p><p>「就<b>不服</b>神的义了」——οὐχ ὑπετάγησαν，是<b>被动（或关身）语态</b>。</p><p>ὑποτάσσω 是一个<b>军事用语</b>：ὑπό（在下）+ τάσσω（列队、编排）——</p><p>意思是：<b>排到某人的旗下、进入某人的队列</b>。</p><p>弟兄姊妹，所以10:3的意思是：</p><p>他们<b>没有让自己排到神的义底下</b>。</p><p>他们自己另外开了一支队伍。</p><p>★ 亮光五：三个动作的连锁</p><pre>ἀγνοοῦντες（不知道神的义）\n   ↓ 因为不知道，所以\nζητοῦντες στῆσαι（竭力要立自己的义）\n   ↓ 因为忙着立自己的，所以\nοὐχ ὑπετάγησαν（没有降服于神的义）</pre><p>弟兄姊妹，这是一条非常诚实的心理链：</p><p>人不是先决定「我要拒绝神的义」。</p><p>人是先<b>不知道</b>，然后<b>忙着建立自己的</b>，<br>然后就<b>没有空</b>降服了。</p>","exp":"<p>弟兄姊妹，10:2–3是全本圣经对「宗教人」最精准的诊断。</p><p>它说出了一件我们很不愿意承认的事：</p><p>热心，是可以走错方向的。</p><p>而且<b>越热心，走得越远</b>。</p><p>保罗自己就是最好的例子：</p><p>他拿着大祭司的文书往大马色去的那一天，是他一生中最火热的一天。</p><p>而他正在逼迫神的儿子。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.</p>","lit":"<p>「因为基督是律法的 <b>τέλος</b>，使<b>凡相信的人</b>都得着义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>基本字义</th><th>本节语境</th></tr><tr><td>总结</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>终点／目标／完成</b></td><td><b>本节的核心争议</b>（见下）</td></tr></table>","gram":"<p>★ τέλος 的三种主要理解</p><p>τέλος 这个字，在希腊文中同时可以有几个意思：</p><table><tr><th>理解</th><th>中译</th><th>主张</th></tr><tr><td><b>A. 终结（termination）</b></td><td>「律法的<b>终止</b>」</td><td>基督来了，律法作为得义之路就结束了</td></tr><tr><td><b>B. 目标（goal）</b></td><td>「律法的<b>目的地</b>」</td><td>律法一直指向基督；基督是律法的终点站</td></tr><tr><td><b>C. 成全（fulfillment）</b></td><td>「律法的<b>完成</b>」</td><td>基督成全了律法所要求的</td></tr></table><p>τέλος 在新约其他地方的用法：</p><p>- <b>太24:6</b>「末期（τέλος）还没有到」——<b>终结</b><br>- <b>提前1:5</b>「命令的<b>总归</b>（τέλος）就是爱」——<b>目标</b><br>- <b>雅5:11</b>「你们看见主给他的<b>结局</b>（τέλος）」——<b>结果</b><br>- <b>罗6:21–22</b>「那些事的<b>结局</b>（τέλος）就是死……那<b>结局</b>就是永生」——<b>终点</b></p><p>★ 哪一种最符合本节的上下文？</p><p>我认为 <b>B ＋ C（目标与成全）</b> 为主，同时<b>不排除</b> A 的某个面向。</p><p>理由：</p><p>1. <b>上下文</b>：10:5–8保罗立刻引用摩西（利18:5与申30:12–14）——他不是在说「摩西已经过时」，而是在说「摩西所指的，就是这个」。<br>2. <b>3:31</b>：「我们因信废了律法吗？断乎不是！更是<b>坚固</b>律法。」——保罗明确拒绝「律法被废掉」的说法。<br>3. <b>8:4</b>：「使<b>律法的义</b>成就在我们……身上。」——律法的要求被成全了，不是被取消了。<br>4. <b>10:4的下半句</b>：「使凡信他的都得着义」——重点是<b>义的来源</b>，不是「律法作废了」。</p><p>但要平衡的是：</p><p>在「靠行律法得义」这条路上，基督确实是<b>终点</b>——<br>那条路到祂为止（3:20；10:3）。</p><p>讲台诚信提醒：<br>可以说「τέλος 这个字同时有『终点』和『目标』的意思」——这是硬事实。<br>不要说「所有学者都同意是目标，不是终结」。</p><p>★ 一个帮助理解的画面</p><p>一场赛跑的「终点线」（τέλος），同时是两件事：</p><p>它是跑道的<b>尽头</b>（终结）。<br>它也是整场赛跑的<b>目的</b>（目标）。</p><p>基督之于律法，正是如此。</p>","exp":"<p>弟兄姊妹，10:4回答了9:33那块石头是谁。</p><pre>9:33  「我在锡安放一块绊脚的石头……信靠他的人必不至于羞愧。」\n   ↓\n10:4  「律法的总结就是【基督】，使凡信他的都得着义。」</pre><p>那块石头有名字。</p><p>【第二段｜10:5–13　那道离你不远】</p>"},{"a":5,"z":5,"star":false,"grk":"<p>Μωϋσῆς γὰρ γράφει τὴν δικαιοσύνην τὴν ἐκ [τοῦ] νόμου ὅτι ὁ ποιήσας αὐτὰ ἄνθρωπος ζήσεται ἐν αὐτοῖς.</p>","lit":"<p>「因为摩西写到那<b>出于律法的义</b>：『<b>那行这些事的人，就必因这些事活着</b>。』」</p>","key":"<p>这是引用<b>利未记18:5</b>：</p><p>「所以，你们要守我的律例典章；人若遵行，就必因此活着。」</p><p>弟兄姊妹，保罗在这里把两条路摆出来：</p><p>一条是「<b>行</b>」（利18:5）。<br>一条是「<b>信</b>」（申30:12–14，接下来要引的）。</p><p>（关于保罗怎么理解利18:5，学者有不同看法：有人认为保罗是在说「这条路本来就行不通」，有人认为保罗是在描述律法之约的原则。本文不在此展开。）</p>","gram":"","exp":"<p>弟兄姊妹，10:5是保罗摆出的<b>第一条路</b>。</p><p>而他刻意用了两段旧约，摆成对照：</p><table><tr><th></th><th>出处</th><th>关键动词</th></tr><tr><td><b>第一条路（10:5）</b></td><td>利18:5</td><td><b>「行」</b>（ποιήσας）</td></tr><tr><td><b>第二条路（10:6–8）</b></td><td>申30:12–14</td><td><b>「说」与「信」</b></td></tr></table><p><b>经文本身明确表达的：</b> 出于律法的义，其原则是「<b>行了才能活</b>」。</p><p><b>可以合理推论的：</b> 保罗不是在说律法是坏的（7:12「律法是圣洁的」）。<br>他是在说：<b>这条路的条件是「全部做到」</b>——而第三章已经证明没有人做得到。</p><p><b>⚠ 讲台诚信提醒：</b> 保罗究竟如何理解利18:5，敬虔的学者有不同看法。<br>有人认为保罗是在说「这条路本来就行不通」；有人认为他是在描述律法之约的原则。<br>讲台上宜说明两种读法都有人持守，重点放在下一段（10:6–8）那条「离你不远」的路。</p>"},{"a":6,"z":8,"star":true,"grk":"<p>8 ἀλλὰ τί λέγει; ἐγγύς σου τὸ ῥῆμά ἐστιν ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ' ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.</p>","lit":"<p>8「但它说什么呢？『<b>那话离你很近</b>，在你的口中，在你的心里』——这就是我们所传的<b>信的话</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>离你不远</td><td>ἐγγύς σου</td><td>engys sou</td><td>G1451</td><td><b>近你、在你旁边</b></td></tr><tr><td>道</td><td>ῥῆμα</td><td>rhēma</td><td>G4487</td><td><b>被说出来的话</b>（不是 λόγος）</td></tr><tr><td>阴间</td><td>ἄβυσσος</td><td>abyssos</td><td>G12</td><td><b>无底的深渊</b></td></tr></table>","gram":"<p>★ 亮光一：保罗怎么使用申命记30章</p><p>申命记30:11–14的原文讲的是<b>诫命</b>：</p><p>「不是在天上，使你说：『谁替我们<b>上天</b>取下来？』……<br>也不是在海外，使你说：『谁替我们<b>过海</b>取了来？』……<br>这话却<b>离你甚近</b>，就在你<b>口中</b>，在你<b>心里</b>。」</p><p>而保罗做了三件事：</p><table><tr><th>保罗的处理</th><th>内容</th></tr><tr><td><b>把「过海」改成「下到阴间」</b></td><td>因为他要指向<b>基督的复活</b></td></tr><tr><td><b>加上两个注解</b></td><td>「就是要领下基督来」「就是要领基督从死里上来」</td></tr><tr><td><b>把「这话」解释为福音</b></td><td>「就是我们所传信主的道」</td></tr></table><p>保罗这样做合法吗？（见第二十部分的完整讨论）</p><p>这里先给三个关键的观察：</p><p>① 申命记30章的上下文本身就是新约的应许：</p><p>申30:6「耶和华你神必将你心里……的污秽<b>除掉</b>（行割礼），好叫你尽心尽性爱耶和华你的神。」</p><p>那一段本来就在讲：<b>神要亲自动工，使人能够遵行</b>。</p><p>② 申命记30章的重点是「不必上天下海」：</p><p>原文的重点不是「律法的内容」，而是「<b>神已经把话送到你面前了</b>」。</p><p>保罗抓住的正是这个重点。</p><p>③ 保罗在10:6用了「你不要心里说」——这句话出自申9:4：</p><p>申9:4「你不可心里说：『耶和华将我领进来得这地，是因我的义。』」</p><p>弟兄姊妹，这个细节很精彩：</p><p>保罗把申9:4（不要以为是因你的义）与申30:12–14（那话离你甚近）合在一起用——<br>正好对准10:3「想要立自己的义」。</p><p>★ 亮光二：升天与下阴间的画面</p><pre>「谁要升到天上去呢？」 —— 我要爬上去把祂拉下来？\n「谁要下到阴间去呢？」 —— 我要挖下去把祂拉上来？</pre><p>弟兄姊妹，保罗在说：这两件事，<b>都已经做完了</b>。</p><p>道成肉身——<b>祂已经下来了</b>。<br>从死里复活——<b>祂已经上来了</b>。</p><p>你不需要去做任何一件。</p><p>★ 亮光三：ῥῆμα 而不是 λόγος</p><p>保罗用的是 <b>ῥῆμα</b>——「<b>被说出来的话</b>」。</p><p>这与10:14「未曾<b>听见</b>他，怎能信他呢」、10:17「信道是从<b>听道</b>来的」完全连贯。</p><p>福音是<b>要被说出来、被听见</b>的话。</p>","exp":"<p>弟兄姊妹，10:6–8是全章最温暖的一段。</p><p>保罗在说：</p><p>人的宗教本能，总是觉得要<b>做什么大事</b>才能亲近神。</p><p>上天。下阴间。爬阶梯。走苦路。</p><p>而福音说：</p><p>那话——<b>已经在你嘴边了</b>。</p>"},{"a":9,"z":10,"star":true,"grk":"<p>9 ὅτι ἐὰν ὁμολογήσῃς ἐν τῷ στόματί σου κύριον Ἰησοῦν καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·<br>10 καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν.</p>","lit":"<p>9「因为你若<b>用你的口承认</b>『<b>耶稣是主</b>』，并且<b>在你心里相信</b>神叫祂从死人中复活，<b>你就必得救</b>。」<br>10「因为人<b>心里相信</b>，以致于<b>得义</b>；<b>口里承认</b>，以致于<b>得救</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>承认</td><td>ὁμολογέω</td><td>homologeō</td><td>G3670</td><td>ὁμός（同）+ λόγος（话）</td><td><b>说同样的话、公开认同</b></td><td>见下</td></tr><tr><td>主</td><td>κύριος</td><td>kyrios</td><td>G2962</td><td>—</td><td>主人、主宰</td><td><b>见下——极重要</b></td></tr><tr><td>复活</td><td>ἤγειρεν</td><td>ēgeiren</td><td>G1453</td><td>ἐγείρω</td><td><b>叫起来</b>（神是主词）</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ὁμολογέω ——「说同样的话」</p><p>这个字由 ὁμός（相同）+ λέγω（说）组成，字面是：</p><p>「<b>说同样的话</b>」——与某人的说法一致、公开站在同一边。</p><p>弟兄姊妹，所以「承认耶稣为主」不是一个宗教口号，<br>是<b>公开表态站在祂那一边</b>。</p><p>★★ 亮光二：κύριος 的重量（本节最深的一点）</p><p>「口里认<b>耶稣为主</b>（κύριον Ἰησοῦν）」。</p><p>这句话有两层重量：</p><p>① 政治的重量</p><p>当时帝国的效忠口号是 <b>Κύριος Καῖσαρ</b>（凯撒是主）。</p><p>在罗马城说「耶稣是主」，等于说：<b>还有另一位主，而祂比凯撒大</b>。</p><p>② 神学的重量（更深）</p><p>请看10:13保罗引的是什么：</p><p>「凡求告<b>主名</b>的，就必得救。」（引珥2:32）</p><p>而约珥书2:32的「主」，希伯来原文是——</p><p>יְהוָה（YHWH）——<b>耶和华</b>。</p><p>弟兄姊妹，这是全章最震撼的一件事：</p><p>约珥书说：凡求告<b>耶和华</b>名的，就必得救。</p><p>保罗说：凡求告<b>主</b>名的，就必得救——而上下文的「主」是<b>耶稣</b>（10:9）。</p><p>保罗毫不犹豫地把旧约中专属耶和华的经文，用在耶稣身上。</p><p>★ 亮光三：10:9与10:10的顺序不同</p><p>弟兄姊妹，注意这两节的顺序：</p><pre>10:9   口里承认 → 心里相信\n10:10  心里相信 → 口里承认</pre><p>为什么？</p><p>两种主要解释：</p><table><tr><th>解释</th><th>说明</th></tr><tr><td><b>交叉结构（chiasm）</b></td><td>10:9的顺序是照着10:8「在你<b>口里</b>，在你<b>心里</b>」；10:10则按<b>逻辑</b>顺序（先信后认）</td></tr><tr><td><b>强调两者不可分</b></td><td>保罗刻意打乱顺序，表示这不是「两个步骤」</td></tr></table><p>我认为第一种解释最贴合：10:9是<b>照着所引经文的顺序</b>（申30:14「在你口中，在你心里」），<br>10:10则是<b>照着实际的逻辑</b>。</p><p>★ 亮光四：两个被动式（10:10）</p><p>「人心里<b>相信</b>（πιστεύεται）……口里<b>承认</b>（ὁμολογεῖται）」——</p><p>两个动词在原文都是<b>被动或非人称形式</b>。</p><p>保罗没有说「你要信、你要认」（那会像两个条件），<br>他用的是一种<b>描述性</b>的表达：「用心，是信到义里去；用口，是认到得救里去。」</p>","exp":"<p>弟兄姊妹，10:9–10常被误读成「得救的两个步骤」：</p><p>「第一步：口里承认。第二步：心里相信。做完就得救。」</p><p>这种读法有两个问题：</p><p>① 它把福音变成一个公式</p><p><b>② 它与保罗全书的教导不一致</b>（3:28「人称义是因着信」——只提信）</p><p>正确的理解是：</p><p>10:9–10讲的是<b>一件事的里外两面</b>。</p><p>心里相信 —— 是那件事的<b>根</b>。<br>口里承认 —— 是那件事的<b>果</b>。</p><p>一个真的在心里相信的人，不可能永远不承认；<br>一个只在口里承认、心里没有的人，那不是信。</p><p>（主耶稣说：「凡在人面前认我的，我在我天上的父面前也必认他。」太10:32）</p>"},{"a":11,"z":13,"star":true,"grk":"<p>12 οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·</p>","lit":"<p>11「因为经上说：『<b>凡信靠祂的，必不至于羞愧</b>。』」<br>12「因为<b>犹太人和希腊人并没有分别</b>——<b>因为众人同有一位主</b>，祂<b>对一切求告祂的人是丰富的</b>。」<br>13「因为『<b>凡求告主名的，就必得救</b>』。」</p><p>【第三段｜10:14–17　宣教的链条】</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>分别</td><td>διαστολή</td><td>diastolē</td><td>G1293</td><td><b>区分、划界线</b>（<b>3:22同字！</b>）</td></tr><tr><td>厚待</td><td>πλουτῶν</td><td>ploutōn</td><td>G4147</td><td>πλοῦτος（财富）：<b>对……富足、慷慨</b></td></tr><tr><td>求告</td><td>ἐπικαλουμένους</td><td>epikaloumenous</td><td>G1941</td><td><b>呼求某人的名</b></td></tr></table>","gram":"<p>★ 亮光一：保罗加了一个字</p><p>10:11引以赛亚书28:16。</p><p>而七十士译本的赛28:16是：</p><p>「信靠的人必不着急。」</p><p>保罗引用时，在前面加了一个字：</p><p>「<b>凡</b>（πᾶς）信他的人必不至于羞愧。」</p><p>弟兄姊妹，保罗在引用圣经的时候，加了一个字。</p><p>而那个字是——「<b>凡</b>」。</p><p>★ 亮光二：διαστολή ——3:22那个字</p><pre>3:22   「并没有分别（διαστολή）」—— 因为【众人都犯了罪】（3:23）\n10:12  「并没有分别（διαστολή）」—— 因为【众人同有一位主】</pre><p>弟兄姊妹，这是全卷书最美的一组对称：</p><p>在<b>罪</b>面前，没有分别。<br>在<b>恩典</b>面前，也没有分别。</p><p>★★ 亮光三：10:13的旧约来源（全章最深的基督论）</p><p>「凡求告<b>主名</b>的，就必得救」——引自<b>约珥书2:32</b>。</p><p>而约珥书的「主」，希伯来原文是 <b>יְהוָה（YHWH，耶和华）</b>。</p><p>保罗在什么上下文引用它？</p><p>10:9「你若口里认<b>耶稣</b>为<b>主</b>。」<br>10:12「众人同有<b>一位主</b>。」<br>10:13「凡求告<b>主名</b>的，就必得救。」</p><p>弟兄姊妹，保罗把约珥书中专属<b>耶和华</b>的应许，<br>直接用在<b>耶稣</b>身上。</p><p>这是新约中最高的基督论宣告之一——<br>而且保罗写得如此自然，好像那是理所当然的事。</p><p>（彼得在五旬节也引用同一段约珥书：徒2:21）</p><p>★ 亮光四：三个「凡」</p><pre>10:11  凡（πᾶς）信他的\n10:12  一切（πάντας）求告他的\n10:13  凡（πᾶς）求告主名的</pre><p>保罗在三节之内，连敲三次「凡」。</p>","exp":"<p>弟兄姊妹，10:13是全本圣经最简单、也最宽的一句应许之一：</p><p>「<b>凡</b>求告主名的，就必得救。」</p><p>注意它有多宽：</p><p>- 没有说「凡好人」<br>- 没有说「凡懂神学的」<br>- 没有说「凡有宗教背景的」<br>- <b>只说：</b>凡求告的<b>。</b></p><p>而「求告」（ἐπικαλέω）的意思很简单：</p><p>喊祂的名字。</p>"},{"a":14,"z":15,"star":true,"grk":"<p>14 Πῶς οὖν ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ἀκούσωσιν χωρὶς κηρύσσοντος;<br>15 πῶς δὲ κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; καθὼς γέγραπται· ὡς ὡραῖοι οἱ πόδες τῶν εὐαγγελιζομένων [τὰ] ἀγαθά.</p>","lit":"<p>14「那么，他们<b>未曾相信</b>的，<b>怎能</b>求告呢？<b>未曾听见</b>的，<b>怎能</b>相信呢？<b>没有传讲的</b>，<b>怎能</b>听见呢？」<br>15「<b>若没有被差遣</b>，<b>怎能</b>传讲呢？正如经上所记：『传福音之人的<b>脚踪何等佳美</b>！』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>怎能</td><td>πῶς</td><td>pōs</td><td>G4459</td><td><b>怎么可能</b>（四次！）</td></tr><tr><td>传道</td><td>κηρύσσω</td><td>kēryssō</td><td>G2784</td><td><b>像传令官一样宣告</b></td></tr><tr><td>奉差遣</td><td>ἀποσταλῶσιν</td><td>apostalōsin</td><td>G649</td><td>ἀποστέλλω（<b>使徒 ἀπόστολος 的字根</b>）：<b>被差派出去</b></td></tr><tr><td>佳美</td><td>ὡραῖος</td><td>hōraios</td><td>G5611</td><td>ὥρα（时候）：<b>当令的、及时而美的</b></td></tr></table>","gram":"<p>★ 亮光一：四个「怎能」的倒推链</p><pre>求告 ← 相信 ← 听见 ← 传讲 ← 差遣\nπῶς    πῶς     πῶς     πῶς</pre><p>保罗从结果一路倒推回原因，最后停在——</p><p>「若没有<b>奉差遣</b>，怎能传道呢？」</p><p>弟兄姊妹，这条链子的最底层是：<b>有人要被差出去</b>。</p><p>★ 亮光二：ἀποστέλλω ——「使徒」的动词</p><p>「奉差遣」的动词 ἀποστέλλω，正是「使徒」（ἀπόστολος）的字根。</p><p>意思是：<b>被差派出去、带着任务的人</b>。</p><p>而这个动词是<b>被动式</b>：</p><p>不是「你自己决定去」，是「<b>你被差出去</b>」。</p><p>★ 亮光三：ὡραῖος ——「当令的美」</p><p>「脚踪何等<b>佳美</b>」——ὡραῖος 的字根是 ὥρα（时候、季节）。</p><p>它原本的意思是「<b>当季的、成熟的、正是时候的</b>」。</p><p>弟兄姊妹，这个字的画面是：</p><p>一颗水果在<b>最对的季节</b>成熟了。</p><p>而以赛亚书52:7的上下文是什么？</p><p>是被掳的以色列，等待归回的好消息。</p><p>赛52:7「那报佳音，传平安，报好信，传救恩的，对锡安说：<b>你的神作王了</b>！<br>这人的脚登山何等佳美！」</p><p>弟兄姊妹，那个画面是：</p><p>一个被围困的城，城墙上的人望着远方的山。</p><p>然后——山那头出现了一个奔跑的人。</p><p>他还没说话，他们就已经看见<b>他的脚</b>了。</p><p>★ 亮光四：脚为什么美？</p><p>弟兄姊妹，脚是人身上<b>最不美</b>的部位之一。</p><p>走远路的脚，是脏的、是磨破的、是满是尘土的。</p><p>但在城墙上等待的人眼中——</p><p>那双脚，是全世界最美的。</p><p>因为那双脚，带来了消息。</p>","exp":"<p>弟兄姊妹，10:14–15是全本圣经最重要的宣教经文之一。</p><p>而它的逻辑是<b>从第九章直接推出来的</b>：</p><pre>第九章：神主权的拣选\n   ↓\n第十章1节：所以我为他们祷告\n   ↓\n第十章13节：凡求告主名的，就必得救\n   ↓\n第十章14节：然而，未曾听见的，怎能信呢？\n   ↓\n所以——【要有人去】</pre><p>弟兄姊妹，保罗显然不觉得「神的主权」与「宣教的迫切」互相矛盾。</p><p>对他来说，前者正是后者的<b>根据</b>。</p>"},{"a":16,"z":17,"star":false,"grk":"<p>17 ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος Χριστοῦ.</p>","lit":"<p>16「只是<b>他们并非都听从了</b>那福音。因为以赛亚说：『主啊，<b>我们所传的，有谁信呢</b>？』」<br>17「<b>所以</b>，信是<b>从听而来</b>；而听，是<b>借着基督的话</b>。」</p><p>【第四段｜10:18–21　他们听见了吗？】</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>听从</td><td>ὑπήκουσαν</td><td>hypēkousan</td><td>G5219</td><td><b>在底下听</b>（<b>5:19、6:16同字根！</b>）</td></tr><tr><td>听道</td><td>ἀκοή</td><td>akoē</td><td>G189</td><td><b>听见的内容／所传的信息</b></td></tr><tr><td>基督的话</td><td>ῥήματος Χριστοῦ</td><td>—</td><td>G4487</td><td><b>基督的话</b>（见下）</td></tr></table>","gram":"<p>★ 亮光一：ὑπακούω ——又是「在底下听」</p><p>「人没有都<b>听从</b>福音」——ὑπακούω。</p><p>这个字我们追踪过：</p><pre>5:19  「因一人的顺从（ὑπακοή）」—— 基督在底下听\n6:16  「作顺命（ὑπακοή）的奴仆」\n10:16 「人没有都听从（ὑπακούω）福音」</pre><p>弟兄姊妹，保罗用「听从」而不是「相信」——</p><p>因为信心的本质，就是<b>在底下听</b>。</p><p>★ 亮光二：10:16引以赛亚书53:1</p><p>「主啊，我们所传的有谁信呢？」</p><p>这是<b>受苦仆人之歌</b>的开头。</p><p>弟兄姊妹，以赛亚书53章的第一句话，就是一声<b>叹息</b>：</p><p>「有谁信呢？」</p><p>保罗在说：先知早就知道，不是所有人都会信。</p><p>★ 亮光三：「基督的话」的两种理解</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>关于基督的话</b></td><td>受词所有格：所传的信息是关于基督的</td></tr><tr><td><b>基督所说的话</b></td><td>主词所有格：是基督亲自在传道人的话语中说话</td></tr></table><p>两种都有支持者，而且都合乎保罗的神学。</p><p>第二种特别美：当传道人开口，是<b>基督在说话</b>。<br>（比较林后5:20「神藉我们劝你们」）</p>","exp":"<p>10:17是全本圣经对「信心从哪里来」最简洁的回答：</p><pre>信心 ← 听见 ← 基督的话</pre><p>弟兄姊妹，这一节同时说了两件事：</p><p>① 信心不是自己生出来的——它从<b>听</b>来。<br>② 所以<b>必须有人说</b>。</p>"},{"a":18,"z":20,"star":false,"grk":"<p>18 …εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.<br>19 …ἐγὼ παραζηλώσω ὑμᾶς ἐπ' οὐκ ἔθνει, ἐπ' ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.<br>20 …εὑρέθην [ἐν] τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.</p>","lit"
