 the word from chapter 5</b></p><p>τύπος literally means <b>the mark left by a blow</b>, and from there <b>a mould</b>.</p><p>In 5:14 Paul says Adam “is a <b>type</b> (τύπος) of the one who was to come.”</p><p>The same word, two uses:<br>5:14 — Adam is a mould <b>pointing to Christ</b>.<br>6:17 — the gospel teaching is a mould <b>that shapes you</b>.</p><p>The picture is beautiful: <b>molten metal is poured into a mould, and when it cools, it has taken the shape of the mould.</b><br>Paul says: <b>you have been poured in.</b></p><p><b>★ Third light: ek kardias (from the heart)</b></p><p>This is the fulfilment of 2:29, “true circumcision is of the heart.”<br>Not outward ritual, but obedience from within.</p><p><b>★ Fourth light: the tension of two passives in 6:18</b></p><pre>ἐλευθερωθέντες  —  set free (free at last!)\nἐδουλώθητε      —  enslaved (a slave again?)</pre><p>Paul deliberately puts “freedom” and “slavery” in the same sentence.</p><p>This is the most counter-intuitive — and the truest — line in the chapter:</p><p><b>Freedom is not having no master. Freedom is having the right one.</b></p><p>(Paul himself acknowledges the limits of this metaphor in 6:19 — see the next verse.)</p>","exp":"<p>There is a phrase in 6:17 that is easily passed over: <b>“thanks be to God!”</b></p><p>In the middle of a long, serious piece of teaching, Paul suddenly breaks into worship. Why?</p><p>Because as he writes “though you were slaves of sin, you obeyed from the heart,” he remembers that <b>they did not do this themselves at all</b>.</p><p><b>How could a slave change his own master?</b></p><p>So Paul stops, and says three words: <b>thanks be to God</b>.</p>"},{"a":19,"z":19,"star":false,"grk":"<p>ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν. ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.</p>","lit":"<p>“<b>I am speaking in human terms</b>, because of the weakness of your flesh. For just as you presented your members as slaves to uncleanness and to lawlessness, leading to <b>more lawlessness</b>, so now present your members as slaves to righteousness, leading to <b>sanctification</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>I speak in human terms</td><td>ἀνθρώπινον λέγω</td><td>anthrōpinon legō</td><td>G442</td><td><b>I am putting this the way people do</b> — Paul qualifying himself</td></tr><tr><td>lawlessness</td><td>ἀνομία</td><td>anomia</td><td>G458</td><td>ἀ + νόμος: <b>lawlessness</b></td></tr><tr><td>sanctification</td><td>ἁγιασμός</td><td>hagiasmos</td><td>G38</td><td>ἅγιος (holy): <b>the process of being set apart to God</b></td></tr></table>","gram":"<p><b>★ First light: anthrōpinon legō — Paul apologises for his own metaphor</b></p><p>Paul does something rare here: he adds a footnote to the image he has just used.</p><p>“I speak in human terms because of the weakness of your flesh.”</p><p>Why? Because the metaphor of <b>slavery</b> is only half right.</p><p><b>Where it is right:</b> belonging is absolute; you can only have one master.<br><b>Where it is not right:</b> <b>God does not regard us as slaves.</b></p><p>The proof comes two chapters later:</p><p><b>Romans 8:15, “you did not receive a spirit of slavery, falling back into fear; you received the Spirit of adoption, by whom we cry, ‘Abba! Father!’”</b></p><p>Paul uses “slave” to teach <b>the absoluteness of belonging</b>; then in chapter 8 he upgrades immediately to “son,” to teach <b>the intimacy of relationship</b>. <b>The two chapters must be read together.</b></p><p><b>★ Second light: the direction of the two “leading to” clauses</b></p><pre>presented to uncleanness and lawlessness  →  εἰς τὴν ἀνομίαν (leading to MORE lawlessness)\npresented to righteousness               →  εἰς ἁγιασμόν    (leading to sanctification)</pre><p>Paul points out a feature of sin: <b>it snowballs</b>. Lawlessness produces more lawlessness.</p><p>And righteousness has its own momentum too: presenting leads to sanctification.<br><b>Both roads accelerate.</b></p><p><b>★ Third light: hagiasmos is a process</b></p><p>A noun ending in -μός usually denotes <b>a process</b> rather than a state.</p><p><b>Sanctification is not a plateau you arrive at one day. It is a road you walk every day.</b></p>","exp":"<p>6:19 <b>repeats</b> the command of 6:13 — but adds one word: <b>“so now, in the same way…”</b></p><p>Paul is saying: <b>you are already very good at this.</b></p><p>You used to hand your members over every single day — to uncleanness, to lawlessness. You did it skilfully, naturally, without needing any reminder.</p><p><b>Now — with the same fluency — hand them to righteousness.</b></p>"},{"a":20,"z":22,"star":false,"grk":"<p>21 τίνα οὖν καρπὸν εἴχετε τότε; ἐφ' οἷς νῦν ἐπαισχύνεσθε, τὸ γὰρ τέλος ἐκείνων θάνατος.</p>","lit":"<p>20 “For when you were slaves of sin, you were <b>free with regard to righteousness</b>.”</p><p>21 “What <b>fruit</b> did you have at that time? — the things of which you are <b>now ashamed</b>; for <b>the end of those things is death</b>.”</p><p>22 “But now, having been <b>set free from sin</b> and having become <b>slaves of God</b>, you have your fruit unto <b>sanctification</b>, and <b>the end is eternal life</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>fruit</td><td>καρπός</td><td>karpos</td><td>G2590</td><td>fruit, harvest</td></tr><tr><td>ashamed</td><td>ἐπαισχύνεσθε</td><td>epaischynesthe</td><td>G1870</td><td><b>to be ashamed of</b> (the very word of 1:16!)</td></tr><tr><td>end</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>the end point, the final outcome</b></td></tr></table>","gram":"<p><b>★ First light: epaischynomai takes us back to 1:16</b></p><p>“The things of which you are now <b>ashamed</b>” — ἐπαισχύνεσθε.</p><p>This is the very word of 1:16: <b>“I am not ashamed (οὐ ἐπαισχύνομαι) of the gospel.”</b></p><p>At the opening of Romans Paul says: <b>the gospel does not shame me.</b><br>In chapter 6 he says: <b>the fruit of sin — that is the thing that shames you.</b></p><p>One you never need be ashamed of; the other makes you flush when you look back.</p><p><b>★ Second light: the weight of telos</b></p><p>The word means more than “ending.” It is <b>the point the road finally arrives at</b>.</p><p>Paul is asking a very practical question: <b>where does that road come out?</b></p><p>This is one of the most powerful ways to face temptation. <b>Temptation never lets you see the telos. It only lets you see the next step.</b></p><p><b>★ Third light: the sharp question of 6:21</b></p><p>“What fruit did you have at that time?”</p><p>Paul is asking: <b>what did those things finally give you?</b></p><p>Only an honest person will answer that. Those years, those nights, those choices — <b>where is the harvest?</b></p>","exp":"<p>Notice the subtle change of wording in 6:22:</p><pre>6:18  you became slaves of “righteousness”\n6:22  you became slaves of “God”</pre><p>From an abstract principle to <b>a person</b>.</p><p>As Paul draws to a close he moves the focus from a standard back to a Master.</p><p><b>Sanctification is not conformity to a code. It is belonging to a Lord.</b></p>"},{"a":23,"z":23,"star":true,"grk":"<p>τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.</p>","lit":"<p>“For the <b>wages</b> of sin is death; but <b>the free gift</b> of God is eternal life — <b>in Christ Jesus our Lord</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>wages</td><td>ὀψώνια</td><td>opsōnia</td><td>G3800</td><td>ὄψον (rations) + ὠνέομαι (to buy)</td><td><b>a soldier’s rations and pay</b></td><td><b>plural</b></td></tr><tr><td>free gift</td><td>χάρισμα</td><td>charisma</td><td>G5486</td><td>χάρις (grace) + -μα</td><td><b>the concrete product of grace</b></td><td><b>singular</b></td></tr><tr><td>eternal life</td><td>ζωὴ αἰώνιος</td><td>zōē aiōnios</td><td>G2222 / G166</td><td>—</td><td>life everlasting</td><td>—</td></tr></table>","gram":"<p><b>★ First light: opsōnia means a soldier’s pay</b></p><p>The word originally denoted <b>a soldier’s rations and regular wage</b>. Other New Testament uses:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Luke 3:14</b></td><td>John the Baptist to the soldiers: “be content with your <b>wages</b>.”</td></tr><tr><td><b>1 Corinthians 9:7</b></td><td>“Who serves as a soldier <b>at his own expense</b>?”</td></tr><tr><td><b>2 Corinthians 11:8</b></td><td>“I took <b>wages</b> from them to serve you.”</td></tr></table><p>Two features matter:<br>1. <b>It is paid at regular intervals</b> — not settled all at once<br>2. <b>It is earned, it is owed</b> — you serve, you are paid</p><p>Paul is saying: <b>sin is an employer who pays punctually.</b><br>It never shortchanges you. It is never late. <b>Every single time, right on schedule, it pays you exactly what you have earned.</b><br>And the thing it pays is called death.</p><p><b>★ Second light: the startling contrast of plural and singular</b></p><pre>ὀψώνια (wages)     —  PLURAL!   sin pays in instalments, again and again\nχάρισμα (free gift) —  SINGULAR! God gives once, one whole gift</pre><p>This distinction is easy to miss, and it is enormously important:</p><p><b>Sin pays by instalment</b> — a little emptiness today, a little numbness tomorrow, a little loss the day after. <b>You never receive death as one large parcel. You draw it in small amounts.</b></p><p><b>God’s gift is given whole</b> — not in instalments, not on trial. All of it, at once.</p><p><b>★ Third light: a deliberately asymmetrical couplet</b></p><p>By the logic of symmetry, Paul should have written:<br>“The wages of sin is death; <b>the wages of righteousness</b> is eternal life.”</p><p>He did not. He wrote:<br>“The wages of sin is death; <b>the free gift</b> of God is eternal life.”</p><p>One side is <b>earned</b>; the other is <b>given</b>.</p><p><b>That asymmetry is the whole chapter — and the whole letter — in miniature: death is what you earn; life is what he gives.</b></p><p><b>★ Fourth light: charisma — the word from chapter 5</b></p><p>This word has already appeared in 5:15 and 5:16. It is χάρις (grace) plus the -μα ending, denoting <b>the concrete thing grace produces</b>.</p><p><b>Grace is not an atmosphere. Grace produces something. And what it produces is called eternal life.</b></p><p><b>★ Fifth light: the last five words</b></p><p>ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν — <b>“in Christ Jesus our Lord.”</b></p><p>At the very end of the chapter, Paul writes the address.</p><p><b>Where is this gift collected? Inside a person.</b></p>","exp":"<p>6:23 is one of the most quoted gospel verses in the Bible. But it is usually lifted out on its own, and loses the shape of the chapter.</p><p>Read back inside chapter 6, it means:</p><pre>your former employer, sin, has been paying you punctually every day\n  ↓\nhave you ever added up what you have drawn over the years?\n  ↓\nwhat it pays is death — a little at a time, a little at a time\n  ↓\nbut God is not an employer; God gives gifts\n  ↓\nhe does not pay by instalment; he gives the whole thing at once\n  ↓\nand the name of that gift is eternal life</pre><p>This is why Paul can answer the question of 6:1 without hesitation.</p><p>“Shall we continue in sin?”</p><p>Paul’s final answer is not “you may not.” It is —</p><p><b>“Why would you go back to draw those wages? You already have the gift.”</b></p>"}],"12":[{"a":1,"z":1,"star":true,"grk":"<p>Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν εὐάρεστον τῷ θεῷ, τὴν λογικὴν λατρείαν ὑμῶν·</p>","lit":"<p>“<b>Therefore</b>, brothers, <b>by the many mercies of God</b> I <b>urge</b> you: <b>present your bodies</b> as <b>a living sacrifice</b>, holy, well-pleasing to God — this is your <b>reasonable / spiritual worship</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>therefore</td><td>οὖν</td><td>oun</td><td>G3767</td><td>—</td><td><b>therefore</b></td><td><b>the hinge of the whole letter</b></td></tr><tr><td>I urge</td><td>Παρακαλῶ</td><td>parakalō</td><td>G3870</td><td>παρά + καλέω</td><td><b>to call alongside, to plead, to encourage</b></td><td>not a command — a plea</td></tr><tr><td>mercies</td><td>οἰκτιρμοί</td><td>oiktirmoi</td><td>G3628</td><td>οἰκτίρω (to pity)</td><td><b>deep compassion</b> (<b>plural!</b>)</td><td>see below</td></tr><tr><td>present</td><td>παραστῆσαι</td><td>parastēsai</td><td>G3936</td><td>παρά + ἵστημι</td><td><b>to lead up to the altar and offer</b></td><td><b>the word of 6:13</b></td></tr><tr><td>bodies</td><td>σώματα</td><td>sōmata</td><td>G4983</td><td>—</td><td>bodies</td><td><b>not “hearts”</b></td></tr><tr><td>living sacrifice</td><td>θυσίαν ζῶσαν</td><td>thysian zōsan</td><td>G2378</td><td>—</td><td><b>a sacrifice that is alive</b></td><td>see below</td></tr><tr><td>well-pleasing</td><td>εὐάρεστος</td><td>euarestos</td><td>G2101</td><td>εὖ + ἀρέσκω</td><td>acceptable</td><td>LXX sacrificial language</td></tr><tr><td>reasonable</td><td>λογικός</td><td>logikos</td><td>G3050</td><td>λόγος</td><td><b>rational / spiritual</b></td><td>only twice in the NT</td></tr><tr><td>service</td><td>λατρεία</td><td>latreia</td><td>G2999</td><td>—</td><td><b>the service of worship</b></td><td>same word as 9:4</td></tr></table>","gram":"<p><b>★ First light: oun — the hinge of the whole letter</b></p><p>That one word, “therefore,” is the watershed of Romans.</p><pre>chs. 1–11:   what God has done (doctrine)\n  ↓ [THEREFORE]\nchs. 12–16:  so this is how you are to live (practice)</pre><p>Paul’s order is always the same: <b>first what God has done, then what you are to do</b>.<br>He spent eleven chapters on <b>who you are</b> before he began on <b>what you should do</b>.</p><p><b>★ Second light: Parakalō — “I urge,” not “I command”</b></p><p>Paul does <b>not</b> use the imperative: “you must present.” He uses παρακαλέω — <b>to call alongside, to plead</b>.<br>(The related noun παράκλητος is the title of the Spirit in John — <b>the Counsellor, the one called alongside</b>.)</p><p>Paul is an apostle; he has the authority to command. But when it comes to this — the giving of oneself — he chooses <b>to plead</b>.</p><p><b>★ Third light: oiktirmoi — “mercies,” plural</b></p><p>“By the mercies of God” — οἰκτιρμῶν is <b>plural</b>.</p><p>In the Septuagint this word renders the Hebrew <b>rachamim</b>, whose root is <b>rechem, the womb</b> — <b>a mother’s compassion, felt in the body</b>.</p><p>And what does the plural mean? Not one act of mercy, but <b>one mercy after another after another</b>.</p><p>Which mercies does Paul mean? <b>Every single thing in the previous eleven chapters</b>: justification, reconciliation, the indwelling Spirit, no condemnation, no separation, mercy upon all…</p><p><b>This is the engine of consecration: not guilt, but mercy.</b></p><p><b>★ Fourth light: paristēmi — the word from chapter 6</b></p><pre>6:13   “PRESENT (παραστήσατε) your members to God as instruments of righteousness”\n  ↓\n12:1   “PRESENT (παραστῆσαι) your bodies”</pre><p>This is one of the loveliest echoes in the letter: <b>the seed Paul planted in chapter 6 flowers in chapter 12</b>.</p><p><b>★ Fifth light: “bodies,” not “hearts”</b></p><p>Paul says <b>τὰ σώματα</b> — bodies, plural.</p><p>Not “give your heart to God.” <b>“Present your bodies.”</b></p><p>Why? <b>Because a body is concrete.</b> A body has an address, a diary, a wallet, a phone, and a pair of feet.</p><p>“Giving your heart to God” can be a feeling. <b>“Presenting your body” is where you actually are tomorrow morning.</b></p><p><b>★★ Sixth light: thysia zōsa — an oxymoron</b></p><p><b>“A living sacrifice”</b> — in the first century this was a startling phrase, because every sacrifice was <b>by definition dead</b>.</p><p>And what is the trouble with a living sacrifice?<br><b>It can climb down off the altar.</b></p><p>(Which is exactly why the command in the next verse is in the <b>present tense</b> — it is continuous.)</p><p><b>★ Seventh light: logikē latreia</b></p><p>Two main readings:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>Reasonable</b></td><td>in the face of mercies that great, this is <b>the only rational response</b></td></tr><tr><td><b>Spiritual worship</b></td><td>not outward ritual, but <b>the worship of the whole person</b></td></tr></table><p>And λατρεία, in 9:4, refers to <b>the temple service of Israel</b>.</p><p>Paul is saying: <b>your ordinary daily life is the worship that happens in the temple.</b></p>","exp":"<p><b>What the text plainly says:</b> because of God’s many mercies, believers are to present their bodies as a living, holy, acceptable sacrifice; this is their reasonable and spiritual worship.</p><p><b>What may fairly be drawn from it:</b> if the engine of consecration is guilt, it is not 12:1. <b>The engine of 12:1 is “the mercies of God” — it comes straight out of the “oh, the depth” of chapter 11.</b></p>"},{"a":2,"z":2,"star":true,"grk":"<p>καὶ μὴ συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.</p>","lit":"<p>“And <b>stop being moulded to the outward shape of this present age</b>; instead, <b>keep being transformed</b> — by <b>the renewing of your mind</b> — so that you may <b>test and discern</b> what the will of God is: the good, the acceptable, the complete.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>conformed</td><td>συσχηματίζεσθε</td><td>syschēmatizesthe</td><td>G4964</td><td>σύν + σχῆμα</td><td><b>to be moulded to the same outward shape</b></td><td>see below</td></tr><tr><td>this world</td><td>τῷ αἰῶνι τούτῳ</td><td>tō aiōni toutō</td><td>G165</td><td>—</td><td><b>this present age</b> (not “the planet”)</td><td>—</td></tr><tr><td>transformed</td><td>μεταμορφοῦσθε</td><td>metamorphousthe</td><td>G3339</td><td>μετά + μορφή</td><td><b>to have the form itself changed</b> (metamorphosis)</td><td>see below</td></tr><tr><td>renewing</td><td>ἀνακαίνωσις</td><td>anakainōsis</td><td>G342</td><td>ἀνά + καινός (new in kind)</td><td><b>renewal, remaking</b></td><td>same root as 6:4</td></tr><tr><td>mind</td><td>νοῦς</td><td>nous</td><td>G3563</td><td>—</td><td><b>the mind, the way of thinking</b></td><td>the word of 7:23, 7:25</td></tr><tr><td>discern</td><td>δοκιμάζειν</td><td>dokimazein</td><td>G1381</td><td>—</td><td><b>to test and approve</b></td><td>same root as 5:4</td></tr></table>","gram":"<p><b>★★ First light: the difference between schēma and morphē</b></p><p>Greek has two words for “form”:</p><table><tr><th>Word</th><th>Meaning</th><th>Character</th></tr><tr><td><b>σχῆμα</b></td><td>outward shape, appearance</td><td><b>changeable, temporary</b> (English “scheme”)</td></tr><tr><td><b>μορφή</b></td><td>essential form, inner shape</td><td><b>essential</b> (English “morph”)</td></tr></table><p>(Philippians 2:6–7 uses both: Christ, being in the <b>form</b> (μορφή) of God, took the <b>form</b> (μορφή) of a servant, and was found in <b>appearance</b> (σχῆμα) as a man.)</p><p>So 12:2 means:</p><pre>μὴ συσχηματίζεσθε   —  do not be pressed into this age’s [OUTWARD SHAPE]\nἀλλὰ μεταμορφοῦσθε  —  but be changed in your [ESSENTIAL FORM]</pre><p>The world wants you to <b>change your surface</b> to match it.<br>God wants you <b>changed from the inside out</b>.</p><p><b>One is applied. The other grows.</b></p><p>(An honest note: some scholars think the distinction between these two words had already softened by Paul’s day. But the roots do differ, and Paul has deliberately set them side by side, so the contrast holds.)</p><p><b>★★ Second light: two present passive imperatives</b></p><p>Three grammatical features of these verbs, and each one matters:</p><table><tr><th>Feature</th><th>What it means</th></tr><tr><td><b>present tense</b></td><td><b>continuous</b> — not something finished in one go</td></tr><tr><td><b>passive voice</b></td><td><b>I do not change myself; I am changed</b></td></tr><tr><td><b>imperative mood</b></td><td>and yet I am still responsible to let myself be changed</td></tr></table><p>Together these three answer the tension of chapters 6, 7 and 8 exactly:</p><p>Not gritting my teeth (that is chapter 7).<br>Not passively waiting (that is irresponsibility).<br>But — <b>putting myself where I will be changed.</b></p><p><b>★★★ Third light: the mechanism of change is the renewing of the mind</b></p><p>“By the renewing of your mind” — τῇ ἀνακαινώσει τοῦ νοός. The dative marks <b>the means</b>: <b>how</b> does the transformation happen? <b>Through the mind being renewed.</b></p><p>This is enormously important, because it rules out two other roads:</p><table><tr><th>A wrong road</th><th>The problem with it</th></tr><tr><td>change behaviour by willpower</td><td>that is chapter 7 — “to will is present with me, but to do it is not”</td></tr><tr><td>wait for one supernatural experience</td><td>Paul’s word is ἀνακαίνωσις — <b>a process</b></td></tr></table><p>The right road is: <b>the mind is renewed → the life is transformed.</b></p><p>This is the direct biblical ground of the sentence at the heart of the 3-2-1: <b>change the way you think, and you change the life.</b></p><p><b>★ Fourth light: nous — the word from chapter 7</b></p><pre>7:23  “another law … warring against the law of my MIND (νοῦς)”\n7:25  “with the MIND (νοῦς) I serve the law of God”\n  ↓\n12:2  “transformed by the renewing of your MIND (νοῦς)”</pre><p>Chapter 7: my mind is right, but I cannot do it.<br>Chapter 12: <b>that mind itself is to be renewed.</b></p><p><b>★ Fifth light: dokimazō — to test and approve</b></p><p>“That you may <b>prove</b> what the will of God is” — δοκιμάζειν. The root is <b>the assaying of metal</b> (δοκιμή, the word of 5:4).</p><p>It does not mean “to guess.” It means <b>to recognise after testing</b>.</p><p>This verse answers a question many people ask: <b>“How do I know God’s will?”</b></p><p>And Paul’s answer is not “ask for a sign” or “wait for a voice.” Paul’s answer is: <b>let your mind be renewed, and you will begin to recognise it.</b></p>","exp":"<p>The relationship between 12:1 and 12:2 is this:</p><pre>12:1  one [DECISIVE ACT]:    παραστῆσαι (aorist)     — put the body on the altar\n  ↓\n12:2  one [ONGOING PROCESS]: μεταμορφοῦσθε (present) — keep being transformed</pre><p>There is a single presenting, and there is a daily renewing.<br>(This matches the two tenses of 6:13 exactly.)</p>"},{"a":3,"z":3,"star":true,"grk":"<p>Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ' ὃ δεῖ φρονεῖν ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.</p>","lit":"<p>“For by the grace given to me I say to every one of you: <b>do not think of yourself more highly than you ought to think</b>, but think <b>so as to be sound-minded</b> — according to <b>the measure of faith</b> God has <b>allotted</b> to each one.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>think too highly</td><td>ὑπερφρονεῖν</td><td>hyperphronein</td><td>G5252</td><td>ὑπέρ + φρονέω: <b>to think above</b> (<b>only here in the NT</b>)</td></tr><tr><td>sound judgement</td><td>σωφρονεῖν</td><td>sōphronein</td><td>G4993</td><td>σῶς (sound) + φρήν (mind): <b>to be of sound, sober mind</b></td></tr><tr><td>allotted</td><td>ἐμέρισεν</td><td>emerisen</td><td>G3307</td><td><b>to distribute, to measure out</b></td></tr><tr><td>measure of faith</td><td>μέτρον πίστεως</td><td>metron pisteōs</td><td>G3358</td><td><b>a measure of faith</b></td></tr></table>","gram":"<p><b>★ First light: a wordplay on four φρον- words</b></p><pre>μὴ ὑπερφρονεῖν        (do not think ABOVE)\nπαρ' ὃ δεῖ φρονεῖν    (beyond what one ought to think)\nἀλλὰ φρονεῖν          (but rather think)\nεἰς τὸ σωφρονεῖν      (so as to think SOUNDLY)</pre><p>No translation can carry all four. But it proves one thing: <b>12:3 is still about the mind</b> — it runs on the same line as “the renewing of your mind” in 12:2.</p><p><b>★ Second light: sōphroneō — a sound mind</b></p><p>The word is built from σῶς (sound, safe) + φρήν (mind). In Greek ethics σωφροσύνη (self-control, temperance) was one of the <b>four cardinal virtues</b>.</p><p>Note carefully: Paul does <b>not</b> say “think of yourself lower than you ought.” He says <b>sound</b> — neither overestimating nor underestimating.</p><p><b>★ Third light: “the measure of faith”</b></p><p>Two main readings:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>the measure of faith / gifting God has allotted</b></td><td>each has received differently, so do not compare</td></tr><tr><td><b>faith itself as the measuring rod</b></td><td>use “faith” as the ruler by which to measure yourself</td></tr></table><p>The context (12:6, “having gifts differing according to the grace given to us”) supports the first: what God has <b>allotted</b> (ἐμέρισεν) differs from person to person.</p>","exp":"<p>Notice what Paul does <b>before</b> he speaks about gifts. He speaks about <b>how you see yourself</b>.</p><p>That order matters: <b>a person without sound self-assessment becomes more dangerous the greater his gift.</b></p>"},{"a":4,"z":5,"star":false,"grk":"<p>οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, τὸ δὲ καθ' εἷς ἀλλήλων μέλη.</p>","lit":"<p>4 “For just as we have many <b>members</b> in one body, and all the members do not have the same function,”</p><p>5 “so we, who are many, are <b>one body in Christ</b>, and individually <b>members of one another</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>members</td><td>μέλη</td><td>melē</td><td>G3196</td><td><b>parts of the body</b> (the word of 6:13, 6:19, 7:23)</td></tr><tr><td>of one another</td><td>ἀλλήλων</td><td>allēlōn</td><td>G240</td><td><b>of each other</b></td></tr></table>","gram":"<p><b>★ First light: melē — the turn taken by the word from chapter 6</b></p><pre>6:13  “present your MEMBERS to God”        —  my members belong to God\n6:19  “present your MEMBERS as slaves to righteousness”\n7:23  “I see another law in my MEMBERS”    —  my members are the battlefield\n  ↓\n12:5  “members of ONE ANOTHER”             —  I am somebody else’s member!</pre><p>This is a beautiful progression:<br>Earlier: <b>my members</b> are to be presented to God.<br>Here: <b>I myself</b> am somebody else’s <b>member</b>.</p><p><b>★ Second light: allēlōn melē — “members of one another”</b></p><p>Paul does <b>not</b> say “we are all members of the body of Christ” (that is 1 Corinthians 12:27). He says <b>“members of one another.”</b></p><p>Which means: <b>I am your hand, and you are my eye.</b><br>Not merely “we all belong to the same body,” but <b>“we need each other.”</b></p>","exp":"<p>Verses 4–5 come immediately after 12:3 — and that is not an accident.</p><pre>12:3  do not think of yourself more highly than you ought\n  ↓ why?\n12:4  because you are only [ONE MEMBER]</pre><p><b>What the text plainly says:</b> one body has many members with different functions; in Christ we are one body, and <b>individually members of one another</b>.</p><p><b>What may fairly be drawn from it:</b> the ground of “sound judgement” about yourself is not a piece of psychology. It is <b>anatomy</b>.</p><p>A hand need not feel worthless, because the body needs it.<br>A hand need not feel important, because <b>it is not the body</b>.</p><p><b>⚠ Pastoral note:</b> this passage speaks to two kinds of people.<br>To the person who feels useless: <b>the body needs you</b>.<br>To the person who feels the church could not manage without him: <b>you are a member, not the body</b>.</p>"},{"a":6,"z":8,"star":false,"grk":"<p>6 ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως, 7 εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ, 8 εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει· ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.</p>","lit":"<p>6 “Having <b>gifts that differ</b> according to <b>the grace given to us</b>: if prophecy, according to <b>the proportion of faith</b>;”</p><p>7 “if <b>service</b>, in the serving; if <b>teaching</b>, in the teaching;”</p><p>8 “if <b>encouraging</b>, in the encouragement; <b>the one who gives</b>, with <b>singleness of heart</b>; <b>the one who leads</b>, with <b>diligence</b>; <b>the one who shows mercy</b>, with <b>cheerfulness</b>.”</p>","key":"<table><tr><th>Gift</th><th>Greek</th><th>Translit.</th><th>The attitude attached</th><th>Greek</th><th>Meaning</th></tr><tr><td>prophecy</td><td>προφητεία</td><td>prophēteia</td><td>according to the proportion of faith</td><td>κατὰ τὴν ἀναλογίαν τῆς πίστεως</td><td>in proportion to faith</td></tr><tr><td>service</td><td>διακονία</td><td>diakonia</td><td>in the serving</td><td>ἐν τῇ διακονίᾳ</td><td>give yourself to it</td></tr><tr><td>teaching</td><td>διδάσκων</td><td>didaskōn</td><td>in the teaching</td><td>ἐν τῇ διδασκαλίᾳ</td><td>—</td></tr><tr><td>encouraging</td><td>παρακαλῶν</td><td>parakalōn</td><td>in the encouragement</td><td>ἐν τῇ παρακλήσει</td><td><b>the word of 12:1</b></td></tr><tr><td>giving</td><td>μεταδιδούς</td><td>metadidous</td><td><b>with singleness</b></td><td>ἐν ἁπλότητι</td><td><b>unmixed, no hidden layer</b></td></tr><tr><td>leading</td><td>προϊστάμενος</td><td>proistamenos</td><td><b>with diligence</b></td><td>ἐν σπουδῇ</td><td>urgency, earnestness</td></tr><tr><td>showing mercy</td><td>ἐλεῶν</td><td>eleōn</td><td><b>with cheerfulness</b></td><td>ἐν ἱλαρότητι</td><td><b>gladly</b> (see below)</td></tr></table>","gram":"<p><b>★ First light: the last three carry an attitude</b></p><p>Notice how Paul arranges this list.</p><p>The first four (prophecy, service, teaching, encouragement) — he simply says “give yourself to it.”<br>The last three (giving, leading, mercy) — he adds <b>an attitude</b>:</p><pre>giving        —  ἐν ἁπλότητι   (with singleness, no mixed motives)\nleading       —  ἐν σπουδῇ     (with diligence, in earnest)\nshowing mercy —  ἐν ἱλαρότητι  (cheerfully, gladly)</pre><p><b>★★ Second light: hilarotēs — cheerfulness</b></p><p>The noun occurs only here in the New Testament; its adjective ἱλαρός appears in a very well-known verse:</p><p><b>2 Corinthians 9:7, “God loves a cheerful (ἱλαρόν) giver.”</b><br>(The English word “hilarious” comes from this root.)</p><p>Paul is saying: <b>when you show mercy, your face matters.</b></p><p>This is a very practical — and very searching — requirement. The point at which mercy most easily goes wrong is not <b>whether you do it</b>, but <b>the face you wear while doing it</b>.</p><p><b>Help given with an impatient face is not mercy. It is condescension.</b></p><p><b>★ Third light: haplotēs — singleness</b></p><p>The word literally means <b>“unfolded, single”</b> — <b>with no hidden layer</b>.</p><p>What most easily gets mixed into giving? <b>Wanting to be seen. Wanting to be thanked. Wanting a return.</b></p><p>And ἁπλότης means: <b>no hidden layer</b>.</p>","exp":"<p>There is one feature of this list well worth noticing: <b>Paul is not ranking the gifts</b>. He is saying <b>how the thing should be done while you are doing it</b>.</p><p><b>What the text plainly says:</b> gifts differ, and all are according to the grace given; each is to give himself to his own gift, with the fitting attitude.</p><p><b>What may fairly be drawn from it:</b> Paul cares not only <b>what</b> is done, but <b>what heart it is done with</b>.</p>"},{"a":9,"z":9,"star":true,"grk":"<p>Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ,</p>","lit":"<p>“Love — <b>with no mask on</b>. <b>Utterly detesting</b> what is evil; <b>glued</b> to what is good.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>without hypocrisy</td><td>ἀνυπόκριτος</td><td>anypokritos</td><td>G505</td><td>ἀ + ὑποκριτής (<b>an actor</b>)</td><td><b>unfeigned, without a mask</b></td><td>see below</td></tr><tr><td>abhor</td><td>ἀποστυγοῦντες</td><td>apostygountes</td><td>G655</td><td>ἀπό + στυγέω</td><td><b>to detest utterly</b> (<b>only here in the NT</b>)</td><td>a very strong word</td></tr><tr><td>cling to</td><td>κολλώμενοι</td><td>kollōmenoi</td><td>G2853</td><td>κόλλα (<b>glue</b>)</td><td><b>to be glued to</b></td><td>see below</td></tr></table>","gram":"<p><b>★★ First light: anypokritos — with no mask on</b></p><p>The word is built from ἀ (not) + ὑποκριτής (<b>an actor</b>).</p><p>And in classical Greek, ὑποκριτής meant <b>a stage actor, someone performing behind a mask</b>.<br>(It is the word Jesus uses of the Pharisees — “hypocrites,” Matthew 23:13 and elsewhere.)</p><p>So the literal force of “let love be without hypocrisy” is:</p><p><b>“Love — take the mask off.”</b></p><p>And Paul puts this sentence at the <b>head</b> of the whole section, 12:9–21 — <b>it is the title over everything that follows</b>.</p><p><b>★ Second light: kollaō — to be glued</b></p><p>“Cling to what is good” — κόλλα is <b>glue</b>.<br>(Matthew 19:5, “the two shall be <b>joined</b> into one flesh”; Acts 5:13, “no one else dared <b>join</b> them” — the same word.)</p><p>Not “move a little closer to what is good,” but <b>stick to it and do not come off</b>.</p><p><b>★ Third light: two extreme verbs</b></p><pre>ἀποστυγέω  —  [UTTERLY DETEST] what is evil\nκολλάω     —  [GLUE YOURSELF] to what is good</pre><p>Paul has chosen two violent verbs.<br><b>Unfeigned love is not lukewarm. It loathes evil, and it will not let go of good.</b></p>","exp":"<p>12:9 is the <b>title</b> of the whole third section.</p><p>And in the Greek the first clause has no verb at all. Literally: <b>“Love — unfeigned.”</b></p><p><b>What the text plainly says:</b> love must not be a pretence; hate evil, hold fast to good.</p><p><b>What may fairly be drawn from it:</b> the first sentence of Paul’s church ethics is not “love more.” It is <b>“take the mask off.”</b></p><p>Because the most common problem in a church is not the absence of love. <b>It is love that is being performed.</b></p><p><b>⚠ Pastoral note:</b> this verse is not licence to “say every feeling out loud.” Unfeigned love is not unguarded speech — the very next line (12:10) says <b>“in honour, prefer one another.”</b></p>"},{"a":10,"z":13,"star":false,"grk":"<p>10 τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι, 11 τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες, 12 τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες, 13 ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.</p>","lit":"<p>10 “In brotherly love, be <b>tenderly devoted to one another as family</b>; in honour, <b>put one another first</b>;”</p><p>11 “in diligence, not <b>slack</b>; <b>boiling</b> in spirit; serving the Lord;”</p><p>12 “rejoicing in hope; <b>holding out</b> under pressure; <b>refusing to let go</b> of prayer;”</p><p>13 “<b>sharing</b> in the needs of the saints; <b>chasing after</b> hospitality.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>tenderly devoted</td><td>φιλόστοργοι</td><td>philostorgoi</td><td>G5387</td><td>φιλία + στοργή (family affection) — see below</td></tr><tr><td>prefer</td><td>προηγούμενοι</td><td>proēgoumenoi</td><td>G4285</td><td><b>to go first / to lead the way in honouring</b></td></tr><tr><td>fervent</td><td>ζέοντες</td><td>zeontes</td><td>G2204</td><td><b>boiling</b> (the root of ζῆλος in 10:2)</td></tr><tr><td>patient</td><td>ὑπομένοντες</td><td>hypomenontes</td><td>G5278</td><td><b>to stand firm under pressure</b> (the root of 5:3)</td></tr><tr><td>continuing steadfastly</td><td>προσκαρτεροῦντες</td><td>proskarterountes</td><td>G4342</td><td><b>to stick to something and not let go</b></td></tr><tr><td>sharing</td><td>κοινωνοῦντες</td><td>koinōnountes</td><td>G2841</td><td><b>to have a share in</b> (the root of κοινωνία)</td></tr><tr><td>pursuing hospitality</td><td>φιλοξενίαν διώκοντες</td><td>—</td><td>G5381 / G1377</td><td><b>chasing opportunities to receive strangers</b></td></tr></table>","gram":"<p><b>★ First light: storgē — one of the Greek words for love</b></p><p>Greek has several words for love:</p><table><tr><th>Word</th><th>Meaning</th></tr><tr><td><b>ἀγάπη</b></td><td>love as a settled will, self-giving love</td></tr><tr><td><b>φιλία</b></td><td>the love of friends</td></tr><tr><td><b>ἔρως</b></td><td>desire (not used in the New Testament)</td></tr><tr><td><b>στοργή</b></td><td><b>the natural affection between family members</b></td></tr></table><p>And φιλόστοργος in 12:10 is a compound of φιλία + στοργή (<b>only here in the New Testament</b>).</p><p>Paul is saying: <b>love your brothers and sisters the way a family loves.</b><br>Not colleagues. Not fellow members. <b>Family.</b></p><p><b>★ Second light: proēgeomai — to prefer</b></p><p>The word can bear two senses:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>consider others more important</b></td><td>“in honour preferring one another”</td></tr><tr><td><b>lead the way in honouring</b></td><td>“race each other to be first to show honour”</td></tr></table><p>Both are lovely: one is <b>yielding</b>; the other is <b>racing to yield</b>.</p><p><b>★ Third light: zeō — to boil</b></p><p>“Fervent in spirit” — ζέοντες, literally <b>boiling</b>.</p><p>And that is the root of the word in 10:2:</p><pre>10:2   “they have a ZEAL (ζῆλος) for God, but not according to knowledge”\n12:11  “be FERVENT (ζέω) in spirit, serving the Lord”</pre><p>Chapter 10: zeal can run in the wrong direction.<br>Chapter 12: <b>but once the direction is right, boil.</b></p><p><b>Paul was never against zeal. He was against zeal that had not had its direction corrected.</b></p><p><b>★ Fourth light: 12:12 is an echo of chapter 5</b></p><pre>5:2–3   “we rejoice in HOPE of the glory of God … we also rejoice in our\n         SUFFERINGS, knowing that suffering produces PERSEVERANCE”\n  ↓\n12:12   “rejoicing in HOPE; patient in SUFFERING”</pre><p>The same three words: hope, suffering, perseverance.<br>Chapter 5 is <b>a theological statement</b>; chapter 12 is <b>a command for daily life</b>.</p><p><b>★ Fifth light: “given to hospitality” in 12:13</b></p><p>“Given to hospitality” — φιλοξενίαν διώκοντες. διώκω means <b>to chase, to pursue hard</b>.</p><p>Paul does <b>not</b> say “when guests arrive, receive them.” He says <b>go after the opportunity</b>.</p>","exp":"<p>In the Greek, verses 10–13 are almost entirely <b>participles</b>, not a series of separate commands.</p><p>What does that do? It makes the passage read less like a checklist and more like <b>a picture in motion — the look of a community that is alive</b>.</p><p><b>What the text plainly says:</b> this is a run of concrete church realities — family affection, deference, fervency, endurance, persistent prayer, meeting needs, welcoming strangers.</p><p><b>What may fairly be drawn from it:</b> two of these verbs are especially forceful —<br>1. ζέοντες (fervent) literally means <b>boiling</b> — water at a rolling boil.<br>2. διώκοντες (hospitality) literally means <b>chasing</b>.</p><p>(And that word “chasing” in verse 13 becomes, in the very next verse, <b>“those who chase you”</b> — Paul is playing on διώκω across two verses.)</p>"},{"a":14,"z":14,"star":true,"grk":"<p>εὐλογεῖτε τοὺς διώκοντας [ὑμᾶς], εὐλογεῖτε καὶ μὴ καταρᾶσθε.</p>","lit":"<p>“<b>Bless</b> those who <b>chase (persecute) you</b>; <b>bless, and do not curse</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>bless</td><td>εὐλογεῖτε</td><td>eulogeite</td><td>G2127</td><td>εὖ (well) + λόγος (word): <b>to speak well of</b> (<b>present imperative: keep on doing it</b>)</td></tr><tr><td>persecute</td><td>διώκοντας</td><td>diōkontas</td><td>G1377</td><td><b>to chase</b> (the very word of 12:13)</td></tr><tr><td>curse</td><td>καταρᾶσθε</td><td>katarasthe</td><td>G2672</td><td>to curse, to call down harm</td></tr></table>","gram":"<p><b>★ First light: the wordplay with 12:13</b></p><pre>12:13  τὴν φιλοξενίαν διώκοντες  —  [CHASING] after hospitality\n12:14  εὐλογεῖτε τοὺς διώκοντας —  bless those who [CHASE] you</pre><p>The same root, διώκω.</p><p>You chase after opportunities to love people;<br>and some people are chasing you in order to harm you.<br><b>Two kinds of chasing, one word.</b></p><p><b>★ Second light: these are the words of Jesus</b></p><p>Luke 6:28, “<b>bless those who curse you</b>; pray for those who mistreat you.”<br>Matthew 5:44, “love your enemies, and pray for those who <b>persecute</b> you.”</p><p><b>The whole of 12:14–21 is very nearly Paul’s version of the Sermon on the Mount.</b></p>","exp":"<p>Verse 13 says to <b>chase</b> after hospitality. Verse 14 speaks of those who <b>chase</b> you. <b>The same word.</b></p><p><b>What the text plainly says:</b> keep on blessing those who persecute you, and do not curse.</p><p><b>What may fairly be drawn from it:</b> Paul is playing on one word across two verses — you are to <b>chase</b> after hospitality; and toward those who <b>chase</b> you — <b>bless them</b>.</p><p>And “bless” is a <b>present imperative</b>: not “forgive him once,” but <b>keep speaking well of him</b>.</p><p><b>⚠ Pastoral note:</b> this verse can be very heavy for someone who is currently being hurt. Notice that Paul does <b>not</b> say “pretend nothing happened” — 12:19 says plainly that this is a matter requiring vindication. <b>Blessing is not denying the injury. Blessing is handing over the right of revenge.</b></p>"},{"a":15,"z":16,"star":false,"grk":"<p>15 χαίρειν μετὰ χαιρόντων, κλαίειν μετὰ κλαιόντων. 16 τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ' ἑαυτοῖς.</p>","lit":"<p>15 “To <b>rejoice with those who rejoice</b>; to <b>weep with those who weep</b>.”</p><p>16 “<b>Thinking the same thing toward one another</b>; <b>not setting the mind on high things</b>, but <b>letting yourselves be carried along to the lowly</b>. <b>Do not be wise in your own estimation.</b>”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>rejoice / weep with</td><td>χαίρειν / κλαίειν μετά</td><td>—</td><td>G5463 / G2799</td><td><b>infinitives</b> — no imperative force; more a sketch than an order</td></tr><tr><td>same mind</td><td>τὸ αὐτὸ φρονοῦντες</td><td>—</td><td>G5426</td><td><b>to think the same thing</b> (the phrase of 15:5)</td></tr><tr><td>high things</td><td>τὰ ὑψηλὰ φρονοῦντες</td><td>—</td><td>G5308</td><td><b>to set the mind on high things</b> (the phrase of 11:20)</td></tr><tr><td>associate with the lowly</td><td>συναπαγόμενοι</td><td>synapagomenoi</td><td>G4879</td><td><b>to be carried along with</b> (<b>passive voice</b>)</td></tr></table>","gram":"<p><b>★ First light: verse 15 is two infinitives, and extremely spare</b></p><p>The Greek is only six words:</p><p>χαίρειν μετὰ χαιρόντων, κλαίειν μετὰ κλαιόντων<br>“To rejoice with rejoicers; to weep with weepers.”</p><p>Note the order: <b>rejoicing first, weeping second</b>.<br>And usually, <b>rejoicing together is the harder of the two</b>.</p><p>When I weep with you, I am above you. When I rejoice with you, <b>you are above me</b>.</p><p><b>★ Second light: three φρον- words in verse 16</b></p><pre>τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες  (be of the same mind toward one another)\nμὴ τὰ ὑψηλὰ φρονοῦντες           (do not set your mind on high things)\nμὴ γίνεσθε φρόνιμοι παρ' ἑαυτοῖς (do not be wise in your own estimation)</pre><p><b>★ Third light: “do not set your mind on high things” is the phrase of 11:20</b></p><pre>11:20  “do not be HIGH-MINDED (μὴ ὑψηλὰ φρόνει), but fear”\n12:16  “do not set your mind on HIGH THINGS (μὴ τὰ ὑψηλὰ φρονοῦντες)”</pre><p>The same phrase.<br>In chapter 11 it is spoken to <b>Gentile believers as a group</b>;<br>in chapter 12 it is spoken to <b>each person inside his relationships</b>.</p><p><b>★ Fourth light: “associate with the lowly”</b></p><p>τοῖς ταπεινοῖς συναπαγόμενοι — literally <b>“being carried along together to the lowly places.”</b> συναπάγω means <b>to be carried off with</b>.</p><p>This is not “stooping to help the little people.” It is <b>“letting yourself be carried down there.”</b></p>","exp":"<p>Verse 15 is not in the imperative in Greek. It is <b>two infinitives</b> — Paul is not so much issuing an order as <b>sketching</b> what a community should look like.</p><p><b>What the text plainly says:</b> rejoice with those who rejoice, weep with those who weep; be of one mind, not proud, but going along with the lowly.</p><p><b>What may fairly be drawn from it:</b> these two things are <b>not equally difficult</b>.</p><p>Weeping with those who weep requires <b>compassion</b>.<br>Rejoicing with those who rejoice requires <b>the absence of envy</b>.</p><p>(Consider: when someone receives the very thing you have wanted and not received — can you smile?)</p>"},{"a":17,"z":18,"star":false,"grk":"<p>17 μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες, προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων· 18 εἰ δυνατόν, τὸ ἐξ ὑμῶν, μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·</p>","lit":"<p>17 “Repaying no one <b>evil for evil</b>; <b>planning ahead</b> for what is <b>good in the sight of all</b>.”</p><p>18 “<b>If it is possible</b>, <b>so far as it depends on you</b>, be at <b>peace with all people</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>evil for evil</td><td>κακὸν ἀντὶ κακοῦ</td><td>—</td><td>G2556</td><td><b>evil in exchange for evil</b> (ἀντί = in exchange)</td></tr><tr><td>take thought for</td><td>προνοούμενοι</td><td>pronooumenoi</td><td>G4306</td><td>πρό + νοέω: <b>to plan in advance</b> (<b>the root of πρόνοια in 13:14</b>)</td></tr><tr><td>if possible</td><td>εἰ δυνατόν</td><td>ei dynaton</td><td>G1415</td><td>if it can be done</td></tr><tr><td>so far as it depends on you</td><td>τὸ ἐξ ὑμῶν</td><td>to ex hymōn</td><td>—</td><td><b>as far as your side of it goes</b></td></tr></table>","gram":"<p><b>★ The three qualifiers of 12:18 (a piece of great pastoral wisdom)</b></p><p>Paul was an intensely practical man. He does <b>not</b> say “you must be reconciled with everyone.” He says three things:</p><pre>εἰ δυνατόν   —  [IF IT IS POSSIBLE]  — sometimes it is not\nτὸ ἐξ ὑμῶν   —  [YOUR SIDE OF IT]    — you are responsible for your half only\nεἰρηνεύοντες —  be at peace          — but give your half everything you have</pre><p><b>Peace takes two people. And God asks you to answer only for your side.</b></p>","exp":"<p>Verse 18 is the most honest — and the most gracious — sentence in the Bible about peace, because of those three qualifiers:</p><pre>1. if it is possible      —  sometimes it is not\n2. give it your all       —  but give your half everything\n3. so far as it depends on you  —  you answer for your half only</pre><p><b>What the text plainly says:</b> repay no one evil for evil; plan ahead for what everyone recognises as good; and, on your own side, do everything you can to live at peace with all.</p><p><b>What may fairly be drawn from it:</b> Paul does <b>not</b> say you must be reconciled with everyone. <b>Peace takes two people, and God asks you to answer only for your half.</b></p><p><b>⚠ Pastoral note:</b> for someone who has been hurt in a relationship, this verse is enormous relief. If the other party will not, <b>that is not your failure</b>. (And be honest too: “so far as it depends on you” also means — <b>your half really must be given</b>.)</p><p>And “take thought for” in verse 17 (προνοέω) is the very root of 13:14, “make no <b>provision</b> (πρόνοια) for the flesh”:</p><p><b>The same capacity to plan ahead — it can pave a road for the flesh, or pave a road for good.</b></p>"},{"a":19,"z":19,"star":true,"grk":"<p>μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ· γέγραπται γάρ· ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.</p>","lit":"<p>“Beloved, do not avenge yourselves, but <b>give room to the wrath</b>; for it is written: ‘Vengeance is mine; I will repay, says the Lord.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>avenging yourselves</td><td>ἐκδικοῦντες</td><td>ekdikountes</td><td>G1556</td><td><b>to get justice for yourself</b></td></tr><tr><td>give place</td><td>δότε τόπον</td><td>dote topon</td><td>G5117</td><td><b>to give space, to yield the position</b></td></tr><tr><td>the wrath</td><td>τῇ ὀργῇ</td><td>tē orgē</td><td>G3709</td><td><b>the wrath</b> (with the article — see below)</td></tr></table>","gram":"<p><b>★ First light: “give place” literally means “give room”</b></p><p>δότε τόπον — <b>yield a position</b>.</p><p>The picture is arresting: <b>you are standing there, about to act. And God says: step aside, and give me room.</b></p><p><b>★ Second light: “the wrath” carries the article</b></p><p>τῇ ὀργῇ — “<b>the</b> wrath.” In Romans, “the wrath” has a definite referent:</p><pre>1:18  the wrath of God is revealed from heaven\n2:5   in the day of wrath\n5:9   saved from the wrath</pre><p>So 12:19 does not mean “let the other person finish losing his temper.” It means <b>“hand this matter over to the wrath of God to deal with.”</b></p><p><b>★ Third light: this is not “let it go”</b></p><p>Paul does <b>not</b> say the matter is unimportant. He says: <b>this matter is so important that it must be handed to God himself.</b></p><p>You do not avenge yourself, not because the thing was not worth avenging, <b>but because there is someone far better qualified to avenge it.</b></p>","exp":"<p>12:19 is the theological ground of this whole section. And it quotes Deuteronomy 32:35 — from the Song of Moses.</p><p><b>What the text plainly says:</b> do not avenge yourselves; give room to God’s wrath; vengeance belongs to God.</p><p><b>What may fairly be drawn from it:</b> “give place” is δότε τόπον — literally <b>“give room.”</b> Paul’s picture is: <b>while you are standing in that spot, God cannot act. Step aside, and he can.</b></p><p>And the next chapter immediately supplies the counterpart:</p><p>13:4, “he is God’s servant, <b>an avenger</b> (ἔκδικος) for wrath to him who does evil.”</p><p>The ἐκδίκησις of 12:19 and the ἔκδικος of 13:4 are <b>the same root</b>.</p><p><b>So 12:19 does not say “nobody will deal with this.” It says “it is not for you to deal with it.”</b></p><p><b>⚠⚠ Pastoral note (extremely important):</b></p><p>For someone who has been harmed — particularly someone who has been abused — this verse is very easily misused into “you must simply bear it.” Three things must be said plainly:</p><p><b>1. This is not dropping the case. It is transferring it to a higher court.</b><br><b>2. Paul says in the very next chapter that God has appointed government as “an avenger” — so seeking legal redress does not violate this verse.</b><br><b>3. When you preach this verse, be ready with real help afterwards</b> (accompaniment, referral, reporting) — not merely the sentence “leave it with God.”</p>"},{"a":20,"z":21,"star":true,"grk":"<p>21 μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.</p>","lit":"<p>20 “But if your enemy is hungry, feed him; if he is thirsty, give him a drink; for in doing this you will <b>heap coals of fire</b> on his head.”</p><p>21 “Do not be <b>overcome by evil</b>, but <b>overcome evil with good</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>coals of fire</td><td>ἄνθρακας πυρός</td><td>anthrakas pyros</td><td>G440</td><td><b>burning coals</b></td></tr><tr><td>overcome</td><td>νικάω</td><td>nikaō</td><td>G3528</td><td><b>to conquer</b> (the root of ὑπερνικάω in 8:37)</td></tr></table>","gram":"<p><b>★ First light: what does “heaping coals of fire on his head” mean?</b></p><p>This quotes Proverbs 25:21–22. There are three main readings:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>A. It brings shame and repentance</b></td><td>the kindness troubles his conscience, as painful as coals on the head → it leads him to repent</td></tr><tr><td><b>B. An Egyptian penitential rite</b></td><td>some scholars suggest an ancient Egyptian custom of carrying a pan of coals as a sign of repentance</td></tr><tr><td><b>C. It increases judgement</b></td><td>if he still will not repent, the kindness deepens his accountability</td></tr></table><p>The context — 12:21, “overcome evil with good” — plainly supports <b>A</b>: Paul’s aim is <b>to overcome evil</b>, not to take revenge.</p><p>(See the disputed material for the fuller discussion.)</p><p><b>★★ Second light: nikaō — the word from chapter 8</b></p><pre>8:37   “in all these things we are MORE THAN CONQUERORS (ὑπερνικῶμεν)\n        through him who loved us”\n  ↓\n12:21  “do not be OVERCOME (νικάω) by evil, but OVERCOME (νίκα) evil with good”</pre><p>A beautiful echo:<br>Chapter 8: <b>you are already more than a conqueror</b> (standing).<br>Chapter 12: <b>so go and conquer</b> (practice).</p><p><b>★ Third light: a contrast of two voices</b></p><pre>μὴ νικῶ ὑπὸ τοῦ κακοῦ  —  [PASSIVE]: do not be conquered by evil\nἀλλὰ νίκα              —  [ACTIVE IMPERATIVE]: you go and conquer</pre><p>Paul is saying: in this matter <b>there are only two possibilities</b>. Either evil conquers you, or you conquer evil with good.<br><b>“Neutral” is not on the list.</b></p>","exp":"<p>12:21 is the conclusion of the chapter, and its most practical sentence.</p><p>“Do not be overcome by evil” — what does that mean?</p><p>When someone treats you badly and you answer in kind — <b>on the surface you are getting back at him. In reality, evil has already won</b>. Because it has succeeded in turning you into an evil man too.</p><p>And “overcome evil with good” means:</p><p><b>I will not let that evil thing change who I am.</b></p>"}],"5":[{"a":1,"z":1,"star":true,"grk":"<p>Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ</p>","lit":"<p>“Therefore, <b>having been justified</b> by faith, <b>we have peace</b> with God through our Lord Jesus Christ.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>having been justified</td><td>δικαιωθέντες</td><td>dikaiōthentes</td><td>G1344</td><td>δίκαιος</td><td><b>aorist passive participle</b>: having been declared righteous</td><td>a single, settled event</td></tr><tr><td>peace</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>—</td><td><b>peace</b> (the LXX word for Hebrew <b>shalom</b>)</td><td><b>not a mood — a state</b></td></tr><tr><td>with God</td><td>πρὸς τὸν θεόν</td><td>pros ton theon</td><td>G4314</td><td>—</td><td><b>face to face toward God</b></td><td>a relational preposition</td></tr></table>","gram":"<p><b>① dikaiōthentes: aorist passive participle</b></p><p>· <b>aorist</b>: a completed event, not an ongoing process<br>· <b>passive</b>: God did it; I did not<br>· <b>participle</b>: this is the <b>premise</b> of the sentence, not the main clause</p><p>The whole of 5:1 stands on something already settled, and reasons forward from it.</p><p><b>② eirēnē is not a feeling; it is a state</b></p><p>This is the most important — and most misread — point in the verse.</p><p>In the Septuagint εἰρήνη renders the Hebrew <b>shalom</b>, whose root means <b>whole, unbroken, restored to order</b>. It is used of:<br>· <b>a war ending</b> (Joshua 9:15)<br>· <b>a debt paid off</b><br>· <b>a relationship repaired</b></p><p>“Peace with God” does not mean “I feel peaceful.”<br><b>It means the war is over. The armistice has been signed.</b></p><p>Your feelings will rise and fall. <b>That armistice does not lapse because you are having a bad day.</b></p><p><b>③ the preposition in pros ton theon</b></p><p>πρός + accusative denotes <b>a face-to-face orientation</b>.<br>(John 1:1, “the Word was <b>with</b> God” — πρὸς τὸν θεόν, the same phrase: <b>face to face</b>.)</p><p><b>④ ★ the textual question: echomen or echōmen?</b></p><p>This is one of the most famous variants in the New Testament, and it must be handled honestly.</p><table><tr><th>Reading</th><th>Mood</th><th>Meaning</th></tr><tr><td><b>ἔχομεν</b></td><td>indicative</td><td>“we <b>have</b> peace with God” (<b>a statement of fact</b>)</td></tr><tr><td><b>ἔχωμεν</b></td><td>subjunctive</td><td>“let us <b>keep</b> peace with God” (<b>an exhortation</b>)</td></tr></table><p>The two differ by <b>a single letter</b> (ο / ω) — and by the first century these two vowels were pronounced almost identically. <b>A scribe taking dictation could hardly tell them apart.</b></p><p><b>Weighing the evidence:</b><br>· <b>External (manuscripts):</b> the earlier witnesses largely support ἔχωμεν (subjunctive)<br>· <b>Internal (context and Paul’s argument):</b> <b>strongly</b> supports ἔχομεν (indicative)</p><p><b>Reasons:</b><br>1. The whole of 5:1–11 <b>states</b> what we possess (we have access, we rejoice, love has been poured out) — <b>it is not exhortation</b><br>2. In Romans, exhortation (chs. 12–16) is kept separate from doctrine (chs. 1–11)<br>3. 5:2 “we have obtained access… in which we stand” is perfect indicative; an exhortation at 5:1 would jar</p><p>Most modern translations and commentaries take the indicative.</p><p><b>Pulpit note:</b> you may say “there is an ancient textual question here, and the two readings differ by one letter,” but do not say “the Greek actually says… and the translation is wrong” — because the majority judgement agrees with the standard translations.</p>","exp":"<p>Notice Paul’s order:</p><p><b>justification (the courtroom) → peace (the relationship)</b></p><p>Justification is the judge’s verdict. Peace is the father’s embrace.</p><p>You can be acquitted in court and never see the judge again as long as you live.<br>Paul says: it is not like that. <b>God has not only cleared you. He has made peace with you.</b></p>"},{"a":2,"z":2,"star":false,"grk":"<p>δι' οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν [τῇ πίστει] εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν καὶ καυχώμεθα ἐπ' ἐλπίδι τῆς δόξης τοῦ θεοῦ.</p>","lit":"<p>“Through whom we have also <b>obtained our introduction</b> into this grace in which we <b>stand</b>; and we <b>boast</b> in the hope of the glory of God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>access</td><td>προσαγωγή</td><td>prosagōgē</td><td>G4318</td><td>πρός + ἄγω (to lead)</td><td><b>introduction; being brought into the presence</b></td><td><b>a court term</b> (see below)</td></tr><tr><td>we have obtained</td><td>ἐσχήκαμεν</td><td>eschēkamen</td><td>G2192</td><td>ἔχω</td><td><b>perfect</b>: obtained, and still holding</td><td>it will not be withdrawn</td></tr><tr><td>we stand</td><td>ἑστήκαμεν</td><td>hestēkamen</td><td>G2476</td><td>ἵστημι</td><td><b>perfect</b>: took our stand, and still standing</td><td>we are standing there</td></tr><tr><td>we rejoice</td><td>καυχώμεθα</td><td>kauchōmetha</td><td>G2744</td><td>—</td><td><b>to boast, to glory in</b></td><td>the word locked out in 3:27</td></tr></table>","gram":"<p><b>★ First light: prosagōgē — the officer of introduction</b></p><p>The word occurs only three times in the New Testament, all in Paul: Romans 5:2, Ephesians 2:18, Ephesians 3:12.</p><p>In the Persian and Hellenistic courts there was an official called the <b>prosagōgeus</b> — <b>the officer of introduction</b>. His task was to bring people into the king’s presence. Without him you could not get near the palace door.</p><p><b>Esther 4:11:</b> “anyone who comes to the king in the inner court without being called is put to death — unless the king holds out the golden sceptre.”</p><p>Paul says: <b>Jesus is that officer of introduction.</b></p><p>And what is more astonishing still — <b>he does not leave us at the door.</b></p><p><b>★ Second light: two perfects</b></p><pre>ἐσχήκαμεν  (we have obtained access, and still hold it)\nἑστήκαμεν  (we have taken our stand, and are still standing)</pre><p>The Greek perfect denotes a completed action whose effect continues.</p><p>Paul does not say “we were once brought in.”<br><b>He says we were brought in, and we are still standing there.</b></p><p><b>Not visitors. Residents.</b></p><p><b>★ Third light: kauchaomai — boasting comes back</b></p><p>We met this word in 3:27: “Where then is <b>boasting</b>? It is excluded — locked outside.”</p><p>Now, in 5:2, 5:3 and 5:11, it returns three times.</p><p>Paul is not out to abolish boasting. He is out to <b>change its object</b>.<br>Boasting in works is shut outside the door (3:27).<br>Boasting in grace is invited in (5:2, 5:11).</p>","exp":"<p>Verses 1–2 give three results of justification, and they run in time order:</p><table><tr><th>Tense</th><th>Content</th><th>Reference</th></tr><tr><td><b>past</b></td><td>the war is over (peace)</td><td>5:1</td></tr><tr><td><b>present</b></td><td>I am standing in grace (access)</td><td>5:2a</td></tr><tr><td><b>future</b></td><td>I hope for the glory of God</td><td>5:2b</td></tr></table><p>Look at that last one: “hope of <b>the glory of God</b>.”</p><p>What does 3:23 say? “All have sinned and <b>fall short of the glory of God</b>.”</p><p><b>The very thing we fell short of has become the thing we hope for.</b></p><p>From “falling short of the glory of God” (3:23) to “hoping for the glory of God” (5:2) — <b>that is the distance the gospel travels in two chapters.</b></p>"},{"a":3,"z":4,"star":false,"grk":"<p>3 οὐ μόνον δέ, ἀλλὰ καὶ καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται, 4 ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.</p>","lit":"<p>3 “And not only so, but we also boast in <b>the pressure</b> — <b>knowing</b> that pressure <b>produces</b> endurance,”</p><p>4 “and endurance produces <b>tested character</b>, and tested character produces hope.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>tribulation</td><td>θλῖψις</td><td>thlipsis</td><td>G2347</td><td>θλίβω (to press)</td><td><b>pressure, crushing weight</b></td><td>originally <b>pressing</b> — olives, grapes</td></tr><tr><td>produces</td><td>κατεργάζεται</td><td>katergazetai</td><td>G2716</td><td>κατά + ἐργάζομαι</td><td><b>to produce, to bring out</b></td><td>same word as 4:15</td></tr><tr><td>endurance</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td>ὑπό (under) + μένω (to remain)</td><td><b>to stay standing under a weight</b></td><td>same word as 2:7</td></tr><tr><td>character</td><td>δοκιμή</td><td>dokimē</td><td>G1382</td><td>δοκιμάζω (to assay metal)</td><td><b>quality proven by fire</b></td><td>see below</td></tr><tr><td>knowing</td><td>εἰδότες</td><td>eidotes</td><td>G1492</td><td>οἶδα</td><td><b>knowing for certain</b> (not guessing)</td><td><b>the ground of the boasting</b></td></tr></table>","gram":"<p><b>① the picture in thlipsis: pressing</b></p><p>The verb θλίβω means <b>to press</b> — as olives are pressed for oil, or grapes for wine.</p><p>Paul did not choose a word for “blow.” He chose one for <b>pressing</b>.</p><p>The point of pressing is not destruction. It is <b>to force out what is inside</b>.</p><p>And the most honest thing about pressing is this: <b>it can only bring out what was already there.</b></p><p><b>② the metallurgical background of dokimē</b></p><p>The word comes from δοκιμάζω — <b>to assay metal</b>.</p><p>In the ancient world, metal was put in the fire; the impurities rose and were skimmed off; what was left was <b>δόκιμος — proved genuine</b>.<br>(1 Peter 1:7, “the proof of your faith, more precious than gold that perishes though tested by fire” — the same root.)</p><p>“Character” here is not “experience.” It is <b>the part of you that is still there after the fire</b>.</p><p><b>③ one verb carries the whole chain</b></p><p>In verse 4 the verb is not repeated; it is carried over from κατεργάζεται in verse 3. So the whole chain hangs on <b>one verb</b>:</p><pre>θλῖψις  →  ὑπομονή       →  δοκιμή          →  ἐλπίς\npressure → standing under →  proved genuine   →  hope</pre><p><b>④ a balance that must be stated: “in tribulation” is not “because of tribulation”</b></p><p>The Greek is ἐν ταῖς θλίψεσιν — <b>“in</b> the pressures,” not “<b>for</b> the pressures.”</p><p>Paul does not say suffering is good.<br>Paul says: <b>inside</b> the suffering we can still boast — because we <b>know</b> what God is doing in it.</p>","exp":"<p>5:3 is the most easily misused verse in the chapter.</p><p>It gets quoted at people who are suffering: “Rejoice! Suffering produces endurance, doesn’t it!”<br><b>That use is cruel, and it misreads the Greek.</b></p><p>Notice three things.</p><p>First, Paul says <b>“in</b> the tribulation,” not “<b>for</b> the tribulation.”<br>Second, the ground of the rejoicing is <b>knowing</b> (εἰδότες) — knowledge of God, not numbness to pain.<br>Third, the whole chain is something <b>God</b> produces (κατεργάζεται); it is not something we squeeze out of ourselves.</p><p><b>This verse is for the sufferer to use on himself. It is not for a bystander to preach at him.</b></p><p>And the most honest thing in the chain is this: <b>pressing can only bring out what is already inside.</b> So suffering does not <b>manufacture</b> character — suffering <b>exposes</b> character, and God goes to work at the place where it has been exposed.</p>"},{"a":5,"z":5,"star":true,"grk":"<p>ἡ δὲ ἐλπὶς οὐ καταισχύνει, ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.</p>","lit":"<p>“And this hope <b>does not put us to shame</b>, because the love of God <b>has been poured out</b> in our hearts — through the Holy Spirit who <b>has been given</b> to us.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>put to shame</td><td>καταισχύνει</td><td>kataischynei</td><td>G2617</td><td>κατά + αἰσχύνη (shame)</td><td><b>to disgrace, to disappoint publicly</b></td><td>a heavy word in an honour culture</td></tr><tr><td>poured out</td><td>ἐκκέχυται</td><td>ekkechytai</td><td>G1632</td><td>ἐκ + χέω (to pour)</td><td><b>perfect passive: has been poured out</b></td><td>see below</td></tr><tr><td>the love of God</td><td>ἡ ἀγάπη τοῦ θεοῦ</td><td>—</td><td>G26</td><td>—</td><td><b>God’s love for us</b> (subjective genitive)</td><td>see below</td></tr><tr><td>given</td><td>δοθέντος</td><td>dothentos</td><td>G1325</td><td>δίδωμι</td><td><b>aorist passive participle: has been given</b></td><td>an accomplished fact</td></tr></table>","gram":"<p><b>① ekkechytai: perfect passive</b></p><p>A past action whose effect continues into the present.</p><p>Not “God’s love was once poured out on us.”<br><b>That bucket was tipped over us, and we are still wet today.</b></p><p><b>② the Old Testament background of ekcheō</b></p><p>In the Septuagint this verb carries one supremely important promise:</p><p><b>“Afterward I will pour out my Spirit on all flesh.” (Joel 2:28; quoted in Acts 2:17)</b></p><p>In 5:5 Paul joins the pouring out of <b>the Spirit</b> with the pouring out of <b>God’s love</b>:</p><p><b>When the Spirit comes, the first thing he brings is the love of God.</b></p><p><b>③ “the love of God” — who loves whom?</b></p><table><tr><th>Reading</th><th>Meaning</th></tr><tr><td><b>subjective genitive</b></td><td><b>God’s love for us</b> (most commentaries)</td></tr><tr><td>objective genitive</td><td>our love for God</td></tr></table><p><b>Decisive reasons for “God’s love for us”:</b><br>· <b>The next verses (5:6–8) unpack it immediately:</b> “God commends <b>his own love</b> toward us, in that while we were still sinners, Christ died for us.”<br>· Paul uses the same phrase in 5:8, τὴν ἑαυτοῦ ἀγάπην — <b>his own love</b></p><p>This verse does not say “the Spirit makes me love God more.” It says <b>“the Spirit makes me know how much God loves me.”</b></p><p><b>④ the first real mention of the Spirit’s work in Romans</b></p><p>Chapters 1–4 barely mention the Spirit (2:29 has one passing reference, “in the spirit”).</p><p>5:5 is the first time the Spirit appears as <b>the One who has been given</b> — and from chapter 8 onward the Spirit becomes the central figure of the letter (some twenty mentions in chapter 8 alone).</p>","exp":"<p>5:5 answers a very practical worry:</p><p>“You say suffering produces endurance, endurance character, character hope — <b>but what if nothing happens in the end? Won’t I look a fool?</b>”</p><p>Paul says: <b>hope does not put us to shame.</b></p><p>Why not? <b>Because before the end of that chain, God has already given the deposit.</b></p><p>He has not asked us to wait until the last day to find out that he loves us.<br><b>He has poured that love into our hearts already.</b></p>"},{"a":6,"z":6,"star":false,"grk":"<p>ἔτι γὰρ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.</p>","lit":"<p>“For while we were <b>still</b> without strength, Christ died — <b>at the appointed moment</b> — for <b>the ungodly</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>still</td><td>ἔτι</td><td>eti</td><td>G2089</td><td><b>while it was still the case</b> (it occurs twice in this verse)</td></tr><tr><td>weak</td><td>ἀσθενής</td><td>asthenēs</td><td>G772</td><td>ἀ + σθένος (strength): <b>without strength, helpless</b></td></tr><tr><td>at the right time</td><td>κατὰ καιρόν</td><td>kata kairon</td><td>G2540</td><td><b>at the decisive moment</b> (kairos is “the moment,” not duration)</td></tr><tr><td>the ungodly</td><td>ἀσεβής</td><td>asebēs</td><td>G765</td><td><b>the ungodly</b> (see below)</td></tr></table>","gram":"<p><b>① asebēs — the key word for the third time</b></p><p>We have now tracked this word through three chapters:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>1:18</b></td><td>God’s wrath is revealed against all <b>ungodliness</b> (ἀσέβεια) and unrighteousness</td></tr><tr><td><b>4:5</b></td><td>him who believes in the God who justifies <b>the ungodly</b> (ἀσεβῆ)</td></tr><tr><td><b>5:6</b></td><td>Christ died for <b>the ungodly</b> (ἀσεβῶν)</td></tr></table><p>One group of people, at three stations:<br>Station one: they are dealt with by the wrath of God.<br>Station two: they are declared righteous by God.<br>Station three: <b>and this is why — someone died for them.</b></p><p><b>② kata kairon — not an accident, but an appointment</b></p><p>καιρός is not χρόνος (the passage of time). It is <b>the right moment</b>.<br>(Galatians 4:4, “when the fullness of the time had come, God sent forth his Son.”)</p><p><b>The cross was not a tragedy that got out of hand. It was an appointment kept on time.</b></p><p><b>③ the use of hyper</b></p><p>ὑπέρ + genitive = <b>“for the benefit of,” “in the place of.”</b> In Paul this preposition carries the weight of substitution.</p>","exp":"<p>In 5:6 Paul uses two words for what we were; over the next four verses he adds two more:</p><table><tr><th>Reference</th><th>What we were</th></tr><tr><td>5:6</td><td><b>without strength</b> (ἀσθενῶν) — no power to save ourselves</td></tr><tr><td>5:6</td><td><b>ungodly</b> (ἀσεβῶν) — not treating God as God</td></tr><tr><td>5:8</td><td><b>sinners</b> (ἁμαρτωλῶν) — missing the mark</td></tr><tr><td>5:10</td><td><b>enemies</b> (ἐχθροί) — set against God</td></tr></table><p>Four words, each heavier than the last.</p><p>It is as though Paul feared we would not take it in, so he lays them one on top of another: not merely weak, but ungodly; not merely ungodly, but sinners; not merely sinners, but <b>enemies</b>.</p><p><b>And that was when Christ died.</b></p>"},{"a":7,"z":8,"star":true,"grk":"<p>7 μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν· 8 συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεός, ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.</p>","lit":"<p>7 “For <b>scarcely</b> would anyone die for <b>a righteous man</b>; though perhaps for <b>a good man</b> someone would even <b>dare</b> to die.”</p><p>8 “But God <b>sets his own love on public display</b> toward us, in that while we were <b>still sinners</b>, Christ died for us.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>scarcely</td><td>μόλις</td><td>molis</td><td>G3433</td><td><b>barely, hardly ever</b></td></tr><tr><td>a righteous man</td><td>δίκαιος</td><td>dikaios</td><td>G1342</td><td>upright, blameless</td></tr><tr><td>a good man</td><td>ἀγαθός</td><td>agathos</td><td>G18</td><td><b>good</b> (generous; someone who has done you good)</td></tr><tr><td>perhaps… dare</td><td>τάχα… τολμᾷ</td><td>tacha, tolmaō</td><td>G5029 / G5111</td><td>perhaps someone would <b>dare</b></td></tr><tr><td>demonstrates</td><td>συνίστησιν</td><td>synistēsin</td><td>G4921</td><td>σύν + ἵστημι: <b>to set side by side, to exhibit publicly</b></td></tr></table>","gram":"<p><b>① the difference between dikaios and agathos</b></p><p>This is the interpretive key to the verse. Why does Paul use two different words?</p><table><tr><th>Word</th><th>Meaning</th><th>Your response</th></tr><tr><td><b>δίκαιος</b> (righteous)</td><td>upright, just, blameless</td><td>you <b>respect</b> him — but you may not like him</td></tr><tr><td><b>ἀγαθός</b> (good)</td><td>kind, generous, someone who has done you good</td><td>you <b>love</b> him; you are in his debt</td></tr></table><p>Paul’s ladder runs:</p><p>Die for someone who is simply <b>upright</b>? Almost nobody would.<br>Die for someone who has been <b>good to me</b>? Perhaps someone would dare.<br>Then what about dying for <b>an enemy</b>?</p><p><b>Paul does not finish that sentence. He goes straight to verse 8.</b></p><p><b>② the striking echo in synistēsin</b></p><p>We met this word in 3:5: “if our unrighteousness <b>demonstrates</b> (συνίστησιν) the righteousness of God…”</p><p><b>The same word.</b><br>Human unrighteousness “demonstrates” God’s righteousness (3:5);<br>God’s action “demonstrates” God’s love (5:8).</p><p>And συνίστημι literally means <b>“to set things side by side so they can be seen”</b> — it is an act of public display. Which echoes προέθετο in 3:25 (God set him forth publicly).</p><p><b>③ synistēsin is present tense</b></p><p>“God commends his own love toward us” — <b>present tense</b>.</p><p>The cross happened two thousand years ago (ἀπέθανεν, aorist), <b>but the display is in the present tense.</b></p><p>The cross is still standing there, proving the same thing every day.</p><p><b>④ the word order of eti hamartōlōn ontōn hēmōn</b></p><p>The Greek runs: “while <b>still sinners</b> being — we — Christ for us died.”</p><p>“Still sinners” has been thrown to the front for emphasis.</p>","exp":"<p>5:8 is one of the best-known verses in the Bible. But its force is hidden in 5:7.</p><p>Without verse 7, verse 8 is only a lovely sentence.<br>With verse 7, verse 8 lands like a hammer.</p><p>Because verse 7 first establishes <b>the ceiling of human love</b>: the very most anyone will do is die for someone who has been good to him — and even then, only “perhaps someone would dare.”</p><p>And then verse 8 says: <b>God died for his enemies.</b></p><p>The distance between those two is not a difference of degree. <b>It is a difference of kind.</b></p><p>And there is a deeper layer still:</p><p><b>God did not wait until we improved before he loved us. He paid the highest price when we were at our worst.</b></p><p>So how you are doing today <b>has nothing to do with</b> whether he loves you.<br><b>Because on the day he loved you, you were far worse than you are now.</b></p>"},{"a":9,"z":10,"star":true,"grk":"<p>9 πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι' αὐτοῦ ἀπὸ τῆς ὀργῆς. 10 εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·</p>","lit":"<p>9 “<b>How much more</b>, then — having now been justified by his blood — shall we be saved through him from the wrath.”</p><p>10 “For if, <b>while we were enemies</b>, we were <b>reconciled</b> to God through the death of his Son, <b>how much more</b>, having been reconciled, shall we be saved <b>by his life</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>much more</td><td>πολλῷ μᾶλλον</td><td>pollō mallon</td><td>G4183 / G3123</td><td>—</td><td><b>how much more</b> (argument from lesser to greater)</td><td>the heartbeat of the chapter</td></tr><tr><td>enemies</td><td>ἐχθροί</td><td>echthroi</td><td>G2190</td><td>—</td><td><b>enemies, those at war</b></td><td>not “distant” — <b>hostile</b></td></tr><tr><td>were reconciled</td><td>κατηλλάγημεν</td><td>katēllagēmen</td><td>G2644</td><td>κατά + ἀλλάσσω (to exchange)</td><td><b>were reconciled</b> (originally: exchanging currency)</td><td><b>passive</b>: not something we did</td></tr><tr><td>by his life</td><td>ἐν τῇ ζωῇ αὐτοῦ</td><td>—</td><td>G2222</td><td>—</td><td><b>in his life</b></td><td>the resurrection and his present intercession</td></tr></table>","gram":"<p><b>★ pollō mallon — the rabbinic argument from lesser to greater</b></p><p>Jewish exegesis had seven standard rules (the seven middot of Hillel), and the first is <b>qal wachomer</b> (“light and heavy”): <b>if the lesser case holds, the greater holds all the more.</b></p><p>Paul uses it twice in 5:9–10.</p><p><b>First (5:9):</b></p><pre>[THE HARD THING IS DONE] God justified us by his blood — while we were still sinners\n  ↓ how much more\n[THE EASIER THING]      would he then not save us from the wrath to come?</pre><p><b>Second (5:10):</b></p><pre>[THE HARD THING IS DONE] while enemies, reconciled by the DEATH of his Son\n  ↓ how much more\n[THE EASIER THING]      having been reconciled, saved by his LIFE</pre><p>The argument is overwhelming:</p><p><b>If God paid the life of his Son while we were his enemies — now that we are his children, what would he begrudge us?</b></p><p>(This is the advance notice of 8:32: “He who did not spare his own Son… how will he not also with him freely give us all things?”)</p><p><b>★ the contrast between “death” and “life”</b></p><p>5:10 contains a magnificent contrast that is often missed:</p><pre>through the DEATH of his Son  →  reconciled to God   [PAST]\nby his LIFE                  →  saved              [PRESENT AND FUTURE]</pre><p><b>The cross accomplished the reconciliation; the risen life accomplishes the keeping.</b></p><p>His death turned me from an enemy into a child.<br>His life keeps me a child to the very end.</p><p>That is exactly Hebrews 7:25: “he is able to save to the uttermost those who draw near to God through him, since <b>he always lives to make intercession</b> for them.”</p><p><b>★ katēllagēmen is passive</b></p><p>“We were reconciled to God” — not “we went and made peace with God,” but <b>“we were reconciled.”</b> The one who initiates reconciliation is God.</p><p>2 Corinthians 5:19: “God was in Christ reconciling the world to himself.”</p><p><b>It is not that we placated God’s an
