保罗的逻辑。而他的逻辑告诉我们一件事："],["p","如果没有第18节，第16节就不是好消息。"],["p","一个人如果不觉得自己有病，你告诉他有特效药，他只会觉得你烦。"],["p","所以我们今天要倒着走，先从第18节开始。"],["w",3],["p","那么，人到底出了什么问题？"],["p","保罗的诊断在第21节。我要说，这一节可能是整本圣经对人类问题最准确的一句话："],["q","「因为，他们虽然知道神，却不当作神荣耀他，也不感谢他。」"],["p","各位有没有注意到，这里一个具体的罪行都没有提？"],["p","没有说杀人，没有说偷窃，没有说奸淫。"],["p","保罗说：问题在两件事——不荣耀神，不感谢神。"],["p","「荣耀祂」是什么意思？圣经里「荣耀」这个字，希伯来文的字根意思是「重」。荣耀神，就是承认神在我生命里该有的份量、该有的位置。"],["p","不荣耀祂，就是把神从宝座上请下来。"],["p","「感谢祂」是什么意思？感谢，就是承认我手上的一切都是领受的，不是我挣来的。"],["p","不感谢祂，就是把自己当成源头。"],["p","弟兄姊妹，这两件事加起来，就是人类一切问题的根。"],["p","神不在宝座上，我在宝座上。"],["p","我们的旧生命，最核心的特征就是这个：以自己为中心，自己要作主，自己要作王，想要代替神。"],["p","而这不是从我们开始的。这是从伊甸园开始的。蛇对女人说了一句话，那句话成了人类历史上一切悲剧的种子："],["p","「你们便如神。」"],["p","保罗在第25节说：他们「将神的真实变为虚谎」。原文那个「虚谎」前面有一个冠词——不是随便一个谎，是那个谎言。"],["p","哪一个？就是那一个。"],["w",3],["p","接下来保罗描述这个谎言的后果，而他用了一个很重的字，重复了三次。"],["p","第23节：他们「换」——把不能朽坏之神的荣耀，换成必朽坏的人、飞禽、走兽、昆虫的形像。"],["p","第25节：他们「换」——把神的真实换成虚谎。"],["p","第26节：他们「换」——把顺性的用处换成逆性的用处。"],["p","弟兄姊妹，人生的悲剧，是一连串的「换」。"],["p","就像那位老先生，用真迹换了印刷品，还觉得自己赚到了。"],["p","原文在23节用了一组刺目的对比：不能朽坏的，换成必朽坏的。"],["p","用会烂的，换不会烂的。"],["p","这是全世界最亏本的交易，而全人类都做过。"],["p","而且你注意那个顺序：人 → 飞禽 → 走兽 → 昆虫。"],["p","一路往下。"],["p","创世记里，神造飞鸟，造走兽，造爬虫，最后照着自己的形像造人。人在最上面。"],["p","罗马书第一章，把这个顺序倒过来走了一遍。"],["p","这是圣经给我们一个严肃的提醒：你拜什么，你就变成什么。诗篇115篇说：「造他的要和他一样。」"],["p","我认识过一位父亲——这样的人其实不少。他这一辈子把「成就」放在宝座上。他很努力，真的很努力，他不是坏人，他是为了这个家。孩子小的时候，他缺席每一次生日，因为在出差；孩子中学的时候，他在饭桌上问的每一句话都是成绩；孩子大学毕业那年，他终于升上了他要的位置。"],["p","那天晚上他打电话回家，想跟儿子说这个好消息。"],["p","儿子接了，说了三句话：「喔。恭喜。我在忙。」"],["p","然后挂了。"],["p","弟兄姊妹，他得到了他放在宝座上的那样东西。他也失去了那个他原本说要为他打拚的人。"],["p","你拜什么，你就变成什么。你把什么放在宝座上，那个东西就会决定你变成什么样的人。"],["w",3],["p","接下来，我要处理这一章里最多人跳过的两节：第26、27节。"],["p","我不打算跳过。但我要先请大家看清楚保罗摆放它们的位置。"],["p","保罗在25节说：人把神的真实「换」掉了。然后26节，他用了同一个动词：他们把「顺性的用处换为逆性的用处」。"],["p","保罗在做一件事：他让你看见，当一个人在敬拜上把创造主跟受造物对调，这个对调会一路延伸到人的身体与关系。"],["p","这是他的神学论证——不是一张罪的排行榜。"],["p","我怎么知道不是排行榜？因为再往下读三节，同一份清单上还有：嫉妒、争竞、诡诈、背后说人的、狂傲的、自夸的、违背父母的、无亲情的、不怜悯人的。"],["p","弟兄姊妹，如果这份清单是排行榜，那今天早上这间屋子里——包括站在这里讲道的我——没有一个人可以坐着。"],["p","所以请不要拿第26、27节出去丢人。因为保罗在下一章第一句话，就转过身来对我们说：「你这论断人的，无论你是谁，也无可推诿。」"],["p","但我也不能把这两节从圣经里剪掉。保罗在这里确实是照着创世记一、二章男女受造的秩序在说话。我照着原样读出来，因为神的话不需要我替祂修饰。"],["p","而我要一起读出来的，是另外一段。哥林多前书第6章，保罗列了一份几乎一样的清单，然后他说了一句话："],["q","「你们中间也有人从前是这样；但如今你们奉主耶稣基督的名，并借着我们神的灵，已经洗净，成圣，称义了。」"],["p","「从前是这样。」"],["p","弟兄姊妹，福音的能力，就在这四个字里面。"],["p","这节经文里，没有一种人是无药可救的——包括你，也包括我。"],["w",3],["p","然后，保罗说了本章最可怕的一句话，而且说了三次。"],["p","第24节：「神就任凭他们。」\n第26节：「神就任凭他们。」\n第28节：「神就任凭他们。」"],["p","「任凭」这两个字，中文听起来像是「随他去吧」，好像神只是不管了。"],["p","原文重得多。"],["p","这个字在希腊文是主动语态，主词是神。它的意思是「交付、移交」。这是法庭跟军事的用语：法官把囚犯交给狱卒；将领把城交给敌人。"],["p","神不是不管，神是宣判。"],["p","请听清楚一件事，这件事很重要：神没有把罪放进他们心里。 那情欲原本就在他们心里，是他们自己要的。神所做的，是不再拦阻。"],["p","我想到一个画面。一个小孩在路边挣扎着要冲到马路中间。爸爸抓住他的手，他挣脱；再抓，再挣脱；抓了十次，喊了十次。"],["p","最后，爸爸松手了。"],["p","那一刻，不是爸爸不爱他。是爸爸终于把他交给了他自己一直坚持要的东西。"],["p","弟兄姊妹，罪最可怕的刑罚之一，就是罪本身。"],["p","「逞着心里的情欲」——他们得到了他们想要的。那就是刑罚。"],["w",3],["p","那有人会问：那些从来没听过福音的人呢？他们怎么办？"],["p","第20节说：借着所造之物，神的永能和神性是明明可知的，「叫人无可推诿」。"],["p","请注意这句话说了什么，也请注意它没有说什么。"],["p","它说受造之物让人无可推诿。它没有说受造之物能让人得救。"],["p","所以保罗才会在第15节那里拚了命地说「我情愿尽我的力量」，要去罗马，甚至还要去西班牙。"],["p","如果看看星空就够了，他何必冒这个险？"],["w",3],["p","好，我们来到第一大段的最后一节，也是整章的最后一节。"],["p","保罗把最重的一句留在这里："],["q","「他们虽知道神判定行这样事的人是当死的，然而他们不但自己去行，还喜欢别人去行。」"],["p","比犯罪更严重的，是为犯罪鼓掌。"],["p","因为犯罪的人，良心可能还会痛。但是为罪辩护、为罪鼓掌、为罪按赞、为罪推广的人，已经把良心的最后一道防线也交出去了。他不只是自己跌倒，他在建立一个让跌倒变成正常的系统。"],["p","在这个时代，「喜欢别人去行」，有时候只需要动一根手指。"],["p","弟兄姊妹，请记住这一节，记住这个字。"],["p","因为等一下，我们会回到这里。而我要告诉你的事，会让你重新认识写这封信的人。"],["w",3],["p","现在，我们暂时把这面镜子放下。"],["p","因为照镜子有一个规矩：一次只照一个人——照自己。"],["p","而照完镜子之后，我们需要的不是更用力地擦脸。"],["p","我们需要一场新的交换。"],["w",3],["h","第二大段｜神换来了义（1:16–17）"],["q","「我不以福音为耻；这福音本是神的大能，要救一切相信的，先是犹太人，后是希腊人。」"],["p","保罗在这里讲了两件事。"],["p","第一，福音是神的大能。"],["p","原文里有一个字，我想请大家听清楚：那个「是」。"],["p","保罗没有说福音「有」大能，也没有说福音「带来」大能。他说：福音就是那大能。"],["p","这句话对今天的教会很重要。"],["p","我们常常以为，人会不会信主，取决于我讲得好不好、诗歌好不好听、活动办得够不够吸引人、我的见证够不够精彩。"],["p","弟兄姊妹，那些都是器皿，不是能力。"],["p","福音本身就是神的大能。保罗亲眼见过：那个在大马色路上的人，手里拿着拘票，心里烧着怒火，一心要把教会连根拔起。是谁改变了他？不是有人辩赢了他。是那道光，是那个声音，是那位复活的主。"],["p","所以他传福音的时候不紧张。他不需要把福音包装得比较讨喜，因为他知道这东西本身有能力。"],["p","第二，神的义在这福音上显明。"],["q","「因为神的义正在这福音上显明出来；这义是本于信，以至于信。」"],["p","「神的义」这四个字，曾经是一个人心里最大的恐惧。"],["p","五百多年前，德国有一位年轻的修士，叫马丁路德。他极其敬虔，禁食、守夜、认罪认到告解神父都受不了。可是他越努力，越绝望。他晚年自己回忆说：他恨「神的义」这几个字。"],["p","为什么？因为他读成：神是公义的，所以祂要按公义刑罚我这个罪人。"],["p","那我怎么办？我怎么可能达得到？"],["p","直到有一天，他在罗马书1章17节上被光照。他忽然看见——"],["p","这义不是神向我要求的义。这义是神赐给我的义。"],["p","「这义是本于信，以至于信。」原文的意思不是「从小信到大信」，而是一种强调的重复：从头到尾，全都是信。"],["p","路德说，那一刻，他觉得自己整个人重生了，天堂的门为他敞开。"],["w",3],["p","弟兄姊妹，我想问一个很诚实的问题。"],["p","你心里是不是也有一本功过簿？"],["p","我想到一位年轻的妈妈。她跟我说过一件事。"],["p","那天晚上她累坏了，孩子不肯睡，闹了两个小时。她忍到最后忍不住，对着孩子吼了一句很难听的话。孩子哭着睡着了。"],["p","她坐在客厅，一句话都说不出来。她说：「那个时候我最想做的事就是祷告。可是我不敢。」"],["p","我问她为什么。"],["p","她说：「我今天早上才读完灵修笔记，才在群组里分享要温柔。晚上我就变成这样。我觉得神一定很失望。我想等我明天做得好一点，再来跟祂说话。」"],["p","弟兄姊妹，她那天晚上在沙发上坐了二十分钟，一句祷告都没有说。"],["p","而那二十分钟，正是她最需要神的二十分钟。"],["p","如果你也是这样——表现好的日子敢祷告，跌倒的日子躲起来——那么弟兄姊妹，你还在靠自己的义活着。"],["p","福音说的是什么？「义人必因信得生。」"],["p","保罗这句话是从旧约哈巴谷书引来的。而他引用的时候做了一件很有意思的事：他删掉了一个字。"],["p","原本那句话在不同的抄本里，有的作「义人必因我的信实存活」，有的作「我的义人必因信存活」。"],["p","保罗两个代名词都不要。 他把这句话削到只剩骨头：义人必因信得生。"],["p","为什么？因为他正要说下一句：「先是犹太人，后是希腊人。」"],["p","他不要任何一个字，把这句应许限缩成只属于某一群人的。"],["p","包括不属于那天晚上坐在沙发上的那位妈妈。"],["w",3],["p","那么「信」是什么？"],["p","哈巴谷书里「信」这个字，希伯来文的字根意思是「稳固、可靠」。我们每次祷告最后说的那句「阿们」，就是从这个字根来的。"],["p","所以信心不是一种感觉，不是「我觉得我很有把握」。"],["p","信心是把全身的重量压上去。"],["p","我打个比方。冬天过河，冰面看起来很薄，你战战兢兢地走上去，每一步都在发抖，心里想着会不会裂。可是如果那块冰有一公尺厚，你颤抖着走过去，还是会平安到对岸。"],["p","反过来，如果冰只有一公分，你信心满满、大步向前，一样掉下去。"],["p","救你的从来不是你信心的强度，是你脚下那块冰的厚度。"],["p","我们脚下那块冰，是耶稣基督和祂在十字架上完成的工作。"],["p","所以请听清楚：你跌倒的时候，不是等自己够好了才回来，而是立刻回来。因为义人是因信得生，不是因表现得生。"],["p","弟兄姊妹，我们一生要换掉的最重要的一个观念，就是这个。"],["p","不是问：「我觉得我够不够好？」\n是问：「神的话怎么说我？」"],["p","这一句换掉，你整个人生就换了。"],["w",3],["h","第三大段｜福音换了一个人（1:1–15）"],["p","现在我们回到这一章的第一节。"],["p","一封信的开头，是自我介绍。而人在自我介绍的时候，最容易泄漏他心里最看重的东西。"],["q","「耶稣基督的仆人保罗，奉召为使徒，特派传神的福音。」"],["p","保罗用了三个词。"],["p","第一个，「仆人」。希腊文这个字不是「员工」，不是「帮手」，是奴隶。在罗马社会，这是最底层的身分——奴隶没有自主权，没有财产，连他自己都不属于自己。"],["p","一个罗马公民、受过最高等教育的法利赛人，把「奴隶」放在自己名字后面的第一个位置。"],["p","第二个，「奉召」。被叫来的。不是他报名的，是有人点了他的名。"],["p","第三个，「特派」。这个字的意思是「已经被分别出来，而且一直是这个状态」。"],["p","弟兄姊妹，请注意一件事：这三个都是被动的。"],["p","被买下、被呼召、被分别。"],["p","保罗没有一句话说「我选择了福音」「我决定献身」「我立志传道」。他从头到尾都在说：我是被抓住的。"],["p","我们今天很喜欢问一个问题：「我要为神做什么？」"],["p","这问题不坏，但它不是第一个问题。"],["p","保罗告诉我们，第一个问题是：我是谁的？"],["w",3],["p","大家有没有想过，为什么那么多人服事到最后又累又苦？"],["p","教会里有一种人，做得很多，却越做越没有喜乐；他能讲很多真理，却在家里跟配偶说不上三句话；他能带查经，却不能忍受别人比他被看重。"],["p","问题出在哪里？次序倒了。"],["p","你看保罗这一章的顺序。第1到7节，他讲他是谁、他属于谁。第8到15节，他讲关系——他为他们感谢神、他不住地为他们祷告、他切切地想见他们。一直要到第15节，他才说：「所以情愿尽我的力量，将福音也传给你们。」"],["p","先生命，再关系，后事工。保罗没有搞错。"],["p","我们常常倒过来——先冲去做，做完才发现生命是空的。"],["w",3],["p","而在「关系」这一段里，有一节经文我每次读都很受感动。"],["p","第11节，保罗说：「我切切地想见你们，要把些属灵的恩赐分给你们，使你们可以坚固。」"],["p","听起来很正常对不对？大使徒要去造就小教会。"],["p","可是第12节，他忽然改口了。"],["q","「这样，我在你们中间，因你与我彼此的信心，就可以同得安慰。」"],["p","原文的动词是被动的——「一同被安慰」。这个字在整本新约只出现这一次。"],["p","弟兄姊妹，保罗讲到一半，把自己拉下来了。"],["p","他本来说「我要给你们」，然后马上补一句：「不对，应该说，是我们彼此。」"],["p","一个真正被福音抓住的人，不会站在高处施舍。他知道自己也需要被安慰，也需要弟兄姊妹的信心来扶持。"],["p","还有第14节，更惊人："],["q","「无论是希腊人、化外人、聪明人、愚拙人，我都欠他们的债。」"],["p","停一下。欠债？"],["p","一般人的心态是：我把福音传给你，是我帮了你，你该感谢我。"],["p","保罗倒过来说：在我把福音给你之前，我就是欠你的。"],["p","为什么？因为第5节说了：「我们从他受了恩惠并使徒的职分。」"],["p","因为他先领受了，所以他欠债。"],["p","一个真正尝过恩典的人，看见还没信主的亲人、还在挣扎的同事、那个一直让你受不了的邻居——他心里不会是「我比你好」，会是「我欠你的」。"],["p","而且请注意保罗欠债的名单里有谁：「化外人、愚拙人」。这是当时罗马社会最看不起的两种人。"],["p","福音的债，没有阶级。"],["w",3],["p","弟兄姊妹，现在我要回到第一大段留下的那个伏笔。"],["p","还记得第32节吗？「他们不但自己去行，还喜欢别人去行。」"],["p","「喜欢」这个字，原文是一个很特别的字。"],["p","而在使徒行传第8章第1节，圣经写着一句话。那是司提反被石头打死的那一天。经文说："],["q","「扫罗也喜悦他被害。」"],["p","用的是同一个字。"],["p","弟兄姊妹，你听见了吗？"],["p","保罗在罗马书第一章的最后一句，写下人类最深的罪——为别人的罪鼓掌。"],["p","而他是在写他自己。"],["p","他就是那个站在司提反的血旁边，看着石头一颗一颗落下，心里说「打得好」的人。"],["p","他知道，那个「无可推诿」的人里面，第一个就是他。"],["p","而这样的一个人，蒙了怜悯。"],["w",3],["p","所以现在你明白了。"],["p","保罗为什么敢说「我不以福音为耻」？"],["p","不是因为他脾气硬，不是因为他神学好，不是因为他口才强。"],["p","是因为他自己就是那个被换掉的人。"],["p","那个为司提反之死鼓掌的人，成了说「我欠一切人的债」的人。\n那个押着基督徒进监牢的人，成了为教会坐监的人。\n那个要灭绝这个名的人，成了说「为他的名」的人。"],["p","福音有没有能力？最好的证据不是一套论证。是一个被换掉的人。"],["p","而那个人，两千年前写下了这封信。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三场交换。"],["p","第一场：人换掉了神。 用会烂的，换不会烂的。\n第二场：神换来了义。 白白地，本于信。\n第三场：福音换了一个人。 那个人叫保罗。"],["p","现在我要把整章收在一个地方。"],["p","罗马书1章24节说：神「交付」了人。三次。人被交给自己的罪。"],["p","可是同一个字，在罗马书8章32节又出现了一次："],["q","「神既不爱惜自己的儿子，为我们众人舍了他。」"],["p","「舍了」——原文就是那个「交付」。"],["p","弟兄姊妹，你听见了吗？"],["p","第一章：神把人交付给罪。\n第八章：神把自己的儿子交付给十字架。"],["w",3],["p","我想请大家跟我一起，安静地走到一个地方。"],["p","那是一个橄榄园，在半夜。"],["p","有一个人跪在地上。祂从永远到永远，从来没有一刻失去与父的交通。祂一生说「我常做父所喜悦的事」，说「我在地上已经荣耀你」。"],["p","那天晚上，祂说了一句话：「我心里甚是忧伤，几乎要死。」"],["p","祂的汗，像大血点滴在地上。"],["p","祂说：「父啊，倘若可行，求你叫这杯离开我。」"],["p","杯里是什么？"],["p","杯里是罗马书第一章。"],["p","杯里是那三次「任凭」，是那份清单，是那被压在不义底下的真理，是全人类换掉神所欠下的一切。"],["w",3],["p","然后是第二天中午。天黑了三个小时。"],["p","在那片黑暗里，祂喊了一声："],["p","「我的神，我的神，为什么离弃我？」"],["p","弟兄姊妹，那一刻，父神转过脸去。那一刻，儿子真正被「交付」了。"],["p","祂承受了那本该落在我们身上的「任凭」。"],["p","为什么？为了让那些本该被交付的人，可以被接回来。"],["w",3],["p","所以今天，我想请大家安静地回到我一开始问的那个问题。"],["p","如果失去某一样东西，你的人生就会崩塌——那是什么？"],["p","你想到的那个东西，不一定是坏的。它可能很好、很美、很值得珍惜——你的孩子、你的健康、你的事业、你在别人眼中的样子。"],["p","但如果它坐在宝座上，它就成了偶像。"],["p","而我还想问第二个问题：你还在感谢吗？"],["p","罗马书1章21节说，人类堕落的起点，就是「不感谢」。"],["p","感谢是属灵生命最灵敏的仪表。一个不再感谢的人，通常已经开始觉得一切都是自己挣来的。"],["p","你上一次真心说「主啊，谢谢你」，是为了一件顺利的事，还是为了神自己？"],["w",3],["p","弟兄姊妹，在结束以前，我要说明一件事，免得有人误会。"],["p","我们常说「无己」，说「不再是我」。"],["p","「无己」不是说你要变成一个没有想法、没有感觉、没有价值、任人践踏的人。 那不是圣经。圣经说你是照着神的形像被造的，是主用祂的血买来的，是神所爱、奉召作圣徒的人。"],["p","「无己」的意思是：我不再坐在生命的宝座上。"],["p","不是消灭这个人，是换掉这个王。"],["p","而这正是保罗说的那句话："],["q","「我已经与基督同钉十字架，现在活着的不再是我，乃是基督在我里面活着。」"],["p","所以福音不是叫我们靠自己把旧生命修得好一点。"],["p","福音是让那个要作王的旧我与基督同死，好让基督的新生命在我们里面活出来。"],["w",3],["p","弟兄姊妹，人把神换掉了。"],["p","神却把祂的儿子换给了我们。"],["p","那位老先生把真迹换成了印刷品，换不回来了。"],["p","可是我们的神，把我们亲手换掉的，亲自买了回来。"],["p","用祂儿子的血。"],["p","所以今天，我们可以跟两千年前那个人一起说："],["p","我不以福音为耻。因为这福音本是神的大能，要救一切相信的。"],["p","我们一起低头祷告。"],["w",3],["p","祷告："],["p","主啊，我们来到你面前，承认你所说的是真的。"],["p","我们知道你，却常常不把你当作神来荣耀你、感谢你。我们把不能朽坏的荣耀，换成了会朽坏的东西，还以为自己很聪明。"],["p","主啊，求你今天光照我们，让我们看见自己宝座上坐的，到底是谁。"],["p","谢谢你，你没有任凭我们到底。你把你的独生爱子交付了，替我们喝了那一杯，承受了那本该落在我们身上的审判。"],["p","主耶稣，我今天愿意从宝座上下来。求你坐上去，在我心里作王。"],["p","求圣灵帮助我，不是靠自己努力做一个好人，而是让你在我里面活出你的生命。"],["p","愿一切的荣耀，都归给你，直到永远。"],["p","奉主耶稣基督的名祷告，阿们。"],["w",3]]},"2":{"min":35,"blocks":[["h","那把尺，会转过来"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","我想先请大家做一件事——不用举手，只在心里做就好。"],["p","请你想一个人。"],["p","一个最近让你摇过头的人。可能是家里的人，可能是教会的人，也可能是一个你根本不认识、只是在网络上看到他发言的人。"],["p","想到了吗？"],["p","好，先把他放在心里，我们待会儿还会用到。"],["w",3],["p","我要先讲一件事。"],["p","我在牧养中遇过这样的人——其实不只一个。"],["p","一位弟兄，非常火热，聚会从不缺席，圣经读得比谁都熟。他有一项恩赐特别强——看见别人的问题。"],["p","他常常说：「我们教会那位长老，祷告太形式化了。」\n「那位讲员，只有头脑没有生命。」\n「那个弟兄的奉献，是做给人看的。」"],["p","他每一句话，都说对了。"],["p","直到有一天，一位年长的姊妹对他说了一句话。她说："],["q","「弟兄，神给了你一双很锐利的眼睛。可惜这双眼睛，一次都没有往里面看过。」"],["p","那天晚上，他一个人在房间里跪了很久。"],["p","后来他跟我说了一句话，我一直记到今天："],["q","「我一生最痛的一刻，是我发现——我最看不起的那些人身上的东西，我身上全部都有，只是我藏得比较好。」"],["w",3],["p","弟兄姊妹，今天我们要读的罗马书第二章，讲的就是这件事。"],["p","而我要先提醒大家：这一章不是讲给坏人听的。"],["p","罗马书第一章讲坏人——讲拜偶像的、讲道德败坏的、讲各样的罪。罗马书第一章读完，我们心里都会有一句话："],["p","「阿们，这些人真的该罚。」"],["p","而保罗写第二章的第一句话，就是接着那一句「阿们」写的："],["q","「你这论断人的，无论你是谁，也无可推诿。」（罗2:1）"],["p","保罗的意思是：你刚才那句『阿们』，就是你的判决书。"],["w",3],["p","所以我今天要讲三样东西："],["p","第一，一把尺。\n第二，一本帐。\n第三，一把刀。"],["w",3],["h","第一大段｜那把尺，会转过来（2:1–11）"],["p","请我们一起看罗马书2章1到3节："],["q","「你这论断人的，无论你是谁，也无可推诿。你在什么事上论断人，就在什么事上定自己的罪；因你这论断人的，自己所行却和别人一样。我们知道这样行的人，神必照真理审判他。你这人哪，你论断行这事的人，自己所行的却和别人一样，你以为能逃脱神的审判吗？」"],["h","原文的第一道亮光：同一把刀，砍两边"],["p","这里有一个字，中文看不出来，但它是保罗整个论证的关键。"],["p","「无可推诿」，希腊文是 ἀναπολόγητος。"],["p","这是一个法庭用语。它的字面意思是：「没有辩词」。就是那种——被告站起来，法官说「你有什么话要说」，他站在那里，一句话都说不出来。"],["p","而这个字，保罗在罗马书里总共只用了两次。"],["p","第一次是1章20节，用来形容那些拜偶像的外邦人：「叫人无可推诿。」"],["p","第二次就是2章1节，用来形容——你。那个正在读第一章、正在点头说阿们的你。"],["p","弟兄姊妹，你看见保罗在做什么吗？"],["p","他拿同一把刀，先砍了外邦人一刀，然后转过身来，砍了我们一刀。"],["h","那把尺为什么会转过来？"],["p","有人可能说：牧师，我指出别人的错，难道错了吗？"],["p","我们先把这件事讲清楚，因为这节经文常常被误用。"],["p","保罗在这里并没有说「不可以分辨是非」。"],["p","证据就在同一章：保罗自己在2章21到23节，把那些人指得非常尖锐：「你讲说人不可偷窃，自己还偷窃吗？你说人不可奸淫，自己还奸淫吗？」"],["p","所以问题不在于「有标准」。问题在于——你有没有站在同一个标准底下。"],["p","你看第1节后半句："],["q","「因你这论断人的，自己所行却和别人一样。」"],["p","问题不是你举起了尺。问题是你举起尺量别人的时候，你把自己排除在外了。"],["p","而保罗说：这是不可能的。 因为那把尺——它会转过来。"],["h","一个现在式的震撼"],["p","这里有第二道原文的亮光，非常重要。"],["p","「就在什么事上定自己的罪」——「定罪」这个字 κατακρίνεις，是现在式。"],["p","弟兄姊妹，注意这个时态。"],["p","保罗没有说：「你将来会因此被定罪。」\n保罗说的是：「你此刻，正在定你自己的罪。」"],["p","当你举起手指的那一刻，判决书上已经签了你的名字。"],["p","不用等到末日。就在你心里冒出那句话的那一秒钟，法庭已经开庭了，而被告是你。"],["h","它在生活里长什么样子"],["p","我们今天很少用「论断」这两个字。但我们每天都在做。"],["p","它常常长得很有道理。"],["p","- 「我不是在批评他，我只是觉得他这样做不太合适。」\n- 「我只是替他担心。」\n- 「我是为他祷告才说的。」"],["p","它甚至长得很属灵。"],["p","我服事这么多年，跟你们说一句实话：教会里最尖锐的论断，常常不是用刻薄的话说出来的，是用祷告的语气说出来的。"],["p","「主啊，求祢怜悯某某弟兄，他真的很需要祢的光照……」"],["p","——这句话有时候是真的代祷。有时候，它是一份加了糖的判决书。"],["h","神的法庭没有VIP通道"],["p","我们再往下看，第11节。这是第一段的钥匙："],["q","「因为神不偏待人。」（罗2:11）"],["p","「偏待人」这个希腊字 προσωπολημψία，非常有意思。它是希腊文里几乎不存在的一个怪字——因为它是保罗从希伯来文直接造出来的。"],["p","希伯来文有一个成语，字面是「举起脸」。"],["p","古代的法庭，权贵走进来，法官会把头擡起来，看着他的脸——那是给面子的意思。有钱人来了，擡头；穷人来了，低头看卷宗。"],["p","保罗说：在神那里，没有这回事。"],["p","弟兄姊妹，这句话有两面刀锋。"],["p","一面对着自认高的人说： 你的资历、你的头衔、你信主多少年、你在教会坐哪一排——在神的法庭上，一律不看。"],["p","另一面对着自认低的人说： 你的出身、你的过去、你的失败、你的软弱——在神的法庭上，也一律不看。"],["p","正因为神不偏待人，恩典才能给所有人。"],["h","焦点在耶稣"],["p","弟兄姊妹，我们现在要把眼睛从自己身上、从别人身上，转到耶稣身上。"],["p","我要讲一个大家都很熟的故事，但我想请你今天用罗马书第二章的眼睛来看它。"],["p","约翰福音第八章。一个妇人，行淫的时候被抓，被拖到圣殿的院子里。四围站满了人，每个人手里都有一块石头。"],["p","律法没有错。她确实犯了罪。那些人手里的尺，量得没有错。"],["p","问题是——他们每一个人，都把自己排除在那把尺之外了。"],["p","然后耶稣弯下腰，在地上写字。"],["p","祂写了什么，圣经没有说。但祂站起来的时候，说了一句话："],["q","「你们中间谁是没有罪的，谁就可以先拿石头打她。」（约8:7）"],["p","这一句话，就是罗马书2章1节。"],["p","圣经说，他们从老到少，一个一个都出去了。"],["p","而最后，只剩下耶稣和那个妇人。"],["p","弟兄姊妹，你有没有注意到——在那个院子里，只剩下一个人手上是可以拿石头的。"],["p","只有一位是完全没有罪的。\n只有一位真的有资格。\n只有耶稣可以丢那第一块石头。"],["p","而祂没有丢。"],["p","祂说：「我也不定你的罪。去吧，从此不要再犯罪了！」"],["p","祂没有废掉律法——祂说「不要再犯罪」。\n祂也没有加入论断——祂说「我也不定你的罪」。"],["p","那唯一有资格丢石头的那一位，最后选择了——为那个妇人被丢石头。"],["p","那把尺，确实转过来了。"],["p","但它先落在了耶稣身上。"],["h","第一段的应用"],["p","弟兄姊妹，还记得我一开始请你想的那个人吗？"],["p","我现在请你问自己三个问题："],["p","第一，我在他身上看见的那个问题，我自己身上有没有一个藏得比较好的版本？"],["p","第二，神对我的忍耐有多长？我对他的忍耐有多长？"],["p","第三，如果神照我论断他的标准来论断我，我还站得住吗？"],["p","我要教大家一个很简单的操练，叫做「三秒钟的停顿」。"],["p","当你心里那句判决句要成形的时候——停三秒。"],["p","在那三秒里，把那句话翻译成一句祷告。"],["p","从「他怎么会这样」变成「主啊，祢知道他的难处」。\n从「这个人真的不行」变成「主啊，祢当初也是这样忍耐我的」。"],["p","三秒钟，就是从审判席上走下来所需要的时间。"],["w",3],["h","第二大段｜那本帐，天天在记（2:4–5、12–24）"],["p","我们来看第4节和第5节。这两节是全章最温柔的，也是全章最可怕的。"],["q","「还是你藐视他丰富的恩慈、宽容、忍耐，不晓得他的恩慈是领你悔改呢？你竟任着你刚硬不悔改的心，为自己积蓄忿怒，以致神震怒，显他公义审判的日子来到。」（罗2:4–5）"],["h","那条很长的引线"],["p","第4节有三个字，都在讲神。我要特别讲其中一个。"],["p","「忍耐」，希腊文 μακροθυμία。"],["p","这个字是两个字组成的：μακρός 是「长」，θυμός 是「怒气」。"],["p","合起来就是：怒气的引线很长。"],["p","而这个希腊字，是旧约希腊文译本用来翻译一个希伯来成语的——那个成语的字面意思是「长鼻子」。"],["p","希伯来人形容一个人发怒，说他「鼻子热起来了」。所以「长鼻子」的意思就是——从冷到热，要走很长一段路。"],["p","这句话第一次出现在哪里？出埃及记34章6节。"],["p","摩西在西奈山上，求神说「求祢显出祢的荣耀给我看」，然后神从他面前经过，宣告自己的名："],["q","「耶和华，耶和华，是有怜悯有恩典的神，不轻易发怒，并有丰盛的慈爱和诚实。」"],["p","弟兄姊妹，这是神自己介绍自己的方式。"],["p","神说我的名是什么？不轻易发怒。长引线。"],["h","一个现在进行式"],["p","现在请注意第4节这句话："],["q","「神的恩慈是领你悔改。」"],["p","「领」这个字 ἄγει，也是现在式。"],["p","保罗没有说「神的恩慈曾经领过你」。\n保罗也没有说「神的恩慈将来会领你」。"],["p","保罗说：神的恩慈，此时此刻，正在牵着你的手，往悔改的方向走。"],["p","弟兄姊妹，我要问一个很个人的问题："],["p","你有没有一件事，是你到现在都还没有付上代价的？"],["p","一个习惯、一个关系、一笔帐、一句话、一个你一直以为神没看见的角落。"],["p","而因为到现在都没事，你就慢慢地、不知不觉地，得出一个结论："],["p","「应该没关系吧。」"],["p","保罗说：你把救生索当成了通行证。"],["p","「藐视」这个字，字面意思是「往下看」。"],["p","多么讽刺——一个站在恩典上面的人，竟然低下头，看不起那块托住他的地板。"],["h","两本帐"],["p","第4节讲神的帐，第5节讲你的帐。这两节是一组对照。"],["p","第4节说：神有「丰富的」恩慈——原文是 πλοῦτος，财富、丰盛。"],["p","第5节说：你在「积蓄」忿怒——原文是 θησαυρίζεις。"],["p","弟兄姊妹，你知道这个字在圣经里最有名的用法在哪里吗？"],["p","马太福音6章20节，主耶稣说：「只要积儹财宝在天上。」"],["p","同一个字。"],["p","保罗在说：你确实在存。你每一天都在往一个户头里存东西。只是你存的不是财宝，是忿怒。"],["p","而且原文还加了两个字：「为你自己」。"],["p","没有人强迫你。是你自己，一天一天，亲手存进去的。"],["p","弟兄姊妹，这改变了我对「今天」的看法。"],["p","原来今天不是中性的。"],["p","原来每一天，都有两本帐同时在记："],["p","- 神那边，记的是恩慈——祂今天又忍耐了我一天\n- 我这边，如果不悔改，记的是——又一天"],["p","你活着的每一天，都是入帐的一天。"],["h","为什么知道那么多，却改变那么少？"],["p","我们往下看，第13节："],["q","「原来在神面前，不是听律法的为义，乃是行律法的称义。」"],["p","「听的人」，希腊文 ἀκροατής。"],["p","这个字在当时的希腊世界，指的是剧场或讲堂里的观众。"],["p","你买了票，坐下来，听一场精彩的演讲，听到感动的地方鼓掌，听完站起来，回家。"],["p","保罗说：你可以一辈子当神话语的观众。"],["p","弟兄姊妹，我要对我自己，也对每一位在讲台上、在小组里、在主日学里服事的人说一段最扎心的话。"],["p","保罗在第21节说："],["q","「你既是教导别人，还不教导自己吗？」"],["p","而21节那个「讲说」，希腊文 κηρύσσων——这就是「传道」的那个字。"],["p","保罗在罗马书第二章点名的，不是一般会众。是教导的人、传讲的人、属灵领袖。"],["p","- 我讲「不可偷窃」——我有没有偷过神的时间？偷过别人的功劳？偷过本该归给神的荣耀？\n- 我讲「不可奸淫」——我的眼睛呢？我的手机呢？我一个人的时候呢？\n- 我说我「厌恶偶像」——那我的偶像叫什么名字？是不是叫做「事工成果」？叫做「别人的肯定」？叫做「我的影响力」？"],["h","最可怕的一节"],["p","然后保罗写下了整章最可怕的一句话。第24节："],["q","「神的名在外邦人中，因你们受了亵渎。」"],["p","「亵渎」这个字，是现在被动式——「正在被亵渎」。"],["p","弟兄姊妹，主耶稣教我们的祷告，第一句是什么？"],["q","「愿人都尊你的名为圣。」"],["p","罗马书2章24节，就是这句祷告彻底崩坏的样子。"],["p","而崩坏的原因是什么？"],["p","不是因为逼迫。不是因为政权。不是因为无神论的书写得太好。"],["p","是因为神的子民自己的生命。"],["p","我常常在想这件事。今天很多人不信主，不是因为他们读了什么书。"],["p","很多时候，是因为他们认识一个基督徒。"],["q","但这里我要加一句话，免得有人听了回去自责一辈子：你要为你的生命负责，你不必为别人的心负责。 保罗在第一章已经说得很清楚：外邦人自己也是无可推诿的。神要我们作的，是不要成为别人的绊脚石；不是要我们背起别人不信的责任。"],["h","福音：那本帐，有人结清了"],["p","弟兄姊妹，讲到这里，如果福音只到这里，我们今天就只能绝望地回家。"],["p","但感谢神——保罗在第5节说「积蓄忿怒」，他在第3章25节说："],["q","「神设立耶稣作挽回祭。」"],["p","「挽回祭」的意思是：承受忿怒的那一位。"],["p","弟兄姊妹，客西马尼园里，耶稣跪在地上，汗珠如大血点滴在地上，祂说："],["q","「我父啊，倘若可行，求你叫这杯离开我。」（太26:39）"],["p","那是什么杯？"],["p","旧约先知一再说到「忿怒的杯」（赛51:17；耶25:15）。"],["p","那本帐——你的、我的、几千年来所有人的——都在那个杯里。"],["p","而耶稣在十字架上，把它喝干了。"],["p","祂没有喝一半。祂没有留一口。"],["p","祂喝到最后一滴，然后说："],["q","「成了。」（约19:30）"],["p","那句话的希腊文是 τετέλεσται。这个字在当时的商业文书上，是盖在收据上的一个字，意思是——"],["p","「付清了。」"],["h","第二段的应用"],["p","弟兄姊妹，我要请你今天晚上，安静十分钟。"],["p","不要开电视，不要滑手机。就十分钟。"],["p","然后在纸上写一件事——一件你知道该处理、却一直没有处理的事。"],["p","写完之后，对神说一句话："],["q","「主啊，我一直以为祢的沉默是不介意。今天我知道了——祢是在等我。」"],["p","然后这个礼拜，去处理它。"],["p","不要等下一次培灵会。不要等你觉得准备好了。"],["p","因为那条引线虽然很长，但它是有尽头的。"],["w",3],["h","第三大段｜那一刀，只有神能动（2:25–29）"],["p","我们来看全章的最后两节。这是保罗整整两章的黑暗之后，射进来的第一道光。"],["q","「因为外面作犹太人的，不是真犹太人；外面肉身的割礼，也不是真割礼。惟有里面作的，才是真犹太人；真割礼也是心里的，在乎灵，不在乎仪文。这人的称赞不是从人来的，乃是从神来的。」（罗2:28–29）"],["h","最美的一个文字游戏"],["p","弟兄姊妹，我要跟大家分享罗马书第二章最美的一道原文亮光。这一道光，在中文圣经里完全看不见。"],["p","「犹太人」这个字，来自「犹大」，而「犹大」来自希伯来文 Yehudah。"],["p","「犹大」这个名字是什么意思？"],["p","创世记29章35节，利亚生第四个儿子的时候说："],["q","「这回我要赞美耶和华。」因此给他起名叫犹大。"],["p","「犹大」的意思，就是「赞美」、「称赞」。"],["p","现在请你再看罗马书2章29节的最后一句："],["q","「这人的称赞，不是从人来的，乃是从神来的。」"],["p","弟兄姊妹，你看见保罗在做什么吗？"],["p","他在说：「真正的『称赞人』，是那个称赞从神来的人。」"],["p","一个横跨两千年、横跨希伯来文与希腊文的绝妙双关。"],["p","保罗重新定义了「属神的人」——不是靠血统，不是靠记号，而是：你要谁的掌声？"],["h","你要谁的掌声？"],["p","弟兄姊妹，这是全章最深的一个问题。"],["p","我们每个人都有一套「属灵履历」："],["p","- 我信主几年了\n- 我什么时候受洗的\n- 我在哪个教会、跟过哪个牧者\n- 我服事什么、读过什么书、参加过什么特会"],["p","这些都是好东西。就像割礼——保罗说得很清楚，「割礼固然于你有益」（2:25）。"],["p","但保罗说：记号永远不能取代它所指向的实体。"],["p","一张没有存款的提款卡。\n一枚戴在从未爱过对方的人手上的婚戒。\n一本签了名，却从来没有翻开过的圣经。"],["h","神在暗中动的那一刀"],["p","现在我要讲今天最重要的一件事。"],["p","保罗说「真割礼是心里的」——这句话不是他发明的。"],["p","翻回旧约，申命记10章16节，摩西对以色列人说："],["q","「所以你们要将心里的污秽除掉。」"],["p","原文的动词就是「行割礼」。摩西说：你们要为自己的心行割礼。"],["p","耶利米书4章4节，先知也说：「你们当自行割礼。」"],["p","神吩咐了一千多年。"],["p","结果呢？"],["p","做不到。"],["p","弟兄姊妹，这就是旧约最深的痛。神吩咐人给自己的心动刀，但人根本切不到自己的心。"],["p","你可以改行为。你可以戒掉一个习惯。你可以立志、可以下决心、可以早起读经、可以认真祷告。"],["p","但你切不到你的心。"],["p","你可以教别人——保罗第21节就说了——你可以教别人，却教不了自己。"],["p","那怎么办？"],["p","请听申命记30章6节。这是整本旧约最温柔的一节之一："],["q","「耶和华你神必将你心里和你后裔心里的污秽除掉，好叫你尽心尽性爱耶和华你的神。」"],["p","你听见主词的改变了吗？"],["p","申命记10章：「你们要将心里的污秽除掉。」——你动刀。\n申命记30章：「耶和华你神必将你心里的污秽除掉。」——神动刀。"],["p","神说：你做不到。所以我来。"],["p","再听以西结书36章26到27节："],["q","「我也要赐给你们一个新心，将新灵放在你们里面……我必将我的灵放在你们里面，使你们顺从我的律例。」"],["p","这就是为什么保罗在罗马书2章29节说："],["q","「真割礼也是心里的，在乎灵，不在乎仪文。」"],["p","「灵」——就是圣灵。"],["p","神在等的那一天到了。祂自己来动这一刀。"],["h","但这一刀，是怎么动的？"],["p","弟兄姊妹，我们最后要看一节经文。歌罗西书2章11节："],["q","「你们在祂里面也受了不是人手所行的割礼，乃是基督使你们脱去肉体情欲的割礼。」"],["p","「不是人手所行的割礼。」"],["p","我要问一个问题：神要在我的心上动刀——那把刀，落在哪里？"],["p","那把刀，先落在耶稣身上。"],["p","十字架上，那个身体被切割。\n荆棘冠冕刺进祂的头。\n钉子穿过祂的手和脚。\n枪尖刺入祂的肋旁。"],["p","那是那一场真正的、终极的割礼。"],["p","祂的身体被切割，好叫我的心可以被割礼。"],["p","而还有更深的一层。"],["p","罗马书2章11节说「神不偏待人」——原文是「神不举起脸」。"],["p","弟兄姊妹，你知道神的「不偏待人」，最极致的展现在哪里吗？"],["p","是在各各他。"],["p","那一天，天昏地暗。而那个从创世以前就与父同在的儿子，喊出了一句话："],["q","「我的神！我的神！为什么离弃我？」（太27:46）"],["p","父没有举起脸。"],["p","「神既不爱惜自己的儿子，为我们众人舍了」（罗8:32）——这就是「不偏待人」最沉重、也最荣耀的证明。"],["p","祂被父弃绝，好叫我可以得神的称赞。"],["p","祂在暗中承受了审判，好叫我在暗中得著称赞。"],["p","弟兄姊妹，你注意到了吗——罗马书2章16节说神审判「隐秘事」，2章29节说神称赞「隐藏处的人」。"],["p","神审判的地方，和神称赞的地方，是同一个地方——你的心。"],["p","而基督已经在那个地方，替你受了审判，好叫你可以在那个地方，得著称赞。"],["h","第三段的应用"],["p","弟兄姊妹，我今天最后要请大家做一个祷告。"],["p","我要请你先放下一件事——放下你想自己修好自己的努力。"],["p","我们太习惯了。听完一篇道，我们的反应是：「好，我这礼拜要更努力。」"],["p","但罗马书第二章告诉我们：那条路，走了一千五百年，走不通。"],["p","所以今天的祷告不是「主啊，我要更努力」。"],["p","今天的祷告是："],["q","「主啊，我不求祢修好我的行为。我求祢在我心里动刀。祢动哪里，我都不缩手。」"],["p","这是无己的祷告。"],["p","我要在这里把「无己」讲清楚，免得有弟兄姊妹、特别是今天第一次来的朋友听错了。"],["p","「无己」不是说你没有价值。 恰恰相反——罗马书2章29节说，你有从神来的称赞，那是全宇宙最高的价值。"],["p","「无己」不是说你没有想法、没有感受、要被人踩在脚下。"],["p","「无己」是说：我不再坐在生命的宝座上。我让耶稣作王。"],["p","保罗在加拉太书2章20节说得最清楚："],["q","「我已经与基督同钉十字架，现在活着的不再是我，乃是基督在我里面活着。」"],["p","心的割礼，就是那个要坐上审判席的旧我，被带到十字架上处理。"],["p","而奇妙的事会发生。"],["p","当基督在我里面作王之后——"],["p","我不再需要靠论断别人，来确认我是好的。\n我也不再需要靠人的称赞，来确认我有价值。"],["p","因为我已经有了那从神来的称赞。"],["p","这，就是自由。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天走了很长的一段路。"],["p","罗马书第二章是一章很不舒服的经文。它从头到尾都在拆我们的东西。"],["p","它拆掉了我们的道德优越感（2:1）。\n它拆掉了我们对神沉默的误读（2:4）。\n它拆掉了我们的属灵履历（2:28）。"],["p","但它拆，是为了要建。"],["p","因为在所有的东西都被拆光之后，第29节站出来说："],["q","「这人的称赞，不是从人来的，乃是从神来的。」"],["p","弟兄姊妹，这是好消息。"],["p","因为从人来的称赞，你永远追不够。\n你多做一点，他们鼓掌；你少做一点，他们就走了。\n你今天被称赞，明天就得再赚一次。"],["p","但从神来的称赞，是十字架上一次买断的。"],["w",3],["p","我最后要说三句话。"],["p","第一句：那把尺，确实会转过来。"],["p","但弟兄姊妹，它已经转过来了。它落在了耶稣身上。"],["p","所以你今天不用再拿着它到处量人。你可以放下它了。"],["p","第二句：那本帐，确实天天在记。"],["p","但弟兄姊妹，有一个人已经走到收银台前，把单子拿过去，说：「算在我帐上。」"],["p","然后祂在十字架上说：「成了。付清了。」"],["p","第三句：那一刀，确实只有神能动。"],["p","而弟兄姊妹，祂愿意动。祂一直在等你说一句话："],["p","「主啊，来吧。」"],["w",3],["p","弟兄姊妹，今天我们的问题，不是我们知道得不够多。"],["p","我们的问题是——我们知道，但我们没有让那些知道，进到心里去。"],["p","保罗说：「不是听律法的为义，乃是行律法的称义。」（2:13）"],["p","所以今天讲完了，不要只是说「这篇道很好」。"],["p","求主让我们不只是坐在剧场里的观众。"],["p","愿神今天在我们每一个人心里，亲自动那一刀。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，发现我们手里一直拿着一把尺。我们用它量了很多人，却从来没有量过自己。主啊，赦免我们。\n\n我们也承认，祢的忍耐，我们常常读成祢的默许。有些事我们拖了很久，我们以为没事了。主啊，今天我们知道了——祢是在等我们。 谢谢祢等我们。\n\n主啊，我们不求祢修好我们的行为。我们求祢，在我们心里动刀。祢动哪里，我们都不缩手。\n\n因为我们知道，那把刀，已经先落在祢身上了。祢的身体为我们被切割，好叫我们的心可以被割礼。祢被父弃绝，好叫我们可以得祢的称赞。\n\n主啊，从今天起，我们不要人的掌声。我们只要祢的一句：「好，你这又良善又忠心的仆人。」\n\n愿我们的生命，不再叫祢的名被亵渎，乃叫祢的名被尊为圣。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"3":{"min":35,"blocks":[["h","但如今"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","我要先请大家听一句话。这句话很短，只有三个字。"],["p","「但如今。」"],["p","如果你今天什么都记不住，就记这三个字。"],["p","因为这三个字，是圣经里最美的三个字。"],["w",3],["p","我先讲一件事。"],["p","我认识一位姊妹，信主二十多年。二十多年来，聚会从不缺席，服事从不推辞，奉献从不落后。"],["p","有一天她坐在我对面，说了一句话。她说："],["q","「牧师，我信主二十多年了。可是我到现在，还是不太确定神真的接纳我。」"],["p","我问她为什么。"],["p","她想了很久，说："],["q","「因为我知道我心里是什么样子。别人看见的那个我，跟我自己知道的那个我，不一样。」"],["p","弟兄姊妹，我相信在座有人听得懂这句话。"],["p","我们用了一辈子的力气，在维持一句话：「我还可以。」"],["p","而我们自己心里最清楚——那句话撑得多辛苦。"],["w",3],["p","今天的罗马书第三章，是为这样的人写的。"],["p","不过我要先提醒大家：这一章的路，是先往下走的。"],["p","保罗要先把我们手上所有的东西拿走，才会给我们那三个字。"],["p","所以我今天要讲三样东西："],["p","第一，一张被封住的嘴。\n第二，一张被公开的座。\n第三，一道被关上的门。"],["p","三样东西，都是被动的。都不是我做的。"],["w",3],["h","第一大段｜一张被封住的嘴（3:9–20）"],["h","保罗的做法"],["p","弟兄姊妹，保罗在第一章讲外邦人的罪，第二章讲宗教人的罪。到了第三章第9节，他做出结论："],["q","「这却怎么样呢？我们比他们强吗？决不是的！因我们已经证明：犹太人和希腊人都在罪恶之下。」（罗3:9）"],["p","「已经证明」这个字，在整本新约只出现这一次。它是一个法律用语，意思是「已经提出正式指控」。"],["p","保罗在说：起诉书我写完了。现在，传唤证人。"],["p","而他传唤的证人，很有意思——他一个人都没有传。他传的是旧约圣经。"],["p","从第10节到第18节，保罗一口气引用了六段旧约，全部出自诗篇和以赛亚书。"],["p","他不自己说犹太人有罪。他让犹太人自己的圣经说。"],["h","一张罪的解剖图"],["p","弟兄姊妹，这六段引文不是随便排的。你如果把它们的顺序看一遍，会发现保罗在画一张人体图。"],["p","先是总论："],["q","「没有义人，连一个也没有；没有明白的；没有寻求神的。」（3:10–11）"],["p","然后是嘴。而且是四个部位，由里到外："],["q","喉咙 —— 「他们的喉咙是敞开的坟墓」\n舌头 —— 「他们用舌头弄诡诈」\n嘴唇 —— 「嘴唇里有虺蛇的毒气」\n口　 —— 「满口是咒骂苦毒」"],["p","「敞开的坟墓」——原文是一个完成式的分词：已经被打开、而且一直开着。"],["p","弟兄姊妹，犹太人对坟墓有很深的忌讳。民数记说，摸了坟墓的人，七天不洁净。"],["p","而一个敞开的坟墓，意味着两件事：里面的味道会冒出来，靠近的人会被污染。"],["p","保罗说：人的喉咙就是这样。里面早就死了。话一出口，那个味道就飘出来，还会污染旁边的人。"],["p","然后是脚："],["q","「杀人流血，他们的脚飞跑，所经过的路便行残害暴虐的事。」（3:15–16）"],["p","「残害」这个字，原文的意思是「压碎、粉碎」。"],["p","人走过的路，留下的是一地碎片。"],["p","接着是最让人心酸的一句："],["q","「平安的路，他们未曾知道。」（3:17）"],["p","不是「他们不肯走」，是「他们不知道」。"],["p","人类拚了命在找和平。联合国、和平协议、心理治疗、正念冥想、各种身心灵课程——"],["p","保罗说：那条路，人根本不认识。"],["h","病灶在哪里"],["p","然后，第18节。这是全段的最后一句，也是全段的病灶："],["q","「他们眼中不怕神。」（3:18）"],["p","原文的意思是：在他们眼睛的正前方，没有神。"],["p","弟兄姊妹，注意保罗的顺序。他先给你看症状——嘴、脚、路。最后才告诉你病因。"],["p","病因只有一句话：神不在视线的正前方。"],["p","这句话不只是讲无神论者。"],["p","这句话最扎的，是我们这些每个礼拜来教会的人。"],["p","因为我们的问题不是不信有神。我们的问题是——神不在视线的正前方。"],["p","- 我做决定的时候，神在不在正前方？\n- 我发脾气的那三秒钟，神在不在正前方？\n- 我一个人看手机的时候，神在不在正前方？"],["h","判决：闭嘴"],["p","然后保罗下了判决。第19节："],["q","「我们晓得律法上的话都是对律法以下之人说的，好塞住各人的口，叫普世的人都伏在神审判之下。」"],["p","「塞住」这个字，原文是 φράσσω。"],["p","它的意思是：筑一道篱笆，把路堵死。 也用在法庭上，形容一个被告——站起来，却一个字都说不出来。"],["p","弟兄姊妹，这里有一个细节，我一定要跟你们说。"],["p","保罗在第14节说「满口是咒骂苦毒」——那个「口」，希腊文是 στόμα。"],["p","保罗在第19节说「好塞住各人的口」——那个「口」，也是 στόμα。"],["p","同一个字。"],["p","那张说尽了咒骂苦毒的嘴，终于闭上了。"],["h","为什么神要我们闭嘴？"],["p","有人可能会觉得：神为什么要这样？把人逼到哑口无言，很残忍吧？"],["p","弟兄姊妹，不是的。"],["p","我做牧师这些年，越来越明白一件事："],["p","神要的不是我们认错。神要的是我们没话说。"],["p","因为只要我们还有一句「可是」，恩典就进不来。"],["p","- 「可是我也不是最坏的。」\n- 「可是我有我的苦衷。」\n- 「可是他先对不起我的。」\n- 「可是我已经很努力了。」"],["p","这些话不一定是假的。有些甚至是真的。"],["p","但只要那句「可是」还在，我们的手就还握着自己的东西——而一双握着东西的手，接不了礼物。"],["h","律法的功用"],["p","所以第20节说："],["q","「所以凡有血气的，没有一个因行律法能在神面前称义，因为律法本是叫人知罪。」"],["p","弟兄姊妹，这是整本罗马书最黑的一节。"],["p","保罗走了两章半，把所有的门一扇一扇关上："],["p","- 外邦人的门，关了\n- 好人的门，关了\n- 宗教人的门，关了\n- 现在，律法这扇门，也关了"],["p","没有出路了。"],["p","但请注意保罗在关上最后一扇门的时候，说了一句非常重要的话："],["q","「律法本是叫人知罪。」"],["p","律法没有失败。律法完成了它的任务。"],["p","弟兄姊妹，我打个比方。"],["p","你去医院照X光。X光片照出来，骨头断了。"],["p","你会不会生气地说：「这台机器真没用，照了半天也没把我的骨头接好」？"],["p","不会。因为X光机的工作不是接骨，是让你知道要去开刀房。"],["p","律法就是那台X光机。"],["p","它不能救你。但它让你不再假装自己没事。"],["p","而弟兄姊妹——下一节，开刀房的门，打开了。"],["w",3],["h","第二大段｜一张被公开的座（3:21–26）"],["h","三个字"],["p","第21节，第一个词："],["q","「但如今……」"],["p","希腊文是 Νυνὶ δέ。"],["p","νυνί 是「现在」这个字的加强形式——不只是「现在」，是「就在此刻」。"],["p","弟兄姊妹，保罗用了两章半，把整个人类逼到墙角。"],["p","然后用两个字，翻转整个宇宙。"],["q","「但如今，神的义在律法以外已经显明出来。」（3:21）"],["p","「已经显明出来」这个动词，是完成式。"],["p","希腊文的完成式，意思是：一件事在过去完成了，但它的效果一直持续到现在。"],["p","保罗不是说「神的义曾经显明过一次」。"],["p","他是说："],["q","神的义已经显明出来了，而且到今天，还摊在那里。\n谁都可以来拿。"],["h","白白的"],["p","然后保罗说了三节，一节比一节重。"],["q","「因为世人都犯了罪，亏缺了神的荣耀；如今却蒙神的恩典，因基督耶稣的救赎，就白白地称义。」（3:23–24）"],["p","弟兄姊妹，这里有一个细节我一定要讲。"],["p","「犯了罪」是过去式——一件已经定局的事。"],["p","「亏缺了」是现在式——一个到今天还在持续的状态。"],["p","「亏缺」这个字，希腊文是 ὑστερέω。它在新约还出现在一个很有名的地方——"],["p","约翰福音第二章，迦拿的婚宴。马利亚对耶稣说："],["q","「他们没有酒了。」"],["p","「没有了」——就是这个字。"],["p","弟兄姊妹，人生最深的问题，就是那一句：不够了。"],["p","而耶稣行的第一个神迹，就是把「不够」变成「有余」。"],["p","然后是第24节那个字：「白白地」。"],["p","希腊文是 δωρεάν，从「礼物」（δῶρον）来的。意思是：当礼物一样，无偿地，无缘无故地。"],["p","这个字在新约还出现在另一个地方，你们听了会震动。"],["p","约翰福音15章25节，主耶稣说："],["q","「他们无故恨我。」"],["p","「无故」——就是同一个字。δωρεάν。"],["p","弟兄姊妹，你听见了吗？"],["q","祂无缘无故被恨。\n我们无缘无故被爱。"],["p","这就是十字架上的交换。"],["h","那张椅子"],["p","现在我要讲今天最重要的一节。第25节："],["q","「神设立耶稣作挽回祭，是凭着耶稣的血……」"],["p","「挽回祭」这个字，希腊文是 ἱλαστήριον。"],["p","弟兄姊妹，这个字在旧约的希腊文译本里，出现了二十几次。它几乎每一次，都是同一个东西的名字——"],["p","约柜上面的那个盖子。"],["p","中文圣经翻译成：施恩座。"],["p","我请大家跟我一起，回到旧约的至圣所。"],["p","约柜里面放着什么？"],["p","两块石版。十诫。"],["p","那是什么？那是控告以色列的证据。那是罪状。"],["p","约柜上面盖着什么？"],["p","施恩座。"],["p","施恩座上面有什么？"],["p","两个金基路伯，翅膀展开，面对面，低着头，看着施恩座。"],["p","而神说：「我要在那里与你相会。」（出25:22）"],["p","一年一次，赎罪日那一天，大祭司带着血，一个人进到幔子里面，把血弹在施恩座上。"],["p","然后——"],["p","那位坐在基路伯中间的神，低下头看的时候，"],["p","祂看见的不是控告我的法版。"],["p","祂看见的是遮盖法版的血。"],["h","搬出来了"],["p","弟兄姊妹，现在请你看第25节那个动词。"],["p","「神设立耶稣作挽回祭」——「设立」这个字，希腊文是 προέθετο。"],["p","它的字面意思是：摆在前面。公开地陈列出来。"],["p","弟兄姊妹，那个施恩座在哪里？"],["p","在至圣所里面。\n在幔子后面。\n一年只能看一次。\n只有一个人看得见。"],["p","而保罗说——"],["p","神把它，搬出来了。"],["q","从前藏在幔子后面的，如今挂在城外的山头上。\n从前只有大祭司能看的，如今全世界都看见了。\n从前一年一次的，如今一次就永远成就了。"],["p","所以弟兄姊妹，你知道为什么耶稣断气的那一刻，会发生那件事吗？"],["q","「忽然，殿里的幔子从上到下裂为两半。」（太27:51）"],["p","幔子不需要了。"],["p","因为施恩座，已经公开了。"],["h","神凭什么？"],["p","但是弟兄姊妹，第25节还没完。后面还有一句话，是全章最深的一句："],["q","「因为他用忍耐的心宽容人先时所犯的罪。」"],["p","「宽容」这个字，希腊文是 πάρεσις。"],["p","这个字，整本新约只出现这一次。"],["p","而它有一个很像的兄弟，叫 ἄφεσις——那个字的意思是「赦免」，是「债被取消」。"],["p","但保罗在这里没有用「赦免」。他用了另一个字：πάρεσις。"],["p","它的意思是：放过去。暂时搁着。还没处理。"],["p","弟兄姊妹，保罗在说一件很严重的事。"],["p","他说：旧约几千年来，神一直在赊帐。"],["p","亚伯的祭、挪亚的祭、亚伯拉罕的公羊、逾越节的羊羔、圣殿里千千万万只牛羊——"],["p","希伯来书说得很清楚：「公牛和山羊的血，断不能除罪。」（来10:4）"],["p","那些祭，只是一张欠条。不是付款。"],["p","神一直在「放过去」。一直没有结案。"],["p","而这就带出一个天大的问题——"],["p","神凭什么放过？"],["p","如果一个法官一直不追讨罪，他就不是好法官。"],["p","如果神一直放过罪，祂凭什么还算是公义的神？"],["p","所以保罗说，神设立耶稣作挽回祭，是「要显明神的义」。"],["p","弟兄姊妹，我要说一句你可能没有听过的话："],["q","十字架不只是为我们赎罪。\n十字架也是神为祂自己洗清嫌疑。"],["p","神在各各他，向全宇宙证明了一件事："],["q","「我从来没有放纵过任何一件罪。」\n「所有的帐，都在这里结清了。」"],["h","全本圣经最精妙的一句"],["p","然后是第26节。这是整章的顶峰："],["q","「好在今时显明他的义，使人知道他自己为义，也称信耶稣的人为义。」"],["p","弟兄姊妹，这句话的原文，是两个一模一样的字根，紧紧挨在一起："],["q","δίκαιον καὶ δικαιοῦντα\n「义的」和「使人成为义的」"],["p","中间只隔一个「和」字。"],["p","弟兄姊妹，我们来想一想。"],["p","人类历史上，这个问题只有三种答案："],["p","第一种：神只讲公义。 那结果是——没有一个人活得了。"],["p","第二种：神只讲慈爱。 那结果是——神成了纵容罪的神，整个宇宙的道德根基就崩塌了。"],["p","第三种——"],["p","十字架。"],["p","神没有在公义和慈爱之间打折。祂在十字架上，让两边同时满分。"],["p","诗篇85篇有一节经文，诗人在盼望一件事："],["q","「慈爱和诚实彼此相遇；公义和平安彼此相亲。」（诗85:10）"],["p","弟兄姊妹，诗人所盼望的那一幕，在各各他发生了。"],["h","那位姊妹的问题"],["p","还记得我一开始提到的那位姊妹吗？"],["p","她说：「我到现在还是不太确定神真的接纳我。因为我知道我心里是什么样子。」"],["p","弟兄姊妹，罗马书第三章给她的答案，不是：「你没有那么糟啦。」"],["p","罗马书第三章的答案是：「你比你想的更糟——没有义人，连一个也没有。」"],["p","「但是——」"],["p","「神已经把祂的儿子，公开摆出来了。\n不是因为你够好，是因为祂够爱。\n不是白白给你一个折扣，是白白给你一个儿子。」"],["w",3],["h","第三大段｜一道被关上的门（3:27–31）"],["h","门关了"],["p","第27节："],["q","「既是这样，哪里能夸口呢？没有可夸的了。」"],["p","「没有可夸的了」——原文是一个字：ἐξεκλείσθη。"],["p","它的意思是：被关在门外了。"],["p","弟兄姊妹，注意保罗的用字。"],["p","他没有说「我们应该谦卑一点」。\n他没有说「不要太骄傲」。"],["p","他说：门关了。夸口进不来了。"],["p","为什么？"],["p","因为第24节说了「白白地」。"],["q","你不能为一份礼物邀功。"],["p","如果你生日那天收到一份礼物，你不会第二天到处跟人说：「你们知道吗？我昨天成功地收到了一份礼物。」"],["p","没有人会这样说。因为那不是你的功劳。"],["h","两种法"],["p","然后保罗说了一句很有意思的话："],["q","「用何法没有的呢？是用立功之法吗？不是，乃用信主之法。」（3:27）"],["p","保罗在玩一个文字游戏。他把「信」也叫做一种「法」。"],["p","世界上只有两种法："],["p","立功之法：我做，所以我得。\n信主之法：祂做了，所以我领受。"],["p","弟兄姊妹，我跟你们说一句话："],["q","世界上所有的宗教，都是「立功之法」。\n只有福音，是「信主之法」。\n\n所有宗教的动词是：「做。」\n福音的动词是：「成了。」"],["h","神既是一位"],["p","接着保罗问了一个非常安静、却非常巨大的问题："],["q","「难道神只作犹太人的神吗？不也是作外邦人的神吗？是的，也作外邦人的神。神既是一位……」（3:29–30）"],["p","弟兄姊妹，「神既是一位」这句话，你们知道它从哪里来的吗？"],["p","申命记6章4节。示玛。"],["q","「以色列啊，你要听！耶和华我们神是独一的主。」"],["p","这是犹太人每天早上、每天晚上都要背的一句话。是他们信仰的核心。"],["p","犹太人用这句话证明：只有我们敬拜真神。"],["p","而保罗——用同一句话，证明了外邦人也是神的。"],["p","保罗的逻辑是这样的："],["q","如果神只有一位，而祂是全宇宙的神，\n那祂就不可能只作一个民族的神。"],["p","弟兄姊妹，这是全章最巧妙的一招。"],["p","保罗拿犹太人最珍爱的信条，证明了他们最不能接受的结论。"],["h","这对我们是什么意思"],["p","弟兄姊妹，「难道神只作犹太人的神吗？」——这个问题今天还要继续问。"],["p","- 神只作「我们这一种基督徒」的神吗？\n- 神只作「我们这个宗派」的神吗？\n- 神只作「跟我一样得救经历的人」的神吗？"],["p","弟兄姊妹，我要说一句实话。"],["p","教会里最难拆的，不是外面的围墙，是心里的排行榜。"],["p","我们一边唱「奇异恩典何等甘甜」，一边心里在排："],["p","- 这个人比较属灵\n- 那个人大概还没真的重生\n- 他啊，他信主是为了做生意吧"],["p","弟兄姊妹，只要那张排行榜还在，我们就还没有懂第23节和第24节。"],["p","第23节说：「世人都犯了罪。」——同一条起跑线。\n第24节说：「白白地称义。」——同一份礼物。"],["p","在同一条起跑线上，没有人有资格对别人摆架子。"],["h","律法被扶正了"],["p","最后，第31节："],["q","「这样，我们因信废了律法吗？断乎不是！更是坚固律法。」"],["p","「坚固」这个字，原文的意思是：使它站起来。"],["p","弟兄姊妹，福音不是把律法推倒，福音是把律法扶正。"],["p","因为律法从来就不是用来称义的。它是用来知罪的。"],["p","当我们不再拿律法来爬梯子，律法才第一次好好地当一面镜子。"],["p","而且——"],["p","罗马书8章4节说：「使律法的义成就在我们这……随从圣灵的人身上。」"],["p","一个真的白白得了恩典的人，不会问「我可以犯多少罪」。"],["p","他会问：「我怎么才能活得像祂？」"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天讲了三样东西。"],["p","我要提醒大家一件事：这三样东西，原文全部都是被动式。"],["p","嘴，是「被」封住的。\n座，是「被」摆出来的。\n门，是「被」关上的。"],["p","从头到尾，都是神在动工。"],["p","没有一件是我做的。"],["w",3],["p","第一，一张被封住的嘴。"],["p","弟兄姊妹，你今天在神面前，还有什么话要说吗？"],["p","如果还有——那句话还在的时候，恩典就在门外等着。"],["p","神要的不是你认错，神要的是你没话说。"],["p","因为你没话说了，祂才好说话。"],["w",3],["p","第二，一张被公开的座。"],["p","那个藏在幔子后面一千五百年、一年只能看一次、只有一个人能看的施恩座——"],["p","神把它搬出来了。"],["p","摆在城外的一个山头上，光天化日，万人观看。"],["p","祂不是偷偷地赦免你。祂是公开地、当着全宇宙的面，把祂的儿子摆出来，说："],["q","「这里。到这里来。」"],["w",3],["p","第三，一道被关上的门。"],["p","夸口被关在门外了。"],["p","弟兄姊妹，这不是坏消息，这是你这辈子听过最好的消息之一。"],["p","因为当你不必再证明自己的时候——"],["p","你第一次可以呼吸。"],["w",3],["p","我最后要说一句话。"],["p","我知道今天在座有些人，跟我提到的那位姊妹一样。"],["p","你信了很多年，你知道所有的道理。\n但你心里有一个角落，一直不太确定神真的接纳你。"],["p","因为你知道你心里是什么样子。"],["p","弟兄姊妹，我要告诉你："],["p","你的感觉没有错。你确实不配。"],["p","没有义人，连一个也没有——那句话包括你，也包括我。"],["p","但是——"],["h","但如今。"],["p","神的义，在律法以外，已经显明出来了。"],["p","而且到今天，还摊在那里。"],["p","谁都可以来拿。"],["p","包括你。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天来到祢面前，发现我们手上什么都没有。我们一辈子努力维持的那句「我还可以」，在祢的话面前撑不住了。\n\n主啊，谢谢祢封住我们的嘴。因为我们没话说了，祢才好说话。\n\n谢谢祢把那个藏在幔子后面的施恩座，公开摆在我们眼前。谢谢祢不是偷偷地赦免我们，是当着全宇宙的面，把祢的儿子摆出来。\n\n主啊，我们承认——我们一直以为我们要先变好一点，祢才会比较喜欢我们。今天我们知道了：是白白的。完全是白白的。\n\n求祢把我们心里那张排行榜拿走。让我们看见身边每一个人，都跟我们站在同一条起跑线上，也都可以领同一份礼物。\n\n主啊，我们不再夸口了。门已经关了。我们只夸祢的十字架。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"4":{"min":35,"blocks":[["h","神竟然称罪人为义"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","我要先念一节经文给大家听。这节经文在箴言17章15节："],["q","「定恶人为义的，定义人为恶的，这都为耶和华所憎恶。」"],["p","大家听清楚了：神说，把恶人说成义人——这是祂所憎恶的。"],["p","出埃及记23章7节，神自己说得更直接："],["q","「我必不以恶人为义。」"],["p","好。现在请大家听另一节经文，罗马书4章5节："],["q","「惟有不做工的，只信称罪人为义的神，他的信就算为义。」"],["p","弟兄姊妹，你们有没有觉得哪里怪怪的？"],["p","神说：我必不以恶人为义。\n保罗说：祂是那位称罪人为义的神。"],["p","这是怎么回事？"],["p","保罗是不是讲错了？"],["p","还是说——"],["p","神做了一件祂自己说过祂憎恶的事？"],["w",3],["p","弟兄姊妹，这个问题，就是我们今天要花四十分钟来回答的问题。"],["p","而我先跟大家说：这个问题的答案，是全本圣经最好的消息。"],["w",3],["p","不过在回答之前，保罗要先带我们看三样东西。"],["p","第一，一本帐。\n第二，一个印。\n第三，一座坟。"],["w",3],["h","第一大段｜一本不一样的帐（4:1–8）"],["h","保罗请证人出庭"],["p","弟兄姊妹，第三章结束的时候，保罗刚刚讲完一句惊天动地的话："],["q","「人称义是因着信，不在乎遵行律法。」（3:28）"],["p","如果你是一个犹太人，听到这句话，你心里一定有一个反应："],["q","「保罗，这是你自己发明的新宗教吧？我们祖宗传了两千年的信仰，你一句话就推翻了？」"],["p","所以第四章，保罗做了一件很聪明的事。"],["p","他不再自己说话。他请证人出庭。"],["p","而且他请的两位证人，是犹太人绝对不敢反对的："],["p","第一位——亚伯拉罕。犹太民族的祖宗。\n第二位——大卫。以色列最伟大的王。"],["h","一节经文，一整章的讲道"],["p","保罗传唤的第一位证人是亚伯拉罕。而他问了一个问题："],["q","「经上说什么呢？」（4:3）"],["p","弟兄姊妹，这五个字，是保罗整章的方法论。"],["p","不是「传统怎么说」。\n不是「拉比怎么教」。\n不是「大家都这样讲」。"],["p","是——经上怎么写的。"],["p","这一点很重要。因为当时犹太人有一个非常流行的说法。"],["p","在保罗那个时代有一本书，叫《马加比一书》，里面说：「亚伯拉罕在试探中被察验，岂不是忠心的吗？这就算为他的义。」"],["p","意思是：亚伯拉罕之所以被算为义，是因为他通过了献以撒那场考试。"],["p","还有一本犹太传统文献说得更夸张：「亚伯拉罕我们的祖宗，在律法还没有赐下以前，就守全了整部律法。」"],["p","换句话说：当时的标准说法是——亚伯拉罕是史上第一位模范生。"],["p","而保罗说：请你翻开创世记。"],["q","「亚伯拉罕信神，这就算为他的义。」（创15:6）"],["p","弟兄姊妹，「这就算为他的义」——这句话在创世记第几章？"],["p","第十五章。"],["p","献以撒在第几章？"],["p","第二十二章。"],["p","中间隔了七章，隔了几十年。"],["q","神算他为义的那一天，以撒都还没有出生。"],["h","一个记帐的字"],["p","现在我要跟大家讲一个字。这个字是整章的钥匙。"],["p","「算为他的义」——「算」这个字，希腊文是 λογίζομαι。"],["p","这是一个会计用语。"],["p","在保罗那个时代，商人记帐、银行入款、债务结算，用的就是这个字。"],["p","它的意思是：把一笔数字，记到某人的帐户上。"],["p","弟兄姊妹，这个字在罗马书第四章出现了几次？"],["p","十一次。"],["p","保罗一次又一次地敲同一个钟：算、算、算、算……"],["p","他要我们看见一样东西——"],["p","一本帐簿。"],["h","两种帐"],["p","然后保罗在第4节和第5节，画出两本完全不同的帐。"],["q","「作工的得工价，不算恩典，乃是该得的；惟有不做工的，只信称罪人为义的神，他的信就算为义。」（4:4–5）"],["p","「该得的」这个字，希腊文是 ὀφείλημα。"],["p","它的意思是：欠款。债。"],["p","弟兄姊妹，你们知道这个字还出现在哪里吗？"],["p","主祷文。「免我们的债」——就是这个字。"],["p","保罗在说：如果称义是工资，那意思就是——神欠我们。"],["p","而弟兄姊妹，只要神欠我们，恩典就死了。"],["p","我打个比方。"],["p","你去上班，月底老板把薪水汇给你。你会不会传一则讯息给老板说：「老板，谢谢你的恩典」？"],["p","不会。你会说：「应该的。」"],["p","因为那是工资，不是礼物。"],["p","而如果有一天，有人无缘无故给你一笔钱——那你才会说谢谢。"],["q","弟兄姊妹，这两件事不能同时成立。\n一笔钱，要嘛是工资，要嘛是礼物。\n不可能一半一半。"],["h","「罪人」这个字"],["p","现在我要讲4:5那个最扎心的字。"],["p","「称罪人为义的神」——「罪人」这个字，希腊文是 ἀσεβής。"],["p","它的意思不是「做坏事的人」。"],["p","它的字面意思是：不敬拜神的人。不把神当神的人。"],["p","弟兄姊妹，这个字你们其实已经听过了。"],["p","罗马书1章18节：「神的忿怒从天上显明在一切不虔不义的人身上。」"],["p","「不虔」——就是这个字的名词形式。"],["p","弟兄姊妹，你听见了吗？"],["q","第一章：神的忿怒，显明在这些「不虔」的人身上。\n\n第四章：神称这些「不虔」的人为义。"],["p","同一群人。"],["p","中间隔着什么？"],["p","中间隔着一个十字架。"],["h","第二位证人：大卫"],["p","保罗传唤的第二位证人，是大卫。"],["p","弟兄姊妹，保罗选证人的眼光很有意思。"],["p","第一位是亚伯拉罕——犹太人心目中最好的人。\n第二位是大卫——一个犯了奸淫、又用计谋杀了忠心部下的人。"],["p","一个是最好的例子。一个是最坏的例子。"],["p","而保罗说：两端都一样。都是靠恩典。"],["p","大卫在诗篇32篇说了三句话，保罗引在4:7–8："],["q","「得赦免其过、遮盖其罪的，这人是有福的。主不算为有罪的，这人是有福的。」"],["p","弟兄姊妹，这里有三个动词，每一个都是被动式，主词都是神："],["p","第一，赦免——原文的画面是「搬走」。罪像一个重担，被搬走了。"],["p","第二，遮盖——原文的画面是「盖起来」。罪还在那里，但被盖住了，不再被看见。"],["p","第三，不算——这是我们的老朋友 λογίζομαι。而且原文用了希腊文最强的双重否定。"],["p","中文说「主不算为有罪」，读起来很平。"],["p","原文的语气是："],["q","「主绝对、绝不、永远不会把那笔罪，记到他的帐上。」"],["p","弟兄姊妹，这三个动词，回答了三种不同的痛苦："],["p","罪的重担——被搬走了。\n罪的羞耻——被遮盖了。\n罪的追讨——不再入帐了。"],["h","那我们在算什么？"],["p","弟兄姊妹，讲到这里，我要问一个很个人的问题。"],["p","如果神已经说「我不算了」——"],["p","那我们每天晚上躺在床上，翻来覆去在算的，是什么？"],["p","我牧养这些年，发现很多基督徒心里都有一本帐。而且是三本："],["p","第一本，记着我为神做了多少。\n——「我这么忠心，神为什么让这件事发生在我身上？」"],["p","第二本，记着别人亏欠我多少。\n——「他那样对我，我一辈子都记得。」"],["p","第三本，记着我自己犯过哪些错。\n——这一本最厚。而且我们每天晚上都翻。"],["p","弟兄姊妹，我要说一句可能有点重的话："],["q","当神说「我不算了」，我们却说「可是我觉得应该算」——\n\n那不是谦卑。那是不信。\n\n那是我们把自己的判断，摆在神的判断之上。"],["w",3],["h","第二大段｜一个盖在后面的印（4:9–17）"],["h","保罗的第二问"],["p","第一段，保罗问的是：「经上说什么呢？」"],["p","第二段，保罗问了一个更狠的问题。第10节："],["q","「是怎么算的呢？是在他受割礼的时候呢？是在他未受割礼的时候呢？」"],["p","弟兄姊妹，这一问，是全章最漂亮的一击。"],["p","因为保罗完全不辩论神学。他只请你翻书，看章节顺序。"],["p","创世记15章6节：「亚伯兰信耶和华，耶和华就以此为他的义。」"],["p","创世记17章24节：「亚伯拉罕受割礼的时候，年九十九岁。」"],["p","中间隔了多久？"],["p","至少十三、四年。"],["p","所以保罗说："],["q","「不是在受割礼的时候，乃是在未受割礼的时候。」（4:10）"],["p","弟兄姊妹，这句话的意思是什么？"],["q","神算亚伯拉罕为义的那一天——\n\n他是一个外邦人。"],["h","那割礼是什么？"],["p","那有人会问：那割礼到底算什么？神设立割礼难道是多余的吗？"],["p","保罗在第11节回答了。而他用了一个很精准的字："],["q","「并且他受了割礼的记号，作他未受割礼的时候因信称义的印证。」"],["p","「印证」这个字，希腊文是 σφραγίς。意思是：印章。"],["p","在罗马世界，印章用在哪里？"],["p","契约签好了，盖印。\n货物包好了，盖封条。\n文件写完了，盖官印。"],["p","弟兄姊妹，关键在这里——"],["q","印章，从来不是在契约之前盖的。\n\n印章永远是在事情已经成立之后，盖上去确认的。"],["p","你不会先盖章，再谈合约。"],["p","保罗说：割礼就是那个印。"],["p","它是真的。它是神设立的。它是好的。"],["p","但它是盖在后面的。"],["h","我们的「割礼」"],["p","弟兄姊妹，我们今天不谈割礼了。但我们每个人心里，都有一份清单。"],["p","- 我受洗几年了\n- 我读完几遍圣经了\n- 我在哪个小组、跟哪位牧者\n- 我服事几年、奉献多少\n- 我参加过哪些特会"],["p","这些都是好东西。真的。就像割礼一样，是好的。"],["p","但保罗要问的是：这些东西，是门票，还是印章？"],["p","如果它们是门票，那你就是在买。"],["p","如果它们是印章，那它们是盖在一件已经成了的事情上面。"],["h","顺序，反过来了"],["p","然后保罗讲了一句让当时的犹太人几乎跳起来的话。第11节下半到12节："],["q","「叫他作一切未受割礼而信之人的父……又作受割礼之人的父。」"],["p","弟兄姊妹，注意顺序。"],["p","犹太人的想法是：亚伯拉罕是我们的父。外邦人如果想有份，要先受割礼，加入我们。"],["p","保罗说："],["q","不对。他先是未受割礼之人的父。\n然后才是受割礼之人的父。\n\n顺序，反过来了。"],["p","而且第12节还加了一句限定——他作受割礼之人的父，只限于那些「按亚伯拉罕未受割礼而信之踪迹去行的人」。"],["p","「踪迹」这个字，原文是 ἴχνος——脚印。"],["q","保罗说：真正的亚伯拉罕子孙，不是有他血统的人，是踩着他脚印走的人。\n\n而他的第一个脚印，是在他还没有受割礼的时候踩下的。"],["h","为什么恩典这么重要"],["p","弟兄姊妹，第16节有一句话，是这整段的地基。保罗说："],["q","「所以人得为后嗣是本乎信，因此就属乎恩，叫应许定然归给一切后裔。」"],["p","「定然」这个字，希腊文是 βέβαιος。"],["p","它在罗马的契约文书里，指的是「具有法律效力、可以强制执行的担保」。"],["p","弟兄姊妹，保罗在这里讲了一个很深的道理。"],["p","他说：正因为是凭恩典，所以应许才稳固。"],["p","为什么？"],["q","如果应许凭我的表现——我的表现会变，应许就跟着晃。\n\n如果应许凭神的恩典——神不会变，应许就稳如泰山。"],["p","所以恩典不是神的软弱。"],["p","恩典是应许唯一可能稳固的方式。"],["p","而弟兄姊妹，这句话还有一个更深的意思。"],["p","保罗说「叫应许定然归给一切后裔」。"],["p","你想想看——只要有一点点是靠表现，就一定会产生等级。\n只要有等级，就一定有人排在后面。\n只要有人排在后面，「一切」这两个字就不成立了。"],["p","所以恩典不只是为了让我安心，恩典是为了让这个家能够成立。"],["p","弟兄姊妹，我要说一句实话。"],["p","教会里最难拆的，不是外面的围墙，是心里的等级表。"],["p","我们一边唱「一同来敬拜」，一边心里在排：谁是核心，谁是外围；谁比较属灵，谁还在初信；谁的见证比较精彩，谁只是从小在教会长大。"],["p","弟兄姊妹，只要那张表还在——"],["p","我们就还没有懂第16节。"],["w",3],["h","第三大段｜一座还没被打开的坟（4:18–25）"],["h","一个没有孩子的老人"],["p","弟兄姊妹，我们现在要看今天最后一段，也是我最喜欢的一段。"],["p","保罗要告诉我们：什么叫做信。"],["p","但在讲之前，我要请大家先看一个画面。"],["p","创世记15章。神把亚伯兰领到帐棚外面。那是美索不达米亚的旷野，晚上。"],["p","神说：「你向天观看，数算众星，能数得过来吗？」"],["p","然后神说：「你的后裔将要如此。」"],["p","弟兄姊妹，亚伯兰当时几岁？"],["p","大概八十几岁。"],["p","他有几个孩子？"],["p","一个都没有。"],["p","一个没有孩子的老人，站在旷野里，擡头看着满天的星星。"],["p","然后——圣经说：「亚伯兰信耶和华，耶和华就以此为他的义。」"],["h","逆着指望，靠着指望"],["p","保罗在4:18描写这一刻，用了一句我认为是全本圣经最美的话。"],["p","和合本翻译成：「他在无可指望的时候，因信仍有指望。」"],["p","这句话的原文，是同一个字用了两次，配两个不同的介词："],["q","παρ' ἐλπίδα ἐπ' ἐλπίδι\n\n「逆着指望——靠着指望。」"],["p","弟兄姊妹，这句话的意思是："],["q","信心，一只脚踩在绝望里，一只脚踩在应许上。"],["p","很多人以为，信心就是「不要去想那些不好的」。"],["p","保罗说：不是。"],["h","他把自己看得清清楚楚"],["p","第19节："],["q","「他将近百岁的时候，虽然想到自己的身体如同已死，撒拉的生育已经断绝，他的信心还是不软弱。」"],["p","「想到」这个字，希腊文是 κατανοέω。"],["p","它的意思不是「瞄了一眼」，是——"],["p","仔细审视。认真思量。盯着看。"],["p","弟兄姊妹，保罗是刻意告诉我们这件事的。"],["q","亚伯拉罕没有逃避现实。\n他把自己的身体，看得清清楚楚。"],["p","而且保罗用的字更重。「如同已死」，原文是一个完成式的分词——"],["p","意思是：已经死透了，而且维持在死的状态。"],["p","保罗还用了另一个字形容撒拉，原文直译是「撒拉子宫的死」。"],["p","弟兄姊妹，保罗在这两节里，用了两个「死」字。"],["p","他要我们看见两具没有生命的身体。"],["p","然后——"],["p","你还记得第17节保罗怎么形容神吗？"],["q","「亚伯拉罕所信的，是那叫死人复活、使无变为有的神。」"],["p","弟兄姊妹，保罗是故意的。"],["p","他先让你看见「死」，然后告诉你：他所信的那一位，专门在死的地方工作。"],["h","信心不是自己撑强的"],["p","第20节，还有一个细节，我要特别讲。"],["q","「并且仰望神的应许，总没有因不信心里起疑惑，反倒因信心里得坚固。」"],["p","「得坚固」这个字，原文是被动式。"],["p","意思是：他被赋予了能力。"],["p","弟兄姊妹，这一点对我们太重要了。"],["p","因为我们常常以为，信心是一种要靠意志力挤出来的东西。"],["p","「我要更有信心！我要更相信！」——然后越挤越累。"],["p","保罗说：不是。"],["q","他不是自己撑强的。\n是他信的时候，力量被加给他。\n\n信心不是我们生产能力的引擎。\n信心是我们接受能力的管道。"],["h","相信，就是把荣耀归给神"],["p","然后是第20节最后一句。弟兄姊妹，这句话在罗马书是第一次出现："],["q","「将荣耀归给神。」"],["p","我请大家把三节经文放在一起看。"],["p","罗马书1章21节：「他们虽然知道神，却不当作神荣耀祂。」"],["p","罗马书3章23节：「世人都犯了罪，亏缺了神的荣耀。」"],["p","罗马书4章20节：「将荣耀归给神。」"],["p","弟兄姊妹，保罗用了三章半，描写一个不荣耀神的世界。"],["p","然后在第四章，他终于给我们看见第一个荣耀神的人。"],["p","而他荣耀神的方式，让我很意外。"],["p","不是献祭。不是奉献。不是建殿。不是宣教。"],["p","是——相信。"],["p","为什么相信就是荣耀神？"],["p","弟兄姊妹，你想想看："],["q","当我不信的时候，我其实是在对神说：「祢做不到。」\n\n当我信的时候，我是在对神说：「祢做得到。」\n\n这世上，没有比「我相信祢办得到」更能尊荣一位神的了。"],["h","你那个「已经没救了」的地方"],["p","弟兄姊妹，我知道今天在座，有人心里有一个处境。"],["p","那个处境，你已经放弃很久了。"],["p","- 那段婚姻已经冷了很多年\n- 那个孩子已经很久不跟你说话了\n- 那个诊断已经下了\n- 那个关系已经断了\n- 那个机会已经过了\n- 那个梦想，你已经不敢再提了"],["p","你甚至已经学会了不去想它。因为每次想，就痛一次。"],["p","弟兄姊妹，我要告诉你罗马书第四章的信息："],["q","神从来不在我们还有办法的地方动工。\n\n祂在「已死」的地方动工。\n\n因为祂是叫死人复活的神。"],["p","而且请注意：保罗说亚伯拉罕「仔细察看」了自己死透的身体。"],["p","神没有要你假装它还活着。"],["p","神只是要你，在看清楚它已经死了之后，擡起头来，看见另一件事："],["p","站在你面前的这一位，是叫死人复活的神。"],["h","那个问题的答案"],["p","弟兄姊妹，我们现在要回到今天一开始那个问题。"],["p","箴言说：「定恶人为义的，为耶和华所憎恶。」\n出埃及记说：「我必不以恶人为义。」"],["p","那罗马书4章5节说「神称罪人为义」，这怎么可能？"],["p","答案在最后一节。罗马书4章25节："],["q","「耶稣被交给人，是为我们的过犯；复活，是为叫我们称义。」"],["p","弟兄姊妹，我要你听清楚这一节在说什么。"],["p","神没有睁一只眼闭一只眼。"],["p","神没有说「算了算了，我不追究了」。"],["p","神追究了。祂彻彻底底地追究了。"],["p","祂只是——"],["p","追究在自己儿子身上。"],["p","弟兄姊妹，这是全本圣经最重要的一个区分，我请大家记住："],["q","「不追究地赦免」——那是不义。\n\n「已追究地赦免」——那才是恩典。\n\n神做的，是第二种。"],["p","所以神称不敬虔的人为义，不是绕过公义。"],["p","是穿过公义。"],["p","穿过各各他。"],["h","收据"],["p","最后一句话。"],["p","4:25说：耶稣「被交给人，是为我们的过犯；复活，是为叫我们称义」。"],["p","弟兄姊妹，我一直在想一个问题：既然十字架已经付清了，为什么还需要复活？"],["p","我后来明白了。"],["q","十字架，付清了帐。\n\n复活，是那张盖了章的收据。"],["p","如果耶稣没有复活，我们永远不知道那笔帐到底付清了没有。"],["p","祂躺在坟墓里，那件事就悬在那里。"],["p","但第三天早上，那块石头滚开了。"],["p","弟兄姊妹，那座空了的坟墓，就是天上发出的一张收据。"],["p","上面只有三个字："],["h","已收讫。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["p","第一，一本帐。"],["p","神的帐本上，没有「工资」那一栏。"],["p","只有「礼物」那一栏。"],["p","所以你今天不需要先赚够了才能来。你什么都不必带。"],["w",3],["p","第二，一个印。"],["p","所有的记号——受洗、服事、资历、经历——都是好的。"],["p","但它们是盖在后面的章，不是排在前面的门票。"],["p","所以你不必等到「够格」了才能来。亚伯拉罕被算为义的那一天，他还是个外邦人。"],["w",3],["p","第三，一座坟。"],["p","你心里那个已经死透了的地方——"],["p","那正是神工作的地方。"],["p","因为祂是叫死人复活的神。而且祂已经示范过一次了。"],["w",3],["p","弟兄姊妹，我最后要对两种人说话。"],["p","第一种，是觉得自己很努力、但心里有点累的人。"],["p","你每天读经、你从不缺席、你忠心服事、你奉献不落人后。"],["p","但你心里最深的地方，有一句话："],["q","「神应该对我好一点吧？我做了这么多。」"],["p","弟兄姊妹，我要温柔地告诉你：那句话一出现，恩典就死了。"],["p","因为那不是礼物，那是工资。"],["p","今天，你可以把那本帐交出来。"],["w",3],["p","第二种，是觉得自己太糟、不敢来的人。"],["p","你知道别人看见的那个你，跟你自己知道的那个你，不一样。"],["p","弟兄姊妹，我要告诉你罗马书4章5节："],["q","祂是那位「称不敬虔的人为义」的神。"],["p","不是「称还不错的人为义」。"],["p","不是「称努力改进中的人为义」。"],["p","是——不敬虔的人。"],["p","弟兄姊妹，你今天来到祂面前，最不需要做的一件事，就是先假装自己够好。"],["p","因为那正是祂的专长。"],["w",3],["p","神竟然称罪人为义。"],["p","祂真的做了。"],["p","而祂之所以能做，是因为两千年前，有一个星期五的下午，帐被算到了另一个人身上。"],["p","还有一个星期天的早晨，那张收据，从坟墓里发出来了。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，发现我们手上一直握着一本帐。我们记着自己做了多少，记着别人亏欠我们多少，也记着我们自己犯过的每一个错。\n\n主啊，祢说「我不算了」。求祢帮助我们，也不要再算了。\n\n我们承认，我们一直以为要先变好一点，祢才会比较喜欢我们。今天我们听见了：祢是那位称不敬虔的人为义的神。\n\n主啊，我们心里有一些地方，已经死了很久。我们已经学会不去想它了。今天求祢提醒我们——祢是叫死人复活的神。求祢在那些地方动工。\n\n谢谢祢，祢没有轻率地放过我们的罪。祢追讨了，追讨在祢自己身上。\n\n谢谢祢，那座空了的坟墓，就是我们的收据。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"5":{"min":35,"blocks":[["h","何况"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天我要教大家两个字。"],["p","如果你今天什么都记不住，就记这两个字。"],["p","「何况」。"],["w",3],["p","我先说一件事。"],["p","前阵子有一位弟兄跟我说了一句话。他说："],["q","「牧师，我最近不太敢祷告。」"],["p","我问他为什么。"],["p","他说："],["q","「因为我这个礼拜做了一件很糟的事。我觉得……我得先把自己整理好，再去见神。不然太不像话了。」"],["p","弟兄姊妹，你们听得懂这句话吗？"],["p","「我得先把自己整理好，再去见神。」"],["p","我听得懂。因为我自己也这样过。"],["p","我们心里都有一个假设：跟神的关系，是看我最近表现如何。"],["p","- 这礼拜灵修有读，祷告就比较有底气\n- 这礼拜跌倒了，就先躲一躲"],["p","弟兄姊妹，罗马书第五章，就是写给这种心情的。"],["w",3],["p","我们今天要看三样东西："],["p","第一，一场停战。\n第二，一次倾倒。\n第三，一场换王。"],["p","而每一样的后面，都跟着同一个词：何况。"],["w",3],["h","第一大段｜战争结束了（5:1–2）"],["h","一个字：「既」"],["p","罗马书第五章第一节："],["q","「我们既因信称义，就借着我们的主耶稣基督得与神相和。」"],["p","弟兄姊妹，请注意第一个字：「既」。"],["p","这在原文是一个分词，而且是过去被动分词——意思是：那件事已经完成了，已经定案了，我们是站在那个定案上往下走。"],["p","罗马书前面四章，我们一直在法庭里。"],["p","从第五章开始，我们走出法庭，回家。"],["h","「相和」不是心情"],["p","现在我要讲今天第一个原文的字。"],["p","「得与神相和」——「相和」，希腊文是 εἰρήνη。"],["p","而这个希腊字，在旧约的希腊文译本里，翻译的是一个大家都听过的希伯来字——"],["p","שָׁלוֹם，shalom。"],["p","弟兄姊妹，שָׁלוֹם 的意思是什么？"],["p","很多人以为是「内心平安」。"],["p","其实它的字根意思是：完整、无缺、修复到位。"],["p","它用在什么地方？"],["p","- 用在战争结束的时候（约书亚记9:15，以色列与基遍人立约，「与他们讲和」）\n- 用在债务还清的时候\n- 用在破裂的关系被修复的时候"],["p","所以「与神相和」是什么意思？"],["q","不是「我觉得很平安」。\n\n是——战争结束了。\n\n停战协定，已经签了。"],["p","弟兄姊妹，这一点太重要了。"],["p","因为如果「相和」是一种心情，那我的心情起起伏伏，我跟神的关系就跟着起起伏伏。"],["p","但如果「相和」是一份协定——"],["q","那份协定，不会因为我今天心情不好就作废。\n\n而且更重要的是：那份协定是神签的，不是我签的。"],["h","那位引见官"],["p","第二节说："],["q","「我们又借着他，因信得进入现在所站的这恩典中。」"],["p","「进入」这个字，希腊文是 προσαγωγή。"],["p","弟兄姊妹，这个字在整本新约只出现三次，全部在保罗的书信里。"],["p","而它在当时，是一个宫廷用语。"],["p","在波斯和希腊化的王朝，有一个专门的官职，叫做 προσαγωγεύς——"],["p","中文可以翻译成：引见官。"],["p","他的工作，是把人带到王的面前。"],["p","没有他，你连王宫的门都摸不到。"],["p","弟兄姊妹，你们记得以斯帖记吗？"],["p","以斯帖记4章11节，以斯帖说了一句很吓人的话："],["q","「凡未蒙召见擅入内院见王的，无论男女必被治死；除非王向他伸出金杖，不得存活。」"],["p","那是一位王后说的话。连王后都不能随便进去。"],["p","而保罗说——"],["p","耶稣就是那位引见官。"],["h","两个完成式"],["p","而弟兄姊妹，第二节还有更好的。"],["p","「因信得进入现在所站的这恩典中」——"],["p","这里有两个动词，在原文都是完成式。"],["p","希腊文的完成式是什么意思？"],["p","一件事在过去完成了，而且它的效果，一直持续到现在。"],["p","所以保罗说的不是「我们曾经被带进去过」。"],["p","保罗说的是："],["q","我们被带进去了——\n\n而且我们现在，还站在那里。"],["p","弟兄姊妹，这是什么意思？"],["p","意思是：我们不是访客。"],["p","我们是常驻的。"],["h","所以，何况"],["p","弟兄姊妹，我要问那位弟兄的问题了。"],["p","「我得先把自己整理好，再去见神。」"],["p","我要温柔地问一句："],["q","门既然已经开了，而且开门的不是你——\n\n何况你今天心情不好？"],["p","你今天心情不好，会让那扇门关起来吗？"],["p","不会。"],["p","因为那扇门，从来就不是你打开的。"],["w",3],["h","第二大段｜爱被倒出来了（5:3–11）"],["h","一个压榨机"],["p","第三节，保罗说了一句很多人不喜欢的话："],["q","「不但如此，就是在患难中也是欢欢喜喜的。」"],["p","弟兄姊妹，我要先说一件事，因为这节经文被误用得很严重。"],["p","这节经文，是给受苦的人自己用的。"],["p","不是给旁边的人拿去对受苦的人说教用的。"],["p","如果有人正在痛苦中，你走过去说：「你要喜乐啊，患难生忍耐嘛！」——"],["p","那不是传道，那是残忍。"],["p","而且原文说的是「在患难中」，不是「为了患难」。"],["p","保罗从来没有说患难是好的。"],["w",3],["p","好，那我们来看「患难」这个字。"],["p","希腊文是 θλῖψις。它的动词是 θλίβω，意思是——"],["p","挤压。"],["p","这个字用在哪里？"],["p","压橄榄出油。压葡萄出酒。"],["p","弟兄姊妹，保罗选的不是「打击」，不是「攻击」，是「挤压」。"],["p","而挤压有一个特点——"],["q","它只能挤出里面本来就有的东西。"],["p","你挤一颗橄榄，出来的是油。\n你挤一颗葡萄，出来的是酒。\n你挤一块石头，什么都出不来。"],["p","所以患难最诚实的地方在于："],["q","它不「制造」什么。它把里面本来就有的，挤出来给你看。"],["h","一块被火炼过的金属"],["p","然后保罗说了一条链子："],["q","「患难生忍耐，忍耐生老练，老练生盼望。」（5:3–4）"],["p","「老练」这个字，希腊文是 δοκιμή。"],["p","它来自 δοκιμάζω——验金属。"],["p","古代怎么验金子？"],["p","放进火里。杂质会浮上来，撇掉。剩下的，就是真金。"],["p","所以「老练」不是「经验丰富」。"],["q","「老练」是——经过火之后，还在的那个部分。"],["h","那一桶已经倒下来了"],["p","但弟兄姊妹，这条链子有一个问题。"],["p","「患难生忍耐，忍耐生老练，老练生盼望」——"],["p","万一走到最后，什么都没发生呢？"],["p","那我不是空欢喜一场，很丢脸吗？"],["p","保罗知道我们会这样想。所以第五节说："],["q","「盼望不至于羞耻，因为所赐给我们的圣灵将神的爱浇灌在我们心里。」"],["p","「浇灌」这个字，希腊文是 ἐκχέω——"],["p","ἐκ 是「出来」，χέω 是「倒」。"],["p","合起来就是：整个倒出来。"],["p","不是滴。不是分配。是——整桶倒下来。"],["p","而弟兄姊妹，这个动词在原文是完成式。"],["p","所以保罗说的不是「神的爱曾经浇灌过我们」。"],["p","保罗说的是："],["q","那一桶，已经倒下来了。\n\n而且到今天，还是湿的。"],["p","弟兄姊妹，神没有叫我们等到最后才知道祂爱我们。"],["p","祂把订金，现在就付了。"],["h","保罗的一道阶梯"],["p","现在我们来到今天最重要的一段。"],["p","保罗在第七节，盖了一道阶梯。"],["q","「为义人死，是少有的；为仁人死，或者有敢做的。」（5:7）"],["p","弟兄姊妹，这里有两个不同的字。"],["p","第一个是「义人」——希腊文 δίκαιος。"],["p","那是一个正直、公正、无可指摘的人。"],["p","你尊敬他——但你不一定喜欢他。"],["p","第二个是「仁人」——希腊文 ἀγαθός。"],["p","那是一个良善的、慷慨的、对你有恩的人。"],["p","你爱戴他。你欠他。"],["p","所以保罗的阶梯是这样的："],["q","为一个「很正直的人」死？\n保罗说：几乎没有人肯。\n\n为一个「对我很好的人」死？\n保罗说：也许——或许有人敢。"],["p","弟兄姊妹，注意保罗用的字：「或者」「敢」。"],["p","连为一个对你最好的人去死，都只是「或许有人敢」。"],["p","那——"],["p","为一个仇敌死呢？"],["p","弟兄姊妹，保罗没有把这句话说完。"],["p","他直接跳到第八节。"],["h","那个时机"],["q","「惟有基督在我们还作罪人的时候为我们死，神的爱就在此向我们显明了。」（5:8）"],["p","弟兄姊妹，这一节的重点，不是「基督为我们死」。"],["p","这一节的重点，是那个时机。"],["p","「在我们还作罪人的时候。」"],["p","而保罗在这几节里，用了四个字形容我们当时的状态，一个比一个重："],["p","第六节：软弱——没有力气自救。"],["p","第六节：不敬虔——不把神当神。"],["p","第八节：罪人——射不中靶的。"],["p","第十节：仇敌——敌对神的。"],["p","四个词。保罗像是怕我们不够明白，一层一层加上去。"],["p","而基督，就是在那个时候死的。"],["p","弟兄姊妹，我要说一句话，我希望你今天带回家："],["q","你今天状态好不好，跟祂爱不爱你——没有关系。\n\n因为祂爱你的那一天，你比今天糟得多。"],["h","所以，何况"],["p","好，现在我要讲今天的主题了。"],["p","第九节和第十节，保罗用了同一个词，用了两次。"],["p","中文翻译成「就更要」。"],["p","原文是 πολλῷ μᾶλλον——"],["p","「何况更是」。"],["p","弟兄姊妹，这是犹太拉比一种标准的论证方法，叫做「轻重论证」。"],["p","它的逻辑是："],["q","如果比较小的那件事都成立了，那比较大的那件事，就更成立。"],["p","保罗怎么用？"],["q","「因为我们作仇敌的时候，且借着神儿子的死，得与神和好；既已和好，就更要因他的生得救了。」（5:10）"],["p","弟兄姊妹，你听出这个逻辑了吗？"],["q","神在你是仇敌的时候，\n付出了祂儿子的命。\n\n那祂现在——你已经是祂的儿女了——\n祂会为了你这礼拜做的那件糟事，把那一切收回去吗？"],["p","何况啊，弟兄姊妹。"],["p","何况。"],["p","这就是为什么罗马书第八章会说那句话："],["q","「神既不爱惜自己的儿子，为我们众人舍了，岂不也把万物和他一同白白地赐给我们吗？」（罗8:32）"],["p","难的事，祂已经做了。"],["p","剩下的，都是「顺便」。"],["h","最好的礼物"],["p","而第十一节，保罗把整段拉到最高处："],["q","「不但如此，我们既借着我主耶稣基督得与神和好，也就借着他以神为乐。」"],["p","弟兄姊妹，前面讲了那么多好处：相和、进入、盼望、忍耐、老练、免去忿怒、得救……"],["p","然后保罗说：「不但如此——」"],["q","最好的礼物，不是这些礼物。\n\n最好的礼物，是送礼物的那一位。"],["p","神救我们，不是为了给我们一个更好的人生。"],["p","神救我们，是为了让我们得着祂自己。"],["w",3],["h","第三大段｜王位换人了（5:12–21）"],["h","镜头拉远"],["p","弟兄姊妹，从第十二节开始，保罗做了一件前面五章都没做的事。"],["p","他把镜头，拉到人类历史的最开头。"],["p","前面四章半，我们一直在法庭里，讲「我怎么被神接纳」。"],["p","从5:12开始，保罗把屋顶掀开了。"],["p","他让我们看见整个人类的故事——"],["p","而在他的镜头里，整个人类历史，只有两个人。"],["h","都是「听」的问题"],["p","我先讲今天最后一个原文的字。它在第19节："],["q","「因一人的悖逆，众人成为罪人；照样，因一人的顺从，众人也成为义了。」"],["p","弟兄姊妹，「悖逆」和「顺从」——在中文看起来是两个完全不同的词。"],["p","但在希腊文，它们的字根是同一个。"],["p","那个字根是：ἀκούω——听。"],["p","「悖逆」是 παρακοή：παρά（旁边）＋ 听。"],["p","意思是：听到旁边去了。听偏了。"],["p","「顺从」是 ὑπακοή：ὑπό（底下）＋ 听。"],["p","意思是：在底下听。"],["p","弟兄姊妹，你听见了吗？"],["q","罪的本质，是听的问题。\n\n顺服的本质，也是听的问题。"],["p","我们回到伊甸园。"],["p","亚当犯罪的那一刻，发生了什么事？"],["p","创世记3章17节，神对亚当说的第一句话是什么？"],["q","「你既听从妻子的话……」"],["p","弟兄姊妹，亚当不是没有听。"],["p","他有听。"],["p","他只是——听错了对象。"],["w",3],["p","然后我们看另一个人。"],["p","以赛亚书50章5节，那位受苦的仆人说："],["q","「主耶和华开通我的耳朵；我并没有违背，也没有退后。」"],["p","还有希伯来书5章8节："],["q","「他虽然为儿子，还是因所受的苦难学了顺从。」"],["p","同一个字。ὑπακοή。在底下听。"],["p","弟兄姊妹，我要说一句话："],["q","一个园子里，有一个人听偏了。\n\n另一个园子里——客西马尼——有一个人听对了。\n\n祂说：「不要照我的意思，只要照你的意思。」"],["p","而人类的整个命运，就在这两次「听」之间翻转。"],["h","这对我们是什么意思"],["p","弟兄姊妹，这对我们今天是什么意思？"],["p","意思是：问题从来不是「我有没有在听」。"],["p","我们每天都在听。"],["p","听新闻、听别人的评价、听自己的情绪、听业绩报表、听社群媒体上的留言、听那个一直在你脑子里说「你不够好」的声音。"],["p","我们一直都在听。"],["p","问题是——"],["q","我在谁的底下听？"],["h","你的地位，取决于你属于谁"],["p","现在我要讲第五章下半段最重要的一件事。"],["p","保罗在5:12到19，用了一个字用了十二次。"],["p","那个字是：「一」。"],["p","一人。一次过犯。一次义行。一人的悖逆。一人的顺从。"],["p","弟兄姊妹，保罗要说的是："],["q","整个人类历史，只有两个代表性的人。\n\n而你的地位，不是靠你的表现决定的。\n\n是靠——你属于哪一个人。"],["p","第19节那个「成为」，原文很有意思。"],["p","它是 καθίστημι——意思是「被设立、被任命」。"],["p","这是一个法律和行政的用语。"],["p","（使徒行传6章3节，「我们就可以派他们管理这事」，用的就是这个字。）"],["p","所以保罗说的不是「众人变成了罪人」（那是性情的描述）。"],["p","保罗说的是："],["q","「众人被设立为罪人。」\n\n「众人也被设立为义。」"],["p","那是地位的宣告。"],["p","弟兄姊妹，这对我们是天大的好消息。"],["p","因为如果我的称义是靠我的表现，那我每一天都在风险中。"],["p","但如果我的称义是靠祂的表现——"],["q","那我就稳了。\n\n因为祂不会失败。"],["h","恩典爆表"],["p","第20节："],["q","「律法本是外添的，叫过犯显多；只是罪在哪里显多，恩典就更显多了。」"],["p","弟兄姊妹，这一节有一个原文的细节，我觉得很可爱。"],["p","保罗在讲「罪显多」的时候，用的是一个普通的字：πλεονάζω——增多。"],["p","但当他要讲「恩典更显多」的时候——"],["p","他觉得现成的希腊文不够用。"],["p","所以他自己叠了一个字出来：ὑπερπερισσεύω。"],["p","ὑπέρ 是「超级」，περισσεύω 是「满溢出来」。"],["p","合起来就是：超级—加倍—满溢。"],["p","这个字在整本新约，只出现两次。"],["p","弟兄姊妹，用白话说就是："],["q","罪加了一级。\n\n恩典直接爆表。"],["p","——但我要立刻加一句话，因为保罗自己也立刻加了。"],["p","第六章第一节：「我们可以仍在罪中，叫恩典显多吗？断乎不可！」"],["q","这句话，是给跌倒的人爬起来用的。\n\n不是给要去跌倒的人找借口用的。"],["h","谁在作王？"],["p","弟兄姊妹，最后一件事。"],["p","第五章有一个字，出现了五次。"],["p","那个字是「作王」——βασιλεύω。"],["p","- 5:14「死就作了王」\n- 5:17「死就因这一人作了王」\n- 5:17「岂不更要……在生命中作王吗」\n- 5:21「罪作王叫人死」\n- 5:21「恩典也借着义作王」"],["p","弟兄姊妹，第五章讲的，其实是一个王位的问题。"],["p","而保罗要告诉我们一件事："],["q","从来没有「没有王」这个选项。"],["p","你不让耶稣作王，不代表没有人作王。"],["p","那就是罪作王。"],["p","而罪作王的结局，是死。"],["h","最温暖的一个文法细节"],["p","但弟兄姊妹，我要用今天最温暖的一个发现来结束这一段。"],["p","第17节，照着保罗前面的对称逻辑，他应该这样写："],["q","「死作了王……照样，生命也作王。」"],["p","很整齐，对不对？"],["p","但保罗没有这样写。"],["p","他写的是："],["q","「何况那些受洪恩又蒙所赐之义的，岂不更要因耶稣基督一人在生命中作王吗？」"],["p","弟兄姊妹，主词换了。"],["p","不是「生命作王」。"],["p","是——我们作王。"],["q","罪作王的时候，我们是奴隶。\n\n但恩典作王的时候，我们不是换一个主人。\n\n我们也一同作王。"],["p","这就是那个最深的悖论："],["q","想要作王的那个人（亚当），成了奴隶。\n\n甘愿顺服的那一位（基督），使我们作王。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["p","第一，一场停战。"],["p","你跟神之间的战争，已经结束了。"],["p","而那份停战协定，是祂签的，不是你签的。"],["p","所以它不会因为你今天心情不好就作废。"],["w",3],["p","第二，一次倾倒。"],["p","神的爱，已经整桶倒进你心里了。"],["p","而且到今天，还是湿的。"],["p","祂没有等你变好才爱你——祂是在你最糟的时候，付出了最大的代价。"],["w",3],["p","第三，一场换王。"],["p","你的地位，不是靠你的表现决定的。"],["p","是靠你属于哪一个人。"],["p","而在祂的国度里，你不是奴隶。你要作王。"],["w",3],["p","弟兄姊妹，现在我要把今天那两个字还给大家。"],["p","何况。"],["p","我要教你们怎么用它。"],["w",3],["p","当你这个礼拜跌倒了，心里有一个声音说「你这样还敢祷告吗」——"],["p","你就对那个声音说："],["q","「祂在我是仇敌的时候都为我死了。\n\n何况现在。」"],["w",3],["p","当你在患难中，心里有一个声音说「如果神爱你，怎么会这样」——"],["p","你就说："],["q","「祂已经把祂儿子给我了。\n\n何况这件事。」"],["w",3],["p","当你看着自己的失败，心里想「我这样的人，神真的接纳我吗」——"],["p","你就说："],["q","「祂爱我的那一天，我比今天糟得多。\n\n何况现在。」"],["w",3],["p","弟兄姊妹，那位跟我说「我得先把自己整理好再去见神」的弟兄——"],["p","我后来告诉他一句话。我今天也想告诉你："],["q","你不用先整理好。\n\n因为门口那位引见官，从来没有走开过。\n\n而且那扇门，本来就不是你打开的。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，承认我们一直用感觉在判断跟祢的关系。表现好的时候比较敢来，跌倒的时候就想先躲一躲。\n\n主啊，今天祢让我们看见：那份停战协定，是祢签的。那扇门，是祢开的。那桶爱，是祢倒下来的。没有一样是我们做的。\n\n我们也承认，我们常常听偏了。我们听环境、听情绪、听别人怎么看我们，却没有在祢底下听。求祢开通我们的耳朵。\n\n主啊，谢谢祢在我们还作仇敌的时候就为我们死了。所以今天不管我们的光景怎么样，我们都可以说一句：何况。\n\n求祢让恩典在我们里面作王，直到永生。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"6":{"min":35,"blocks":[["h","你已经死了"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天的讲题，可能是我讲过最不客气的一个。"],["p","《你已经死了》。"],["p","我知道，对着一群活得好好的人说这句话，有点奇怪。"],["p","但这不是我说的。这是保罗说的。"],["p","而且他说这句话的时候，语气比我还直接。"],["w",3],["p","我先讲一件事。"],["p","我认识一位弟兄，信主十八年。"],["p","有一天他跟我说了一段话。他说："],["q","「牧师，有一个罪，我从信主第二年就开始对付。\n\n我祷告过、禁食过、找人代祷过、写过决心书、换过手机、删过帐号。\n\n十六年了。\n\n我现在已经不太立志了。因为我知道立完志，过两个礼拜还是一样。」"],["p","他最后说了一句话，我一直记到现在："],["q","「牧师，我不是不想胜过。我是打不赢。」"],["w",3],["p","弟兄姊妹，我想今天在座，有人听得懂这句话。"],["p","立志 → 失败 → 羞愧 → 再立志。"],["p","有些人在这个循环里，已经转了十年、二十年。"],["p","而罗马书第六章，就是为这样的人写的。"],["p","但保罗给的答案，可能跟你想的不一样。"],["p","他没有说「你要更努力」。"],["p","他说的是——"],["p","「你已经死了。」"],["w",3],["p","我们今天要看三样东西："],["p","第一，一场葬礼。\n第二，一本帐。\n第三，一批兵器。"],["w",3],["h","第一大段｜一场你已经参加过的葬礼（6:1–10）"],["h","保罗自己先问了那个问题"],["p","弟兄姊妹，我们先看第一节。"],["p","第五章的最后，保罗说了一句非常大胆的话："],["q","「罪在哪里显多，恩典就更显多了。」（5:20）"],["p","弟兄姊妹，这句话讲完，保罗立刻知道有人会怎么想。"],["p","所以第六章第一节，他自己先把那个念头说出来："],["q","「这样，怎么说呢？我们可以仍在罪中、叫恩典显多吗？」"],["p","「仍在罪中」——这个字在原文是 ἐπιμένω。"],["p","它的意思不是「偶尔犯罪」。"],["p","它的意思是：继续住在那里。赖着不走。"],["p","保罗问的不是「基督徒会不会跌倒」。"],["p","保罗问的是：基督徒可不可以把罪当成住址。"],["h","保罗的回答，跟我们想的不一样"],["p","然后保罗回答了。第二节："],["q","「断乎不可！我们在罪上死了的人岂可仍在罪中活着呢？」"],["p","弟兄姊妹，我要请你们注意一件事。"],["p","注意保罗没有用的三种回答："],["p","第一，他没有说：「不可以，因为神会生气、会处罚你。」"],["p","第二，他没有说：「不可以，因为你要报答神的恩。」"],["p","第三，他没有说：「不可以，因为你要证明你是真的信。」"],["p","弟兄姊妹，这三种回答，我们都很熟。因为我们常常这样讲道，也常常这样对自己说话。"],["p","但保罗一个都没用。"],["p","保罗只说了一句话："],["q","「你已经死了。」"],["p","这不是道德劝说。这是身分陈述。"],["h","「岂可」不是「不应该」"],["p","而这里有一个字，中文译本很难完全表达出来。"],["p","「岂可仍在罪中活着呢」——「岂可」这个字，希腊文是 πῶς。"],["p","πῶς 的意思是「怎么」。"],["p","中文「岂可」听起来像是责备：「你怎么可以这样！」"],["p","但希腊文的重点是：「这在逻辑上，怎么行得通？」"],["p","弟兄姊妹，这是一个关于可能性的问题，不是关于责任的问题。"],["p","保罗不是在说：「你不应该住在罪里。」"],["p","保罗是在说："],["q","「一个死人——怎么可能还住在那里？」"],["h","那场葬礼"],["p","那保罗凭什么说我们已经死了？"],["p","接下来八节，他就在讲这件事。而且他一直在敲同一个字。"],["p","弟兄姊妹，希腊文有一个前缀，叫 σύν——意思是「一同」。"],["p","保罗在第4节到第8节，一连用了四个带 σύν 的字："],["p","第4节：与祂一同埋葬。\n第5节：与祂长成一体。\n第6节：与祂一同钉十字架。\n第8节：与祂一同活。"],["p","一同、一同、一同、一同。"],["p","弟兄姊妹，整章的地基只有一个词："],["p","与基督联合。"],["w",3],["p","而第4节那个字特别有意思：「一同埋葬」。"],["p","我想问一个问题：死了不就够了吗？为什么还要特别讲「埋葬」？"],["p","弟兄姊妹，因为埋葬是死亡的确认。"],["p","一个人死了，还有可能被抢救回来。"],["p","但一个人被埋了——"],["p","这件事就结案了。"],["p","埋葬是公开的、社会性的、不可逆的宣告："],["p","这个人，真的走了。"],["w",3],["p","而弟兄姊妹，你们知道吗——"],["p","你们大部分人，都亲眼参加过这场葬礼。"],["p","那一天叫做：你受洗的那一天。"],["p","「受洗」这个字，希腊文是 βαπτίζω。它的意思是「浸入、没入」。"],["p","古希腊人用这个字形容什么？"],["p","船沉没。"],["p","还有——布料浸进染缸。浸下去之后，那块布就变成染缸的颜色了。"],["p","弟兄姊妹，一个第一世纪的信徒受洗的时候，全会众看见什么？"],["p","一个人整个沉下去——那是埋葬。"],["p","一个人整个起来——那是复活。"],["p","保罗说：那一天，你自己已经公开承认了这件事。"],["p","现在你要反悔吗？"],["h","一个嫁接的画面"],["p","第5节还有一个字，我很喜欢。"],["p","「我们若在他死的形状上与他联合」——「联合」这个字是 σύμφυτος。"],["p","这个字在整本新约，只出现这一次。"],["p","它的意思是：σύν（一同）+ φύω（生长）——一同长成。"],["p","它用在哪里？"],["p","用在植物的嫁接。"],["p","还有——断骨的愈合。接回去之后，长在一起了。"],["p","弟兄姊妹，你听出差别了吗？"],["q","保罗选的不是「捆在一起」。\n\n捆在一起，还可以解开。\n\n保罗选的是「长在一起」。\n\n长在一起，就分不开了。"],["p","而这给了我们对付罪最深的一个角度："],["q","问题不是「我要怎么靠意志力离开罪」。\n\n问题是「我已经被接在谁身上」。\n\n一根枝子会结什么果子，不是靠它努力，是靠它接在哪里。"],["h","一个被免职的主人"],["p","现在我要讲今天最重要的一个字。第6节："],["q","「因为知道我们的旧人和他同钉十字架，使罪身灭绝，叫我们不再作罪的奴仆。」"],["p","「灭绝」这个字，希腊文是 καταργέω。"],["p","弟兄姊妹，中文译「灭绝」，很容易让人以为：罪已经不存在了。"],["p","但这个字的意思不是「消灭」。"],["p","它是由两个部分组成的：κατά（彻底）+ ἀργός（不工作、闲置）。"],["p","合起来的意思是："],["q","使它失去作用。\n\n解除它的职权。"],["p","弟兄姊妹，这是一个人事命令。"],["w",3],["p","我请大家想像一个画面。"],["p","你们公司有一个主管，很凶，管了你十年。"],["p","有一天，董事会开会，把他免职了。"],["p","但——他还在。"],["p","他还在办公室里走来走去。他还会敲你的门。"],["p","他还会用那个熟悉的、不容置疑的语气说："],["q","「这件事，你去办。」"],["p","弟兄姊妹，这时候你会不会照做？"],["p","这不取决于他有没有权柄——他没有了。"],["p","这取决于——"],["q","你还记不记得，他已经被免职了。"],["w",3],["p","弟兄姊妹，这就是为什么第12节保罗还要下命令："],["q","「不要容罪在你们必死的身上作王。」"],["p","如果罪已经被消灭了，这个命令就是多余的。"],["p","保罗要命令「不要容它作王」，就表示——"],["p","那个被解职的家伙，还在试图坐上王位。"],["h","第一段的应用"],["p","弟兄姊妹，这一段改变了整场战争的性质。"],["q","如果我还没死，那我对付罪的方式是挣扎。\n\n如果我已经死了，那我对付罪的方式是认清。"],["p","这礼拜，当那个熟悉的声音又响起来的时候，我要请你试一件事。"],["p","不要立刻用力抵抗。"],["p","先对它说一句话："],["q","「你已经被免职了。」"],["w",3],["h","第二大段｜一本你要亲自算的帐（6:11）"],["h","全卷书的第一个命令"],["p","弟兄姊妹，现在我们来到全章的枢纽。第11节："],["q","「这样，你们向罪也当看自己是死的；向神在基督耶稣里，却当看自己是活的。」"],["p","我先跟大家说一件事，这件事我自己读了很多年才注意到。"],["p","罗马书从第一章第一节，到第六章第十节——"],["p","大概一百四十节经文。"],["p","保罗没有给读者一个真正的命令。"],["p","没有。一个都没有。"],["p","他一直在讲：你是谁、神做了什么、基督成就了什么。"],["p","整整五章半。"],["p","然后——"],["p","第一个命令，出现在第六章第十一节。"],["p","弟兄姊妹，你们猜那个命令是什么？"],["p","不是「你要努力」。"],["p","不是「你要付出」。"],["p","不是「你要改变」。"],["p","是——"],["q","「你要这样算。」"],["p","弟兄姊妹，神给我们的第一个命令，是关于——"],["q","你怎么看你自己。"],["h","第四章那个字，回来了"],["p","「当看」这个字，希腊文是 λογίζομαι。"],["p","弟兄姊妹，这个字我们见过。"],["p","还记得第四章吗？那一章这个字出现了十一次。"],["q","「亚伯拉罕信神，这就算为他的义。」（4:3）\n\n「主不算为有罪的，这人是有福的。」（4:8）"],["p","那是一个记帐的字。商人记帐、银行入款，用的就是这个字。"],["p","但弟兄姊妹，第四章和第六章，有一个关键的差别。"],["p","第四章，这个字是被动式——"],["q","是神在算。"],["p","第六章，这个字是命令语气——"],["q","是你要算。"],["p","你看见那个次序了吗？"],["q","第四章：神先算了。\n\n第六章：现在，你照着神的算法，算你自己。"],["p","弟兄姊妹，这是全本圣经最重要的一个属灵次序："],["q","我不是靠「算」让那件事成真。\n\n我是因为那件事已经真了，所以我才敢算。"],["h","这不是自我催眠"],["p","我必须在这里停一下，因为这节经文很容易被误用。"],["p","有人会说：「所以我要不断告诉自己『我死了、我死了』，讲久了就会成真？」"],["p","不是。那叫自我催眠，那不是圣经。"],["p","弟兄姊妹，请注意保罗把什么放在第11节前面。"],["p","他放了八节。"],["p","第3节到第10节，全部都是事实陈述——没有一个命令。"],["p","- 你受洗归入祂的死\n- 你与祂一同埋葬\n- 你与祂长成一体\n- 你的旧人与祂同钉\n- 罪身被解职了\n- 死对祂不再有主权\n- 祂向罪死，只有一次"],["p","八节事实。"],["p","然后才是第11节：「这样……当看自己。」"],["q","所以「算」不是把不存在的事说成存在。\n\n「算」是把已经存在的事，登记入帐。"],["p","弟兄姊妹，用刚才那个比喻："],["q","「算」不是自我催眠。\n\n「算」是——把那张免职令拿出来，再看一次。"],["h","为什么很多人原地打转"],["p","弟兄姊妹，我想这一节解释了一件事。"],["p","为什么有些基督徒，道理都懂，也很努力，却一直原地打转？"],["p","我想是因为——他们跳过了第11节。"],["p","他们知道教义（第3到10节）。\n他们也很努力去行动（第12到13节）。"],["p","但中间那个「算」，从来没有做过。"],["p","结果就是："],["q","知识在脑子里。\n行动靠意志力。\n中间，没有桥。"],["p","而第11节，就是那座桥。"],["h","第二段的应用"],["p","这礼拜，我要请大家每天早上做一件事。"],["p","只要十秒钟。"],["p","起床之后，说一句话："],["q","「向罪，我是死的。\n向神，我是活的。\n在基督耶稣里。」"],["p","而且注意——原文的「当看」是现在式命令。"],["p","意思是：一直算下去。"],["p","不是算一次就好了。"],["p","是每一次那个声音来的时候，算一次。"],["w",3],["h","第三大段｜一批不能中立的兵器（6:12–23）"],["h","你的肢体是武器"],["p","弟兄姊妹，讲完「知道」和「算」，保罗终于讲到行动了。"],["p","第13节："],["q","「也不要将你们的肢体献给罪作不义的器具；倒要……将肢体作义的器具献给神。」"],["p","「器具」这个字，希腊文是 ὅπλα。"],["p","弟兄姊妹，这个字在第一世纪的主要意思，不是「工具」。"],["p","是——武器。"],["p","同一个字用在哪里？"],["p","约翰福音18章，犹大带着兵丁来抓耶稣，「拿着灯笼、火把、兵器」——同一个字。"],["p","哥林多后书10章4节：「我们争战的兵器本不是属血气的」——同一个字。"],["p","罗马书13章12节：「当穿上光明的兵器」——同一个字。"],["p","弟兄姊妹，保罗画的画面是什么？"],["q","你的手。\n你的眼睛。\n你的舌头。\n你的时间。\n你的钱包。\n你的手机。\n\n那些不是中立的工具。\n\n那些是武器。"],["p","而武器有一个特点："],["q","它一定在某一方手上。"],["h","没有中立地带"],["p","弟兄姊妹，我觉得这是第六章对我们最扎的一句话。"],["p","我们心里都有一块「中立地带」。"],["p","我们会想：这件事不算属灵，但也不算犯罪嘛。就放着。"],["p","- 这两个小时，我没有做坏事，只是滑手机\n- 这句话，我没有说谎，只是没有说全部\n- 这个关系，我没有越界，只是有一点暧昧"],["p","但保罗说："],["q","你的舌头如果今天没有献给神——\n\n它不是在放假。\n\n它在另一边的军械库里。"],["h","两个命令，两种时态"],["p","弟兄姊妹，第13节还有一个文法上的细节，非常美。"],["p","这一节有两个命令，但它们的时态不一样。"],["p","上半句：「不要将你们的肢体献给罪」——现在式命令。"],["p","在希腊文里，这通常表示：停止一个正在进行的动作。"],["p","下半句：「倒要将自己献给神」——不定过去式命令。"],["p","那表示：一个决断的、一次性的动作。"],["p","弟兄姊妹，这两个时态，画出了基督徒生活的两面："],["q","一面是每天的停止：那个习惯、那个网站、那个念头——停下来。\n\n一面是一次的交出：主啊，我把自己给祢——现在，就一次。"],["p","而这两面，缺一不可。"],["q","只有「每天停止」，会变成一场没有终点的苦战。\n\n只有「一次奉献」，会变成一个没有兑现的承诺。"],["h","你不是在选「有没有主人」"],["p","接下来保罗讲到一个当时人人都懂的画面：奴隶。"],["p","第16节："],["q","「岂不晓得你们献上自己作奴仆，顺从谁，就作谁的奴仆吗？」"],["p","弟兄姊妹，罗马书16章有一长串问安的名单。"],["p","学者告诉我们，里面有好几个是典型的奴隶的名字。"],["p","也就是说：保罗讲这一段的时候，罗马教会里坐着的，真的有奴隶。"],["p","他们比谁都懂一件事："],["q","奴隶没有「兼职」这回事。\n\n你只有一个主人。"],["p","而保罗要拆掉的，是一个很普遍的幻觉："],["q","「我可以不属于任何人。我是自由的。」"],["p","保罗说：没有这种东西。"],["q","人不是在「有主人」和「没主人」之间选。\n\n人是在「哪一个主人」之间选。"],["p","而保罗给了一个非常实际的判准："],["p","你怎么知道你是谁的奴仆？"],["q","不是看你怎么自称。\n\n是看——你听谁的。\n\n当那个声音响起来的时候，你的身体，往哪里走。"],["h","一个你可能没注意的语序"],["p","弟兄姊妹，第17节有一句话，我读了很多年才看见。"],["p","和合本是这样译的："],["q","「你们……现今却从心里顺服了所传给你们道理的模范。」"],["p","听起来像：道理被传给了你们。"],["p","但希腊文的语序，是反过来的。"],["p","原文的意思是："],["q","「那个你们被交付进去的教训的模子。」"],["p","弟兄姊妹，主词和受词对调了。"],["p","| 我们以为 | 保罗说 |\n|---|---|\n| 道理被交给我 | 我被交给道理 |\n| 我掌握真理 | 真理掌握我 |\n| 我把圣经拿在手上 | 我被放进圣经的模子里 |"],["p","「模范」这个字是 τύπος——模子。"],["p","画面是什么？"],["q","熔化的金属，被倒进模子里。\n\n冷却之后，就成了模子的形状。"],["p","弟兄姊妹，保罗说：你被倒进去了。"],["p","我们常说「我学了很多真理」——好像真理是我收藏的东西。"],["p","保罗说：不是。"],["q","你不是拿着模子的人。\n\n你是被倒进模子的那块金属。"],["h","一个准时发薪的雇主"],["p","弟兄姊妹，最后我们来看第23节。这是全本圣经最常被引用的经文之一："],["q","「因为罪的工价乃是死；惟有神的恩赐，在我们的主基督耶稣里，乃是永生。」"],["p","「工价」这个字，希腊文是 ὀψώνια。"],["p","弟兄姊妹，这个字原本的意思，是——"],["p","士兵的口粮和军饷。"],["p","路加福音3章，施洗约翰对兵丁说「当以自己的钱粮为足」——同一个字。"],["p","哥林多前书9章7节：「有谁当兵自备粮饷呢？」——同一个字。"],["p","这个字有两个特点："],["p","第一，它是定期发放的。不是一次结清，是每个月、每一天都在发。"],["p","第二，它是你挣来的。你服役，你领饷。理所当然。"],["p","弟兄姊妹，你听出保罗在说什么了吗？"],["q","罪，是一个准时发薪的雇主。\n\n它从来不欠你。\n它从来不迟发。\n它每一次，都准时把你该得的，付给你。\n\n而它付的那样东西，叫做——死。"],["w",3],["p","而弟兄姊妹，原文里还藏了一个对比，中文完全看不出来。"],["p","「工价」（ὀψώνια）在原文是复数。"],["p","「恩赐」（χάρισμα）在原文是单数。"],["p","你听出来了吗？"],["q","罪的付款方式，是分期的。\n\n你不会在某一天突然收到「死」这个大包裹。\n\n你是一小笔、一小笔地领的。\n\n今天付你一点点空虚。\n明天付你一点点麻木。\n后天付你一点点失去的关系。\n再过几年，付你一点点你已经认不出来的自己。"],["p","——而神的礼物，是单数。"],["q","不是分期。不是试用。\n\n是整个给你。"],["h","一个不对称的句子"],["p","弟兄姊妹，最后一件事。"],["p","照着对称的逻辑，保罗应该这样写："],["q","「罪的工价是死；义的工价是永生。」"],["p","很整齐，对不对？"],["p","但保罗没有这样写。"],["p","他写的是："],["q","「罪的工价乃是死；惟有神的恩赐，乃是永生。」"],["p","一边是「挣来的」。"],["p","一边是「白给的」。"],["p","弟兄姊妹，这个不对称，是整卷罗马书的缩影："],["q","死，是你赚的。\n\n生命，是祂给的。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["p","第一，一场葬礼。"],["p","那场葬礼，两千年前已经举行过了。"],["p","而你受洗那一天，你自己已经公开承认过。"],["p","所以你不是要去死——"],["p","你已经死了。"],["w",3],["p","第二，一本帐。"],["p","神先算了，现在祂命令你照着算。"],["p","那不是自我催眠。那是把那张免职令，再拿出来看一次。"],["w",3],["p","第三，一批兵器。"],["p","你的手、你的眼睛、你的舌头、你的时间——"],["p","没有一样是中立的。"],["p","今天，它们在谁手上？"],["w",3],["p","弟兄姊妹，我想回到开头那位弟兄。"],["p","那位对付了十六年、最后说「我不是不想胜过，我是打不赢」的弟兄。"],["p","我后来跟他说了一段话。我今天也想对在座有同样挣扎的人说："],["q","弟兄，我想你可能一直在打一场已经打完的仗。\n\n你一直在努力杀死一个已经被判死刑的人。\n\n而那个折磨你十六年的主人——\n\n他不是还很强。\n\n他是已经被免职了。\n\n他只是还没搬走，还在敲你的门，还在用以前的语气说话。\n\n而他唯一的权力来源是——\n\n你还记不记得，他已经没有钥匙了。"],["w",3],["p","弟兄姊妹，最后我要问一个问题。"],["p","保罗在第21节问了一个很诚实的问题："],["q","「你们现今所看为羞耻的事，当日有什么果子呢？」"],["p","那些年、那些夜晚、那些选择——"],["p","收成在哪里？"],["p","它付了你多少？"],["w",3],["p","弟兄姊妹，如果你今天心里有一个答案——"],["p","那我要用保罗的最后一句话，对你说："],["q","你已经有礼物了。\n\n何必回去领那份薪水？"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，承认我们当中有人已经打了很久、很累的一场仗。我们立过志、失败过、羞愧过，然后再立志。\n\n主啊，今天祢让我们看见：我们不是要去死，我们已经死了。那场葬礼，祢已经替我们办完了。\n\n求祢让我们每天记得把那张免职令拿出来看。当那个熟悉的声音又响起来的时候，让我们知道——他已经没有钥匙了。\n\n主啊，我们现在把我们的肢体交给祢。我们的眼睛、我们的舌头、我们的手、我们的时间。求祢收下。从今天起，它们是祢的兵器。\n\n我们也承认，我们常常忘记自己是被交进祢话语的模子里的。我们常常以为是我们掌握真理。求祢赦免我们，也求祢继续塑造我们。\n\n谢谢祢，祢不是雇主，祢是父亲。祢的恩赐不是分期，是一次给完。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3]]},"7":{"min":35,"blocks":[["h","我真是苦啊"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","今天我要先说一句话。"],["p","今天在这里，你可以承认你做不到。"],["p","我知道这句话有点奇怪。因为教会通常不是这样的地方。"],["p","教会通常是一个你要说「主恩够用」「感谢主，我很好」的地方。"],["p","但今天不是。"],["p","因为今天我们要读的这一章，是全本圣经最诚实的一章。"],["p","而写这一章的人，在里面说了一句话："],["q","「我真是苦啊！」"],["w",3],["p","我先说一个场景。"],["p","有一位姊妹，跟我谈过一次。"],["p","她说她信主二十年，在教会服事，带小组，别人都觉得她很好。"],["p","然后她说："],["q","「牧师，有一件事我没有跟任何人说过。\n\n我每天晚上，都会跟神说对不起。\n\n二十年了。\n\n同一件事。」"],["p","她停了很久，然后说了最后一句："],["q","「我觉得我在骗人。」"],["w",3],["p","弟兄姊妹，我想今天在座，有人听得懂这句话。"],["p","外面看起来好好的，里面有一件事，你已经跟神道歉了很多年。"],["p","你不敢跟任何人说。因为你怕人家问：「你信主这么久了，怎么还……」"],["p","弟兄姊妹，罗马书第七章，就是为这样的人写的。"],["p","而写它的人，是保罗。"],["w",3],["p","我们今天要看三样东西："],["p","第一，一纸已经失效的婚书。\n第二，一个罪占住的滩头堡。\n第三，一声半夜的呼喊。"],["w",3],["h","第一大段｜一纸已经失效的婚书（7:1–6）"],["h","律法只管活人"],["p","弟兄姊妹，第七章一开始，保罗讲了一个法律常识。第1节："],["q","「你们岂不晓得律法管人是在活着的时候吗？」"],["p","「管」这个字，希腊文是 κυριεύω，意思是「作主、掌权」。"],["p","弟兄姊妹，这个字我们上礼拜见过。"],["p","罗马书6章9节：「死也不再作他的主了。」"],["p","罗马书6章14节：「罪必不能作你们的主。」"],["p","现在7章1节：「律法管人是在活着的时候。」"],["p","三个主人：死、罪、律法。"],["p","而保罗说：它们对你都没有主权了。"],["p","而且解除的方式，都是同一个——"],["p","死。"],["h","一个婚姻的比喻"],["p","然后保罗讲了一个比喻。第2节："],["q","「就如女人有了丈夫，丈夫还活着，就被律法约束；丈夫若死了，就脱离了丈夫的律法。」"],["p","弟兄姊妹，保罗为什么选这个比喻？"],["p","因为婚约有一个特点："],["q","你不能靠「努力」解除它。"],["p","一个妻子不能说：「我最近表现很好，所以我现在自由了。」"],["p","只有一件事能解除婚约："],["p","死。"],["w",3],["p","而第2节那个「脱离了」，希腊文是 καταργέω——"],["p","弟兄姊妹，这正是我们上礼拜看的那个字。罗马书6章6节「使罪身灭绝」，就是这个字。"],["p","而这一次的用法，把意思讲得更清楚了："],["q","一个寡妇，不是「被消灭了」。\n\n她还在。她还活着。她还可以再嫁。\n\n只是那个婚姻的律法，对她失效了。"],["h","你不是变单身，你是改嫁了"],["p","然后第4节，保罗应用了。"],["q","「我的弟兄们，这样说来，你们借着基督的身体，在律法上也是死了，叫你们归于别人，就是归于那从死里复活的。」"],["p","弟兄姊妹，这里有两个地方我要讲。"],["p","第一，「在律法上也是死了」——这个动词在原文是被动式。"],["p","它的字面是：你们被治死了。"],["p","而这个动词在新约，是用在司法处决上的。"],["q","那不是自然死亡。\n\n那是一场行刑。\n\n而行刑的地点在各各他，被处死的是基督的身体——\n但因为你在祂里面，你也一同被处死了。"],["p","第二，也是我觉得最美的一点——"],["p","「叫你们归于别人」。"],["p","这是婚姻语言。"],["p","弟兄姊妹，注意保罗的重点："],["q","神让你脱离律法，不是为了让你自由。\n\n是为了让你归属另一位。\n\n你不是离婚变单身。\n\n你是——改嫁了。"],["h","这对我们是什么意思"],["p","弟兄姊妹，我想问一个问题。"],["p","你跟神的关系，会不会其实是一段很疲惫的婚姻？"],["p","我的意思是：你心里有没有一个公式——"],["q","「我表现好一点，祂就对我好一点。\n我最近软弱，祂大概对我有点失望。」"],["p","如果有，那你可能还活在那段旧的婚姻里。"],["p","而保罗说：那段婚姻，已经结束了。"],["p","不是因为你努力离开，是因为有人被处死了。"],["w",3],["h","第二大段｜一个罪占住的滩头堡（7:7–13）"],["h","律法是罪吗？"],["p","弟兄姊妹，保罗讲到这里，他知道有人会误会。"],["p","所以第7节，他自己先把那个问题问出来："],["q","「这样，我们可说什么呢？律法是罪吗？」"],["p","这是一个很自然的疑问。因为前面讲了那么多「脱离律法」，听起来律法好像是坏东西。"],["p","保罗的回答是："],["q","「断乎不是！」"],["p","而且他在第12节，讲了全本圣经对律法最正面的一句话："],["q","「这样看来，律法是圣洁的，诫命也是圣洁、公义、良善的。」"],["p","弟兄姊妹，四个形容词。"],["p","保罗把律法放在最高的位置上。"],["h","保罗为什么单挑第十诫"],["p","但接下来，保罗讲了一件很有意思的事。第7节："],["q","「非律法说『不可起贪心』，我就不知何为贪心。」"],["p","弟兄姊妹，十条诫命，保罗为什么单单挑这一条？"],["p","我请大家跟我一起想一想。"],["p","不可有别的神——这个可以查。看你去哪里敬拜。"],["p","不可拜偶像——可以查。"],["p","不可妄称神的名——可以查，听你说话就知道。"],["p","当守安息日——可以查。"],["p","当孝敬父母——大致可以。"],["p","不可杀人——可以查。"],["p","不可奸淫——可以查。"],["p","不可偷盗——可以查。"],["p","不可作假见证——可以查。"],["p","九条。全部都可以在外面检查。"],["p","然后第十条——"],["q","「不可贪心。」"],["p","弟兄姊妹，这一条，没有人看得见。"],["w",3],["p","现在我要念另一节经文。腓立比书3章6节，保罗讲自己："],["q","「就律法上的义说，我是无可指摘的。」"],["p","弟兄姊妹，你听懂了吗？"],["q","保罗在那看得见的九条上，拿了满分。\n\n然后有一天——\n\n第十条找上了他。\n\n那一条，只有神和他自己知道。"],["h","一个滩头堡"],["p","接下来第8节，保罗讲了一件很奇怪的事："],["q","「然而罪趁着机会，就借着诫命叫诸般的贪心在我里头发动。」"],["p","「趁着机会」这个字，希腊文是 ἀφορμή。"],["p","弟兄姊妹，这个字在古希腊文里，是一个军事用语。"],["p","它的意思是："],["q","一支军队发动攻击的——出发基地。\n\n今天我们会说：滩头堡。"],["p","保罗的画面是什么？"],["q","罪，本来在你的领土上没有立足点。\n\n然后——\n\n诫命来了。\n\n罪就在那道诫命上，建立了一个据点。"],["w",3],["p","弟兄姊妹，我举一个很小的例子。"],["p","你走在一条走廊上。墙是白的。你根本没注意到那面墙。"],["p","然后你看见一张告示，上面写着："],["q","「油漆未干，请勿触摸。」"],["p","弟兄姊妹，接下来会发生什么事？"],["p","你的手指，开始发痒。"],["w",3],["p","那张告示有错吗？"],["p","没有。它说的是实话。它是为你好。"],["p","但它照出了你里面本来就有的东西——"],["p","而那个东西，一被照到，就开始动了。"],["p","保罗说：这就是律法在我身上发生的事。"],["p","而且他把责任讲得很清楚——"],["q","建立据点的是罪，不是诫命。\n\n诫命只是被利用的地形。"],["h","一个伊甸园的字"],["p","第11节，保罗用了一个字，我觉得是全章最深的一个字："],["q","「因为罪趁着机会，就借着诫命引诱我，并且杀了我。」"],["p","「引诱」这个字，希腊文是 ἐξαπατάω。"],["p","弟兄姊妹，这个字出现在哪里？"],["p","哥林多后书11章3节：「就像蛇用诡诈诱惑了夏娃一样。」"],["p","提摩太前书2章14节：「乃是女人被引诱，陷在罪里。」"],["p","而创世记3章13节，夏娃自己说："],["q","「那蛇引诱我，我就吃了。」"],["p","七十士译本用的，就是这个字。"],["p","弟兄姊妹，保罗在说什么？"],["q","发生在我身上的事——\n\n跟伊甸园里发生的事，是同一件事。"],["h","那我们该怎么办？"],["p","弟兄姊妹，这一段对我们有一个很实际的提醒。"],["p","我们遇到问题的时候，最自然的反应是什么？"],["p","订规矩。"],["p","- 教会出状况了 → 订章程\n- 孩子有问题了 → 订家规\n- 自己软弱了 → 订计划、下决心、写在纸上贴墙上"],["p","规矩本身没有错——律法是圣洁的。"],["p","但保罗提醒我们一件事："],["q","律法是最好的规矩。\n\n它是神亲自颁布的。圣洁、公义、良善。\n\n没有一个人类的制度比它更好。\n\n而——它救不了人。"],["p","所以弟兄姊妹："],["q","任何靠「更好的规矩」建立起来的东西，最后都会走到第7章24节。"],["w",3],["h","第三大段｜一声半夜的呼喊（7:14–25）"],["h","保罗突然换了时态"],["p","弟兄姊妹，从第14节开始，这一章的语气变了。"],["p","而且原文有一个很明显的讯号："],["p","7章7节到13节，全部是过去式。"],["p","7章14节开始——全部变成现在式。"],["p","而且一直到章末。"],["p","这个转换，是保罗刻意的。"],["p","（我要先说一句：这一段的「我」到底是谁，历代敬虔的解经家有不同看法。有人认为保罗在讲信主前，有人认为在讲信主后。但两边都同意一件事——靠自己去守律法，结局就是7章24节。）"],["h","问题不在标准，在材质"],["p","第14节："],["q","「我们原晓得律法是属乎灵的，但我是属乎肉体的。」"],["p","弟兄姊妹，「属乎肉体的」这个字，希腊文是 σάρκινος。"],["p","这个字的字尾，在希腊文里是表示材质的。"],["p","它的意思不是「我很败坏」，而是——"],["q","「我是肉做的。」"],["p","保罗在说什么？"],["q","律法是属天的材质。\n\n我是属地的材质。\n\n两者根本不匹配。"],["p","弟兄姊妹，这句话改变了整个诊断。"],["q","问题不是标准太高。\n\n问题是——材质不对。"],["h","我不缺愿望"],["p","然后第18节，我觉得这是全本圣经最诚实的一句话："],["q","「因为，立志为善由得我，只是行出来由不得我。」"],["p","「由得我」这个字，原文的画面很有意思。"],["p","παράκειμαι——字面是「摆在我旁边」。"],["p","意思是：随手可得。"],["p","弟兄姊妹，保罗在说："],["q","「愿意」这样东西，就摆在我手边，随时可以拿到。\n\n我从来不缺愿望。\n\n愿望多得很。\n\n我缺的是——把它做出来的那个力量。"],["p","弟兄姊妹，这句话说中了多少人？"],["q","决心，我有一堆。\n\n每年一月一号都有。\n\n能力，我没有。"],["h","一个住在里面的房客"],["p","第17节，保罗讲了一个很重要的区分："],["q","「既是这样，就不是我做的，乃是住在我里头的罪做的。」"],["p","「住」这个字，希腊文是 οἰκέω——字根是 οἶκος，房子。"],["p","意思是：居住、定居。"],["p","所以保罗的画面是："],["q","罪，是一个住在我房子里的房客。"],["p","弟兄姊妹，我要提醒一件事："],["q","房客——不是屋主。"],["p","这正是上礼拜第六章那个字（罪身被解职）的延续。"],["p","他被免职了。但他还没搬走。"],["w",3],["p","而弟兄姊妹，这个字最重要的地方在下一章。"],["p","罗马书8章9节：「如果神的灵住在你们心里……」"],["p","罗马书8章11节：「叫耶稣从死里复活者的灵若住在你们心里……」"],["p","同一个字。οἰκέω。"],["q","第七章：罪住在我里面。\n\n第八章：圣灵住在我里面。\n\n同一个字。\n\n不同的住客。"],["h","我不是叛徒，我是战俘"],["p","第23节，保罗用了两个军事用语："],["q","「但我觉得肢体中另有个律和我心中的律交战，把我掳去。」"],["p","「掳去」这个字，希腊文是 αἰχμαλωτίζω——意思是掳为战俘。"],["p","弟兄姊妹，这个字很重要，因为："],["q","战俘，不是叛徒。\n\n叛徒是自己走过去的。\n\n战俘是站在对的一边、却被抓走的人。\n\n他的忠诚没有改变，但他的行动被限制了。"],["p","保罗在说："],["q","我心里站在对的一边。\n\n我的身体却在敌营里。"],["h","那个挣扎，是生命的证据"],["p","弟兄姊妹，我要在这里停一下，因为这件事很重要。"],["p","有人读第七章，会得出一个结论："],["q","「我这样挣扎，是不是根本没得救？」"],["p","保罗在同一章，给了答案。"],["p","第15节，他说「我所恨恶的，我倒去做」。"],["p","「恨恶」这个字很强。弟兄姊妹，一个对罪毫无感觉的人，不会恨恶它。"],["p","第22节，他说：「按着我里面的意思，我是喜欢神的律。」"],["p","「喜欢」这个字在整本新约只出现这一次。它的意思不是「我同意那是对的」，是——"],["q","「我打从心底，与神的律一同欢喜。」"],["p","而罗马书8章7节说：「体贴肉体的，就是与神为仇……不服神的律法，也是不能服。」"],["p","弟兄姊妹，你听出来了吗？"],["q","一个「与神为仇」的人，不可能由衷地喜悦神的律。"],["p","所以我要告诉今天在座、心里有一件事已经挣扎很久的人："],["q","那个挣扎本身，就是生命的证据。\n\n死人不会觉得痛。\n\n你会为这件事难过——\n\n正说明你里面有一位在做工。"],["h","我真是苦啊"],["p","然后——第24节。"],["q","「我真是苦啊！谁能救我脱离这取死的身体呢？」"],["p","「苦」这个字，希腊文是 ταλαίπωρος。"],["p","它在整本新约，只出现两次。"],["p","一次在这里。"],["p","另一次在启示录3章17节，主对老底嘉教会说：「你却不知道你是那困苦、可怜、贫穷、瞎眼、赤身的。」"],["p","弟兄姊妹，这不是「我有点沮丧」。"],["p","这是一个人在绝境中的呼喊。"],["w",3],["p","而我要请大家注意两件事。"],["p","第一，这声呼喊，是进步，不是退步。"],["p","为什么？"],["q","因为一个人要走到第24节，他必须先走过第18节——\n\n「立志为善由得我，只是行出来由不得我。」\n\n也就是说：他必须先用尽全力尝试过，才会喊出这句话。\n\n一个从来没有认真想要圣洁的人，喊不出第24节。"],["p","第二，也是最重要的——"],["p","注意保罗问的是什么。"],["p","他没有问：「什么方法能救我？」"],["p","他没有问：「我该做什么才能救自己？」"],["p","他问的是——"],["q","「谁能救我？」"],["p","弟兄姊妹，一个字的差别。"],["q","从一个方法的问题，变成一个位格的问题。"],["p","而且「救」这个字，希腊文是 ῥύομαι。"],["p","它的意思不是「帮助」，是——"],["q","从危险中，把人拉出来。\n\n抢救。"],["p","（主祷文里「救我们脱离凶恶」，用的就是这个字。）"],["p","弟兄姊妹，保罗要的不是帮助。"],["p","不是指导。"],["p","不是方法。"],["p","他要的是——抢救。"],["w",3],["h","结论"],["p","弟兄姊妹，我要问一个问题。"],["p","你最近为那件挣扎了很久的事祷告，你是怎么祷告的？"],["p","我猜大部分人的祷告，是这样的："],["q","「主啊，求祢帮助我，这次一定要做到。」"],["p","弟兄姊妹，我要说一句可能有点重的话："],["q","「帮助我努力」——\n\n那还是第18节。\n\n那还是「我」在主导，只是加了一点神。"],["p","而第24节的祷告，只有四个字："],["q","「主啊，救我。」"],["w",3],["p","弟兄姊妹，然后——"],["p","第25节。"],["p","保罗在最深的谷底，说了第一句话。"],["p","不是「我要振作起来」。"],["p","不是「我要重新立志」。"],["p","是——"],["q","「感谢神！」"],["p","而原文的字面是：恩典归与神。"],["p","接着他说出那个答案："],["q","「靠着我们的主耶稣基督就能脱离了。」"],["p","弟兄姊妹，注意——"],["p","保罗没有给一个方法。"],["p","没有给五个步骤。"],["p","没有给一套操练。"],["p","他给了一个——"],["p","名字。"],["w",3],["p","弟兄姊妹，我今天要在这里停住。"],["p","因为第七章就是在这里停住的。"],["p","但我要告诉你们下一句是什么。"],["p","罗马书8章1节："],["q","「如今，那些在基督耶稣里的就不定罪了。」"],["p","8章2节："],["q","「因为赐生命圣灵的律，在基督耶稣里释放了我，使我脱离罪和死的律了。」"],["p","弟兄姊妹，你们注意到了吗？"],["p","第七章问：谁能救我？"],["p","第八章答：圣灵释放了我。"],["p","而第八章第9节说："],["q","「神的灵住在你们心里。」"],["p","同一个「住」。"],["q","第七章：罪住在我里面。\n\n第八章：圣灵住在我里面。\n\n弟兄姊妹，从第七章到第八章的转折，不是「我更努力了」。\n\n是——\n\n住在里面的那一位，换了。"],["w",3],["p","弟兄姊妹，我想回到开头那位姊妹。"],["p","那位每天晚上跟神说对不起、说了二十年的姊妹。"],["p","我后来跟她说了一句话。我今天也想对在座有同样光景的人说："],["q","姊妹，你不是在骗人。\n\n你每天晚上还会跟神说对不起——\n\n那不是你的失败，那是你的证据。\n\n一个没有生命的人，不会道歉二十年。\n\n他早就不在意了。"],["p","而我要对你说第二句话："],["q","也许这二十年，你一直在求祂帮你。\n\n今天，你可以换一个字。\n\n求祂——救你。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的主耶稣，\n\n我们今天在祢面前，说一句我们平常在教会不太敢说的话：\n\n我们做不到。\n\n主啊，我们有愿望。我们的愿望多得很。我们立过的志，写过的决心，数都数不完。\n\n但我们没有力量。\n\n主啊，我们也承认，我们一直在求祢「帮助我们努力」。今天我们知道了，那还是我们在主导。\n\n所以现在，我们用保罗的那句话祷告：\n\n主啊，救我。我出不来。\n\n谢谢祢，祢没有让那声呼喊悬在空中。祢在下一句就说了：感谢神，靠着我们的主耶稣基督就能脱离了。\n\n主啊，也求祢安慰今天在座每一个挣扎了很久的人。求祢让他们知道：那个挣扎本身，就是祢在他里面做工的证据。死人不会觉得痛。\n\n求祢的灵住在我们里面，成为我们的能力。\n\n奉主耶稣基督的名祷告，阿们。"],["w",3],["q","【讲员备注】 本篇以呼喊与盼望的入口作结，是刻意的。但务必：\n① 在结束前明确给出第八章的方向（本稿已包含）；\n② 预备会后的个别关怀——这篇道会使一些人第一次愿意开口；\n③ 若察觉有人陷于严重的自我定罪、忧郁或自伤风险，除属灵的陪伴外，应鼓励并协助寻求专业协助。"],["w",3]]},"8":{"min":38,"blocks":[["h","如今"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","上个礼拜，我们停在一个很不舒服的地方。"],["p","罗马书7章24节："],["q","「我真是苦啊！谁能救我脱离这取死的身体呢？」"],["p","我说过，保罗只让那声呼喊，悬在空中一句话。"],["p","今天，我们要读下一句。"],["w",3],["p","不过在读之前，我要先给大家看一件事。"],["p","我请大家记住三个数字。"],["p","罗马书第六章，「圣灵」这个字出现几次？"],["p","零次。"],["p","罗马书第七章第7节到第25节——就是那段「我所愿意的，我并不做」——圣灵出现几次？"],["p","零次。"],["p","而同一段里，「我」出现几次？"],["p","大约四十次。"],["p","然后——罗马书第八章。"],["p","圣灵出现几次？"],["p","二十次以上。"],["w",3],["p","弟兄姊妹，这三个数字，就是第七章与第八章的全部差别。"],["p","第七章的问题，从来不是「知道得不够」。"],["p","保罗知道得很清楚。他说「按着我里面的意思，我是喜欢神的律」。"],["p","第七章的问题是——"],["p","没有能力。"],["p","而第八章第一句话，就把那个能力的名字说出来。"],["w",3],["p","我们今天要看三样东西："],["p","第一，一位新住客。\n第二，三声叹息。\n第三，一把没有停下来的刀。"],["w",3],["h","第一大段｜住客换了（8:1–17）"],["h","一点也没有"],["p","罗马书8章1节："],["q","「如今，那些在基督耶稣里的就不定罪了。」"],["p","弟兄姊妹，我要先跟大家讲原文的语序。"],["p","中文是「如今……就不定罪了」。"],["p","但希腊文的第一个字，是「一点也没有」。"],["p","保罗是这样写的："],["q","「一点定罪也没有——所以，如今，对那些在基督耶稣里的人。」"],["p","他把「没有」放在最前面，像一记重锤先落下来。"],["w",3],["p","而「定罪」这个字，希腊文是 κατάκριμα。"],["p","弟兄姊妹，希腊文有两个相近的字："],["p","一个是「定罪的动作」。"],["p","另一个——就是这里用的——是「判决书本身」。"],["p","所以8:1不只是说「神现在不定你的罪」。"],["p","是说："],["q","那份判决书，本身不存在了。"],["w",3],["p","弟兄姊妹，要感受这一句的分量，你得把它接在7章24节后面读："],["q","「我真是苦啊！谁能救我？」\n\n「一点定罪也没有。」"],["p","一个刚刚承认自己彻底失败的人，听见的第一句话是什么？"],["p","不是「你要改进」。"],["p","不是「下次不可以了」。"],["p","是——"],["p","「没有定罪。」"],["h","那定罪去哪里了？"],["p","但弟兄姊妹，我们要问一个问题。"],["p","罪是真的。失败是真的。"],["p","那定罪去哪里了？"],["p","第3节回答了："],["q","「律法既因肉体软弱，有所不能行的，神就差遣自己的儿子，成为罪身的形状，作了赎罪祭，在肉体中定了罪案。」"],["p","「定了罪案」——这个动词，正是第1节那个「定罪」的动词形式。"],["p","而它定在哪里？"],["q","「在肉体中。」"],["p","在谁的肉体中？"],["q","在祂的肉体中。在十字架上。"],["p","弟兄姊妹，所以是这样的："],["q","定罪没有消失。\n\n定罪换了地址。"],["w",3],["p","而这里我要特别讲一句话，因为保罗写得极其小心。"],["p","第3节说：「成为罪身的形状」。"],["p","「形状」这个字是 ὁμοίωμα——样式。"],["p","弟兄姊妹，保罗没有说「成为罪身」——那等于说基督有罪性。"],["p","他也没有说「成为肉身的形状」——那等于说祂只是看起来像人。"],["p","他说的是：「在罪之肉身的样式中」。"],["p","这一句话同时保住了两件事："],["q","祂真的成为人——真实的肉身、真实的软弱、真实的试探。\n\n但祂没有罪。"],["p","弟兄姊妹，祂进到了我们的处境里面——"],["p","但祂没有沾染那个处境的罪。"],["h","住客换了"],["p","现在我要讲今天最重要的一个字。"],["p","罗马书8章9节："],["q","「如果神的灵住在你们心里，你们就不属肉体，乃属圣灵了。」"],["p","「住」这个字，希腊文是 οἰκέω。它的字根是 οἶκος——房子。"],["p","意思是：居住、定居。"],["p","弟兄姊妹，这个字我们上个礼拜见过。"],["p","罗马书7章17节：「乃是住在我里头的罪做的。」"],["p","7章20节，又说了一次：「乃是住在我里头的罪做的。」"],["p","现在——"],["p","8章9节：「神的灵住在你们心里。」"],["p","8章11节：「叫耶稣从死里复活者的灵若住在你们心里。」"],["p","弟兄姊妹，同一个字。"],["q","第七章：罪住在我里面。\n\n第八章：圣灵住在我里面。"],["p","这就是七章到八章的全部差别。"],["p","不是「我更努力了」。"],["p","是——"],["q","住在里面的那一位，换了。"],["h","一件罗马的法律文件"],["p","好，现在我要讲第一段最温暖的一节。第15节："],["q","「你们所受的，不是奴仆的心，仍旧害怕；所受的，乃是儿子的心，因此我们呼叫：『阿爸！父！』」"],["p","弟兄姊妹，「儿子的心」这个词，希腊文是 υἱοθεσία。"],["p","它不是一个情感的比喻。"],["p","它是一个罗马法律的专有名词——"],["p","「收养」。"],["p","而罗马的收养，跟我们今天想的不太一样。它有几个特点："],["p","第一，旧债一笔勾销。被收养的人，从前欠的债，法律上不复存在。"],["p","第二，获得完整的继承权。与亲生儿子在法律上完全同等。"],["p","第三，需要证人。收养要在证人面前完成。"],["p","第四——这一点最重要——"],["q","不可撤销。\n\n一旦完成，养父不能因为这个孩子后来表现不好，就把收养取消。"],["w",3],["p","弟兄姊妹，你看看这几点跟第八章的关系："],["p","第16节：「圣灵与我们的心同证我们是神的儿女」——那正是收养需要的证人。"],["p","第17节：「和基督同作后嗣」——与亲生儿子完全同等。"],["p","第38到39节：「都不能叫我们与神的爱隔绝」——因为那份收养，不可撤销。"],["h","阿爸"],["p","而第15节里有一个字，保罗没有翻译。"],["p","「阿爸！父！」"],["p","「阿爸」是亚兰文。保罗刻意保留了原音。"],["p","弟兄姊妹，这个字在整本新约，只出现三次。"],["p","罗马书8章15节，一次。"],["p","加拉太书4章6节，一次。"],["p","还有一次——"],["p","马可福音14章36节。"],["p","那是什么地方？"],["p","客西马尼。"],["p","那一夜，主耶稣俯伏在地，汗珠如大血点滴在地上。"],["p","祂说："],["q","「阿爸！父啊！在你凡事都能；求你将这杯撤去。然而，不要从我的意思，只要从你的意思。」"],["p","弟兄姊妹，你听见了吗？"],["q","主耶稣在祂一生最痛的那一夜，用的那个称呼——\n\n祂让我们也可以用。"],["w",3],["p","而「呼叫」这个字，希腊文是 κράζω。"],["p","它不是轻声细语。它的意思是——大声喊叫。"],["p","（马太福音27章50节：「耶稣又大声喊叫，气就断了」——同一个字。）"],["p","所以保罗描写的不是一个安静的宗教习惯。"],["p","是一个孩子在需要的时候，冲口而出的那一声。"],["w",3],["p","弟兄姊妹，我要在这里问一个问题。"],["p","你祷告的时候，是什么语气？"],["p","是这样吗——"],["q","「主啊……我这个礼拜做得不太好……我不太敢求祢……」"],["p","如果是，弟兄姊妹，那可能还是奴仆的心。"],["p","因为第15节说得很清楚：「不是奴仆的心，仍旧害怕。」"],["q","如果你顺服的动力是害怕，\n\n那你可能还在第六章，还没有进第八章。"],["w",3],["h","第二大段｜三声叹息（8:18–27）"],["h","一个踮起脚的宇宙"],["p","弟兄姊妹，从第18节开始，保罗把镜头拉远了。"],["p","拉到整个宇宙。"],["p","第19节："],["q","「受造之物切望等候神的众子显出来。」"],["p","「切望等候」这个字，希腊文很有画面：ἀποκαραδοκία。"],["p","它是由三个部分组成的：「离开」＋「头」＋「看」。"],["p","合起来的画面是："],["q","把头伸出去，踮起脚，往地平线看。"],["p","弟兄姊妹，保罗说：整个受造界，正踮着脚在等一件事。"],["p","等什么？"],["q","「等候神的众子显出来。」"],["h","三声叹息"],["p","然后保罗讲了三声叹息。"],["p","第一声，在第22节："],["q","「我们知道一切受造之物一同叹息、劳苦，直到如今。」"],["p","弟兄姊妹，「劳苦」这个字，希腊文是 ὠδίν。"],["p","它的意思很具体——"],["q","生产的阵痛。"],["p","这一点极其重要。"],["q","产痛不是临终的呻吟。\n\n产痛是生产的呻吟。\n\n它有方向。它有终点。它会生出东西来。"],["w",3],["p","第二声叹息，在第23节。而这一节，我觉得是全章最诚实的一节："],["q","「不但如此，就是我们这有圣灵初结果子的，也是自己心里叹息。」"],["p","弟兄姊妹，你听见了吗？"],["p","保罗没有说：「你有圣灵了，所以你不该有负面情绪。」"],["p","他说：我们这些有圣灵的人——也是在叹息。"],["q","叹息不是不属灵。\n\n叹息是——还没到家的证据。"],["w",3],["p","然后是第三声。第26节。"],["p","而这一声，是全章最让我震动的："],["q","「只是圣灵亲自用说不出来的叹息替我们祷告。」"],["p","弟兄姊妹——"],["q","受造之物在叹息。\n\n我们在叹息。\n\n而神自己，也在叹息。"],["p","祂没有站在我们的痛苦外面。"],["p","祂进到那个叹息里面。"],["h","走到另一端一起擡"],["p","第26节开头还有一个字，我一定要跟大家分享。"],["q","「我们的软弱有圣灵帮助。」"],["p","「帮助」这个字，希腊文是 συναντιλαμβάνεται。"],["p","它是三个部分组成的："],["p","σύν——一同。\nἀντί——在对面。\nλαμβάνω——抓住、扛起。"],["p","合起来的画面是什么？"],["q","有一个人，扛不动一根很重的木头。\n\n另一个人走过来——\n\n不是站在旁边喊「加油」。\n\n是走到那根木头的另一端，\n\n弯下腰，\n\n跟他一起擡。"],["p","弟兄姊妹，这就是圣灵在你的软弱中做的事。"],["w",3],["p","而第26节还说了一句话，我觉得对很多人是极大的释放："],["q","「我们本不晓得当怎样祷告。」"],["p","弟兄姊妹，我遇过很多人跟我说：「牧师，我不太会祷告。」"],["p","保罗说："],["q","对。你不会。\n\n我也不会。\n\n「我们本不晓得当怎样祷告。」"],["p","但那不是问题。"],["p","因为有一位在你里面，用你发不出来的声音，替你祷告。"],["w",3],["h","第三大段｜一把没有停下来的刀（8:28–39）"],["h","一节被用错很多次的经文"],["p","弟兄姊妹，我们现在来到第28节。"],["p","这可能是全本圣经最常被引用、也最常被用错的一节："],["q","「我们晓得万事都互相效力，叫爱神的人得益处。」"],["p","我先说它常被怎么用错。"],["p","有人刚失去亲人，第三天，有人走过来拍拍他的肩膀说："],["q","「别难过，万事都互相效力嘛。」"],["p","弟兄姊妹，那不是安慰。那是伤害。"],["w",3],["p","我要说三件事。"],["p","第一，保罗没有说「万事都是好的」。"],["p","他说「万事互相效力」。"],["q","那些事本身，可能是坏的、是痛的、是不该发生的。\n\n但神能把它们编织进一个目的里。"],["p","第二，那个「益处」是什么？"],["p","保罗在下一节，自己定义了："],["q","第29节：「就预先定下效法他儿子的模样。」"],["p","弟兄姊妹，神所说的「益处」——"],["q","不是「你的处境会改善」。\n\n是「你会越来越像祂的儿子」。"],["p","第三——这是牧养上的提醒——"],["q","这节经文，是给受苦的人自己，在漫长的日子里慢慢消化的。\n\n不是给旁观者，在事发第三天拿来安慰人的。"],["p","弟兄姊妹，你们记得约伯的三个朋友吗？"],["p","他们前七天，做对了。"],["p","圣经说：「七天七夜坐在地上，一个人也不向他说句话。」"],["p","他们错在——第八天开口。"],["h","一条每一环都在神手上的链子"],["p","接下来第29、30节，被称为「金链」。因为五个环节扣得死死的："],["q","预先知道 → 预先定下 → 召 → 称义 → 得荣耀"],["p","弟兄姊妹，我要你们注意一件事。"],["p","这五个动词，主词全部是神。"],["p","祂预先知道。\n祂预先定下。\n祂召。\n祂称义。\n祂叫他们得荣耀。"],["q","没有一环，是「然后你要努力」。\n\n链子的两端都在神手上——而中间，没有一个环是断的。"],["w",3],["p","（我要在这里诚实说一句：关于「预先所知道的」到底是什么意思，历代敬虔的信徒有不同的看法。有人认为那是神拣选的爱，有人认为那是神预先看见人的信。但两边都同意一件事——这条链子的每一环，主词都是神。）"],["w",3],["p","而最后那个动词，有一个地方很奇怪。"],["p","「所称为义的人又叫他们得荣耀」——"],["p","弟兄姊妹，「得荣耀」在原文是过去式。"],["p","可是保罗在第18节才刚说：「将来要显于我们的荣耀」。"],["p","那件事还没发生啊。"],["p","为什么用过去式？"],["q","因为在神那里——\n\n那件还没发生的事，已经定案了。\n\n祂用过去式讲未来，因为那个未来不可能不发生。"],["h","那把刀"],["p","弟兄姊妹，现在我们来到今天最重要的一节。"],["p","第32节："],["q","「神既不爱惜自己的儿子，为我们众人舍了，岂不也把万物和他一同白白地赐给我们吗？」"],["p","「不爱惜」这个字，希腊文是 οὐκ ἐφείσατο。"],["p","它的意思是：没有留下不给。"],["w",3],["p","弟兄姊妹，现在我要请大家跟我一起，回到一座山上。"],["p","创世记22章。摩利亚山。"],["p","一个老人，带着他的独生子上山。"],["p","柴在儿子背上。"],["p","儿子问了一句话：「请看，火与柴都有了，但燔祭的羊羔在哪里呢？」"],["p","父亲说：「我儿，神必自己预备作燔祭的羊羔。」"],["p","然后——"],["p","他们到了那个地方。筑了坛。摆好柴。"],["p","把儿子捆起来，放在柴上。"],["p","那个老人，伸手拿刀。"],["w",3],["p","然后，圣经说，有声音从天上来："],["q","「亚伯拉罕！亚伯拉罕！……不可在这童子身上下手！」"],["p","弟兄姊妹，那把刀——"],["p","停住了。"],["w",3],["p","而那个声音接着说了一句话。创世记22章12节，七十士译本的希腊文是这样的："],["q","「因为我知道你是敬畏神的了；你没有将你的儿子，就是你独生的儿子，留下不给我。」"],["p","「没有留下不给」——"],["p","弟兄姊妹，那个希腊文的动词，就是 οὐκ ἐφείσω。"],["p","而罗马书8章32节说："],["q","「神既不爱惜（οὐκ ἐφείσατο）自己的儿子。」"],["p","同一个动词。"],["w",3],["p","弟兄姊妹，保罗在做什么？"],["p","他在把我们带回那座山。"],["q","在摩利亚山上，神对亚伯拉罕说：\n\n「你没有留下你的儿子。」\n\n在各各他，保罗对我们说：\n\n「神没有留下祂自己的儿子。」"],["p","而这两座山之间，有一个决定性的差别。"],["p","摩利亚山上，刀举起来了——然后有声音喊：「不可下手。」"],["p","那把刀，停住了。"],["p","而且有一只公羊，代替了以撒。"],["w",3],["p","各各他。"],["p","父举起了刀。"],["p","没有声音喊停。"],["p","那把刀——"],["p","没有停。"],["p","而且弟兄姊妹，那一天，没有任何东西代替祂。"],["p","因为——"],["p","祂就是那只羊。"],["h","所以，还有什么舍不得？"],["p","弟兄姊妹，第32节的后半句，是一个逻辑："],["q","「岂不也把万物和他一同白白地赐给我们吗？」"],["p","这就是我们几个礼拜前看过的那个「何况」。"],["q","祂已经给了最贵的那一样。\n\n剩下的，还有什么舍不得？"],["h","一个空着的原告席"],["p","接下来第33、34节，保罗摆出了一个法庭："],["q","「谁能控告神所拣选的人呢？有神称他们为义了。」\n\n「谁能定他们的罪呢？有基督耶稣已经死了，而且从死里复活，现今在神的右边，也替我们祈求。」"],["p","弟兄姊妹，你看看这个法庭："],["p","法官席上坐的是谁？"],["p","神——那位称我为义的。"],["p","辩护律师是谁？"],["p","基督——祂替我祈求。"],["p","证人是谁？"],["p","第16节说了：圣灵与我们的心同证。"],["p","那——原告席呢？"],["q","空着。"],["h","得胜有余"],["p","第37节："],["q","「然而，靠着爱我们的主，在这一切的事上已经得胜有余了。」"],["p","「得胜有余」，希腊文是 ὑπερνικῶμεν。"],["p","νικάω 是「得胜」。保罗在前面加了 ὑπέρ——「超过」。"],["p","这个字在整本新约，只出现这一次。"],["p","弟兄姊妹，和合本译「得胜有余」，译得非常好。"],["p","但我要请大家注意保罗说的一句话："],["q","「在这一切的事上。」"],["p","不是「脱离了这一切」。"],["p","是——在这一切里面。"],["q","得胜，不是苦难没有发生。\n\n得胜是：苦难发生了，而它夺不走那份爱。"],["h","那份清单"],["p","最后，第38、39节。"],["p","保罗列了一份清单："],["q","「无论是死，是生，是天使，是掌权的，是有能的，是现在的事，是将来的事，是高处的，是低处的，是别的受造之物，都不能叫我们与神的爱隔绝。」"],["p","十样。"],["p","弟兄姊妹，我第一次认真读这份清单的时候，心里有一个问题。"],["p","我想：「那我自己呢？」"],["p","死不能。生不能。天使不能。"],["p","可是我呢？"],["p","如果哪一天，我自己搞砸了，我自己走开了——"],["p","我会不会把自己弄丢？"],["w",3],["p","弟兄姊妹，答案就在那份清单的最后一项。"],["p","保罗写的是："],["q","「或是别的受造之物。」"],["p","我问一个问题："],["p","我是不是受造之物？"],["p","是。"],["p","所以——"],["q","我也在那份清单里。"],["w",3],["h","结论"],["p","弟兄姊妹，我们今天看了三样东西。"],["p","第一，一位新住客。"],["p","第七章：罪住在我里面。"],["p","第八章：圣灵住在我里面。"],["p","同一个字。不同的住客。"],["p","所以你不必再靠自己了。"],["w",3],["p","第二，三声叹息。"],["p","受造之物在叹息。你在叹息。神也在叹息。"],["p","而那不是临终的呻吟，是产房里的呻吟。"],["p","它有终点。它会生出东西来。"],["w",3],["p","第三，一把没有停下来的刀。"],["p","摩利亚山上，那把刀停住了。"],["p","各各他，那把刀没有停。"],["p","所以——"],["q","「神既不爱惜自己的儿子，为我们众人舍了，\n\n岂不也把万物和他一同白白地赐给我们吗？」"],["w",3],["p","弟兄姊妹，第八章是以「不定罪」开始的。"],["p","是以「不隔绝」结束的。"],["p","而中间，住着圣灵。"],["w",3],["p","我最后要念一次那最后一句话。"],["p","请大家注意最后几个字："],["q","「都不能叫我们与神的爱隔绝；\n\n这爱是在我们主基督耶稣里的。」"],["p","弟兄姊妹，保罗写完了全本圣经最壮阔的一段之后——"],["p","最后落在哪里？"],["p","落在一个词上："],["q","「我们的主。」"],["p","不是「那位主」。"],["p","是——我们的主。"],["p","我们一起低头祷告。"],["w",3],["q","亲爱的阿爸父，\n\n我们今天要用这个称呼来祷告。因为祢的儿子在客西马尼那一夜这样叫祢，而祢让我们也可以这样叫。\n\n阿爸，谢谢祢——一点定罪也没有。那份判决书，已经落在祢儿子的身上了。\n\n谢谢祢，住在我们里面的那一位，换了。我们不用再靠自己了。\n\n主啊，我们当中有人正在叹息。求祢让他知道：叹息不是不属灵，那是还没到家的证据。而祢自己，也在那个叹息里面。\n\n我们当中有人不会祷告。求祢让他知道：有一位在他里面，用他发不出来的声音替他说话。\n\n阿爸，最后——谢谢祢那把没有停下来的刀。\n\n在摩利亚山上，祢说：「不可下手。」\n在各各他，祢没有这样说。\n\n因为祢爱我们。\n\n求祢让我们今天走出去的时候，心里带着那份清单的最后一项——\n连我们自己，都不能叫我们与祢的爱隔绝。\n\n奉我们主基督耶稣的名祷告，阿们。"],["w",3]]},"9":{"min":35,"blocks":[["h","神的话落空了吗？"],["w",3],["h","开场"],["p","弟兄姊妹，平安。"],["p","上个礼拜，我们一起读完了罗马书第八章。"],["p","我们停在那句全本圣经最壮阔的话上："],["q","「因为我深信，无论是死，是生……都不能叫我们与神的爱隔绝。」"],["p","弟兄姊妹，那是一个高峰。"],["p","而今天，我们要读下一句。"],["w",3],["p","罗马书9章1到3节："],["q","「我在基督里说真话，并不谎言……我是大有忧愁，心里时常伤痛；为我弟兄，我骨肉之亲，就是自己被咒诅，与基督分离，我也愿意。」"],["p","弟兄姊妹，你们听出来了吗？"],["p","一个人刚刚才说完：「没有什么能叫我与神的爱隔绝。」"],["p","下一句就说：「为了我的同胞，我愿意自己被隔绝。」"],["w",3],["p","这不是矛盾。"],["p","这是——爱的爆发。"],["q","一个人真的知道自己被抓得多牢的时候，\n\n他会开始为那些还在外面的人心碎。"],["w",3],["p","不过弟兄姊妹，我要先说明一件事。"],["p","罗马书第九章，是全卷书最容易吵架的一章。"],["p","因为它讲「拣选」，讲「窑匠与泥土」，讲「神要怜悯谁就怜悯谁」。"],["p","而历代敬虔的基督徒，在这一章的一些细节上，确实有不同的看法。"],["p","所以我今天要做两件事："],["p","第一，我会诚实地告诉大家哪些地方有不同
