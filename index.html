虔的學者有不同理解。","care":"不同宗派對女性職分的看法不同。可以說明自己教會的立場，但不宜宣稱「經文明明說她是（或不是）執事」。"},{"id":"ISS07","t":"守日與安息日","r":"14:5","ch":[14],"why":"保羅說「有人看這日比那日強；有人看日日都是一樣」，卻沒有裁決。","pos":[["主日／安息日仍有規範性","十誡是道德律","14:5指的是猶太的節期與禁食日，不含第四誡"],["一切日子皆同","保羅把「日子」列為可爭議之事","西2:16–17「在節期、月朔、安息日……原是後事的影兒」"],["中間立場","原則永存，形式已成全","安息（安息、敬拜）的原則永存，但其舊約形式已在基督裡成全"]],"con":["保羅在此沒有裁決——他說：「各人心裡要意見堅定。」（14:5）","這件事本身正好示範了本章的原則：連保羅都不定案的事，我們更該用14:1的態度"],"say":"這件事保羅自己沒有定案。他只說：各人心裡要意見堅定。","care":"可以說明自己教會的實踐，但不宜宣告持不同看法的信徒違背聖經。"}],"terrain":{"points":[[1,52,"1:18","忿怒顯明","low"],[3,88,"3:20","每一張嘴","bot"],[3.5,18,"3:21","但如今","top"],[5,26,"5:8","何況",""],[7,92,"7:24","我真是苦啊","bot"],[8,8,"8:1","如今","top"],[11,20,"11:33","深哉","top"],[12,42,"12:1","所以",""],[15,38,"15:7","彼此接納",""],[16,30,"16:27","榮耀歸神","top"]]},"serm":{"1":{"min":35,"blocks":[["h","我不以福音為恥"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","在我們讀經文之前，我想先請你在心裡回答一個問題。不用說出來，就在心裡。"],["p","如果失去某一樣東西，你的人生就會崩塌——那是什麼？"],["p","想到了嗎？請你先把它放在心裡。今天早上結束之前，我們會再回來看它。"],["w",3],["p","我先講一個故事。這故事我聽人說過好幾個版本，所以我不敢說它是真人真事，但它說的道理是真的。"],["p","有一位老先生，家裡客廳掛著一幅畫，是祖父留下來的。畫框有點舊，顏色有點暗。有一天他嫌它老氣，就去市場買了一幅顏色鮮豔、看起來時髦的印刷畫掛上去，把舊的那幅拿去二手店換了一點錢。"],["p","幾年以後，一位懂畫的朋友來作客，看見牆上那幅新畫，問他：「你以前那幅呢？」"],["p","老先生說：「太舊了，換掉了。」"],["p","朋友愣了很久，才輕聲說：「那是真跡。」"],["p","弟兄姊妹，你能體會那一刻的感覺嗎？不是被偷、不是被搶——是他自己換掉的。他親手把真的換成假的，而且當時還覺得自己很聰明。"],["p","今天我們要讀的羅馬書第一章，講的就是這樣的交換。而且不只一場，是三場。"],["w",3],["p","保羅在這一章寫下一句我們都很熟的話：「我不以福音為恥。」"],["p","我們常把這句話讀成一句口號，好像保羅在振臂高呼。可是你想想，一個人為什麼要特別聲明「我不以某件事為恥」？"],["p","因為那件事，在當時看起來就是可恥的。"],["p","這封信是要寄到羅馬——當時世界的首都，一百萬人口的大城，帝國的心臟。而保羅要傳的信息是什麼？是一個在帝國邊陲的小行省、被羅馬人用十字架處死的猶太木匠。"],["p","十字架在當時是什麼？那是留給奴隸和叛亂者的極刑。羅馬最有名的演說家西塞羅曾經說過，這個字連讓羅馬公民聽見都不合適。"],["p","在羅馬的帕拉丁山，考古學家曾挖出一幅古代的塗鴉——年代大約在主後二、三世紀。上面畫著一個被釘十字架的人，卻長著一顆驢頭；旁邊一個人舉起手，底下寫著一行字：「亞歷山米諾敬拜他的神。」"],["p","這就是那個世界看基督徒的眼光：荒謬、可笑、可恥。"],["p","而保羅說：我不以為恥。"],["p","今天早上，我想陪大家看這一章裡的三場交換。"],["w",3],["h","第一大段｜人換掉了神（1:18–32）"],["p","我們先看一件事。"],["p","第16、17、18節，這三節在原文裡是被三個「因為」串起來的。"],["p","保羅說：我不以福音為恥——因為它是神的大能。\n它是神的大能——因為神的義在它上面顯明。\n神的義必須顯明——因為（第18節）神的忿怒已經顯明了。"],["p","弟兄姊妹，這就是保羅的邏輯。而他的邏輯告訴我們一件事："],["p","如果沒有第18節，第16節就不是好消息。"],["p","一個人如果不覺得自己有病，你告訴他有特效藥，他只會覺得你煩。"],["p","所以我們今天要倒著走，先從第18節開始。"],["w",3],["p","那麼，人到底出了什麼問題？"],["p","保羅的診斷在第21節。我要說，這一節可能是整本聖經對人類問題最準確的一句話："],["q","「因為，他們雖然知道神，卻不當作神榮耀他，也不感謝他。」"],["p","各位有沒有注意到，這裡一個具體的罪行都沒有提？"],["p","沒有說殺人，沒有說偷竊，沒有說姦淫。"],["p","保羅說：問題在兩件事——不榮耀神，不感謝神。"],["p","「榮耀祂」是什麼意思？聖經裡「榮耀」這個字，希伯來文的字根意思是「重」。榮耀神，就是承認神在我生命裡該有的份量、該有的位置。"],["p","不榮耀祂，就是把神從寶座上請下來。"],["p","「感謝祂」是什麼意思？感謝，就是承認我手上的一切都是領受的，不是我掙來的。"],["p","不感謝祂，就是把自己當成源頭。"],["p","弟兄姊妹，這兩件事加起來，就是人類一切問題的根。"],["p","神不在寶座上，我在寶座上。"],["p","我們的舊生命，最核心的特徵就是這個：以自己為中心，自己要作主，自己要作王，想要代替神。"],["p","而這不是從我們開始的。這是從伊甸園開始的。蛇對女人說了一句話，那句話成了人類歷史上一切悲劇的種子："],["p","「你們便如神。」"],["p","保羅在第25節說：他們「將神的真實變為虛謊」。原文那個「虛謊」前面有一個冠詞——不是隨便一個謊，是那個謊言。"],["p","哪一個？就是那一個。"],["w",3],["p","接下來保羅描述這個謊言的後果，而他用了一個很重的字，重複了三次。"],["p","第23節：他們「換」——把不能朽壞之神的榮耀，換成必朽壞的人、飛禽、走獸、昆蟲的形像。"],["p","第25節：他們「換」——把神的真實換成虛謊。"],["p","第26節：他們「換」——把順性的用處換成逆性的用處。"],["p","弟兄姊妹，人生的悲劇，是一連串的「換」。"],["p","就像那位老先生，用真跡換了印刷品，還覺得自己賺到了。"],["p","原文在23節用了一組刺目的對比：不能朽壞的，換成必朽壞的。"],["p","用會爛的，換不會爛的。"],["p","這是全世界最虧本的交易，而全人類都做過。"],["p","而且你注意那個順序：人 → 飛禽 → 走獸 → 昆蟲。"],["p","一路往下。"],["p","創世記裡，神造飛鳥，造走獸，造爬蟲，最後照著自己的形像造人。人在最上面。"],["p","羅馬書第一章，把這個順序倒過來走了一遍。"],["p","這是聖經給我們一個嚴肅的提醒：你拜什麼，你就變成什麼。詩篇115篇說：「造他的要和他一樣。」"],["p","我認識過一位父親——這樣的人其實不少。他這一輩子把「成就」放在寶座上。他很努力，真的很努力，他不是壞人，他是為了這個家。孩子小的時候，他缺席每一次生日，因為在出差；孩子中學的時候，他在飯桌上問的每一句話都是成績；孩子大學畢業那年，他終於升上了他要的位置。"],["p","那天晚上他打電話回家，想跟兒子說這個好消息。"],["p","兒子接了，說了三句話：「喔。恭喜。我在忙。」"],["p","然後掛了。"],["p","弟兄姊妹，他得到了他放在寶座上的那樣東西。他也失去了那個他原本說要為他打拚的人。"],["p","你拜什麼，你就變成什麼。你把什麼放在寶座上，那個東西就會決定你變成什麼樣的人。"],["w",3],["p","接下來，我要處理這一章裡最多人跳過的兩節：第26、27節。"],["p","我不打算跳過。但我要先請大家看清楚保羅擺放它們的位置。"],["p","保羅在25節說：人把神的真實「換」掉了。然後26節，他用了同一個動詞：他們把「順性的用處換為逆性的用處」。"],["p","保羅在做一件事：他讓你看見，當一個人在敬拜上把創造主跟受造物對調，這個對調會一路延伸到人的身體與關係。"],["p","這是他的神學論證——不是一張罪的排行榜。"],["p","我怎麼知道不是排行榜？因為再往下讀三節，同一份清單上還有：嫉妒、爭競、詭詐、背後說人的、狂傲的、自誇的、違背父母的、無親情的、不憐憫人的。"],["p","弟兄姊妹，如果這份清單是排行榜，那今天早上這間屋子裡——包括站在這裡講道的我——沒有一個人可以坐著。"],["p","所以請不要拿第26、27節出去丟人。因為保羅在下一章第一句話，就轉過身來對我們說：「你這論斷人的，無論你是誰，也無可推諉。」"],["p","但我也不能把這兩節從聖經裡剪掉。保羅在這裡確實是照著創世記一、二章男女受造的秩序在說話。我照著原樣讀出來，因為神的話不需要我替祂修飾。"],["p","而我要一起讀出來的，是另外一段。哥林多前書第6章，保羅列了一份幾乎一樣的清單，然後他說了一句話："],["q","「你們中間也有人從前是這樣；但如今你們奉主耶穌基督的名，並藉著我們神的靈，已經洗淨，成聖，稱義了。」"],["p","「從前是這樣。」"],["p","弟兄姊妹，福音的能力，就在這四個字裡面。"],["p","這節經文裡，沒有一種人是無藥可救的——包括你，也包括我。"],["w",3],["p","然後，保羅說了本章最可怕的一句話，而且說了三次。"],["p","第24節：「神就任憑他們。」\n第26節：「神就任憑他們。」\n第28節：「神就任憑他們。」"],["p","「任憑」這兩個字，中文聽起來像是「隨他去吧」，好像神只是不管了。"],["p","原文重得多。"],["p","這個字在希臘文是主動語態，主詞是神。它的意思是「交付、移交」。這是法庭跟軍事的用語：法官把囚犯交給獄卒；將領把城交給敵人。"],["p","神不是不管，神是宣判。"],["p","請聽清楚一件事，這件事很重要：神沒有把罪放進他們心裡。 那情慾原本就在他們心裡，是他們自己要的。神所做的，是不再攔阻。"],["p","我想到一個畫面。一個小孩在路邊掙扎著要衝到馬路中間。爸爸抓住他的手，他掙脫；再抓，再掙脫；抓了十次，喊了十次。"],["p","最後，爸爸鬆手了。"],["p","那一刻，不是爸爸不愛他。是爸爸終於把他交給了他自己一直堅持要的東西。"],["p","弟兄姊妹，罪最可怕的刑罰之一，就是罪本身。"],["p","「逞著心裡的情慾」——他們得到了他們想要的。那就是刑罰。"],["w",3],["p","那有人會問：那些從來沒聽過福音的人呢？他們怎麼辦？"],["p","第20節說：藉著所造之物，神的永能和神性是明明可知的，「叫人無可推諉」。"],["p","請注意這句話說了什麼，也請注意它沒有說什麼。"],["p","它說受造之物讓人無可推諉。它沒有說受造之物能讓人得救。"],["p","所以保羅才會在第15節那裡拚了命地說「我情願盡我的力量」，要去羅馬，甚至還要去西班牙。"],["p","如果看看星空就夠了，他何必冒這個險？"],["w",3],["p","好，我們來到第一大段的最後一節，也是整章的最後一節。"],["p","保羅把最重的一句留在這裡："],["q","「他們雖知道神判定行這樣事的人是當死的，然而他們不但自己去行，還喜歡別人去行。」"],["p","比犯罪更嚴重的，是為犯罪鼓掌。"],["p","因為犯罪的人，良心可能還會痛。但是為罪辯護、為罪鼓掌、為罪按讚、為罪推廣的人，已經把良心的最後一道防線也交出去了。他不只是自己跌倒，他在建立一個讓跌倒變成正常的系統。"],["p","在這個時代，「喜歡別人去行」，有時候只需要動一根手指。"],["p","弟兄姊妹，請記住這一節，記住這個字。"],["p","因為等一下，我們會回到這裡。而我要告訴你的事，會讓你重新認識寫這封信的人。"],["w",3],["p","現在，我們暫時把這面鏡子放下。"],["p","因為照鏡子有一個規矩：一次只照一個人——照自己。"],["p","而照完鏡子之後，我們需要的不是更用力地擦臉。"],["p","我們需要一場新的交換。"],["w",3],["h","第二大段｜神換來了義（1:16–17）"],["q","「我不以福音為恥；這福音本是神的大能，要救一切相信的，先是猶太人，後是希臘人。」"],["p","保羅在這裡講了兩件事。"],["p","第一，福音是神的大能。"],["p","原文裡有一個字，我想請大家聽清楚：那個「是」。"],["p","保羅沒有說福音「有」大能，也沒有說福音「帶來」大能。他說：福音就是那大能。"],["p","這句話對今天的教會很重要。"],["p","我們常常以為，人會不會信主，取決於我講得好不好、詩歌好不好聽、活動辦得夠不夠吸引人、我的見證夠不夠精彩。"],["p","弟兄姊妹，那些都是器皿，不是能力。"],["p","福音本身就是神的大能。保羅親眼見過：那個在大馬色路上的人，手裡拿著拘票，心裡燒著怒火，一心要把教會連根拔起。是誰改變了他？不是有人辯贏了他。是那道光，是那個聲音，是那位復活的主。"],["p","所以他傳福音的時候不緊張。他不需要把福音包裝得比較討喜，因為他知道這東西本身有能力。"],["p","第二，神的義在這福音上顯明。"],["q","「因為神的義正在這福音上顯明出來；這義是本於信，以至於信。」"],["p","「神的義」這四個字，曾經是一個人心裡最大的恐懼。"],["p","五百多年前，德國有一位年輕的修士，叫馬丁路德。他極其敬虔，禁食、守夜、認罪認到告解神父都受不了。可是他越努力，越絕望。他晚年自己回憶說：他恨「神的義」這幾個字。"],["p","為什麼？因為他讀成：神是公義的，所以祂要按公義刑罰我這個罪人。"],["p","那我怎麼辦？我怎麼可能達得到？"],["p","直到有一天，他在羅馬書1章17節上被光照。他忽然看見——"],["p","這義不是神向我要求的義。這義是神賜給我的義。"],["p","「這義是本於信，以至於信。」原文的意思不是「從小信到大信」，而是一種強調的重複：從頭到尾，全都是信。"],["p","路德說，那一刻，他覺得自己整個人重生了，天堂的門為他敞開。"],["w",3],["p","弟兄姊妹，我想問一個很誠實的問題。"],["p","你心裡是不是也有一本功過簿？"],["p","我想到一位年輕的媽媽。她跟我說過一件事。"],["p","那天晚上她累壞了，孩子不肯睡，鬧了兩個小時。她忍到最後忍不住，對著孩子吼了一句很難聽的話。孩子哭著睡著了。"],["p","她坐在客廳，一句話都說不出來。她說：「那個時候我最想做的事就是禱告。可是我不敢。」"],["p","我問她為什麼。"],["p","她說：「我今天早上才讀完靈修筆記，才在群組裡分享要溫柔。晚上我就變成這樣。我覺得神一定很失望。我想等我明天做得好一點，再來跟祂說話。」"],["p","弟兄姊妹，她那天晚上在沙發上坐了二十分鐘，一句禱告都沒有說。"],["p","而那二十分鐘，正是她最需要神的二十分鐘。"],["p","如果你也是這樣——表現好的日子敢禱告，跌倒的日子躲起來——那麼弟兄姊妹，你還在靠自己的義活著。"],["p","福音說的是什麼？「義人必因信得生。」"],["p","保羅這句話是從舊約哈巴谷書引來的。而他引用的時候做了一件很有意思的事：他刪掉了一個字。"],["p","原本那句話在不同的抄本裡，有的作「義人必因我的信實存活」，有的作「我的義人必因信存活」。"],["p","保羅兩個代名詞都不要。 他把這句話削到只剩骨頭：義人必因信得生。"],["p","為什麼？因為他正要說下一句：「先是猶太人，後是希臘人。」"],["p","他不要任何一個字，把這句應許限縮成只屬於某一群人的。"],["p","包括不屬於那天晚上坐在沙發上的那位媽媽。"],["w",3],["p","那麼「信」是什麼？"],["p","哈巴谷書裡「信」這個字，希伯來文的字根意思是「穩固、可靠」。我們每次禱告最後說的那句「阿們」，就是從這個字根來的。"],["p","所以信心不是一種感覺，不是「我覺得我很有把握」。"],["p","信心是把全身的重量壓上去。"],["p","我打個比方。冬天過河，冰面看起來很薄，你戰戰兢兢地走上去，每一步都在發抖，心裡想著會不會裂。可是如果那塊冰有一公尺厚，你顫抖著走過去，還是會平安到對岸。"],["p","反過來，如果冰只有一公分，你信心滿滿、大步向前，一樣掉下去。"],["p","救你的從來不是你信心的強度，是你腳下那塊冰的厚度。"],["p","我們腳下那塊冰，是耶穌基督和祂在十字架上完成的工作。"],["p","所以請聽清楚：你跌倒的時候，不是等自己夠好了才回來，而是立刻回來。因為義人是因信得生，不是因表現得生。"],["p","弟兄姊妹，我們一生要換掉的最重要的一個觀念，就是這個。"],["p","不是問：「我覺得我夠不夠好？」\n是問：「神的話怎麼說我？」"],["p","這一句換掉，你整個人生就換了。"],["w",3],["h","第三大段｜福音換了一個人（1:1–15）"],["p","現在我們回到這一章的第一節。"],["p","一封信的開頭，是自我介紹。而人在自我介紹的時候，最容易洩漏他心裡最看重的東西。"],["q","「耶穌基督的僕人保羅，奉召為使徒，特派傳神的福音。」"],["p","保羅用了三個詞。"],["p","第一個，「僕人」。希臘文這個字不是「員工」，不是「幫手」，是奴隸。在羅馬社會，這是最底層的身分——奴隸沒有自主權，沒有財產，連他自己都不屬於自己。"],["p","一個羅馬公民、受過最高等教育的法利賽人，把「奴隸」放在自己名字後面的第一個位置。"],["p","第二個，「奉召」。被叫來的。不是他報名的，是有人點了他的名。"],["p","第三個，「特派」。這個字的意思是「已經被分別出來，而且一直是這個狀態」。"],["p","弟兄姊妹，請注意一件事：這三個都是被動的。"],["p","被買下、被呼召、被分別。"],["p","保羅沒有一句話說「我選擇了福音」「我決定獻身」「我立志傳道」。他從頭到尾都在說：我是被抓住的。"],["p","我們今天很喜歡問一個問題：「我要為神做什麼？」"],["p","這問題不壞，但它不是第一個問題。"],["p","保羅告訴我們，第一個問題是：我是誰的？"],["w",3],["p","大家有沒有想過，為什麼那麼多人服事到最後又累又苦？"],["p","教會裡有一種人，做得很多，卻越做越沒有喜樂；他能講很多真理，卻在家裡跟配偶說不上三句話；他能帶查經，卻不能忍受別人比他被看重。"],["p","問題出在哪裡？次序倒了。"],["p","你看保羅這一章的順序。第1到7節，他講他是誰、他屬於誰。第8到15節，他講關係——他為他們感謝神、他不住地為他們禱告、他切切地想見他們。一直要到第15節，他才說：「所以情願盡我的力量，將福音也傳給你們。」"],["p","先生命，再關係，後事工。保羅沒有搞錯。"],["p","我們常常倒過來——先衝去做，做完才發現生命是空的。"],["w",3],["p","而在「關係」這一段裡，有一節經文我每次讀都很受感動。"],["p","第11節，保羅說：「我切切地想見你們，要把些屬靈的恩賜分給你們，使你們可以堅固。」"],["p","聽起來很正常對不對？大使徒要去造就小教會。"],["p","可是第12節，他忽然改口了。"],["q","「這樣，我在你們中間，因你與我彼此的信心，就可以同得安慰。」"],["p","原文的動詞是被動的——「一同被安慰」。這個字在整本新約只出現這一次。"],["p","弟兄姊妹，保羅講到一半，把自己拉下來了。"],["p","他本來說「我要給你們」，然後馬上補一句：「不對，應該說，是我們彼此。」"],["p","一個真正被福音抓住的人，不會站在高處施捨。他知道自己也需要被安慰，也需要弟兄姊妹的信心來扶持。"],["p","還有第14節，更驚人："],["q","「無論是希臘人、化外人、聰明人、愚拙人，我都欠他們的債。」"],["p","停一下。欠債？"],["p","一般人的心態是：我把福音傳給你，是我幫了你，你該感謝我。"],["p","保羅倒過來說：在我把福音給你之前，我就是欠你的。"],["p","為什麼？因為第5節說了：「我們從他受了恩惠並使徒的職分。」"],["p","因為他先領受了，所以他欠債。"],["p","一個真正嚐過恩典的人，看見還沒信主的親人、還在掙扎的同事、那個一直讓你受不了的鄰居——他心裡不會是「我比你好」，會是「我欠你的」。"],["p","而且請注意保羅欠債的名單裡有誰：「化外人、愚拙人」。這是當時羅馬社會最看不起的兩種人。"],["p","福音的債，沒有階級。"],["w",3],["p","弟兄姊妹，現在我要回到第一大段留下的那個伏筆。"],["p","還記得第32節嗎？「他們不但自己去行，還喜歡別人去行。」"],["p","「喜歡」這個字，原文是一個很特別的字。"],["p","而在使徒行傳第8章第1節，聖經寫著一句話。那是司提反被石頭打死的那一天。經文說："],["q","「掃羅也喜悅他被害。」"],["p","用的是同一個字。"],["p","弟兄姊妹，你聽見了嗎？"],["p","保羅在羅馬書第一章的最後一句，寫下人類最深的罪——為別人的罪鼓掌。"],["p","而他是在寫他自己。"],["p","他就是那個站在司提反的血旁邊，看著石頭一顆一顆落下，心裡說「打得好」的人。"],["p","他知道，那個「無可推諉」的人裡面，第一個就是他。"],["p","而這樣的一個人，蒙了憐憫。"],["w",3],["p","所以現在你明白了。"],["p","保羅為什麼敢說「我不以福音為恥」？"],["p","不是因為他脾氣硬，不是因為他神學好，不是因為他口才強。"],["p","是因為他自己就是那個被換掉的人。"],["p","那個為司提反之死鼓掌的人，成了說「我欠一切人的債」的人。\n那個押著基督徒進監牢的人，成了為教會坐監的人。\n那個要滅絕這個名的人，成了說「為他的名」的人。"],["p","福音有沒有能力？最好的證據不是一套論證。是一個被換掉的人。"],["p","而那個人，兩千年前寫下了這封信。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三場交換。"],["p","第一場：人換掉了神。 用會爛的，換不會爛的。\n第二場：神換來了義。 白白地，本於信。\n第三場：福音換了一個人。 那個人叫保羅。"],["p","現在我要把整章收在一個地方。"],["p","羅馬書1章24節說：神「交付」了人。三次。人被交給自己的罪。"],["p","可是同一個字，在羅馬書8章32節又出現了一次："],["q","「神既不愛惜自己的兒子，為我們眾人捨了他。」"],["p","「捨了」——原文就是那個「交付」。"],["p","弟兄姊妹，你聽見了嗎？"],["p","第一章：神把人交付給罪。\n第八章：神把自己的兒子交付給十字架。"],["w",3],["p","我想請大家跟我一起，安靜地走到一個地方。"],["p","那是一個橄欖園，在半夜。"],["p","有一個人跪在地上。祂從永遠到永遠，從來沒有一刻失去與父的交通。祂一生說「我常做父所喜悅的事」，說「我在地上已經榮耀你」。"],["p","那天晚上，祂說了一句話：「我心裡甚是憂傷，幾乎要死。」"],["p","祂的汗，像大血點滴在地上。"],["p","祂說：「父啊，倘若可行，求你叫這杯離開我。」"],["p","杯裡是什麼？"],["p","杯裡是羅馬書第一章。"],["p","杯裡是那三次「任憑」，是那份清單，是那被壓在不義底下的真理，是全人類換掉神所欠下的一切。"],["w",3],["p","然後是第二天中午。天黑了三個小時。"],["p","在那片黑暗裡，祂喊了一聲："],["p","「我的神，我的神，為什麼離棄我？」"],["p","弟兄姊妹，那一刻，父神轉過臉去。那一刻，兒子真正被「交付」了。"],["p","祂承受了那本該落在我們身上的「任憑」。"],["p","為什麼？為了讓那些本該被交付的人，可以被接回來。"],["w",3],["p","所以今天，我想請大家安靜地回到我一開始問的那個問題。"],["p","如果失去某一樣東西，你的人生就會崩塌——那是什麼？"],["p","你想到的那個東西，不一定是壞的。它可能很好、很美、很值得珍惜——你的孩子、你的健康、你的事業、你在別人眼中的樣子。"],["p","但如果它坐在寶座上，它就成了偶像。"],["p","而我還想問第二個問題：你還在感謝嗎？"],["p","羅馬書1章21節說，人類墮落的起點，就是「不感謝」。"],["p","感謝是屬靈生命最靈敏的儀表。一個不再感謝的人，通常已經開始覺得一切都是自己掙來的。"],["p","你上一次真心說「主啊，謝謝你」，是為了一件順利的事，還是為了神自己？"],["w",3],["p","弟兄姊妹，在結束以前，我要說明一件事，免得有人誤會。"],["p","我們常說「無己」，說「不再是我」。"],["p","「無己」不是說你要變成一個沒有想法、沒有感覺、沒有價值、任人踐踏的人。 那不是聖經。聖經說你是照著神的形像被造的，是主用祂的血買來的，是神所愛、奉召作聖徒的人。"],["p","「無己」的意思是：我不再坐在生命的寶座上。"],["p","不是消滅這個人，是換掉這個王。"],["p","而這正是保羅說的那句話："],["q","「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。」"],["p","所以福音不是叫我們靠自己把舊生命修得好一點。"],["p","福音是讓那個要作王的舊我與基督同死，好讓基督的新生命在我們裡面活出來。"],["w",3],["p","弟兄姊妹，人把神換掉了。"],["p","神卻把祂的兒子換給了我們。"],["p","那位老先生把真跡換成了印刷品，換不回來了。"],["p","可是我們的神，把我們親手換掉的，親自買了回來。"],["p","用祂兒子的血。"],["p","所以今天，我們可以跟兩千年前那個人一起說："],["p","我不以福音為恥。因為這福音本是神的大能，要救一切相信的。"],["p","我們一起低頭禱告。"],["w",3],["p","禱告："],["p","主啊，我們來到你面前，承認你所說的是真的。"],["p","我們知道你，卻常常不把你當作神來榮耀你、感謝你。我們把不能朽壞的榮耀，換成了會朽壞的東西，還以為自己很聰明。"],["p","主啊，求你今天光照我們，讓我們看見自己寶座上坐的，到底是誰。"],["p","謝謝你，你沒有任憑我們到底。你把你的獨生愛子交付了，替我們喝了那一杯，承受了那本該落在我們身上的審判。"],["p","主耶穌，我今天願意從寶座上下來。求你坐上去，在我心裡作王。"],["p","求聖靈幫助我，不是靠自己努力做一個好人，而是讓你在我裡面活出你的生命。"],["p","願一切的榮耀，都歸給你，直到永遠。"],["p","奉主耶穌基督的名禱告，阿們。"],["w",3]]},"2":{"min":35,"blocks":[["h","那把尺，會轉過來"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","我想先請大家做一件事——不用舉手，只在心裡做就好。"],["p","請你想一個人。"],["p","一個最近讓你搖過頭的人。可能是家裡的人，可能是教會的人，也可能是一個你根本不認識、只是在網路上看到他發言的人。"],["p","想到了嗎？"],["p","好，先把他放在心裡，我們待會兒還會用到。"],["w",3],["p","我要先講一件事。"],["p","我在牧養中遇過這樣的人——其實不只一個。"],["p","一位弟兄，非常火熱，聚會從不缺席，聖經讀得比誰都熟。他有一項恩賜特別強——看見別人的問題。"],["p","他常常說：「我們教會那位長老，禱告太形式化了。」\n「那位講員，只有頭腦沒有生命。」\n「那個弟兄的奉獻，是做給人看的。」"],["p","他每一句話，都說對了。"],["p","直到有一天，一位年長的姊妹對他說了一句話。她說："],["q","「弟兄，神給了你一雙很銳利的眼睛。可惜這雙眼睛，一次都沒有往裡面看過。」"],["p","那天晚上，他一個人在房間裡跪了很久。"],["p","後來他跟我說了一句話，我一直記到今天："],["q","「我一生最痛的一刻，是我發現——我最看不起的那些人身上的東西，我身上全部都有，只是我藏得比較好。」"],["w",3],["p","弟兄姊妹，今天我們要讀的羅馬書第二章，講的就是這件事。"],["p","而我要先提醒大家：這一章不是講給壞人聽的。"],["p","羅馬書第一章講壞人——講拜偶像的、講道德敗壞的、講各樣的罪。羅馬書第一章讀完，我們心裡都會有一句話："],["p","「阿們，這些人真的該罰。」"],["p","而保羅寫第二章的第一句話，就是接著那一句「阿們」寫的："],["q","「你這論斷人的，無論你是誰，也無可推諉。」（羅2:1）"],["p","保羅的意思是：你剛才那句『阿們』，就是你的判決書。"],["w",3],["p","所以我今天要講三樣東西："],["p","第一，一把尺。\n第二，一本帳。\n第三，一把刀。"],["w",3],["h","第一大段｜那把尺，會轉過來（2:1–11）"],["p","請我們一起看羅馬書2章1到3節："],["q","「你這論斷人的，無論你是誰，也無可推諉。你在什麼事上論斷人，就在什麼事上定自己的罪；因你這論斷人的，自己所行卻和別人一樣。我們知道這樣行的人，神必照真理審判他。你這人哪，你論斷行這事的人，自己所行的卻和別人一樣，你以為能逃脫神的審判嗎？」"],["h","原文的第一道亮光：同一把刀，砍兩邊"],["p","這裡有一個字，中文看不出來，但它是保羅整個論證的關鍵。"],["p","「無可推諉」，希臘文是 ἀναπολόγητος。"],["p","這是一個法庭用語。它的字面意思是：「沒有辯詞」。就是那種——被告站起來，法官說「你有什麼話要說」，他站在那裡，一句話都說不出來。"],["p","而這個字，保羅在羅馬書裡總共只用了兩次。"],["p","第一次是1章20節，用來形容那些拜偶像的外邦人：「叫人無可推諉。」"],["p","第二次就是2章1節，用來形容——你。那個正在讀第一章、正在點頭說阿們的你。"],["p","弟兄姊妹，你看見保羅在做什麼嗎？"],["p","他拿同一把刀，先砍了外邦人一刀，然後轉過身來，砍了我們一刀。"],["h","那把尺為什麼會轉過來？"],["p","有人可能說：牧師，我指出別人的錯，難道錯了嗎？"],["p","我們先把這件事講清楚，因為這節經文常常被誤用。"],["p","保羅在這裡並沒有說「不可以分辨是非」。"],["p","證據就在同一章：保羅自己在2章21到23節，把那些人指得非常尖銳：「你講說人不可偷竊，自己還偷竊嗎？你說人不可姦淫，自己還姦淫嗎？」"],["p","所以問題不在於「有標準」。問題在於——你有沒有站在同一個標準底下。"],["p","你看第1節後半句："],["q","「因你這論斷人的，自己所行卻和別人一樣。」"],["p","問題不是你舉起了尺。問題是你舉起尺量別人的時候，你把自己排除在外了。"],["p","而保羅說：這是不可能的。 因為那把尺——它會轉過來。"],["h","一個現在式的震撼"],["p","這裡有第二道原文的亮光，非常重要。"],["p","「就在什麼事上定自己的罪」——「定罪」這個字 κατακρίνεις，是現在式。"],["p","弟兄姊妹，注意這個時態。"],["p","保羅沒有說：「你將來會因此被定罪。」\n保羅說的是：「你此刻，正在定你自己的罪。」"],["p","當你舉起手指的那一刻，判決書上已經簽了你的名字。"],["p","不用等到末日。就在你心裡冒出那句話的那一秒鐘，法庭已經開庭了，而被告是你。"],["h","它在生活裡長什麼樣子"],["p","我們今天很少用「論斷」這兩個字。但我們每天都在做。"],["p","它常常長得很有道理。"],["p","- 「我不是在批評他，我只是覺得他這樣做不太合適。」\n- 「我只是替他擔心。」\n- 「我是為他禱告才說的。」"],["p","它甚至長得很屬靈。"],["p","我服事這麼多年，跟你們說一句實話：教會裡最尖銳的論斷，常常不是用刻薄的話說出來的，是用禱告的語氣說出來的。"],["p","「主啊，求祢憐憫某某弟兄，他真的很需要祢的光照……」"],["p","——這句話有時候是真的代禱。有時候，它是一份加了糖的判決書。"],["h","神的法庭沒有VIP通道"],["p","我們再往下看，第11節。這是第一段的鑰匙："],["q","「因為神不偏待人。」（羅2:11）"],["p","「偏待人」這個希臘字 προσωπολημψία，非常有意思。它是希臘文裡幾乎不存在的一個怪字——因為它是保羅從希伯來文直接造出來的。"],["p","希伯來文有一個成語，字面是「舉起臉」。"],["p","古代的法庭，權貴走進來，法官會把頭抬起來，看著他的臉——那是給面子的意思。有錢人來了，抬頭；窮人來了，低頭看卷宗。"],["p","保羅說：在神那裡，沒有這回事。"],["p","弟兄姊妹，這句話有兩面刀鋒。"],["p","一面對著自認高的人說： 你的資歷、你的頭銜、你信主多少年、你在教會坐哪一排——在神的法庭上，一律不看。"],["p","另一面對著自認低的人說： 你的出身、你的過去、你的失敗、你的軟弱——在神的法庭上，也一律不看。"],["p","正因為神不偏待人，恩典才能給所有人。"],["h","焦點在耶穌"],["p","弟兄姊妹，我們現在要把眼睛從自己身上、從別人身上，轉到耶穌身上。"],["p","我要講一個大家都很熟的故事，但我想請你今天用羅馬書第二章的眼睛來看它。"],["p","約翰福音第八章。一個婦人，行淫的時候被抓，被拖到聖殿的院子裡。四圍站滿了人，每個人手裡都有一塊石頭。"],["p","律法沒有錯。她確實犯了罪。那些人手裡的尺，量得沒有錯。"],["p","問題是——他們每一個人，都把自己排除在那把尺之外了。"],["p","然後耶穌彎下腰，在地上寫字。"],["p","祂寫了什麼，聖經沒有說。但祂站起來的時候，說了一句話："],["q","「你們中間誰是沒有罪的，誰就可以先拿石頭打她。」（約8:7）"],["p","這一句話，就是羅馬書2章1節。"],["p","聖經說，他們從老到少，一個一個都出去了。"],["p","而最後，只剩下耶穌和那個婦人。"],["p","弟兄姊妹，你有沒有注意到——在那個院子裡，只剩下一個人手上是可以拿石頭的。"],["p","只有一位是完全沒有罪的。\n只有一位真的有資格。\n只有耶穌可以丟那第一塊石頭。"],["p","而祂沒有丟。"],["p","祂說：「我也不定你的罪。去吧，從此不要再犯罪了！」"],["p","祂沒有廢掉律法——祂說「不要再犯罪」。\n祂也沒有加入論斷——祂說「我也不定你的罪」。"],["p","那唯一有資格丟石頭的那一位，最後選擇了——為那個婦人被丟石頭。"],["p","那把尺，確實轉過來了。"],["p","但它先落在了耶穌身上。"],["h","第一段的應用"],["p","弟兄姊妹，還記得我一開始請你想的那個人嗎？"],["p","我現在請你問自己三個問題："],["p","第一，我在他身上看見的那個問題，我自己身上有沒有一個藏得比較好的版本？"],["p","第二，神對我的忍耐有多長？我對他的忍耐有多長？"],["p","第三，如果神照我論斷他的標準來論斷我，我還站得住嗎？"],["p","我要教大家一個很簡單的操練，叫做「三秒鐘的停頓」。"],["p","當你心裡那句判決句要成形的時候——停三秒。"],["p","在那三秒裡，把那句話翻譯成一句禱告。"],["p","從「他怎麼會這樣」變成「主啊，祢知道他的難處」。\n從「這個人真的不行」變成「主啊，祢當初也是這樣忍耐我的」。"],["p","三秒鐘，就是從審判席上走下來所需要的時間。"],["w",3],["h","第二大段｜那本帳，天天在記（2:4–5、12–24）"],["p","我們來看第4節和第5節。這兩節是全章最溫柔的，也是全章最可怕的。"],["q","「還是你藐視他豐富的恩慈、寬容、忍耐，不曉得他的恩慈是領你悔改呢？你竟任著你剛硬不悔改的心，為自己積蓄忿怒，以致神震怒，顯他公義審判的日子來到。」（羅2:4–5）"],["h","那條很長的引線"],["p","第4節有三個字，都在講神。我要特別講其中一個。"],["p","「忍耐」，希臘文 μακροθυμία。"],["p","這個字是兩個字組成的：μακρός 是「長」，θυμός 是「怒氣」。"],["p","合起來就是：怒氣的引線很長。"],["p","而這個希臘字，是舊約希臘文譯本用來翻譯一個希伯來成語的——那個成語的字面意思是「長鼻子」。"],["p","希伯來人形容一個人發怒，說他「鼻子熱起來了」。所以「長鼻子」的意思就是——從冷到熱，要走很長一段路。"],["p","這句話第一次出現在哪裡？出埃及記34章6節。"],["p","摩西在西奈山上，求神說「求祢顯出祢的榮耀給我看」，然後神從他面前經過，宣告自己的名："],["q","「耶和華，耶和華，是有憐憫有恩典的神，不輕易發怒，並有豐盛的慈愛和誠實。」"],["p","弟兄姊妹，這是神自己介紹自己的方式。"],["p","神說我的名是什麼？不輕易發怒。長引線。"],["h","一個現在進行式"],["p","現在請注意第4節這句話："],["q","「神的恩慈是領你悔改。」"],["p","「領」這個字 ἄγει，也是現在式。"],["p","保羅沒有說「神的恩慈曾經領過你」。\n保羅也沒有說「神的恩慈將來會領你」。"],["p","保羅說：神的恩慈，此時此刻，正在牽著你的手，往悔改的方向走。"],["p","弟兄姊妹，我要問一個很個人的問題："],["p","你有沒有一件事，是你到現在都還沒有付上代價的？"],["p","一個習慣、一個關係、一筆帳、一句話、一個你一直以為神沒看見的角落。"],["p","而因為到現在都沒事，你就慢慢地、不知不覺地，得出一個結論："],["p","「應該沒關係吧。」"],["p","保羅說：你把救生索當成了通行證。"],["p","「藐視」這個字，字面意思是「往下看」。"],["p","多麼諷刺——一個站在恩典上面的人，竟然低下頭，看不起那塊托住他的地板。"],["h","兩本帳"],["p","第4節講神的帳，第5節講你的帳。這兩節是一組對照。"],["p","第4節說：神有「豐富的」恩慈——原文是 πλοῦτος，財富、豐盛。"],["p","第5節說：你在「積蓄」忿怒——原文是 θησαυρίζεις。"],["p","弟兄姊妹，你知道這個字在聖經裡最有名的用法在哪裡嗎？"],["p","馬太福音6章20節，主耶穌說：「只要積儹財寶在天上。」"],["p","同一個字。"],["p","保羅在說：你確實在存。你每一天都在往一個戶頭裡存東西。只是你存的不是財寶，是忿怒。"],["p","而且原文還加了兩個字：「為你自己」。"],["p","沒有人強迫你。是你自己，一天一天，親手存進去的。"],["p","弟兄姊妹，這改變了我對「今天」的看法。"],["p","原來今天不是中性的。"],["p","原來每一天，都有兩本帳同時在記："],["p","- 神那邊，記的是恩慈——祂今天又忍耐了我一天\n- 我這邊，如果不悔改，記的是——又一天"],["p","你活著的每一天，都是入帳的一天。"],["h","為什麼知道那麼多，卻改變那麼少？"],["p","我們往下看，第13節："],["q","「原來在神面前，不是聽律法的為義，乃是行律法的稱義。」"],["p","「聽的人」，希臘文 ἀκροατής。"],["p","這個字在當時的希臘世界，指的是劇場或講堂裡的觀眾。"],["p","你買了票，坐下來，聽一場精彩的演講，聽到感動的地方鼓掌，聽完站起來，回家。"],["p","保羅說：你可以一輩子當神話語的觀眾。"],["p","弟兄姊妹，我要對我自己，也對每一位在講台上、在小組裡、在主日學裡服事的人說一段最扎心的話。"],["p","保羅在第21節說："],["q","「你既是教導別人，還不教導自己嗎？」"],["p","而21節那個「講說」，希臘文 κηρύσσων——這就是「傳道」的那個字。"],["p","保羅在羅馬書第二章點名的，不是一般會眾。是教導的人、傳講的人、屬靈領袖。"],["p","- 我講「不可偷竊」——我有沒有偷過神的時間？偷過別人的功勞？偷過本該歸給神的榮耀？\n- 我講「不可姦淫」——我的眼睛呢？我的手機呢？我一個人的時候呢？\n- 我說我「厭惡偶像」——那我的偶像叫什麼名字？是不是叫做「事工成果」？叫做「別人的肯定」？叫做「我的影響力」？"],["h","最可怕的一節"],["p","然後保羅寫下了整章最可怕的一句話。第24節："],["q","「神的名在外邦人中，因你們受了褻瀆。」"],["p","「褻瀆」這個字，是現在被動式——「正在被褻瀆」。"],["p","弟兄姊妹，主耶穌教我們的禱告，第一句是什麼？"],["q","「願人都尊你的名為聖。」"],["p","羅馬書2章24節，就是這句禱告徹底崩壞的樣子。"],["p","而崩壞的原因是什麼？"],["p","不是因為逼迫。不是因為政權。不是因為無神論的書寫得太好。"],["p","是因為神的子民自己的生命。"],["p","我常常在想這件事。今天很多人不信主，不是因為他們讀了什麼書。"],["p","很多時候，是因為他們認識一個基督徒。"],["q","但這裡我要加一句話，免得有人聽了回去自責一輩子：你要為你的生命負責，你不必為別人的心負責。 保羅在第一章已經說得很清楚：外邦人自己也是無可推諉的。神要我們作的，是不要成為別人的絆腳石；不是要我們背起別人不信的責任。"],["h","福音：那本帳，有人結清了"],["p","弟兄姊妹，講到這裡，如果福音只到這裡，我們今天就只能絕望地回家。"],["p","但感謝神——保羅在第5節說「積蓄忿怒」，他在第3章25節說："],["q","「神設立耶穌作挽回祭。」"],["p","「挽回祭」的意思是：承受忿怒的那一位。"],["p","弟兄姊妹，客西馬尼園裡，耶穌跪在地上，汗珠如大血點滴在地上，祂說："],["q","「我父啊，倘若可行，求你叫這杯離開我。」（太26:39）"],["p","那是什麼杯？"],["p","舊約先知一再說到「忿怒的杯」（賽51:17；耶25:15）。"],["p","那本帳——你的、我的、幾千年來所有人的——都在那個杯裡。"],["p","而耶穌在十字架上，把它喝乾了。"],["p","祂沒有喝一半。祂沒有留一口。"],["p","祂喝到最後一滴，然後說："],["q","「成了。」（約19:30）"],["p","那句話的希臘文是 τετέλεσται。這個字在當時的商業文書上，是蓋在收據上的一個字，意思是——"],["p","「付清了。」"],["h","第二段的應用"],["p","弟兄姊妹，我要請你今天晚上，安靜十分鐘。"],["p","不要開電視，不要滑手機。就十分鐘。"],["p","然後在紙上寫一件事——一件你知道該處理、卻一直沒有處理的事。"],["p","寫完之後，對神說一句話："],["q","「主啊，我一直以為祢的沉默是不介意。今天我知道了——祢是在等我。」"],["p","然後這個禮拜，去處理它。"],["p","不要等下一次培靈會。不要等你覺得準備好了。"],["p","因為那條引線雖然很長，但它是有盡頭的。"],["w",3],["h","第三大段｜那一刀，只有神能動（2:25–29）"],["p","我們來看全章的最後兩節。這是保羅整整兩章的黑暗之後，射進來的第一道光。"],["q","「因為外面作猶太人的，不是真猶太人；外面肉身的割禮，也不是真割禮。惟有裡面作的，才是真猶太人；真割禮也是心裡的，在乎靈，不在乎儀文。這人的稱讚不是從人來的，乃是從神來的。」（羅2:28–29）"],["h","最美的一個文字遊戲"],["p","弟兄姊妹，我要跟大家分享羅馬書第二章最美的一道原文亮光。這一道光，在中文聖經裡完全看不見。"],["p","「猶太人」這個字，來自「猶大」，而「猶大」來自希伯來文 Yehudah。"],["p","「猶大」這個名字是什麼意思？"],["p","創世記29章35節，利亞生第四個兒子的時候說："],["q","「這回我要讚美耶和華。」因此給他起名叫猶大。"],["p","「猶大」的意思，就是「讚美」、「稱讚」。"],["p","現在請你再看羅馬書2章29節的最後一句："],["q","「這人的稱讚，不是從人來的，乃是從神來的。」"],["p","弟兄姊妹，你看見保羅在做什麼嗎？"],["p","他在說：「真正的『稱讚人』，是那個稱讚從神來的人。」"],["p","一個橫跨兩千年、橫跨希伯來文與希臘文的絕妙雙關。"],["p","保羅重新定義了「屬神的人」——不是靠血統，不是靠記號，而是：你要誰的掌聲？"],["h","你要誰的掌聲？"],["p","弟兄姊妹，這是全章最深的一個問題。"],["p","我們每個人都有一套「屬靈履歷」："],["p","- 我信主幾年了\n- 我什麼時候受洗的\n- 我在哪個教會、跟過哪個牧者\n- 我服事什麼、讀過什麼書、參加過什麼特會"],["p","這些都是好東西。就像割禮——保羅說得很清楚，「割禮固然於你有益」（2:25）。"],["p","但保羅說：記號永遠不能取代它所指向的實體。"],["p","一張沒有存款的提款卡。\n一枚戴在從未愛過對方的人手上的婚戒。\n一本簽了名，卻從來沒有翻開過的聖經。"],["h","神在暗中動的那一刀"],["p","現在我要講今天最重要的一件事。"],["p","保羅說「真割禮是心裡的」——這句話不是他發明的。"],["p","翻回舊約，申命記10章16節，摩西對以色列人說："],["q","「所以你們要將心裡的污穢除掉。」"],["p","原文的動詞就是「行割禮」。摩西說：你們要為自己的心行割禮。"],["p","耶利米書4章4節，先知也說：「你們當自行割禮。」"],["p","神吩咐了一千多年。"],["p","結果呢？"],["p","做不到。"],["p","弟兄姊妹，這就是舊約最深的痛。神吩咐人給自己的心動刀，但人根本切不到自己的心。"],["p","你可以改行為。你可以戒掉一個習慣。你可以立志、可以下決心、可以早起讀經、可以認真禱告。"],["p","但你切不到你的心。"],["p","你可以教別人——保羅第21節就說了——你可以教別人，卻教不了自己。"],["p","那怎麼辦？"],["p","請聽申命記30章6節。這是整本舊約最溫柔的一節之一："],["q","「耶和華你神必將你心裡和你後裔心裡的污穢除掉，好叫你盡心盡性愛耶和華你的神。」"],["p","你聽見主詞的改變了嗎？"],["p","申命記10章：「你們要將心裡的污穢除掉。」——你動刀。\n申命記30章：「耶和華你神必將你心裡的污穢除掉。」——神動刀。"],["p","神說：你做不到。所以我來。"],["p","再聽以西結書36章26到27節："],["q","「我也要賜給你們一個新心，將新靈放在你們裡面……我必將我的靈放在你們裡面，使你們順從我的律例。」"],["p","這就是為什麼保羅在羅馬書2章29節說："],["q","「真割禮也是心裡的，在乎靈，不在乎儀文。」"],["p","「靈」——就是聖靈。"],["p","神在等的那一天到了。祂自己來動這一刀。"],["h","但這一刀，是怎麼動的？"],["p","弟兄姊妹，我們最後要看一節經文。歌羅西書2章11節："],["q","「你們在祂裡面也受了不是人手所行的割禮，乃是基督使你們脫去肉體情慾的割禮。」"],["p","「不是人手所行的割禮。」"],["p","我要問一個問題：神要在我的心上動刀——那把刀，落在哪裡？"],["p","那把刀，先落在耶穌身上。"],["p","十字架上，那個身體被切割。\n荊棘冠冕刺進祂的頭。\n釘子穿過祂的手和腳。\n槍尖刺入祂的肋旁。"],["p","那是那一場真正的、終極的割禮。"],["p","祂的身體被切割，好叫我的心可以被割禮。"],["p","而還有更深的一層。"],["p","羅馬書2章11節說「神不偏待人」——原文是「神不舉起臉」。"],["p","弟兄姊妹，你知道神的「不偏待人」，最極致的展現在哪裡嗎？"],["p","是在各各他。"],["p","那一天，天昏地暗。而那個從創世以前就與父同在的兒子，喊出了一句話："],["q","「我的神！我的神！為什麼離棄我？」（太27:46）"],["p","父沒有舉起臉。"],["p","「神既不愛惜自己的兒子，為我們眾人捨了」（羅8:32）——這就是「不偏待人」最沉重、也最榮耀的證明。"],["p","祂被父棄絕，好叫我可以得神的稱讚。"],["p","祂在暗中承受了審判，好叫我在暗中得著稱讚。"],["p","弟兄姊妹，你注意到了嗎——羅馬書2章16節說神審判「隱祕事」，2章29節說神稱讚「隱藏處的人」。"],["p","神審判的地方，和神稱讚的地方，是同一個地方——你的心。"],["p","而基督已經在那個地方，替你受了審判，好叫你可以在那個地方，得著稱讚。"],["h","第三段的應用"],["p","弟兄姊妹，我今天最後要請大家做一個禱告。"],["p","我要請你先放下一件事——放下你想自己修好自己的努力。"],["p","我們太習慣了。聽完一篇道，我們的反應是：「好，我這禮拜要更努力。」"],["p","但羅馬書第二章告訴我們：那條路，走了一千五百年，走不通。"],["p","所以今天的禱告不是「主啊，我要更努力」。"],["p","今天的禱告是："],["q","「主啊，我不求祢修好我的行為。我求祢在我心裡動刀。祢動哪裡，我都不縮手。」"],["p","這是無己的禱告。"],["p","我要在這裡把「無己」講清楚，免得有弟兄姊妹、特別是今天第一次來的朋友聽錯了。"],["p","「無己」不是說你沒有價值。 恰恰相反——羅馬書2章29節說，你有從神來的稱讚，那是全宇宙最高的價值。"],["p","「無己」不是說你沒有想法、沒有感受、要被人踩在腳下。"],["p","「無己」是說：我不再坐在生命的寶座上。我讓耶穌作王。"],["p","保羅在加拉太書2章20節說得最清楚："],["q","「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。」"],["p","心的割禮，就是那個要坐上審判席的舊我，被帶到十字架上處理。"],["p","而奇妙的事會發生。"],["p","當基督在我裡面作王之後——"],["p","我不再需要靠論斷別人，來確認我是好的。\n我也不再需要靠人的稱讚，來確認我有價值。"],["p","因為我已經有了那從神來的稱讚。"],["p","這，就是自由。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天走了很長的一段路。"],["p","羅馬書第二章是一章很不舒服的經文。它從頭到尾都在拆我們的東西。"],["p","它拆掉了我們的道德優越感（2:1）。\n它拆掉了我們對神沉默的誤讀（2:4）。\n它拆掉了我們的屬靈履歷（2:28）。"],["p","但它拆，是為了要建。"],["p","因為在所有的東西都被拆光之後，第29節站出來說："],["q","「這人的稱讚，不是從人來的，乃是從神來的。」"],["p","弟兄姊妹，這是好消息。"],["p","因為從人來的稱讚，你永遠追不夠。\n你多做一點，他們鼓掌；你少做一點，他們就走了。\n你今天被稱讚，明天就得再賺一次。"],["p","但從神來的稱讚，是十字架上一次買斷的。"],["w",3],["p","我最後要說三句話。"],["p","第一句：那把尺，確實會轉過來。"],["p","但弟兄姊妹，它已經轉過來了。它落在了耶穌身上。"],["p","所以你今天不用再拿著它到處量人。你可以放下它了。"],["p","第二句：那本帳，確實天天在記。"],["p","但弟兄姊妹，有一個人已經走到收銀台前，把單子拿過去，說：「算在我帳上。」"],["p","然後祂在十字架上說：「成了。付清了。」"],["p","第三句：那一刀，確實只有神能動。"],["p","而弟兄姊妹，祂願意動。祂一直在等你說一句話："],["p","「主啊，來吧。」"],["w",3],["p","弟兄姊妹，今天我們的問題，不是我們知道得不夠多。"],["p","我們的問題是——我們知道，但我們沒有讓那些知道，進到心裡去。"],["p","保羅說：「不是聽律法的為義，乃是行律法的稱義。」（2:13）"],["p","所以今天講完了，不要只是說「這篇道很好」。"],["p","求主讓我們不只是坐在劇場裡的觀眾。"],["p","願神今天在我們每一個人心裡，親自動那一刀。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，發現我們手裡一直拿著一把尺。我們用它量了很多人，卻從來沒有量過自己。主啊，赦免我們。\n\n我們也承認，祢的忍耐，我們常常讀成祢的默許。有些事我們拖了很久，我們以為沒事了。主啊，今天我們知道了——祢是在等我們。 謝謝祢等我們。\n\n主啊，我們不求祢修好我們的行為。我們求祢，在我們心裡動刀。祢動哪裡，我們都不縮手。\n\n因為我們知道，那把刀，已經先落在祢身上了。祢的身體為我們被切割，好叫我們的心可以被割禮。祢被父棄絕，好叫我們可以得祢的稱讚。\n\n主啊，從今天起，我們不要人的掌聲。我們只要祢的一句：「好，你這又良善又忠心的僕人。」\n\n願我們的生命，不再叫祢的名被褻瀆，乃叫祢的名被尊為聖。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"3":{"min":35,"blocks":[["h","但如今"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","我要先請大家聽一句話。這句話很短，只有三個字。"],["p","「但如今。」"],["p","如果你今天什麼都記不住，就記這三個字。"],["p","因為這三個字，是聖經裡最美的三個字。"],["w",3],["p","我先講一件事。"],["p","我認識一位姊妹，信主二十多年。二十多年來，聚會從不缺席，服事從不推辭，奉獻從不落後。"],["p","有一天她坐在我對面，說了一句話。她說："],["q","「牧師，我信主二十多年了。可是我到現在，還是不太確定神真的接納我。」"],["p","我問她為什麼。"],["p","她想了很久，說："],["q","「因為我知道我心裡是什麼樣子。別人看見的那個我，跟我自己知道的那個我，不一樣。」"],["p","弟兄姊妹，我相信在座有人聽得懂這句話。"],["p","我們用了一輩子的力氣，在維持一句話：「我還可以。」"],["p","而我們自己心裡最清楚——那句話撐得多辛苦。"],["w",3],["p","今天的羅馬書第三章，是為這樣的人寫的。"],["p","不過我要先提醒大家：這一章的路，是先往下走的。"],["p","保羅要先把我們手上所有的東西拿走，才會給我們那三個字。"],["p","所以我今天要講三樣東西："],["p","第一，一張被封住的嘴。\n第二，一張被公開的座。\n第三，一道被關上的門。"],["p","三樣東西，都是被動的。都不是我做的。"],["w",3],["h","第一大段｜一張被封住的嘴（3:9–20）"],["h","保羅的做法"],["p","弟兄姊妹，保羅在第一章講外邦人的罪，第二章講宗教人的罪。到了第三章第9節，他做出結論："],["q","「這卻怎麼樣呢？我們比他們強嗎？決不是的！因我們已經證明：猶太人和希臘人都在罪惡之下。」（羅3:9）"],["p","「已經證明」這個字，在整本新約只出現這一次。它是一個法律用語，意思是「已經提出正式指控」。"],["p","保羅在說：起訴書我寫完了。現在，傳喚證人。"],["p","而他傳喚的證人，很有意思——他一個人都沒有傳。他傳的是舊約聖經。"],["p","從第10節到第18節，保羅一口氣引用了六段舊約，全部出自詩篇和以賽亞書。"],["p","他不自己說猶太人有罪。他讓猶太人自己的聖經說。"],["h","一張罪的解剖圖"],["p","弟兄姊妹，這六段引文不是隨便排的。你如果把它們的順序看一遍，會發現保羅在畫一張人體圖。"],["p","先是總論："],["q","「沒有義人，連一個也沒有；沒有明白的；沒有尋求神的。」（3:10–11）"],["p","然後是嘴。而且是四個部位，由裡到外："],["q","喉嚨 —— 「他們的喉嚨是敞開的墳墓」\n舌頭 —— 「他們用舌頭弄詭詐」\n嘴唇 —— 「嘴唇裡有虺蛇的毒氣」\n口　 —— 「滿口是咒罵苦毒」"],["p","「敞開的墳墓」——原文是一個完成式的分詞：已經被打開、而且一直開著。"],["p","弟兄姊妹，猶太人對墳墓有很深的忌諱。民數記說，摸了墳墓的人，七天不潔淨。"],["p","而一個敞開的墳墓，意味著兩件事：裡面的味道會冒出來，靠近的人會被污染。"],["p","保羅說：人的喉嚨就是這樣。裡面早就死了。話一出口，那個味道就飄出來，還會污染旁邊的人。"],["p","然後是腳："],["q","「殺人流血，他們的腳飛跑，所經過的路便行殘害暴虐的事。」（3:15–16）"],["p","「殘害」這個字，原文的意思是「壓碎、粉碎」。"],["p","人走過的路，留下的是一地碎片。"],["p","接著是最讓人心酸的一句："],["q","「平安的路，他們未曾知道。」（3:17）"],["p","不是「他們不肯走」，是「他們不知道」。"],["p","人類拚了命在找和平。聯合國、和平協議、心理治療、正念冥想、各種身心靈課程——"],["p","保羅說：那條路，人根本不認識。"],["h","病灶在哪裡"],["p","然後，第18節。這是全段的最後一句，也是全段的病灶："],["q","「他們眼中不怕神。」（3:18）"],["p","原文的意思是：在他們眼睛的正前方，沒有神。"],["p","弟兄姊妹，注意保羅的順序。他先給你看症狀——嘴、腳、路。最後才告訴你病因。"],["p","病因只有一句話：神不在視線的正前方。"],["p","這句話不只是講無神論者。"],["p","這句話最扎的，是我們這些每個禮拜來教會的人。"],["p","因為我們的問題不是不信有神。我們的問題是——神不在視線的正前方。"],["p","- 我做決定的時候，神在不在正前方？\n- 我發脾氣的那三秒鐘，神在不在正前方？\n- 我一個人看手機的時候，神在不在正前方？"],["h","判決：閉嘴"],["p","然後保羅下了判決。第19節："],["q","「我們曉得律法上的話都是對律法以下之人說的，好塞住各人的口，叫普世的人都伏在神審判之下。」"],["p","「塞住」這個字，原文是 φράσσω。"],["p","它的意思是：築一道籬笆，把路堵死。 也用在法庭上，形容一個被告——站起來，卻一個字都說不出來。"],["p","弟兄姊妹，這裡有一個細節，我一定要跟你們說。"],["p","保羅在第14節說「滿口是咒罵苦毒」——那個「口」，希臘文是 στόμα。"],["p","保羅在第19節說「好塞住各人的口」——那個「口」，也是 στόμα。"],["p","同一個字。"],["p","那張說盡了咒罵苦毒的嘴，終於閉上了。"],["h","為什麼神要我們閉嘴？"],["p","有人可能會覺得：神為什麼要這樣？把人逼到啞口無言，很殘忍吧？"],["p","弟兄姊妹，不是的。"],["p","我做牧師這些年，越來越明白一件事："],["p","神要的不是我們認錯。神要的是我們沒話說。"],["p","因為只要我們還有一句「可是」，恩典就進不來。"],["p","- 「可是我也不是最壞的。」\n- 「可是我有我的苦衷。」\n- 「可是他先對不起我的。」\n- 「可是我已經很努力了。」"],["p","這些話不一定是假的。有些甚至是真的。"],["p","但只要那句「可是」還在，我們的手就還握著自己的東西——而一雙握著東西的手，接不了禮物。"],["h","律法的功用"],["p","所以第20節說："],["q","「所以凡有血氣的，沒有一個因行律法能在神面前稱義，因為律法本是叫人知罪。」"],["p","弟兄姊妹，這是整本羅馬書最黑的一節。"],["p","保羅走了兩章半，把所有的門一扇一扇關上："],["p","- 外邦人的門，關了\n- 好人的門，關了\n- 宗教人的門，關了\n- 現在，律法這扇門，也關了"],["p","沒有出路了。"],["p","但請注意保羅在關上最後一扇門的時候，說了一句非常重要的話："],["q","「律法本是叫人知罪。」"],["p","律法沒有失敗。律法完成了它的任務。"],["p","弟兄姊妹，我打個比方。"],["p","你去醫院照X光。X光片照出來，骨頭斷了。"],["p","你會不會生氣地說：「這台機器真沒用，照了半天也沒把我的骨頭接好」？"],["p","不會。因為X光機的工作不是接骨，是讓你知道要去開刀房。"],["p","律法就是那台X光機。"],["p","它不能救你。但它讓你不再假裝自己沒事。"],["p","而弟兄姊妹——下一節，開刀房的門，打開了。"],["w",3],["h","第二大段｜一張被公開的座（3:21–26）"],["h","三個字"],["p","第21節，第一個詞："],["q","「但如今……」"],["p","希臘文是 Νυνὶ δέ。"],["p","νυνί 是「現在」這個字的加強形式——不只是「現在」，是「就在此刻」。"],["p","弟兄姊妹，保羅用了兩章半，把整個人類逼到牆角。"],["p","然後用兩個字，翻轉整個宇宙。"],["q","「但如今，神的義在律法以外已經顯明出來。」（3:21）"],["p","「已經顯明出來」這個動詞，是完成式。"],["p","希臘文的完成式，意思是：一件事在過去完成了，但它的效果一直持續到現在。"],["p","保羅不是說「神的義曾經顯明過一次」。"],["p","他是說："],["q","神的義已經顯明出來了，而且到今天，還攤在那裡。\n誰都可以來拿。"],["h","白白的"],["p","然後保羅說了三節，一節比一節重。"],["q","「因為世人都犯了罪，虧缺了神的榮耀；如今卻蒙神的恩典，因基督耶穌的救贖，就白白地稱義。」（3:23–24）"],["p","弟兄姊妹，這裡有一個細節我一定要講。"],["p","「犯了罪」是過去式——一件已經定局的事。"],["p","「虧缺了」是現在式——一個到今天還在持續的狀態。"],["p","「虧缺」這個字，希臘文是 ὑστερέω。它在新約還出現在一個很有名的地方——"],["p","約翰福音第二章，迦拿的婚宴。馬利亞對耶穌說："],["q","「他們沒有酒了。」"],["p","「沒有了」——就是這個字。"],["p","弟兄姊妹，人生最深的問題，就是那一句：不夠了。"],["p","而耶穌行的第一個神蹟，就是把「不夠」變成「有餘」。"],["p","然後是第24節那個字：「白白地」。"],["p","希臘文是 δωρεάν，從「禮物」（δῶρον）來的。意思是：當禮物一樣，無償地，無緣無故地。"],["p","這個字在新約還出現在另一個地方，你們聽了會震動。"],["p","約翰福音15章25節，主耶穌說："],["q","「他們無故恨我。」"],["p","「無故」——就是同一個字。δωρεάν。"],["p","弟兄姊妹，你聽見了嗎？"],["q","祂無緣無故被恨。\n我們無緣無故被愛。"],["p","這就是十字架上的交換。"],["h","那張椅子"],["p","現在我要講今天最重要的一節。第25節："],["q","「神設立耶穌作挽回祭，是憑著耶穌的血……」"],["p","「挽回祭」這個字，希臘文是 ἱλαστήριον。"],["p","弟兄姊妹，這個字在舊約的希臘文譯本裡，出現了二十幾次。它幾乎每一次，都是同一個東西的名字——"],["p","約櫃上面的那個蓋子。"],["p","中文聖經翻譯成：施恩座。"],["p","我請大家跟我一起，回到舊約的至聖所。"],["p","約櫃裡面放著什麼？"],["p","兩塊石版。十誡。"],["p","那是什麼？那是控告以色列的證據。那是罪狀。"],["p","約櫃上面蓋著什麼？"],["p","施恩座。"],["p","施恩座上面有什麼？"],["p","兩個金基路伯，翅膀展開，面對面，低著頭，看著施恩座。"],["p","而神說：「我要在那裡與你相會。」（出25:22）"],["p","一年一次，贖罪日那一天，大祭司帶著血，一個人進到幔子裡面，把血彈在施恩座上。"],["p","然後——"],["p","那位坐在基路伯中間的神，低下頭看的時候，"],["p","祂看見的不是控告我的法版。"],["p","祂看見的是遮蓋法版的血。"],["h","搬出來了"],["p","弟兄姊妹，現在請你看第25節那個動詞。"],["p","「神設立耶穌作挽回祭」——「設立」這個字，希臘文是 προέθετο。"],["p","它的字面意思是：擺在前面。公開地陳列出來。"],["p","弟兄姊妹，那個施恩座在哪裡？"],["p","在至聖所裡面。\n在幔子後面。\n一年只能看一次。\n只有一個人看得見。"],["p","而保羅說——"],["p","神把它，搬出來了。"],["q","從前藏在幔子後面的，如今掛在城外的山頭上。\n從前只有大祭司能看的，如今全世界都看見了。\n從前一年一次的，如今一次就永遠成就了。"],["p","所以弟兄姊妹，你知道為什麼耶穌斷氣的那一刻，會發生那件事嗎？"],["q","「忽然，殿裡的幔子從上到下裂為兩半。」（太27:51）"],["p","幔子不需要了。"],["p","因為施恩座，已經公開了。"],["h","神憑什麼？"],["p","但是弟兄姊妹，第25節還沒完。後面還有一句話，是全章最深的一句："],["q","「因為他用忍耐的心寬容人先時所犯的罪。」"],["p","「寬容」這個字，希臘文是 πάρεσις。"],["p","這個字，整本新約只出現這一次。"],["p","而它有一個很像的兄弟，叫 ἄφεσις——那個字的意思是「赦免」，是「債被取消」。"],["p","但保羅在這裡沒有用「赦免」。他用了另一個字：πάρεσις。"],["p","它的意思是：放過去。暫時擱著。還沒處理。"],["p","弟兄姊妹，保羅在說一件很嚴重的事。"],["p","他說：舊約幾千年來，神一直在賒帳。"],["p","亞伯的祭、挪亞的祭、亞伯拉罕的公羊、逾越節的羊羔、聖殿裡千千萬萬隻牛羊——"],["p","希伯來書說得很清楚：「公牛和山羊的血，斷不能除罪。」（來10:4）"],["p","那些祭，只是一張欠條。不是付款。"],["p","神一直在「放過去」。一直沒有結案。"],["p","而這就帶出一個天大的問題——"],["p","神憑什麼放過？"],["p","如果一個法官一直不追討罪，他就不是好法官。"],["p","如果神一直放過罪，祂憑什麼還算是公義的神？"],["p","所以保羅說，神設立耶穌作挽回祭，是「要顯明神的義」。"],["p","弟兄姊妹，我要說一句你可能沒有聽過的話："],["q","十字架不只是為我們贖罪。\n十字架也是神為祂自己洗清嫌疑。"],["p","神在各各他，向全宇宙證明了一件事："],["q","「我從來沒有放縱過任何一件罪。」\n「所有的帳，都在這裡結清了。」"],["h","全本聖經最精妙的一句"],["p","然後是第26節。這是整章的頂峰："],["q","「好在今時顯明他的義，使人知道他自己為義，也稱信耶穌的人為義。」"],["p","弟兄姊妹，這句話的原文，是兩個一模一樣的字根，緊緊挨在一起："],["q","δίκαιον καὶ δικαιοῦντα\n「義的」和「使人成為義的」"],["p","中間只隔一個「和」字。"],["p","弟兄姊妹，我們來想一想。"],["p","人類歷史上，這個問題只有三種答案："],["p","第一種：神只講公義。 那結果是——沒有一個人活得了。"],["p","第二種：神只講慈愛。 那結果是——神成了縱容罪的神，整個宇宙的道德根基就崩塌了。"],["p","第三種——"],["p","十字架。"],["p","神沒有在公義和慈愛之間打折。祂在十字架上，讓兩邊同時滿分。"],["p","詩篇85篇有一節經文，詩人在盼望一件事："],["q","「慈愛和誠實彼此相遇；公義和平安彼此相親。」（詩85:10）"],["p","弟兄姊妹，詩人所盼望的那一幕，在各各他發生了。"],["h","那位姊妹的問題"],["p","還記得我一開始提到的那位姊妹嗎？"],["p","她說：「我到現在還是不太確定神真的接納我。因為我知道我心裡是什麼樣子。」"],["p","弟兄姊妹，羅馬書第三章給她的答案，不是：「你沒有那麼糟啦。」"],["p","羅馬書第三章的答案是：「你比你想的更糟——沒有義人，連一個也沒有。」"],["p","「但是——」"],["p","「神已經把祂的兒子，公開擺出來了。\n不是因為你夠好，是因為祂夠愛。\n不是白白給你一個折扣，是白白給你一個兒子。」"],["w",3],["h","第三大段｜一道被關上的門（3:27–31）"],["h","門關了"],["p","第27節："],["q","「既是這樣，哪裡能誇口呢？沒有可誇的了。」"],["p","「沒有可誇的了」——原文是一個字：ἐξεκλείσθη。"],["p","它的意思是：被關在門外了。"],["p","弟兄姊妹，注意保羅的用字。"],["p","他沒有說「我們應該謙卑一點」。\n他沒有說「不要太驕傲」。"],["p","他說：門關了。誇口進不來了。"],["p","為什麼？"],["p","因為第24節說了「白白地」。"],["q","你不能為一份禮物邀功。"],["p","如果你生日那天收到一份禮物，你不會第二天到處跟人說：「你們知道嗎？我昨天成功地收到了一份禮物。」"],["p","沒有人會這樣說。因為那不是你的功勞。"],["h","兩種法"],["p","然後保羅說了一句很有意思的話："],["q","「用何法沒有的呢？是用立功之法嗎？不是，乃用信主之法。」（3:27）"],["p","保羅在玩一個文字遊戲。他把「信」也叫做一種「法」。"],["p","世界上只有兩種法："],["p","立功之法：我做，所以我得。\n信主之法：祂做了，所以我領受。"],["p","弟兄姊妹，我跟你們說一句話："],["q","世界上所有的宗教，都是「立功之法」。\n只有福音，是「信主之法」。\n\n所有宗教的動詞是：「做。」\n福音的動詞是：「成了。」"],["h","神既是一位"],["p","接著保羅問了一個非常安靜、卻非常巨大的問題："],["q","「難道神只作猶太人的神嗎？不也是作外邦人的神嗎？是的，也作外邦人的神。神既是一位……」（3:29–30）"],["p","弟兄姊妹，「神既是一位」這句話，你們知道它從哪裡來的嗎？"],["p","申命記6章4節。示瑪。"],["q","「以色列啊，你要聽！耶和華我們神是獨一的主。」"],["p","這是猶太人每天早上、每天晚上都要背的一句話。是他們信仰的核心。"],["p","猶太人用這句話證明：只有我們敬拜真神。"],["p","而保羅——用同一句話，證明了外邦人也是神的。"],["p","保羅的邏輯是這樣的："],["q","如果神只有一位，而祂是全宇宙的神，\n那祂就不可能只作一個民族的神。"],["p","弟兄姊妹，這是全章最巧妙的一招。"],["p","保羅拿猶太人最珍愛的信條，證明了他們最不能接受的結論。"],["h","這對我們是什麼意思"],["p","弟兄姊妹，「難道神只作猶太人的神嗎？」——這個問題今天還要繼續問。"],["p","- 神只作「我們這一種基督徒」的神嗎？\n- 神只作「我們這個宗派」的神嗎？\n- 神只作「跟我一樣得救經歷的人」的神嗎？"],["p","弟兄姊妹，我要說一句實話。"],["p","教會裡最難拆的，不是外面的圍牆，是心裡的排行榜。"],["p","我們一邊唱「奇異恩典何等甘甜」，一邊心裡在排："],["p","- 這個人比較屬靈\n- 那個人大概還沒真的重生\n- 他啊，他信主是為了做生意吧"],["p","弟兄姊妹，只要那張排行榜還在，我們就還沒有懂第23節和第24節。"],["p","第23節說：「世人都犯了罪。」——同一條起跑線。\n第24節說：「白白地稱義。」——同一份禮物。"],["p","在同一條起跑線上，沒有人有資格對別人擺架子。"],["h","律法被扶正了"],["p","最後，第31節："],["q","「這樣，我們因信廢了律法嗎？斷乎不是！更是堅固律法。」"],["p","「堅固」這個字，原文的意思是：使它站起來。"],["p","弟兄姊妹，福音不是把律法推倒，福音是把律法扶正。"],["p","因為律法從來就不是用來稱義的。它是用來知罪的。"],["p","當我們不再拿律法來爬梯子，律法才第一次好好地當一面鏡子。"],["p","而且——"],["p","羅馬書8章4節說：「使律法的義成就在我們這……隨從聖靈的人身上。」"],["p","一個真的白白得了恩典的人，不會問「我可以犯多少罪」。"],["p","他會問：「我怎麼才能活得像祂？」"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天講了三樣東西。"],["p","我要提醒大家一件事：這三樣東西，原文全部都是被動式。"],["p","嘴，是「被」封住的。\n座，是「被」擺出來的。\n門，是「被」關上的。"],["p","從頭到尾，都是神在動工。"],["p","沒有一件是我做的。"],["w",3],["p","第一，一張被封住的嘴。"],["p","弟兄姊妹，你今天在神面前，還有什麼話要說嗎？"],["p","如果還有——那句話還在的時候，恩典就在門外等著。"],["p","神要的不是你認錯，神要的是你沒話說。"],["p","因為你沒話說了，祂才好說話。"],["w",3],["p","第二，一張被公開的座。"],["p","那個藏在幔子後面一千五百年、一年只能看一次、只有一個人能看的施恩座——"],["p","神把它搬出來了。"],["p","擺在城外的一個山頭上，光天化日，萬人觀看。"],["p","祂不是偷偷地赦免你。祂是公開地、當著全宇宙的面，把祂的兒子擺出來，說："],["q","「這裡。到這裡來。」"],["w",3],["p","第三，一道被關上的門。"],["p","誇口被關在門外了。"],["p","弟兄姊妹，這不是壞消息，這是你這輩子聽過最好的消息之一。"],["p","因為當你不必再證明自己的時候——"],["p","你第一次可以呼吸。"],["w",3],["p","我最後要說一句話。"],["p","我知道今天在座有些人，跟我提到的那位姊妹一樣。"],["p","你信了很多年，你知道所有的道理。\n但你心裡有一個角落，一直不太確定神真的接納你。"],["p","因為你知道你心裡是什麼樣子。"],["p","弟兄姊妹，我要告訴你："],["p","你的感覺沒有錯。你確實不配。"],["p","沒有義人，連一個也沒有——那句話包括你，也包括我。"],["p","但是——"],["h","但如今。"],["p","神的義，在律法以外，已經顯明出來了。"],["p","而且到今天，還攤在那裡。"],["p","誰都可以來拿。"],["p","包括你。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天來到祢面前，發現我們手上什麼都沒有。我們一輩子努力維持的那句「我還可以」，在祢的話面前撐不住了。\n\n主啊，謝謝祢封住我們的嘴。因為我們沒話說了，祢才好說話。\n\n謝謝祢把那個藏在幔子後面的施恩座，公開擺在我們眼前。謝謝祢不是偷偷地赦免我們，是當著全宇宙的面，把祢的兒子擺出來。\n\n主啊，我們承認——我們一直以為我們要先變好一點，祢才會比較喜歡我們。今天我們知道了：是白白的。完全是白白的。\n\n求祢把我們心裡那張排行榜拿走。讓我們看見身邊每一個人，都跟我們站在同一條起跑線上，也都可以領同一份禮物。\n\n主啊，我們不再誇口了。門已經關了。我們只誇祢的十字架。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"4":{"min":35,"blocks":[["h","神竟然稱罪人為義"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","我要先唸一節經文給大家聽。這節經文在箴言17章15節："],["q","「定惡人為義的，定義人為惡的，這都為耶和華所憎惡。」"],["p","大家聽清楚了：神說，把惡人說成義人——這是祂所憎惡的。"],["p","出埃及記23章7節，神自己說得更直接："],["q","「我必不以惡人為義。」"],["p","好。現在請大家聽另一節經文，羅馬書4章5節："],["q","「惟有不做工的，只信稱罪人為義的神，他的信就算為義。」"],["p","弟兄姊妹，你們有沒有覺得哪裡怪怪的？"],["p","神說：我必不以惡人為義。\n保羅說：祂是那位稱罪人為義的神。"],["p","這是怎麼回事？"],["p","保羅是不是講錯了？"],["p","還是說——"],["p","神做了一件祂自己說過祂憎惡的事？"],["w",3],["p","弟兄姊妹，這個問題，就是我們今天要花四十分鐘來回答的問題。"],["p","而我先跟大家說：這個問題的答案，是全本聖經最好的消息。"],["w",3],["p","不過在回答之前，保羅要先帶我們看三樣東西。"],["p","第一，一本帳。\n第二，一個印。\n第三，一座墳。"],["w",3],["h","第一大段｜一本不一樣的帳（4:1–8）"],["h","保羅請證人出庭"],["p","弟兄姊妹，第三章結束的時候，保羅剛剛講完一句驚天動地的話："],["q","「人稱義是因著信，不在乎遵行律法。」（3:28）"],["p","如果你是一個猶太人，聽到這句話，你心裡一定有一個反應："],["q","「保羅，這是你自己發明的新宗教吧？我們祖宗傳了兩千年的信仰，你一句話就推翻了？」"],["p","所以第四章，保羅做了一件很聰明的事。"],["p","他不再自己說話。他請證人出庭。"],["p","而且他請的兩位證人，是猶太人絕對不敢反對的："],["p","第一位——亞伯拉罕。猶太民族的祖宗。\n第二位——大衛。以色列最偉大的王。"],["h","一節經文，一整章的講道"],["p","保羅傳喚的第一位證人是亞伯拉罕。而他問了一個問題："],["q","「經上說什麼呢？」（4:3）"],["p","弟兄姊妹，這五個字，是保羅整章的方法論。"],["p","不是「傳統怎麼說」。\n不是「拉比怎麼教」。\n不是「大家都這樣講」。"],["p","是——經上怎麼寫的。"],["p","這一點很重要。因為當時猶太人有一個非常流行的說法。"],["p","在保羅那個時代有一本書，叫《馬加比一書》，裡面說：「亞伯拉罕在試探中被察驗，豈不是忠心的嗎？這就算為他的義。」"],["p","意思是：亞伯拉罕之所以被算為義，是因為他通過了獻以撒那場考試。"],["p","還有一本猶太傳統文獻說得更誇張：「亞伯拉罕我們的祖宗，在律法還沒有賜下以前，就守全了整部律法。」"],["p","換句話說：當時的標準說法是——亞伯拉罕是史上第一位模範生。"],["p","而保羅說：請你翻開創世記。"],["q","「亞伯拉罕信神，這就算為他的義。」（創15:6）"],["p","弟兄姊妹，「這就算為他的義」——這句話在創世記第幾章？"],["p","第十五章。"],["p","獻以撒在第幾章？"],["p","第二十二章。"],["p","中間隔了七章，隔了幾十年。"],["q","神算他為義的那一天，以撒都還沒有出生。"],["h","一個記帳的字"],["p","現在我要跟大家講一個字。這個字是整章的鑰匙。"],["p","「算為他的義」——「算」這個字，希臘文是 λογίζομαι。"],["p","這是一個會計用語。"],["p","在保羅那個時代，商人記帳、銀行入款、債務結算，用的就是這個字。"],["p","它的意思是：把一筆數字，記到某人的帳戶上。"],["p","弟兄姊妹，這個字在羅馬書第四章出現了幾次？"],["p","十一次。"],["p","保羅一次又一次地敲同一個鐘：算、算、算、算……"],["p","他要我們看見一樣東西——"],["p","一本帳簿。"],["h","兩種帳"],["p","然後保羅在第4節和第5節，畫出兩本完全不同的帳。"],["q","「作工的得工價，不算恩典，乃是該得的；惟有不做工的，只信稱罪人為義的神，他的信就算為義。」（4:4–5）"],["p","「該得的」這個字，希臘文是 ὀφείλημα。"],["p","它的意思是：欠款。債。"],["p","弟兄姊妹，你們知道這個字還出現在哪裡嗎？"],["p","主禱文。「免我們的債」——就是這個字。"],["p","保羅在說：如果稱義是工資，那意思就是——神欠我們。"],["p","而弟兄姊妹，只要神欠我們，恩典就死了。"],["p","我打個比方。"],["p","你去上班，月底老闆把薪水匯給你。你會不會傳一則訊息給老闆說：「老闆，謝謝你的恩典」？"],["p","不會。你會說：「應該的。」"],["p","因為那是工資，不是禮物。"],["p","而如果有一天，有人無緣無故給你一筆錢——那你才會說謝謝。"],["q","弟兄姊妹，這兩件事不能同時成立。\n一筆錢，要嘛是工資，要嘛是禮物。\n不可能一半一半。"],["h","「罪人」這個字"],["p","現在我要講4:5那個最扎心的字。"],["p","「稱罪人為義的神」——「罪人」這個字，希臘文是 ἀσεβής。"],["p","它的意思不是「做壞事的人」。"],["p","它的字面意思是：不敬拜神的人。不把神當神的人。"],["p","弟兄姊妹，這個字你們其實已經聽過了。"],["p","羅馬書1章18節：「神的忿怒從天上顯明在一切不虔不義的人身上。」"],["p","「不虔」——就是這個字的名詞形式。"],["p","弟兄姊妹，你聽見了嗎？"],["q","第一章：神的忿怒，顯明在這些「不虔」的人身上。\n\n第四章：神稱這些「不虔」的人為義。"],["p","同一群人。"],["p","中間隔著什麼？"],["p","中間隔著一個十字架。"],["h","第二位證人：大衛"],["p","保羅傳喚的第二位證人，是大衛。"],["p","弟兄姊妹，保羅選證人的眼光很有意思。"],["p","第一位是亞伯拉罕——猶太人心目中最好的人。\n第二位是大衛——一個犯了姦淫、又用計謀殺了忠心部下的人。"],["p","一個是最好的例子。一個是最壞的例子。"],["p","而保羅說：兩端都一樣。都是靠恩典。"],["p","大衛在詩篇32篇說了三句話，保羅引在4:7–8："],["q","「得赦免其過、遮蓋其罪的，這人是有福的。主不算為有罪的，這人是有福的。」"],["p","弟兄姊妹，這裡有三個動詞，每一個都是被動式，主詞都是神："],["p","第一，赦免——原文的畫面是「搬走」。罪像一個重擔，被搬走了。"],["p","第二，遮蓋——原文的畫面是「蓋起來」。罪還在那裡，但被蓋住了，不再被看見。"],["p","第三，不算——這是我們的老朋友 λογίζομαι。而且原文用了希臘文最強的雙重否定。"],["p","中文說「主不算為有罪」，讀起來很平。"],["p","原文的語氣是："],["q","「主絕對、絕不、永遠不會把那筆罪，記到他的帳上。」"],["p","弟兄姊妹，這三個動詞，回答了三種不同的痛苦："],["p","罪的重擔——被搬走了。\n罪的羞恥——被遮蓋了。\n罪的追討——不再入帳了。"],["h","那我們在算什麼？"],["p","弟兄姊妹，講到這裡，我要問一個很個人的問題。"],["p","如果神已經說「我不算了」——"],["p","那我們每天晚上躺在床上，翻來覆去在算的，是什麼？"],["p","我牧養這些年，發現很多基督徒心裡都有一本帳。而且是三本："],["p","第一本，記著我為神做了多少。\n——「我這麼忠心，神為什麼讓這件事發生在我身上？」"],["p","第二本，記著別人虧欠我多少。\n——「他那樣對我，我一輩子都記得。」"],["p","第三本，記著我自己犯過哪些錯。\n——這一本最厚。而且我們每天晚上都翻。"],["p","弟兄姊妹，我要說一句可能有點重的話："],["q","當神說「我不算了」，我們卻說「可是我覺得應該算」——\n\n那不是謙卑。那是不信。\n\n那是我們把自己的判斷，擺在神的判斷之上。"],["w",3],["h","第二大段｜一個蓋在後面的印（4:9–17）"],["h","保羅的第二問"],["p","第一段，保羅問的是：「經上說什麼呢？」"],["p","第二段，保羅問了一個更狠的問題。第10節："],["q","「是怎麼算的呢？是在他受割禮的時候呢？是在他未受割禮的時候呢？」"],["p","弟兄姊妹，這一問，是全章最漂亮的一擊。"],["p","因為保羅完全不辯論神學。他只請你翻書，看章節順序。"],["p","創世記15章6節：「亞伯蘭信耶和華，耶和華就以此為他的義。」"],["p","創世記17章24節：「亞伯拉罕受割禮的時候，年九十九歲。」"],["p","中間隔了多久？"],["p","至少十三、四年。"],["p","所以保羅說："],["q","「不是在受割禮的時候，乃是在未受割禮的時候。」（4:10）"],["p","弟兄姊妹，這句話的意思是什麼？"],["q","神算亞伯拉罕為義的那一天——\n\n他是一個外邦人。"],["h","那割禮是什麼？"],["p","那有人會問：那割禮到底算什麼？神設立割禮難道是多餘的嗎？"],["p","保羅在第11節回答了。而他用了一個很精準的字："],["q","「並且他受了割禮的記號，作他未受割禮的時候因信稱義的印證。」"],["p","「印證」這個字，希臘文是 σφραγίς。意思是：印章。"],["p","在羅馬世界，印章用在哪裡？"],["p","契約簽好了，蓋印。\n貨物包好了，蓋封條。\n文件寫完了，蓋官印。"],["p","弟兄姊妹，關鍵在這裡——"],["q","印章，從來不是在契約之前蓋的。\n\n印章永遠是在事情已經成立之後，蓋上去確認的。"],["p","你不會先蓋章，再談合約。"],["p","保羅說：割禮就是那個印。"],["p","它是真的。它是神設立的。它是好的。"],["p","但它是蓋在後面的。"],["h","我們的「割禮」"],["p","弟兄姊妹，我們今天不談割禮了。但我們每個人心裡，都有一份清單。"],["p","- 我受洗幾年了\n- 我讀完幾遍聖經了\n- 我在哪個小組、跟哪位牧者\n- 我服事幾年、奉獻多少\n- 我參加過哪些特會"],["p","這些都是好東西。真的。就像割禮一樣，是好的。"],["p","但保羅要問的是：這些東西，是門票，還是印章？"],["p","如果它們是門票，那你就是在買。"],["p","如果它們是印章，那它們是蓋在一件已經成了的事情上面。"],["h","順序，反過來了"],["p","然後保羅講了一句讓當時的猶太人幾乎跳起來的話。第11節下半到12節："],["q","「叫他作一切未受割禮而信之人的父……又作受割禮之人的父。」"],["p","弟兄姊妹，注意順序。"],["p","猶太人的想法是：亞伯拉罕是我們的父。外邦人如果想有份，要先受割禮，加入我們。"],["p","保羅說："],["q","不對。他先是未受割禮之人的父。\n然後才是受割禮之人的父。\n\n順序，反過來了。"],["p","而且第12節還加了一句限定——他作受割禮之人的父，只限於那些「按亞伯拉罕未受割禮而信之蹤跡去行的人」。"],["p","「蹤跡」這個字，原文是 ἴχνος——腳印。"],["q","保羅說：真正的亞伯拉罕子孫，不是有他血統的人，是踩著他腳印走的人。\n\n而他的第一個腳印，是在他還沒有受割禮的時候踩下的。"],["h","為什麼恩典這麼重要"],["p","弟兄姊妹，第16節有一句話，是這整段的地基。保羅說："],["q","「所以人得為後嗣是本乎信，因此就屬乎恩，叫應許定然歸給一切後裔。」"],["p","「定然」這個字，希臘文是 βέβαιος。"],["p","它在羅馬的契約文書裡，指的是「具有法律效力、可以強制執行的擔保」。"],["p","弟兄姊妹，保羅在這裡講了一個很深的道理。"],["p","他說：正因為是憑恩典，所以應許才穩固。"],["p","為什麼？"],["q","如果應許憑我的表現——我的表現會變，應許就跟著晃。\n\n如果應許憑神的恩典——神不會變，應許就穩如泰山。"],["p","所以恩典不是神的軟弱。"],["p","恩典是應許唯一可能穩固的方式。"],["p","而弟兄姊妹，這句話還有一個更深的意思。"],["p","保羅說「叫應許定然歸給一切後裔」。"],["p","你想想看——只要有一點點是靠表現，就一定會產生等級。\n只要有等級，就一定有人排在後面。\n只要有人排在後面，「一切」這兩個字就不成立了。"],["p","所以恩典不只是為了讓我安心，恩典是為了讓這個家能夠成立。"],["p","弟兄姊妹，我要說一句實話。"],["p","教會裡最難拆的，不是外面的圍牆，是心裡的等級表。"],["p","我們一邊唱「一同來敬拜」，一邊心裡在排：誰是核心，誰是外圍；誰比較屬靈，誰還在初信；誰的見證比較精彩，誰只是從小在教會長大。"],["p","弟兄姊妹，只要那張表還在——"],["p","我們就還沒有懂第16節。"],["w",3],["h","第三大段｜一座還沒被打開的墳（4:18–25）"],["h","一個沒有孩子的老人"],["p","弟兄姊妹，我們現在要看今天最後一段，也是我最喜歡的一段。"],["p","保羅要告訴我們：什麼叫做信。"],["p","但在講之前，我要請大家先看一個畫面。"],["p","創世記15章。神把亞伯蘭領到帳棚外面。那是美索不達米亞的曠野，晚上。"],["p","神說：「你向天觀看，數算眾星，能數得過來嗎？」"],["p","然後神說：「你的後裔將要如此。」"],["p","弟兄姊妹，亞伯蘭當時幾歲？"],["p","大概八十幾歲。"],["p","他有幾個孩子？"],["p","一個都沒有。"],["p","一個沒有孩子的老人，站在曠野裡，抬頭看著滿天的星星。"],["p","然後——聖經說：「亞伯蘭信耶和華，耶和華就以此為他的義。」"],["h","逆著指望，靠著指望"],["p","保羅在4:18描寫這一刻，用了一句我認為是全本聖經最美的話。"],["p","和合本翻譯成：「他在無可指望的時候，因信仍有指望。」"],["p","這句話的原文，是同一個字用了兩次，配兩個不同的介詞："],["q","παρ' ἐλπίδα ἐπ' ἐλπίδι\n\n「逆著指望——靠著指望。」"],["p","弟兄姊妹，這句話的意思是："],["q","信心，一隻腳踩在絕望裡，一隻腳踩在應許上。"],["p","很多人以為，信心就是「不要去想那些不好的」。"],["p","保羅說：不是。"],["h","他把自己看得清清楚楚"],["p","第19節："],["q","「他將近百歲的時候，雖然想到自己的身體如同已死，撒拉的生育已經斷絕，他的信心還是不軟弱。」"],["p","「想到」這個字，希臘文是 κατανοέω。"],["p","它的意思不是「瞄了一眼」，是——"],["p","仔細審視。認真思量。盯著看。"],["p","弟兄姊妹，保羅是刻意告訴我們這件事的。"],["q","亞伯拉罕沒有逃避現實。\n他把自己的身體，看得清清楚楚。"],["p","而且保羅用的字更重。「如同已死」，原文是一個完成式的分詞——"],["p","意思是：已經死透了，而且維持在死的狀態。"],["p","保羅還用了另一個字形容撒拉，原文直譯是「撒拉子宮的死」。"],["p","弟兄姊妹，保羅在這兩節裡，用了兩個「死」字。"],["p","他要我們看見兩具沒有生命的身體。"],["p","然後——"],["p","你還記得第17節保羅怎麼形容神嗎？"],["q","「亞伯拉罕所信的，是那叫死人復活、使無變為有的神。」"],["p","弟兄姊妹，保羅是故意的。"],["p","他先讓你看見「死」，然後告訴你：他所信的那一位，專門在死的地方工作。"],["h","信心不是自己撐強的"],["p","第20節，還有一個細節，我要特別講。"],["q","「並且仰望神的應許，總沒有因不信心裡起疑惑，反倒因信心裡得堅固。」"],["p","「得堅固」這個字，原文是被動式。"],["p","意思是：他被賦予了能力。"],["p","弟兄姊妹，這一點對我們太重要了。"],["p","因為我們常常以為，信心是一種要靠意志力擠出來的東西。"],["p","「我要更有信心！我要更相信！」——然後越擠越累。"],["p","保羅說：不是。"],["q","他不是自己撐強的。\n是他信的時候，力量被加給他。\n\n信心不是我們生產能力的引擎。\n信心是我們接受能力的管道。"],["h","相信，就是把榮耀歸給神"],["p","然後是第20節最後一句。弟兄姊妹，這句話在羅馬書是第一次出現："],["q","「將榮耀歸給神。」"],["p","我請大家把三節經文放在一起看。"],["p","羅馬書1章21節：「他們雖然知道神，卻不當作神榮耀祂。」"],["p","羅馬書3章23節：「世人都犯了罪，虧缺了神的榮耀。」"],["p","羅馬書4章20節：「將榮耀歸給神。」"],["p","弟兄姊妹，保羅用了三章半，描寫一個不榮耀神的世界。"],["p","然後在第四章，他終於給我們看見第一個榮耀神的人。"],["p","而他榮耀神的方式，讓我很意外。"],["p","不是獻祭。不是奉獻。不是建殿。不是宣教。"],["p","是——相信。"],["p","為什麼相信就是榮耀神？"],["p","弟兄姊妹，你想想看："],["q","當我不信的時候，我其實是在對神說：「祢做不到。」\n\n當我信的時候，我是在對神說：「祢做得到。」\n\n這世上，沒有比「我相信祢辦得到」更能尊榮一位神的了。"],["h","你那個「已經沒救了」的地方"],["p","弟兄姊妹，我知道今天在座，有人心裡有一個處境。"],["p","那個處境，你已經放棄很久了。"],["p","- 那段婚姻已經冷了很多年\n- 那個孩子已經很久不跟你說話了\n- 那個診斷已經下了\n- 那個關係已經斷了\n- 那個機會已經過了\n- 那個夢想，你已經不敢再提了"],["p","你甚至已經學會了不去想它。因為每次想，就痛一次。"],["p","弟兄姊妹，我要告訴你羅馬書第四章的信息："],["q","神從來不在我們還有辦法的地方動工。\n\n祂在「已死」的地方動工。\n\n因為祂是叫死人復活的神。"],["p","而且請注意：保羅說亞伯拉罕「仔細察看」了自己死透的身體。"],["p","神沒有要你假裝它還活著。"],["p","神只是要你，在看清楚它已經死了之後，抬起頭來，看見另一件事："],["p","站在你面前的這一位，是叫死人復活的神。"],["h","那個問題的答案"],["p","弟兄姊妹，我們現在要回到今天一開始那個問題。"],["p","箴言說：「定惡人為義的，為耶和華所憎惡。」\n出埃及記說：「我必不以惡人為義。」"],["p","那羅馬書4章5節說「神稱罪人為義」，這怎麼可能？"],["p","答案在最後一節。羅馬書4章25節："],["q","「耶穌被交給人，是為我們的過犯；復活，是為叫我們稱義。」"],["p","弟兄姊妹，我要你聽清楚這一節在說什麼。"],["p","神沒有睜一隻眼閉一隻眼。"],["p","神沒有說「算了算了，我不追究了」。"],["p","神追究了。祂徹徹底底地追究了。"],["p","祂只是——"],["p","追究在自己兒子身上。"],["p","弟兄姊妹，這是全本聖經最重要的一個區分，我請大家記住："],["q","「不追究地赦免」——那是不義。\n\n「已追究地赦免」——那才是恩典。\n\n神做的，是第二種。"],["p","所以神稱不敬虔的人為義，不是繞過公義。"],["p","是穿過公義。"],["p","穿過各各他。"],["h","收據"],["p","最後一句話。"],["p","4:25說：耶穌「被交給人，是為我們的過犯；復活，是為叫我們稱義」。"],["p","弟兄姊妹，我一直在想一個問題：既然十字架已經付清了，為什麼還需要復活？"],["p","我後來明白了。"],["q","十字架，付清了帳。\n\n復活，是那張蓋了章的收據。"],["p","如果耶穌沒有復活，我們永遠不知道那筆帳到底付清了沒有。"],["p","祂躺在墳墓裡，那件事就懸在那裡。"],["p","但第三天早上，那塊石頭滾開了。"],["p","弟兄姊妹，那座空了的墳墓，就是天上發出的一張收據。"],["p","上面只有三個字："],["h","已收訖。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["p","第一，一本帳。"],["p","神的帳本上，沒有「工資」那一欄。"],["p","只有「禮物」那一欄。"],["p","所以你今天不需要先賺夠了才能來。你什麼都不必帶。"],["w",3],["p","第二，一個印。"],["p","所有的記號——受洗、服事、資歷、經歷——都是好的。"],["p","但它們是蓋在後面的章，不是排在前面的門票。"],["p","所以你不必等到「夠格」了才能來。亞伯拉罕被算為義的那一天，他還是個外邦人。"],["w",3],["p","第三，一座墳。"],["p","你心裡那個已經死透了的地方——"],["p","那正是神工作的地方。"],["p","因為祂是叫死人復活的神。而且祂已經示範過一次了。"],["w",3],["p","弟兄姊妹，我最後要對兩種人說話。"],["p","第一種，是覺得自己很努力、但心裡有點累的人。"],["p","你每天讀經、你從不缺席、你忠心服事、你奉獻不落人後。"],["p","但你心裡最深的地方，有一句話："],["q","「神應該對我好一點吧？我做了這麼多。」"],["p","弟兄姊妹，我要溫柔地告訴你：那句話一出現，恩典就死了。"],["p","因為那不是禮物，那是工資。"],["p","今天，你可以把那本帳交出來。"],["w",3],["p","第二種，是覺得自己太糟、不敢來的人。"],["p","你知道別人看見的那個你，跟你自己知道的那個你，不一樣。"],["p","弟兄姊妹，我要告訴你羅馬書4章5節："],["q","祂是那位「稱不敬虔的人為義」的神。"],["p","不是「稱還不錯的人為義」。"],["p","不是「稱努力改進中的人為義」。"],["p","是——不敬虔的人。"],["p","弟兄姊妹，你今天來到祂面前，最不需要做的一件事，就是先假裝自己夠好。"],["p","因為那正是祂的專長。"],["w",3],["p","神竟然稱罪人為義。"],["p","祂真的做了。"],["p","而祂之所以能做，是因為兩千年前，有一個星期五的下午，帳被算到了另一個人身上。"],["p","還有一個星期天的早晨，那張收據，從墳墓裡發出來了。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，發現我們手上一直握著一本帳。我們記著自己做了多少，記著別人虧欠我們多少，也記著我們自己犯過的每一個錯。\n\n主啊，祢說「我不算了」。求祢幫助我們，也不要再算了。\n\n我們承認，我們一直以為要先變好一點，祢才會比較喜歡我們。今天我們聽見了：祢是那位稱不敬虔的人為義的神。\n\n主啊，我們心裡有一些地方，已經死了很久。我們已經學會不去想它了。今天求祢提醒我們——祢是叫死人復活的神。求祢在那些地方動工。\n\n謝謝祢，祢沒有輕率地放過我們的罪。祢追討了，追討在祢自己身上。\n\n謝謝祢，那座空了的墳墓，就是我們的收據。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"5":{"min":35,"blocks":[["h","何況"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天我要教大家兩個字。"],["p","如果你今天什麼都記不住，就記這兩個字。"],["p","「何況」。"],["w",3],["p","我先說一件事。"],["p","前陣子有一位弟兄跟我說了一句話。他說："],["q","「牧師，我最近不太敢禱告。」"],["p","我問他為什麼。"],["p","他說："],["q","「因為我這個禮拜做了一件很糟的事。我覺得……我得先把自己整理好，再去見神。不然太不像話了。」"],["p","弟兄姊妹，你們聽得懂這句話嗎？"],["p","「我得先把自己整理好，再去見神。」"],["p","我聽得懂。因為我自己也這樣過。"],["p","我們心裡都有一個假設：跟神的關係，是看我最近表現如何。"],["p","- 這禮拜靈修有讀，禱告就比較有底氣\n- 這禮拜跌倒了，就先躲一躲"],["p","弟兄姊妹，羅馬書第五章，就是寫給這種心情的。"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一場停戰。\n第二，一次傾倒。\n第三，一場換王。"],["p","而每一樣的後面，都跟著同一個詞：何況。"],["w",3],["h","第一大段｜戰爭結束了（5:1–2）"],["h","一個字：「既」"],["p","羅馬書第五章第一節："],["q","「我們既因信稱義，就藉著我們的主耶穌基督得與神相和。」"],["p","弟兄姊妹，請注意第一個字：「既」。"],["p","這在原文是一個分詞，而且是過去被動分詞——意思是：那件事已經完成了，已經定案了，我們是站在那個定案上往下走。"],["p","羅馬書前面四章，我們一直在法庭裡。"],["p","從第五章開始，我們走出法庭，回家。"],["h","「相和」不是心情"],["p","現在我要講今天第一個原文的字。"],["p","「得與神相和」——「相和」，希臘文是 εἰρήνη。"],["p","而這個希臘字，在舊約的希臘文譯本裡，翻譯的是一個大家都聽過的希伯來字——"],["p","שָׁלוֹם，shalom。"],["p","弟兄姊妹，שָׁלוֹם 的意思是什麼？"],["p","很多人以為是「內心平安」。"],["p","其實它的字根意思是：完整、無缺、修復到位。"],["p","它用在什麼地方？"],["p","- 用在戰爭結束的時候（約書亞記9:15，以色列與基遍人立約，「與他們講和」）\n- 用在債務還清的時候\n- 用在破裂的關係被修復的時候"],["p","所以「與神相和」是什麼意思？"],["q","不是「我覺得很平安」。\n\n是——戰爭結束了。\n\n停戰協定，已經簽了。"],["p","弟兄姊妹，這一點太重要了。"],["p","因為如果「相和」是一種心情，那我的心情起起伏伏，我跟神的關係就跟著起起伏伏。"],["p","但如果「相和」是一份協定——"],["q","那份協定，不會因為我今天心情不好就作廢。\n\n而且更重要的是：那份協定是神簽的，不是我簽的。"],["h","那位引見官"],["p","第二節說："],["q","「我們又藉著他，因信得進入現在所站的這恩典中。」"],["p","「進入」這個字，希臘文是 προσαγωγή。"],["p","弟兄姊妹，這個字在整本新約只出現三次，全部在保羅的書信裡。"],["p","而它在當時，是一個宮廷用語。"],["p","在波斯和希臘化的王朝，有一個專門的官職，叫做 προσαγωγεύς——"],["p","中文可以翻譯成：引見官。"],["p","他的工作，是把人帶到王的面前。"],["p","沒有他，你連王宮的門都摸不到。"],["p","弟兄姊妹，你們記得以斯帖記嗎？"],["p","以斯帖記4章11節，以斯帖說了一句很嚇人的話："],["q","「凡未蒙召見擅入內院見王的，無論男女必被治死；除非王向他伸出金杖，不得存活。」"],["p","那是一位王后說的話。連王后都不能隨便進去。"],["p","而保羅說——"],["p","耶穌就是那位引見官。"],["h","兩個完成式"],["p","而弟兄姊妹，第二節還有更好的。"],["p","「因信得進入現在所站的這恩典中」——"],["p","這裡有兩個動詞，在原文都是完成式。"],["p","希臘文的完成式是什麼意思？"],["p","一件事在過去完成了，而且它的效果，一直持續到現在。"],["p","所以保羅說的不是「我們曾經被帶進去過」。"],["p","保羅說的是："],["q","我們被帶進去了——\n\n而且我們現在，還站在那裡。"],["p","弟兄姊妹，這是什麼意思？"],["p","意思是：我們不是訪客。"],["p","我們是常駐的。"],["h","所以，何況"],["p","弟兄姊妹，我要問那位弟兄的問題了。"],["p","「我得先把自己整理好，再去見神。」"],["p","我要溫柔地問一句："],["q","門既然已經開了，而且開門的不是你——\n\n何況你今天心情不好？"],["p","你今天心情不好，會讓那扇門關起來嗎？"],["p","不會。"],["p","因為那扇門，從來就不是你打開的。"],["w",3],["h","第二大段｜愛被倒出來了（5:3–11）"],["h","一個壓榨機"],["p","第三節，保羅說了一句很多人不喜歡的話："],["q","「不但如此，就是在患難中也是歡歡喜喜的。」"],["p","弟兄姊妹，我要先說一件事，因為這節經文被誤用得很嚴重。"],["p","這節經文，是給受苦的人自己用的。"],["p","不是給旁邊的人拿去對受苦的人說教用的。"],["p","如果有人正在痛苦中，你走過去說：「你要喜樂啊，患難生忍耐嘛！」——"],["p","那不是傳道，那是殘忍。"],["p","而且原文說的是「在患難中」，不是「為了患難」。"],["p","保羅從來沒有說患難是好的。"],["w",3],["p","好，那我們來看「患難」這個字。"],["p","希臘文是 θλῖψις。它的動詞是 θλίβω，意思是——"],["p","擠壓。"],["p","這個字用在哪裡？"],["p","壓橄欖出油。壓葡萄出酒。"],["p","弟兄姊妹，保羅選的不是「打擊」，不是「攻擊」，是「擠壓」。"],["p","而擠壓有一個特點——"],["q","它只能擠出裡面本來就有的東西。"],["p","你擠一顆橄欖，出來的是油。\n你擠一顆葡萄，出來的是酒。\n你擠一塊石頭，什麼都出不來。"],["p","所以患難最誠實的地方在於："],["q","它不「製造」什麼。它把裡面本來就有的，擠出來給你看。"],["h","一塊被火煉過的金屬"],["p","然後保羅說了一條鏈子："],["q","「患難生忍耐，忍耐生老練，老練生盼望。」（5:3–4）"],["p","「老練」這個字，希臘文是 δοκιμή。"],["p","它來自 δοκιμάζω——驗金屬。"],["p","古代怎麼驗金子？"],["p","放進火裡。雜質會浮上來，撇掉。剩下的，就是真金。"],["p","所以「老練」不是「經驗豐富」。"],["q","「老練」是——經過火之後，還在的那個部分。"],["h","那一桶已經倒下來了"],["p","但弟兄姊妹，這條鏈子有一個問題。"],["p","「患難生忍耐，忍耐生老練，老練生盼望」——"],["p","萬一走到最後，什麼都沒發生呢？"],["p","那我不是空歡喜一場，很丟臉嗎？"],["p","保羅知道我們會這樣想。所以第五節說："],["q","「盼望不至於羞恥，因為所賜給我們的聖靈將神的愛澆灌在我們心裡。」"],["p","「澆灌」這個字，希臘文是 ἐκχέω——"],["p","ἐκ 是「出來」，χέω 是「倒」。"],["p","合起來就是：整個倒出來。"],["p","不是滴。不是分配。是——整桶倒下來。"],["p","而弟兄姊妹，這個動詞在原文是完成式。"],["p","所以保羅說的不是「神的愛曾經澆灌過我們」。"],["p","保羅說的是："],["q","那一桶，已經倒下來了。\n\n而且到今天，還是濕的。"],["p","弟兄姊妹，神沒有叫我們等到最後才知道祂愛我們。"],["p","祂把訂金，現在就付了。"],["h","保羅的一道階梯"],["p","現在我們來到今天最重要的一段。"],["p","保羅在第七節，蓋了一道階梯。"],["q","「為義人死，是少有的；為仁人死，或者有敢做的。」（5:7）"],["p","弟兄姊妹，這裡有兩個不同的字。"],["p","第一個是「義人」——希臘文 δίκαιος。"],["p","那是一個正直、公正、無可指摘的人。"],["p","你尊敬他——但你不一定喜歡他。"],["p","第二個是「仁人」——希臘文 ἀγαθός。"],["p","那是一個良善的、慷慨的、對你有恩的人。"],["p","你愛戴他。你欠他。"],["p","所以保羅的階梯是這樣的："],["q","為一個「很正直的人」死？\n保羅說：幾乎沒有人肯。\n\n為一個「對我很好的人」死？\n保羅說：也許——或許有人敢。"],["p","弟兄姊妹，注意保羅用的字：「或者」「敢」。"],["p","連為一個對你最好的人去死，都只是「或許有人敢」。"],["p","那——"],["p","為一個仇敵死呢？"],["p","弟兄姊妹，保羅沒有把這句話說完。"],["p","他直接跳到第八節。"],["h","那個時機"],["q","「惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。」（5:8）"],["p","弟兄姊妹，這一節的重點，不是「基督為我們死」。"],["p","這一節的重點，是那個時機。"],["p","「在我們還作罪人的時候。」"],["p","而保羅在這幾節裡，用了四個字形容我們當時的狀態，一個比一個重："],["p","第六節：軟弱——沒有力氣自救。"],["p","第六節：不敬虔——不把神當神。"],["p","第八節：罪人——射不中靶的。"],["p","第十節：仇敵——敵對神的。"],["p","四個詞。保羅像是怕我們不夠明白，一層一層加上去。"],["p","而基督，就是在那個時候死的。"],["p","弟兄姊妹，我要說一句話，我希望你今天帶回家："],["q","你今天狀態好不好，跟祂愛不愛你——沒有關係。\n\n因為祂愛你的那一天，你比今天糟得多。"],["h","所以，何況"],["p","好，現在我要講今天的主題了。"],["p","第九節和第十節，保羅用了同一個詞，用了兩次。"],["p","中文翻譯成「就更要」。"],["p","原文是 πολλῷ μᾶλλον——"],["p","「何況更是」。"],["p","弟兄姊妹，這是猶太拉比一種標準的論證方法，叫做「輕重論證」。"],["p","它的邏輯是："],["q","如果比較小的那件事都成立了，那比較大的那件事，就更成立。"],["p","保羅怎麼用？"],["q","「因為我們作仇敵的時候，且藉著神兒子的死，得與神和好；既已和好，就更要因他的生得救了。」（5:10）"],["p","弟兄姊妹，你聽出這個邏輯了嗎？"],["q","神在你是仇敵的時候，\n付出了祂兒子的命。\n\n那祂現在——你已經是祂的兒女了——\n祂會為了你這禮拜做的那件糟事，把那一切收回去嗎？"],["p","何況啊，弟兄姊妹。"],["p","何況。"],["p","這就是為什麼羅馬書第八章會說那句話："],["q","「神既不愛惜自己的兒子，為我們眾人捨了，豈不也把萬物和他一同白白地賜給我們嗎？」（羅8:32）"],["p","難的事，祂已經做了。"],["p","剩下的，都是「順便」。"],["h","最好的禮物"],["p","而第十一節，保羅把整段拉到最高處："],["q","「不但如此，我們既藉著我主耶穌基督得與神和好，也就藉著他以神為樂。」"],["p","弟兄姊妹，前面講了那麼多好處：相和、進入、盼望、忍耐、老練、免去忿怒、得救……"],["p","然後保羅說：「不但如此——」"],["q","最好的禮物，不是這些禮物。\n\n最好的禮物，是送禮物的那一位。"],["p","神救我們，不是為了給我們一個更好的人生。"],["p","神救我們，是為了讓我們得著祂自己。"],["w",3],["h","第三大段｜王位換人了（5:12–21）"],["h","鏡頭拉遠"],["p","弟兄姊妹，從第十二節開始，保羅做了一件前面五章都沒做的事。"],["p","他把鏡頭，拉到人類歷史的最開頭。"],["p","前面四章半，我們一直在法庭裡，講「我怎麼被神接納」。"],["p","從5:12開始，保羅把屋頂掀開了。"],["p","他讓我們看見整個人類的故事——"],["p","而在他的鏡頭裡，整個人類歷史，只有兩個人。"],["h","都是「聽」的問題"],["p","我先講今天最後一個原文的字。它在第19節："],["q","「因一人的悖逆，眾人成為罪人；照樣，因一人的順從，眾人也成為義了。」"],["p","弟兄姊妹，「悖逆」和「順從」——在中文看起來是兩個完全不同的詞。"],["p","但在希臘文，它們的字根是同一個。"],["p","那個字根是：ἀκούω——聽。"],["p","「悖逆」是 παρακοή：παρά（旁邊）＋ 聽。"],["p","意思是：聽到旁邊去了。聽偏了。"],["p","「順從」是 ὑπακοή：ὑπό（底下）＋ 聽。"],["p","意思是：在底下聽。"],["p","弟兄姊妹，你聽見了嗎？"],["q","罪的本質，是聽的問題。\n\n順服的本質，也是聽的問題。"],["p","我們回到伊甸園。"],["p","亞當犯罪的那一刻，發生了什麼事？"],["p","創世記3章17節，神對亞當說的第一句話是什麼？"],["q","「你既聽從妻子的話……」"],["p","弟兄姊妹，亞當不是沒有聽。"],["p","他有聽。"],["p","他只是——聽錯了對象。"],["w",3],["p","然後我們看另一個人。"],["p","以賽亞書50章5節，那位受苦的僕人說："],["q","「主耶和華開通我的耳朵；我並沒有違背，也沒有退後。」"],["p","還有希伯來書5章8節："],["q","「他雖然為兒子，還是因所受的苦難學了順從。」"],["p","同一個字。ὑπακοή。在底下聽。"],["p","弟兄姊妹，我要說一句話："],["q","一個園子裡，有一個人聽偏了。\n\n另一個園子裡——客西馬尼——有一個人聽對了。\n\n祂說：「不要照我的意思，只要照你的意思。」"],["p","而人類的整個命運，就在這兩次「聽」之間翻轉。"],["h","這對我們是什麼意思"],["p","弟兄姊妹，這對我們今天是什麼意思？"],["p","意思是：問題從來不是「我有沒有在聽」。"],["p","我們每天都在聽。"],["p","聽新聞、聽別人的評價、聽自己的情緒、聽業績報表、聽社群媒體上的留言、聽那個一直在你腦子裡說「你不夠好」的聲音。"],["p","我們一直都在聽。"],["p","問題是——"],["q","我在誰的底下聽？"],["h","你的地位，取決於你屬於誰"],["p","現在我要講第五章下半段最重要的一件事。"],["p","保羅在5:12到19，用了一個字用了十二次。"],["p","那個字是：「一」。"],["p","一人。一次過犯。一次義行。一人的悖逆。一人的順從。"],["p","弟兄姊妹，保羅要說的是："],["q","整個人類歷史，只有兩個代表性的人。\n\n而你的地位，不是靠你的表現決定的。\n\n是靠——你屬於哪一個人。"],["p","第19節那個「成為」，原文很有意思。"],["p","它是 καθίστημι——意思是「被設立、被任命」。"],["p","這是一個法律和行政的用語。"],["p","（使徒行傳6章3節，「我們就可以派他們管理這事」，用的就是這個字。）"],["p","所以保羅說的不是「眾人變成了罪人」（那是性情的描述）。"],["p","保羅說的是："],["q","「眾人被設立為罪人。」\n\n「眾人也被設立為義。」"],["p","那是地位的宣告。"],["p","弟兄姊妹，這對我們是天大的好消息。"],["p","因為如果我的稱義是靠我的表現，那我每一天都在風險中。"],["p","但如果我的稱義是靠祂的表現——"],["q","那我就穩了。\n\n因為祂不會失敗。"],["h","恩典爆表"],["p","第20節："],["q","「律法本是外添的，叫過犯顯多；只是罪在哪裡顯多，恩典就更顯多了。」"],["p","弟兄姊妹，這一節有一個原文的細節，我覺得很可愛。"],["p","保羅在講「罪顯多」的時候，用的是一個普通的字：πλεονάζω——增多。"],["p","但當他要講「恩典更顯多」的時候——"],["p","他覺得現成的希臘文不夠用。"],["p","所以他自己疊了一個字出來：ὑπερπερισσεύω。"],["p","ὑπέρ 是「超級」，περισσεύω 是「滿溢出來」。"],["p","合起來就是：超級—加倍—滿溢。"],["p","這個字在整本新約，只出現兩次。"],["p","弟兄姊妹，用白話說就是："],["q","罪加了一級。\n\n恩典直接爆表。"],["p","——但我要立刻加一句話，因為保羅自己也立刻加了。"],["p","第六章第一節：「我們可以仍在罪中，叫恩典顯多嗎？斷乎不可！」"],["q","這句話，是給跌倒的人爬起來用的。\n\n不是給要去跌倒的人找藉口用的。"],["h","誰在作王？"],["p","弟兄姊妹，最後一件事。"],["p","第五章有一個字，出現了五次。"],["p","那個字是「作王」——βασιλεύω。"],["p","- 5:14「死就作了王」\n- 5:17「死就因這一人作了王」\n- 5:17「豈不更要……在生命中作王嗎」\n- 5:21「罪作王叫人死」\n- 5:21「恩典也藉著義作王」"],["p","弟兄姊妹，第五章講的，其實是一個王位的問題。"],["p","而保羅要告訴我們一件事："],["q","從來沒有「沒有王」這個選項。"],["p","你不讓耶穌作王，不代表沒有人作王。"],["p","那就是罪作王。"],["p","而罪作王的結局，是死。"],["h","最溫暖的一個文法細節"],["p","但弟兄姊妹，我要用今天最溫暖的一個發現來結束這一段。"],["p","第17節，照著保羅前面的對稱邏輯，他應該這樣寫："],["q","「死作了王……照樣，生命也作王。」"],["p","很整齊，對不對？"],["p","但保羅沒有這樣寫。"],["p","他寫的是："],["q","「何況那些受洪恩又蒙所賜之義的，豈不更要因耶穌基督一人在生命中作王嗎？」"],["p","弟兄姊妹，主詞換了。"],["p","不是「生命作王」。"],["p","是——我們作王。"],["q","罪作王的時候，我們是奴隸。\n\n但恩典作王的時候，我們不是換一個主人。\n\n我們也一同作王。"],["p","這就是那個最深的悖論："],["q","想要作王的那個人（亞當），成了奴隸。\n\n甘願順服的那一位（基督），使我們作王。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["p","第一，一場停戰。"],["p","你跟神之間的戰爭，已經結束了。"],["p","而那份停戰協定，是祂簽的，不是你簽的。"],["p","所以它不會因為你今天心情不好就作廢。"],["w",3],["p","第二，一次傾倒。"],["p","神的愛，已經整桶倒進你心裡了。"],["p","而且到今天，還是濕的。"],["p","祂沒有等你變好才愛你——祂是在你最糟的時候，付出了最大的代價。"],["w",3],["p","第三，一場換王。"],["p","你的地位，不是靠你的表現決定的。"],["p","是靠你屬於哪一個人。"],["p","而在祂的國度裡，你不是奴隸。你要作王。"],["w",3],["p","弟兄姊妹，現在我要把今天那兩個字還給大家。"],["p","何況。"],["p","我要教你們怎麼用它。"],["w",3],["p","當你這個禮拜跌倒了，心裡有一個聲音說「你這樣還敢禱告嗎」——"],["p","你就對那個聲音說："],["q","「祂在我是仇敵的時候都為我死了。\n\n何況現在。」"],["w",3],["p","當你在患難中，心裡有一個聲音說「如果神愛你，怎麼會這樣」——"],["p","你就說："],["q","「祂已經把祂兒子給我了。\n\n何況這件事。」"],["w",3],["p","當你看著自己的失敗，心裡想「我這樣的人，神真的接納我嗎」——"],["p","你就說："],["q","「祂愛我的那一天，我比今天糟得多。\n\n何況現在。」"],["w",3],["p","弟兄姊妹，那位跟我說「我得先把自己整理好再去見神」的弟兄——"],["p","我後來告訴他一句話。我今天也想告訴你："],["q","你不用先整理好。\n\n因為門口那位引見官，從來沒有走開過。\n\n而且那扇門，本來就不是你打開的。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，承認我們一直用感覺在判斷跟祢的關係。表現好的時候比較敢來，跌倒的時候就想先躲一躲。\n\n主啊，今天祢讓我們看見：那份停戰協定，是祢簽的。那扇門，是祢開的。那桶愛，是祢倒下來的。沒有一樣是我們做的。\n\n我們也承認，我們常常聽偏了。我們聽環境、聽情緒、聽別人怎麼看我們，卻沒有在祢底下聽。求祢開通我們的耳朵。\n\n主啊，謝謝祢在我們還作仇敵的時候就為我們死了。所以今天不管我們的光景怎麼樣，我們都可以說一句：何況。\n\n求祢讓恩典在我們裡面作王，直到永生。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"6":{"min":35,"blocks":[["h","你已經死了"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天的講題，可能是我講過最不客氣的一個。"],["p","《你已經死了》。"],["p","我知道，對著一群活得好好的人說這句話，有點奇怪。"],["p","但這不是我說的。這是保羅說的。"],["p","而且他說這句話的時候，語氣比我還直接。"],["w",3],["p","我先講一件事。"],["p","我認識一位弟兄，信主十八年。"],["p","有一天他跟我說了一段話。他說："],["q","「牧師，有一個罪，我從信主第二年就開始對付。\n\n我禱告過、禁食過、找人代禱過、寫過決心書、換過手機、刪過帳號。\n\n十六年了。\n\n我現在已經不太立志了。因為我知道立完志，過兩個禮拜還是一樣。」"],["p","他最後說了一句話，我一直記到現在："],["q","「牧師，我不是不想勝過。我是打不贏。」"],["w",3],["p","弟兄姊妹，我想今天在座，有人聽得懂這句話。"],["p","立志 → 失敗 → 羞愧 → 再立志。"],["p","有些人在這個循環裡，已經轉了十年、二十年。"],["p","而羅馬書第六章，就是為這樣的人寫的。"],["p","但保羅給的答案，可能跟你想的不一樣。"],["p","他沒有說「你要更努力」。"],["p","他說的是——"],["p","「你已經死了。」"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一場葬禮。\n第二，一本帳。\n第三，一批兵器。"],["w",3],["h","第一大段｜一場你已經參加過的葬禮（6:1–10）"],["h","保羅自己先問了那個問題"],["p","弟兄姊妹，我們先看第一節。"],["p","第五章的最後，保羅說了一句非常大膽的話："],["q","「罪在哪裡顯多，恩典就更顯多了。」（5:20）"],["p","弟兄姊妹，這句話講完，保羅立刻知道有人會怎麼想。"],["p","所以第六章第一節，他自己先把那個念頭說出來："],["q","「這樣，怎麼說呢？我們可以仍在罪中、叫恩典顯多嗎？」"],["p","「仍在罪中」——這個字在原文是 ἐπιμένω。"],["p","它的意思不是「偶爾犯罪」。"],["p","它的意思是：繼續住在那裡。賴著不走。"],["p","保羅問的不是「基督徒會不會跌倒」。"],["p","保羅問的是：基督徒可不可以把罪當成住址。"],["h","保羅的回答，跟我們想的不一樣"],["p","然後保羅回答了。第二節："],["q","「斷乎不可！我們在罪上死了的人豈可仍在罪中活著呢？」"],["p","弟兄姊妹，我要請你們注意一件事。"],["p","注意保羅沒有用的三種回答："],["p","第一，他沒有說：「不可以，因為神會生氣、會處罰你。」"],["p","第二，他沒有說：「不可以，因為你要報答神的恩。」"],["p","第三，他沒有說：「不可以，因為你要證明你是真的信。」"],["p","弟兄姊妹，這三種回答，我們都很熟。因為我們常常這樣講道，也常常這樣對自己說話。"],["p","但保羅一個都沒用。"],["p","保羅只說了一句話："],["q","「你已經死了。」"],["p","這不是道德勸說。這是身分陳述。"],["h","「豈可」不是「不應該」"],["p","而這裡有一個字，中文譯本很難完全表達出來。"],["p","「豈可仍在罪中活著呢」——「豈可」這個字，希臘文是 πῶς。"],["p","πῶς 的意思是「怎麼」。"],["p","中文「豈可」聽起來像是責備：「你怎麼可以這樣！」"],["p","但希臘文的重點是：「這在邏輯上，怎麼行得通？」"],["p","弟兄姊妹，這是一個關於可能性的問題，不是關於責任的問題。"],["p","保羅不是在說：「你不應該住在罪裡。」"],["p","保羅是在說："],["q","「一個死人——怎麼可能還住在那裡？」"],["h","那場葬禮"],["p","那保羅憑什麼說我們已經死了？"],["p","接下來八節，他就在講這件事。而且他一直在敲同一個字。"],["p","弟兄姊妹，希臘文有一個前綴，叫 σύν——意思是「一同」。"],["p","保羅在第4節到第8節，一連用了四個帶 σύν 的字："],["p","第4節：與祂一同埋葬。\n第5節：與祂長成一體。\n第6節：與祂一同釘十字架。\n第8節：與祂一同活。"],["p","一同、一同、一同、一同。"],["p","弟兄姊妹，整章的地基只有一個詞："],["p","與基督聯合。"],["w",3],["p","而第4節那個字特別有意思：「一同埋葬」。"],["p","我想問一個問題：死了不就夠了嗎？為什麼還要特別講「埋葬」？"],["p","弟兄姊妹，因為埋葬是死亡的確認。"],["p","一個人死了，還有可能被搶救回來。"],["p","但一個人被埋了——"],["p","這件事就結案了。"],["p","埋葬是公開的、社會性的、不可逆的宣告："],["p","這個人，真的走了。"],["w",3],["p","而弟兄姊妹，你們知道嗎——"],["p","你們大部分人，都親眼參加過這場葬禮。"],["p","那一天叫做：你受洗的那一天。"],["p","「受洗」這個字，希臘文是 βαπτίζω。它的意思是「浸入、沒入」。"],["p","古希臘人用這個字形容什麼？"],["p","船沉沒。"],["p","還有——布料浸進染缸。浸下去之後，那塊布就變成染缸的顏色了。"],["p","弟兄姊妹，一個第一世紀的信徒受洗的時候，全會眾看見什麼？"],["p","一個人整個沉下去——那是埋葬。"],["p","一個人整個起來——那是復活。"],["p","保羅說：那一天，你自己已經公開承認了這件事。"],["p","現在你要反悔嗎？"],["h","一個嫁接的畫面"],["p","第5節還有一個字，我很喜歡。"],["p","「我們若在他死的形狀上與他聯合」——「聯合」這個字是 σύμφυτος。"],["p","這個字在整本新約，只出現這一次。"],["p","它的意思是：σύν（一同）+ φύω（生長）——一同長成。"],["p","它用在哪裡？"],["p","用在植物的嫁接。"],["p","還有——斷骨的癒合。接回去之後，長在一起了。"],["p","弟兄姊妹，你聽出差別了嗎？"],["q","保羅選的不是「捆在一起」。\n\n捆在一起，還可以解開。\n\n保羅選的是「長在一起」。\n\n長在一起，就分不開了。"],["p","而這給了我們對付罪最深的一個角度："],["q","問題不是「我要怎麼靠意志力離開罪」。\n\n問題是「我已經被接在誰身上」。\n\n一根枝子會結什麼果子，不是靠它努力，是靠它接在哪裡。"],["h","一個被免職的主人"],["p","現在我要講今天最重要的一個字。第6節："],["q","「因為知道我們的舊人和他同釘十字架，使罪身滅絕，叫我們不再作罪的奴僕。」"],["p","「滅絕」這個字，希臘文是 καταργέω。"],["p","弟兄姊妹，中文譯「滅絕」，很容易讓人以為：罪已經不存在了。"],["p","但這個字的意思不是「消滅」。"],["p","它是由兩個部分組成的：κατά（徹底）+ ἀργός（不工作、閒置）。"],["p","合起來的意思是："],["q","使它失去作用。\n\n解除它的職權。"],["p","弟兄姊妹，這是一個人事命令。"],["w",3],["p","我請大家想像一個畫面。"],["p","你們公司有一個主管，很兇，管了你十年。"],["p","有一天，董事會開會，把他免職了。"],["p","但——他還在。"],["p","他還在辦公室裡走來走去。他還會敲你的門。"],["p","他還會用那個熟悉的、不容置疑的語氣說："],["q","「這件事，你去辦。」"],["p","弟兄姊妹，這時候你會不會照做？"],["p","這不取決於他有沒有權柄——他沒有了。"],["p","這取決於——"],["q","你還記不記得，他已經被免職了。"],["w",3],["p","弟兄姊妹，這就是為什麼第12節保羅還要下命令："],["q","「不要容罪在你們必死的身上作王。」"],["p","如果罪已經被消滅了，這個命令就是多餘的。"],["p","保羅要命令「不要容它作王」，就表示——"],["p","那個被解職的傢伙，還在試圖坐上王位。"],["h","第一段的應用"],["p","弟兄姊妹，這一段改變了整場戰爭的性質。"],["q","如果我還沒死，那我對付罪的方式是掙扎。\n\n如果我已經死了，那我對付罪的方式是認清。"],["p","這禮拜，當那個熟悉的聲音又響起來的時候，我要請你試一件事。"],["p","不要立刻用力抵抗。"],["p","先對它說一句話："],["q","「你已經被免職了。」"],["w",3],["h","第二大段｜一本你要親自算的帳（6:11）"],["h","全卷書的第一個命令"],["p","弟兄姊妹，現在我們來到全章的樞紐。第11節："],["q","「這樣，你們向罪也當看自己是死的；向神在基督耶穌裡，卻當看自己是活的。」"],["p","我先跟大家說一件事，這件事我自己讀了很多年才注意到。"],["p","羅馬書從第一章第一節，到第六章第十節——"],["p","大概一百四十節經文。"],["p","保羅沒有給讀者一個真正的命令。"],["p","沒有。一個都沒有。"],["p","他一直在講：你是誰、神做了什麼、基督成就了什麼。"],["p","整整五章半。"],["p","然後——"],["p","第一個命令，出現在第六章第十一節。"],["p","弟兄姊妹，你們猜那個命令是什麼？"],["p","不是「你要努力」。"],["p","不是「你要付出」。"],["p","不是「你要改變」。"],["p","是——"],["q","「你要這樣算。」"],["p","弟兄姊妹，神給我們的第一個命令，是關於——"],["q","你怎麼看你自己。"],["h","第四章那個字，回來了"],["p","「當看」這個字，希臘文是 λογίζομαι。"],["p","弟兄姊妹，這個字我們見過。"],["p","還記得第四章嗎？那一章這個字出現了十一次。"],["q","「亞伯拉罕信神，這就算為他的義。」（4:3）\n\n「主不算為有罪的，這人是有福的。」（4:8）"],["p","那是一個記帳的字。商人記帳、銀行入款，用的就是這個字。"],["p","但弟兄姊妹，第四章和第六章，有一個關鍵的差別。"],["p","第四章，這個字是被動式——"],["q","是神在算。"],["p","第六章，這個字是命令語氣——"],["q","是你要算。"],["p","你看見那個次序了嗎？"],["q","第四章：神先算了。\n\n第六章：現在，你照著神的算法，算你自己。"],["p","弟兄姊妹，這是全本聖經最重要的一個屬靈次序："],["q","我不是靠「算」讓那件事成真。\n\n我是因為那件事已經真了，所以我才敢算。"],["h","這不是自我催眠"],["p","我必須在這裡停一下，因為這節經文很容易被誤用。"],["p","有人會說：「所以我要不斷告訴自己『我死了、我死了』，講久了就會成真？」"],["p","不是。那叫自我催眠，那不是聖經。"],["p","弟兄姊妹，請注意保羅把什麼放在第11節前面。"],["p","他放了八節。"],["p","第3節到第10節，全部都是事實陳述——沒有一個命令。"],["p","- 你受洗歸入祂的死\n- 你與祂一同埋葬\n- 你與祂長成一體\n- 你的舊人與祂同釘\n- 罪身被解職了\n- 死對祂不再有主權\n- 祂向罪死，只有一次"],["p","八節事實。"],["p","然後才是第11節：「這樣……當看自己。」"],["q","所以「算」不是把不存在的事說成存在。\n\n「算」是把已經存在的事，登記入帳。"],["p","弟兄姊妹，用剛才那個比喻："],["q","「算」不是自我催眠。\n\n「算」是——把那張免職令拿出來，再看一次。"],["h","為什麼很多人原地打轉"],["p","弟兄姊妹，我想這一節解釋了一件事。"],["p","為什麼有些基督徒，道理都懂，也很努力，卻一直原地打轉？"],["p","我想是因為——他們跳過了第11節。"],["p","他們知道教義（第3到10節）。\n他們也很努力去行動（第12到13節）。"],["p","但中間那個「算」，從來沒有做過。"],["p","結果就是："],["q","知識在腦子裡。\n行動靠意志力。\n中間，沒有橋。"],["p","而第11節，就是那座橋。"],["h","第二段的應用"],["p","這禮拜，我要請大家每天早上做一件事。"],["p","只要十秒鐘。"],["p","起床之後，說一句話："],["q","「向罪，我是死的。\n向神，我是活的。\n在基督耶穌裡。」"],["p","而且注意——原文的「當看」是現在式命令。"],["p","意思是：一直算下去。"],["p","不是算一次就好了。"],["p","是每一次那個聲音來的時候，算一次。"],["w",3],["h","第三大段｜一批不能中立的兵器（6:12–23）"],["h","你的肢體是武器"],["p","弟兄姊妹，講完「知道」和「算」，保羅終於講到行動了。"],["p","第13節："],["q","「也不要將你們的肢體獻給罪作不義的器具；倒要……將肢體作義的器具獻給神。」"],["p","「器具」這個字，希臘文是 ὅπλα。"],["p","弟兄姊妹，這個字在第一世紀的主要意思，不是「工具」。"],["p","是——武器。"],["p","同一個字用在哪裡？"],["p","約翰福音18章，猶大帶著兵丁來抓耶穌，「拿著燈籠、火把、兵器」——同一個字。"],["p","哥林多後書10章4節：「我們爭戰的兵器本不是屬血氣的」——同一個字。"],["p","羅馬書13章12節：「當穿上光明的兵器」——同一個字。"],["p","弟兄姊妹，保羅畫的畫面是什麼？"],["q","你的手。\n你的眼睛。\n你的舌頭。\n你的時間。\n你的錢包。\n你的手機。\n\n那些不是中立的工具。\n\n那些是武器。"],["p","而武器有一個特點："],["q","它一定在某一方手上。"],["h","沒有中立地帶"],["p","弟兄姊妹，我覺得這是第六章對我們最扎的一句話。"],["p","我們心裡都有一塊「中立地帶」。"],["p","我們會想：這件事不算屬靈，但也不算犯罪嘛。就放著。"],["p","- 這兩個小時，我沒有做壞事，只是滑手機\n- 這句話，我沒有說謊，只是沒有說全部\n- 這個關係，我沒有越界，只是有一點曖昧"],["p","但保羅說："],["q","你的舌頭如果今天沒有獻給神——\n\n它不是在放假。\n\n它在另一邊的軍械庫裡。"],["h","兩個命令，兩種時態"],["p","弟兄姊妹，第13節還有一個文法上的細節，非常美。"],["p","這一節有兩個命令，但它們的時態不一樣。"],["p","上半句：「不要將你們的肢體獻給罪」——現在式命令。"],["p","在希臘文裡，這通常表示：停止一個正在進行的動作。"],["p","下半句：「倒要將自己獻給神」——不定過去式命令。"],["p","那表示：一個決斷的、一次性的動作。"],["p","弟兄姊妹，這兩個時態，畫出了基督徒生活的兩面："],["q","一面是每天的停止：那個習慣、那個網站、那個念頭——停下來。\n\n一面是一次的交出：主啊，我把自己給祢——現在，就一次。"],["p","而這兩面，缺一不可。"],["q","只有「每天停止」，會變成一場沒有終點的苦戰。\n\n只有「一次奉獻」，會變成一個沒有兌現的承諾。"],["h","你不是在選「有沒有主人」"],["p","接下來保羅講到一個當時人人都懂的畫面：奴隸。"],["p","第16節："],["q","「豈不曉得你們獻上自己作奴僕，順從誰，就作誰的奴僕嗎？」"],["p","弟兄姊妹，羅馬書16章有一長串問安的名單。"],["p","學者告訴我們，裡面有好幾個是典型的奴隸的名字。"],["p","也就是說：保羅講這一段的時候，羅馬教會裡坐著的，真的有奴隸。"],["p","他們比誰都懂一件事："],["q","奴隸沒有「兼職」這回事。\n\n你只有一個主人。"],["p","而保羅要拆掉的，是一個很普遍的幻覺："],["q","「我可以不屬於任何人。我是自由的。」"],["p","保羅說：沒有這種東西。"],["q","人不是在「有主人」和「沒主人」之間選。\n\n人是在「哪一個主人」之間選。"],["p","而保羅給了一個非常實際的判準："],["p","你怎麼知道你是誰的奴僕？"],["q","不是看你怎麼自稱。\n\n是看——你聽誰的。\n\n當那個聲音響起來的時候，你的身體，往哪裡走。"],["h","一個你可能沒注意的語序"],["p","弟兄姊妹，第17節有一句話，我讀了很多年才看見。"],["p","和合本是這樣譯的："],["q","「你們……現今卻從心裡順服了所傳給你們道理的模範。」"],["p","聽起來像：道理被傳給了你們。"],["p","但希臘文的語序，是反過來的。"],["p","原文的意思是："],["q","「那個你們被交付進去的教訓的模子。」"],["p","弟兄姊妹，主詞和受詞對調了。"],["p","| 我們以為 | 保羅說 |\n|---|---|\n| 道理被交給我 | 我被交給道理 |\n| 我掌握真理 | 真理掌握我 |\n| 我把聖經拿在手上 | 我被放進聖經的模子裡 |"],["p","「模範」這個字是 τύπος——模子。"],["p","畫面是什麼？"],["q","熔化的金屬，被倒進模子裡。\n\n冷卻之後，就成了模子的形狀。"],["p","弟兄姊妹，保羅說：你被倒進去了。"],["p","我們常說「我學了很多真理」——好像真理是我收藏的東西。"],["p","保羅說：不是。"],["q","你不是拿著模子的人。\n\n你是被倒進模子的那塊金屬。"],["h","一個準時發薪的雇主"],["p","弟兄姊妹，最後我們來看第23節。這是全本聖經最常被引用的經文之一："],["q","「因為罪的工價乃是死；惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。」"],["p","「工價」這個字，希臘文是 ὀψώνια。"],["p","弟兄姊妹，這個字原本的意思，是——"],["p","士兵的口糧和軍餉。"],["p","路加福音3章，施洗約翰對兵丁說「當以自己的錢糧為足」——同一個字。"],["p","哥林多前書9章7節：「有誰當兵自備糧餉呢？」——同一個字。"],["p","這個字有兩個特點："],["p","第一，它是定期發放的。不是一次結清，是每個月、每一天都在發。"],["p","第二，它是你掙來的。你服役，你領餉。理所當然。"],["p","弟兄姊妹，你聽出保羅在說什麼了嗎？"],["q","罪，是一個準時發薪的雇主。\n\n它從來不欠你。\n它從來不遲發。\n它每一次，都準時把你該得的，付給你。\n\n而它付的那樣東西，叫做——死。"],["w",3],["p","而弟兄姊妹，原文裡還藏了一個對比，中文完全看不出來。"],["p","「工價」（ὀψώνια）在原文是複數。"],["p","「恩賜」（χάρισμα）在原文是單數。"],["p","你聽出來了嗎？"],["q","罪的付款方式，是分期的。\n\n你不會在某一天突然收到「死」這個大包裹。\n\n你是一小筆、一小筆地領的。\n\n今天付你一點點空虛。\n明天付你一點點麻木。\n後天付你一點點失去的關係。\n再過幾年，付你一點點你已經認不出來的自己。"],["p","——而神的禮物，是單數。"],["q","不是分期。不是試用。\n\n是整個給你。"],["h","一個不對稱的句子"],["p","弟兄姊妹，最後一件事。"],["p","照著對稱的邏輯，保羅應該這樣寫："],["q","「罪的工價是死；義的工價是永生。」"],["p","很整齊，對不對？"],["p","但保羅沒有這樣寫。"],["p","他寫的是："],["q","「罪的工價乃是死；惟有神的恩賜，乃是永生。」"],["p","一邊是「掙來的」。"],["p","一邊是「白給的」。"],["p","弟兄姊妹，這個不對稱，是整卷羅馬書的縮影："],["q","死，是你賺的。\n\n生命，是祂給的。"],["w",3],["h","結論"],["p","弟兄姊妹，我們今天看了三樣東西。"],["p","第一，一場葬禮。"],["p","那場葬禮，兩千年前已經舉行過了。"],["p","而你受洗那一天，你自己已經公開承認過。"],["p","所以你不是要去死——"],["p","你已經死了。"],["w",3],["p","第二，一本帳。"],["p","神先算了，現在祂命令你照著算。"],["p","那不是自我催眠。那是把那張免職令，再拿出來看一次。"],["w",3],["p","第三，一批兵器。"],["p","你的手、你的眼睛、你的舌頭、你的時間——"],["p","沒有一樣是中立的。"],["p","今天，它們在誰手上？"],["w",3],["p","弟兄姊妹，我想回到開頭那位弟兄。"],["p","那位對付了十六年、最後說「我不是不想勝過，我是打不贏」的弟兄。"],["p","我後來跟他說了一段話。我今天也想對在座有同樣掙扎的人說："],["q","弟兄，我想你可能一直在打一場已經打完的仗。\n\n你一直在努力殺死一個已經被判死刑的人。\n\n而那個折磨你十六年的主人——\n\n他不是還很強。\n\n他是已經被免職了。\n\n他只是還沒搬走，還在敲你的門，還在用以前的語氣說話。\n\n而他唯一的權力來源是——\n\n你還記不記得，他已經沒有鑰匙了。"],["w",3],["p","弟兄姊妹，最後我要問一個問題。"],["p","保羅在第21節問了一個很誠實的問題："],["q","「你們現今所看為羞恥的事，當日有什麼果子呢？」"],["p","那些年、那些夜晚、那些選擇——"],["p","收成在哪裡？"],["p","它付了你多少？"],["w",3],["p","弟兄姊妹，如果你今天心裡有一個答案——"],["p","那我要用保羅的最後一句話，對你說："],["q","你已經有禮物了。\n\n何必回去領那份薪水？"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，承認我們當中有人已經打了很久、很累的一場仗。我們立過志、失敗過、羞愧過，然後再立志。\n\n主啊，今天祢讓我們看見：我們不是要去死，我們已經死了。那場葬禮，祢已經替我們辦完了。\n\n求祢讓我們每天記得把那張免職令拿出來看。當那個熟悉的聲音又響起來的時候，讓我們知道——他已經沒有鑰匙了。\n\n主啊，我們現在把我們的肢體交給祢。我們的眼睛、我們的舌頭、我們的手、我們的時間。求祢收下。從今天起，它們是祢的兵器。\n\n我們也承認，我們常常忘記自己是被交進祢話語的模子裡的。我們常常以為是我們掌握真理。求祢赦免我們，也求祢繼續塑造我們。\n\n謝謝祢，祢不是雇主，祢是父親。祢的恩賜不是分期，是一次給完。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3]]},"7":{"min":35,"blocks":[["h","我真是苦啊"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","今天我要先說一句話。"],["p","今天在這裡，你可以承認你做不到。"],["p","我知道這句話有點奇怪。因為教會通常不是這樣的地方。"],["p","教會通常是一個你要說「主恩夠用」「感謝主，我很好」的地方。"],["p","但今天不是。"],["p","因為今天我們要讀的這一章，是全本聖經最誠實的一章。"],["p","而寫這一章的人，在裡面說了一句話："],["q","「我真是苦啊！」"],["w",3],["p","我先說一個場景。"],["p","有一位姊妹，跟我談過一次。"],["p","她說她信主二十年，在教會服事，帶小組，別人都覺得她很好。"],["p","然後她說："],["q","「牧師，有一件事我沒有跟任何人說過。\n\n我每天晚上，都會跟神說對不起。\n\n二十年了。\n\n同一件事。」"],["p","她停了很久，然後說了最後一句："],["q","「我覺得我在騙人。」"],["w",3],["p","弟兄姊妹，我想今天在座，有人聽得懂這句話。"],["p","外面看起來好好的，裡面有一件事，你已經跟神道歉了很多年。"],["p","你不敢跟任何人說。因為你怕人家問：「你信主這麼久了，怎麼還……」"],["p","弟兄姊妹，羅馬書第七章，就是為這樣的人寫的。"],["p","而寫它的人，是保羅。"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一紙已經失效的婚書。\n第二，一個罪佔住的灘頭堡。\n第三，一聲半夜的呼喊。"],["w",3],["h","第一大段｜一紙已經失效的婚書（7:1–6）"],["h","律法只管活人"],["p","弟兄姊妹，第七章一開始，保羅講了一個法律常識。第1節："],["q","「你們豈不曉得律法管人是在活著的時候嗎？」"],["p","「管」這個字，希臘文是 κυριεύω，意思是「作主、掌權」。"],["p","弟兄姊妹，這個字我們上禮拜見過。"],["p","羅馬書6章9節：「死也不再作他的主了。」"],["p","羅馬書6章14節：「罪必不能作你們的主。」"],["p","現在7章1節：「律法管人是在活著的時候。」"],["p","三個主人：死、罪、律法。"],["p","而保羅說：它們對你都沒有主權了。"],["p","而且解除的方式，都是同一個——"],["p","死。"],["h","一個婚姻的比喻"],["p","然後保羅講了一個比喻。第2節："],["q","「就如女人有了丈夫，丈夫還活著，就被律法約束；丈夫若死了，就脫離了丈夫的律法。」"],["p","弟兄姊妹，保羅為什麼選這個比喻？"],["p","因為婚約有一個特點："],["q","你不能靠「努力」解除它。"],["p","一個妻子不能說：「我最近表現很好，所以我現在自由了。」"],["p","只有一件事能解除婚約："],["p","死。"],["w",3],["p","而第2節那個「脫離了」，希臘文是 καταργέω——"],["p","弟兄姊妹，這正是我們上禮拜看的那個字。羅馬書6章6節「使罪身滅絕」，就是這個字。"],["p","而這一次的用法，把意思講得更清楚了："],["q","一個寡婦，不是「被消滅了」。\n\n她還在。她還活著。她還可以再嫁。\n\n只是那個婚姻的律法，對她失效了。"],["h","你不是變單身，你是改嫁了"],["p","然後第4節，保羅應用了。"],["q","「我的弟兄們，這樣說來，你們藉著基督的身體，在律法上也是死了，叫你們歸於別人，就是歸於那從死裡復活的。」"],["p","弟兄姊妹，這裡有兩個地方我要講。"],["p","第一，「在律法上也是死了」——這個動詞在原文是被動式。"],["p","它的字面是：你們被治死了。"],["p","而這個動詞在新約，是用在司法處決上的。"],["q","那不是自然死亡。\n\n那是一場行刑。\n\n而行刑的地點在各各他，被處死的是基督的身體——\n但因為你在祂裡面，你也一同被處死了。"],["p","第二，也是我覺得最美的一點——"],["p","「叫你們歸於別人」。"],["p","這是婚姻語言。"],["p","弟兄姊妹，注意保羅的重點："],["q","神讓你脫離律法，不是為了讓你自由。\n\n是為了讓你歸屬另一位。\n\n你不是離婚變單身。\n\n你是——改嫁了。"],["h","這對我們是什麼意思"],["p","弟兄姊妹，我想問一個問題。"],["p","你跟神的關係，會不會其實是一段很疲憊的婚姻？"],["p","我的意思是：你心裡有沒有一個公式——"],["q","「我表現好一點，祂就對我好一點。\n我最近軟弱，祂大概對我有點失望。」"],["p","如果有，那你可能還活在那段舊的婚姻裡。"],["p","而保羅說：那段婚姻，已經結束了。"],["p","不是因為你努力離開，是因為有人被處死了。"],["w",3],["h","第二大段｜一個罪佔住的灘頭堡（7:7–13）"],["h","律法是罪嗎？"],["p","弟兄姊妹，保羅講到這裡，他知道有人會誤會。"],["p","所以第7節，他自己先把那個問題問出來："],["q","「這樣，我們可說什麼呢？律法是罪嗎？」"],["p","這是一個很自然的疑問。因為前面講了那麼多「脫離律法」，聽起來律法好像是壞東西。"],["p","保羅的回答是："],["q","「斷乎不是！」"],["p","而且他在第12節，講了全本聖經對律法最正面的一句話："],["q","「這樣看來，律法是聖潔的，誡命也是聖潔、公義、良善的。」"],["p","弟兄姊妹，四個形容詞。"],["p","保羅把律法放在最高的位置上。"],["h","保羅為什麼單挑第十誡"],["p","但接下來，保羅講了一件很有意思的事。第7節："],["q","「非律法說『不可起貪心』，我就不知何為貪心。」"],["p","弟兄姊妹，十條誡命，保羅為什麼單單挑這一條？"],["p","我請大家跟我一起想一想。"],["p","不可有別的神——這個可以查。看你去哪裡敬拜。"],["p","不可拜偶像——可以查。"],["p","不可妄稱神的名——可以查，聽你說話就知道。"],["p","當守安息日——可以查。"],["p","當孝敬父母——大致可以。"],["p","不可殺人——可以查。"],["p","不可姦淫——可以查。"],["p","不可偷盜——可以查。"],["p","不可作假見證——可以查。"],["p","九條。全部都可以在外面檢查。"],["p","然後第十條——"],["q","「不可貪心。」"],["p","弟兄姊妹，這一條，沒有人看得見。"],["w",3],["p","現在我要唸另一節經文。腓立比書3章6節，保羅講自己："],["q","「就律法上的義說，我是無可指摘的。」"],["p","弟兄姊妹，你聽懂了嗎？"],["q","保羅在那看得見的九條上，拿了滿分。\n\n然後有一天——\n\n第十條找上了他。\n\n那一條，只有神和他自己知道。"],["h","一個灘頭堡"],["p","接下來第8節，保羅講了一件很奇怪的事："],["q","「然而罪趁著機會，就藉著誡命叫諸般的貪心在我裡頭發動。」"],["p","「趁著機會」這個字，希臘文是 ἀφορμή。"],["p","弟兄姊妹，這個字在古希臘文裡，是一個軍事用語。"],["p","它的意思是："],["q","一支軍隊發動攻擊的——出發基地。\n\n今天我們會說：灘頭堡。"],["p","保羅的畫面是什麼？"],["q","罪，本來在你的領土上沒有立足點。\n\n然後——\n\n誡命來了。\n\n罪就在那道誡命上，建立了一個據點。"],["w",3],["p","弟兄姊妹，我舉一個很小的例子。"],["p","你走在一條走廊上。牆是白的。你根本沒注意到那面牆。"],["p","然後你看見一張告示，上面寫著："],["q","「油漆未乾，請勿觸摸。」"],["p","弟兄姊妹，接下來會發生什麼事？"],["p","你的手指，開始發癢。"],["w",3],["p","那張告示有錯嗎？"],["p","沒有。它說的是實話。它是為你好。"],["p","但它照出了你裡面本來就有的東西——"],["p","而那個東西，一被照到，就開始動了。"],["p","保羅說：這就是律法在我身上發生的事。"],["p","而且他把責任講得很清楚——"],["q","建立據點的是罪，不是誡命。\n\n誡命只是被利用的地形。"],["h","一個伊甸園的字"],["p","第11節，保羅用了一個字，我覺得是全章最深的一個字："],["q","「因為罪趁著機會，就藉著誡命引誘我，並且殺了我。」"],["p","「引誘」這個字，希臘文是 ἐξαπατάω。"],["p","弟兄姊妹，這個字出現在哪裡？"],["p","哥林多後書11章3節：「就像蛇用詭詐誘惑了夏娃一樣。」"],["p","提摩太前書2章14節：「乃是女人被引誘，陷在罪裡。」"],["p","而創世記3章13節，夏娃自己說："],["q","「那蛇引誘我，我就吃了。」"],["p","七十士譯本用的，就是這個字。"],["p","弟兄姊妹，保羅在說什麼？"],["q","發生在我身上的事——\n\n跟伊甸園裡發生的事，是同一件事。"],["h","那我們該怎麼辦？"],["p","弟兄姊妹，這一段對我們有一個很實際的提醒。"],["p","我們遇到問題的時候，最自然的反應是什麼？"],["p","訂規矩。"],["p","- 教會出狀況了 → 訂章程\n- 孩子有問題了 → 訂家規\n- 自己軟弱了 → 訂計畫、下決心、寫在紙上貼牆上"],["p","規矩本身沒有錯——律法是聖潔的。"],["p","但保羅提醒我們一件事："],["q","律法是最好的規矩。\n\n它是神親自頒布的。聖潔、公義、良善。\n\n沒有一個人類的制度比它更好。\n\n而——它救不了人。"],["p","所以弟兄姊妹："],["q","任何靠「更好的規矩」建立起來的東西，最後都會走到第7章24節。"],["w",3],["h","第三大段｜一聲半夜的呼喊（7:14–25）"],["h","保羅突然換了時態"],["p","弟兄姊妹，從第14節開始，這一章的語氣變了。"],["p","而且原文有一個很明顯的訊號："],["p","7章7節到13節，全部是過去式。"],["p","7章14節開始——全部變成現在式。"],["p","而且一直到章末。"],["p","這個轉換，是保羅刻意的。"],["p","（我要先說一句：這一段的「我」到底是誰，歷代敬虔的解經家有不同看法。有人認為保羅在講信主前，有人認為在講信主後。但兩邊都同意一件事——靠自己去守律法，結局就是7章24節。）"],["h","問題不在標準，在材質"],["p","第14節："],["q","「我們原曉得律法是屬乎靈的，但我是屬乎肉體的。」"],["p","弟兄姊妹，「屬乎肉體的」這個字，希臘文是 σάρκινος。"],["p","這個字的字尾，在希臘文裡是表示材質的。"],["p","它的意思不是「我很敗壞」，而是——"],["q","「我是肉做的。」"],["p","保羅在說什麼？"],["q","律法是屬天的材質。\n\n我是屬地的材質。\n\n兩者根本不匹配。"],["p","弟兄姊妹，這句話改變了整個診斷。"],["q","問題不是標準太高。\n\n問題是——材質不對。"],["h","我不缺願望"],["p","然後第18節，我覺得這是全本聖經最誠實的一句話："],["q","「因為，立志為善由得我，只是行出來由不得我。」"],["p","「由得我」這個字，原文的畫面很有意思。"],["p","παράκειμαι——字面是「擺在我旁邊」。"],["p","意思是：隨手可得。"],["p","弟兄姊妹，保羅在說："],["q","「願意」這樣東西，就擺在我手邊，隨時可以拿到。\n\n我從來不缺願望。\n\n願望多得很。\n\n我缺的是——把它做出來的那個力量。"],["p","弟兄姊妹，這句話說中了多少人？"],["q","決心，我有一堆。\n\n每年一月一號都有。\n\n能力，我沒有。"],["h","一個住在裡面的房客"],["p","第17節，保羅講了一個很重要的區分："],["q","「既是這樣，就不是我做的，乃是住在我裡頭的罪做的。」"],["p","「住」這個字，希臘文是 οἰκέω——字根是 οἶκος，房子。"],["p","意思是：居住、定居。"],["p","所以保羅的畫面是："],["q","罪，是一個住在我房子裡的房客。"],["p","弟兄姊妹，我要提醒一件事："],["q","房客——不是屋主。"],["p","這正是上禮拜第六章那個字（罪身被解職）的延續。"],["p","他被免職了。但他還沒搬走。"],["w",3],["p","而弟兄姊妹，這個字最重要的地方在下一章。"],["p","羅馬書8章9節：「如果神的靈住在你們心裡……」"],["p","羅馬書8章11節：「叫耶穌從死裡復活者的靈若住在你們心裡……」"],["p","同一個字。οἰκέω。"],["q","第七章：罪住在我裡面。\n\n第八章：聖靈住在我裡面。\n\n同一個字。\n\n不同的住客。"],["h","我不是叛徒，我是戰俘"],["p","第23節，保羅用了兩個軍事用語："],["q","「但我覺得肢體中另有個律和我心中的律交戰，把我擄去。」"],["p","「擄去」這個字，希臘文是 αἰχμαλωτίζω——意思是擄為戰俘。"],["p","弟兄姊妹，這個字很重要，因為："],["q","戰俘，不是叛徒。\n\n叛徒是自己走過去的。\n\n戰俘是站在對的一邊、卻被抓走的人。\n\n他的忠誠沒有改變，但他的行動被限制了。"],["p","保羅在說："],["q","我心裡站在對的一邊。\n\n我的身體卻在敵營裡。"],["h","那個掙扎，是生命的證據"],["p","弟兄姊妹，我要在這裡停一下，因為這件事很重要。"],["p","有人讀第七章，會得出一個結論："],["q","「我這樣掙扎，是不是根本沒得救？」"],["p","保羅在同一章，給了答案。"],["p","第15節，他說「我所恨惡的，我倒去做」。"],["p","「恨惡」這個字很強。弟兄姊妹，一個對罪毫無感覺的人，不會恨惡它。"],["p","第22節，他說：「按著我裡面的意思，我是喜歡神的律。」"],["p","「喜歡」這個字在整本新約只出現這一次。它的意思不是「我同意那是對的」，是——"],["q","「我打從心底，與神的律一同歡喜。」"],["p","而羅馬書8章7節說：「體貼肉體的，就是與神為仇……不服神的律法，也是不能服。」"],["p","弟兄姊妹，你聽出來了嗎？"],["q","一個「與神為仇」的人，不可能由衷地喜悅神的律。"],["p","所以我要告訴今天在座、心裡有一件事已經掙扎很久的人："],["q","那個掙扎本身，就是生命的證據。\n\n死人不會覺得痛。\n\n你會為這件事難過——\n\n正說明你裡面有一位在做工。"],["h","我真是苦啊"],["p","然後——第24節。"],["q","「我真是苦啊！誰能救我脫離這取死的身體呢？」"],["p","「苦」這個字，希臘文是 ταλαίπωρος。"],["p","它在整本新約，只出現兩次。"],["p","一次在這裡。"],["p","另一次在啟示錄3章17節，主對老底嘉教會說：「你卻不知道你是那困苦、可憐、貧窮、瞎眼、赤身的。」"],["p","弟兄姊妹，這不是「我有點沮喪」。"],["p","這是一個人在絕境中的呼喊。"],["w",3],["p","而我要請大家注意兩件事。"],["p","第一，這聲呼喊，是進步，不是退步。"],["p","為什麼？"],["q","因為一個人要走到第24節，他必須先走過第18節——\n\n「立志為善由得我，只是行出來由不得我。」\n\n也就是說：他必須先用盡全力嘗試過，才會喊出這句話。\n\n一個從來沒有認真想要聖潔的人，喊不出第24節。"],["p","第二，也是最重要的——"],["p","注意保羅問的是什麼。"],["p","他沒有問：「什麼方法能救我？」"],["p","他沒有問：「我該做什麼才能救自己？」"],["p","他問的是——"],["q","「誰能救我？」"],["p","弟兄姊妹，一個字的差別。"],["q","從一個方法的問題，變成一個位格的問題。"],["p","而且「救」這個字，希臘文是 ῥύομαι。"],["p","它的意思不是「幫助」，是——"],["q","從危險中，把人拉出來。\n\n搶救。"],["p","（主禱文裡「救我們脫離兇惡」，用的就是這個字。）"],["p","弟兄姊妹，保羅要的不是幫助。"],["p","不是指導。"],["p","不是方法。"],["p","他要的是——搶救。"],["w",3],["h","結論"],["p","弟兄姊妹，我要問一個問題。"],["p","你最近為那件掙扎了很久的事禱告，你是怎麼禱告的？"],["p","我猜大部分人的禱告，是這樣的："],["q","「主啊，求祢幫助我，這次一定要做到。」"],["p","弟兄姊妹，我要說一句可能有點重的話："],["q","「幫助我努力」——\n\n那還是第18節。\n\n那還是「我」在主導，只是加了一點神。"],["p","而第24節的禱告，只有四個字："],["q","「主啊，救我。」"],["w",3],["p","弟兄姊妹，然後——"],["p","第25節。"],["p","保羅在最深的谷底，說了第一句話。"],["p","不是「我要振作起來」。"],["p","不是「我要重新立志」。"],["p","是——"],["q","「感謝神！」"],["p","而原文的字面是：恩典歸與神。"],["p","接著他說出那個答案："],["q","「靠著我們的主耶穌基督就能脫離了。」"],["p","弟兄姊妹，注意——"],["p","保羅沒有給一個方法。"],["p","沒有給五個步驟。"],["p","沒有給一套操練。"],["p","他給了一個——"],["p","名字。"],["w",3],["p","弟兄姊妹，我今天要在這裡停住。"],["p","因為第七章就是在這裡停住的。"],["p","但我要告訴你們下一句是什麼。"],["p","羅馬書8章1節："],["q","「如今，那些在基督耶穌裡的就不定罪了。」"],["p","8章2節："],["q","「因為賜生命聖靈的律，在基督耶穌裡釋放了我，使我脫離罪和死的律了。」"],["p","弟兄姊妹，你們注意到了嗎？"],["p","第七章問：誰能救我？"],["p","第八章答：聖靈釋放了我。"],["p","而第八章第9節說："],["q","「神的靈住在你們心裡。」"],["p","同一個「住」。"],["q","第七章：罪住在我裡面。\n\n第八章：聖靈住在我裡面。\n\n弟兄姊妹，從第七章到第八章的轉折，不是「我更努力了」。\n\n是——\n\n住在裡面的那一位，換了。"],["w",3],["p","弟兄姊妹，我想回到開頭那位姊妹。"],["p","那位每天晚上跟神說對不起、說了二十年的姊妹。"],["p","我後來跟她說了一句話。我今天也想對在座有同樣光景的人說："],["q","姊妹，你不是在騙人。\n\n你每天晚上還會跟神說對不起——\n\n那不是你的失敗，那是你的證據。\n\n一個沒有生命的人，不會道歉二十年。\n\n他早就不在意了。"],["p","而我要對你說第二句話："],["q","也許這二十年，你一直在求祂幫你。\n\n今天，你可以換一個字。\n\n求祂——救你。"],["p","我們一起低頭禱告。"],["w",3],["q","親愛的主耶穌，\n\n我們今天在祢面前，說一句我們平常在教會不太敢說的話：\n\n我們做不到。\n\n主啊，我們有願望。我們的願望多得很。我們立過的志，寫過的決心，數都數不完。\n\n但我們沒有力量。\n\n主啊，我們也承認，我們一直在求祢「幫助我們努力」。今天我們知道了，那還是我們在主導。\n\n所以現在，我們用保羅的那句話禱告：\n\n主啊，救我。我出不來。\n\n謝謝祢，祢沒有讓那聲呼喊懸在空中。祢在下一句就說了：感謝神，靠著我們的主耶穌基督就能脫離了。\n\n主啊，也求祢安慰今天在座每一個掙扎了很久的人。求祢讓他們知道：那個掙扎本身，就是祢在他裡面做工的證據。死人不會覺得痛。\n\n求祢的靈住在我們裡面，成為我們的能力。\n\n奉主耶穌基督的名禱告，阿們。"],["w",3],["q","【講員備註】 本篇以呼喊與盼望的入口作結，是刻意的。但務必：\n① 在結束前明確給出第八章的方向（本稿已包含）；\n② 預備會後的個別關懷——這篇道會使一些人第一次願意開口；\n③ 若察覺有人陷於嚴重的自我定罪、憂鬱或自傷風險，除屬靈的陪伴外，應鼓勵並協助尋求專業協助。"],["w",3]]},"8":{"min":38,"blocks":[["h","如今"],["w",3],["h","開場"],["p","弟兄姊妹，平安。"],["p","上個禮拜，我們停在一個很不舒服的地方。"],["p","羅馬書7章24節："],["q","「我真是苦啊！誰能救我脫離這取死的身體呢？」"],["p","我說過，保羅只讓那聲呼喊，懸在空中一句話。"],["p","今天，我們要讀下一句。"],["w",3],["p","不過在讀之前，我要先給大家看一件事。"],["p","我請大家記住三個數字。"],["p","羅馬書第六章，「聖靈」這個字出現幾次？"],["p","零次。"],["p","羅馬書第七章第7節到第25節——就是那段「我所願意的，我並不做」——聖靈出現幾次？"],["p","零次。"],["p","而同一段裡，「我」出現幾次？"],["p","大約四十次。"],["p","然後——羅馬書第八章。"],["p","聖靈出現幾次？"],["p","二十次以上。"],["w",3],["p","弟兄姊妹，這三個數字，就是第七章與第八章的全部差別。"],["p","第七章的問題，從來不是「知道得不夠」。"],["p","保羅知道得很清楚。他說「按著我裡面的意思，我是喜歡神的律」。"],["p","第七章的問題是——"],["p","沒有能力。"],["p","而第八章第一句話，就把那個能力的名字說出來。"],["w",3],["p","我們今天要看三樣東西："],["p","第一，一位新住客。\n第二，三聲嘆息。\n第三，一把沒有停下來的刀。"],["w",3],["h","第一大段｜住客換了（8:1–17）"],["h","一點也沒有"],["p","羅馬書8章1節："],["q","「如今，那些在基督耶穌裡的就不定罪了。」"],["p","弟兄姊妹，我要先跟大家講原文的語序。"],["p","中文是「如今……就不定罪了」。"],["p","但希臘文的第一個字，是「一點也沒有」。"],["p","保羅是這樣寫的："],["q","「一點定罪也沒有——所以，如今，對那些在基督耶穌裡的人。」"],["p","他把「沒有」放在最前面，像一記重錘先落下來。"],["w",3],["p","而「定罪」這個字，希臘文是 κατάκριμα。"],["p","弟兄姊妹，希臘文有兩個相近的字："],["p","一個是「定罪的動作」。"],["p","另一個——就是這裡用的——是「判決書本身」。"],["p","所以8:1不只是說「神現在不定你的罪」。"],["p","是說："],["q","那份判決書，本身不存在了。"],["w",3],["p","弟兄姊妹，要感受這一句的分量，你得把它接在7章24節後面讀："],["q","「我真是苦啊！誰能救我？」\n\n「一點定罪也沒有。」"],["p","一個剛剛承認自己徹底失敗的人，聽見的第一句話是什麼？"],["p","不是「你要改進」。"],["p","不是「下次不可以了」。"],["p","是——"],["p","「沒有定罪。」"],["h","那定罪去哪裡了？"],["p","但弟兄姊妹，我們要問一個問題。"],["p","罪是真的。失敗是真的。"],["p","那定罪去哪裡了？"],["p","第3節回答了："],["q","「律法既因肉體軟弱，有所不能行的，神就差遣自己的兒子，成為罪身的形狀，作了贖罪祭，在肉體中定了罪案。」"],["p","「定了罪案」——這個動詞，正是第1節那個「定罪」的動詞形式。"],["p","而它定在哪裡？"],["q","「在肉體中。」"],["p","在誰的肉體中？"],["q","在祂的肉體中。在十字架上。"],["p","弟兄姊妹，所以是這樣的："],["q","定罪沒有消失。\n\n定罪換了地址。"],["w",3],["p","而這裡我要特別講一句話，因為保羅寫得極其小心。"],["p","第3節說：「成為罪身的形狀」。"],["p","「形狀」這個字是 ὁμοίωμα——樣式。"],["p","弟兄姊妹，保羅沒有說「成為罪身」——那等於說基督有罪性。"],["p","他也沒有說「成為肉身的形狀」——那等於說祂只是看起來像人。"],["p","他說的是：「在罪之肉身的樣式中」。"],["p","這一句話同時保住了兩件事："],["q","祂真的成為人——真實的肉身、真實的軟弱、真實的試探。\n\n但祂沒有罪。"],["p","弟兄姊妹，祂進到了我們的處境裡面——"],["p","但祂沒有沾染那個處境的罪。"],["h","住客換了"],["p","現在我要講今天最重要的一個字。"],["p","羅馬書8章9節："],["q","「如果神的靈住在你們心裡，你們就不屬肉體，乃屬聖靈了。」"],["p","「住」這個字，希臘文是 οἰκέω。它的字根是 οἶκος——房子。"],["p","意思是：居住、定居。"],["p","弟兄姊妹，這個字我們上個禮拜見過。"],["p","羅馬書7章17節：「乃是住在我裡頭的罪做的。」"],["p","7章20節，又說了一次：「乃是住在我裡頭的罪做的。」"],["p","現在——"],["p","8章9節：「神的靈住在你們心裡。」"],["p","8章11節：「叫耶穌從死裡復活者的靈若住在你們心裡。」"],["p","弟兄姊妹，同一個字。"],["q","第七章：罪住在我裡面。\n\n第八章：聖靈住在我裡面。"],["p","這就是七章到八章的全部差別。"],["p","不是「我更努力了」。"],["p","是——"],["q","住在裡面的那一位，換了。"],["h","一件羅馬的法律文件"],["p","好，現在我要講第一段最溫暖的一節。第15節："],["q","「你們所受的，不是奴僕的心，仍舊害怕；所受的，乃是兒子的心，因此我們呼叫：『阿爸！父！』」"],["p","弟兄姊妹，「兒子的心」這個詞，希臘文是 υἱοθεσία。"],["p","它不是一個情感的比喻。"],["p","它是一個羅馬法律的專有名詞——"],["p","「收養」。"],["p","而羅馬的收養，跟我們今天想的不太一樣。它有幾個特點："],["p","第一，舊債一筆勾銷。被收養的人，從前欠的債，法律上不復存在。"],["p","第二，獲得完整的繼承權。與親生兒子在法律上完全同等。"],["p","第三，需要證人。收養要在證人面前完成。"],["p","第四——這一點最重要——"],["q","不可撤銷。\n\n一旦完成，養父不能因為這個孩子後來表現不好，就把收養取消。"],["w",3],["p","弟兄姊妹，你看看這幾點跟第八章的關係："],["p","第16節：「聖靈與我們的心同證我們是神的兒女」——那正是收養需要的證人。"],["p","第17節：「和基督同作後嗣」——與親生兒子完全同等。"],["p","第38到39節：「都不能叫我們與神的愛隔絕」——因為那份收養，不可撤銷。"],["h","阿爸"],["p","而第15節裡有一個字，保羅沒有翻譯。"],["p","「阿爸！父！」"],["p","「阿爸」是亞蘭文。保羅刻意保留了原音。"],["p","弟兄姊妹，這個字在整本新約，只出現三次。"],["p","羅馬書8章15節，一次。"],["p","加拉太書4章6節，一次。"],["p","還有一次——"],["p","馬可福音14章36節。"],["p","那是什麼地方？"],["p","客西馬尼。"],["p","那一夜，主耶穌俯伏在地，汗珠如大血點滴在地上。"],["p","祂說："],["q","「阿爸！父啊！在你凡事都能；求你將這杯撤去。然而，不要從我的意思，只要從你的意思。」"],["p","弟兄姊妹，你聽見了嗎？"],["q","主耶穌在祂一生最痛的那一夜，用的那個稱呼——\n\n祂讓我們也可以用。"],["w",3],["p","而「呼叫」這個字，希臘文是 κράζω。"],["p","它不是輕聲細語。它的意思是——大聲喊叫。"],["p","（馬太福音27章50節：「耶穌又大聲喊叫，氣就斷了」——同一個字。）"],["p","所以保羅描寫的不是一個安靜的宗教習慣。"],["p","是一個孩子在需要的時候，衝口而出的那一聲。"],["w",3],["p","弟兄姊妹，我要在這裡問一個問題。"],["p","你禱告的時候，是什麼語氣？"],["p","是這樣嗎——"],["q","「主啊……我這個禮拜做得不太好……我不太敢求祢……」"],["p","如果是，弟兄姊妹，那可能還是奴僕的心。"],["p","因為第15節說得很清楚：「不是奴僕的心，仍舊害怕。」"],["q","如果你順服的動力是害怕，\n\n那你可能還在第六章，還沒有進第八章。"],["w",3],["h","第二大段｜三聲嘆息（8:18–27）"],["h","一個踮起腳的宇宙"],["p","弟兄姊妹，從第18節開始，保羅把鏡頭拉遠了。"],["p","拉到整個宇宙。"],["p","第19節："],["q","「受造之物切望等候神的眾子顯出來。」"],["p","「切望等候」這個字，希臘文很有畫面：ἀποκαραδοκία。"],["p","它是由三個部分組成的：「離開」＋「頭」＋「看」。"],["p","合起來的畫面是："],["q","把頭伸出去，踮起腳，往地平線看。"],["p","弟兄姊妹，保羅說：整個受造界，正踮著腳在等一件事。"],["p","等什麼？"],["q","「等候神的眾子顯出來。」"],["h","三聲嘆息"],["p","然後保羅講了三聲嘆息。"],["p","第一聲，在第22節："],["q","「我們知道一切受造之物一同歎息、勞苦，直到如今。」"],["p","弟兄姊妹，「勞苦」這個字，希臘文是 ὠδίν。"],["p","它的意思很具體——"],["q","生產的陣痛。"],["p","這一點極其重要。"],["q","產痛不是臨終的呻吟。\n\n產痛是生產的呻吟。\n\n它有方向。它有終點。它會生出東西來。"],["w",3],["p","第二聲嘆息，在第23節。而這一節，我覺得是全章最誠實的一節："],["q","「不但如此，就是我們這有聖靈初結果子的，也是自己心裡歎息。」"],["p","弟兄姊妹，你聽見了嗎？"],["p","保羅沒有說：「你有聖靈了，所以你不該有負面情緒。」"],["p","他說：我們這些有聖靈的人——也是在歎息。"],["q","歎息不是不屬靈。\n\n歎息是——還沒到家的證據。"],["w",3],["p","然後是第三聲。第26節。"],["p","而這一聲，是全章最讓我震動的："],["q","「只是聖靈親自用說不出來的歎息替我們禱告。」"],["p","弟兄姊妹——"],["q","受造之物在歎息。\n\n我們在歎息。\n\n而神自己，也在歎息。"],["p","祂沒有站在我們的痛苦外面。"],["p","祂進到那個歎息裡面。"],["h","走到另一端一起抬"],["p","第26節開頭還有一個字，我一定要跟大家分享。"],["q","「我們的軟弱有聖靈幫助。」"],["p","「幫助」這個字，希臘文是 συναντιλαμβάνεται。"],["p","它是三個部分組成的："],["p","σύν——一同。\nἀντί——在對面。\nλαμβάνω——抓住、扛起。"],["p","合起來的畫面是什麼？"],["q","有一個人，扛不動一根很重的木頭。\n\n另一個人走過來——\n\n不是站在旁邊喊「加油」。\n\n是走到那根木頭的另一端，\n\n彎下腰，\n\n跟他一起抬。"],["p","弟兄姊妹，這就是聖靈在你的軟弱中做的事。"],["w",3],["p","而第26節還說了一句話，我覺得對很多人是極大的釋放："],["q","「我們本不曉得當怎樣禱告。」"],["p","弟兄姊妹，我遇過很多人跟我說：「牧師，我不太會禱告。」"],["p","保羅說："],["q","對。你不會。\n\n我也不會。\n\n「我們本不曉得當怎樣禱告。」"],["p","但那不是問題。"],["p","因為有一位在你裡面，用你發不出來的聲音，替你禱告。"],["w",3],["h","第三大段｜一把沒有停下來的刀（8:28–39）"],["h","一節被用錯很多次的經文"],["p","弟兄姊妹，我們現在來到第28節。"],["p","這可能是全本聖經最常被引用、也最常被用錯的一節："],["q","「我們曉得萬事都互相效力，叫愛神的人得益處。」"],["p","我先說它常被怎麼用錯。"],["p","有人剛失去親人，第三天，有人走過來拍拍他的肩膀說："],["q","「別難過，萬事都互相效力嘛。」"],["p","弟兄姊妹，那不是安慰。那是傷害。"],["w",3],["p","我要說三件事。"],["p","第一，保羅沒有說「萬事都是好的」。"],["p","他說「萬事互相效力」。"],["q","那些事本身，可能是壞的、是痛的、是不該發生的。\n\n但神能把它們編織進一個目的裡。"],["p","第二，那個「益處」是什麼？"],["p","保羅在下一節，自己定義了："],["q","第29節：「就預先定下效法他兒子的模樣。」"],["p","弟兄姊妹，神所說的「益處」——"],["q","不是「你的處境會改善」。\n\n是「你會越來越像祂的兒子」。"],["p","第三——這是牧養上的提醒——"],["q","這節經文，是給受苦的人自己，在漫長的日子裡慢慢消化的。\n\n不是給旁觀者，在事發第三天拿來安慰人的。"],["p","弟兄姊妹，你們記得約伯的三個朋友嗎？"],["p","他們前七天，做對了。"],["p","聖經說：「七天七夜坐在地上，一個人也不向他說句話。」"],["p","他們錯在——第八天開口。"],["h","一條每一環都在神手上的鏈子"],["p","接下來第29、30節，被稱為「金鏈」。因為五個環節扣得死死的："],["q","預先知道 → 預先定下 → 召 → 稱義 → 得榮耀"],["p","弟兄姊妹，我要你們注意一件事。"],["p","這五個動詞，主詞全部是神。"],["p","祂預先知道。\n祂預先定下。\n祂召。\n祂稱義。\n祂叫他們得榮耀。"],["q","沒有一環，是「然後你要努力」。\n\n鏈子的兩端都在神手上——而中間，沒有一個環是斷的。"],["w",3],["p","（我要在這裡誠實說一句：關於「預先所知道的」到底是什麼意思，歷代敬虔的信徒有不同的看法。有人認為那是神揀選的愛，有人認為那是神預先看見人的信。但兩邊都同意一件事——這條鏈子的每一環，主詞都是神。）"],["w",3],["p","而最後那個動詞，有一個地方很奇怪。"],["p","「所稱為義的人又叫他們得榮耀」——"],["p","弟兄姊妹，「得榮耀」在原文是過去式。"],["p","可是保羅在第18節才剛說：「將來要顯於我們的榮耀」。"],["p","那件事還沒發生啊。"],["p","為什麼用過去式？"],["q","因為在神那裡——\n\n那件還沒發生的事，已經定案了。\n\n祂用過去式講未來，因為那個未來不可能不發生。"],["h","那把刀"],["p","弟兄姊妹，現在我們來到今天最重要的一節。"],["p","第32節："],["q","「神既不愛惜自己的兒子，為我們眾人捨了，豈不也把萬物和他一同白白地賜給我們嗎？」"],["p","「不愛惜」這個字，希臘文是 οὐκ ἐφείσατο。"],["p","它的意思是：沒有留下不給。"],["w",3],["p","弟兄姊妹，現在我要請大家跟我一起，回到一座山上。"],["p","創世記22章。摩利亞山。"],["p","一個老人，帶著他的獨生子上山。"],["p","柴在兒子背上。"],["p","兒子問了一句話：「請看，火與柴都有了，但燔祭的羊羔在哪裡呢？」"],["p","父親說：「我兒，神必自己預備作燔祭的羊羔。」"],["p","然後——"],["p","他們到了那個地方。築了壇。擺好柴。"],["p","把兒子捆起來，放在柴上。"],["p","那個老人，伸手拿刀。"],["w",3],["p","然後，聖經說，有聲音從天上來："],["q","「亞伯拉罕！亞伯拉罕！……不可在這童子身上下手！」"],["p","弟兄姊妹，那把刀——"],["p","停住了。"],["w",3],["p","而那個聲音接著說了一句話。創世記22章12節，七十士譯本的希臘文是這樣的："],["q","「因為我知道你是敬畏神的了；你沒有將你的兒子，就是你獨生的兒子，留下不給我。」"],["p","「沒有留下不給」——"],["p","弟兄姊妹，那個希臘文的動詞，就是 οὐκ ἐφείσω。"],["p","而羅馬書8章32節說："],["q","「神既不愛惜（οὐκ ἐφείσατο）自己的兒子。」"],["p","同一個動詞。"],["w",3],["p","弟兄姊妹，保羅在做什麼？"],["p","他在把我們帶回那座山。"],["q","在摩利亞山上，神對亞伯拉罕說：\n\n「你沒有留下你的兒子。」\n\n在各各他，保羅對我們說：\n\n「神沒有留下祂自己的兒子。」"],["p","而這兩座山之間，有一個決定性的差別。"],["p","摩利亞山上，刀舉起來了——然後有聲音喊：「不可下手。」"],["p","那把刀，停住了。"],["p","而且有一隻公羊，代替了以撒。"],["w",3],["p","各各他。"],["p","父舉起了刀。"],["p","沒有聲音喊停。"],["p","那把刀——"],["p","沒有停。"],["p","而且弟兄姊妹，那一天，沒有任何東西代替祂。"],["p","因為——"],["p","祂就是那隻羊。"],["h","所以，還有什麼捨不得？"],["p","弟兄姊妹，第32節的後半句，是一個邏輯："],["q","「豈不也把萬物和他一同白白地賜給我們嗎？」"],["p","這就是我們幾個禮拜前看過的那個「何況」。"],["q","祂已經給了最貴的那一樣。\n\n剩下的，還有什麼捨不得？"],["h","一個空著的原告席"],["p","接下來第33、34節，保羅擺出了一個法庭："],["q","「誰能控告神所揀選的人呢？有神稱他們為義了。」\n\n「誰能定他們的罪呢？有基督耶穌已經死了，而且從死裡復活，現今在神的右邊，也替我們祈求。」"],["p","弟兄姊妹，你看看這個法庭："],["p","法官席上坐的是誰？"],["p","神——那位稱我為義的。"],["p","辯護律師是誰？"],["p","基督——祂替我祈求。"],["p","證人是誰？"],["p","第16節說了：聖靈與我們的心同證。"],["p","那——原告席呢？"],["q","空著。"],["h","得勝有餘"],["p","第37節："],["q","「然而，靠著愛我們的主，在這一切的事上已經得勝有餘了。」"],["p","「得勝有餘」，希臘文是 ὑπερνικῶμεν。"],["p","νικάω 是「得勝」。保羅在前面加了 ὑπέρ——「超過」。"],["p","這個字在整本新約，只出現這一次。"],["p","弟兄姊妹，和合本譯「得勝有餘」，譯得非常好。"],["p","但我要請大家注意保羅說的一句話："],["q","「在這一切的事上。」"],["p","不是「脫離了這一切」。"],["p","是——在這一切裡面。"],["q","得勝，不是苦難沒有發生。\n\n得勝是：苦難發生了，而它奪不走那份愛。"],["h","那份清單"],["p","最後，第38、39節。"],["p","保羅列了一份清單："],["q","「無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，是高處的，是低處的，是別的受造之物，都不能叫我們與神的愛隔絕。」"],["p","十樣。"],["p","弟兄姊妹，我第一次認真讀這份清單的時候，心裡有一個問題。"],["p",
