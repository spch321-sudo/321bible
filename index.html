><td>κρίμα</td><td>krima</td><td>G2917</td><td>审判的<b>判决结果</b>（非审判的过程 κρίσις）</td></tr><tr><td>照真理</td><td>κατὰ ἀλήθειαν</td><td>kata alētheian</td><td>G225</td><td>依照事实、依照实情，不受表象影响</td></tr></table>","gram":"<p>- <b>οἴδαμεν</b>：完成式形态、现在式意义，「我们（早就）知道」——保罗默认对方同意这一点，先取得共识，再用这共识反过来对付对方。这是论辩体的典型策略。<br>- <b>κατὰ ἀλήθειαν</b> 置于 ἐστιν 之后、对象之前，<b>强调「照真理」</b>。</p>","exp":"<p>「照真理」是本节的重心。人的审判照表象、照关系、照印象；<b>神的审判照着「实情本身」（reality as it is）。</b></p><p>祂看的不是你在教会怎么坐、怎么祷告、怎么说话，而是<b>事情的真相</b>。这是全章的第一个地基：<b>在神面前，没有形象管理这回事。</b></p>"},{"a":3,"z":3,"star":false,"grk":"<p>λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;</p>","lit":"<p>「人哪，你这论断行这样事的人，自己却做着同样的事——难道你竟这样盘算：『我要逃出神的审判』吗？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>以为</td><td>λογίζῃ</td><td>logizē</td><td>G3049</td><td><b>算帐、记帐、计算</b>——商业用语</td></tr><tr><td>逃脱</td><td>ἐκφεύξῃ</td><td>ekpheuxē</td><td>G1628</td><td>ἐκ（出）+ φεύγω（逃）：从已经合拢的网中逃出去</td></tr></table>","gram":"<p>- <b>λογίζομαι</b> 是罗马书的关键动词（4章出现11次，「算为义」）。<b>保罗在这里先用它的负面用法：人自己在心里「算了一笔帐」，算来算去，觉得自己过得去。</b><br>- <b>σὺ</b> 人称代名词单独出现（动词已含人称），是<b>强调用法</b>：「<b>你？</b> 你要逃脱？」<br>- 疑问句期待的答案是「不可能」。</p>","exp":"<p>保罗点出一个极深的心理：<b>自义的人，心里都在偷偷算一笔帐。</b></p><p>- 「我虽然有这个毛病，可是我比他好多了。」<br>- 「我至少没有做到那个地步。」<br>- 「我还在服事，还在奉献，还在读经。」</p><p>这是一本<b>用别人当基准的帐本</b>。保罗说：那本帐，神不收。</p><p>中文的「以为」偏弱。原文 λογίζῃ 带着算计、精算的意味——保罗指出的不是无心的误会，而是一种刻意的自我说服。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;</p>","lit":"<p>「还是说，你藐视祂那丰富的恩慈、与那容忍、与那长久的忍耐，竟不知道神的恩慈是<b>正在领着你</b>进入悔改？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根／构词</th><th>基本字义</th><th>本节语境</th></tr><tr><td>丰富</td><td>πλοῦτος</td><td>ploutos</td><td>G4149</td><td>—</td><td>财富、丰盛</td><td>神的恩慈不是勉强挤出来的，是<b>满溢的财富</b></td></tr><tr><td>恩慈</td><td>χρηστότης</td><td>chrēstotēs</td><td>G5544</td><td>χρηστός（有用的、良善的）</td><td>使人得益的良善</td><td>保罗爱用字，加5:22圣灵果子之一</td></tr><tr><td>宽容</td><td>ἀνοχή</td><td>anochē</td><td>G463</td><td>ἀνά + ἔχω（持住）</td><td><b>暂时按住不发</b>、休战状态</td><td>3:26同字：神「宽容」先时所犯的罪</td></tr><tr><td>忍耐</td><td>μακροθυμία</td><td>makrothymia</td><td>G3115</td><td>μακρός（长）+ θυμός（怒气）</td><td><b>怒气的引线很长</b></td><td>LXX 用以译出34:6「不轻易发怒」（אֶרֶךְ אַפַּיִם）</td></tr><tr><td>藐视</td><td>καταφρονεῖς</td><td>kataphroneis</td><td>G2706</td><td>κατά（向下）+ φρονέω（思想）</td><td><b>往下看、看不起</b></td><td>现在式：你正持续地看轻它</td></tr><tr><td>不晓得</td><td>ἀγνοῶν</td><td>agnoōn</td><td>G50</td><td>ἀ + γινώσκω</td><td>不知道、视而不见</td><td><b>现在主动分词</b>，表伴随状态</td></tr><tr><td>领</td><td>ἄγει</td><td>agei</td><td>G71</td><td>ἄγω</td><td>带领、牵引</td><td><b>现在式：正在领着、持续在领着</b></td></tr><tr><td>悔改</td><td>μετάνοια</td><td>metanoia</td><td>G3341</td><td>μετά（改变）+ νοῦς（心思）</td><td><b>心思的彻底转向</b></td><td>不只是后悔，是观念与方向的翻转</td></tr></table>","gram":"<p>① μακροθυμία 的旧约根源</p><p>七十士译本用 μακρόθυμος 翻译希伯来文 <b>אֶרֶךְ אַפַּיִם</b>（erek appayim，「长鼻子」＝怒气来得慢）。出34:6神向摩西宣告自己的名：</p><p>「耶和华，耶和华，是有怜悯有恩典的神，<b>不轻易发怒</b>，并有丰盛的慈爱和诚实。」</p><p>保罗在这里，是把出埃及记34章的那位神，放在论断者面前。</p><p>② εἰς μετάνοιάν σε ἄγει 的语序</p><p>原文语序是：「εἰς μετάνοιάν（进入悔改）→ σε（你）→ ἄγει（领）」。<br>「进入悔改」被提到最前面＝强调目的地。<b> 神的恩慈不是漫无目的的纵容，它有一个明确的方向：</b>悔改。</p><p>③ ἄγει 现在式的重量</p><p>不是「曾经领过你」，也不是「将要领你」，而是「<b>此时此刻，正在领着你</b>」。</p><p>这个文法对理解本节有什么影响？<br><b>每一天你还活着、还没被审判、还能呼吸、还能读这段经文——这不是神忘了你，这是神正在牵着你的手，把你往悔改的方向带。</b> 若你把神的忍耐读成神的默许，你就把救生索当成了通行证。</p><p>④ ἀγνοῶν 现在分词</p><p>「不晓得」与「藐视」同时发生。<b>藐视恩典的人，通常不是故意作对，而是误读。</b> 他把神的沉默读成「没事」，把神的忍耐读成「神不介意」。</p>","exp":"<p>这一节是全章的转轴。前三节是起诉，这一节突然转为<b>邀请</b>。</p><p>保罗指出人对神的忍耐有两种读法：</p><p>- <b>误读</b>：「我到现在都没事，可见我没问题。」→ 藐视<br>- <b>正读</b>：「我到现在都没事，是因为神在等我回头。」→ 悔改</p><p><b>「藐视」（καταφρονέω）的字面意思是「往下看」。</b> 何等讽刺：一个站在恩典里的人，竟然低头看不起那托住他的恩典。</p><p>「恩慈是领你悔改」是整本圣经最重要的救恩心理学之一：<br>悔改不是被恐吓出来的，是被恩慈<b>牵</b>出来的。<br>律法能定罪，但律法从来没有能力使人爱神。<br>只有恩慈能。</p><p><b>经文本身明确表达的：</b> 神的恩慈、宽容、忍耐有一个目的——领人悔改；藐视它就是加增自己的罪。<br><b>合理推论的生命应用：</b> 若你今天还没有被神管教、还没有付上代价，这不是通行证，是<b>宽限期</b>。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ.</p>","lit":"<p>「但按着你的刚硬和不悔改的心，你正在为你自己<b>积存</b>忿怒，在忿怒与神公义审判<b>显露</b>的日子。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>刚硬</td><td>σκληρότης</td><td>sklērotēs</td><td>G4643</td><td>硬化、干硬；LXX 同字根描述法老「硬着心」</td></tr><tr><td>不悔改</td><td>ἀμετανόητος</td><td>ametanoētos</td><td>G279</td><td>ἀ + μετανοέω：<b>新约仅此一次出现</b></td></tr><tr><td>积蓄</td><td>θησαυρίζεις</td><td>thēsaurizeis</td><td>G2343</td><td>θησαυρός（宝库）：<b>存进仓库、一点一滴累积</b></td></tr><tr><td>显</td><td>ἀποκάλυψις</td><td>apokalypsis</td><td>G602</td><td>揭开盖子、启示</td></tr><tr><td>公义审判</td><td>δικαιοκρισία</td><td>dikaiokrisia</td><td>G1341</td><td>δίκαιος + κρίσις 复合字，<b>新约仅此一次</b></td></tr></table>","gram":"<p>① θησαυρίζεις 的惊人反讽</p><p>θησαυρίζω 正是主耶稣说「积儹财宝在天上」（太6:20）用的字。</p><p>保罗说：你确实在积宝库，只是你积的不是财宝，是忿怒。<br>而且是 <b>σεαυτῷ</b>（为你自己）——这个间接受格反身代名词是刀锋所在：<b>没有人强迫你，是你自己一天一天存进去的。</b></p><p>② σκληρότης 的旧约回声</p><p>出埃及记法老「硬着心」（LXX σκληρύνω）。<b>保罗暗示：一个宗教人若不悔改，他心的光景与法老一样。</b></p><p>③ 两个 ἀ- 否定前缀的并列</p><p>- 2:1 ἀναπολόγητος（无可辩护）<br>- 2:5 ἀμετανόητος（不悔改）</p><p>无可辩护，是因为不肯悔改。</p>","exp":"<p>第4节与第5节形成全章最强烈的对比：</p><table><tr><th>第4节</th><th>第5节</th></tr><tr><td>神的<b>丰富</b>（πλοῦτος）</td><td>你的<b>积蓄</b>（θησαυρίζεις）</td></tr><tr><td>神的恩慈<b>领你</b>（ἄγει）</td><td>你的心<b>刚硬</b>（σκληρότης）</td></tr><tr><td>目的地：<b>悔改</b></td><td>目的地：<b>忿怒的日子</b></td></tr></table><p>两个帐户，两个方向，每一天都在入帐。<br>神那边，每天存入恩慈；你这边，若不悔改，每天存入忿怒。</p><p>「显」（ἀποκάλυψις）与1:17–18呼应：</p><p>- 1:17 神的义<b>显明</b>出来<br>- 1:18 神的忿怒<b>显明</b>出来<br>- 2:5 神公义审判的<b>显露</b></p><p>福音现在显明神的义；审判之日将显露神公义的判决。<b>你活在这两次「显明」之间，这段时间叫做「恩典的时候」。</b></p><p>【第二段｜2:6–11　神照各人行为审判，不偏待人】</p>"},{"a":6,"z":6,"star":false,"grk":"<p>ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·</p>","lit":"<p>「祂将要偿还给每一个人，按照他的行为。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>报应</td><td>ἀποδώσει</td><td>apodōsei</td><td>G591</td><td>ἀπό + δίδωμι：<b>偿还、付清</b>（商业用语，付工资、还债）</td></tr><tr><td>各人</td><td>ἑκάστῳ</td><td>hekastō</td><td>G1538</td><td>每一个个别的人</td></tr></table>","gram":"<p>这是<b>直接引用旧约</b>：</p><p>- 诗篇62:12（LXX 61:13）「你照着各人所行的报应他」<br>- 箴言24:12「他岂不按各人所行的报应各人吗？」</p><p><b>ἑκάστῳ（每一个人）</b> 是重点：不是「按民族」报应，是<b>按个人</b>。这一击直接打穿「我是亚伯拉罕子孙所以安全」的集体保险概念。</p>","exp":"<p>有人在这里卡住：<b>保罗不是说因信称义吗？怎么又说照行为报应？</b></p><p>要注意保罗在此<b>不是在讲如何得救的方法，而是在讲审判的标准</b>。这个标准对每个人都一样，而正是这个标准，使3:20的结论成立：「凡有血气的，没有一个因行律法能在神面前称义。」</p><p>换句话说：<b>神照行为审判——这正是我们必须因信称义的原因，而不是相反。</b></p><p>（完整讨论见第二十部分「容易误解的经文」）</p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 τοῖς μὲν καθ' ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·<br>8 τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσιν τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ὀργὴ καὶ θυμός.</p>","lit":"<p>「一方面，给那些照着<b>在善工上的坚忍</b>、寻求荣耀、尊贵、与不朽坏的人——永生。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>恒心</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td>ὑπό（在下）+ μένω（存留）：<b>在重压底下站住不跑</b></td></tr><tr><td>结党</td><td>ἐριθεία</td><td>eritheia</td><td>G2052</td><td>原指「受雇做工」→ 为私利拉帮结派、<b>自我寻求</b></td></tr><tr><td>不顺从</td><td>ἀπειθοῦσιν</td><td>apeithousin</td><td>G544</td><td>ἀ + πείθω：<b>拒绝被说服</b>（不是不知道，是不肯）</td></tr><tr><td>不能朽坏</td><td>ἀφθαρσία</td><td>aphtharsia</td><td>G861</td><td>不朽坏（林前15复活身体用同字）</td></tr></table>","gram":"<p><b>① μέν … δέ 的对句</b>（7节 τοῖς μέν／8节 τοῖς δέ）——标准希腊文对比结构。</p><p>② 交叉结构（chiasm）</p><pre>A  v.7   善 → 永生\n  B v.8  恶 → 忿怒恼恨\n  B′v.9  恶 → 患难困苦（犹太人先）\nA′ v.10  善 → 荣耀尊贵平安（犹太人先）</pre><p>保罗刻意让「恶」在中间、「善」在两端，然后在9、10节都加上「先是犹太人，后是希腊人」——这句在9节（审判）出现，就把1:16（拯救）的次序<b>同样</b>应用到审判上。<b>特权越大，责任越大。</b></p><p>③ ἀπειθοῦσιν τῇ ἀληθείᾳ ／ πειθομένοις τῇ ἀδικίᾳ 的双关</p><p>同一个字根 πείθω：</p><p>- <b>不</b>被真理说服<br>- <b>却</b>被不义说服</p><p><b>这不是无知的问题，是「你愿意被谁说服」的问题。</b> 中文译本「不顺从真理，反顺从不义」已译得不错，但看不出这是同一个字的正反用法。</p>","exp":"<p>「恒心行善」的原文重点在 <b>ὑπομονή</b>——不是「做了很多好事」，而是「<b>在压力下持续不放弃</b>」。这与8节的 ἐριθεία（结党自私）正好相反：一个是持续寻求神的荣耀，一个是持续寻求自己的利益。</p><p><b>注意7节说这些人「寻求（ζητοῦσιν）荣耀、尊贵、不能朽坏」。</b> 他们不是寻求道德分数，是<b>寻求神自己所赐的荣耀</b>。这正是1:21–23的反面：那里的人「不当作神荣耀祂」，这里的人「寻求荣耀」。</p><p><b>经文本身明确表达的：</b> 神的审判照个人的行为，一视同仁；受托越多的人被审得越严。<br><b>合理推论的生命应用：</b> 「恒心」提醒我们，属灵生命的真实性不在起跑的热情，而在压力下的坚持。</p>"},{"a":11,"z":11,"star":true,"grk":"<p>οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.</p>","lit":"<p>「因为在神那里，没有『接受面孔』这回事。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>偏待人</td><td>προσωπολημψία</td><td>prosōpolēmpsia</td><td>G4382</td><td>πρόσωπον（脸）+ λαμβάνω（接受、拿起）</td></tr></table><p><b>这是一个「希伯来式希腊文」复合字</b>，直接从希伯来成语 <b>נָשָׂא פָנִים</b>（nasa panim，「举起脸／看脸」）造出来。</p><p>旧约背景：</p><p>- 申命记10:17「他不以貌取人，也不受贿赂」<br>- 利未记19:15「不可偏护穷人，也不可重看有势力的人」<br>- 历代志下19:7「在耶和华我们神那里，没有不义，不偏待人」</p><p>古代法庭上，权贵进来，法官会「擡起他的脸」（接见、给面子）。<b>神的法庭里没有这回事。</b></p>","gram":"<p>- 名词置于句中重心位置，前加否定 οὐ——<b>断然否定</b>。<br>- <b>παρὰ τῷ θεῷ</b>（在神那里）——与格，指<b>在神的审判席前</b>。</p>","exp":"<p>这一节是2:1–10的总结，也是全章的枢纽。</p><p>神的「不偏待人」有两面刀锋：</p><p>1. <b>对犹太人</b>：你的身分不能给你豁免权<br>2. <b>对外邦人</b>：你的出身不能剥夺你的机会</p><p>这一节同时审判了骄傲，也开启了福音的门。</p><p>- 若神偏待人，就没有外邦人的福音；<br>- 若神偏待人，恩典就成了特权。</p><p>正因为神不偏待人，恩典才能给所有人。</p><p>【第三段｜2:12–16　律法、良心与隐秘事的审判】</p>"},{"a":12,"z":12,"star":false,"grk":"<p>ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται.</p>","lit":"<p>「因为凡在律法之外犯了罪的，也将在律法之外灭亡；凡在律法之内犯了罪的，将借着律法受审判。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>没有律法</td><td>ἀνόμως</td><td>anomōs</td><td>G460</td><td>副词：<b>在律法之外地</b>（不是「无法无天」）</td></tr><tr><td>犯了罪</td><td>ἥμαρτον</td><td>hēmarton</td><td>G264</td><td>ἁμαρτάνω，<b>不定过去式</b>：射不中靶</td></tr><tr><td>灭亡</td><td>ἀπολοῦνται</td><td>apolountai</td><td>G622</td><td>中间语态未来式：灭亡、失丧</td></tr></table>","gram":"<p>① ἥμαρτον 两次都是不定过去式（aorist）<br>不定过去式在此表<b>总括性的观点</b>——把一生的罪当成一个整体来看。</p><p>② ἀνόμως 出现两次，是重点<br>「<b>在律法之外</b>犯罪的，也<b>在律法之外</b>灭亡」——外邦人不会因为没有摩西律法而被摩西律法审判，但这不表示他们没事；<b>他们照他们所有的光受审判。</b></p><p>③ 修辞的平衡（parallelism）</p><pre>ἀνόμως  ἥμαρτον  →  ἀνόμως  ἀπολοῦνται\nἐν νόμῳ ἥμαρτον  →  διὰ νόμου κριθήσονται</pre><p>完美对称：审判的方式，与所领受的启示相称。</p>","exp":"<p>这是神公义最深的一面：<b>神照着各人所领受的光审判各人。</b></p><p>没有人会因为「我没听过」而被冤枉，也没有人会因为「我没听过」而自动得救——因为<b>没有一个人是完全没有光的</b>（1:19–20；2:14–15）。</p>"},{"a":13,"z":13,"star":false,"grk":"<p>οὐ γὰρ οἱ ἀκροαταὶ νόμου δίκαιοι παρὰ [τῷ] θεῷ, ἀλλ' οἱ ποιηταὶ νόμου δικαιωθήσονται.</p>","lit":"<p>「因为律法的<b>听众</b>在神面前不是义的，乃是律法的<b>实行者</b>将被称义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>听的人</td><td>ἀκροαταί</td><td>akroatai</td><td>G202</td><td>ἀκροάομαι（听）：<b>剧场里的听众、观众</b></td></tr><tr><td>行的人</td><td>ποιηταί</td><td>poiētai</td><td>G4163</td><td>ποιέω：<b>制作者、实行者</b>（英文 poet 源出此字）</td></tr><tr><td>称义</td><td>δικαιωθήσονται</td><td>dikaiōthēsontai</td><td>G1344</td><td><b>未来被动式</b>：将被宣告为义</td></tr></table>","gram":"<p>① ἀκροατής 的画面感<br>这个字在希腊世界指<b>在讲堂或剧场里听演讲的人</b>——坐着、欣赏、鼓掌、离开。<br>保罗说：你若只是神话语的「观众」，你就不是义人。<br>（雅1:22–25用同一组字：「只是听道 ἀκροατής，不是行道 ποιητής，就是自己欺哄自己。」）</p><p>② δικαιωθήσονται 未来被动式</p><p>- <b>未来式</b>：指向末日的宣判<br>- <b>被动式（神圣被动）</b>：<b>是神来称义，不是人称自己为义</b></p>","exp":"<p>保罗在这里把犹太人最引以为傲的事（每安息日在会堂听律法）打回原形。</p><p>「听」在犹太传统里是至高的灵性活动<b>——「以色列啊，你要</b>听<b>！」（שְׁמַע，Shema，申6:4）。但希伯来文的「שָׁמַע 听」本身就包含「顺从」。</b>犹太人把「听」希腊化成了「知道」，保罗把它拉回希伯来的原意：听，就是行。</p>"},{"a":14,"z":15,"star":false,"grk":"<p>14 ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·<br>15 οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων</p>","lit":"<p>14「因为每当外邦人——那些没有律法的——本性上实行律法的事，这些人虽然没有律法，对他们自己就是律法。」<br>15「他们显出律法的工作是被写在他们心里的，他们的良心一同作见证，并且他们的思念在彼此之间互相控告，或者也互相辩护。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>本性</td><td>φύσει</td><td>physei</td><td>G5449</td><td>与格：<b>照本性地、天生地</b></td></tr><tr><td>是非之心</td><td>συνείδησις</td><td>syneidēsis</td><td>G4893</td><td>σύν（一同）+ οἶδα（知道）：<b>与自己一同知道</b></td></tr><tr><td>同作见证</td><td>συμμαρτυρούσης</td><td>symmartyrousēs</td><td>G4828</td><td>σύν + μαρτυρέω：<b>一起作证</b></td></tr><tr><td>思念</td><td>λογισμῶν</td><td>logismōn</td><td>G3053</td><td>推理、盘算（与2:3 λογίζῃ 同字根）</td></tr><tr><td>控告</td><td>κατηγορούντων</td><td>katēgorountōn</td><td>G2723</td><td>法庭用语：<b>检察官起诉</b></td></tr><tr><td>辩护</td><td>ἀπολογουμένων</td><td>apologoumenōn</td><td>G626</td><td>法庭用语：<b>辩护律师答辩</b>（与2:1「无可推诿」同字根）</td></tr></table>","gram":"<p>① 独立所有格（genitive absolute）构成完整的法庭场景</p><p>三个所有格分词：</p><p>- <b>证人</b>：良心（συνείδησις）<br>- <b>检察官</b>：思念（κατηγορέω）<br>- <b>辩护律师</b>：思念（ἀπολογέομαι）</p><p>保罗画的图是：每一个人的心里都有一个小法庭，日夜开庭。</p><p>② φύσει 的位置<br>希腊文 φύσει 可修饰前面（「本性上没有律法的外邦人」）或后面（「本性上行律法的事」）。多数译本与注释取后者，和合本亦然。</p><p>③ τὸ ἔργον τοῦ νόμου（律法的工作）是单数<br>不是「律法的众条例」（复数 ἔργα），而是「律法的功能／效果」——即律法所要达成的道德要求的作用。</p><p>④ γραπτὸν ἐν ταῖς καρδίαις（写在心里）与耶31:33的关系</p><p>耶31:33新约应许：「我要将我的律法放在他们里面，写在他们心上。」</p><p><b>但注意用字差异：</b> 保罗在2:15说的是「律法的<b>工作</b>（ἔργον）写在心里」，而非耶31:33「律法本身写在心里」。这个细微差别很重要——<b>2:15讲的是普遍的良心，不是新约的重生。</b>（到2:29保罗才转到圣灵的工作。）</p>","exp":"<p>保罗在此建立一个重要真理：<b>神从未把任何人放在完全的黑暗里。</b></p><p>外邦人没有西奈山的石版，却有心版上的一份摹本——<b>良心</b>。良心不是完美的（可以被烧红、可以被扭曲，提前4:2），但它足以证明两件事：</p><p>1. 人知道有是非<br>2. 人知道自己达不到</p><p>这就是为什么没有人能说「我不知道」。</p><p>关于2:14–16这些外邦人是谁，敬虔学者间有合理的不同解释，见第二十部分。</p>"},{"a":16,"z":16,"star":false,"grk":"<p>ἐν ἡμέρᾳ ὅτε κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ Χριστοῦ Ἰησοῦ.</p>","lit":"<p>「在那日，当神照着我的福音，借着基督耶稣审判人的<b>隐秘事</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>隐秘事</td><td>τὰ κρυπτά</td><td>ta krypta</td><td>G2927</td><td>κρύπτω（隐藏）：<b>被藏起来的东西</b>（英文 crypt, cryptic）</td></tr><tr><td>借着</td><td>διά + 所有格</td><td>dia</td><td>G1223</td><td>借由…作为中保／执行者</td></tr></table>","gram":"<p>- <b>κρίνει</b>：形式上可读为现在式或未来式；上下文指向<b>末日</b>。<br>- <b>διὰ Χριστοῦ Ἰησοῦ</b> 置于句末＝<b>强调位置</b>。全章的审判论证，落在<b>耶稣基督</b>身上。</p>","exp":"<p>保罗在这里放了三颗重磅：</p><p>① 审判的对象是「隐秘事」（τὰ κρυπτά）<br>不是你的公开纪录，是你的<b>秘密文件</b>。与2:28–29「里面／隐藏的（ἐν τῷ κρυπτῷ）」用同一个字——<b>神所审判的隐秘，与神所看重的隐秘，是同一个地方：心。</b></p><p>② 审判者是耶稣基督<br>约5:22「父不审判什么人，乃将审判的事全交与子。」<br>那位为罪人死的，就是那位要审判罪人的。这是最大的恩典，也是最大的严肃。</p><p>③「照着我的福音」<br>保罗说：审判是<b>福音的一部分</b>。<br>福音不只是「神爱你」，福音是：「有一日基督要审判一切隐秘事——而祂已经在十字架上，为一切投靠祂的人，把那审判担当了。」</p><p>没有审判的福音，是廉价的安慰；没有恩典的审判，是绝望的宣告。保罗两样都要。</p><p>【第四段｜2:17–24　以律法夸口的人玷污神的名】</p>"},{"a":17,"z":20,"star":false,"grk":"<p>17 Εἰ δὲ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ νόμῳ καὶ καυχᾶσαι ἐν θεῷ</p>","lit":"<p>「但你若被冠上『犹太人』之名，又<b>枕靠</b>在律法上，又在神里面夸口……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>称为</td><td>ἐπονομάζῃ</td><td>eponomazē</td><td>G2028</td><td>被动：<b>被加上名号</b>（不是自己活出来的，是被贴上的）</td></tr><tr><td>倚靠</td><td>ἐπαναπαύῃ</td><td>epanapauē</td><td>G1879</td><td>ἐπί + ἀνά + παύω：<b>靠上去休息、枕着睡觉</b></td></tr><tr><td>夸口</td><td>καυχᾶσαι</td><td>kauchasai</td><td>G2744</td><td>夸耀（罗马书关键字：3:27、5:2–3、15:17）</td></tr><tr><td>模范</td><td>μόρφωσις</td><td>morphōsis</td><td>G3446</td><td><b>外形、轮廓</b>（提后3:5「有敬虔的外貌」同字）</td></tr></table>","gram":"<p>① 这是一个未完成的条件句（anacoluthon）</p><p>第17节开始「Εἰ δὲ σύ…（你若……）」，但这个「若」的<b>主句一直到第21节才出现</b>：「你既是教导别人，还不教导自己吗？」</p><p>中间17–20节堆叠了<b>九个夸耀项目</b>：</p><pre>1 称为犹太人      2 倚靠律法      3 指着神夸口\n4 受了教训        5 晓得神旨意    6 能分别是非\n7 给瞎子领路      8 黑暗中人的光\n9 蠢笨人的师傅、小孩子的先生</pre><p>保罗刻意让这个名单越堆越高、越堆越辉煌——然后在第21节一刀劈下。<br>这是讲道学上极高明的修辞：<b>先让对方站上高台，再抽走梯子。</b></p><p>② ἐπαναπαύῃ（枕靠）的画面</p><p>LXX 用此字描述以利沙的灵「住在」以利亚身上（王下2:15），也用于安息。<br><b>「枕靠在律法上」——律法本是要人行的，他却拿来当枕头睡觉。</b> 这是何等精准又何等讽刺的动词。</p><p>③ μόρφωσις 的伏笔</p><p>「模范」本身在此是中性甚至正面的，但保罗选用 μόρφωσις（外形）而非 μορφή（本质形态），已埋下伏笔：<b>你所拥有的，可能只是轮廓，不是实质。</b></p>","exp":"<p>保罗列出的九项，<b>每一项都是真的</b>。犹太人确实有律法，确实蒙神拣选，确实得了神的圣言（3:2）。</p><p>问题不在他们拥有的，而在他们如何拥有。</p><p>- 律法本是要走的路，他们拿来当<b>枕头</b>（ἐπαναπαύῃ）<br>- 律法本是照亮自己的光，他们拿来<b>照别人</b>（给瞎子领路）<br>- 神的恩典本该叫人感恩，他们拿来<b>夸口</b>（καυχᾶσαι）</p><p>这是宗教人最典型的堕落方式：把神给的礼物，变成自己的资本。</p>"},{"a":21,"z":23,"star":false,"grk":"<p>21 ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;<br>22 ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;<br>23 ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις</p>","lit":"<p>21「那么，你这<b>教导别人的</b>，不教导自己吗？你这<b>宣讲不可偷窃的</b>，自己偷窃吗？」<br>22「你这说不可奸淫的，自己奸淫吗？你这<b>厌恶偶像的</b>，自己<b>盗取庙中之物</b>吗？」<br>23「你这<b>在律法上夸口的</b>，却<b>借着违犯律法，羞辱了神</b>。」;</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>讲说</td><td>κηρύσσων</td><td>kēryssōn</td><td>G2784</td><td><b>传讲、宣告</b>（传道人用字）</td></tr><tr><td>厌恶</td><td>βδελυσσόμενος</td><td>bdelyssomenos</td><td>G948</td><td>极度憎恶、作呕（LXX用于偶像「可憎之物」）</td></tr><tr><td>偷窃庙中之物</td><td>ἱεροσυλεῖς</td><td>hierosyleis</td><td>G2416</td><td>ἱερός（圣）+ συλάω（劫掠）：<b>盗取庙宇财物</b></td></tr><tr><td>犯</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω：<b>跨越界线</b>（明知有线而踏过去）</td></tr><tr><td>玷辱</td><td>ἀτιμάζεις</td><td>atimazeis</td><td>G818</td><td>ἀ + τιμή（尊贵）：<b>使…失去尊荣</b></td></tr></table>","gram":"<p>① 四个分词 ＋ 四个直说语气动词的对打</p><pre>ὁ διδάσκων（那教导的）      →  οὐ διδάσκεις;（你不教自己吗）\nὁ κηρύσσων（那传讲的）      →  κλέπτεις;（你偷窃吗）\nὁ λέγων（那说的）           →  μοιχεύεις;（你奸淫吗）\nὁ βδελυσσόμενος（那厌恶的） →  ἱεροσυλεῖς;（你劫庙吗）</pre><p>每一句都是：你说的 vs 你做的。四记重拳，节奏一致，越打越快。</p><p>② ἱεροσυλεῖς 的历史背景</p><p>申7:25禁止犹太人取用偶像上的金银。徒19:37特别提到保罗的同工「并没有偷窃庙中之物（ἱεροσύλους）」——显示这是当时罗马世界对犹太人的常见指控。</p><p>保罗的讽刺极深：<b> 你在口头上作呕地憎恶偶像，却在偶像庙里拿好处。</b>你恨的是偶像，还是恨自己拿不到那些好处？</p>","exp":"<p>注意保罗特别点名「教导别人的人」（διδάσκων）与「传讲的人」（κηρύσσων）。</p><p>这一段最刺人的地方在于：<b>它不是给一般会众的，是给传道人、教师、属灵领袖的。</b></p><p>- 你讲「不可偷窃」——你有没有偷神的时间、偷别人的功劳、偷本该归给神的荣耀？<br>- 你讲「不可奸淫」——你的眼目、你的手机、你独处的时候呢？<br>- 你「厌恶偶像」——你的偶像是不是叫做「事工成果」「别人的称赞」「我的影响力」？</p><p><b>「玷辱神」（ἀτιμάζεις）与2:7、2:10 的「尊贵」（τιμή）是同一字根。</b> 神要赐下<b>尊贵</b>，人却<b>使神失去尊贵</b>。这就是罪最核心的定义。</p>"},{"a":24,"z":24,"star":false,"grk":"<p>τὸ γὰρ ὄνομα τοῦ θεοῦ δι' ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.</p>","lit":"<p>「因为神的名，<b>因着你们的缘故</b>，正在外邦人中被亵渎——正如经上所记的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>亵渎</td><td>βλασφημεῖται</td><td>blasphēmeitai</td><td>G987</td><td><b>现在被动式</b>：正在被亵渎（持续进行）</td></tr><tr><td>因你们</td><td>δι' ὑμᾶς</td><td>di' hymas</td><td>G1223</td><td>διά + 直接受格：<b>因为你们的缘故</b></td></tr></table>","gram":"","exp":"<p>主耶稣教我们祷告的第一句是：</p><p><b>「愿人都尊你的名为圣。」</b>（太6:9）</p><p>罗马书2:24是这句祷告的完全相反：</p><p>「神的名……因你们受了亵渎。」</p><p>一个宗教人可以：</p><p>- 每天祷告「愿人都尊你的名为圣」<br>- 同时用他的生命，让神的名被亵渎</p><p>这就是为什么「建立属神的体系」不能只靠正确的道理与正确的礼仪。</p><p>以西结书36章极其重要：神说祂的名被亵渎之后，祂的解决方案是什么？</p><p>「我也要赐给你们一个新心，将新灵放在你们里面……<b>我必将我的灵放在你们里面</b>，使你们顺从我的律例。」（结36:26–27）</p><p>保罗在第24节丢出问题，在第29节给出以西结书的答案：灵，不是仪文。</p><p>【第五段｜2:25–29　真割礼是心里的】</p>"},{"a":25,"z":27,"star":false,"grk":"<p>26 ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;</p>","lit":"<p>25「割礼固然有益——<b>只要你行律法</b>；但你若是违犯律法的，<b>你的割礼就已经变成未受割礼了</b>。」<br>26「所以，那未受割礼的若<b>谨守律法的义</b>，他的未受割礼<b>岂不要被算为割礼吗</b>？」<br>27「而那生来未受割礼、却<b>成全了律法</b>的人，岂不要<b>审判你</b>这有仪文和割礼、却违犯律法的人吗？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>割礼</td><td>περιτομή</td><td>peritomē</td><td>G4061</td><td>περί（周围）+ τέμνω（切）：切割一圈</td></tr><tr><td>未受割礼</td><td>ἀκροβυστία</td><td>akrobystia</td><td>G203</td><td>包皮；转指<b>外邦人身分</b></td></tr><tr><td>条例</td><td>δικαιώματα</td><td>dikaiōmata</td><td>G1345</td><td>δίκαιος：<b>义的要求／判决</b>（8:4同字）</td></tr><tr><td>算是</td><td>λογισθήσεται</td><td>logisthēsetai</td><td>G3049</td><td><b>未来被动式：将被算为</b>（4章的关键字）</td></tr><tr><td>仪文</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>字母、文书、<b>成文条例</b></td></tr></table>","gram":"<p>① λογισθήσεται（将被算为）——第4章的预备</p><p>这是罗马书4章「亚伯拉罕信神，这就<b>算为</b>他的义」（λογίζομαι）的同一个字。</p><p>保罗在2:26已经悄悄埋下伏笔：神有一种「算」的方式，不是照外表算的。</p><p>注意这个字在本章的三次旅程：</p><p>- 2:3 人自己「算」（λογίζῃ）——算错了<br>- 2:15 人的「思念」（λογισμοί）互相控告<br>- 2:26 神「算」（λογισθήσεται）——这才是真正算数的那一本帐</p><p>② δικαιώματα τοῦ νόμου（律法的义的要求）</p><p>这个词组在罗马书只出现两次：</p><p>- <b>2:26</b>「若遵守律法的条例」<br>- <b>8:4</b>「使律法的义（τὸ δικαίωμα τοῦ νόμου）成就在我们这不随从肉体、只随从圣灵的人身上」</p><p>这是强力证据：保罗在2:26所想的，最终要在8:4得到答案——靠圣灵。</p><p>③ 27节 διὰ γράμματος καὶ περιτομῆς</p><p>διά + 所有格在此可译「尽管有／借着」。和合本「有仪文和割礼竟犯律法」的译法抓住了语气：<b>你拥有一切外在配备，却正是犯律法的那一个。</b></p>","exp":"<p>保罗在做一件当时犹太人听起来近乎亵渎的事：他把割礼相对化了。</p><p>- 犹太人的逻辑：割礼 → 立约子民 → 得救<br>- 保罗的逻辑：割礼 → 是立约的<b>记号</b> → 记号没有所指的实体，就是<b>空的</b></p><p>这就像：</p><p>- 一张没有存款的提款卡<br>- 一枚戴在从未爱过对方的人手上的婚戒<br>- 一本签了名却从未读过的圣经</p><p>记号本身是神设立的、是好的（「割礼固然于你有益」）——但记号永远不能取代它所指向的实体。</p>"},{"a":28,"z":29,"star":true,"grk":"<p>28 οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή,<br>29 ἀλλ' ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ' ἐκ τοῦ θεοῦ.</p>","lit":"<p>28「因为那在<b>显明处</b>的，不是犹太人；那在显明处、在肉身的，也不是割礼。」<br>29「乃是那在<b>隐藏处</b>的，才是犹太人；割礼乃是心的割礼，<b>在灵里，不在仪文里</b>；这人的<b>称赞</b>，不是从人来，乃是从神来。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>外面</td><td>ἐν τῷ φανερῷ</td><td>en tō phanerō</td><td>G5318</td><td>φαίνω（照亮、显现）</td><td><b>在可见之处</b></td><td>人看得见的层面</td></tr><tr><td>里面</td><td>ἐν τῷ κρυπτῷ</td><td>en tō kryptō</td><td>G2927</td><td>κρύπτω（隐藏）</td><td><b>在隐藏处</b></td><td>与2:16「隐秘事」同字</td></tr><tr><td>心</td><td>καρδία</td><td>kardia</td><td>G2588</td><td>—</td><td>心（意志、思想、生命中枢）</td><td>生命真正的所在</td></tr><tr><td>灵</td><td>πνεῦμα</td><td>pneuma</td><td>G4151</td><td>πνέω（吹）</td><td>灵／圣灵</td><td><b>本节最重要的解释争议点</b></td></tr><tr><td>仪文</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>γράφω（写）</td><td>成文的字句</td><td>外在成文条例的体系</td></tr><tr><td>称赞</td><td>ἔπαινος</td><td>epainos</td><td>G1868</td><td>ἐπί + αἶνος（赞美）</td><td>赞美、表扬</td><td><b>与「犹大」名字的双关</b></td></tr></table>","gram":"<p>★ 亮光一：「犹太人」与「称赞」的字义双关</p><p>Ἰουδαῖος（犹太人）<b> ← </b>Ἰούδας（犹大）<b> ← 希伯来文 </b>יְהוּדָה（Yehudah）<b> ← 字根 </b>יָדָה（yadah, H3034）＝赞美、称谢</p><p>创29:35：</p><p>「她又怀孕生子，说：『这回我要<b>赞美</b>耶和华』，因此给他起名叫<b>犹大</b>。」</p><p>创49:8（雅各的祝福）：</p><p>「犹大啊，你弟兄们必<b>赞美</b>你。」</p><p>而保罗在2:29说：「这人的称赞（ἔπαινος）不是从人来的，乃是从神来的。」</p><p>这是一个横跨希伯来文与希腊文的绝妙文字游戏：<br>「犹大」的意思就是「称赞」。<br>真正的犹太人（称赞人），是那个所得的称赞来自神、不来自人的人。</p><p>中文译本完全看不出这一层。这是本章最美的原文亮光。</p><p>★ 亮光二：φανερός ／ κρυπτός 的贯穿</p><pre>2:16  神审判人的隐秘事（τὰ κρυπτά）\n2:29  真犹太人是在隐藏处（ἐν τῷ κρυπτῷ）的</pre><p>神审判的地方，和神称赞的地方，是同一个地方——你的心。</p><p>主耶稣在马太福音6章讲施舍、祷告、禁食，三次说：</p><p>「你父在<b>暗中</b>（ἐν τῷ κρυπτῷ）察看，必然报答你。」</p><p>保罗与主耶稣用的是同一组字、同一个神学。</p><p>★ 亮光三：ἐν πνεύματι οὐ γράμματι 的解释</p><p>「灵」在此是指<b>人的灵</b>还是<b>圣灵</b>？</p><p>两种主要看法：</p><p>1. <b>人的灵／内在层面</b>（对比外在的肉身）——文法上可行<br>2. <b>圣灵</b>——多数现代注释（Cranfield、Moo、Schreiner、Dunn）采此说</p><p>支持「圣灵」的理由（我认为具决定性）：</p><p>- <b>林后3:6</b> 用完全相同的对比：「字句（γράμμα）叫人死，精意（πνεῦμα）叫人活」——那里的 πνεῦμα 明确是圣灵（林后3:17「主就是那灵」）<br>- <b>罗7:6</b> 同样对比：「按着心灵（πνεύματος）的新样，不按着仪文（γράμματος）的旧样」<br>- <b>结36:26–27</b> 的背景：「我必将我的灵放在你们里面」——这正是2:24引结36的必然延伸<br>- <b>申30:6</b>：「耶和华你神必将你心里……的污秽除掉（מָל，行割礼）」——<b>注意：是神为你行割礼，不是你为自己行</b></p><p>「心的割礼」的旧约根源：</p><table><tr><th>经文</th><th>主词</th><th>内容</th></tr><tr><td>申10:16</td><td><b>人</b></td><td>「你们要将心里的污秽除掉」（人的责任）</td></tr><tr><td>耶4:4</td><td><b>人</b></td><td>「你们当自行割礼」（呼召）</td></tr><tr><td><b>申30:6</b></td><td><b>神</b></td><td>「耶和华你神必将你心里……除掉」（神的作为）</td></tr><tr><td><b>结36:26–27</b></td><td><b>神</b></td><td>「我要赐给你们一个新心……我必将我的灵放在你们里面」</td></tr></table><p>旧约的张力——人当自行割礼，却做不到——在新约由圣灵解决。<br>这就是为什么保罗把「心的割礼」与「灵」绑在一起。</p>","exp":"<p>保罗在此完成了一场神学上的哥白尼革命：</p><p>他把「神的子民」的定义，从族谱移到了心；从肉身移到了灵；从人的认证移到了神的称赞。</p><p>这不是保罗的发明——<b>这正是旧约先知早就说过的</b>（申30:6；耶4:4;9:25–26；结36:26–27）。<b>保罗只是宣告：先知所应许的日子，在基督里到了。</b></p><p>经文本身明确表达的：<br>真正属神的人不由外在记号界定，而由圣灵在心中所行的内在割礼界定；他的称赞出于神，不出于人。</p><p>合理推论的生命应用：<br>我们今天虽不谈割礼，却有一堆「新的割礼」——受洗多久、服事几年、属于哪个教会、读过哪些书、认识哪些牧者。<b>保罗的问题会一样尖锐地问我们：这些记号背后，有没有一颗被圣灵动过刀的心？</b></p>"}],"3":[{"a":1,"z":2,"star":false,"grk":"<p>1 Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;<br>2 πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν [γὰρ] ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.</p>","lit":"<p>1「那么，犹太人的<b>多出来的部分</b>是什么？或者割礼的<b>益处</b>是什么？」<br>2「照各方面来说都很多。首先，是因为神的<b>圣言</b>被<b>托付</b>给他们。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>长处</td><td>περισσόν</td><td>perisson</td><td>G4053</td><td>περί（超过）</td><td><b>多出来的、超额的</b></td><td>犹太人比别人「多」的那一份</td></tr><tr><td>益处</td><td>ὠφέλεια</td><td>ōpheleia</td><td>G5622</td><td>ὠφελέω（有益）</td><td>实际的利益、好处</td><td>商业与实用语汇</td></tr><tr><td>圣言</td><td>λόγια</td><td>logia</td><td>G3051</td><td>λόγος 的指小形</td><td><b>神谕、神所说的话</b></td><td>LXX 用于神的话（民24:4、诗119）</td></tr><tr><td>交托</td><td>ἐπιστεύθησαν</td><td>episteuthēsan</td><td>G4100</td><td>πιστεύω（信）</td><td><b>被信任、被托付</b></td><td>被动式，且与「信」同字根</td></tr></table>","gram":"<p>① ἐπιστεύθησαν 的双关</p><p>这个字是 <b>πιστεύω（相信）</b> 的<b>不定过去被动式</b>。</p><p>- 主动用法：<b>相信</b><br>- 被动用法：<b>被信任、被托付</b></p><p>保罗用了一个绝妙的字：犹太人「被神信任」（ἐπιστεύθησαν），保管神的话语。</p><p>而下一节（3:3）马上接着说：「即便有不信的（ἠπίστησαν）……」——<b>同一个字根。</b></p><pre>3:2  ἐπιστεύθησαν  被托付（被信任）\n3:3  ἠπίστησαν     不信\n3:3  ἀπιστία       不信\n3:3  πίστιν τοῦ θεοῦ  神的信实</pre><p>四次同一个字根，中文完全看不出来。</p><p>保罗在说：神信任你们，你们却不信祂——但你们的不信，废不掉祂的信实。</p><p>② πρῶτον μέν 没有接 δεύτερον（第二）</p><p>保罗说「第一」，却没有说第二。（他要到9:4–5才把完整清单列出来：「儿子的名分、荣耀、诸约、律法、礼仪、应许、列祖、基督」。）</p><p>这是保罗思路被反驳打断的痕迹——这一段是真实的辩论，不是排练好的讲稿。</p>","exp":"<p>保罗的回答值得注意：他没有为了强调「大家都一样有罪」而否认犹太人的特权。</p><p>「凡事大有好处！」</p><p>这是牧养上极重要的榜样：拆毁人错误的倚靠，不需要否定神真实的恩典。</p><p>犹太人最大的长处是什么？<b>不是他们比较好，是他们手上有神的话。</b></p><p>但这正是第二章的问题：手上有神的话，跟心里有神的话，是两回事。</p><p><b>经文本身明确表达的：</b> 犹太人确有真实的特权，首先是神的话语被托付给他们。<br><b>合理推论的生命应用：</b> 我们今天手上有整本圣经、有无数的讲道资源——这是何等大的托付。但<b>被托付</b>不等于<b>被改变</b>。</p>"},{"a":3,"z":4,"star":false,"grk":"<p>3 τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;<br>4 μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης…</p>","lit":"<p>3「那又怎样呢？若有些人不信，难道他们的不信会使神的<b>信实</b>失效吗？」<br>4「绝不可能！<b>倒要让神成为真实的，而每一个人都是说谎的</b>……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>不信</td><td>ἠπίστησαν</td><td>ēpistēsan</td><td>G569</td><td><b>不信实、不忠心</b>（不只是理性的不相信）</td></tr><tr><td>神的信</td><td>πίστις τοῦ θεοῦ</td><td>pistis theou</td><td>G4102</td><td><b>神的信实／忠信</b>（不是「神的信心」）</td></tr><tr><td>废掉</td><td>καταργήσει</td><td>katargēsei</td><td>G2673</td><td>κατά + ἀργός（无效）：<b>使之失效、作废</b></td></tr><tr><td>断乎不能</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td>愿它绝不发生！<b>希腊文最强的否定</b></td></tr></table>","gram":"<p>① πίστις τοῦ θεοῦ 的译法</p><p>和合本译「神的信」，非常准确。这是<b>主词所有格</b>：<b>神所具有的信实</b>（faithfulness），不是「对神的信心」。</p><p>这一节是全章、甚至全卷书的地基：如果神会因为人的失败而毁约，那福音就一文不值。</p><p>② καταργέω 是罗马书的关键字</p><p>- 3:3　人的不信能<b>废掉</b>神的信实吗？→ 不能<br>- 3:31　我们因信<b>废了</b>律法吗？→ 没有<br>- 6:6　使罪身<b>灭绝</b><br>- 7:2、7:6　脱离律法</p><p>③ γινέσθω 命令语气的力量</p><p>「不如说」原文是 <b>γινέσθω</b>——第三人称命令语气：「<b>让它成为如此！</b>」</p><p>这不是一个中性的陈述，是一个宣告、一个表态：「就算全世界都是说谎的，也要让神被证明是真实的！」</p><p>④ 引文出处：诗篇51:4（LXX 50:6）</p><p>「我向你犯罪，惟独得罪了你，在你眼前行了这恶，以致你责备我的时候显为公义；判断我的时候显为清正。」</p><p>保罗引的是大卫犯奸淫后的认罪诗。</p><p>这个引文选得极深：连以色列最伟大的王，都只能说「神啊，祢是对的，我是错的」。</p>","exp":"<p>这一段回答了一个致命的问题：如果神的子民失败了，是不是证明神失败了？</p><p>保罗的答案：不。人的不忠心不能证明神不忠心，只能证明人不忠心。</p><p>这对今天的教会极其重要：</p><p>- 当你看见教会里的丑闻<br>- 当你看见那位你敬佩的传道人跌倒<br>- 当你看见自己一再失败</p><p>你可以说：「这证明神不可靠。」<br>保罗说：「这只证明人不可靠。神仍然是真实的。」</p><p>信心的一个定义：当所有的证据都指向人的失败时，仍然说「神是真实的」。</p>"},{"a":5,"z":8,"star":false,"grk":"<p>5 …μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.<br>8 …ποιήσωμεν τὰ κακά, ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.</p>","lit":"<p>5「但我们的不义若<b>显明</b>神的义，我们要说什么呢？那降忿怒的神是<b>不义</b>的吗？——<b>我是照着人的说法讲的</b>。」<br>6「绝不可能！否则神怎能审判世界呢？」<br>7「但若神的真实，因我的<b>虚谎</b>而更加显出祂的荣耀，为什么我还像罪人一样受审判呢？」<br>8「又为什么不说：『<b>我们作恶，好使善来到</b>』呢？——有人<b>毁谤</b>我们，说我们讲过这话。<b>这等人受审判是应该的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>照着人的常话</td><td>κατὰ ἄνθρωπον</td><td>kata anthrōpon</td><td>G444</td><td><b>按人的说法</b>——保罗为自己的用语致歉</td></tr><tr><td>显出</td><td>συνίστησιν</td><td>synistēsin</td><td>G4921</td><td><b>并列证明、彰显出来</b>（如把两样东西摆一起对比）</td></tr><tr><td>毁谤</td><td>βλασφημούμεθα</td><td>blasphēmoumetha</td><td>G987</td><td><b>被亵渎、被毁谤</b>（与2:24同字！）</td></tr><tr><td>该当的</td><td>ἔνδικος</td><td>endikos</td><td>G1738</td><td>合乎公理的、<b>判决是站得住的</b></td></tr></table>","gram":"<p>① κατὰ ἄνθρωπον λέγω（我且照着人的常话说）</p><p>保罗把这句话插进去，<b>是因为他刚刚讲的那句话（「神降怒，是祂不义吗？」）本身就近乎亵渎。</b></p><p>他不敢让这句话停在空中不加注明。这是敬虔的痕迹：连为了辩论而引用亵渎的话，都要先道个歉。</p><p>② βλασφημούμεθα 与2:24的呼应</p><p>- 2:24　神的名因你们<b>受了亵渎</b>（βλασφημεῖται）<br>- 3:8　保罗<b>被毁谤</b>（βλασφημούμεθα）</p><p>同一个字。第二章是神的名被亵渎，第三章是保罗的名被毁谤。传福音的人要有心理准备：讲纯正恩典的福音，一定会被人误解成放纵。</p><p>③ ποιήσωμεν τὰ κακά 是假设语气的劝勉式</p><p>「让我们去作恶吧」——<b>这是一个口号式的句子。</b> 显示这确实是当时流传的一句话，被安在保罗头上。</p>","exp":"<p>这一段的逻辑是：「如果我的罪让神显得更荣耀，那神凭什么罚我？」</p><p>这种推论听起来很聪明，却藏着一个致命的自我中心：把神的荣耀当成自己犯罪的挡箭牌。</p><p>保罗的回答只有一句话（3:6）：</p><p>「若是这样，神怎能审判世界呢？」</p><p>如果这个逻辑成立，神就永远不能审判任何人——而圣经从头到尾都见证神是审判全地的主。</p><p>然后保罗做了一件很少见的事：<b>他没有继续辩论，直接下判决——「这等人定罪是该当的。」</b></p><p>有一种论证不需要被回答，只需要被揭穿。</p><p>保罗在第六章会完整回答这个问题（6:1–14）：不是「作恶以成善不好」，而是「你已经与基督同死了，你怎么还能在罪中活着？」</p><p>【第二段｜3:9–18　旧约的六重见证】</p>"},{"a":9,"z":9,"star":false,"grk":"<p>Τί οὖν; προεχόμεθα; οὐ πάντως· προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ' ἁμαρτίαν εἶναι</p>","lit":"<p>「那么怎么样呢？我们占上风吗？完全不！因为我们已经<b>预先控告</b>犹太人和希腊人，<b>全都在罪之下</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>比他们强</td><td>προεχόμεθα</td><td>proechometha</td><td>G4284</td><td>προ（前）+ ἔχω（有）：<b>占上风、握有优势</b></td></tr><tr><td>已经证明</td><td>προῃτιασάμεθα</td><td>proētiasametha</td><td>G4256</td><td><b>新约仅此一次</b>；αἰτία（控告）：<b>预先提出正式指控</b></td></tr><tr><td>在罪恶之下</td><td>ὑφ' ἁμαρτίαν</td><td>hyph' hamartian</td><td>G266</td><td>ὑπό + 直接受格：<b>在罪的权势底下</b></td></tr></table>","gram":"<p>① προῃτιασάμεθα 是法律术语</p><p>αἰτία 是「控罪」；加上 προ- 是「先前已经提出的控告」。</p><p>保罗在说：起诉书我已经写完了（1:18–2:29），现在要传唤证人。</p><p>② ὑφ' ἁμαρτίαν 的介词用法</p><p>ὑπό + 直接受格 ＝ <b>「在……的权柄／统治之下」</b>（如「在律法以下」6:14、「在监管之下」加3:23）。</p><p>这个文法对理解本节有什么影响？<br>保罗没有说「所有人都犯了很多罪」（那是罪行），他说「所有人都<b>在罪之下</b>」（那是罪性、是权势）。<br>罪不只是我做的事，罪是统治我的主人。</p><p>这一节是罗马书6章「作罪的奴仆」的伏笔。</p>","exp":"<p>弟兄姊妹，3:9是保罗整个起诉程序的<b>结案陈词</b>。</p><p>他先起诉外邦人（1:18–32），再起诉犹太人（2:1–29），然后在3:9把两份起诉书合并：</p><p>「犹太人和希腊人<b>都在罪恶之下</b>。」</p><p><b>经文本身明确表达的：</b> 犹太人在救恩上并不「占上风」（προεχόμεθα）；因为两群人都同样<b>在罪的权势底下</b>。</p><p><b>可以合理推论的：</b> 保罗用的是<b>法律用语</b>（προαιτιάομαι ＝ 预先提出正式指控），这表示第一、二章不是情绪性的责备，是<b>一份写好的起诉书</b>。</p><p>而 ὑφ' ἁμαρτίαν（在罪之下）指的是<b>权势</b>，不只是行为。<br>所以人的问题不是「做了几件坏事」，是「<b>有一位主人在管我</b>」——这正是第六章的伏笔。</p><p><b>⚠ 牧养提醒：</b> 3:9不是要人自卑，是要人<b>闭嘴</b>（3:19）。<br>而闭嘴之后的下一句，就是3:21的「但如今」。</p>"},{"a":10,"z":12,"star":false,"grk":"<p>10 …οὐκ ἔστιν δίκαιος οὐδὲ εἷς,<br>11 οὐκ ἔστιν ὁ συνίων, οὐκ ἔστιν ὁ ἐκζητῶν τὸν θεόν.<br>12 πάντες ἐξέκλιναν ἅμα ἠχρεώθησαν· οὐκ ἔστιν ὁ ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.</p>","lit":"<p>10「<b>没有义人，连一个也没有</b>；」<br>11「<b>没有明白的</b>，<b>没有寻求神的</b>。」<br>12「他们<b>全都偏离了</b>，<b>一同变为无用</b>；<b>没有行良善的，连一个也没有</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>明白的</td><td>συνίων</td><td>syniōn</td><td>G4920</td><td>σύν + ἵημι：<b>把事情连起来看懂</b>（属灵的领悟）</td></tr><tr><td>寻求</td><td>ἐκζητῶν</td><td>ekzētōn</td><td>G1567</td><td>ἐκ + ζητέω：<b>竭力搜寻</b>（加强语气）</td></tr><tr><td>偏离正路</td><td>ἐξέκλιναν</td><td>exeklinan</td><td>G1578</td><td>ἐκ + κλίνω：<b>转向一边、离开道路</b></td></tr><tr><td>变为无用</td><td>ἠχρεώθησαν</td><td>ēchreōthēsan</td><td>G889</td><td>ἀ + χρηστός（有用）：<b>变质、发酸、成了废物</b></td></tr><tr><td>行善</td><td>ποιῶν χρηστότητα</td><td>chrēstotēs</td><td>G5544</td><td><b>恩慈</b>——与2:4「神的恩慈」是同一个字</td></tr></table>","gram":"<p>① ἠχρεώθησαν 的画面</p><p>这个字在古典希腊文与 LXX 中，用于<b>牛奶发酸、食物变质、器皿损坏不能用</b>。</p><p>保罗引诗篇14:3说：人不是坏掉一部分，是整个「变质」了。</p><p>② χρηστότητα 的惊人对照</p><p>3:12说「没有行<b>恩慈</b>（χρηστότης）的，连一个也没有」。<br>2:4说神有「丰富的<b>恩慈</b>（χρηστότης）」。</p><p>同一个字。</p><p>人身上一点恩慈也没有；神那里却是丰丰富富的恩慈。<br>这就是福音的落差。</p><p>③ οὐδὲ εἷς ／ ἕως ἑνός（连一个也没有）</p><p>保罗在3:10与3:12两次强调「<b>一个都没有</b>」。</p><p>这是全段最不受欢迎的一句话。因为每个人心里都在想：「至少还有一个吧？我认识一个很好的人……」</p><p>保罗说：连一个也没有。</p>","exp":"<p>注意11节的次序：先是「没有明白的」，然后是「没有寻求神的」。</p><p>这揭示了一个顺序：不是人先不想找神，是人先看不懂。</p><p>而12节接着说：「都是偏离正路」——ἐξέκλιναν 的画面是走在路上，然后转向旁边。人不是原地不动，人是主动离开。</p><p><b>经文本身明确表达的：</b> 旧约自己作证，没有一个义人、明白人、寻求神的人。<br><b>合理推论的生命应用：</b> 若没有一个人寻求神，那我今天会坐在这里读圣经，就不是我找到了神，是神先找到了我。</p>"},{"a":13,"z":14,"star":false,"grk":"<p>13 τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν·<br>14 ὧν τὸ στόμα ἀρᾶς καὶ πικρίας γέμει.</p>","lit":"<p>13「他们的<b>喉咙是敞开的坟墓</b>，他们用舌头<b>行诡诈</b>；<b>虺蛇的毒</b>在他们的嘴唇底下，」<br>14「他们的口<b>满了咒骂与苦毒</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>喉咙</td><td>λάρυγξ</td><td>larynx</td><td>G2995</td><td>喉头（英文 larynx 由此而来）</td></tr><tr><td>敞开的坟墓</td><td>τάφος ἀνεῳγμένος</td><td>taphos aneōgmenos</td><td>G5028</td><td><b>完成被动分词</b>：已被打开、且仍然开着</td></tr><tr><td>弄诡诈</td><td>ἐδολιοῦσαν</td><td>edoliousan</td><td>G1387</td><td>δόλος（诱饵、诡计）：<b>用饵引人上钩</b></td></tr><tr><td>毒气</td><td>ἰός</td><td>ios</td><td>G2447</td><td>毒液；也指<b>锈</b>（雅5:3）</td></tr><tr><td>咒骂</td><td>ἀρά</td><td>ara</td><td>G685</td><td>诅咒</td></tr><tr><td>苦毒</td><td>πικρία</td><td>pikria</td><td>G4088</td><td>苦味、怨毒</td></tr><tr><td>满</td><td>γέμει</td><td>gemei</td><td>G1073</td><td><b>装满到满出来</b>（如船装满货）</td></tr></table>","gram":"<p>① τάφος ἀνεῳγμένος 的完成式分词</p><p>「敞开的坟墓」不是形容词，是<b>完成被动分词</b>：「<b>已经被打开、而且一直开着的坟墓</b>」。</p><p>犹太人对坟墓有强烈的洁净忌讳（民19:16：摸了坟墓就不洁净七天）。</p><p>一个敞开的坟墓意味着：<br>1. 里面的腐臭直接冒出来<br>2. 谁靠近谁就不洁净</p><p>保罗说：人的喉咙就是这样。里面早就死了，话一出口，那股味道就飘出来，还会污染旁边的人。</p><p>② ἰὸς ἀσπίδων（虺蛇的毒气）</p><p>ἀσπίς 是埃及眼镜蛇。<b>蛇的毒液藏在牙齿后面的腺体里——平常看不见，咬下去才致命。</b></p><p>创世记3章那条蛇，用的正是言语的毒。</p><p>③ γέμει（满）</p><p>现在式，表示<b>持续的状态</b>——不是偶尔说几句苦毒的话，是那个口本来就装满了。</p><p>主耶稣说：「因为心里所充满的，口里就说出来。」（太12:34）<br>保罗这几节，正是主这句话的注脚。</p>","exp":"<p>保罗为什么花四个器官（喉咙、舌头、嘴唇、口）来讲言语？</p><p>因为<b>言语是心的出口</b>。</p><p>你可以管理你的行为，但你管不住你的舌头（雅3:8「惟独舌头没有人能制伏」）。</p><p>所以言语是最诚实的证据。你在网络上的留言、你在车里的自言自语、你在情绪失控那三秒钟说出来的话——那才是你。</p>"},{"a":15,"z":17,"star":false,"grk":"<p>15 ὀξεῖς οἱ πόδες αὐτῶν ἐκχέαι αἷμα,<br>16 σύντριμμα καὶ ταλαιπωρία ἐν ταῖς ὁδοῖς αὐτῶν,<br>17 καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν.</p>","lit":"<p>15「他们的脚<b>飞快地去流人的血</b>，」<br>16「<b>毁坏与愁苦</b>在他们的路上，」<br>17「而<b>平安的路，他们不曾认得</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>飞跑</td><td>ὀξεῖς</td><td>oxeis</td><td>G3691</td><td><b>锐利的、迅速的</b>（同字用于「快刀」）</td></tr><tr><td>残害</td><td>σύντριμμα</td><td>syntrimma</td><td>G4938</td><td>σύν + τρίβω：<b>压碎、粉碎</b>（碎成一地）</td></tr><tr><td>暴虐</td><td>ταλαιπωρία</td><td>talaipōria</td><td>G5004</td><td>悲惨、苦难</td></tr><tr><td>平安</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>译希伯来文 <b>שָׁלוֹם</b>（shalom）：<b>完整、整全、和好</b></td></tr></table>","gram":"<p><b>引文出自以赛亚书59:7–8。</b> 那一章的处境是：以色列在被掳前的社会，充满不公不义，先知说「你们的罪孽使你们与神隔绝」（赛59:2）。</p><p>σύντριμμα（压碎）与 εἰρήνη／שָׁלוֹם（完整）恰成反义：</p><p>- שָׁלוֹם 的字根意思是「<b>完整、无缺</b>」<br>- σύντριμμα 是「<b>碎裂</b>」</p><p>人所走的路留下一地碎片；而神的路叫做「完整」。<br>人从来不知道那条路怎么走——直到那一位说「我就是道路」的人来了（约14:6）。</p>","exp":"<p>注意保罗的排列：先讲嘴，再讲脚。</p><p><b>先是话，后是行动。</b> 这是罪的自然发展——先在言语上轻看人，然后在行动上伤害人。</p><p>而17节是最令人心酸的一句：「平安的路，他们未曾知道。」</p><p>不是「他们不肯走」，是「他们不知道」。人类拚命寻找和平——联合国、和平协议、心理治疗、正念冥想——<br>但保罗说：那条路，人根本不认识。</p>"},{"a":18,"z":18,"star":true,"grk":"<p>οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.</p>","lit":"<p>「在他们眼睛的<b>正前方</b>，没有神的敬畏。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>怕</td><td>φόβος</td><td>phobos</td><td>G5401</td><td>敬畏（英文 phobia 由此而来）</td></tr><tr><td>眼中</td><td>ἀπέναντι τῶν ὀφθαλμῶν</td><td>apenanti tōn ophthalmōn</td><td>G561</td><td><b>在……的正对面、正前方</b></td></tr></table>","gram":"<p>ἀπέναντι 的画面感极强：「在你视线的正前方」。</p><p>保罗引的是诗篇36:1。这句话的意思不是「他们不相信有神」，而是「神不在他们的视野里」。</p><p>无神论者的问题，不是他推翻了神；是神不在他的视线正前方。<br>而基督徒最大的危险，也是同一个——不是不信神，是神不在视野里。</p>","exp":"<p>这一节是3:10–18整段的根源，也是全段的收尾。</p><p>保罗从人的内心（没有明白的）→ 讲到嘴（敞开的坟墓）→ 讲到脚（飞跑流血）→ 最后回到<b>眼睛</b>。</p><p>所有的败坏，都从一个地方开始：眼中没有神。</p><p>箴言说：「敬畏耶和华是智慧的开端」（箴9:10）。<br>保罗说：不敬畏耶和华，就是这一切的开端。</p><p>这与罗1:21「不当作神荣耀祂」、罗2:29「不求神的称赞」完全一致。<br>一至三章的诊断是同一个：焦点不在神身上。</p><p>【第三段｜3:19–20　判决：每一张嘴都被封住】</p>"},{"a":19,"z":19,"star":false,"grk":"<p>Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·</p>","lit":"<p>「我们知道，凡律法所说的，都是对律法之内的人说的，<b>为要使每一张嘴被封住</b>，并使全世界都成为<b>在神面前应受判决的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>意义</th></tr><tr><td>塞住</td><td>φραγῇ</td><td>phragē</td><td>G5420</td><td>φράσσω（筑篱笆、堵住）</td><td><b>不定过去被动假设语气：被封起来</b></td></tr><tr><td>口</td><td>στόμα</td><td>stoma</td><td>G4750</td><td>—</td><td>嘴（3:14刚用过：「满口是咒骂苦毒」）</td></tr><tr><td>伏在审判之下</td><td>ὑπόδικος</td><td>hypodikos</td><td>G5267</td><td>ὑπό + δίκη（审判）</td><td><b>新约仅此一次</b>：在法庭上无可答辩、应受判决</td></tr><tr><td>普世的人</td><td>πᾶς ὁ κόσμος</td><td>pas ho kosmos</td><td>G2889</td><td>—</td><td>整个世界</td></tr></table>","gram":"<p>① φράσσω 的画面</p><p>这个字在古典希腊文中用于：</p><p>- <b>筑篱笆把路封起来</b><br>- <b>堵住水道</b><br>- <b>在法庭上，被告哑口无言</b></p><p>（希伯来书11:33用同字：「堵了狮子的口」）</p><p>② πᾶν στόμα（每一张嘴）与3:14的呼应</p><p>- 3:14「<b>满口</b>（στόμα）是咒骂苦毒」<br>- 3:19「好塞住<b>各人的口</b>（πᾶν στόμα）」</p><p>同一个字。那张说尽了咒骂苦毒的嘴，在律法面前终于闭上了。</p><p>③ ὑπόδικος：新约唯一一次</p><p>法律专用词，指「<b>被告已无抗辩的余地，只等宣判</b>」。</p><p>④ ἵνα（为要）——律法的目的</p><p>律法的目的<b>不是</b>叫人达到，而是<b>叫人闭嘴</b>。</p><p>这个文法对理解本节有什么影响？<br>律法从一开始就不是一把梯子，是一面镜子。<br>梯子让你往上爬；镜子让你闭嘴。</p>","exp":"<p>这是1:18–3:20整段起诉的最终判决。而判决的内容不是「你被定罪了」，而是——「你没话说了」。</p><p>保罗要的不是我们认错，是我们<b>没话可说</b>。</p><p>因为只要我们还有一句「可是……」，我们就还没有预备好接受恩典。</p><p>- 「可是我也不是最坏的。」<br>- 「可是我有我的苦衷。」<br>- 「可是他比我更过分。」</p><p>罗马书一到三章，就是神一句一句把这些「可是」拆掉，直到我们安静下来。</p><p>人在神面前闭嘴的那一刻，就是神可以开口的那一刻。</p>"},{"a":20,"z":20,"star":false,"grk":"<p>διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.</p>","lit":"<p>「因此，凭着律法的行为，没有一个<b>血肉之躯</b>能在祂面前被称为义；因为借着律法，来的是<b>对罪的认识</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>凡有血气的</td><td>πᾶσα σάρξ</td><td>pasa sarx</td><td>G4561</td><td>希伯来式表达 <b>כָּל־בָּשָׂר</b>：<b>所有血肉之躯</b>（强调人的软弱有限）</td></tr><tr><td>称义</td><td>δικαιωθήσεται</td><td>dikaiōthēsetai</td><td>G1344</td><td>未来被动：<b>将被宣告为义</b></td></tr><tr><td>知罪</td><td>ἐπίγνωσις ἁμαρτίας</td><td>epignōsis</td><td>G1922</td><td>ἐπί（加强）+ γνῶσις：<b>充分的、透彻的认识</b></td></tr></table>","gram":"<p>① πᾶσα σάρξ 的旧约背景</p><p>这是希伯来文成语（כָּל־בָּשָׂר），保罗在此引用<b>诗篇143:2</b>：</p><p>「求你不要审问仆人；因为在你面前，<b>凡活着的人没有一个是义的</b>。」</p><p>保罗在诗篇的话上加了四个字：「凭着律法的行为（ἐξ ἔργων νόμου）」。</p><p>② ἐπίγνωσις 不是普通的「知道」</p><p>γνῶσις 是知识；<b>ἐπίγνωσις 是加强版：透彻的、切身的、完全的认识。</b></p><p>律法给你的不是「原来这是罪」的信息，是「原来我是罪人」的震动。</p><p>③ 「所以」（διότι）的连接</p><p>3:19（嘴被封住）→ 3:20（所以没有人能靠行律法称义）。</p><p>逻辑是：既然每一张嘴都被封住了，就没有人能提出自己的功劳。</p>","exp":"<p>这是全书最黑暗的一节。</p><p>保罗走了两章半，把所有的门一扇一扇关上：</p><p>- 外邦人的门，关了（1:32）<br>- 道德人的门，关了（2:1）<br>- 犹太人的门，关了（2:24）<br>- 律法的门，关了（3:20）</p><p>没有出路了。</p><p>但保罗在关上最后一扇门的同时，说了一句极重要的话：「律法本是叫人知罪。」</p><p>律法没有失败——律法完成了它的任务。</p><p>医生的X光片照不好你的骨折，但它让你知道要去开刀房。<br>律法就是那张X光片。它不能救你，但它能让你不再假装自己没事。</p><p>而下一节，开刀房的门打开了。</p><p>【第四段｜3:21–26　★ 但如今 ★】</p><p>这六节是全本圣经的中心地带。保罗在原文中把它们写成一个绵长的复合句——救恩是一个整体，不可拆解。</p>"},{"a":21,"z":21,"star":false,"grk":"<p>Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,</p>","lit":"<p>「<b>但就在此刻</b>——在律法之外，神的义<b>已经被显明出来了</b>（并且一直显明着），被律法和先知<b>持续作见证</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>意义</th></tr><tr><td>但如今</td><td>Νυνὶ δέ</td><td>nyni de</td><td>G3570</td><td>νῦν 的加强形</td><td><b>但就在此刻！</b></td></tr><tr><td>在律法以外</td><td>χωρὶς νόμου</td><td>chōris nomou</td><td>G5565</td><td>χωρίζω（分开）</td><td>与律法<b>分开</b>、不借着律法</td></tr><tr><td>神的义</td><td>δικαιοσύνη θεοῦ</td><td>dikaiosynē theou</td><td>G1343</td><td>δίκαιος</td><td><b>神所赐的义</b>（见下文）</td></tr><tr><td>显明</td><td>πεφανέρωται</td><td>pephanerōtai</td><td>G5319</td><td>φανερόω</td><td><b>完成被动式</b>：已经显明，且效果持续</td></tr><tr><td>为证</td><td>μαρτυρουμένη</td><td>martyroumenē</td><td>G3140</td><td>μαρτυρέω</td><td><b>现在被动分词</b>：持续被作见证</td></tr></table>","gram":"<p>① Νυνὶ δέ ——全本圣经最美的两个字</p><p>- νυνί 是 νῦν 的<b>强化形式</b>（加了 -ι 的强调尾缀）<br>- δέ 是强对比连接词</p><p>保罗用了两章半（1:18–3:20）建立绝望，用两个字翻转一切。</p><p>这个「如今」不只是时间，是救恩历史的新纪元：</p><pre>从前（律法时代）：律法叫人知罪，每一张嘴被封住\n   ↓ Νυνὶ δέ\n如今（基督时代）：神的义在律法以外显明</pre><p>② πεφανέρωται 完成式的重量</p><p>完成式（perfect）在希腊文中表示：一个过去完成的动作，其效果一直持续到现在。</p><p>这不是「神的义曾经显明过一次」，而是「神的义已经显明出来，而且到今天仍然摊在那里，谁都可以来拿」。</p><p>比较1:17用的是现在式 ἀποκαλύπτεται（正在显明）；这里用完成式 πεφανέρωται（已经显明，并持续有效）——保罗在3:21把福音从「正在发生」推进到「已经成就」。</p><p>③ μαρτυρουμένη 现在被动分词</p><p>「有律法和先知为证」——<b>现在式</b>，表示旧约<b>至今仍在</b>为这福音作见证。</p><p>保罗在说一件极重要的事：福音不是新的宗教，是旧约一直在指向的那一位终于来了。<br>「在律法以外」（χωρὶς νόμου）不等于「与旧约无关」。</p><p>④ δικαιοσύνη θεοῦ（神的义）的三种解释</p><table><tr><th>观点</th><th>主张</th><th>代表</th></tr><tr><td><b>属性说</b></td><td>神自己公义的性情</td><td>中世纪传统</td></tr><tr><td><b>恩赐说</b></td><td>神所赐给人、算给人的义</td><td><b>路德、改革宗主流</b></td></tr><tr><td><b>作为说</b></td><td>神信守圣约、施行拯救的义行</td><td>Käsemann、Wright</td></tr></table><p>本章的上下文支持：「恩赐」为主，「作为」为辅。</p><p>理由：</p><p>- 3:22「神的义……<b>加给</b>一切相信的人」——是给出去的<br>- 3:24「<b>就白白地称义</b>」——是宣告<br>- 3:26「他自己为义，也称信耶稣的人为义」——<b>同一节里两个都有！</b></p><p>3:26是解开这个争议的钥匙：神的义既是祂自己的属性（祂是义的），也是祂赐下的地位（祂称人为义）。</p>","exp":"<p>弟兄姊妹读到这里，要停一下。</p><p>3:20说「没有一个因行律法能在神面前称义」——句号。<br>3:21说「但如今」——</p><p>这中间发生了什么事？</p><p>中间发生了一个十字架。</p><p>保罗没有说「但如今你们要更努力」，也没有说「但如今神降低标准了」。</p><p>他说：</p><p>「神的义，在律法以外，已经显明出来。」</p><p>不是人爬上去的义，是神拿下来的义。</p>"},{"a":22,"z":22,"star":false,"grk":"<p>δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ εἰς πάντας τοὺς πιστεύοντας. οὐ γάρ ἐστιν διαστολή,</p>","lit":"<p>「就是神的义，<b>借着耶稣基督的信</b>（或：借着信耶稣基督），临到所有相信的人。因为没有<b>分别</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>因信耶稣基督</td><td>πίστεως Ἰησοῦ Χριστοῦ</td><td>pisteōs Iēsou Christou</td><td>G4102</td><td><b>本节最大的解经争议</b>（见下）</td></tr><tr><td>加给</td><td>εἰς</td><td>eis</td><td>G1519</td><td><b>进入、临到</b>（方向性介词）</td></tr><tr><td>分别</td><td>διαστολή</td><td>diastolē</td><td>G1293</td><td>διά + στέλλω：<b>区分、划分界线</b></td></tr></table>","gram":"<p>① πίστις Ἰησοῦ Χριστοῦ：受词所有格 vs 主词所有格</p><table><tr><th>译法</th><th>意思</th><th>支持者</th></tr><tr><td><b>受词所有格</b>（objective）</td><td><b>信</b>耶稣基督（人的信心）</td><td>传统译本、和合本、多数改革宗</td></tr><tr><td><b>主词所有格</b>（subjective）</td><td>耶稣基督<b>的信实</b>（基督的忠信）</td><td>Hays、Wright、部分新约学者</td></tr></table><p>支持传统译法（人的信心）的理由：</p><p>- 同一节下半句立刻说「<b>加给一切相信的（τοὺς πιστεύοντας）人</b>」——保罗在解释自己<br>- 3:26「称<b>信耶稣的人</b>为义」<br>- 4:5「信神称罪人为义的」<br>- 全卷书强调人的回应之信（1:16、10:9–10）</p><p><b>支持主词所有格的价值：</b> 它提醒我们<b>信心不是我们的功劳</b>，救恩的根基是基督的忠信。</p><p>我的判断：受词所有格（信耶稣基督）最符合上下文；但主词所有格所要保护的真理是对的，可以用另一种方式表达——「使我们得救的，不是我信心的品质，是我信心所抓住的那一位」。</p><p>② διαστολή（分别）</p><p>这个字在<b>罗3:22与10:12</b>出现：</p><p>- 3:22「没有分别」——因为<b>都犯了罪</b><br>- 10:12「没有分别」——因为<b>都可以求告主</b></p><p>同一个字，一次在定罪上没有分别，一次在恩典上没有分别。</p><p>这是全章最公平的一句话：在罪面前，我们都一样；在恩典面前，我们也都一样。</p>","exp":"<p>「加给」的原文是 εἰς——一个方向性的介词：「进入」「临到」。</p><p>神的义不是挂在天上让你欣赏，是朝着你而来、进到你里面的。</p><p>而「没有分别」（οὐ διαστολή）这句话，正是第二章2:11「神不偏待人」的完成。</p>"},{"a":23,"z":23,"star":false,"grk":"<p>πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ</p>","lit":"<p>「因为所有人都犯了罪，并且<b>持续地缺乏</b>神的荣耀。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>犯了罪</td><td>ἥμαρτον</td><td>hēmarton</td><td>G264</td><td><b>不定过去式</b>：射不中靶（总括全人类的历史）</td></tr><tr><td>亏缺</td><td>ὑστεροῦνται</td><td>hysterountai</td><td>G5302</td><td><b>现在中／被动式</b>：<b>持续地落后、缺乏、达不到</b></td></tr><tr><td>荣耀</td><td>δόξα</td><td>doxa</td><td>G1391</td><td>荣耀、光辉、重量</td></tr></table>","gram":"<p>① 两个动词，两种时态</p><table><tr><th>动词</th><th>时态</th><th>意义</th></tr><tr><td>ἥμαρτον（犯了罪）</td><td><b>不定过去式</b></td><td>一个已成定局的事实</td></tr><tr><td>ὑστεροῦνται（亏缺）</td><td><b>现在式</b></td><td><b>此刻仍然持续的状态</b></td></tr></table><p>保罗在说：犯罪是一件已经发生的事；亏缺却是一个至今持续的状态。<br>「我曾经犯了罪」＋「我现在还是不够」。</p><p>② ὑστερέω 的画面</p><p>这个字在新约用于：</p><p>- 赛跑中<b>落后</b><br>- 筵席上酒<b>用尽了</b>（约2:3「酒用尽了」正是这个字！）<br>- 浪子<b>穷困</b>（路15:14）</p><p>画面：你在跑，但你追不上；你在倒，但瓶子空了。</p><p>③「神的荣耀」是什么意思？</p><p>两种主要理解：</p><p>1. <b>神所赐的荣耀</b>——人本应反映神的形像（创1:26–27），却失去了<br>2. <b>神自己的荣耀</b>——人本应荣耀神（1:21），却亏缺了</p><p>犹太传统认为亚当在堕落前有「荣耀的外袍」，堕落后失去了。罗1:23「将不能朽坏之神的荣耀，变为偶像」支持第一种。</p><p>两者其实是一体的：人失去了荣耀神的能力，也失去了反映神荣耀的样式。</p>","exp":"<p>这是全本圣经最常被引用的一节之一，却常被读得太轻。</p><p>「亏缺」不是「差一点点」。原文的现在式告诉我们：这是一个<b>持续的、每一天的</b>状态。</p><p>人不是偶尔达不到神的标准，人是每一天、每一刻都在缺。</p><p><b>注意保罗把这一节放在哪里：</b> 他把它夹在3:22（没有分别）与3:24（白白称义）之间。<br>这一节不是为了让人绝望，是为了说明为什么恩典必须是白白的。</p>"},{"a":24,"z":24,"star":false,"grk":"<p>δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·</p>","lit":"<p>「<b>白白地</b>，借着祂的恩典，借着那在基督耶稣里的<b>赎回</b>，被称为义——」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>意义</th></tr><tr><td>称义</td><td>δικαιούμενοι</td><td>dikaioumenoi</td><td>G1344</td><td>δίκαιος</td><td><b>现在被动分词</b>：正在被宣告为义</td></tr><tr><td>白白地</td><td>δωρεάν</td><td>dōrean</td><td>G1432</td><td>δῶρον（礼物）</td><td><b>当作礼物、无偿地、无缘无故地</b></td></tr><tr><td>恩典</td><td>χάρις</td><td>charis</td><td>G5485</td><td>χαίρω（喜乐）</td><td>白白的恩惠</td></tr><tr><td>救赎</td><td>ἀπολύτρωσις</td><td>apolytrōsis</td><td>G629</td><td>ἀπό + λύτρον（赎价）</td><td><b>付赎价把人买出来得自由</b></td></tr></table>","gram":"<p>① δωρεάν 的惊人用法</p><p>这个字在<b>约翰福音15:25</b>被用在一个令人震撼的地方：</p><p>「他们<b>无故</b>（δωρεάν）恨我。」</p><p>同一个字。</p><pre>他们「无缘无故」恨祂    （约15:25 δωρεάν）\n我们「无缘无故」被称义   （罗3:24 δωρεάν）</pre><p>祂无缘无故被恨，我们无缘无故被爱。<br>这是十字架的交换。</p><p>② ἀπολύτρωσις 的三个要素</p><p>古代赎奴需要三样：</p><p>1. <b>一个被囚的人</b>（我们，3:9「在罪恶之下」）<br>2. <b>一笔赎价</b>（λύτρον——耶稣说：「舍命作多人的赎价」可10:45）<br>3. <b>一个释放的宣告</b>（3:24「称义」）</p><p><b>注意：赎价付给谁？圣经没有说付给撒但。</b> 早期教父有此推测，但保罗的重点不在「付给谁」，而在<b>代价之昂贵与释放之真实</b>。</p><p>③ 三个介词层层堆叠</p><pre>δωρεάν            —— 白白地       【方式：无偿】\nτῇ αὐτοῦ χάριτι   —— 凭祂的恩典   【根源：神的性情】\nδιὰ τῆς ἀπολυτρώσεως —— 借着救赎  【途径：基督的工作】</pre><p>保罗怕我们误会，所以连下三重保险：白白的、凭恩典、藉救赎。</p>","exp":"<p>「白白地称义」是全本圣经最不合人性直觉的一句话。</p><p>因为每一种宗教、每一种文化、每一个人的本能都说：<b>你要付出，才配得到。</b></p><p>只有福音说：你什么都不必付，因为有人已经付清了。</p><p>但「白白的」不等于「不值钱的」。<br>对你是白白的，对神是倾家荡产的。</p>"},{"a":25,"z":25,"star":true,"grk":"<p>ὃν προέθετο ὁ θεὸς ἱλαστήριον διὰ [τῆς] πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων</p>","lit":"<p>「神<b>公开摆出</b>祂作<b>施恩座／挽回祭</b>，借着信，在祂自己的血里，为要<b>证明</b>祂的义——因为神先前<b>放过了</b>（没有处理）那些已经犯下的罪，」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>意义</th></tr><tr><td>设立</td><td>προέθετο</td><td>proetheto</td><td>G4388</td><td>πρό + τίθημι（摆放）</td><td><b>公开摆出来、陈列于众人面前</b>（也可译「预先定意」）</td></tr><tr><td>挽回祭</td><td>ἱλαστήριον</td><td>hilastērion</td><td>G2435</td><td>ἵλεως（施怜悯的）</td><td><b>施恩座／赎罪之处</b>（见下文详解）</td></tr><tr><td>血</td><td>αἷμα</td><td>haima</td><td>G129</td><td>—</td><td>血，指<b>献上的生命</b>（利17:11）</td></tr><tr><td>显明</td><td>ἔνδειξις</td><td>endeixis</td><td>G1732</td><td>ἐν + δείκνυμι（指出）</td><td><b>法庭上提出的证据</b></td></tr><tr><td>宽容</td><td>πάρεσις</td><td>paresis</td><td>G3929</td><td>παρά + ἵημι（放过）</td><td><b>新约仅此一次：暂时搁置、放过去</b></td></tr><tr><td>先时所犯的</td><td>προγεγονότων</td><td>progegonotōn</td><td>G4266</td><td>—</td><td><b>完成分词</b>：先前已经犯下的</td></tr></table>","gram":"<p>★ 亮光一：ἱλαστήριον ——施恩座</p><p>这个字在七十士译本中，是约柜上盖子的专有名词——希伯来文 כַּפֹּרֶת（kapporeth），中文译作「施恩座」。</p><p>- 出25:17–22（施恩座的制作）<br>- 利16:2、13–15（赎罪日弹血于施恩座）<br>- <b>来9:5「施恩的所在」——用的正是 ἱλαστήριον</b></p><p>赎罪日发生了什么？</p><p>1. 约柜里放着什么？<b>两块法版</b>（十诫）——那是控告以色列的证据<br>2. 约柜上盖着什么？<b>施恩座</b><br>3. 施恩座上有什么？<b>两个基路伯，面对面，俯视施恩座</b><br>4. 大祭司做什么？<b>把赎罪祭的血弹在施恩座上</b></p><p>于是那位坐在基路伯中间的神，低头看下去的时候——<br>祂看见的不是控告我的法版，是遮盖法版的血。</p><p>保罗说：耶稣就是那个施恩座。</p><p>两种主要译法：</p><table><tr><th>译法</th><th>重点</th><th>支持</th></tr><tr><td><b>挽回祭</b>（propitiation）</td><td>承受神的忿怒，使神转怒为恩</td><td>和合本；1:18神的忿怒是上下文；C.E.B. Cranfield、Leon Morris</td></tr><tr><td><b>施恩座</b>（mercy seat）</td><td>LXX 用法；赎罪日的地点</td><td>来9:5同字；T. W. Manson、Dunn</td></tr><tr><td>（遮罪／除罪 expiation）</td><td>除去罪本身</td><td>C. H. Dodd（多数学者认为此说削弱了1:18的忿怒主题）</td></tr></table><p>我认为两者可以并存，且应该并存：</p><p>耶稣既是那个「地方」（施恩座），也是那个「祭」（挽回祭）。<br>祂是祭坛，也是祭物；是那被血遮盖的地方，也是那流血的羔羊。</p><p>★ 亮光二：προέθετο ——公开摆出来</p><p>这个动词的字面意思是「摆在前面」。</p><p>赎罪日的施恩座在哪里？</p><p>- 在<b>至圣所</b>里<br>- 在<b>幔子后面</b><br>- <b>一年只有一次</b><br>- <b>只有一个人</b>看得见</p><p>保罗说：神把它 προέθετο——公开摆出来了。</p><p>从前藏在幔子后面的，如今挂在城外的山头上；<br>从前只有大祭司能看的，如今全世界都看见了；<br>从前一年一次的，如今一次永远成就了。</p><p>所以主耶稣断气的那一刻——</p><p><b>「忽然，殿里的幔子从上到下裂为两半。」</b>（太27:51）</p><p>幔子不需要了。施恩座已经公开了。</p><p>★ 亮光三：πάρεσις 不是 ἄφεσις</p><p>这是本节最精细、也最容易被中文译本盖住的一个字。</p><table><tr><th>字</th><th>意思</th><th>出现</th></tr><tr><td><b>ἄφεσις</b></td><td><b>赦免、免除</b>（债务被取消）</td><td>新约常用（弗1:7「过犯得以赦免」）</td></tr><tr><td><b>πάρεσις</b></td><td><b>放过、暂时搁置</b>（债务被延后，尚未处理）</td><td><b>新约仅罗3:25一次</b></td></tr></table><p>保罗刻意不用「赦免」，而用了一个罕见的字：「放过去」。</p><p>他在说什么？</p><p>旧约几千年来，神一直在「赊帐」。</p><p>亚伯的祭、挪亚的祭、亚伯拉罕的公羊、逾越节的羊羔、圣殿里千千万万的牛羊——</p><p>「因为公牛和山羊的血，断不能除罪。」（来10:4）</p><p>那些祭只是一张欠条，不是付款。神一直在「放过去」，一直没有结案。</p><p>而这就引出了一个天大的难题：神凭什么放过？</p><p>如果神一直不追讨罪，那祂就不公义。</p><p>保罗说：所以神在十字架上「显明祂的义」（εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ）。</p><p>十字架不只是为我赎罪，十字架也是神为自己「洗清嫌疑」。<br>神在各各他向全宇宙证明：我从来没有放纵过任何一件罪。所有的帐，都在这里结清了。</p><p>★ 亮光四：ἐν τῇ ἀνοχῇ τοῦ θεοῦ 与2:4的呼应</p><p>3:26开头「（他用）忍耐的心」原文是 <b>ἐν τῇ ἀνοχῇ τοῦ θεοῦ</b>。</p><p>ἀνοχή 这个字，保罗在罗马书只用了两次：</p><p>- <b>2:4</b>「你藐视他丰富的恩慈、<b>宽容</b>（ἀνοχή）、忍耐」<br>- <b>3:26</b>「他用忍耐的心<b>宽容</b>（ἀνοχή）人先时所犯的罪」</p><p>第二章说：神的宽容是在等你悔改。<br>第三章说：神之所以能宽容，是因为祂早就打算让自己的儿子来付这笔帐。<br>神的忍耐不是心软，是因为祂心里已经有了各各他。</p>","exp":"<p>这一节回答了全本圣经最大的难题。</p><p>难题是：神怎么可能既公义又赦罪？</p><p>- 一个法官若放走杀人犯，他就不是好法官<br>- 一个父亲若不管孩子的错，他就不是好父亲<br>- <b>一个神若不追讨罪，祂就不是公义的神</b></p><p>答案：神亲自坐上了被告席。</p><p>祂把自己的儿子公开摆出来，作那个承受忿怒的地方。</p><p>于是：</p><p>- 罪被完全追讨了 → <b>神是公义的</b><br>- 罪人被完全释放了 → <b>神称人为义</b></p><p>这两件事在同一个十字架上同时成就。</p>"},{"a":26,"z":26,"star":false,"grk":"<p>ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.</p>","lit":"<p>「在神的宽容里——为要在<b>这如今的时候</b>证明祂的义，好叫祂<b>自己是义的，同时又是那称人为义的</b>，就是那本于信耶稣的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>今时</td><td>ἐν τῷ νῦν καιρῷ</td><td>en tō nyn kairō</td><td>G2540</td><td><b>这个决定性的时刻</b>（καιρός 是「时机」不是「时间长度」）</td></tr><tr><td>为义</td><td>δίκαιον</td><td>dikaion</td><td>G1342</td><td>形容词：<b>祂自己是义的</b></td></tr><tr><td>称……为义</td><td>δικαιοῦντα</td><td>dikaiounta</td><td>G1344</td><td><b>现在主动分词</b>：正在称人为义的那一位</td></tr></table>","gram":"<p>★ δίκαιον καὶ δικαιοῦντα ——全本圣经最精妙的一组并列</p><p>原文是同一个字根的两个形式并排：</p><pre>δίκαιον      καὶ    δικαιοῦντα\n（义的）      和     （称人为义的）\n形容词              现在主动分词</pre><p>中文「使人知道他自己为义，也称信耶稣的人为义」已经很好，但原文的并列更紧——</p><p>两个 δικαι- 字根紧挨着，像两块石头砌在一起，中间只隔一个 καί。</p><p>英文有一句经典的翻译：just and the justifier（既是公义的审判者，又是使人称义者）。<br>这是十字架上发生的双重奇迹。</p><p>「今时」（ἐν τῷ νῦν καιρῷ）与3:21的 Νυνὶ δέ 呼应——保罗第二次强调「就是现在」。</p>","exp":"<p>这是全章的顶峰。</p><p>弟兄姊妹，人类历史上有两种「解决方案」：</p><table><tr><th>方案</th><th>结果</th></tr><tr><td>神只讲公义</td><td>没有一个人活得了</td></tr><tr><td>神只讲慈爱</td><td>神就成了纵容罪的神，宇宙的道德根基崩塌</td></tr><tr><td><b>十字架</b></td><td><b>公义完全满足，慈爱完全彰显</b></td></tr></table><p>神没有在公义与慈爱之间妥协——祂在十字架上让两者同时满分。</p><p><b>「慈爱和诚实彼此相遇；公义和平安彼此相亲。」</b>（诗85:10）</p><p>诗人所盼望的那一幕，在各各他发生了。</p><p>【第五段｜3:27–31　三个结论】</p>"},{"a":27,"z":28,"star":false,"grk":"<p>27 Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.<br>28 λογιζόμεθα γὰρ δικαιοῦσθαι πίστει ἄνθρωπον χωρὶς ἔργων νόμου.</p>","lit":"<p>27「那么夸口在哪里？<b>它被关在外面了。</b> 借着哪一种法？行为的吗？不是，乃是借着信的法。」<br>28「因为我们<b>算定</b>：人被称义是凭着信，与律法的行为无关。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>夸口</td><td>καύχησις</td><td>kauchēsis</td><td>G2746</td><td>夸耀的行为（与2:17、2:23同字根）</td></tr><tr><td>没有的了</td><td>ἐξεκλείσθη</td><td>exekleisthē</td><td>G1576</td><td>ἐκ + κλείω（关门）：<b>被关在门外了</b></td></tr><tr><td>看定了</td><td>λογιζόμεθα</td><td>logizometha</td><td>G3049</td><td><b>算定、结论</b>（2:3、2:26、4:3同字）</td></tr></table>","gram":"<p>① ἐξεκλείσθη ——最生动的一个被动式</p><p>字面意思：<b>「被关在门外」。</b></p><p>保罗没有说「夸口是不好的」「我们应该谦卑一点」。他说：门关了，夸口进不来了。</p><p>② 「哪里能夸口呢？」与第二章的呼应</p><p>- 2:17「又倚靠律法，且指着神<b>夸口</b>」<br>- 2:23「你指着律法<b>夸口</b>，自己倒犯律法」<br>- <b>3:27「哪里能夸口呢？没有可夸的了。」</b></p><p>第二章诊断了夸口的病，第三章把门关上。</p><p>③ λογιζόμεθα（我们看定了）——第四章的引信</p><p>同一个字在4:3爆炸：「亚伯拉罕信神，这就<b>算为</b>（ἐλογίσθη）他的义。」</p><p>保罗在3:28说「我们算定」，在4:3说「神算为」——人的计算与神的计算终于对上了。</p><p>④ 关于「因信称义」的路德译本争议</p><p>马丁路德在1522年的德文译本中，把3:28译为「<b>惟独</b>因信（allein durch den Glauben）」，加了「惟独」（allein）二字，引起激烈争论。</p><p>平衡的评估：</p><p>- <b>文法上</b>：原文确实没有「惟独」这个字<br>- <b>意思上</b>：「χωρὶς ἔργων νόμου（与律法的行为无关）」在语意上等同于「惟独因信」<br>- <b>路德自己的辩护</b>：德文表达否定对比时，自然需要加「allein」才通顺</p><p>讲台上的诚实作法：可以说「路德在翻译时加了『惟独』二字，引起很大争议；他加的字原文没有，但他要保护的意思，保罗这节确实说了。」</p>","exp":"<p>保罗在这里做了一个极大胆的动作：他把「信」也称为一种「法」（νόμος πίστεως，信主之法）。</p><p>这是文字游戏，但有神学重量：</p><p>- 立功之法（νόμος τῶν ἔργων）：<b>我做，所以我得</b><br>- 信主之法（νόμος πίστεως）：<b>祂做了，所以我领受</b></p><p>两种法，两种人生，两种宗教。</p><p>世上所有宗教都是「立功之法」；只有福音是「信主之法」。<br>所有宗教的动词都是「做」；福音的动词是「成了」。</p>"},{"a":29,"z":30,"star":false,"grk":"<p>29 ἢ Ἰουδαίων ὁ θεὸς μόνον; οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,<br>30 εἴπερ εἷς ὁ θεὸς ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.</p>","lit":"<p>29「还是说，神只是犹太人的神吗？不也是外邦人的吗？<b>是的，也是外邦人的</b>——」<br>30「<b>既然神只有一位</b>：祂要<b>本于信</b>称受割礼的为义，也要<b>借着信</b>称未受割礼的为义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>神既是一位</td><td>εἷς ὁ θεός</td><td>heis ho theos</td><td>G1520</td><td><b>神是一位</b>——直指示玛（申6:4）</td></tr><tr><td>因信（受割礼的）</td><td>ἐκ πίστεως</td><td>ek pisteōs</td><td>—</td><td><b>出于信</b>（来源）</td></tr><tr><td>因信（未受割礼的）</td><td>διὰ τῆς πίστεως</td><td>dia tēs pisteōs</td><td>—</td><td><b>借着那信</b>（途径）</td></tr></table>","gram":"<p>★ εἷς ὁ θεός ——保罗用示玛来证明外邦人的福音</p><p>申命记6:4，犹太人每天早晚背诵的信仰告白（Shema）：</p><p><b>「以色列啊，你要听！耶和华我们神是独一的主。」</b>（שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד）</p><p><b>犹太人用这句话证明：</b>「只有我们敬拜真神。」</p><p><b>保罗用同一句话证明：</b>「所以外邦人也是祂的。」</p><p>保罗的逻辑：<br>如果神只有一位，而祂是全宇宙的神——<br>那祂就不可能只作一个民族的神。<br>一神论（monotheism）必然导出普世宣教。</p><p>这是全章最巧妙的一个论证：保罗拿犹太人最珍视的信条，证明了他们最不能接受的结论。</p><p>★ ἐκ πίστεως 与 διὰ τῆς πίστεως 的差别</p><p>保罗用了两个不同的介词：</p><p>- 受割礼的人：<b>ἐκ πίστεως</b>（出于信）<br>- 未受割礼的人：<b>διὰ τῆς πίστεως</b>（借着那信）</p><p>两种主要解释：</p><p>1. <b>纯修辞变化</b>——保罗只是为了文句变化（多数注释家）<br>2. <b>有细微差别</b>——犹太人「从信而来」（他们是应许的后裔），外邦人「藉信而入」</p><p>无论如何，保罗的重点很清楚：两者都是 πίστις（信）。方式的措辞可以不同，途径只有一条。</p>","exp":"<p>第29节是一个非常安静却极其巨大的问题：「难道神只作犹太人的神吗？」</p><p>这个问题今天仍然要问：</p><p>- 神只作「我们这一种基督徒」的神吗？<br>- 神只作「我们这个宗派」的神吗？<br>- 神只作「跟我一样得救经历的人」的神吗？</p><p>保罗的回答：「是的，也作外邦人的神。」<br>凡是把神圈在自己群体里的，都还没有懂第三章。</p>"},{"a":31,"z":31,"star":false,"grk":"<p>νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ἱστάνομεν.</p>","lit":"<p>「那么，我们借着信<b>使律法失效</b>吗？绝不可能！反而<b>使律法站立起来</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>废了</td><td>καταργοῦμεν</td><td>katargoumen</td><td>G2673</td><td>使失效（与3:3同字）</td></tr><tr><td>坚固</td><td>ἱστάνομεν</td><td>histanomen</td><td>G2476</td><td>ἵστημι：<b>使之站立、确立、坐实</b></td></tr></table>","gram":"<p>① καταργέω 与 ἵστημι 的对比</p><p>- καταργέω：<b>使之瘫倒、失效</b><br>- ἵστημι：<b>使之站起来</b></p><p>画面：不是把律法推倒，是把律法扶正。</p><p>② 这一节与3:3的呼应</p><p>- 3:3「他们的不信就<b>废掉</b>（καταργήσει）神的信吗？」→ 不能<br>- 3:31「我们因信<b>废了</b>（καταργοῦμεν）律法吗？」→ 不是</p><p>保罗用同一个字开场、收场。</p>","exp":"<p>福音怎么「坚固」律法？至少三个层面：</p><p>1. <b>福音成全了律法的要求</b>——基督完全遵行了律法（太5:17），且在十字架上满足了律法的刑罚<br>2. <b>福音证实了律法的功用</b>——律法本来就不是用来称义的，是用来知罪的（3:20）。<b>因信称义让律法终于回到它正确的位置。</b><br>3. <b>福音使律法能被遵行</b>——8:4「使律法的义成就在我们这……随从圣灵的人身上」</p><p>这一节是第六至八章的门。保罗说完「因信称义」，立刻把门打开：<br>恩典不会使人随便，恩典会使律法第一次真的站起来。</p><p>这也是对3:8毁谤的最终回答：「我们可以作恶以成善吗？」——不。恩典不废律法，恩典坚固律法。</p>"}],"4":[{"a":1,"z":2,"star":false,"grk":"<p>1 Τί οὖν ἐροῦμεν εὑρηκέναι Ἀβραὰμ τὸν προπάτορα ἡμῶν κατὰ σάρκα;<br>2 εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα, ἀλλ' οὐ πρὸς θεόν.</p>","lit":"<p>1「那么我们要说，我们肉身的<b>先祖</b>亚伯拉罕<b>发现</b>了什么呢？」<br>2「因为若亚伯拉罕是凭行为被称义，他就<b>有可夸的</b>——但在神面前却没有。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>祖宗</td><td>προπάτωρ</td><td>propatōr</td><td>G4310</td><td>πρό + πατήρ</td><td><b>先祖、始祖</b></td><td>全新约仅此一次</td></tr><tr><td>得了</td><td>εὑρηκέναι</td><td>heurēkenai</td><td>G2147</td><td>εὑρίσκω</td><td><b>找到、发现</b>（阿基米德「Eureka!」）</td><td>「他发现了什么？」</td></tr><tr><td>凭着肉体</td><td>κατὰ σάρκα</td><td>kata sarka</td><td>G4561</td><td>—</td><td>按肉身、按血统</td><td>见下文文法讨论</td></tr><tr><td>可夸的</td><td>καύχημα</td><td>kauchēma</td><td>G2745</td><td>καυχάομαι</td><td><b>夸口的内容／本钱</b></td><td>与3:27同字根</td></tr></table>","gram":"<p>① κατὰ σάρκα 该接在哪里？</p><p>希腊文的语序造成两种读法：</p><table><tr><th>读法</th><th>中译</th><th>意思</th></tr><tr><td>接 προπάτορα</td><td>「我们<b>肉身的</b>祖宗亚伯拉罕」</td><td>血统上的先祖（和合本倾向此读）</td></tr><tr><td>接 εὑρηκέναι</td><td>「亚伯拉罕<b>凭肉体</b>得了什么」</td><td>靠自己的努力得了什么</td></tr></table><p>两种读法都有力，且结论一致：亚伯拉罕靠自己什么也没得着。</p><p>② καύχημα 与 καύχησις 的细微差别</p><p>- <b>καύχησις</b>（3:27）＝ 夸口的<b>行为</b><br>- <b>καύχημα</b>（4:2）＝ 夸口的<b>本钱／内容</b></p><p>保罗在3:27说「夸口的行为被关在门外」；在4:2说「连夸口的本钱都没有」。</p><p>③ ἀλλ' οὐ πρὸς θεόν（只是在神面前并无可夸）</p><p>这半句是全节的转折。保罗的意思不是「亚伯拉罕真的有可夸的，只是不敢夸」，而是：</p><p>在人面前，亚伯拉罕确实是个伟大的人物——离开本地、接待客旅、为所多玛代求、献上以撒。<br>但把他放在神面前（πρὸς θεόν），这些全都不是他的本钱。</p>","exp":"<p>保罗为什么从亚伯拉罕开始？</p><p>因为在犹太人心中，<b>如果有一个人靠行为站得住，那一定是亚伯拉罕</b>。</p><p>保罗的策略是：我不跟你辩论小人物，我直接处理你们最大的那一位。</p><p>如果连亚伯拉罕都没有可夸的，那就没有人有了。</p><p><b>经文本身明确表达的：</b> 亚伯拉罕若因行为称义就有可夸的，但在神面前他没有。<br><b>合理推论的生命应用：</b> 每个人心里都有一份「我还算不错」的清单。保罗要做的第一件事，就是把那份清单拿到神面前——在那里，它会安静下来。</p>"},{"a":3,"z":3,"star":true,"grk":"<p>τί γὰρ ἡ γραφὴ λέγει; ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.</p>","lit":"<p>「因为圣经说什么呢？『亚伯拉罕<b>信了</b>神，这就<b>被算入</b>他的帐上，成为义。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>经上</td><td>ἡ γραφή</td><td>hē graphē</td><td>G1124</td><td>γράφω（写）</td><td><b>那被写下来的</b>（＝圣经）</td><td>保罗诉诸最终权威</td></tr><tr><td>信</td><td>ἐπίστευσεν</td><td>episteusen</td><td>G4100</td><td>πιστεύω</td><td><b>信靠、托付</b>（不只是「相信有」）</td><td>不定过去式：一个具体的时刻</td></tr><tr><td>算</td><td>ἐλογίσθη</td><td>elogisthē</td><td>G3049</td><td>λογίζομαι</td><td><b>记入帐册、计算入列</b></td><td><b>不定过去被动式</b>（见下）</td></tr><tr><td>义</td><td>δικαιοσύνη</td><td>dikaiosynē</td><td>G1343</td><td>δίκαιος</td><td>义的地位</td><td>法庭用语</td></tr></table>","gram":"<p>① λογίζομαι 的商业背景</p><p>这个字在第一世纪的蒲草纸文献中，是标准的记帐用语：</p><p>- 把一笔款项<b>记入某人的帐户</b><br>- 计算、结算<br>- 认定某物属于某人</p><p>保罗选这个字，是刻意的。他要我们看见一本帐簿。</p><p>② ἐλογίσθη 是「神圣被动式」（divine passive）</p><p>被动语态，但没有写出施动者——因为施动者是神。</p><p>不是亚伯拉罕把义算给自己，是神把义算给他。</p><p>这一点极其重要：整章的动作，主词都是神。</p><p>③ εἰς δικαιοσύνην 的介词用法</p><p>εἰς + 直接受格 ＝ <b>「算入……成为……」</b></p><p>这是会计术语：把一笔进帐归入「义」这个科目。</p><p>④「算为义」在原文中的细节</p><p>创15:6希伯来原文：וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה（wayyachshəbehā lō ṣədāqāh）</p><p>- <b>חָשַׁב（chashav, H2803）</b>＝思想、计算、认定<br>- 这个字也用于：「你们的意思是要害我，但神的意思<b>原是好的</b>」（创50:20，同字根）</p><p>保罗所引的希腊文 λογίζομαι，正是七十士译本对 חָשַׁב 的标准翻译。</p><p>这个文法对理解本节有什么影响？<br>「算为义」不是说亚伯拉罕变成义人了，而是说：神在祂的帐本上，把「义」记在亚伯拉罕的名下。<br>这是地位的宣告，不是品格的描述。</p>","exp":"<p>保罗在这一节做了一件当时犹太人最不能接受的事：他把创15:6从创22（献以撒）拆开了。</p><p>当时的标准读法（《马加比一书》2:52）是：亚伯拉罕在献以撒的试验中忠心，所以「这就算为他的义」。</p><p>保罗说：不对。请你翻开创世记，看看创15:6在哪里。</p><p>它在第15章。献以撒在第22章。<br>中间隔了七章、隔了几十年。</p><p>神算他为义的时候，以撒都还没出生。</p><p>这就是为什么保罗说「经上说什么呢？」——不是「传统怎么说」，是「经上怎么写的」。</p><p>圣经是我的准则。当传统与经文冲突时，回到经文。</p>"},{"a":4,"z":5,"star":true,"grk":"<p>4 τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα,<br>5 τῷ δὲ μὴ ἐργαζομένῳ πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην·</p>","lit":"<p>4「对那作工的人，工资不是<b>按恩典</b>算给他，而是<b>按欠债</b>算的。」<br>5「但对那<b>不作工</b>、却信靠那位<b>称不敬虔之人为义</b>的神的人，他的信就被算为义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>作工的</td><td>ἐργαζομένῳ</td><td>ergazomenō</td><td>G2038</td><td>ἔργον（工作）</td><td>劳动者、受雇者</td><td>现在分词：持续在作工的人</td></tr><tr><td>工价</td><td>μισθός</td><td>misthos</td><td>G3408</td><td>—</td><td><b>工资、报酬</b></td><td>日工每天领的钱</td></tr><tr><td>该得的</td><td>ὀφείλημα</td><td>opheilēma</td><td>G3783</td><td>ὀφείλω（欠）</td><td><b>欠款、债务</b></td><td>主祷文「免我们的债」同字根</td></tr><tr><td>罪人</td><td>ἀσεβής</td><td>asebēs</td><td>G765</td><td>ἀ + σέβομαι（敬拜）</td><td><b>不敬虔的、不敬拜神的</b></td><td><b>不是「做坏事的」，是「不敬神的」</b></td></tr><tr><td>称……为义</td><td>δικαιοῦντα</td><td>dikaiounta</td><td>G1344</td><td>δίκαιος</td><td>宣告为义</td><td>现在主动分词：那位正在称人为义的</td></tr></table>","gram":"<p>① μισθός 与 ὀφείλημα：两种「应得」</p><p>保罗画出一条清楚的界线：</p><pre>作工 → 领工资 → 这叫「该得的」（ὀφείλημα, 债）\n不作工 → 信 → 这叫「恩典」（χάρις）</pre><p>关键洞见：如果称义是工资，那神就欠我们。<br>而只要神欠我们，恩典就死了。</p><p>恩典与债务，在逻辑上不可能共存。</p><p>② ἀσεβής 的重量</p><p>这个字不是泛指「坏人」，而是特指「不敬虔、不把神当神的人」。</p><p>注意：这正是罗1:18的第一个字！</p><p>罗1:18「神的忿怒从天上显明在一切<b>不虔不义</b>（ἀσέβειαν καὶ ἀδικίαν）的人身上。」</p><p>罗4:5「只信称<b>不敬虔的人</b>（τὸν ἀσεβῆ）为义的神。」</p><p>同一个字根。</p><p>第一章那些神向他们发忿怒的人——第四章说，神称他们为义。</p><p>这就是福音。</p><p>③ δικαιοῦντα τὸν ἀσεβῆ ——与旧约的正面冲突</p><p>这是全本圣经最大胆的一句话。因为律法明明说：</p><p><b>「不可杀无辜和有义的人，因我必不以恶人为义。」</b>（出23:7）<br><b>「定恶人为义的，定义人为恶的，这都为耶和华所憎恶。」</b>（箴17:15）</p><p>神自己说：「我必不以恶人为义。」<br>保罗说：「祂是那称不敬虔的人为义的神。」</p><p>保罗是在说神自相矛盾吗？</p><p>不是。保罗在第三章已经给了答案：</p><p><b>「神设立耶稣作挽回祭……使人知道他自己为义，也称信耶稣的人为义。」</b>（3:25–26）</p><p>神没有睁一只眼闭一只眼。<br>神在十字架上把罪彻底追讨了——追讨在祂儿子身上。<br>所以祂可以称不敬虔的人为义，而自己仍然是义的。</p><p>④ πιστεύοντι ἐπὶ + 直接受格</p><p>「信靠<b>在</b>……之上」——这个介词结构强调<b>信心的落点</b>。</p><p>信心的价值不在信心本身，在它靠在谁身上。</p>","exp":"<p>弟兄姊妹，4:5这一节，是整本圣经里最不像宗教的一句话。</p><p><b>因为所有的宗教都说：</b>「你要努力，神才会接纳你。」</p><p><b>保罗说：</b>「不作工的人，信那位称不敬虔之人为义的神——他的信就算为义。」</p><p>这一节同时得罪了两种人：</p><p>- <b>得罪了努力的人</b>：你的努力不能换来义<br>- <b>得罪了道德感强的人</b>：神怎么可以称恶人为义？</p><p>但这一节也拯救了两种人：</p><p>- <b>拯救了那些累了的人</b>：你不必再赚了<br>- <b>拯救了那些觉得自己太糟的人</b>：祂正是专门称不敬虔的人为义</p><p><b>经文本身明确表达的：</b> 称义是恩典，不是工资；神所称义的对象是不敬虔的人。<br><b>合理推论的生命应用：</b> 如果神称义的对象是「不敬虔的人」，那我今天来到祂面前，最不需要做的一件事，就是先假装自己够好。</p>"},{"a":6,"z":8,"star":false,"grk":"<p>6 καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·<br>7 μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι·<br>8 μακάριος ἀνὴρ οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.</p>","lit":"<p>6「正如大卫也称那人为<b>有福的</b>——就是神<b>在行为以外，把义算给他</b>的那人：」<br>7「<b>有福了</b>！那些过犯<b>得赦免</b>、罪<b>被遮盖</b>的人；」<br>8「<b>有福了</b>！主<b>断不算他有罪</b>的那人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>有福</td><td>μακάριος</td><td>makarios</td><td>G3107</td><td><b>有福的、蒙福的</b>（登山宝训「八福」同字）</td></tr><tr><td>赦免</td><td>ἀφέθησαν</td><td>aphethēsan</td><td>G863</td><td><b>不定过去被动</b>：被搬走、被免除（ἄφεσις 的动词）</td></tr><tr><td>遮盖</td><td>ἐπεκαλύφθησαν</td><td>epekalyphthēsan</td><td>G1943</td><td>ἐπί + καλύπτω：<b>被盖在上面</b></td></tr><tr><td>不算</td><td>οὐ μὴ λογίσηται</td><td>ou mē logisētai</td><td>G3049</td><td><b>双重否定 ＋ 假设语气：绝对不会算</b></td></tr></table>","gram":"<p>① 保罗为什么引大卫？——「同字连结」的解经法</p><p>犹太拉比有一条解经规则：两处经文若出现同一个关键字，就可以互相解释（gezerah shavah）。</p><p>- 创15:6：<b>算</b>为他的义（正面：算入）<br>- 诗32:2：主<b>不算</b>为有罪（反面：不算入）</p><p>保罗用同一个字 λογίζομαι，把两处经文扣在一起。</p><p>创世记说：神把「义」算进来。<br>诗篇说：神把「罪」不算进去。</p><p>同一本帐簿，两个动作。</p><p>② οὐ μὴ λογίσηται 的双重否定</p><p>希腊文中，οὐ μή + 假设语气是最强的否定形式，意思是「绝对、永远不会」。</p><p>中文「主不算为有罪」读起来很平；原文的语气是：</p><p>「主绝对、绝不、永远不会把罪记到他帐上。」</p><p>③ 三个被动式</p><pre>ἀφέθησαν       被赦免（罪被搬走）\nἐπεκαλύφθησαν  被遮盖（罪被盖住）\nλογίσηται      不被算（罪不入帐）</pre><p>三个动作，主词都是神。</p><p>④ 大卫写诗篇32篇的处境</p><p>诗篇32篇的标题与内容，传统上与大卫在拔示巴事件之后的悔改连在一起（参诗51篇）。</p><p>保罗选的两位证人，一位是「因信被算为义」的亚伯拉罕，<br>另一位是「犯了奸淫与谋杀，却蒙主不算为有罪」的大卫。</p><p>一个是最好的例子，一个是最坏的例子。<br>保罗要说：两端都一样——靠恩典。</p>","exp":"<p>注意大卫的三个动词，是一个完整的过程：</p><table><tr><th>动词</th><th>画面</th><th>意义</th></tr><tr><td><b>赦免</b>（ἀφίημι）</td><td>把重担<b>搬走</b></td><td>罪被移除</td></tr><tr><td><b>遮盖</b>（ἐπικαλύπτω）</td><td>把东西<b>盖起来</b></td><td>罪不再被看见</td></tr><tr><td><b>不算</b>（οὐ λογίζομαι）</td><td>帐簿上<b>不记这一笔</b></td><td>罪不再被追讨</td></tr></table><p>弟兄姊妹，这三个动词回答了三种不同的痛苦：</p><p>- <b>罪的重担</b> → 被搬走了<br>- <b>罪的羞耻</b> → 被遮盖了<br>- <b>罪的追讨</b> → 不再入帐了</p><p>「遮盖」这个字，让人想起旧约的施恩座（כַּפֹּרֶת，字根 כָּפַר＝遮盖）。<br>罗3:25说耶稣就是那个施恩座；罗4:7说罪被遮盖了。<br>这两章是同一个画面的两面。</p><p>【第二段｜4:9–12　时间顺序的证明】</p>"},{"a":9,"z":10,"star":false,"grk":"<p>10 πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ' ἐν ἀκροβυστίᾳ·</p>","lit":"<p>10「那么是<b>怎么</b>算的？是在他<b>在割礼中</b>的时候，还是在他<b>在未受割礼中</b>的时候？不是在割礼中，乃是在未受割礼中。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>怎么</td><td>πῶς</td><td>pōs</td><td>G4459</td><td>如何、在什么情况下</td></tr><tr><td>在割礼中</td><td>ἐν περιτομῇ</td><td>en peritomē</td><td>G4061</td><td><b>状态的表达</b>：处于受割礼的身分中</td></tr><tr><td>未受割礼</td><td>ἀκροβυστία</td><td>akrobystia</td><td>G203</td><td>未受割礼的状态（＝外邦人身分）</td></tr></table>","gram":"<p>① πῶς（怎么）其实是在问「什么时候」</p><p>保罗问的是「在什么情况、什么身分底下」被算为义的。</p><p>② 这是全章最漂亮的一击：一个纯粹的年代学论证</p><table><tr><th>事件</th><th>出处</th><th>年龄</th></tr><tr><td>信神，算为义</td><td>创15:6</td><td>约85岁前</td></tr><tr><td>以实玛利出生</td><td>创16:16</td><td>86岁</td></tr><tr><td>受割礼</td><td>创17:24</td><td><b>99岁</b></td></tr></table><p>中间至少隔了十三、四年。</p><p>保罗不需要辩论神学。他只需要请你翻书。</p>","exp":"<p>弟兄姊妹，这一段的杀伤力在于：它完全不需要相信保罗，只需要相信创世记。</p><p>犹太人说：你要先受割礼，成为神的子民，才能被神接纳。</p><p>保罗说：那你们的祖宗呢？他被算为义的那一天，他是什么身分？</p><p>答案是：外邦人。</p><p>神算亚伯拉罕为义的那一天，他跟今天任何一个未受割礼的希腊人、罗马人、中国人，身分是一样的。</p>"},{"a":11,"z":12,"star":false,"grk":"<p>11 καὶ σημεῖον ἔλαβεν περιτομῆς σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ…</p>","lit":"<p>11「并且他领受了割礼的<b>记号</b>，作他在未受割礼时那因信之义的<b>印</b>……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>记号</td><td>σημεῖον</td><td>sēmeion</td><td>G4592</td><td>—</td><td>指向别的东西的标记</td><td>割礼指向那已成的事</td></tr><tr><td>印证</td><td>σφραγίς</td><td>sphragis</td><td>G4973</td><td>—</td><td><b>印章、封印</b></td><td>官方认证的盖章</td></tr><tr><td>踪迹</td><td>ἴχνος</td><td>ichnos</td><td>G2487</td><td>—</td><td><b>脚印</b></td><td>「按……脚印去行」</td></tr></table>","gram":"<p>① σφραγίς（印）的第一世纪画面</p><p>在罗马世界，印章（sphragis）用于：</p><p>- 契约签订后<b>盖印</b>确认<br>- 货物封条，证明未被动过<br>- 官方文件的认证</p><p>关键在于顺序：</p><p>印章从来不是在契约之前盖的。<br>印章永远是在事情已经成立之后，盖上去确认的。</p><p>保罗说：割礼就是那个印。</p><p>② σημεῖον 与 σφραγίς 的并列</p><p>- <b>σημεῖον（记号）</b>＝ 指向某件事<br>- <b>σφραγίς（印证）</b>＝ 证实某件事</p><p>两个字都默认：那件事已经先发生了。</p><p>③ ἴχνος（脚印）的画面</p><p>4:12「按……踪迹去行」——στοιχέω τοῖς ἴχνεσιν，字面是「踩着他的脚印走」。</p><p>保罗说：真正的亚伯拉罕子孙，不是有他血统的人，是踩着他脚印走的人。<br>而他的第一个脚印，是在他还没有受割礼的时候踩下的。</p>","exp":"<p>这一段完成了一个惊人的翻转：</p><p>犹太人说：亚伯拉罕是我们的父，外邦人若要有份，必须先受割礼加入我们。</p><p>保罗说：</p><p>亚伯拉罕先是「未受割礼而信之人的父」（4:11），<br>然后才是「受割礼之人的父」（4:12）。</p><p>顺序反过来了。</p><p>而且4:12加了一个限定：他作受割礼之人的父，只限于那些「按亚伯拉罕未受割礼而信之踪迹去行的人」。</p><p>换句话说：血统不够。你必须也有他的信心。</p><p>这与第二章2:28–29完全呼应：「外面作犹太人的，不是真犹太人。」</p><p>今天的应用同样尖锐：</p><p>- 受洗是印，不是条件<br>- 会员身分是印，不是条件<br>- 那些属灵的记号都是好的、都是神所设立的——<b>但它们是盖在后面的章，不是排在前面的门票。</b></p><p>【第三段｜4:13–17　应许不凭律法】</p>"},{"a":13,"z":13,"star":false,"grk":"<p>Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως.</p>","lit":"<p>「因为那应许——就是他要作<b>世界的承受者</b>——并不是借着律法临到亚伯拉罕或他的后裔，乃是借着信的义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>应许</td><td>ἐπαγγελία</td><td>epangelia</td><td>G1860</td><td><b>主动提出的承诺</b>（不是回应请求的答应）</td></tr><tr><td>承受</td><td>κληρονόμος</td><td>klēronomos</td><td>G2818</td><td>κλῆρος（签、产业）+ νέμω：<b>继承人</b></td></tr><tr><td>世界</td><td>κόσμος</td><td>kosmos</td><td>G2889</td><td>全世界</td></tr></table>","gram":"<p>① ἐπαγγελία 与 συνθήκη 的差别</p><p>希腊世界有两个字可用于「约」：</p><p>- <b>συνθήκη</b>＝双方谈判达成的协议（bilateral）<br>- <b>διαθήκη／ἐπαγγελία</b>＝<b>单方面立定的遗嘱／应许</b>（unilateral）</p><p>七十士译本刻意选用 διαθήκη 来翻译希伯来文的 בְּרִית（berith，约）——因为神的约不是谈判来的，是神自己立的。</p><p>应许的性质决定了它的稳固性：一份需要双方履约的合同，只要一方失败就破裂；<br>一份单方面的遗嘱，只取决于立嘱者。</p><p>② κληρονόμος κόσμου（承受世界）是从哪里来的？</p><p>创世记的应许包括：</p><p>- 地土（创12:7、13:15、15:18）<br>- 万国因你得福（创12:3、22:18）<br>- 多国的父（创17:5）</p><p>「承受世界」是保罗对这些应许的<b>综合概括</b>——这在当时犹太传统中已有先例（如《便西拉智训》44:21；《禧年书》32:19）。</p><p>保罗在罗8:17把这条线接到我们身上：「既是儿女，便是后嗣，就是神的后嗣，和基督同作后嗣。」</p>","exp":"<p>保罗在此把论证推进了一层：</p><p>前面谈的是「义」怎么来的；现在谈的是「产业」怎么来的。</p><p>如果连义都是白白得的，那产业当然也是白白得的。<br>恩典是一整套逻辑，不是零星的优惠。</p>"},{"a":14,"z":15,"star":false,"grk":"<p>14 εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·<br>15 ὁ γὰρ νόμος ὀργὴν κατεργάζεται· οὗ δὲ οὐκ ἔστιν νόμος οὐδὲ παράβασις.</p>","lit":"<p>14「因为若那些出于律法的人才是后嗣，信就<b>被掏空了</b>，应许也<b>被作废了</b>。」<br>15「因为律法<b>制造出</b>忿怒；哪里没有律法，那里也没有<b>跨越界线</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>归于虚空</td><td>κεκένωται</td><td>kekenōtai</td><td>G2758</td><td>κενόω：<b>被倒空、被掏空</b>（腓2:7「虚己」同字）</td></tr><tr><td>废弃</td><td>κατήργηται</td><td>katērgētai</td><td>G2673</td><td><b>被使之失效</b>（3:3、3:31同字）</td></tr><tr><td>惹动</td><td>κατεργάζεται</td><td>katergazetai</td><td>G2716</td><td>κατά + ἐργάζομαι：<b>制造出、产生出</b>（强调结果）</td></tr><tr><td>过犯</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω：<b>跨越界线</b>（明知有线而踏过去）</td></tr></table>","gram":"<p>① 两个完成被动式的重量</p><p>- <b>κεκένωται</b>（信被掏空）<br>- <b>κατήργηται</b>（应许被作废）</p><p>完成式表示：一旦这样，就永久成为这个状态。</p><p>保罗在说：这不是「信会打点折扣」，是「信整个被清空」。</p><p>② κενόω 的惊人平行</p><p>这个字在腓立比书2:7用在耶稣身上：「反倒虚己（ἐκένωσεν）。」</p><p>基督为我们虚己，好叫我们的信不至于虚空。</p><p>③ παράβασις 与 ἁμαρτία 的差别</p><p>- <b>ἁμαρτία</b>（罪）＝射不中靶（普遍的罪性）<br>- <b>παράβασις</b>（过犯）＝<b>跨越一条明确画出的线</b></p><p>保罗在4:15说：「哪里没有律法，那里就没有过犯。」</p><p>注意：他没有说「哪里没有律法，那里就没有罪」！</p><p>这是本节最容易被误读的地方。<br>没有律法的地方仍然有罪（罗5:13–14已说明），但没有「跨越明线」这种特定形式的罪。<br>律法把罪从模糊变成清楚——所以律法加重了罪的性质。</p>","exp":"<p>保罗为什么说「律法是惹动忿怒的」？</p><p>因为律法把界线画出来了。画出来之后，人踩过去，那就不只是「不好」，是「违法」。</p><p>一条路上没有速限标志，你开90公里，是危险。<br>一条路上写着「限速60」，你开90公里，是违规。</p><p>标志没有让你开得更快。标志让你的快，变成罪状。</p><p>所以保罗的结论是：如果产业要靠律法来得，那我们得到的不是产业，是忿怒。</p>"},{"a":16,"z":17,"star":true,"grk":"<p>16 Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι…<br>17 …κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα.</p>","lit":"<p>16「因此就本于信，好叫它<b>照着恩典</b>，使那应许对一切后裔都是<b>确定不移的</b>……」<br>17「……在他所信的神面前——那位<b>使死人活过来、并且呼叫那不存在的，如同存在的</b>神。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>定然</td><td>βέβαιος</td><td>bebaios</td><td>G949</td><td>βαίνω（走、站）</td><td><b>稳固的、站得住的、有法律效力的</b></td><td>商业用语：担保有效</td></tr><tr><td>叫死人复活</td><td>ζῳοποιοῦντος</td><td>zōopoiountos</td><td>G2227</td><td>ζωή（生命）+ ποιέω（造）</td><td><b>使之活过来</b></td><td>现在分词：<b>祂一直在做的事</b></td></tr><tr><td>使无变为有</td><td>καλοῦντος τὰ μὴ ὄντα ὡς ὄντα</td><td>—</td><td>G2564</td><td>καλέω（呼叫）</td><td><b>呼叫那不存在的，如同存在的</b></td><td>创造的语言</td></tr></table>","gram":"<p>① βέβαιος 的商业意义</p><p>这个字在第一世纪的契约文书中，指「具有法律效力、可强制执行的担保」。</p><p>保罗说：应许之所以「定然」（βεβαίαν），正是因为它本于信、属乎恩。</p><p>这是全章的逻辑核心：</p><p>如果应许凭我的表现 → 我的表现会变 → 应许就不稳<br>如果应许凭神的恩典 → 神不会变 → 应许就稳如泰山</p><p>恩典不是神的软弱，恩典是应许唯一可能稳固的方式。</p><p>② 两个现在分词，描写神是谁</p><pre>τοῦ ζῳοποιοῦντος τοὺς νεκρούς      —— 那使死人活过来的\nκαὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα  —— 那呼叫无有如同有的</pre><p>两个都是现在式分词——不是「祂曾经做过」，是「祂一直是这样的一位」。</p><p>这是圣经对神的两大工作的浓缩：</p><table><tr><th>分词</th><th>神的作为</th><th>圣经例证</th></tr><tr><td>使死人活</td><td><b>复活</b></td><td>出埃及、以西结枯骨、耶稣复活</td></tr><tr><td>呼无为有</td><td><b>创造</b></td><td>创1「神说……就有了」</td></tr></table><p>亚伯拉罕的处境需要哪一位神？</p><p>他一百岁，身体如同已死 → 他需要「叫死人复活」的神<br>撒拉的生育断绝，没有孩子 → 他需要「使无变为有」的神</p><p>保罗对神的描述，完全对准亚伯拉罕的绝境。</p><p>③ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα 的两种理解</p><table><tr><th>理解</th><th>意思</th></tr><tr><td><b>创造性的呼唤</b></td><td>神一呼唤，无就变成有（创1；来11:3）</td></tr><tr><td><b>应许的确定性</b></td><td>神说了，还没发生的事就已经算数了</td></tr></table><p>两者可以并存，且都符合上下文：</p><p>神说「我已经立你作多国的父」（创17:5）的时候，亚伯拉罕有几个儿子？</p><p>一个都没有。</p><p>但神用的是完成式：「我<b>已经</b>立你」。</p><p>④ 创17:5的引文</p><p>「从此以后，你的名不再叫亚伯兰，要叫亚伯拉罕，因为我已立你作多国的父。」</p><p>- <b>亚伯兰（אַבְרָם）</b>＝「尊贵的父」<br>- <b>亚伯拉罕（אַבְרָהָם）</b>＝「多国的父」</p><p>神把他的名字改成「多国的父」的那一天，他连一个儿子都没有。</p><p>从那天起，每一次有人叫他的名字，就是在对着一个没有孩子的老人说：「嘿，多国的父！」</p><p>他等了整整二十五年（创12:4，75岁蒙召；创21:5，100岁得以撒）。</p><p>二十五年，被人叫了二十五年「多国的父」。</p>","exp":"<p>这一节把「信心」的定义往前推了一大步。</p><p>信心不是一种正面思考，不是一种心理状态，不是「我觉得会成」。</p><p>信心是：认识神是谁。</p><p>亚伯拉罕的信心之所以站得住，不是因为他的信心很强，是因为他所信的那位——</p><p>是叫死人复活的神。<br>是使无变为有的神。</p><p>而4:24马上就要说：我们信的，也正是这一位——「我们这信神使我们的主耶稣从死里复活的人」。</p><p>亚伯拉罕的信与基督徒的信，对象完全一样。<br>他信神能使一个死了的身体生出孩子；我们信神使一个死了的身体从坟墓里出来。</p><p>【第四段｜4:18–22　信心的解剖】</p>"},{"a":18,"z":18,"star":false,"grk":"<p>ὃς παρ' ἐλπίδα ἐπ' ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· οὕτως ἔσται τὸ σπέρμα σου.</p>","lit":"<p>「他<b>逆着指望，靠着指望</b>，信了——以致他成为多国的父，正如所说的：『你的后裔将要如此。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>在无可指望的时候</td><td>παρ' ἐλπίδα</td><td>par' elpida</td><td>G1680</td><td>παρά + 直接受格：<b>违反、逆着</b>指望</td></tr><tr><td>因信仍有指望</td><td>ἐπ' ἐλπίδι</td><td>ep' elpidi</td><td>G1680</td><td>ἐπί + 与格：<b>建立在</b>指望之上</td></tr></table>","gram":"<p>★ παρ' ἐλπίδα ἐπ' ἐλπίδι ——全本圣经最美的一个文字对句</p><p>同一个字（ἐλπίς，指望）用了两次，配两个不同的介词：</p><pre>παρ' ἐλπίδα   —— 逆着指望（人的角度：完全没有希望）\nἐπ' ἐλπίδι    —— 靠着指望（神的角度：站在应许上）</pre><p>中文「在无可指望的时候，因信仍有指望」已经译得很好，但看不出这是同一个字的两次运用。</p><p>保罗在说：真正的信心，一只脚踩在绝望里，一只脚踩在应许上。</p><p>信心不是看不见绝望，信心是看见了绝望，仍然站在应许上。</p><p>这是全本圣经对信心最精准的一句描写。</p>","exp":"<p>弟兄姊妹，很多人以为信心就是「不要去想那些不好的」。</p><p>保罗说：不是。</p><p>亚伯拉罕的信心，不是他没看见绝望。下一节就要说了：他「想到自己的身体如同已死」。</p><p>他看得清清楚楚。</p><p>他只是同时看见了另一件事：那位说话的神，是叫死人复活的神。</p>"},{"a":19,"z":21,"star":true,"grk":"<p>19 καὶ μὴ ἀσθενήσας τῇ πίστει κατενόησεν τὸ ἑαυτοῦ σῶμα [ἤδη] νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας·<br>20 εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλ' ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ<br>21 καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.</p>","lit":"<p>19「他在信心上没有软弱，<b>仔细察看</b>了自己那已经<b>死透了的</b>身体（他约一百岁了），以及撒拉子宫的<b>死状</b>；」<br>20「面对神的应许，他没有因不信而<b>摇摆不定</b>，反而<b>被赋予能力</b>——借着信，<b>把荣耀归给神</b>，」<br>21「并且<b>被完全充满地确信</b>：神所应许的，祂也<b>有能力</b>成就。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>想到</td><td>κατενόησεν</td><td>katenoēsen</td><td>G2657</td><td>κατά + νοέω</td><td><b>仔细审视、认真思量</b></td><td><b>不是瞄一眼，是盯着看</b></td></tr><tr><td>如同已死</td><td>νενεκρωμένον</td><td>nenekrōmenon</td><td>G3499</td><td>νεκρός（死人）</td><td><b>完成被动分词：已经死透了</b></td><td>极强烈的用字</td></tr><tr><td>生育断绝</td><td>νέκρωσις</td><td>nekrōsis</td><td>G3500</td><td>νεκρός</td><td><b>死亡的状态</b></td><td>名词：撒拉子宫的「死」</td></tr><tr><td>起疑惑</td><td>διεκρίθη</td><td>diekrithē</td><td>G1252</td><td>διά + κρίνω</td><td><b>被撕成两半、摇摆不定</b></td><td>雅1:6「疑惑的人」同字</td></tr><tr><td>得坚固</td><td>ἐνεδυναμώθη</td><td>enedynamōthē</td><td>G1743</td><td>ἐν + δύναμις</td><td><b>被赋予能力</b>（被动！）</td><td>不是自己变强，是被加力</td></tr><tr><td>满心相信</td><td>πληροφορηθείς</td><td>plērophorētheis</td><td>G4135</td><td>πλήρης + φέρω</td><td><b>被完全装满、被载到满</b></td><td>被动分词</td></tr></table>","gram":"<p>① κατανοέω：他不是逃避现实，他是直视现实</p><p>这个字的意思是「仔细地、专注地观察」。</p><p>（同字用于太7:3「看见弟兄眼中的刺」；来3:1「思想我们所认为使者、为大祭司的耶稣」）</p><p>保罗刻意告诉我们：亚伯拉罕把自己的身体看得清清楚楚。</p><p>信心不是自我催眠。信心是把事实看透，然后看见一位更大的事实。</p><p>② νενεκρωμένον 完成被动分词的力度</p><p>不是「有点老」「不太行了」，是「<b>已经死透了、且维持在死的状态</b>」。</p><p>保罗用了两个「死」字（νεκρόω／νέκρωσις）来形容这对老夫妇的生育能力。</p><p>这正好对上4:17：「那叫死人复活的神。」</p><p>保罗是故意的：他先让你看见两具「死了」的身体，好叫「叫死人复活的神」这句话有具体的内容。</p><p>③ διακρίνω：不是「怀疑」，是「被撕成两半」</p><p>这个字的字面意思是「一分为二」。</p><p>用在心里，指的是<b>心被分裂成两边，来回摇摆</b>。</p><p>（雅1:6「疑惑的人，就像海中的波浪，被风吹动翻腾」——同字）</p><p>不信不一定是「我不相信」，更常见的是「我一半相信、一半不相信」。</p><p>④ ἐνεδυναμώθη：被动语态的关键</p><p>「因信心里得坚固」——原文是被动式：<b>他被赋予了能力</b>。</p><p>这一点极其重要：</p><p>亚伯拉罕不是靠意志力把自己撑强的。<br>是他信的时候，力量被加给他。</p><p>信心不是我们生产能力的引擎，信心是我们接受能力的管道。</p><p>⑤ δοὺς δόξαν τῷ θεῷ（将荣耀归给神）与1:21的完全逆转</p><p>罗1:21：「他们虽然知道神，却不当作神荣耀祂（οὐχ ὡς θεὸν ἐδόξασαν）。」<br>罗4:20：「将荣耀归给神（δοὺς δόξαν τῷ θεῷ）。」</p><p>保罗用了三章半来描写「不荣耀神」的世界；在第四章，他终于给我们看见一个荣耀神的人。</p><p>而他荣耀神的方式，不是献祭，不是奉献，不是服事——<br>是相信。</p><p>原来相信神所应许的，本身就是把荣耀归给神。</p><p>因为不信，等于说「神做不到」；信，等于说「祂做得到」。</p><p>⑥ πληροφορέω 的画面</p><p>这个字的字面是「被装满到顶」，也用于「船只满帆前行」。</p><p>保罗描写的信心不是勉强挤出来的，是被神的应许灌满的。</p>","exp":"<p>弟兄姊妹，这三节是全本圣经对信心最完整的解剖。我们把它拆开来看：</p><table><tr><th>层面</th><th>经文</th><th>内容</th></tr><tr><td><b>信心正视事实</b></td><td>4:19</td><td>他「仔细察看」了自己死透的身体</td></tr><tr><td><b>信心不摇摆</b></td><td>4:20</td><td>他没有被撕成两半</td></tr><tr><td><b>信心是被加力的</b></td><td>4:20</td><td>他「被赋予能力」（被动式）</td></tr><tr><td><b>信心荣耀神</b></td><td>4:20</td><td>他把荣耀归给神</td></tr><tr><td><b>信心的焦点是神的能力</b></td><td>4:21</td><td>「神所应许的，<b>祂</b>必能做成」</td></tr></table><p>请注意最后一句的重点：不是「这件事一定会成」，是「<b>祂</b>有能力成就」。</p><p>信心的焦点不在事情上，在神身上。</p><p>这也解释了一个常见的困惑：</p><p>创世记其实记载了亚伯拉罕好几次的失败——两次因害怕谎称撒拉是妹妹（创12、20）、听从撒拉纳夏甲（创16）、听见应许时俯伏喜笑（创17:17）。</p><p>保罗为什么完全不提？</p><p>因为保罗不是在写亚伯拉罕的传记，是在解释创15:6这一节。<br>而且更深的原因是：神称他为义之后，神看他的方式改变了。</p><p>「主不算为有罪的，这人是有福的。」（4:8）</p><p>保罗在第四章对亚伯拉罕的描写，就是那本「不算为有罪」的帐簿长什么样子。</p>"},{"a":22,"z":24,"star":false,"grk":"<p>23 Οὐκ ἐγράφη δὲ δι' αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ<br>24 ἀλλὰ καὶ δι' ἡμᾶς, οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν</p>","lit":"<p>22「所以，<b>这就算为他的义</b>。」<br>23「而『<b>算为他</b>』这句话，<b>不是单为他写的</b>，」<br>24「<b>也是为我们写的</b>——义<b>将要被算给</b>我们这些信靠那位<b>叫我们主耶稣从死里复活之神</b>的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>写</td><td>ἐγράφη</td><td>egraphē</td><td>G1125</td><td><b>不定过去被动：被写下来了</b></td></tr><tr><td>将来得算</td><td>μέλλει λογίζεσθαι</td><td>mellei logizesthai</td><td>G3195</td><td><b>即将／必然要被算</b></td></tr><tr><td>使……复活</td><td>τὸν ἐγείραντα</td><td>ton egeiranta</td><td>G1453</td><td>ἐγείρω：<b>那位叫……起来的</b></td></tr></table>","gram":"<p>① 「不是单为他写的」——保罗的解经观</p><p>这是新约中一段极重要的「圣经观」宣告：</p><p>旧约的记载不只是历史，是为我们写的。</p><p>（比较林前10:11「这些事……都是为警戒我们写的」；罗15:4「从前所写的圣经都是为教训我们写的」）</p><p>② τὸν ἐγείραντα Ἰησοῦν ἐκ νεκρῶν ——信心对象的接续</p><p>请把4:17与4:24放在一起看：</p><pre>4:17  亚伯拉罕所信的，是那 叫死人复活 的神\n4:24  我们所信的，是那 使耶稣从死里复活 的神</pre><p>同一位神。同一种信心。同一个焦点。</p><p>亚伯拉罕信神能从一具「死了」的身体生出生命；<br>我们信神从一座坟墓里叫出了生命。</p><p>中间隔了两千年，信的是同一件事。</p>","exp":"<p>保罗在4:23–24做了一个温柔的转身。</p><p>前面二十二节，他一直在讲一个四千年前的人。</p><p>然后他说：</p><p>「这句话不是单为他写的……也是为我们写的。」</p><p>弟兄姊妹，这意味着什么？</p><p>创世记15:6那一节，神在写的时候，就已经想到你了。</p>"},{"a":25,"z":25,"star":true,"grk":"<p>ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.</p>","lit":"<p>「祂<b>被交付</b>了，因着我们的<b>过犯</b>；并且祂<b>被使复活</b>了，因着我们的<b>称义</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>被交给人</td><td>παρεδόθη</td><td>paredothē</td><td>G3860</td><td>παρά + δίδωμι：<b>被交付出去</b>（不定过去被动）</td></tr><tr><td>过犯</td><td>παράπτωμα</td><td>paraptōma</td><td>G3900</td><td>παρά + πίπτω（跌倒）：<b>失足、跌倒过线</b></td></tr><tr><td>复活</td><td>ἠγέρθη</td><td>ēgerthē</td><td>G1453</td><td><b>被使起来</b>（不定过去被动）</td></tr><tr><td>称义</td><td>δικαίωσις</td><td>dikaiōsis</td><td>G1347</td><td><b>称义的行动／宣告</b>（新约仅罗4:25、5:18两次）</td></tr></table>","gram":"<p>① 完美的对称结构</p><pre>ὃς παρεδόθη  διὰ τὰ παραπτώματα  ἡμῶν\n   （被交付） （因着）（我们的过犯）\nκαὶ ἠγέρθη   διὰ τὴν δικαίωσιν   ἡμῶν\n   （被复活） （因着）（我们的称义）</pre><p>两个被动动词 ＋ 两个 διά ＋ 两个 ἡμῶν。</p><p>这种对称在保罗书信中极为罕见，多数学者认为这是保罗引用的一段<b>早期教会信仰告白</b>——若是如此，它比罗马书本身更古老。</p><p>② παρεδόθη 与以赛亚书53章的连结</p><p>七十士译本以赛亚书53章用了 παραδίδωμι 三次：</p><p>- 赛53:6 LXX「耶和华使我们众人的罪孽都归在他身上」<br>- 赛53:12 LXX「他将命倾倒，以致于死……他被交付（παρεδόθη）」</p><p>保罗用的是以赛亚书53章的字。这一句话背后，站着那位受苦的仆人。</p><p>③ διά + 直接受格的关键解释</p><p>两个 διά 都接直接受格，意思是「<b>因为、由于</b>」。</p><p>这造成一个解经上的重要问题：</p><p>「祂被交付，<b>因为</b>我们的过犯」——这很好懂：我们的罪是祂被交的原因。</p><p>但「祂复活，<b>因为</b>我们的称义」——这是什么意思？难道我们的称义是祂复活的原因？</p><p>两种主要理解：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>目的性理解</b>（多数译本）</td><td>「为叫我们称义」——复活是为了成就我们的称义（和合本、多数中英译本）</td></tr><tr><td><b>回顾性理解</b></td><td>「因为我们的称义（已经在十字架上成就了）」——复活是称义已成的<b>证明</b></td></tr></table><p>两者其实互补：</p><p>十字架付清了帐；复活是那张盖了章的收据。</p><p>如果耶稣没有复活，我们永远不知道那笔帐到底付清了没有。<br>祂从坟墓里出来，就是天上发出的一张收据：</p><p>「已收讫。」</p><p>④ 为什么保罗用「过犯」（παράπτωμα）而不用「罪」（ἁμαρτία）？</p><p>παράπτωμα 的字面是「跌倒在旁边」「失足」——强调<b>具体的、一次一次的</b>过失。</p><p>呼应4:15的 παράβασις（跨越界线）。</p>","exp":"<p>这一节是整章的落点，也是把亚伯拉罕与我们接在一起的那个接头。</p><p>保罗讲了二十四节的亚伯拉罕，最后一节突然转到耶稣——为什么？</p><p>因为前面所有的问题，都在这一节得到答案：</p><table><tr><th>前面的问题</th><th>4:25的答案</th></tr><tr><td>神凭什么称不敬虔的人为义？（4:5）</td><td><b>因为祂的儿子被交付了，为我们的过犯</b></td></tr><tr><td>那些不算为有罪的罪，去哪里了？（4:8）</td><td><b>算到祂身上了</b></td></tr><tr><td>我怎么知道我真的被算为义了？（4:24）</td><td><b>因为祂复活了——收据在这里</b></td></tr></table><p>弟兄姊妹，这就是为什么第四章一定要以复活结尾。</p><p>因为亚伯拉罕所信的那位「叫死人复活的神」（4:17），<br>在一个星期天的早晨，亲自示范了一次。</p>"}],"5":[{"a":1,"z":1,"star":true,"grk":"<p>Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ</p>","lit":"<p>「所以，我们既<b>已被称义</b>了，本于信——我们<b>就有</b>了与神之间的<b>和平</b>，借着我们的主耶稣基督。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>既称义</td><td>δικαιωθέντες</td><td>dikaiōthentes</td><td>G1344</td><td>δίκαιος</td><td><b>不定过去被动分词：已经被宣告为义</b></td><td>一次完成、定案的事</td></tr><tr><td>相和</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>—
