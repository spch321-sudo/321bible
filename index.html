</td><td><b>和平</b>（LXX 译希伯来文 שָׁלוֹם）</td><td><b>不是心情，是状态</b></td></tr><tr><td>得与……相和</td><td>πρὸς τὸν θεόν</td><td>pros ton theon</td><td>G4314</td><td>—</td><td><b>面对面地朝向神</b></td><td>关系性的介词</td></tr></table>","gram":"<p>① δικαιωθέντες：不定过去被动分词</p><p>- <b>不定过去式</b>：一个已经完成的事件，不是持续进行的过程<br>- <b>被动式</b>：是神做的，不是我做的<br>- <b>分词</b>：这是主句的<b>前提</b>，不是主句本身</p><p>中文的「既」译得极好：「既然……」——这件事已经定了，我们是站在这个定案上往下说。</p><p>② εἰρήνη 不是心情，是状态</p><p>这是本节最重要、也最常被误读的一点。</p><p>希腊文 εἰρήνη 在七十士译本中翻译希伯来文 <b>שָׁלוֹם（shalom）</b>——</p><p>שָׁלוֹם 的字根意思是「完整、无缺、修复到位」，用于：</p><p>- 战争结束（书9:15）<br>- 债务还清<br>- 关系修复</p><p>「与神相和」不是说「我觉得很平安」。<br>是说：战争结束了。停战协定已经签了。</p><p>你的感觉会起起伏伏，但那份停战协定不会因为你今天心情不好就作废。</p><p>③ πρὸς τὸν θεόν 的介词</p><p>πρός + 直接受格，表示<b>面对面的关系方向</b>。</p><p>（约1:1「道与神同在」用的正是 πρὸς τὸν θεόν——<b>面对面的关系</b>）</p><p>④ ★ 本节的抄本问题：ἔχομεν 还是 ἔχωμεν？</p><p>这是新约中最著名的抄本异文之一，必须诚实处理。</p><table><tr><th>读法</th><th>文法</th><th>意思</th></tr><tr><td><b>ἔχομεν</b></td><td>直说语气</td><td>「我们<b>有</b>了与神的和平」（<b>陈述事实</b>）</td></tr><tr><td><b>ἔχωμεν</b></td><td>假设语气</td><td>「让我们<b>保持</b>与神的和平」（<b>劝勉</b>）</td></tr></table><p>两者在希腊文中只差一个字母（ο／ω），而在第一世纪，这两个母音的发音已经接近相同——</p><p>一个抄写员在听写时，几乎不可能分辨。</p><p>证据评估：</p><p>- <b>抄本外证</b>：较早的抄本多支持 ἔχωμεν（假设语气）<br>- <b>内证（上下文与保罗的思路）</b>：<b>强烈支持 ἔχομεν（直说语气）</b></p><p>理由：</p><p>1. 5:1–11整段都是<b>陈述</b>我们所拥有的（我们得进入、我们欢喜、爱已浇灌），<b>不是劝勉</b><br>2. 保罗在罗马书中，劝勉（12–16章）与教义（1–11章）是分开的<br>3. 5:2「因信得进入现在所站的这恩典中」是完成式直说语气，5:1若是劝勉会很突兀</p><p>多数现代译本与注释（含和合本）采直说语气。</p><p>讲台诚信提醒：可以说「这里有一个古老的抄本问题，两种读法只差一个字母」，但不要说「原文其实是……而中文翻错了」——因为多数学者的判断与和合本一致。</p>","exp":"<p>弟兄姊妹，注意保罗的顺序：</p><pre>称义（法庭）  →  相和（关系）</pre><p>称义是法官的宣判；相和是父亲的拥抱。</p><p>你可以在法庭上被判无罪，然后跟法官一辈子不再见面。</p><p>但保罗说：不是这样。</p><p>神不只把你判无罪，祂还跟你和好了。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>δι' οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν [τῇ πίστει] εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν καὶ καυχώμεθα ἐπ' ἐλπίδι τῆς δόξης τοῦ θεοῦ.</p>","lit":"<p>「借着祂，我们也<b>已经得着了引见</b>，进入这恩典中——我们就<b>站立</b>在其中；并且我们<b>夸口</b>，在神荣耀的盼望上。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>进入</td><td>προσαγωγή</td><td>prosagōgē</td><td>G4318</td><td>πρός + ἄγω（带领）</td><td><b>引见、带到面前</b></td><td><b>宫廷用语</b>（见下）</td></tr><tr><td>得</td><td>ἐσχήκαμεν</td><td>eschēkamen</td><td>G2192</td><td>ἔχω</td><td><b>完成式：已经得着，且一直持有</b></td><td>不会被收回</td></tr><tr><td>所站</td><td>ἑστήκαμεν</td><td>hestēkamen</td><td>G2476</td><td>ἵστημι</td><td><b>完成式：已经站定，且持续站着</b></td><td>站住了</td></tr><tr><td>欢欢喜喜</td><td>καυχώμεθα</td><td>kauchōmetha</td><td>G2744</td><td>—</td><td><b>夸口、以…为荣</b></td><td>3:27被关在门外的那个字</td></tr></table>","gram":"<p>★ 亮光一：προσαγωγή ——引见官</p><p>这个字在新约只出现三次，全部在保罗书信：罗5:2、弗2:18、弗3:12。</p><p>在波斯与希腊化王朝的宫廷制度中，有一个官职叫 προσαγωγεύς——</p><p>「引见官」。他的工作，是把人带到王的面前。</p><p>没有他，你连王宫的门都摸不到。</p><p>以斯帖记4:11：「凡未蒙召见擅入内院见王的，无论男女必被治死；除非王向他伸出金杖，不得存活。」</p><p>保罗说：耶稣就是那位引见官。</p><p>而更惊人的是——祂不是把我们带到门口就走了。</p><p>★ 亮光二：两个完成式</p><pre>ἐσχήκαμεν  （我们已经得着引见，且一直持有）\nἑστήκαμεν  （我们已经站定，且持续站着）</pre><p>完成式在希腊文中，表示「过去完成的动作，效果持续至今」。</p><p>保罗没有说「我们曾经被带进去过」。<br>他说：<b>我们被带进去了，而且我们现在还站在那里</b>。</p><p>不是访客，是常驻。</p><p>★ 亮光三：καυχώμεθα ——夸口回来了</p><p>这个字，我们在3:27见过：</p><p>「既是这样，哪里能<b>夸口</b>呢？没有可夸的了（被关在门外了）。」</p><p>现在在5:2、5:3、5:11，它回来了三次。</p><p>保罗不是要消灭夸口。他是要换掉夸口的<b>对象</b>。</p><p>靠行为的夸口，被关在门外（3:27）。<br>靠恩典的夸口，被请进来（5:2、11）。</p>","exp":"<p>弟兄姊妹，5:1–2给了称义的三个结果，而它们有时间顺序：</p><table><tr><th>时态</th><th>内容</th><th>经文</th></tr><tr><td><b>过去</b></td><td>战争结束了（相和）</td><td>5:1</td></tr><tr><td><b>现在</b></td><td>我站在恩典中（进入）</td><td>5:2上</td></tr><tr><td><b>将来</b></td><td>我盼望神的荣耀</td><td>5:2下</td></tr></table><p>注意最后一项：「盼望<b>神的荣耀</b>」。</p><p>罗3:23说什么？「世人都犯了罪，<b>亏缺了神的荣耀</b>。」</p><p>我们亏缺的那样东西，现在成了我们的盼望。</p><p>从「亏缺神的荣耀」（3:23）到「盼望神的荣耀」（5:2）——<br>这就是福音在两章之间走完的距离。</p><p>【第二段｜5:3–5　患难的链条】</p>"},{"a":3,"z":4,"star":false,"grk":"<p>3 οὐ μόνον δέ, ἀλλὰ καὶ καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,<br>4 ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.</p>","lit":"<p>3「不仅如此，我们也在<b>挤压</b>中夸口，因为<b>知道</b>挤压<b>制造出</b>忍耐，」<br>4「忍耐制造出<b>经过试验的品格</b>，经过试验的品格制造出盼望。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>患难</td><td>θλῖψις</td><td>thlipsis</td><td>G2347</td><td>θλίβω（挤压）</td><td><b>压力、挤压、重压</b></td><td>原意是<b>压榨</b>（如压橄榄、压葡萄）</td></tr><tr><td>生</td><td>κατεργάζεται</td><td>katergazetai</td><td>G2716</td><td>κατά + ἐργάζομαι</td><td><b>制造出、产出</b>（强调结果）</td><td>4:15同字</td></tr><tr><td>忍耐</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td>ὑπό（在下）+ μένω（存留）</td><td><b>在重压底下站住不跑</b></td><td>2:7同字</td></tr><tr><td>老练</td><td>δοκιμή</td><td>dokimē</td><td>G1382</td><td>δοκιμάζω（试验金属）</td><td><b>经过火炼、验明为真的品质</b></td><td>见下</td></tr><tr><td>知道</td><td>εἰδότες</td><td>eidotes</td><td>G1492</td><td>οἶδα</td><td><b>确知</b>（不是猜测）</td><td>这是欢喜的<b>根据</b></td></tr></table>","gram":"<p>① θλῖψις 的画面：压榨</p><p>这个字的动词 θλίβω 是「挤压」——用于压橄榄出油、压葡萄出酒。</p><p>保罗选的不是「打击」，是「挤压」。</p><p>挤压的重点不是破坏，是<b>把里面的东西挤出来</b>。</p><p>而挤压最诚实的地方在于：它只能挤出里面本来就有的东西。</p><p>② δοκιμή 的冶金背景</p><p>这个字来自 δοκιμάζω——<b>验金属</b>。</p><p>古代验金：把金属放进火里，杂质浮上来被撇去，剩下的就是 δόκιμος（验明为真的）。</p><p>（彼前1:7「你们的信心既被试验，就比那被火试验仍然能坏的金子更显宝贵」——同字根）</p><p>「老练」不是「经验丰富」，是<b>经过火之后还在的那个部分</b>。</p><p>③ κατεργάζεται 现在式，只出现一次</p><p>注意：4节的「生」在原文中省略了动词，是承接3节的 κατεργάζεται。</p><p>所以整条链子是<b>一个动词</b>带下来的：</p><pre>θλῖψις  →  ὑπομονή  →  δοκιμή  →  ἐλπίς\n挤压    →  在压下站住  →  验明为真  →  盼望</pre><p>④ 一个必须说清楚的平衡：「在患难中」不等于「因为患难」</p><p>原文是 ἐν ταῖς θλίψεσιν——「<b>在</b>患难中」，不是「<b>为了</b>患难」。</p><p>保罗没有说患难是好的。<br>保罗说：在患难<b>里面</b>，我们仍然可以夸口——因为我们<b>知道</b>神在其中做什么。</p>","exp":"<p>弟兄姊妹，5:3是全章最容易被误用的一节。</p><p>它常被拿来对受苦的人说：「你要喜乐啊！患难生忍耐嘛！」</p><p>这种用法是残忍的，而且违背原文。</p><p>请注意三件事：</p><p>第一，保罗说的是「<b>在</b>患难中」，不是「<b>为着</b>患难」。</p><p>第二，欢喜的根据是「<b>知道</b>」（εἰδότες）——是对神的认识，不是对痛苦的麻木。</p><p>第三，这一整条链子是<b>神</b>在做的（κατεργάζεται），不是我们要努力挤出来的。</p><p>这节经文是给<b>受苦的人自己</b>用的，不是给旁观者拿来说教用的。</p><p>而这条链子最诚实的地方在于：</p><p>挤压只能挤出里面本来就有的东西。</p><p>所以患难不「制造」品格——患难<b>显明</b>品格，然后神在那个显明出来的地方动工。</p>"},{"a":5,"z":5,"star":true,"grk":"<p>ἡ δὲ ἐλπὶς οὐ καταισχύνει, ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.</p>","lit":"<p>「而这盼望<b>不使人蒙羞</b>，因为神的爱<b>已经被浇灌</b>在我们心里——借着那<b>已赐给</b>我们的圣灵。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>羞耻</td><td>καταισχύνει</td><td>kataischynei</td><td>G2617</td><td>κατά + αἰσχύνη（羞耻）</td><td><b>使人蒙羞、使人失望丢脸</b></td><td>荣辱文化中的重话</td></tr><tr><td>浇灌</td><td>ἐκκέχυται</td><td>ekkechytai</td><td>G1632</td><td>ἐκ + χέω（倒）</td><td><b>完成被动式：已经被倒出来</b></td><td>见下</td></tr><tr><td>神的爱</td><td>ἡ ἀγάπη τοῦ θεοῦ</td><td>—</td><td>G26</td><td>—</td><td><b>神对我们的爱</b>（主词所有格）</td><td>见下</td></tr><tr><td>赐给</td><td>δοθέντος</td><td>dothentos</td><td>G1325</td><td>δίδωμι</td><td><b>不定过去被动分词：已经被赐下</b></td><td>已成的事实</td></tr></table>","gram":"<p>① ἐκκέχυται：完成被动式</p><pre>过去完成的动作 + 效果持续到现在</pre><p>不是「神的爱曾经浇灌过我们」。<br>是：那一桶已经倒下来了，而且到今天还是湿的。</p><p>② ἐκχέω 的旧约背景</p><p>这个字在七十士译本中用于一个极重要的应许：</p><p><b>「以后，我要将我的灵</b>浇灌<b>凡有血气的。」</b>（珥2:28；徒2:17引用）</p><p>保罗在5:5把「圣灵的浇灌」与「神的爱的浇灌」连在一起：<br>圣灵来的时候，带来的第一样东西，就是神的爱。</p><p>③「神的爱」是谁爱谁？</p><table><tr><th>读法</th><th>意思</th></tr><tr><td><b>主词所有格</b></td><td><b>神对我们的爱</b>（多数注释、和合本语意）</td></tr><tr><td>受词所有格</td><td>我们对神的爱</td></tr></table><p>支持「神对我们的爱」的决定性理由：</p><p>- <b>下一节（5:6–8）立刻展开解释</b>：「惟有基督在我们还作罪人的时候为我们死，<b>神的爱</b>就在此向我们显明了。」<br>- 保罗在5:8用同一个词组 τὴν ἑαυτοῦ ἀγάπην（祂自己的爱）</p><p>这一节不是说「圣灵让我更爱神了」，是说「圣灵让我知道神多爱我」。</p><p>④ 这是罗马书第一次正式提到圣灵的工作</p><p>罗马书1–4章几乎没有讲圣灵（2:29提过一次「在乎灵」）。</p><p>5:5是圣灵第一次以「赐下者」的身分出现，并且从第八章开始，圣灵将成为整卷书的主角（第8章提到圣灵约20次）。</p>","exp":"<p>弟兄姊妹，5:5回答了一个实际的问题：</p><p>「你说患难生忍耐、忍耐生老练、老练生盼望——<br>万一到最后什么都没发生，那我不是空欢喜一场，很丢脸吗？」</p><p>保罗说：「盼望不至于羞耻。」</p><p>为什么？</p><p>因为在这条链子的终点之前，神已经先给了订金。</p><p>祂没有叫我们等到最后才知道祂爱我们。<br>祂把那份爱，现在就倒在我们心里了。</p><p>【第三段｜5:6–8　神的爱的证据】</p>"},{"a":6,"z":6,"star":false,"grk":"<p>ἔτι γὰρ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.</p>","lit":"<p>「因为当我们<b>还</b>软弱无力的时候，基督<b>就在那定准的时机</b>，为<b>不敬虔的人</b>死了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>还</td><td>ἔτι</td><td>eti</td><td>G2089</td><td><b>仍然、还在……的时候</b>（本节出现两次）</td></tr><tr><td>软弱</td><td>ἀσθενής</td><td>asthenēs</td><td>G772</td><td>ἀ + σθένος（力量）：<b>没有力气、无能为力</b></td></tr><tr><td>所定的日期</td><td>κατὰ καιρόν</td><td>kata kairon</td><td>G2540</td><td><b>按照那决定性的时机</b>（καιρός 是「时机」不是「时间长度」）</td></tr><tr><td>罪人</td><td>ἀσεβής</td><td>asebēs</td><td>G765</td><td><b>不敬虔的人</b>（见下）</td></tr></table>","gram":"<p>① ἀσεβής ——第三次出现的关键字</p><p>这个字我们已经追踪了三章：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>1:18</b></td><td>神的忿怒显明在一切<b>不虔</b>（ἀσέβεια）不义的人身上</td></tr><tr><td><b>4:5</b></td><td>只信称<b>不敬虔的人</b>（ἀσεβῆ）为义的神</td></tr><tr><td><b>5:6</b></td><td>基督为<b>不敬虔的人</b>（ἀσεβῶν）死</td></tr></table><p>这是同一群人，走过了三站：</p><p>第一站：他们被神的忿怒对付。<br>第二站：他们被神称为义。<br>第三站：原来是因为有人为他们死了。</p><p>② κατὰ καιρόν ——不是意外，是预定</p><p>καιρός 不是 χρόνος（时间的流逝），是「<b>那个对的时刻</b>」。</p><p>（加4:4「及至时候满足，神就差遣他的儿子」）</p><p>十字架不是一场失控的悲剧，是一场准时的赴约。</p><p>③ ὑπέρ 的用法</p><p>ὑπέρ + 所有格 ＝「为了……的益处」「代替……」</p><p>在保罗书信中，这个介词承载了代赎的意义。</p>","exp":"<p>保罗在5:6用了四个字形容我们当时的状态，接下来三节还会再加：</p><table><tr><th>经文</th><th>我们当时是</th></tr><tr><td>5:6</td><td><b>软弱的</b>（ἀσθενῶν）——没有力气自救</td></tr><tr><td>5:6</td><td><b>不敬虔的</b>（ἀσεβῶν）——不把神当神</td></tr><tr><td>5:8</td><td><b>罪人</b>（ἁμαρτωλῶν）——射不中靶的</td></tr><tr><td>5:10</td><td><b>仇敌</b>（ἐχθροί）——敌对神的</td></tr></table><p>四个词，一个比一个重。</p><p>保罗像是怕我们不够明白，所以一层一层加上去：<br>不只是软弱，是不敬虔；不只是不敬虔，是罪人；不只是罪人，是仇敌。</p><p>而基督，就是在那个时候死的。</p>"},{"a":7,"z":8,"star":true,"grk":"<p>7 μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·<br>8 συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεός, ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.</p>","lit":"<p>7「因为几乎没有人会为一个<b>义人</b>死；不过为那<b>好人</b>，或许有人敢去死。」<br>8「但神却<b>证实／摆出</b>祂自己对我们的爱：就是当我们<b>还是罪人</b>的时候，基督为我们死了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>少有的</td><td>μόλις</td><td>molis</td><td>G3433</td><td><b>勉强、几乎不可能</b></td></tr><tr><td>义人</td><td>δίκαιος</td><td>dikaios</td><td>G1342</td><td>正直、无可指摘的人</td></tr><tr><td>仁人</td><td>ἀγαθός</td><td>agathos</td><td>G18</td><td><b>好人</b>（带恩惠的、对你有恩的）</td></tr><tr><td>或者有敢做的</td><td>τάχα...τολμᾷ</td><td>tacha, tolmaō</td><td>G5029 / G5111</td><td>或许、有人<b>敢</b></td></tr><tr><td>显明</td><td>συνίστησιν</td><td>synistēsin</td><td>G4921</td><td>σύν + ἵστημι：<b>摆在一起证实、当众展示</b></td></tr></table>","gram":"<p>① δίκαιος 与 ἀγαθός 的区别</p><p>这是本节的解经关键。保罗为什么用两个不同的字？</p><table><tr><th>字</th><th>意思</th><th>你的反应</th></tr><tr><td><b>δίκαιος（义人）</b></td><td>正直、公正、无可指摘</td><td>你<b>尊敬</b>他，但不一定喜欢他</td></tr><tr><td><b>ἀγαθός（仁人）</b></td><td>良善、慷慨、对你有恩</td><td>你<b>爱戴</b>他，你欠他</td></tr></table><p>保罗的阶梯是：</p><p>为一个「很正直的人」死？几乎没有人肯。<br>为一个「对我很好的人」死？也许有人敢。</p><p>那为一个「仇敌」死呢？</p><p>——保罗没有把这句话说完。他直接跳到第8节。</p><p>② συνίστησιν 的惊人回音</p><p>这个字我们在3:5见过：</p><p>3:5「我们的不义若<b>显出</b>（συνίστησιν）神的义来……」</p><p>同一个字。</p><p>人的不义「显出」神的义（3:5）；<br>神的作为「显出」神的爱（5:8）。</p><p>而συνίστημι 的字面是「<b>摆在一起让人看</b>」——这是一个公开展示的动作。</p><p>这也呼应3:25 προέθετο（神把祂公开摆出来）。</p><p>③ 现在式 συνίστησιν</p><p>「神的爱就在此向我们显明了」——是<b>现在式</b>。</p><p>十字架是两千年前的事（ἀπέθανεν 不定过去式），<br>但那个展示是<b>现在进行式</b>。</p><p>十字架至今还立在那里，天天在证明同一件事。</p><p>④ ἔτι ἁμαρτωλῶν ὄντων ἡμῶν 的语序</p><p>原文的语序是：「当<b>还是罪人</b>的、我们——基督为我们死了。」</p><p>「还是罪人」被提到最前面，是强调位置。</p>","exp":"<p>弟兄姊妹，5:8是全本圣经最有名的经文之一。但它的力量藏在5:7里。</p><p>如果没有第7节，第8节只是一句好听的话。</p><p>有了第7节，第8节就变成了一记重锤。</p><p>因为第7节先建立了人类爱的天花板：</p><p>最高的极限，是为一个对我很好的人去死——而且还只是「或许有人敢」。</p><p>然后第8节说：神为祂的仇敌死。</p><p>这中间的距离，不是程度的差别，是种类的差别。</p><p>而更深的一层是：</p><p>神不是等我们变好了才爱我们。</p><p>祂是在我们最糟的时候，付出了最大的代价。</p><p>所以你今天状态好不好，跟祂爱不爱你，<b>没有关系</b>。<br>因为祂爱你的那一天，你比今天糟得多。</p><p>【第四段｜5:9–11　两个「何况」】</p>"},{"a":9,"z":10,"star":true,"grk":"<p>9 πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι' αὐτοῦ ἀπὸ τῆς ὀργῆς.<br>10 εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·</p>","lit":"<p>9「那么<b>何况更是</b>——我们既然现在已经在祂的血里被称义了，就必借着祂从忿怒中被拯救。」<br>10「因为如果我们<b>还作仇敌</b>的时候，就借着神儿子的死与神<b>和好</b>了；<b>何况更是</b>——既已和好，我们必<b>在祂的生命里</b>得救。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>更要</td><td>πολλῷ μᾶλλον</td><td>pollō mallon</td><td>G4183/G3123</td><td>—</td><td><b>何况更是</b>（轻重论证）</td><td>全章的心跳</td></tr><tr><td>仇敌</td><td>ἐχθροί</td><td>echthroi</td><td>G2190</td><td>—</td><td><b>敌人、敌对者</b></td><td>不是「疏远」，是「敌对」</td></tr><tr><td>和好</td><td>κατηλλάγημεν</td><td>katēllagēmen</td><td>G2644</td><td>κατά + ἀλλάσσω（交换）</td><td><b>被和好</b>（原意：货币兑换）</td><td>被动式：不是我去和好</td></tr><tr><td>因他的生</td><td>ἐν τῇ ζωῇ αὐτοῦ</td><td>—</td><td>G2222</td><td>—</td><td><b>在祂的生命里</b></td><td>指复活与现今的代求</td></tr></table>","gram":"<p>★ πολλῷ μᾶλλον ——拉比的「轻重论证」</p><p>犹太解经有七条标准法则（希列七则），第一条就是 <b>קל וחומר（qal wachomer，轻与重）</b>：</p><p>「如果较小的情况成立，那较大的情况更成立。」</p><p>保罗在5:9–10做了两次：</p><p>第一次（5:9）：</p><pre>【难的事已经做了】神使我们靠祂的血称义（在我们还是罪人时）\n   ↓ 何况\n【容易的事】神会不救我们脱离将来的忿怒吗？</pre><p>第二次（5:10）：</p><pre>【难的事已经做了】仇敌的时候，靠儿子的「死」与神和好\n   ↓ 何况\n【容易的事】既已和好，靠祂的「生」得救</pre><p>保罗的论证极其有力：</p><p>如果神在我们是<b>仇敌</b>的时候，付了<b>祂儿子的命</b>——<br>那祂现在我们是<b>儿女</b>了，会舍不得给我们什么？</p><p>（这正是8:32的预告：「神既不爱惜自己的儿子……岂不也把万物和他一同白白地赐给我们吗？」）</p><p>★ 「死」与「生」的对照</p><p>5:10有一个常被忽略的精彩对比：</p><pre>借着神儿子的「死」  →  得与神和好      【过去】\n因他的「生」        →  得救           【现在与将来】</pre><p>十字架完成了和好；复活的生命完成了保守。</p><p>祂死，把我从仇敌变成儿女；<br>祂活，把我从儿女保守到底。</p><p>这正是来7:25：「凡靠着他进到神面前的人，他都能拯救到底；因为他是长远活着，替他们祈求。」</p><p>★ κατηλλάγημεν 是被动式</p><p>「得与神和好」——不是「我们去跟神和好」，是「<b>我们被和好了</b>」。</p><p>和好的主动者是神。<br>林后5:19：「神在基督里叫世人与自己和好。」</p><p>不是我们消了神的气，是神自己来消除那道敌意。</p>","exp":"<p>弟兄姊妹，5:9–10回答了一个非常实际的问题：</p><p>「我信主了，可是我还是会跌倒。我会不会又掉下去？」</p><p>保罗的回答不是「你要更努力」。</p><p>保罗的回答是一个逻辑：</p><p>想想神在你最糟的时候做了什么。</p><p>祂在你是<b>仇敌</b>的时候，付出了<b>祂儿子的命</b>。</p><p>祂现在会为了你这礼拜的失败，把那一切收回去吗？</p><p>这就是「何况」的力量。</p><p>确据不是建立在「我觉得我还可以」上面。<br>确据是建立在「祂已经做过那件更难的事」上面。</p>"},{"a":11,"z":11,"star":false,"grk":"<p>οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δι' οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.</p>","lit":"<p>「不仅如此，我们也<b>在神里面夸口</b>，借着我们的主耶稣基督——借着祂，我们<b>如今已经领受了</b>那和好。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>以神为乐</td><td>καυχώμενοι ἐν τῷ θεῷ</td><td>—</td><td>G2744</td><td><b>在神里面夸口</b></td></tr><tr><td>和好</td><td>καταλλαγή</td><td>katallagē</td><td>G2643</td><td>和好（名词）；林后5:18–19「和好的职分／道理」同字</td></tr><tr><td>领受</td><td>ἐλάβομεν</td><td>elabomen</td><td>G2983</td><td><b>不定过去式：已经领受了</b>（是礼物，不是赚的）</td></tr></table>","gram":"<p>① 第三次「夸口」，也是最高的一次</p><pre>5:2   夸口在「盼望神的荣耀」上   —— 夸将来\n5:3   夸口在「患难」中           —— 夸现在\n5:11  夸口「在神里面」           —— 夸神自己</pre><p>保罗的三重夸口，一层比一层深。</p><p>最后一层不是夸神给我的东西，是夸<b>神自己</b>。</p><p>② ἐλάβομεν（领受）——不是达成，是领受</p><p>和好是<b>被领受</b>的，不是<b>被完成</b>的。</p>","exp":"<p>弟兄姊妹，5:11是5:1–11的收尾，而它把整段拉到最高处。</p><p>前面讲了很多好处：相和、进入、盼望、忍耐、老练、免去忿怒、得救……</p><p>然后保罗说：不但如此——</p><p>最好的礼物，不是这些礼物。</p><p>最好的礼物是<b>送礼物的那一位</b>。</p><p>「以神为乐」——这是称义的终极目的。</p><p>神救我们，不是为了让我们有一个更好的人生，是为了让我们得着祂自己。</p><p>【第五段｜5:12–14　一个人带进来的】</p>"},{"a":12,"z":12,"star":true,"grk":"<p>Διὰ τοῦτο ὥσπερ δι' ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν, ἐφ' ᾧ πάντες ἥμαρτον·</p>","lit":"<p>「为此缘故，正如借着<b>一个人</b>，罪<b>进入</b>了世界，又借着罪，死也进入了；于是死就<b>贯穿临到</b>所有的人——<b>因为</b>（／在其中）众人都犯了罪……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>一人</td><td>ἑνὸς ἀνθρώπου</td><td>henos anthrōpou</td><td>G1520</td><td>εἷς（一）</td><td><b>一个人</b></td><td>5:12–19出现12次「一」</td></tr><tr><td>入了</td><td>εἰσῆλθεν</td><td>eisēlthen</td><td>G1525</td><td>εἰς + ἔρχομαι</td><td><b>进来、闯入</b></td><td>罪像入侵者</td></tr><tr><td>临到</td><td>διῆλθεν</td><td>diēlthen</td><td>G1330</td><td>διά + ἔρχομαι</td><td><b>贯穿、蔓延过去</b></td><td>死像瘟疫扩散</td></tr><tr><td>因为</td><td>ἐφ' ᾧ</td><td>eph' hō</td><td>—</td><td>ἐπί + 关系代名词</td><td><b>本节最大的解经争议</b></td><td>见下</td></tr></table>","gram":"<p>① 两个复合动词的画面</p><pre>罪：εἰσῆλθεν（εἰς 进入）—— 从外面闯进来\n死：διῆλθεν（διά 贯穿）—— 进来之后蔓延到每一个角落</pre><p>保罗画的是一幅瘟疫图：罪是病毒，从一个门进来；死是症状，蔓延到每一个人身上。</p><p>② ★ ἐφ' ᾧ 的四种理解</p><p>这两个字，决定了整个「原罪论」的形状。福音派内部有合理的不同看法，必须公平列出。</p><table><tr><th>理解</th><th>译法</th><th>意思</th><th>代表</th></tr><tr><td><b>A. 因果</b>（多数现代学者）</td><td>「<b>因为</b>」</td><td>死临到众人，因为众人都犯了罪</td><td>和合本；多数现代注释</td></tr><tr><td><b>B. 在他里面</b></td><td>「<b>在他（亚当）里面</b>」</td><td>众人在亚当里犯了罪</td><td>奥古斯丁（根据拉丁文武加大译本 in quo）</td></tr><tr><td><b>C. 结果</b></td><td>「<b>以致于</b>」</td><td>死临到众人，以致于众人都犯罪</td><td>部分东方教父</td></tr><tr><td><b>D. 条件／根据</b></td><td>「<b>在这条件下</b>」</td><td>综合性理解</td><td>Fitzmyer 等</td></tr></table><p>关于B（奥古斯丁的理解）的诚实说明：</p><p>拉丁文武加大译本把 ἐφ' ᾧ 译为 <b>in quo</b>（「在他里面」），奥古斯丁据此建立了「我们都在亚当里犯了罪」的原罪论。</p><p>但从希腊文文法看，ἐφ' ᾧ 译作「在他里面」是<b>困难的</b>（ἐπί 通常不表示「在……里面」，那是 ἐν）。</p><p>多数现代学者（包括改革宗学者如 Murray、Moo、Schreiner）都承认：奥古斯丁的<b>翻译</b>有问题，但他的<b>神学结论</b>未必错——因为那个结论是从5:13–19的整体论证得出的，不是只靠 ἐφ' ᾧ 这两个字。</p><p>③ 那么，我们到底是怎么「在亚当里」的？</p><p>福音派内部有两种主要模型（都认信原罪，只是解释机制不同）：</p><table><tr><th>模型</th><th>主张</th><th>比喻</th><th>代表</th></tr><tr><td><b>联邦元首说</b>（federal headship）</td><td>亚当是全人类的<b>法定代表</b>，他的行为在法律上算作我们的</td><td>一国元首签了宣战书，全国就进入战争状态</td><td>Hodge、Berkhof、多数改革宗</td></tr><tr><td><b>实存元首说</b>（seminal/realistic headship）</td><td>全人类在生理与存在上<b>都在亚当里面</b>，所以真的一同犯了罪</td><td>利未在亚伯拉罕身上纳了十分之一（来7:9–10）</td><td>Shedd、奥古斯丁传统</td></tr></table><p>保罗本人比较接近哪一种？</p><p>从5:12–19的论证形态看，「联邦元首说」较贴合经文——因为保罗的整个对称是<b>代表性的</b>：</p><p>「因一人的悖逆，众人成为罪人；照样，因一人的顺从，众人也成为义了。」（5:19）</p><p>如果我们是因为「实际在亚当里犯了罪」才算为罪人，那按对称逻辑，我们也必须「实际在基督里行了义」才算为义——<br>但保罗前面四章讲得很清楚：我们的义是<b>算</b>给我们的（4:3–8），不是我们实际做的。</p><p>所以：</p><p>两边都是<b>代表</b>：一个代表使我落入定罪；另一个代表使我被算为义。<br>这个对称，正是第四章「算」（λογίζομαι）的宇宙版本。</p><p>讲台诚信提醒：这两种模型都是正统的福音派立场，不可把其中一种说成唯一答案，也不可暗示持另一种看法的人不信原罪。</p><p>④ 5:12是一个「说到一半停住」的句子</p><p>「这就如（ὥσπερ）……」——但「照样（οὕτως）」呢？</p><p>没有出现。保罗停住了，插入5:13–17的解释，直到5:18才把句子补完。</p>","exp":"<p>弟兄姊妹，5:12丢出了一个现代人最不喜欢的观念：</p><p>我的处境，不完全是我自己造成的。</p><p>现代文化最核心的信念之一是「个人主义」——我为我自己负责，别人的事跟我无关。</p><p>但保罗说：</p><p>在你出生之前，有一件事已经决定了你的处境。</p><p>这听起来不公平吗？</p><p>保罗的回答是：</p><p>如果你不接受「一个人可以代表全人类」——<br>那你也就同时放弃了另一个人可以代表你。</p><p>反对亚当代表你，就是反对基督代表你。</p><p>而福音的整个结构，就建立在「一个人代表众人」上面。</p>"},{"a":13,"z":14,"star":false,"grk":"<p>13 ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,<br>14 ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.</p>","lit":"<p>13「因为直到律法（赐下）之前，罪已经在世上；但在没有律法的时候，罪<b>不被记帐</b>。」<br>14「然而死<b>作了王</b>，从亚当直到摩西——甚至临到那些没有按亚当<b>跨越界线</b>那样犯罪的人身上。亚当乃是那<b>将要来者</b>的<b>预像</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>算罪</td><td>ἐλλογεῖται</td><td>ellogeitai</td><td>G1677</td><td>ἐν + λόγος</td><td><b>记入帐中</b></td><td><b>与第四章 λογίζομαι 同字根！</b></td></tr><tr><td>作了王</td><td>ἐβασίλευσεν</td><td>ebasileusen</td><td>G936</td><td>βασιλεύς（王）</td><td><b>登基作王、掌权</b></td><td>本章关键字（5次）</td></tr><tr><td>过犯</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω</td><td><b>跨越明确的界线</b></td><td>4:15同字</td></tr><tr><td>预像</td><td>τύπος</td><td>typos</td><td>G5179</td><td>τύπτω（打、印）</td><td><b>模子打出来的印记、预表</b></td><td>见下</td></tr></table>","gram":"<p>① ἐλλογέω ——第四章的字在这里回来了</p><p>这个字（ἐν + λόγος）的意思是「记入帐中」，与 λογίζομαι 同一家族。</p><p>而它在新约只出现两次：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>腓利门书1:18</b></td><td>「他若亏负你，或欠你什么，都<b>归在我的帐上</b>（ἐμοὶ ἐλλόγα）」</td></tr><tr><td><b>罗5:13</b></td><td>「但没有律法，罪也<b>不算罪</b>（οὐκ ἐλλογεῖται）」</td></tr></table><p>保罗一生只用了两次这个字。<br>一次说「这笔帐记在我身上」，一次说「那时候的罪没有记帐」。</p><p>② 5:13–14的论证逻辑</p><p>保罗在回答一个可能的反驳：「你说死是因为罪。但摩西之前没有律法，那时候的罪不算罪，为什么那时候的人也会死？」</p><p>保罗的回答：</p><pre>事实：从亚当到摩西，人都死了\n但：那时没有律法（罪不记帐）\n所以：他们的死，不是因为他们自己「跨越界线」\n结论：他们的死，来自亚当</pre><p>保罗用「摩西之前的人也死」这个历史事实，证明了死是从亚当来的。</p><p>这是全章最缜密的一段推理。</p><p>③「连那些不与亚当犯一样罪过的」是谁？</p><p>指的是<b>没有像亚当那样违背一条明确诫命</b>的人（亚当有一条清楚的禁令：分别善恶树的果子不可吃）。</p><p>这包括婴孩吗？经文没有明说，但这节经文在历史上确实被用于讨论婴孩死亡的问题。</p><p>讲台诚信提醒：保罗在此的重点是论证「死来自亚当」，不是在建立婴孩论。不宜过度延伸。</p><p>④ τύπος（预像）的重量</p><p>τύπος 的字面是「打击留下的印记」（如约20:25多马说的「钉痕」用同字）。</p><p>引申为：一个模子打出来的形状。</p><p>保罗说：亚当是「那以后要来之人」的预像。</p><p>注意方向：不是基督像亚当，是<b>亚当像基督</b>。</p><p>神在造第一个人的时候，心里想的就是第二个人。</p><p>这是全本圣经最深的一句话之一：<b>亚当从一开始就是为了指向基督而被造的</b>。</p>","exp":"<p>弟兄姊妹，这两节看起来像是插入的技术性说明，其实是全章论证的<b>关键支点</b>。</p><p>保罗要证明的是：<b>死不是你一个人的问题，是全人类的问题</b>。</p><p>而他的证据，是一段<b>历史</b>：</p><p>从亚当到摩西，那段没有律法的日子——</p><p>人还是<b>死了</b>。</p><p>如果死只是「个人犯罪的报应」，那没有律法可犯的时候，人不该死。</p><p>但他们死了。</p><p>所以死的来源，比个人的行为<b>更深</b>。</p><p><b>经文本身明确表达的：</b> 没有律法时罪不「记帐」，但死仍然作王；可见死的根源在亚当，不在个人的违例。</p><p><b>可以合理推论的：</b> 这正是「有己」不是一种坏习惯、而是一种<b>遗传的处境</b>的圣经根据。</p><p>人不是因为犯罪才成为罪人；人是因为是罪人，才犯罪。</p><p>而14节最后那半句，把整段的方向翻转了：</p><p>「亚当乃是那<b>以后要来之人</b>的预像。」</p><p>弟兄姊妹，保罗讲了半天亚当——</p><p>然后他说：这个人，是为了让你看见<b>另一个人</b>。</p><p><b>⚠ 讲台诚信提醒：</b> 5:12「众人都犯了罪」的 ἐφ' ᾧ 译法、以及原罪传递的方式（归算说／实在说），<br><b>敬虔的学者有不同理解，不宜在台上裁决。</b>（见第二十部分）</p><p>【第六段｜5:15–17　三个「不如」与两个「何况」】</p>"},{"a":15,"z":17,"star":false,"grk":"<p>15 …πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.<br>17 …πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.</p>","lit":"<p>「若因那一人的过犯，死就借着那一人作了王——<b>何况更是</b>：那些<b>领受</b>了恩典之丰盛与义之<b>白白恩赐</b>的人，必要<b>在生命中作王</b>，借着那一位耶稣基督。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>恩赐</td><td>χάρισμα</td><td>charisma</td><td>G5486</td><td>χάρις（恩典）+ -μα：<b>恩典的具体产物</b></td></tr><tr><td>赏赐</td><td>δωρεά</td><td>dōrea</td><td>G1431</td><td><b>白白的礼物</b>（4:4 δωρεάν 的名词）</td></tr><tr><td>更加倍地临到</td><td>ἐπερίσσευσεν</td><td>eperisseusen</td><td>G4052</td><td>περισσεύω：<b>满溢出来、多到满出边界</b></td></tr><tr><td>洪恩</td><td>περισσεία τῆς χάριτος</td><td>perisseia</td><td>G4050</td><td><b>恩典的满溢</b></td></tr><tr><td>领受</td><td>λαμβάνοντες</td><td>lambanontes</td><td>G2983</td><td>现在分词：<b>正在领受的人</b></td></tr><tr><td>作王</td><td>βασιλεύσουσιν</td><td>basileusousin</td><td>G936</td><td><b>未来式：他们必要作王</b></td></tr></table>","gram":"<p>★ 亮光一：「不如」不是「相似」，是「远远不及」</p><p>5:15「只是过犯<b>不如</b>恩赐」——原文是 ἀλλ' οὐχ ὡς…οὕτως καί（「但不是像……那样」）。</p><p>保罗怕我们把亚当与基督读成一个对等的天平。</p><p>所以他连续三次强调：不一样，不一样，不一样。</p><p>不是两边一样重。是一颗石子与一座山。</p><p>★ 亮光二：不对称在哪里？（5:16）</p><p>「审判是<b>由一人</b>而定罪，恩赐乃是<b>由许多过犯</b>而称义。」</p><pre>定罪：一次过犯 → 定罪\n称义：无数过犯 → 称义</pre><p>这是全章最不对称的一点：</p><p>一次的犯罪，就足以定罪。<br>但恩典要处理的，是几千年、几十亿人、无法计数的过犯——<br>而它处理得完。</p><p>一颗火柴可以烧掉一栋房子；但要重建那栋房子，需要的远远不只一根木头。<br>恩典做的，是重建。</p><p>★ 亮光三：5:17的惊人不对称</p><p>照对称逻辑，5:17应该说：</p><p>「死作了王……照样，<b>生命</b>也作王。」</p><p>但保罗没有这样写。他写的是：</p><p>「何况那些受洪恩又蒙所赐之义的，岂不更要……<b>在生命中作王</b>吗？」</p><p>主词换了！</p><pre>【亚当这边】死 作王   →  我们是被统治的\n【基督这边】我们 作王  →  我们是统治的</pre><p>弟兄姊妹，这是全章最温暖的一个文法细节。</p><p>罪作王的时候，我们是奴隶。<br>但恩典作王的时候，我们不是换一个主人——</p><p>我们也一同作王。</p><p>（这正是启20:6、22:5「他们要作王，直到永永远远」的预告）</p><p>★ 亮光四：λαμβάνοντες（领受的人）</p><p>5:17的「受洪恩又蒙所赐之义的」——原文是「<b>那些正在领受</b>的人」。</p><p>这个现在分词是全段的钥匙：</p><p>在亚当里，我们<b>不需要做什么</b>就进去了（出生就在里面）。<br>在基督里，我们要<b>领受</b>。</p><p>这也是5:18「众人」不等于普救论的关键（见第二十部分）。</p>","exp":"<p>弟兄姊妹，5:15–17回答了一个潜在的恐惧：</p><p>「亚当的影响力那么大，我怎么跑得掉？」</p><p>保罗的回答是：</p><p>你的问题问反了。</p><p>问题不是「亚当的影响力有多大」，而是「基督的影响力大多少」。</p><p>而答案是：多太多了。</p><p>保罗用了三个「不如」和两个「何况」，就是要把这件事钉死：</p><p>这不是拔河。这不是势均力敌的两股势力。</p><p>这是一颗石子丢进海里。</p><p>【第七段｜5:18–19　句子补完】</p>"},{"a":18,"z":19,"star":false,"grk":"<p>18 Ἄρα οὖν ὡς δι' ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι' ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·<br>19 ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.</p>","lit":"<p>18「所以，正如借着<b>一次过犯</b>，临到所有人的是<b>定罪</b>；照样，借着<b>一次义行</b>，临到所有人的是<b>生命的称义</b>。」<br>19「因为正如借着那一人的<b>不听</b>，众人被<b>设立为</b>罪人；照样，借着那一位的<b>顺从</b>，众人也将被<b>设立为</b>义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>义行</td><td>δικαίωμα</td><td>dikaiōma</td><td>G1345</td><td>δίκαιος</td><td><b>合乎义的行为／判决</b></td><td>指基督的顺服至死</td></tr><tr><td>称义得生命</td><td>δικαίωσις ζωῆς</td><td>dikaiōsis zōēs</td><td>G1347</td><td>—</td><td><b>导致生命的称义宣告</b></td><td>4:25同字</td></tr><tr><td>悖逆</td><td>παρακοή</td><td>parakoē</td><td>G3876</td><td>παρά + ἀκούω（听）</td><td><b>听偏了、不肯听</b></td><td>见下</td></tr><tr><td>顺从</td><td>ὑπακοή</td><td>hypakoē</td><td>G5218</td><td>ὑπό + ἀκούω</td><td><b>在底下听、听从</b></td><td>见下</td></tr><tr><td>成为</td><td>κατεστάθησαν</td><td>katestathēsan</td><td>G2525</td><td>καθίστημι</td><td><b>被设立、被指派</b>（法律／任命用语）</td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：παρακοή 与 ὑπακοή ——都是「听」</p><p>两个字的字根都是 ἀκούω（听）：</p><pre>παρακοή （παρά 旁边 + 听）  = 听偏了、听到旁边去了 → 悖逆\nὑπακοή  （ὑπό  底下 + 听）  = 在底下听 → 顺从</pre><p>中文译「悖逆」与「顺从」，看不出这是同一个字根。</p><p>但原文告诉我们一件极重要的事：</p><p>罪的本质，是<b>听的问题</b>。<br>顺服的本质，也是<b>听的问题</b>。</p><p>回到伊甸园：亚当犯罪的那一刻，发生了什么？</p><p>创3:17：「你既<b>听从</b>妻子的话……」</p><p>他不是没有听。他是<b>听错了对象</b>。</p><p>而基督呢？</p><p>赛50:5（仆人之歌）：「主耶和华开通我的耳朵，我并没有违背，也没有退后。」</p><p>来5:8：「他虽然为儿子，还是因所受的苦难学了<b>顺从</b>（ὑπακοή）。」</p><p>一个园子里，一个人听错了。<br>另一个园子里（客西马尼），一个人听对了。</p><p>★ 亮光二：καθίστημι ——被「设立」为</p><p>「成为罪人」「成为义了」，原文是 καθίστημι——</p><p>这个字的意思是「<b>设立、指派、任命</b>」，是法律与行政用语。</p><p>（徒6:3「我们就可以<b>派</b>他们管理这事」；来5:1「凡从人间挑选的大祭司，是奉<b>派</b>替人办理」——同字）</p><p>保罗没有说「众人变成了罪人」（性情的描述），<br>他说「众人<b>被设立为</b>罪人」（地位的宣告）。</p><p>这与第四章的「算」（λογίζομαι）完全一致——是法庭语言，不是心理学语言。</p><p>而19节下半是<b>未来式被动</b>（κατασταθήσονται）：</p><p>「众人也将被设立为义。」</p><p>称义已经开始，但完全的宣告指向那日。</p><p>★ 亮光三：「一次的义行」是什么？</p><p>δικαίωμα 在此可指：</p><p>1. <b>基督整个顺服的一生</b>（多数注释）<br>2. <b>十字架这一个具体的行动</b></p><p>5:19的「顺从」（ὑπακοή）支持第一种：是祂一生的顺服，在十字架达到顶点。</p><p>腓2:8：「既有人的样子，就自己卑微，存心<b>顺服</b>，以至于死，且死在十字架上。」</p>","exp":"<p>弟兄姊妹，5:18–19终于把5:12那个停住的句子补完了。</p><p>而补完之后，整幅图画出现了：</p><pre>亚当              基督\n一个动作      一次过犯          一次义行\n本质          听偏了            听从了\n结果          被设立为罪人      被设立为义\n临到          所有人            所有领受的人\n统治          死作王            我们作王</pre><p>而这幅图画最重要的信息是：</p><p>你的地位，不是靠你的表现决定的，是靠你属于哪一个人决定的。</p><p>这就是为什么保罗一定要讲这一段。</p><p>因为如果我的称义是靠我的表现，那我每天都在风险中。</p><p>但如果我的称义是靠<b>祂</b>的表现——</p><p>那我就稳了。因为祂不会失败。</p><p>【第八段｜5:20–21　律法的位置与恩典的作王】</p>"},{"a":20,"z":20,"star":true,"grk":"<p>νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,</p>","lit":"<p>「而律法<b>溜了进来</b>，为要使过犯<b>增多</b>；但罪在哪里增多，恩典就<b>超级加倍地满溢</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>外添的</td><td>παρεισῆλθεν</td><td>pareisēlthen</td><td>G3922</td><td>παρά + εἰς + ἔρχομαι</td><td><b>从旁边溜进来、插进来</b></td><td>见下</td></tr><tr><td>显多</td><td>πλεονάσῃ</td><td>pleonasē</td><td>G4121</td><td>πλέον（更多）</td><td><b>增多、变多</b></td><td>假设语气</td></tr><tr><td>更显多</td><td>ὑπερεπερίσσευσεν</td><td>hypereperisseusen</td><td>G5248</td><td><b>ὑπέρ + ἐκ + περισσεύω</b></td><td><b>超级—加倍—满溢</b></td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：παρεισέρχομαι ——律法是「插进来」的</p><p>这个复合动词由三部分组成：παρά（旁边）+ εἰς（进入）+ ἔρχομαι（来）。</p><p>意思是：<b>从旁边插进来、加进来</b>。</p><p>保罗在说：律法不是主线剧情。</p><p>主线是：亚当 → 基督。<br>律法是中间<b>插进来的一段</b>，有它的任务，但它不是主角。</p><p>（加3:19「这样说来，律法是为什么有的呢？原是为过犯添上的」——同一个神学）</p><p>★ 亮光二：ὑπερεπερίσσευσεν ——保罗造的一个字</p><p>这个动词是保罗叠了三层前缀造出来的：</p><pre>περισσεύω     = 满溢、有余\nἐκπερισσεύω   = 加倍满溢\nὑπερεκπερισσεύω / ὑπερπερισσεύω = 超级加倍满溢</pre><p>在新约中，这个字只出现两次（罗5:20；林后7:4）。</p><p>保罗在描述罪的时候，用的是 πλεονάζω（增多）。<br>在描述恩典的时候，他觉得普通的字不够用——</p><p>所以他自己叠了一个字出来。</p><p>中文「更显多」译得已经很努力了，但原文的语气是：</p><p>罪加了一级；恩典直接爆表。</p><p>★ 亮光三：「叫过犯显多」的 ἵνα ——目的还是结果？</p><p>这是本节的第二个争议：ἵνα 是「为要」（目的）还是「以致」（结果）？</p><p>若是目的，那神是故意让罪增多的吗？</p><p>保罗的意思应该理解为：</p><p>律法的功能，是把罪从「模糊的病」变成「清楚的罪状」（4:15 παράβασις）。</p><p>它不制造罪，它<b>显明</b>罪、<b>加重</b>罪的性质。</p><p>而这个「显明」，正是为了让人知道自己需要恩典（3:20「律法本是叫人知罪」）。</p><p>医生开检查单，不是为了让你生病，是为了让你知道你已经病了、而且有多重。</p>","exp":"<p>弟兄姊妹，5:20是全章最让人松一口气、也最容易被滥用的一节。</p><p>「罪在哪里显多，恩典就更显多了。」</p><p>这句话对正在罪疚中的人，是天大的好消息。</p><p>但保罗立刻就知道有人会怎么用它。所以6:1开头就是：</p><p>「这样，怎么说呢？我们可以仍在罪中，叫恩典显多吗？」<br>「断乎不可！」</p><p>这句话是给<b>跌倒的人爬起来</b>用的，不是给<b>要去跌倒的人找借口</b>用的。</p>"},{"a":21,"z":21,"star":false,"grk":"<p>ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.</p>","lit":"<p>「为要叫——正如罪在死中<b>作了王</b>；照样，恩典也要<b>作王</b>，借着义，以致于永生，借着我们的主耶稣基督。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>作王</td><td>βασιλεύω</td><td>basileuō</td><td>G936</td><td>登基掌权（本章第5次）</td></tr><tr><td>借着义</td><td>διὰ δικαιοσύνης</td><td>dia dikaiosynēs</td><td>G1343</td><td><b>恩典的统治途径是「义」</b></td></tr></table>","gram":"<p>① βασιλεύω 在第五章的五次旅程</p><table><tr><th>出处</th><th>谁作王</th></tr><tr><td>5:14</td><td><b>死</b>作了王（从亚当到摩西）</td></tr><tr><td>5:17上</td><td><b>死</b>因这一人作了王</td></tr><tr><td>5:17下</td><td><b>我们</b>要在生命中作王</td></tr><tr><td>5:21上</td><td><b>罪</b>作王叫人死</td></tr><tr><td>5:21下</td><td><b>恩典</b>作王，叫人得永生</td></tr></table><p>整章的主题，其实是一个王位的问题。</p><p>谁在作王？</p><p>② διὰ δικαιοσύνης（借着义）的重要性</p><p>这半句常被忽略，却极其重要。</p><p>恩典作王，不是绕过义，是<b>借着义</b>。</p><p>这正是3:26的回响：「使人知道他自己为义，也称信耶稣的人为义。」</p><p>恩典不是把公义踢到一边。恩典是走过公义的那条路来到我们这里的。</p>","exp":"<p>弟兄姊妹，第五章是以「王」结尾的。</p><p>这一点很重要，因为它把整章拉回了一个主权的问题。</p><pre>【亚当的国度】罪作王 → 人是奴隶 → 结局是死\n【基督的国度】恩典作王 → 人也作王 → 结局是永生</pre><p>保罗不是在讲两种人生态度，是在讲两个国度。</p><p>而每一个人，都活在其中一个里面。</p>"}],"6":[{"a":1,"z":1,"star":false,"grk":"<p>Τί οὖν ἐροῦμεν; ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;</p>","lit":"<p>「那么我们要说什么呢？我们要<b>继续住在</b>罪里，好叫恩典增多吗？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>仍在</td><td>ἐπιμένωμεν</td><td>epimenōmen</td><td>G1961</td><td>ἐπί + μένω（住）</td><td><b>继续住下去、赖着不走</b></td><td>不是偶尔去，是<b>住在那里</b></td></tr><tr><td>罪</td><td>ἁμαρτίᾳ</td><td>hamartia</td><td>G266</td><td>—</td><td>罪（单数、带冠词）</td><td><b>指罪的权势，不只是罪行</b></td></tr><tr><td>显多</td><td>πλεονάσῃ</td><td>pleonasē</td><td>G4121</td><td>πλέον（更多）</td><td>增多</td><td>直接引用5:20</td></tr></table>","gram":"<p>① ἐπιμένω 的画面</p><p>这个字不是「犯罪」，是「<b>住在</b>罪里」。</p><p>（徒10:48「就请彼得<b>住</b>了几天」；西1:23「只要你们在所信的道上<b>恒心</b>」——同字）</p><p>保罗提出的问题不是「基督徒会不会偶尔跌倒」，<br>而是「基督徒可不可以<b>把罪当成住址</b>」。</p><p>② ἐπιμένωμεν 是假设语气（deliberative subjunctive）</p><p>这种语气在希腊文中用于<b>自问自答式的商议</b>：「我们是不是该……？」</p><p>保罗不是在转述别人的话，他是在<b>替读者把心里那个念头说出来</b>。</p><p>这是论辩体（diatribe）的手法——他知道你在想什么。</p><p>③ 带冠词的 τῇ ἁμαρτίᾳ</p><p>第六章的「罪」几乎都是<b>单数、带冠词</b>——保罗把「罪」<b>拟人化</b>了。</p><p>在本章中，「罪」是一个<b>角色</b>：它作王（6:12）、它作主（6:14）、它有奴隶（6:16–20）、它付薪水（6:23）。</p><p>保罗不是在讲「一些不好的行为」。<br>他是在讲一个<b>主人</b>。</p>","exp":"<p>弟兄姊妹，这个问题不是保罗捏造出来的稻草人。</p><p>这是他一直被指控的事——3:8已经说了：「这是毁谤我们的人说我们有这话。」</p><p>而这个问题会出现，恰恰证明保罗的福音讲对了。</p><p>如果你讲恩典，从来没有人误会你在鼓励放纵——<br>那你可能还没有真的把恩典讲出来。</p><p>只有当恩典被讲到「白白的、不需要任何条件」的地步，这个误会才会产生。</p><p>保罗不是要收回那个「白白」，他是要证明：真正领受的人，不会想回去。</p>"},{"a":2,"z":2,"star":true,"grk":"<p>μὴ γένοιτο. οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;</p>","lit":"<p>「绝不可能！我们这些<b>已经向罪死了</b>的人，怎么还能<b>在其中活着</b>呢？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>断乎不可</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td><b>愿它绝不发生！</b> 希腊文最强的否定</td></tr><tr><td>死了</td><td>ἀπεθάνομεν</td><td>apethanomen</td><td>G599</td><td><b>不定过去式：已经死了</b>（一次完成的事件）</td></tr><tr><td>在罪上</td><td>τῇ ἁμαρτίᾳ</td><td>—</td><td>G266</td><td><b>关系与格：向着罪、就罪而言</b></td></tr><tr><td>岂可</td><td>πῶς</td><td>pōs</td><td>G4459</td><td><b>怎么可能</b>（不是「不应该」，是「怎么做得到」）</td></tr></table>","gram":"<p>★ 亮光一：πῶς 不是「不应该」，是「怎么可能」</p><p>这是全章最容易被读漏的一个字。</p><p>中文「岂可」听起来像道德劝诫：「你怎么可以这样！」</p><p>但希腊文 πῶς 的重点是：「<b>这在逻辑上怎么行得通？</b>」</p><p>保罗不是在说：「你不应该住在罪里。」<br>保罗是在说：「<b>一个死人，怎么可能还住在那里？</b>」</p><p>这是一个关于<b>可能性</b>的问句，不是关于<b>责任</b>的问句。</p><p>★ 亮光二：ἀπεθάνομεν 是不定过去式</p><p>「死了」是<b>已经完成的事件</b>，不是一个要努力达成的目标。</p><p>保罗没有说：「你要向罪死。」<br>保罗说：「你<b>已经</b>向罪死了。」</p><p>这是本章与许多属灵教导最大的差别。</p><table><tr><th>常见的教导</th><th>保罗的教导</th></tr><tr><td>「你要治死你的老我」</td><td>「你的旧人<b>已经</b>同钉十字架了」（6:6）</td></tr><tr><td>「你要向罪死」</td><td>「你<b>已经</b>向罪死了」（6:2）</td></tr><tr><td>追求一个要达到的境界</td><td>认清一个已成的事实</td></tr></table><p>★ 亮光三：τῇ ἁμαρτίᾳ 是「关系与格」</p><p>「向罪死了」——不是「因为罪而死」，是「<b>就罪这个关系而言，死了</b>」。</p><p>这个文法结构在6:10、6:11再次出现：</p><pre>6:10  他死是「向罪」（τῇ ἁμαρτίᾳ）死了\n      他活是「向神」（τῷ θεῷ）活着\n6:11  你们「向罪」当看自己是死的\n      「向神」当看自己是活的</pre><p>「向……死」的意思是：<b>那个关系结束了，那一方对你不再有法律上的权柄</b>。</p><p>就像一个人死了之后，债主不能再向他追讨。</p><p>★ 亮光四：「向罪死」不等于「感觉不到罪的吸引」</p><p>这是必须立刻澄清的，否则整章会被误读。</p><p>如果「向罪死了」的意思是「不再有犯罪的欲望」，那6:12–13的命令就是多余的——</p><p>保罗在6:12说：「不要容罪在你们必死的身上<b>作王</b>。」</p><p>既然要命令「不要容它作王」，就表示<b>它还会来争夺王位</b>。</p><p>「向罪死」是<b>法律地位的改变</b>，不是<b>感觉经验的消失</b>。</p>","exp":"<p><b>经文本身明确表达的：</b> 信徒已经向罪死了，因此继续住在罪中在逻辑上是不可能的。<br><b>合理推论的生命应用：</b> 当我们对付罪的方式是「我要更努力」时，我们其实还没有站在6:2上。第六章的起点不是决心，是身分。</p><p>弟兄姊妹，这一节改变了整场战争的性质。</p><p>如果我还没死，那我对付罪的方式是<b>挣扎</b>。<br>如果我已经死了，那我对付罪的方式是<b>认清</b>。</p><p>【第二段｜6:3–10　知道：洗礼所宣告的联合】</p>"},{"a":3,"z":3,"star":false,"grk":"<p>ἢ ἀγνοεῖτε ὅτι, ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν, εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;</p>","lit":"<p>「还是你们<b>不知道</b>：凡我们<b>被浸入</b>基督耶稣的人，都是<b>被浸入祂的死</b>？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>岂不知</td><td>ἀγνοεῖτε</td><td>agnoeite</td><td>G50</td><td>ἀ + γινώσκω</td><td><b>你们不知道吗</b></td><td>保罗默认他们早就知道</td></tr><tr><td>受洗</td><td>ἐβαπτίσθημεν</td><td>ebaptisthēmen</td><td>G907</td><td>βάπτω（浸）</td><td><b>被浸入</b></td><td>被动式</td></tr><tr><td>归入</td><td>εἰς</td><td>eis</td><td>G1519</td><td>—</td><td><b>进入……里面</b></td><td>方向与归属</td></tr></table>","gram":"<p>① βαπτίζω 的基本字义</p><p>这个字的基本意思是「<b>浸入、没入</b>」。</p><p>在古希腊文献中，它用于：</p><p>- 船沉没<br>- 布料浸入染缸（浸入之后，布就变成染缸的颜色）<br>- 物件沉入水中</p><p>这个字义本身就携带了保罗要的画面：</p><p>完全没入 → 出来的时候，不再是原来的颜色。</p><p>② εἰς Χριστὸν（归入基督）</p><p>εἰς + 直接受格，表示<b>进入、归属于</b>。</p><p>这个词组在加3:27也出现：「你们受洗归入基督的，都是披戴基督了。」</p><p>「归入基督」不是「加入一个团体」，是「进入一个位格」。</p><p>③ 保罗的语气：ἢ ἀγνοεῖτε（还是你们不知道吗）</p><p>保罗默认这是<b>基本常识</b>。</p><p>这对我们是一记提醒：保罗认为每一个受过洗的信徒，都应该知道自己的洗礼是什么意思。<br>但今天有多少信徒，说不出自己受洗那天到底发生了什么？</p>","exp":"<p>（关于「洗礼本身是否使人得救」的争议，见第二十部分。此处先处理保罗的论证重点。）</p><p>保罗在此不是在教导洗礼的神学，他是在<b>用洗礼作论据</b>。</p><p>他的逻辑是：</p><pre>你受洗了（这是事实，你自己知道）\n   ↓\n你的洗礼所宣告的，是「归入祂的死」\n   ↓\n所以你已经死了\n   ↓\n所以你不能仍在罪中</pre><p>保罗是在说：你受洗那一天，你自己已经公开承认了这件事。<br>现在你要反悔吗？</p>"},{"a":4,"z":4,"star":true,"grk":"<p>συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.</p>","lit":"<p>「所以我们借着那浸礼，<b>与祂一同被埋葬</b>进入死里，为要叫——正如基督借着父的荣耀从死人中被复活，照样我们也可以<b>在生命的新样中行走</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>一同埋葬</td><td>συνετάφημεν</td><td>synetaphēmen</td><td>G4916</td><td>σύν + θάπτω（埋葬）</td><td><b>与……一同被埋葬</b></td><td>六个 συν- 的第一个</td></tr><tr><td>父的荣耀</td><td>δόξα τοῦ πατρός</td><td>—</td><td>G1391</td><td>—</td><td>父的荣耀</td><td>复活的动力来源</td></tr><tr><td>新生的样式</td><td>καινότης ζωῆς</td><td>kainotēs zōēs</td><td>G2538</td><td>καινός（质地上的新）</td><td><b>生命的新质地</b></td><td>见下</td></tr><tr><td>一举一动</td><td>περιπατήσωμεν</td><td>peripatēsōmen</td><td>G4043</td><td>περί + πατέω（走）</td><td><b>四处行走</b>（希伯来式表达：日常生活）</td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：συνετάφημεν ——埋葬的意义</p><p>保罗为什么要特别提「埋葬」？死了不就够了吗？</p><p>因为埋葬是<b>死亡的确认</b>。</p><p>人死了，还有可能被抢救。<br>人被埋了，这件事就结案了。</p><p>埋葬是社会性的、公开的、不可逆的宣告：这个人真的走了。</p><p>★ 亮光二：καινός 而不是 νέος</p><p>希腊文有两个字表达「新」：</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>νέος</b></td><td>时间上的新（刚出来的、年轻的）</td></tr><tr><td><b>καινός</b></td><td><b>质地上的新</b>（前所未有的、性质不同的）</td></tr></table><p>保罗用的是 <b>καινότης</b>（καινός 的名词）。</p><p>不是「新出厂的旧型号」。<br>是<b>一种以前没有过的生命</b>。</p><p>（同字用于林后5:17「若有人在基督里，他就是<b>新造</b>的人」；启21:5「我将一切都<b>更新</b>了」）</p><p>★ 亮光三：περιπατέω ——一举一动</p><p>这个字的字面是「走来走去」，是希伯来文 <b>הָלַךְ（halak）</b> 的希腊化用法，指<b>日常的生活方式</b>。</p><p>和合本译「一举一动」极为传神。</p><p>保罗不是说「你要有一次属灵的高峰经验」，<br>是说「你<b>走路的方式</b>要不一样」。</p><p>新生命显在哪里？显在你怎么走路——<br>怎么说话、怎么用钱、怎么对待家人、怎么在没有人看见的时候做决定。</p><p>★ 亮光四：διὰ τῆς δόξης τοῦ πατρός（借着父的荣耀）</p><p>保罗本可以说「借着父的<b>能力</b>」——但他说的是「<b>荣耀</b>」。</p><p>在旧约，「荣耀」（כָּבוֹד／δόξα）是神彰显自己同在的那个重量。</p><p>保罗在说：把耶稣从死里拉出来的，是父自己显明出来的那份荣耀。</p><p>而同一份荣耀，现在推动我们的日常生活。</p>","exp":"<p>弟兄姊妹，第4节有一个常被忽略的逻辑：</p><p>保罗没有说「我们与祂一同埋葬，也要与祂一同复活（将来）」。</p><p>他说的是：我们与祂一同埋葬，<b>为要叫我们现在就有新生的样式</b>。</p><p>复活的力量，不是留到将来才用的。</p><p>它现在就在推动你今天怎么走路。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·</p>","lit":"<p>「因为我们若已经<b>与祂长成一体</b>，在祂死的样式上，那么在复活的样式上也必如此。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>联合</td><td>σύμφυτος</td><td>symphytos</td><td>G4854</td><td>σύν + φύω（生长）</td><td><b>一同长成、接合生长</b></td><td><b>新约仅此一次</b></td></tr><tr><td>形状</td><td>ὁμοίωμα</td><td>homoiōma</td><td>G3667</td><td>ὅμοιος（相似）</td><td>样式、形状</td><td>见下</td></tr></table>","gram":"<p>★ σύμφυτος ——嫁接的画面</p><p>这个字在古典希腊文与医学文献中用于：</p><p>- <b>植物的嫁接</b>：两株植物接在一起，长成一体<br>- <b>伤口的愈合</b>：断骨接回去，长在一起<br>- 天生一体的、与生俱来的</p><p>保罗选的不是「捆在一起」，是「<b>长在一起</b>」。</p><p>捆在一起，还可以解开。<br>长在一起，就分不开了。</p><p>（罗11:17保罗用了另一个相关的嫁接画面：「野橄榄……接在其中」）</p><p>★ γεγόναμεν 是完成式</p><p>「已经长成」——一个过去完成的动作，效果持续至今。</p><p>这不是我们要努力维持的状态，是一个已经接合完成的事实。</p>","exp":"<p>弟兄姊妹，这一节给了我们对付罪最深的一个角度。</p><p>问题不是「我要怎么靠意志力离开罪」。<br>问题是「我已经被接在谁身上」。</p><p>一根枝子如果被接在一棵树上，它会结什么果子？</p><p>不是靠它努力，是靠它接在哪里。</p>"},{"a":6,"z":6,"star":true,"grk":"<p>τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ·</p>","lit":"<p>「我们<b>知道</b>这事：我们的<b>旧人</b>已经与祂<b>一同被钉十字架</b>，为要使那<b>罪的身体被废掉功用</b>，好叫我们<b>不再作罪的奴隶</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>知道</td><td>γινώσκοντες</td><td>ginōskontes</td><td>G1097</td><td>—</td><td><b>认识、确知</b>（现在分词）</td><td>三个动词的第一个</td></tr><tr><td>旧人</td><td>ὁ παλαιὸς ἄνθρωπος</td><td>palaios anthrōpos</td><td>G3820</td><td>παλαιός（旧的、过时的）</td><td><b>旧的那个人</b></td><td>见下</td></tr><tr><td>同钉十字架</td><td>συνεσταυρώθη</td><td>synestaurōthē</td><td>G4957</td><td>σύν + σταυρόω</td><td><b>一同被钉</b></td><td><b>不定过去被动：已成的事</b></td></tr><tr><td>灭绝</td><td>καταργηθῇ</td><td>katargēthē</td><td>G2673</td><td>κατά + ἀργός（无效）</td><td><b>被废掉功用、被解除职权</b></td><td><b>不是「消灭」！</b></td></tr><tr><td>奴仆</td><td>δουλεύειν</td><td>douleuein</td><td>G1398</td><td>δοῦλος</td><td>作奴隶、服事</td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：καταργέω 不是「消灭」</p><p>这是全章最重要的一个字义澄清。</p><p>和合本译「灭绝」，容易让人以为「罪身」已经不存在了。</p><p>但 καταργέω 的意思是：</p><p>κατά（彻底）+ ἀργός（不工作、闲置）＝ <b>使之失去作用、解除职权、使之无效</b>。</p><p>这个字我们在罗马书已经见过三次：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td>3:3</td><td>人的不信能<b>废掉</b>神的信实吗？</td></tr><tr><td>3:31</td><td>我们因信<b>废了</b>律法吗？</td></tr><tr><td><b>6:6</b></td><td><b>使罪身「灭绝」</b></td></tr><tr><td>7:2</td><td>丈夫死了，妻子就<b>脱离</b>丈夫的律法</td></tr></table><p>保罗不是说「罪的身体被摧毁了」。<br>保罗是说：<b>它被解职了</b>。</p><p>就像一个被免职的官员——他还在，还会发表意见，还会试图指挥你，<br>但他已经没有职权了。</p><p>这正是为什么6:12还要命令「不要容罪作王」——</p><p>因为那个被解职的家伙，还在试图坐上王位。</p><p>★ 亮光二：「旧人」是谁？</p><p>ὁ παλαιὸς ἄνθρωπος——「旧的那个人」。</p><p>保罗在其他地方也用这个词：</p><p>- <b>弗4:22</b>「脱去你们从前行为上的<b>旧人</b>」<br>- <b>西3:9</b>「因你们已经<b>脱去旧人</b>和旧人的行为」</p><p>两种主要理解：</p><table><tr><th>理解</th><th>主张</th></tr><tr><td><b>A. 旧的自我／本性</b></td><td>我里面那个堕落的性情被钉死了</td></tr><tr><td><b>B. 旧的「我」——在亚当里的那个人</b></td><td>我作为「亚当族类」的那个身分被钉死了</td></tr></table><p>我认为 <b>B</b> 较符合上下文：</p><p>因为第五章刚刚讲完「在亚当里」与「在基督里」两个体系。</p><p>「旧人」＝ 那个属于亚当、活在罪权下、被设立为罪人的<b>我</b>。<br>那个「我」已经和基督一同被钉了。</p><p>注意：不是「我里面有一部分死了，还有一部分活着」——<br>是「旧的那整个我」死了，「新的我」活了。</p><p>基督徒不是「一半新一半旧」，是<b>一个新人，但还带着旧习惯</b>。</p><p>★ 亮光三：「罪身」（τὸ σῶμα τῆς ἁμαρτίας）是什么？</p><p>不是说「身体本身是罪恶的」——那是希腊二元论，不是圣经。</p><p>「罪的身体」指的是：<b>被罪所支配、作为罪之工具的这个身体</b>。</p><p>证据：6:12–13保罗立刻说到「你们必死的<b>身上</b>」与「你们的<b>肢体</b>」——</p><p>保罗的重点不是身体要被摧毁，是<b>身体要换主人</b>。</p><p>同样的手，同样的舌头，同样的眼睛——<br>从「不义的兵器」变成「义的兵器」（6:13）。</p><p>★ 亮光四：两个目的子句（ἵνα ... τοῦ ...）</p><pre>συνεσταυρώθη（旧人被同钉）\n   ↓ ἵνα（为要）\nκαταργηθῇ τὸ σῶμα τῆς ἁμαρτίας（罪身被解职）\n   ↓ τοῦ（好叫）\nμηκέτι δουλεύειν（不再作奴隶）</pre><p>这是一条因果链：旧人被钉 → 罪身被解职 → 我们不再作奴隶。</p><p>注意最后的目的：不是「我们不再犯错」，是「我们<b>不再作奴隶</b>」。</p><p>保罗谈的是<b>归属与权柄</b>，不是<b>行为的完美</b>。</p>","exp":"<p><b>经文本身明确表达的：</b> 旧人已与基督同钉，罪的身体被解除职权，目的是使我们不再作罪的奴隶。<br><b>合理推论的生命应用：</b> 当罪来的时候，正确的回应不是「我要更用力抵抗」，而是「你已经被解职了，你凭什么命令我？」</p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.<br>9 …θάνατος αὐτοῦ οὐκέτι κυριεύει.<br>10 ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.</p>","lit":"<p>7「因为那已经死了的人，<b>已被判定与罪无涉</b>。」<br>8「我们若与基督同死，就信我们也必<b>与祂同活</b>——」<br>9「因为知道基督既从死人中复活，就<b>不再死了</b>；<b>死也不再作祂的主</b>。」<br>10「因为祂死，是<b>向罪死</b>，<b>只此一次</b>；祂活，是<b>向神活</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>脱离了罪</td><td>δεδικαίωται ἀπὸ τῆς ἁμαρτίας</td><td>dedikaiōtai</td><td>G1344</td><td><b>完成被动式：已被宣告脱离罪</b>（字面是「被称义」）</td></tr><tr><td>作主</td><td>κυριεύει</td><td>kyrieuei</td><td>G2961</td><td>κύριος（主）：<b>作主人、掌权</b></td></tr><tr><td>只有一次</td><td>ἐφάπαξ</td><td>ephapax</td><td>G2178</td><td>ἐπί + ἅπαξ：<b>一次而永远</b></td></tr></table>","gram":"<p>★ 亮光一：6:7的动词是「称义」</p><p>「已死的人是<b>脱离了罪</b>」——原文用的动词是 <b>δικαιόω（称义）</b>！</p><p>字面直译是：「那已死的人，<b>已经被称义脱离了罪</b>。」</p><p>保罗把法庭语言用在这里：</p><p>一个人死了，法律对他的追诉就终止了。<br>死亡结束了罪对他的法律管辖权。</p><p>（当时犹太拉比有一句类似的说法：「人一死，就脱离了律法与诫命的约束。」保罗在此把这个常识神学化了。）</p><p>★ 亮光二：κυριεύω ——「作主」</p><p>这个字的字根是 <b>κύριος（主）</b>。</p><p>「死也不再<b>作他的主</b>了」（6:9）——与6:14「罪必不能<b>作你们的主</b>」是同一个字。</p><p>保罗在建立一个平行：</p><p>死对基督没有主权了（6:9）。<br>罪对你也没有主权了（6:14）。</p><p>因为你们是接在一起的（6:5 σύμφυτος）。</p><p>★ 亮光三：ἐφάπαξ ——一次而永远</p><p>这个字在新约出现5次，其中4次在希伯来书，讲基督的献祭：</p><p>- <b>来7:27</b>「因为他只<b>一次</b>将自己献上」<br>- <b>来9:12</b>「只<b>一次</b>进入圣所，成了永远赎罪的事」<br>- <b>来10:10</b>「基督只<b>一次</b>献上他的身体」</p><p>保罗在6:10说：祂向罪死，只有一次。</p><p>意思是：这件事<b>不需要重复</b>，也<b>不可能被推翻</b>。</p><p>★ 亮光四：6:10的双重「向」</p><pre>他死是「向罪」（τῇ ἁμαρτίᾳ）死了 —— 那个关系，结束了\n他活是「向神」（τῷ θεῷ）活着     —— 这个关系，是全部</pre><p>而6:11要说：你也照样。</p>","exp":"<p>弟兄姊妹，6:3–10这一整段，只做了一件事：</p><p>它让你<b>知道</b>（γινώσκοντες, 6:6；εἰδότες, 6:9）。</p><p>保罗没有在这里给任何命令。</p><p>他只是一件一件地陈述事实：</p><p>- 你受洗归入祂的死（6:3）<br>- 你与祂一同埋葬（6:4）<br>- 你与祂长成一体（6:5）<br>- 你的旧人与祂同钉（6:6）<br>- 罪身被解职（6:6）<br>- 死对祂不再有主权（6:9）<br>- 祂向罪死，一次而永远（6:10）</p><p>然后——第11节，第一个命令来了。</p><p>【第三段｜6:11　算：全卷书第一个命令】</p>"},{"a":11,"z":11,"star":true,"grk":"<p>οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς [εἶναι] νεκροὺς μὲν τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>「照样，你们也要<b>持续地把自己算作</b>：向罪是死的，但向神——在基督耶稣里——是活的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>当看</td><td>λογίζεσθε</td><td>logizesthe</td><td>G3049</td><td>λόγος</td><td><b>记帐、计算、认定</b></td><td><b>现在式命令语气</b></td></tr><tr><td>自己</td><td>ἑαυτούς</td><td>heautous</td><td>G1438</td><td>—</td><td>你们自己</td><td>反身代名词</td></tr><tr><td>在基督耶稣里</td><td>ἐν Χριστῷ Ἰησοῦ</td><td>—</td><td>—</td><td>—</td><td>保罗神学的核心词组</td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：λογίζομαι ——第四章那个字回来了，但语气变了</p><p>这是全卷书最精彩的一个安排：</p><table><tr><th>出处</th><th>语态／语气</th><th>谁在算</th></tr><tr><td><b>4:3</b></td><td>ἐλογίσθη，<b>被动、直说</b></td><td><b>神</b>算亚伯拉罕为义</td></tr><tr><td><b>4:8</b></td><td>λογίσηται，<b>主动、假设</b></td><td><b>主</b>不算他为有罪</td></tr><tr><td><b>4:23–24</b></td><td>λογίζεσθαι，被动</td><td><b>神</b>要算我们为义</td></tr><tr><td><b>6:11</b></td><td>λογίζεσθε，<b>中动、命令语气</b></td><td><b>你要算！</b></td></tr></table><p>弟兄姊妹，你看见这个次序了吗？</p><p>第四章：<b>神先算了</b>。<br>第六章：<b>现在你要照着神的算法，算你自己</b>。</p><p>这是全本圣经最重要的一个属灵次序：<br>我不是靠「算」让那件事成真；我是因为那件事已经真了，所以我才敢算。</p><p>★ 亮光二：现在式命令语气</p><p>λογίζεσθε 是<b>现在式</b>命令语气，表示<b>持续、反复的动作</b>。</p><p>不是「算一次就好了」。<br>是「一直算下去」。</p><p>每一次试探来的时候，算一次。<br>每一次旧习惯招手的时候，算一次。</p><p>★ 亮光三：这是全卷书的第一个命令句</p><p>罗马书1:1到6:10，共约140节经文——</p><p>保罗<b>没有给过一个真正的行为命令</b>。</p><p>（1:11–15、3:4等处有语气词，但不是给读者的生活命令）</p><p>第一个命令，在6:11。</p><p>而那个命令是什么？</p><p>不是「你要努力」。<br>不是「你要付出」。<br>不是「你要改变」。</p><p>是——<b>「你要这样算」</b>。</p><p>神给我们的第一个命令，是关于<b>你怎么看自己</b>。</p><p>这正是321最核心的一句话的圣经根据：</p><p>改变观念，就改变生命。</p><p>★ 亮光四：「算」不是自我催眠</p><p>这一点必须讲清楚，否则6:11会被误读成一种积极思想法。</p><table><tr><th>自我催眠</th><th>圣经的「算」</th></tr><tr><td>把不存在的事说成存在</td><td>把<b>已经存在的事</b>认定下来</td></tr><tr><td>靠反复暗示制造事实</td><td>靠神的宣告接受事实</td></tr><tr><td>根据在我的意志</td><td>根据在基督的死与复活（6:3–10）</td></tr></table><p>这就是为什么保罗把6:3–10放在6:11前面。</p><p>你要先「知道」，才能「算」。</p><p>没有前面八节的事实，第11节就只是一句心灵鸡汤。</p><p>★ 亮光五：ἐν Χριστῷ Ἰησοῦ（在基督耶稣里）</p><p>这是保罗神学的招牌词组（新约中出现约160次以上）。</p><p>注意它在本节的位置：</p><pre>向罪  —— 是死的\n向神  —— 是活的  【在基督耶稣里】</pre><p>「在基督里」不是修辞，是<b>地点</b>。</p><p>我向神活着，不是因为我变好了，是因为我在祂里面。</p>","exp":"<p>弟兄姊妹，6:11是整章的枢纽，也是整个基督徒生活的枢纽。</p><p>它的位置很重要：</p><pre>6:3–10  【知道】—— 事实（没有命令）\n6:11    【算】  —— 观念（第一个命令）\n6:12–13 【献上】—— 行动（一连串命令）</pre><p>保罗没有从「行动」开始。</p><p>因为从行动开始的，是律法主义。<br>从观念开始的，才是福音。</p><p>而这一节同时解释了一件事：为什么许多基督徒很努力，却一直原地打转？</p><p>因为他们跳过了第11节。</p><p>他们知道教义（第3–10节），也很努力行动（第12–13节），<br>但中间那个「算」，从来没有做过。</p><p>结果就是：知识在脑子里，行动靠意志力，中间没有桥。</p><p>【第四段｜6:12–14　献上：不要容罪作王】</p>"},{"a":12,"z":12,"star":false,"grk":"<p>Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,</p>","lit":"<p>「所以，<b>不要让</b>罪继续<b>作王</b>，在你们那必死的身体上，以致你们<b>顺从</b>它的私欲。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>作王</td><td>βασιλευέτω</td><td>basileuetō</td><td>G936</td><td><b>现在式命令：不要继续让它作王</b>（第五章的字！）</td></tr><tr><td>必死的</td><td>θνητός</td><td>thnētos</td><td>G2349</td><td><b>会死的、必朽坏的</b>（不是「邪恶的」）</td></tr><tr><td>顺从</td><td>ὑπακούειν</td><td>hypakouein</td><td>G5219</td><td><b>在底下听</b>（5:19 ὑπακοή 同字根）</td></tr><tr><td>私欲</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>ἐπί + θυμός：<b>强烈的渴望</b>（本身中性，看对象）</td></tr></table>","gram":"<p>★ 亮光一：βασιλεύω ——第五章的字，换了角色</p><p>这个字我们在第五章追踪过5次：</p><pre>5:14  死作了王\n5:17  死因这一人作了王\n5:17  我们要在生命中作王\n5:21  罪作王叫人死\n5:21  恩典作王\n   ↓\n6:12  【命令】不要容罪作王</pre><p>第五章：罪作王，是一个<b>已被推翻的政权</b>。<br>第六章：所以——<b>别让那个被推翻的政权继续发号施令</b>。</p><p>这正是6:6「罪身被<b>解职</b>」（καταργέω）的实践面。</p><p>一个被解职的官员，如果你还听他的，他就还在管你。<br>不是因为他有权柄，是因为你还在服从。</p><p>★ 亮光二：现在式命令的意义</p><p>μὴ βασιλευέτω 是<b>现在式</b>命令的否定式。</p><p>在希腊文中，这通常表示：<b>停止一个正在进行的动作</b>。</p><p>保罗不是说「将来不要让它作王」，<br>是说：「<b>它现在还在作王的那些地方，停下来</b>。」</p><p>★ 亮光三：θνητός（必死的）不是贬义</p><p>保罗说「你们<b>必死的</b>身上」，不是说「你们邪恶的身体」。</p><p>θνητός 只是说：这个身体会朽坏、会老、会死。</p><p>保罗从不把身体本身当作罪的来源——那是希腊哲学，不是圣经。</p><p>证据：8:11「也必借着住在你们心里的圣灵，使你们<b>必死的身体</b>又活过来。」<br>同一个字！那个必死的身体，将来要复活。</p><p>★ 亮光四：ὑπακούειν ——又是「听」</p><p>「顺从身子的私欲」——ὑπακούω，「在底下听」。</p><p>这正是5:19的字（ὑπακοή）。</p><p>保罗一直在问同一个问题：你在谁的底下听？</p><p>第五章：亚当听偏了，基督听对了。<br>第六章：现在，你在谁的底下听？私欲，还是神？</p>","exp":"<p>弟兄姊妹，这一节的画面是政治性的。</p><p>罪的政权已经被推翻了（6:6）。<br>但它还在你的国土上活动，还在下命令。</p><p>而它唯一的权力来源，是——<b>你还在听</b>。</p>"},{"a":13,"z":13,"star":true,"grk":"<p>μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.</p>","lit":"<p>「也<b>不要继续</b>把你们的<b>肢体</b>当作不义的<b>兵器</b>献给罪，<b>乃要（一次决断地）献上</b>你们自己给神——像从死人中活过来的人——并把你们的肢体当作义的<b>兵器</b>献给神。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>献给</td><td>παριστάνετε／παραστήσατε</td><td>paristanete/parastēsate</td><td>G3936</td><td>παρά + ἵστημι</td><td><b>摆在旁边、交出去、呈献</b></td><td>见下</td></tr><tr><td>肢体</td><td>μέλη</td><td>melē</td><td>G3196</td><td>—</td><td>身体的部位</td><td>手、眼、舌、脚……</td></tr><tr><td>器具</td><td>ὅπλα</td><td>hopla</td><td>G3696</td><td>—</td><td><b>兵器、军械</b></td><td>见下</td></tr></table>","gram":"<p>★ 亮光一：两个命令，两种时态</p><p>这是全章最精致的文法设计：</p><pre>μηδὲ παριστάνετε   —— 【现在式命令，否定】\n                      「不要继续献上」——停止一个持续中的习惯\n\nἀλλὰ παραστήσατε   —— 【不定过去式命令，肯定】\n                      「（现在，一次）献上！」——一个决断的行动</pre><p>弟兄姊妹，这两个时态画出了基督徒生活的两面：</p><p>一面是<b>每天的停止</b>：那个习惯、那个网站、那个念头——<b>停下来</b>（现在式）。<br>一面是<b>一次的交出</b>：主啊，我把自己给祢——<b>现在，就一次</b>（不定过去式）。</p><p>两者缺一不可。<br>只有「每天停止」，会变成一场没有终点的苦战。<br>只有「一次奉献」，会变成一个没有兑现的承诺。</p><p>★ 亮光二：ὅπλα ——是「兵器」，不是「工具」</p><p>中文「器具」偏中性，容易让人想到「工具箱」。</p><p>但 ὅπλον 在第一世纪主要指：<b>武器、军械</b>。</p><p>同字用于：</p><p>- <b>约18:3</b>：犹大带着兵丁，拿着灯笼、火把、<b>兵器</b><br>- <b>林后10:4</b>：「我们争战的<b>兵器</b>本不是属血气的」<br>- <b>罗13:12</b>：「当穿上光明的<b>兵器</b>」</p><p>保罗的画面是：</p><p>你的手、你的眼睛、你的舌头、你的时间、你的钱包——</p><p>那些不是中立的工具。那些是<b>武器</b>。</p><p>而武器一定在某一方手上。</p><p>这意味着什么？</p><p>意味着没有「中立地带」。</p><p>你今天没有把舌头献给神，不等于那条舌头在放假。<br>它在另一边的军械库里。</p><p>★ 亮光三：παρίστημι 的献祭背景</p><p>这个字在七十士译本中，用于<b>把祭牲牵到祭坛前呈献</b>。</p><p>保罗在12:1用同一个字：</p><p>「将身体献上（παραστῆσαι），当作活祭。」</p><p>罗6:13是罗12:1的第一次出现。<br>保罗在第六章埋下的种子，在第十二章开花。</p><p>★ 亮光四：ὡσεὶ ἐκ νεκρῶν ζῶντας（像从死里复活的人）</p><p>这半句是全节的理由。</p><p>你凭什么可以把自己交出去？</p><p>因为你是「从死人中活过来的人」。</p><p>一个死了又活过来的人，对这个世界的东西，握力会不一样。</p>","exp":"<p>弟兄姊妹，6:13把抽象的神学，落到了具体的身体部位。</p><p>「肢体」（μέλη）——那是很具体的东西：</p><p>- 我的<b>眼睛</b>今天看了什么？<br>- 我的<b>舌头</b>今天说了什么？<br>- 我的<b>手</b>今天做了什么？<br>- 我的<b>脚</b>今天去了哪里？<br>- 我的<b>时间</b>今天给了谁？</p><p>成圣不是一个抽象的境界。<br>成圣是一场关于<b>身体部位归属权</b>的具体交涉。</p>"},{"a":14,"z":14,"star":false,"grk":"<p>ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει· οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.</p>","lit":"<p>「因为罪<b>必不能作你们的主</b>；因为你们不是<b>在律法之下</b>，乃是<b>在恩典之下</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>作主</td><td>κυριεύσει</td><td>kyrieusei</td><td>G2961</td><td><b>未来式：必不能作主</b>（6:9同字）</td></tr><tr><td>在……之下</td><td>ὑπό + 直接受格</td><td>hypo</td><td>G5259</td><td><b>在……的权柄／统治之下</b></td></tr></table>","gram":"<p>★ 亮光一：未来式是应许，不是命令</p><p>「罪必不能作你们的主」——这是<b>直说语气未来式</b>，不是命令。</p><p>保罗没有说：「你要努力，让罪不作你的主。」<br>保罗说：「罪<b>必不能</b>作你们的主。」</p><p>这是一个<b>应许</b>，一个宣告。</p><p>注意6:12–13是命令，6:14是应许。</p><p>命令的力量，来自那个应许。</p><p>不是「你努力，所以罪不能作主」；<br>是「罪不能作主，所以你努力得动」。</p><p>★ 亮光二：「不在律法之下，乃在恩典之下」是什么意思？</p><p>这句话极容易被误解（见第二十部分），所以要看保罗<b>在此的论证用途</b>。</p><p>保罗是在给6:14上半句一个<b>理由</b>：</p><pre>罪必不能作你们的主\n   ↑ 为什么？\n因为你们不在律法之下，乃在恩典之下</pre><p>保罗在说：律法<b>不能</b>使你胜过罪。</p><p>律法能告诉你哪里有线，但它给不了你跨不过去的力量（第七章整章就在讲这件事）。</p><p>能胜过罪的，是恩典的权势。</p><p>这正是5:21的回响：「恩典也借着义<b>作王</b>。」</p><p>问题从来不是「有没有规矩」，而是「谁在作王」。</p>","exp":"<p>弟兄姊妹，6:14是全章的转轴，也是第七、第八章的门。</p><p>保罗说：如果你还想靠「律法之下」的方式对付罪——<br>那你会经历第七章。</p><p>如果你活在「恩典之下」——<br>那你会经历第八章。</p><p>【第五段｜6:15–19　作谁的奴仆】</p>"},{"a":15,"z":16,"star":false,"grk":"<p>16 οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;</p>","lit":"<p>16「你们岂不<b>知道</b>：你们把自己献给谁作奴仆去<b>顺从</b>，你们就是那位的奴仆——你们所顺从的那一位；或是罪的（奴仆），以至于死；或是顺从的（奴仆），以至于义。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>犯罪</td><td>ἁμαρτήσωμεν</td><td>hamartēsōmen</td><td>G264</td><td><b>不定过去式假设语气：偶尔犯一次</b></td></tr><tr><td>奴仆</td><td>δοῦλος</td><td>doulos</td><td>G1401</td><td><b>完全归属另一人的奴隶</b>（不是雇工）</td></tr><tr><td>顺从</td><td>ὑπακοή／ὑπακούετε</td><td>—</td><td>G5218/G5219</td><td><b>在底下听</b>（5:19同字根）</td></tr></table>","gram":"<p>★ 亮光一：6:15的问题与6:1不同</p><table><tr><th>6:1</th><th>6:15</th></tr><tr><td>ἐπιμένωμεν（<b>继续住在</b>罪里）</td><td>ἁμαρτήσωμεν（<b>犯一次</b>罪）</td></tr><tr><td>现在式：生活方式</td><td><b>不定过去式：偶一为之</b></td></tr><tr><td>回答：你已经死了（6:2）</td><td>回答：你换了主人（6:16–18）</td></tr></table><p>弟兄姊妹，这个区分极其重要，因为它反映了真实的人心。</p><p>第一个问题是：「我可以一直住在罪里吗？」——大多数人不敢这样问。<br>第二个问题是：「那偶尔一次总可以吧？」——这个问题，每个人都问过。</p><p>而保罗的回答同样是：<b>断乎不可</b>。</p><p>★ 亮光二：δοῦλος 的绝对性</p><p>在罗马社会，δοῦλος 不是「员工」。</p><p>一个奴隶：</p><p>- 没有自己的时间<br>- 没有自己的财产<br>- <b>不能同时属于两个主人</b></p><p>这正是主耶稣说的：「一个人不能事奉两个主。」（太6:24）</p><p>★ 亮光三：ᾧ ὑπακούετε ——「你所顺从的那一位」</p><p>保罗给了一个非常实际的判准：</p><p>你怎么知道你是谁的奴仆？</p><p>看你<b>听谁的</b>。</p><p>不是看你怎么自称，不是看你的宗教身分，是看——</p><p>当那个声音响起来的时候，你的身体往哪里走。</p>","exp":"<p>弟兄姊妹，6:16拆掉了一个很普遍的幻觉：</p><p>「我可以不属于任何人。我是自由的。」</p><p>保罗说：没有这种东西。</p><p>人不是在「有主人」与「没主人」之间选。<br>人是在「哪一个主人」之间选。</p><p>而更深的一层：</p><p>保罗说「你们<b>献上</b>自己作奴仆」——</p><p>这是一个<b>主动的动作</b>。</p><p>没有人被绑架。是我们自己把自己交出去的。<br>每一次顺从，就是又交了一次。</p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,<br>18 ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ.</p>","lit":"<p>17「感谢神！因为你们从前是罪的奴仆，但你们<b>从心里顺从了</b>——<b>你们被交付进去的</b>那个教训的<b>模子</b>。」<br>18「你们既<b>被释放</b>脱离了罪，就<b>被奴役</b>于义了。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>从心里</td><td>ἐκ καρδίας</td><td>ek kardias</td><td>G2588</td><td>—</td><td><b>从心发出</b></td><td>不是外在的服从</td></tr><tr><td>传给</td><td>παρεδόθητε</td><td>paredothēte</td><td>G3860</td><td>παρά + δίδωμι</td><td><b>你们被交付了</b></td><td><b>见下——语序惊人</b></td></tr><tr><td>模范</td><td>τύπος</td><td>typos</td><td>G5179</td><td>τύπτω（打、印）</td><td><b>模子、印记</b></td><td>5:14同字</td></tr><tr><td>得了释放</td><td>ἐλευθερωθέντες</td><td>eleutherōthentes</td><td>G1659</td><td>ἐλεύθερος（自由）</td><td><b>被释放</b>（释奴用语）</td><td>被动式</td></tr><tr><td>作了奴仆</td><td>ἐδουλώθητε</td><td>edoulōthēte</td><td>G1402</td><td>δοῦλος</td><td><b>被奴役</b></td><td>被动式</td></tr></table>","gram":"<p>★ 亮光一：6:17的语序极其惊人</p><p>中文译「顺服了<b>所传给你们</b>道理的模范」——听起来是「道理被传给你们」。</p><p>但希腊文的语序是：</p><p>εἰς ὃν παρεδόθητε τύπον διδαχῆς</p><p>「（你们顺从了）那个<b>你们被交付进去的</b>教训的模子。」</p><p>主词与受词对调了！</p><table><tr><th>一般的想法</th><th>保罗的说法</th></tr><tr><td><b>道理</b>被交给<b>你</b></td><td><b>你</b>被交给<b>道理</b></td></tr><tr><td>我掌握真理</td><td><b>真理掌握我</b></td></tr><tr><td>我把圣经拿在手上</td><td>我被放进圣经的模子里</td></tr></table><p>弟兄姊妹，这是全章最谦卑、也最扎人的一句话。</p><p>我们常说「我学了很多真理」——好像真理是我收藏的东西。</p><p>保罗说：不是。<b>是你被交进去了</b>。</p><p>★ 亮光二：τύπος（模范）——第五章的字</p><p>τύπος 的字面是「打击留下的印记」，引申为<b>模子</b>。</p><p>在5:14，保罗说「亚当乃是那以后要来之人的<b>预像</b>（τύπος）」。</p><p>同一个字，两种用法：</p><p>5:14：亚当是一个<b>指向基督</b>的模子。<br>6:17：福音的教训是一个<b>塑造你</b>的模子。</p><p>这个画面极美：</p><p>熔化的金属被倒进模子里，冷却之后，就成了模子的形状。</p><p>保罗说：你被倒进去了。</p><p>★ 亮光三：ἐκ καρδίας（从心里）</p><p>这正是2:29「真割礼也是心里的」的实现。</p><p>不是外在的仪文，是心里的顺从。</p><p>★ 亮光四：两个被动式的张力（6:18）</p><pre>ἐλευθερωθέντες  —— 被释放（自由了！）\nἐδουλώθητε      —— 被奴役（又作奴仆了？）</pre><p>保罗刻意把「自由」与「奴役」放在同一句话里。</p><p>这是全章最反直觉、也最真实的一句话：</p><p>自由，不是没有主人。<br>自由，是有一位对的主人。</p><p>（保罗自己在6:19承认这个比喻的限度——见下一节）</p>","exp":"<p>弟兄姊妹，6:17里有一个字很容易被跳过：「<b>感谢神</b>！」</p><p>保罗在讲一大段严肃的教导，突然插进一句敬拜。</p><p>为什么？</p><p>因为他写到「你们从前虽然作罪的奴仆，现今却从心里顺服了」的时候，<br>他想起这件事根本不是他们自己做到的。</p><p>一个奴隶，怎么可能自己换主人？</p><p>所以保罗停下来，说了两个字：感谢神。</p>"},{"a":19,"z":19,"star":false,"grk":"<p>ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν. ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.</p>","lit":"<p>「我是<b>照着人的方式</b>说话，因为你们肉体的软弱。正如你们从前把肢体献上作奴仆给不洁与不法，以至于<b>更多的不法</b>；照样，如今也要把肢体献上作奴仆给义，以至于<b>成圣</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>照人的常话</td><td>ἀνθρώπινον λέγω</td><td>anthrōpinon legō</td><td>G442</td><td><b>我用人的方式说话</b>（保罗的自我限定）</td></tr><tr><td>不法</td><td>ἀνομία</td><td>anomia</td><td>G458</td><td>ἀ + νόμος：<b>无法无天</b></td></tr><tr><td>成圣</td><td>ἁγιασμός</td><td>hagiasmos</td><td>G38</td><td>ἅγιος（圣）：<b>被分别出来归神的过程</b></td></tr></table>","gram":"<p>★ 亮光一：ἀνθρώπινον λέγω ——保罗为自己的比喻道歉</p><p>保罗在这里做了一件很少见的事：他为自己刚用的比喻<b>加注</b>。</p><p>「我因你们肉体的软弱，就照人的常话对你们说。」</p><p>为什么？</p><p>因为「奴仆」这个比喻，只讲对了一半。</p><p>它对的地方：<b>归属是绝对的、你只能有一个主人</b>。<br>它不对的地方：<b>神不把我们当奴隶看</b>。</p><p>证据就在两章之后：</p><p>罗8:15「你们所受的，不是奴仆的心，仍旧害怕；所受的，乃是<b>儿子的心</b>，因此我们呼叫：『阿爸！父！』」</p><p>保罗用「奴仆」来讲<b>归属的绝对性</b>；<br>然后在第八章立刻升级成「儿子」，来讲<b>关系的亲密性</b>。</p><p>两章要一起读。</p><p>★ 亮光二：两个「以至于」的方向</p><pre>献给不洁不法 → εἰς τὴν ἀνομίαν（以至于「更多的」不法）\n献给义       → εἰς ἁγιασμόν  （以至于成圣）</pre><p>保罗指出罪的一个特性：它会<b>滚雪球</b>。</p><p>不法带来更多的不法。</p><p>而义也一样有动能：献上带来成圣。</p><p>两条路，都是会加速的。</p><p>★ 亮光三：ἁγιασμός 是「过程」</p><p>这个以 -μός 结尾的名词，通常表示<b>过程</b>而非<b>状态</b>。</p><p>成圣不是一个你某天达到的境界，是一条你每天在走的路。</p>","exp":"<p>弟兄姊妹，6:19把6:13的命令<b>重复了一次</b>，但加上了一个字：</p><p>「现今也要<b>照样</b>……」</p><p>保罗在说：你已经很会做这件事了。</p><p>你以前每天都在把肢体交出去——交给不洁、交给不法。<br>你做得又熟练、又自然、又不需要提醒。</p><p>现在，<b>用同样的熟练度</b>，交给义。</p><p>【第六段｜6:20–23　两种结局】</p>"},{"a":20,"z":22,"star":false,"grk":"<p>21 τίνα οὖν καρπὸν εἴχετε τότε; ἐφ' οἷς νῦν ἐπαισχύνεσθε, τὸ γὰρ τέλος ἐκείνων θάνατος.</p>","lit":"<p>20「因为你们作罪之奴仆的时候，<b>对义是自由的</b>。」<br>21「那么，你们当时得了什么<b>果子</b>呢？——就是你们<b>如今以为羞耻</b>的那些事；因为那些事的<b>结局是死</b>。」<br>22「但如今，你们<b>已从罪里得了自由</b>，<b>作了神的奴仆</b>，就有<b>成圣</b>的果子，而那<b>结局是永生</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>果子</td><td>καρπός</td><td>karpos</td><td>G2590</td><td>果实、收成</td></tr><tr><td>羞耻</td><td>ἐπαισχύνεσθε</td><td>epaischynesthe</td><td>G1870</td><td><b>以……为耻</b>（1:16「我不以福音为耻」同字！）</td></tr><tr><td>结局</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>终点、最终的结果</b></td></tr></table>","gram":"<p>★ 亮光一：ἐπαισχύνομαι ——回到1:16</p><p>「你们现今所看为<b>羞耻</b>的事」——ἐπαισχύνεσθε。</p><p>这正是1:16的那个字：</p><p>「我不以福音为耻（οὐ ἐπαισχύνομαι）。」</p><p>保罗在罗马书的开头说：福音不叫我羞耻。<br>在第六章说：罪的果子，才是叫你羞耻的那个。</p><p>一个是你不必以为耻的；一个是你回头看会脸红的。</p><p>★ 亮光二：τέλος（结局）的重量</p><p>这个字不只是「结束」，是「<b>最终要走到的那一点</b>」。</p><p>保罗在问一个很实际的问题：</p><p>那条路，走到底，是什么？</p><p>这是对付试探最有力的问法之一。</p><p>试探从来不让你看 τέλος。<br>它只让你看下一步。</p><p>★ 亮光三：6:21的一个尖锐问句</p><p>「当日有什么果子呢？」</p><p>保罗问的是：那些事，最后给了你什么？</p><p>弟兄姊妹，这是一个诚实的人才敢回答的问题。</p><p>那些年、那些夜晚、那些选择——<br>收成在哪里？</p>","exp":"<p>注意6:22有一个微妙的用词改变：</p><pre>6:18  你们作了「义」的奴仆\n6:22  你们作了「神」的奴仆</pre><p>从抽象的「义」，变成有位格的「神」。</p><p>保罗在收尾的时候，把焦点从一个原则，带回到一个位格。</p><p>成圣不是服从一套标准，是属于一位主。</p>"},{"a":23,"z":23,"star":true,"grk":"<p>τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.</p>","lit":"<p>「因为罪的<b>军饷</b>是死；但神的<b>白白恩赐</b>，是永生——在我们的主基督耶稣里。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>工价</td><td>ὀψώνια</td><td>opsōnia</td><td>G3800</td><td>ὄψον（口粮）+ ὠνέομαι（买）</td><td><b>士兵的口粮与军饷</b></td><td><b>复数</b></td></tr><tr><td>恩赐</td><td>χάρισμα</td><td>charisma</td><td>G5486</td><td>χάρις（恩典）+ -μα</td><td><b>恩典的具体产物</b></td><td><b>单数</b></td></tr><tr><td>永生</td><td>ζωὴ αἰώνιος</td><td>zōē aiōnios</td><td>G2222/G166</td><td>—</td><td>永远的生命</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ὀψώνια ——是「军饷」</p><p>这个字原指<b>士兵的口粮与定期薪饷</b>。</p><p>在新约的其他用法：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>路3:14</b></td><td>施洗约翰对兵丁说：「当以自己的<b>钱粮</b>为足。」</td></tr><tr><td><b>林前9:7</b></td><td>「有谁当兵<b>自备粮饷</b>呢？」</td></tr><tr><td><b>林后11:8</b></td><td>「我向他们取了<b>工价</b>，好服事你们。」</td></tr></table><p>两个关键特征：</p><p>1. <b>是定期发放的</b>——不是一次结清<br>2. <b>是挣来的、应得的</b>——你服役，你领饷</p><p>保罗说：罪是一个<b>准时发薪</b>的雇主。</p><p>它从不欠你。它从不迟发。<br>它每一次都准时，把你该得的，付给你。</p><p>而它付的那样东西，叫做死。</p><p>★ 亮光二：复数 vs 单数的惊人对比</p><pre>ὀψώνια（工价）—— 复数！  罪一次一次地付，分期发放\nχάρισμα（恩赐）—— 单数！  神一次给完，一个完整的礼物</pre><p>这个单复数的对比，中文完全看不出来，但它极其重要：</p><p>罪的付款方式是<b>分期的</b>——今天付你一点点空虚，明天付你一点点麻木，后天付你一点点失去。<br>你不会在某一天突然收到「死」这个大包裹；你是<b>一小笔一小笔地领</b>的。</p><p>而神的礼物是<b>一次给完的</b>——不是分期，不是试用，是整个给你。</p><p>★ 亮光三：不对称的对句</p><p>照对称逻辑，保罗应该写：</p><p>「罪的工价是死；<b>义的工价</b>是永生。」</p><p>但他没有。他写的是：</p><p>「罪的工价是死；神的<b>恩赐</b>是永生。」</p><p>一边是「挣来的」，一边是「白给的」。</p><p>这个不对称，是整章、也是整卷罗马书的缩影：</p><p>死，是你赚的。<br>生命，是祂给的。</p><p>★ 亮光四：χάρισμα ——第五章的字</p><p>这个字在5:15、5:16已经出现过（和合本译「恩赐」）。</p><p>它是 χάρις（恩典）加上 -μα 结尾，表示<b>恩典所产生的具体东西</b>。</p><p>恩典不是一种气氛，是会生出东西来的。<br>而它生出来的，叫做永生。</p><p>★ 亮光五：最后五个字</p><p>ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν——「在我们的主基督耶稣里」。</p><p>保罗在全章的最后，把地址写上了。</p><p>这份礼物在哪里领？<br>在一个人里面。</p>","exp":"<p>弟兄姊妹，6:23是全本圣经最常被引用的福音经文之一。</p><p>但它常常被抽出来单独用，失去了整章的脉络。</p><p>放回第六章来读，它的意思是：</p><pre>你以前的雇主，罪：每一天都在准时付你薪水\n   ↓\n你有没有算过，这些年你领了多少？\n   ↓\n它付的是死——一次一点，一次一点\n   ↓\n但神不是雇主，神是给礼物的\n   ↓\n祂不分期，祂一次给完\n   ↓\n而那份礼物的名字，叫做永生</pre><p>这就是为什么保罗可以斩钉截铁地回答6:1那个问题：</p><p>「我们可以仍在罪中吗？」</p><p>保罗的最终回答不是「不可以」，而是——</p><p>「你为什么要回去领那份薪水？<br>你已经有礼物了。」</p>"}],"7":[{"a":1,"z":1,"star":false,"grk":"<p>Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ' ὅσον χρόνον ζῇ;</p>","lit":"<p>「弟兄们，还是你们<b>不知道</b>——我是对懂律法的人说的——律法<b>作人的主</b>，只在他活着的期间？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>管</td><td>κυριεύει</td><td>kyrieuei</td><td>G2961</td><td>κύριος（主）</td><td><b>作主、掌权</b></td><td><b>6:9、6:14同字</b></td></tr><tr><td>活着的时候</td><td>ἐφ' ὅσον χρόνον ζῇ</td><td>—</td><td>—</td><td>—</td><td>只要他还活着</td><td>律法权柄的时效</td></tr></table>","gram":"<p>★ κυριεύω 的三次旅程</p><p>这个字（「作主」）在罗马书中的出现，是一条清楚的线：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>6:9</b></td><td><b>死</b>不再<b>作</b>基督的<b>主</b>了</td></tr><tr><td><b>6:14</b></td><td><b>罪</b>必不能<b>作</b>你们的<b>主</b></td></tr><tr><td><b>7:1</b></td><td><b>律法</b>只在人活着时<b>作</b>人的<b>主</b></td></tr></table><p>三个「主人」：死、罪、律法。</p><p>保罗一个一个地说：它们对你都没有主权了。</p><p>而解除的方式，都是同一个——<b>死亡</b>。</p>","exp":"<p>保罗在此建立一个所有人都同意的法律常识：</p><p>法律只管活人。</p><p>一个人死了，追诉就终止了。</p><p>这正是6:7已经说过的：「已死的人是脱离了罪。」</p>"},{"a":2,"z":3,"star":false,"grk":"<p>2 ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.</p>","lit":"<p>2「因为已婚的妇人，在丈夫还活着的时候，是<b>被律法绑住</b>的；但丈夫若死了，她就<b>从那丈夫的律法上被解除了职权</b>。」<br>3「所以，丈夫还活着时，她若归于别的男人，就要被称为<b>淫妇</b>；但丈夫若死了，她就<b>在律法上自由了</b>，即使归于别的男人，也<b>不是淫妇</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>有了丈夫</td><td>ὕπανδρος</td><td>hypandros</td><td>G5220</td><td>ὑπό（在下）+ ἀνήρ（丈夫）：<b>在丈夫权下的</b></td></tr><tr><td>被约束</td><td>δέδεται</td><td>dedetai</td><td>G1210</td><td><b>完成被动式：已被捆绑，且持续被绑</b></td></tr><tr><td>脱离了</td><td>κατήργηται</td><td>katērgētai</td><td>G2673</td><td><b>καταργέω——6:6那个字！</b></td></tr><tr><td>淫妇</td><td>μοιχαλίς</td><td>moichalis</td><td>G3428</td><td>奸淫的妇人</td></tr></table>","gram":"<p>★ καταργέω 又出现了</p><p>「就<b>脱离了</b>丈夫的律法」——原文正是 6:6「使罪身<b>灭绝</b>」的那个字。</p><p>这一次的用法，把这个字的意思讲得更清楚：</p><p>一个寡妇不是「被消灭了」。</p><p>她是<b>从那个法律关系中被解除了</b>。</p><p>婚姻的律法对她<b>不再有效</b>——但她本人还在，还活着，还可以再嫁。</p><p>这正是6:6的意思：罪的权柄对我失效了，但我还在。</p><p>★ δέδεται 是完成被动式</p><p>「被律法约束」——已经被绑上，而且一直绑着。</p><p>保罗要强调：这个约束是<b>真实的、持续的、无法自行解除的</b>。</p>","exp":"<p>弟兄姊妹，保罗选这个比喻，是因为它有一个特点：</p><p>婚约不能靠「努力」解除。</p><p>一个妻子不能说：「我很努力，所以我现在自由了。」</p><p>只有一件事能解除婚约：<b>死</b>。</p><p>这正是保罗的重点：</p><p>你与律法的关系，不能靠你「表现得更好」而改变。</p><p>只能靠死。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι, ἵνα καρποφορήσωμεν τῷ θεῷ.</p>","lit":"<p>「所以，我的弟兄们，你们也<b>被治死</b>了，就律法而言，是<b>借着基督的身体</b>——为要使你们<b>归属于另一位</b>，就是那从死人中被复活的，好叫我们<b>为神结果子</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>死了</td><td>ἐθανατώθητε</td><td>ethanatōthēte</td><td>G2289</td><td>θανατόω</td><td><b>被治死</b>（不定过去被动）</td><td>见下</td></tr><tr><td>基督的身体</td><td>τὸ σῶμα τοῦ Χριστοῦ</td><td>—</td><td>G4983</td><td>—</td><td>基督被钉的身体</td><td>十字架</td></tr><tr><td>归于</td><td>γενέσθαι ἑτέρῳ</td><td>—</td><td>G2087</td><td>ἕτερος（另一位）</td><td><b>成为属于另一位的</b></td><td>婚姻用语</td></tr><tr><td>结果子</td><td>καρποφορήσωμεν</td><td>karpophorēsōmen</td><td>G2592</td><td>καρπός + φέρω</td><td>结出果子</td><td>婚姻的自然结果</td></tr></table>","gram":"<p>★ 亮光一：ἐθανατώθητε 是被动式</p><p>「你们……<b>被治死</b>了」——不是「你们死了」，是「<b>你们被处死了</b>」。</p><p>这个动词在新约用于<b>司法处决</b>（太26:59「要治死他」；可14:55）。</p><p>保罗在说：那不是自然死亡，是一场<b>行刑</b>。</p><p>而行刑的地点是各各他，被处死的是基督的身体——<br>但因为你在祂里面，你也一同被处死了。</p><p>★ 亮光二：比喻的角色转换</p><p>这是本段最常被指出的「不对称」：</p><pre>比喻中（7:2–3）：丈夫死了 → 妻子自由\n应用中（7:4）  ：你死了   → 你自由</pre><p>保罗似乎把角色调换了。</p><p>几种理解：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>比喻的重点不在角色，在原则</b></td><td>原则是：<b>死亡终止法律关系</b></td></tr><tr><td><b>保罗刻意的调整</b></td><td>因为律法不会「死」（律法是圣洁的、永存的），所以死的必须是我</td></tr><tr><td><b>双重死亡</b></td><td>我死了，所以那个婚约结束了；同时我在基督里复活，可以归于另一位</td></tr></table><p>我认为第二种最贴合上下文：</p><p>保罗不能说「律法死了」——因为7:12马上要说律法是圣洁、公义、良善的。</p><p>所以死的必须是我。</p><p>★ 亮光三：「归于别人」是婚姻语言</p><p>γενέσθαι ἑτέρῳ ——字面是「成为属于另一位的」。</p><p>这正是旧约先知常用的婚姻意象（何西阿书；以赛亚书54:5「你的造物主是你的丈夫」）。</p><p>保罗在说：你不是从一段婚姻走出来，变成单身。</p><p>你是<b>改嫁了</b>。</p><p>★ 亮光四：καρποφορέω（结果子）</p><p>在婚姻的比喻中，「结果子」有一个很自然的含意：<b>生育</b>。</p><p>保罗在说：新的婚姻会结出新的果子。</p><p>而这个果子是「<b>给神的</b>」（τῷ θεῷ）。</p><p>对照7:5：「以致结成<b>死亡</b>的果子。」</p><pre>旧的婚姻（在律法之下） → 死亡的果子\n新的婚姻（归于基督）   → 给神的果子</pre>","exp":"<p>弟兄姊妹，第4节有一个极美的重点常被忽略：</p><p>保罗讲「脱离律法」，不是为了让我们<b>自由</b>。</p><p>是为了让我们<b>归属另一位</b>。</p><p>「叫你们归于别人，就是归于那从死里复活的。」</p><p>这与第六章完全一致：</p><p>人不是在「有主人」与「没主人」之间选（6:16）。<br>人也不是在「有婚约」与「没婚约」之间选。</p><p>你不是离婚变单身，你是改嫁。</p>"},{"a":5,"z":6,"star":false,"grk":"<p>5 ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·<br>6 νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.</p>","lit":"<p>5「因为当我们<b>在肉体中</b>的时候，那些<b>借着律法而来的</b>罪的情欲，就在我们的肢体中<b>发动运作</b>，以致为死亡结果子。」<br>6「但<b>如今</b>，我们既在那捆绑我们的<b>死了</b>，就<b>从律法被解除</b>了，以致我们<b>在灵的新样中</b>服事，而不在<b>仪文的旧样中</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>属肉体</td><td>ἐν τῇ σαρκί</td><td>en tē sarki</td><td>G4561</td><td><b>在肉体中</b>（一种存在状态，见下）</td></tr><tr><td>恶欲</td><td>τὰ παθήματα τῶν ἁμαρτιῶν</td><td>pathēmata</td><td>G3804</td><td><b>罪的情欲／激情</b></td></tr><tr><td>发动</td><td>ἐνηργεῖτο</td><td>enērgeito</td><td>G1754</td><td>ἐν + ἔργον：<b>在里面运作</b>（英文 energy 源出此字）</td></tr><tr><td>现今</td><td>νυνὶ δέ</td><td>nyni de</td><td>G3570</td><td><b>但如今</b>——3:21那个词组！</td></tr><tr><td>仪文</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>成文的字句（<b>2:29同字</b>）</td></tr></table>","gram":"<p>★ 亮光一：νυνὶ δέ ——「但如今」再次出现</p><p>这个词组我们在3:21见过：</p><p><b>「</b>但如今<b>，神的义在律法以外已经显明出来。」</b>（3:21）</p><p><b>「</b>但如今<b>，我们既然在捆我们的律法上死了。」</b>（7:6）</p><p>保罗用同一个转折词，标记救恩历史的两次分水岭。</p><p>★ 亮光二：γράμμα ／ πνεῦμα ——2:29的对比再现</p><pre>2:29  真割礼也是心里的，在乎灵（πνεῦμα），不在乎仪文（γράμμα）\n7:6   按着心灵（πνεύματος）的新样，不按着仪文（γράμματος）的旧样\n林后3:6 字句（γράμμα）叫人死，精意（πνεῦμα）叫人活</pre><p>保罗三处使用同一组对比。</p><p>而这组对比<b>不是</b>「圣经的字面 vs 属灵的意思」，<br>是<b>旧约时代外在的成文体系 vs 新约时代圣灵内住的实际</b>。</p><p>（详见罗马书第二章与第三章的相关讨论）</p><p>★ 亮光三：第七章唯一一次提到圣灵</p><p>7:6的「心灵」（πνεῦμα）——和合本注明「或译圣灵」。</p><p>多数注释认为此处指<b>圣灵</b>。</p><p>弟兄姊妹，请记住这个位置：</p><p>这是第七章唯一一次提到圣灵——而它在7:7的挣扎<b>开始之前</b>。</p><p>7:7–25，圣灵一次都没有出现。</p><p>然后第八章，圣灵出现约20次。</p><p>★ 亮光四：ἐν τῇ σαρκί 是状态，不是「有身体」</p><p>「属肉体」（ἐν σαρκί）在保罗书信中，通常指<b>未被圣灵更新的存在状态</b>，不是指「有身体」。</p><p>证据：8:9「如果神的灵住在你们心里，你们就<b>不属肉体</b>，乃属圣灵了。」</p><p>保罗显然不是说信徒没有身体。他是说信徒不再活在那个旧的存在秩序里。</p>","exp":"<p>弟兄姊妹，7:5有一句很吓人的话：</p><p>「那<b>因律法而生</b>的恶欲。」</p><p>保罗说：律法会<b>激起</b>罪的情欲。</p><p>这怎么可能？</p><p>保罗在7:7–13会详细解释。但先给一个生活的例子：</p><p>一张告示上写着「油漆未干，请勿触摸」——</p><p>你本来根本没注意到那面墙。</p><p>看完告示之后，你的手指开始发痒。</p><p>律法没有错。它说的是实话。</p><p>但它照出了我里面本来就有的东西——</p><p>而那个东西，一被照到，就开始动了。</p><p>【第二段｜7:7–12　律法是罪吗？】</p>"},{"a":7,"z":7,"star":true,"grk":"<p>Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου· τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· οὐκ ἐπιθυμήσεις.</p>","lit":"<p>「那么我们要说什么？律法是罪吗？<b>绝不可能</b>！但我若不是借着律法，就<b>不会认识</b>罪。因为若不是律法说『<b>不可贪心</b>』，我就不会知道贪心。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>断乎不是</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td>希腊文最强的否定</td></tr><tr><td>不知</td><td>οὐκ ἔγνων</td><td>ouk egnōn</td><td>G1097</td><td><b>不会认识</b>（经验性的认识）</td></tr><tr><td>贪心</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>强烈的渴望；<b>十诫第十条</b></td></tr></table>","gram":"<p>★ 保罗为什么单挑第十诫？</p><p>十诫的前九条，都可以在<b>外面</b>检查：</p><table><tr><th>诫命</th><th>可否从外面看见</th></tr><tr><td>不可有别的神</td><td>大致可以（你去哪里敬拜）</td></tr><tr><td>不可拜偶像</td><td>可以</td></tr><tr><td>不可妄称神的名</td><td>可以（听你说话）</td></tr><tr><td>当守安息日</td><td>可以</td></tr><tr><td>当孝敬父母</td><td>大致可以</td></tr><tr><td>不可杀人</td><td>可以</td></tr><tr><td>不可奸淫</td><td>可以</td></tr><tr><td>不可偷盗</td><td>可以</td></tr><tr><td>不可作假见证</td><td>可以</td></tr><tr><td><b>不可贪心</b></td><td><b>完全看不见</b></td></tr></table><p>弟兄姊妹，这就是为什么保罗单挑这一条。</p><p>保罗在腓3:6说：「就律法上的义说，我是<b>无可指摘</b>的。」</p><p>他在看得见的九条上，拿了满分。</p><p>然后有一天，第十条找上了他。</p><p>而第十条，是唯一一条<b>只有神和你自己知道</b>的。</p><p>★ οὐκ ἔγνων 的意义</p><p>「我就不知何为罪」——不是说保罗完全没有罪的概念。</p><p>γινώσκω 常指<b>经验性的、切身的认识</b>。</p><p>保罗的意思是：若没有律法，我<b>不会真的认出</b>那是罪。</p><p>我会以为那只是「人之常情」。</p>","exp":"<p>弟兄姊妹，7:7是一句极重要的辩护：</p><p>律法<b>不是</b>罪。</p><p>保罗在这里守住了一条线。</p><p>很多人读完第六章「不在律法之下」，会得出结论：律法是敌人。</p><p>保罗说：断乎不是。</p><p>律法是那个把「我以为只是个人习惯」的东西，正式命名为「罪」的东西。</p><p>它不制造罪。它<b>命名</b>罪。</p>"},{"a":8,"z":11,"star":true,"grk":"<p>8 ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν· χωρὶς γὰρ νόμου ἁμαρτία νεκρά.<br>11 ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι' αὐτῆς ἀπέκτεινεν.</p>","lit":"<p>8「但罪<b>抓住了据点</b>，借着诫命，在我里面<b>制造出</b>各样的贪心；因为没有律法，罪是死的。」<br>11「因为罪<b>抓住了据点</b>，借着诫命<b>彻底欺骗了我</b>，并且借着它<b>杀了我</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>趁着机会</td><td>ἀφορμή</td><td>aphormē</td><td>G874</td><td>ἀπό + ὁρμάω（冲出）</td><td><b>出发点、据点、滩头堡</b></td><td><b>军事用语</b>（见下）</td></tr><tr><td>发动</td><td>κατειργάσατο</td><td>kateirgasato</td><td>G2716</td><td>κατά + ἐργάζομαι</td><td><b>制造出</b>（强调结果）</td><td>6:13、5:3同字</td></tr><tr><td>引诱</td><td>ἐξηπάτησεν</td><td>exēpatēsen</td><td>G1818</td><td>ἐκ + ἀπατάω</td><td><b>彻底欺骗</b></td><td><b>见下——极重要</b></td></tr><tr><td>杀了</td><td>ἀπέκτεινεν</td><td>apekteinen</td><td>G615</td><td>ἀπό + κτείνω</td><td>杀死</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ἀφορμή ——军事上的「滩头堡」</p><p>这个字在古典希腊文中的军事用法，是指：</p><p>一支军队发动攻击的<b>出发基地、据点、桥头堡</b>。</p><p>（其他新约用法：林后5:12、11:12「<b>机会</b>」；加5:13「不可将你们的自由当作放纵情欲的<b>机会</b>」；提前5:14）</p><p>保罗的画面是：</p><p>罪本来在你的领土上没有立足点。</p><p>然后诫命一来——</p><p>罪就在那道诫命上，建立了一个滩头堡。</p><p>弟兄姊妹，这个画面极其精确，因为它符合我们的经验：</p><p>「不可贪心」——这道诫命本身是圣洁的。</p><p>但罪一听见它，就把它变成攻击我的<b>发射台</b>。</p><p>注意：保罗刻意不把责任推给律法。</p><p>建立据点的是<b>罪</b>（主词是 ἡ ἁμαρτία）。<br>诫命只是被利用的地形。</p><p>★ 亮光二：ἐξαπατάω ——伊甸园的字</p><p>「引诱我」（7:11）——ἐξηπάτησεν。</p><p>这个字在新约出现5次，其中两次极其重要：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>林后11:3</b></td><td>「我只怕你们的心或偏于邪，失去那向基督所存纯一清洁的心，就像<b>蛇用诡诈诱惑了夏娃</b>一样。」</td></tr><tr><td><b>提前2:14</b></td><td>「不是亚当<b>被引诱</b>，乃是女人<b>被引诱</b>，陷在罪里。」</td></tr></table><p>两处都用同一个字（或其字根），描述<b>伊甸园里蛇对夏娃所做的事</b>。</p><p>弟兄姊妹，保罗在7:11用的，正是那个字。</p><p>他在说：发生在我身上的事，跟伊甸园里发生的事，是同一件事。</p><p>而创世记3:13夏娃自己说了什么？</p><p>「那蛇<b>引诱</b>我，我就吃了。」</p><p>七十士译本用的正是 ἠπάτησέν με——<b>几乎与罗7:11一模一样</b>。</p><p>这是7:7–13「这个『我』是谁」的重要线索之一：</p><p>保罗可能是在用亚当／夏娃的经历，作为全人类经历的原型。</p><p>★ 亮光三：「诫命来到，罪又活了，我就死了」（7:9）</p><p>这一节是全章最难解的一节之一。</p><p>「我以前没有律法是活着的」——这是什么时候？</p><p>主要的理解：</p><table><tr><th>理解</th><th>说明</th></tr><tr><td><b>亚当在伊甸园</b></td><td>诫命来到（不可吃）→ 罪活了 → 亚当死了</td></tr><tr><td><b>以色列在西奈山之前</b></td><td>律法赐下之前 → 律法来到 → 死</td></tr><tr><td><b>保罗个人：受诫命之前的童年</b></td><td>犹太男孩13岁行 bar mitzvah 之前</td></tr><tr><td><b>任何人在良心真正被光照之前</b></td><td>一种普遍的人类经验</td></tr></table><p>诚实的说明：这四种理解都有支持者。</p><p>但四种理解的<b>结论一致</b>：</p><p>律法一来到，那个原本蛰伏的东西就活了；而我，就死了。</p><p>★ 亮光四：7:10的悲剧性对句</p><p>「那本来<b>叫人活</b>的诫命，反倒<b>叫我死</b>。」</p><p>律法本来的用意是什么？</p><p>利18:5「人若遵行，就必因此活着。」<br>申30:19「所以你要拣选生命，使你和你的后裔都得存活。」</p><p>律法本来是<b>生命之路</b>。</p><p>但保罗说：对我，它成了死亡之路。</p><p>不是因为律法变了，是因为<b>我</b>是这样的人。</p>","exp":"<p>弟兄姊妹，7:8–11画出了一个完整的犯罪心理学：</p><pre>1. 罪本来在我里面，但「是死的」（νεκρά，蛰伏、不活动）\n2. 诫命来到，把界线画出来\n3. 罪抓住那道诫命，建立滩头堡（ἀφορμή）\n4. 罪用那道诫命欺骗我（ἐξαπατάω，伊甸园的字）\n5. 我以为越过去会得到什么\n6. 结果：我死了</pre><p>弟兄姊妹，这就是为什么单靠「订规矩」永远不能对付罪。</p><p>因为罪最喜欢的地形，就是规矩。</p>"},{"a":12,"z":13,"star":false,"grk":"<p>12 ὥστε ὁ μὲν νόμος ἅγιος καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.<br>13 …ἵνα γένηται καθ' ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.</p>","lit":"<p>12「所以，<b>律法是圣洁的</b>，<b>诫命也是圣洁、公义、良善的</b>。」<br>13「那么，那良善的成了我的死吗？<b>绝不可能</b>！乃是<b>罪</b>——为要显明它<b>确实是罪</b>，它借着那良善的，在我身上<b>制造出死</b>；为要使罪<b>借着诫命，成为极其罪恶的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>圣洁</td><td>ἅγιος</td><td>hagios</td><td>G40</td><td>分别出来归神的</td></tr><tr><td>公义</td><td>δίκαιος</td><td>dikaios</td><td>G1342</td><td>合乎公义的</td></tr><tr><td>良善</td><td>ἀγαθός</td><td>agathos</td><td>G18</td><td>良善的、有益的</td></tr><tr><td>恶极了</td><td>καθ' ὑπερβολήν</td><td>kath' hyperbolēn</td><td>G5236</td><td><b>超乎寻常地、极度地</b>（英文 hyperbole 源出此字）</td></tr></table>","gram":"<p>★ 7:12是保罗对律法最正面的宣告</p><p>保罗一连用了四个形容词：</p><pre>律法：ἅγιος（圣洁）\n诫命：ἁγία（圣洁）＋ δικαία（公义）＋ ἀγαθή（良善）</pre><p>弟兄姊妹，这一节必须大声读出来。</p><p>因为太多人以为保罗反对律法。</p><p>保罗在这一节，把律法放在最高的位置上。</p><p>★ καθ' ὑπερβολήν ——罪的「爆表」</p><p>「叫罪……更显出是恶极了」——原文是「<b>超乎寻常地</b>成为罪」。</p><p>这正是律法真正的功用：</p><p>不是让你变好，是<b>让罪原形毕露</b>。</p><p>保罗的逻辑是：</p><pre>律法是圣洁、公义、良善的\n   ↓\n罪竟然连这么好的东西都能拿来害人\n   ↓\n所以罪的恶，超乎寻常地被显明出来</pre><p>一个能把良药变成毒药的东西，有多可怕？</p>","exp":"<p>弟兄姊妹，第七章上半的结论很清楚：</p><p>律法没有错。</p><p>律法是圣洁、公义、良善的。</p><p>问题不在镜子，在镜子照出来的那张脸。</p><p>而下半章，保罗要把那张脸，凑到我们眼前。</p><p>【第四段｜7:14–20　挣扎的第一轮】</p><p>★ 从这里开始，时态全部转为现在式。<br>关于「这个『我』是谁」的完整讨论，见第二十部分。此处先按经文本身解释。</p>"},{"a":14,"z":14,"star":false,"grk":"<p>οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν, ἐγὼ δὲ σάρκινός εἰμι πεπραμένος ὑπὸ τὴν ἁμαρτίαν.</p>","lit":"<p>「因为我们<b>知道</b>律法是属灵的；但<b>我</b>是<b>肉做的</b>，是<b>已经被卖</b>到罪的权下。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>属乎灵的</td><td>πνευματικός</td><td>pneumatikos</td><td>G4152</td><td>πνεῦμα</td><td><b>属灵的、出于圣灵的</b></td><td>律法的来源</td></tr><tr><td>属乎肉体的</td><td>σάρκινος</td><td>sarkinos</td><td>G4560</td><td>σάρξ（肉）</td><td><b>肉做的、由肉构成的</b></td><td>见下</td></tr><tr><td>卖给罪</td><td>πεπραμένος</td><td>pepramenos</td><td>G4097</td><td>πιπράσκω（卖）</td><td><b>完成被动分词：已被卖掉</b></td><td>奴隶市场用语</td></tr></table>","gram":"<p>★ 亮光一：σάρκινος 而不是 σαρκικός</p><p>希腊文有两个相近的形容词：</p><table><tr><th>字</th><th>字尾</th><th>意思</th></tr><tr><td><b>σάρκινος</b></td><td>-ινος</td><td><b>由某种材料构成的</b>（肉做的）</td></tr><tr><td><b>σαρκικός</b></td><td>-ικος</td><td><b>具有某种特质的</b>（属肉体的、肉欲的）</td></tr></table><p>保罗在7:14用的是 <b>σάρκινος</b>——「<b>肉做的</b>」。</p><p>这个字强调的是<b>材质、构成、本质上的软弱</b>，不是道德上的败坏。</p><p>保罗在说：律法是属天的材质，我是属地的材质。<br>两者根本不匹配。</p><p>（同字用于林后3:3「写在<b>心版</b>上」——肉做的心版；林前3:1保罗用另一个字 σάρκινος 形容哥林多人是「属肉体的」）</p><p>★ 亮光二：πεπραμένος ὑπὸ τὴν ἁμαρτίαν（卖给罪）</p><p>这是全章最强烈、也最具争议的一句话。</p><p>πιπράσκω 是<b>奴隶市场的用语</b>——把人卖掉。</p><p>完成被动分词：<b>已经被卖了，而且维持在那个状态</b>。</p><p>这句话造成了第七章最大的解经难题：</p><p>6:18说「你们既从罪里得了<b>释放</b>」——<br>7:14却说「我是已经<b>卖给罪</b>了」。</p><p>怎么协调？（见第二十部分）</p><p>★ 亮光三：οἴδαμεν（我们知道）vs ἐγώ（但我）</p><pre>οἴδαμεν —— 我们知道（复数，教义的共识）\nἐγὼ δέ  —— 但我（单数，个人的现况）</pre><p>保罗刻意把「大家都知道的道理」与「我实际的光景」对立起来。</p><p>这正是第七章的痛点：</p><p>道理我懂。<br>可是——我做不到。</p>","exp":"<p>弟兄姊妹，7:14是一句诚实到令人不舒服的话。</p><p>保罗没有说：「律法太难了。」</p><p>保罗说：「律法是属灵的，<b>我是肉做的</b>。」</p><p>问题不在标准太高，在材质不对。</p>"},{"a":15,"z":17,"star":true,"grk":"<p>15 ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ' ὃ μισῶ τοῦτο ποιῶ.<br>17 νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.</p>","lit":"<p>15「因为我所<b>做成的</b>，我<b>不认识</b>；因为我所<b>愿意的</b>，我不去实行；我所<b>恨恶的</b>，我倒去做。」<br>17「但如今，<b>不再是我</b>做成那事，乃是<b>住在我里面的罪</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>不明白</td><td>οὐ γινώσκω</td><td>ou ginōskō</td><td>G1097</td><td><b>不认识、认不出来</b>（不是「不理解原理」）</td></tr><tr><td>愿意</td><td>θέλω</td><td>thelō</td><td>G2309</td><td>意志的决定</td></tr><tr><td>恨恶</td><td>μισῶ</td><td>misō</td><td>G3404</td><td><b>恨恶</b>（强烈的字）</td></tr><tr><td>住</td><td>οἰκοῦσα</td><td>oikousa</td><td>G3611</td><td>οἶκος（房子）：<b>居住、定居</b></td></tr></table>","gram":"<p>★ 亮光一：οὐ γινώσκω ——「我认不出来」</p><p>「我所做的，我自己不明白」——这个字不是「我不懂原理」。</p><p>γινώσκω 是<b>认识、认出</b>。</p><p>保罗的意思是：</p><p>我做出来的那件事，我<b>认不出那是我</b>。</p><p>弟兄姊妹，这是每一个诚实的人都有过的经验：</p><p>事情做完之后，你看着自己，心里想：</p><p>「那个人是谁？」</p><p>★ 亮光二：μισῶ（恨恶）的重量</p><p>保罗不是说「我觉得不太好」。</p><p>他说：<b>我恨恶它</b>。</p><p>这一个字，是判断「这个『我』是谁」的重要线索。</p><p>一个未重生的人，会<b>恨恶</b>自己的罪吗？</p><p>他可能后悔、可能羞愧、可能怕后果——<br>但「恨恶」是一个很强的道德判断。</p><p>★ 亮光三：οἰκέω（住）——罪是个房客</p><p>「住在我里头的罪」——ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία。</p><p>οἰκέω 的字根是 οἶκος（房子），意思是<b>居住、定居</b>。</p><p>保罗的画面是：罪是一个<b>住在我房子里的房客</b>。</p><p>注意：房客不是屋主。</p><p>这正是6:6的延续：罪被<b>解职了</b>（καταργέω），但它还没搬走。</p><p>而第八章会给出对照：</p><p>罗8:9「如果神的灵<b>住在</b>（οἰκεῖ）你们心里……」<br>罗8:11「叫耶稣从死里复活者的灵若<b>住在</b>（οἰκεῖ）你们心里……」</p><p>同一个字！</p><p>第七章：罪住在我里面。<br>第八章：圣灵住在我里面。</p><p>这是两章之间最重要的一组对照。</p><p>★ 亮光四：7:17「不是我做的」是推卸责任吗？</p><p>这一节常被误用：「反正不是我做的，是罪做的。」</p><p>必须澄清：</p><p>1. <b>保罗在7:14–25从头到尾都用「我」——他没有否认那是他做的</b><br>2. <b>οὐκέτι ἐγώ（不再是我）的重点是「这不再代表真正的我」</b>——因为7:22说「按着我里面的意思，我是喜欢神的律」<br>3. <b>保罗在别处毫不含糊地要求负责</b>（6:12–13的命令）</p><p>保罗不是在推卸责任，是在<b>做一个身分的区分</b>：</p><p>那个做出来的行为，不代表我的新身分。<br>那是房客做的，不是屋主做的。</p><p>但屋主仍然要为家里发生的事负责——<b>这正是为什么他喊「我真是苦啊」</b>。</p>","exp":"<p>弟兄姊妹，7:15描述的是一种<b>分裂</b>：</p><pre>我所愿意的（θέλω）  —— 做不到\n我所恨恶的（μισῶ）  —— 却做了</pre><p>而这个分裂最痛的地方不是「我做错了」，是——</p><p>我认不出那个做的人是谁。</p>"},{"a":18,"z":20,"star":false,"grk":"<p>18 οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ' ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν οὔ·</p>","lit":"<p>18「因为我知道，在我里面——就是在我的肉体中——没有良善<b>居住</b>。因为<b>愿意</b>是<b>摆在我旁边的</b>，但<b>做成</b>那善的，却不是。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>意义</th></tr><tr><td>没有良善（住）</td><td>οὐκ οἰκεῖ…ἀγαθόν</td><td>—</td><td>G3611/G18</td><td><b>良善不住在我里面</b>（οἰκέω 又出现）</td></tr><tr><td>由得我</td><td>παράκειταί μοι</td><td>parakeitai</td><td>G3873</td><td>παρά + κεῖμαι：<b>摆在我旁边、随手可得</b></td></tr></table>","gram":"<p>★ 亮光一：「在我里头，就是我肉体之中」——保罗的自我修正</p><p>注意保罗说了一半，立刻补一句：</p><pre>「在我里头」        —— 太笼统了\n「就是我肉体之中」  —— 精确化</pre><p>保罗不是说「我这个人整个没有一点良善」。</p><p>他是说：在我的<b>肉体</b>中，没有良善。</p><p>而7:22立刻说：「按着我<b>里面的意思</b>，我是喜欢神的律。」</p><p>所以保罗心里有一个区分：肉体 vs 里面的人。</p><p>★ 亮光二：παράκειμαι ——「摆在旁边」</p><p>「立志为善<b>由得我</b>」——原文的画面是：</p><p>「愿意」这样东西，<b>就摆在我手边，随时可以拿到</b>。</p><p>保罗的意思是：</p><p>我从来不缺<b>愿望</b>。</p><p>愿望多得很，随手就有。</p><p>我缺的是——<b>把它做出来的力量</b>。</p><p>弟兄姊妹，这一句话，说中了多少人的属灵生活？</p><p>决心，我有一堆。<br>能力，我没有。</p><p>★ 亮光三：7:19与7:15的重复</p><p>保罗把同样的话说了两次（7:15、7:19）。</p><p>这不是重复，是<b>节奏</b>。</p><p>因为那个循环本身，就是重复的。</p><p>保罗用文字模拟了那个转不出来的圈子。</p>","exp":"<p><b>经文本身明确表达的：</b> 在「我」的肉体中没有良善；愿意是有的，行出来的力量是没有的。<br><b>合理推论的生命应用：</b> 若我对付罪的方式只是「下更大的决心」，我就还没有读懂7:18——因为问题从来不在愿望不够强。</p><p>【第五段｜7:21–23　两个律的交战】</p>"},{"a":21,"z":23,"star":true,"grk":"<p>22 συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον,<br>23 βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.</p>","lit":"<p>22「因为按着<b>里面的人</b>，我<b>与神的律一同欢喜</b>；」<br>23「但我看见在我肢体中另有一个律，<b>对我心思的律发动战争</b>，并且把我<b>掳为战俘</b>，归入那在我肢体中的罪的律。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音译</th><th>Strong's</th><th>字根</th><th>基本字义</th><th>本节语境</th></tr><tr><td>喜欢</td><td>συνήδομαι</td><td>synēdomai</td><td>G4913</td><td>σύν + ἥδομαι（喜悦）</td><td><b>一同欢喜、由衷地喜悦</b></td><td><b>新约仅此一次</b></td></tr><tr><td>里面的人</td><td>ὁ ἔσω ἄνθρωπος</td><td>esō anthrōpos</td><td>G2080</td><td>—</td><td><b>内在的那个人</b></td><td>见下</td></tr><tr><td>交战</td><td>ἀντιστρατεύομαι</td><td>antistrateuomai</td><td>G497</td><td>ἀντί + στρατεύομαι</td><td><b>对抗性的军事行动</b></td><td><b>新约仅此一次</b></td></tr><tr><td>掳去</td><td>αἰχμαλωτίζω</td><td>aichmalōtizō</td><td>G163</td><td>αἰχμή（矛）+ ἁλωτός（被擒）</td><td><b>掳为战俘</b></td><td>军事用语</td></tr></table>","gram":"<p>★ 亮光一：συνήδομαι ——「由衷地一同欢喜」</p><p>这个字在新约<b>只出现这一次</b>。</p><p>它不是「我同意」「我知道那是对的」。</p><p>σύν（一同）+ ἥδομαι（欢喜、以之为乐）——</p><p>意思是：<b>我打从心底，与神的律一同欢喜</b>。</p><p>弟兄姊妹，这个字非常重要。</p><p>因为保罗在3:11刚说过：「没有寻求神的。」<br>在8:7说：「原来体贴肉体的，就是与神为仇；因为不服神的律法，也是不能服。」</p><p>一个「与神为仇」的人，会<b>由衷地喜悦神的律</b>吗？</p><p>这是「这个『我』是重生的人」这一派最强的论据之一。</p><p>★ 亮光二：ὁ ἔσω ἄνθρωπος（里面的人）</p><p>保罗在其他地方用这个词组：</p><table><tr><th>出处</th><th>内容</th></tr><tr><td><b>林后4:16</b></td><td>「外体虽然毁坏，<b>内心</b>（ὁ ἔσω）却一天新似一天。」</td></tr><tr><td><b>弗3:16</b></td><td>「借着他的灵，叫你们<b>心里</b>（ἔσω ἄνθρωπον）的力量刚强起来。」</td></tr></table><p>在这两处，「里面的人」都明确指<b>信徒被圣灵更新的内在生命</b>。</p><p>这也是「重生说」的重要论据。</p><p>（但持「未重生说」的学者会说：这里的「里面的人」指的是理性与良心，希腊哲学也有类似的用法。见第二十部分。）</p><p>★ 亮光三：两个军事用语</p><pre>ἀντιστρατεύομαι —— 发动对抗性的战争（新约仅此一次）\nαἰχμαλωτίζω     —— 掳为战俘</pre><p>保罗的画面是一场<b>真正的战争</b>。</p><p>而他是那个<b>被俘虏的士兵</b>。</p><p>注意 αἰχμαλωτίζω 的含意：</p><p>战俘不是叛徒。</p><p>战俘是<b>站在对的一边、却被抓走的人</b>。</p><p>他的忠诚没有改变，但他的行动被限制了。</p><p>（保罗在林后10:5用同一个字的正面版本：「将人所有的心意<b>夺回</b>，使他都顺服基督。」）</p><p>★ 亮光四：四个「律」</p><p>7:21–25出现了好几个「律」（νόμος），需要分清楚：</p><table><tr><th>出处</th><th>「律」指什么</th></tr><tr><td>7:21「有个律」</td><td><b>一个规律、原理</b>（不是摩西律法）</td></tr><tr><td>7:22「神的律」</td><td>摩西律法／神的旨意</td></tr><tr><td>7:23「我心中的律」</td><td>我心思所认同的那个原则</td></tr><tr><td>7:23「肢体中犯罪的律」</td><td><b>罪的规律／权势</b></td></tr><tr><td>8:2「赐生命圣灵的律」</td><td>圣灵的规律／权势</td></tr></table><p>保罗在这里用 νόμος 的双关：既指摩西律法，也指「一种运作的规律」。</p><p>就像我们说「地心引力定律」——那不是法条，是一种<b>必然运作的力量</b>。</p>","exp":"<p>弟兄姊妹，7:21–23画出了一个非常具体的处境：</p><pre>我里面的人：由衷喜欢神的律（συνήδομαι）\n   ↓\n我的肢体：另有一个律在运作\n   ↓\n两边开战（ἀντιστρατεύομαι）\n   ↓\n结果：我被掳走了（αἰχμαλωτίζω）</pre><p>而「被掳走」这个字，正是这一段最深的痛：</p><p>我不是叛变。我是<b>被抓走</b>的。</p><p>我心里站在对的一边，我的身体却在敌营里。</p><p>【第六段｜7:24–25　呼喊与感谢】</p>"},{"a":24,"z":24,"star":true,"grk":"<p>ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;</p>","lit":"<p>「<b>我这个人，真是悲惨啊</b>！<b>谁</b>能<b>拉我脱离</b>这<b>死亡的身体</b>？」</p>","key"
