ger. God himself came and removed the hostility.</b></p>","exp":"<p>5:9–10 answers a very practical question:</p><p><b>“I have believed. But I still fall. Could I lose this?”</b></p><p>Paul’s answer is not “try harder.” Paul’s answer is <b>a piece of logic</b>:</p><p><b>Think what God did when you were at your worst.</b></p><p>He paid <b>the life of his Son</b> while you were his <b>enemy</b>.<br>Is he now going to take it all back because of the way this week went?</p><p>That is the force of “how much more.”</p><p><b>Assurance is not built on “I think I am doing all right.” Assurance is built on “he has already done the harder thing.”</b></p>"},{"a":11,"z":11,"star":false,"grk":"<p>οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δι' οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.</p>","lit":"<p>“And not only so, but we also <b>boast in God</b> through our Lord Jesus Christ — through whom we have <b>now received</b> the reconciliation.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>rejoice in God</td><td>καυχώμενοι ἐν τῷ θεῷ</td><td>—</td><td>G2744</td><td><b>boasting in God himself</b></td></tr><tr><td>reconciliation</td><td>καταλλαγή</td><td>katallagē</td><td>G2643</td><td>reconciliation (the noun of 2 Corinthians 5:18–19)</td></tr><tr><td>we received</td><td>ἐλάβομεν</td><td>elabomen</td><td>G2983</td><td><b>aorist: we received</b> (a gift, not an achievement)</td></tr></table>","gram":"<p><b>① the third boast — and the highest</b></p><pre>5:2   boasting in “the hope of the glory of God”  —  boasting in the future\n5:3   boasting “in tribulations”                  —  boasting in the present\n5:11  boasting “in God”                           —  boasting in God himself</pre><p>Paul’s three boasts run deeper at each step.<br>The last is not boasting in what God gives me. It is boasting in <b>God himself</b>.</p><p><b>② elabomen — received, not achieved</b></p><p>Reconciliation is something <b>received</b>, not something <b>completed</b>.</p>","exp":"<p>5:11 closes 5:1–11, and it lifts the whole passage to its highest point.</p><p>Paul has listed a great many benefits: peace, access, hope, endurance, character, deliverance from wrath, salvation…</p><p>And then he says: <b>and not only that —</b></p><p><b>The best gift is not any of the gifts. The best gift is the one who gives them.</b></p><p>“We boast in God” — <b>this is the final purpose of justification.</b></p><p><b>God did not save us to give us a better life. God saved us to give us himself.</b></p>"},{"a":12,"z":12,"star":true,"grk":"<p>Διὰ τοῦτο ὥσπερ δι' ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν, ἐφ' ᾧ πάντες ἥμαρτον·</p>","lit":"<p>“Therefore, just as through <b>one man</b> sin <b>came into</b> the world, and through sin, death; and so death <b>spread through</b> to all people — <b>because</b> (or: in whom) all sinned…”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>one man</td><td>ἑνὸς ἀνθρώπου</td><td>henos anthrōpou</td><td>G1520</td><td>εἷς (one)</td><td><b>one man</b></td><td>“one” occurs twelve times in 5:12–19</td></tr><tr><td>entered</td><td>εἰσῆλθεν</td><td>eisēlthen</td><td>G1525</td><td>εἰς + ἔρχομαι</td><td><b>came in, broke in</b></td><td>sin as an intruder</td></tr><tr><td>spread to</td><td>διῆλθεν</td><td>diēlthen</td><td>G1330</td><td>διά + ἔρχομαι</td><td><b>went right through, spread</b></td><td>death as a contagion</td></tr><tr><td>because</td><td>ἐφ' ᾧ</td><td>eph' hō</td><td>—</td><td>ἐπί + relative pronoun</td><td><b>the great interpretive dispute of this verse</b></td><td>see below</td></tr></table>","gram":"<p><b>① the picture in two compound verbs</b></p><pre>sin:   εἰσῆλθεν (εἰς, into)   —  broke IN from outside\ndeath: διῆλθεν  (διά, through) —  once in, spread THROUGH to every corner</pre><p>Paul is painting an epidemic: <b>sin is the pathogen that came in through one door; death is the symptom that has spread to every person.</b></p><p><b>② ★ four readings of eph' hō</b></p><p>These two words have shaped the entire doctrine of original sin. There are legitimate differences among evangelicals here, and they must be set out fairly.</p><table><tr><th>Reading</th><th>Rendering</th><th>Meaning</th><th>Representative</th></tr><tr><td><b>A. Causal</b> (most modern scholars)</td><td><b>because</b></td><td>death came to all, because all sinned</td><td>most modern commentaries</td></tr><tr><td><b>B. “In whom”</b></td><td><b>in him (Adam)</b></td><td>all sinned in Adam</td><td>Augustine (following the Latin Vulgate, <i>in quo</i>)</td></tr><tr><td><b>C. Consequential</b></td><td><b>with the result that</b></td><td>death came to all, with the result that all sin</td><td>some Eastern fathers</td></tr><tr><td><b>D. Conditional / on the basis of</b></td><td><b>on which basis</b></td><td>a composite reading</td><td>Fitzmyer and others</td></tr></table><p><b>An honest note about B (Augustine’s reading):</b><br>The Latin Vulgate rendered ἐφ' ᾧ as <i>in quo</i> (“in whom”), and Augustine built on it the doctrine that we all sinned <b>in Adam</b>.</p><p>But grammatically, taking ἐφ' ᾧ as “in whom” is <b>difficult</b> (ἐπί does not normally mean “inside” — that is ἐν).</p><p>Most modern scholars — <b>including Reformed scholars such as Murray, Moo and Schreiner</b> — acknowledge that Augustine’s <b>translation</b> was problematic, while holding that his <b>theological conclusion</b> may still be right, because that conclusion rests on the whole argument of 5:13–19, not on those two words alone.</p><p><b>③ So in what sense are we “in Adam”?</b></p><p>There are two main evangelical models (both affirm original sin; they differ on the mechanism):</p><table><tr><th>Model</th><th>Claim</th><th>Illustration</th><th>Representative</th></tr><tr><td><b>Federal headship</b></td><td>Adam is the <b>legal representative</b> of the race; his act counts legally as ours</td><td>a head of state signs a declaration of war, and the whole nation is at war</td><td>Hodge, Berkhof, most Reformed</td></tr><tr><td><b>Realistic / seminal headship</b></td><td>the whole race was <b>really, physically in Adam</b>, and so really sinned with him</td><td>Levi paid tithes in Abraham (Hebrews 7:9–10)</td><td>Shedd, the Augustinian tradition</td></tr></table><p><b>Which is Paul nearer to?</b> Judging by the shape of the argument in 5:12–19, <b>federal headship</b> fits the text better, because Paul’s whole symmetry is <b>representative</b>:</p><p><b>“For as through the one man’s disobedience the many were made sinners, so also through the obedience of the one the many will be made righteous.” (5:19)</b></p><p>If we are counted sinners because we <b>actually sinned in Adam</b>, then by the same symmetry we would have to <b>actually perform righteousness in Christ</b> to be counted righteous — and Paul has spent four chapters saying the opposite: our righteousness is <b>reckoned</b> to us (4:3–8), not performed by us.</p><p>So: <b>both sides are about representation. One representative brought me under condemnation; the other has me reckoned righteous.</b></p><p><b>That symmetry is the cosmic version of “reckoning” (λογίζομαι) in chapter 4.</b></p><p><b>Pulpit note:</b> both models are orthodox evangelical positions. Do not present either as the only answer, and do not imply that those who hold the other do not believe in original sin.</p>","exp":"<p>5:12 throws out an idea that modern people dislike more than almost any other:</p><p><b>My situation is not entirely of my own making.</b></p><p>One of the core convictions of modern culture is individualism — I answer for myself, and other people’s business is nothing to do with me.</p><p>But Paul says: <b>before you were born, something had already been decided about your situation.</b></p><p>Does that sound unfair?</p><p>Paul’s answer is this: <b>if you will not accept that one man can represent the human race, then you have also given up the possibility that another man can represent you.</b></p><p><b>To object to Adam representing you is to object to Christ representing you.</b> And the whole structure of the gospel is built on <b>one man representing many</b>.</p>"},{"a":13,"z":14,"star":false,"grk":"<p>13 ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου, 14 ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.</p>","lit":"<p>13 “For until the law, sin was in the world; but sin <b>is not entered into the account</b> where there is no law.”</p><p>14 “Yet death <b>reigned</b> from Adam until Moses — even over those who had not sinned after the likeness of Adam’s <b>stepping across the line</b>. And Adam is a <b>type</b> of <b>the one who was to come</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>is not charged</td><td>ἐλλογεῖται</td><td>ellogeitai</td><td>G1677</td><td>ἐν + λόγος</td><td><b>to enter into an account</b></td><td><b>the same family as λογίζομαι in ch. 4!</b></td></tr><tr><td>reigned</td><td>ἐβασίλευσεν</td><td>ebasileusen</td><td>G936</td><td>βασιλεύς (king)</td><td><b>to reign as king</b></td><td>the key word of this chapter (five times)</td></tr><tr><td>transgression</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω</td><td><b>stepping across a marked line</b></td><td>same word as 4:15</td></tr><tr><td>type</td><td>τύπος</td><td>typos</td><td>G5179</td><td>τύπτω (to strike)</td><td><b>the impression left by a die; a pattern</b></td><td>see below</td></tr></table>","gram":"<p><b>① ellogeō — the word from chapter 4 returns</b></p><p>This verb (ἐν + λόγος) means <b>“to enter into the account,”</b> and belongs to the same family as λογίζομαι.</p><p>It occurs only twice in the New Testament:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td><b>Philemon 18</b></td><td>“If he has wronged you or owes you anything, <b>charge that to my account</b> (ἐμοὶ ἐλλόγα).”</td></tr><tr><td><b>Romans 5:13</b></td><td>“sin is <b>not charged</b> (οὐκ ἐλλογεῖται) where there is no law.”</td></tr></table><p>Paul used this word twice in his life.<br>Once to say <b>“put it on my account.”</b> Once to say <b>“in those days it was not put on the account.”</b></p><p><b>② the logic of 5:13–14</b></p><p>Paul is answering a possible objection: “You say death is because of sin. But before Moses there was no law, and sin was not charged — so why did those people die?”</p><p>Paul’s answer:</p><pre>FACT:        from Adam to Moses, people died\nBUT:         there was no law then (sin not entered in the account)\nTHEREFORE:   their death was not because they crossed a marked line\nCONCLUSION:  their death came from Adam</pre><p>Paul uses <b>the historical fact that people died before Moses</b> to prove that death comes from Adam. It is the most tightly argued passage in the chapter.</p><p><b>③ Who are “those who had not sinned after the likeness of Adam’s transgression”?</b></p><p>It refers to those who had <b>no single explicit commandment to break</b> as Adam did (Adam had a clear prohibition: the fruit of the tree of the knowledge of good and evil).</p><p>Does that include infants? The text does not say; but this verse has been used historically in discussions of infant death.</p><p><b>Pulpit note:</b> Paul’s concern here is to prove <b>that death comes from Adam</b>, not to construct a doctrine about infants. Do not press it further than it goes.</p><p><b>④ the weight of typos</b></p><p>τύπος literally means <b>the mark left by a blow</b> (the same word John 20:25 uses of the print of the nails), and from there, <b>the shape produced by a die or mould</b>.</p><p>Paul says Adam is a “type of the one who was to come.”</p><p>Note the direction: <b>it is not that Christ resembles Adam. It is that Adam resembles Christ.</b></p><p><b>When God made the first man, he had the second man in mind.</b></p><p>This is one of the deepest sentences in the Bible: <b>Adam was made from the very beginning in order to point to Christ.</b></p>","exp":"<p>These two verses look like a technical aside. In fact they are <b>the pivot of the whole argument</b>.</p><p>What Paul must prove is: <b>death is not your private problem; it is the problem of the whole human race.</b></p><p>And his evidence is <b>a piece of history</b>:</p><p>From Adam to Moses, in that long stretch with no law — <b>people still died</b>.</p><p>If death were only the penalty for individual sin, then in an age with no law to break, people should not have died.<br>But they died.</p><p><b>So the source of death is deeper than individual behaviour.</b></p><p><b>What the text plainly says:</b> where there is no law, sin is not entered in the account; yet death still reigned. So the root of death lies in Adam, not in individual transgression.</p><p><b>What may fairly be drawn from it:</b> this is the biblical ground for saying that “self” is not a bad habit but <b>an inherited condition</b>.</p><p><b>People do not become sinners by sinning. People sin because they are sinners.</b></p><p>And the last clause of verse 14 turns the whole passage around:</p><p><b>“Adam is a type of the one who was to come.”</b></p><p>Paul has spent all this time on Adam — and then he says: <b>this man exists so that you will see another man.</b></p><p><b>⚠ Pulpit note:</b> the rendering of ἐφ’ ᾧ in 5:12, and the mode by which original sin is transmitted (imputed or realistic), are matters on which godly scholars differ. Do not settle them from the pulpit.</p>"},{"a":15,"z":17,"star":false,"grk":"<p>15 …πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν. 17 …πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.</p>","lit":"<p>“If by the one man’s trespass death <b>reigned</b> through that one man — <b>how much more</b> shall those who <b>receive</b> the abundance of grace and <b>the free gift</b> of righteousness <b>reign in life</b> through the one, Jesus Christ.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>free gift</td><td>χάρισμα</td><td>charisma</td><td>G5486</td><td>χάρις (grace) + -μα: <b>the concrete product of grace</b></td></tr><tr><td>gift</td><td>δωρεά</td><td>dōrea</td><td>G1431</td><td><b>a gift given freely</b> (the noun of δωρεάν in 3:24)</td></tr><tr><td>abounded</td><td>ἐπερίσσευσεν</td><td>eperisseusen</td><td>G4052</td><td>περισσεύω: <b>to overflow, to spill past the edges</b></td></tr><tr><td>abundance of grace</td><td>περισσεία τῆς χάριτος</td><td>perisseia</td><td>G4050</td><td><b>the overflow of grace</b></td></tr><tr><td>receiving</td><td>λαμβάνοντες</td><td>lambanontes</td><td>G2983</td><td><b>present participle: those who are receiving</b></td></tr><tr><td>shall reign</td><td>βασιλεύσουσιν</td><td>basileusousin</td><td>G936</td><td><b>future: they shall reign</b></td></tr></table>","gram":"<p><b>★ First light: “not as… so also” means “nowhere near,” not “much the same”</b></p><p>In 5:15 Paul writes ἀλλ’ οὐχ ὡς… οὕτως καί — <b>“but it is not as… so also.”</b></p><p>He is afraid we will read Adam and Christ as two evenly balanced pans of a scale.<br>So three times over he says: <b>not the same, not the same, not the same.</b></p><p><b>These are not two weights of equal measure. This is a pebble against a mountain.</b></p><p><b>★ Second light: where does the asymmetry lie? (5:16)</b></p><p>“The judgement came <b>from one trespass</b> and brought condemnation; but the free gift came <b>from many trespasses</b> and brought justification.”</p><pre>condemnation:  one trespass       →  condemnation\njustification: countless trespasses →  justification</pre><p>This is the sharpest asymmetry in the chapter:</p><p><b>One sin was enough to condemn.</b><br>But what grace had to deal with was thousands of years, billions of people, an incalculable weight of trespass — <b>and it dealt with all of it.</b></p><p>One match can burn a house down. To rebuild that house takes a great deal more than one piece of timber.<br><b>What grace does is rebuild.</b></p><p><b>★ Third light: the startling asymmetry of 5:17</b></p><p>By strict symmetry, 5:17 should read: “death reigned… so also <b>life</b> shall reign.”</p><p>But that is not what Paul wrote. He wrote:</p><p>“<b>How much more</b> shall those who receive the abundance of grace and the gift of righteousness — <b>reign in life</b>.”</p><p><b>The subject has changed!</b></p><pre>[ADAM’S SIDE]   death REIGNS   →  we are the ones ruled\n[CHRIST’S SIDE] WE reign       →  we are the ones ruling</pre><p>This is the warmest grammatical detail in the chapter.</p><p>When sin reigned, we were slaves.<br>But when grace reigns, we do not merely change masters — <b>we reign along with it.</b></p><p>(This anticipates Revelation 20:6 and 22:5, “they shall reign forever and ever.”)</p><p><b>★ Fourth light: lambanontes (those who receive)</b></p><p>“Those who receive the abundance of grace” — the Greek is <b>“those who are receiving.”</b></p><p>This present participle is the key to the whole passage:</p><p>In Adam, we <b>had to do nothing</b> to be included — we were born into it.<br>In Christ, we <b>receive</b>.</p><p>This is also the key to why “all” in 5:18 is not universalism (see the disputed material).</p>","exp":"<p>5:15–17 answers a lurking fear: <b>“Adam’s influence was so vast — how could I ever escape it?”</b></p><p>Paul’s answer is: <b>you have asked the wrong question.</b></p><p>The question is not “how great is Adam’s influence?” but <b>“how much greater is Christ’s?”</b></p><p>And the answer is: <b>immeasurably greater.</b></p><p>Paul uses three “not as” clauses and two “how much more” clauses to nail this down:</p><p><b>This is not a tug of war. These are not two evenly matched forces. This is a pebble dropped into the sea.</b></p>"},{"a":18,"z":19,"star":false,"grk":"<p>18 Ἄρα οὖν ὡς δι' ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι' ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς· 19 ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.</p>","lit":"<p>18 “So then, as through <b>one trespass</b> the result to all people was <b>condemnation</b>, so also through <b>one righteous act</b> the result to all people is <b>the justification of life</b>.”</p><p>19 “For as through the <b>disobedience</b> of the one man the many <b>were constituted</b> sinners, so also through the <b>obedience</b> of the one the many will <b>be constituted</b> righteous.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>righteous act</td><td>δικαίωμα</td><td>dikaiōma</td><td>G1345</td><td>δίκαιος</td><td><b>a righteous deed / verdict</b></td><td>Christ’s obedience unto death</td></tr><tr><td>justification of life</td><td>δικαίωσις ζωῆς</td><td>dikaiōsis zōēs</td><td>G1347</td><td>—</td><td><b>the declaration of righteousness that issues in life</b></td><td>same word as 4:25</td></tr><tr><td>disobedience</td><td>παρακοή</td><td>parakoē</td><td>G3876</td><td>παρά + ἀκούω (to hear)</td><td><b>hearing amiss, refusing to hear</b></td><td>see below</td></tr><tr><td>obedience</td><td>ὑπακοή</td><td>hypakoē</td><td>G5218</td><td>ὑπό + ἀκούω</td><td><b>hearing from underneath</b></td><td>see below</td></tr><tr><td>were made</td><td>κατεστάθησαν</td><td>katestathēsan</td><td>G2525</td><td>καθίστημι</td><td><b>were appointed, constituted</b> (a legal / official term)</td><td>see below</td></tr></table>","gram":"<p><b>★ First light: parakoē and hypakoē — both are words about hearing</b></p><p>Both are built on ἀκούω, <b>to hear</b>:</p><pre>παρακοή  (παρά, alongside + hearing) = hearing amiss, hearing off to the side  → disobedience\nὑπακοή   (ὑπό, underneath + hearing) = hearing from underneath                 → obedience</pre><p>English “disobedience” and “obedience” hide the fact that these are the same root.</p><p>But the Greek tells us something enormously important:</p><p><b>The essence of sin is a matter of hearing. And the essence of obedience is a matter of hearing.</b></p><p>Go back to the garden. At the moment Adam sinned, what happened?</p><p><b>Genesis 3:17: “Because you have listened to the voice of your wife…”</b></p><p>He did not fail to listen. <b>He listened to the wrong voice.</b></p><p>And Christ?</p><p><b>Isaiah 50:5 (the Servant Song): “The Lord GOD has opened my ear, and I was not rebellious, nor did I turn back.”</b><br><b>Hebrews 5:8: “Though he was a Son, he learned obedience (ὑπακοή) from the things he suffered.”</b></p><p>In one garden, a man heard it wrong.<br>In another garden — Gethsemane — <b>a man heard it right.</b></p><p><b>★ Second light: kathistēmi — “constituted”</b></p><p>“Were made sinners” and “will be made righteous” translate καθίστημι — a word meaning <b>to appoint, to install, to constitute</b>, drawn from law and administration.<br>(Acts 6:3, “whom we may <b>appoint</b> over this business”; Hebrews 5:1, “every high priest… is <b>appointed</b> for men” — the same word.)</p><p>Paul does <b>not</b> say “the many became sinners” (a description of character).<br>He says <b>“the many were constituted sinners”</b> (a declaration of standing).</p><p>This is entirely consistent with the “reckoning” (λογίζομαι) of chapter 4 — <b>courtroom language, not psychology.</b></p><p>And the second half of 5:19 is <b>future passive</b> (κατασταθήσονται): “the many <b>will be</b> constituted righteous.”<br>Justification has already begun, but the full declaration points to that day.</p><p><b>★ Third light: what is “the one righteous act”?</b></p><p>δικαίωμα here may denote:<br>1. <b>the whole obedient life of Christ</b> (most commentaries)<br>2. the single concrete act of the cross</p><p>The word “obedience” (ὑπακοή) in 5:19 supports the first: it was the obedience of his whole life, reaching its summit at the cross.</p><p><b>Philippians 2:8: “being found in appearance as a man, he humbled himself, becoming obedient to the point of death, even the death of the cross.”</b></p>","exp":"<p>5:18–19 at last completes the sentence that broke off at 5:12. And when it is completed, the whole picture appears:</p><table><tr><th></th><th>Adam</th><th>Christ</th></tr><tr><td><b>one act</b></td><td>one trespass</td><td>one righteous act</td></tr><tr><td><b>its essence</b></td><td><b>heard it wrong</b></td><td><b>heard and obeyed</b></td></tr><tr><td><b>its result</b></td><td>constituted sinners</td><td>constituted righteous</td></tr><tr><td><b>its reach</b></td><td>all people</td><td>all who receive</td></tr><tr><td><b>who reigns</b></td><td>death reigns</td><td>we reign</td></tr></table><p>And the most important message of that picture is this:</p><p><b>Your standing is not determined by your performance. It is determined by which man you belong to.</b></p><p>That is why Paul had to write this passage.</p><p>Because if my justification rests on my performance, I am at risk every day.<br>But if my justification rests on <b>his</b> performance — <b>then I am secure. Because he does not fail.</b></p>"},{"a":20,"z":20,"star":true,"grk":"<p>νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,</p>","lit":"<p>“And the law <b>slipped in alongside</b>, so that the trespass might <b>increase</b>; but where sin increased, grace <b>super-abounded beyond all measure</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>entered</td><td>παρεισῆλθεν</td><td>pareisēlthen</td><td>G3922</td><td>παρά + εἰς + ἔρχομαι</td><td><b>to slip in alongside, to be inserted</b></td><td>see below</td></tr><tr><td>increase</td><td>πλεονάσῃ</td><td>pleonasē</td><td>G4121</td><td>πλέον (more)</td><td>to become more</td><td>subjunctive</td></tr><tr><td>abounded much more</td><td>ὑπερεπερίσσευσεν</td><td>hypereperisseusen</td><td>G5248</td><td>ὑπέρ + ἐκ + περισσεύω</td><td><b>super-abundantly-overflowed</b></td><td>see below</td></tr></table>","gram":"<p><b>★ First light: pareiserchomai — the law “slipped in”</b></p><p>This compound verb is made of three parts: παρά (alongside) + εἰς (into) + ἔρχομαι (to come). It means <b>to come in alongside, to be inserted</b>.</p><p>Paul is saying: <b>the law is not the main storyline.</b></p><p>The main line is: <b>Adam → Christ.</b><br>The law is <b>a section inserted in between</b>. It has its task, but it is not the protagonist.<br>(Galatians 3:19, “What then is the law? It was added because of transgressions” — the same theology.)</p><p><b>★ Second light: hypereperisseusen — a word Paul built</b></p><p>Paul has stacked three prefixes to make this verb:</p><pre>περισσεύω                      = to overflow, to have more than enough\nἐκπερισσεύω                    = to overflow abundantly\nὑπερεκπερισσεύω / ὑπερπερισσεύω = to super-abundantly overflow</pre><p>The word occurs only twice in the New Testament (Romans 5:20; 2 Corinthians 7:4).</p><p>When Paul described sin, he used πλεονάζω (to increase).<br>When he came to describe grace, he evidently found the ordinary words insufficient — <b>so he stacked one up himself.</b></p><p>English “much more abounded” tries hard, but the force of the Greek is:</p><p><b>Sin went up one level. Grace went off the scale.</b></p><p><b>★ Third light: the hina — purpose or result?</b></p><p>The second dispute in the verse: is ἵνα “so that” (purpose) or “with the result that” (result)?</p><p>If purpose, did God deliberately cause sin to increase?</p><p>Paul’s meaning is best taken as follows:</p><p><b>The function of the law is to turn sin from a vague sickness into a specific charge</b> (4:15, παράβασις).<br>It does not manufacture sin; it <b>exposes</b> sin and <b>aggravates its character</b>.</p><p>And that exposure exists precisely so that people will know they need grace (3:20, “through the law comes the knowledge of sin”).</p><p><b>A doctor orders a scan not to make you ill, but so that you will know you are already ill, and how ill you are.</b></p>","exp":"<p>5:20 is the most relieving verse in the chapter — and the most easily abused.</p><p><b>“Where sin increased, grace abounded all the more.”</b></p><p>For someone in the grip of guilt, that sentence is the best news in the world.</p><p>But Paul knew at once how some people would use it. Which is why the very next verse, 6:1, opens:</p><p><b>“What shall we say then? Shall we continue in sin, that grace may abound?”</b><br><b>“By no means!”</b></p><p><b>This sentence is for someone who has fallen to get back up on. It is not for someone who is looking for permission to fall.</b></p>"},{"a":21,"z":21,"star":false,"grk":"<p>ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.</p>","lit":"<p>“so that, just as sin <b>reigned</b> in death, so also grace might <b>reign</b> <b>through righteousness</b>, unto eternal life, through Jesus Christ our Lord.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>reign</td><td>βασιλεύω</td><td>basileuō</td><td>G936</td><td>to reign as king (the fifth occurrence in this chapter)</td></tr><tr><td>through righteousness</td><td>διὰ δικαιοσύνης</td><td>dia dikaiosynēs</td><td>G1343</td><td><b>grace reigns by way of righteousness</b></td></tr></table>","gram":"<p><b>① the fivefold journey of basileuō through chapter 5</b></p><table><tr><th>Reference</th><th>Who reigns</th></tr><tr><td>5:14</td><td><b>death</b> reigned (from Adam to Moses)</td></tr><tr><td>5:17a</td><td><b>death</b> reigned through the one man</td></tr><tr><td>5:17b</td><td><b>we</b> shall reign in life</td></tr><tr><td>5:21a</td><td><b>sin</b> reigned in death</td></tr><tr><td>5:21b</td><td><b>grace</b> reigns, unto eternal life</td></tr></table><p>The theme of the whole chapter turns out to be a question about a throne.<br><b>Who is reigning?</b></p><p><b>② the importance of dia dikaiosynēs (through righteousness)</b></p><p>This clause is easily skipped, and it is vital.</p><p><b>Grace does not reign by going around justice. It reigns by way of justice.</b></p><p>This echoes 3:26: “that he might be just, and the justifier of the one who has faith in Jesus.”</p><p><b>Grace does not push righteousness aside. Grace came to us along the road of righteousness.</b></p>","exp":"<p>Chapter 5 ends with a king. And that matters, because it pulls the whole chapter back to a question of sovereignty.</p><pre>[ADAM’S KINGDOM]  sin reigns   →  people are slaves  →  the end is death\n[CHRIST’S KINGDOM] grace reigns →  people reign too   →  the end is eternal life</pre><p>Paul is not describing two attitudes to life. <b>He is describing two kingdoms.</b></p><p>And every person alive is living inside one of them.</p>"}],"4":[{"a":1,"z":2,"star":false,"grk":"<p>1 Τί οὖν ἐροῦμεν εὑρηκέναι Ἀβραὰμ τὸν προπάτορα ἡμῶν κατὰ σάρκα; 2 εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα, ἀλλ' οὐ πρὸς θεόν.</p>","lit":"<p>1 “What then shall we say that Abraham, <b>our forefather</b> according to the flesh, <b>has found</b>?”</p><p>2 “For if Abraham was justified by works, he has <b>something to boast about</b> — but not before God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>forefather</td><td>προπάτωρ</td><td>propatōr</td><td>G4310</td><td>πρό + πατήρ</td><td><b>forefather, ancestor</b></td><td><b>only here in the NT</b></td></tr><tr><td>has found</td><td>εὑρηκέναι</td><td>heurēkenai</td><td>G2147</td><td>εὑρίσκω</td><td><b>to find, to discover</b> (Archimedes’ “Eureka!”)</td><td>“what did he find?”</td></tr><tr><td>according to the flesh</td><td>κατὰ σάρκα</td><td>kata sarka</td><td>G4561</td><td>—</td><td>by descent / by his own effort</td><td>see the grammar note</td></tr><tr><td>boast</td><td>καύχημα</td><td>kauchēma</td><td>G2745</td><td>καυχάομαι</td><td><b>the substance one boasts in</b></td><td>same root as 3:27</td></tr></table>","gram":"<p><b>① where does kata sarka attach?</b></p><p>The Greek word order allows two readings:</p><table><tr><th>Reading</th><th>Rendering</th><th>Meaning</th></tr><tr><td>attached to προπάτορα</td><td>“Abraham, our forefather <b>according to the flesh</b>”</td><td>ancestor by descent</td></tr><tr><td>attached to εὑρηκέναι</td><td>“what has Abraham found <b>by the flesh</b>?”</td><td>what did he gain by his own effort?</td></tr></table><p>Both readings are defensible, and both arrive at the same conclusion: <b>Abraham gained nothing by himself.</b></p><p><b>② the fine difference between kauchēma and kauchēsis</b></p><p>· <b>καύχησις</b> (3:27) = the <b>act</b> of boasting<br>· <b>καύχημα</b> (4:2) = <b>the grounds, the material</b> of boasting</p><p>In 3:27 Paul says the <b>act</b> of boasting has been shut out. In 4:2 he says there is <b>no material to boast with in the first place</b>.</p><p><b>③ all' ou pros theon (but not before God)</b></p><p>This clause is the pivot of the verse. Paul does not mean “Abraham really did have grounds to boast, but he had better not.” He means:</p><p>Before people, Abraham was indeed a great man — he left his country, he welcomed strangers, he interceded for Sodom, he offered up Isaac.<br>But set him <b>before God</b> (πρὸς θεόν), and none of it is currency.</p>","exp":"<p>Why does Paul begin with Abraham?</p><p>Because in Jewish thought, <b>if anyone could stand on his works, it would have to be Abraham</b>.</p><p>Paul’s strategy is: I will not argue about minor figures. I will go straight to your greatest.<br><b>If even Abraham has nothing to boast about, then nobody has.</b></p><p><b>What the text plainly says:</b> if Abraham were justified by works he would have grounds to boast — but before God he has none.</p><p><b>What may fairly be drawn from it:</b> everyone carries an inward list titled “I am not doing too badly.” The first thing Paul does is carry that list into God’s presence — <b>where it falls silent.</b></p>"},{"a":3,"z":3,"star":true,"grk":"<p>τί γὰρ ἡ γραφὴ λέγει; ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.</p>","lit":"<p>“For what does <b>the Scripture</b> say? ‘Abraham <b>believed</b> God, and it was <b>entered into his account</b> as righteousness.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>the Scripture</td><td>ἡ γραφή</td><td>hē graphē</td><td>G1124</td><td>γράφω (to write)</td><td><b>that which stands written</b></td><td>Paul appeals to the final authority</td></tr><tr><td>believed</td><td>ἐπίστευσεν</td><td>episteusen</td><td>G4100</td><td>πιστεύω</td><td><b>to trust, to entrust oneself</b></td><td>aorist: at a particular moment</td></tr><tr><td>was counted</td><td>ἐλογίσθη</td><td>elogisthē</td><td>G3049</td><td>λογίζομαι</td><td><b>to enter in a ledger, to reckon</b></td><td><b>aorist passive</b> (see below)</td></tr><tr><td>righteousness</td><td>δικαιοσύνη</td><td>dikaiosynē</td><td>G1343</td><td>δίκαιος</td><td>the standing of righteousness</td><td>courtroom language</td></tr></table>","gram":"<p><b>① the commercial background of logizomai</b></p><p>In first-century papyri this is the standard bookkeeping term:<br>· to <b>enter a sum into someone’s account</b><br>· to calculate, to settle<br>· to reckon something as belonging to someone</p><p>Paul chose this word deliberately. <b>He wants us to see a ledger.</b></p><p><b>② elogisthē is a “divine passive”</b></p><p>The verb is passive with no agent named — because the agent is God.</p><p><b>Abraham did not credit righteousness to himself. God credited it to him.</b></p><p>This matters enormously: <b>throughout this chapter, the subject of the verbs is God.</b></p><p><b>③ the preposition in eis dikaiosynēn</b></p><p>εἰς + accusative = <b>“entered in as…”</b> — accounting language: a credit posted under the heading “righteousness.”</p><p><b>④ the Hebrew behind “counted as righteousness”</b></p><p>Genesis 15:6 in Hebrew: <b>wayyachshəbehā lō ṣədāqāh</b>.<br>· <b>chashav</b> (H2803) = to think, to reckon, to regard as<br>· The same root appears in Genesis 50:20: “you <b>meant</b> evil against me, but God <b>meant</b> it for good.”</p><p>The λογίζομαι Paul quotes is the standard Septuagint rendering of chashav.</p><p><b>What does this grammar do to the verse?</b><br>“Counted as righteousness” does not say Abraham <b>became</b> a righteous man. It says <b>God entered “righteousness” in his ledger under Abraham’s name</b>.<br><b>It is a declaration of standing, not a description of character.</b></p>","exp":"<p>In this verse Paul does something first-century Jews found almost intolerable: <b>he separates Genesis 15:6 from Genesis 22</b> (the offering of Isaac).</p><p>The standard reading of the day (see 1 Maccabees 2:52) was: Abraham was faithful in the testing when he offered Isaac, and therefore “it was counted to him for righteousness.”</p><p>Paul says: no. <b>Open your Genesis and see where 15:6 stands.</b></p><p>It stands in <b>chapter 15</b>. The offering of Isaac is in <b>chapter 22</b>.<br>Seven chapters apart. Decades apart.</p><p><b>On the day God counted him righteous, Isaac had not even been born.</b></p><p>That is why Paul asks, “<b>What does the Scripture say?</b>” — not “what does the tradition say,” but “what stands written.”</p><p><b>The Bible is my standard. When tradition and text collide, go back to the text.</b></p>"},{"a":4,"z":5,"star":true,"grk":"<p>4 τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα, 5 τῷ δὲ μὴ ἐργαζομένῳ πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην·</p>","lit":"<p>4 “Now to the one who <b>works</b>, the wage is not counted <b>as a gift</b>, but <b>as a debt owed</b>.”</p><p>5 “But to the one who <b>does not work</b>, but believes in the God who <b>justifies the ungodly</b> — his faith is counted as righteousness.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>the one who works</td><td>ἐργαζομένῳ</td><td>ergazomenō</td><td>G2038</td><td>ἔργον (work)</td><td>a labourer, an employee</td><td>present participle: one who keeps working</td></tr><tr><td>wage</td><td>μισθός</td><td>misthos</td><td>G3408</td><td>—</td><td><b>wages, pay</b></td><td>a day labourer’s daily money</td></tr><tr><td>what is owed</td><td>ὀφείλημα</td><td>opheilēma</td><td>G3783</td><td>ὀφείλω (to owe)</td><td><b>a debt</b></td><td>the word of “forgive us our debts”</td></tr><tr><td>the ungodly</td><td>ἀσεβής</td><td>asebēs</td><td>G765</td><td>ἀ + σέβομαι (to worship)</td><td><b>the ungodly, the irreverent</b></td><td>not “the wrongdoer” — <b>the one who will not worship God</b></td></tr><tr><td>justifies</td><td>δικαιοῦντα</td><td>dikaiounta</td><td>G1344</td><td>δίκαιος</td><td>to declare righteous</td><td>present active participle: the God who is justifying</td></tr></table>","gram":"<p><b>① misthos and opheilēma: two kinds of “due”</b></p><p>Paul draws a hard line:</p><pre>work    → receive a wage → this is called “what is owed” (ὀφείλημα, a debt)\nno work → believe        → this is called grace (χάρις)</pre><p>The key insight: <b>if justification is a wage, then God owes us.</b><br>And the moment God owes us, <b>grace is dead</b>.</p><p><b>Grace and debt cannot logically coexist.</b></p><p><b>② the weight of asebēs</b></p><p>The word does not mean “bad person” generally. It means specifically <b>the ungodly — the one who will not treat God as God</b>.</p><p>And note: <b>this is the very first word of Romans 1:18.</b></p><pre>1:18  “God’s wrath is revealed against all UNGODLINESS (ἀσέβεια) and unrighteousness”\n4:5   “him who believes in the God who justifies THE UNGODLY (τὸν ἀσεβῆ)”</pre><p><b>The same root.</b></p><p><b>The people against whom God’s wrath was revealed in chapter 1 — chapter 4 says God declares them righteous.</b><br>That is the gospel.</p><p><b>③ “justifies the ungodly” — a head-on collision with the Old Testament</b></p><p>This is the boldest sentence in the Bible, because the law says plainly:</p><p><b>“Do not kill the innocent and righteous, for I will not justify the wicked.” (Exodus 23:7)</b><br><b>“He who justifies the wicked, and he who condemns the righteous, both are an abomination to the LORD.” (Proverbs 17:15)</b></p><p>God himself says: <b>“I will not justify the wicked.”</b><br>Paul says: <b>“He is the God who justifies the ungodly.”</b></p><p>Is Paul saying God contradicts himself? No. Paul already gave the answer in chapter 3:</p><p><b>“God set him forth as a propitiation… so that he might be just, and the justifier of the one who has faith in Jesus.” (3:25–26)</b></p><p><b>God did not look the other way. God prosecuted sin to the full — in his own Son. So he can justify the ungodly and remain just himself.</b></p><p><b>④ pisteuonti epi + accusative</b></p><p>“Believing <b>upon</b>” — this construction emphasises <b>where faith comes to rest</b>.</p><p><b>The value of faith lies not in the faith but in the One it leans on.</b></p>","exp":"<p>4:5 is the least religious sentence in the entire Bible.</p><p><b>Because every religion says: work hard, and then God will accept you.</b></p><p>Paul says: <b>“to the one who does not work, but believes in the God who justifies the ungodly — his faith is counted as righteousness.”</b></p><p>This verse offends two kinds of people:<br>· <b>the hard worker</b> — your effort cannot purchase righteousness<br>· <b>the morally serious</b> — how can God justify the wicked?</p><p>And this verse rescues two kinds of people:<br>· <b>those who are exhausted</b> — you do not have to earn it any more<br>· <b>those who think they are too far gone</b> — the ungodly are precisely his speciality</p><p><b>What the text plainly says:</b> justification is a gift, not a wage; and the people God justifies are <b>the ungodly</b>.</p><p><b>What may fairly be drawn from it:</b> if the ones God justifies are the ungodly, then the very last thing I need to do when I come to him today <b>is pretend to be good enough first.</b></p>"},{"a":6,"z":8,"star":false,"grk":"<p>6 καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων· 7 μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι· 8 μακάριος ἀνὴρ οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.</p>","lit":"<p>6 “Just as David also speaks of <b>the blessedness</b> of the person to whom <b>God counts righteousness apart from works</b>:”</p><p>7 “<b>Blessed</b> are those whose lawless deeds are <b>forgiven</b>, and whose sins are <b>covered over</b>;”</p><p>8 “<b>Blessed</b> is the man whose sin the Lord <b>will never, ever count</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>blessed</td><td>μακάριος</td><td>makarios</td><td>G3107</td><td><b>blessed, happy</b> (the word of the Beatitudes)</td></tr><tr><td>are forgiven</td><td>ἀφέθησαν</td><td>aphethēsan</td><td>G863</td><td><b>aorist passive</b>: carried away, remitted (the verb of ἄφεσις)</td></tr><tr><td>are covered</td><td>ἐπεκαλύφθησαν</td><td>epekalyphthēsan</td><td>G1943</td><td>ἐπί + καλύπτω: <b>covered over</b></td></tr><tr><td>will not count</td><td>οὐ μὴ λογίσηται</td><td>ou mē logisētai</td><td>G3049</td><td><b>double negative</b> + subjunctive: will absolutely never count</td></tr></table>","gram":"<p><b>① why does Paul bring in David? — exegesis by shared word</b></p><p>The rabbis had a rule of interpretation (<b>gezerah shavah</b>): two passages that share a key word may be used to explain each other.</p><p>· Genesis 15:6 — it was <b>counted</b> to him for righteousness (positive: entered in)<br>· Psalm 32:2 — the Lord does <b>not count</b> his sin (negative: not entered in)</p><p>Paul uses the single word λογίζομαι to bind the two texts together.</p><p><b>Genesis says: God enters “righteousness” in. Psalms says: God does not enter “sin” in.<br>One ledger, two entries.</b></p><p><b>② the double negative of ou mē logisētai</b></p><p>In Greek, οὐ μή + subjunctive is <b>the strongest possible negation</b>: “absolutely, never.”</p><p>English “will not count” reads flatly. The Greek says:<br><b>“The Lord will absolutely, positively, never enter that sin in his account.”</b></p><p><b>③ three passives</b></p><pre>ἀφέθησαν      —  are forgiven (the sin is carried away)\nἐπεκαλύφθησαν —  are covered  (the sin is hidden)\nλογίσηται     —  is not counted (the sin is not entered)</pre><p>Three actions — <b>and the subject of all three is God.</b></p><p><b>④ the setting of David’s psalm</b></p><p>Psalm 32, by title and content, has traditionally been read alongside David’s repentance after the affair with Bathsheba (compare Psalm 51).</p><p>Paul’s two witnesses are: <b>Abraham, who was counted righteous by faith</b>, and <b>David, who committed adultery and murder and was still not charged with it</b>.</p><p><b>One is the best case. One is the worst case.</b><br>Paul’s point: at both ends, it is the same — <b>by grace</b>.</p>","exp":"<p>Notice that David’s three verbs describe a complete process:</p><table><tr><th>Verb</th><th>Picture</th><th>Meaning</th></tr><tr><td><b>forgiven</b> (ἀφίημι)</td><td>the burden is <b>carried away</b></td><td>the sin is removed</td></tr><tr><td><b>covered</b> (ἐπικαλύπτω)</td><td>the thing is <b>covered over</b></td><td>the sin is no longer seen</td></tr><tr><td><b>not counted</b> (οὐ λογίζομαι)</td><td><b>no entry in the ledger</b></td><td>the sin will not be pursued</td></tr></table><p>These three verbs answer three different kinds of pain:<br>· <b>the weight of sin</b> → carried away<br>· <b>the shame of sin</b> → covered<br>· <b>the reckoning for sin</b> → never entered</p><p>And that word “covered” calls to mind the Old Testament mercy seat (Hebrew <b>kapporeth</b>, from the root <b>kaphar</b> = <b>to cover</b>).</p><p>Romans 3:25 says Jesus is that mercy seat; Romans 4:7 says sins are covered.<br><b>Those two chapters are two sides of one picture.</b></p>"},{"a":9,"z":10,"star":false,"grk":"<p>10 πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ' ἐν ἀκροβυστίᾳ·</p>","lit":"<p>10 “<b>How</b>, then, was it counted? While he was <b>in circumcision</b>, or <b>in uncircumcision</b>? Not in circumcision, but <b>in uncircumcision</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>how</td><td>πῶς</td><td>pōs</td><td>G4459</td><td>how, under what circumstances</td></tr><tr><td>in circumcision</td><td>ἐν περιτομῇ</td><td>en peritomē</td><td>G4061</td><td><b>a statement of state</b>: while in the condition of being circumcised</td></tr><tr><td>uncircumcision</td><td>ἀκροβυστία</td><td>akrobystia</td><td>G203</td><td>the uncircumcised state (i.e. Gentile standing)</td></tr></table>","gram":"<p><b>① “how” is really asking “when”</b></p><p>Paul is asking: <b>under what circumstances, in what standing, was he counted righteous?</b></p><p><b>② the most elegant blow in the chapter: a purely chronological argument</b></p><table><tr><th>Event</th><th>Reference</th><th>Age</th></tr><tr><td>believed God, counted righteous</td><td>Genesis 15:6</td><td>before about 85</td></tr><tr><td>Ishmael born</td><td>Genesis 16:16</td><td>86</td></tr><tr><td><b>circumcised</b></td><td>Genesis 17:24</td><td><b>99</b></td></tr></table><p><b>At least thirteen or fourteen years lie between them.</b></p><p>Paul does not need to argue theology. <b>He only needs you to open the book.</b></p>","exp":"<p>The force of this paragraph is that <b>you do not have to trust Paul. You only have to trust Genesis.</b></p><p>The Jewish claim was: you must first be circumcised, become part of God’s people, and then God will accept you.</p><p>Paul asks: <b>then what about your own forefather? On the day he was counted righteous, what was his standing?</b></p><p>The answer: <b>he was a Gentile.</b></p><p>On the day God counted Abraham righteous, his standing was <b>identical</b> to that of any uncircumcised Greek, Roman or Chinese person alive today.</p>"},{"a":11,"z":12,"star":false,"grk":"<p>11 καὶ σημεῖον ἔλαβεν περιτομῆς σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ…</p>","lit":"<p>11 “And he received the <b>sign</b> of circumcision — a <b>seal</b> of the righteousness of the faith he had while still uncircumcised…”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>sign</td><td>σημεῖον</td><td>sēmeion</td><td>G4592</td><td>—</td><td>a mark that points to something else</td><td>circumcision points back to what was done</td></tr><tr><td>seal</td><td>σφραγίς</td><td>sphragis</td><td>G4973</td><td>—</td><td><b>a seal, an official stamp</b></td><td>see below</td></tr><tr><td>footsteps</td><td>ἴχνος</td><td>ichnos</td><td>G2487</td><td>—</td><td><b>a footprint</b></td><td>“walking in the steps of…”</td></tr></table>","gram":"<p><b>① what a sphragis meant in the first century</b></p><p>In the Roman world a seal was used for:<br>· <b>stamping a contract once it had been agreed</b><br>· sealing goods, to prove they had not been tampered with<br>· authenticating an official document</p><p><b>And the order is everything: a seal is never applied before the contract. A seal is always applied afterwards, to confirm what has already been settled.</b></p><p>Paul says: <b>circumcision is that seal.</b></p><p><b>② sēmeion and sphragis set side by side</b></p><p>· <b>σημεῖον (sign)</b> = it points to something<br>· <b>σφραγίς (seal)</b> = it confirms something</p><p><b>Both words presuppose that the thing has already happened.</b></p><p><b>③ the picture in ichnos (footprints)</b></p><p>4:12 “walk in the steps” — στοιχέω τοῖς ἴχνεσιν, literally <b>“to step in his footprints.”</b></p><p>Paul is saying: <b>the true children of Abraham are not those with his blood, but those who walk in his footprints.</b><br>And <b>his first footprint was laid down while he was still uncircumcised.</b></p>","exp":"<p>This paragraph completes a remarkable reversal.</p><p>The Jewish position: Abraham is our father; if Gentiles want a share, they must be circumcised and join us.</p><p>Paul’s position: <b>Abraham is first “the father of all who believe though uncircumcised” (4:11), and only then “the father of the circumcised” (4:12).</b></p><p><b>The order has been reversed.</b></p><p>And 4:12 adds a qualification: he is the father of the circumcised only for those “who also walk in the steps of the faith our father Abraham had while uncircumcised.”</p><p><b>In other words: descent is not enough. You must also have his faith.</b></p><p>This corresponds exactly to 2:28–29: “he is not a Jew who is one outwardly.”</p><p>And the application today is just as sharp:<br>· <b>baptism is a seal, not a condition</b><br>· <b>church membership is a seal, not a condition</b><br>All these spiritual markers are good, and God appointed them — <b>but they are the stamp applied afterwards, not the ticket required beforehand.</b></p>"},{"a":13,"z":13,"star":false,"grk":"<p>Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως.</p>","lit":"<p>“For the <b>promise</b> — that he should be <b>heir of the world</b> — did not come to Abraham or to his offspring through law, but <b>through the righteousness of faith</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>promise</td><td>ἐπαγγελία</td><td>epangelia</td><td>G1860</td><td><b>a promise offered on one’s own initiative</b> (not a reply to a request)</td></tr><tr><td>heir</td><td>κληρονόμος</td><td>klēronomos</td><td>G2818</td><td>κλῆρος (a lot, an inheritance) + νέμω: <b>an heir</b></td></tr><tr><td>world</td><td>κόσμος</td><td>kosmos</td><td>G2889</td><td>the whole world</td></tr></table>","gram":"<p><b>① epangelia and synthēkē</b></p><p>Greek had two words available for “covenant”:<br>· <b>συνθήκη</b> = an agreement negotiated between two parties (<b>bilateral</b>)<br>· <b>διαθήκη / ἐπαγγελία</b> = <b>a will or promise laid down by one party</b> (<b>unilateral</b>)</p><p>The Septuagint deliberately chose διαθήκη to render the Hebrew <b>berith</b> — <b>because God’s covenant was not negotiated. God laid it down himself.</b></p><p>And the nature of a promise determines how secure it is: <b>a contract requiring both parties to perform collapses the moment one party fails. A one-sided will depends only on the one who made it.</b></p><p><b>② where does “heir of the world” come from?</b></p><p>The promise in Genesis included:<br>· <b>land</b> (Genesis 12:7; 13:15; 15:18)<br>· <b>all nations blessed in you</b> (Genesis 12:3; 22:18)<br>· <b>father of many nations</b> (Genesis 17:5)</p><p>“Heir of the world” is Paul’s <b>summary</b> of these promises — a summary with precedent in Jewish tradition of the period (Sirach 44:21; Jubilees 32:19).</p><p>And in Romans 8:17 Paul runs that line down to us: <b>“if children, then heirs — heirs of God and joint heirs with Christ.”</b></p>","exp":"<p>Here Paul pushes the argument one level further.</p><p>So far he has spoken about how <b>righteousness</b> comes. Now he speaks about how <b>the inheritance</b> comes.</p><p><b>If even righteousness is given freely, then of course the inheritance is given freely too.</b></p><p><b>Grace is a whole logic, not an occasional discount.</b></p>"},{"a":14,"z":15,"star":false,"grk":"<p>14 εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία· 15 ὁ γὰρ νόμος ὀργὴν κατεργάζεται· οὗ δὲ οὐκ ἔστιν νόμος οὐδὲ παράβασις.</p>","lit":"<p>14 “For if those who are of the law are the heirs, then faith has been <b>emptied out</b>, and the promise has been <b>made void</b>.”</p><p>15 “For the law <b>produces</b> wrath; and where there is no law, neither is there <b>the crossing of a line</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>made void</td><td>κεκένωται</td><td>kekenōtai</td><td>G2758</td><td>κενόω: <b>to be emptied out, hollowed out</b> (the word of Philippians 2:7)</td></tr><tr><td>made of no effect</td><td>κατήργηται</td><td>katērgētai</td><td>G2673</td><td><b>to be rendered ineffective</b> (the word of 3:3, 3:31)</td></tr><tr><td>produces</td><td>κατεργάζεται</td><td>katergazetai</td><td>G2716</td><td>κατά + ἐργάζομαι: <b>to bring about, to produce</b></td></tr><tr><td>transgression</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω: <b>to step across a line</b> — knowing the line is there</td></tr></table>","gram":"<p><b>① the weight of two perfect passives</b></p><p>· <b>κεκένωται</b> (faith has been emptied)<br>· <b>κατήργηται</b> (the promise has been made void)</p><p>The perfect tense means: once this happens, <b>it stands permanently in that condition</b>.</p><p>Paul is not saying faith would be “somewhat discounted.” He is saying <b>faith would be hollowed out entirely.</b></p><p><b>② a striking parallel in kenoō</b></p><p>This verb is used of Jesus in Philippians 2:7: “he <b>emptied himself</b> (ἐκένωσεν).”</p><p><b>Christ emptied himself, so that our faith would not be emptied.</b></p><p><b>③ the difference between parabasis and hamartia</b></p><p>· <b>ἁμαρτία</b> (sin) = missing the mark (the general condition)<br>· <b>παράβασις</b> (transgression) = <b>stepping across a line that has been drawn</b></p><p>In 4:15 Paul says, “where there is no law, neither is there <b>transgression</b>.”</p><p><b>Note carefully: he does not say “where there is no law, there is no sin.”</b> That is the point most easily misread here.</p><p>Where there is no law there is still sin (5:13–14 will say so explicitly), but there is no sin <b>in the specific form of stepping across a marked line</b>.</p><p><b>The law turns sin from something vague into something definite — and so it aggravates the character of sin.</b></p>","exp":"<p>Why does Paul say the law “produces wrath”?</p><p>Because <b>the law draws the line</b>. Once the line is drawn, stepping over it is no longer merely “not good” — <b>it is a violation</b>.</p><p>On a road with no speed limit posted, driving at 90 is <b>dangerous</b>.<br>On a road marked “60,” driving at 90 is <b>an offence</b>.</p><p><b>The sign did not make you drive faster. The sign turned your speed into a charge.</b></p><p>So Paul’s conclusion: <b>if the inheritance had to come through the law, what we would receive is not an inheritance but wrath.</b></p>"},{"a":16,"z":17,"star":true,"grk":"<p>16 Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι… 17 …κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα.</p>","lit":"<p>16 “Therefore it is of faith, so that it may be <b>according to grace</b>, in order that the promise may be <b>guaranteed</b> to all the offspring…”</p><p>17 “…before the God in whom he believed — the God <b>who makes the dead alive</b> and <b>calls the things that do not exist as though they did</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>sure</td><td>βέβαιος</td><td>bebaios</td><td>G949</td><td>βαίνω (to walk, to stand)</td><td><b>firm, standing, legally enforceable</b></td><td>a commercial term: a valid guarantee</td></tr><tr><td>makes alive</td><td>ζῳοποιοῦντος</td><td>zōopoiountos</td><td>G2227</td><td>ζωή + ποιέω</td><td><b>to make alive</b></td><td>present participle: <b>what he is always doing</b></td></tr><tr><td>calls what is not</td><td>καλοῦντος τὰ μὴ ὄντα ὡς ὄντα</td><td>—</td><td>G2564</td><td>καλέω (to call)</td><td><b>calling the non-existent as existing</b></td><td>the language of creation</td></tr></table>","gram":"<p><b>① the commercial force of bebaios</b></p><p>In first-century contracts this word denoted <b>a guarantee that is legally valid and enforceable</b>.</p><p>Paul says the promise is <b>guaranteed</b> (βεβαίαν) precisely <b>because</b> it is of faith and according to grace.</p><p>This is the logical core of the chapter:</p><pre>if the promise rests on my performance  →  my performance varies  →  the promise is unstable\nif the promise rests on God’s grace     →  God does not vary      →  the promise is immovable</pre><p><b>Grace is not God going soft. Grace is the only way a promise could possibly be secure.</b></p><p><b>② two present participles, describing who God is</b></p><pre>τοῦ ζῳοποιοῦντος τοὺς νεκρούς    —  the one who makes the dead alive\nκαὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα —  and calls the non-existent as existing</pre><p>Both are <b>present</b> participles — not “he once did this,” but <b>“this is the kind of God he is.”</b></p><p>These two clauses compress the two great works of God as Scripture presents them:</p><table><tr><th>Participle</th><th>God’s work</th><th>Biblical instances</th></tr><tr><td><b>makes the dead alive</b></td><td><b>resurrection</b></td><td>the exodus; Ezekiel’s dry bones; the raising of Jesus</td></tr><tr><td><b>calls what is not</b></td><td><b>creation</b></td><td>Genesis 1, “God said… and there was”</td></tr></table><p><b>Which God did Abraham’s situation require?</b></p><p>He was a hundred years old, his body as good as dead → he needed <b>the God who makes the dead alive</b>.<br>Sarah’s womb was closed, and there was no child → he needed <b>the God who calls what is not</b>.</p><p><b>Paul’s description of God is aimed precisely at Abraham’s impossibility.</b></p><p><b>③ two readings of “calls the things that do not exist as though they did”</b></p><table><tr><th>Reading</th><th>Meaning</th></tr><tr><td><b>creative calling</b></td><td>God speaks, and non-existence becomes existence (Genesis 1; Hebrews 11:3)</td></tr><tr><td><b>the certainty of the promise</b></td><td>once God has spoken, what has not yet happened already counts</td></tr></table><p>Both can stand together, and both fit the context:</p><p>When God said, “<b>I have made you</b> a father of many nations” (Genesis 17:5), how many sons did Abraham have?<br><b>Not one.</b><br>And yet God used the perfect tense: “<b>I have made</b> you.”</p><p><b>④ the quotation from Genesis 17:5</b></p><p>“No longer shall your name be called Abram, but your name shall be Abraham; for I have made you a father of many nations.”</p><p>· <b>Abram</b> = “exalted father”<br>· <b>Abraham</b> = “father of many nations”</p><p><b>On the day God changed his name to “father of many nations,” he did not have a single son.</b></p><p>From that day on, every time someone called his name, they were saying to a childless old man: <b>“Hey — father of many nations!”</b></p><p>He waited twenty-five years (Genesis 12:4, called at seventy-five; Genesis 21:5, Isaac born at a hundred).<br><b>Twenty-five years of being called “father of many nations.”</b></p>","exp":"<p>This verse pushes the definition of faith a long way forward.</p><p><b>Faith is not positive thinking. It is not a psychological state. It is not “I feel it will work out.”</b></p><p><b>Faith is knowing who God is.</b></p><p>Abraham’s faith held, not because his faith was strong, but because <b>the One he believed in</b> is —</p><p><b>the God who makes the dead alive.<br>The God who calls what is not as though it were.</b></p><p>And 4:24 is about to say: <b>this is exactly the God we believe in too</b> — “we who believe in him who raised Jesus our Lord from the dead.”</p><p><b>Abraham’s faith and Christian faith have precisely the same object.</b><br>He believed God could bring a child out of a dead body; we believe God brought a body out of a grave.</p>"},{"a":18,"z":18,"star":false,"grk":"<p>ὃς παρ' ἐλπίδα ἐπ' ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· οὕτως ἔσται τὸ σπέρμα σου.</p>","lit":"<p>“Who, <b>against hope, upon hope</b>, believed — so that he became the father of many nations, according to what had been spoken: ‘So shall your offspring be.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>against hope</td><td>παρ' ἐλπίδα</td><td>par' elpida</td><td>G1680</td><td>παρά + accusative: <b>contrary to, against</b> hope</td></tr><tr><td>in hope</td><td>ἐπ' ἐλπίδι</td><td>ep' elpidi</td><td>G1680</td><td>ἐπί + dative: <b>resting upon</b> hope</td></tr></table>","gram":"<p><b>★ par' elpida ep' elpidi — the loveliest pair of words in the Bible</b></p><p>The same noun (ἐλπίς, hope) is used twice, with two different prepositions:</p><pre>παρ' ἐλπίδα  —  against hope (from the human side: there is none)\nἐπ' ἐλπίδι   —  upon hope    (from God’s side: standing on the promise)</pre><p>English “against all hope, in hope he believed” carries it well, but it does not show that <b>this is one word used twice</b>.</p><p>Paul is saying: <b>real faith has one foot planted in the hopelessness, and one foot planted on the promise.</b></p><p><b>Faith is not failing to see the despair. Faith is seeing the despair, and standing on the promise anyway.</b></p><p>It is the most precise sentence about faith in the whole Bible.</p>","exp":"<p>Many people assume that faith means “don’t think about the bad things.”</p><p>Paul says: no.</p><p>Abraham’s faith was not blindness to despair. The very next verse will say he “considered his own body, already as good as dead.”<br><b>He saw it perfectly clearly.</b></p><p>He simply saw something else at the same time: <b>the God who was speaking is the God who raises the dead.</b></p>"},{"a":19,"z":21,"star":true,"grk":"<p>19 καὶ μὴ ἀσθενήσας τῇ πίστει κατενόησεν τὸ ἑαυτοῦ σῶμα [ἤδη] νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας· 20 εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλ' ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ 21 καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.</p>","lit":"<p>19 “And not being weak in faith, he <b>looked squarely at</b> his own body, already <b>as good as dead</b> (he was about a hundred years old), and at the <b>deadness</b> of Sarah’s womb;”</p><p>20 “yet with regard to the promise of God he did not <b>waver, torn in two</b>, in unbelief; but was <b>strengthened</b> by faith, <b>giving glory to God</b>,”</p><p>21 “and being <b>filled full of the assurance</b> that what God had promised, he was <b>able</b> also to do.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>considered</td><td>κατενόησεν</td><td>katenoēsen</td><td>G2657</td><td>κατά + νοέω</td><td><b>to look carefully, to examine</b></td><td><b>not a glance — a steady look</b></td></tr><tr><td>as good as dead</td><td>νενεκρωμένον</td><td>nenekrōmenon</td><td>G3499</td><td>νεκρός (dead)</td><td><b>perfect passive participle: has died and stays dead</b></td><td>an extremely strong word</td></tr><tr><td>deadness</td><td>νέκρωσις</td><td>nekrōsis</td><td>G3500</td><td>νεκρός</td><td><b>the state of death</b></td><td>the noun: the “death” of Sarah’s womb</td></tr><tr><td>wavered</td><td>διεκρίθη</td><td>diekrithē</td><td>G1252</td><td>διά + κρίνω</td><td><b>to be split in two, to oscillate</b></td><td>the word of James 1:6</td></tr><tr><td>was strengthened</td><td>ἐνεδυναμώθη</td><td>enedynamōthē</td><td>G1743</td><td>ἐν + δύναμις</td><td><b>was given power</b> (<b>passive!</b>)</td><td>not self-generated strength</td></tr><tr><td>fully assured</td><td>πληροφορηθείς</td><td>plērophorētheis</td><td>G4135</td><td>πλήρης + φέρω</td><td><b>filled to the brim, carried full</b></td><td>passive participle</td></tr></table>","gram":"<p><b>① katanoeō: he did not avoid reality; he looked straight at it</b></p><p>The word means <b>to observe carefully and attentively</b>.<br>(The same verb is used in Matthew 7:3, “you <b>see</b> the speck in your brother’s eye”; Hebrews 3:1, “<b>consider</b> Jesus.”)</p><p>Paul is telling us deliberately: <b>Abraham looked at his own body with complete clarity.</b></p><p><b>Faith is not self-hypnosis. Faith is seeing the facts all the way through, and then seeing a larger fact.</b></p><p><b>② the force of the perfect participle nenekrōmenon</b></p><p>Not “getting on a bit,” not “not what he was.” It means <b>already dead, and remaining in that state</b>.</p><p>Paul uses two words from the “death” family (νεκρόω / νέκρωσις) for this elderly couple’s fertility.</p><p>Which is exactly what 4:17 prepared for: <b>“the God who makes the dead alive.”</b></p><p>Paul did it on purpose: <b>he first makes you look at two dead bodies, so that the phrase “the God who makes the dead alive” has real content.</b></p><p><b>③ diakrinō: not “doubt” but “torn in two”</b></p><p>The literal sense is <b>to be divided in two</b>. Applied to the heart, it means <b>a mind split, swinging back and forth between the halves</b>.<br>(James 1:6, “the one who doubts is like a wave of the sea, driven by the wind and tossed” — the same word.)</p><p><b>Unbelief is not usually “I do not believe.” It is far more often “I half believe, and half do not.”</b></p><p><b>④ enedynamōthē: the crucial passive</b></p><p>“He was strengthened in faith” — the Greek is <b>passive</b>: <b>he was given power</b>.</p><p>This matters enormously:</p><p><b>Abraham did not brace himself into strength by willpower. When he believed, power was given to him.</b></p><p><b>Faith is not the engine that produces power. Faith is the channel that receives it.</b></p><p><b>⑤ dous doxan tō theō — the exact reversal of 1:21</b></p><pre>1:21  “although they knew God, they did not GLORIFY HIM as God (οὐχ ὡς θεὸν ἐδόξασαν)”\n4:20  “GIVING GLORY TO GOD (δοὺς δόξαν τῷ θεῷ)”</pre><p>Paul has spent three and a half chapters describing a world that will not glorify God. In chapter 4 he finally shows us <b>a man who does</b>.</p><p>And how does he glorify God? <b>Not by sacrifice, not by giving, not by service — by believing.</b></p><p><b>To believe what God has promised is itself to give God glory.</b><br>Because unbelief says “God cannot do it”; faith says <b>“he can.”</b></p><p><b>⑥ the picture in plērophoreō</b></p><p>The word literally means <b>“to be filled to the top,”</b> and is also used of <b>a ship running before a full sail</b>.</p><p>The faith Paul describes is not squeezed out by effort. <b>It is filled up by the promise of God.</b></p>","exp":"<p>These three verses are the fullest anatomy of faith in the Bible. Take them apart:</p><table><tr><th>Aspect</th><th>Reference</th><th>Content</th></tr><tr><td><b>faith faces facts</b></td><td>4:19</td><td>he “considered” his body, already dead</td></tr><tr><td><b>faith does not oscillate</b></td><td>4:20</td><td>he was not torn in two</td></tr><tr><td><b>faith is empowered</b></td><td>4:20</td><td>he “was strengthened” (<b>passive</b>)</td></tr><tr><td><b>faith glorifies God</b></td><td>4:20</td><td>he gave glory to God</td></tr><tr><td><b>faith focuses on God’s power</b></td><td>4:21</td><td>what God promised, <b>he</b> is able to do</td></tr></table><p>Notice the emphasis of that last line. Not “this thing will certainly happen,” but <b>“he is able to do it.”</b></p><p><b>The focus of faith is not on the outcome. The focus of faith is on God.</b></p><p>This also explains a common puzzle.</p><p>Genesis records several failures of Abraham — twice he claimed Sarah was his sister out of fear (Genesis 12, 20); he took Hagar at Sarah’s suggestion (Genesis 16); he fell on his face and laughed when he heard the promise (Genesis 17:17).</p><p><b>Why does Paul mention none of it?</b></p><p>Partly because Paul is not writing a biography of Abraham; he is expounding Genesis 15:6.</p><p>But there is a deeper reason: <b>after God counted him righteous, the way God saw him changed.</b></p><p><b>“Blessed is the man whose sin the Lord will never count.” (4:8)</b></p><p><b>Paul’s portrait of Abraham in chapter 4 is what that “not counted” ledger looks like.</b></p>"},{"a":22,"z":24,"star":false,"grk":"<p>23 Οὐκ ἐγράφη δὲ δι' αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ 24 ἀλλὰ καὶ δι' ἡμᾶς, οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν</p>","lit":"<p>22 “Therefore <b>it was counted to him as righteousness</b>.”</p><p>23 “Now the words ‘<b>it was counted to him</b>’ were <b>not written for his sake alone</b>,”</p><p>24 “<b>but for our sake also</b> — to whom it <b>is going to be counted</b>, to us who believe in him <b>who raised Jesus our Lord from the dead</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>it was written</td><td>ἐγράφη</td><td>egraphē</td><td>G1125</td><td><b>aorist passive: it was written down</b></td></tr><tr><td>is going to be counted</td><td>μέλλει λογίζεσθαι</td><td>mellei logizesthai</td><td>G3195</td><td><b>is about to be / is certainly to be counted</b></td></tr><tr><td>who raised</td><td>τὸν ἐγείραντα</td><td>ton egeiranta</td><td>G1453</td><td>ἐγείρω: <b>the one who raised him up</b></td></tr></table>","gram":"<p><b>① “not written for his sake alone” — Paul’s doctrine of Scripture</b></p><p>This is an important statement about the Bible in the New Testament: <b>the Old Testament record is not merely history; it was written for us.</b><br>(Compare 1 Corinthians 10:11, “these things were written for our admonition”; Romans 15:4, “whatever was written before was written for our instruction.”)</p><p><b>② the continuity of the object of faith</b></p><p>Put 4:17 and 4:24 side by side:</p><pre>4:17  what Abraham believed:  the God who MAKES THE DEAD ALIVE\n4:24  what we believe:        the God who RAISED JESUS FROM THE DEAD</pre><p><b>The same God. The same faith. The same focus.</b></p><p>He believed God could bring life out of a body already dead;<br>we believe God brought life out of a grave.<br><b>Two thousand years apart, and the object of faith is identical.</b></p>","exp":"<p>In 4:23–24 Paul makes a gentle turn.</p><p>For twenty-two verses he has been talking about a man who lived four thousand years ago.<br>And then he says:</p><p><b>“Now it was not written for his sake alone… but for our sake also.”</b></p><p>Do you see what that means?</p><p><b>When God was writing Genesis 15:6, he already had you in mind.</b></p>"},{"a":25,"z":25,"star":true,"grk":"<p>ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.</p>","lit":"<p>“Who was <b>handed over</b> because of our <b>trespasses</b>, and was <b>raised</b> because of our <b>justification</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>was delivered up</td><td>παρεδόθη</td><td>paredothē</td><td>G3860</td><td>παρά + δίδωμι: <b>was handed over</b> (aorist passive)</td></tr><tr><td>trespasses</td><td>παράπτωμα</td><td>paraptōma</td><td>G3900</td><td>παρά + πίπτω (to fall): <b>a false step, a fall across the line</b></td></tr><tr><td>was raised</td><td>ἠγέρθη</td><td>ēgerthē</td><td>G1453</td><td><b>was raised up</b> (aorist passive)</td></tr><tr><td>justification</td><td>δικαίωσις</td><td>dikaiōsis</td><td>G1347</td><td><b>the act or declaration of justifying</b> (only twice in the NT: 4:25 and 5:18)</td></tr></table>","gram":"<p><b>① a perfectly symmetrical structure</b></p><pre>ὃς παρεδόθη  διὰ τὰ παραπτώματα ἡμῶν\n  (handed over) (because of) (our trespasses)\nκαὶ ἠγέρθη    διὰ τὴν δικαίωσιν  ἡμῶν\n  (raised)      (because of) (our justification)</pre><p>Two passive verbs, two διά clauses, two ἡμῶν.</p><p>Such symmetry is rare in Paul, and most scholars judge this to be <b>an early Christian confession that Paul is quoting</b> — in which case it is older than Romans itself.</p><p><b>② the link with Isaiah 53</b></p><p>The Septuagint of Isaiah 53 uses παραδίδωμι three times:<br>· Isaiah 53:6 LXX, “the LORD gave him up for our sins”<br>· Isaiah 53:12 LXX, “his soul was <b>handed over</b> (παρεδόθη) to death”</p><p><b>Paul is using the vocabulary of Isaiah 53. Behind this one sentence stands the Suffering Servant.</b></p><p><b>③ the key interpretive question in dia + accusative</b></p><p>Both διά clauses take the accusative, meaning <b>“because of, on account of.”</b></p><p>This creates a real difficulty:</p><p>“He was handed over <b>because of</b> our trespasses” — clear enough: our sins are the reason he was given up.<br>But “he was raised <b>because of</b> our justification” — what can that mean? Is our justification the reason for his resurrection?</p><p>Two main readings:</p><table><tr><th>Reading</th><th>Explanation</th></tr><tr><td><b>purposive</b> (most translations)</td><td>“for our justification” — the resurrection was in order to accomplish our justification</td></tr><tr><td><b>retrospective</b></td><td>“because our justification (had been accomplished at the cross)” — the resurrection is the <b>proof</b> that it was done</td></tr></table><p>The two are in fact complementary:</p><p><b>The cross paid the account. The resurrection is the receipt with the stamp on it.</b></p><p>If Jesus had not been raised, <b>we would never know whether that account had actually been settled</b>.</p><p>His coming out of the grave is heaven’s receipt: <b>“Paid in full.”</b></p><p><b>④ why paraptōma rather than hamartia?</b></p><p>παράπτωμα literally means <b>“a falling to the side,” a false step</b> — it stresses <b>specific, individual lapses</b>, echoing παράβασις in 4:15.</p>","exp":"<p>This verse is where the chapter lands, and it is the coupling that joins Abraham to us.</p><p>Paul has spoken of Abraham for twenty-four verses, and in the last verse he turns suddenly to Jesus. Why?</p><p>Because <b>every question raised earlier is answered here</b>:</p><table><tr><th>The earlier question</th><th>The answer in 4:25</th></tr><tr><td>On what basis can God justify the ungodly? (4:5)</td><td><b>because his Son was handed over for our trespasses</b></td></tr><tr><td>Where did those uncounted sins go? (4:8)</td><td><b>they were counted to him</b></td></tr><tr><td>How do I know I have really been counted righteous? (4:24)</td><td><b>because he was raised — here is the receipt</b></td></tr></table><p><b>This is why chapter 4 has to end with the resurrection.</b></p><p>Because the God Abraham believed in — <b>“the God who makes the dead alive” (4:17)</b> — <b>gave a personal demonstration one Sunday morning.</b></p>"}],"13":[{"a":1,"z":1,"star":true,"grk":"<p>Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω. οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ οὖσαι ὑπὸ θεοῦ τεταγμέναι εἰσίν.</p>","lit":"<p>“Let <b>every soul</b> <b>take its place under</b> the <b>governing authorities</b>. For there is no authority except from God; and those that exist have been <b>ordered in place by God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>every person</td><td>πᾶσα ψυχή</td><td>pasa psychē</td><td>G5590</td><td>—</td><td><b>every soul</b> (a Hebraism: every person)</td><td>no one is exempt</td></tr><tr><td>be subject</td><td>ὑποτασσέσθω</td><td>hypotassesthō</td><td>G5293</td><td>ὑπό + τάσσω</td><td><b>to place oneself under an order</b></td><td>same word as 10:3</td></tr><tr><td>authority</td><td>ἐξουσία</td><td>exousia</td><td>G1849</td><td>—</td><td>authority, the governing powers</td><td>a general term, not only the emperor</td></tr><tr><td>ordained</td><td>τεταγμέναι</td><td>tetagmenai</td><td>G5021</td><td>τάσσω</td><td><b>placed in position, assigned</b></td><td>perfect passive participle</td></tr></table>","gram":"<p><b>★ First light: the tassō family — this is military vocabulary</b></p><p>τάσσω means <b>to arrange, to draw up, to assign a position</b> — the word used of an army forming ranks.</p><p>And 13:1–2 uses <b>four</b> words from that root:</p><pre>ὑποτασσέσθω   (13:1)  —  to place oneself UNDER   = be subject\nτεταγμέναι    (13:1)  —  having been ARRANGED     = ordained by God\nἀντιτασσόμενος(13:2)  —  to draw up OPPOSITE      = to resist\nδιαταγή       (13:2)  —  that which is ARRANGED   = God’s ordinance</pre><p>The picture behind this word family is: <b>God has set every authority in its position on a great board. And what you are to do is stand in your position — not go and line up against him.</b></p><p><b>★ Second light: hypotassō ≠ blind obedience</b></p><p>This point is critical (see the disputed material for the fuller discussion).</p><p>ὑποτάσσω means <b>to recognise an order and take one’s place within it</b>, and it is <b>a different word</b> from ὑπακούω (<b>to obey, to do as told</b>).</p><p>Paul uses <b>ὑποτάσσω</b> here (submit to the order), <b>not ὑπακούω</b> (do whatever you are told).</p><p><b>Evidence:</b> Acts 5:29 — the same apostles said before the council: <b>“We must obey God rather than men.”</b></p><p><b>The same Bible.</b> So “submit” cannot possibly mean “do whatever you are commanded.”</p><p><b>★ Third light: tetagmenai is perfect passive</b></p><p>“Those that exist have been <b>ordained by God</b>” — passive, and the agent is God.</p><p>Paul is saying: <b>the institution of authority</b> is God’s appointment.</p><p>(On whether this means every act of every ruler carries God’s approval, see the disputed material.)</p>","exp":"<p>13:1 must be read in the flow of 12:19–21:</p><pre>12:19  do not avenge yourselves\n12:21  overcome evil with good\n  ↓\n13:1–4 because God has already appointed a mechanism to deal with evil</pre><p>Paul’s logic is: <b>you may not take private revenge — but that does not mean evil goes unaddressed. God has appointed government to address it.</b></p>"},{"a":2,"z":4,"star":true,"grk":"<p>4 θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.</p>","lit":"<p>2 “So the one who <b>resists the authority</b> <b>resists the order God has arranged</b>; and those who resist will <b>bring judgement on themselves</b>.”</p><p>3 “For rulers are <b>not a terror to good conduct</b>, but to <b>evil</b>. Do you want to have no fear of the authority? <b>Then do good</b> — and you will have praise from him;”</p><p>4 “for he is <b>God’s servant</b>, <b>for your good</b>. But if you do evil, be afraid; for <b>he does not bear the sword in vain</b> — he is God’s servant, <b>an avenger</b> to bring wrath on the one who does evil.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>servant</td><td>διάκονος</td><td>diakonos</td><td>G1249</td><td>—</td><td><b>servant, deacon</b></td><td>see below</td></tr><tr><td>for your good</td><td>εἰς τὸ ἀγαθόν</td><td>eis to agathon</td><td>G18</td><td>—</td><td><b>for your benefit</b></td><td><b>★ a functional definition — see below</b></td></tr><tr><td>in vain</td><td>εἰκῇ</td><td>eikē</td><td>G1500</td><td>—</td><td>without cause, for nothing</td><td>—</td></tr><tr><td>sword</td><td>μάχαιρα</td><
