nowing”; Paul pulls it back to its Hebrew meaning: to hear is to do.</b></p>"},{"a":14,"z":15,"star":false,"grk":"<p>14 ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος· 15 οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων</p>","lit":"<p>14 “For whenever Gentiles — who do not have the law — <b>by nature</b> do the things of the law, these, not having the law, <b>are a law to themselves</b>.”</p><p>15 “They show <b>the work of the law written in their hearts</b>, their <b>conscience bearing witness with them</b>, and their <b>reasonings</b>, among themselves, <b>accusing</b> or else <b>defending</b> them.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>by nature</td><td>φύσει</td><td>physei</td><td>G5449</td><td>dative: <b>naturally, by nature</b></td></tr><tr><td>conscience</td><td>συνείδησις</td><td>syneidēsis</td><td>G4893</td><td>σύν (together) + οἶδα (to know): <b>knowing together with oneself</b></td></tr><tr><td>bearing witness with</td><td>συμμαρτυρούσης</td><td>symmartyrousēs</td><td>G4828</td><td>σύν + μαρτυρέω: <b>to testify alongside</b></td></tr><tr><td>reasonings</td><td>λογισμῶν</td><td>logismōn</td><td>G3053</td><td>reasonings, calculations (the same root as λογίζῃ in 2:3)</td></tr><tr><td>accusing</td><td>κατηγορούντων</td><td>katēgorountōn</td><td>G2723</td><td>a courtroom term: <b>the prosecutor bringing a charge</b></td></tr><tr><td>defending</td><td>ἀπολογουμένων</td><td>apologoumenōn</td><td>G626</td><td>a courtroom term: <b>counsel for the defence replying</b> (the same root as ἀναπολόγητος in 2:1)</td></tr></table>","gram":"<p><b>① Genitive absolutes build a complete courtroom scene.</b> Three genitive participles:</p><p>· <b>the witness</b>: conscience (συνείδησις)<br>· <b>the prosecutor</b>: the reasonings (κατηγορέω)<br>· <b>the defence counsel</b>: the reasonings (ἀπολογέομαι)</p><p><b>The picture Paul draws is: inside every person there is a little courtroom, sitting day and night.</b></p><p><b>② The placement of φύσει</b><br>Greek φύσει can modify what precedes (“Gentiles who by nature do not have the law”) or what follows (“by nature do the things of the law”). Most translations and commentators take the latter.</p><p><b>③ τὸ ἔργον τοῦ νόμου (“the work of the law”) is singular</b><br>Not “the many statutes of the law” (plural ἔργα), but <b>the law’s function or effect</b> — the working of the moral requirement it exists to secure.</p><p><b>④ “Written in their hearts” and its relation to Jeremiah 31:33</b></p><p>Jeremiah 31:33 promises: “I will put my law within them, and I will write it on their hearts.”</p><p><b>But note the difference in wording:</b> Paul in 2:15 says <b>“the work (ἔργον) of the law</b> is written in their hearts,” not “the law itself.” That fine distinction matters — <b>2:15 is about universal conscience, not new-covenant regeneration.</b><br>(Paul does not turn to the Spirit’s work until 2:29.)</p>","exp":"<p>Paul establishes an important truth here: <b>God has never left anyone in total darkness.</b></p><p>Gentiles had no tablets from Sinai, but they had a copy on the tablet of the heart — <b>conscience</b>. Conscience is not perfect (it can be seared, it can be distorted — 1 Timothy 4:2), but it is enough to prove two things:</p><p><b>1. People know there is right and wrong.<br>2. People know they do not measure up.</b></p><p><b>That is why no one can say “I did not know.”</b></p><p>On who exactly these Gentiles in 2:14–16 are, godly scholars hold reasonable differences — see the disputed material.</p>"},{"a":16,"z":16,"star":false,"grk":"<p>ἐν ἡμέρᾳ ὅτε κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ Χριστοῦ Ἰησοῦ.</p>","lit":"<p>“On the day when God judges <b>the hidden things</b> of people, according to my gospel, <b>through Christ Jesus</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>secret things</td><td>τὰ κρυπτά</td><td>ta krypta</td><td>G2927</td><td>κρύπτω (to hide): <b>the things that have been hidden</b> (the source of “crypt,” “cryptic”)</td></tr><tr><td>through</td><td>διά + genitive</td><td>dia</td><td>G1223</td><td>by means of, through as mediator or executor</td></tr></table>","gram":"<p>· <b>κρίνει</b> may be read as present or future in form; the context points to <b>the last day</b>.</p><p>· <b>διὰ Χριστοῦ Ἰησοῦ</b> stands at the end of the sentence — <b>the emphatic position</b>. The whole argument about judgement in this chapter comes to rest on <b>Jesus Christ</b>.</p>","exp":"<p>Paul puts three heavy things here.</p><p><b>① The object of judgement is “the hidden things” (τὰ κρυπτά).</b></p><p>Not your public record — <b>your secret file</b>. It is the same word as “inwardly / in secret” (ἐν τῷ κρυπτῷ) in 2:28–29 — <b>the secret God judges and the secret God values are the same place: the heart.</b></p><p><b>② The Judge is Jesus Christ.</b></p><p>John 5:22, “the Father judges no one, but has given all judgement to the Son.” <b>The one who died for sinners is the one who will judge sinners.</b> That is the greatest grace, and the greatest seriousness.</p><p><b>③ “According to my gospel.”</b></p><p>Paul says <b>judgement is part of the gospel</b>.</p><p>The gospel is not merely “God loves you.” The gospel is: <b>“One day Christ will judge every hidden thing — and he has already, on the cross, borne that judgement for everyone who takes refuge in him.”</b></p><p><b>A gospel without judgement is cheap comfort; a judgement without grace is a sentence of despair. Paul will have both.</b></p>"},{"a":17,"z":20,"star":false,"grk":"<p>17 Εἰ δὲ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ νόμῳ καὶ καυχᾶσαι ἐν θεῷ</p>","lit":"<p>“But if you <b>bear the name</b> ‘Jew,’ and <b>rest your head</b> on the law, and <b>boast</b> in God…”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>are called</td><td>ἐπονομάζῃ</td><td>eponomazē</td><td>G2028</td><td>passive: <b>to have a name attached to you</b> (not lived out — applied)</td></tr><tr><td>rely on</td><td>ἐπαναπαύῃ</td><td>epanapauē</td><td>G1879</td><td>ἐπί + ἀνά + παύω: <b>to lean back on and rest, to sleep on it</b></td></tr><tr><td>boast</td><td>καυχᾶσαι</td><td>kauchasai</td><td>G2744</td><td>to boast (a key word in Romans: 3:27; 5:2–3; 15:17)</td></tr><tr><td>embodiment</td><td>μόρφωσις</td><td>morphōsis</td><td>G3446</td><td><b>outward form, outline</b> (the same word as “a form of godliness,” 2 Timothy 3:5)</td></tr></table>","gram":"<p><b>① This is an unfinished conditional sentence (anacoluthon).</b></p><p>Verse 17 begins “Εἰ δὲ σύ… (but if you…)” — and <b>the main clause does not arrive until verse 21</b>: “you then who teach others, do you not teach yourself?”</p><p>In between, verses 17–20 pile up <b>nine grounds for boasting</b>:</p><pre>1 called a Jew        2 rely on the law     3 boast in God\n4 know his will       5 approve what is excellent  6 instructed from the law\n7 a guide to the blind  8 a light to those in darkness\n9 an instructor of the foolish, a teacher of infants</pre><p>Paul deliberately lets the list climb higher and grow more glorious — and then, in verse 21, brings the axe down.</p><p><b>This is homiletically superb: first let a man climb onto the platform, then take away the ladder.</b></p><p><b>② The picture in ἐπαναπαύῃ (to rest on)</b></p><p>The LXX uses this verb of Elijah’s spirit “resting on” Elisha (2 Kings 2:15), and also of repose.</p><p><b>“Resting on the law” — the law was given to be walked; he has turned it into a pillow.</b> It is an exquisitely precise, and exquisitely ironic, verb.</p><p><b>③ The foreshadowing in μόρφωσις</b></p><p>“The embodiment” is neutral, even positive, here — but Paul has chosen <b>μόρφωσις (outward form)</b> rather than <b>μορφή (essential form)</b>, and the hint is already laid: <b>what you have may be only the outline, not the substance.</b></p>","exp":"<p>Every one of the nine items Paul lists <b>is true</b>. The Jews really did have the law, really were chosen by God, really were entrusted with his oracles (3:2).</p><p><b>The problem is not what they had. It is how they had it.</b></p><p>· The law was a road to walk; they made it <b>a pillow</b> (ἐπαναπαύῃ)<br>· The law was a light to see themselves by; they turned it <b>on other people</b> (a guide to the blind)<br>· God’s grace should have produced gratitude; they turned it into <b>a boast</b> (καυχᾶσαι)</p><p><b>This is the classic way a religious person falls: he turns God’s gift into his own capital.</b></p>"},{"a":21,"z":23,"star":false,"grk":"<p>21 ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις; 22 ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς; 23 ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις</p>","lit":"<p>21 “You then who <b>teach others</b> — do you not teach yourself? You who <b>preach</b> that a man should not steal — do you steal?”</p><p>22 “You who say a man should not commit adultery — do you commit adultery? You who <b>abhor idols</b> — do you <b>rob temples</b>?”</p><p>23 “You who <b>boast in the law</b> — <b>through breaking the law, you dishonour God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>preach</td><td>κηρύσσων</td><td>kēryssōn</td><td>G2784</td><td><b>to proclaim, to herald</b> (the preacher’s word)</td></tr><tr><td>abhor</td><td>βδελυσσόμενος</td><td>bdelyssomenos</td><td>G948</td><td>to loathe, to be nauseated by (the LXX word for idols as “abominations”)</td></tr><tr><td>rob temples</td><td>ἱεροσυλεῖς</td><td>hierosyleis</td><td>G2416</td><td>ἱερός (sacred) + συλάω (to plunder): <b>to rob a temple of its goods</b></td></tr><tr><td>transgression</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω: <b>to step over a line</b> knowing the line is there</td></tr><tr><td>dishonour</td><td>ἀτιμάζεις</td><td>atimazeis</td><td>G818</td><td>ἀ + τιμή (honour): <b>to strip of honour</b></td></tr></table>","gram":"<p><b>① Four participles set against four indicatives</b></p><pre>ὁ διδάσκων (the one teaching)     → οὐ διδάσκεις;  (do you not teach yourself?)\nὁ κηρύσσων (the one preaching)    → κλέπτεις;      (do you steal?)\nὁ λέγων (the one saying)          → μοιχεύεις;     (do you commit adultery?)\nὁ βδελυσσόμενος (the one abhorring) → ἱεροσυλεῖς;  (do you rob temples?)</pre><p>Each line is: <b>what you say vs what you do.</b> Four heavy blows, the same rhythm, coming faster each time.</p><p><b>② The historical background of ἱεροσυλεῖς</b></p><p>Deuteronomy 7:25 forbade Jews to take the silver and gold from idols. Acts 19:37 specifically notes that Paul’s companions were “not <b>robbers of temples</b>” (ἱεροσύλους) — which shows this was a common accusation against Jews in the Roman world.</p><p><b>Paul’s irony cuts deep: with your mouth you loathe idols to the point of nausea, and yet you take profit out of an idol’s temple.</b><br><b>Do you hate the idol — or hate that you cannot get at what is in it?</b></p>","exp":"<p>Notice that Paul singles out <b>the one who teaches (διδάσκων)</b> and <b>the one who preaches (κηρύσσων)</b>.</p><p><b>The sharpest thing about this paragraph is that it is not addressed to the congregation. It is addressed to preachers, teachers and spiritual leaders.</b></p><p>· You preach “do not steal” — have you stolen God’s time, another person’s credit, or the glory that belongs to God?<br>· You preach “do not commit adultery” — what about your eyes, your phone, your hours alone?<br>· You “abhor idols” — is your idol called “ministry results,” “other people’s praise,” “my influence”?</p><p><b>“Dishonour God” (ἀτιμάζεις) shares its root with “honour” (τιμή) in 2:7 and 2:10.</b> God wants to give <b>honour</b>; man <b>strips God of honour</b>. <b>That is the definition of sin at its very core.</b></p>"},{"a":24,"z":24,"star":false,"grk":"<p>τὸ γὰρ ὄνομα τοῦ θεοῦ δι' ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.</p>","lit":"<p>“For the name of God <b>is being blasphemed</b> among the Gentiles <b>because of you</b> — just as it is written.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>is blasphemed</td><td>βλασφημεῖται</td><td>blasphēmeitai</td><td>G987</td><td><b>present passive</b>: is being blasphemed, continually</td></tr><tr><td>because of you</td><td>δι' ὑμᾶς</td><td>di' hymas</td><td>G1223</td><td>διά + accusative: <b>on your account</b></td></tr></table>","gram":"<p>The first line the Lord Jesus taught us to pray is:</p><p><b>“Hallowed be your name.” (Matthew 6:9)</b></p><p>Romans 2:24 is the exact reverse of that prayer:</p><p><b>“The name of God is blasphemed among the Gentiles because of you.”</b></p><p>A religious person can:</p><p>· pray every day, “hallowed be your name”<br>· and at the same time, by the way he lives, cause God’s name to be blasphemed</p><p><b>Which is why “building God’s system” cannot rest on correct doctrine and correct ritual alone.</b></p>","exp":"<p><b>Ezekiel 36 is enormously important here.</b> When God says his name has been profaned, what is his solution?</p><p><b>“I will give you a new heart, and put a new spirit within you… and I will put my Spirit within you, and cause you to walk in my statutes.” (Ezekiel 36:26–27)</b></p><p><b>Paul throws out the problem in verse 24, and gives Ezekiel’s answer in verse 29: the Spirit, not the letter.</b></p>"},{"a":25,"z":27,"star":false,"grk":"<p>26 ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;</p>","lit":"<p>25 “Circumcision is indeed of value — <b>if you practise the law</b>; but if you are a breaker of the law, <b>your circumcision has become uncircumcision</b>.”</p><p>26 “So if the uncircumcised keeps <b>the righteous requirements of the law</b>, will not his uncircumcision <b>be counted as circumcision</b>?”</p><p>27 “And will not the one who is physically uncircumcised, but <b>fulfils the law</b>, <b>judge you</b> — who, with the letter and circumcision, are a breaker of the law?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>circumcision</td><td>περιτομή</td><td>peritomē</td><td>G4061</td><td>περί (around) + τέμνω (to cut)</td></tr><tr><td>uncircumcision</td><td>ἀκροβυστία</td><td>akrobystia</td><td>G203</td><td>the uncircumcised state; by extension, <b>Gentile standing</b></td></tr><tr><td>requirements</td><td>δικαιώματα</td><td>dikaiōmata</td><td>G1345</td><td>δίκαιος: <b>the righteous requirements / verdicts</b> (the same word as 8:4)</td></tr><tr><td>will be counted</td><td>λογισθήσεται</td><td>logisthēsetai</td><td>G3049</td><td><b>future passive: will be reckoned</b> (the key word of chapter 4)</td></tr><tr><td>letter</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>a letter, a written code</td></tr></table>","gram":"<p><b>① λογισθήσεται (will be counted) — preparing for chapter 4</b></p><p>This is the very word of Romans 4, “Abraham believed God, and it was <b>counted</b> (λογίζομαι) to him for righteousness.”</p><p><b>Already at 2:26 Paul has quietly laid the fuse: God has a way of reckoning that does not go by appearances.</b></p><p>Notice the journey of this word through the chapter:<br>· 2:3 the man does his own <b>reckoning</b> (λογίζῃ) — and gets it wrong<br>· 2:15 the man’s <b>reasonings</b> (λογισμοί) accuse one another<br>· 2:26 <b>God</b> reckons (λογισθήσεται) — <b>and that is the ledger that counts</b></p><p><b>② δικαιώματα τοῦ νόμου (the righteous requirements of the law)</b></p><p>This phrase occurs only twice in Romans:<br>· 2:26 “keeps the requirements of the law”<br>· 8:4 “that <b>the righteous requirement of the law</b> might be fulfilled in us who walk not according to the flesh but according to the Spirit”</p><p><b>That is strong evidence: what Paul has in mind at 2:26 finally receives its answer at 8:4 — by the Spirit.</b></p><p><b>③ διὰ γράμματος καὶ περιτομῆς in verse 27</b></p><p>διά + genitive here may be rendered “despite having” or “by means of.” The sense is: <b>you possess all the external equipment, and you are precisely the one breaking the law.</b></p>","exp":"<p>Paul is doing something that sounded nearly blasphemous to Jewish ears: <b>he relativises circumcision.</b></p><p>· The Jewish logic: circumcision → covenant people → salvation<br>· Paul’s logic: circumcision → <b>a sign</b> of the covenant → <b>a sign without the reality it signifies is empty</b></p><p>It is like:</p><p>· <b>a bank card with no money behind it</b><br>· <b>a wedding ring on the hand of someone who never loved the other person</b><br>· <b>a Bible with a name written in the front that has never been read</b></p><p>The sign itself is God-given and good (“circumcision is indeed of value”) — <b>but a sign can never replace the reality it points to.</b></p>"},{"a":28,"z":29,"star":true,"grk":"<p>28 οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή, 29 ἀλλ' ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ' ἐκ τοῦ θεοῦ.</p>","lit":"<p>28 “For the one who is a Jew <b>in what is visible</b> is not a Jew; nor is circumcision that which is visible, in the flesh.”</p><p>29 “But the Jew is the one who is so <b>in what is hidden</b>; and circumcision is of the heart, <b>in the Spirit, not in the letter</b>; whose <b>praise</b> is not from people, but from God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>outwardly</td><td>ἐν τῷ φανερῷ</td><td>en tō phanerō</td><td>G5318</td><td>φαίνω (to shine, to appear)</td><td><b>in what is visible</b></td><td>the level people can see</td></tr><tr><td>inwardly</td><td>ἐν τῷ κρυπτῷ</td><td>en tō kryptō</td><td>G2927</td><td>κρύπτω (to hide)</td><td><b>in what is hidden</b></td><td>the same word as “the secret things” in 2:16</td></tr><tr><td>heart</td><td>καρδία</td><td>kardia</td><td>G2588</td><td>—</td><td>the heart (will, thought, the centre of life)</td><td>where a life actually is</td></tr><tr><td>Spirit</td><td>πνεῦμα</td><td>pneuma</td><td>G4151</td><td>πνέω (to blow)</td><td>spirit / the Holy Spirit</td><td><b>the main interpretive question in this verse</b></td></tr><tr><td>letter</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>γράφω (to write)</td><td>the written code</td><td>the system of external written regulation</td></tr><tr><td>praise</td><td>ἔπαινος</td><td>epainos</td><td>G1868</td><td>ἐπί + αἶνος (praise)</td><td>praise, commendation</td><td><b>a pun on the name “Judah”</b></td></tr></table>","gram":"<p><b>★ First light: the pun on “Jew” and “praise”</b></p><p>Ἰουδαῖος (Jew) ← Ἰούδας (Judah) ← Hebrew <b>Yehudah</b> ← the root <b>yadah</b> (H3034) = <b>to praise, to give thanks</b>.</p><p><b>Genesis 29:35:</b> “And she conceived again and bore a son, and said, ‘This time I will <b>praise</b> the LORD.’ Therefore she called his name <b>Judah</b>.”<br><b>Genesis 49:8</b> (Jacob’s blessing): “Judah, your brothers shall <b>praise</b> you.”</p><p>And Paul says in 2:29: “whose <b>praise</b> (ἔπαινος) is not from people, but from God.”</p><p><b>This is a superb wordplay running across Hebrew and Greek: “Judah” means “praise.” The true Jew (the true praise-man) is the one whose praise comes from God and not from people.</b></p><p>No translation can show this. <b>It is the loveliest piece of Greek light in the chapter.</b></p><p><b>★ Second light: φανερός / κρυπτός running through the chapter</b></p><pre>2:16  God judges the SECRET THINGS (τὰ κρυπτά) of people\n2:29  the true Jew is the one who is so IN WHAT IS HIDDEN (ἐν τῷ κρυπτῷ)</pre><p><b>The place God judges and the place God commends are the same place: your heart.</b></p><p>And in Matthew 6, on giving, prayer and fasting, the Lord Jesus says three times: <b>“your Father who sees in secret (ἐν τῷ κρυπτῷ) will reward you.”</b></p><p><b>Paul and the Lord Jesus are using the same vocabulary and the same theology.</b></p><p><b>★ Third light: how to read ἐν πνεύματι οὐ γράμματι</b></p><p>Is “spirit” here <b>the human spirit</b> or <b>the Holy Spirit</b>? Two main views:</p><p>1. <b>The human spirit / the inward dimension</b> (contrasted with the outward flesh) — grammatically possible<br>2. <b>The Holy Spirit</b> — the view of most modern commentators (Cranfield, Moo, Schreiner, Dunn)</p><p><b>Reasons for “the Holy Spirit” (which I take to be decisive):</b><br>· 2 Corinthians 3:6 uses exactly the same contrast: “the letter (γράμμα) kills, but the Spirit (πνεῦμα) gives life” — and there πνεῦμα is unmistakably the Holy Spirit (2 Corinthians 3:17, “the Lord is the Spirit”)<br>· Romans 7:6 has the same contrast: “in newness of the Spirit (πνεύματος), not in oldness of the letter (γράμματος)”<br>· The background of Ezekiel 36:26–27: “I will put my Spirit within you” — the necessary extension of the citation of Ezekiel 36 at 2:24<br>· Deuteronomy 30:6: “the LORD your God will circumcise your heart” — <b>note: God performs the circumcision, not you</b></p><p><b>The Old Testament roots of “circumcision of the heart”:</b></p><table><tr><th>Reference</th><th>Subject</th><th>Content</th></tr><tr><td>Deuteronomy 10:16</td><td><b>the people</b></td><td>“circumcise the foreskin of your heart” (human responsibility)</td></tr><tr><td>Jeremiah 4:4</td><td><b>the people</b></td><td>“circumcise yourselves to the LORD” (a summons)</td></tr><tr><td><b>Deuteronomy 30:6</b></td><td><b>God</b></td><td>“<b>the LORD your God will circumcise your heart</b>” (the promise)</td></tr></table><p><b>Deuteronomy 30:6 is the key: in the end, it is God who performs the operation.</b></p>","exp":"<p>Here Paul completes a Copernican revolution in theology: <b>he moves the definition of “the people of God” from the genealogy to the heart; from the flesh to the Spirit; from human certification to God’s commendation.</b></p><p><b>And this is not Paul’s invention — it is what the Old Testament prophets had said long before</b> (Deuteronomy 30:6; Jeremiah 4:4, 9:25–26; Ezekiel 36:26–27). Paul is simply announcing: <b>the day the prophets promised has arrived in Christ.</b></p><p><b>What the text plainly says:</b> the person who truly belongs to God is defined not by an outward mark but by an inward circumcision performed by the Spirit in the heart; and his praise comes from God, not from people.</p><p><b>What may fairly be drawn from it:</b> we do not discuss circumcision today, but we have <b>a whole set of new circumcisions</b> — how long since you were baptised, how many years you have served, which church you belong to, which books you have read, which pastors you know.</p><p><b>Paul’s question would come to us just as sharply: behind those marks, is there a heart the Spirit has actually put a knife to?</b></p>"}],"9":[{"a":1,"z":3,"star":true,"grk":"<p>1 Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ, 2 ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου. 3 ηὐχόμην γὰρ ἀνάθεμα εἶναι αὐτὸς ἐγὼ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,</p>","lit":"<p>1 “I speak the truth in Christ, I am not lying — my conscience <b>bearing witness with me</b> in the Holy Spirit —”</p><p>2 “that I have great sorrow, and <b>unceasing anguish</b> in my heart.”</p><p>3 “For <b>I could wish</b> that I myself were <b>accursed</b>, cut off from Christ, for the sake of my brothers, my kinsmen according to the flesh.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>bearing witness with</td><td>συμμαρτυρούσης</td><td>symmartyrousēs</td><td>G4828</td><td>σύν + μαρτυρέω</td><td><b>to testify alongside</b></td><td>the same word as 2:15 and 8:16</td></tr><tr><td>sorrow</td><td>λύπη</td><td>lypē</td><td>G3077</td><td>—</td><td>grief, sorrow</td><td>—</td></tr><tr><td>unceasing anguish</td><td>ἀδιάλειπτος ὀδύνη</td><td>adialeiptos odynē</td><td>G88 / G3601</td><td>ἀ + διαλείπω (to leave off)</td><td><b>pain that never lets up</b></td><td>ὀδύνη is a very heavy word</td></tr><tr><td>could wish</td><td>ηὐχόμην</td><td>ēuchomēn</td><td>G2172</td><td>εὔχομαι (to pray, to wish)</td><td><b>imperfect</b> (see below)</td><td><b>crucial</b></td></tr><tr><td>accursed</td><td>ἀνάθεμα</td><td>anathema</td><td>G331</td><td>—</td><td><b>a thing devoted to destruction</b></td><td>see below</td></tr></table>","gram":"<p><b>★ First light: symmartyreō — its third appearance</b></p><p>This verb occurs three times in Romans, and each time the witness is different:</p><table><tr><th>Reference</th><th>The witness</th><th>What is testified</th></tr><tr><td>2:15</td><td>the conscience</td><td>accusing or defending — the inner courtroom</td></tr><tr><td>8:16</td><td>the Holy Spirit</td><td>that we are children of God</td></tr><tr><td><b>9:1</b></td><td>the conscience, in the Holy Spirit</td><td><b>that Paul is telling the truth</b></td></tr></table><p>Why does Paul swear so solemnly?</p><p>Because he knows that a Jew who preaches “Gentiles can be saved too” is wide open to one charge: <b>“You have stopped loving your own people.”</b></p><p>So he begins under oath: <b>I am not lying.</b></p><p><b>★ Second light: ēuchomēn is imperfect</b></p><p>“I could wish” — the verb is <b>imperfect</b>.</p><p>In Greek this usage (sometimes called the wish that cannot be fulfilled) means: <b>“I have wished this — knowing it is impossible.”</b> Hence English “I <b>could</b> wish” rather than “I wish.”</p><p><b>This grammatical detail matters.</b> Paul is not proposing something he intends to carry out (he has just said in 8:39 that nothing can separate us).</p><p>He is saying: <b>if it were possible, I would.</b> These are the words of a man whose heart is broken to the very bottom.</p><p><b>★ Third light: the weight of anathema</b></p><p>In the Septuagint this word renders the Hebrew <b>cherem</b> — <b>a thing set apart and handed over to God for destruction</b> (Joshua 6:17–18; the incident of Achan in Joshua 7:1).</p><p>Paul uses the word elsewhere: 1 Corinthians 16:22, “if anyone does not love the Lord, let him be accursed”; Galatians 1:8, “let him be accursed.”</p><p><b>Paul is saying: if it were possible, I would be that devoted thing — if only my own people could be saved.</b></p><p><b>★ Fourth light: this sentence has a precedent</b></p><p>Exodus 32:32, Moses after the golden calf:</p><p><b>“Yet now, if you will forgive their sin — and if not, please blot me out of your book which you have written.”</b></p><p><b>Paul’s words are an echo of Moses.</b></p><p>And what both men said was finally fulfilled in one person — <b>only one man actually became a curse</b>:</p><p><b>“Christ redeemed us from the curse of the law, having become a curse for us.” (Galatians 3:13)</b></p>","exp":"<p>9:1–3 is the door into the whole chapter.</p><p>If you do not enter through here, chapter 9 becomes a cold argument about predestination.</p><p><b>Before Paul speaks about God’s sovereignty, he weeps.</b></p><p><b>And anyone who would preach chapter 9 should walk through these three verses first.</b></p>"},{"a":4,"z":5,"star":false,"grk":"<p>4 οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι, 5 ὧν οἱ πατέρες καὶ ἐξ ὧν ὁ Χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>4 “They are Israelites: theirs is <b>the adoption</b>, <b>the glory</b>, <b>the covenants</b>, <b>the giving of the law</b>, <b>the temple service</b>, and <b>the promises</b>;”</p><p>5 “theirs are <b>the fathers</b>; and from them, according to the flesh, <b>came the Christ</b> — who is over all, God blessed forever. Amen.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>adoption</td><td>υἱοθεσία</td><td>huiothesia</td><td>G5206</td><td><b>adoption</b> (<b>the very word of 8:15 and 8:23</b>)</td></tr><tr><td>glory</td><td>δόξα</td><td>doxa</td><td>G1391</td><td><b>the glory of God’s presence</b> (the shekinah idea)</td></tr><tr><td>covenants</td><td>διαθῆκαι</td><td>diathēkai</td><td>G1242</td><td><b>plural</b>: the covenants with Abraham, Moses and David</td></tr><tr><td>giving of the law</td><td>νομοθεσία</td><td>nomothesia</td><td>G3548</td><td><b>the giving of the law</b> (not merely the law itself)</td></tr><tr><td>service</td><td>λατρεία</td><td>latreia</td><td>G2999</td><td><b>the service of worship</b> (the temple liturgy)</td></tr></table>","gram":"<p><b>★ First light: eight privileges</b></p><p>Paul lists eight in one breath (some scholars count nine):</p><pre>1. Israelites (the name itself)\n2. the adoption (υἱοθεσία)\n3. the glory (the radiance of God’s presence)\n4. the covenants (plural)\n5. the giving of the law\n6. the temple service\n7. the promises (plural)\n8. the fathers\n★ and: from them, according to the flesh, came the Christ</pre><p><b>Paul is saying: every one of these is true.</b></p><p>He does not deny Israel’s privileges in order to make room for the Gentiles. (Just as in 4:1–2 he did not deny Abraham’s greatness in order to preach justification by faith.)</p><p><b>★ Second light: huiothesia — the word from chapter 8</b></p><p>“The adoption” is the very word of 8:15 and 8:23 (Roman adoption).</p><p>And that deepens the grief of 9:1–5: <b>that sonship belongs to them — and most of them are standing outside the door.</b></p><p><b>★ Third light: the punctuation question in 9:5 (whether Christ is called God)</b></p><p>Greek manuscripts had no punctuation. The last clause of 9:5 admits two main readings:</p><table><tr><th>Reading</th><th>Rendering</th><th>Effect</th></tr><tr><td><b>A (most translations)</b></td><td>“…from them came the Christ, <b>who is over all, God blessed forever</b>”</td><td><b>Christ is called God</b></td></tr><tr><td><b>B</b></td><td>“…from them came the Christ. <b>God who is over all be blessed forever</b>”</td><td>the last clause is <b>a separate doxology</b>, not referring to Christ</td></tr></table><p><b>Main reasons for reading A</b> (which most modern scholars prefer):<br>1. A Greek doxology usually places εὐλογητός (blessed) <b>first</b> — here it comes later, which suits a description of the preceding subject<br>2. ὁ ὤν (“who is”) is a relational participle, naturally picking up “the Christ”<br>3. Paul has just said “according to <b>the flesh</b>,” which naturally calls for the other side of the contrast</p><p><b>Reason for reading B:</b> Paul does not often call Christ “God” outright (though Titus 2:13 and Philippians 2:6 show a high christology).</p><p><b>Pulpit note:</b> you may say “most scholars take this as calling Christ God,” but add: “there is a punctuation question here, because the manuscripts had no punctuation.” <b>Do not say “everyone agrees.”</b></p>","exp":"<p>Verses 4–5 deepen the sorrow of 9:1–3.</p><p>Paul’s grief is not abstract. He counts them off one by one: the adoption, the glory, the covenants, the law, the worship, the promises, the fathers, the Messiah —</p><p><b>all of it is theirs.</b></p><p><b>And most of them are not inside it.</b></p>"},{"a":6,"z":6,"star":true,"grk":"<p>Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραὴλ οὗτοι Ἰσραήλ·</p>","lit":"<p>“But it is not as though the word of God <b>has fallen down</b>. For <b>not all who are of Israel are Israel</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>has failed</td><td>ἐκπέπτωκεν</td><td>ekpeptōken</td><td>G1601</td><td>ἐκ + πίπτω (to fall)</td><td><b>to fall out, to fall down, to fail</b></td><td><b>perfect tense</b> (see below)</td></tr><tr><td>word</td><td>λόγος</td><td>logos</td><td>G3056</td><td>—</td><td>word, promise</td><td>God’s promise</td></tr></table>","gram":"<p><b>★ First light: the picture in ekpiptō</b></p><p>The literal sense is <b>to fall out, to drop</b>. It is used of:</p><p>· <b>a flower withering and falling</b> (James 1:11; 1 Peter 1:24)<br>· <b>a ship losing its course and running aground</b> (Acts 27:17, 26, 29)<br>· <b>falling</b> from grace (Galatians 5:4)</p><p>Paul says: <b>God’s word has not fallen down.</b> It has not withered, it has not run aground, it has not dropped off the shelf.</p><p><b>★ Second light: the force of the perfect</b></p><p>ἐκπέπτωκεν is <b>perfect</b> — “(it is not the case that) it has fallen and remains in that condition.”</p><p>What Paul denies is not merely that God’s word once failed, but that <b>God’s word is now in a state of failure</b>.</p><p><b>★ Third light: the direction of the whole chapter’s argument is in this verse</b></p><p>Notice how Paul answers the question “has God’s word failed?”</p><p>He does <b>not</b> say, “No — one day all Israel will believe.” (That comes in chapter 11.)</p><p>He says: <b>“For not all who are descended from Israel are Israel.”</b></p><p>That is: <b>God’s promise was never made to “every ethnic Israelite.”</b> So the fact that many do not now believe <b>does not mean the promise has failed</b>.</p><p><b>★ Fourth light: an exact echo of 2:28–29</b></p><pre>2:28–29  he is not a Jew who is one outwardly… but the one who is so inwardly\n  ↓\n9:6      not all who are of Israel are Israel</pre><p>Paul said the same thing back in chapter 2. Chapter 9 simply applies it to redemptive history.</p>","exp":"<p>9:6 is <b>the key to the chapter</b> — and it is <b>a defence</b>.</p><p>Paul has just finished listing Israel’s eight privileges (9:4–5), and now faces a very sharp question:</p><p>If God gave them all these promises, and most of them are not inside — <b>has God’s word failed?</b></p><p>Paul’s answer has two layers:</p><pre>Layer one: no. God’s word has not “fallen down” (ἐκπίπτω)\nLayer two: because “Israel” was never defined by descent in the first place</pre><p><b>What the text plainly says:</b> God’s word has not failed, because “descended from Israel” is not the same as “Israel.”</p><p><b>What may fairly be drawn from it:</b> this is not an argument Paul improvised. <b>The Old Testament itself works this way</b>: Isaac and not Ishmael; Jacob and not Esau. God never promised that every physical descendant of Abraham would be saved.</p><p><b>⚠ Pulpit note:</b> the driving question of chapter 9 is <b>“has the word of God failed?” (9:6)</b> — <b>not “how should we construct a doctrine of predestination?”</b></p><p>If you read chapter 9 as a treatise on predestination, you have mistaken both its genre and its purpose.</p>"},{"a":7,"z":9,"star":false,"grk":"<p>7 οὐδ' ὅτι εἰσὶν σπέρμα Ἀβραάμ πάντες τέκνα, ἀλλ'· ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα. 8 τοῦτ' ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα. 9 ἐπαγγελίας γὰρ ὁ λόγος οὗτος· κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.</p>","lit":"<p>7 “Nor are they all children because they are Abraham’s seed; but: ‘<b>In Isaac shall your seed be called.</b>’”</p><p>8 “That is: <b>the children of the flesh are not the children of God</b>; but <b>the children of the promise are counted as the seed</b>.”</p><p>9 “For this is the word of promise: ‘<b>At this time I will come, and Sarah shall have a son.</b>’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>children of the flesh</td><td>τὰ τέκνα τῆς σαρκός</td><td>—</td><td>G4561</td><td><b>the children of the flesh</b></td></tr><tr><td>children of the promise</td><td>τὰ τέκνα τῆς ἐπαγγελίας</td><td>—</td><td>G1860</td><td><b>the children of the promise</b></td></tr></table>","gram":"<p><b>★ Paul’s first example: Ishmael and Isaac</b></p><p>The point of this example is:</p><pre>Ishmael:  Abraham’s son (fully qualified by descent — and the firstborn)\nIsaac:    Abraham’s son + the product of a promise\n  ↓\nthe one God chose was Isaac</pre><p>And 9:9 quotes Genesis 18:10, 14, stressing that Isaac was the result of <b>a promise</b>: “At this time next year I will return, and Sarah shall have a son.”</p><p>Recall chapter 4: 4:19, “he considered his own body, already as good as dead, being about a hundred years old.”</p><p>The birth of Isaac was the work of <b>“the God who gives life to the dead and calls into being what does not exist”</b> (4:17).</p><p><b>So Paul’s point is: the children of the promise were, from the very beginning, born by God, not produced by man.</b></p>","exp":"<p>These three verses are proving the statement of 9:6. And the example Paul chooses is <b>something inside Abraham’s own household</b>.</p><p>Abraham had two sons. Ishmael was <b>the descendant by blood</b> — and the elder at that. Isaac was <b>the child of promise</b>.</p><p>Note the verb in verse 8: “<b>are counted</b> (λογίζεται) as the seed” — <b>the bookkeeping word from chapter 4</b>.</p><p><b>What the text plainly says:</b> God’s seed is defined by <b>promise</b>, not by <b>flesh</b>.</p><p><b>What may fairly be drawn from it:</b> this says something to every reader — <b>you are in God’s household not because of your origin, but because of his promise.</b></p><p>And the birth of Isaac is itself the evidence: it was the work of “the God who gives life to the dead and calls into being what does not exist” (4:17).</p><p><b>⚠ Pastoral note:</b> this passage is not asking anyone to guess who the children of promise are. It is bringing us back to the question of 9:6: <b>has God’s word failed?</b> And the answer is: no.</p>"},{"a":10,"z":13,"star":true,"grk":"<p>11 μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον, ἵνα ἡ κατ' ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ, οὐκ ἐξ ἔργων ἀλλ' ἐκ τοῦ καλοῦντος,</p>","lit":"<p>11 “For though the twins were <b>not yet born</b>, and had <b>done nothing good or bad</b> — so that God’s <b>purpose according to election</b> might <b>stand</b>, not of works but <b>of him who calls</b> —”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>election</td><td>ἐκλογή</td><td>eklogē</td><td>G1589</td><td>ἐκ + λέγω (to pick out)</td><td><b>a picking out</b></td><td>the same word as 11:5, 11:28</td></tr><tr><td>purpose</td><td>πρόθεσις</td><td>prothesis</td><td>G4286</td><td>πρό + τίθημι</td><td><b>a plan set out beforehand</b></td><td><b>the same word as 8:28</b></td></tr><tr><td>stand</td><td>μένῃ</td><td>menē</td><td>G3306</td><td>μένω</td><td><b>to remain unchanged, to hold</b></td><td>—</td></tr><tr><td>hated</td><td>ἐμίσησα</td><td>emisēsa</td><td>G3404</td><td>μισέω</td><td>to hate</td><td>see the disputed material</td></tr></table>","gram":"<p><b>★ First light: why does Paul add a second example?</b></p><p>Because the Ishmael–Isaac example still allows one escape: “Ishmael was the son of a slave, Isaac of the wife — <b>so the mothers were different.</b>”</p><p>So Paul adds a second example that closes that door:</p><pre>Jacob and Esau: the same father (Isaac), the same mother (Rebekah)\n                and twins, from a single conception (9:10)</pre><p>No one can now say “because their origins differed.”</p><p><b>★ Second light: “not yet born, having done nothing good or bad”</b></p><p>Paul deliberately stresses the timing: when God spoke (Genesis 25:23), the two children were still in the womb.</p><p>So the basis of the choice <b>cannot possibly have been their works</b>.</p><p><b>★ Third light: prothesis — the word from 8:28</b></p><pre>8:28  “those who are called according to his PURPOSE (πρόθεσις)”\n9:11  “God’s PURPOSE (πρόθεσις) according to election”</pre><p>The golden chain of chapter 8 and the election of chapter 9 use the same word.</p><p><b>★ Fourth light: 9:13, “Esau I hated” (for the full discussion see the disputed material)</b></p><p>This sentence is quoted from Malachi 1:2–3. Three things must be kept in view:</p><p><b>1.</b> The context in Malachi concerns <b>two nations</b> (Edom and Israel), not the eternal destiny of two infants<br><b>2.</b> Genesis 25:23 says in so many words, <b>“two nations are in your womb”</b> — it is a prophecy about peoples<br><b>3.</b> In Hebrew idiom, “loved… hated…” is frequently <b>comparative</b> (see the disputed material)</p><p><b>Pulpit note:</b> 9:13 must not be read flatly as “God decided before Esau was born to detest him and send him to hell” — <b>that goes beyond what the text Paul quotes actually says.</b></p>","exp":"<p>What is the point of 9:11?</p><p><b>“Not of works, but of him who calls.”</b></p><p>That sentence is entirely consistent with the whole letter:</p><pre>3:20   no one is justified by works of the law\n4:4–5  to the one who works, the wage is not counted as grace\n9:11   not of works, but of him who calls\n9:16   not of him who wills, nor of him who runs</pre><p><b>Paul teaches election in chapter 9 not to satisfy our curiosity about who is saved, but to prove the same one thing: from beginning to end, it is grace.</b></p>"},{"a":14,"z":16,"star":false,"grk":"<p>16 ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.</p>","lit":"<p>14 “What then shall we say? <b>Is there unrighteousness with God?</b> <b>By no means!</b>”</p><p>15 “For he says to Moses: ‘<b>I will have mercy on whom I have mercy</b>, and I will have compassion on whom I have compassion.’”</p><p>16 “So then it is <b>not of the one who wills</b>, <b>nor of the one who runs</b>, but <b>of God who has mercy</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>unrighteousness</td><td>ἀδικία</td><td>adikia</td><td>G93</td><td><b>injustice</b></td></tr><tr><td>the one who wills</td><td>τοῦ θέλοντος</td><td>tou thelontos</td><td>G2309</td><td><b>the decision of the will</b> (the same word as “to will” in 7:18)</td></tr><tr><td>the one who runs</td><td>τοῦ τρέχοντος</td><td>tou trechontos</td><td>G5143</td><td><b>running a race</b> (a favourite Pauline image: 1 Corinthians 9:24; Philippians 2:16)</td></tr><tr><td>who has mercy</td><td>ἐλεῶντος</td><td>eleōntos</td><td>G1653</td><td>showing mercy</td></tr></table>","gram":"<p><b>★ First light: the context of Exodus 33:19 is enormously important</b></p><p>When did God say these words?</p><p><b>After the golden calf.</b></p><p>Israel had just worshipped a golden calf; Moses asked to see God’s glory; and God said:</p><p><b>“I will be gracious to whom I will be gracious, and will show mercy on whom I will show mercy.” (Exodus 33:19)</b></p><p><b>This matters greatly: the original setting of that sentence is not “God arbitrarily decides who goes to hell.” It is: “a nation that has just rebelled is somehow still allowed to exist — and that is mercy.”</b></p><p><b>★ Second light: “the one who wills / the one who runs”</b></p><pre>θέλω  —  the will (I want to)\nτρέχω —  the action (I try hard)</pre><p>Paul names the only two things a person can do: <b>want, and run</b>. And then he says: neither is the basis.</p><p>And those two words answer exactly to chapter 7:</p><p><b>7:18, “to will (θέλειν) is present with me, but to do what is good is not.”</b></p><p><b>Wanting, I have. Running, I have tried. And 9:16 says: that is not where this rests.</b></p>","exp":"<p>The question in verse 14 is the one every reader of 9:13 asks: <b>“Is that fair?”</b></p><p>And Paul’s answer does not begin with a defence. It begins with <b>a quotation</b> (Exodus 33:19).</p><p>And the setting of that quotation is decisive: <b>it was spoken after the golden calf.</b> Israel had just worshipped an idol; Moses asked to see God’s glory. And what God said was: “I will have mercy on whom I have mercy.”</p><p><b>What the text plainly says:</b> the basis of God’s mercy lies in himself, not in human willing (θέλω) or human effort (τρέχω).</p><p><b>What may fairly be drawn from it:</b> Paul has listed <b>the only two things a person can do</b> — want, and run. And those two words answer exactly to chapter 7: “to will is present with me, but to do it is not.”<br><b>Wanting, I have. Running, I have tried. And 9:16 says: that is not where this rests.</b></p><p><b>⚠ Pulpit note:</b> 9:16 must not be used to deny human responsibility — the same Paul says in 10:9–13 that “everyone who calls on the name of the Lord will be saved,” and in 10:14, “how shall they hear without a preacher?”<br><b>Chapters 9 and 10 must be read together.</b></p>"},{"a":17,"z":18,"star":false,"grk":"<p>17 λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ. 18 ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.</p>","lit":"<p>17 “For the Scripture says to Pharaoh: ‘<b>For this very purpose I raised you up</b>, that I might <b>display my power in you</b>, and that <b>my name might be proclaimed in all the earth</b>.’”</p><p>18 “So then he <b>has mercy on whom he wills</b>, and he <b>hardens whom he wills</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>raised up</td><td>ἐξήγειρα</td><td>exēgeira</td><td>G1825</td><td><b>to raise up, to cause to stand</b> (see below)</td></tr><tr><td>hardens</td><td>σκληρύνει</td><td>sklērynei</td><td>G4645</td><td><b>to harden</b> (<b>the same root as σκληρότης in 2:5</b>)</td></tr></table>","gram":"<p><b>★ First light: the full data of Exodus (★ this must be presented honestly)</b></p><p>On the hardening of Pharaoh’s heart, the narrative of Exodus is more complex than most people assume:</p><table><tr><th>Statement</th><th>References</th></tr><tr><td><b>God hardens Pharaoh’s heart</b></td><td>Exodus 4:21; 7:3; 9:12; 10:1, 20, 27; 11:10; 14:4, 8, 17</td></tr><tr><td><b>Pharaoh hardens his own heart</b></td><td>Exodus 8:15, 32; 9:34</td></tr><tr><td><b>Pharaoh’s heart was hardened</b> (no subject named)</td><td>Exodus 7:13, 14, 22; 8:19; 9:7; 9:35</td></tr></table><p><b>This data matters enormously: Exodus says both that God hardened him and that he hardened himself.</b></p><p>And it is worth noting the <b>narrative order</b>: the accounts of Pharaoh hardening his own heart come <b>early</b> (Exodus 7–8), while the actual instances of God hardening him come mostly <b>later</b> (from Exodus 9:12 onward).</p><p>(Scholars read the theological significance of that order differently, but the data itself is clear.)</p><p><b>★ Second light: sklērynō and the echo of 2:5</b></p><pre>2:5   “according to your HARDNESS (σκληρότης) and unrepentant heart”  —  the man hardens himself\n9:18  “he HARDENS (σκληρύνει) whom he wills”                          —  God hardens</pre><p><b>Paul says both in Romans.</b></p><p><b>★ Third light: exegeirō — “raised up”</b></p><p>The Hebrew of Exodus 9:16 carries the sense of “I have let you stand.” What God says to Pharaoh is: <b>I have kept you alive until now, and there is a purpose in it.</b></p><p><b>Note: the text says “I <b>raised you up</b>,” not “I created you in order to destroy you.”</b></p>","exp":"<p>9:14–18 answers the question “is God fair?” — but perhaps not in the way we expect.</p><p>Paul does <b>not</b> say, “God is fair, because he decides on the basis of how people perform.”</p><p>What he says is: <b>“I will have mercy on whom I have mercy.”</b></p><p>And the weight of that sentence falls on <b>mercy</b>.</p><p>What is the definition of mercy? <b>Mercy means: he does not owe you.</b></p><p><b>If God owed you, that would be called fairness.<br>If God does not owe you, that is called mercy.</b></p><p>And Paul has spent eight chapters proving one thing: <b>God owes no one.</b></p>"},{"a":19,"z":21,"star":false,"grk":"<p>20 ὦ ἄνθρωπε, μενοῦνγε σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ;</p>","lit":"<p>19 “You will say to me then: ‘<b>Why does he still find fault?</b> For who has <b>resisted his will</b>?’”</p><p>20 “<b>O man</b> — <b>who exactly are you</b>, to <b>answer back</b> to God? Will <b>the thing formed</b> say to <b>the one who formed it</b>, ‘Why did you make me like this?’”</p><p>21 “Has the potter no right, <b>from the same lump of clay</b>, to make one vessel <b>for honour</b> and another <b>for ordinary use</b>?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>O man</td><td>ὦ ἄνθρωπε</td><td>ō anthrōpe</td><td>G444</td><td>—</td><td>vocative: <b>O man</b></td><td><b>the same vocative as 2:1 and 2:3</b></td></tr><tr><td>answer back</td><td>ἀνταποκρινόμενος</td><td>antapokrinomenos</td><td>G470</td><td>ἀντί + ἀποκρίνομαι</td><td><b>to talk back, to answer against</b></td><td>see below</td></tr><tr><td>potter</td><td>κεραμεύς</td><td>kerameus</td><td>G2763</td><td>—</td><td>a potter</td><td>a common Old Testament image</td></tr><tr><td>clay</td><td>πηλός</td><td>pēlos</td><td>G4081</td><td>—</td><td>clay</td><td>—</td></tr></table>","gram":"<p><b>★ First light: “O man” — the vocative from chapter 2 returns</b></p><pre>2:1   “O MAN (ὦ ἄνθρωπε), whoever you are who judges”\n2:3   “O MAN (ὦ ἄνθρωπε)”\n9:20  “O MAN (ὦ ἄνθρωπε)”</pre><p>Paul uses this vocative three times in Romans — <b>and every time he is dealing with human self-assurance</b>.</p><p><b>★ Second light: antapokrinomai — “to talk back”</b></p><p>The word is ἀντί (against) + ἀποκρίνομαι (to answer). It means <b>to answer back, to contradict, to argue against</b>.<br>(Only twice in the New Testament: Luke 14:6; Romans 9:20.)</p><p>Paul’s point is <b>not</b> “you may not ask questions” — <b>he is asking questions himself in 9:14 and 9:19!</b></p><p>His point is: <b>you may not stand across from God and interrogate him as though he were the defendant.</b></p><p><b>★ Third light: the potter image comes from the Old Testament — and its contexts matter</b></p><p>Paul alludes in 9:20 to Isaiah 29:16 and Isaiah 45:9, and the potter image of 9:21 has several Old Testament homes:</p><table><tr><th>Reference</th><th>Context</th></tr><tr><td>Isaiah 29:16</td><td>a rebuke to those who think God cannot see</td></tr><tr><td>Isaiah 45:9</td><td>a rebuke to those who question God’s use of Cyrus</td></tr><tr><td><b>★ Jeremiah 18:1–10</b></td><td><b>the potter’s house — and the point of that passage is that God alters his dealing according to human response</b></td></tr></table><p><b>Jeremiah 18:7–8 is extremely important:</b></p><p><b>“The instant I speak concerning a nation and concerning a kingdom, to pluck up and to pull down and to destroy it — if that nation turns from their evil, I will relent of the disaster that I thought to do to them.”</b></p><p><b>This is worth noting: the Old Testament potter image itself includes human response.</b> Paul uses the image to speak of God’s sovereignty — <b>but in its original Old Testament setting, the image is not fatalism.</b></p>","exp":"<p>The question in verse 19 is an honest one: “then who can be blamed?”</p><p>And Paul’s answer leaves many people unsatisfied — <b>because he does not answer it directly</b>.</p><p>What he does is <b>move the questioner back to the place where he belongs</b>.</p><p><b>“O man — who exactly are you?”</b></p><p><b>What the text plainly says:</b> a creature has no standing to interrogate the one who made him; a potter has the right to dispose of the clay.</p><p><b>What may fairly be drawn from it:</b> Paul is <b>not</b> here proving “God is arbitrary.” He is pointing out that <b>the questioner is standing in the wrong place</b>.</p><p>This is exactly what the 3-2-1 means by <b>pride: leaving your position and seizing authority</b>. And the “leaving your position” here is <b>jumping from the place of the creature to the place of the interrogator</b>.</p><p><b>⚠ Pulpit note (very important):</b> when you reach the potter, <b>you must not stop here.</b> Three reasons:</p><p><b>①</b> The Old Testament potter image (Jeremiah 18:1–10) <b>itself includes human response</b>: “if that nation turns from their evil, I will relent.”<br><b>②</b> The Greek grammar of the next paragraph (9:22–23) is <b>asymmetrical</b> (see the next block).<br><b>③</b> Paul’s own conclusion comes at 9:32: “because they did not pursue it by faith, but as though by works.”</p>"},{"a":22,"z":24,"star":true,"grk":"<p>22 εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν, 23 καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους ἃ προητοίμασεν εἰς δόξαν,</p>","lit":"<p>22 “But if God, willing to show his wrath and make his power known, <b>bore with much long patience</b> the vessels of wrath — <b>which have been prepared for destruction</b> —”</p><p>23 “and in order to make known the riches of his glory on the vessels of mercy — <b>which he prepared beforehand for glory</b> —”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Voice</th><th>Meaning</th></tr><tr><td>patience</td><td>μακροθυμία</td><td>makrothymia</td><td>G3115</td><td>—</td><td><b>the word of 2:4 — the “long fuse”</b></td></tr><tr><td>endured</td><td>ἤνεγκεν</td><td>ēnenken</td><td>G5342</td><td>active</td><td><b>to bear, to carry</b> (φέρω)</td></tr><tr><td>prepared for destruction</td><td>κατηρτισμένα</td><td>katērtismena</td><td>G2675</td><td><b>perfect passive participle</b></td><td>see below</td></tr><tr><td>prepared beforehand for glory</td><td>προητοίμασεν</td><td>proētoimasen</td><td>G4282</td><td><b>active — the subject is God</b></td><td>see below</td></tr></table>","gram":"<p><b>★★ First light: the enormous asymmetry between these two verses</b></p><p>Set the two verbs side by side:</p><pre>9:22  κατηρτισμένα εἰς ἀπώλειαν\n      “having been prepared for destruction”\n      — perfect passive participle\n      — [THE TEXT DOES NOT SAY WHO PREPARED THEM]\n\n9:23  ἃ προητοίμασεν εἰς δόξαν\n      “which he prepared beforehand for glory”\n      — active voice\n      — [THE SUBJECT IS EXPLICITLY GOD]</pre><p><b>Paul’s wording here is precise to the point of being startling.</b></p><p>When he speaks of <b>glory</b>, he says outright: <b>God prepared them beforehand.</b><br>When he speaks of <b>destruction</b>, he uses a passive, and <b>does not say who prepared them.</b></p><p>What does that asymmetry imply?</p><p>At the very least: <b>Paul did not write a symmetrical sentence saying “God prepares some for glory and others for hell.” He deliberately used different grammar on the two sides.</b></p><p>(For the full discussion of double predestination, see the disputed material.)</p><p><b>★ Second light: the meaning of katērtismena</b></p><p>καταρτίζω means <b>to mend, to fit together, to bring to completeness</b>.<br>(Mark 1:19, “mending nets”; Galatians 6:1, “restore”; Hebrews 11:3, “the worlds were framed by the word of God” — all the same word.)</p><p>The word itself is neutral: bringing something to the state it is to be in.</p><p><b>★ Third light: makrothymia — the word from chapter 2</b></p><pre>2:4   “do you despise the riches of his kindness, forbearance and PATIENCE (μακροθυμία)…\n       not knowing that his kindness is leading you to repentance?”\n  ↓\n9:22  “bore with much PATIENCE (μακροθυμία) the vessels of wrath”</pre><p><b>This link is enormously important.</b></p><p>Chapter 2 says: God’s patience <b>is leading people to repentance</b>.<br>Chapter 9 says: toward “the vessels of wrath,” God also shows <b>much patience</b>.</p><p><b>So the picture in 9:22 is not “God can hardly wait to destroy them,” but “God has borne with them for a very long time.”</b></p><p><b>★ Fourth light: the close of 9:24</b></p><p>“Even us, whom he called — not only from the Jews, <b>but also from the Gentiles</b>.”</p><p>Paul finishes with the potter and the clay, and then says: <b>that vessel of mercy is you.</b> And not only Jews — <b>Gentiles too</b>.</p><p><b>That is the purpose of the doctrine of election in chapter 9: not so that we may guess who is in and who is out, but so that Gentile believers may know — you are here purely by mercy.</b></p>","exp":"<p>These three verses are <b>the part of the chapter that must be read most carefully</b>. And the key lies in <b>the asymmetry of the Greek grammar</b>:</p><table><tr><th></th><th>vessels of wrath (9:22)</th><th>vessels of mercy (9:23)</th></tr><tr><td><b>verb form</b></td><td><b>κατηρτισμένα</b> (perfect passive participle)</td><td><b>προητοίμασεν</b> (active, aorist)</td></tr><tr><td><b>agent</b></td><td><b>not stated</b></td><td><b>explicitly God</b></td></tr><tr><td><b>God’s posture</b></td><td><b>bore with much patience</b> (μακροθυμία)</td><td>displays the riches of his glory</td></tr></table><p><b>Paul deliberately did not write the two sides symmetrically.</b></p><p>And μακροθυμία (patience) is the very word of 2:4:</p><p>2:4, “do you despise the riches of his kindness, forbearance and <b>patience</b>, not knowing that his kindness <b>is leading you to repentance</b>?”</p><p><b>What the text plainly says:</b> God bore long with the vessels of wrath and displays his glory on the vessels of mercy; and those called vessels include both Jews and Gentiles.</p><p><b>What may fairly be drawn from it:</b> the grammatical asymmetry <b>cannot be used to prove either side’s doctrine of predestination</b>, but it does show this: <b>Paul was unwilling to describe “destruction” and “glory” as the same kind of act.</b></p><p><b>⚠ Pulpit note:</b> the grammatical observation is a hard, verifiable fact; but <b>the theological inference</b> has been read differently by interpreters through the centuries. It is right to say “Paul’s wording here is asymmetrical”; it is not right to announce “therefore such-and-such a position is the correct one.”</p><p>And verse 24 brings the whole passage back to earth:</p><p><b>“Even us, whom he called… not only from the Jews, but also from the Gentiles.”</b></p><p>After all this talk of vessels — <b>Paul says: the vessel is you.</b></p>"},{"a":25,"z":29,"star":false,"grk":"<p>25 …καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην· 27 …ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ὑπόλειμμα σωθήσεται· 29 …εἰ μὴ κύριος σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν…</p>","lit":"<p>25 “As he says in Hosea: ‘<b>I will call those who were not my people, my people</b>; and her who was <b>not beloved, beloved</b>.’”</p><p>26 “‘And in the place where it was said to them, “You are not my people,” there they shall be called <b>sons of the living God</b>.’”</p><p>27 “And Isaiah <b>cries out</b> concerning Israel: ‘Though the number of the children of Israel be <b>as the sand of the sea</b>, <b>only the remnant will be saved</b>;’”</p><p>28 “‘for the Lord will <b>execute his word</b> on the earth, <b>thoroughly and without delay</b>.’”</p><p>29 “And as Isaiah said before: ‘<b>Unless the Lord of hosts had left us a seed</b>, we would have <b>become like Sodom</b> and been made like Gomorrah.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>remnant</td><td>ὑπόλειμμα</td><td>hypoleimma</td><td>G5259</td><td><b>the small part that is left</b></td></tr><tr><td>seed</td><td>σπέρμα</td><td>sperma</td><td>G4690</td><td><b>seed</b> (Isaiah 1:9 LXX)</td></tr></table>","gram":"<p><b>★ First light: who was Hosea originally addressing?</b></p><p>The “not my people” of Hosea 1–2 (<b>Lo-Ammi</b>) referred originally to <b>the northern kingdom of Israel</b> — God saying: because of your rebellion, you are no longer my people.</p><p>And then God said: one day, I will call you “my people” again.</p><p><b>And Paul applies that passage to the Gentiles</b> (9:24, “but also from the Gentiles”).</p><p>What kind of exegesis is that?</p><p>Paul’s logic is: <b>if God can take Israelites who were “not my people” and make them his people again, then of course he can take Gentiles who were never his people and make them his.</b><br><b>This is the sort of God he has always been.</b></p><p><b>★ Second light: the “remnant” theme in Isaiah</b></p><p>This is one of the great themes of the Old Testament prophets:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td>Isaiah 1:9</td><td>“unless the LORD of hosts had left us a very small remnant”</td></tr><tr><td>Isaiah 10:20–22</td><td>“the remnant will return, the remnant of Jacob”</td></tr><tr><td>1 Kings 19:18</td><td>“I have left for myself seven thousand in Israel”</td></tr><tr><td><b>Romans 11:5</b></td><td>“so too at this present time there is a remnant according to the election of grace.”</td></tr></table><p><b>The idea of a remnant has two faces:</b></p><p>One face is <b>judgement</b>: only a small part is left.<br>The other face is <b>grace</b>: <b>there is still a small part left at all.</b></p><p>And 9:29 says it plainly: “unless… we would <b>already</b> have been like Sodom.”</p>","exp":"<p>The function of 9:25–29 is to prove that Paul is not teaching a new doctrine.</p><p>Paul says: <b>Hosea said this long ago. Isaiah said this long ago.</b></p><p><b>God has been doing this from the beginning.</b></p>"},{"a":30,"z":33,"star":true,"grk":"<p>32 διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ' ὡς ἐξ ἔργων· προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,</p>","lit":"<p>30 “What then shall we say? That <b>Gentiles, who were not pursuing righteousness</b>, <b>have obtained righteousness</b> — the righteousness that is <b>by faith</b>;”</p><p>31 “but Israel, <b>pursuing a law of righteousness</b>, <b>did not arrive at that law</b>.”</p><p>32 “Why? <b>Because they did not pursue it by faith, but as though by works.</b> They <b>stumbled over the stone of stumbling</b> —”</p><p>33 “as it is written: ‘Behold, I lay in Zion a <b>stone of stumbling</b> and a <b>rock of offence</b>; and <b>the one who believes in him will not be put to shame</b>.’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>pursuing</td><td>διώκοντα</td><td>diōkonta</td><td>G1377</td><td><b>to chase, to pursue hard</b> (a racing image)</td></tr><tr><td>stumbled</td><td>προσέκοψαν</td><td>prosekopsan</td><td>G4350</td><td>πρός + κόπτω: <b>to strike against, to trip on</b></td></tr><tr><td>stone of stumbling</td><td>λίθος τοῦ προσκόμματος</td><td>—</td><td>G4348</td><td><b>a stone that trips people up</b></td></tr><tr><td>be put to shame</td><td>καταισχυνθήσεται</td><td>kataischynthēsetai</td><td>G2617</td><td><b>to be put to shame</b> (the same word as “hope does not put us to shame,” 5:5)</td></tr></table>","gram":"<p><b>★★ First light: this is Paul’s own conclusion to chapter 9</b></p><p>This point is enormously important.</p><p>Many people read chapter 9, get as far as the potter (9:21), and stop.</p><p>But Paul draws his own conclusion in 9:30–33 — and that conclusion is:</p><p><b>“Why? Because they did not pursue it by faith, but as though by works.”</b></p><p><b>Paul lands the whole chapter on human responsibility.</b></p><p>He does <b>not</b> say, “because God did not choose them.”<br>He says: <b>“because they pursued it by works.”</b></p><p>And that runs straight on into the opening of chapter 10:</p><p>10:2–3, “they have a zeal for God, but not according to knowledge… seeking to establish their own righteousness, they did not submit to God’s righteousness.”</p><p><b>★ Second light: hōs ex ergōn — “as though by works”</b></p><p>There is a small word in 9:32 that translations easily lose:</p><p>οὐκ ἐκ πίστεως ἀλλ' <b>ὡς</b> ἐξ ἔργων<br>“not by faith, but <b>as though</b> by works.”</p><p>What does that ὡς (as though) do?</p><p>Some scholars take Paul to be hinting that they <b>supposed</b> they could pursue it by works — <b>whereas righteousness was never obtained that way at all.</b><br>(This is a fine observation; from the pulpit it can be mentioned briefly and passed over.)</p><p><b>★ Third light: 9:33 is a fused quotation of two Isaiah passages</b></p><pre>Isaiah 28:16  “Behold, I lay in Zion a stone for a foundation…\n               he who believes will not act hastily.”   (positive: cornerstone)\nIsaiah 8:14   “he will be a sanctuary — but a stone of stumbling and a rock of\n               offence to both houses of Israel.”        (negative: stumbling stone)\n  ↓\nRomans 9:33   Paul fuses the two:\n               “I lay in Zion a stone of stumbling and a rock of offence;\n                and the one who believes in him will not be put to shame.”</pre><p><b>The fusion is superb:</b></p><p><b>The same stone.</b><br>To the one who believes, <b>a cornerstone</b>.<br>To the one who does not, <b>a stone of stumbling</b>.</p><p>(1 Peter 2:6–8 makes the same fused quotation.)</p><p><b>★ Fourth light: who is that stone?</b></p><p>9:33 does not say. But the next chapter does:</p><p>10:4, “<b>Christ is the end of the law</b> for righteousness to everyone who believes.”<br>10:11, “the Scripture says, ‘Whoever believes in him will not be put to shame.’”</p><p><b>That stone at the end of chapter 9 — is a person.</b></p>","exp":"<p>9:30–33 is the most important — and most frequently skipped — passage in the chapter.</p><p>Paul has spent thirty verses on God’s sovereignty. And what does he say at the end?</p><p><b>“They did not pursue it by faith, but as though by works.”</b></p><p>And the picture he draws is heartbreaking:</p><pre>the Gentiles:  were not pursuing righteousness  →  and obtained it\nIsrael:        pursued righteousness hard        →  and did not reach it</pre><p>Why?</p><p><b>Because the direction they ran was right, and the method was wrong.</b></p><p>They ran flat out — and then <b>they hit a stone</b>.</p><p><b>And that stone is the one God laid in Zion.</b></p>"}],"10":[{"a":1,"z":1,"star":false,"grk":"<p>Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ δέησις πρὸς τὸν θεὸν ὑπὲρ αὐτῶν εἰς σωτηρίαν.</p>","lit":"<p>“Brothers, the <b>deep desire</b> of my heart, and my <b>earnest petition</b> to God on their behalf, is for their salvation.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>heart's desire</td><td>εὐδοκία</td><td>eudokia</td><td>G2107</td><td>εὖ (well) + δοκέω (to think)</td><td><b>good pleasure, what the heart is set on</b></td><td>see below</td></tr><tr><td>prayer</td><td>δέησις</td><td>deēsis</td><td>G1162</td><td>δέομαι (to beg)</td><td><b>urgent petition</b> (not prayer in general)</td><td>it carries urgency</td></tr><tr><td>salvation</td><td>σωτηρία</td><td>sōtēria</td><td>G4991</td><td>—</td><td>rescue, salvation</td><td>—</td></tr></table>","gram":"<p><b>★ First light: eudokia — a word normally used of God</b></p><p>In the New Testament εὐδοκία mostly describes <b>God’s good pleasure</b>:</p><p>· Matthew 11:26, “Father, for so it was <b>well-pleasing</b> in your sight”<br>· Ephesians 1:5, 9, “according to the <b>good pleasure</b> of his will”<br>· Philippians 2:13, “it is God who works in you both to will and to work, for his <b>good pleasure</b>”</p><p>And Paul uses that word of his own heart: <b>“the good pleasure of my heart is that they may be saved.”</b></p><p><b>The implication: that longing in him was put there by God.</b></p><p><b>★ Second light: the position of this verse, immediately after chapter 9</b></p><p>The placement is enormously important.</p><p>Chapter 9 has just finished saying: <b>“It is not of him who wills, nor of him who runs, but of God who has mercy.” (9:16)</b></p><p>If anyone reads chapter 9 and concludes “then prayer is pointless” — Paul closes that road in the very next verse:</p><p><b>“My prayer to God for Israel is that they may be saved.”</b></p><p><b>Paul evidently saw no contradiction between God’s sovereignty and praying for people.</b></p>","exp":"<p>Between chapter 9 and chapter 10 there is a single verse. <b>And that verse is a prayer.</b></p><p><b>What the text plainly says:</b> the longing of Paul’s heart, and his petition to God, is for Israel’s salvation.</p><p><b>What may fairly be drawn from it:</b> this verse is the most important <b>instruction manual</b> for chapter 9. Paul has just said “not of him who wills, nor of him who runs” (9:16) — <b>and the first thing he does is kneel down and pray for them.</b></p><p>And the Greek word for “desire” is <b>εὐδοκία — the deepest delight and longing of the heart</b>. <b>This is not a sense of duty. It is desire.</b></p><p><b>⚠ Pulpit note:</b> God’s sovereignty is <b>never</b> a reason to stop praying and stop preaching. Chapter 10 will go on to say: <b>“How shall they hear without a preacher?” (10:14)</b></p>"},{"a":2,"z":3,"star":true,"grk":"<p>2 μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν ἀλλ' οὐ κατ' ἐπίγνωσιν· 3 ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην καὶ τὴν ἰδίαν [δικαιοσύνην] ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν.</p>","lit":"<p>2 “For I <b>bear them witness</b> that they have <b>zeal</b> for God — but not according to <b>full knowledge</b>.”</p><p>3 “For, <b>not knowing</b> the righteousness of God, and <b>striving to set up</b> their own, they <b>did not fall in under</b> the righteousness of God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>zeal</td><td>ζῆλος</td><td>zēlos</td><td>G2205</td><td>ζέω (to boil)</td><td><b>fervour, heat</b> (English “zeal”)</td><td>see below</td></tr><tr><td>full knowledge</td><td>ἐπίγνωσις</td><td>epignōsis</td><td>G1922</td><td>ἐπί (intensive) + γνῶσις</td><td><b>thorough, personal knowledge</b></td><td><b>the same word as 3:20</b></td></tr><tr><td>establish</td><td>στῆσαι</td><td>stēsai</td><td>G2476</td><td>ἵστημι (to stand)</td><td><b>to make something stand, to prop up</b></td><td>see below</td></tr><tr><td>did not submit</td><td>οὐχ ὑπετάγησαν</td><td>ouch hypetagēsan</td><td>G5293</td><td>ὑπό + τάσσω (to draw up in rank)</td><td><b>did not fall in underneath</b></td><td><b>passive</b> (see below)</td></tr></table>","gram":"<p><b>★ First light: zēlos — “to boil”</b></p><p>The root of this word is <b>ζέω — to boil, to be at a rolling heat</b>.<br>(Acts 18:25, “<b>fervent</b> in spirit”; Romans 12:11, “<b>fervent</b> in spirit” — the same root.)</p><p><b>Paul is saying: their fervour is real.</b> This is not sarcasm. He says <b>“I bear them witness” (μαρτυρῶ)</b> — I testify on their behalf: their zeal is genuine.</p><p>And Paul is qualified to say it, because he was once the most fervent of all:</p><p>Galatians 1:14, “being more exceedingly <b>zealous</b> (ζηλωτής) for the traditions of my fathers.”<br>Philippians 3:6, “concerning <b>zeal</b> (ζῆλος), persecuting the church.”</p><p><b>★ Second light: epignōsis — “full knowledge”</b></p><p>Note that Paul does <b>not</b> say they had “no knowledge.” He says: not according to <b>ἐπίγνωσις — the intensified, thorough, personal kind of knowing</b>.</p><p>And we met that word in 3:20:</p><p>3:20, “for through the law comes <b>the knowledge of sin</b> (ἐπίγνωσις ἁμαρτίας).”</p><p><b>There is a very deep irony here: the law existed to give people that ἐπίγνωσις — to know for themselves that they are sinners. And they held the law, and never received it.</b></p><p><b>★ Third light: stēsai — “to prop up”</b></p><p>“Seeking to <b>establish</b> their own righteousness” — ἵστημι, <b>to make something stand</b>.</p><p>The picture is: <b>a man crouched on the ground, straining to hold something upright and keep it steady.</b></p><p><b>The verb is exhausting. Building your own righteousness is very tiring work.</b></p><p><b>★ Fourth light: hypotassō — “did not submit” is passive</b></p><p>“They did not <b>submit</b> to the righteousness of God” — οὐχ ὑπετάγησαν, <b>passive (or middle) voice</b>.</p><p>ὑποτάσσω is <b>a military term</b>: ὑπό (under) + τάσσω (to draw up in ranks) — meaning <b>to fall in under someone’s standard, to take one’s place in his line</b>.</p><p><b>So 10:3 means: they did not fall in under God’s righteousness. They formed a line of their own.</b></p><p><b>★ Fifth light: a chain of three actions</b></p><pre>ἀγνοοῦντες (not knowing God’s righteousness)\n  ↓ and because they did not know\nζητοῦντες στῆσαι (striving to set up their own)\n  ↓ and because they were busy setting up their own\nοὐχ ὑπετάγησαν (they did not submit to God’s)</pre><p><b>This is a painfully honest psychology:</b> people do not first decide “I will reject God’s righteousness.” They first <b>do not know</b>; then they are <b>busy building their own</b>; and then they simply <b>have no room</b> to submit.</p>","exp":"<p>10:2–3 is the most precise diagnosis of the religious person in the whole Bible. And it says something we are very reluctant to admit:</p><p><b>Zeal can run in the wrong direction. And the more zealous it is, the further it goes.</b></p><p>Paul himself is the best example: <b>the day he set out for Damascus with letters from the high priest was the most fervent day of his life. And he was persecuting the Son of God.</b></p>"},{"a":4,"z":4,"star":true,"grk":"<p>τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.</p>","lit":"<p>“For Christ is the <b>τέλος</b> of the law, for righteousness to <b>everyone who believes</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>end / goal</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>end / goal / completion</b></td><td><b>the central dispute of the verse</b> (see below)</td></tr></table>","gram":"<p><b>★ Three main ways of reading telos</b></p><p>The Greek word τέλος can bear several senses at once:</p><table><tr><th>Reading</th><th>Rendering</th><th>Claim</th></tr><tr><td><b>A. Termination</b></td><td>“the <b>end</b> of the law”</td><td>with Christ’s coming, the law as a road to righteousness is finished</td></tr><tr><td><b>B. Goal</b></td><td>“the <b>destination</b> of the law”</td><td>the law was always pointing to Christ; he is the terminus</td></tr><tr><td><b>C. Fulfilment</b></td><td>“the <b>completion</b> of the law”</td><td>Christ has fulfilled what the law required</td></tr></table><p>τέλος elsewhere in the New Testament:</p><p>· Matthew 24:6, “the <b>end</b> (τέλος) is not yet” — <b>termination</b><br>· 1 Timothy 1:5, “the <b>goal</b> (τέλος) of the commandment is love” — <b>goal</b><br>· James 5:11, “you have seen the <b>outcome</b> (τέλος) the Lord gave him” — <b>result</b><br>· Romans 6:21–22, “the <b>end</b> (τέλος) of those things is death… the <b>end</b> is eternal life” — <b>terminus</b></p><p><b>★ Which best fits this context?</b></p><p>I judge that <b>B + C (goal and fulfilment)</b> are primary, while <b>not excluding an aspect of A</b>. Reasons:</p><p><b>1. Context:</b> in 10:5–8 Paul immediately quotes Moses (Leviticus 18:5 and Deuteronomy 30:12–14) — he is not saying “Moses is obsolete,” but “what Moses was pointing to is this.”<br><b>2. 3:31:</b> “Do we then make the law void through faith? By no means! On the contrary, we <b>establish</b> the law.” Paul explicitly refuses the idea that the law has been abolished.<br><b>3. 8:4:</b> “that <b>the righteous requirement of the law</b> might be fulfilled in us…” — the law’s requirement is fulfilled, not cancelled.<br><b>4. The second half of 10:4:</b> “for righteousness to everyone who believes” — the emphasis is on <b>the source of righteousness</b>, not on the law being finished.</p><p><b>But the balancing point:</b> on the road of <b>seeking righteousness by keeping the law</b>, Christ really is <b>the end</b> — that road stops at him (3:20; 10:3).</p><p><b>Pulpit note:</b> you may say “τέλος can mean both ‘end’ and ‘goal’” — that is a hard fact. <b>Do not say “all scholars agree it means goal, not end.”</b></p><p><b>★ A picture that helps</b></p><p>The finishing line (τέλος) of a race is two things at once:</p><p><b>It is the end of the track (termination). It is also the purpose of the whole race (goal).</b></p><p><b>Christ is precisely that, in relation to the law.</b></p>","exp":"<p>10:4 answers the question of who that stone in 9:33 was.</p><pre>9:33   “I lay in Zion a stone of stumbling… and the one who believes in him\n        will not be put to shame.”\n  ↓\n10:4   “Christ is the τέλος of the law, for righteousness to everyone who believes.”</pre><p><b>That stone has a name.</b></p>"},{"a":5,"z":5,"star":false,"grk":"<p>Μωϋσῆς γὰρ γράφει τὴν δικαιοσύνην τὴν ἐκ [τοῦ] νόμου ὅτι ὁ ποιήσας αὐτὰ ἄνθρωπος ζήσεται ἐν αὐτοῖς.</p>","lit":"<p>“For Moses writes of the righteousness that is <b>of the law</b>: ‘<b>The man who does these things shall live by them.</b>’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>does</td><td>ποιήσας</td><td>poiēsas</td><td>G4160</td><td><b>the one who does / performs them</b> (aorist participle)</td></tr><tr><td>shall live</td><td>ζήσεται</td><td>zēsetai</td><td>G2198</td><td><b>shall live</b> (future)</td></tr></table>","gram":"<p>This quotes <b>Leviticus 18:5</b>:</p><p>“You shall therefore keep my statutes and my ordinances; which if a man does, he shall live by them.”</p><p>Paul is setting out two roads:</p><p>One is <b>“doing”</b> (Leviticus 18:5).<br>The other is <b>“believing”</b> (Deuteronomy 30:12–14, which he is about to quote).</p><p>(On how Paul understands Leviticus 18:5, scholars differ: some hold that he is saying “this road never worked in the first place,” others that he is describing the principle of the covenant of law. This edition does not develop the question here.)</p>","exp":"<p>10:5 is <b>the first road</b> Paul sets out. And he has deliberately used two Old Testament passages to make a contrast:</p><table><tr><th></th><th>Source</th><th>Key verb</th></tr><tr><td><b>the first road (10:5)</b></td><td>Leviticus 18:5</td><td><b>“do”</b> (ποιήσας)</td></tr><tr><td><b>the second road (10:6–8)</b></td><td>Deuteronomy 30:12–14</td><td><b>“say” and “believe”</b></td></tr></table><p><b>What the text plainly says:</b> the principle of the righteousness that is of the law is <b>“do it, and you will live.”</b></p><p><b>What may fairly be drawn from it:</b> Paul is not saying the law is bad (7:12, “the law is holy”). He is saying: <b>the condition of this road is “do all of it”</b> — and chapter 3 has already proved that no one can.</p><p><b>⚠ Pulpit note:</b> godly scholars differ on precisely how Paul understands Leviticus 18:5. Some hold that he is saying “this road never worked”; others that he is describing the principle of the covenant of law. From the pulpit it is best to note that both readings are held, and to put the weight on the next paragraph (10:6–8) — <b>the road that is “near you.”</b></p>"},{"a":6,"z":8,"star":true,"grk":"<p>8 ἀλλὰ τί λέγει; ἐγγύς σου τὸ ῥῆμά ἐστιν ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ' ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.</p>","lit":"<p>8 “But what does it say? ‘<b>The word is near you</b>, in your mouth and in your heart’ — that is, <b>the word of faith which we preach</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>near you</td><td>ἐγγύς σου</td><td>engys sou</td><td>G1451</td><td><b>close to you, right beside you</b></td></tr><tr><td>word</td><td>ῥῆμα</td><td>rhēma</td><td>G4487</td><td><b>a spoken word</b> (not λόγος)</td></tr><tr><td>the abyss</td><td>ἄβυσσος</td><td>abyssos</td><td>G12</td><td><b>the bottomless deep</b></td></tr></table>","gram":"<p><b>★
