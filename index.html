>「所以你是無可辯護的，人哪，每一個論斷的——因為在你論斷那另一位的事上，你把你自己定罪了；因為你這論斷的，正實行著同樣的事。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>所以</td><td>Διό</td><td>dio</td><td>G1352</td><td>διά + ὅς</td><td>因此、據此</td><td>直接承接1:18–32，尤其1:32</td></tr><tr><td>無可推諉</td><td>ἀναπολόγητος</td><td>anapologētos</td><td>G379</td><td>ἀ-（否定）+ ἀπολογία（辯詞）</td><td>沒有辯護詞</td><td>法庭用語：被告站起來，一句話說不出</td></tr><tr><td>論斷</td><td>κρίνων</td><td>krinōn</td><td>G2919</td><td>κρίνω</td><td>分辨、審判、定案</td><td>不只是「有意見」，是<b>坐上審判席宣判</b></td></tr><tr><td>定罪</td><td>κατακρίνεις</td><td>katakrineis</td><td>G2632</td><td>κατά（下）+ κρίνω</td><td>判下去、定死罪</td><td>加了κατά，語氣比κρίνω重得多</td></tr><tr><td>所行</td><td>πράσσεις</td><td>prasseis</td><td>G4238</td><td>πράσσω</td><td>反覆地實行</td><td>現在式，指<b>持續的習慣</b>，非偶一為之</td></tr></table>","gram":"<p>- <b>ἀναπολόγητος εἶ</b>：形容詞放句首＝<b>強調位置</b>。「無—可—辯—護，是你！」<br>- <b>ὦ ἄνθρωπε πᾶς ὁ κρίνων</b>：呼格＋「每一個」——論辯體的典型招數。保羅不指名道姓，但每個讀的人都覺得被點到。<br>- <b>κατακρίνεις</b>：現在式主動直說語氣，第二人稱單數。<b>不是「你將會被定罪」，而是「你此刻正在定你自己的罪」</b>——這個定罪不是未來式，是現在進行式。<br>- <b>πράσσεις</b>：πράσσω（習慣性地做）而非 ποιέω（做一件事）。保羅選字精準：<b>你不是偶爾失手，你是慣犯。</b></p><p>這個文法對理解本節有什麼影響？<br>若是未來式，論斷者還有補救的時間差；但保羅用現在式：<b>當你舉起手指指向別人的那一刻，判決書上已經簽了你自己的名字。</b></p>","exp":"<p>「所以」（Διό）承接的是1:32。剛剛讀完那份可怕的罪惡清單，讀者心裡浮起一句：「阿們，該罰！」</p><p>保羅立刻轉身：<b>「你剛才那句『阿們』，就是你的判決書。」</b></p><p>為什麼？因為<b>論斷的能力，證明你有道德知識；而你有道德知識卻仍然去做，你的罪就比無知的人更重。</b> 你舉起的那把尺，量完別人之後，會自動轉過來量你自己。</p><p><b>注意保羅沒有說「不可分辨是非」。</b> κρίνω 在此的意思是<b>篡奪審判者的位置</b>——那種帶著優越感、把自己排除在同一標準之外的定罪。聖經從未叫我們是非不分（林前5:12「教內的人豈不是你們審判的嗎」），而是禁止我們<b>坐上只屬於神的寶座</b>。</p><p><b>經文本身明確表達的：</b> 論斷別人的人，因自己行同樣的事而自我定罪，在神面前無可推諉。<br><b>可以合理推論的生命應用：</b> 人之所以那麼容易論斷，往往因為心裡有一個沒有被對付的自己——我們最會挑剔的，常常正是我們自己身上最不敢面對的。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.</p>","lit":"<p>「但我們知道，神的審判是照著真理，臨到那些習慣行這樣事的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>審判</td><td>κρίμα</td><td>krima</td><td>G2917</td><td>審判的<b>判決結果</b>（非審判的過程 κρίσις）</td></tr><tr><td>照真理</td><td>κατὰ ἀλήθειαν</td><td>kata alētheian</td><td>G225</td><td>依照事實、依照實情，不受表象影響</td></tr></table>","gram":"<p>- <b>οἴδαμεν</b>：完成式形態、現在式意義，「我們（早就）知道」——保羅預設對方同意這一點，先取得共識，再用這共識反過來對付對方。這是論辯體的典型策略。<br>- <b>κατὰ ἀλήθειαν</b> 置於 ἐστιν 之後、對象之前，<b>強調「照真理」</b>。</p>","exp":"<p>「照真理」是本節的重心。人的審判照表象、照關係、照印象；<b>神的審判照著「實情本身」（reality as it is）。</b></p><p>祂看的不是你在教會怎麼坐、怎麼禱告、怎麼說話，而是<b>事情的真相</b>。這是全章的第一個地基：<b>在神面前，沒有形象管理這回事。</b></p>"},{"a":3,"z":3,"star":false,"grk":"<p>λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;</p>","lit":"<p>「人哪，你這論斷行這樣事的人，自己卻做著同樣的事——難道你竟這樣盤算：『我要逃出神的審判』嗎？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>以為</td><td>λογίζῃ</td><td>logizē</td><td>G3049</td><td><b>算帳、記帳、計算</b>——商業用語</td></tr><tr><td>逃脫</td><td>ἐκφεύξῃ</td><td>ekpheuxē</td><td>G1628</td><td>ἐκ（出）+ φεύγω（逃）：從已經合攏的網中逃出去</td></tr></table>","gram":"<p>- <b>λογίζομαι</b> 是羅馬書的關鍵動詞（4章出現11次，「算為義」）。<b>保羅在這裡先用它的負面用法：人自己在心裡「算了一筆帳」，算來算去，覺得自己過得去。</b><br>- <b>σὺ</b> 人稱代名詞單獨出現（動詞已含人稱），是<b>強調用法</b>：「<b>你？</b> 你要逃脫？」<br>- 疑問句期待的答案是「不可能」。</p>","exp":"<p>保羅點出一個極深的心理：<b>自義的人，心裡都在偷偷算一筆帳。</b></p><p>- 「我雖然有這個毛病，可是我比他好多了。」<br>- 「我至少沒有做到那個地步。」<br>- 「我還在服事，還在奉獻，還在讀經。」</p><p>這是一本<b>用別人當基準的帳本</b>。保羅說：那本帳，神不收。</p><p>中文的「以為」偏弱。原文 λογίζῃ 帶著算計、精算的意味——保羅指出的不是無心的誤會，而是一種刻意的自我說服。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;</p>","lit":"<p>「還是說，你藐視祂那豐富的恩慈、與那容忍、與那長久的忍耐，竟不知道神的恩慈是<b>正在領著你</b>進入悔改？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根／構詞</th><th>基本字義</th><th>本節語境</th></tr><tr><td>豐富</td><td>πλοῦτος</td><td>ploutos</td><td>G4149</td><td>—</td><td>財富、豐盛</td><td>神的恩慈不是勉強擠出來的，是<b>滿溢的財富</b></td></tr><tr><td>恩慈</td><td>χρηστότης</td><td>chrēstotēs</td><td>G5544</td><td>χρηστός（有用的、良善的）</td><td>使人得益的良善</td><td>保羅愛用字，加5:22聖靈果子之一</td></tr><tr><td>寬容</td><td>ἀνοχή</td><td>anochē</td><td>G463</td><td>ἀνά + ἔχω（持住）</td><td><b>暫時按住不發</b>、休戰狀態</td><td>3:26同字：神「寬容」先時所犯的罪</td></tr><tr><td>忍耐</td><td>μακροθυμία</td><td>makrothymia</td><td>G3115</td><td>μακρός（長）+ θυμός（怒氣）</td><td><b>怒氣的引線很長</b></td><td>LXX 用以譯出34:6「不輕易發怒」（אֶרֶךְ אַפַּיִם）</td></tr><tr><td>藐視</td><td>καταφρονεῖς</td><td>kataphroneis</td><td>G2706</td><td>κατά（向下）+ φρονέω（思想）</td><td><b>往下看、看不起</b></td><td>現在式：你正持續地看輕它</td></tr><tr><td>不曉得</td><td>ἀγνοῶν</td><td>agnoōn</td><td>G50</td><td>ἀ + γινώσκω</td><td>不知道、視而不見</td><td><b>現在主動分詞</b>，表伴隨狀態</td></tr><tr><td>領</td><td>ἄγει</td><td>agei</td><td>G71</td><td>ἄγω</td><td>帶領、牽引</td><td><b>現在式：正在領著、持續在領著</b></td></tr><tr><td>悔改</td><td>μετάνοια</td><td>metanoia</td><td>G3341</td><td>μετά（改變）+ νοῦς（心思）</td><td><b>心思的徹底轉向</b></td><td>不只是後悔，是觀念與方向的翻轉</td></tr></table>","gram":"<p>① μακροθυμία 的舊約根源</p><p>七十士譯本用 μακρόθυμος 翻譯希伯來文 <b>אֶרֶךְ אַפַּיִם</b>（erek appayim，「長鼻子」＝怒氣來得慢）。出34:6神向摩西宣告自己的名：</p><p>「耶和華，耶和華，是有憐憫有恩典的神，<b>不輕易發怒</b>，並有豐盛的慈愛和誠實。」</p><p>保羅在這裡，是把出埃及記34章的那位神，放在論斷者面前。</p><p>② εἰς μετάνοιάν σε ἄγει 的語序</p><p>原文語序是：「εἰς μετάνοιάν（進入悔改）→ σε（你）→ ἄγει（領）」。<br>「進入悔改」被提到最前面＝強調目的地。<b> 神的恩慈不是漫無目的的縱容，它有一個明確的方向：</b>悔改。</p><p>③ ἄγει 現在式的重量</p><p>不是「曾經領過你」，也不是「將要領你」，而是「<b>此時此刻，正在領著你</b>」。</p><p>這個文法對理解本節有什麼影響？<br><b>每一天你還活著、還沒被審判、還能呼吸、還能讀這段經文——這不是神忘了你，這是神正在牽著你的手，把你往悔改的方向帶。</b> 若你把神的忍耐讀成神的默許，你就把救生索當成了通行證。</p><p>④ ἀγνοῶν 現在分詞</p><p>「不曉得」與「藐視」同時發生。<b>藐視恩典的人，通常不是故意作對，而是誤讀。</b> 他把神的沉默讀成「沒事」，把神的忍耐讀成「神不介意」。</p>","exp":"<p>這一節是全章的轉軸。前三節是起訴，這一節突然轉為<b>邀請</b>。</p><p>保羅指出人對神的忍耐有兩種讀法：</p><p>- <b>誤讀</b>：「我到現在都沒事，可見我沒問題。」→ 藐視<br>- <b>正讀</b>：「我到現在都沒事，是因為神在等我回頭。」→ 悔改</p><p><b>「藐視」（καταφρονέω）的字面意思是「往下看」。</b> 何等諷刺：一個站在恩典裡的人，竟然低頭看不起那托住他的恩典。</p><p>「恩慈是領你悔改」是整本聖經最重要的救恩心理學之一：<br>悔改不是被恐嚇出來的，是被恩慈<b>牽</b>出來的。<br>律法能定罪，但律法從來沒有能力使人愛神。<br>只有恩慈能。</p><p><b>經文本身明確表達的：</b> 神的恩慈、寬容、忍耐有一個目的——領人悔改；藐視它就是加增自己的罪。<br><b>合理推論的生命應用：</b> 若你今天還沒有被神管教、還沒有付上代價，這不是通行證，是<b>寬限期</b>。</p>"},{"a":5,"z":5,"star":false,"grk":"<p>κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ.</p>","lit":"<p>「但按著你的剛硬和不悔改的心，你正在為你自己<b>積存</b>忿怒，在忿怒與神公義審判<b>顯露</b>的日子。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>剛硬</td><td>σκληρότης</td><td>sklērotēs</td><td>G4643</td><td>硬化、乾硬；LXX 同字根描述法老「硬著心」</td></tr><tr><td>不悔改</td><td>ἀμετανόητος</td><td>ametanoētos</td><td>G279</td><td>ἀ + μετανοέω：<b>新約僅此一次出現</b></td></tr><tr><td>積蓄</td><td>θησαυρίζεις</td><td>thēsaurizeis</td><td>G2343</td><td>θησαυρός（寶庫）：<b>存進倉庫、一點一滴累積</b></td></tr><tr><td>顯</td><td>ἀποκάλυψις</td><td>apokalypsis</td><td>G602</td><td>揭開蓋子、啟示</td></tr><tr><td>公義審判</td><td>δικαιοκρισία</td><td>dikaiokrisia</td><td>G1341</td><td>δίκαιος + κρίσις 複合字，<b>新約僅此一次</b></td></tr></table>","gram":"<p>① θησαυρίζεις 的驚人反諷</p><p>θησαυρίζω 正是主耶穌說「積儹財寶在天上」（太6:20）用的字。</p><p>保羅說：你確實在積寶庫，只是你積的不是財寶，是忿怒。<br>而且是 <b>σεαυτῷ</b>（為你自己）——這個間接受格反身代名詞是刀鋒所在：<b>沒有人強迫你，是你自己一天一天存進去的。</b></p><p>② σκληρότης 的舊約回聲</p><p>出埃及記法老「硬著心」（LXX σκληρύνω）。<b>保羅暗示：一個宗教人若不悔改，他心的光景與法老一樣。</b></p><p>③ 兩個 ἀ- 否定前綴的並列</p><p>- 2:1 ἀναπολόγητος（無可辯護）<br>- 2:5 ἀμετανόητος（不悔改）</p><p>無可辯護，是因為不肯悔改。</p>","exp":"<p>第4節與第5節形成全章最強烈的對比：</p><table><tr><th>第4節</th><th>第5節</th></tr><tr><td>神的<b>豐富</b>（πλοῦτος）</td><td>你的<b>積蓄</b>（θησαυρίζεις）</td></tr><tr><td>神的恩慈<b>領你</b>（ἄγει）</td><td>你的心<b>剛硬</b>（σκληρότης）</td></tr><tr><td>目的地：<b>悔改</b></td><td>目的地：<b>忿怒的日子</b></td></tr></table><p>兩個帳戶，兩個方向，每一天都在入帳。<br>神那邊，每天存入恩慈；你這邊，若不悔改，每天存入忿怒。</p><p>「顯」（ἀποκάλυψις）與1:17–18呼應：</p><p>- 1:17 神的義<b>顯明</b>出來<br>- 1:18 神的忿怒<b>顯明</b>出來<br>- 2:5 神公義審判的<b>顯露</b></p><p>福音現在顯明神的義；審判之日將顯露神公義的判決。<b>你活在這兩次「顯明」之間，這段時間叫做「恩典的時候」。</b></p><p>【第二段｜2:6–11　神照各人行為審判，不偏待人】</p>"},{"a":6,"z":6,"star":false,"grk":"<p>ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·</p>","lit":"<p>「祂將要償還給每一個人，按照他的行為。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>報應</td><td>ἀποδώσει</td><td>apodōsei</td><td>G591</td><td>ἀπό + δίδωμι：<b>償還、付清</b>（商業用語，付工資、還債）</td></tr><tr><td>各人</td><td>ἑκάστῳ</td><td>hekastō</td><td>G1538</td><td>每一個個別的人</td></tr></table>","gram":"<p>這是<b>直接引用舊約</b>：</p><p>- 詩篇62:12（LXX 61:13）「你照著各人所行的報應他」<br>- 箴言24:12「他豈不按各人所行的報應各人嗎？」</p><p><b>ἑκάστῳ（每一個人）</b> 是重點：不是「按民族」報應，是<b>按個人</b>。這一擊直接打穿「我是亞伯拉罕子孫所以安全」的集體保險概念。</p>","exp":"<p>有人在這裡卡住：<b>保羅不是說因信稱義嗎？怎麼又說照行為報應？</b></p><p>要注意保羅在此<b>不是在講如何得救的方法，而是在講審判的標準</b>。這個標準對每個人都一樣，而正是這個標準，使3:20的結論成立：「凡有血氣的，沒有一個因行律法能在神面前稱義。」</p><p>換句話說：<b>神照行為審判——這正是我們必須因信稱義的原因，而不是相反。</b></p><p>（完整討論見第二十部分「容易誤解的經文」）</p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 τοῖς μὲν καθ' ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·<br>8 τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσιν τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ὀργὴ καὶ θυμός.</p>","lit":"<p>「一方面，給那些照著<b>在善工上的堅忍</b>、尋求榮耀、尊貴、與不朽壞的人——永生。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>恆心</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td>ὑπό（在下）+ μένω（存留）：<b>在重壓底下站住不跑</b></td></tr><tr><td>結黨</td><td>ἐριθεία</td><td>eritheia</td><td>G2052</td><td>原指「受雇做工」→ 為私利拉幫結派、<b>自我尋求</b></td></tr><tr><td>不順從</td><td>ἀπειθοῦσιν</td><td>apeithousin</td><td>G544</td><td>ἀ + πείθω：<b>拒絕被說服</b>（不是不知道，是不肯）</td></tr><tr><td>不能朽壞</td><td>ἀφθαρσία</td><td>aphtharsia</td><td>G861</td><td>不朽壞（林前15復活身體用同字）</td></tr></table>","gram":"<p><b>① μέν … δέ 的對句</b>（7節 τοῖς μέν／8節 τοῖς δέ）——標準希臘文對比結構。</p><p>② 交叉結構（chiasm）</p><pre>A  v.7   善 → 永生\n  B v.8  惡 → 忿怒惱恨\n  B′v.9  惡 → 患難困苦（猶太人先）\nA′ v.10  善 → 榮耀尊貴平安（猶太人先）</pre><p>保羅刻意讓「惡」在中間、「善」在兩端，然後在9、10節都加上「先是猶太人，後是希臘人」——這句在9節（審判）出現，就把1:16（拯救）的次序<b>同樣</b>應用到審判上。<b>特權越大，責任越大。</b></p><p>③ ἀπειθοῦσιν τῇ ἀληθείᾳ ／ πειθομένοις τῇ ἀδικίᾳ 的雙關</p><p>同一個字根 πείθω：</p><p>- <b>不</b>被真理說服<br>- <b>卻</b>被不義說服</p><p><b>這不是無知的問題，是「你願意被誰說服」的問題。</b> 中文譯本「不順從真理，反順從不義」已譯得不錯，但看不出這是同一個字的正反用法。</p>","exp":"<p>「恆心行善」的原文重點在 <b>ὑπομονή</b>——不是「做了很多好事」，而是「<b>在壓力下持續不放棄</b>」。這與8節的 ἐριθεία（結黨自私）正好相反：一個是持續尋求神的榮耀，一個是持續尋求自己的利益。</p><p><b>注意7節說這些人「尋求（ζητοῦσιν）榮耀、尊貴、不能朽壞」。</b> 他們不是尋求道德分數，是<b>尋求神自己所賜的榮耀</b>。這正是1:21–23的反面：那裡的人「不當作神榮耀祂」，這裡的人「尋求榮耀」。</p><p><b>經文本身明確表達的：</b> 神的審判照個人的行為，一視同仁；受托越多的人被審得越嚴。<br><b>合理推論的生命應用：</b> 「恆心」提醒我們，屬靈生命的真實性不在起跑的熱情，而在壓力下的堅持。</p>"},{"a":11,"z":11,"star":true,"grk":"<p>οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.</p>","lit":"<p>「因為在神那裡，沒有『接受面孔』這回事。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>偏待人</td><td>προσωπολημψία</td><td>prosōpolēmpsia</td><td>G4382</td><td>πρόσωπον（臉）+ λαμβάνω（接受、拿起）</td></tr></table><p><b>這是一個「希伯來式希臘文」複合字</b>，直接從希伯來成語 <b>נָשָׂא פָנִים</b>（nasa panim，「舉起臉／看臉」）造出來。</p><p>舊約背景：</p><p>- 申命記10:17「他不以貌取人，也不受賄賂」<br>- 利未記19:15「不可偏護窮人，也不可重看有勢力的人」<br>- 歷代志下19:7「在耶和華我們神那裡，沒有不義，不偏待人」</p><p>古代法庭上，權貴進來，法官會「抬起他的臉」（接見、給面子）。<b>神的法庭裡沒有這回事。</b></p>","gram":"<p>- 名詞置於句中重心位置，前加否定 οὐ——<b>斷然否定</b>。<br>- <b>παρὰ τῷ θεῷ</b>（在神那裡）——與格，指<b>在神的審判席前</b>。</p>","exp":"<p>這一節是2:1–10的總結，也是全章的樞紐。</p><p>神的「不偏待人」有兩面刀鋒：</p><p>1. <b>對猶太人</b>：你的身分不能給你豁免權<br>2. <b>對外邦人</b>：你的出身不能剝奪你的機會</p><p>這一節同時審判了驕傲，也開啟了福音的門。</p><p>- 若神偏待人，就沒有外邦人的福音；<br>- 若神偏待人，恩典就成了特權。</p><p>正因為神不偏待人，恩典才能給所有人。</p><p>【第三段｜2:12–16　律法、良心與隱祕事的審判】</p>"},{"a":12,"z":12,"star":false,"grk":"<p>ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται.</p>","lit":"<p>「因為凡在律法之外犯了罪的，也將在律法之外滅亡；凡在律法之內犯了罪的，將藉著律法受審判。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>沒有律法</td><td>ἀνόμως</td><td>anomōs</td><td>G460</td><td>副詞：<b>在律法之外地</b>（不是「無法無天」）</td></tr><tr><td>犯了罪</td><td>ἥμαρτον</td><td>hēmarton</td><td>G264</td><td>ἁμαρτάνω，<b>不定過去式</b>：射不中靶</td></tr><tr><td>滅亡</td><td>ἀπολοῦνται</td><td>apolountai</td><td>G622</td><td>中間語態未來式：滅亡、失喪</td></tr></table>","gram":"<p>① ἥμαρτον 兩次都是不定過去式（aorist）<br>不定過去式在此表<b>總括性的觀點</b>——把一生的罪當成一個整體來看。</p><p>② ἀνόμως 出現兩次，是重點<br>「<b>在律法之外</b>犯罪的，也<b>在律法之外</b>滅亡」——外邦人不會因為沒有摩西律法而被摩西律法審判，但這不表示他們沒事；<b>他們照他們所有的光受審判。</b></p><p>③ 修辭的平衡（parallelism）</p><pre>ἀνόμως  ἥμαρτον  →  ἀνόμως  ἀπολοῦνται\nἐν νόμῳ ἥμαρτον  →  διὰ νόμου κριθήσονται</pre><p>完美對稱：審判的方式，與所領受的啟示相稱。</p>","exp":"<p>這是神公義最深的一面：<b>神照著各人所領受的光審判各人。</b></p><p>沒有人會因為「我沒聽過」而被冤枉，也沒有人會因為「我沒聽過」而自動得救——因為<b>沒有一個人是完全沒有光的</b>（1:19–20；2:14–15）。</p>"},{"a":13,"z":13,"star":false,"grk":"<p>οὐ γὰρ οἱ ἀκροαταὶ νόμου δίκαιοι παρὰ [τῷ] θεῷ, ἀλλ' οἱ ποιηταὶ νόμου δικαιωθήσονται.</p>","lit":"<p>「因為律法的<b>聽眾</b>在神面前不是義的，乃是律法的<b>實行者</b>將被稱義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>聽的人</td><td>ἀκροαταί</td><td>akroatai</td><td>G202</td><td>ἀκροάομαι（聽）：<b>劇場裡的聽眾、觀眾</b></td></tr><tr><td>行的人</td><td>ποιηταί</td><td>poiētai</td><td>G4163</td><td>ποιέω：<b>製作者、實行者</b>（英文 poet 源出此字）</td></tr><tr><td>稱義</td><td>δικαιωθήσονται</td><td>dikaiōthēsontai</td><td>G1344</td><td><b>未來被動式</b>：將被宣告為義</td></tr></table>","gram":"<p>① ἀκροατής 的畫面感<br>這個字在希臘世界指<b>在講堂或劇場裡聽演講的人</b>——坐著、欣賞、鼓掌、離開。<br>保羅說：你若只是神話語的「觀眾」，你就不是義人。<br>（雅1:22–25用同一組字：「只是聽道 ἀκροατής，不是行道 ποιητής，就是自己欺哄自己。」）</p><p>② δικαιωθήσονται 未來被動式</p><p>- <b>未來式</b>：指向末日的宣判<br>- <b>被動式（神聖被動）</b>：<b>是神來稱義，不是人稱自己為義</b></p>","exp":"<p>保羅在這裡把猶太人最引以為傲的事（每安息日在會堂聽律法）打回原形。</p><p>「聽」在猶太傳統裡是至高的靈性活動<b>——「以色列啊，你要</b>聽<b>！」（שְׁמַע，Shema，申6:4）。但希伯來文的「שָׁמַע 聽」本身就包含「順從」。</b>猶太人把「聽」希臘化成了「知道」，保羅把它拉回希伯來的原意：聽，就是行。</p>"},{"a":14,"z":15,"star":false,"grk":"<p>14 ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·<br>15 οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων</p>","lit":"<p>14「因為每當外邦人——那些沒有律法的——本性上實行律法的事，這些人雖然沒有律法，對他們自己就是律法。」<br>15「他們顯出律法的工作是被寫在他們心裡的，他們的良心一同作見證，並且他們的思念在彼此之間互相控告，或者也互相辯護。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>本性</td><td>φύσει</td><td>physei</td><td>G5449</td><td>與格：<b>照本性地、天生地</b></td></tr><tr><td>是非之心</td><td>συνείδησις</td><td>syneidēsis</td><td>G4893</td><td>σύν（一同）+ οἶδα（知道）：<b>與自己一同知道</b></td></tr><tr><td>同作見證</td><td>συμμαρτυρούσης</td><td>symmartyrousēs</td><td>G4828</td><td>σύν + μαρτυρέω：<b>一起作證</b></td></tr><tr><td>思念</td><td>λογισμῶν</td><td>logismōn</td><td>G3053</td><td>推理、盤算（與2:3 λογίζῃ 同字根）</td></tr><tr><td>控告</td><td>κατηγορούντων</td><td>katēgorountōn</td><td>G2723</td><td>法庭用語：<b>檢察官起訴</b></td></tr><tr><td>辯護</td><td>ἀπολογουμένων</td><td>apologoumenōn</td><td>G626</td><td>法庭用語：<b>辯護律師答辯</b>（與2:1「無可推諉」同字根）</td></tr></table>","gram":"<p>① 獨立所有格（genitive absolute）構成完整的法庭場景</p><p>三個所有格分詞：</p><p>- <b>證人</b>：良心（συνείδησις）<br>- <b>檢察官</b>：思念（κατηγορέω）<br>- <b>辯護律師</b>：思念（ἀπολογέομαι）</p><p>保羅畫的圖是：每一個人的心裡都有一個小法庭，日夜開庭。</p><p>② φύσει 的位置<br>希臘文 φύσει 可修飾前面（「本性上沒有律法的外邦人」）或後面（「本性上行律法的事」）。多數譯本與註釋取後者，和合本亦然。</p><p>③ τὸ ἔργον τοῦ νόμου（律法的工作）是單數<br>不是「律法的眾條例」（複數 ἔργα），而是「律法的功能／效果」——即律法所要達成的道德要求的作用。</p><p>④ γραπτὸν ἐν ταῖς καρδίαις（寫在心裡）與耶31:33的關係</p><p>耶31:33新約應許：「我要將我的律法放在他們裡面，寫在他們心上。」</p><p><b>但注意用字差異：</b> 保羅在2:15說的是「律法的<b>工作</b>（ἔργον）寫在心裡」，而非耶31:33「律法本身寫在心裡」。這個細微差別很重要——<b>2:15講的是普遍的良心，不是新約的重生。</b>（到2:29保羅才轉到聖靈的工作。）</p>","exp":"<p>保羅在此建立一個重要真理：<b>神從未把任何人放在完全的黑暗裡。</b></p><p>外邦人沒有西奈山的石版，卻有心版上的一份摹本——<b>良心</b>。良心不是完美的（可以被燒紅、可以被扭曲，提前4:2），但它足以證明兩件事：</p><p>1. 人知道有是非<br>2. 人知道自己達不到</p><p>這就是為什麼沒有人能說「我不知道」。</p><p>關於2:14–16這些外邦人是誰，敬虔學者間有合理的不同解釋，見第二十部分。</p>"},{"a":16,"z":16,"star":false,"grk":"<p>ἐν ἡμέρᾳ ὅτε κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ Χριστοῦ Ἰησοῦ.</p>","lit":"<p>「在那日，當神照著我的福音，藉著基督耶穌審判人的<b>隱祕事</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>隱祕事</td><td>τὰ κρυπτά</td><td>ta krypta</td><td>G2927</td><td>κρύπτω（隱藏）：<b>被藏起來的東西</b>（英文 crypt, cryptic）</td></tr><tr><td>藉著</td><td>διά + 所有格</td><td>dia</td><td>G1223</td><td>藉由…作為中保／執行者</td></tr></table>","gram":"<p>- <b>κρίνει</b>：形式上可讀為現在式或未來式；上下文指向<b>末日</b>。<br>- <b>διὰ Χριστοῦ Ἰησοῦ</b> 置於句末＝<b>強調位置</b>。全章的審判論證，落在<b>耶穌基督</b>身上。</p>","exp":"<p>保羅在這裡放了三顆重磅：</p><p>① 審判的對象是「隱祕事」（τὰ κρυπτά）<br>不是你的公開紀錄，是你的<b>祕密檔案</b>。與2:28–29「裡面／隱藏的（ἐν τῷ κρυπτῷ）」用同一個字——<b>神所審判的隱祕，與神所看重的隱祕，是同一個地方：心。</b></p><p>② 審判者是耶穌基督<br>約5:22「父不審判什麼人，乃將審判的事全交與子。」<br>那位為罪人死的，就是那位要審判罪人的。這是最大的恩典，也是最大的嚴肅。</p><p>③「照著我的福音」<br>保羅說：審判是<b>福音的一部分</b>。<br>福音不只是「神愛你」，福音是：「有一日基督要審判一切隱祕事——而祂已經在十字架上，為一切投靠祂的人，把那審判擔當了。」</p><p>沒有審判的福音，是廉價的安慰；沒有恩典的審判，是絕望的宣告。保羅兩樣都要。</p><p>【第四段｜2:17–24　以律法誇口的人玷污神的名】</p>"},{"a":17,"z":20,"star":false,"grk":"<p>17 Εἰ δὲ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ νόμῳ καὶ καυχᾶσαι ἐν θεῷ</p>","lit":"<p>「但你若被冠上『猶太人』之名，又<b>枕靠</b>在律法上，又在神裡面誇口……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>稱為</td><td>ἐπονομάζῃ</td><td>eponomazē</td><td>G2028</td><td>被動：<b>被加上名號</b>（不是自己活出來的，是被貼上的）</td></tr><tr><td>倚靠</td><td>ἐπαναπαύῃ</td><td>epanapauē</td><td>G1879</td><td>ἐπί + ἀνά + παύω：<b>靠上去休息、枕著睡覺</b></td></tr><tr><td>誇口</td><td>καυχᾶσαι</td><td>kauchasai</td><td>G2744</td><td>誇耀（羅馬書關鍵字：3:27、5:2–3、15:17）</td></tr><tr><td>模範</td><td>μόρφωσις</td><td>morphōsis</td><td>G3446</td><td><b>外形、輪廓</b>（提後3:5「有敬虔的外貌」同字）</td></tr></table>","gram":"<p>① 這是一個未完成的條件句（anacoluthon）</p><p>第17節開始「Εἰ δὲ σύ…（你若……）」，但這個「若」的<b>主句一直到第21節才出現</b>：「你既是教導別人，還不教導自己嗎？」</p><p>中間17–20節堆疊了<b>九個誇耀項目</b>：</p><pre>1 稱為猶太人      2 倚靠律法      3 指著神誇口\n4 受了教訓        5 曉得神旨意    6 能分別是非\n7 給瞎子領路      8 黑暗中人的光\n9 蠢笨人的師傅、小孩子的先生</pre><p>保羅刻意讓這個名單越堆越高、越堆越輝煌——然後在第21節一刀劈下。<br>這是講道學上極高明的修辭：<b>先讓對方站上高台，再抽走梯子。</b></p><p>② ἐπαναπαύῃ（枕靠）的畫面</p><p>LXX 用此字描述以利沙的靈「住在」以利亞身上（王下2:15），也用於安息。<br><b>「枕靠在律法上」——律法本是要人行的，他卻拿來當枕頭睡覺。</b> 這是何等精準又何等諷刺的動詞。</p><p>③ μόρφωσις 的伏筆</p><p>「模範」本身在此是中性甚至正面的，但保羅選用 μόρφωσις（外形）而非 μορφή（本質形態），已埋下伏筆：<b>你所擁有的，可能只是輪廓，不是實質。</b></p>","exp":"<p>保羅列出的九項，<b>每一項都是真的</b>。猶太人確實有律法，確實蒙神揀選，確實得了神的聖言（3:2）。</p><p>問題不在他們擁有的，而在他們如何擁有。</p><p>- 律法本是要走的路，他們拿來當<b>枕頭</b>（ἐπαναπαύῃ）<br>- 律法本是照亮自己的光，他們拿來<b>照別人</b>（給瞎子領路）<br>- 神的恩典本該叫人感恩，他們拿來<b>誇口</b>（καυχᾶσαι）</p><p>這是宗教人最典型的墮落方式：把神給的禮物，變成自己的資本。</p>"},{"a":21,"z":23,"star":false,"grk":"<p>21 ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;<br>22 ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;<br>23 ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις</p>","lit":"<p>21「那麼，你這<b>教導別人的</b>，不教導自己嗎？你這<b>宣講不可偷竊的</b>，自己偷竊嗎？」<br>22「你這說不可姦淫的，自己姦淫嗎？你這<b>厭惡偶像的</b>，自己<b>盜取廟中之物</b>嗎？」<br>23「你這<b>在律法上誇口的</b>，卻<b>藉著違犯律法，羞辱了神</b>。」;</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>講說</td><td>κηρύσσων</td><td>kēryssōn</td><td>G2784</td><td><b>傳講、宣告</b>（傳道人用字）</td></tr><tr><td>厭惡</td><td>βδελυσσόμενος</td><td>bdelyssomenos</td><td>G948</td><td>極度憎惡、作嘔（LXX用於偶像「可憎之物」）</td></tr><tr><td>偷竊廟中之物</td><td>ἱεροσυλεῖς</td><td>hierosyleis</td><td>G2416</td><td>ἱερός（聖）+ συλάω（劫掠）：<b>盜取廟宇財物</b></td></tr><tr><td>犯</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω：<b>跨越界線</b>（明知有線而踏過去）</td></tr><tr><td>玷辱</td><td>ἀτιμάζεις</td><td>atimazeis</td><td>G818</td><td>ἀ + τιμή（尊貴）：<b>使…失去尊榮</b></td></tr></table>","gram":"<p>① 四個分詞 ＋ 四個直說語氣動詞的對打</p><pre>ὁ διδάσκων（那教導的）      →  οὐ διδάσκεις;（你不教自己嗎）\nὁ κηρύσσων（那傳講的）      →  κλέπτεις;（你偷竊嗎）\nὁ λέγων（那說的）           →  μοιχεύεις;（你姦淫嗎）\nὁ βδελυσσόμενος（那厭惡的） →  ἱεροσυλεῖς;（你劫廟嗎）</pre><p>每一句都是：你說的 vs 你做的。四記重拳，節奏一致，越打越快。</p><p>② ἱεροσυλεῖς 的歷史背景</p><p>申7:25禁止猶太人取用偶像上的金銀。徒19:37特別提到保羅的同工「並沒有偷竊廟中之物（ἱεροσύλους）」——顯示這是當時羅馬世界對猶太人的常見指控。</p><p>保羅的諷刺極深：<b> 你在口頭上作嘔地憎惡偶像，卻在偶像廟裡拿好處。</b>你恨的是偶像，還是恨自己拿不到那些好處？</p>","exp":"<p>注意保羅特別點名「教導別人的人」（διδάσκων）與「傳講的人」（κηρύσσων）。</p><p>這一段最刺人的地方在於：<b>它不是給一般會眾的，是給傳道人、教師、屬靈領袖的。</b></p><p>- 你講「不可偷竊」——你有沒有偷神的時間、偷別人的功勞、偷本該歸給神的榮耀？<br>- 你講「不可姦淫」——你的眼目、你的手機、你獨處的時候呢？<br>- 你「厭惡偶像」——你的偶像是不是叫做「事工成果」「別人的稱讚」「我的影響力」？</p><p><b>「玷辱神」（ἀτιμάζεις）與2:7、2:10 的「尊貴」（τιμή）是同一字根。</b> 神要賜下<b>尊貴</b>，人卻<b>使神失去尊貴</b>。這就是罪最核心的定義。</p>"},{"a":24,"z":24,"star":false,"grk":"<p>τὸ γὰρ ὄνομα τοῦ θεοῦ δι' ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.</p>","lit":"<p>「因為神的名，<b>因著你們的緣故</b>，正在外邦人中被褻瀆——正如經上所記的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>褻瀆</td><td>βλασφημεῖται</td><td>blasphēmeitai</td><td>G987</td><td><b>現在被動式</b>：正在被褻瀆（持續進行）</td></tr><tr><td>因你們</td><td>δι' ὑμᾶς</td><td>di' hymas</td><td>G1223</td><td>διά + 直接受格：<b>因為你們的緣故</b></td></tr></table>","gram":"","exp":"<p>主耶穌教我們禱告的第一句是：</p><p><b>「願人都尊你的名為聖。」</b>（太6:9）</p><p>羅馬書2:24是這句禱告的完全相反：</p><p>「神的名……因你們受了褻瀆。」</p><p>一個宗教人可以：</p><p>- 每天禱告「願人都尊你的名為聖」<br>- 同時用他的生命，讓神的名被褻瀆</p><p>這就是為什麼「建立屬神的體系」不能只靠正確的道理與正確的禮儀。</p><p>以西結書36章極其重要：神說祂的名被褻瀆之後，祂的解決方案是什麼？</p><p>「我也要賜給你們一個新心，將新靈放在你們裡面……<b>我必將我的靈放在你們裡面</b>，使你們順從我的律例。」（結36:26–27）</p><p>保羅在第24節丟出問題，在第29節給出以西結書的答案：靈，不是儀文。</p><p>【第五段｜2:25–29　真割禮是心裡的】</p>"},{"a":25,"z":27,"star":false,"grk":"<p>26 ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;</p>","lit":"<p>25「割禮固然有益——<b>只要你行律法</b>；但你若是違犯律法的，<b>你的割禮就已經變成未受割禮了</b>。」<br>26「所以，那未受割禮的若<b>謹守律法的義</b>，他的未受割禮<b>豈不要被算為割禮嗎</b>？」<br>27「而那生來未受割禮、卻<b>成全了律法</b>的人，豈不要<b>審判你</b>這有儀文和割禮、卻違犯律法的人嗎？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>割禮</td><td>περιτομή</td><td>peritomē</td><td>G4061</td><td>περί（周圍）+ τέμνω（切）：切割一圈</td></tr><tr><td>未受割禮</td><td>ἀκροβυστία</td><td>akrobystia</td><td>G203</td><td>包皮；轉指<b>外邦人身分</b></td></tr><tr><td>條例</td><td>δικαιώματα</td><td>dikaiōmata</td><td>G1345</td><td>δίκαιος：<b>義的要求／判決</b>（8:4同字）</td></tr><tr><td>算是</td><td>λογισθήσεται</td><td>logisthēsetai</td><td>G3049</td><td><b>未來被動式：將被算為</b>（4章的關鍵字）</td></tr><tr><td>儀文</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>字母、文書、<b>成文條例</b></td></tr></table>","gram":"<p>① λογισθήσεται（將被算為）——第4章的預備</p><p>這是羅馬書4章「亞伯拉罕信神，這就<b>算為</b>他的義」（λογίζομαι）的同一個字。</p><p>保羅在2:26已經悄悄埋下伏筆：神有一種「算」的方式，不是照外表算的。</p><p>注意這個字在本章的三次旅程：</p><p>- 2:3 人自己「算」（λογίζῃ）——算錯了<br>- 2:15 人的「思念」（λογισμοί）互相控告<br>- 2:26 神「算」（λογισθήσεται）——這才是真正算數的那一本帳</p><p>② δικαιώματα τοῦ νόμου（律法的義的要求）</p><p>這個詞組在羅馬書只出現兩次：</p><p>- <b>2:26</b>「若遵守律法的條例」<br>- <b>8:4</b>「使律法的義（τὸ δικαίωμα τοῦ νόμου）成就在我們這不隨從肉體、只隨從聖靈的人身上」</p><p>這是強力證據：保羅在2:26所想的，最終要在8:4得到答案——靠聖靈。</p><p>③ 27節 διὰ γράμματος καὶ περιτομῆς</p><p>διά + 所有格在此可譯「儘管有／藉著」。和合本「有儀文和割禮竟犯律法」的譯法抓住了語氣：<b>你擁有一切外在配備，卻正是犯律法的那一個。</b></p>","exp":"<p>保羅在做一件當時猶太人聽起來近乎褻瀆的事：他把割禮相對化了。</p><p>- 猶太人的邏輯：割禮 → 立約子民 → 得救<br>- 保羅的邏輯：割禮 → 是立約的<b>記號</b> → 記號沒有所指的實體，就是<b>空的</b></p><p>這就像：</p><p>- 一張沒有存款的提款卡<br>- 一枚戴在從未愛過對方的人手上的婚戒<br>- 一本簽了名卻從未讀過的聖經</p><p>記號本身是神設立的、是好的（「割禮固然於你有益」）——但記號永遠不能取代它所指向的實體。</p>"},{"a":28,"z":29,"star":true,"grk":"<p>28 οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή,<br>29 ἀλλ' ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ' ἐκ τοῦ θεοῦ.</p>","lit":"<p>28「因為那在<b>顯明處</b>的，不是猶太人；那在顯明處、在肉身的，也不是割禮。」<br>29「乃是那在<b>隱藏處</b>的，才是猶太人；割禮乃是心的割禮，<b>在靈裡，不在儀文裡</b>；這人的<b>稱讚</b>，不是從人來，乃是從神來。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>外面</td><td>ἐν τῷ φανερῷ</td><td>en tō phanerō</td><td>G5318</td><td>φαίνω（照亮、顯現）</td><td><b>在可見之處</b></td><td>人看得見的層面</td></tr><tr><td>裡面</td><td>ἐν τῷ κρυπτῷ</td><td>en tō kryptō</td><td>G2927</td><td>κρύπτω（隱藏）</td><td><b>在隱藏處</b></td><td>與2:16「隱祕事」同字</td></tr><tr><td>心</td><td>καρδία</td><td>kardia</td><td>G2588</td><td>—</td><td>心（意志、思想、生命中樞）</td><td>生命真正的所在</td></tr><tr><td>靈</td><td>πνεῦμα</td><td>pneuma</td><td>G4151</td><td>πνέω（吹）</td><td>靈／聖靈</td><td><b>本節最重要的解釋爭議點</b></td></tr><tr><td>儀文</td><td>γράμμα</td><td>gramma</td><td>G1121</td><td>γράφω（寫）</td><td>成文的字句</td><td>外在成文條例的體系</td></tr><tr><td>稱讚</td><td>ἔπαινος</td><td>epainos</td><td>G1868</td><td>ἐπί + αἶνος（讚美）</td><td>讚美、表揚</td><td><b>與「猶大」名字的雙關</b></td></tr></table>","gram":"<p>★ 亮光一：「猶太人」與「稱讚」的字義雙關</p><p>Ἰουδαῖος（猶太人）<b> ← </b>Ἰούδας（猶大）<b> ← 希伯來文 </b>יְהוּדָה（Yehudah）<b> ← 字根 </b>יָדָה（yadah, H3034）＝讚美、稱謝</p><p>創29:35：</p><p>「她又懷孕生子，說：『這回我要<b>讚美</b>耶和華』，因此給他起名叫<b>猶大</b>。」</p><p>創49:8（雅各的祝福）：</p><p>「猶大啊，你弟兄們必<b>讚美</b>你。」</p><p>而保羅在2:29說：「這人的稱讚（ἔπαινος）不是從人來的，乃是從神來的。」</p><p>這是一個橫跨希伯來文與希臘文的絕妙文字遊戲：<br>「猶大」的意思就是「稱讚」。<br>真正的猶太人（稱讚人），是那個所得的稱讚來自神、不來自人的人。</p><p>中文譯本完全看不出這一層。這是本章最美的原文亮光。</p><p>★ 亮光二：φανερός ／ κρυπτός 的貫穿</p><pre>2:16  神審判人的隱祕事（τὰ κρυπτά）\n2:29  真猶太人是在隱藏處（ἐν τῷ κρυπτῷ）的</pre><p>神審判的地方，和神稱讚的地方，是同一個地方——你的心。</p><p>主耶穌在馬太福音6章講施捨、禱告、禁食，三次說：</p><p>「你父在<b>暗中</b>（ἐν τῷ κρυπτῷ）察看，必然報答你。」</p><p>保羅與主耶穌用的是同一組字、同一個神學。</p><p>★ 亮光三：ἐν πνεύματι οὐ γράμματι 的解釋</p><p>「靈」在此是指<b>人的靈</b>還是<b>聖靈</b>？</p><p>兩種主要看法：</p><p>1. <b>人的靈／內在層面</b>（對比外在的肉身）——文法上可行<br>2. <b>聖靈</b>——多數現代註釋（Cranfield、Moo、Schreiner、Dunn）採此說</p><p>支持「聖靈」的理由（我認為具決定性）：</p><p>- <b>林後3:6</b> 用完全相同的對比：「字句（γράμμα）叫人死，精意（πνεῦμα）叫人活」——那裡的 πνεῦμα 明確是聖靈（林後3:17「主就是那靈」）<br>- <b>羅7:6</b> 同樣對比：「按著心靈（πνεύματος）的新樣，不按著儀文（γράμματος）的舊樣」<br>- <b>結36:26–27</b> 的背景：「我必將我的靈放在你們裡面」——這正是2:24引結36的必然延伸<br>- <b>申30:6</b>：「耶和華你神必將你心裡……的污穢除掉（מָל，行割禮）」——<b>注意：是神為你行割禮，不是你為自己行</b></p><p>「心的割禮」的舊約根源：</p><table><tr><th>經文</th><th>主詞</th><th>內容</th></tr><tr><td>申10:16</td><td><b>人</b></td><td>「你們要將心裡的污穢除掉」（人的責任）</td></tr><tr><td>耶4:4</td><td><b>人</b></td><td>「你們當自行割禮」（呼召）</td></tr><tr><td><b>申30:6</b></td><td><b>神</b></td><td>「耶和華你神必將你心裡……除掉」（神的作為）</td></tr><tr><td><b>結36:26–27</b></td><td><b>神</b></td><td>「我要賜給你們一個新心……我必將我的靈放在你們裡面」</td></tr></table><p>舊約的張力——人當自行割禮，卻做不到——在新約由聖靈解決。<br>這就是為什麼保羅把「心的割禮」與「靈」綁在一起。</p>","exp":"<p>保羅在此完成了一場神學上的哥白尼革命：</p><p>他把「神的子民」的定義，從族譜移到了心；從肉身移到了靈；從人的認證移到了神的稱讚。</p><p>這不是保羅的發明——<b>這正是舊約先知早就說過的</b>（申30:6；耶4:4;9:25–26；結36:26–27）。<b>保羅只是宣告：先知所應許的日子，在基督裡到了。</b></p><p>經文本身明確表達的：<br>真正屬神的人不由外在記號界定，而由聖靈在心中所行的內在割禮界定；他的稱讚出於神，不出於人。</p><p>合理推論的生命應用：<br>我們今天雖不談割禮，卻有一堆「新的割禮」——受洗多久、服事幾年、屬於哪個教會、讀過哪些書、認識哪些牧者。<b>保羅的問題會一樣尖銳地問我們：這些記號背後，有沒有一顆被聖靈動過刀的心？</b></p>"}],"3":[{"a":1,"z":2,"star":false,"grk":"<p>1 Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;<br>2 πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν [γὰρ] ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.</p>","lit":"<p>1「那麼，猶太人的<b>多出來的部分</b>是什麼？或者割禮的<b>益處</b>是什麼？」<br>2「照各方面來說都很多。首先，是因為神的<b>聖言</b>被<b>託付</b>給他們。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>長處</td><td>περισσόν</td><td>perisson</td><td>G4053</td><td>περί（超過）</td><td><b>多出來的、超額的</b></td><td>猶太人比別人「多」的那一份</td></tr><tr><td>益處</td><td>ὠφέλεια</td><td>ōpheleia</td><td>G5622</td><td>ὠφελέω（有益）</td><td>實際的利益、好處</td><td>商業與實用語彙</td></tr><tr><td>聖言</td><td>λόγια</td><td>logia</td><td>G3051</td><td>λόγος 的指小形</td><td><b>神諭、神所說的話</b></td><td>LXX 用於神的話（民24:4、詩119）</td></tr><tr><td>交託</td><td>ἐπιστεύθησαν</td><td>episteuthēsan</td><td>G4100</td><td>πιστεύω（信）</td><td><b>被信任、被託付</b></td><td>被動式，且與「信」同字根</td></tr></table>","gram":"<p>① ἐπιστεύθησαν 的雙關</p><p>這個字是 <b>πιστεύω（相信）</b> 的<b>不定過去被動式</b>。</p><p>- 主動用法：<b>相信</b><br>- 被動用法：<b>被信任、被託付</b></p><p>保羅用了一個絕妙的字：猶太人「被神信任」（ἐπιστεύθησαν），保管神的話語。</p><p>而下一節（3:3）馬上接著說：「即便有不信的（ἠπίστησαν）……」——<b>同一個字根。</b></p><pre>3:2  ἐπιστεύθησαν  被託付（被信任）\n3:3  ἠπίστησαν     不信\n3:3  ἀπιστία       不信\n3:3  πίστιν τοῦ θεοῦ  神的信實</pre><p>四次同一個字根，中文完全看不出來。</p><p>保羅在說：神信任你們，你們卻不信祂——但你們的不信，廢不掉祂的信實。</p><p>② πρῶτον μέν 沒有接 δεύτερον（第二）</p><p>保羅說「第一」，卻沒有說第二。（他要到9:4–5才把完整清單列出來：「兒子的名分、榮耀、諸約、律法、禮儀、應許、列祖、基督」。）</p><p>這是保羅思路被反駁打斷的痕跡——這一段是真實的辯論，不是排練好的講稿。</p>","exp":"<p>保羅的回答值得注意：他沒有為了強調「大家都一樣有罪」而否認猶太人的特權。</p><p>「凡事大有好處！」</p><p>這是牧養上極重要的榜樣：拆毀人錯誤的倚靠，不需要否定神真實的恩典。</p><p>猶太人最大的長處是什麼？<b>不是他們比較好，是他們手上有神的話。</b></p><p>但這正是第二章的問題：手上有神的話，跟心裡有神的話，是兩回事。</p><p><b>經文本身明確表達的：</b> 猶太人確有真實的特權，首先是神的話語被託付給他們。<br><b>合理推論的生命應用：</b> 我們今天手上有整本聖經、有無數的講道資源——這是何等大的託付。但<b>被託付</b>不等於<b>被改變</b>。</p>"},{"a":3,"z":4,"star":false,"grk":"<p>3 τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;<br>4 μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης…</p>","lit":"<p>3「那又怎樣呢？若有些人不信，難道他們的不信會使神的<b>信實</b>失效嗎？」<br>4「絕不可能！<b>倒要讓神成為真實的，而每一個人都是說謊的</b>……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>不信</td><td>ἠπίστησαν</td><td>ēpistēsan</td><td>G569</td><td><b>不信實、不忠心</b>（不只是理性的不相信）</td></tr><tr><td>神的信</td><td>πίστις τοῦ θεοῦ</td><td>pistis theou</td><td>G4102</td><td><b>神的信實／忠信</b>（不是「神的信心」）</td></tr><tr><td>廢掉</td><td>καταργήσει</td><td>katargēsei</td><td>G2673</td><td>κατά + ἀργός（無效）：<b>使之失效、作廢</b></td></tr><tr><td>斷乎不能</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td>願它絕不發生！<b>希臘文最強的否定</b></td></tr></table>","gram":"<p>① πίστις τοῦ θεοῦ 的譯法</p><p>和合本譯「神的信」，非常準確。這是<b>主詞所有格</b>：<b>神所具有的信實</b>（faithfulness），不是「對神的信心」。</p><p>這一節是全章、甚至全卷書的地基：如果神會因為人的失敗而毀約，那福音就一文不值。</p><p>② καταργέω 是羅馬書的關鍵字</p><p>- 3:3　人的不信能<b>廢掉</b>神的信實嗎？→ 不能<br>- 3:31　我們因信<b>廢了</b>律法嗎？→ 沒有<br>- 6:6　使罪身<b>滅絕</b><br>- 7:2、7:6　脫離律法</p><p>③ γινέσθω 命令語氣的力量</p><p>「不如說」原文是 <b>γινέσθω</b>——第三人稱命令語氣：「<b>讓它成為如此！</b>」</p><p>這不是一個中性的陳述，是一個宣告、一個表態：「就算全世界都是說謊的，也要讓神被證明是真實的！」</p><p>④ 引文出處：詩篇51:4（LXX 50:6）</p><p>「我向你犯罪，惟獨得罪了你，在你眼前行了這惡，以致你責備我的時候顯為公義；判斷我的時候顯為清正。」</p><p>保羅引的是大衛犯姦淫後的認罪詩。</p><p>這個引文選得極深：連以色列最偉大的王，都只能說「神啊，祢是對的，我是錯的」。</p>","exp":"<p>這一段回答了一個致命的問題：如果神的子民失敗了，是不是證明神失敗了？</p><p>保羅的答案：不。人的不忠心不能證明神不忠心，只能證明人不忠心。</p><p>這對今天的教會極其重要：</p><p>- 當你看見教會裡的醜聞<br>- 當你看見那位你敬佩的傳道人跌倒<br>- 當你看見自己一再失敗</p><p>你可以說：「這證明神不可靠。」<br>保羅說：「這只證明人不可靠。神仍然是真實的。」</p><p>信心的一個定義：當所有的證據都指向人的失敗時，仍然說「神是真實的」。</p>"},{"a":5,"z":8,"star":false,"grk":"<p>5 …μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.<br>8 …ποιήσωμεν τὰ κακά, ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.</p>","lit":"<p>5「但我們的不義若<b>顯明</b>神的義，我們要說什麼呢？那降忿怒的神是<b>不義</b>的嗎？——<b>我是照著人的說法講的</b>。」<br>6「絕不可能！否則神怎能審判世界呢？」<br>7「但若神的真實，因我的<b>虛謊</b>而更加顯出祂的榮耀，為什麼我還像罪人一樣受審判呢？」<br>8「又為什麼不說：『<b>我們作惡，好使善來到</b>』呢？——有人<b>毀謗</b>我們，說我們講過這話。<b>這等人受審判是應該的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>照著人的常話</td><td>κατὰ ἄνθρωπον</td><td>kata anthrōpon</td><td>G444</td><td><b>按人的說法</b>——保羅為自己的用語致歉</td></tr><tr><td>顯出</td><td>συνίστησιν</td><td>synistēsin</td><td>G4921</td><td><b>並列證明、彰顯出來</b>（如把兩樣東西擺一起對比）</td></tr><tr><td>毀謗</td><td>βλασφημούμεθα</td><td>blasphēmoumetha</td><td>G987</td><td><b>被褻瀆、被毀謗</b>（與2:24同字！）</td></tr><tr><td>該當的</td><td>ἔνδικος</td><td>endikos</td><td>G1738</td><td>合乎公理的、<b>判決是站得住的</b></td></tr></table>","gram":"<p>① κατὰ ἄνθρωπον λέγω（我且照著人的常話說）</p><p>保羅把這句話插進去，<b>是因為他剛剛講的那句話（「神降怒，是祂不義嗎？」）本身就近乎褻瀆。</b></p><p>他不敢讓這句話停在空中不加註明。這是敬虔的痕跡：連為了辯論而引用褻瀆的話，都要先道個歉。</p><p>② βλασφημούμεθα 與2:24的呼應</p><p>- 2:24　神的名因你們<b>受了褻瀆</b>（βλασφημεῖται）<br>- 3:8　保羅<b>被毀謗</b>（βλασφημούμεθα）</p><p>同一個字。第二章是神的名被褻瀆，第三章是保羅的名被毀謗。傳福音的人要有心理準備：講純正恩典的福音，一定會被人誤解成放縱。</p><p>③ ποιήσωμεν τὰ κακά 是假設語氣的勸勉式</p><p>「讓我們去作惡吧」——<b>這是一個口號式的句子。</b> 顯示這確實是當時流傳的一句話，被安在保羅頭上。</p>","exp":"<p>這一段的邏輯是：「如果我的罪讓神顯得更榮耀，那神憑什麼罰我？」</p><p>這種推論聽起來很聰明，卻藏著一個致命的自我中心：把神的榮耀當成自己犯罪的擋箭牌。</p><p>保羅的回答只有一句話（3:6）：</p><p>「若是這樣，神怎能審判世界呢？」</p><p>如果這個邏輯成立，神就永遠不能審判任何人——而聖經從頭到尾都見證神是審判全地的主。</p><p>然後保羅做了一件很少見的事：<b>他沒有繼續辯論，直接下判決——「這等人定罪是該當的。」</b></p><p>有一種論證不需要被回答，只需要被揭穿。</p><p>保羅在第六章會完整回答這個問題（6:1–14）：不是「作惡以成善不好」，而是「你已經與基督同死了，你怎麼還能在罪中活著？」</p><p>【第二段｜3:9–18　舊約的六重見證】</p>"},{"a":9,"z":9,"star":false,"grk":"<p>Τί οὖν; προεχόμεθα; οὐ πάντως· προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ' ἁμαρτίαν εἶναι</p>","lit":"<p>「那麼怎麼樣呢？我們佔上風嗎？完全不！因為我們已經<b>預先控告</b>猶太人和希臘人，<b>全都在罪之下</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>比他們強</td><td>προεχόμεθα</td><td>proechometha</td><td>G4284</td><td>προ（前）+ ἔχω（有）：<b>佔上風、握有優勢</b></td></tr><tr><td>已經證明</td><td>προῃτιασάμεθα</td><td>proētiasametha</td><td>G4256</td><td><b>新約僅此一次</b>；αἰτία（控告）：<b>預先提出正式指控</b></td></tr><tr><td>在罪惡之下</td><td>ὑφ' ἁμαρτίαν</td><td>hyph' hamartian</td><td>G266</td><td>ὑπό + 直接受格：<b>在罪的權勢底下</b></td></tr></table>","gram":"<p>① προῃτιασάμεθα 是法律術語</p><p>αἰτία 是「控罪」；加上 προ- 是「先前已經提出的控告」。</p><p>保羅在說：起訴書我已經寫完了（1:18–2:29），現在要傳喚證人。</p><p>② ὑφ' ἁμαρτίαν 的介詞用法</p><p>ὑπό + 直接受格 ＝ <b>「在……的權柄／統治之下」</b>（如「在律法以下」6:14、「在監管之下」加3:23）。</p><p>這個文法對理解本節有什麼影響？<br>保羅沒有說「所有人都犯了很多罪」（那是罪行），他說「所有人都<b>在罪之下</b>」（那是罪性、是權勢）。<br>罪不只是我做的事，罪是統治我的主人。</p><p>這一節是羅馬書6章「作罪的奴僕」的伏筆。</p>","exp":"<p>弟兄姊妹，3:9是保羅整個起訴程序的<b>結案陳詞</b>。</p><p>他先起訴外邦人（1:18–32），再起訴猶太人（2:1–29），然後在3:9把兩份起訴書合併：</p><p>「猶太人和希臘人<b>都在罪惡之下</b>。」</p><p><b>經文本身明確表達的：</b> 猶太人在救恩上並不「佔上風」（προεχόμεθα）；因為兩群人都同樣<b>在罪的權勢底下</b>。</p><p><b>可以合理推論的：</b> 保羅用的是<b>法律用語</b>（προαιτιάομαι ＝ 預先提出正式指控），這表示第一、二章不是情緒性的責備，是<b>一份寫好的起訴書</b>。</p><p>而 ὑφ' ἁμαρτίαν（在罪之下）指的是<b>權勢</b>，不只是行為。<br>所以人的問題不是「做了幾件壞事」，是「<b>有一位主人在管我</b>」——這正是第六章的伏筆。</p><p><b>⚠ 牧養提醒：</b> 3:9不是要人自卑，是要人<b>閉嘴</b>（3:19）。<br>而閉嘴之後的下一句，就是3:21的「但如今」。</p>"},{"a":10,"z":12,"star":false,"grk":"<p>10 …οὐκ ἔστιν δίκαιος οὐδὲ εἷς,<br>11 οὐκ ἔστιν ὁ συνίων, οὐκ ἔστιν ὁ ἐκζητῶν τὸν θεόν.<br>12 πάντες ἐξέκλιναν ἅμα ἠχρεώθησαν· οὐκ ἔστιν ὁ ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.</p>","lit":"<p>10「<b>沒有義人，連一個也沒有</b>；」<br>11「<b>沒有明白的</b>，<b>沒有尋求神的</b>。」<br>12「他們<b>全都偏離了</b>，<b>一同變為無用</b>；<b>沒有行良善的，連一個也沒有</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>明白的</td><td>συνίων</td><td>syniōn</td><td>G4920</td><td>σύν + ἵημι：<b>把事情連起來看懂</b>（屬靈的領悟）</td></tr><tr><td>尋求</td><td>ἐκζητῶν</td><td>ekzētōn</td><td>G1567</td><td>ἐκ + ζητέω：<b>竭力搜尋</b>（加強語氣）</td></tr><tr><td>偏離正路</td><td>ἐξέκλιναν</td><td>exeklinan</td><td>G1578</td><td>ἐκ + κλίνω：<b>轉向一邊、離開道路</b></td></tr><tr><td>變為無用</td><td>ἠχρεώθησαν</td><td>ēchreōthēsan</td><td>G889</td><td>ἀ + χρηστός（有用）：<b>變質、發酸、成了廢物</b></td></tr><tr><td>行善</td><td>ποιῶν χρηστότητα</td><td>chrēstotēs</td><td>G5544</td><td><b>恩慈</b>——與2:4「神的恩慈」是同一個字</td></tr></table>","gram":"<p>① ἠχρεώθησαν 的畫面</p><p>這個字在古典希臘文與 LXX 中，用於<b>牛奶發酸、食物變質、器皿損壞不能用</b>。</p><p>保羅引詩篇14:3說：人不是壞掉一部分，是整個「變質」了。</p><p>② χρηστότητα 的驚人對照</p><p>3:12說「沒有行<b>恩慈</b>（χρηστότης）的，連一個也沒有」。<br>2:4說神有「豐富的<b>恩慈</b>（χρηστότης）」。</p><p>同一個字。</p><p>人身上一點恩慈也沒有；神那裡卻是豐豐富富的恩慈。<br>這就是福音的落差。</p><p>③ οὐδὲ εἷς ／ ἕως ἑνός（連一個也沒有）</p><p>保羅在3:10與3:12兩次強調「<b>一個都沒有</b>」。</p><p>這是全段最不受歡迎的一句話。因為每個人心裡都在想：「至少還有一個吧？我認識一個很好的人……」</p><p>保羅說：連一個也沒有。</p>","exp":"<p>注意11節的次序：先是「沒有明白的」，然後是「沒有尋求神的」。</p><p>這揭示了一個順序：不是人先不想找神，是人先看不懂。</p><p>而12節接著說：「都是偏離正路」——ἐξέκλιναν 的畫面是走在路上，然後轉向旁邊。人不是原地不動，人是主動離開。</p><p><b>經文本身明確表達的：</b> 舊約自己作證，沒有一個義人、明白人、尋求神的人。<br><b>合理推論的生命應用：</b> 若沒有一個人尋求神，那我今天會坐在這裡讀聖經，就不是我找到了神，是神先找到了我。</p>"},{"a":13,"z":14,"star":false,"grk":"<p>13 τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν·<br>14 ὧν τὸ στόμα ἀρᾶς καὶ πικρίας γέμει.</p>","lit":"<p>13「他們的<b>喉嚨是敞開的墳墓</b>，他們用舌頭<b>行詭詐</b>；<b>虺蛇的毒</b>在他們的嘴唇底下，」<br>14「他們的口<b>滿了咒罵與苦毒</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>喉嚨</td><td>λάρυγξ</td><td>larynx</td><td>G2995</td><td>喉頭（英文 larynx 由此而來）</td></tr><tr><td>敞開的墳墓</td><td>τάφος ἀνεῳγμένος</td><td>taphos aneōgmenos</td><td>G5028</td><td><b>完成被動分詞</b>：已被打開、且仍然開著</td></tr><tr><td>弄詭詐</td><td>ἐδολιοῦσαν</td><td>edoliousan</td><td>G1387</td><td>δόλος（誘餌、詭計）：<b>用餌引人上鉤</b></td></tr><tr><td>毒氣</td><td>ἰός</td><td>ios</td><td>G2447</td><td>毒液；也指<b>鏽</b>（雅5:3）</td></tr><tr><td>咒罵</td><td>ἀρά</td><td>ara</td><td>G685</td><td>詛咒</td></tr><tr><td>苦毒</td><td>πικρία</td><td>pikria</td><td>G4088</td><td>苦味、怨毒</td></tr><tr><td>滿</td><td>γέμει</td><td>gemei</td><td>G1073</td><td><b>裝滿到滿出來</b>（如船裝滿貨）</td></tr></table>","gram":"<p>① τάφος ἀνεῳγμένος 的完成式分詞</p><p>「敞開的墳墓」不是形容詞，是<b>完成被動分詞</b>：「<b>已經被打開、而且一直開著的墳墓</b>」。</p><p>猶太人對墳墓有強烈的潔淨忌諱（民19:16：摸了墳墓就不潔淨七天）。</p><p>一個敞開的墳墓意味著：<br>1. 裡面的腐臭直接冒出來<br>2. 誰靠近誰就不潔淨</p><p>保羅說：人的喉嚨就是這樣。裡面早就死了，話一出口，那股味道就飄出來，還會污染旁邊的人。</p><p>② ἰὸς ἀσπίδων（虺蛇的毒氣）</p><p>ἀσπίς 是埃及眼鏡蛇。<b>蛇的毒液藏在牙齒後面的腺體裡——平常看不見，咬下去才致命。</b></p><p>創世記3章那條蛇，用的正是言語的毒。</p><p>③ γέμει（滿）</p><p>現在式，表示<b>持續的狀態</b>——不是偶爾說幾句苦毒的話，是那個口本來就裝滿了。</p><p>主耶穌說：「因為心裡所充滿的，口裡就說出來。」（太12:34）<br>保羅這幾節，正是主這句話的註腳。</p>","exp":"<p>保羅為什麼花四個器官（喉嚨、舌頭、嘴唇、口）來講言語？</p><p>因為<b>言語是心的出口</b>。</p><p>你可以管理你的行為，但你管不住你的舌頭（雅3:8「惟獨舌頭沒有人能制伏」）。</p><p>所以言語是最誠實的證據。你在網路上的留言、你在車裡的自言自語、你在情緒失控那三秒鐘說出來的話——那才是你。</p>"},{"a":15,"z":17,"star":false,"grk":"<p>15 ὀξεῖς οἱ πόδες αὐτῶν ἐκχέαι αἷμα,<br>16 σύντριμμα καὶ ταλαιπωρία ἐν ταῖς ὁδοῖς αὐτῶν,<br>17 καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν.</p>","lit":"<p>15「他們的腳<b>飛快地去流人的血</b>，」<br>16「<b>毀壞與愁苦</b>在他們的路上，」<br>17「而<b>平安的路，他們不曾認得</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>飛跑</td><td>ὀξεῖς</td><td>oxeis</td><td>G3691</td><td><b>銳利的、迅速的</b>（同字用於「快刀」）</td></tr><tr><td>殘害</td><td>σύντριμμα</td><td>syntrimma</td><td>G4938</td><td>σύν + τρίβω：<b>壓碎、粉碎</b>（碎成一地）</td></tr><tr><td>暴虐</td><td>ταλαιπωρία</td><td>talaipōria</td><td>G5004</td><td>悲慘、苦難</td></tr><tr><td>平安</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>譯希伯來文 <b>שָׁלוֹם</b>（shalom）：<b>完整、整全、和好</b></td></tr></table>","gram":"<p><b>引文出自以賽亞書59:7–8。</b> 那一章的處境是：以色列在被擄前的社會，充滿不公不義，先知說「你們的罪孽使你們與神隔絕」（賽59:2）。</p><p>σύντριμμα（壓碎）與 εἰρήνη／שָׁלוֹם（完整）恰成反義：</p><p>- שָׁלוֹם 的字根意思是「<b>完整、無缺</b>」<br>- σύντριμμα 是「<b>碎裂</b>」</p><p>人所走的路留下一地碎片；而神的路叫做「完整」。<br>人從來不知道那條路怎麼走——直到那一位說「我就是道路」的人來了（約14:6）。</p>","exp":"<p>注意保羅的排列：先講嘴，再講腳。</p><p><b>先是話，後是行動。</b> 這是罪的自然發展——先在言語上輕看人，然後在行動上傷害人。</p><p>而17節是最令人心酸的一句：「平安的路，他們未曾知道。」</p><p>不是「他們不肯走」，是「他們不知道」。人類拚命尋找和平——聯合國、和平協議、心理治療、正念冥想——<br>但保羅說：那條路，人根本不認識。</p>"},{"a":18,"z":18,"star":true,"grk":"<p>οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.</p>","lit":"<p>「在他們眼睛的<b>正前方</b>，沒有神的敬畏。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>怕</td><td>φόβος</td><td>phobos</td><td>G5401</td><td>敬畏（英文 phobia 由此而來）</td></tr><tr><td>眼中</td><td>ἀπέναντι τῶν ὀφθαλμῶν</td><td>apenanti tōn ophthalmōn</td><td>G561</td><td><b>在……的正對面、正前方</b></td></tr></table>","gram":"<p>ἀπέναντι 的畫面感極強：「在你視線的正前方」。</p><p>保羅引的是詩篇36:1。這句話的意思不是「他們不相信有神」，而是「神不在他們的視野裡」。</p><p>無神論者的問題，不是他推翻了神；是神不在他的視線正前方。<br>而基督徒最大的危險，也是同一個——不是不信神，是神不在視野裡。</p>","exp":"<p>這一節是3:10–18整段的根源，也是全段的收尾。</p><p>保羅從人的內心（沒有明白的）→ 講到嘴（敞開的墳墓）→ 講到腳（飛跑流血）→ 最後回到<b>眼睛</b>。</p><p>所有的敗壞，都從一個地方開始：眼中沒有神。</p><p>箴言說：「敬畏耶和華是智慧的開端」（箴9:10）。<br>保羅說：不敬畏耶和華，就是這一切的開端。</p><p>這與羅1:21「不當作神榮耀祂」、羅2:29「不求神的稱讚」完全一致。<br>一至三章的診斷是同一個：焦點不在神身上。</p><p>【第三段｜3:19–20　判決：每一張嘴都被封住】</p>"},{"a":19,"z":19,"star":false,"grk":"<p>Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·</p>","lit":"<p>「我們知道，凡律法所說的，都是對律法之內的人說的，<b>為要使每一張嘴被封住</b>，並使全世界都成為<b>在神面前應受判決的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>意義</th></tr><tr><td>塞住</td><td>φραγῇ</td><td>phragē</td><td>G5420</td><td>φράσσω（築籬笆、堵住）</td><td><b>不定過去被動假設語氣：被封起來</b></td></tr><tr><td>口</td><td>στόμα</td><td>stoma</td><td>G4750</td><td>—</td><td>嘴（3:14剛用過：「滿口是咒罵苦毒」）</td></tr><tr><td>伏在審判之下</td><td>ὑπόδικος</td><td>hypodikos</td><td>G5267</td><td>ὑπό + δίκη（審判）</td><td><b>新約僅此一次</b>：在法庭上無可答辯、應受判決</td></tr><tr><td>普世的人</td><td>πᾶς ὁ κόσμος</td><td>pas ho kosmos</td><td>G2889</td><td>—</td><td>整個世界</td></tr></table>","gram":"<p>① φράσσω 的畫面</p><p>這個字在古典希臘文中用於：</p><p>- <b>築籬笆把路封起來</b><br>- <b>堵住水道</b><br>- <b>在法庭上，被告啞口無言</b></p><p>（希伯來書11:33用同字：「堵了獅子的口」）</p><p>② πᾶν στόμα（每一張嘴）與3:14的呼應</p><p>- 3:14「<b>滿口</b>（στόμα）是咒罵苦毒」<br>- 3:19「好塞住<b>各人的口</b>（πᾶν στόμα）」</p><p>同一個字。那張說盡了咒罵苦毒的嘴，在律法面前終於閉上了。</p><p>③ ὑπόδικος：新約唯一一次</p><p>法律專用詞，指「<b>被告已無抗辯的餘地，只等宣判</b>」。</p><p>④ ἵνα（為要）——律法的目的</p><p>律法的目的<b>不是</b>叫人達到，而是<b>叫人閉嘴</b>。</p><p>這個文法對理解本節有什麼影響？<br>律法從一開始就不是一把梯子，是一面鏡子。<br>梯子讓你往上爬；鏡子讓你閉嘴。</p>","exp":"<p>這是1:18–3:20整段起訴的最終判決。而判決的內容不是「你被定罪了」，而是——「你沒話說了」。</p><p>保羅要的不是我們認錯，是我們<b>沒話可說</b>。</p><p>因為只要我們還有一句「可是……」，我們就還沒有預備好接受恩典。</p><p>- 「可是我也不是最壞的。」<br>- 「可是我有我的苦衷。」<br>- 「可是他比我更過分。」</p><p>羅馬書一到三章，就是神一句一句把這些「可是」拆掉，直到我們安靜下來。</p><p>人在神面前閉嘴的那一刻，就是神可以開口的那一刻。</p>"},{"a":20,"z":20,"star":false,"grk":"<p>διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.</p>","lit":"<p>「因此，憑著律法的行為，沒有一個<b>血肉之軀</b>能在祂面前被稱為義；因為藉著律法，來的是<b>對罪的認識</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>凡有血氣的</td><td>πᾶσα σάρξ</td><td>pasa sarx</td><td>G4561</td><td>希伯來式表達 <b>כָּל־בָּשָׂר</b>：<b>所有血肉之軀</b>（強調人的軟弱有限）</td></tr><tr><td>稱義</td><td>δικαιωθήσεται</td><td>dikaiōthēsetai</td><td>G1344</td><td>未來被動：<b>將被宣告為義</b></td></tr><tr><td>知罪</td><td>ἐπίγνωσις ἁμαρτίας</td><td>epignōsis</td><td>G1922</td><td>ἐπί（加強）+ γνῶσις：<b>充分的、透徹的認識</b></td></tr></table>","gram":"<p>① πᾶσα σάρξ 的舊約背景</p><p>這是希伯來文成語（כָּל־בָּשָׂר），保羅在此引用<b>詩篇143:2</b>：</p><p>「求你不要審問僕人；因為在你面前，<b>凡活著的人沒有一個是義的</b>。」</p><p>保羅在詩篇的話上加了四個字：「憑著律法的行為（ἐξ ἔργων νόμου）」。</p><p>② ἐπίγνωσις 不是普通的「知道」</p><p>γνῶσις 是知識；<b>ἐπίγνωσις 是加強版：透徹的、切身的、完全的認識。</b></p><p>律法給你的不是「原來這是罪」的資訊，是「原來我是罪人」的震動。</p><p>③ 「所以」（διότι）的連接</p><p>3:19（嘴被封住）→ 3:20（所以沒有人能靠行律法稱義）。</p><p>邏輯是：既然每一張嘴都被封住了，就沒有人能提出自己的功勞。</p>","exp":"<p>這是全書最黑暗的一節。</p><p>保羅走了兩章半，把所有的門一扇一扇關上：</p><p>- 外邦人的門，關了（1:32）<br>- 道德人的門，關了（2:1）<br>- 猶太人的門，關了（2:24）<br>- 律法的門，關了（3:20）</p><p>沒有出路了。</p><p>但保羅在關上最後一扇門的同時，說了一句極重要的話：「律法本是叫人知罪。」</p><p>律法沒有失敗——律法完成了它的任務。</p><p>醫生的X光片照不好你的骨折，但它讓你知道要去開刀房。<br>律法就是那張X光片。它不能救你，但它能讓你不再假裝自己沒事。</p><p>而下一節，開刀房的門打開了。</p><p>【第四段｜3:21–26　★ 但如今 ★】</p><p>這六節是全本聖經的中心地帶。保羅在原文中把它們寫成一個綿長的複合句——救恩是一個整體，不可拆解。</p>"},{"a":21,"z":21,"star":false,"grk":"<p>Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,</p>","lit":"<p>「<b>但就在此刻</b>——在律法之外，神的義<b>已經被顯明出來了</b>（並且一直顯明著），被律法和先知<b>持續作見證</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>意義</th></tr><tr><td>但如今</td><td>Νυνὶ δέ</td><td>nyni de</td><td>G3570</td><td>νῦν 的加強形</td><td><b>但就在此刻！</b></td></tr><tr><td>在律法以外</td><td>χωρὶς νόμου</td><td>chōris nomou</td><td>G5565</td><td>χωρίζω（分開）</td><td>與律法<b>分開</b>、不藉著律法</td></tr><tr><td>神的義</td><td>δικαιοσύνη θεοῦ</td><td>dikaiosynē theou</td><td>G1343</td><td>δίκαιος</td><td><b>神所賜的義</b>（見下文）</td></tr><tr><td>顯明</td><td>πεφανέρωται</td><td>pephanerōtai</td><td>G5319</td><td>φανερόω</td><td><b>完成被動式</b>：已經顯明，且效果持續</td></tr><tr><td>為證</td><td>μαρτυρουμένη</td><td>martyroumenē</td><td>G3140</td><td>μαρτυρέω</td><td><b>現在被動分詞</b>：持續被作見證</td></tr></table>","gram":"<p>① Νυνὶ δέ ——全本聖經最美的兩個字</p><p>- νυνί 是 νῦν 的<b>強化形式</b>（加了 -ι 的強調尾綴）<br>- δέ 是強對比連接詞</p><p>保羅用了兩章半（1:18–3:20）建立絕望，用兩個字翻轉一切。</p><p>這個「如今」不只是時間，是救恩歷史的新紀元：</p><pre>從前（律法時代）：律法叫人知罪，每一張嘴被封住\n   ↓ Νυνὶ δέ\n如今（基督時代）：神的義在律法以外顯明</pre><p>② πεφανέρωται 完成式的重量</p><p>完成式（perfect）在希臘文中表示：一個過去完成的動作，其效果一直持續到現在。</p><p>這不是「神的義曾經顯明過一次」，而是「神的義已經顯明出來，而且到今天仍然攤在那裡，誰都可以來拿」。</p><p>比較1:17用的是現在式 ἀποκαλύπτεται（正在顯明）；這裡用完成式 πεφανέρωται（已經顯明，並持續有效）——保羅在3:21把福音從「正在發生」推進到「已經成就」。</p><p>③ μαρτυρουμένη 現在被動分詞</p><p>「有律法和先知為證」——<b>現在式</b>，表示舊約<b>至今仍在</b>為這福音作見證。</p><p>保羅在說一件極重要的事：福音不是新的宗教，是舊約一直在指向的那一位終於來了。<br>「在律法以外」（χωρὶς νόμου）不等於「與舊約無關」。</p><p>④ δικαιοσύνη θεοῦ（神的義）的三種解釋</p><table><tr><th>觀點</th><th>主張</th><th>代表</th></tr><tr><td><b>屬性說</b></td><td>神自己公義的性情</td><td>中世紀傳統</td></tr><tr><td><b>恩賜說</b></td><td>神所賜給人、算給人的義</td><td><b>路德、改革宗主流</b></td></tr><tr><td><b>作為說</b></td><td>神信守聖約、施行拯救的義行</td><td>Käsemann、Wright</td></tr></table><p>本章的上下文支持：「恩賜」為主，「作為」為輔。</p><p>理由：</p><p>- 3:22「神的義……<b>加給</b>一切相信的人」——是給出去的<br>- 3:24「<b>就白白地稱義</b>」——是宣告<br>- 3:26「他自己為義，也稱信耶穌的人為義」——<b>同一節裡兩個都有！</b></p><p>3:26是解開這個爭議的鑰匙：神的義既是祂自己的屬性（祂是義的），也是祂賜下的地位（祂稱人為義）。</p>","exp":"<p>弟兄姊妹讀到這裡，要停一下。</p><p>3:20說「沒有一個因行律法能在神面前稱義」——句號。<br>3:21說「但如今」——</p><p>這中間發生了什麼事？</p><p>中間發生了一個十字架。</p><p>保羅沒有說「但如今你們要更努力」，也沒有說「但如今神降低標準了」。</p><p>他說：</p><p>「神的義，在律法以外，已經顯明出來。」</p><p>不是人爬上去的義，是神拿下來的義。</p>"},{"a":22,"z":22,"star":false,"grk":"<p>δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ εἰς πάντας τοὺς πιστεύοντας. οὐ γάρ ἐστιν διαστολή,</p>","lit":"<p>「就是神的義，<b>藉著耶穌基督的信</b>（或：藉著信耶穌基督），臨到所有相信的人。因為沒有<b>分別</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>因信耶穌基督</td><td>πίστεως Ἰησοῦ Χριστοῦ</td><td>pisteōs Iēsou Christou</td><td>G4102</td><td><b>本節最大的解經爭議</b>（見下）</td></tr><tr><td>加給</td><td>εἰς</td><td>eis</td><td>G1519</td><td><b>進入、臨到</b>（方向性介詞）</td></tr><tr><td>分別</td><td>διαστολή</td><td>diastolē</td><td>G1293</td><td>διά + στέλλω：<b>區分、劃分界線</b></td></tr></table>","gram":"<p>① πίστις Ἰησοῦ Χριστοῦ：受詞所有格 vs 主詞所有格</p><table><tr><th>譯法</th><th>意思</th><th>支持者</th></tr><tr><td><b>受詞所有格</b>（objective）</td><td><b>信</b>耶穌基督（人的信心）</td><td>傳統譯本、和合本、多數改革宗</td></tr><tr><td><b>主詞所有格</b>（subjective）</td><td>耶穌基督<b>的信實</b>（基督的忠信）</td><td>Hays、Wright、部分新約學者</td></tr></table><p>支持傳統譯法（人的信心）的理由：</p><p>- 同一節下半句立刻說「<b>加給一切相信的（τοὺς πιστεύοντας）人</b>」——保羅在解釋自己<br>- 3:26「稱<b>信耶穌的人</b>為義」<br>- 4:5「信神稱罪人為義的」<br>- 全卷書強調人的回應之信（1:16、10:9–10）</p><p><b>支持主詞所有格的價值：</b> 它提醒我們<b>信心不是我們的功勞</b>，救恩的根基是基督的忠信。</p><p>我的判斷：受詞所有格（信耶穌基督）最符合上下文；但主詞所有格所要保護的真理是對的，可以用另一種方式表達——「使我們得救的，不是我信心的品質，是我信心所抓住的那一位」。</p><p>② διαστολή（分別）</p><p>這個字在<b>羅3:22與10:12</b>出現：</p><p>- 3:22「沒有分別」——因為<b>都犯了罪</b><br>- 10:12「沒有分別」——因為<b>都可以求告主</b></p><p>同一個字，一次在定罪上沒有分別，一次在恩典上沒有分別。</p><p>這是全章最公平的一句話：在罪面前，我們都一樣；在恩典面前，我們也都一樣。</p>","exp":"<p>「加給」的原文是 εἰς——一個方向性的介詞：「進入」「臨到」。</p><p>神的義不是掛在天上讓你欣賞，是朝著你而來、進到你裡面的。</p><p>而「沒有分別」（οὐ διαστολή）這句話，正是第二章2:11「神不偏待人」的完成。</p>"},{"a":23,"z":23,"star":false,"grk":"<p>πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ</p>","lit":"<p>「因為所有人都犯了罪，並且<b>持續地缺乏</b>神的榮耀。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>犯了罪</td><td>ἥμαρτον</td><td>hēmarton</td><td>G264</td><td><b>不定過去式</b>：射不中靶（總括全人類的歷史）</td></tr><tr><td>虧缺</td><td>ὑστεροῦνται</td><td>hysterountai</td><td>G5302</td><td><b>現在中／被動式</b>：<b>持續地落後、缺乏、達不到</b></td></tr><tr><td>榮耀</td><td>δόξα</td><td>doxa</td><td>G1391</td><td>榮耀、光輝、重量</td></tr></table>","gram":"<p>① 兩個動詞，兩種時態</p><table><tr><th>動詞</th><th>時態</th><th>意義</th></tr><tr><td>ἥμαρτον（犯了罪）</td><td><b>不定過去式</b></td><td>一個已成定局的事實</td></tr><tr><td>ὑστεροῦνται（虧缺）</td><td><b>現在式</b></td><td><b>此刻仍然持續的狀態</b></td></tr></table><p>保羅在說：犯罪是一件已經發生的事；虧缺卻是一個至今持續的狀態。<br>「我曾經犯了罪」＋「我現在還是不夠」。</p><p>② ὑστερέω 的畫面</p><p>這個字在新約用於：</p><p>- 賽跑中<b>落後</b><br>- 筵席上酒<b>用盡了</b>（約2:3「酒用盡了」正是這個字！）<br>- 浪子<b>窮困</b>（路15:14）</p><p>畫面：你在跑，但你追不上；你在倒，但瓶子空了。</p><p>③「神的榮耀」是什麼意思？</p><p>兩種主要理解：</p><p>1. <b>神所賜的榮耀</b>——人本應反映神的形像（創1:26–27），卻失去了<br>2. <b>神自己的榮耀</b>——人本應榮耀神（1:21），卻虧缺了</p><p>猶太傳統認為亞當在墮落前有「榮耀的外袍」，墮落後失去了。羅1:23「將不能朽壞之神的榮耀，變為偶像」支持第一種。</p><p>兩者其實是一體的：人失去了榮耀神的能力，也失去了反映神榮耀的樣式。</p>","exp":"<p>這是全本聖經最常被引用的一節之一，卻常被讀得太輕。</p><p>「虧缺」不是「差一點點」。原文的現在式告訴我們：這是一個<b>持續的、每一天的</b>狀態。</p><p>人不是偶爾達不到神的標準，人是每一天、每一刻都在缺。</p><p><b>注意保羅把這一節放在哪裡：</b> 他把它夾在3:22（沒有分別）與3:24（白白稱義）之間。<br>這一節不是為了讓人絕望，是為了說明為什麼恩典必須是白白的。</p>"},{"a":24,"z":24,"star":false,"grk":"<p>δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·</p>","lit":"<p>「<b>白白地</b>，藉著祂的恩典，藉著那在基督耶穌裡的<b>贖回</b>，被稱為義——」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>意義</th></tr><tr><td>稱義</td><td>δικαιούμενοι</td><td>dikaioumenoi</td><td>G1344</td><td>δίκαιος</td><td><b>現在被動分詞</b>：正在被宣告為義</td></tr><tr><td>白白地</td><td>δωρεάν</td><td>dōrean</td><td>G1432</td><td>δῶρον（禮物）</td><td><b>當作禮物、無償地、無緣無故地</b></td></tr><tr><td>恩典</td><td>χάρις</td><td>charis</td><td>G5485</td><td>χαίρω（喜樂）</td><td>白白的恩惠</td></tr><tr><td>救贖</td><td>ἀπολύτρωσις</td><td>apolytrōsis</td><td>G629</td><td>ἀπό + λύτρον（贖價）</td><td><b>付贖價把人買出來得自由</b></td></tr></table>","gram":"<p>① δωρεάν 的驚人用法</p><p>這個字在<b>約翰福音15:25</b>被用在一個令人震撼的地方：</p><p>「他們<b>無故</b>（δωρεάν）恨我。」</p><p>同一個字。</p><pre>他們「無緣無故」恨祂    （約15:25 δωρεάν）\n我們「無緣無故」被稱義   （羅3:24 δωρεάν）</pre><p>祂無緣無故被恨，我們無緣無故被愛。<br>這是十字架的交換。</p><p>② ἀπολύτρωσις 的三個要素</p><p>古代贖奴需要三樣：</p><p>1. <b>一個被囚的人</b>（我們，3:9「在罪惡之下」）<br>2. <b>一筆贖價</b>（λύτρον——耶穌說：「捨命作多人的贖價」可10:45）<br>3. <b>一個釋放的宣告</b>（3:24「稱義」）</p><p><b>注意：贖價付給誰？聖經沒有說付給撒但。</b> 早期教父有此推測，但保羅的重點不在「付給誰」，而在<b>代價之昂貴與釋放之真實</b>。</p><p>③ 三個介詞層層堆疊</p><pre>δωρεάν            —— 白白地       【方式：無償】\nτῇ αὐτοῦ χάριτι   —— 憑祂的恩典   【根源：神的性情】\nδιὰ τῆς ἀπολυτρώσεως —— 藉著救贖  【途徑：基督的工作】</pre><p>保羅怕我們誤會，所以連下三重保險：白白的、憑恩典、藉救贖。</p>","exp":"<p>「白白地稱義」是全本聖經最不合人性直覺的一句話。</p><p>因為每一種宗教、每一種文化、每一個人的本能都說：<b>你要付出，才配得到。</b></p><p>只有福音說：你什麼都不必付，因為有人已經付清了。</p><p>但「白白的」不等於「不值錢的」。<br>對你是白白的，對神是傾家蕩產的。</p>"},{"a":25,"z":25,"star":true,"grk":"<p>ὃν προέθετο ὁ θεὸς ἱλαστήριον διὰ [τῆς] πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων</p>","lit":"<p>「神<b>公開擺出</b>祂作<b>施恩座／挽回祭</b>，藉著信，在祂自己的血裡，為要<b>證明</b>祂的義——因為神先前<b>放過了</b>（沒有處理）那些已經犯下的罪，」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>意義</th></tr><tr><td>設立</td><td>προέθετο</td><td>proetheto</td><td>G4388</td><td>πρό + τίθημι（擺放）</td><td><b>公開擺出來、陳列於眾人面前</b>（也可譯「預先定意」）</td></tr><tr><td>挽回祭</td><td>ἱλαστήριον</td><td>hilastērion</td><td>G2435</td><td>ἵλεως（施憐憫的）</td><td><b>施恩座／贖罪之處</b>（見下文詳解）</td></tr><tr><td>血</td><td>αἷμα</td><td>haima</td><td>G129</td><td>—</td><td>血，指<b>獻上的生命</b>（利17:11）</td></tr><tr><td>顯明</td><td>ἔνδειξις</td><td>endeixis</td><td>G1732</td><td>ἐν + δείκνυμι（指出）</td><td><b>法庭上提出的證據</b></td></tr><tr><td>寬容</td><td>πάρεσις</td><td>paresis</td><td>G3929</td><td>παρά + ἵημι（放過）</td><td><b>新約僅此一次：暫時擱置、放過去</b></td></tr><tr><td>先時所犯的</td><td>προγεγονότων</td><td>progegonotōn</td><td>G4266</td><td>—</td><td><b>完成分詞</b>：先前已經犯下的</td></tr></table>","gram":"<p>★ 亮光一：ἱλαστήριον ——施恩座</p><p>這個字在七十士譯本中，是約櫃上蓋子的專有名詞——希伯來文 כַּפֹּרֶת（kapporeth），中文譯作「施恩座」。</p><p>- 出25:17–22（施恩座的製作）<br>- 利16:2、13–15（贖罪日彈血於施恩座）<br>- <b>來9:5「施恩的所在」——用的正是 ἱλαστήριον</b></p><p>贖罪日發生了什麼？</p><p>1. 約櫃裡放著什麼？<b>兩塊法版</b>（十誡）——那是控告以色列的證據<br>2. 約櫃上蓋著什麼？<b>施恩座</b><br>3. 施恩座上有什麼？<b>兩個基路伯，面對面，俯視施恩座</b><br>4. 大祭司做什麼？<b>把贖罪祭的血彈在施恩座上</b></p><p>於是那位坐在基路伯中間的神，低頭看下去的時候——<br>祂看見的不是控告我的法版，是遮蓋法版的血。</p><p>保羅說：耶穌就是那個施恩座。</p><p>兩種主要譯法：</p><table><tr><th>譯法</th><th>重點</th><th>支持</th></tr><tr><td><b>挽回祭</b>（propitiation）</td><td>承受神的忿怒，使神轉怒為恩</td><td>和合本；1:18神的忿怒是上下文；C.E.B. Cranfield、Leon Morris</td></tr><tr><td><b>施恩座</b>（mercy seat）</td><td>LXX 用法；贖罪日的地點</td><td>來9:5同字；T. W. Manson、Dunn</td></tr><tr><td>（遮罪／除罪 expiation）</td><td>除去罪本身</td><td>C. H. Dodd（多數學者認為此說削弱了1:18的忿怒主題）</td></tr></table><p>我認為兩者可以並存，且應該並存：</p><p>耶穌既是那個「地方」（施恩座），也是那個「祭」（挽回祭）。<br>祂是祭壇，也是祭物；是那被血遮蓋的地方，也是那流血的羔羊。</p><p>★ 亮光二：προέθετο ——公開擺出來</p><p>這個動詞的字面意思是「擺在前面」。</p><p>贖罪日的施恩座在哪裡？</p><p>- 在<b>至聖所</b>裡<br>- 在<b>幔子後面</b><br>- <b>一年只有一次</b><br>- <b>只有一個人</b>看得見</p><p>保羅說：神把它 προέθετο——公開擺出來了。</p><p>從前藏在幔子後面的，如今掛在城外的山頭上；<br>從前只有大祭司能看的，如今全世界都看見了；<br>從前一年一次的，如今一次永遠成就了。</p><p>所以主耶穌斷氣的那一刻——</p><p><b>「忽然，殿裡的幔子從上到下裂為兩半。」</b>（太27:51）</p><p>幔子不需要了。施恩座已經公開了。</p><p>★ 亮光三：πάρεσις 不是 ἄφεσις</p><p>這是本節最精細、也最容易被中文譯本蓋住的一個字。</p><table><tr><th>字</th><th>意思</th><th>出現</th></tr><tr><td><b>ἄφεσις</b></td><td><b>赦免、免除</b>（債務被取消）</td><td>新約常用（弗1:7「過犯得以赦免」）</td></tr><tr><td><b>πάρεσις</b></td><td><b>放過、暫時擱置</b>（債務被延後，尚未處理）</td><td><b>新約僅羅3:25一次</b></td></tr></table><p>保羅刻意不用「赦免」，而用了一個罕見的字：「放過去」。</p><p>他在說什麼？</p><p>舊約幾千年來，神一直在「賒帳」。</p><p>亞伯的祭、挪亞的祭、亞伯拉罕的公羊、逾越節的羊羔、聖殿裡千千萬萬的牛羊——</p><p>「因為公牛和山羊的血，斷不能除罪。」（來10:4）</p><p>那些祭只是一張欠條，不是付款。神一直在「放過去」，一直沒有結案。</p><p>而這就引出了一個天大的難題：神憑什麼放過？</p><p>如果神一直不追討罪，那祂就不公義。</p><p>保羅說：所以神在十字架上「顯明祂的義」（εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ）。</p><p>十字架不只是為我贖罪，十字架也是神為自己「洗清嫌疑」。<br>神在各各他向全宇宙證明：我從來沒有放縱過任何一件罪。所有的帳，都在這裡結清了。</p><p>★ 亮光四：ἐν τῇ ἀνοχῇ τοῦ θεοῦ 與2:4的呼應</p><p>3:26開頭「（他用）忍耐的心」原文是 <b>ἐν τῇ ἀνοχῇ τοῦ θεοῦ</b>。</p><p>ἀνοχή 這個字，保羅在羅馬書只用了兩次：</p><p>- <b>2:4</b>「你藐視他豐富的恩慈、<b>寬容</b>（ἀνοχή）、忍耐」<br>- <b>3:26</b>「他用忍耐的心<b>寬容</b>（ἀνοχή）人先時所犯的罪」</p><p>第二章說：神的寬容是在等你悔改。<br>第三章說：神之所以能寬容，是因為祂早就打算讓自己的兒子來付這筆帳。<br>神的忍耐不是心軟，是因為祂心裡已經有了各各他。</p>","exp":"<p>這一節回答了全本聖經最大的難題。</p><p>難題是：神怎麼可能既公義又赦罪？</p><p>- 一個法官若放走殺人犯，他就不是好法官<br>- 一個父親若不管孩子的錯，他就不是好父親<br>- <b>一個神若不追討罪，祂就不是公義的神</b></p><p>答案：神親自坐上了被告席。</p><p>祂把自己的兒子公開擺出來，作那個承受忿怒的地方。</p><p>於是：</p><p>- 罪被完全追討了 → <b>神是公義的</b><br>- 罪人被完全釋放了 → <b>神稱人為義</b></p><p>這兩件事在同一個十字架上同時成就。</p>"},{"a":26,"z":26,"star":false,"grk":"<p>ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.</p>","lit":"<p>「在神的寬容裡——為要在<b>這如今的時候</b>證明祂的義，好叫祂<b>自己是義的，同時又是那稱人為義的</b>，就是那本於信耶穌的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>今時</td><td>ἐν τῷ νῦν καιρῷ</td><td>en tō nyn kairō</td><td>G2540</td><td><b>這個決定性的時刻</b>（καιρός 是「時機」不是「時間長度」）</td></tr><tr><td>為義</td><td>δίκαιον</td><td>dikaion</td><td>G1342</td><td>形容詞：<b>祂自己是義的</b></td></tr><tr><td>稱……為義</td><td>δικαιοῦντα</td><td>dikaiounta</td><td>G1344</td><td><b>現在主動分詞</b>：正在稱人為義的那一位</td></tr></table>","gram":"<p>★ δίκαιον καὶ δικαιοῦντα ——全本聖經最精妙的一組並列</p><p>原文是同一個字根的兩個形式並排：</p><pre>δίκαιον      καὶ    δικαιοῦντα\n（義的）      和     （稱人為義的）\n形容詞              現在主動分詞</pre><p>中文「使人知道他自己為義，也稱信耶穌的人為義」已經很好，但原文的並列更緊——</p><p>兩個 δικαι- 字根緊挨著，像兩塊石頭砌在一起，中間只隔一個 καί。</p><p>英文有一句經典的翻譯：just and the justifier（既是公義的審判者，又是使人稱義者）。<br>這是十字架上發生的雙重奇蹟。</p><p>「今時」（ἐν τῷ νῦν καιρῷ）與3:21的 Νυνὶ δέ 呼應——保羅第二次強調「就是現在」。</p>","exp":"<p>這是全章的頂峰。</p><p>弟兄姊妹，人類歷史上有兩種「解決方案」：</p><table><tr><th>方案</th><th>結果</th></tr><tr><td>神只講公義</td><td>沒有一個人活得了</td></tr><tr><td>神只講慈愛</td><td>神就成了縱容罪的神，宇宙的道德根基崩塌</td></tr><tr><td><b>十字架</b></td><td><b>公義完全滿足，慈愛完全彰顯</b></td></tr></table><p>神沒有在公義與慈愛之間妥協——祂在十字架上讓兩者同時滿分。</p><p><b>「慈愛和誠實彼此相遇；公義和平安彼此相親。」</b>（詩85:10）</p><p>詩人所盼望的那一幕，在各各他發生了。</p><p>【第五段｜3:27–31　三個結論】</p>"},{"a":27,"z":28,"star":false,"grk":"<p>27 Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.<br>28 λογιζόμεθα γὰρ δικαιοῦσθαι πίστει ἄνθρωπον χωρὶς ἔργων νόμου.</p>","lit":"<p>27「那麼誇口在哪裡？<b>它被關在外面了。</b> 藉著哪一種法？行為的嗎？不是，乃是藉著信的法。」<br>28「因為我們<b>算定</b>：人被稱義是憑著信，與律法的行為無關。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>誇口</td><td>καύχησις</td><td>kauchēsis</td><td>G2746</td><td>誇耀的行為（與2:17、2:23同字根）</td></tr><tr><td>沒有的了</td><td>ἐξεκλείσθη</td><td>exekleisthē</td><td>G1576</td><td>ἐκ + κλείω（關門）：<b>被關在門外了</b></td></tr><tr><td>看定了</td><td>λογιζόμεθα</td><td>logizometha</td><td>G3049</td><td><b>算定、結論</b>（2:3、2:26、4:3同字）</td></tr></table>","gram":"<p>① ἐξεκλείσθη ——最生動的一個被動式</p><p>字面意思：<b>「被關在門外」。</b></p><p>保羅沒有說「誇口是不好的」「我們應該謙卑一點」。他說：門關了，誇口進不來了。</p><p>② 「哪裡能誇口呢？」與第二章的呼應</p><p>- 2:17「又倚靠律法，且指著神<b>誇口</b>」<br>- 2:23「你指著律法<b>誇口</b>，自己倒犯律法」<br>- <b>3:27「哪裡能誇口呢？沒有可誇的了。」</b></p><p>第二章診斷了誇口的病，第三章把門關上。</p><p>③ λογιζόμεθα（我們看定了）——第四章的引信</p><p>同一個字在4:3爆炸：「亞伯拉罕信神，這就<b>算為</b>（ἐλογίσθη）他的義。」</p><p>保羅在3:28說「我們算定」，在4:3說「神算為」——人的計算與神的計算終於對上了。</p><p>④ 關於「因信稱義」的路德譯本爭議</p><p>馬丁路德在1522年的德文譯本中，把3:28譯為「<b>惟獨</b>因信（allein durch den Glauben）」，加了「惟獨」（allein）二字，引起激烈爭論。</p><p>平衡的評估：</p><p>- <b>文法上</b>：原文確實沒有「惟獨」這個字<br>- <b>意思上</b>：「χωρὶς ἔργων νόμου（與律法的行為無關）」在語意上等同於「惟獨因信」<br>- <b>路德自己的辯護</b>：德文表達否定對比時，自然需要加「allein」才通順</p><p>講台上的誠實作法：可以說「路德在翻譯時加了『惟獨』二字，引起很大爭議；他加的字原文沒有，但他要保護的意思，保羅這節確實說了。」</p>","exp":"<p>保羅在這裡做了一個極大膽的動作：他把「信」也稱為一種「法」（νόμος πίστεως，信主之法）。</p><p>這是文字遊戲，但有神學重量：</p><p>- 立功之法（νόμος τῶν ἔργων）：<b>我做，所以我得</b><br>- 信主之法（νόμος πίστεως）：<b>祂做了，所以我領受</b></p><p>兩種法，兩種人生，兩種宗教。</p><p>世上所有宗教都是「立功之法」；只有福音是「信主之法」。<br>所有宗教的動詞都是「做」；福音的動詞是「成了」。</p>"},{"a":29,"z":30,"star":false,"grk":"<p>29 ἢ Ἰουδαίων ὁ θεὸς μόνον; οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,<br>30 εἴπερ εἷς ὁ θεὸς ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.</p>","lit":"<p>29「還是說，神只是猶太人的神嗎？不也是外邦人的嗎？<b>是的，也是外邦人的</b>——」<br>30「<b>既然神只有一位</b>：祂要<b>本於信</b>稱受割禮的為義，也要<b>藉著信</b>稱未受割禮的為義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>神既是一位</td><td>εἷς ὁ θεός</td><td>heis ho theos</td><td>G1520</td><td><b>神是一位</b>——直指示瑪（申6:4）</td></tr><tr><td>因信（受割禮的）</td><td>ἐκ πίστεως</td><td>ek pisteōs</td><td>—</td><td><b>出於信</b>（來源）</td></tr><tr><td>因信（未受割禮的）</td><td>διὰ τῆς πίστεως</td><td>dia tēs pisteōs</td><td>—</td><td><b>藉著那信</b>（途徑）</td></tr></table>","gram":"<p>★ εἷς ὁ θεός ——保羅用示瑪來證明外邦人的福音</p><p>申命記6:4，猶太人每天早晚背誦的信仰告白（Shema）：</p><p><b>「以色列啊，你要聽！耶和華我們神是獨一的主。」</b>（שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד）</p><p><b>猶太人用這句話證明：</b>「只有我們敬拜真神。」</p><p><b>保羅用同一句話證明：</b>「所以外邦人也是祂的。」</p><p>保羅的邏輯：<br>如果神只有一位，而祂是全宇宙的神——<br>那祂就不可能只作一個民族的神。<br>一神論（monotheism）必然導出普世宣教。</p><p>這是全章最巧妙的一個論證：保羅拿猶太人最珍視的信條，證明了他們最不能接受的結論。</p><p>★ ἐκ πίστεως 與 διὰ τῆς πίστεως 的差別</p><p>保羅用了兩個不同的介詞：</p><p>- 受割禮的人：<b>ἐκ πίστεως</b>（出於信）<br>- 未受割禮的人：<b>διὰ τῆς πίστεως</b>（藉著那信）</p><p>兩種主要解釋：</p><p>1. <b>純修辭變化</b>——保羅只是為了文句變化（多數註釋家）<br>2. <b>有細微差別</b>——猶太人「從信而來」（他們是應許的後裔），外邦人「藉信而入」</p><p>無論如何，保羅的重點很清楚：兩者都是 πίστις（信）。方式的措辭可以不同，途徑只有一條。</p>","exp":"<p>第29節是一個非常安靜卻極其巨大的問題：「難道神只作猶太人的神嗎？」</p><p>這個問題今天仍然要問：</p><p>- 神只作「我們這一種基督徒」的神嗎？<br>- 神只作「我們這個宗派」的神嗎？<br>- 神只作「跟我一樣得救經歷的人」的神嗎？</p><p>保羅的回答：「是的，也作外邦人的神。」<br>凡是把神圈在自己群體裡的，都還沒有懂第三章。</p>"},{"a":31,"z":31,"star":false,"grk":"<p>νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ἱστάνομεν.</p>","lit":"<p>「那麼，我們藉著信<b>使律法失效</b>嗎？絕不可能！反而<b>使律法站立起來</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>廢了</td><td>καταργοῦμεν</td><td>katargoumen</td><td>G2673</td><td>使失效（與3:3同字）</td></tr><tr><td>堅固</td><td>ἱστάνομεν</td><td>histanomen</td><td>G2476</td><td>ἵστημι：<b>使之站立、確立、坐實</b></td></tr></table>","gram":"<p>① καταργέω 與 ἵστημι 的對比</p><p>- καταργέω：<b>使之癱倒、失效</b><br>- ἵστημι：<b>使之站起來</b></p><p>畫面：不是把律法推倒，是把律法扶正。</p><p>② 這一節與3:3的呼應</p><p>- 3:3「他們的不信就<b>廢掉</b>（καταργήσει）神的信嗎？」→ 不能<br>- 3:31「我們因信<b>廢了</b>（καταργοῦμεν）律法嗎？」→ 不是</p><p>保羅用同一個字開場、收場。</p>","exp":"<p>福音怎麼「堅固」律法？至少三個層面：</p><p>1. <b>福音成全了律法的要求</b>——基督完全遵行了律法（太5:17），且在十字架上滿足了律法的刑罰<br>2. <b>福音證實了律法的功用</b>——律法本來就不是用來稱義的，是用來知罪的（3:20）。<b>因信稱義讓律法終於回到它正確的位置。</b><br>3. <b>福音使律法能被遵行</b>——8:4「使律法的義成就在我們這……隨從聖靈的人身上」</p><p>這一節是第六至八章的門。保羅說完「因信稱義」，立刻把門打開：<br>恩典不會使人隨便，恩典會使律法第一次真的站起來。</p><p>這也是對3:8毀謗的最終回答：「我們可以作惡以成善嗎？」——不。恩典不廢律法，恩典堅固律法。</p>"}],"4":[{"a":1,"z":2,"star":false,"grk":"<p>1 Τί οὖν ἐροῦμεν εὑρηκέναι Ἀβραὰμ τὸν προπάτορα ἡμῶν κατὰ σάρκα;<br>2 εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα, ἀλλ' οὐ πρὸς θεόν.</p>","lit":"<p>1「那麼我們要說，我們肉身的<b>先祖</b>亞伯拉罕<b>發現</b>了什麼呢？」<br>2「因為若亞伯拉罕是憑行為被稱義，他就<b>有可誇的</b>——但在神面前卻沒有。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>祖宗</td><td>προπάτωρ</td><td>propatōr</td><td>G4310</td><td>πρό + πατήρ</td><td><b>先祖、始祖</b></td><td>全新約僅此一次</td></tr><tr><td>得了</td><td>εὑρηκέναι</td><td>heurēkenai</td><td>G2147</td><td>εὑρίσκω</td><td><b>找到、發現</b>（阿基米德「Eureka!」）</td><td>「他發現了什麼？」</td></tr><tr><td>憑著肉體</td><td>κατὰ σάρκα</td><td>kata sarka</td><td>G4561</td><td>—</td><td>按肉身、按血統</td><td>見下文文法討論</td></tr><tr><td>可誇的</td><td>καύχημα</td><td>kauchēma</td><td>G2745</td><td>καυχάομαι</td><td><b>誇口的內容／本錢</b></td><td>與3:27同字根</td></tr></table>","gram":"<p>① κατὰ σάρκα 該接在哪裡？</p><p>希臘文的語序造成兩種讀法：</p><table><tr><th>讀法</th><th>中譯</th><th>意思</th></tr><tr><td>接 προπάτορα</td><td>「我們<b>肉身的</b>祖宗亞伯拉罕」</td><td>血統上的先祖（和合本傾向此讀）</td></tr><tr><td>接 εὑρηκέναι</td><td>「亞伯拉罕<b>憑肉體</b>得了什麼」</td><td>靠自己的努力得了什麼</td></tr></table><p>兩種讀法都有力，且結論一致：亞伯拉罕靠自己什麼也沒得著。</p><p>② καύχημα 與 καύχησις 的細微差別</p><p>- <b>καύχησις</b>（3:27）＝ 誇口的<b>行為</b><br>- <b>καύχημα</b>（4:2）＝ 誇口的<b>本錢／內容</b></p><p>保羅在3:27說「誇口的行為被關在門外」；在4:2說「連誇口的本錢都沒有」。</p><p>③ ἀλλ' οὐ πρὸς θεόν（只是在神面前並無可誇）</p><p>這半句是全節的轉折。保羅的意思不是「亞伯拉罕真的有可誇的，只是不敢誇」，而是：</p><p>在人面前，亞伯拉罕確實是個偉大的人物——離開本地、接待客旅、為所多瑪代求、獻上以撒。<br>但把他放在神面前（πρὸς θεόν），這些全都不是他的本錢。</p>","exp":"<p>保羅為什麼從亞伯拉罕開始？</p><p>因為在猶太人心中，<b>如果有一個人靠行為站得住，那一定是亞伯拉罕</b>。</p><p>保羅的策略是：我不跟你辯論小人物，我直接處理你們最大的那一位。</p><p>如果連亞伯拉罕都沒有可誇的，那就沒有人有了。</p><p><b>經文本身明確表達的：</b> 亞伯拉罕若因行為稱義就有可誇的，但在神面前他沒有。<br><b>合理推論的生命應用：</b> 每個人心裡都有一份「我還算不錯」的清單。保羅要做的第一件事，就是把那份清單拿到神面前——在那裡，它會安靜下來。</p>"},{"a":3,"z":3,"star":true,"grk":"<p>τί γὰρ ἡ γραφὴ λέγει; ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.</p>","lit":"<p>「因為聖經說什麼呢？『亞伯拉罕<b>信了</b>神，這就<b>被算入</b>他的帳上，成為義。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>經上</td><td>ἡ γραφή</td><td>hē graphē</td><td>G1124</td><td>γράφω（寫）</td><td><b>那被寫下來的</b>（＝聖經）</td><td>保羅訴諸最終權威</td></tr><tr><td>信</td><td>ἐπίστευσεν</td><td>episteusen</td><td>G4100</td><td>πιστεύω</td><td><b>信靠、託付</b>（不只是「相信有」）</td><td>不定過去式：一個具體的時刻</td></tr><tr><td>算</td><td>ἐλογίσθη</td><td>elogisthē</td><td>G3049</td><td>λογίζομαι</td><td><b>記入帳冊、計算入列</b></td><td><b>不定過去被動式</b>（見下）</td></tr><tr><td>義</td><td>δικαιοσύνη</td><td>dikaiosynē</td><td>G1343</td><td>δίκαιος</td><td>義的地位</td><td>法庭用語</td></tr></table>","gram":"<p>① λογίζομαι 的商業背景</p><p>這個字在第一世紀的蒲草紙文獻中，是標準的記帳用語：</p><p>- 把一筆款項<b>記入某人的帳戶</b><br>- 計算、結算<br>- 認定某物屬於某人</p><p>保羅選這個字，是刻意的。他要我們看見一本帳簿。</p><p>② ἐλογίσθη 是「神聖被動式」（divine passive）</p><p>被動語態，但沒有寫出施動者——因為施動者是神。</p><p>不是亞伯拉罕把義算給自己，是神把義算給他。</p><p>這一點極其重要：整章的動作，主詞都是神。</p><p>③ εἰς δικαιοσύνην 的介詞用法</p><p>εἰς + 直接受格 ＝ <b>「算入……成為……」</b></p><p>這是會計術語：把一筆進帳歸入「義」這個科目。</p><p>④「算為義」在原文中的細節</p><p>創15:6希伯來原文：וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה（wayyachshəbehā lō ṣədāqāh）</p><p>- <b>חָשַׁב（chashav, H2803）</b>＝思想、計算、認定<br>- 這個字也用於：「你們的意思是要害我，但神的意思<b>原是好的</b>」（創50:20，同字根）</p><p>保羅所引的希臘文 λογίζομαι，正是七十士譯本對 חָשַׁב 的標準翻譯。</p><p>這個文法對理解本節有什麼影響？<br>「算為義」不是說亞伯拉罕變成義人了，而是說：神在祂的帳本上，把「義」記在亞伯拉罕的名下。<br>這是地位的宣告，不是品格的描述。</p>","exp":"<p>保羅在這一節做了一件當時猶太人最不能接受的事：他把創15:6從創22（獻以撒）拆開了。</p><p>當時的標準讀法（《馬加比一書》2:52）是：亞伯拉罕在獻以撒的試驗中忠心，所以「這就算為他的義」。</p><p>保羅說：不對。請你翻開創世記，看看創15:6在哪裡。</p><p>它在第15章。獻以撒在第22章。<br>中間隔了七章、隔了幾十年。</p><p>神算他為義的時候，以撒都還沒出生。</p><p>這就是為什麼保羅說「經上說什麼呢？」——不是「傳統怎麼說」，是「經上怎麼寫的」。</p><p>聖經是我的準則。當傳統與經文衝突時，回到經文。</p>"},{"a":4,"z":5,"star":true,"grk":"<p>4 τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα,<br>5 τῷ δὲ μὴ ἐργαζομένῳ πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην·</p>","lit":"<p>4「對那作工的人，工資不是<b>按恩典</b>算給他，而是<b>按欠債</b>算的。」<br>5「但對那<b>不作工</b>、卻信靠那位<b>稱不敬虔之人為義</b>的神的人，他的信就被算為義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>作工的</td><td>ἐργαζομένῳ</td><td>ergazomenō</td><td>G2038</td><td>ἔργον（工作）</td><td>勞動者、受雇者</td><td>現在分詞：持續在作工的人</td></tr><tr><td>工價</td><td>μισθός</td><td>misthos</td><td>G3408</td><td>—</td><td><b>工資、報酬</b></td><td>日工每天領的錢</td></tr><tr><td>該得的</td><td>ὀφείλημα</td><td>opheilēma</td><td>G3783</td><td>ὀφείλω（欠）</td><td><b>欠款、債務</b></td><td>主禱文「免我們的債」同字根</td></tr><tr><td>罪人</td><td>ἀσεβής</td><td>asebēs</td><td>G765</td><td>ἀ + σέβομαι（敬拜）</td><td><b>不敬虔的、不敬拜神的</b></td><td><b>不是「做壞事的」，是「不敬神的」</b></td></tr><tr><td>稱……為義</td><td>δικαιοῦντα</td><td>dikaiounta</td><td>G1344</td><td>δίκαιος</td><td>宣告為義</td><td>現在主動分詞：那位正在稱人為義的</td></tr></table>","gram":"<p>① μισθός 與 ὀφείλημα：兩種「應得」</p><p>保羅畫出一條清楚的界線：</p><pre>作工 → 領工資 → 這叫「該得的」（ὀφείλημα, 債）\n不作工 → 信 → 這叫「恩典」（χάρις）</pre><p>關鍵洞見：如果稱義是工資，那神就欠我們。<br>而只要神欠我們，恩典就死了。</p><p>恩典與債務，在邏輯上不可能共存。</p><p>② ἀσεβής 的重量</p><p>這個字不是泛指「壞人」，而是特指「不敬虔、不把神當神的人」。</p><p>注意：這正是羅1:18的第一個字！</p><p>羅1:18「神的忿怒從天上顯明在一切<b>不虔不義</b>（ἀσέβειαν καὶ ἀδικίαν）的人身上。」</p><p>羅4:5「只信稱<b>不敬虔的人</b>（τὸν ἀσεβῆ）為義的神。」</p><p>同一個字根。</p><p>第一章那些神向他們發忿怒的人——第四章說，神稱他們為義。</p><p>這就是福音。</p><p>③ δικαιοῦντα τὸν ἀσεβῆ ——與舊約的正面衝突</p><p>這是全本聖經最大膽的一句話。因為律法明明說：</p><p><b>「不可殺無辜和有義的人，因我必不以惡人為義。」</b>（出23:7）<br><b>「定惡人為義的，定義人為惡的，這都為耶和華所憎惡。」</b>（箴17:15）</p><p>神自己說：「我必不以惡人為義。」<br>保羅說：「祂是那稱不敬虔的人為義的神。」</p><p>保羅是在說神自相矛盾嗎？</p><p>不是。保羅在第三章已經給了答案：</p><p><b>「神設立耶穌作挽回祭……使人知道他自己為義，也稱信耶穌的人為義。」</b>（3:25–26）</p><p>神沒有睜一隻眼閉一隻眼。<br>神在十字架上把罪徹底追討了——追討在祂兒子身上。<br>所以祂可以稱不敬虔的人為義，而自己仍然是義的。</p><p>④ πιστεύοντι ἐπὶ + 直接受格</p><p>「信靠<b>在</b>……之上」——這個介詞結構強調<b>信心的落點</b>。</p><p>信心的價值不在信心本身，在它靠在誰身上。</p>","exp":"<p>弟兄姊妹，4:5這一節，是整本聖經裡最不像宗教的一句話。</p><p><b>因為所有的宗教都說：</b>「你要努力，神才會接納你。」</p><p><b>保羅說：</b>「不作工的人，信那位稱不敬虔之人為義的神——他的信就算為義。」</p><p>這一節同時得罪了兩種人：</p><p>- <b>得罪了努力的人</b>：你的努力不能換來義<br>- <b>得罪了道德感強的人</b>：神怎麼可以稱惡人為義？</p><p>但這一節也拯救了兩種人：</p><p>- <b>拯救了那些累了的人</b>：你不必再賺了<br>- <b>拯救了那些覺得自己太糟的人</b>：祂正是專門稱不敬虔的人為義</p><p><b>經文本身明確表達的：</b> 稱義是恩典，不是工資；神所稱義的對象是不敬虔的人。<br><b>合理推論的生命應用：</b> 如果神稱義的對象是「不敬虔的人」，那我今天來到祂面前，最不需要做的一件事，就是先假裝自己夠好。</p>"},{"a":6,"z":8,"star":false,"grk":"<p>6 καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·<br>7 μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι·<br>8 μακάριος ἀνὴρ οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.</p>","lit":"<p>6「正如大衛也稱那人為<b>有福的</b>——就是神<b>在行為以外，把義算給他</b>的那人：」<br>7「<b>有福了</b>！那些過犯<b>得赦免</b>、罪<b>被遮蓋</b>的人；」<br>8「<b>有福了</b>！主<b>斷不算他有罪</b>的那人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>有福</td><td>μακάριος</td><td>makarios</td><td>G3107</td><td><b>有福的、蒙福的</b>（登山寶訓「八福」同字）</td></tr><tr><td>赦免</td><td>ἀφέθησαν</td><td>aphethēsan</td><td>G863</td><td><b>不定過去被動</b>：被搬走、被免除（ἄφεσις 的動詞）</td></tr><tr><td>遮蓋</td><td>ἐπεκαλύφθησαν</td><td>epekalyphthēsan</td><td>G1943</td><td>ἐπί + καλύπτω：<b>被蓋在上面</b></td></tr><tr><td>不算</td><td>οὐ μὴ λογίσηται</td><td>ou mē logisētai</td><td>G3049</td><td><b>雙重否定 ＋ 假設語氣：絕對不會算</b></td></tr></table>","gram":"<p>① 保羅為什麼引大衛？——「同字連結」的解經法</p><p>猶太拉比有一條解經規則：兩處經文若出現同一個關鍵字，就可以互相解釋（gezerah shavah）。</p><p>- 創15:6：<b>算</b>為他的義（正面：算入）<br>- 詩32:2：主<b>不算</b>為有罪（反面：不算入）</p><p>保羅用同一個字 λογίζομαι，把兩處經文扣在一起。</p><p>創世記說：神把「義」算進來。<br>詩篇說：神把「罪」不算進去。</p><p>同一本帳簿，兩個動作。</p><p>② οὐ μὴ λογίσηται 的雙重否定</p><p>希臘文中，οὐ μή + 假設語氣是最強的否定形式，意思是「絕對、永遠不會」。</p><p>中文「主不算為有罪」讀起來很平；原文的語氣是：</p><p>「主絕對、絕不、永遠不會把罪記到他帳上。」</p><p>③ 三個被動式</p><pre>ἀφέθησαν       被赦免（罪被搬走）\nἐπεκαλύφθησαν  被遮蓋（罪被蓋住）\nλογίσηται      不被算（罪不入帳）</pre><p>三個動作，主詞都是神。</p><p>④ 大衛寫詩篇32篇的處境</p><p>詩篇32篇的標題與內容，傳統上與大衛在拔示巴事件之後的悔改連在一起（參詩51篇）。</p><p>保羅選的兩位證人，一位是「因信被算為義」的亞伯拉罕，<br>另一位是「犯了姦淫與謀殺，卻蒙主不算為有罪」的大衛。</p><p>一個是最好的例子，一個是最壞的例子。<br>保羅要說：兩端都一樣——靠恩典。</p>","exp":"<p>注意大衛的三個動詞，是一個完整的過程：</p><table><tr><th>動詞</th><th>畫面</th><th>意義</th></tr><tr><td><b>赦免</b>（ἀφίημι）</td><td>把重擔<b>搬走</b></td><td>罪被移除</td></tr><tr><td><b>遮蓋</b>（ἐπικαλύπτω）</td><td>把東西<b>蓋起來</b></td><td>罪不再被看見</td></tr><tr><td><b>不算</b>（οὐ λογίζομαι）</td><td>帳簿上<b>不記這一筆</b></td><td>罪不再被追討</td></tr></table><p>弟兄姊妹，這三個動詞回答了三種不同的痛苦：</p><p>- <b>罪的重擔</b> → 被搬走了<br>- <b>罪的羞恥</b> → 被遮蓋了<br>- <b>罪的追討</b> → 不再入帳了</p><p>「遮蓋」這個字，讓人想起舊約的施恩座（כַּפֹּרֶת，字根 כָּפַר＝遮蓋）。<br>羅3:25說耶穌就是那個施恩座；羅4:7說罪被遮蓋了。<br>這兩章是同一個畫面的兩面。</p><p>【第二段｜4:9–12　時間順序的證明】</p>"},{"a":9,"z":10,"star":false,"grk":"<p>10 πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ' ἐν ἀκροβυστίᾳ·</p>","lit":"<p>10「那麼是<b>怎麼</b>算的？是在他<b>在割禮中</b>的時候，還是在他<b>在未受割禮中</b>的時候？不是在割禮中，乃是在未受割禮中。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>怎麼</td><td>πῶς</td><td>pōs</td><td>G4459</td><td>如何、在什麼情況下</td></tr><tr><td>在割禮中</td><td>ἐν περιτομῇ</td><td>en peritomē</td><td>G4061</td><td><b>狀態的表達</b>：處於受割禮的身分中</td></tr><tr><td>未受割禮</td><td>ἀκροβυστία</td><td>akrobystia</td><td>G203</td><td>未受割禮的狀態（＝外邦人身分）</td></tr></table>","gram":"<p>① πῶς（怎麼）其實是在問「什麼時候」</p><p>保羅問的是「在什麼情況、什麼身分底下」被算為義的。</p><p>② 這是全章最漂亮的一擊：一個純粹的年代學論證</p><table><tr><th>事件</th><th>出處</th><th>年齡</th></tr><tr><td>信神，算為義</td><td>創15:6</td><td>約85歲前</td></tr><tr><td>以實瑪利出生</td><td>創16:16</td><td>86歲</td></tr><tr><td>受割禮</td><td>創17:24</td><td><b>99歲</b></td></tr></table><p>中間至少隔了十三、四年。</p><p>保羅不需要辯論神學。他只需要請你翻書。</p>","exp":"<p>弟兄姊妹，這一段的殺傷力在於：它完全不需要相信保羅，只需要相信創世記。</p><p>猶太人說：你要先受割禮，成為神的子民，才能被神接納。</p><p>保羅說：那你們的祖宗呢？他被算為義的那一天，他是什麼身分？</p><p>答案是：外邦人。</p><p>神算亞伯拉罕為義的那一天，他跟今天任何一個未受割禮的希臘人、羅馬人、中國人，身分是一樣的。</p>"},{"a":11,"z":12,"star":false,"grk":"<p>11 καὶ σημεῖον ἔλαβεν περιτομῆς σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ…</p>","lit":"<p>11「並且他領受了割禮的<b>記號</b>，作他在未受割禮時那因信之義的<b>印</b>……」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>記號</td><td>σημεῖον</td><td>sēmeion</td><td>G4592</td><td>—</td><td>指向別的東西的標記</td><td>割禮指向那已成的事</td></tr><tr><td>印證</td><td>σφραγίς</td><td>sphragis</td><td>G4973</td><td>—</td><td><b>印章、封印</b></td><td>官方認證的蓋章</td></tr><tr><td>蹤跡</td><td>ἴχνος</td><td>ichnos</td><td>G2487</td><td>—</td><td><b>腳印</b></td><td>「按……腳印去行」</td></tr></table>","gram":"<p>① σφραγίς（印）的第一世紀畫面</p><p>在羅馬世界，印章（sphragis）用於：</p><p>- 契約簽訂後<b>蓋印</b>確認<br>- 貨物封條，證明未被動過<br>- 官方文件的認證</p><p>關鍵在於順序：</p><p>印章從來不是在契約之前蓋的。<br>印章永遠是在事情已經成立之後，蓋上去確認的。</p><p>保羅說：割禮就是那個印。</p><p>② σημεῖον 與 σφραγίς 的並列</p><p>- <b>σημεῖον（記號）</b>＝ 指向某件事<br>- <b>σφραγίς（印證）</b>＝ 證實某件事</p><p>兩個字都預設：那件事已經先發生了。</p><p>③ ἴχνος（腳印）的畫面</p><p>4:12「按……蹤跡去行」——στοιχέω τοῖς ἴχνεσιν，字面是「踩著他的腳印走」。</p><p>保羅說：真正的亞伯拉罕子孫，不是有他血統的人，是踩著他腳印走的人。<br>而他的第一個腳印，是在他還沒有受割禮的時候踩下的。</p>","exp":"<p>這一段完成了一個驚人的翻轉：</p><p>猶太人說：亞伯拉罕是我們的父，外邦人若要有份，必須先受割禮加入我們。</p><p>保羅說：</p><p>亞伯拉罕先是「未受割禮而信之人的父」（4:11），<br>然後才是「受割禮之人的父」（4:12）。</p><p>順序反過來了。</p><p>而且4:12加了一個限定：他作受割禮之人的父，只限於那些「按亞伯拉罕未受割禮而信之蹤跡去行的人」。</p><p>換句話說：血統不夠。你必須也有他的信心。</p><p>這與第二章2:28–29完全呼應：「外面作猶太人的，不是真猶太人。」</p><p>今天的應用同樣尖銳：</p><p>- 受洗是印，不是條件<br>- 會員身分是印，不是條件<br>- 那些屬靈的記號都是好的、都是神所設立的——<b>但它們是蓋在後面的章，不是排在前面的門票。</b></p><p>【第三段｜4:13–17　應許不憑律法】</p>"},{"a":13,"z":13,"star":false,"grk":"<p>Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως.</p>","lit":"<p>「因為那應許——就是他要作<b>世界的承受者</b>——並不是藉著律法臨到亞伯拉罕或他的後裔，乃是藉著信的義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>應許</td><td>ἐπαγγελία</td><td>epangelia</td><td>G1860</td><td><b>主動提出的承諾</b>（不是回應請求的答應）</td></tr><tr><td>承受</td><td>κληρονόμος</td><td>klēronomos</td><td>G2818</td><td>κλῆρος（籤、產業）+ νέμω：<b>繼承人</b></td></tr><tr><td>世界</td><td>κόσμος</td><td>kosmos</td><td>G2889</td><td>全世界</td></tr></table>","gram":"<p>① ἐπαγγελία 與 συνθήκη 的差別</p><p>希臘世界有兩個字可用於「約」：</p><p>- <b>συνθήκη</b>＝雙方談判達成的協議（bilateral）<br>- <b>διαθήκη／ἐπαγγελία</b>＝<b>單方面立定的遺囑／應許</b>（unilateral）</p><p>七十士譯本刻意選用 διαθήκη 來翻譯希伯來文的 בְּרִית（berith，約）——因為神的約不是談判來的，是神自己立的。</p><p>應許的性質決定了它的穩固性：一份需要雙方履約的合同，只要一方失敗就破裂；<br>一份單方面的遺囑，只取決於立囑者。</p><p>② κληρονόμος κόσμου（承受世界）是從哪裡來的？</p><p>創世記的應許包括：</p><p>- 地土（創12:7、13:15、15:18）<br>- 萬國因你得福（創12:3、22:18）<br>- 多國的父（創17:5）</p><p>「承受世界」是保羅對這些應許的<b>綜合概括</b>——這在當時猶太傳統中已有先例（如《便西拉智訓》44:21；《禧年書》32:19）。</p><p>保羅在羅8:17把這條線接到我們身上：「既是兒女，便是後嗣，就是神的後嗣，和基督同作後嗣。」</p>","exp":"<p>保羅在此把論證推進了一層：</p><p>前面談的是「義」怎麼來的；現在談的是「產業」怎麼來的。</p><p>如果連義都是白白得的，那產業當然也是白白得的。<br>恩典是一整套邏輯，不是零星的優惠。</p>"},{"a":14,"z":15,"star":false,"grk":"<p>14 εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·<br>15 ὁ γὰρ νόμος ὀργὴν κατεργάζεται· οὗ δὲ οὐκ ἔστιν νόμος οὐδὲ παράβασις.</p>","lit":"<p>14「因為若那些出於律法的人才是後嗣，信就<b>被掏空了</b>，應許也<b>被作廢了</b>。」<br>15「因為律法<b>製造出</b>忿怒；哪裡沒有律法，那裡也沒有<b>跨越界線</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>歸於虛空</td><td>κεκένωται</td><td>kekenōtai</td><td>G2758</td><td>κενόω：<b>被倒空、被掏空</b>（腓2:7「虛己」同字）</td></tr><tr><td>廢棄</td><td>κατήργηται</td><td>katērgētai</td><td>G2673</td><td><b>被使之失效</b>（3:3、3:31同字）</td></tr><tr><td>惹動</td><td>κατεργάζεται</td><td>katergazetai</td><td>G2716</td><td>κατά + ἐργάζομαι：<b>製造出、產生出</b>（強調結果）</td></tr><tr><td>過犯</td><td>παράβασις</td><td>parabasis</td><td>G3847</td><td>παρά + βαίνω：<b>跨越界線</b>（明知有線而踏過去）</td></tr></table>","gram":"<p>① 兩個完成被動式的重量</p><p>- <b>κεκένωται</b>（信被掏空）<br>- <b>κατήργηται</b>（應許被作廢）</p><p>完成式表示：一旦這樣，就永久成為這個狀態。</p><p>保羅在說：這不是「信會打點折扣」，是「信整個被清空」。</p><p>② κενόω 的驚人平行</p><p>這個字在腓立比書2:7用在耶穌身上：「反倒虛己（ἐκένωσεν）。」</p><p>基督為我們虛己，好叫我們的信不至於虛空。</p><p>③ παράβασις 與 ἁμαρτία 的差別</p><p>- <b>ἁμαρτία</b>（罪）＝射不中靶（普遍的罪性）<br>- <b>παράβασις</b>（過犯）＝<b>跨越一條明確畫出的線</b></p><p>保羅在4:15說：「哪裡沒有律法，那裡就沒有過犯。」</p><p>注意：他沒有說「哪裡沒有律法，那裡就沒有罪」！</p><p>這是本節最容易被誤讀的地方。<br>沒有律法的地方仍然有罪（羅5:13–14已說明），但沒有「跨越明線」這種特定形式的罪。<br>律法把罪從模糊變成清楚——所以律法加重了罪的性質。</p>","exp":"<p>保羅為什麼說「律法是惹動忿怒的」？</p><p>因為律法把界線畫出來了。畫出來之後，人踩過去，那就不只是「不好」，是「違法」。</p><p>一條路上沒有速限標誌，你開90公里，是危險。<br>一條路上寫著「限速60」，你開90公里，是違規。</p><p>標誌沒有讓你開得更快。標誌讓你的快，變成罪狀。</p><p>所以保羅的結論是：如果產業要靠律法來得，那我們得到的不是產業，是忿怒。</p>"},{"a":16,"z":17,"star":true,"grk":"<p>16 Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι…<br>17 …κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα.</p>","lit":"<p>16「因此就本於信，好叫它<b>照著恩典</b>，使那應許對一切後裔都是<b>確定不移的</b>……」<br>17「……在他所信的神面前——那位<b>使死人活過來、並且呼叫那不存在的，如同存在的</b>神。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>定然</td><td>βέβαιος</td><td>bebaios</td><td>G949</td><td>βαίνω（走、站）</td><td><b>穩固的、站得住的、有法律效力的</b></td><td>商業用語：擔保有效</td></tr><tr><td>叫死人復活</td><td>ζῳοποιοῦντος</td><td>zōopoiountos</td><td>G2227</td><td>ζωή（生命）+ ποιέω（造）</td><td><b>使之活過來</b></td><td>現在分詞：<b>祂一直在做的事</b></td></tr><tr><td>使無變為有</td><td>καλοῦντος τὰ μὴ ὄντα ὡς ὄντα</td><td>—</td><td>G2564</td><td>καλέω（呼叫）</td><td><b>呼叫那不存在的，如同存在的</b></td><td>創造的語言</td></tr></table>","gram":"<p>① βέβαιος 的商業意義</p><p>這個字在第一世紀的契約文書中，指「具有法律效力、可強制執行的擔保」。</p><p>保羅說：應許之所以「定然」（βεβαίαν），正是因為它本於信、屬乎恩。</p><p>這是全章的邏輯核心：</p><p>如果應許憑我的表現 → 我的表現會變 → 應許就不穩<br>如果應許憑神的恩典 → 神不會變 → 應許就穩如泰山</p><p>恩典不是神的軟弱，恩典是應許唯一可能穩固的方式。</p><p>② 兩個現在分詞，描寫神是誰</p><pre>τοῦ ζῳοποιοῦντος τοὺς νεκρούς      —— 那使死人活過來的\nκαὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα  —— 那呼叫無有如同有的</pre><p>兩個都是現在式分詞——不是「祂曾經做過」，是「祂一直是這樣的一位」。</p><p>這是聖經對神的兩大工作的濃縮：</p><table><tr><th>分詞</th><th>神的作為</th><th>聖經例證</th></tr><tr><td>使死人活</td><td><b>復活</b></td><td>出埃及、以西結枯骨、耶穌復活</td></tr><tr><td>呼無為有</td><td><b>創造</b></td><td>創1「神說……就有了」</td></tr></table><p>亞伯拉罕的處境需要哪一位神？</p><p>他一百歲，身體如同已死 → 他需要「叫死人復活」的神<br>撒拉的生育斷絕，沒有孩子 → 他需要「使無變為有」的神</p><p>保羅對神的描述，完全對準亞伯拉罕的絕境。</p><p>③ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα 的兩種理解</p><table><tr><th>理解</th><th>意思</th></tr><tr><td><b>創造性的呼喚</b></td><td>神一呼喚，無就變成有（創1；來11:3）</td></tr><tr><td><b>應許的確定性</b></td><td>神說了，還沒發生的事就已經算數了</td></tr></table><p>兩者可以並存，且都符合上下文：</p><p>神說「我已經立你作多國的父」（創17:5）的時候，亞伯拉罕有幾個兒子？</p><p>一個都沒有。</p><p>但神用的是完成式：「我<b>已經</b>立你」。</p><p>④ 創17:5的引文</p><p>「從此以後，你的名不再叫亞伯蘭，要叫亞伯拉罕，因為我已立你作多國的父。」</p><p>- <b>亞伯蘭（אַבְרָם）</b>＝「尊貴的父」<br>- <b>亞伯拉罕（אַבְרָהָם）</b>＝「多國的父」</p><p>神把他的名字改成「多國的父」的那一天，他連一個兒子都沒有。</p><p>從那天起，每一次有人叫他的名字，就是在對著一個沒有孩子的老人說：「嘿，多國的父！」</p><p>他等了整整二十五年（創12:4，75歲蒙召；創21:5，100歲得以撒）。</p><p>二十五年，被人叫了二十五年「多國的父」。</p>","exp":"<p>這一節把「信心」的定義往前推了一大步。</p><p>信心不是一種正面思考，不是一種心理狀態，不是「我覺得會成」。</p><p>信心是：認識神是誰。</p><p>亞伯拉罕的信心之所以站得住，不是因為他的信心很強，是因為他所信的那位——</p><p>是叫死人復活的神。<br>是使無變為有的神。</p><p>而4:24馬上就要說：我們信的，也正是這一位——「我們這信神使我們的主耶穌從死裡復活的人」。</p><p>亞伯拉罕的信與基督徒的信，對象完全一樣。<br>他信神能使一個死了的身體生出孩子；我們信神使一個死了的身體從墳墓裡出來。</p><p>【第四段｜4:18–22　信心的解剖】</p>"},{"a":18,"z":18,"star":false,"grk":"<p>ὃς παρ' ἐλπίδα ἐπ' ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· οὕτως ἔσται τὸ σπέρμα σου.</p>","lit":"<p>「他<b>逆著指望，靠著指望</b>，信了——以致他成為多國的父，正如所說的：『你的後裔將要如此。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>在無可指望的時候</td><td>παρ' ἐλπίδα</td><td>par' elpida</td><td>G1680</td><td>παρά + 直接受格：<b>違反、逆著</b>指望</td></tr><tr><td>因信仍有指望</td><td>ἐπ' ἐλπίδι</td><td>ep' elpidi</td><td>G1680</td><td>ἐπί + 與格：<b>建立在</b>指望之上</td></tr></table>","gram":"<p>★ παρ' ἐλπίδα ἐπ' ἐλπίδι ——全本聖經最美的一個文字對句</p><p>同一個字（ἐλπίς，指望）用了兩次，配兩個不同的介詞：</p><pre>παρ' ἐλπίδα   —— 逆著指望（人的角度：完全沒有希望）\nἐπ' ἐλπίδι    —— 靠著指望（神的角度：站在應許上）</pre><p>中文「在無可指望的時候，因信仍有指望」已經譯得很好，但看不出這是同一個字的兩次運用。</p><p>保羅在說：真正的信心，一隻腳踩在絕望裡，一隻腳踩在應許上。</p><p>信心不是看不見絕望，信心是看見了絕望，仍然站在應許上。</p><p>這是全本聖經對信心最精準的一句描寫。</p>","exp":"<p>弟兄姊妹，很多人以為信心就是「不要去想那些不好的」。</p><p>保羅說：不是。</p><p>亞伯拉罕的信心，不是他沒看見絕望。下一節就要說了：他「想到自己的身體如同已死」。</p><p>他看得清清楚楚。</p><p>他只是同時看見了另一件事：那位說話的神，是叫死人復活的神。</p>"},{"a":19,"z":21,"star":true,"grk":"<p>19 καὶ μὴ ἀσθενήσας τῇ πίστει κατενόησεν τὸ ἑαυτοῦ σῶμα [ἤδη] νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας·<br>20 εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλ' ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ<br>21 καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.</p>","lit":"<p>19「他在信心上沒有軟弱，<b>仔細察看</b>了自己那已經<b>死透了的</b>身體（他約一百歲了），以及撒拉子宮的<b>死狀</b>；」<br>20「面對神的應許，他沒有因不信而<b>搖擺不定</b>，反而<b>被賦予能力</b>——藉著信，<b>把榮耀歸給神</b>，」<br>21「並且<b>被完全充滿地確信</b>：神所應許的，祂也<b>有能力</b>成就。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>想到</td><td>κατενόησεν</td><td>katenoēsen</td><td>G2657</td><td>κατά + νοέω</td><td><b>仔細審視、認真思量</b></td><td><b>不是瞄一眼，是盯著看</b></td></tr><tr><td>如同已死</td><td>νενεκρωμένον</td><td>nenekrōmenon</td><td>G3499</td><td>νεκρός（死人）</td><td><b>完成被動分詞：已經死透了</b></td><td>極強烈的用字</td></tr><tr><td>生育斷絕</td><td>νέκρωσις</td><td>nekrōsis</td><td>G3500</td><td>νεκρός</td><td><b>死亡的狀態</b></td><td>名詞：撒拉子宮的「死」</td></tr><tr><td>起疑惑</td><td>διεκρίθη</td><td>diekrithē</td><td>G1252</td><td>διά + κρίνω</td><td><b>被撕成兩半、搖擺不定</b></td><td>雅1:6「疑惑的人」同字</td></tr><tr><td>得堅固</td><td>ἐνεδυναμώθη</td><td>enedynamōthē</td><td>G1743</td><td>ἐν + δύναμις</td><td><b>被賦予能力</b>（被動！）</td><td>不是自己變強，是被加力</td></tr><tr><td>滿心相信</td><td>πληροφορηθείς</td><td>plērophorētheis</td><td>G4135</td><td>πλήρης + φέρω</td><td><b>被完全裝滿、被載到滿</b></td><td>被動分詞</td></tr></table>","gram":"<p>① κατανοέω：他不是逃避現實，他是直視現實</p><p>這個字的意思是「仔細地、專注地觀察」。</p><p>（同字用於太7:3「看見弟兄眼中的刺」；來3:1「思想我們所認為使者、為大祭司的耶穌」）</p><p>保羅刻意告訴我們：亞伯拉罕把自己的身體看得清清楚楚。</p><p>信心不是自我催眠。信心是把事實看透，然後看見一位更大的事實。</p><p>② νενεκρωμένον 完成被動分詞的力度</p><p>不是「有點老」「不太行了」，是「<b>已經死透了、且維持在死的狀態</b>」。</p><p>保羅用了兩個「死」字（νεκρόω／νέκρωσις）來形容這對老夫婦的生育能力。</p><p>這正好對上4:17：「那叫死人復活的神。」</p><p>保羅是故意的：他先讓你看見兩具「死了」的身體，好叫「叫死人復活的神」這句話有具體的內容。</p><p>③ διακρίνω：不是「懷疑」，是「被撕成兩半」</p><p>這個字的字面意思是「一分為二」。</p><p>用在心裡，指的是<b>心被分裂成兩邊，來回搖擺</b>。</p><p>（雅1:6「疑惑的人，就像海中的波浪，被風吹動翻騰」——同字）</p><p>不信不一定是「我不相信」，更常見的是「我一半相信、一半不相信」。</p><p>④ ἐνεδυναμώθη：被動語態的關鍵</p><p>「因信心裡得堅固」——原文是被動式：<b>他被賦予了能力</b>。</p><p>這一點極其重要：</p><p>亞伯拉罕不是靠意志力把自己撐強的。<br>是他信的時候，力量被加給他。</p><p>信心不是我們生產能力的引擎，信心是我們接受能力的管道。</p><p>⑤ δοὺς δόξαν τῷ θεῷ（將榮耀歸給神）與1:21的完全逆轉</p><p>羅1:21：「他們雖然知道神，卻不當作神榮耀祂（οὐχ ὡς θεὸν ἐδόξασαν）。」<br>羅4:20：「將榮耀歸給神（δοὺς δόξαν τῷ θεῷ）。」</p><p>保羅用了三章半來描寫「不榮耀神」的世界；在第四章，他終於給我們看見一個榮耀神的人。</p><p>而他榮耀神的方式，不是獻祭，不是奉獻，不是服事——<br>是相信。</p><p>原來相信神所應許的，本身就是把榮耀歸給神。</p><p>因為不信，等於說「神做不到」；信，等於說「祂做得到」。</p><p>⑥ πληροφορέω 的畫面</p><p>這個字的字面是「被裝滿到頂」，也用於「船隻滿帆前行」。</p><p>保羅描寫的信心不是勉強擠出來的，是被神的應許灌滿的。</p>","exp":"<p>弟兄姊妹，這三節是全本聖經對信心最完整的解剖。我們把它拆開來看：</p><table><tr><th>層面</th><th>經文</th><th>內容</th></tr><tr><td><b>信心正視事實</b></td><td>4:19</td><td>他「仔細察看」了自己死透的身體</td></tr><tr><td><b>信心不搖擺</b></td><td>4:20</td><td>他沒有被撕成兩半</td></tr><tr><td><b>信心是被加力的</b></td><td>4:20</td><td>他「被賦予能力」（被動式）</td></tr><tr><td><b>信心榮耀神</b></td><td>4:20</td><td>他把榮耀歸給神</td></tr><tr><td><b>信心的焦點是神的能力</b></td><td>4:21</td><td>「神所應許的，<b>祂</b>必能做成」</td></tr></table><p>請注意最後一句的重點：不是「這件事一定會成」，是「<b>祂</b>有能力成就」。</p><p>信心的焦點不在事情上，在神身上。</p><p>這也解釋了一個常見的困惑：</p><p>創世記其實記載了亞伯拉罕好幾次的失敗——兩次因害怕謊稱撒拉是妹妹（創12、20）、聽從撒拉納夏甲（創16）、聽見應許時俯伏喜笑（創17:17）。</p><p>保羅為什麼完全不提？</p><p>因為保羅不是在寫亞伯拉罕的傳記，是在解釋創15:6這一節。<br>而且更深的原因是：神稱他為義之後，神看他的方式改變了。</p><p>「主不算為有罪的，這人是有福的。」（4:8）</p><p>保羅在第四章對亞伯拉罕的描寫，就是那本「不算為有罪」的帳簿長什麼樣子。</p>"},{"a":22,"z":24,"star":false,"grk":"<p>23 Οὐκ ἐγράφη δὲ δι' αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ<br>24 ἀλλὰ καὶ δι' ἡμᾶς, οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν</p>","lit":"<p>22「所以，<b>這就算為他的義</b>。」<br>23「而『<b>算為他</b>』這句話，<b>不是單為他寫的</b>，」<br>24「<b>也是為我們寫的</b>——義<b>將要被算給</b>我們這些信靠那位<b>叫我們主耶穌從死裡復活之神</b>的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>寫</td><td>ἐγράφη</td><td>egraphē</td><td>G1125</td><td><b>不定過去被動：被寫下來了</b></td></tr><tr><td>將來得算</td><td>μέλλει λογίζεσθαι</td><td>mellei logizesthai</td><td>G3195</td><td><b>即將／必然要被算</b></td></tr><tr><td>使……復活</td><td>τὸν ἐγείραντα</td><td>ton egeiranta</td><td>G1453</td><td>ἐγείρω：<b>那位叫……起來的</b></td></tr></table>","gram":"<p>① 「不是單為他寫的」——保羅的解經觀</p><p>這是新約中一段極重要的「聖經觀」宣告：</p><p>舊約的記載不只是歷史，是為我們寫的。</p><p>（比較林前10:11「這些事……都是為警戒我們寫的」；羅15:4「從前所寫的聖經都是為教訓我們寫的」）</p><p>② τὸν ἐγείραντα Ἰησοῦν ἐκ νεκρῶν ——信心對象的接續</p><p>請把4:17與4:24放在一起看：</p><pre>4:17  亞伯拉罕所信的，是那 叫死人復活 的神\n4:24  我們所信的，是那 使耶穌從死裡復活 的神</pre><p>同一位神。同一種信心。同一個焦點。</p><p>亞伯拉罕信神能從一具「死了」的身體生出生命；<br>我們信神從一座墳墓裡叫出了生命。</p><p>中間隔了兩千年，信的是同一件事。</p>","exp":"<p>保羅在4:23–24做了一個溫柔的轉身。</p><p>前面二十二節，他一直在講一個四千年前的人。</p><p>然後他說：</p><p>「這句話不是單為他寫的……也是為我們寫的。」</p><p>弟兄姊妹，這意味著什麼？</p><p>創世記15:6那一節，神在寫的時候，就已經想到你了。</p>"},{"a":25,"z":25,"star":true,"grk":"<p>ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.</p>","lit":"<p>「祂<b>被交付</b>了，因著我們的<b>過犯</b>；並且祂<b>被使復活</b>了，因著我們的<b>稱義</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>被交給人</td><td>παρεδόθη</td><td>paredothē</td><td>G3860</td><td>παρά + δίδωμι：<b>被交付出去</b>（不定過去被動）</td></tr><tr><td>過犯</td><td>παράπτωμα</td><td>paraptōma</td><td>G3900</td><td>παρά + πίπτω（跌倒）：<b>失足、跌倒過線</b></td></tr><tr><td>復活</td><td>ἠγέρθη</td><td>ēgerthē</td><td>G1453</td><td><b>被使起來</b>（不定過去被動）</td></tr><tr><td>稱義</td><td>δικαίωσις</td><td>dikaiōsis</td><td>G1347</td><td><b>稱義的行動／宣告</b>（新約僅羅4:25、5:18兩次）</td></tr></table>","gram":"<p>① 完美的對稱結構</p><pre>ὃς παρεδόθη  διὰ τὰ παραπτώματα  ἡμῶν\n   （
