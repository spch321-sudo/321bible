. Perfect = it happened, and the effect stands; passive = <b>he did not set himself apart</b>.</p><p>And there is an irony here: the word “Pharisee” very likely derives from a root meaning <b>“to separate.”</b> Paul had once been separated to the law; now God has separated him to the gospel.</p><p>· <b>εἰς εὐαγγέλιον</b>: εἰς + accusative marks <b>goal or belonging</b> — set apart <b>into</b> the gospel.</p>","exp":"<p>Paul’s self-introduction sets up the whole spiritual logic of the letter:</p><p><b>The true order of a life is not “what am I to do,” but “whose am I.”</b></p><p><b>What the text plainly says:</b> Paul’s apostleship was not self-conferred, and the gospel is not his product — it is <b>God’s</b> gospel (θεοῦ, a subjective genitive: it comes from God and belongs to God).</p><p><b>What may fairly be drawn from it:</b> a person gripped by the gospel does not begin by saying <b>“who I am,” but “whose I am.”</b></p>"},{"a":2,"z":2,"star":false,"grk":"<p>ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις</p>","lit":"<p>“which he <b>promised beforehand</b> through his prophets <b>in the holy Scriptures</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>promised before</td><td>προεπηγγείλατο</td><td>proepēngeilato</td><td>G4279</td><td>πρό (beforehand) + ἐπαγγέλλομαι (to promise); <b>only twice in the NT</b> (Romans 1:2; 2 Corinthians 9:5)</td></tr><tr><td>holy Scriptures</td><td>γραφαῖς ἁγίαις</td><td>graphais hagiais</td><td>G1124</td><td><b>holy writings</b> — here, the Old Testament</td></tr></table>","gram":"<p>· <b>προεπηγγείλατο</b> is aorist middle indicative, third singular. The subject is God (carried over from θεοῦ in verse 1).</p><p>· <b>διά + genitive</b> marks agency: <b>the prophets were the channel, not the source.</b></p>","exp":"<p><b>The gospel is not a new invention.</b> This is a stake Paul drives in at the very start: for Jewish readers, the gospel is not a betrayal of the ancestral faith but the honouring of a promise; for Gentile readers, this faith is not a new religious movement but a promise with roots, with history, and with God’s own signature on it.</p><p><b>Its place in redemptive history:</b> from Genesis 3:15, the seed of the woman; to the covenant with Abraham; to the covenant with David (2 Samuel 7); to Isaiah’s Servant Songs; to Jeremiah’s new covenant — <b>the whole Old Testament is pointing at one man.</b></p><p><b>The gospel is not plan B.</b></p>"},{"a":3,"z":4,"star":false,"grk":"<p>περὶ τοῦ υἱοῦ αὐτοῦ τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα, τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν</p>","lit":"<p>“concerning his Son — who, according to the flesh, <b>came</b> of the seed of David; who, according to the Spirit of holiness, <b>was appointed</b> Son of God <b>in power</b> by the resurrection from the dead — Jesus Christ our Lord.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>born</td><td>γενομένου</td><td>genomenou</td><td>G1096</td><td><b>to become, to come to be</b></td><td>not γεννάω (to beget) — “became,” hinting at incarnation</td></tr><tr><td>declared / appointed</td><td>ὁρισθέντος</td><td>horisthentos</td><td>G3724</td><td><b>to mark a boundary; to appoint, to install</b></td><td>the source of English “horizon”</td></tr><tr><td>power</td><td>δυνάμει</td><td>dynamei</td><td>G1411</td><td>power</td><td>answering to “the power of God” in 1:16</td></tr><tr><td>Spirit of holiness</td><td>πνεῦμα ἁγιωσύνης</td><td>pneuma hagiōsynēs</td><td>G4151 / G42</td><td>the Spirit of holiness</td><td>a rare phrase, possibly a Semitism</td></tr></table>","gram":"<p>· <b>τοῦ γενομένου</b> and <b>τοῦ ὁρισθέντος</b>: two articular participles in exact parallel — one aorist middle, one aorist passive.</p><p>· <b>ὁρισθέντος</b> is aorist passive — <b>the Father appointed him</b>. The ordinary sense of ὁρίζω is <b>to appoint, to install</b>, not merely “to declare” (Acts 10:42, “ordained by God”; Acts 17:31, “the man whom he has appointed”).</p><p>· <b>κατὰ σάρκα / κατὰ πνεῦμα ἁγιωσύνης</b>: two parallel κατά + accusative phrases marking <b>two spheres or two stages of existence</b>, not a division between “humanity” and “deity.”</p><p>· Verses 3–4 are very likely <b>a confession already in use in the early church</b> that Paul is quoting (the rhythm is regular and the vocabulary untypical of him). That makes it weightier still: <b>this is not merely Paul’s faith, but the church’s.</b></p>","exp":"<p>There is a point here that must be clarified — and more precisely than it usually is.</p><p><b>ὁρισθέντος certainly does not mean that Jesus “became the Son of God only after the resurrection.”</b> That is the adoptionist heresy, and in any case verse 3 has already called him <b>“his Son”</b> — so he was Son before the incarnation.</p><p>But it is also not right to flatten ὁρίζω into “declared.” The ordinary sense of the word is <b>to appoint, to install, to establish</b>. So a reading closer to the Greek — and to redemptive history — is:</p><p><b>the one who was always the Son has now, by the resurrection, been installed by the Father as Son of God in power</b> — that is, enthroned as the reigning Messiah-King.</p><p>This is the same line as Acts 13:33, which applies Psalm 2:7 (“you are my Son; today I have begotten you”) to the resurrection. And Psalm 2 is <b>an enthronement psalm</b>. So:</p><p><b>His identity did not change. His office entered a new stage.</b><br>From “David’s son in weakness” to <b>“Son of God in power”</b> (ἐν δυνάμει modifies “Son of God”).</p><p>There is another detail often missed: <b>ἐξ ἀναστάσεως νεκρῶν</b> — “dead” is <b>plural</b>. Paul does not merely say “he rose”; he says <b>“by the resurrection of the dead.”</b></p><p>That is, Christ’s resurrection is not an isolated event but <b>the beginning of the general resurrection</b> — exactly as 1 Corinthians 15:20 says he is “the firstfruits of those who have fallen asleep.”</p><p><b>He is not the only one who will be raised. He is the first.</b></p><p><b>What the text plainly says:</b> Jesus is the promised son of David (the Messiah), and also the Son of God, powerfully declared by the resurrection.</p><p><b>What may fairly be drawn from it:</b> the content of the gospel <b>is not a set of doctrines but a person</b>. Paul says “the gospel of God… concerning his Son” — <b>the centre of the gospel is not “what you can get,” but “who he is.”</b></p>"},{"a":5,"z":5,"star":false,"grk":"<p>δι' οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ</p>","lit":"<p>“through whom we <b>received</b> grace and apostleship, for <b>the obedience of faith</b> among all the nations, <b>for the sake of his name</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>obedience of faith</td><td>ὑπακοὴ πίστεως</td><td>hypakoē pisteōs</td><td>G5218 / G4102</td><td>literally “the obedience of faith.” ὑπακοή = ὑπό (under) + ἀκούω (to hear): <b>obedience is, at root, listening from underneath the word</b></td></tr><tr><td>for his name</td><td>ὑπὲρ τοῦ ὀνόματος αὐτοῦ</td><td>—</td><td>G3686</td><td><b>for the sake of his name</b> — the final purpose</td></tr></table>","gram":"<p>The genitive πίστεως in “the obedience of faith” admits several readings:</p><p>1. <b>Genitive of apposition</b>: the obedience which <b>is</b> faith (faith itself is the act of obeying)<br>2. <b>Genitive of source</b>: the obedience that <b>springs from</b> faith<br>3. <b>Objective</b>: obedience directed toward the faith</p><p>Paul uses this phrase twice to frame the whole letter (1:5 and 16:26), and the best reading probably <b>combines the first two</b>: true faith necessarily produces obedience, and obedience is necessarily rooted in faith.</p><p>This answers a common misunderstanding at once: <b>justification by faith has never meant “believe, and then live however you like.”</b></p><p>And the last phrase matters most: <b>ὑπὲρ τοῦ ὀνόματος αὐτοῦ — for the sake of his name.</b></p><p>Not for Paul’s name, not for the church’s name, not for a ministry’s name. <b>The ultimate motive of mission is the glory of God.</b></p>","exp":"<p><b>What the text plainly says:</b> Paul’s apostleship was <b>received</b> (ἐλάβομεν); its aim is the obedience of faith among all nations; and its final direction is “for the sake of his name.”</p><p><b>What may fairly be drawn from it:</b> this verse places three things in order —</p><p><b>grace first</b> (you receive before you labour);<br><b>obedience next</b> (faith necessarily bears obedience);<br><b>his name last</b> (the end of everything).</p><p><b>That is the order of the 3-2-1: not doing first, but receiving first; not making a name for oneself, but for his name.</b></p><p><b>⚠ This phrase (εἰς ὑπακοὴν πίστεως) occurs only twice in the whole letter — 1:5 and 16:26. Paul used it to frame the entire book.</b></p>"},{"a":6,"z":7,"star":false,"grk":"<p>ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ, πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.</p>","lit":"<p>“Among whom you also are — <b>called of Jesus Christ</b>. To all who are in Rome, <b>beloved of God</b>, <b>called to be saints</b>: grace to you and peace from God our Father and the Lord Jesus Christ.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>beloved of God</td><td>ἀγαπητοῖς θεοῦ</td><td>agapētois theou</td><td>G27</td><td><b>beloved of God</b> — an Old Testament title for Israel (Deuteronomy 33:12; Psalm 60:5)</td></tr><tr><td>called saints</td><td>κλητοῖς ἁγίοις</td><td>klētois hagiois</td><td>G2822 / G40</td><td><b>called saints</b> — not an especially holy minority, but all who belong to God</td></tr><tr><td>grace and peace</td><td>χάρις καὶ εἰρήνη</td><td>charis kai eirēnē</td><td>G5485 / G1515</td><td><b>the Greek greeting and the Hebrew greeting joined</b> (see below)</td></tr></table>","gram":"<p>· <b>ἀγαπητοῖς θεοῦ</b>: this is what the Old Testament called Israel. <b>Paul gives it to Gentile believers in Rome.</b></p><p>· <b>κλητοῖς ἁγίοις</b>: ἅγιος fundamentally means <b>set apart to God</b>. <b>“Saints” is not a category of exceptional Christians; it is what every believer is.</b></p><p>· <b>χάρις καὶ εἰρήνη</b>: χάρις is a variation on the Greek greeting χαίρειν; εἰρήνη renders the Hebrew <b>shalom</b>. <b>Greek and Hebrew are made one inside the gospel. The greeting itself is a small sermon on unity.</b></p>","exp":"<p>Notice the echo between 1:1 and 1:7: Paul is <b>κλητὸς ἀπόστολος</b> (a called apostle); they are <b>κλητοὶ ἅγιοι</b> (called saints).</p><p><b>The same Lord, and the same kind of calling. Different office; identical standing.</b></p><p>And there is a further detail easily missed: <b>grace and peace come from “God our Father” and “the Lord Jesus Christ” together</b> — one preposition ἀπό governing both, setting Christ alongside the Father as the source of grace. <b>It is the highest christological statement, and Paul puts it inside the most ordinary greeting.</b></p>"},{"a":8,"z":10,"star":false,"grk":"<p>εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ … ᾧ λατρεύω ἐν τῷ πνεύματί μου … ἀδιαλείπτως … δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ</p>","lit":"<p>8 “First, I <b>thank my God</b> through Jesus Christ for you all — because your faith <b>is proclaimed throughout the whole world</b>.”</p><p>9 “For God is my witness — whom I <b>serve in my spirit</b> in the gospel of his Son — how <b>unceasingly</b> I make mention of you,”</p><p>10 “always in my prayers asking: <b>if somehow, now at last</b>, by the will of God, I may <b>be given a clear road</b> to come to you.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>serve</td><td>λατρεύω</td><td>latreuō</td><td>G3000</td><td><b>to serve in worship</b>; in the LXX, specifically <b>priestly service in the temple</b></td></tr><tr><td>unceasingly</td><td>ἀδιαλείπτως</td><td>adialeiptōs</td><td>G89</td><td>without interruption</td></tr><tr><td>have a prosperous journey</td><td>εὐοδωθήσομαι</td><td>euodōthēsomai</td><td>G2137</td><td>εὖ (well) + ὁδός (road): <b>to be given a good road</b></td></tr></table>","gram":"<p>· <b>λατρεύω</b>: Paul says he serves <b>in his spirit</b> — not in a temple but in the spirit; not by sacrifice but by preaching the gospel.</p><p>· <b>εὐοδωθήσομαι</b> is <b>future passive</b>. Paul does not say “I will force this road open”; he says <b>“may a road be opened for me.”</b></p><p>· And <b>εἴ πως ἤδη ποτέ</b> stacks four small particles — “if somehow now at last” — carrying <b>a restrained longing and a long wait</b> that no translation quite renders. Something like: <b>“I don’t know when, but if somehow, at long last…”</b></p>","exp":"<p><b>What the text plainly says:</b> Paul gives thanks for the Roman believers, prays for them constantly, and has longed for years to come — yet submits to God’s will and God’s timing.</p><p><b>What may fairly be drawn from it:</b> <b>Paul had vision, burden, ability and a plan — but not sovereignty.</b></p><p>He does not say “I am definitely going.” He says <b>“by the will of God.”</b> That is the most practical picture of “let Jesus be King” — <b>not the absence of planning, but plans always held in God’s hand.</b></p>"},{"a":11,"z":12,"star":false,"grk":"<p>ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς, τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.</p>","lit":"<p>“For I <b>long</b> to see you, that I may share some spiritual gift with you, so that you may <b>be established</b> — that is to say, that we may <b>be encouraged together</b> among you, through the faith we have in one another, both yours and mine.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>long for</td><td>ἐπιποθῶ</td><td>epipothō</td><td>G1971</td><td>ἐπί (intensive) + ποθέω (to yearn) — <b>a strong longing</b>, as the deer pants for water in Psalm 42:1 (the LXX uses the same root)</td></tr><tr><td>be encouraged together</td><td>συμπαρακληθῆναι</td><td>symparaklēthēnai</td><td>G4837</td><td>σύν (together) + παρακαλέω (to encourage): <b>only here in the NT</b>. “To be encouraged together” — <b>passive voice</b></td></tr></table>","gram":"<p>In verse 11 Paul is the giver: “that I may share with you.”</p><p>In verse 12 he <b>corrects himself</b>: τοῦτο δέ ἐστιν (“that is to say…”) — and the verb turns <b>passive</b>: συμπαρακληθῆναι, <b>“to be encouraged together.”</b></p><p><b>Paul pulls himself down mid-sentence.</b><br>He began by saying “I have something to give you,” and immediately adds: <b>“no — rather, we shall receive from each other.”</b></p>","exp":"<p>This is the humility of an apostle, and the loveliest picture of God’s system:</p><p><b>In the body of Christ there are no pure givers and no pure receivers.</b></p><p><b>What the text plainly says:</b> Paul wants to build up the church at Rome, and acknowledges that he needs to receive from them.</p><p><b>What may fairly be drawn from it (the 3-2-1):</b> a truly spiritual leader is not someone dispensing from a height, but someone willing to be encouraged <b>among</b> his brothers and sisters. That is what a <b>spiritual companion (the “2”)</b> is — <b>not over and under, but shoulder to shoulder.</b></p>"},{"a":13,"z":15,"star":false,"grk":"<p>ἐκωλύθην ἄχρι τοῦ δεῦρο … Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί</p>","lit":"<p>13 “Brothers, I do not want you to be unaware: I <b>often intended</b> to come to you, that I might have some fruit among you also, as among the rest of the Gentiles — <b>but I was hindered until now</b>.”</p><p>14 “To Greeks and to <b>barbarians</b>, to the wise and to the foolish, <b>I am a debtor</b>.”</p><p>15 “So, as far as it is up to me, I am <b>eager</b> to preach the gospel to you also who are at Rome.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>was hindered</td><td>ἐκωλύθην</td><td>ekōlythēn</td><td>G2967</td><td><b>to be hindered</b></td><td><b>aorist passive</b></td></tr><tr><td>barbarians</td><td>βαρβάροις</td><td>barbarois</td><td>G915</td><td>those who speak “bar-bar” — non-Greek speakers</td><td>a term of cultural contempt at the time</td></tr><tr><td>debtor</td><td>ὀφειλέτης</td><td>opheiletēs</td><td>G3781</td><td>one who owes</td><td>what Paul owes is not a favour but the gospel</td></tr></table>","gram":"<p><b>ἐκωλύθην</b> is passive: <b>“I was hindered.”</b></p><p>Paul does not say “circumstances did not allow it” or “the timing was wrong.” <b>He knows someone was doing the hindering.</b> Compare Acts 16:6–7, where the Spirit forbade him to go into Asia and Bithynia.</p><p><b>God’s hindering is also God’s guiding.</b></p>","exp":"<p><b>“I am a debtor to them”</b> — this is a startling reversal.</p><p>Ordinarily we would think: I bring you the gospel, so you owe me.<br>Paul says: <b>before I have even brought it to you, I owe you.</b></p><p>Why? Because of 1:5 — <b>“we received grace and apostleship.”</b> <b>Paul received first, and so he is in debt.</b></p><p><b>If grace really lands on a person, it turns him into a debtor.</b></p><p>And the people he owes include <b>barbarians and the foolish</b> — those Roman society looked down on.</p><p><b>The debt of the gospel knows no class.</b></p>"},{"a":16,"z":16,"star":true,"grk":"<p>Οὐ γὰρ ἐπαισχύνομαι τὸ εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι.</p>","lit":"<p>“For I am <b>not ashamed</b> of the gospel; for <b>it is the power of God</b> unto salvation to <b>everyone who believes</b> — to the Jew first, and also to the Greek.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>ashamed</td><td>ἐπαισχύνομαι</td><td>epaischynomai</td><td>G1870</td><td>to feel shame</td><td>present middle: a settled, continuing stance</td></tr><tr><td>power</td><td>δύναμις</td><td>dynamis</td><td>G1411</td><td>power, force</td><td>the source of English “dynamite,” “dynamic”</td></tr><tr><td>salvation</td><td>σωτηρίαν</td><td>sōtērian</td><td>G4991</td><td>rescue, salvation</td><td>the empire used this word too, calling Caesar σωτήρ</td></tr><tr><td>who believes</td><td>πιστεύοντι</td><td>pisteuonti</td><td>G4100</td><td>believing</td><td><b>present participle: one who goes on believing</b></td></tr></table>","gram":"<p>· <b>οὐ ἐπαισχύνομαι</b> is <b>litotes</b> — a negative used to make a stronger affirmation. “I am not ashamed of the gospel” = <b>“the gospel is my only boast.”</b></p><p>· <b>δύναμις θεοῦ ἐστιν</b>: the gospel <b>is</b> (ἐστιν) the power of God — not “has” power, not “conveys” power. <b>The gospel itself is that power.</b></p><p>· <b>παντὶ τῷ πιστεύοντι</b>: an articular present participle — <b>“everyone who keeps on believing.”</b> Faith is not a single decision but a continuing posture.</p><p>· <b>πρῶτον</b> (“first”) marks <b>the order of redemptive history</b>, not <b>a ranking of worth</b> (compare 2:9–10, where judgement too comes “to the Jew first”).</p>","exp":"<p>Why does Paul have to say “I am not ashamed”?</p><p><b>Because in that world the gospel really was shameful.</b></p><p>In Rome, crucifixion was the penalty reserved for slaves and rebels — a word civilised people preferred not to say. Cicero wrote that the very word “cross” should not come near the body, thought, eyes or ears of a Roman citizen. And the centre of the gospel was a Jewish carpenter crucified in a frontier province.</p><p>An ancient graffito unearthed on the Palatine Hill in Rome (the Alexamenos graffito, dated by most scholars to roughly the second or third century) shows a crucified figure with the head of a donkey, a man beside it with a raised hand, and beneath it the words: <b>“Alexamenos worships his god.”</b> That is how the world regarded Christians — <b>absurd, laughable, shameful.</b></p><p>Paul says: <b>I am not ashamed.</b> Not because he was thick-skinned, but because he had seen this gospel’s power with his own eyes: it turned Saul the persecutor into Paul the apostle; it made the violent gentle; it turned idolaters into worshippers of the living God.</p><p><b>What the text plainly says:</b> the gospel is God’s power to save everyone who believes, Jew or Greek alike.</p><p><b>The 3-2-1 application:</b> there is a permanent order here — <b>the gospel is the power of God, not the power of mine.</b> The fruit of evangelism does not rest on eloquence, or method, or numbers, but on the gospel itself. <b>So the glory at the end can only go to God.</b></p>"},{"a":17,"z":17,"star":true,"grk":"<p>δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.</p>","lit":"<p>“For in it <b>the righteousness of God is being revealed</b>, <b>from faith to faith</b>; as it is written: ‘<b>The righteous shall live by faith.</b>’”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>righteousness of God</td><td>δικαιοσύνη θεοῦ</td><td>dikaiosynē theou</td><td>G1343</td><td>righteousness; the state of conforming to the standard</td></tr><tr><td>is revealed</td><td>ἀποκαλύπτεται</td><td>apokalyptetai</td><td>G601</td><td><b>to uncover, to unveil</b></td></tr><tr><td>faith</td><td>πίστις</td><td>pistis</td><td>G4102</td><td>faith, trust, faithfulness</td></tr></table>","gram":"<p>· <b>ἀποκαλύπτεται</b> is <b>present passive indicative</b> — “is <b>being</b> revealed.” Not something that happened once, but something that happens again every time the gospel is preached.</p><p>· The genitive in <b>δικαιοσύνη θεοῦ</b> is the central dispute here (see the disputed material).</p><p>· <b>ἐκ πίστεως εἰς πίστιν</b>: literally <b>“out of faith, into faith.”</b></p>","exp":"<p><b>This verse was the tinder of the Reformation.</b></p><p>Martin Luther admitted that as a young man he hated the phrase “the righteousness of God” — because he took it to mean God’s attribute of punishing sinners justly. Then light came to him on this verse: he saw that this righteousness is one God <b>gives</b>, not one God <b>demands</b>. He wrote that he felt himself born again, and the gates of heaven opened to him.</p><p><b>“From faith to faith”</b> is best taken as <b>faith from beginning to end</b> (an emphatic repetition, like “from glory to glory”). <b>From start to finish, not one inch of God’s righteousness rests on works.</b></p><p><b>The quotation of Habakkuk 2:4:</b> the Hebrew reads <i>w’ṣaddîq be’ĕmûnātô yiḥyeh</i> — “the righteous shall live by his <b>faithfulness / faith</b>” (’ĕmûnâ, H530). The original setting was: the Chaldeans are coming, and the prophet asks God why he does nothing; God answers that the righteous will live by faith.</p><p><b>What began as words of waiting in the dark, Paul turns into the charter of salvation.</b></p><p>And when Paul quotes it, <b>he deliberately drops a word</b> — the detail most easily missed here, and one of the most powerful.</p><p>· The main LXX manuscripts read: “the righteous shall live by <b>my</b> faithfulness” (ἐκ πίστεώς μου) — the pronoun referring to God.<br>· Another manuscript tradition reads: “<b>my</b> righteous one shall live by faith” — the form quoted in Hebrews 10:38.<br>· <b>Paul takes neither pronoun.</b> He writes the barest possible form: ὁ δίκαιος ἐκ πίστεως ζήσεται.</p><p><b>Paul pared the sentence down to the bone. Why?</b></p><p>Because he is about to say “to the Jew first, and also to the Greek.” <b>He will not let a single word narrow this promise to one group of people.</b></p><p>The Greek ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται can be construed two ways:</p><p>1. “the one who is righteous <b>by faith</b> shall live” (ἐκ πίστεως modifying δίκαιος)<br>2. “the righteous shall live <b>by faith</b>” (ἐκ πίστεως modifying ζήσεται)</p><p>Within the argument of Romans (1:16, “everyone who believes”; 3:22; 4:5), the first reading fits Paul’s case more closely: <b>a person is counted righteous on the basis of faith.</b></p>"},{"a":18,"z":18,"star":false,"grk":"<p>Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ' οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων</p>","lit":"<p>“For the wrath of God <b>is being revealed</b> from heaven against all <b>ungodliness</b> and <b>unrighteousness</b> of people — those who <b>hold down</b> the truth in unrighteousness.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>wrath</td><td>ὀργή</td><td>orgē</td><td>G3709</td><td>settled, reasoned anger</td><td>not a loss of temper — <b>holiness responding to sin</b></td></tr><tr><td>ungodliness</td><td>ἀσέβεια</td><td>asebeia</td><td>G763</td><td>irreverence, failure toward God</td><td><b>the first-commandment dimension</b></td></tr><tr><td>unrighteousness</td><td>ἀδικία</td><td>adikia</td><td>G93</td><td>injustice, failure toward people</td><td><b>the second-commandment dimension</b></td></tr><tr><td>suppress</td><td>κατεχόντων</td><td>katechontōn</td><td>G2722</td><td><b>to hold down, to press down, to restrain</b></td><td>present participle: a continuing action</td></tr></table>","gram":"<p>· <b>ἀποκαλύπτεται</b>: <b>the same verb, tense and voice as in verse 17</b>, and placed at the head of the sentence for emphasis. The parallel is deliberate: <b>the righteousness of God is being revealed / the wrath of God is being revealed.</b></p><p>· <b>κατεχόντων</b> is the decisive image in the verse. It can mean <b>to hold down, to suppress</b> — like a hand pressing something under water so that it cannot surface.</p><p><b>People do not fail to know the truth. They know it, and press it down with force.</b></p>","exp":"<p>Paul gives the good news first (16–17), and then the bad news (18–32).<br><b>That order is itself grace.</b></p><p><b>“Ungodliness” stands before “unrighteousness”</b> — one of the most important sequences in the chapter.</p><p><b>The root of the human moral problem is a worship problem.</b><br>It is not that people do wrong and so drift from God; it is that they leave God and so do wrong.</p><p><b>What the text plainly says:</b> God’s wrath is now being revealed against all ungodliness and unrighteousness that suppresses the truth.</p><p><b>The 3-2-1 light:</b> this exposes what “self” actually is — <b>people are not ignorant; they are unwilling.</b> He knows, and he holds it down. <b>That is not a problem of the head. It is a problem of the throne.</b></p>"},{"a":19,"z":20,"star":false,"grk":"<p>διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς· ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν. τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους</p>","lit":"<p>“Because what may be known of God is manifest among them; for God has made it manifest to them. For his <b>invisible</b> attributes — his eternal power and <b>divine nature</b> — since the creation of the world, being <b>understood by the mind</b> through the things he has made, <b>are clearly seen</b>; so that they are <b>without defence</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>invisible things</td><td>ἀόρατα</td><td>aorata</td><td>G517</td><td><b>the unseeable</b></td></tr><tr><td>being understood</td><td>νοούμενα</td><td>nooumena</td><td>G3539</td><td><b>grasped by the mind</b></td></tr><tr><td>clearly seen</td><td>καθορᾶται</td><td>kathoratai</td><td>G2529</td><td><b>clearly seen</b></td></tr><tr><td>divine nature</td><td>θειότης</td><td>theiotēs</td><td>G2305</td><td><b>the divine attributes, deity</b></td></tr><tr><td>without excuse</td><td>ἀναπολογήτους</td><td>anapologētous</td><td>G379</td><td><b>with no defence to make</b> (a courtroom term)</td></tr></table>","gram":"<p>Paul uses a superb <b>oxymoron</b> here: <b>“the invisible” (ἀόρατα) is “clearly seen” (καθορᾶται).</b></p><p>· <b>νοούμενα</b> is a present passive participle — “through being understood.” So natural revelation is not automatic; <b>it requires the mind to grasp it.</b></p><p>· <b>ἀναπολογήτους</b>: ἀ (not) + ἀπολογία (a defence — the root of English “apologetics”). This is courtroom language: <b>the defendant has nothing to say.</b></p><p>· <b>εἰς τὸ εἶναι</b>: εἰς + infinitive, marking <b>result</b> (some scholars argue for purpose). “So that” is the safer rendering.</p>","exp":"<p><b>An important clarification:</b> this passage does <b>not</b> say that people can be saved by looking at the stars. What natural revelation reveals is “his eternal power and divine nature” — <b>enough to condemn, not enough to save.</b></p><p>It leaves people without excuse; it cannot justify them. <b>Justification is only in the gospel</b> (1:16–17).</p><p><b>What the text plainly says:</b> God has left evidence of himself in the things he has made, so no one can plead “I did not know.”</p><p><b>What may fairly be drawn from it:</b> <b>every sunrise, every leaf’s veining, every breath is a signal God has left for people.</b><br><b>The problem has never been that God hid too well. It is that people closed their eyes.</b></p>"},{"a":21,"z":21,"star":false,"grk":"<p>διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλ' ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία.</p>","lit":"<p>“Because, <b>although they knew God</b>, they did not <b>glorify him as God</b> nor <b>give thanks</b>; but they <b>became futile</b> in their reasonings, and their senseless heart <b>became dark</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>glorified</td><td>ἐδόξασαν</td><td>edoxasan</td><td>G1392</td><td><b>to glorify, to acknowledge the weight of</b></td></tr><tr><td>gave thanks</td><td>ηὐχαρίστησαν</td><td>ēucharistēsan</td><td>G2168</td><td>to give thanks</td></tr><tr><td>became futile</td><td>ἐματαιώθησαν</td><td>emataiōthēsan</td><td>G3154</td><td><b>to become empty, useless</b> (passive form, usually with the sense of entering a state)</td></tr><tr><td>reasonings</td><td>διαλογισμοῖς</td><td>dialogismois</td><td>G1261</td><td>reasonings, deliberations</td></tr><tr><td>was darkened</td><td>ἐσκοτίσθη</td><td>eskotisthē</td><td>G4654</td><td>to become dark (passive form)</td></tr><tr><td>heart</td><td>καρδία</td><td>kardia</td><td>G2588</td><td><b>the heart — the centre of will, feeling and thought</b></td></tr></table>","gram":"<p>· <b>γνόντες</b> is an aorist participle used concessively — <b>“although they knew God.”</b> That is the ground of their condemnation.</p><p>· <b>ἐματαιώθησαν</b> and <b>ἐσκοτίσθη</b> are both <b>aorist passive forms</b>.</p><p><b>Here we must be careful not to press the grammar too far.</b></p><p>In Koine Greek the passive form (especially the aorist passive) <b>very often carries a simple intransitive sense of “entering a state,”</b> without pointing to an agent at all — as with ἐγενήθην (became) or ἐπορεύθην (went). So the most conservative and defensible rendering is: <b>“their reasonings became futile, and their senseless heart became dark.”</b></p><p><b>You must not say:</b> “the Greek is passive, therefore it was God who darkened their hearts.” <b>That is an inference beyond the evidence.</b></p><p><b>But this much is worth noticing:</b> the three passive forms in verses 21–22 (futile, darkened, made foolish) stand in the same paragraph as the three occurrences of “God gave them over” (παρέδωκεν, <b>active voice, with God explicitly as subject</b>) in verses 24, 26 and 28 — and only two verses separate them. Whether Paul deliberately lets the reader meet a run of agentless passives first and then names the agent three verses later is <b>something the grammar cannot settle, but which carries real theological weight.</b></p><p><b>A safer and stronger way to put it from the pulpit:</b> “Paul does not say here who darkened their hearts. He does not say yet. But read on three verses, and he will tell you.”</p><p>· The root of ματαιόω is <b>μάταιος</b>, which in the Septuagint regularly renders the Hebrew <b>hebel</b> (the “vanity” of Ecclesiastes) and the “nothingness” of idols.</p><p><b>Paul is saying: people become what they worship.</b> Worship emptiness, and the mind becomes empty (compare Psalm 115:8, “those who make them will be like them”).</p>","exp":"<p><b>The first step of sin is not murder or arson. It is failing to glorify God and failing to give thanks.</b></p><p>“Glorify him” — to acknowledge that God has the weight and the place that are properly his.<br>“Give thanks” — to acknowledge that everything I have was received.</p><p><b>Not to glorify God is to take God down off the throne.<br>Not to give thanks is to treat myself as the source.</b></p><p><b>Those two together are the definition of “self.”</b></p><p>And the result is a chain reaction: <b>the throne goes wrong → the reasoning becomes futile → the heart becomes dark.</b></p><p>Note the direction: <b>it is not that the mind darkened and so worship went wrong; it is that worship went wrong and so the mind darkened.</b></p><p><b>The human problem never begins with the intellect. It begins with worship.</b></p>"},{"a":22,"z":23,"star":false,"grk":"<p>φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.</p>","lit":"<p>“<b>Claiming</b> to be wise, they <b>became fools</b>; and they <b>exchanged</b> the glory of the <b>incorruptible</b> God for the likeness of an image of <b>corruptible</b> man, and of birds, and four-footed animals, and creeping things.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>professing</td><td>φάσκοντες</td><td>phaskontes</td><td>G5335</td><td><b>to claim, to assert</b> (with a hint of falsity)</td></tr><tr><td>became fools</td><td>ἐμωράνθησαν</td><td>emōranthēsan</td><td>G3471</td><td>to become foolish (passive form; the source of English “moron”)</td></tr><tr><td>exchanged</td><td>ἤλλαξαν</td><td>ēllaxan</td><td>G236</td><td><b>to exchange, to swap</b></td></tr><tr><td>incorruptible</td><td>ἀφθάρτου</td><td>aphthartou</td><td>G862</td><td>imperishable</td></tr><tr><td>corruptible</td><td>φθαρτοῦ</td><td>phthartou</td><td>G5349</td><td>perishable, liable to rot</td></tr></table>","gram":"<p>· <b>ἐμωράνθησαν</b> is again a passive form, the third of the series in verses 21–22 (futile, darkened, foolish). Here again the safest reading is simply “they became foolish”; and the weight lies not in whether the grammar can prove an agent, but in the fact that <b>Paul sets “claiming to be wise” right beside “became fools.”</b> <b>The more self-confident, the deeper into one’s own folly.</b></p><p>· <b>ἄφθαρτος / φθαρτός</b>: a deliberate assonant contrast. <b>Trading the imperishable for the perishable — the worst bargain in the world.</b></p><p>· <b>the order of the list</b>: man → birds → four-footed beasts → creeping things. <b>Downward all the way.</b></p><p>And that is <b>the exact reversal of Genesis 1:20–26</b>: God made birds, then beasts, then creeping things, and last of all man in his own image. People reverse it — downgrading God’s glory to the image of man, and then down as far as a reptile.</p><p><b>Worship wrongly, and a person falls all the way down.</b></p>","exp":"<p>Verse 23 is <b>a word-for-word echo of Psalm 106:20 in the Septuagint</b> — not an impression, but something that can be checked line by line.</p><pre>LXX Ps 105(106):20  ἠλλάξαντο τὴν δόξαν αὐτῶν ἐν ὁμοιώματι μόσχου ἔσθοντος χόρτον\n                    (they exchanged their GLORY for the LIKENESS of an ox that eats grass)\nRomans 1:23         ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος…</pre><p><b>The same verb (ἀλλάσσω), the same object (δόξα), the same prepositional phrase (ἐν ὁμοιώματι).</b></p><p><b>Paul is writing about Gentiles with Psalm 106 open in front of him.</b></p><p>There is also an echo of <b>Jeremiah 2:11</b>: “Has a nation changed its gods…? But my people have changed their glory for that which does not profit.”</p><p>And the word <b>εἰκών (image)</b> threads three passages into one line:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td>Genesis 1:26–27 (LXX)</td><td>God made man according to his own <b>εἰκών</b></td></tr><tr><td><b>Romans 1:23</b></td><td>people exchanged God’s glory for the <b>εἰκών</b> of perishable <b>man</b></td></tr><tr><td>Colossians 1:15</td><td>Christ is the <b>εἰκών</b> of the invisible God</td></tr></table><p><b>People did not merely swap one god for another. They took their own mirror for the sun.</b><br><b>And the gospel’s answer is: the true image has been there all along — and he is Christ.</b></p><p><b>Paul’s purpose here runs very deep:</b> on the surface he is describing Gentile idolatry — but the language he uses is <b>the language God used to rebuke Israel</b>. So when chapter 2 arrives, Jewish readers cannot say “this has nothing to do with me.”</p><p><b>What happened at the foot of Sinai is the human race in miniature.</b></p><p><b>What the text plainly says:</b> people replaced the glory of the Creator with the images of created things.</p><p><b>The 3-2-1 application:</b> an idol need not have a shape. Today an idol may be achievement, reputation, a relationship, money, health, children, a ministry — <b>anything we set on the throne and use to define our worth.</b></p><p><b>The problem is not that the thing is bad. The problem is that it is sitting in the wrong seat.</b></p>"},{"a":24,"z":24,"star":false,"grk":"<p>Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν αὐτοῖς</p>","lit":"<p>“<b>Therefore God gave them over</b>, in the desires of their hearts, to uncleanness, so that their bodies were dishonoured among themselves.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>gave over</td><td>παραδίδωμι</td><td>paradidōmi</td><td>G3860</td><td><b>to hand over, to deliver up</b> — a legal and military term: a judge <b>hands</b> a prisoner to the jailer; a general <b>surrenders</b> a city. The same word is used of Judas “betraying” Jesus (Mark 14:10) and of Pilate “delivering him up” to be crucified (Mark 15:15)</td></tr><tr><td>desires</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>strong craving, desire</td></tr><tr><td>uncleanness</td><td>ἀκαθαρσία</td><td>akatharsia</td><td>G167</td><td>uncleanness, impurity</td></tr></table>","gram":"<p>· <b>παρέδωκεν</b> is aorist <b>active</b> indicative, and <b>the subject is ὁ θεός — God</b>. This is the most arresting grammatical fact in the passage: <b>“gave them over” is not God standing idly by. It is a judicial act of God.</b></p><p>· <b>Διό</b> (“therefore”) marks the causal link explicitly: because people did what verse 23 describes, God did what verse 24 describes.</p>","exp":"<p>English “gave them up” can sound like a shrug — “let them get on with it.” The Greek is heavier: <b>God handed them over.</b></p><p><b>This is one of the most terrible judgements in the Bible: God stops restraining you.</b></p><p>Picture a child straining to pull free of his father’s hand and run into the road. The father catches him three times, five times, ten times — and then the father lets go. In that moment it is not that the father does not love him. <b>It is that in justice he gives him exactly what he has insisted on having.</b></p><p><b>One of sin’s final punishments is sin itself.</b></p><p>“In the desires of their hearts” — they got what they wanted, and that <b>is</b> the punishment. Augustine put it with great precision: God sometimes judges us by granting our prayers.</p>"},{"a":25,"z":25,"star":false,"grk":"<p>οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>“Who <b>exchanged</b> the truth of God for <b>the lie</b>, and <b>worshipped and served</b> the creature <b>rather than</b> (or: instead of) the Creator — who is blessed forever. Amen.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>exchanged</td><td>μετήλλαξαν</td><td>metēllaxan</td><td>G3337</td><td><b>stronger than ἤλλαξαν in v. 23</b> (with μετά added): <b>to swap thoroughly</b></td></tr><tr><td>the lie</td><td>τῷ ψεύδει</td><td>tō pseudei</td><td>G5579</td><td><b>“THE lie,” with the article</b> — see below</td></tr><tr><td>worshipped and served</td><td>ἐσεβάσθησαν καὶ ἐλάτρευσαν</td><td>—</td><td>G4573 / G3000</td><td><b>worship (the attitude of the heart) + service (the action of life)</b></td></tr><tr><td>rather than the Creator</td><td>παρὰ τὸν κτίσαντα</td><td>—</td><td>G2936</td><td>παρά + accusative: “rather than” or “instead of”</td></tr></table>","gram":"<p>· <b>τῷ ψεύδει</b> — <b>“THE lie,” with the article</b>. Not just any lie, but <b>the</b> foundational one. Which one? <b>Genesis 3:5, “you will be like God, knowing good and evil.”</b></p><p><b>The first lie in human history was: you can be your own god.</b></p><p>· <b>ἐσεβάσθησαν καὶ ἐλάτρευσαν</b>: worship (the heart’s posture) + service (the life’s action). <b>Worship necessarily produces service; what you serve betrays what you worship.</b></p>","exp":"<p>Having reached this point, Paul suddenly stops and inserts a doxology: <b>“who is blessed forever. Amen!”</b></p><p><b>That is the instinctive reflex of a godly man.</b> As he describes how people blaspheme God, he cannot help putting in a word for God.</p><p><b>That is a preacher’s heart: even while describing the darkest sin, his eyes are still lifted to God.</b></p><p>And the contrast between <b>“the lie”</b> and <b>“the truth of God”</b> is the core of the chapter:</p><p>· <b>the truth:</b> God is God, and man is man.<br>· <b>the lie:</b> I can be God.</p><p>In the language of the 3-2-1: <b>“self” is living inside that lie. “Selflessness” is coming back to the truth — letting man be man, and letting God be God.</b></p>"},{"a":26,"z":27,"star":false,"grk":"<p>Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας … μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν …</p>","lit":"<p>26 “<b>For this reason</b> God <b>gave them over</b> to dishonourable passions. Their women <b>exchanged</b> the <b>natural use</b> for that which is against nature;”</p><p>27 “and likewise the men, leaving the natural use of the woman, burned in their desire toward one another, men with men doing what is shameful, and receiving in themselves the due penalty of their <b>going astray</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>dishonourable passions</td><td>πάθη ἀτιμίας</td><td>pathē atimias</td><td>G3806 / G819</td><td>passions of dishonour</td></tr><tr><td>natural use</td><td>φυσικὴν χρῆσιν</td><td>physikēn chrēsin</td><td>G5446 / G5540</td><td><b>the use that accords with nature</b></td></tr><tr><td>against nature</td><td>παρὰ φύσιν</td><td>para physin</td><td>G5449</td><td><b>contrary to / beyond nature</b></td></tr><tr><td>exchanged</td><td>μετήλλαξαν</td><td>metēllaxan</td><td>G3337</td><td><b>the third occurrence of “exchange”</b> — the same word as v. 25</td></tr></table>","gram":"<p>This is the passage most easily misread in the whole chapter, and <b>the key to reading it lies in the grammatical structure</b>.</p><p>Verses 26–27 form <b>the second “gave them over,”</b> introduced by <b>Διὰ τοῦτο (“for this reason”)</b> — and what it follows on from is <b>the disordered worship of verse 25</b>. Paul deliberately links verses 25 and 26 with the same verb, <b>μετήλλαξαν (exchanged)</b>:</p><pre>v. 25:  exchanged the TRUTH of God for THE LIE        (a vertical disorder: worship)\nv. 26:  exchanged the NATURAL use for the UNNATURAL   (a horizontal disorder: created order)</pre><p><b>Paul’s point is not “homosexual acts are the worst of sins,” but: when people invert Creator and creature in worship, inversions appear in the created order as well.</b></p><p><b>This is a theological argument, not a moral league table.</b> The proof is that verses 29–31 immediately list envy, strife, arrogance and disobedience to parents — putting “idolatry” and “gossip” on the same list.</p>","exp":"<p><b>What the text plainly says:</b> the sexual conduct Paul describes here is conduct he regards as contrary to the created order (φύσις, referring back to the making of male and female in Genesis 1–2), and he presents it as the appearance, at the creaturely level, of humanity’s disordered worship. This is the most natural reading of the Greek and of the context, and it has been the mainstream understanding of the church throughout its history.</p><p><b>Scholarly discussion (set out fairly):</b> some scholars (in the line of Boswell and Countryman) argue that Paul has in view only the exploitative relationships of his day (pederasty, temple prostitution) or a violation of an individual’s own “nature.” Most evangelical scholars — and many non-evangelical ones — do not accept this, for three reasons: (1) Paul mentions women as well, which goes beyond the pederastic model; (2) ἄρσενες ἐν ἄρσεσιν describes desire <b>toward one another</b> (εἰς ἀλλήλους), not one-directional exploitation; (3) φύσις in this context is bound closely to the creation vocabulary (κτίσις, κτίσαντα), pointing to created order rather than individual orientation.</p><p><b>And the pastoral word must be added at once:</b> <b>this passage is not given to the church as a stone to throw.</b> Because 2:1 says immediately: “You have no excuse, O man, whoever you are who judges.” And the list in verses 29–31 includes <b>envy, strife, arrogance, boasting, disobedience to parents, heartlessness</b> — <b>every church has pews full of people who fit that list, including the one in the pulpit.</b></p><p><b>And the gospel word must be spoken in the same breath:</b></p><p><b>“And such were some of you. But you were washed, but you were sanctified, but you were justified in the name of the Lord Jesus and by the Spirit of our God.” (1 Corinthians 6:11)</b></p><p><b>“And such were some of you” — the power of the gospel is in those five words.</b></p>"},{"a":28,"z":28,"star":false,"grk":"<p>καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα</p>","lit":"<p>“And just as they <b>did not approve</b> of holding God in their knowledge, God gave them over to <b>a mind that fails the test</b>, to do the things that are not fitting.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>did not approve</td><td>οὐκ ἐδοκίμασαν</td><td>ouk edokimasan</td><td>G1381</td><td><b>did not test and approve</b></td></tr><tr><td>debased</td><td>ἀδόκιμον</td><td>adokimon</td><td>G96</td><td><b>tested and rejected; failed the assay</b></td></tr><tr><td>mind</td><td>νοῦν</td><td>noun</td><td>G3563</td><td>the mind, the reason</td></tr></table>","gram":"<p><b>δοκιμάζω and ἀδόκιμος share one root.</b> In Greek this is a piercing pun:</p><p><b>People did not “approve” God, so God gave them over to a mind that is “not approved.”</b></p><p>δοκιμάζω was originally <b>the vocabulary of assaying metal</b>: you put metal in the fire; what passes is δόκιμος, and what is rejected as waste is <b>ἀδόκιμος</b>.</p>","exp":"<p>“They did not see fit to acknowledge God” — the point of ἐδοκίμασαν is not “they did not know,” but <b>“they tested it and decided against it.”</b></p><p><b>People put God on the scales, weighed him, and said: not useful to me.</b></p><p>And so God said: very well. <b>You will not have me as the master of your thinking; then let your thinking become scrap.</b></p><p>This is the deepest sorrow of all: people imagine they have shaken off God and gained a free mind; what they have actually gained is <b>a mind that can no longer judge rightly</b>.</p><p>In the language of the 3-2-1, this is where “using the head and relying on self” finally arrives. <b>Once human reason leaves God, it is no longer an instrument for reaching truth. It becomes a factory for justifying sin.</b></p>"},{"a":29,"z":31,"star":false,"grk":"<p>πεπληρωμένους πάσῃ ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς, καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς, ἀσυνέτους, ἀσυνθέτους, ἀστόργους, ἀνελεήμονας·</p>","lit":"<p>29 “They <b>have been filled</b> with all unrighteousness, wickedness, greed and malice; <b>full of</b> envy, murder, strife, deceit and ill-will;”</p><p>30 “<b>whisperers</b>, <b>slanderers</b>, haters of God, <b>insolent</b>, arrogant, boastful, <b>inventors of evil</b>, disobedient to parents;”</p><p>31 “<b>without understanding</b>, <b>breakers of faith</b>, <b>without natural affection</b>, <b>without mercy</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>filled</td><td>πεπληρωμένους</td><td>peplērōmenous</td><td>G4137</td><td><b>perfect passive participle: having been filled</b></td></tr><tr><td>full of</td><td>μεστούς</td><td>mestous</td><td>G3324</td><td>full</td></tr><tr><td>envy / murder</td><td>φθόνου φόνου</td><td>phthonou phonou</td><td>G5355 / G5408</td><td><b>a pun — the two words differ by one letter</b></td></tr><tr><td>insolent</td><td>ὑβριστάς</td><td>hybristas</td><td>G5197</td><td><b>an arrogant, violent person</b> (the source of “hubris”)</td></tr><tr><td>arrogant</td><td>ὑπερηφάνους</td><td>hyperēphanous</td><td>G5244</td><td><b>showing oneself above others</b></td></tr><tr><td>boastful</td><td>ἀλαζόνας</td><td>alazonas</td><td>G213</td><td>a braggart</td></tr><tr><td>without natural affection</td><td>ἀστόργους</td><td>astorgous</td><td>G794</td><td><b>lacking family love</b> (the negative of στοργή)</td></tr></table>","gram":"<p><b>Five of the words on this list concern the mouth</b> — whispering, slandering, insolence, boasting, inventing evil.</p><p><b>Paul puts “talking about people behind their backs” on the same list as murder.</b></p><p>And there is “arrogant” (ὑπερήφανος) — the very word James 4:6 and 1 Peter 5:5 use when they quote Proverbs 3:34: <b>“God opposes the proud, but gives grace to the humble.”</b></p><p><b>Pride is on this darkest of lists because pride is the source of all of it.</b></p><p><b>The function of this list is not to score the world. It is to hold up a mirror.</b></p>","exp":"<p><b>An important documentary parallel:</b> the argument of Wisdom of Solomon 13–14 (in the Apocrypha) runs in this order — nature should have led people to know the Creator → instead they worshipped idols → therefore moral collapse followed → and then a long list of vices.</p><p><b>That sequence is almost exactly the sequence of Romans 1:19–31.</b></p><p>Which shows two things:</p><p><b>1.</b> Paul is using <b>a form of indictment already familiar to Jews of his day — one they would have applauded as they read.</b><br><b>2.</b> And precisely because of that, <b>the turn at 2:1 is so lethal</b> — Paul lets his readers nod all the way through, and then swings the whole indictment round onto them.</p><p>(From the pulpit there is no need to name the book; “a line of argument Jews of Paul’s day commonly used” is enough.)</p>"},{"a":32,"z":32,"star":false,"grk":"<p>οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.</p>","lit":"<p>“Who, though they <b>know full well</b> God’s decree — that those who practise such things are worthy of death — not only do them, but also <b>heartily approve of</b> those who practise them.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>knowing</td><td>ἐπιγνόντες</td><td>epignontes</td><td>G1921</td><td>ἐπί (intensive) + γινώσκω: <b>to know fully</b></td></tr><tr><td>approve</td><td>συνευδοκοῦσιν</td><td>syneudokousin</td><td>G4909</td><td>σύν (together) + εὖ (well) + δοκέω (to think): <b>to think well of together, to applaud</b></td></tr></table>","gram":"<p>Paul saves the heaviest sentence for last: <b>worse than doing the sin is applauding it.</b></p><p>Why? Because the one who sins may still feel the prick of conscience; but <b>the one who defends sin, applauds it, likes it, promotes it, has surrendered the last line of conscience too.</b> He is not merely falling; <b>he is building a system in which falling becomes normal.</b></p><p><b>This verse has a very present relevance.</b> We live in an age of likes and shares — <b>and the modern form of συνευδοκέω may take only one finger.</b></p>","exp":"<p>And note this: <b>when Paul wrote this verse, one picture must have flashed through his mind.</b></p><p><b>Acts 8:1: “And Saul was consenting to his death.”</b> The Greek there is <b>συνευδοκῶν — the same word.</b></p><p><b>When Paul wrote the last sentence of this chapter, he was writing about himself.</b></p><p>And that explains how he can turn in the very next chapter and say “you have no excuse, O man, whoever you are who judges” — <b>because he knows that the first man without excuse is himself.</b></p><p><b>And such a man received mercy. That is why he is not ashamed of the gospel.</b></p>"}],"2":[{"a":1,"z":1,"star":false,"grk":"<p>Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων.</p>","lit":"<p>“Therefore you are <b>without defence</b>, O man — every one of you who judges. For in the matter in which you judge the other, <b>you are condemning yourself</b>; for you who judge <b>practise the same things</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>therefore</td><td>Διό</td><td>dio</td><td>G1352</td><td>διά + ὅς</td><td>therefore, on this basis</td><td>picking up 1:18–32, especially 1:32</td></tr><tr><td>without excuse</td><td>ἀναπολόγητος</td><td>anapologētos</td><td>G379</td><td>ἀ- + ἀπολογία (a defence)</td><td><b>having no defence to make</b></td><td>courtroom: the defendant rises and cannot say a word</td></tr><tr><td>judge</td><td>κρίνων</td><td>krinōn</td><td>G2919</td><td>κρίνω</td><td>to discern, to judge, to pass sentence</td><td><b>not merely “having an opinion” — taking the judge’s seat</b></td></tr><tr><td>condemn</td><td>κατακρίνεις</td><td>katakrineis</td><td>G2632</td><td>κατά (down) + κρίνω</td><td><b>to sentence, to condemn</b></td><td>the κατά makes it far heavier than κρίνω</td></tr><tr><td>practise</td><td>πράσσεις</td><td>prasseis</td><td>G4238</td><td>πράσσω</td><td><b>to do repeatedly</b></td><td>present tense: <b>a settled habit</b>, not an isolated lapse</td></tr></table>","gram":"<p>· <b>ἀναπολόγητος εἶ</b>: the adjective stands first — <b>the emphatic position</b>. “With—out—de—fence — that is you!”</p><p>· <b>ὦ ἄνθρωπε πᾶς ὁ κρίνων</b>: vocative + “every one” — a standard diatribe device. Paul names no one, and every reader feels named.</p><p>· <b>κατακρίνεις</b> is present active indicative, second person singular. <b>Not “you will be condemned,” but “you are condemning yourself at this moment.”</b> This condemnation is not future tense; it is present continuous.</p><p>· <b>πράσσεις</b>: πράσσω (to do habitually) rather than ποιέω (to do a thing). Paul’s word choice is exact: <b>you are not an occasional offender. You are a repeat offender.</b></p><p><b>What does this grammar do to the verse?</b><br>If it were future tense, the one who judges would still have a margin of time. But Paul uses the present: <b>the moment you raise your finger and point at someone else, your own name has already been signed on the verdict.</b></p>","exp":"<p>The “therefore” (Διό) picks up 1:32. Having just read that appalling catalogue of sin, the reader’s heart says: “Amen — they deserve it!”</p><p>And Paul turns straight round: <b>“That ‘amen’ you just said is your own verdict.”</b></p><p>Why? Because <b>the very ability to judge proves that you possess moral knowledge; and if you possess moral knowledge and still do it, your guilt is heavier than the ignorant person’s.</b></p><p><b>The measuring stick you raise will, when it has finished measuring others, turn round and measure you.</b></p><p>Note that Paul does <b>not</b> say “never distinguish right from wrong.” κρίνω here means <b>usurping the seat of the Judge</b> — the kind of condemning that carries a sense of superiority and exempts itself from the same standard. Scripture never tells us to abandon moral discernment (1 Corinthians 5:12, “do you not judge those who are inside?”); it forbids us <b>to sit on a throne that belongs only to God</b>.</p><p><b>What the text plainly says:</b> the one who judges others condemns himself, because he does the same things; he is without excuse before God.</p><p><b>What may fairly be drawn from it:</b> people find judging so easy largely because there is something in themselves that has never been dealt with — <b>what we criticise most sharply is often what we least dare to face in ourselves.</b></p>"},{"a":2,"z":2,"star":false,"grk":"<p>οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.</p>","lit":"<p>“But <b>we know</b> that God’s judgement is <b>according to truth</b>, against those who habitually practise such things.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>judgement</td><td>κρίμα</td><td>krima</td><td>G2917</td><td><b>the verdict reached</b> (not κρίσις, the process of judging)</td></tr><tr><td>according to truth</td><td>κατὰ ἀλήθειαν</td><td>kata alētheian</td><td>G225</td><td><b>according to the facts, according to reality</b>, unaffected by appearances</td></tr></table>","gram":"<p>· <b>οἴδαμεν</b>: perfect in form, present in sense — “we have always known.” Paul assumes his opponent agrees with this; he secures the common ground first, and then turns that common ground against him. This is standard diatribe strategy.</p><p>· <b>κατὰ ἀλήθειαν</b> is placed after ἐστιν and before its object, <b>emphasising “according to truth.”</b></p>","exp":"<p><b>“According to truth” is the weight of the verse.</b> Human judgement goes by appearance, by relationship, by impression; <b>God’s judgement goes by reality as it actually is.</b></p><p>He does not look at how you sit in church, how you pray, how you speak, but at <b>the truth of the matter</b>. This is the first foundation of the chapter: <b>before God there is no such thing as image management.</b></p>"},{"a":3,"z":3,"star":false,"grk":"<p>λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;</p>","lit":"<p>“O man, you who judge those who practise such things and do the same yourself — do you really <b>reckon</b> this: that <b>you</b> will <b>escape</b> the judgement of God?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>reckon</td><td>λογίζῃ</td><td>logizē</td><td>G3049</td><td><b>to calculate, to keep accounts</b> — a commercial term</td></tr><tr><td>escape</td><td>ἐκφεύξῃ</td><td>ekpheuxē</td><td>G1628</td><td>ἐκ (out) + φεύγω (to flee): <b>to slip out of a net that has already closed</b></td></tr></table>","gram":"<p>· <b>λογίζομαι</b> is a key verb in Romans (it occurs eleven times in chapter 4, “counted as righteousness”). Here Paul uses it first in its <b>negative</b> sense: a man doing the sums in his own head, adding it up and deciding that he will get by.</p><p>· <b>σύ</b> appears on its own (the verb already carries the person) — <b>emphatic</b>: <b>“You? You are going to escape?”</b></p><p>· The question expects the answer: <b>impossible</b>.</p>","exp":"<p>Paul exposes something very deep: <b>the self-righteous are all quietly keeping accounts.</b></p><p>· “I have this fault, but I am a great deal better than him.”<br>· “At least I have never gone that far.”<br>· “I am still serving, still giving, still reading my Bible.”</p><p><b>It is a ledger kept with other people as the baseline.</b> Paul says: <b>God does not accept that ledger.</b></p><p>And λογίζῃ carries the sense of <b>calculating, working it out carefully</b> — what Paul is exposing is not an innocent misunderstanding but <b>a deliberate act of self-persuasion</b>.</p>"},{"a":4,"z":4,"star":true,"grk":"<p>ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;</p>","lit":"<p>“Or do you <b>look down on</b> the riches of his <b>kindness</b>, and his <b>forbearance</b>, and his <b>long patience</b> — <b>not knowing</b> that the kindness of God <b>is leading you</b> into repentance?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root / form</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>riches</td><td>πλοῦτος</td><td>ploutos</td><td>G4149</td><td>—</td><td>wealth, abundance</td><td>God’s kindness is not squeezed out reluctantly — it is <b>overflowing wealth</b></td></tr><tr><td>kindness</td><td>χρηστότης</td><td>chrēstotēs</td><td>G5544</td><td>χρηστός (useful, good)</td><td>goodness that benefits others</td><td>a favourite Pauline word; one of the fruit of the Spirit in Galatians 5:22</td></tr><tr><td>forbearance</td><td>ἀνοχή</td><td>anochē</td><td>G463</td><td>ἀνά + ἔχω (to hold)</td><td><b>holding back for a time</b>, a truce</td><td>the same word as in 3:26, God’s “forbearance” toward sins previously committed</td></tr><tr><td>patience</td><td>μακροθυμία</td><td>makrothymia</td><td>G3115</td><td>μακρός (long) + θυμός (anger)</td><td><b>a long fuse on anger</b></td><td>the LXX word for Exodus 34:6, “slow to anger”</td></tr><tr><td>despise</td><td>καταφρονεῖς</td><td>kataphroneis</td><td>G2706</td><td>κατά (down) + φρονέω (to think)</td><td><b>to look down on</b></td><td>present tense: you are continually making light of it</td></tr><tr><td>not knowing</td><td>ἀγνοῶν</td><td>agnoōn</td><td>G50</td><td>ἀ + γινώσκω</td><td>not knowing, not seeing</td><td><b>present active participle</b>, marking an attendant state</td></tr><tr><td>leads</td><td>ἄγει</td><td>agei</td><td>G71</td><td>ἄγω</td><td>to lead, to draw along</td><td><b>present tense: is leading you, right now</b></td></tr><tr><td>repentance</td><td>μετάνοια</td><td>metanoia</td><td>G3341</td><td>μετά (change) + νοῦς (mind)</td><td><b>a thorough turning of the mind</b></td><td>not merely regret — a reversal of outlook and direction</td></tr></table>","gram":"<p><b>① The Old Testament root of makrothymia</b></p><p>The Septuagint uses μακρόθυμος to render the Hebrew <b>erek appayim</b> (literally “long of nostril” — anger that comes slowly). In Exodus 34:6, God proclaims his own name to Moses:</p><p><b>“The LORD, the LORD, a God merciful and gracious, slow to anger, and abundant in lovingkindness and truth.”</b></p><p><b>Paul is setting the God of Exodus 34 in front of the man who judges.</b></p><p><b>② The word order of eis metanoian se agei</b></p><p>The Greek order runs: <b>εἰς μετάνοιαν (into repentance) → σε (you) → ἄγει (leads)</b>. “Into repentance” is thrown to the front — <b>emphasising the destination</b>.</p><p><b>God’s kindness is not aimless indulgence. It has a definite direction: repentance.</b></p><p><b>③ The weight of the present tense in agei</b></p><p>Not “once led you,” and not “will lead you,” but <b>“is leading you at this very moment.”</b></p><p><b>What does this grammar do to the verse?</b> Every day you are still alive, still not judged, still breathing, still able to read this passage — <b>that is not God forgetting you. That is God holding your hand and drawing you toward repentance.</b></p><p><b>If you read God’s patience as God’s permission, you have taken a lifeline for a licence.</b></p><p><b>④ The present participle agnoōn</b></p><p>“Not knowing” happens <b>at the same time</b> as “despising.”</p><p><b>People who despise grace are usually not deliberately defiant. They have misread.</b> They read God’s silence as “no problem,” and God’s patience as “God does not mind.”</p>","exp":"<p>This verse is the hinge of the chapter. The first three verses were indictment; this one turns suddenly into <b>invitation</b>.</p><p>Paul points out that there are two ways to read God’s patience:</p><p>· <b>Misreading:</b> “Nothing has happened to me so far, so evidently I am all right.” → contempt<br>· <b>Reading rightly:</b> “Nothing has happened to me so far, because God is waiting for me to turn back.” → repentance</p><p>The literal sense of “despise” (καταφρονέω) is <b>“to look down on.”</b> What an irony: a man standing inside grace, looking down on the grace that is holding him up.</p><p><b>“His kindness leads you to repentance” is one of the most important pieces of soteriological psychology in the Bible: repentance is not frightened out of a person. It is drawn out by kindness.</b></p><p><b>The law can condemn, but the law has never had the power to make anyone love God. Only kindness can.</b></p><p><b>What the text plainly says:</b> God’s kindness, forbearance and patience have a purpose — to lead people to repentance; to despise it is to add to one’s own guilt.</p><p><b>What may fairly be drawn from it:</b> if you have not yet been disciplined by God, if the bill has not yet come — <b>that is not a pass. It is a reprieve.</b></p>"},{"a":5,"z":5,"star":false,"grk":"<p>κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ.</p>","lit":"<p>“But according to your <b>hardness</b> and <b>unrepentant heart</b>, you are <b>storing up</b> for yourself wrath, for the day of wrath and of the <b>revelation</b> of God’s <b>righteous judgement</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>hardness</td><td>σκληρότης</td><td>sklērotēs</td><td>G4643</td><td>hardening; the LXX uses the same root of Pharaoh hardening his heart</td></tr><tr><td>unrepentant</td><td>ἀμετανόητος</td><td>ametanoētos</td><td>G279</td><td>ἀ + μετανοέω — <b>only here in the New Testament</b></td></tr><tr><td>store up</td><td>θησαυρίζεις</td><td>thēsaurizeis</td><td>G2343</td><td>θησαυρός (a treasury): <b>to lay up in store, to accumulate bit by bit</b></td></tr><tr><td>revelation</td><td>ἀποκάλυψις</td><td>apokalypsis</td><td>G602</td><td>the lifting of a lid; revelation</td></tr><tr><td>righteous judgement</td><td>δικαιοκρισία</td><td>dikaiokrisia</td><td>G1341</td><td>δίκαιος + κρίσις, a compound — <b>only here in the New Testament</b></td></tr></table>","gram":"<p><b>① The startling irony of thēsaurizeis</b></p><p>θησαυρίζω is the very verb the Lord Jesus uses in “lay up for yourselves treasures in heaven” (Matthew 6:20).</p><p><b>Paul says: you are indeed laying up a store. Only what you are storing is not treasure. It is wrath.</b></p><p>And it is <b>σεαυτῷ — for yourself</b>. That reflexive dative is where the blade lies: <b>no one forced you. You have been paying it in, day by day, yourself.</b></p><p><b>② The Old Testament echo in sklērotēs</b></p><p>Pharaoh “hardened his heart” in Exodus (LXX σκληρύνω). <b>Paul is implying: a religious man who will not repent is in the same condition as Pharaoh.</b></p><p><b>③ Two ἀ- privatives side by side</b></p><p>· 2:1 <b>ἀναπολόγητος</b> (without defence)<br>· 2:5 <b>ἀμετανόητος</b> (unrepentant)</p><p><b>He is without defence because he will not repent.</b></p>","exp":"<p>Verses 4 and 5 form the sharpest contrast in the chapter:</p><table><tr><th>Verse 4</th><th>Verse 5</th></tr><tr><td>God’s <b>riches</b> (πλοῦτος)</td><td>your <b>store</b> (θησαυρίζεις)</td></tr><tr><td>God’s kindness <b>leads</b> you (ἄγει)</td><td>your heart is <b>hard</b> (σκληρότης)</td></tr><tr><td>destination: <b>repentance</b></td><td>destination: <b>the day of wrath</b></td></tr></table><p><b>Two accounts, two directions — and every day something is being paid into both.</b><br>On God’s side, kindness is deposited daily; on yours, if there is no repentance, wrath is deposited daily.</p><p>And “revelation” (ἀποκάλυψις) answers to 1:17–18:</p><p>· 1:17 the righteousness of God <b>is revealed</b><br>· 1:18 the wrath of God <b>is revealed</b><br>· 2:5 the revelation of God’s righteous judgement</p><p>The gospel now reveals God’s righteousness; the day of judgement will reveal his righteous verdict.</p><p><b>You are living between those two revealings. That interval is called the time of grace.</b></p>"},{"a":6,"z":6,"star":false,"grk":"<p>ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·</p>","lit":"<p>“Who will <b>repay each one</b> according to his works.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>will repay</td><td>ἀποδώσει</td><td>apodōsei</td><td>G591</td><td>ἀπό + δίδωμι: <b>to pay back, to settle in full</b> (a commercial term — paying wages, discharging a debt)</td></tr><tr><td>each one</td><td>ἑκάστῳ</td><td>hekastō</td><td>G1538</td><td>each individual person</td></tr></table>","gram":"<p>This is <b>a direct quotation of the Old Testament</b>:</p><p>· Psalm 62:12 (LXX 61:13), “you repay each one according to his work”<br>· Proverbs 24:12, “will he not repay each one according to his work?”</p><p><b>ἑκάστῳ (each one)</b> is the point: not repayment <b>by nation</b>, but <b>by individual</b>. That single word goes straight through the collective insurance policy of “I am a son of Abraham, therefore I am safe.”</p>","exp":"<p>Some readers stumble here: <b>does Paul not teach justification by faith? How can he now speak of repayment according to works?</b></p><p>Note that Paul is <b>not describing the method of salvation here; he is describing the standard of judgement</b>. That standard is the same for everyone — and it is precisely that standard which makes the conclusion of 3:20 inevitable: “by the works of the law no flesh will be justified in his sight.”</p><p>In other words: <b>God judges according to works — and that is exactly why we must be justified by faith, not the reverse.</b></p><p>(For the full discussion, see the disputed material.)</p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 τοῖς μὲν καθ' ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον· 8 τοῖς δὲ ἐξ ἐριθείας καὶ ἀπειθοῦσιν τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ὀργὴ καὶ θυμός.</p>","lit":"<p>7 “On the one hand, to those who, by <b>steady endurance in good work</b>, seek glory and honour and <b>imperishability</b> — eternal life.”</p><p>8 “But to those who are <b>self-seeking</b>, and <b>refuse to be persuaded</b> by the truth while <b>being persuaded</b> by unrighteousness — wrath and fury.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>patience / endurance</td><td>ὑπομονή</td><td>hypomonē</td><td>G5281</td><td>ὑπό (under) + μένω (to remain): <b>to stand fast under a weight rather than run</b></td></tr><tr><td>self-seeking</td><td>ἐριθεία</td><td>eritheia</td><td>G2052</td><td>originally “hired labour” → <b>faction-building for private gain, self-seeking</b></td></tr><tr><td>disobey</td><td>ἀπειθοῦσιν</td><td>apeithousin</td><td>G544</td><td>ἀ + πείθω: <b>to refuse to be persuaded</b> (not ignorance — unwillingness)</td></tr><tr><td>imperishability</td><td>ἀφθαρσία</td><td>aphtharsia</td><td>G861</td><td>incorruption (the word used of the resurrection body in 1 Corinthians 15)</td></tr></table>","gram":"<p><b>① The μέν … δέ construction</b> (τοῖς μέν in v. 7 / τοῖς δέ in v. 8) — the standard Greek contrast.</p><p><b>② A chiasm</b></p><pre>A  v.7   good  → eternal life\n B v.8   evil  → wrath and fury\n B′v.9   evil  → tribulation and distress (to the Jew first)\nA′ v.10  good  → glory, honour and peace (to the Jew first)</pre><p>Paul deliberately puts “evil” in the middle and “good” at both ends, and then adds “to the Jew first, and also to the Greek” in both verse 9 and verse 10 — so the order of 1:16 (salvation) is applied <b>equally</b> to judgement.</p><p><b>The greater the privilege, the greater the responsibility.</b></p><p><b>③ The pun in ἀπειθοῦσιν τῇ ἀληθείᾳ / πειθομένοις τῇ ἀδικίᾳ</b></p><p>One root, πείθω:<br>· <b>not</b> being persuaded by the truth<br>· <b>but</b> being persuaded by unrighteousness</p><p><b>This is not a question of ignorance. It is a question of whom you are willing to be persuaded by.</b></p>","exp":"<p>The weight of “patient continuance in doing good” lies in <b>ὑπομονή</b> — not “having done a great many good deeds,” but <b>continuing under pressure without giving up</b>. That is the exact opposite of ἐριθεία in verse 8 (self-seeking faction): one is a sustained seeking of God’s glory, the other a sustained seeking of one’s own advantage.</p><p>Note that verse 7 says these people <b>seek</b> (ζητοῦσιν) glory, honour and imperishability. <b>They are not seeking a moral score; they are seeking the glory God himself gives.</b> That is the exact reverse of 1:21–23: there, people “did not glorify him as God”; here, people seek glory.</p><p><b>What the text plainly says:</b> God’s judgement is according to each person’s works, without partiality; and the more a person has been entrusted with, the more strictly he is judged.</p><p><b>What may fairly be drawn from it:</b> “endurance” reminds us that the reality of a spiritual life is not measured by the enthusiasm of the start, but by <b>persistence under pressure</b>.</p>"},{"a":11,"z":11,"star":true,"grk":"<p>οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.</p>","lit":"<p>“For with God there is no such thing as <b>receiving the face</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>partiality</td><td>προσωπολημψία</td><td>prosōpolēmpsia</td><td>G4382</td><td>πρόσωπον (face) + λαμβάνω (to receive, to lift): <b>a Hebraising Greek compound</b>, coined directly from the Hebrew idiom <b>nasa panim</b> (“to lift the face”)</td></tr></table>","gram":"<p><b>Old Testament background:</b></p><p>· Deuteronomy 10:17, “who shows no partiality and takes no bribe”<br>· Leviticus 19:15, “you shall not favour the poor nor defer to the great”<br>· 2 Chronicles 19:7, “with the LORD our God there is no injustice, nor partiality”</p><p>In an ancient courtroom, when a person of rank came in, the judge would <b>“lift his face”</b> — receive him, show him deference.</p><p><b>In God’s court there is no such thing.</b></p><p>· The noun stands at the centre of the sentence, with the negative οὐ before it — <b>a flat denial</b>.<br>· <b>παρὰ τῷ θεῷ</b> (with God) is dative — <b>at God’s judgement seat</b>.</p>","exp":"<p>This verse is the summary of 2:1–10, and the pivot of the chapter. And God’s impartiality cuts on both edges:</p><p><b>1. To the Jew:</b> your identity gives you no exemption.<br><b>2. To the Gentile:</b> your origin takes away no opportunity.</p><p>This one verse both judges pride and opens the door of the gospel.</p><p>· If God were partial, there could be no gospel for the Gentiles;<br>· If God were partial, grace would be a privilege.</p><p><b>It is precisely because God is not partial that grace can be for everyone.</b></p>"},{"a":12,"z":12,"star":false,"grk":"<p>ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται.</p>","lit":"<p>“For as many as sinned <b>outside the law</b> will also perish <b>outside the law</b>; and as many as sinned <b>within the law</b> will be judged <b>through the law</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>without law</td><td>ἀνόμως</td><td>anomōs</td><td>G460</td><td>adverb: <b>outside the law</b> (not “lawlessly” in the moral sense)</td></tr><tr><td>sinned</td><td>ἥμαρτον</td><td>hēmarton</td><td>G264</td><td>ἁμαρτάνω, <b>aorist</b>: to miss the mark</td></tr><tr><td>will perish</td><td>ἀπολοῦνται</td><td>apolountai</td><td>G622</td><td>future middle: to perish, to be lost</td></tr></table>","gram":"<p><b>① Both occurrences of ἥμαρτον are aorist.</b> The aorist here takes <b>a summary view</b> — treating a whole life of sin as a single whole.</p><p><b>② ἀνόμως occurs twice, and that is the point.</b> “Those who sinned <b>outside the law</b> will also perish <b>outside the law</b>” — Gentiles will not be judged by the law of Moses simply because they never had it. But that does not mean they are safe: <b>they are judged by the light they did have.</b></p><p><b>③ The rhetorical balance</b></p><pre>ἀνόμως ἥμαρτον    →  ἀνόμως ἀπολοῦνται\nἐν νόμῳ ἥμαρτον   →  διὰ νόμου κριθήσονται</pre><p>Perfectly symmetrical: <b>the mode of judgement matches the revelation received.</b></p>","exp":"<p>This is the deepest aspect of God’s justice: <b>God judges each person according to the light that person received.</b></p><p>No one will be wronged by being told “you never heard”; and no one is automatically saved by “I never heard” either — <b>because no one is entirely without light</b> (1:19–20; 2:14–15).</p>"},{"a":13,"z":13,"star":false,"grk":"<p>οὐ γὰρ οἱ ἀκροαταὶ νόμου δίκαιοι παρὰ [τῷ] θεῷ, ἀλλ' οἱ ποιηταὶ νόμου δικαιωθήσονται.</p>","lit":"<p>“For it is not the <b>hearers</b> of the law who are righteous before God, but the <b>doers</b> of the law who will be justified.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>hearers</td><td>ἀκροαταί</td><td>akroatai</td><td>G202</td><td>ἀκροάομαι (to listen): <b>an audience at a lecture or in a theatre</b></td></tr><tr><td>doers</td><td>ποιηταί</td><td>poiētai</td><td>G4163</td><td>ποιέω: <b>makers, doers</b> (the source of English “poet”)</td></tr><tr><td>will be justified</td><td>δικαιωθήσονται</td><td>dikaiōthēsontai</td><td>G1344</td><td><b>future passive</b>: will be declared righteous</td></tr></table>","gram":"<p><b>① The picture in ἀκροατής</b></p><p>In the Greek world this word denoted <b>someone listening to a speech in a lecture hall or theatre</b> — seated, appreciating, applauding, and going home.</p><p><b>Paul says: if you are only an audience for God’s word, you are not a righteous man.</b><br>(James 1:22–25 uses the same pair: “be doers (ποιητής) of the word, and not hearers (ἀκροατής) only, deceiving yourselves.”)</p><p><b>② δικαιωθήσονται is future passive</b><br>· <b>future</b>: pointing to the verdict of the last day<br>· <b>passive</b> (a divine passive): <b>God does the justifying; no one justifies himself</b></p>","exp":"<p>Here Paul strips the Jews’ proudest practice back to nothing — hearing the law read in the synagogue every Sabbath.</p><p><b>“Hearing” was the supreme spiritual activity in Jewish tradition</b> — “<b>Hear</b>, O Israel!” (the Shema, Deuteronomy 6:4). But the Hebrew <b>shama‘ (to hear) itself contains the sense of obeying</b>.</p><p><b>The Jews had Hellenised “hearing” into “k
