hmalōtizō</td><td>G163</td><td>αἰχμή（矛）+ ἁλωτός（被擒）</td><td><b>擄為戰俘</b></td><td>軍事用語</td></tr></table>","gram":"<p>★ 亮光一：συνήδομαι ——「由衷地一同歡喜」</p><p>這個字在新約<b>只出現這一次</b>。</p><p>它不是「我同意」「我知道那是對的」。</p><p>σύν（一同）+ ἥδομαι（歡喜、以之為樂）——</p><p>意思是：<b>我打從心底，與神的律一同歡喜</b>。</p><p>弟兄姊妹，這個字非常重要。</p><p>因為保羅在3:11剛說過：「沒有尋求神的。」<br>在8:7說：「原來體貼肉體的，就是與神為仇；因為不服神的律法，也是不能服。」</p><p>一個「與神為仇」的人，會<b>由衷地喜悅神的律</b>嗎？</p><p>這是「這個『我』是重生的人」這一派最強的論據之一。</p><p>★ 亮光二：ὁ ἔσω ἄνθρωπος（裡面的人）</p><p>保羅在其他地方用這個詞組：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>林後4:16</b></td><td>「外體雖然毀壞，<b>內心</b>（ὁ ἔσω）卻一天新似一天。」</td></tr><tr><td><b>弗3:16</b></td><td>「藉著他的靈，叫你們<b>心裡</b>（ἔσω ἄνθρωπον）的力量剛強起來。」</td></tr></table><p>在這兩處，「裡面的人」都明確指<b>信徒被聖靈更新的內在生命</b>。</p><p>這也是「重生說」的重要論據。</p><p>（但持「未重生說」的學者會說：這裡的「裡面的人」指的是理性與良心，希臘哲學也有類似的用法。見第二十部分。）</p><p>★ 亮光三：兩個軍事用語</p><pre>ἀντιστρατεύομαι —— 發動對抗性的戰爭（新約僅此一次）\nαἰχμαλωτίζω     —— 擄為戰俘</pre><p>保羅的畫面是一場<b>真正的戰爭</b>。</p><p>而他是那個<b>被俘虜的士兵</b>。</p><p>注意 αἰχμαλωτίζω 的含意：</p><p>戰俘不是叛徒。</p><p>戰俘是<b>站在對的一邊、卻被抓走的人</b>。</p><p>他的忠誠沒有改變，但他的行動被限制了。</p><p>（保羅在林後10:5用同一個字的正面版本：「將人所有的心意<b>奪回</b>，使他都順服基督。」）</p><p>★ 亮光四：四個「律」</p><p>7:21–25出現了好幾個「律」（νόμος），需要分清楚：</p><table><tr><th>出處</th><th>「律」指什麼</th></tr><tr><td>7:21「有個律」</td><td><b>一個規律、原理</b>（不是摩西律法）</td></tr><tr><td>7:22「神的律」</td><td>摩西律法／神的旨意</td></tr><tr><td>7:23「我心中的律」</td><td>我心思所認同的那個原則</td></tr><tr><td>7:23「肢體中犯罪的律」</td><td><b>罪的規律／權勢</b></td></tr><tr><td>8:2「賜生命聖靈的律」</td><td>聖靈的規律／權勢</td></tr></table><p>保羅在這裡用 νόμος 的雙關：既指摩西律法，也指「一種運作的規律」。</p><p>就像我們說「地心引力定律」——那不是法條，是一種<b>必然運作的力量</b>。</p>","exp":"<p>弟兄姊妹，7:21–23畫出了一個非常具體的處境：</p><pre>我裡面的人：由衷喜歡神的律（συνήδομαι）\n   ↓\n我的肢體：另有一個律在運作\n   ↓\n兩邊開戰（ἀντιστρατεύομαι）\n   ↓\n結果：我被擄走了（αἰχμαλωτίζω）</pre><p>而「被擄走」這個字，正是這一段最深的痛：</p><p>我不是叛變。我是<b>被抓走</b>的。</p><p>我心裡站在對的一邊，我的身體卻在敵營裡。</p><p>【第六段｜7:24–25　呼喊與感謝】</p>"},{"a":24,"z":24,"star":true,"grk":"<p>ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;</p>","lit":"<p>「<b>我這個人，真是悲慘啊</b>！<b>誰</b>能<b>拉我脫離</b>這<b>死亡的身體</b>？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>苦</td><td>ταλαίπωρος</td><td>talaipōros</td><td>G5005</td><td>—</td><td><b>悲慘的、受盡折磨的</b></td><td>見下</td></tr><tr><td>救</td><td>ῥύσεται</td><td>rhysetai</td><td>G4506</td><td>ῥύομαι</td><td><b>拉出來、搶救出來</b></td><td>見下</td></tr><tr><td>取死的身體</td><td>τὸ σῶμα τοῦ θανάτου</td><td>—</td><td>G4983/G2288</td><td>—</td><td>死亡的身體</td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：ταλαίπωρος ——極重的一個字</p><p>這個字在新約只出現兩次：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>羅7:24</b></td><td>「我真是<b>苦</b>啊！」</td></tr><tr><td><b>啟3:17</b></td><td>老底嘉教會：「你卻不知道你是那<b>困苦</b>、可憐、貧窮、瞎眼、赤身的。」</td></tr></table><p>在七十士譯本中，它用於形容被擄的以色列、被壓傷的人。</p><p>（雅5:1用其動詞形：「你們要哭泣號咷。」）</p><p>這不是「我有點沮喪」。</p><p>這是一個人在絕境中的呼喊。</p><p>★ 亮光二：ῥύομαι ——「拉出來」</p><p>這個動詞的意思不是「幫助」，是<b>從危險中把人拉出來、搶救</b>。</p><p>其他用法：</p><p>- <b>太6:13</b>「<b>救</b>我們脫離兇惡」（主禱文！）<br>- <b>西1:13</b>「他<b>救</b>了我們脫離黑暗的權勢」<br>- <b>帖前1:10</b>「就是耶穌<b>救</b>我們脫離將來忿怒的」</p><p>保羅要的不是幫助，不是指導，不是方法。</p><p>他要的是<b>搶救</b>。</p><p>★ 亮光三：「誰」而不是「什麼」</p><p>τίς με ῥύσεται——「<b>誰</b>能救我？」</p><p>保羅沒有問：</p><p>- 「什麼方法能救我？」<br>- 「什麼原則能救我？」<br>- 「我該做什麼才能救自己？」</p><p>他問的是：<b>誰</b>。</p><p>弟兄姊妹，這是第七章最重要的一個轉折。</p><p>從一個<b>方法</b>的問題，變成一個<b>位格</b>的問題。</p><p>而下一句話，就是那個名字。</p><p>★ 亮光四：τὸ σῶμα τοῦ θανάτου（取死的身體）</p><p>兩種主要理解：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>「這具會死的身體」</b></td><td>指必朽壞的身體（8:11「必死的身體」）</td></tr><tr><td><b>「這具被死轄制的身體」</b></td><td>指身體作為罪與死運作的場所</td></tr></table><p>（歷史上曾有一種說法，說古代刑罰會把屍體綁在犯人身上——但這個說法<b>缺乏可靠的古代史料支持</b>，講台上不宜使用。）</p><p>無論哪一種理解，保羅的重點是：這個處境，我自己出不來。</p>","exp":"<p>弟兄姊妹，7:24是全卷羅馬書情緒的最低點。</p><p>但請注意兩件事：</p><p>第一，這聲呼喊是<b>進步</b>，不是退步。</p><p>一個人要走到7:24，必須先走過7:18——</p><p>「立志為善由得我，只是行出來由不得我。」</p><p>也就是說：他必須先<b>用盡全力嘗試過</b>，才會喊出這句話。</p><p>一個從來沒有認真想過要聖潔的人，喊不出7:24。</p><p>第二，這聲呼喊的方向是<b>向外</b>的。</p><p>他沒有說「我要更努力」。<br>他問：「<b>誰</b>能救我？」</p><p>當一個人不再問「我該怎麼辦」，而開始問「誰能救我」——</p><p>福音就有地方可以進來了。</p>"},{"a":25,"z":25,"star":true,"grk":"<p>χάρις δὲ τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.</p>","lit":"<p>「但<b>感謝神</b>——藉著我們的主耶穌基督！所以這樣看來：我自己，<b>用心思</b>服事神的律，<b>用肉體</b>卻服事罪的律。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>感謝神</td><td>χάρις τῷ θεῷ</td><td>charis tō theō</td><td>G5485</td><td><b>恩典歸與神／感謝神</b></td></tr><tr><td>心</td><td>νοῦς</td><td>nous</td><td>G3563</td><td>心思、理智</td></tr></table>","gram":"<p>★ 亮光一：答案是一個名字</p><p>7:24問：「<b>誰</b>能救我？」</p><p>7:25答：「<b>藉著我們的主耶穌基督</b>。」</p><p>注意：保羅沒有給一個方法、一套步驟、一個屬靈操練。</p><p>他給了一個<b>名字</b>。</p><p>★ 亮光二：χάρις τῷ θεῷ 的字面</p><p>這句話的字面是「<b>恩典歸與神</b>」。</p><p>在最深的絕望之後，保羅第一個反應是——<b>敬拜</b>。</p><p>★ 亮光三：7:25下半的難題</p><p>「感謝神」之後，保羅又說：「我以內心順服神的律，我肉體卻順服罪的律了。」</p><p>這讓許多讀者困惑：既然已經「感謝神」了，為什麼又回到掙扎？</p><p>兩種主要理解（見第三部分結構分析）：</p><table><tr><th>理解</th><th>說明</th></tr><tr><td><b>總結性倒敘</b></td><td>保羅先喊出答案（25上），再回頭<b>總結</b>前面的診斷（25下），然後8:1才正式展開</td></tr><tr><td><b>描述今世的現況</b></td><td>得救之人在今世的真實狀態：內心順服神，肉體仍有罪的殘餘，直到身體得贖（8:23）</td></tr></table><p>兩種理解都指向同一件事：</p><p>8:1的「如今」才是真正的展開。</p><p>而8:23說得很清楚：我們「等候得著兒子的名分，乃是我們的<b>身體得贖</b>」——<br>完全的釋放，要等到那一天。</p>","exp":"<p>弟兄姊妹，7:25上半只有一句話，卻是整章的出口。</p><p>而這句話有三個特點：</p><p>1. <b>它是感謝</b>，不是決心<br>2. <b>它指向一位</b>，不是一個方法<br>3. <b>它緊接在最深的絕望之後</b>——中間沒有過渡</p><p>保羅沒有讓那聲呼喊懸在空中超過一句話。</p><p>而8:1會把這句話完整展開：</p><p><b>「如今，那些在基督耶穌裡的就不定罪了。因為賜生命聖靈的律，在基督耶穌裡釋放了我，使我脫離罪和死的律了。」</b>（8:1–2）</p><p>注意8:2的「釋放」——ἐλευθερόω。</p><p>7:24問：誰能救（ῥύομαι）我？<br>8:2答：聖靈的律<b>釋放</b>（ἐλευθερόω）了我。</p><p>第七章的問題，在第八章有一個完整的、三一神的答案。</p>"}],"8":[{"a":1,"z":1,"star":true,"grk":"<p>Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>「所以<b>如今</b>，對那些在基督耶穌裡的人，<b>沒有一點定罪</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>沒有</td><td>οὐδέν</td><td>ouden</td><td>G3762</td><td>οὐδέ + εἷς</td><td><b>一點也沒有</b>（強調的否定）</td><td>見下</td></tr><tr><td>如今</td><td>νῦν</td><td>nyn</td><td>G3568</td><td>—</td><td><b>現在、此刻</b></td><td>3:21「但如今」的呼應</td></tr><tr><td>定罪</td><td>κατάκριμα</td><td>katakrima</td><td>G2631</td><td>κατά + κρίνω</td><td><b>判決、定罪的判詞</b></td><td><b>5:16、18同字</b></td></tr><tr><td>在基督耶穌裡</td><td>ἐν Χριστῷ Ἰησοῦ</td><td>—</td><td>—</td><td>—</td><td>保羅神學的核心</td><td>位置，不是修辭</td></tr></table>","gram":"<p>★ 亮光一：句首的 Οὐδέν 是強調位置</p><p>希臘文原句的第一個字，就是「<b>一點也沒有</b>」。</p><p>中文的語序是「如今……就不定罪了」；原文是：</p><p>「<b>一點定罪也沒有</b>——所以，如今，對那些在基督耶穌裡的人。」</p><p>保羅把「沒有」放在最前面，像一記重錘先落下來。</p><p>★ 亮光二：κατάκριμα 不是「定罪的行為」，是「判決本身」</p><p>希臘文有兩個相關的字：</p><table><tr><th>字</th><th>意思</th></tr><tr><td><b>κατάκρισις</b></td><td>定罪的<b>動作</b></td></tr><tr><td><b>κατάκριμα</b></td><td><b>判決的內容／刑罰本身</b>（-μα 結尾表示結果）</td></tr></table><p>所以8:1不只是說「神現在不定你的罪」，<br>而是說：<b>那份判決書，本身不存在了</b>。</p><p>這個字在羅馬書只出現三次，全部在第五章與第八章：</p><pre>5:16  審判是由一人而定罪（κατάκριμα）\n5:18  因一次的過犯，眾人都被定罪（κατάκριμα）\n8:1   如今……就不定罪（κατάκριμα）了</pre><p>第五章說：亞當帶來了那份判決書。<br>第八章說：在基督裡的人，那份判決書沒有了。</p><p>★ 亮光三：關於8:1的抄本問題（必須誠實處理）</p><p>部分較晚的抄本在8:1末尾加上：「不隨從肉體、只隨從聖靈的人。」</p><p>多數現代學者認為：</p><p>這句話是抄寫員從8:4誤抄過來的（同化現象）。</p><p>較早的抄本（如西乃抄本、梵蒂岡抄本）在8:1沒有這一句。</p><p>這件事為什麼重要？</p><p>因為若加上那句話，8:1就變成<b>有條件的</b>：<br>「你若隨從聖靈，就不定罪。」</p><p>而按較早的讀法，8:1是<b>無條件的</b>：<br>「在基督耶穌裡的，就不定罪了。」</p><p>講台誠信提醒：可以說「早期抄本在這裡沒有那個附加句」，但不要說「和合本翻錯了」——<br>和合本正文其實就沒有那一句，這正符合現代學術的判斷。</p>","exp":"<p>弟兄姊妹，8:1要接在7:24之後讀，才知道它有多大。</p><pre>7:24  「我真是苦啊！誰能救我？」\n8:1   「如今，那些在基督耶穌裡的就不定罪了。」</pre><p>一個剛剛承認自己完全失敗的人，聽見的第一句話是：</p><p>「沒有定罪。」</p><p>不是「你要改進」。<br>不是「下次不可以了」。<br>是——<b>一點定罪也沒有</b>。</p>"},{"a":2,"z":2,"star":false,"grk":"<p>ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.</p>","lit":"<p>「因為那<b>生命之靈的律</b>，在基督耶穌裡，<b>釋放了你</b>，脫離了罪與死的律。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>律</td><td>νόμος</td><td>nomos</td><td>G3551</td><td>此處指<b>運作的規律／權勢</b>（如「地心引力定律」）</td></tr><tr><td>釋放</td><td>ἠλευθέρωσεν</td><td>ēleutherōsen</td><td>G1659</td><td><b>使之自由</b>（6:18、6:22同字）</td></tr></table>","gram":"<p>★ 亮光一：這裡的「律」是什麼意思？</p><p>保羅在7:21–23已經用過 νόμος 的雙關：</p><table><tr><th>出處</th><th>「律」的意思</th></tr><tr><td>7:22「神的律」</td><td>摩西律法</td></tr><tr><td>7:23「肢體中犯罪的律」</td><td><b>一種運作的規律／權勢</b></td></tr><tr><td><b>8:2「賜生命聖靈的律」</b></td><td><b>一種運作的規律／權勢</b></td></tr></table><p>保羅在說：這不是「一套新規矩取代舊規矩」。</p><p>這是<b>一種更強的力量，勝過了另一種力量</b>。</p><p>打個比方：</p><p>地心引力是一個定律——東西會往下掉。</p><p>但一架飛機起飛了。</p><p>地心引力被廢除了嗎？沒有。<br>是有一個<b>更強的力量</b>，勝過了它。</p><p>★ 亮光二：一個抄本問題</p><p>8:2末尾「釋放了<b>我</b>」還是「釋放了<b>你</b>」？</p><p>- 部分抄本作 <b>με</b>（我）——和合本採此讀法<br>- 部分較早的抄本作 <b>σε</b>（你）</p><p>兩種讀法對神學沒有影響。<br>若是「你」，則保羅在此突然轉向讀者，語氣更直接：<br>「你」——就是還在7:24裡呼喊的那個你。</p><p>★ 亮光三：7:24與8:2的動詞對照</p><pre>7:24  τίς με ῥύσεται      —— 誰能「救」（搶救出來）我？\n8:2   ἠλευθέρωσέν σε      —— 聖靈的律「釋放」了你</pre><p>第七章問了一個問題，第八章給了一個<b>已完成</b>的動詞（不定過去式）。</p><p>不是「聖靈會釋放你」，是「<b>已經釋放了</b>」。</p>","exp":"<p>弟兄姊妹，8:1說了結果（不定罪）；8:2說的是<b>原因</b>。</p><p>而保羅用了一個很特別的說法：<b>兩個「律」在角力</b>。</p><pre>罪和死的律   ——  在第七章，那是贏的一方（7:23）\n賜生命聖靈的律 ——  在第八章，換了一位更強的</pre><p><b>經文本身明確表達的：</b> 在基督耶穌裡，聖靈的律已經（不定過去式）把人從罪和死的律之下釋放出來。</p><p><b>可以合理推論的：</b> 「釋放」不是「那個律消失了」。<br>地心引力沒有被廢除；只是有一個更強的力量勝過了它。</p><p>所以第七章那個掙扎不會在第八章完全消失——<br>改變的是：<b>你不再是一個人在打</b>（8:26）。</p><p><b>⚠ 牧養提醒：</b> 若有人讀完第八章，以為「真信主的人就不會再掙扎了」，<br>那是誤讀。8:23明說：連有聖靈的人「<b>也是</b>自己心裡歎息」。</p>"},{"a":3,"z":4,"star":true,"grk":"<p>3 Τὸ γὰρ ἀδύνατον τοῦ νόμου ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινεν τὴν ἁμαρτίαν ἐν τῇ σαρκί,<br>4 ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα.</p>","lit":"<p>3「因為律法所<b>做不到的</b>——就是它因肉體而軟弱之處——神就差遣自己的兒子，<b>在罪之肉身的樣式中</b>，並且為了罪，<b>在肉體中定了罪的罪</b>；」<br>4「為要使律法的<b>義的要求</b>，<b>被成就在我們裡面</b>——就是我們這些不照著肉體、乃照著聖靈而行的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>不能行的</td><td>τὸ ἀδύνατον</td><td>to adynaton</td><td>G102</td><td>ἀ + δύναμις（能力）</td><td><b>無能為力之處</b></td><td>律法的無能</td></tr><tr><td>形狀</td><td>ὁμοίωμα</td><td>homoiōma</td><td>G3667</td><td>ὅμοιος（相似）</td><td><b>樣式、相似的形狀</b></td><td><b>極重要</b>（見下）</td></tr><tr><td>定了罪案</td><td>κατέκρινεν</td><td>katekrinen</td><td>G2632</td><td>κατά + κρίνω</td><td><b>定罪、判決</b></td><td>8:1 κατάκριμα 的動詞</td></tr><tr><td>義（的要求）</td><td>δικαίωμα</td><td>dikaiōma</td><td>G1345</td><td>δίκαιος</td><td><b>義的要求／判決</b></td><td><b>2:26同字！</b></td></tr><tr><td>成就</td><td>πληρωθῇ</td><td>plērōthē</td><td>G4137</td><td>πληρόω</td><td><b>被成全</b>（<b>被動式</b>！）</td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：ὁμοίωμα ——保羅極度精確的用字</p><p>「成為<b>罪身的形狀</b>」——這五個字，保羅寫得極其小心。</p><p>他<b>沒有</b>說：</p><p>- ❌ 「成為罪身」（那就是說基督有罪性）<br>- ❌ 「成為肉身的形狀」（那就是幻影說，否認真實的人性）</p><p>他說的是：</p><p>ἐν ὁμοιώματι σαρκὸς ἁμαρτίας ——「在<b>罪之肉身的樣式</b>中」。</p><p>這句話同時保住了兩件事：</p><table><tr><th>保住的真理</th><th>說明</th></tr><tr><td><b>祂真的成為人</b></td><td>是真實的肉身，不是幻影（約1:14；來2:14）</td></tr><tr><td><b>祂沒有罪</b></td><td>是「樣式」，不是罪性本身（來4:15「只是他沒有犯罪」；林後5:21「那不知罪的」）</td></tr></table><p>弟兄姊妹，這是新約中最精密的一句基督論陳述之一。</p><p>祂進到了我們的處境<b>裡面</b>——但祂沒有沾染那個處境的罪。</p><p>★ 亮光二：「在肉體中定了罪案」——定罪落在哪裡？</p><p>κατέκρινεν τὴν ἁμαρτίαν ἐν τῇ σαρκί ——「在肉體中，定了罪的罪」。</p><p>注意：定罪的對象是<b>罪</b>，不是人。</p><p>而定罪的<b>地點</b>是「在肉體中」——</p><p>在哪一個肉體中？</p><p>在<b>祂的</b>肉體中。在十字架上。</p><p>於是8:1與8:3形成一個完整的對句：</p><pre>8:3  神在基督的肉體中「定了罪」（κατέκρινεν）\n   ↓ 所以\n8:1  在基督裡的人「不被定罪」（κατάκριμα）</pre><p>定罪沒有消失。定罪換了地址。</p><p>★ 亮光三：8:4「被成就」是被動式！</p><p>「使律法的義<b>成就</b>在我們……身上」——πληρωθῇ 是<b>被動式</b>。</p><p>不是「我們去成就律法的義」，<br>是「律法的義<b>被成就</b>在我們裡面」。</p><p>主動者是誰？是神藉著聖靈。</p><p>而且介詞是 <b>ἐν ἡμῖν</b>——「<b>在我們裡面</b>」，不只是「在我們身上」。</p><p>★ 亮光四：δικαίωμα 與2:26的呼應</p><p>「律法的義」（τὸ δικαίωμα τοῦ νόμου）這個詞組，在羅馬書只出現兩次：</p><pre>2:26  那未受割禮的，若遵守律法的條例（δικαιώματα）……\n8:4   使律法的義（δικαίωμα）成就在我們……身上</pre><p>保羅在第二章丟出的問題——「一個外邦人怎麼可能遵守律法的條例？」——</p><p>在第八章給了答案：<b>靠聖靈</b>。</p>","exp":"<p>弟兄姊妹，8:3是第七章的直接答案。</p><pre>7:18  「立志為善由得我，只是行出來由不得我」  —— 我做不到\n8:3   「律法既因肉體軟弱，有所不能行的」      —— 律法也做不到\n   ↓\n8:3   「神就差遣自己的兒子……」                —— 所以神自己做了</pre><p>第七章的絕望，不是因為你不夠好。<br>是因為那條路，<b>本來就走不通</b>——連律法自己都走不通。</p><p>所以神換了一條路：祂差祂的兒子來。</p><p>【第二段｜8:5–11　兩種心思】</p>"},{"a":5,"z":8,"star":false,"grk":"<p>6 τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·</p>","lit":"<p>5「因為那些照著肉體而活的人，<b>心思定在</b>肉體的事上；那些照著聖靈而活的人，<b>心思定在</b>聖靈的事上。」<br>6「因為肉體的<b>心思傾向</b>就是<b>死</b>；而聖靈的心思傾向，就是<b>生命與平安</b>。」<br>7「因為肉體的心思傾向<b>是與神為敵</b>：它<b>不服</b>神的律法，<b>實在也不能服</b>；」<br>8「而那些在肉體裡的人，<b>不能討神的喜悅</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>體貼</td><td>φρονέω／φρόνημα</td><td>phroneō/phronēma</td><td>G5426/G5427</td><td>φρήν（心思）</td><td><b>心之所向、思想的定向</b></td><td>見下</td></tr><tr><td>平安</td><td>εἰρήνη</td><td>eirēnē</td><td>G1515</td><td>—</td><td>和平（שָׁלוֹם）</td><td><b>5:1「與神相和」同字</b></td></tr><tr><td>不能服</td><td>οὐδὲ γὰρ δύναται</td><td>—</td><td>G1410</td><td>δύναμαι</td><td><b>也是不能</b></td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：φρόνημα 不只是「想什麼」，是「心朝哪裡」</p><p>φρονέω 的意思不是單純的「思考」，而是</p><p>「心思的定向、關切的方向、所看重的東西」。</p><p>（腓2:5「你們當以基督耶穌的心為心」——同字根；腓3:19「專以地上的事為念」——同字）</p><p>和合本譯「體貼」譯得極好：</p><p>不是「我腦子裡想什麼」，是「我的心<b>向著誰</b>」。</p><p>★ 亮光二：8:7「不能服」的絕對性</p><p>「不服神的律法，也是<b>不能</b>服（οὐδὲ δύναται）。」</p><p>這不是「不太願意」，是「<b>沒有這個能力</b>」。</p><p>弟兄姊妹，這一節與7:22形成一個重要的張力：</p><pre>7:22  「按著我裡面的意思，我是喜歡神的律」\n8:7   「體貼肉體的……不服神的律法，也是不能服」</pre><p>這正是第七章「這個『我』是誰」爭議的核心之一（見羅7的討論）。</p><p>但無論如何，8:7說得很清楚：肉體的心思，<b>沒有能力</b>服神。</p><p>所以出路不是「更用力去服」，是「換一種心思」。</p>","exp":"<p>弟兄姊妹，8:5–8給了一個很實際的檢查方式：</p><p>不要問「我今天有沒有犯錯」。</p><p>問「我的心，最近向著哪裡」。</p><p>因為行為是果，心思的定向才是根。</p>"},{"a":9,"z":9,"star":true,"grk":"<p>ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλ' ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.</p>","lit":"<p>「但你們不在肉體裡，乃在靈裡——<b>既然</b>神的靈<b>住在你們裡面</b>。但若有人沒有基督的靈，這人就不屬於祂。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>住</td><td>οἰκεῖ</td><td>oikei</td><td>G3611</td><td><b>οἰκέω——7:17、18、20那個字！</b></td></tr><tr><td>如果</td><td>εἴπερ</td><td>eiper</td><td>G1512</td><td><b>既然、假定確實如此</b>（不是懷疑，是肯定的前提）</td></tr></table>","gram":"<p>★ 亮光一：οἰκέω ——全書最重要的一組對照</p><pre>7:17  乃是「住」（οἰκοῦσα）在我裡頭的「罪」做的\n7:18  我知道在我裡頭……沒有良善「居住」（οἰκεῖ）\n7:20  乃是「住」（οἰκοῦσα）在我裡頭的「罪」做的\n   ↓\n8:9   神的靈「住」（οἰκεῖ）在你們心裡\n8:11  叫耶穌從死裡復活者的靈若「住」（οἰκεῖ）在你們心裡</pre><p>同一個動詞，出現在兩章。</p><p>第七章：罪住在我裡面。<br>第八章：聖靈住在我裡面。</p><p>弟兄姊妹，這就是七章到八章的全部差別：</p><p>住在裡面的那一位，換了。</p><p>★ 亮光二：εἴπερ 不是懷疑，是肯定的前提</p><p>中文「如果」容易讓人以為保羅在質疑讀者有沒有聖靈。</p><p>εἴπερ 在希臘文中，通常表示「<b>既然事實如此</b>」的前提，而非「不確定」。</p><p>保羅的語氣是：</p><p>「你們<b>既然</b>有神的靈住在裡面——那你們就不在肉體裡了。」</p><p>★ 亮光三：三個名稱指同一位</p><p>在8:9–11短短三節裡，保羅用了三個名稱：</p><pre>8:9   神的靈（πνεῦμα θεοῦ）\n8:9   基督的靈（πνεῦμα Χριστοῦ）\n8:11  叫耶穌從死裡復活者的靈</pre><p>這是新約中三一神論的重要經文之一：</p><p>同一位聖靈，既是父的靈，也是子的靈。</p><p>★ 亮光四：8:9下半的斷語</p><p>「人若沒有基督的靈，就<b>不是屬基督的</b>。」</p><p>這句話極其嚴肅，也極其清楚：</p><p>有沒有聖靈，不是「基督徒的進階選項」。</p><p>它是<b>是不是基督徒</b>的定義。</p>","exp":"<p>弟兄姊妹，8:9是第七章那個問題的<b>答案</b>。</p><p>第七章的困局是什麼？</p><p>7:17、7:18、7:20——<b>罪住在我裡頭</b>（οἰκέω）。</p><p>而8:9用了<b>同一個動詞</b>：</p><p>「神的靈<b>住</b>（οἰκεῖ）在你們心裡。」</p><p><b>經文本身明確表達的：</b> 一個人是否「屬基督」，取決於基督的靈是否住在他裡面。</p><p><b>可以合理推論的：</b> 第七章到第八章的差別，<b>不是「我更努力了」，是「住客換了」</b>。</p><p>這正是321所說的：<b>無己不是自己把自己清空，是讓基督在我裡面活</b>。</p><p>而9節下半是一句極嚴肅的斷語：</p><p>「人若沒有基督的靈，就<b>不是屬基督的</b>。」</p><p><b>⚠ 牧養提醒：</b> 這句話<b>不是</b>用來讓人懷疑自己得救的。<br>保羅的語氣（εἴπερ ＝「既然事實如此」）是<b>肯定</b>讀者有聖靈，而不是質疑。<br>若有人因此陷入恐懼，請帶他回到8:15–16：那位使你能喊「阿爸」的，就是憑據。</p>"},{"a":10,"z":11,"star":false,"grk":"<p>11 …ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ τοῦ ἐνοικοῦντος αὐτοῦ πνεύματος ἐν ὑμῖν.</p>","lit":"<p>10「但基督若在你們裡面，身體固然因罪而<b>是死的</b>，靈卻因義而<b>是生命</b>。」<br>11「而那位<b>叫耶穌從死人中復活者的靈</b>，若住在你們裡面，那叫基督從死人中復活的，也必藉著<b>祂那住在你們裡面的靈</b>，<b>使你們必死的身體也活過來</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>使……活過來</td><td>ζῳοποιήσει</td><td>zōopoiēsei</td><td>G2227</td><td>ζωή + ποιέω：<b>使之活過來</b>（<b>4:17同字！</b>）</td></tr><tr><td>必死的</td><td>θνητός</td><td>thnētos</td><td>G2349</td><td>會死的、必朽壞的（<b>6:12同字！</b>）</td></tr></table>","gram":"<p>★ 亮光一：ζῳοποιέω ——第四章那個字回來了</p><pre>4:17  亞伯拉罕所信的，是那「叫死人復活」（ζῳοποιοῦντος）……的神\n   ↓\n8:11  也必……「使你們必死的身體又活過來」（ζῳοποιήσει）</pre><p>亞伯拉罕所信的那位神，就是要使你的身體復活的那位神。</p><p>★ 亮光二：θνητός ——第六章那個字回來了</p><pre>6:12  不要容罪在你們「必死的」（θνητῷ）身上作王\n   ↓\n8:11  使你們「必死的」（θνητά）身體又活過來</pre><p>第六章：這個必死的身體，是戰場。<br>第八章：這個必死的身體，要復活。</p><p>保羅從來不輕看身體。</p>","exp":"<p>弟兄姊妹，8:11是全本聖經對「身體」最有盼望的一節之一。</p><p>基督教的盼望<b>不是</b>「靈魂脫離身體」。</p><p>是<b>這個身體要活過來</b>。</p><p>【第三段｜8:12–17　兒子的名分】</p>"},{"a":12,"z":13,"star":false,"grk":"<p>13 …εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.</p>","lit":"<p>12「所以弟兄們，我們<b>是欠債的</b>——<b>但不是欠肉體的債</b>，要照著肉體活。」<br>13「因為你們若照著肉體活，<b>必要死</b>；但你們若<b>靠著聖靈</b>，<b>持續治死</b>身體的作為，<b>就必要活</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>欠債</td><td>ὀφειλέται</td><td>opheiletai</td><td>G3781</td><td><b>欠債的人</b>（<b>4:4 ὀφείλημα 同字根</b>）</td></tr><tr><td>治死</td><td>θανατοῦτε</td><td>thanatoute</td><td>G2289</td><td><b>治死、處死</b>（現在式：持續地）</td></tr><tr><td>惡行</td><td>πράξεις</td><td>praxeis</td><td>G4234</td><td>行為、作為</td></tr></table>","gram":"<p>★ 亮光一：「不欠肉體的債」</p><p>保羅用了一個帳目的字：ὀφειλέτης（欠債的人）。</p><p>弟兄姊妹，這是一個極重要的觀念：</p><p>肉體對你<b>沒有債權</b>。</p><p>它一天到晚來要債——但它手上沒有借據。</p><p>★ 亮光二：「靠著聖靈治死」——工具與主體</p><p>πνεύματι 是<b>與格</b>，表示<b>憑藉、藉著</b>。</p><pre>主體：你們（θανατοῦτε 是第二人稱複數）\n工具：聖靈（πνεύματι）</pre><p>注意兩件事：</p><p>① 動詞的主詞是「你們」——<b>這是要你去做的</b>。<br>② 但工具是聖靈——<b>不是靠你的意志力</b>。</p><p>這正好平衡了第六、七章的張力：<br>不是被動地等神做（那會落入不負責任），<br>也不是靠自己咬牙（那會落入第七章）。</p><p>★ 亮光三：現在式「治死」</p><p>θανατοῦτε 是現在式——<b>持續地、每天地</b>。</p><p>這與6:11「當看」（現在式命令）完全一致。</p><p>有一次的降服，也有每天的爭戰。</p><p>（關於8:13是否暗示「靠行為得救」，見第二十部分。）</p>","exp":"<p>弟兄姊妹，這兩節在第八章裡，是<b>唯一一段直接的命令</b>。</p><p>而保羅的用字很有意思：他說我們是「<b>欠債的</b>」——</p><p>但那句話沒有講完。</p><p>「我們並不是欠<b>肉體</b>的債」——那我們欠誰的？</p><p>保羅沒有明說。而答案在整卷書裡：</p><p>1:14「我都<b>欠他們的債</b>」；13:8「凡事都不可虧欠人，<b>惟有彼此相愛要常以為虧欠</b>」。</p><p><b>經文本身明確表達的：</b> 信徒不再欠肉體任何東西；照肉體活必要死，靠著聖靈治死身體的作為就必要活。</p><p><b>可以合理推論的：</b> 對付罪有兩個要件，<b>缺一不可</b>：</p><p>① 動詞的主詞是「<b>你們</b>」——這是要你去做的（不是被動等候）。<br>② 但工具是「<b>聖靈</b>」——不是靠你的意志力（那是第七章）。</p><p>而 θανατοῦτε 是現在式——<b>每天的</b>，不是一次的。</p><p><b>⚠ 牧養提醒：</b> 這一節不可講成「靠行為得救」。<br>保羅說的是：真有聖靈的人，會走上這條路；而這條路本身，是聖靈在走。</p>"},{"a":14,"z":15,"star":true,"grk":"<p>14 ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι υἱοὶ θεοῦ εἰσιν.<br>15 οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον ἀλλ' ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· αββα ὁ πατήρ.</p>","lit":"<p>14「因為凡<b>被</b>神的靈<b>引導的</b>，這些人就是神的兒子。」<br>15「因為你們所領受的，不是奴役的靈，以致再度陷入懼怕；你們所領受的，乃是<b>兒子名分的靈</b>，藉著祂，我們<b>放聲呼喊</b>：『阿爸！父啊！』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>引導</td><td>ἄγονται</td><td>agontai</td><td>G71</td><td>ἄγω</td><td><b>被帶領</b>（<b>現在被動式</b>）</td><td>見下</td></tr><tr><td>兒子的心</td><td>υἱοθεσία</td><td>huiothesia</td><td>G5206</td><td>υἱός + τίθημι</td><td><b>收養、立為兒子</b></td><td><b>羅馬法律用語</b></td></tr><tr><td>呼叫</td><td>κράζομεν</td><td>krazomen</td><td>G2896</td><td>κράζω</td><td><b>放聲呼喊、大聲叫</b></td><td>不是輕聲細語</td></tr><tr><td>阿爸</td><td>αββα</td><td>abba</td><td>G5</td><td><b>亞蘭文</b></td><td>父親</td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：ἄγονται 是<b>現在被動式</b></p><p>「凡<b>被</b>神的靈引導的」——不是「凡引導自己的」。</p><p>這是一個<b>被動</b>的動詞：<b>被帶領</b>。</p><p>而且是<b>現在式</b>：<b>持續地被帶領</b>。</p><p>（注意這與加5:18「你們若被聖靈引導」是同一個字）</p><p>★ 亮光二：υἱοθεσία ——羅馬的收養</p><p>這個字在新約出現5次，全部在保羅書信（羅8:15、8:23、9:4；加4:5；弗1:5）。</p><p>它是羅馬法律的專門用語，而羅馬收養有幾個特點：</p><table><tr><th>特點</th><th>對8:15的意義</th></tr><tr><td><b>舊債一筆勾銷</b></td><td>你過去的一切，法律上不復存在</td></tr><tr><td><b>獲得完整繼承權</b></td><td><b>與親生兒子同等</b>（8:17「和基督同作後嗣」）</td></tr><tr><td><b>需要證人</b></td><td><b>8:16「聖靈與我們的心同證」</b></td></tr><tr><td><b>不可撤銷</b></td><td><b>8:38–39「都不能隔絕」</b></td></tr></table><p>弟兄姊妹，這不是一個溫馨的比喻。</p><p>這是一份<b>法律文件</b>。</p><p>★ 亮光三：Αββα ——耶穌自己的字</p><p>保羅保留了亞蘭文的原音，沒有翻譯。</p><p>整本新約只有三處出現「阿爸」：</p><table><tr><th>出處</th><th>說話的人</th></tr><tr><td><b>可14:36</b></td><td><b>主耶穌在客西馬尼：「阿爸！父啊！在你凡事都能……」</b></td></tr><tr><td><b>羅8:15</b></td><td>我們</td></tr><tr><td><b>加4:6</b></td><td>神差祂兒子的靈進入我們的心，呼叫「阿爸！父！」</td></tr></table><p>弟兄姊妹，這是何等的事：</p><p>耶穌在客西馬尼，汗如血點的那一夜，用的那個稱呼——</p><p>祂讓我們也可以用。</p><p>關於「阿爸」的意思，要避免常見的誇大：</p><p>「阿爸」不只是幼兒的牙牙學語（這個流行說法被學界修正過）。<br>它是家庭中親密而真實的稱呼，成年子女也這樣叫父親。</p><p>它的驚人之處不在於「幼稚」，而在於——<br>一個受造之物，竟然可以用<b>家人的稱呼</b>，對創造宇宙的神說話。</p><p>★ 亮光四：κράζω ——放聲呼喊</p><p>「呼叫」不是輕聲說話。κράζω 是<b>大聲喊叫</b>。</p><p>（太27:50「耶穌又大聲喊叫（κράξας），氣就斷了」——同字）</p><p>保羅描寫的不是一個安靜的宗教習慣，<br>是一個孩子在需要的時候，<b>衝口而出</b>的那一聲。</p>","exp":"<p>弟兄姊妹，8:15直接回應了第六章的一個問題。</p><p>第六章保羅用了「奴僕」的比喻，還特別道歉說「我因你們肉體的軟弱，就照人的常話對你們說」（6:19）。</p><p>現在，兩章之後——</p><p>「你們所受的，<b>不是奴僕的心</b>……乃是<b>兒子的心</b>。」</p><p>保羅升級了。</p><p>第六章：歸屬的絕對性（奴僕）。<br>第八章：關係的親密性（兒子）。</p><p>兩章要一起讀。</p>"},{"a":16,"z":17,"star":false,"grk":"<p>16 αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.<br>17 …συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.</p>","lit":"<p>16「聖靈自己<b>與我們的靈一同作見證</b>：我們是<b>神的兒女</b>。」<br>17「既是兒女，便是<b>後嗣</b>——是神的後嗣，也是<b>與基督同作後嗣</b>的；<b>既然我們與祂一同受苦</b>，為要<b>也與祂一同得榮耀</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>同證</td><td>συμμαρτυρεῖ</td><td>symmartyrei</td><td>G4828</td><td>σύν + μαρτυρέω：<b>一同作證</b>（<b>2:15同字！</b>）</td></tr><tr><td>同作後嗣</td><td>συγκληρονόμοι</td><td>synklēronomoi</td><td>G4789</td><td><b>共同繼承人</b></td></tr><tr><td>一同受苦</td><td>συμπάσχομεν</td><td>sympaschomen</td><td>G4841</td><td><b>一同受苦</b></td></tr><tr><td>一同得榮耀</td><td>συνδοξασθῶμεν</td><td>syndoxasthōmen</td><td>G4888</td><td><b>一同得榮耀</b></td></tr></table>","gram":"<p>★ 亮光一：συμμαρτυρέω ——2:15的字回來了</p><pre>2:15  他們是非之心「同作見證」（συμμαρτυρούσης）—— 良心的法庭，控告與辯護\n   ↓\n8:16  聖靈與我們的心「同證」（συμμαρτυρεῖ）—— 我們是神的兒女</pre><p>第二章：那個內心的法庭，只會控告。<br>第八章：現在有一位證人站出來，作<b>有利於你</b>的見證。</p><p>★ 亮光二：四個 συν- 疊在兩節裡</p><pre>8:16  συμμαρτυρεῖ   —— 一同作證\n8:17  συγκληρονόμοι —— 一同承受\n8:17  συμπάσχομεν   —— 一同受苦\n8:17  συνδοξασθῶμεν —— 一同得榮耀</pre><p>保羅把「與基督一同」推到了極致：</p><p>一同承受、一同受苦、一同得榮耀。</p><p>★ 亮光三：8:17的「如果」（εἴπερ）</p><p>這裡的 εἴπερ 與8:9一樣，通常表示「<b>既然事實如此</b>」。</p><p>保羅不是在說「你要受苦才配得榮耀」（那是功德觀）。</p><p>他是在說：<b>與基督同行的道路，本來就包含這兩樣</b>。</p><p>同作後嗣，就會同受苦，也會同得榮耀。</p>","exp":"<p>弟兄姊妹，8:16回答了一個很多人心裡的問題：</p><p>「我怎麼知道我真的是神的兒女？」</p><p>保羅的答案不是「看你的表現」。</p><p>是：</p><p>有兩位在作證。</p><p>一位是你自己的心。<br>另一位是<b>聖靈</b>。</p><p>而8:17立刻接上一句很誠實的話：</p><p>這個名分，包含苦難。</p><p>不是「作了神的兒女，日子就順了」。<br>是「作了神的兒女，就與祂同走那條路」。</p><p>【第四段｜8:18–25　受造之物與我們的歎息】</p>"},{"a":18,"z":18,"star":false,"grk":"<p>Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.</p>","lit":"<p>「因為我<b>這樣算</b>：現今這時候的苦楚，與那將要<b>顯明到我們身上</b>的榮耀相比，是<b>不成比例的</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>我想</td><td>Λογίζομαι</td><td>logizomai</td><td>G3049</td><td><b>我算</b>（記帳用語——4:3、6:11那個字！）</td></tr><tr><td>不足介意</td><td>οὐκ ἄξια</td><td>ouk axia</td><td>G514</td><td><b>不成比例、不夠份量</b>（ἄξιος 原指天平的平衡）</td></tr><tr><td>顯於</td><td>ἀποκαλυφθῆναι εἰς ἡμᾶς</td><td>—</td><td>G601</td><td><b>顯明「到」我們身上</b>（不只是給我們看）</td></tr></table>","gram":"<p>★ 亮光一：λογίζομαι 的第三次登場</p><pre>4:3   ἐλογίσθη   —— 神算（被動、直說）\n6:11  λογίζεσθε  —— 你們要算（命令）\n8:18  λογίζομαι  —— 我算（保羅自己示範）</pre><p>保羅不只下命令，他自己也在算。</p><p>而他算的是一筆<b>天平上的帳</b>：</p><p>一邊放「現在的苦楚」，一邊放「將來的榮耀」。</p><p>結果是：<b>根本不成比例</b>。</p><p>★ 亮光二：ἄξιος 的天平意象</p><p>這個字原指「<b>與……等重</b>」。</p><p>保羅的意思不是「苦難不重要」，也不是「你不該覺得苦」。</p><p>是：把它放上天平的另一端，<b>壓不下去</b>。</p><p>★ 亮光三：εἰς ἡμᾶς ——顯明「到」我們身上</p><p>保羅沒有說「顯給我們看」，而是「<b>顯明到我們身上</b>」。</p><p>那個榮耀不只是我們<b>觀賞</b>的，是我們<b>要進入、要承載</b>的。</p><p>（8:30「叫他們得榮耀」；西3:4「你們也要與他一同顯現在榮耀裡」）</p>","exp":"<p>弟兄姊妹，8:18是第八章下半段的<b>開場白</b>。</p><p>而它是一句<b>帳目</b>的話，不是一句安慰的話。</p><p>保羅說：「我<b>算</b>（λογίζομαι）。」</p><p>那是第四章、第六章那個記帳的字。</p><pre>4:3   神算    —— 被動、直說（既成事實）\n6:11  你們算  —— 命令（去做）\n8:18  我算    —— 保羅自己示範</pre><p><b>經文本身明確表達的：</b> 現今的苦楚，與將來要顯明到我們身上的榮耀，<b>不成比例</b>（ἄξιος ＝ 等重）。</p><p><b>可以合理推論的：</b> 保羅<b>沒有</b>說「苦難不重要」，也<b>沒有</b>說「你不該覺得苦」。<br>他說的是：把它放上天平的另一端，<b>壓不下去</b>。</p><p><b>⚠ 牧養提醒：</b> 這一節與8:28一樣，<b>是給受苦的人自己拿來算的，不是旁觀者用來安慰別人的</b>。<br>在人正痛的時候把這句話丟過去，會像是在說「你的痛不算什麼」——那不是保羅的意思。</p>"},{"a":19,"z":22,"star":true,"grk":"<p>19 ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται.<br>22 οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν.</p>","lit":"<p>19「因為受造之物<b>伸長脖子的切望</b>，正<b>等候著</b>神眾子的<b>顯露</b>。」<br>20「因為受造之物<b>被服在虛空之下</b>——<b>不是自己願意的</b>，乃是因那位<b>使它服在其下</b>者的緣故；」<br>21「並且懷著<b>盼望</b>：受造之物自己也要<b>從敗壞的奴役中得釋放</b>，進入神兒女<b>榮耀的自由</b>。」<br>22「因為我們知道：<b>一切受造之物，直到如今，都一同歎息、一同經歷產難之苦</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>切望等候</td><td>ἀποκαραδοκία</td><td>apokaradokia</td><td>G603</td><td>ἀπό + κάρα（頭）+ δοκέω</td><td><b>伸長脖子往前看</b></td><td>見下</td></tr><tr><td>虛空</td><td>ματαιότης</td><td>mataiotēs</td><td>G3153</td><td>μάταιος（虛空）</td><td><b>虛空、徒然</b></td><td><b>傳道書的字</b>（見下）</td></tr><tr><td>一同歎息</td><td>συστενάζει</td><td>systenazei</td><td>G4959</td><td>σύν + στενάζω</td><td><b>一同呻吟</b></td><td><b>新約僅此一次</b></td></tr><tr><td>一同勞苦</td><td>συνωδίνει</td><td>synōdinei</td><td>G4944</td><td>σύν + ὠδίν（產痛）</td><td><b>一同經歷產難之苦</b></td><td><b>新約僅此一次</b></td></tr></table>","gram":"<p>★ 亮光一：ἀποκαραδοκία ——伸長脖子</p><p>這個字的構詞極其生動：</p><pre>ἀπό（離開、遠離）+ κάρα（頭）+ δοκέω（觀看）\n＝ 把頭伸出去，往遠方看</pre><p>畫面：一個人踮起腳、伸長脖子，盯著地平線。</p><p>（新約僅兩處：羅8:19、腓1:20「照著我所切慕、所盼望的」）</p><p>保羅說：整個受造界，正踮著腳在等一件事。</p><p>等什麼？</p><p>「等候<b>神的眾子顯出來</b>。」</p><p>★ 亮光二：ματαιότης ——傳道書的那個字</p><p>「受造之物服在<b>虛空</b>之下。」</p><p>ματαιότης 在七十士譯本中，正是傳道書開頭那個字：</p><p>傳道書1:2「<b>虛空的虛空</b>，凡事都是虛空。」<br>希伯來文是 <b>הֶבֶל（hevel）</b>，LXX 譯作 <b>ματαιότης</b>。</p><p>弟兄姊妹，保羅在說：傳道書所描述的那個「虛空」——</p><p>那是真的。整個受造界確實服在它之下。</p><p>但傳道書沒有講完。羅馬書8:21講完了：</p><p>「受造之物<b>仍然指望</b>脫離敗壞的轄制。」</p><p>★ 亮光三：兩個 συν- 的產痛意象</p><pre>συστενάζει —— 一同呻吟\nσυνωδίνει  —— 一同經歷產難之苦</pre><p>ὠδίν 是<b>生產的陣痛</b>。</p><p>弟兄姊妹，這個意象極其重要：</p><p>產痛不是<b>死亡的痛</b>，是<b>生產的痛</b>。</p><p>它有方向。它有終點。它會生出東西來。</p><p>（主耶穌用同一個意象：約16:21「婦人生產的時候就憂愁，因為她的時候到了；既生了孩子，就不再記念那苦楚」）</p>","exp":"<p>弟兄姊妹，8:19–22給了苦難一個宇宙性的框架。</p><p>你所經歷的痛苦，不是宇宙裡的一個例外。</p><p>整個受造界都在痛。從創世記第三章開始。</p><p>而保羅給了一個關鍵的區分：</p><p>不是<b>臨終的呻吟</b>。<br>是<b>產房裡的呻吟</b>。</p>"},{"a":23,"z":25,"star":false,"grk":"<p>23 …ἡμεῖς καὶ αὐτοὶ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες, ἡμεῖς καὶ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν υἱοθεσίαν ἀπεκδεχόμενοι, τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.</p>","lit":"<p>23「不但如此，<b>連我們這有聖靈初熟果子的人</b>，<b>也是自己在心裡歎息</b>，切切等候<b>兒子的名分</b>——就是<b>我們身體的得贖</b>。」<br>24「因為我們得救是<b>在盼望中</b>。只是<b>已經看見的盼望，就不是盼望</b>了；人所看見的，誰還盼望呢？」<br>25「但我們若盼望那<b>還沒有看見的</b>，就<b>帶著忍耐熱切等候</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>初結果子</td><td>ἀπαρχή</td><td>aparchē</td><td>G536</td><td><b>初熟的果子</b>（見下）</td></tr><tr><td>歎息</td><td>στενάζομεν</td><td>stenazomen</td><td>G4727</td><td><b>呻吟</b>（第二重歎息）</td></tr><tr><td>得贖</td><td>ἀπολύτρωσις</td><td>apolytrōsis</td><td>G629</td><td><b>贖回</b>（<b>3:24同字！</b>）</td></tr></table>","gram":"<p>★ 亮光一：ἀπαρχή ——初熟的果子</p><p>這是舊約獻祭的用語（利23:10；申26:1–11）：</p><p>收割的時候，把<b>最先熟的那一把</b>帶到神面前獻上。</p><p>它的意義是：</p><p>初熟果子不是「一小部分」，是「<b>整場收成的保證</b>」。</p><p>有了初熟的果子，就表示：後面的一定會來。</p><p>保羅說：聖靈就是那把初熟的果子。</p><p>你現在所經歷的聖靈——不是全部，是<b>保證</b>。</p><p>（弗1:14用另一個字 ἀρραβών「憑據」，是<b>訂金</b>的意思——同樣的道理）</p><p>★ 亮光二：一個關鍵的張力</p><pre>8:15  我們「已經」領受了兒子的名分（υἱοθεσία）\n8:23  我們「等候」得著兒子的名分（υἱοθεσία）</pre><p>同一個字，一個「已經」，一個「還沒」。</p><p>這正是新約末世論的核心：<b>已然未然</b>（already / not yet）。</p><p>法律上，收養已經完成了（8:15）。<br>但<b>兒子的產業還沒有全部交到手上</b>（8:23）。</p><p>★ 亮光三：「身體得贖」是保羅盼望的內容</p><p>注意保羅說的不是「靈魂得釋放」，是「<b>我們的身體得贖</b>」。</p><p>這再次證明：基督教的盼望是<b>身體的復活</b>，不是「脫離身體」。</p>","exp":"<p>弟兄姊妹，8:23是一句很誠實的話：</p><p>有聖靈的人，<b>還是會歎息</b>。</p><p>保羅沒有說：「你有聖靈了，所以你不該有負面情緒。」</p><p>他說：我們這些<b>有聖靈初結果子的</b>，「也是自己心裡歎息」。</p><p>歎息不是不屬靈。<br>歎息是<b>還沒到家</b>的證據。</p><p>【第五段｜8:26–27　聖靈的歎息】</p>"},{"a":26,"z":27,"star":true,"grk":"<p>26 Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται τῇ ἀσθενείᾳ ἡμῶν· τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις·</p>","lit":"<p>26「照樣，聖靈也<b>在旁邊一同扶起</b>我們的軟弱；因為我們<b>不知道</b>當怎樣禱告才合宜，但聖靈自己用<b>說不出來的歎息</b>，<b>替我們懇切代求</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>幫助</td><td>συναντιλαμβάνεται</td><td>synantilambanetai</td><td>G4878</td><td><b>σύν + ἀντί + λαμβάνω</b></td><td><b>在對面、一同抓住扛起</b></td><td><b>見下——極美</b></td></tr><tr><td>說不出來的</td><td>ἀλάλητος</td><td>alalētos</td><td>G215</td><td>ἀ + λαλέω（說）</td><td><b>無法用言語表達的</b></td><td><b>新約僅此一次</b></td></tr><tr><td>替我們禱告</td><td>ὑπερεντυγχάνει</td><td>hyperentynchanei</td><td>G5241</td><td>ὑπέρ + ἐν + τυγχάνω</td><td><b>為我們懇切代求</b></td><td><b>新約僅此一次</b></td></tr></table>","gram":"<p>★ 亮光一：συναντιλαμβάνομαι ——「在對面一起扛」</p><p>這個字由三部分組成：</p><pre>σύν    （一同）\nἀντί   （在對面、面對面）\nλαμβάνω（抓住、拿起）</pre><p>合起來的畫面是：</p><p>一個人扛不動一根很重的木頭。</p><p>另一個人走過來，<b>站到木頭的另一端</b>，<br>彎下腰，跟他<b>一起抬</b>。</p><p>這個字在新約只出現兩次：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td><b>路10:40</b></td><td>馬大說：「請吩咐她來<b>幫助</b>我。」</td></tr><tr><td><b>羅8:26</b></td><td>「我們的軟弱有聖靈<b>幫助</b>。」</td></tr></table><p>弟兄姊妹，注意這個字的重點：</p><p>聖靈不是站在旁邊喊「加油」。<br>聖靈是<b>走到另一端，一起扛</b>。</p><p>★ 亮光二：ἀλάλητος ——說不出來的</p><p>新約只出現這一次。</p><p>ἀ（不）+ λαλέω（說話）＝ <b>無法用言語表達的</b>。</p><p>保羅在描寫一件極深的事：</p><p>有些禱告，深到沒有辦法變成句子。</p><p>★ 亮光三：ὑπερεντυγχάνει ——保羅疊出來的字</p><p>這個字也是新約僅此一次，而且很可能是保羅自己造的：</p><pre>ἐντυγχάνω      = 代求、為某人請願\nὑπερεντυγχάνω  = ὑπέρ（為了／超過）+ 代求</pre><p>而8:34用同一個字根，描寫基督：</p><p>8:34「現今在神的右邊，也<b>替我們祈求</b>（ἐντυγχάνει）。」</p><p>弟兄姊妹，第八章有<b>兩位代求者</b>：</p><p>聖靈在我裡面替我禱告（8:26）。<br>基督在天上替我禱告（8:34）。</p><p>一個在下面，一個在上面。<br>一個在心裡，一個在寶座前。</p><p>★ 亮光四：8:26是第三重歎息</p><pre>8:22  受造之物 —— 一同歎息（συστενάζει）\n8:23  我們     —— 心裡歎息（στενάζομεν）\n8:26  聖靈     —— 說不出來的歎息（στεναγμοῖς ἀλαλήτοις）</pre><p>弟兄姊妹，這是全章最令人震動的一件事：</p><p>神自己，也在歎息。</p><p>祂沒有站在我們的痛苦之外。<br>祂進到那個歎息裡面，用我們發不出來的聲音，替我們禱告。</p><p>（關於「說不出來的歎息」是否指方言，見第二十部分。）</p>","exp":"<p>弟兄姊妹，8:26回答了一個許多人不敢問的問題：</p><p>「我連禱告都不會，怎麼辦？」</p><p>保羅的回答是：</p><p>對，你不會。</p><p>「我們本<b>不曉得</b>當怎樣禱告。」</p><p>但那不是問題——因為有一位在你裡面，替你禱告。</p><p>【第六段｜8:28–30　萬事互相效力與金鏈】</p>"},{"a":28,"z":28,"star":true,"grk":"<p>οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσιν τὸν θεὸν πάντα συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.</p>","lit":"<p>「我們<b>知道</b>，對那些愛神的人，萬事<b>一同運作</b>以致於善——就是那些照著祂的<b>旨意</b>被召的人。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>互相效力</td><td>συνεργεῖ</td><td>synergei</td><td>G4903</td><td>σύν + ἔργον：<b>一同做工</b>（英文 synergy）</td></tr><tr><td>益處</td><td>ἀγαθόν</td><td>agathon</td><td>G18</td><td>善、好處</td></tr><tr><td>旨意</td><td>πρόθεσις</td><td>prothesis</td><td>G4286</td><td><b>預先擺定的計畫</b></td></tr></table>","gram":"<p>★ 亮光一：一個抄本問題</p><p>部分早期抄本（如 P46、梵蒂岡抄本）在 συνεργεῖ 之後有 <b>ὁ θεός</b>（神）：</p><p>「<b>神</b>使萬事互相效力……」</p><p>兩種讀法：</p><table><tr><th>讀法</th><th>意思</th></tr><tr><td>無 ὁ θεός</td><td>萬事一同運作以致於善（和合本）</td></tr><tr><td>有 ὁ θεός</td><td><b>神</b>使萬事一同運作以致於善</td></tr></table><p>無論哪一種讀法，主詞的實質都是神——<br>因為「萬事」不會自己「合作」；上下文（8:29–30）明說是神在做工。</p><p>★ 亮光二：這節經文的兩個限定</p><p>保羅給了兩個限定，常被引用時省略：</p><pre>限定一：「叫**愛神的人**得益處」\n限定二：「就是按他**旨意被召**的人」</pre><p>這不是一句普世通用的樂觀主義格言。</p><p>這是給神兒女的應許。</p><p>★ 亮光三：「益處」是什麼？下一節就說了</p><p>很多人把「益處」讀成「事情會變好」。</p><p>但保羅在8:29立刻定義了那個「益處」：</p><p>「就預先定下<b>效法他兒子的模樣</b>。」</p><p>弟兄姊妹，這是全章最重要的澄清之一：</p><p>神所說的「益處」，不是「你的處境會改善」，<br>是「<b>你會越來越像祂的兒子</b>」。</p>","exp":"<p>（關於這節經文的誤用，見第二十部分——這可能是全本聖經最常被錯用的一節。）</p><p>保羅沒有說「萬事都是好的」。</p><p>他說「萬事<b>互相效力</b>」——那些事本身可能是壞的、是痛的、是不該發生的，<br>但神能把它們<b>編織進</b>一個目的裡。</p>"},{"a":29,"z":30,"star":true,"grk":"<p>29 ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·<br>30 οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.</p>","lit":"<p>29「因為<b>祂預先所認識的那些人</b>，祂也<b>預先定下</b>他們，要<b>與祂兒子的形像同形</b>，使祂兒子在許多弟兄中作<b>長子</b>。」<br>30「而<b>祂預先所定下的那些人</b>，祂也<b>召了</b>他們；祂所召的那些人，祂也<b>稱他們為義</b>；祂所稱為義的那些人，祂也<b>叫他們得了榮耀</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>預先知道</td><td>προέγνω</td><td>proegnō</td><td>G4267</td><td>πρό + γινώσκω：<b>預先認識</b>（見下）</td></tr><tr><td>預先定下</td><td>προώρισεν</td><td>proōrisen</td><td>G4309</td><td>πρό + ὁρίζω（劃界）：<b>預先劃定</b></td></tr><tr><td>效法……模樣</td><td>συμμόρφους</td><td>symmorphous</td><td>G4832</td><td>σύν + μορφή：<b>與……同形</b></td></tr><tr><td>長子</td><td>πρωτότοκος</td><td>prōtotokos</td><td>G4416</td><td><b>首生的、居首位的</b></td></tr><tr><td>得榮耀</td><td>ἐδόξασεν</td><td>edoxasen</td><td>G1392</td><td><b>不定過去式！</b>（見下）</td></tr></table>","gram":"<p>★ 亮光一：五個不定過去式，包括最後一個</p><pre>προέγνω    （預先知道）  —— 不定過去式\nπροώρισεν  （預先定下）  —— 不定過去式\nἐκάλεσεν   （召）        —— 不定過去式\nἐδικαίωσεν （稱義）      —— 不定過去式\nἐδόξασεν   （得榮耀）    —— 不定過去式 ★★</pre><p>弟兄姊妹，最後一個是重點。</p><p>「得榮耀」是一件<b>還沒發生</b>的事——8:18剛說「將來要顯於我們的榮耀」。</p><p>但保羅用的是<b>不定過去式</b>，就是講一件<b>已經完成</b>的事。</p><p>這種用法有時被稱為「<b>預言性的不定過去式</b>」（prophetic aorist）——</p><p>神說的未來，確定到可以用過去式來講。</p><p>★ 亮光二：προγινώσκω 的兩種理解（★ 主要爭議）</p><p>「預先所知道的」——這個字是預定論爭議的核心之一。</p><table><tr><th>理解</th><th>主張</th><th>傳統</th></tr><tr><td><b>預知即揀選之愛</b></td><td>「知道」是聖經式的<b>關係性認識</b>（如創4:1「亞當<b>認識</b>他妻子」；摩3:2「在地上萬族中，我只<b>認識</b>你們」）；神預先<b>以愛認定</b></td><td>改革宗</td></tr><tr><td><b>預知即預見</b></td><td>神預先<b>看見</b>誰會相信，據此預定</td><td>亞米念主義／衛斯理傳統</td></tr></table><p>支持第一種的主要理由：</p><p>- 受詞是<b>人</b>（οὓς，「那些人」），不是「他們的信心」<br>- 舊約的 יָדַע（知道）常帶有<b>揀選之愛</b>的意思（摩3:2；耶1:5）<br>- 8:29–30整條鏈子的主詞<b>全部是神</b></p><p>支持第二種的主要理由：</p><p>- προγινώσκω 的字面確實是「預先知道」<br>- 保羅在別處強調人的回應之信（10:9–13）</p><p>講台誠信提醒：這是宗教改革以來福音派內部最深的分歧之一。<br>本文採第一種讀法（理由如上），但<b>必須說明有敬虔的信徒持不同看法</b>，不可貶低任何一方。</p><p>而兩邊都同意的是：<br>這條鏈子的每一環，主詞都是神；沒有一環是靠我完成的。</p><p>★ 亮光三：那個「益處」的定義</p><p>8:29說得很清楚：預定的內容是——</p><p>「效法他兒子的<b>模樣</b>（συμμόρφους τῆς εἰκόνος）。」</p><p>συμμόρφος ＝ 與……有相同的形態。</p><p>（腓3:21「將我們卑賤的身體改變形狀，和他自己榮耀的身體<b>相似</b>」——同字）</p><p>弟兄姊妹，神預定的不是「你的人生會順利」。</p><p>神預定的是：<b>你要像祂的兒子</b>。</p><p>★ 亮光四：πρωτότοκος ——長子</p><p>「使他兒子在許多弟兄中作長子。」</p><p>這一句是整條金鏈的<b>目的</b>。</p><p>神做這一切，最終不是為了「拯救個別的人」，<br>是為了<b>給祂的兒子一個大家庭</b>。</p>","exp":"<p>弟兄姊妹，8:29–30被稱為「金鏈」（golden chain），因為五個環節扣得死死的。</p><pre>預知 → 預定 → 召 → 稱義 → 得榮耀</pre><p>而最重要的觀察是：</p><p>這五個動詞的主詞，<b>全部是神</b>。</p><p>沒有一環是「然後你要努力」。</p><p>鏈子的兩端都在神手上——而中間沒有一個環是斷的。</p><p>【第七段｜8:31–39　四個問題與最後的宣告】</p>"},{"a":31,"z":32,"star":true,"grk":"<p>31 Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ' ἡμῶν;<br>32 ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο ἀλλ' ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;</p>","lit":"<p>31「那麼對這些事，我們要說什麼呢？若神在我們<b>這一邊</b>，誰能在我們<b>那一邊</b>（對面）？」<br>32「祂連自己的兒子都<b>沒有留下不給</b>，反倒為我們眾人<b>交付了</b>祂——豈不也把萬物<b>和祂一同</b>，<b>白白地恩賜</b>給我們嗎？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>幫助</td><td>ὑπέρ ἡμῶν</td><td>hyper hēmōn</td><td>G5228</td><td>—</td><td><b>在我們這一邊</b>（不只是「幫助」）</td><td>見下</td></tr><tr><td>敵擋</td><td>καθ' ἡμῶν</td><td>kath' hēmōn</td><td>G2596</td><td>κατά</td><td><b>在我們的對面</b></td><td>法庭／戰場用語</td></tr><tr><td>不愛惜</td><td>οὐκ ἐφείσατο</td><td>ouk epheisato</td><td>G5339</td><td>φείδομαι（憐惜、留下）</td><td><b>沒有留下不給</b></td><td>★★ <b>見下</b></td></tr><tr><td>捨了</td><td>παρέδωκεν</td><td>paredōken</td><td>G3860</td><td>παρά + δίδωμι</td><td><b>交付了</b>（<b>4:25同字</b>）</td><td>—</td></tr><tr><td>白白賜給</td><td>χαρίσεται</td><td>charisetai</td><td>G5483</td><td>χάρις（恩典）</td><td><b>憑恩典賜下</b></td><td>—</td></tr></table>","gram":"<p>★★ 亮光一：οὐκ ἐφείσατο ——摩利亞山的回聲</p><p>「神既<b>不愛惜</b>自己的兒子」——οὐκ ἐφείσατο。</p><p>現在請看七十士譯本的創世記22:12，天使對亞伯拉罕說的話：</p><p>「……因為我知道你是敬畏神的了；你<b>沒有將你的兒子，就是你獨生的兒子，留下不給我</b>（οὐκ ἐφείσω τοῦ υἱοῦ σου τοῦ ἀγαπητοῦ）。」</p><p>創22:16神再說一次：</p><p>「你既行了這事，<b>不留下你的兒子</b>（οὐκ ἐφείσω τοῦ υἱοῦ σου），就是你獨生的兒子……」</p><p>同一個動詞：φείδομαι。</p><p>弟兄姊妹，保羅在羅8:32用的，正是這個字。</p><p>在摩利亞山上，神對亞伯拉罕說：「你<b>沒有留下</b>你的兒子。」</p><p>在羅馬書8:32，保羅對我們說：「神<b>沒有留下</b>祂自己的兒子。」</p><p>而兩座山之間，有一個決定性的差別：</p><pre>摩利亞山：刀舉起來了 —— 然後「不可下手」（創22:12）—— 刀停住了\n各各他：  刀舉起來了 —— 沒有聲音喊停 —— 刀沒有停</pre><p>摩利亞山上有一隻公羊代替了以撒。</p><p>各各他，<b>沒有任何東西代替祂</b>。</p><p>因為<b>祂</b>就是那隻羊。</p><p>★ 亮光二：ὑπέρ ／ κατά ——這一邊與那一邊</p><p>8:31的「幫助」與「敵擋」，原文是兩個介詞：</p><pre>ὑπὲρ ἡμῶν —— 在我們這一邊\nκαθ' ἡμῶν —— 在我們的對面</pre><p>保羅畫的是一個<b>法庭</b>（或戰場）的畫面：</p><p>神站在我這一邊。</p><p>那還有誰敢站到對面去？</p><p>★ 亮光三：「何況」的邏輯又回來了</p><p>8:32的結構，正是第五章那個「輕重論證」：</p><pre>【最難的事】祂連自己的兒子都給了\n   ↓ 「豈不也……嗎？」（πῶς οὐχὶ καί）\n【比較容易的事】祂會捨不得給你別的嗎？</pre><p>（比較5:9–10的兩個「何況」）</p><p>弟兄姊妹，這是全本聖經最有力的一個邏輯：</p><p>祂已經給了最貴的那一樣。</p><p>剩下的，還有什麼捨不得？</p>","exp":"<p>弟兄姊妹，8:32是整章的心臟。</p><p>它回答了一個我們心裡最深的懷疑：</p><p>「神是不是其實沒有那麼愛我？」</p><p>保羅的回答不是一句安慰的話，是一個<b>已經發生的事件</b>：</p><p>摩利亞山上，那把刀停住了。</p><p>各各他，那把刀，<b>沒有停</b>。</p>"},{"a":33,"z":34,"star":false,"grk":"<p>33 τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν·<br>34 τίς ὁ κατακρινῶν; Χριστὸς [Ἰησοῦς] ὁ ἀποθανών, μᾶλλον δὲ ἐγερθείς, ὃς καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν.</p>","lit":"<p>33「<b>誰要提出控告</b>，來敵擋神所揀選的人呢？——<b>是神在稱人為義</b>。」<br>34「<b>誰是那要定罪的</b>呢？——<b>是基督耶穌</b>，那位死了的，更是<b>已經復活了</b>的；祂<b>如今在神的右邊</b>，也<b>正在為我們代求</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>控告</td><td>ἐγκαλέσει</td><td>enkalesei</td><td>G1458</td><td><b>正式提出法律控告</b></td></tr><tr><td>定罪</td><td>ὁ κατακρινῶν</td><td>ho katakrinōn</td><td>G2632</td><td><b>那要定罪的</b>（8:1、8:3同字根）</td></tr><tr><td>替我們祈求</td><td>ἐντυγχάνει</td><td>entynchanei</td><td>G1793</td><td><b>代求</b>（<b>8:26同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：法庭的四個角色，全部被佔滿了</p><pre>原告席：誰能控告？   —— 沒有人，因為【神】是那稱義的\n法官席：誰能定罪？   —— 沒有人，因為【基督】是那位死了又復活的\n辯護席：              —— 【基督】替我們祈求（8:34）\n證人席：              —— 【聖靈】與我們的心同證（8:16）</pre><p>弟兄姊妹，這是一場很奇怪的審判：</p><p>法官是我的救主。<br>辯護律師是我的救主。<br>證人是聖靈。</p><p>而原告席——<b>空著</b>。</p><p>★ 亮光二：兩位代求者</p><pre>8:26  聖靈在我裡面，用說不出來的歎息替我禱告\n8:34  基督在神的右邊，替我祈求</pre><p>一個在下面，一個在上面。<br>一個在心裡，一個在寶座前。</p><p>★ 亮光三：μᾶλλον δέ（而且更是）</p><p>「已經死了，<b>而且</b>從死裡復活。」</p><p>μᾶλλον δέ 的意思是「<b>更確切地說</b>」——保羅在自我加強。</p><p>不只是死了。<b>更是</b>復活了。</p>","exp":"<p>弟兄姊妹，33–34節是<b>兩個法庭問句</b>。</p><p>而保羅回答的方式很特別：他不是說「沒有人能」，他是<b>指出一個人</b>。</p><pre>誰能控告？  →  【是神在稱人為義】\n誰能定罪？  →  【是基督已經死了、復活了、在右邊、正在代求】</pre><p><b>經文本身明確表達的：</b> 控告與定罪的問題，已經被神的稱義與基督四重的作為（死、復活、坐在右邊、代求）解決了。</p><p><b>可以合理推論的：</b> 保羅的邏輯不是「你很好，所以沒人能告你」，<br>是「<b>那位有資格定你罪的，正在替你辯護</b>」。</p><p>而基督的那四個動作，是有次序的：</p><table><tr><th>動作</th><th>對付的是</th></tr><tr><td><b>已經死了</b></td><td>我的<b>罪債</b></td></tr><tr><td><b>從死裡復活</b></td><td>我的<b>死</b></td></tr><tr><td><b>在神的右邊</b></td><td>我的<b>地位</b></td></tr><tr><td><b>替我們祈求</b></td><td>我<b>現在的軟弱</b></td></tr></table><p>弟兄姊妹，最後那一項最重要：</p><p>祂不是做完就走了。<b>祂現在還在做</b>。</p><p><b>⚠ 牧養提醒：</b> 若有人心裡有一個一直在起訴他的聲音，<br>請帶他讀33節：那個原告席，<b>空著</b>。</p>"},{"a":35,"z":37,"star":false,"grk":"<p>37 ἀλλ' ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.</p>","lit":"<p>35「<b>誰要把我們與基督的愛隔開</b>呢？是患難嗎？是困苦嗎？是逼迫嗎？是飢餓嗎？是赤身嗎？是危險嗎？是刀劍嗎？」<br>36「正如經上所記：『<b>為你的緣故，我們終日被殺</b>；人看我們如同<b>將要被宰的羊</b>。』」<br>37「然而，在這一切的事上，我們<b>藉著那位愛我們的</b>，<b>已經得勝有餘</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>隔絕</td><td>χωρίσει</td><td>chōrisei</td><td>G5563</td><td><b>分開、隔離</b>（婚姻用語，可10:9「不可分開」同字）</td></tr><tr><td>得勝有餘</td><td>ὑπερνικῶμεν</td><td>hypernikōmen</td><td>G5245</td><td><b>ὑπέρ + νικάω：超級得勝</b></td></tr></table>","gram":"<p>★ 亮光一：七樣患難</p><p>保羅列了七樣：患難、困苦、逼迫、飢餓、赤身露體、危險、刀劍。</p><p>弟兄姊妹，這七樣<b>不是</b>抽象的清單。</p><p>保羅自己<b>全部經歷過</b>（林後11:23–27）。</p><p>而收信的羅馬教會，七年後也將全部經歷。</p><p>★ 亮光二：8:36引用詩篇44:22</p><p>詩篇44篇是一篇<b>抱怨詩</b>——是義人在受苦時對神的申訴。</p><p>保羅沒有假裝苦難不存在。</p><p>他引用了一篇<b>抱怨的詩</b>，放進羅馬書最榮耀的一段裡。</p><p>★ 亮光三：ὑπερνικάω ——保羅又疊了一個字</p><p>νικάω 是「得勝」。</p><p>保羅加了 ὑπέρ ——「<b>超級得勝</b>」。</p><p>（這個字在新約<b>只出現這一次</b>）</p><p>和合本譯「得勝<b>有餘</b>」，譯得極好。</p><p>弟兄姊妹，注意保羅說的是「<b>在這一切的事上</b>」（ἐν τούτοις πᾶσιν）——</p><p>不是「脫離了這一切」，是「<b>在這一切裡面</b>」。</p><p>得勝不是苦難沒有發生。<br>得勝是苦難發生了，而它奪不走那份愛。</p>","exp":"<p>弟兄姊妹，保羅在35節列的七樣東西，<b>沒有一樣是屬靈的抽象概念</b>。</p><p>患難、困苦、逼迫、飢餓、赤身露體、危險、刀劍——</p><p>全部是<b>具體的、身體的、會流血的</b>。</p><p>而這七樣，保羅<b>自己都經歷過</b>（林後11:23–27）。</p><p>收信的羅馬教會，七年後也將全部經歷（主後64年，尼祿的逼迫）。</p><p><b>經文本身明確表達的：</b> 沒有任何處境能把信徒與基督的愛隔開；在這一切之中，我們藉著那位愛我們的，得勝有餘。</p><p><b>可以合理推論的：</b> 保羅刻意引用詩篇44篇——那是一篇<b>抱怨詩</b>，是義人在受苦時對神的申訴。</p><p>他沒有假裝苦難不存在。他把一篇<b>抱怨的詩</b>，放進了羅馬書最榮耀的一段裡。</p><p>而37節的關鍵在那個介詞：</p><p>「<b>在這一切的事上</b>」（ἐν τούτοις πᾶσιν）——</p><p>不是「脫離了這一切」，是「<b>在這一切裡面</b>」。</p><p><b>⚠ 牧養提醒：</b> 不可把8:35–39講成「信主就不會遇到壞事」。<br>保羅列的每一樣，都是<b>會真的發生</b>的事。<br>他保證的不是「不會發生」，是「<b>發生了，也奪不走</b>」。</p>"},{"a":38,"z":39,"star":true,"grk":"<p>38 πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις<br>39 οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.</p>","lit":"<p>「因為我<b>已經被說服而確信</b>：無論是死、是生，是天使、是掌權的，是現在的事、是將來的事，是有能的，是高處、是低處，或是<b>任何別的受造之物</b>，都<b>不能夠</b>使我們與神的愛隔絕——這愛是在我們主基督耶穌裡的。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>深信</td><td>πέπεισμαι</td><td>pepeismai</td><td>G3982</td><td><b>完成被動式</b>：我已經被說服，且持續確信</td></tr><tr><td>高處／低處</td><td>ὕψωμα／βάθος</td><td>hypsōma/bathos</td><td>G5313/G899</td><td>高度／深度（<b>可能是天文學用語</b>，見下）</td></tr><tr><td>別的受造之物</td><td>τις κτίσις ἑτέρα</td><td>—</td><td>G2937</td><td><b>任何其他的受造之物</b></td></tr></table>","gram":"<p>★ 亮光一：πέπεισμαι 是完成被動式</p><p>「我深信」——不是「我覺得」，是：</p><p>我<b>已經被說服了</b>，而且這個確信持續到現在。</p><p>被誰說服？</p><p>被前面三十七節的論證。</p><p>保羅的確信不是情緒，是<b>被證據說服的結果</b>。</p><p>★ 亮光二：ὕψωμα 與 βάθος 可能是天文學用語</p><p>在希臘化的占星術中，這兩個字用於星體在天空中的最高點與最低點——</p><p>古代人相信星體的位置決定人的命運。</p><p>若這個背景成立（多數註釋認為有此可能），保羅的意思是：</p><p>連你出生時星象所定的「命」，也隔不開這愛。</p><p>講台使用提醒：這是<b>可能的</b>背景，宜說「有學者認為」，不要說成定論。</p><p>★ 亮光三：那個清單裡少了一樣</p><p>弟兄姊妹，保羅列了十樣，還加了一個兜底條款「別的受造之物」。</p><p>有人會問：那我自己呢？我會不會自己把自己隔絕？</p><p>答案就在最後那句：</p><p>「或是<b>別的受造之物</b>（τις κτίσις ἑτέρα）。」</p><p>我是不是受造之物？</p><p>是。</p><p>所以我也在那份清單裡。</p><p>★ 亮光四：δυνήσεται ——「不能夠」</p><p>「都<b>不能</b>叫我們與神的愛隔絕」——這個字是 δύναμαι（有能力）。</p><p>不是「不會」，是「<b>沒有這個能力</b>」。</p>","exp":"<p>弟兄姊妹，第八章以「不定罪」開始，以「不隔絕」結束。</p><p>而最後一句話，是整章的地址：</p><p>「這愛是<b>在我們主基督耶穌裡</b>的。」</p><p>這份愛不是浮在空中的一種情感。</p><p>它有一個地址。</p><p>它在一個人裡面。</p><p>而8:39最後一個字，是「<b>我們的主</b>」。</p><p>保羅寫完了全卷書最壯闊的一段之後，最後落在一個字上：</p><p>「我們的」。</p><p>不是「那位主」，是——<b>我們的</b>主。</p>"}],"9":[{"a":1,"z":3,"star":true,"grk":"<p>1 Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,<br>2 ὅτι λύπη μοί ἐστιν μεγάλη καὶ ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου.<br>3 ηὐχόμην γὰρ ἀνάθεμα εἶναι αὐτὸς ἐγὼ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,</p>","lit":"<p>1「我在基督裡說真話，我不說謊——我的良心在聖靈裡<b>與我一同作見證</b>：」<br>2「我心裡有極大的憂傷，和<b>不止息的劇痛</b>。」<br>3「因為我<b>曾這樣祈願</b>：我自己成為<b>咒詛</b>，與基督分離，為了我的弟兄，我肉身的親族。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>作見證</td><td>συμμαρτυρούσης</td><td>symmartyrousēs</td><td>G4828</td><td>σύν + μαρτυρέω</td><td><b>一同作證</b></td><td><b>2:15、8:16同字</b></td></tr><tr><td>憂愁</td><td>λύπη</td><td>lypē</td><td>G3077</td><td>—</td><td>悲傷、憂傷</td><td>—</td></tr><tr><td>時常傷痛</td><td>ἀδιάλειπτος ὀδύνη</td><td>adialeiptos odynē</td><td>G88/G3601</td><td>ἀ + διαλείπω（間斷）</td><td><b>不止息的劇痛</b></td><td>ὀδύνη 是很重的字</td></tr><tr><td>願意</td><td>ηὐχόμην</td><td>ēuchomēn</td><td>G2172</td><td>εὔχομαι（祈願）</td><td><b>未完成式</b>（見下）</td><td>極重要</td></tr><tr><td>被咒詛</td><td>ἀνάθεμα</td><td>anathema</td><td>G331</td><td>—</td><td><b>被交出去毀滅的東西</b></td><td>見下</td></tr></table>","gram":"<p>★ 亮光一：συμμαρτυρέω ——第三次出現</p><p>這個字在羅馬書出現三次，每一次的證人都不同：</p><table><tr><th>出處</th><th>證人</th><th>見證的內容</th></tr><tr><td><b>2:15</b></td><td>是非之心（良心）</td><td><b>控告或辯護</b>——內心的法庭</td></tr><tr><td><b>8:16</b></td><td>聖靈</td><td>我們是神的兒女</td></tr><tr><td><b>9:1</b></td><td>良心 <b>在聖靈裡</b></td><td><b>保羅說的是真話</b></td></tr></table><p>保羅為什麼要如此鄭重地起誓？</p><p>因為他知道：一個講「外邦人也能得救」的猶太人，最容易被指控——<br>「你已經不愛你的同胞了。」</p><p>所以他先立誓：我沒有說謊。</p><p>★ 亮光二：ηὐχόμην 是未完成式</p><p>「我也願意」——這個動詞是<b>未完成式</b>（imperfect）。</p><p>在希臘文中，這種用法（有時稱為「不可能實現的願望」）表示：</p><p>「我<b>曾經這樣希望過</b>——但我知道這是不可能的。」</p><p>（英文常譯 \"I could wish\"，而不是 \"I wish\"）</p><p>弟兄姊妹，這個文法細節很重要。</p><p>保羅不是在提一個他真的打算執行的方案（他剛在8:39說沒有什麼能隔絕）。</p><p>他是在說：<b>如果可以，我願意</b>。</p><p>這是一個心碎到極處的人，說出來的話。</p><p>★ 亮光三：ἀνάθεμα 的重量</p><p>這個字在七十士譯本中，翻譯希伯來文 <b>חֵרֶם（cherem）</b>——</p><p><b>「當滅之物」：被分別出來、交給神毀滅的東西</b>（書6:17–18；7:1的亞干事件）。</p><p>保羅在別處用這個字：</p><p>- <b>林前16:22</b>「若有人不愛主，這人可<b>詛可咒</b>」<br>- <b>加1:8</b>「就應當被<b>咒詛</b>」</p><p>弟兄姊妹，保羅在說：如果可以，我願意成為那個「當滅之物」——</p><p>只要我的同胞能得救。</p><p>★ 亮光四：這句話有一個先例</p><p>出埃及記32:32，摩西在金牛犢事件之後對神說：</p><p>「倘或你肯赦免他們的罪……不然，求你從你所寫的冊上塗抹我的名。」</p><p>保羅的話，是摩西的回聲。</p><p>而兩個人所說的，最終都在一位身上實現了——</p><p>只有一個人真的成了咒詛：</p><p>「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛。」（加3:13）</p>","exp":"<p>弟兄姊妹，9:1–3是全章的門。</p><p>如果不從這裡進去，第九章就會變成一場冷冰冰的預定論辯論。</p><p>保羅講神的主權之前，先哭了。</p><p>而任何人要講第九章，也應該先走過這三節。</p>"},{"a":4,"z":5,"star":false,"grk":"<p>4 οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,<br>5 ὧν οἱ πατέρες καὶ ἐξ ὧν ὁ Χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας, ἀμήν.</p>","lit":"<p>4「他們就是以色列人：<b>兒子的名分</b>、<b>榮耀</b>、<b>諸約</b>、<b>律法的頒賜</b>、<b>聖殿的敬拜</b>、<b>應許</b>，都是他們的；」<br>5「<b>列祖</b>是他們的；而按肉體說，<b>基督也是從他們出來的</b>——祂是在萬有之上、永遠當受稱頌的神。阿們。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>兒子的名分</td><td>υἱοθεσία</td><td>huiothesia</td><td>G5206</td><td><b>收養</b>（<b>8:15、8:23同字！</b>）</td></tr><tr><td>榮耀</td><td>δόξα</td><td>doxa</td><td>G1391</td><td>指<b>神的榮耀同在</b>（שְׁכִינָה 的觀念）</td></tr><tr><td>諸約</td><td>διαθῆκαι</td><td>diathēkai</td><td>G1242</td><td><b>複數</b>：與亞伯拉罕、摩西、大衛所立的約</td></tr><tr><td>律法</td><td>νομοθεσία</td><td>nomothesia</td><td>G3548</td><td><b>律法的頒賜</b>（不只是律法本身）</td></tr><tr><td>禮儀</td><td>λατρεία</td><td>latreia</td><td>G2999</td><td><b>敬拜的事奉</b>（聖殿的敬拜）</td></tr></table>","gram":"<p>★ 亮光一：八項特權</p><p>保羅一口氣列了八樣（有些學者算作九樣）：</p><pre>1. 以色列人（這個名字本身）\n2. 兒子的名分（υἱοθεσία）\n3. 榮耀（神同在的榮光）\n4. 諸約（複數）\n5. 律法的頒賜\n6. 敬拜的事奉\n7. 應許（複數）\n8. 列祖\n★ 而且：按肉體說，基督也是從他們出來的</pre><p>弟兄姊妹，保羅在說：<b>這些全部是真的</b>。</p><p>他沒有為了強調外邦人，就否認以色列的特權。</p><p>（正如4:1–2，他沒有為了講因信稱義，就否認亞伯拉罕的偉大。）</p><p>★ 亮光二：υἱοθεσία ——第八章那個字</p><p>「兒子的名分」正是8:15、8:23的那個字（羅馬的收養）。</p><p>這使9:1–5的悲傷更加深：</p><p>那份「兒子的名分」是他們的——<br>而他們大部分人，正站在門外。</p><p>★ 亮光三：9:5的標點爭議（是否稱基督為神）</p><p>希臘文原稿沒有標點。9:5末句有兩種主要讀法：</p><table><tr><th>讀法</th><th>中譯</th><th>意思</th></tr><tr><td><b>讀法A（多數譯本，含和合本）</b></td><td>「基督也是從他們出來的，<b>他是在萬有之上，永遠可稱頌的神</b>」</td><td><b>基督被稱為神</b></td></tr><tr><td><b>讀法B</b></td><td>「……基督也是從他們出來的。<b>願在萬有之上的神，永遠可稱頌</b>」</td><td>末句是<b>獨立的頌讚</b>，不指基督</td></tr></table><p>支持讀法A的主要理由（多數現代學者傾向此讀法）：</p><p>1. <b>希臘文的頌讚句通常把「可稱頌的」（εὐλογητός）放在句首</b>——但這裡放在後面，較符合「形容前面主詞」的讀法<br>2. <b>ὁ ὤν（那是……的）是關係性的分詞</b>，自然承接前面的「基督」<br>3. 保羅剛說「按<b>肉體</b>說」，自然會有一個對比的另一面</p><p>支持讀法B的理由：</p><p>- 保羅稱基督為「神」的例子不多（雖然多3:13、腓2:6等處有高基督論）</p><p>講台誠信提醒：可以說「這一節多數學者認為是稱基督為神」，但宜補一句「這裡有一個標點的問題，因為原稿沒有標點」。<br>不要說「所有人都同意」。</p>","exp":"<p>弟兄姊妹，9:4–5使9:1–3的悲傷變得更深。</p><p>保羅的憂愁不是抽象的。</p><p>他一項一項數著：兒子的名分、榮耀、諸約、律法、敬拜、應許、列祖、彌賽亞——</p><p>全部是他們的。</p><p>而他們大部分人，不在裡面。</p><p>【第二段｜9:6–13　神的話沒有落空】</p>"},{"a":6,"z":6,"star":true,"grk":"<p>Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραὴλ οὗτοι Ἰσραήλ·</p>","lit":"<p>「但這並不是說神的話<b>掉下來了</b>。因為<b>不是所有從以色列出來的，就都是以色列</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>落了空</td><td>ἐκπέπτωκεν</td><td>ekpeptōken</td><td>G1601</td><td>ἐκ + πίπτω（掉落）</td><td><b>掉下來、失效</b></td><td><b>完成式</b>（見下）</td></tr><tr><td>話</td><td>λόγος</td><td>logos</td><td>G3056</td><td>—</td><td>話語、應許</td><td>指神的應許</td></tr></table>","gram":"<p>★ 亮光一：ἐκπίπτω 的畫面</p><p>這個字的字面是「<b>掉出來、掉下去</b>」。</p><p>用於：</p><p>- <b>花凋謝掉落</b>（雅1:11「花必凋謝」；彼前1:24）<br>- <b>船隻失去方向、觸礁</b>（徒27:17、26、29）<br>- 從恩典中<b>墜落</b>（加5:4）</p><p>保羅說：神的話<b>沒有掉下來</b>。</p><p>它沒有凋謝，沒有觸礁，沒有從架上摔下來。</p><p>★ 亮光二：完成式的意義</p><p>ἐκπέπτωκεν 是<b>完成式</b>——「（並非）已經掉下來且維持在那個狀態」。</p><p>保羅要否定的，不只是「神的話曾經失效」，<br>而是「神的話<b>現在處於失效的狀態</b>」。</p><p>★ 亮光三：全章的論證方向就在這一節</p><p>注意保羅怎麼回答「神的話落空了嗎」：</p><p>他<b>沒有</b>說：「不會的，將來以色列都會信。」（那是第十一章才說的）</p><p>他說的是：</p><p>「因為從以色列生的<b>不都是</b>以色列人。」</p><p>意思是：<b>神的應許從來就不是給「所有血統上的以色列人」的</b>。</p><p>所以現在有很多人不信——<b>這不表示應許失效了</b>。</p><p>★ 亮光四：與2:28–29的完全呼應</p><pre>2:28–29  外面作猶太人的，不是真猶太人……惟有裡面作的，才是真猶太人\n   ↓\n9:6      從以色列生的不都是以色列人</pre><p>保羅在第二章已經說過同樣的話。第九章只是把它應用到救恩歷史上。</p>","exp":"<p>弟兄姊妹，9:6是全章的<b>鑰匙</b>——而它是一句<b>辯護</b>。</p><p>保羅剛數完以色列的八項特權（9:4–5），然後面對一個很尖銳的問題：</p><p>如果神給了他們這麼多應許，而他們大部分人不在裡面——</p><p>那<b>神的話是不是失效了</b>？</p><p>保羅的回答分兩層：</p><pre>第一層：不是。神的話沒有「掉下來」（ἐκπίπτω）\n第二層：因為「以色列」從一開始就不是按血統定義的</pre><p><b>經文本身明確表達的：</b> 神的話沒有落空；因為「從以色列生的」不等於「以色列」。</p><p><b>可以合理推論的：</b> 這句話不是保羅臨時想出來的辯詞——<br>舊約本身就是這樣：以撒而非以實瑪利，雅各而非以掃。</p><p>神從來沒有應許「凡是亞伯拉罕的肉身後裔都必得救」。</p><p><b>⚠ 講台誠信提醒：</b> 第九章的驅動問題是「<b>神的話落空了嗎</b>」（9:6），<br>不是「預定論該怎麼建構」。<br>若把第九章當成一篇預定論論文來讀，就讀錯了它的文體與目的。</p>"},{"a":7,"z":9,"star":false,"grk":"<p>7 οὐδ' ὅτι εἰσὶν σπέρμα Ἀβραάμ πάντες τέκνα, ἀλλ'· ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.<br>8 τοῦτ' ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα.<br>9 ἐπαγγελίας γὰρ ὁ λόγος οὗτος· κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.</p>","lit":"<p>7「也不是因為是亞伯拉罕的後裔，就都是兒女；乃是『<b>從以撒生的，才要稱為你的後裔</b>』。」<br>8「這就是說：<b>肉身的兒女不是神的兒女</b>；<b>惟有應許的兒女，才被算為後裔</b>。」<br>9「因為所應許的話是這樣：『<b>到這時候我要來，撒拉必有一個兒子</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>肉身所生的兒女</td><td>τὰ τέκνα τῆς σαρκός</td><td>—</td><td>G4561</td><td><b>肉體的兒女</b></td></tr><tr><td>應許的兒女</td><td>τὰ τέκνα τῆς ἐπαγγελίας</td><td>—</td><td>G1860</td><td><b>應許的兒女</b></td></tr></table>","gram":"<p>★ 保羅的第一個例子：以實瑪利 vs 以撒</p><p>這個例子的重點在於：</p><pre>以實瑪利：亞伯拉罕的兒子（血統上完全合格）\n以撒：    亞伯拉罕的兒子 ＋ 應許的產物\n   ↓\n神揀選的是以撒</pre><p>而9:9引創18:10、14，強調以撒是<b>應許</b>的結果：</p><p>「到明年這時候我要來，撒拉必生一個兒子。」</p><p>弟兄姊妹，回想第四章：</p><p>4:19「他將近百歲的時候，雖然想到自己的身體如同已死。」</p><p>以撒的出生，是「叫死人復活、使無變為有的神」的作為（4:17）。</p><p>所以保羅的重點是：<b>應許的兒女，從一開始就是神生出來的，不是人生出來的</b>。</p>","exp":"<p>弟兄姊妹，這三節在證明9:6那句話。</p><p>而保羅舉的例子，是<b>亞伯拉罕自己家裡的事</b>：</p><p>亞伯拉罕有兩個兒子。</p><p>以實瑪利是<b>血統上的</b>後裔（而且是長子）。<br>以撒是<b>應許的</b>兒女。</p><p>注意8節那個動詞：「<b>被算為</b>（λογίζεται）後裔」——</p><p>那是第四章那個記帳的字。</p><p><b>經文本身明確表達的：</b> 神的後裔是按<b>應許</b>定義的，不是按<b>肉身</b>定義的。</p><p><b>可以合理推論的：</b> 這對每一個讀者都有話說——</p><p>你能在神的家裡，<b>不是因為你的出身</b>，是因為<b>祂的應許</b>。</p><p>而以撒的出生本身就是證據：那是「叫死人復活、使無變為有的神」（4:17）的作為。</p><p><b>⚠ 牧養提醒：</b> 這一段不是要人去猜「誰是應許的兒女」，<br>是要人回到9:6的問題：<b>神的話有沒有失效</b>？答案是沒有。</p>"},{"a":10,"z":13,"star":true,"grk":"<p>11 μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον, ἵνα ἡ κατ' ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ, οὐκ ἐξ ἔργων ἀλλ' ἐκ τοῦ καλοῦντος,</p>","lit":"<p>11「因為雙子還沒有生下來，也還沒有做出任何善惡，為要使神那<b>按著揀選的旨意</b>得以<b>存留</b>——不是出於行為，乃是出於<b>那位呼召的</b>——」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>揀選</td><td>ἐκλογή</td><td>eklogē</td><td>G1589</td><td>ἐκ + λέγω（挑出）</td><td><b>挑選出來</b></td><td>11:5、11:28同字</td></tr><tr><td>旨意</td><td>πρόθεσις</td><td>prothesis</td><td>G4286</td><td>πρό + τίθημι</td><td><b>預先擺定的計畫</b></td><td><b>8:28同字</b></td></tr><tr><td>存留</td><td>μένῃ</td><td>menē</td><td>G3306</td><td>μένω</td><td><b>保持不變、站立得住</b></td><td>—</td></tr><tr><td>惡</td><td>ἐμίσησα</td><td>emisēsa</td><td>G3404</td><td>μισέω</td><td>恨惡</td><td><b>見第二十部分</b></td></tr></table>","gram":"<p>★ 亮光一：保羅為什麼要加第二個例子？</p><p>因為以實瑪利與以撒的例子，還有一個可能的解釋：</p><p>「以實瑪利是使女生的，以撒是正室生的——所以是<b>母親不同</b>。」</p><p>所以保羅加了第二個例子，把這個解釋堵死：</p><pre>雅各與以掃：同一個父親（以撒）、同一個母親（利百加）\n            而且是雙胞胎、同一次懷孕（9:10）</pre><p>不能再說「因為出身不同」了。</p><p>★ 亮光二：「還沒有生下來，善惡還沒有做出來」</p><p>保羅刻意強調時間點：</p><p>神說話的時候（創25:23），這兩個孩子還在腹中。</p><p>所以揀選的根據，<b>不可能是他們的行為</b>。</p><p>★ 亮光三：πρόθεσις ——8:28那個字</p><pre>8:28  「就是按他旨意（πρόθεσις）被召的人」\n9:11  「神揀選人的旨意（πρόθεσις）」</pre><p>第八章的「金鏈」與第九章的「揀選」，用的是同一個字。</p><p>★ 亮光四：9:13「以掃是我所惡的」（見第二十部分的完整討論）</p><p>這句話引自瑪拉基書1:2–3。</p><p>必須注意三件事：</p><p>1. <b>瑪拉基書的上下文講的是</b>兩個民族<b>（以東與以色列），不是兩個嬰兒的永恆命運<br>2. </b>創25:23原文就說「兩國在你腹內」<b>——是民族性的預言<br>3. </b>希伯來語法中，「愛……恨……」常是<b>比較式的表達</b>（見第二十部分）</p><p>講台誠信提醒：不可把9:13直接讀成「神在以掃出生前就決定憎恨他、讓他下地獄」——<br>那超出了保羅所引經文的原意。</p>","exp":"<p>弟兄姊妹，9:11的重點是什麼？</p><p>「不在乎人的行為，乃在乎<b>召人的主</b>。」</p><p>這句話與整卷羅馬書完全一致：</p><pre>3:20  沒有一個因行律法能稱義\n4:4–5 作工的得工價，不算恩典\n9:11  不在乎人的行為，乃在乎召人的主\n9:16  不在乎那定意的，也不在乎那奔跑的</pre><p>保羅在第九章講揀選，不是為了滿足我們對「誰得救」的好奇，<br>是為了證明<b>同一件事</b>：</p><p>從頭到尾，都是恩典。</p><p>【第三段｜9:14–18　神不公平嗎？】</p>"},{"a":14,"z":16,"star":false,"grk":"<p>16 ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.</p>","lit":"<p>14「那麼我們要說什麼呢？<b>神那裡有不義嗎</b>？<b>絕不可能</b>！」<br>15「因為祂對摩西說：『<b>我要憐憫誰，就憐憫誰</b>；我要恩待誰，就恩待誰。』」<br>16「所以，這<b>不在於那想要的</b>，<b>也不在於那奔跑的</b>，乃<b>在於那施憐憫的神</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>不公平</td><td>ἀδικία</td><td>adikia</td><td>G93</td><td><b>不義</b></td></tr><tr><td>定意的</td><td>τοῦ θέλοντος</td><td>tou thelontos</td><td>G2309</td><td><b>意志的決定</b>（7:18「立志」同字）</td></tr><tr><td>奔跑的</td><td>τοῦ τρέχοντος</td><td>tou trechontos</td><td>G5143</td><td><b>賽跑</b>（保羅愛用的比喻：林前9:24；腓2:16）</td></tr><tr><td>發憐憫</td><td>ἐλεῶντος</td><td>eleōntos</td><td>G1653</td><td>施憐憫</td></tr></table>","gram":"<p>★ 亮光一：9:15引出33:19的上下文極其重要</p><p>這句話是神在什麼時候說的？</p><p>金牛犢事件之後。</p><p>以色列剛剛拜了金牛犢，摩西求神顯出祂的榮耀，神就說：</p><p>「我要恩待誰就恩待誰；要憐憫誰就憐憫誰。」（出33:19）</p><p>弟兄姊妹，這一點很重要：</p><p>這句話的原始處境，不是「神隨意決定誰下地獄」，<br>是「一個剛剛悖逆的民族，<b>竟然還能繼續存在</b>——那是因為憐憫」。</p><p>★ 亮光二：「定意的／奔跑的」</p><pre>θέλω   —— 意志（我想要）\nτρέχω  —— 行動（我努力）</pre><p>保羅列出了人所能做的兩件事：<b>想</b>與<b>跑</b>。</p><p>然後說：都不在乎。</p><p>弟兄姊妹，這兩個字剛好對應第七章：</p><p>7:18「立志為善（θέλειν）由得我，只是行出來由不得我。」</p><p>想，我有。跑，我也試過。<br>而9:16說：這件事的根據不在那裡。</p>","exp":"<p>弟兄姊妹，14節那個問題，是每一個讀到9:13的人都會問的：</p><p>「這樣公平嗎？」</p><p>而保羅的回答，不是先辯護，是先<b>引一段經文</b>（出33:19）。</p><p>而那段經文的處境極其重要：</p><p>那是在<b>金牛犢事件之後</b>說的。</p><p>以色列剛剛拜了偶像；摩西求神顯出祂的榮耀。<br>而神說的是：「我要憐憫誰，就憐憫誰。」</p><p><b>經文本身明確表達的：</b> 神施憐憫的根據，在祂自己，不在人的意志（θέλω）或努力（τρέχω）。</p><p><b>可以合理推論的：</b> 保羅列出的正是人能做的<b>全部兩件事</b>——<b>想</b>與<b>跑</b>。</p><p>而這兩個字剛好對應第七章：「立志（θέλειν）為善由得我，只是行出來由不得我。」</p><p>想，我有。跑，我也試過。而9:16說：這件事的根據，不在那裡。</p><p><b>⚠ 講台誠信提醒：</b> 9:16不可用來否定人的責任——<br>同一位保羅在10:9–13說「凡求告主名的，就必得救」，在10:14說「沒有傳道的，怎能聽見呢」。<br>第九章與第十章必須一起讀。</p>"},{"a":17,"z":18,"star":false,"grk":"<p>17 λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.<br>18 ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.</p>","lit":"<p>17「因為經上對法老說：『<b>正是為這緣故，我興起了你</b>——為要在你身上<b>顯出我的能力</b>，並要使<b>我的名傳遍全地</b>。』」<br>18「所以，祂<b>要憐憫誰就憐憫誰</b>，<b>要叫誰剛硬就叫誰剛硬</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>興起</td><td>ἐξήγειρα</td><td>exēgeira</td><td>G1825</td><td><b>興起、使之站立</b>（見下）</td></tr><tr><td>剛硬</td><td>σκληρύνει</td><td>sklērynei</td><td>G4645</td><td><b>使之硬化</b>（<b>2:5 σκληρότης 同字根</b>）</td></tr></table>","gram":"<p>★ 亮光一：出埃及記的完整資料（★ 必須誠實呈現）</p><p>關於法老的心，出埃及記的敘述比一般人以為的複雜：</p><table><tr><th>說法</th><th>出處</th></tr><tr><td><b>神使法老的心剛硬</b></td><td>出4:21、7:3、9:12、10:1、10:20、10:27、11:10、14:4、14:8、14:17</td></tr><tr><td><b>法老自己硬著心</b></td><td>出8:15、8:32、9:34</td></tr><tr><td><b>法老的心剛硬（未指明主詞）</b></td><td>出7:13、7:14、7:22、8:19、9:7、9:35</td></tr></table><p>弟兄姊妹，這個資料極其重要：</p><p>出埃及記<b>同時</b>說神使他剛硬，也說他自己硬著心。</p><p>而且值得注意的是：<b>在敘事的順序上，法老自己硬心的記載出現得很早</b>（出7–8章），<br>神「使他剛硬」的實際發生，多在後段（出9:12之後）。</p><p>（不同學者對這個順序的神學意義有不同解讀，但資料本身是清楚的。）</p><p>★ 亮光二：σκληρύνω 與2:5的呼應</p><pre>2:5   「你竟任著你剛硬（σκληρότης）不悔改的心」—— 人自己剛硬\n9:18  「要叫誰剛硬（σκληρύνει）就叫誰剛硬」—— 神使之剛硬</pre><p>保羅在羅馬書中兩面都說了。</p><p>★ 亮光三：ἐξεγείρω ——「興起」</p><p>出9:16的希伯來原文有「使你存立」的意思。</p><p>神對法老說的是：我讓你活到現在，是有目的的。</p><p>注意：經文說的是「我將你<b>興起</b>」，不是「我造你出來是為了毀滅你」。</p>","exp":"<p>弟兄姊妹，9:14–18回答了「神公平嗎」這個問題——但回答的方式可能出乎意料。</p><p>保羅<b>沒有</b>說：「神很公平，因為祂是照著人的表現來決定的。」</p><p>他說的是：</p><p>「我要憐憫誰就憐憫誰。」</p><p>弟兄姊妹，這句話的重點是<b>憐憫</b>。</p><p>而憐憫的定義是什麼？</p><p>憐憫是——<b>不欠你的</b>。</p><p>如果神欠你，那叫「公平」。<br>如果神不欠你，那叫「憐憫」。</p><p>而保羅前面八章已經證明了：<b>神不欠任何人</b>。</p><p>【第四段｜9:19–24　窯匠與泥土】</p>"},{"a":19,"z":21,"star":false,"grk":"<p>20 ὦ ἄνθρωπε, μενοῦνγε σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ;</p>","lit":"<p>19「那麼你要對我說：『<b>祂為什麼還指責人呢</b>？有誰<b>抵擋過祂的旨意</b>呢？』」<br>20「<b>人哪</b>——<b>你到底是誰</b>，竟然<b>回嘴頂撞神</b>？<b>受造的</b>豈能對<b>造它的</b>說：『你為什麼把我造成這樣？』」<br>21「窯匠豈沒有權柄，<b>從同一團泥裡</b>，拿一塊做成<b>貴重的器皿</b>，又拿一塊做成<b>平常的器皿</b>嗎？」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>你這個人哪</td><td>ὦ ἄνθρωπε</td><td>ō anthrōpe</td><td>G444</td><td>—</td><td>呼格：<b>人哪</b></td><td><b>2:1、2:3同樣的呼格</b></td></tr><tr><td>強嘴</td><td>ἀνταποκρινόμενος</td><td>antapokrinomenos</td><td>G470</td><td>ἀντί + ἀποκρίνομαι</td><td><b>頂嘴、對著回話</b></td><td>見下</td></tr><tr><td>窯匠</td><td>κεραμεύς</td><td>kerameus</td><td>G2763</td><td>—</td><td>陶匠</td><td>舊約常見的意象</td></tr><tr><td>泥</td><td>πηλός</td><td>pēlos</td><td>G4081</td><td>—</td><td>泥土</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：「人哪」——第二章的呼格回來了</p><pre>2:1  「你這論斷人的（ὦ ἄνθρωπε），無論你是誰」\n2:3  「你這人哪（ὦ ἄνθρωπε）」\n9:20 「你這個人哪（ὦ ἄνθρωπε）」</pre><p>保羅在羅馬書用這個呼格三次——每一次都是在對付<b>人的自以為是</b>。</p><p>★ 亮光二：ἀνταποκρίνομαι ——「頂回去」</p><p>這個字由 ἀντί（對著）+ ἀποκρίνομαι（回答）組成。</p><p>它的意思是：<b>回嘴、頂撞、對著幹</b>。</p><p>（新約僅兩次：路14:6、羅9:20）</p><p>保羅的重點不是「你不可以問問題」——</p><p>他自己在9:14、9:19就在問問題！</p><p>他的重點是：<b>你不可以站到神的對面，把祂當被告審問</b>。</p><p>★ 亮光三：窯匠的意象來自舊約，而且上下文很重要</p><p>保羅在9:20引用了賽29:16與賽45:9，而9:21的窯匠意象在舊約有幾處：</p><table><tr><th>出處</th><th>上下文</th></tr><tr><td><b>賽29:16</b></td><td>責備那些「以為神看不見」的人</td></tr><tr><td><b>賽45:9</b></td><td>責備那些質疑神使用古列的人</td></tr><tr><td><b>★ 耶18:1–10</b></td><td><b>窯匠的家：而這一段的重點是——神會照著人的回應改變祂的作法</b></td></tr></table><p>耶利米書18:7–8極其重要：</p><p>「我何時論到一邦或一國說，要拔出、拆毀、毀壞；<br>我所說的那一邦，<b>若是轉意離開他們的惡</b>，我就必後悔，不將我想要施行的災禍降與他們。」</p><p>弟兄姊妹，這一點值得注意：</p><p>舊約的窯匠意象，<b>本身就包含人的回應</b>。</p><p>保羅引用這個意象時，是在講神的主權——<br>但這個意象在舊約的原始脈絡裡，並不是宿命論。</p>","exp":"<p>弟兄姊妹，19節的問題很誠實：「那還能怪誰呢？」</p><p>而保羅的回答，讓很多人不滿意——因為他<b>沒有直接回答</b>。</p><p>他做的是：<b>把問問題的人，移回他該站的位置</b>。</p><p>「人哪——<b>你到底是誰</b>？」</p><p><b>經文本身明確表達的：</b> 受造之物沒有立場質問造它的那一位；窯匠對泥土有處置權。</p><p><b>可以合理推論的：</b> 保羅在此<b>不是</b>在證明「神是專斷的」，<br>他是在指出：<b>提問者站錯了位置</b>。</p><p>這正是321所說的：<b>驕傲是離開本位，抓住權力</b>。<br>而這裡的「離開本位」，是<b>從受造者的位置，跳到審問者的位置</b>。</p><p><b>⚠ 講台誠信提醒（極重要）：</b> 讀到窯匠<b>不可以停在這裡</b>。</p><p>理由有三：</p><p>① 舊約的窯匠意象（耶18:1–10）<b>本身就包含人的回應</b>：<br>「那一邦若是轉意離開他們的惡，我就必後悔。」</p><p>② 下一段（9:22–23）的原文語法是<b>不對稱的</b>（見下一節）。</p><p>③ 保羅自己給的結論在9:32：「他們<b>不憑著信心求，只憑著行為求</b>。」</p>"},{"a":22,"z":24,"star":true,"grk":"<p>22 εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,<br>23 καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους ἃ προητοίμασεν εἰς δόξαν,</p>","lit":"<p>22「但若神願意顯明祂的忿怒、彰顯祂的權能，卻<b>以極大的忍耐擔待</b>了那些可怒的器皿——<b>那些已被預備好走向毀滅的</b>——」<br>23「又為要彰顯祂榮耀的豐富，在那些蒙憐憫的器皿上——<b>就是祂預先預備得榮耀的</b>——」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>語態</th><th>意義</th></tr><tr><td>忍耐</td><td>μακροθυμία</td><td>makrothymia</td><td>G3115</td><td>—</td><td><b>2:4那個字！「長引線」</b></td></tr><tr><td>寬容</td><td>ἤνεγκεν</td><td>ēnenken</td><td>G5342</td><td>主動</td><td><b>擔待、承受</b>（φέρω）</td></tr><tr><td>預備遭毀滅</td><td>κατηρτισμένα</td><td>katērtismena</td><td>G2675</td><td><b>完成被動分詞</b></td><td><b>見下</b></td></tr><tr><td>早預備得榮耀</td><td>προητοίμασεν</td><td>proētoimasen</td><td>G4282</td><td><b>主動，主詞是神</b></td><td><b>見下</b></td></tr></table>","gram":"<p>★★ 亮光一：兩節之間的巨大不對稱</p><p>請把兩個動詞並排：</p><pre>9:22  κατηρτισμένα εἰς ἀπώλειαν\n      「已被預備好走向毀滅」\n      —— 完成被動分詞\n      —— 【經文沒有指明是誰預備的】\n\n9:23  ἃ προητοίμασεν εἰς δόξαν\n      「祂預先預備得榮耀的」\n      —— 主動語態\n      —— 【主詞明確：神】</pre><p>弟兄姊妹，保羅在這裡的用字，精準到令人震動。</p><p>講到<b>榮耀</b>，他明說：<b>神預先預備的</b>。<br>講到<b>毀滅</b>，他用被動式，<b>沒有說是誰預備的</b>。</p><p>這個不對稱意味著什麼？</p><p>至少意味著：保羅<b>沒有</b>用一句對稱的話說「神預備一些人得榮耀、預備另一些人下地獄」。</p><p>他刻意在兩邊用了不同的語法。</p><p>（關於「雙重預定」的完整討論，見第二十部分。）</p><p>★ 亮光二：κατηρτισμένα 的字義</p><p>καταρτίζω 的意思是「<b>修補、裝配、使之完備</b>」。</p><p>（可1:19「補網」；加6:1「挽回」；來11:3「諸世界是藉神的話造成的」——都是同字）</p><p>這個字本身是中性的：使某物達到它應有的狀態。</p><p>★ 亮光三：μακροθυμία ——第二章那個字</p><pre>2:4   「你藐視他豐富的恩慈、寬容、忍耐（μακροθυμία）……\n       不曉得他的恩慈是領你悔改呢？」\n   ↓\n9:22  「就多多忍耐（μακροθυμία）寬容那可怒……的器皿」</pre><p>弟兄姊妹，這個連結極其重要。</p><p>第二章說：神的忍耐，是<b>在領人悔改</b>。<br>第九章說：神對「可怒的器皿」，也是<b>多多忍耐</b>。</p><p>所以9:22的畫面<b>不是</b>「神迫不及待要毀滅他們」，<br>而是「神<b>擔待了他們很久很久</b>」。</p><p>★ 亮光四：9:24的收尾</p><p>「這器皿就是<b>我們</b>被神所召的，不但是從猶太人中，<b>也是從外邦人中</b>。」</p><p>保羅講完了窯匠與泥土，然後說：</p><p>那個蒙憐憫的器皿，<b>就是你們</b>。</p><p>而且不只猶太人——<b>也有外邦人</b>。</p><p>弟兄姊妹，這就是第九章講揀選的目的：</p><p>不是為了讓我們去猜誰在裡面、誰在外面，<br>是為了讓外邦信徒知道：<b>你們能在這裡，純粹是憐憫</b>。</p>","exp":"<p>弟兄姊妹，這三節是全章<b>最需要小心讀</b>的一段。</p><p>而鑰匙在<b>原文的語法不對稱</b>上：</p><table><tr><th></th><th>可怒的器皿（9:22）</th><th>蒙憐憫的器皿（9:23）</th></tr><tr><td><b>動詞形式</b></td><td><b>κατηρτισμένα</b>（完成被動分詞）</td><td><b>προητοίμασεν</b>（主動，不定過去式）</td></tr><tr><td><b>施動者</b></td><td><b>未指明</b></td><td><b>主詞明確是神</b></td></tr><tr><td><b>神的態度</b></td><td><b>多多忍耐寬容</b>（μακροθυμία）</td><td>彰顯豐盛的榮耀</td></tr></table><p>保羅<b>刻意</b>沒有把兩邊寫成對稱的。</p><p>而 μακροθυμία（忍耐）正是2:4那個字：</p><p>2:4「你藐視他豐富的恩慈、寬容、<b>忍耐</b>，不曉得他的恩慈是<b>領你悔改</b>呢？」</p><p><b>經文本身明確表達的：</b> 神在忿怒的器皿上多多忍耐；在蒙憐憫的器皿上彰顯榮耀；而這蒙召的器皿，包括猶太人與外邦人。</p><p><b>可以合理推論的：</b> 語法的不對稱<b>不能被用來證明任何一方的預定論立場</b>，<br>但它確實顯示：<b>保羅不願意把「毀滅」與「榮耀」講成同一種作為</b>。</p><p><b>⚠ 講台誠信提醒：</b> 這個語法觀察是硬事實（可查證），<br>但它的<b>神學推論</b>，歷代解經家有不同理解。<br>宜說明「保羅在這裡的措辭是不對稱的」，而不宜宣告「所以某某立場才是對的」。</p><p>而24節把整段拉回地面：</p><p>「這器皿<b>就是我們</b>……不但是從猶太人中，<b>也是從外邦人中</b>。」</p><p>弟兄姊妹，講了半天的器皿——</p><p>保羅說：<b>就是你們</b>。</p><p>【第五段｜9:25–29　舊約的見證】</p>"},{"a":25,"z":29,"star":false,"grk":"<p>25 …καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·<br>27 …ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ὑπόλειμμα σωθήσεται·<br>29 …εἰ μὴ κύριος σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν…</p>","lit":"<p>25「正如祂在何西阿書上說：『我要<b>稱那不是我子民的，為我的子民</b>；稱那<b>不蒙愛的，為蒙愛的</b>。』」<br>26「『從前在什麼地方對他們說「你們不是我的子民」，將來就在那裡，他們要被稱為<b>永生神的兒子</b>。』」<br>27「而以賽亞指著以色列<b>放聲喊著說</b>：『以色列子孫的數目<b>雖如海沙</b>，<b>得救的不過是那剩下的餘數</b>；』」<br>28「『因為主要在地上<b>施行祂的話</b>，<b>又快又徹底地成就</b>。』」<br>29「又如以賽亞先前說過：『<b>若不是萬軍之主給我們留下後裔</b>，我們<b>早已</b>像所多瑪、蛾摩拉一樣了。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>餘數</td><td>ὑπόλειμμα</td><td>hypoleimma</td><td>G5259</td><td><b>剩下的一小部分</b></td></tr><tr><td>餘種</td><td>σπέρμα</td><td>sperma</td><td>G4690</td><td><b>種子</b>（賽1:9 LXX）</td></tr></table>","gram":"<p>★ 亮光一：何西阿書的原始對象是誰？</p><p>何西阿書1–2章的「不是我子民」（לֹא עַמִּי, Lo-Ammi），原指<b>北國以色列</b>——</p><p>神說：因為你們的悖逆，你們不再是我的子民。</p><p>然後神說：有一天，我要再稱你們為「我的子民」。</p><p>而保羅把這段經文，應用到<b>外邦人</b>身上（9:24「也是從外邦人中」）。</p><p>這是什麼樣的解經？</p><p>保羅的邏輯是：如果神能把「不是子民」的以色列人重新收為子民，<br>那祂當然也能把從來不是子民的外邦人收為子民。</p><p>神一向就是做這種事的神。</p><p>★ 亮光二：以賽亞書的「餘數」（remnant）觀念</p><p>這是舊約先知書的一個重大主題：</p><table><tr><th>出處</th><th>內容</th></tr><tr><td>賽1:9</td><td>「若不是萬軍之耶和華給我們稍留餘種」</td></tr><tr><td>賽10:20–22</td><td>「所剩下的，就是雅各家所剩下的，必歸回」</td></tr><tr><td>王上19:18</td><td>「我在以色列人中為自己留下七千人」</td></tr><tr><td><b>羅11:5</b></td><td><b>「如今也是這樣，照著揀選的恩典，還有所留的餘數。」</b></td></tr></table><p>弟兄姊妹，「餘數」這個觀念有兩面：</p><p>一面是<b>審判</b>：只剩下一小部分。<br>另一面是<b>恩典</b>：<b>竟然還有一小部分</b>。</p><p>9:29說得很清楚：「若不是……我們<b>早已</b>像所多瑪。」</p>","exp":"<p>弟兄姊妹，9:25–29的功用是：證明保羅講的不是新道理。</p><p>保羅說：何西阿早就說了。以賽亞早就說了。</p><p>神從一開始就是這樣做的。</p><p>【第六段｜9:30–33　結論：他們跌倒了】</p>"},{"a":30,"z":33,"star":true,"grk":"<p>32 διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ' ὡς ἐξ ἔργων· προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,</p>","lit":"<p>30「那麼我們要說什麼呢？<b>那些本來不追求義的外邦人</b>，<b>得著了義</b>——就是<b>本於信</b>的義；」<br>31「但以色列<b>追求那使人得義的律法</b>，卻<b>沒有達到那律法</b>。」<br>32「為什麼？<b>因為他們不是本於信，乃是像本於行為</b>。他們<b>撞上了那絆腳的石頭</b>——」<br>33「正如經上所記：『看哪，我在錫安放一塊<b>絆腳的石頭</b>、<b>跌人的磐石</b>；而<b>信靠祂的人，必不至於羞愧</b>。』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>追求</td><td>διώκοντα</td><td>diōkonta</td><td>G1377</td><td><b>追趕、竭力追求</b>（賽跑的意象）</td></tr><tr><td>跌</td><td>προσέκοψαν</td><td>prosekopsan</td><td>G4350</td><td>πρός + κόπτω：<b>撞上、踢到</b></td></tr><tr><td>絆腳石</td><td>λίθος τοῦ προσκόμματος</td><td>—</td><td>G4348</td><td><b>使人絆倒的石頭</b></td></tr><tr><td>羞愧</td><td>καταισχυνθήσεται</td><td>kataischynthēsetai</td><td>G2617</td><td><b>蒙羞</b>（<b>5:5「盼望不至於羞恥」同字</b>）</td></tr></table>","gram":"<p>★★ 亮光一：這是保羅自己給第九章的結論</p><p>弟兄姊妹，這一點極其重要。</p><p>很多人讀第九章，讀到窯匠（9:21）就停了。</p><p>但保羅自己在9:30–33下了結論——而那個結論是：</p><p>「這是什麼緣故呢？</p><p>是因為他們<b>不憑著信心求，只憑著行為求</b>。」</p><p>保羅把整章收在<b>人的責任</b>上。</p><p>他沒有說：「因為神沒有揀選他們。」<br>他說：「因為他們<b>憑行為求</b>。」</p><p>這與第十章第一節的開頭完全連貫：</p><p>10:2–3「他們向神有熱心，但不是按著真知識……想要立自己的義，就不服神的義了。」</p><p>★ 亮光二：ὡς ἐξ ἔργων ——「<b>好像</b>是憑行為」</p><p>9:32的原文有一個小字，中文不容易看出來：</p><p>οὐκ ἐκ πίστεως ἀλλ' <b>ὡς</b> ἐξ ἔργων</p><p>「不是出於信，而是<b>好像</b>出於行為。」</p><p>那個 ὡς（好像、彷彿）是什麼意思？</p><p>有學者認為：保羅在暗示，他們<b>以為</b>自己可以憑行為求——<br>但事實上，義從來就不是這樣得的。</p><p>（這是一個細微的觀察，講台上可以簡單帶過。）</p><p>★ 亮光三：9:33是兩段以賽亞書的合併引用</p><pre>賽28:16  「看哪，我在錫安放一塊石頭作為根基……\n          信靠的人必不著急。」（正面：房角石）\n賽8:14   「他必作為聖所，卻向以色列兩家作絆腳的石頭、\n          跌人的磐石。」（負面：絆腳石）\n   ↓\n羅9:33   保羅把兩段合併：\n          「我在錫安放一塊絆腳的石頭、跌人的磐石；\n           信靠他的人必不至於羞愧。」</pre><p>弟兄姊妹，這個合併極其精彩：</p><p>同一塊石頭。</p><p>對信靠的人，是<b>房角石</b>。<br>對不信的人，是<b>絆腳石</b>。</p><p>（彼前2:6–8做了同樣的合併引用）</p><p>★ 亮光四：那塊石頭是誰？</p><p>9:33沒有說。但下一章說了：</p><p>10:4「<b>律法的總結就是基督</b>，使凡信他的都得著義。」<br>10:11「經上說：『凡信他的人必不至於羞愧。』」</p><p>弟兄姊妹，第九章最後那塊石頭——</p><p>是一個<b>位格</b>。</p>","exp":"<p>弟兄姊妹，9:30–33是全章最重要、卻最常被跳過的一段。</p><p>保羅講了三十節的神主權，最後說了什麼？</p><p>「他們<b>不憑著信心求，只憑著行為求</b>。」</p><p>而且他描寫的畫面極其令人心痛：</p><pre>外邦人：本來不追求義  →  卻得了義\n以色列：竭力追求義    →  反而得不著</pre><p>為什麼？</p><p>因為他們追的方向對，方法錯了。</p><p>他們一路狂奔，然後——<b>撞上了一塊石頭</b>。</p><p>而那塊石頭，正是神放在錫安的那一位。</p>"}],"10":[{"a":1,"z":1,"star":false,"grk":"<p>Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ δέησις πρὸς τὸν θεὸν ὑπὲρ αὐτῶν εἰς σωτηρίαν.</p>","lit":"<p>「弟兄們，我心裡的<b>渴望</b>，和我為他們<b>向神所作的懇求</b>，是要他們得救。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>所願的</td><td>εὐδοκία</td><td>eudokia</td><td>G2107</td><td>εὖ（好）+ δοκέω（以為）</td><td><b>善意的渴望、心之所好</b></td><td>見下</td></tr><tr><td>所求的</td><td>δέησις</td><td>deēsis</td><td>G1162</td><td>δέομαι（懇求）</td><td><b>懇切的祈求</b>（不是一般的禱告）</td><td>帶著急迫</td></tr><tr><td>得救</td><td>σωτηρία</td><td>sōtēria</td><td>G4991</td><td>—</td><td>拯救</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：εὐδοκία ——這個字通常用在神身上</p><p>εὐδοκία 在新約中，多半用來描述<b>神的美意</b>：</p><p>- <b>太11:26</b>「父啊，是的，因為你的<b>美意</b>本是如此」<br>- <b>弗1:5、9</b>「這是照他自己所預定的<b>美意</b>」<br>- <b>腓2:13</b>「你們立志行事，都是神在你們心裡運行，為要成就他的<b>美意</b>」</p><p>弟兄姊妹，保羅用這個字形容自己的心：</p><p>「我心裡的<b>美意</b>（εὐδοκία），是要他們得救。」</p><p>這暗示：他心裡的那個渴望，本身就是神放進去的。</p><p>★ 亮光二：這一節緊接在第九章之後</p><p>弟兄姊妹，這一節的位置太重要了。</p><p>第九章剛剛講完：</p><p>「不在乎那定意的，也不在乎那奔跑的，只在乎發憐憫的神。」（9:16）</p><p>如果有人讀完第九章，得出「所以禱告也沒用」的結論——</p><p>保羅在下一節就把那條路堵死了：</p><p>「我<b>向神所求的</b>，是要以色列人得救。」</p><p>弟兄姊妹，保羅顯然不覺得「神的主權」與「為人禱告」互相矛盾。</p>","exp":"<p>弟兄姊妹，第九章與第十章之間，只隔了一節。</p><p>而那一節，是<b>一個禱告</b>。</p><p><b>經文本身明確表達的：</b> 保羅心裡的渴望與向神的祈求，是要以色列人得救。</p><p><b>可以合理推論的：</b> 這一節是第九章最重要的<b>使用說明</b>。</p><p>保羅剛講完「不在乎那定意的，也不在乎那奔跑的」（9:16）——<br>然後他做的第一件事，是<b>跪下來為他們禱告</b>。</p><p>而原文的「所願的」是 εὐδοκία——<b>心裡最深的喜悅與渴望</b>。</p><p>這不是責任感，是<b>渴望</b>。</p><p><b>⚠ 講台誠信提醒：</b> 神的主權<b>從來不是</b>停止禱告與傳福音的理由。<br>第十章接下來要說：「沒有傳道的，怎能聽見呢？」（10:14）</p>"},{"a":2,"z":3,"star":true,"grk":"<p>2 μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν ἀλλ' οὐ κατ' ἐπίγνωσιν·<br>3 ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην καὶ τὴν ἰδίαν [δικαιοσύνην] ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν.</p>","lit":"<p>2「因為我為他們作見證：他們有為神的<b>熱心</b>，只是不照著<b>完全的認識</b>。」<br>3「因為他們<b>不知道</b>神的義，卻<b>竭力想要建立</b>自己的義，就<b>沒有降服於</b>神的義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>熱心</td><td>ζῆλος</td><td>zēlos</td><td>G2205</td><td>ζέω（沸騰）</td><td><b>火熱、熱切</b>（英文 zeal）</td><td>見下</td></tr><tr><td>真知識</td><td>ἐπίγνωσις</td><td>epignōsis</td><td>G1922</td><td>ἐπί（加強）+ γνῶσις</td><td><b>完全的、切身的認識</b></td><td><b>3:20同字</b></td></tr><tr><td>立</td><td>στῆσαι</td><td>stēsai</td><td>G2476</td><td>ἵστημι（站立）</td><td><b>使之站立、建立起來</b></td><td>見下</td></tr><tr><td>不服</td><td>οὐχ ὑπετάγησαν</td><td>ouch hypetagēsan</td><td>G5293</td><td>ὑπό + τάσσω（排列）</td><td><b>沒有降服、沒有排到底下</b></td><td><b>被動式</b>（見下）</td></tr></table>","gram":"<p>★ 亮光一：ζῆλος ——「沸騰」</p><p>這個字的字根是 ζέω——<b>沸騰、滾燙</b>。</p><p>（徒18:25「他心裡<b>火熱</b>」；羅12:11「要<b>心裡火熱</b>」——同字根）</p><p>弟兄姊妹，保羅在說：他們<b>是真的火熱</b>。</p><p>這不是諷刺。他說「我可以<b>作見證</b>（μαρτυρῶ）」——<br>我為他們作證：他們的熱心是真的。</p><p>而保羅有資格說這句話，因為他自己曾經最火熱：</p><p>加1:14「為我祖宗的遺傳<b>更加熱心</b>（ζηλωτής）。」<br>腓3:6「就<b>熱心</b>（ζῆλος）說，我是逼迫教會的。」</p><p>★ 亮光二：ἐπίγνωσις ——「完全的認識」</p><p>注意保羅<b>沒有</b>說他們「沒有知識」。</p><p>他說：不是按著 <b>ἐπίγνωσις</b>——<b>加強版的、完全的、切身的認識</b>。</p><p>而這個字我們在3:20見過：</p><p>3:20「因為律法本是叫人<b>知罪</b>（ἐπίγνωσις ἁμαρτίας）。」</p><p>弟兄姊妹，這裡有一個極深的諷刺：</p><p>律法本是要給人 ἐπίγνωσις（切身地知道自己有罪）；<br>而他們拿著律法，卻沒有得著那個 ἐπίγνωσις。</p><p>★ 亮光三：στῆσαι ——「立起來」</p><p>「想要<b>立</b>自己的義」——ἵστημι，<b>使之站立</b>。</p><p>畫面是：</p><p>一個人蹲在地上，用力想把一樣東西<b>扶起來、立穩</b>。</p><p>弟兄姊妹，這個動詞是<b>費力的</b>。</p><p>建立自己的義，是一件<b>很累</b>的工程。</p><p>★ 亮光四：ὑποτάσσω ——「不服」是被動式</p><p>「就<b>不服</b>神的義了」——οὐχ ὑπετάγησαν，是<b>被動（或關身）語態</b>。</p><p>ὑποτάσσω 是一個<b>軍事用語</b>：ὑπό（在下）+ τάσσω（列隊、編排）——</p><p>意思是：<b>排到某人的旗下、進入某人的隊列</b>。</p><p>弟兄姊妹，所以10:3的意思是：</p><p>他們<b>沒有讓自己排到神的義底下</b>。</p><p>他們自己另外開了一支隊伍。</p><p>★ 亮光五：三個動作的連鎖</p><pre>ἀγνοοῦντες（不知道神的義）\n   ↓ 因為不知道，所以\nζητοῦντες στῆσαι（竭力要立自己的義）\n   ↓ 因為忙著立自己的，所以\nοὐχ ὑπετάγησαν（沒有降服於神的義）</pre><p>弟兄姊妹，這是一條非常誠實的心理鏈：</p><p>人不是先決定「我要拒絕神的義」。</p><p>人是先<b>不知道</b>，然後<b>忙著建立自己的</b>，<br>然後就<b>沒有空</b>降服了。</p>","exp":"<p>弟兄姊妹，10:2–3是全本聖經對「宗教人」最精準的診斷。</p><p>它說出了一件我們很不願意承認的事：</p><p>熱心，是可以走錯方向的。</p><p>而且<b>越熱心，走得越遠</b>。</p><p>保羅自己就是最好的例子：</p><p>他拿著大祭司的文書往大馬色去的那一天，是他一生中最火熱的一天。</p><p>而他正在逼迫神的兒子。</p>"},{"a":4,"z":4,"star":true,"grk":"<p>τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.</p>","lit":"<p>「因為基督是律法的 <b>τέλος</b>，使<b>凡相信的人</b>都得著義。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>基本字義</th><th>本節語境</th></tr><tr><td>總結</td><td>τέλος</td><td>telos</td><td>G5056</td><td><b>終點／目標／完成</b></td><td><b>本節的核心爭議</b>（見下）</td></tr></table>","gram":"<p>★ τέλος 的三種主要理解</p><p>τέλος 這個字，在希臘文中同時可以有幾個意思：</p><table><tr><th>理解</th><th>中譯</th><th>主張</th></tr><tr><td><b>A. 終結（termination）</b></td><td>「律法的<b>終止</b>」</td><td>基督來了，律法作為得義之路就結束了</td></tr><tr><td><b>B. 目標（goal）</b></td><td>「律法的<b>目的地</b>」</td><td>律法一直指向基督；基督是律法的終點站</td></tr><tr><td><b>C. 成全（fulfillment）</b></td><td>「律法的<b>完成</b>」</td><td>基督成全了律法所要求的</td></tr></table><p>τέλος 在新約其他地方的用法：</p><p>- <b>太24:6</b>「末期（τέλος）還沒有到」——<b>終結</b><br>- <b>提前1:5</b>「命令的<b>總歸</b>（τέλος）就是愛」——<b>目標</b><br>- <b>雅5:11</b>「你們看見主給他的<b>結局</b>（τέλος）」——<b>結果</b><br>- <b>羅6:21–22</b>「那些事的<b>結局</b>（τέλος）就是死……那<b>結局</b>就是永生」——<b>終點</b></p><p>★ 哪一種最符合本節的上下文？</p><p>我認為 <b>B ＋ C（目標與成全）</b> 為主，同時<b>不排除</b> A 的某個面向。</p><p>理由：</p><p>1. <b>上下文</b>：10:5–8保羅立刻引用摩西（利18:5與申30:12–14）——他不是在說「摩西已經過時」，而是在說「摩西所指的，就是這個」。<br>2. <b>3:31</b>：「我們因信廢了律法嗎？斷乎不是！更是<b>堅固</b>律法。」——保羅明確拒絕「律法被廢掉」的說法。<br>3. <b>8:4</b>：「使<b>律法的義</b>成就在我們……身上。」——律法的要求被成全了，不是被取消了。<br>4. <b>10:4的下半句</b>：「使凡信他的都得著義」——重點是<b>義的來源</b>，不是「律法作廢了」。</p><p>但要平衡的是：</p><p>在「靠行律法得義」這條路上，基督確實是<b>終點</b>——<br>那條路到祂為止（3:20；10:3）。</p><p>講台誠信提醒：<br>可以說「τέλος 這個字同時有『終點』和『目標』的意思」——這是硬事實。<br>不要說「所有學者都同意是目標，不是終結」。</p><p>★ 一個幫助理解的畫面</p><p>一場賽跑的「終點線」（τέλος），同時是兩件事：</p><p>它是跑道的<b>盡頭</b>（終結）。<br>它也是整場賽跑的<b>目的</b>（目標）。</p><p>基督之於律法，正是如此。</p>","exp":"<p>弟兄姊妹，10:4回答了9:33那塊石頭是誰。</p><pre>9:33  「我在錫安放一塊絆腳的石頭……信靠他的人必不至於羞愧。」\n   ↓\n10:4  「律法的總結就是【基督】，使凡信他的都得著義。」</pre><p>那塊石頭有名字。</p><p>【第二段｜10:5–13　那道離你不遠】</p>"},{"a":5,"z":5,"star":false,"grk":"<p>Μωϋσῆς γὰρ γράφει τὴν δικαιοσύνην τὴν ἐκ [τοῦ] νόμου ὅτι ὁ ποιήσας αὐτὰ ἄνθρωπος ζήσεται ἐν αὐτοῖς.</p>","lit":"<p>「因為摩西寫到那<b>出於律法的義</b>：『<b>那行這些事的人，就必因這些事活著</b>。』」</p>","key":"<p>這是引用<b>利未記18:5</b>：</p><p>「所以，你們要守我的律例典章；人若遵行，就必因此活著。」</p><p>弟兄姊妹，保羅在這裡把兩條路擺出來：</p><p>一條是「<b>行</b>」（利18:5）。<br>一條是「<b>信</b>」（申30:12–14，接下來要引的）。</p><p>（關於保羅怎麼理解利18:5，學者有不同看法：有人認為保羅是在說「這條路本來就行不通」，有人認為保羅是在描述律法之約的原則。本文不在此展開。）</p>","gram":"","exp":"<p>弟兄姊妹，10:5是保羅擺出的<b>第一條路</b>。</p><p>而他刻意用了兩段舊約，擺成對照：</p><table><tr><th></th><th>出處</th><th>關鍵動詞</th></tr><tr><td><b>第一條路（10:5）</b></td><td>利18:5</td><td><b>「行」</b>（ποιήσας）</td></tr><tr><td><b>第二條路（10:6–8）</b></td><td>申30:12–14</td><td><b>「說」與「信」</b></td></tr></table><p><b>經文本身明確表達的：</b> 出於律法的義，其原則是「<b>行了才能活</b>」。</p><p><b>可以合理推論的：</b> 保羅不是在說律法是壞的（7:12「律法是聖潔的」）。<br>他是在說：<b>這條路的條件是「全部做到」</b>——而第三章已經證明沒有人做得到。</p><p><b>⚠ 講台誠信提醒：</b> 保羅究竟如何理解利18:5，敬虔的學者有不同看法。<br>有人認為保羅是在說「這條路本來就行不通」；有人認為他是在描述律法之約的原則。<br>講台上宜說明兩種讀法都有人持守，重點放在下一段（10:6–8）那條「離你不遠」的路。</p>"},{"a":6,"z":8,"star":true,"grk":"<p>8 ἀλλὰ τί λέγει; ἐγγύς σου τὸ ῥῆμά ἐστιν ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ' ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.</p>","lit":"<p>8「但它說什麼呢？『<b>那話離你很近</b>，在你的口中，在你的心裡』——這就是我們所傳的<b>信的話</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>離你不遠</td><td>ἐγγύς σου</td><td>engys sou</td><td>G1451</td><td><b>近你、在你旁邊</b></td></tr><tr><td>道</td><td>ῥῆμα</td><td>rhēma</td><td>G4487</td><td><b>被說出來的話</b>（不是 λόγος）</td></tr><tr><td>陰間</td><td>ἄβυσσος</td><td>abyssos</td><td>G12</td><td><b>無底的深淵</b></td></tr></table>","gram":"<p>★ 亮光一：保羅怎麼使用申命記30章</p><p>申命記30:11–14的原文講的是<b>誡命</b>：</p><p>「不是在天上，使你說：『誰替我們<b>上天</b>取下來？』……<br>也不是在海外，使你說：『誰替我們<b>過海</b>取了來？』……<br>這話卻<b>離你甚近</b>，就在你<b>口中</b>，在你<b>心裡</b>。」</p><p>而保羅做了三件事：</p><table><tr><th>保羅的處理</th><th>內容</th></tr><tr><td><b>把「過海」改成「下到陰間」</b></td><td>因為他要指向<b>基督的復活</b></td></tr><tr><td><b>加上兩個註解</b></td><td>「就是要領下基督來」「就是要領基督從死裡上來」</td></tr><tr><td><b>把「這話」解釋為福音</b></td><td>「就是我們所傳信主的道」</td></tr></table><p>保羅這樣做合法嗎？（見第二十部分的完整討論）</p><p>這裡先給三個關鍵的觀察：</p><p>① 申命記30章的上下文本身就是新約的應許：</p><p>申30:6「耶和華你神必將你心裡……的污穢<b>除掉</b>（行割禮），好叫你盡心盡性愛耶和華你的神。」</p><p>那一段本來就在講：<b>神要親自動工，使人能夠遵行</b>。</p><p>② 申命記30章的重點是「不必上天下海」：</p><p>原文的重點不是「律法的內容」，而是「<b>神已經把話送到你面前了</b>」。</p><p>保羅抓住的正是這個重點。</p><p>③ 保羅在10:6用了「你不要心裡說」——這句話出自申9:4：</p><p>申9:4「你不可心裡說：『耶和華將我領進來得這地，是因我的義。』」</p><p>弟兄姊妹，這個細節很精彩：</p><p>保羅把申9:4（不要以為是因你的義）與申30:12–14（那話離你甚近）合在一起用——<br>正好對準10:3「想要立自己的義」。</p><p>★ 亮光二：升天與下陰間的畫面</p><pre>「誰要升到天上去呢？」 —— 我要爬上去把祂拉下來？\n「誰要下到陰間去呢？」 —— 我要挖下去把祂拉上來？</pre><p>弟兄姊妹，保羅在說：這兩件事，<b>都已經做完了</b>。</p><p>道成肉身——<b>祂已經下來了</b>。<br>從死裡復活——<b>祂已經上來了</b>。</p><p>你不需要去做任何一件。</p><p>★ 亮光三：ῥῆμα 而不是 λόγος</p><p>保羅用的是 <b>ῥῆμα</b>——「<b>被說出來的話</b>」。</p><p>這與10:14「未曾<b>聽見</b>他，怎能信他呢」、10:17「信道是從<b>聽道</b>來的」完全連貫。</p><p>福音是<b>要被說出來、被聽見</b>的話。</p>","exp":"<p>弟兄姊妹，10:6–8是全章最溫暖的一段。</p><p>保羅在說：</p><p>人的宗教本能，總是覺得要<b>做什麼大事</b>才能親近神。</p><p>上天。下陰間。爬階梯。走苦路。</p><p>而福音說：</p><p>那話——<b>已經在你嘴邊了</b>。</p>"},{"a":9,"z":10,"star":true,"grk":"<p>9 ὅτι ἐὰν ὁμολογήσῃς ἐν τῷ στόματί σου κύριον Ἰησοῦν καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·<br>10 καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν.</p>","lit":"<p>9「因為你若<b>用你的口承認</b>『<b>耶穌是主</b>』，並且<b>在你心裡相信</b>神叫祂從死人中復活，<b>你就必得救</b>。」<br>10「因為人<b>心裡相信</b>，以致於<b>得義</b>；<b>口裡承認</b>，以致於<b>得救</b>。」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>字根</th><th>基本字義</th><th>本節語境</th></tr><tr><td>承認</td><td>ὁμολογέω</td><td>homologeō</td><td>G3670</td><td>ὁμός（同）+ λόγος（話）</td><td><b>說同樣的話、公開認同</b></td><td>見下</td></tr><tr><td>主</td><td>κύριος</td><td>kyrios</td><td>G2962</td><td>—</td><td>主人、主宰</td><td><b>見下——極重要</b></td></tr><tr><td>復活</td><td>ἤγειρεν</td><td>ēgeiren</td><td>G1453</td><td>ἐγείρω</td><td><b>叫起來</b>（神是主詞）</td><td>—</td></tr></table>","gram":"<p>★ 亮光一：ὁμολογέω ——「說同樣的話」</p><p>這個字由 ὁμός（相同）+ λέγω（說）組成，字面是：</p><p>「<b>說同樣的話</b>」——與某人的說法一致、公開站在同一邊。</p><p>弟兄姊妹，所以「承認耶穌為主」不是一個宗教口號，<br>是<b>公開表態站在祂那一邊</b>。</p><p>★★ 亮光二：κύριος 的重量（本節最深的一點）</p><p>「口裡認<b>耶穌為主</b>（κύριον Ἰησοῦν）」。</p><p>這句話有兩層重量：</p><p>① 政治的重量</p><p>當時帝國的效忠口號是 <b>Κύριος Καῖσαρ</b>（凱撒是主）。</p><p>在羅馬城說「耶穌是主」，等於說：<b>還有另一位主，而祂比凱撒大</b>。</p><p>② 神學的重量（更深）</p><p>請看10:13保羅引的是什麼：</p><p>「凡求告<b>主名</b>的，就必得救。」（引珥2:32）</p><p>而約珥書2:32的「主」，希伯來原文是——</p><p>יְהוָה（YHWH）——<b>耶和華</b>。</p><p>弟兄姊妹，這是全章最震撼的一件事：</p><p>約珥書說：凡求告<b>耶和華</b>名的，就必得救。</p><p>保羅說：凡求告<b>主</b>名的，就必得救——而上下文的「主」是<b>耶穌</b>（10:9）。</p><p>保羅毫不猶豫地把舊約中專屬耶和華的經文，用在耶穌身上。</p><p>★ 亮光三：10:9與10:10的順序不同</p><p>弟兄姊妹，注意這兩節的順序：</p><pre>10:9   口裡承認 → 心裡相信\n10:10  心裡相信 → 口裡承認</pre><p>為什麼？</p><p>兩種主要解釋：</p><table><tr><th>解釋</th><th>說明</th></tr><tr><td><b>交叉結構（chiasm）</b></td><td>10:9的順序是照著10:8「在你<b>口裡</b>，在你<b>心裡</b>」；10:10則按<b>邏輯</b>順序（先信後認）</td></tr><tr><td><b>強調兩者不可分</b></td><td>保羅刻意打亂順序，表示這不是「兩個步驟」</td></tr></table><p>我認為第一種解釋最貼合：10:9是<b>照著所引經文的順序</b>（申30:14「在你口中，在你心裡」），<br>10:10則是<b>照著實際的邏輯</b>。</p><p>★ 亮光四：兩個被動式（10:10）</p><p>「人心裡<b>相信</b>（πιστεύεται）……口裡<b>承認</b>（ὁμολογεῖται）」——</p><p>兩個動詞在原文都是<b>被動或非人稱形式</b>。</p><p>保羅沒有說「你要信、你要認」（那會像兩個條件），<br>他用的是一種<b>描述性</b>的表達：「用心，是信到義裡去；用口，是認到得救裡去。」</p>","exp":"<p>弟兄姊妹，10:9–10常被誤讀成「得救的兩個步驟」：</p><p>「第一步：口裡承認。第二步：心裡相信。做完就得救。」</p><p>這種讀法有兩個問題：</p><p>① 它把福音變成一個公式</p><p><b>② 它與保羅全書的教導不一致</b>（3:28「人稱義是因著信」——只提信）</p><p>正確的理解是：</p><p>10:9–10講的是<b>一件事的裡外兩面</b>。</p><p>心裡相信 —— 是那件事的<b>根</b>。<br>口裡承認 —— 是那件事的<b>果</b>。</p><p>一個真的在心裡相信的人，不可能永遠不承認；<br>一個只在口裡承認、心裡沒有的人，那不是信。</p><p>（主耶穌說：「凡在人面前認我的，我在我天上的父面前也必認他。」太10:32）</p>"},{"a":11,"z":13,"star":true,"grk":"<p>12 οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·</p>","lit":"<p>11「因為經上說：『<b>凡信靠祂的，必不至於羞愧</b>。』」<br>12「因為<b>猶太人和希臘人並沒有分別</b>——<b>因為眾人同有一位主</b>，祂<b>對一切求告祂的人是豐富的</b>。」<br>13「因為『<b>凡求告主名的，就必得救</b>』。」</p><p>【第三段｜10:14–17　宣教的鏈條】</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>分別</td><td>διαστολή</td><td>diastolē</td><td>G1293</td><td><b>區分、劃界線</b>（<b>3:22同字！</b>）</td></tr><tr><td>厚待</td><td>πλουτῶν</td><td>ploutōn</td><td>G4147</td><td>πλοῦτος（財富）：<b>對……富足、慷慨</b></td></tr><tr><td>求告</td><td>ἐπικαλουμένους</td><td>epikaloumenous</td><td>G1941</td><td><b>呼求某人的名</b></td></tr></table>","gram":"<p>★ 亮光一：保羅加了一個字</p><p>10:11引以賽亞書28:16。</p><p>而七十士譯本的賽28:16是：</p><p>「信靠的人必不著急。」</p><p>保羅引用時，在前面加了一個字：</p><p>「<b>凡</b>（πᾶς）信他的人必不至於羞愧。」</p><p>弟兄姊妹，保羅在引用聖經的時候，加了一個字。</p><p>而那個字是——「<b>凡</b>」。</p><p>★ 亮光二：διαστολή ——3:22那個字</p><pre>3:22   「並沒有分別（διαστολή）」—— 因為【眾人都犯了罪】（3:23）\n10:12  「並沒有分別（διαστολή）」—— 因為【眾人同有一位主】</pre><p>弟兄姊妹，這是全卷書最美的一組對稱：</p><p>在<b>罪</b>面前，沒有分別。<br>在<b>恩典</b>面前，也沒有分別。</p><p>★★ 亮光三：10:13的舊約來源（全章最深的基督論）</p><p>「凡求告<b>主名</b>的，就必得救」——引自<b>約珥書2:32</b>。</p><p>而約珥書的「主」，希伯來原文是 <b>יְהוָה（YHWH，耶和華）</b>。</p><p>保羅在什麼上下文引用它？</p><p>10:9「你若口裡認<b>耶穌</b>為<b>主</b>。」<br>10:12「眾人同有<b>一位主</b>。」<br>10:13「凡求告<b>主名</b>的，就必得救。」</p><p>弟兄姊妹，保羅把約珥書中專屬<b>耶和華</b>的應許，<br>直接用在<b>耶穌</b>身上。</p><p>這是新約中最高的基督論宣告之一——<br>而且保羅寫得如此自然，好像那是理所當然的事。</p><p>（彼得在五旬節也引用同一段約珥書：徒2:21）</p><p>★ 亮光四：三個「凡」</p><pre>10:11  凡（πᾶς）信他的\n10:12  一切（πάντας）求告他的\n10:13  凡（πᾶς）求告主名的</pre><p>保羅在三節之內，連敲三次「凡」。</p>","exp":"<p>弟兄姊妹，10:13是全本聖經最簡單、也最寬的一句應許之一：</p><p>「<b>凡</b>求告主名的，就必得救。」</p><p>注意它有多寬：</p><p>- 沒有說「凡好人」<br>- 沒有說「凡懂神學的」<br>- 沒有說「凡有宗教背景的」<br>- <b>只說：</b>凡求告的<b>。</b></p><p>而「求告」（ἐπικαλέω）的意思很簡單：</p><p>喊祂的名字。</p>"},{"a":14,"z":15,"star":true,"grk":"<p>14 Πῶς οὖν ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ἀκούσωσιν χωρὶς κηρύσσοντος;<br>15 πῶς δὲ κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; καθὼς γέγραπται· ὡς ὡραῖοι οἱ πόδες τῶν εὐαγγελιζομένων [τὰ] ἀγαθά.</p>","lit":"<p>14「那麼，他們<b>未曾相信</b>的，<b>怎能</b>求告呢？<b>未曾聽見</b>的，<b>怎能</b>相信呢？<b>沒有傳講的</b>，<b>怎能</b>聽見呢？」<br>15「<b>若沒有被差遣</b>，<b>怎能</b>傳講呢？正如經上所記：『傳福音之人的<b>腳蹤何等佳美</b>！』」</p>","key":"<table><tr><th>中文</th><th>原文</th><th>音譯</th><th>Strong's</th><th>意義</th></tr><tr><td>怎能</td><td>πῶς</td><td>pōs</td><td>G4459</td><td><b>怎麼可能</b>（四次！）</td></tr><tr><td>傳道</td><td>κηρύσσω</td><td>kēryssō</td><td>G2784</td><td><b>像傳令官一樣宣告</b></td></tr><tr><td>奉差遣</td><td>ἀποσταλῶσιν</td><td>apostalōsin</td><td>G649</td><td>ἀποστέλλω（<b>使徒 ἀπόστολος 的字根</b>）：<b>被差派出去</b></td></tr><tr><td>佳美</td><td>ὡραῖος</td><td>hōraios</td><td>G5611</td><td>ὥρα（時候）：<b>當令的、及時而美的</b></td></tr></table>","gram":"<p>★ 亮光一：四個「怎能」的倒推鏈</p><pre>求告 ← 相信 ← 聽見 ← 傳講 ← 差遣\nπῶς    πῶς     πῶς     πῶς</pre><p>保羅從結果一路倒推回原因，最後停在——</p><p>「若沒有<b>奉差遣</b>，怎能傳道呢？」</p><p>弟兄姊妹，這條鏈子的最底層是：<b>有人要被差出去</b>。</p><p>★ 亮光二：ἀποστέλλω ——「使徒」的動詞</p><p>「奉差遣」的動詞 ἀποστέλλω，正是「使徒」（ἀπόστολος）的字根。</p><p>意思是：<b>被差派出去、帶著任務的人</b>。</p><p>而這個動詞是<b>被動式</b>：</p><p>不是「你自己決定去」，是「<b>你被差出去</b>」。</p><p>★ 亮光三：ὡραῖος ——「當令的美」</p><p>「腳蹤何等<b>佳美</b>」——ὡραῖος 的字根是 ὥρα（時候、季節）。</p><p>它原本的意思是「<b>當季的、成熟的、正是時候的</b>」。</p><p>弟兄姊妹，這個字的畫面是：</p><p>一顆水果在<b>最對的季節</b>成熟了。</p><p>而以賽亞書52:7的上下文是什麼？</p><p>是被擄的以色列，等待歸回的好消息。</p><p>賽52:7「那報佳音，傳平安，報好信，傳救恩的，對錫安說：<b>你的神作王了</b>！<br>這人的腳登山何等佳美！」</p><p>弟兄姊妹，那個畫面是：</p><p>一個被圍困的城，城牆上的人望著遠方的山。</p><p>然後——山那頭出現了一個奔跑的人。</p><p>他還沒說話，他們就已經看見<b>他的腳</b>了。</p><p>★ 亮光四：腳為什麼美？</p><p>弟兄姊妹，腳是人身上<b>最不美</b>的部位之一。</p><p>走遠路的腳，是髒的、是磨破的、是滿是塵土的。</p><p>但在城牆上等待的人眼中——</p><p>那雙腳，是全世界最美的。</p><p>因為那雙腳，帶來了消息。</p>","exp":"<p>弟兄姊
