<b>“I am the way”</b> (John 14:6).</p>","exp":"<p>Notice Paul’s order: first the mouth, then the feet. <b>First words, then actions.</b></p><p>That is the natural development of sin — first we belittle people in speech, then we injure them in deed.</p><p>And verse 17 is the most poignant line: <b>“the way of peace they have not known.”</b></p><p>Not “they refuse to walk it,” but <b>“they do not know it.”</b> The human race searches desperately for peace — treaties, therapy, mindfulness — and Paul says: <b>that road is one people simply do not know.</b></p>"},{"a":18,"z":18,"star":true,"grk":"<p>οὐκ ἔστιν φόβος θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν.</p>","lit":"<p>“There is no fear of God <b>directly in front of</b> their eyes.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>fear</td><td>φόβος</td><td>phobos</td><td>G5401</td><td>reverent fear (English “phobia” comes from it)</td></tr><tr><td>before their eyes</td><td>ἀπέναντι τῶν ὀφθαλμῶν</td><td>apenanti tōn ophthalmōn</td><td>G561</td><td><b>directly opposite, straight in front of</b></td></tr></table>","gram":"<p>ἀπέναντι carries a strong visual force: <b>right in your line of sight</b>.</p><p>Paul is quoting Psalm 36:1. The sentence does not mean “they do not believe there is a God.” It means <b>God is not in their field of vision</b>.</p><p>The atheist’s problem is not that he has overthrown God; it is that God is not straight in front of his eyes.</p><p>And the greatest danger for a Christian is the same one — not unbelief, but <b>God not being in view</b>.</p>","exp":"<p>This verse is the root of the whole of 3:10–18, and its closing line.</p><p>Paul moves from the inner person (no one understands) → to the mouth (an open grave) → to the feet (swift to shed blood) → and finally back to <b>the eyes</b>.</p><p><b>All the corruption starts in one place: God is not in view.</b></p><p>Proverbs says, “the fear of the LORD is the beginning of wisdom” (Proverbs 9:10).<br>Paul says: <b>not fearing the LORD is the beginning of all of this.</b></p><p>This matches 1:21 (“they did not glorify him as God”) and 2:29 (“whose praise is not from men, but from God”) exactly. The diagnosis of chapters 1 to 3 is a single one: <b>the focus is not on God.</b></p>"},{"a":19,"z":19,"star":false,"grk":"<p>Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·</p>","lit":"<p>“Now we know that whatever the law says, it speaks to those who are under the law, <b>so that every mouth may be stopped</b>, and the whole world may be brought <b>under judgement before God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Meaning</th></tr><tr><td>be stopped</td><td>φραγῇ</td><td>phragē</td><td>G5420</td><td>φράσσω (to fence, to block)</td><td><b>aorist passive subjunctive: be closed up</b></td></tr><tr><td>mouth</td><td>στόμα</td><td>stoma</td><td>G4750</td><td>—</td><td>the mouth (used just now in 3:14, “full of cursing”)</td></tr><tr><td>under judgement</td><td>ὑπόδικος</td><td>hypodikos</td><td>G5267</td><td>ὑπό + δίκη (judgement)</td><td><b>only here in the NT</b>: with no answer left to give in court</td></tr><tr><td>the whole world</td><td>πᾶς ὁ κόσμος</td><td>pas ho kosmos</td><td>G2889</td><td>—</td><td>the entire world</td></tr></table>","gram":"<p><b>★ First light: the picture in phrassō</b></p><p>In classical Greek the verb is used of:<br>· fencing off a road<br>· blocking a watercourse<br>· <b>a defendant with nothing left to say in court</b><br>(Hebrews 11:33 uses the same word: “stopped the mouths of lions.”)</p><p><b>★ Second light: “every mouth” echoes 3:14</b></p><pre>3:14  whose MOUTH (στόμα) is full of cursing and bitterness\n3:19  so that every MOUTH (πᾶν στόμα) may be stopped</pre><p>The same word. <b>The mouth that poured out cursing and bitterness is finally shut in front of the law.</b></p><p><b>★ Third light: hypodikos — only here in the New Testament</b></p><p>A technical legal term: <b>the defendant has no defence left; only the sentence remains</b>.</p><p><b>★ Fourth light: hina (so that) — the purpose of the law</b></p><p>The purpose of the law is <b>not</b> that people should attain it, but that people should <b>fall silent</b>.</p><p><b>What does this grammar do to the verse?</b> The law was never a ladder. It is a mirror.<br>A ladder lets you climb. <b>A mirror shuts you up.</b></p>","exp":"<p>This is the final verdict of the whole prosecution of 1:18–3:20. And the content of that verdict is not “you are condemned,” but — <b>“you have nothing left to say.”</b></p><p>What Paul wants is not that we admit fault. It is that we are <b>left without an answer</b>.</p><p>Because as long as we still have one “but…”, we are not yet ready to receive grace.</p><p>· “But I am not the worst.”<br>· “But I had my reasons.”<br>· “But he was far worse than me.”</p><p>Romans 1 to 3 is God taking those “buts” apart one by one, until we are quiet.</p><p><b>The moment a person falls silent before God is the moment God can speak.</b></p>"},{"a":20,"z":20,"star":false,"grk":"<p>διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.</p>","lit":"<p>“Therefore by the works of the law <b>no flesh</b> will be <b>declared righteous</b> in his sight; for through the law comes <b>the full knowledge of sin</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>no flesh</td><td>πᾶσα σάρξ</td><td>pasa sarx</td><td>G4561</td><td>a Hebraism (kol basar): <b>every creature of flesh</b> (stressing human frailty)</td></tr><tr><td>will be justified</td><td>δικαιωθήσεται</td><td>dikaiōthēsetai</td><td>G1344</td><td>future passive: <b>will be declared righteous</b></td></tr><tr><td>knowledge of sin</td><td>ἐπίγνωσις ἁμαρτίας</td><td>epignōsis</td><td>G1922</td><td>ἐπί (intensive) + γνῶσις: <b>full, thorough knowledge</b></td></tr></table>","gram":"<p><b>★ First light: the Old Testament background of pasa sarx</b></p><p>This is a Hebrew idiom (kol basar), and Paul is quoting <b>Psalm 143:2</b>:</p><p>“Do not enter into judgement with your servant, for <b>in your sight no one living is righteous</b>.”</p><p>To the psalm’s words Paul adds four: <b>“by the works of the law” (ἐξ ἔργων νόμου)</b>.</p><p><b>★ Second light: epignōsis is not ordinary knowing</b></p><p>γνῶσις is knowledge; <b>ἐπίγνωσις</b> is the intensified form: thorough, personal, complete recognition.</p><p>What the law gives you is not the information “ah, so that is a sin.” It is the shock of <b>“so I am a sinner.”</b></p><p><b>★ Third light: the connective dioti (therefore)</b></p><p>3:19 (every mouth stopped) → 3:20 (therefore no one can be justified by works of law).</p><p>The logic: since every mouth has been stopped, no one is in a position to present his own merit.</p>","exp":"<p>This is the darkest verse in the letter.</p><p>Paul has walked two and a half chapters, closing one door after another:</p><pre>the Gentile’s door   — closed (1:32)\nthe moralist’s door  — closed (2:1)\nthe Jew’s door       — closed (2:24)\nthe law’s door       — closed (3:20)</pre><p><b>There is no way out.</b></p><p>But as he closes that last door, Paul says something of the highest importance: <b>“for through the law comes the knowledge of sin.”</b></p><p>The law has not failed. <b>The law has done its job.</b></p><p>An X-ray cannot set your fracture — but it tells you to go to theatre.<br><b>The law is that X-ray. It cannot save you, but it can stop you pretending you are fine.</b></p><p>And in the next verse, <b>the theatre door opens</b>.</p>"},{"a":21,"z":21,"star":false,"grk":"<p>Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,</p>","lit":"<p>“<b>But now</b> — apart from the law — the righteousness of God <b>has been revealed</b> (and stands revealed), being <b>continually testified to</b> by the law and the prophets.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Meaning</th></tr><tr><td>but now</td><td>Νυνὶ δέ</td><td>nyni de</td><td>G3570</td><td>intensified form of νῦν</td><td><b>but at this very moment!</b></td></tr><tr><td>apart from the law</td><td>χωρὶς νόμου</td><td>chōris nomou</td><td>G5565</td><td>χωρίζω (to separate)</td><td><b>separated from</b> the law, not by way of it</td></tr><tr><td>righteousness of God</td><td>δικαιοσύνη θεοῦ</td><td>dikaiosynē theou</td><td>G1343</td><td>δίκαιος</td><td><b>the righteousness God gives</b> (see below)</td></tr><tr><td>has been revealed</td><td>πεφανέρωται</td><td>pephanerōtai</td><td>G5319</td><td>φανερόω</td><td><b>perfect passive</b>: revealed, and the effect continues</td></tr><tr><td>being testified</td><td>μαρτυρουμένη</td><td>martyroumenē</td><td>G3140</td><td>μαρτυρέω</td><td><b>present passive participle</b>: continually being witnessed to</td></tr></table>","gram":"<p><b>★ First light: Nyni de — the two most beautiful words in the Bible</b></p><p>· νυνί is the <b>intensified form</b> of νῦν (with an emphatic -ι ending)<br>· δέ is a strong adversative</p><p>Paul has spent two and a half chapters (1:18–3:20) building despair. He overturns it in two words.</p><p>This “now” is not merely temporal; it marks a new era in redemptive history:</p><pre>before (the age of law):   the law brings knowledge of sin; every mouth is stopped\n  ↓ Νυνὶ δέ\nnow (the age of Christ):   the righteousness of God is revealed apart from law</pre><p><b>★ Second light: the weight of the perfect pephanerōtai</b></p><p>In Greek the perfect tense denotes an action completed in the past whose effect continues into the present.</p><p>This is not “God’s righteousness was once revealed,” but <b>“God’s righteousness has been revealed, and it is still lying there in the open for anyone to take.”</b></p><p>Compare 1:17, which uses the present ἀποκαλύπτεται (is being revealed); here the perfect πεφανέρωται. At 3:21 Paul moves the gospel from “happening” to <b>“accomplished.”</b></p><p><b>★ Third light: the present participle martyroumenē</b></p><p>“Being testified to by the law and the prophets” — <b>present tense</b>: the Old Testament is <b>still, to this day</b>, bearing witness to this gospel.</p><p>Paul is saying something crucial: <b>the gospel is not a new religion. It is the One the Old Testament was pointing to, arrived.</b></p><p>“Apart from the law” (χωρὶς νόμου) does <b>not</b> mean “unrelated to the Old Testament.”</p><p><b>★ Fourth light: three readings of dikaiosynē theou</b></p><table><tr><th>Reading</th><th>Claim</th><th>Representative</th></tr><tr><td><b>An attribute</b></td><td>God’s own righteous character</td><td>the medieval tradition</td></tr><tr><td><b>A gift</b></td><td>the righteousness God gives and credits to a person</td><td>Luther; the Reformed mainstream</td></tr><tr><td><b>An action</b></td><td>God’s covenant-keeping, saving activity</td><td>Käsemann, Wright</td></tr></table><p>The context of this chapter supports the <b>gift</b> as primary, with the <b>action</b> as a secondary note. Reasons:</p><p>· 3:22, the righteousness of God “<b>to</b> all who believe” — it is given out<br>· 3:24, “being justified <b>freely</b>” — it is declared<br>· 3:26, “that he might be just <b>and</b> the justifier” — <b>both are in the same verse!</b></p><p><b>3:26 is the key to this dispute:</b> God’s righteousness is at once his own attribute (he is just) and the standing he confers (he justifies).</p>","exp":"<p>Stop for a moment here.</p><p>3:20 says “by the works of the law no flesh will be justified in his sight.” Full stop.<br>3:21 says <b>“but now.”</b></p><p><b>What happened in between?</b></p><p>In between, there was a cross.</p><p>Paul does not say “but now you must try harder,” and he does not say “but now God has lowered the standard.”</p><p>He says: <b>the righteousness of God, apart from the law, has been revealed.</b></p><p><b>Not a righteousness we climbed up to. A righteousness God brought down.</b></p>"},{"a":22,"z":22,"star":false,"grk":"<p>δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ εἰς πάντας τοὺς πιστεύοντας. οὐ γάρ ἐστιν διαστολή,</p>","lit":"<p>“even the righteousness of God, <b>through faith in Jesus Christ</b> (or: through the faithfulness of Jesus Christ), <b>to</b> all who believe. For there is <b>no distinction</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>faith of Jesus Christ</td><td>πίστεως Ἰησοῦ Χριστοῦ</td><td>pisteōs Iēsou Christou</td><td>G4102</td><td><b>the chief interpretive dispute in this verse</b> (see below)</td></tr><tr><td>to all</td><td>εἰς</td><td>eis</td><td>G1519</td><td><b>into, toward</b> — a preposition of direction</td></tr><tr><td>distinction</td><td>διαστολή</td><td>diastolē</td><td>G1293</td><td>διά + στέλλω: <b>to divide, to draw a line between</b></td></tr></table>","gram":"<p><b>★ First light: pistis Iēsou Christou — objective or subjective genitive?</b></p><table><tr><th>Reading</th><th>Sense</th><th>Advocates</th></tr><tr><td><b>Objective genitive</b></td><td>faith <b>in</b> Jesus Christ (our believing)</td><td>most translations; the Reformed mainstream</td></tr><tr><td><b>Subjective genitive</b></td><td>the <b>faithfulness of</b> Jesus Christ</td><td>Hays, Wright, and others</td></tr></table><p><b>Reasons for the traditional reading (our faith):</b><br>· The second half of the same verse says “<b>to all who believe</b> (τοὺς πιστεύοντας)” — Paul is explaining himself<br>· 3:26, “the justifier of the one <b>who has faith in Jesus</b>”<br>· 4:5, “him who believes in the one who justifies the ungodly”<br>· The whole letter emphasises the faith that responds (1:16; 10:9–10)</p><p><b>What the subjective reading is protecting:</b><br>it reminds us that <b>faith is not our achievement</b>, and that the ground of salvation is Christ’s own faithfulness.</p><p><b>My judgement:</b> the objective genitive best fits the context. But the truth the subjective reading wants to protect is right, and can be said another way: <b>what saves me is not the quality of my faith, but the One my faith takes hold of.</b></p><p><b>★ Second light: diastolē (distinction)</b></p><p>The word occurs in <b>Romans 3:22 and 10:12</b>:</p><table><tr><th>Reference</th><th>Why there is no distinction</th></tr><tr><td><b>3:22</b></td><td>“no distinction” — because <b>all have sinned</b></td></tr><tr><td><b>10:12</b></td><td>“no distinction” — because <b>the same Lord is Lord of all, rich to all who call</b></td></tr></table><p>The same word: once with regard to condemnation, once with regard to grace.</p><p><b>This is the fairest sentence in the chapter: before sin we are all alike; before grace we are all alike too.</b></p>","exp":"<p>The word rendered “to” is <b>eis</b> — a preposition of direction: <b>into, toward</b>.</p><p>God’s righteousness is not hung in the sky for admiration. <b>It is moving toward you, and into you.</b></p><p>And “there is no distinction” (οὐ διαστολή) is the completion of 2:11, <b>“there is no partiality with God.”</b></p>"},{"a":23,"z":23,"star":false,"grk":"<p>πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ</p>","lit":"<p>“For all have sinned, and <b>keep falling short</b> of the glory of God.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>have sinned</td><td>ἥμαρτον</td><td>hēmarton</td><td>G264</td><td><b>aorist</b>: to miss the mark (summing up the whole human story)</td></tr><tr><td>fall short</td><td>ὑστεροῦνται</td><td>hysterountai</td><td>G5302</td><td><b>present middle/passive</b>: <b>to keep lagging behind, to run out, to fail to reach</b></td></tr><tr><td>glory</td><td>δόξα</td><td>doxa</td><td>G1391</td><td>glory, radiance, weight</td></tr></table>","gram":"<p><b>★ First light: two verbs, two tenses</b></p><table><tr><th>Verb</th><th>Tense</th><th>Sense</th></tr><tr><td>ἥμαρτον (sinned)</td><td><b>aorist</b></td><td>a settled fact</td></tr><tr><td>ὑστεροῦνται (fall short)</td><td><b>present</b></td><td>a state continuing at this moment</td></tr></table><p>Paul is saying: sinning is something that has happened; falling short is something still going on.<br><b>“I have sinned” plus “I am still not enough.”</b></p><p><b>★ Second light: the picture in hystereō</b></p><p>The word is used in the New Testament for:<br>· <b>falling behind</b> in a race<br>· wine <b>running out</b> at a feast (John 2:3, “they have no wine” — this very word!)<br>· the prodigal <b>coming to want</b> (Luke 15:14)</p><p>The picture: you are running, but you cannot catch up; you are pouring, but the jar is empty.</p><p><b>★ Third light: what does “the glory of God” mean?</b></p><p>Two main readings:<br>1. <b>The glory God gave</b> — humanity was meant to reflect God’s image (Genesis 1:26–27) and lost it<br>2. <b>God’s own glory</b> — humanity was meant to glorify God (1:21) and has come short</p><p>Jewish tradition held that Adam wore a “garment of glory” before the fall and lost it. Romans 1:23 (“exchanged the glory of the incorruptible God for images”) supports the first.</p><p>In truth they are one: humanity lost both the ability to glorify God and the likeness that reflected him.</p>","exp":"<p>This is one of the most quoted verses in the Bible, and it is usually read too lightly.</p><p>“Fall short” does not mean “not quite there.” The present tense tells us this is <b>a continuing, daily condition</b>.</p><p>People do not occasionally fail to reach God’s standard. <b>People fall short every day, every hour.</b></p><p>And notice where Paul has placed this verse: <b>between 3:22 (no distinction) and 3:24 (justified freely).</b></p><p>This verse is not here to drive people to despair. <b>It is here to explain why grace has to be free.</b></p>"},{"a":24,"z":24,"star":false,"grk":"<p>δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·</p>","lit":"<p>“being justified <b>freely</b>, by his grace, through the <b>redemption</b> that is in Christ Jesus —”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Meaning</th></tr><tr><td>being justified</td><td>δικαιούμενοι</td><td>dikaioumenoi</td><td>G1344</td><td>δίκαιος</td><td><b>present passive participle</b>: being declared righteous</td></tr><tr><td>freely</td><td>δωρεάν</td><td>dōrean</td><td>G1432</td><td>δῶρον (a gift)</td><td><b>as a gift, without payment, without cause</b></td></tr><tr><td>grace</td><td>χάρις</td><td>charis</td><td>G5485</td><td>χαίρω (to rejoice)</td><td>undeserved favour</td></tr><tr><td>redemption</td><td>ἀπολύτρωσις</td><td>apolytrōsis</td><td>G629</td><td>ἀπό + λύτρον (a ransom)</td><td><b>to buy a person out into freedom</b></td></tr></table>","gram":"<p><b>★ First light: the astonishing use of dōrean</b></p><p>This word appears in a startling place — <b>John 15:25</b>:</p><p>“They hated me <b>without a cause</b> (δωρεάν).”</p><p><b>The same word.</b></p><pre>They hated him “without cause”   (John 15:25, δωρεάν)\nWe are justified “without cause”  (Romans 3:24, δωρεάν)</pre><p><b>He was hated for no reason; we are loved for no reason. That is the exchange of the cross.</b></p><p><b>★ Second light: the three elements of apolytrōsis</b></p><p>Redeeming a slave in the ancient world required three things:<br>1. <b>a person in captivity</b> (us — 3:9, “under sin”)<br>2. <b>a ransom price</b> (λύτρον — Jesus: “to give his life a ransom for many,” Mark 10:45)<br>3. <b>a declaration of release</b> (3:24, justification)</p><p>Note: <b>to whom was the ransom paid?</b> Scripture does not say it was paid to Satan. Some early fathers speculated so, but Paul’s point is not the recipient — it is <b>the costliness of the price and the reality of the release</b>.</p><p><b>★ Third light: three prepositional layers stacked up</b></p><pre>δωρεάν                 —  freely            [manner: at no cost]\nτῇ αὐτοῦ χάριτι        —  by his grace      [source: God’s own character]\nδιὰ τῆς ἀπολυτρώσεως   —  through redemption [means: Christ’s work]</pre><p>Paul is afraid we will misunderstand, so he lays down three layers of insurance: free, by grace, through redemption.</p>","exp":"<p>“Justified freely” is the least intuitive sentence in the Bible.</p><p>Because every religion, every culture, and every human instinct says: <b>you must pay before you can receive.</b></p><p>Only the gospel says: <b>you need pay nothing, because someone has already paid in full.</b></p><p>But “free” does not mean “cheap.”<br><b>Free to you. It cost him everything.</b></p>"},{"a":25,"z":25,"star":true,"grk":"<p>ὃν προέθετο ὁ θεὸς ἱλαστήριον διὰ [τῆς] πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων</p>","lit":"<p>“whom God <b>publicly set forth</b> as a <b>propitiation / mercy seat</b>, through faith, in his own blood, to <b>demonstrate</b> his righteousness — because in his forbearance God had <b>passed over</b> the sins previously committed,”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Meaning</th></tr><tr><td>set forth</td><td>προέθετο</td><td>proetheto</td><td>G4388</td><td>πρό + τίθημι (to place)</td><td><b>to display publicly, to set out before everyone</b> (or “to purpose beforehand”)</td></tr><tr><td>propitiation</td><td>ἱλαστήριον</td><td>hilastērion</td><td>G2435</td><td>ἵλεως (merciful)</td><td><b>the mercy seat / place of atonement</b> (see below)</td></tr><tr><td>blood</td><td>αἷμα</td><td>haima</td><td>G129</td><td>—</td><td>blood — <b>a life given</b> (Leviticus 17:11)</td></tr><tr><td>demonstration</td><td>ἔνδειξις</td><td>endeixis</td><td>G1732</td><td>ἐν + δείκνυμι (to show)</td><td><b>evidence presented in court</b></td></tr><tr><td>forbearance</td><td>πάρεσις</td><td>paresis</td><td>G3929</td><td>παρά + ἵημι (to let go)</td><td><b>only here in the NT</b>: to pass over, to hold in suspense</td></tr><tr><td>previously committed</td><td>προγεγονότων</td><td>progegonotōn</td><td>G4266</td><td>—</td><td><b>perfect participle</b>: sins already committed</td></tr></table>","gram":"<p><b>★ First light: hilastērion — the mercy seat</b></p><p>In the Septuagint this word is the technical term for the lid of the ark of the covenant — the Hebrew <b>kapporeth</b>, the “mercy seat.”</p><p>· Exodus 25:17–22 (the making of the mercy seat)<br>· Leviticus 16:2, 13–15 (blood sprinkled on the mercy seat on the Day of Atonement)<br>· Hebrews 9:5, “the mercy seat” — <b>the same word, hilastērion</b></p><p><b>What happened on the Day of Atonement?</b></p><pre>1. What was inside the ark?      The two tablets of the law — the evidence against Israel\n2. What covered the ark?         The mercy seat\n3. What was above it?            Two cherubim, facing each other, looking down on the mercy seat\n4. What did the high priest do?  He sprinkled the blood of the sin offering on the mercy seat</pre><p>So when God, enthroned between the cherubim, looked down — <b>what he saw was not the tablets that accused me, but the blood that covered them.</b></p><p>Paul says: <b>Jesus is that mercy seat.</b></p><p>Two main renderings:</p><table><tr><th>Rendering</th><th>Emphasis</th><th>Support</th></tr><tr><td><b>Propitiation</b></td><td>bearing the wrath of God, turning wrath to favour</td><td>the wrath of 1:18 is the context; Cranfield, Leon Morris</td></tr><tr><td><b>Mercy seat</b></td><td>the LXX usage; the place of the Day of Atonement</td><td>Hebrews 9:5 uses the same word; T. W. Manson, Dunn</td></tr><tr><td>(Expiation)</td><td>removing the sin itself</td><td>C. H. Dodd — most scholars judge this weakens the wrath theme of 1:18</td></tr></table><p>I judge that the two main readings can and should stand together: <b>Jesus is both the place (the mercy seat) and the sacrifice (the propitiation).</b><br>He is the altar and the offering; the place covered by blood, and the Lamb whose blood covers it.</p><p><b>★ Second light: proetheto — set out in public</b></p><p>The verb literally means “to place before.”</p><p><b>Where was the mercy seat on the Day of Atonement?</b><br>· inside <b>the Most Holy Place</b><br>· behind <b>the veil</b><br>· <b>once a year</b><br>· seen by <b>one man only</b></p><p>Paul says: God <b>proetheto</b> — set it out in public.</p><p>What was hidden behind the veil now hangs on a hill outside the city;<br>what only the high priest could see, the whole world now sees;<br>what happened once a year has now been accomplished once for all.</p><p>Which is why, at the moment Jesus died:</p><p><b>“Behold, the veil of the temple was torn in two from top to bottom.” (Matthew 27:51)</b></p><p><b>The veil was no longer needed. The mercy seat had been put on public display.</b></p><p><b>★ Third light: paresis is not aphesis</b></p><p>This is the finest distinction in the verse, and the one most easily lost in translation.</p><table><tr><th>Word</th><th>Meaning</th><th>Where</th></tr><tr><td><b>ἄφεσις</b></td><td><b>forgiveness, remission</b> (the debt is cancelled)</td><td>common in the NT (Ephesians 1:7)</td></tr><tr><td><b>πάρεσις</b></td><td><b>passing over, holding in suspense</b> (the debt is deferred, not yet settled)</td><td><b>only here in the NT</b></td></tr></table><p>Paul is answering a question no one had dared to ask: <b>what about all the sins God let pass in Old Testament times?</b></p><p>David committed adultery and murder — and was forgiven. On what legal basis?<br>Every sin covered by every sacrifice in Leviticus — where did the debt actually go?</p><p>Paul’s answer: <b>God had passed them over (paresis), not yet settled them. And at the cross, he settled the account.</b></p><p>That is why the cross was necessary to <b>“demonstrate his righteousness”</b> — because until Calvary, God’s forbearance had looked, from the outside, like laxity.</p>","exp":"<p>This verse answers the greatest problem in the Bible.</p><p>The problem is: <b>how can God be both just and forgive sin?</b></p><p>· a judge who releases a murderer is not a good judge<br>· a father who ignores his child’s wrong is not a good father<br>· a God who does not deal with sin is not a righteous God</p><p><b>The answer: God took the defendant’s place himself.</b></p><p>He set his own Son out in public, as the place where the wrath would fall. And so:</p><p>· sin was fully dealt with → <b>God is just</b><br>· sinners were fully released → <b>God justifies</b></p><p><b>Both were accomplished on one cross, at one time.</b></p>"},{"a":26,"z":26,"star":false,"grk":"<p>ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.</p>","lit":"<p>“in the forbearance of God — to demonstrate his righteousness <b>at this present time</b>, so that he might be <b>just, and the justifier</b> of the one who has faith in Jesus.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>at this time</td><td>ἐν τῷ νῦν καιρῷ</td><td>en tō nyn kairō</td><td>G2540</td><td><b>at this decisive moment</b> (kairos is “the moment,” not duration)</td></tr><tr><td>just</td><td>δίκαιον</td><td>dikaion</td><td>G1342</td><td>adjective: <b>he himself is righteous</b></td></tr><tr><td>the justifier</td><td>δικαιοῦντα</td><td>dikaiounta</td><td>G1344</td><td><b>present active participle</b>: the one who is justifying</td></tr></table>","gram":"<p><b>★ dikaion kai dikaiounta — the most exquisite pairing in the Bible</b></p><p>The Greek sets two forms of one root side by side:</p><pre>δίκαιον      καὶ    δικαιοῦντα\n(just)       and    (justifying)\nadjective            present active participle</pre><p>English renders it well as <b>“just and the justifier”</b> — but the Greek is tighter still: two δικαι- roots pressed together with nothing but a καί between them, like two stones set in a wall.</p><p><b>This is the double miracle that took place on the cross.</b></p><p>“At this present time” (ἐν τῷ νῦν καιρῷ) echoes the <b>Nyni de</b> of 3:21 — Paul says <b>“now”</b> for the second time.</p>","exp":"<p>This is the summit of the chapter.</p><p>There have only ever been two “solutions” in human history:</p><table><tr><th>Option</th><th>Result</th></tr><tr><td>God insists only on justice</td><td>not one person survives</td></tr><tr><td>God insists only on love</td><td>God becomes indulgent toward sin, and the moral basis of the universe collapses</td></tr><tr><td><b>The cross</b></td><td><b>justice fully satisfied, love fully displayed</b></td></tr></table><p><b>God did not compromise between justice and love. At the cross he scored full marks in both.</b></p><p><b>“Mercy and truth have met together; righteousness and peace have kissed each other.” (Psalm 85:10)</b></p><p>What the psalmist longed to see happened at Calvary.</p>"},{"a":27,"z":28,"star":false,"grk":"<p>27 Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως. 28 λογιζόμεθα γὰρ δικαιοῦσθαι πίστει ἄνθρωπον χωρὶς ἔργων νόμου.</p>","lit":"<p>27 “Where then is boasting? <b>It has been shut out.</b> By what kind of law? Of works? No — but by the law of faith.”</p><p>28 “For we <b>reckon</b> that a person is justified by faith apart from the works of the law.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>boasting</td><td>καύχησις</td><td>kauchēsis</td><td>G2746</td><td>the act of boasting (same root as 2:17, 2:23)</td></tr><tr><td>is excluded</td><td>ἐξεκλείσθη</td><td>exekleisthē</td><td>G1576</td><td>ἐκ + κλείω (to shut): <b>has been shut outside the door</b></td></tr><tr><td>we reckon</td><td>λογιζόμεθα</td><td>logizometha</td><td>G3049</td><td><b>to reckon, to conclude</b> (same word as 2:3, 4:3)</td></tr></table>","gram":"<p><b>★ First light: exekleisthē — the most vivid passive in the chapter</b></p><p>Literally: <b>“it has been locked out.”</b></p><p>Paul does not say “boasting is unbecoming” or “we ought to be humbler.” He says: <b>the door is shut. Boasting cannot get in.</b></p><p><b>★ Second light: “where is boasting?” echoes chapter 2</b></p><pre>2:17  you rely on the law and BOAST in God\n2:23  you BOAST in the law, and dishonour God by breaking it\n3:27  where then is BOASTING? It is excluded.</pre><p>Chapter 2 diagnosed the disease of boasting. Chapter 3 shuts the door on it.</p><p><b>★ Third light: logizometha (“we reckon”) is the fuse for chapter 4</b></p><p>The same word detonates at 4:3: “Abraham believed God, and it was <b>counted</b> (ἐλογίσθη) to him for righteousness.”</p><p>Paul says “we reckon” in 3:28, and “God reckoned” in 4:3 — <b>the human calculation and the divine calculation finally agree.</b></p><p><b>★ Fourth light: the controversy over Luther’s translation</b></p><p>In his 1522 German New Testament, Martin Luther rendered 3:28 as “justified by faith <b>alone</b>” (allein durch den Glauben), adding the word <b>allein</b>. This caused fierce controversy.</p><p><b>A balanced assessment:</b><br>· <b>Grammatically:</b> the Greek does not contain the word “alone”<br>· <b>In sense:</b> “χωρὶς ἔργων νόμου” (apart from works of law) is semantically equivalent to “by faith alone”<br>· <b>Luther’s own defence:</b> German idiom requires “allein” for a negative contrast to read naturally</p><p><b>An honest way to say this from the pulpit:</b> “Luther added the word ‘alone’ in his translation, and it caused a great deal of argument. The word he added is not in the Greek — but the meaning he was protecting is exactly what Paul says in this verse.”</p>","exp":"<p>Paul does something very bold here: <b>he calls faith itself a “law”</b> (νόμος πίστεως, the law of faith).</p><p>It is a play on words, but it carries theological weight:</p><pre>the law of works (νόμος τῶν ἔργων):  I do, therefore I receive\nthe law of faith (νόμος πίστεως):    He has done, therefore I receive</pre><p><b>Two laws, two lives, two religions.</b></p><p>Every religion in the world runs on the law of works. Only the gospel runs on the law of faith.</p><p><b>The verb of every religion is “do.” The verb of the gospel is “finished.”</b></p>"},{"a":29,"z":30,"star":false,"grk":"<p>29 ἢ Ἰουδαίων ὁ θεὸς μόνον; οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν, 30 εἴπερ εἷς ὁ θεὸς ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.</p>","lit":"<p>29 “Or is God the God of Jews only? Is he not the God of Gentiles too? <b>Yes, of Gentiles also</b> —”</p><p>30 “<b>since God is one</b>: he will justify the circumcised <b>by faith</b>, and the uncircumcised <b>through faith</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>God is one</td><td>εἷς ὁ θεός</td><td>heis ho theos</td><td>G1520</td><td><b>God is one</b> — a direct appeal to the Shema (Deuteronomy 6:4)</td></tr><tr><td>by faith</td><td>ἐκ πίστεως</td><td>ek pisteōs</td><td>—</td><td><b>out of faith</b> (source)</td></tr><tr><td>through faith</td><td>διὰ τῆς πίστεως</td><td>dia tēs pisteōs</td><td>—</td><td><b>through that faith</b> (means)</td></tr></table>","gram":"<p><b>★ First light: Paul proves the Gentile gospel from the Shema</b></p><p>Deuteronomy 6:4 is the confession Jews recite morning and evening (the Shema):</p><p><b>“Hear, O Israel: the LORD our God, the LORD is one.”</b></p><p>Jews used that sentence to prove: <b>“only we worship the true God.”</b></p><p>Paul uses the same sentence to prove: <b>“therefore the Gentiles are his too.”</b></p><p>Paul’s logic: <b>if God is one, and he is the God of the whole universe, then he cannot possibly be the God of one nation only.</b></p><p><b>Monotheism necessarily implies world mission.</b></p><p>This is the most elegant argument in the chapter: Paul takes the confession Jews prize most, and derives from it the conclusion they find hardest to accept.</p><p><b>★ Second light: ek pisteōs and dia tēs pisteōs</b></p><p>Paul uses two different prepositions:<br>· for the circumcised: <b>ἐκ πίστεως</b> (out of faith)<br>· for the uncircumcised: <b>διὰ τῆς πίστεως</b> (through that faith)</p><p>Two main explanations:<br>1. <b>Pure stylistic variation</b> — Paul is simply varying his wording (most commentators)<br>2. <b>A fine distinction</b> — the Jew comes “out of” faith (they are the heirs of promise); the Gentile enters “through” faith</p><p>Either way Paul’s point is clear: <b>both are πίστις. The wording may vary; there is only one road.</b></p>","exp":"<p>Verse 29 asks a very quiet and enormous question: <b>“Is God the God of Jews only?”</b></p><p>The question still has to be asked today:<br>· Is God only the God of <b>our kind of Christian</b>?<br>· Is God only the God of <b>our denomination</b>?<br>· Is God only the God of <b>people whose conversion looked like mine</b>?</p><p>Paul’s answer: <b>“Yes, of Gentiles also.”</b></p><p><b>Anyone who fences God inside his own group has not yet understood chapter 3.</b></p>"},{"a":31,"z":31,"star":false,"grk":"<p>νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ἱστάνομεν.</p>","lit":"<p>“Do we then <b>make the law void</b> through faith? By no means! On the contrary, we <b>establish</b> the law.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>make void</td><td>καταργοῦμεν</td><td>katargoumen</td><td>G2673</td><td>to render ineffective (the word of 3:3)</td></tr><tr><td>establish</td><td>ἱστάνομεν</td><td>histanomen</td><td>G2476</td><td>ἵστημι: <b>to make stand, to set upright, to confirm</b></td></tr></table>","gram":"<p><b>★ First light: the contrast of katargeō and histēmi</b></p><pre>καταργέω  —  to make something collapse, to render void\nἵστημι    —  to make something stand up</pre><p>The picture: <b>faith does not knock the law over. It sets the law upright.</b></p><p><b>★ Second light: this verse echoes 3:3</b></p><pre>3:3   can their unbelief make VOID (καταργήσει) the faithfulness of God?  → no\n3:31  do we make VOID (καταργοῦμεν) the law through faith?                → no</pre><p>Paul opens and closes the chapter with the same verb.</p>","exp":"<p>How does the gospel <b>establish</b> the law? On at least three levels:</p><p>1. <b>The gospel fulfils the law’s demand</b> — Christ kept the law perfectly (Matthew 5:17) and satisfied its penalty at the cross.</p><p>2. <b>The gospel vindicates the law’s function</b> — the law was never given to justify, but to bring knowledge of sin (3:20). Justification by faith finally restores the law to its proper place.</p><p>3. <b>The gospel makes the law livable</b> — 8:4, “that the righteous requirement of the law might be fulfilled in us who walk according to the Spirit.”</p><p>This verse is the door into chapters 6 to 8. Having finished with justification by faith, Paul immediately opens the next door: <b>grace does not make people careless. Grace makes the law stand up for the first time.</b></p><p>It is also the final answer to the slander of 3:8: “may we do evil that good may come?” — <b>No. Grace does not abolish the law; grace establishes it.</b></p>"}],"6":[{"a":1,"z":1,"star":false,"grk":"<p>Τί οὖν ἐροῦμεν; ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;</p>","lit":"<p>“What shall we say then? Shall we <b>go on living in</b> sin, so that grace may abound?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>continue in</td><td>ἐπιμένωμεν</td><td>epimenōmen</td><td>G1961</td><td>ἐπί + μένω (to remain)</td><td><b>to stay on, to take up residence</b></td><td>not an occasional visit — <b>living there</b></td></tr><tr><td>sin</td><td>ἁμαρτίᾳ</td><td>hamartia</td><td>G266</td><td>—</td><td>sin (singular, with the article)</td><td><b>the power of sin, not just sinful acts</b></td></tr><tr><td>abound</td><td>πλεονάσῃ</td><td>pleonasē</td><td>G4121</td><td>πλέον (more)</td><td>to increase</td><td>a direct pick-up from 5:20</td></tr></table>","gram":"<p><b>★ First light: the picture in epimenō</b></p><p>The verb is not “to sin” but <b>“to go on dwelling in</b> sin.”<br>(Acts 10:48, Peter “stayed” some days; Colossians 1:23, “if you <b>continue</b> in the faith” — the same word.)</p><p>Paul’s question is not “will a Christian occasionally fall?” but <b>“may a Christian treat sin as his address?”</b></p><p><b>★ Second light: epimenōmen is a deliberative subjunctive</b></p><p>This mood is used in Greek for <b>deliberating with oneself</b>: “should we…?”</p><p>Paul is not reporting someone else’s words. <b>He is saying out loud the thought that is already in his reader’s mind.</b> This is the diatribe style — he knows what you are thinking.</p><p><b>★ Third light: the articular tē hamartia</b></p><p>Almost every use of “sin” in chapter 6 is <b>singular and articular</b> — Paul has <b>personified</b> it.</p><p>In this chapter sin is <b>a character</b>: it reigns (6:12), it has dominion (6:14), it owns slaves (6:16–20), and it pays wages (6:23).</p><p><b>Paul is not talking about a set of bad behaviours. He is talking about a master.</b></p>","exp":"<p>This question is not a straw man Paul invented. It is what he was actually accused of — 3:8 has already said, “as some slanderously report that we say.”</p><p>And the fact that the question arises at all is proof that Paul has preached the gospel correctly.</p><p><b>If you preach grace and nobody has ever misheard you as encouraging licence, you may not yet have really preached grace.</b></p><p>Only when grace is preached all the way to “free, on no condition whatever” does this misunderstanding become possible.</p><p>Paul is not about to take back that “freely.” He is about to prove that <b>someone who has truly received it will not want to go back.</b></p>"},{"a":2,"z":2,"star":true,"grk":"<p>μὴ γένοιτο. οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;</p>","lit":"<p>“By no means! We who <b>died to sin</b> — <b>how</b> shall we still live in it?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>by no means</td><td>μὴ γένοιτο</td><td>mē genoito</td><td>—</td><td><b>may it never be!</b> The strongest negation in Greek</td></tr><tr><td>died</td><td>ἀπεθάνομεν</td><td>apethanomen</td><td>G599</td><td><b>aorist</b>: we died (a single completed event)</td></tr><tr><td>to sin</td><td>τῇ ἁμαρτίᾳ</td><td>—</td><td>G266</td><td><b>dative of relation</b>: with respect to sin</td></tr><tr><td>how</td><td>πῶς</td><td>pōs</td><td>G4459</td><td><b>how is it possible</b> (not “you ought not”)</td></tr></table>","gram":"<p><b>★ First light: pōs is not “you shouldn’t” but “how could you?”</b></p><p>This is the most easily missed word in the chapter.</p><p>English “how shall we” can sound like moral exhortation: “how could you do such a thing!”<br>But the force of the Greek πῶς is: <b>“how would that even work?”</b></p><p>Paul is not saying, “you ought not to live in sin.”<br>Paul is saying, <b>“how could a dead man still be living there?”</b></p><p>This is a question about <b>possibility</b>, not about <b>duty</b>.</p><p><b>★ Second light: apethanomen is aorist</b></p><p>“Died” is <b>an event already completed</b>, not a goal to be worked toward.</p><p>Paul does not say “you must die to sin.” Paul says <b>“you have died to sin.”</b></p><p>This is where this chapter differs most sharply from a great deal of spiritual teaching:</p><table><tr><th>A common teaching</th><th>Paul’s teaching</th></tr><tr><td>“You must put your old self to death”</td><td>“Your old self <b>has been</b> crucified with him” (6:6)</td></tr><tr><td>“You must die to sin”</td><td>“You <b>have</b> died to sin” (6:2)</td></tr><tr><td>pursuing a state to be attained</td><td>recognising a fact already accomplished</td></tr></table><p><b>★ Third light: tē hamartia is a dative of relation</b></p><p>“Died to sin” is not “died because of sin” but <b>“died as far as the relationship with sin is concerned.”</b></p><p>The same construction returns in 6:10 and 6:11:</p><pre>6:10  he died “to sin” (τῇ ἁμαρτίᾳ)\n      he lives “to God” (τῷ θεῷ)\n6:11  you are to reckon yourselves dead “to sin”\n      and alive “to God”</pre><p>To “die to” something means: <b>that relationship is over; that party no longer has legal authority over you.</b><br>Just as a creditor can no longer pursue a man who has died.</p><p><b>★ Fourth light: “dead to sin” does not mean “feeling no pull toward sin”</b></p><p>This must be clarified at once, or the whole chapter will be misread.</p><p>If “dead to sin” meant “no longer having any desire to sin,” the commands of 6:12–13 would be pointless — because 6:12 says, “do not let sin <b>reign</b> in your mortal body.”</p><p>The very fact that Paul must command us not to let it reign shows that <b>it will still contest the throne</b>.</p><p><b>“Dead to sin” is a change of legal standing, not the disappearance of felt experience.</b></p>","exp":"<p><b>What the text plainly says:</b> believers have died to sin, so continuing to live in it is a logical impossibility.</p><p><b>What may fairly be drawn from it:</b> whenever our method against sin is “I must try harder,” we are not yet standing on 6:2. <b>The starting point of chapter 6 is not resolve. It is identity.</b></p><p>This verse changes the whole nature of the battle.</p><p>If I have not yet died, then my way of dealing with sin is <b>struggle</b>.<br>If I have already died, then my way of dealing with sin is <b>recognition</b>.</p>"},{"a":3,"z":3,"star":false,"grk":"<p>ἢ ἀγνοεῖτε ὅτι, ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν, εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;</p>","lit":"<p>“Or <b>do you not know</b> that all of us who were <b>immersed into</b> Christ Jesus were <b>immersed into his death</b>?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>do you not know</td><td>ἀγνοεῖτε</td><td>agnoeite</td><td>G50</td><td>ἀ + γινώσκω</td><td><b>are you unaware</b></td><td>Paul assumes they know this already</td></tr><tr><td>were baptised</td><td>ἐβαπτίσθημεν</td><td>ebaptisthēmen</td><td>G907</td><td>βάπτω (to dip)</td><td><b>were immersed</b></td><td>passive</td></tr><tr><td>into</td><td>εἰς</td><td>eis</td><td>G1519</td><td>—</td><td><b>into, so as to belong to</b></td><td>direction and belonging</td></tr></table>","gram":"<p><b>★ First light: the basic sense of baptizō</b></p><p>The root meaning is <b>to dip, to plunge, to submerge</b>. In ancient Greek writing it is used of:<br>· a ship sinking<br>· cloth being dipped in a dye vat (once dipped, it takes the colour of the vat)<br>· an object going under water</p><p>The word itself carries the picture Paul wants: <b>total submersion — and what comes out is no longer the colour it was.</b></p><p><b>★ Second light: eis Christon (into Christ)</b></p><p>εἰς + accusative denotes <b>entry and belonging</b>.</p><p>The phrase also appears in Galatians 3:27: “as many of you as were baptised into Christ have put on Christ.”</p><p><b>“Into Christ” is not “joining an organisation.” It is entering a person.</b></p><p><b>★ Third light: Paul’s tone in ē agnoeite</b></p><p>Paul assumes this is <b>elementary knowledge</b>.</p><p>That is a rebuke to us: Paul expected every baptised believer to be able to say what his baptism meant. How many believers today could say what actually happened on the day they were baptised?</p>","exp":"<p>(On whether baptism itself saves, see the disputed material. Here we follow the line of Paul’s argument.)</p><p>Paul is not teaching a theology of baptism here; <b>he is using baptism as an argument</b>. His logic runs:</p><pre>you were baptised (a fact you know yourself)\n  ↓\nyour baptism proclaimed union with his death\n  ↓\ntherefore you have died\n  ↓\ntherefore you cannot go on in sin</pre><p>Paul is saying: <b>on the day you were baptised, you publicly agreed to this yourself. Do you now want to take it back?</b></p>"},{"a":4,"z":4,"star":true,"grk":"<p>συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.</p>","lit":"<p>“Therefore we were <b>buried with him</b> through that immersion into death, in order that — just as Christ was raised from the dead through the glory of the Father — we too might <b>walk in newness of life</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>buried with</td><td>συνετάφημεν</td><td>synetaphēmen</td><td>G4916</td><td>σύν + θάπτω (to bury)</td><td><b>to be buried together with</b></td><td>the first of six συν- words</td></tr><tr><td>the glory of the Father</td><td>δόξα τοῦ πατρός</td><td>—</td><td>G1391</td><td>—</td><td>the Father’s glory</td><td>the power behind the resurrection</td></tr><tr><td>newness of life</td><td>καινότης ζωῆς</td><td>kainotēs zōēs</td><td>G2538</td><td>καινός (new in kind)</td><td><b>a new quality of life</b></td><td>see below</td></tr><tr><td>walk</td><td>περιπατήσωμεν</td><td>peripatēsōmen</td><td>G4043</td><td>περί + πατέω (to walk)</td><td><b>to walk about</b></td><td>a Hebraism for daily conduct</td></tr></table>","gram":"<p><b>★ First light: why mention burial at all?</b></p><p>Was dying not enough? Why does Paul add being <b>buried</b>?</p><p>Because burial is <b>the confirmation of death</b>.</p><p>A person who has died might still be revived. <b>A person who has been buried — the case is closed.</b><br>Burial is the social, public, irreversible declaration: <b>this person is really gone.</b></p><p><b>★ Second light: kainos, not neos</b></p><p>Greek has two words for “new”:</p><table><tr><th>Word</th><th>Sense</th></tr><tr><td><b>νέος</b></td><td>new in <b>time</b> (recent, young)</td></tr><tr><td><b>καινός</b></td><td>new in <b>kind</b> (unprecedented, different in nature)</td></tr></table><p>Paul uses <b>καινότης</b> (the noun from καινός).</p><p>Not “a fresh copy of the old model.” <b>A kind of life that did not exist before.</b><br>(The same root in 2 Corinthians 5:17, “a <b>new</b> creation”; Revelation 21:5, “I make all things <b>new</b>.”)</p><p><b>★ Third light: peripateō — how you walk</b></p><p>The word literally means “to walk around,” and it renders the Hebrew <b>halak</b>: <b>one’s manner of daily life</b>.</p><p>Paul is not saying “you should have one spiritual mountaintop experience.” He is saying <b>“the way you walk should be different.”</b></p><p>Where does the new life show? In how you walk — how you speak, how you use money, how you treat your family, <b>how you decide things when nobody is watching</b>.</p><p><b>★ Fourth light: dia tēs doxēs tou patros (through the glory of the Father)</b></p><p>Paul could have written “through the Father’s <b>power</b>.” He wrote <b>“glory.”</b></p><p>In the Old Testament, glory (kavod / δόξα) is <b>the weight of God’s manifest presence</b>.</p><p>Paul is saying: what pulled Jesus out of the grave was the Father’s own manifest glory.<br>And that same glory is what now drives your ordinary Tuesday.</p>","exp":"<p>There is a logic in verse 4 that is often missed.</p><p>Paul does not say, “we were buried with him, and we shall also rise with him (one day).”<br>He says: we were buried with him, <b>so that we might walk in newness of life now</b>.</p><p><b>Resurrection power is not being held in reserve for the future. It is what moves your feet today.</b></p>"},{"a":5,"z":5,"star":false,"grk":"<p>εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·</p>","lit":"<p>“For if we have <b>grown together with him</b> in the likeness of his death, we shall certainly also be so in the likeness of his resurrection.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>united with</td><td>σύμφυτος</td><td>symphytos</td><td>G4854</td><td>σύν + φύω (to grow)</td><td><b>grown together, grafted into one</b></td><td><b>only here in the NT</b></td></tr><tr><td>likeness</td><td>ὁμοίωμα</td><td>homoiōma</td><td>G3667</td><td>ὅμοιος (like)</td><td>likeness, form</td><td>see below</td></tr></table>","gram":"<p><b>★ symphytos — the picture of grafting</b></p><p>In classical Greek and in medical writing the word is used of:<br>· <b>the grafting of plants</b>: two plants joined so that they grow as one<br>· <b>the knitting of a wound</b>: a broken bone growing back together<br>· something that is <b>innate, joined from birth</b></p><p>Paul did not choose a word for “tied together.” He chose one for <b>“grown together.”</b></p><p><b>What is tied can be untied. What has grown together cannot be pulled apart.</b><br>(In 11:17 Paul uses a related grafting image: “a wild olive… grafted in among them.”)</p><p><b>★ gegonamen is perfect tense</b></p><p>“Have grown together” — an action completed in the past whose effect continues.</p><p><b>This is not a state we have to work at maintaining. It is a join that has already been made.</b></p>","exp":"<p>This verse gives us the deepest angle there is on dealing with sin.</p><p>The question is not “how do I get away from sin by willpower?”<br>The question is <b>“who have I been grafted into?”</b></p><p>If a branch is grafted into a tree, what fruit will it bear?<br><b>Not what it works for. What it is joined to.</b></p>"},{"a":6,"z":6,"star":true,"grk":"<p>τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ·</p>","lit":"<p>“<b>Knowing</b> this: that our <b>old self</b> was <b>crucified with him</b>, so that <b>the body of sin might be stripped of its office</b>, that we should <b>no longer be slaves to sin</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>knowing</td><td>γινώσκοντες</td><td>ginōskontes</td><td>G1097</td><td>—</td><td><b>knowing for certain</b> (present participle)</td><td>the first of three verbs</td></tr><tr><td>old self</td><td>ὁ παλαιὸς ἄνθρωπος</td><td>palaios anthrōpos</td><td>G3820</td><td>παλαιός (old, obsolete)</td><td><b>the old man, the former person</b></td><td>see below</td></tr><tr><td>crucified with</td><td>συνεσταυρώθη</td><td>synestaurōthē</td><td>G4957</td><td>σύν + σταυρόω</td><td><b>crucified together with</b></td><td>aorist passive: an accomplished fact</td></tr><tr><td>done away with</td><td>καταργηθῇ</td><td>katargēthē</td><td>G2673</td><td>κατά + ἀργός (idle)</td><td><b>stripped of function, relieved of office</b></td><td><b>not “annihilated”!</b></td></tr><tr><td>be slaves</td><td>δουλεύειν</td><td>douleuein</td><td>G1398</td><td>δοῦλος</td><td>to serve as a slave</td><td>see below</td></tr></table>","gram":"<p><b>★ First light: katargeō does not mean “destroyed”</b></p><p>This is the single most important clarification in the chapter.</p><p>Many translations render it “destroyed,” which can leave people thinking “the body of sin” no longer exists.</p><p>But καταργέω means: κατά (thoroughly) + ἀργός (idle, out of work) = <b>to render inoperative, to strip of office, to make void</b>.</p><p>We have already met this word three times in Romans:</p><table><tr><th>Reference</th><th>Text</th></tr><tr><td>3:3</td><td>can human unbelief <b>nullify</b> God’s faithfulness?</td></tr><tr><td>3:31</td><td>do we <b>make void</b> the law through faith?</td></tr><tr><td><b>6:6</b></td><td><b>the body of sin “done away with”</b></td></tr><tr><td>7:2</td><td>when the husband dies, the wife is <b>discharged</b> from the law of the husband</td></tr></table><p>Paul is not saying “the body of sin was destroyed.” Paul is saying <b>“it has been removed from office.”</b></p><p>Like an official who has been dismissed — he is still there, he still has opinions, he still tries to give you orders, <b>but he no longer holds the post</b>.</p><p>Which is exactly why 6:12 still has to command, “do not let sin reign” — <b>because that dismissed official is still trying to sit on the throne</b>.</p><p><b>★ Second light: who is the “old self”?</b></p><p>ὁ παλαιὸς ἄνθρωπος — “the old man.” Paul uses the phrase elsewhere:<br>· Ephesians 4:22, “put off the <b>old man</b> of your former manner of life”<br>· Colossians 3:9, “you have <b>put off the old man</b> with his deeds”</p><p>Two main readings:</p><table><tr><th>Reading</th><th>Claim</th></tr><tr><td><b>A. The old self / fallen nature</b></td><td>the corrupt disposition within me has been put to death</td></tr><tr><td><b>B. The old “I” — the person I was in Adam</b></td><td>my identity as a member of Adam’s race has been put to death</td></tr></table><p>B fits the context better, since chapter 5 has just finished contrasting “in Adam” and “in Christ.”</p><p>“The old man” = <b>the “I” who belonged to Adam, lived under sin’s dominion, and was constituted a sinner</b>. That “I” has been crucified with Christ.</p><p>Note: it is not that <b>part</b> of me died and part lives on. <b>The whole old “I” died, and a new “I” lives.</b><br>A Christian is not half new and half old. <b>A Christian is a new person still carrying old habits.</b></p><p><b>★ Third light: what is “the body of sin”?</b></p><p>It does not mean that the body itself is evil — that is Greek dualism, not Scripture.</p><p>“The body of sin” means <b>this body as ruled by sin, as sin’s instrument</b>.</p><p>The proof is immediate: in 6:12–13 Paul speaks of “your mortal <b>body</b>” and “your <b>members</b>.” His point is not that the body should be destroyed, but that <b>the body should change owners</b>.</p><p>The same hands, the same tongue, the same eyes — moving from “instruments of unrighteousness” to “instruments of righteousness” (6:13).</p><p><b>★ Fourth light: two purpose clauses (ἵνα … τοῦ …)</b></p><pre>συνεσταυρώθη (the old self crucified with him)\n  ↓ ἵνα (so that)\nκαταργηθῇ τὸ σῶμα τῆς ἁμαρτίας (the body of sin stripped of office)\n  ↓ τοῦ (in order that)\nμηκέτι δουλεύειν (we should no longer be slaves)</pre><p>A chain of purpose: the old self crucified → sin’s body dismissed → <b>we are no longer slaves</b>.</p>","exp":"<p><b>What the text plainly says:</b> the old self has been crucified with Christ and the body of sin relieved of its office, so that we should no longer be slaves to sin.</p><p><b>What may fairly be drawn from it:</b> when sin comes, the right response is not “I must resist harder,” but <b>“you have been dismissed — on what authority are you giving me orders?”</b></p>"},{"a":7,"z":10,"star":false,"grk":"<p>7 ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας. 9 …θάνατος αὐτοῦ οὐκέτι κυριεύει. 10 ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.</p>","lit":"<p>7 “For the one who has died <b>has been declared clear of sin</b>.”</p><p>8 “Now if we died with Christ, we believe that we shall also <b>live with him</b> —”</p><p>9 “knowing that Christ, having been raised from the dead, <b>dies no more</b>; <b>death no longer has dominion over him</b>.”</p><p>10 “For the death he died, he died <b>to sin</b>, <b>once for all</b>; but the life he lives, he lives <b>to God</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>freed from sin</td><td>δεδικαίωται ἀπὸ τῆς ἁμαρτίας</td><td>dedikaiōtai</td><td>G1344</td><td><b>perfect passive: has been declared clear of sin</b> (literally “justified”)</td></tr><tr><td>has dominion</td><td>κυριεύει</td><td>kyrieuei</td><td>G2961</td><td>κύριος (lord): <b>to be master over</b></td></tr><tr><td>once for all</td><td>ἐφάπαξ</td><td>ephapax</td><td>G2178</td><td>ἐπί + ἅπαξ: <b>once and for ever</b></td></tr></table>","gram":"<p><b>★ First light: the verb in 6:7 is “justified”</b></p><p>“He who has died is freed from sin” — the verb Paul uses is <b>δικαιόω, to justify</b>!</p><p>Literally: <b>“the one who has died has been justified away from sin.”</b></p><p>Paul brings courtroom language in here: <b>when a person dies, the law’s case against him ends.</b> Death terminates sin’s legal jurisdiction over him.</p><p>(The rabbis of the time had a comparable saying: “when a person dies, he is freed from the law and the commandments.” Paul takes that commonplace and makes it theology.)</p><p><b>★ Second light: kyrieuō — “to be lord”</b></p><p>The root of this verb is <b>κύριος, lord</b>.</p><p>“Death no longer has <b>dominion</b> over him” (6:9) is the same verb as 6:14, “sin shall not have <b>dominion</b> over you.”</p><p>Paul is building a parallel:</p><pre>death has no lordship over Christ  (6:9)\nsin has no lordship over you        (6:14)\nbecause you have been grown together with him (6:5, σύμφυτος)</pre><p><b>★ Third light: ephapax — once and for ever</b></p><p>The word occurs five times in the New Testament, four of them in Hebrews, of Christ’s offering:<br>· Hebrews 7:27, “he did this <b>once for all</b> when he offered up himself”<br>· Hebrews 9:12, “entered <b>once for all</b> into the holy place, having obtained eternal redemption”<br>· Hebrews 10:10, “the offering of the body of Jesus Christ <b>once for all</b>”</p><p>Paul says in 6:10 that Christ died to sin <b>once</b>. Which means: <b>it does not need repeating, and it cannot be overturned.</b></p><p><b>★ Fourth light: the double “to” of 6:10</b></p><pre>the death he died — “to sin” (τῇ ἁμαρτίᾳ)  — that relationship is over\nthe life he lives — “to God” (τῷ θεῷ)      — this relationship is everything</pre><p>And 6:11 is about to say: <b>the same is true of you.</b></p>","exp":"<p>This whole paragraph, 6:3–10, does one thing only: <b>it makes you know</b> (γινώσκοντες in 6:6; εἰδότες in 6:9).</p><p>Paul issues no commands here. He simply states facts, one after another:</p><pre>you were baptised into his death       (6:3)\nyou were buried with him              (6:4)\nyou have grown together with him      (6:5)\nyour old self was crucified with him  (6:6)\nthe body of sin was dismissed         (6:6)\ndeath has no dominion over him        (6:9)\nhe died to sin once for all           (6:10)</pre><p>And then — at verse 11, <b>the first command arrives</b>.</p>"},{"a":11,"z":11,"star":true,"grk":"<p>οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς [εἶναι] νεκροὺς μὲν τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ Ἰησοῦ.</p>","lit":"<p>“In the same way, you also <b>keep reckoning</b> yourselves to be dead to sin, but alive to God — <b>in Christ Jesus</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>reckon</td><td>λογίζεσθε</td><td>logizesthe</td><td>G3049</td><td>λόγος</td><td><b>to count, to calculate, to conclude</b></td><td><b>present imperative</b></td></tr><tr><td>yourselves</td><td>ἑαυτούς</td><td>heautous</td><td>G1438</td><td>—</td><td>yourselves</td><td>reflexive pronoun</td></tr><tr><td>in Christ Jesus</td><td>ἐν Χριστῷ Ἰησοῦ</td><td>—</td><td>—</td><td>—</td><td>the signature phrase of Paul’s theology</td><td>see below</td></tr></table>","gram":"<p><b>★ First light: logizomai returns from chapter 4 — but the mood has changed</b></p><p>This is the most elegant arrangement in the letter:</p><table><tr><th>Reference</th><th>Voice / mood</th><th>Who is reckoning</th></tr><tr><td>4:3</td><td>ἐλογίσθη — <b>passive, indicative</b></td><td><b>God</b> counted it to Abraham for righteousness</td></tr><tr><td>4:8</td><td>λογίσηται — active, subjunctive</td><td><b>the Lord</b> will not count his sin against him</td></tr><tr><td>4:23–24</td><td>λογίζεσθαι — passive</td><td><b>God</b> will count it to us</td></tr><tr><td><b>6:11</b></td><td>λογίζεσθε — <b>middle, imperative</b></td><td><b>you are to reckon!</b></td></tr></table><p>Do you see the order?<br>Chapter 4: <b>God reckoned first.</b><br>Chapter 6: <b>now you reckon yourself according to God’s arithmetic.</b></p><p><b>This is one of the most important spiritual sequences in the Bible: I do not make it true by reckoning. I dare to reckon because it is already true.</b></p><p><b>★ Second light: the present imperative</b></p><p>λογίζεσθε is a <b>present</b> imperative — <b>continuous, repeated action</b>.</p><p>Not “reckon once and be done.” <b>Keep on reckoning.</b><br>Every time temptation comes, reckon. Every time the old habit beckons, reckon.</p><p><b>★ Third light: this is the first command in the whole letter</b></p><p>From 1:1 to 6:10 — some 140 verses — <b>Paul has not given a single command for conduct</b>.</p><p>The first one arrives at 6:11. And what is it?</p><p>Not “try harder.” Not “give more.” Not “change.” It is — <b>“reckon this way.”</b></p><p><b>God’s first command to us concerns how you see yourself.</b></p><p>This is the biblical foundation of the sentence at the heart of the 3-2-1: <b>change the way you think, and you change the life.</b></p><p><b>★ Fourth light: “reckoning” is not autosuggestion</b></p><p>This must be stated clearly, or 6:11 gets read as positive thinking.</p><table><tr><th>Autosuggestion</th><th>Biblical reckoning</th></tr><tr><td>declaring true what is not</td><td><b>settling on what is already true</b></td></tr><tr><td>manufacturing a fact by repetition</td><td>receiving a fact on God’s declaration</td></tr><tr><td>grounded in my will</td><td>grounded in Christ’s death and resurrection (6:3–10)</td></tr></table><p>This is why Paul put 6:3–10 <b>before</b> 6:11. You must first <b>know</b>, and only then can you <b>reckon</b>. Without the facts of the preceding eight verses, verse 11 would be nothing but a slogan.</p><p><b>★ Fifth light: en Christō Iēsou (in Christ Jesus)</b></p><p>This is Paul’s signature phrase (it appears more than 160 times in the New Testament). Note where it sits in this verse:</p><pre>to sin  —  dead\nto God  —  alive        [IN CHRIST JESUS]</pre><p><b>“In Christ” is not a flourish. It is a location.</b><br>I am alive to God not because I have improved, but because <b>I am in him</b>.</p>","exp":"<p>6:11 is the hinge of the chapter, and the hinge of the whole Christian life.</p><p>Its position matters:</p><pre>6:3–10   [KNOW]     —  facts (no commands)\n6:11     [RECKON]   —  the mind (the first command)\n6:12–13  [PRESENT]  —  action (a series of commands)</pre><p><b>Paul does not begin with action. Because what begins with action is legalism. What begins with the mind is the gospel.</b></p><p>And this verse explains something else: why do so many Christians work so hard and go round in circles?</p><p><b>Because they skipped verse 11.</b> They know the doctrine (vv. 3–10) and they try hard at the actions (vv. 12–13), but the reckoning in between has never happened.</p><p>The result: <b>knowledge in the head, action on willpower, and no bridge between them.</b></p>"},{"a":12,"z":12,"star":false,"grk":"<p>Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,</p>","lit":"<p>“Therefore <b>do not let</b> sin go on <b>reigning</b> in your <b>mortal</b> body, so that you <b>obey</b> its desires.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>reign</td><td>βασιλευέτω</td><td>basileuetō</td><td>G936</td><td><b>present imperative: stop letting it reign</b> (the word of chapter 5!)</td></tr><tr><td>mortal</td><td>θνητός</td><td>thnētos</td><td>G2349</td><td><b>subject to death, perishable</b> (not “evil”)</td></tr><tr><td>obey</td><td>ὑπακούειν</td><td>hypakouein</td><td>G5219</td><td><b>to listen from underneath</b> (same root as ὑπακοή in 5:19)</td></tr><tr><td>desires</td><td>ἐπιθυμία</td><td>epithymia</td><td>G1939</td><td>ἐπί + θυμός: <b>strong craving</b> (neutral in itself; it depends on the object)</td></tr></table>","gram":"<p><b>★ First light: basileuō — the word of chapter 5, in a new role</b></p><p>We traced this verb five times through chapter 5:</p><pre>5:14  death REIGNED\n5:17  death REIGNED through the one man\n5:17  we shall REIGN in life\n5:21  sin REIGNED in death\n5:21  grace might REIGN\n  ↓\n6:12  [COMMAND] do not let sin REIGN</pre><p>Chapter 5: sin reigning is <b>a regime already overthrown</b>.<br>Chapter 6: therefore — <b>stop letting an overthrown regime issue orders</b>.</p><p>This is the practical side of 6:6, where the body of sin was <b>relieved of office</b> (καταργέω).</p><p><b>A dismissed official still governs you if you keep obeying him.</b> Not because he holds authority, but because you are still complying.</p><p><b>★ Second light: the force of the present imperative</b></p><p>μὴ βασιλευέτω is a <b>present</b> imperative in the negative. In Greek that usually means <b>stop an action already in progress</b>.</p><p>Paul is not saying “in future, don’t let it reign.” He is saying: <b>“wherever it is still reigning right now — stop.”</b></p><p><b>★ Third light: thnētos is not a term of contempt</b></p><p>Paul says “your <b>mortal</b> body,” not “your evil body.”</p><p>θνētos means only: this body will decay, age, and die.</p><p><b>Paul never treats the body itself as the source of sin — that is Greek philosophy, not Scripture.</b></p><p>The proof: 8:11, “he will also give life to your <b>mortal bodies</b> through his Spirit.” <b>The same word!</b> That mortal body is going to be raised.</p><p><b>★ Fourth light: hypakouein — “listening” again</b></p><p>“Obey its desires” — ὑπακούω, <b>to listen from underneath</b>. This is the word of 5:19 (ὑπακοή).</p><p>Paul keeps asking the same question: <b>whose voice are you under?</b><br>Chapter 5: Adam listened wrong; Christ listened from underneath.<br>Chapter 6: so now — whose voice are you under? Your cravings, or God?</p>","exp":"<p>The picture in this verse is <b>political</b>.</p><p>Sin’s regime has been overthrown (6:6).<br>But it is still operating in your territory, still issuing orders.</p><p>And its only remaining source of power is — <b>that you are still listening</b>.</p>"},{"a":13,"z":13,"star":true,"grk":"<p>μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.</p>","lit":"<p>“And <b>stop presenting</b> your <b>members</b> to sin as <b>weapons</b> of unrighteousness; but <b>present yourselves</b> to God — as those alive from the dead — and your members to God as <b>weapons</b> of righteousness.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>present</td><td>παριστάνετε / παραστήσατε</td><td>paristanete / parastēsate</td><td>G3936</td><td>παρά + ἵστημι</td><td><b>to place beside, to hand over, to offer</b></td><td>see below</td></tr><tr><td>members</td><td>μέλη</td><td>melē</td><td>G3196</td><td>—</td><td>parts of the body</td><td>hands, eyes, tongue, feet…</td></tr><tr><td>instruments</td><td>ὅπλα</td><td>hopla</td><td>G3696</td><td>—</td><td><b>weapons, armour</b></td><td>see below</td></tr></table>","gram":"<p><b>★ First light: two commands, two tenses</b></p><p>This is the most finely engineered grammar in the chapter:</p><pre>μηδὲ παριστάνετε  —  [PRESENT imperative, negative]\n                     “stop presenting” — break off an ongoing habit\n\nἀλλὰ παραστήσατε  —  [AORIST imperative, positive]\n                     “present!” — one decisive act</pre><p>These two tenses map out the two sides of the Christian life:</p><p>One side is <b>a daily stopping</b>: that habit, that website, that train of thought — <b>stop</b> (present tense).<br>One side is <b>a single handing over</b>: Lord, I give myself to you — <b>now, once</b> (aorist).</p><p><b>Neither can be dropped.</b><br>Only “stop daily,” and it becomes an endless grind with no finish line.<br>Only “surrender once,” and it becomes a promise that was never cashed.</p><p><b>★ Second light: hopla means “weapons,” not “tools”</b></p><p>English “instruments” sounds neutral, as if from a toolbox. But in the first century ὅπλον primarily meant <b>weapons, armour</b>. The same word is used in:<br>· John 18:3, Judas came with lanterns, torches and <b>weapons</b><br>· 2 Corinthians 10:4, “the <b>weapons</b> of our warfare are not of the flesh”<br>· Romans 13:12, “put on the <b>armour</b> of light”</p><p>Paul’s picture: your hands, your eyes, your tongue, your time, your wallet — <b>these are not neutral tools. They are weapons.</b></p><p>And a weapon is always in somebody’s hands.</p><p><b>Which means there is no neutral ground.</b> If you have not handed your tongue over to God today, that does not mean your tongue is on holiday. <b>It is in the other side’s armoury.</b></p><p><b>★ Third light: the sacrificial background of paristēmi</b></p><p>In the Septuagint this verb is used of <b>leading an animal up to the altar and presenting it</b>.</p><p>Paul uses the same word in 12:1: “<b>present</b> your bodies a living sacrifice.”</p><p><b>Romans 6:13 is the first appearance of Romans 12:1.</b> The seed Paul plants in chapter 6 flowers in chapter 12.</p><p><b>★ Fourth light: hōsei ek nekrōn zōntas (as those alive from the dead)</b></p><p>This clause is the <b>reason</b> for the whole verse.</p><p>On what basis can you hand yourself over? <b>Because you are someone who has come back from the dead.</b></p><p>A person who has died and been raised holds the things of this world with a very different grip.</p>","exp":"<p>6:13 brings abstract theology down onto specific body parts.</p><p>“Members” (μέλη) is a very concrete word:</p><p>· what did my <b>eyes</b> look at today?<br>· what did my <b>tongue</b> say today?<br>· what did my <b>hands</b> do today?<br>· where did my <b>feet</b> go today?<br>· who did my <b>time</b> go to today?</p><p><b>Sanctification is not an abstract state. Sanctification is a concrete negotiation over the ownership of body parts.</b></p>"},{"a":14,"z":14,"star":false,"grk":"<p>ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει· οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.</p>","lit":"<p>“For sin <b>shall not have dominion over you</b>; for you are not <b>under law</b>, but <b>under grace</b>.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>shall have dominion</td><td>κυριεύσει</td><td>kyrieusei</td><td>G2961</td><td><b>future: shall not be lord</b> (the word of 6:9)</td></tr><tr><td>under</td><td>ὑπό + accusative</td><td>hypo</td><td>G5259</td><td><b>under the authority or rule of</b></td></tr></table>","gram":"<p><b>★ First light: the future tense is a promise, not a command</b></p><p>“Sin shall not have dominion over you” is a <b>future indicative</b>, not an imperative.</p><p>Paul does not say, “try hard, so that sin does not master you.”<br>Paul says, <b>“sin shall not have dominion over you.”</b></p><p>This is <b>a promise, a declaration</b>.</p><p>Notice: 6:12–13 are commands; <b>6:14 is a promise</b>. And the force of the commands comes from the promise.</p><p>Not “you try, therefore sin cannot rule”; but <b>“sin cannot rule, therefore you are able to try.”</b></p><p><b>★ Second light: what does “not under law but under grace” mean?</b></p><p>This sentence is very easily misunderstood (see the disputed material), so look at <b>the use Paul is making of it here</b>.</p><p>He is giving <b>a reason</b> for the first half of 6:14:</p><pre>sin shall not have dominion over you\n  ↑ why?\nbecause you are not under law, but under grace</pre><p>Paul is saying: <b>the law cannot make you overcome sin.</b> The law can tell you where the line is, but it cannot give you the power to stay on the right side of it (that is what the whole of chapter 7 is about).</p><p>What overcomes sin is <b>the reign of grace</b>.</p><p>This echoes 5:21: “so grace might <b>reign</b> through righteousness.”</p><p><b>The question was never “are there rules?” The question is always “who is king?”</b></p>","exp":"<p>6:14 is the hinge of the chapter, and the door into chapters 7 and 8.</p><p>Paul is saying: if you still want to deal with sin the way people do <b>“under law”</b> — <b>then you will experience chapter 7</b>.</p><p>If you live <b>“under grace”</b> — <b>then you will experience chapter 8</b>.</p>"},{"a":15,"z":16,"star":false,"grk":"<p>16 οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;</p>","lit":"<p>15 “What then? Shall we <b>sin</b> because we are not under law but under grace? By no means!”</p><p>16 “<b>Do you not know</b> that to whomever you present yourselves as slaves to obey, you are slaves of the one you obey — whether of sin, leading to death, or of obedience, leading to righteousness?”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Meaning</th></tr><tr><td>shall we sin</td><td>ἁμαρτήσωμεν</td><td>hamartēsōmen</td><td>G264</td><td><b>aorist subjunctive: to sin once, occasionally</b></td></tr><tr><td>slaves</td><td>δοῦλος</td><td>doulos</td><td>G1401</td><td><b>a slave belonging wholly to another</b> (not a hired worker)</td></tr><tr><td>obey</td><td>ὑπακοή / ὑπακούετε</td><td>—</td><td>G5218 / G5219</td><td><b>to listen from underneath</b> (the root of 5:19)</td></tr></table>","gram":"<p><b>★ First light: the question of 6:15 is different from 6:1</b></p><table><tr><th>6:1</th><th>6:15</th></tr><tr><td>ἐπιμένωμεν (<b>go on living</b> in sin)</td><td>ἁμαρτήσωμεν (<b>sin once</b>)</td></tr><tr><td><b>present</b> tense: a way of life</td><td><b>aorist</b>: an isolated act</td></tr><tr><td>answer: you have died (6:2)</td><td>answer: you have changed masters (6:16–18)</td></tr></table><p>This distinction matters enormously, because it mirrors the real human heart.</p><p>The first question is: “may I live in sin permanently?” — most people would not dare ask that.<br>The second is: “but surely just this once?” — <b>everyone has asked that one</b>.</p><p>And Paul’s answer is the same: <b>by no means</b>.</p><p><b>★ Second light: the absoluteness of doulos</b></p><p>In Roman society a δοῦλος was not an employee. A slave:<br>· had no time of his own<br>· had no property of his own<br>· <b>could not belong to two masters</b></p><p>Which is exactly what Jesus said: <b>“No one can serve two masters.” (Matthew 6:24)</b></p><p><b>★ Third light: hō hypakouete — “the one you obey”</b></p><p>Paul gives a very practical test. <b>How do you know whose slave you are?</b><br><b>Look at whom you listen to.</b></p><p>Not what you call yourself, not your religious identity, but — <b>when that voice speaks, which way does your body go?</b></p>","exp":"<p>6:16 dismantles a very common illusion: <b>“I can belong to no one. I am free.”</b></p><p>Paul says: there is no such thing. People do not choose between <b>having a master</b> and <b>having none</b>. People choose <b>which master</b>.</p><p>And there is a further layer: Paul says you <b>present</b> yourselves as slaves — <b>an active verb</b>.</p><p><b>Nobody was kidnapped. We handed ourselves over. And every act of obedience hands us over again.</b></p>"},{"a":17,"z":18,"star":true,"grk":"<p>17 χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς, 18 ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ.</p>","lit":"<p>17 “<b>But thanks be to God</b> that, though you were slaves of sin, you <b>obeyed from the heart</b> that <b>pattern</b> of teaching <b>into which you were handed over</b>.”</p><p>18 “And having been <b>set free</b> from sin, you were <b>made slaves</b> to righteousness.”</p>","key":"<table><tr><th>English</th><th>Greek</th><th>Translit.</th><th>Strong's</th><th>Root</th><th>Basic sense</th><th>In this verse</th></tr><tr><td>from the heart</td><td>ἐκ καρδίας</td><td>ek kardias</td><td>G2588</td><td>—</td><td><b>out of the heart</b></td><td>not outward compliance</td></tr><tr><td>were handed over</td><td>παρεδόθητε</td><td>paredothēte</td><td>G3860</td><td>παρά + δίδωμι</td><td><b>you were delivered over</b></td><td><b>note the word order — see below</b></td></tr><tr><td>pattern</td><td>τύπος</td><td>typos</td><td>G5179</td><td>τύπτω (to strike)</td><td><b>a mould, an impression</b></td><td>the same word as 5:14</td></tr><tr><td>set free</td><td>ἐλευθερωθέντες</td><td>eleutherōthentes</td><td>G1659</td><td>ἐλεύθερος (free)</td><td><b>having been set free</b> (manumission language)</td><td>passive</td></tr><tr><td>made slaves</td><td>ἐδουλώθητε</td><td>edoulōthēte</td><td>G1402</td><td>δοῦλος</td><td><b>you were enslaved</b></td><td>passive</td></tr></table>","gram":"<p><b>★ First light: the word order of 6:17 is astonishing</b></p><p>English usually renders it “you obeyed the form of teaching <b>which was delivered to you</b>” — as though the teaching were handed to us.</p><p>But the Greek word order is:</p><p><b>εἰς ὃν παρεδόθητε τύπον διδαχῆς</b><br>“(you obeyed) that mould of teaching <b>into which you yourselves were handed over</b>.”</p><p><b>The subject and the object have been swapped.</b></p><table><tr><th>What we usually assume</th><th>What Paul says</th></tr><tr><td><b>the teaching</b> was handed to <b>me</b></td><td><b>I</b> was handed over to <b>the teaching</b></td></tr><tr><td>I take hold of the truth</td><td>the truth takes hold of me</td></tr><tr><td>I hold my Bible in my hands</td><td>I have been placed into the mould of Scripture</td></tr></table><p>This is the humblest — and the most searching — sentence in the chapter.</p><p>We say “I have learned a lot of truth,” as though truth were something I collect.<br>Paul says: no. <b>You were handed over into it.</b></p><p><b>★ Second light: typos —
